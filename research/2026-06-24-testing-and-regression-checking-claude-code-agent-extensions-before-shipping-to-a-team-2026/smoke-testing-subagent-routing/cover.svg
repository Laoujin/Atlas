<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="node" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- routing edges from parent hub to subagents -->
  <g fill="none" stroke="#9a3309" stroke-opacity="0.35" stroke-width="6">
    <path d="M800 450 L545 270"/>
    <path d="M800 450 L520 595"/>
    <path d="M800 450 L1085 615"/>
  </g>

  <!-- verified route: parent dispatches on the right prompt -->
  <path d="M800 450 L1055 265" fill="none" stroke="#d97706" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
  <path d="M800 450 L1055 265" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.95"/>

  <!-- idle subagent nodes -->
  <g opacity="0.7">
    <circle cx="545" cy="270" r="44" fill="url(#node)"/>
    <circle cx="520" cy="595" r="44" fill="url(#node)"/>
    <circle cx="1085" cy="615" r="44" fill="url(#node)"/>
  </g>

  <!-- verified subagent: highlighted -->
  <circle cx="1055" cy="265" r="62" fill="#fef3ec" stroke="#d97706" stroke-width="3" opacity="0.6"/>
  <circle cx="1055" cy="265" r="50" fill="url(#node)"/>
  <circle cx="1055" cy="265" r="20" fill="#fbbf24" opacity="0.9"/>

  <!-- parent hub hero -->
  <circle cx="800" cy="450" r="92" fill="#78350f" opacity="0.25"/>
  <circle cx="800" cy="450" r="78" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="34" fill="#fef3ec" opacity="0.85"/>
  <circle cx="800" cy="450" r="14" fill="#c2410c"/>
</svg>
