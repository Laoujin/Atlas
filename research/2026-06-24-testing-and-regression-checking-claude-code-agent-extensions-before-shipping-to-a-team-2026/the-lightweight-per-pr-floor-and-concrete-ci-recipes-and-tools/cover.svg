<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- deterministic floor: three stacked lint layers -->
  <g opacity="0.92">
    <rect x="380" y="540" width="420" height="92" rx="14" fill="#78350f" opacity="0.78"/>
    <rect x="360" y="446" width="420" height="92" rx="14" fill="#c2410c" opacity="0.85"/>
    <rect x="340" y="352" width="420" height="92" rx="14" fill="url(#deck)"/>
    <!-- faint config lines -->
    <rect x="372" y="378" width="220" height="12" rx="6" fill="#faf8f2" opacity="0.55"/>
    <rect x="372" y="406" width="150" height="12" rx="6" fill="#faf8f2" opacity="0.4"/>
  </g>

  <!-- spark bridge: deterministic floor -> single model check -->
  <circle cx="855" cy="450" r="70" fill="url(#spark)"/>
  <path d="M770 442 C 830 420, 880 480, 940 458" fill="none" stroke="#c2410c" stroke-width="9" stroke-linecap="round" opacity="0.85"/>

  <!-- single cheap headless model check: rust hero node -->
  <circle cx="1010" cy="450" r="118" fill="url(#rust)"/>
  <circle cx="1010" cy="450" r="118" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.7"/>
  <circle cx="1010" cy="450" r="62" fill="none" stroke="#fef3ec" stroke-width="10" opacity="0.85"/>
  <path d="M978 452 l22 24 l44 -52" fill="none" stroke="#fef3ec" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
