<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="node" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- protective test barrier: concentric rings with a gate gap on the right -->
  <circle cx="800" cy="450" r="288" fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.32"
          stroke-dasharray="730 96" transform="rotate(-26 800 450)"/>
  <circle cx="800" cy="450" r="210" fill="none" stroke="#9a3309" stroke-width="6" stroke-opacity="0.55"
          stroke-dasharray="990 130" transform="rotate(20 800 450)"/>

  <!-- edges hub -> extension nodes -->
  <g stroke="#78350f" stroke-width="5" stroke-opacity="0.5">
    <line x1="800" y1="450" x2="800" y2="240"/>
    <line x1="800" y1="450" x2="982" y2="555"/>
    <line x1="800" y1="450" x2="800" y2="660"/>
    <line x1="800" y1="450" x2="618" y2="555"/>
    <line x1="800" y1="450" x2="618" y2="345"/>
  </g>

  <!-- extension nodes (skills / subagents / hooks / mcp / plugins) -->
  <g>
    <circle cx="800" cy="240" r="34" fill="url(#node)" fill-opacity="0.92"/>
    <circle cx="982" cy="555" r="34" fill="url(#node)" fill-opacity="0.92"/>
    <circle cx="800" cy="660" r="34" fill="url(#node)" fill-opacity="0.92"/>
    <circle cx="618" cy="555" r="34" fill="url(#node)" fill-opacity="0.92"/>
    <circle cx="618" cy="345" r="34" fill="url(#node)" fill-opacity="0.92"/>
  </g>

  <!-- central hub: the gate / CI floor -->
  <circle cx="800" cy="450" r="92" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="92" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6"/>
  <!-- check-pass mark inside hub -->
  <path d="M 758 452 L 788 484 L 846 414" fill="none" stroke="#fef3ec" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>
</svg>
