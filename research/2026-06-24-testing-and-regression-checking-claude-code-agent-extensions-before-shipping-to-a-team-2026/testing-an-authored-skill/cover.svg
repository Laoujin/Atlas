<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="62%" stop-color="#f7ecdd"/>
      <stop offset="100%" stop-color="#efe4d2"/>
    </radialGradient>
    <radialGradient id="hub" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="48%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- trigger aperture: concentric acceptance rings -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.28"/>
  <circle cx="800" cy="450" r="222" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.6"/>
  <circle cx="800" cy="450" r="150" fill="#d97706" opacity="0.12"/>
  <circle cx="800" cy="450" r="150" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.85"/>

  <!-- accepted match: hero node landing on target -->
  <circle cx="800" cy="450" r="70" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="70" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5"/>

  <!-- in-bounds trigger sample, connected -->
  <line x1="800" y1="450" x2="560" y2="300" stroke="#9a3309" stroke-width="4" opacity="0.55"/>
  <circle cx="560" cy="300" r="30" fill="#c2410c" opacity="0.85"/>

  <!-- second valid sample -->
  <line x1="800" y1="450" x2="1030" y2="600" stroke="#9a3309" stroke-width="4" opacity="0.5"/>
  <circle cx="1030" cy="600" r="26" fill="#d97706" opacity="0.85"/>

  <!-- over-trigger: rejected sample outside the acceptance ring -->
  <circle cx="1095" cy="285" r="22" fill="none" stroke="#9a3309" stroke-width="4" opacity="0.45"/>
  <line x1="1078" y1="268" x2="1112" y2="302" stroke="#9a3309" stroke-width="4" opacity="0.45"/>
</svg>
