<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3a1a12"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="520" ry="360" fill="url(#glow)"/>

  <!-- left block: port, with a notch -->
  <path d="M430 300 H720 V410 H770 V490 H720 V600 H430 Z" fill="url(#teal)" opacity="0.92"/>
  <rect x="470" y="345" width="180" height="22" rx="6" fill="#0e7490" opacity="0.6"/>
  <rect x="470" y="392" width="140" height="22" rx="6" fill="#0e7490" opacity="0.6"/>
  <rect x="470" y="533" width="160" height="22" rx="6" fill="#0e7490" opacity="0.6"/>

  <!-- right block: plug, interlocking tongue fits the notch -->
  <path d="M1170 300 H880 V410 H830 V490 H880 V600 H1170 Z" fill="url(#rust)" opacity="0.92"/>
  <rect x="950" y="345" width="180" height="22" rx="6" fill="#78350f" opacity="0.6"/>
  <rect x="990" y="392" width="140" height="22" rx="6" fill="#78350f" opacity="0.6"/>
  <rect x="970" y="533" width="160" height="22" rx="6" fill="#78350f" opacity="0.6"/>

  <!-- integrity seal over the joint: hexagon + lock shackle -->
  <polygon points="800,348 862,386 862,462 800,500 738,462 738,386" fill="#fbbf24" opacity="0.95"/>
  <polygon points="800,372 842,397 842,447 800,472 758,447 758,397" fill="#3a1a12" opacity="0.85"/>
  <path d="M783 424 v-14 a17 17 0 0 1 34 0 v14" fill="none" stroke="#fbbf24" stroke-width="8" opacity="0.9"/>
  <rect x="778" y="422" width="44" height="34" rx="6" fill="#fbbf24" opacity="0.95"/>

  <!-- spark trail / verification pulse along the joint -->
  <path d="M800 240 V300 M800 500 V560" stroke="#fbbf24" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  <circle cx="800" cy="232" r="9" fill="#fbbf24" opacity="0.8"/>
  <circle cx="800" cy="568" r="7" fill="#d97706" opacity="0.8"/>
</svg>
