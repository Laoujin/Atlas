<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- flow arc: stdin in -> hook -> exit out -->
  <path d="M 360 450 C 520 300, 1080 300, 1240 450" fill="none" stroke="#78350f" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- input node (stdin JSON) -->
  <circle cx="360" cy="450" r="58" fill="#78350f" opacity="0.85"/>
  <circle cx="360" cy="450" r="26" fill="#fef3ec" opacity="0.9"/>

  <!-- output node (exit code) -->
  <circle cx="1240" cy="450" r="58" fill="#c2410c" opacity="0.9"/>
  <circle cx="1240" cy="450" r="26" fill="#fbbf24" opacity="0.9"/>

  <!-- hero: the hook script block -->
  <rect x="600" y="320" width="400" height="260" rx="28" fill="url(#hero)" opacity="0.95"/>
  <rect x="640" y="372" width="240" height="22" rx="11" fill="#fef3ec" opacity="0.55"/>
  <rect x="640" y="420" width="320" height="22" rx="11" fill="#fef3ec" opacity="0.4"/>
  <rect x="640" y="468" width="180" height="22" rx="11" fill="#fef3ec" opacity="0.55"/>

  <!-- test gate / pass diamond overlapping the hero corner -->
  <rect x="828" y="478" width="120" height="120" rx="20" transform="rotate(45 888 538)" fill="url(#gate)" opacity="0.95"/>
  <path d="M 858 538 l 22 24 l 42 -50" fill="none" stroke="#1a0e0e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
