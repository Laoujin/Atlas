<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- atmospheric glow behind hub -->
  <circle cx="800" cy="450" r="420" fill="url(#glow)"/>

  <!-- concentric radius rings, centered on hub -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="#9a3309" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="800" cy="450" r="230" fill="none" stroke="#9a3309" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="800" cy="450" r="140" fill="none" stroke="#9a3309" stroke-width="2" stroke-opacity="0.75"/>

  <!-- connection lines from hub to venue nodes -->
  <g stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round">
    <line x1="800" y1="450" x2="560" y2="330"/>
    <line x1="800" y1="450" x2="1040" y2="370"/>
    <line x1="800" y1="450" x2="1100" y2="610"/>
    <line x1="800" y1="450" x2="620" y2="600"/>
    <line x1="800" y1="450" x2="940" y2="240"/>
  </g>

  <!-- venue nodes (pins) along/near the rings -->
  <g>
    <circle cx="560" cy="330" r="18" fill="url(#node)" opacity="0.92"/>
    <circle cx="560" cy="330" r="6" fill="#fbbf24"/>

    <circle cx="1040" cy="370" r="22" fill="url(#node)" opacity="0.92"/>
    <circle cx="1040" cy="370" r="7" fill="#fbbf24"/>

    <circle cx="1100" cy="610" r="16" fill="url(#node)" opacity="0.9"/>
    <circle cx="1100" cy="610" r="5" fill="#fbbf24"/>

    <circle cx="620" cy="600" r="20" fill="url(#node)" opacity="0.92"/>
    <circle cx="620" cy="600" r="6" fill="#fbbf24"/>

    <circle cx="940" cy="240" r="14" fill="url(#node)" opacity="0.88"/>
    <circle cx="940" cy="240" r="4" fill="#fbbf24"/>
  </g>

  <!-- central hero hub: Slagmolen / Opglabbeek -->
  <circle cx="800" cy="450" r="62" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="62" fill="none" stroke="#fef3ec" stroke-width="3" stroke-opacity="0.85"/>
  <circle cx="800" cy="450" r="18" fill="#fef3ec" opacity="0.9"/>

  <!-- subtle corner decorations (outside safe zone, may be cropped) -->
  <circle cx="100" cy="100" r="50" fill="#d97706" opacity="0.12"/>
  <circle cx="1500" cy="820" r="70" fill="#9a3309" opacity="0.1"/>
</svg>
