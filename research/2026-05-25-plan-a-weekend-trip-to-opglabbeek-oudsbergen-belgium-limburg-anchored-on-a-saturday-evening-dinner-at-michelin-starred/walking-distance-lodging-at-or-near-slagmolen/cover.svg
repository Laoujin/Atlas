<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="mill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1208"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm radial glow behind mill (sunset/lamp ambience) -->
  <ellipse cx="820" cy="500" rx="720" ry="380" fill="url(#glow)"/>

  <!-- Distant tree silhouettes (decorative, full-bleed) -->
  <path d="M0 620 Q120 540 240 590 Q360 530 480 580 Q600 520 720 575 Q840 525 960 580 Q1080 530 1200 585 Q1320 535 1440 580 Q1520 555 1600 590 L1600 720 L0 720 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Water (Bosbeek stream) -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#water)"/>

  <!-- Water ripples -->
  <path d="M120 760 Q300 752 480 760 T840 760 T1200 760 T1560 760" stroke="#d97706" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M80 800 Q280 792 480 800 T880 800 T1280 800 T1600 800" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M200 835 Q400 828 600 835 T1000 835 T1400 835" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Small adjacent villa (right of mill, smaller) -->
  <g opacity="0.92">
    <rect x="1100" y="540" width="220" height="160" fill="url(#mill)"/>
    <polygon points="1090,540 1330,540 1210,460" fill="url(#roof)"/>
    <!-- Lit windows -->
    <rect x="1140" y="580" width="32" height="42" fill="#fbbf24" opacity="0.85"/>
    <rect x="1200" y="580" width="32" height="42" fill="#fbbf24" opacity="0.85"/>
    <rect x="1260" y="580" width="32" height="42" fill="#fbbf24" opacity="0.85"/>
    <rect x="1170" y="640" width="36" height="60" fill="#d97706" opacity="0.75"/>
  </g>

  <!-- HERO: watermill building (centered in safe zone) -->
  <g>
    <!-- Main mill body -->
    <rect x="500" y="380" width="420" height="340" fill="url(#mill)"/>
    <!-- Timber-framed gable (X-cross beams as decoration on the gable) -->
    <polygon points="490,380 930,380 710,220" fill="url(#roof)"/>
    <!-- Gable timber framing -->
    <line x1="710" y1="220" x2="710" y2="380" stroke="#c2410c" stroke-width="4" opacity="0.7"/>
    <line x1="560" y1="380" x2="710" y2="280" stroke="#c2410c" stroke-width="3" opacity="0.6"/>
    <line x1="860" y1="380" x2="710" y2="280" stroke="#c2410c" stroke-width="3" opacity="0.6"/>

    <!-- Lit mill windows -->
    <rect x="540" y="430" width="50" height="64" fill="#fbbf24" opacity="0.9"/>
    <rect x="620" y="430" width="50" height="64" fill="#fbbf24" opacity="0.9"/>
    <rect x="760" y="430" width="50" height="64" fill="#fbbf24" opacity="0.9"/>
    <rect x="840" y="430" width="50" height="64" fill="#fbbf24" opacity="0.9"/>
    <!-- Window mullions -->
    <line x1="565" y1="430" x2="565" y2="494" stroke="#1a0e0e" stroke-width="2"/>
    <line x1="645" y1="430" x2="645" y2="494" stroke="#1a0e0e" stroke-width="2"/>
    <line x1="785" y1="430" x2="785" y2="494" stroke="#1a0e0e" stroke-width="2"/>
    <line x1="865" y1="430" x2="865" y2="494" stroke="#1a0e0e" stroke-width="2"/>

    <!-- Door (warm spill) -->
    <rect x="685" y="600" width="60" height="120" fill="#fbbf24" opacity="0.85"/>
    <rect x="690" y="610" width="50" height="105" fill="#d97706" opacity="0.75"/>

    <!-- Water wheel (left side, hero accent) -->
    <g transform="translate(420 600)">
      <circle r="120" fill="#1a0e0e" stroke="#c2410c" stroke-width="6" opacity="0.95"/>
      <circle r="20" fill="#5c2a1a" stroke="#c2410c" stroke-width="3"/>
      <!-- Spokes -->
      <line x1="-115" y1="0" x2="115" y2="0" stroke="#c2410c" stroke-width="4"/>
      <line x1="0" y1="-115" x2="0" y2="115" stroke="#c2410c" stroke-width="4"/>
      <line x1="-81" y1="-81" x2="81" y2="81" stroke="#c2410c" stroke-width="4"/>
      <line x1="-81" y1="81" x2="81" y2="-81" stroke="#c2410c" stroke-width="4"/>
      <!-- Paddles around rim -->
      <rect x="-122" y="-10" width="18" height="20" fill="#9a3309"/>
      <rect x="104" y="-10" width="18" height="20" fill="#9a3309"/>
      <rect x="-10" y="-122" width="20" height="18" fill="#9a3309"/>
      <rect x="-10" y="104" width="20" height="18" fill="#9a3309"/>
      <rect x="-95" y="-95" width="20" height="18" fill="#9a3309" transform="rotate(45)"/>
      <rect x="-95" y="-95" width="20" height="18" fill="#9a3309" transform="rotate(-45)"/>
      <rect x="75" y="-95" width="20" height="18" fill="#9a3309" transform="rotate(45)"/>
      <rect x="75" y="-95" width="20" height="18" fill="#9a3309" transform="rotate(-45)"/>
    </g>

    <!-- Wheel reflection / splash on water -->
    <ellipse cx="420" cy="730" rx="130" ry="8" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- Foreground reeds / grass (corner decoration) -->
  <path d="M40 820 L50 760 L60 820 M80 815 L90 770 L100 815" stroke="#5c2a1a" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M1500 820 L1510 765 L1520 820 M1540 815 L1550 770 L1560 815" stroke="#5c2a1a" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
