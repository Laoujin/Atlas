<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm glow behind the wheel -->
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- distant tree line silhouette (full-bleed decoration) -->
  <path d="M0,720 Q120,680 220,705 T440,700 T660,710 T880,695 T1100,705 T1320,690 T1600,710 L1600,900 L0,900 Z"
        fill="#1a0e0e" opacity="0.55"/>

  <!-- water sluice / millrace under the wheel -->
  <rect x="200" y="680" width="1200" height="90" fill="#1a0e0e" opacity="0.7"/>
  <rect x="200" y="680" width="1200" height="90" fill="url(#water)"/>

  <!-- mill house side wall (anchor) -->
  <rect x="1050" y="300" width="320" height="400" fill="#1a0e0e" opacity="0.85"/>
  <polygon points="1050,300 1210,200 1370,300" fill="#1a0e0e" opacity="0.9"/>
  <!-- candlelit window -->
  <rect x="1140" y="430" width="80" height="110" fill="#fbbf24" opacity="0.9"/>
  <rect x="1175" y="430" width="10" height="110" fill="#1a0e0e" opacity="0.6"/>
  <rect x="1140" y="480" width="80" height="6" fill="#1a0e0e" opacity="0.6"/>

  <!-- waterwheel: hero, centered ~800,450 -->
  <g transform="translate(700,460)">
    <!-- outer rim -->
    <circle r="240" fill="none" stroke="url(#wheel)" stroke-width="28"/>
    <!-- inner rim -->
    <circle r="195" fill="none" stroke="#78350f" stroke-width="10" opacity="0.85"/>
    <!-- hub -->
    <circle r="32" fill="#78350f"/>
    <circle r="14" fill="#d97706"/>
    <!-- 8 spokes -->
    <g stroke="#78350f" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-235" x2="0" y2="235"/>
      <line x1="-235" y1="0" x2="235" y2="0"/>
      <line x1="-166" y1="-166" x2="166" y2="166"/>
      <line x1="-166" y1="166" x2="166" y2="-166"/>
    </g>
    <!-- 12 paddle blades between rims -->
    <g fill="#9a3309" opacity="0.9">
      <rect x="-22" y="-238" width="44" height="50" rx="2"/>
      <rect x="-22" y="188" width="44" height="50" rx="2"/>
      <rect x="-238" y="-22" width="50" height="44" rx="2"/>
      <rect x="188" y="-22" width="50" height="44" rx="2"/>
      <g transform="rotate(30)"><rect x="-22" y="-238" width="44" height="50" rx="2"/><rect x="-22" y="188" width="44" height="50" rx="2"/></g>
      <g transform="rotate(60)"><rect x="-22" y="-238" width="44" height="50" rx="2"/><rect x="-22" y="188" width="44" height="50" rx="2"/></g>
      <g transform="rotate(15)"><rect x="-22" y="-238" width="44" height="50" rx="2"/><rect x="-22" y="188" width="44" height="50" rx="2"/></g>
      <g transform="rotate(45)"><rect x="-22" y="-238" width="44" height="50" rx="2"/><rect x="-22" y="188" width="44" height="50" rx="2"/></g>
    </g>
    <!-- water droplets falling off the wheel -->
    <g fill="#fbbf24" opacity="0.7">
      <circle cx="-220" cy="230" r="5"/>
      <circle cx="-180" cy="255" r="3"/>
      <circle cx="220" cy="230" r="4"/>
      <circle cx="180" cy="255" r="3"/>
      <circle cx="0" cy="260" r="5"/>
    </g>
  </g>

  <!-- a few stars / sparks above (subtle, outside hero) -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="220" cy="140" r="2"/>
    <circle cx="380" cy="100" r="1.5"/>
    <circle cx="540" cy="160" r="2"/>
    <circle cx="1280" cy="120" r="1.5"/>
    <circle cx="1420" cy="180" r="2"/>
  </g>
</svg>
