<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun glow, decorative, upper-left -->
  <circle cx="380" cy="260" r="220" fill="url(#sun)"/>

  <!-- far Picos peaks -->
  <path d="M 0 470 L 180 340 L 320 410 L 460 290 L 620 380 L 780 310 L 940 390 L 1120 320 L 1280 400 L 1440 350 L 1600 420 L 1600 600 L 0 600 Z" fill="url(#farPeak)" opacity="0.7"/>

  <!-- mid rolling hills -->
  <path d="M 0 580 Q 280 480 560 540 T 1120 530 T 1600 560 L 1600 720 L 0 720 Z" fill="url(#midHill)" opacity="0.85"/>

  <!-- near hill foreground -->
  <path d="M 0 720 Q 400 640 800 690 T 1600 700 L 1600 900 L 0 900 Z" fill="url(#nearHill)"/>

  <!-- winding lane: from foreground center toward the house -->
  <path d="M 760 900 Q 780 800 820 720 Q 860 660 900 600 Q 920 570 880 555" stroke="url(#lane)" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 760 900 Q 780 800 820 720 Q 860 660 900 600 Q 920 570 880 555" stroke="#fef3ec" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- HERO: stone country house, centered around (860, 500) -->
  <!-- house body -->
  <rect x="780" y="500" width="220" height="150" fill="url(#wall)" stroke="#78350f" stroke-width="2.5"/>
  <!-- roof -->
  <path d="M 760 500 L 890 410 L 1020 500 Z" fill="url(#roof)" stroke="#1a0e0e" stroke-width="2" stroke-opacity="0.4"/>
  <!-- chimney -->
  <rect x="950" y="430" width="22" height="50" fill="#78350f"/>
  <!-- door -->
  <rect x="868" y="585" width="44" height="65" fill="#5c2a1a"/>
  <!-- windows -->
  <rect x="805" y="540" width="38" height="38" fill="#5c2a1a" opacity="0.85"/>
  <rect x="937" y="540" width="38" height="38" fill="#5c2a1a" opacity="0.85"/>
  <!-- window crossbars -->
  <line x1="824" y1="540" x2="824" y2="578" stroke="#f0eadb" stroke-width="1.5" opacity="0.7"/>
  <line x1="805" y1="559" x2="843" y2="559" stroke="#f0eadb" stroke-width="1.5" opacity="0.7"/>
  <line x1="956" y1="540" x2="956" y2="578" stroke="#f0eadb" stroke-width="1.5" opacity="0.7"/>
  <line x1="937" y1="559" x2="975" y2="559" stroke="#f0eadb" stroke-width="1.5" opacity="0.7"/>
  <!-- stone texture hints -->
  <line x1="780" y1="535" x2="1000" y2="535" stroke="#78350f" stroke-width="1" opacity="0.25"/>
  <line x1="780" y1="585" x2="1000" y2="585" stroke="#78350f" stroke-width="1" opacity="0.25"/>
  <line x1="780" y1="620" x2="1000" y2="620" stroke="#78350f" stroke-width="1" opacity="0.25"/>

  <!-- a couple of trees flanking the lane, anchoring scale -->
  <ellipse cx="700" cy="660" rx="38" ry="50" fill="#78350f" opacity="0.75"/>
  <rect x="696" y="660" width="8" height="40" fill="#5c2a1a" opacity="0.8"/>
  <ellipse cx="1080" cy="630" rx="32" ry="44" fill="#78350f" opacity="0.7"/>
  <rect x="1077" y="630" width="7" height="36" fill="#5c2a1a" opacity="0.8"/>
</svg>
