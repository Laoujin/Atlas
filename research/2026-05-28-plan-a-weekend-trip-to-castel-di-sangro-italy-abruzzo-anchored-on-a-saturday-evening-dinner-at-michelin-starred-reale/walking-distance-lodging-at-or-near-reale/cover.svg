<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="monastery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed warm dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow behind the hill -->
  <circle cx="1080" cy="500" r="320" fill="url(#sun)"/>

  <!-- far Apennine peaks (background, can crop) -->
  <path d="M0,560 L180,420 L300,500 L460,360 L620,470 L780,380 L940,470 L1120,360 L1280,470 L1440,400 L1600,490 L1600,900 L0,900 Z"
        fill="url(#farPeak)"/>

  <!-- mid peaks -->
  <path d="M0,640 L160,520 L320,600 L500,470 L680,580 L860,490 L1040,590 L1220,500 L1400,600 L1600,540 L1600,900 L0,900 Z"
        fill="url(#midPeak)" opacity="0.85"/>

  <!-- hero: hilltop village silhouette, centered near (800, 450), inside safe zone -->
  <!-- hill mound -->
  <path d="M380,720 Q560,540 800,500 Q1040,540 1220,720 Z" fill="url(#hill)" opacity="0.95"/>

  <!-- monastery / village cluster on the hill -->
  <g fill="url(#monastery)">
    <!-- main monastery block -->
    <rect x="720" y="380" width="180" height="130"/>
    <!-- bell tower -->
    <rect x="760" y="300" width="38" height="90"/>
    <polygon points="760,300 779,272 798,300"/>
    <!-- side wing left -->
    <rect x="640" y="420" width="90" height="90"/>
    <!-- side wing right -->
    <rect x="890" y="410" width="110" height="100"/>
    <!-- small house cluster right -->
    <rect x="1000" y="445" width="60" height="65"/>
    <polygon points="1000,445 1030,418 1060,445"/>
    <!-- small house left -->
    <rect x="600" y="450" width="48" height="60"/>
    <polygon points="600,450 624,428 648,450"/>
  </g>

  <!-- warm window glints (dinner lights) -->
  <g fill="#fbbf24" opacity="0.9">
    <rect x="740" y="420" width="6" height="10"/>
    <rect x="760" y="420" width="6" height="10"/>
    <rect x="780" y="420" width="6" height="10"/>
    <rect x="800" y="420" width="6" height="10"/>
    <rect x="820" y="420" width="6" height="10"/>
    <rect x="840" y="420" width="6" height="10"/>
    <rect x="860" y="420" width="6" height="10"/>
    <rect x="740" y="450" width="6" height="10"/>
    <rect x="760" y="450" width="6" height="10"/>
    <rect x="800" y="450" width="6" height="10"/>
    <rect x="840" y="450" width="6" height="10"/>
    <rect x="860" y="450" width="6" height="10"/>
    <rect x="910" y="445" width="6" height="10"/>
    <rect x="930" y="445" width="6" height="10"/>
    <rect x="950" y="445" width="6" height="10"/>
    <rect x="970" y="445" width="6" height="10"/>
    <rect x="660" y="450" width="6" height="10"/>
    <rect x="680" y="450" width="6" height="10"/>
    <rect x="700" y="450" width="6" height="10"/>
  </g>

  <!-- winding path leading toward the village (suggests walking) -->
  <path d="M420,820 Q540,760 640,720 Q740,690 800,640 Q840,605 830,560"
        fill="none" stroke="#fef3ec" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M420,820 Q540,760 640,720 Q740,690 800,640 Q840,605 830,560"
        fill="none" stroke="#fef3ec" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="2 14" opacity="0.85"/>

  <!-- foreground hill silhouette (decoration, edges may crop) -->
  <path d="M0,900 L0,780 Q200,720 420,780 Q600,830 800,800 Q1000,770 1200,810 Q1400,840 1600,790 L1600,900 Z"
        fill="#1a0e0e" opacity="0.85"/>
</svg>
