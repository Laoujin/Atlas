<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridge3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun glow behind ridges -->
  <circle cx="1150" cy="300" r="280" fill="url(#sun)"/>

  <!-- Far ridge -->
  <path d="M 0 540 L 180 430 L 340 490 L 520 380 L 720 460 L 900 360 L 1080 440 L 1260 370 L 1440 450 L 1600 410 L 1600 900 L 0 900 Z" fill="url(#ridge1)" opacity="0.7"/>

  <!-- Mid ridge -->
  <path d="M 0 640 L 160 560 L 320 610 L 480 520 L 640 600 L 820 510 L 980 580 L 1160 500 L 1340 580 L 1500 520 L 1600 560 L 1600 900 L 0 900 Z" fill="url(#ridge2)" opacity="0.85"/>

  <!-- Near ridge cradling the lake -->
  <path d="M 0 760 L 140 700 L 280 740 L 420 690 L 560 730 L 600 720 L 1000 720 L 1040 730 L 1180 690 L 1320 740 L 1460 700 L 1600 740 L 1600 900 L 0 900 Z" fill="url(#ridge3)"/>

  <!-- Heart-shaped lake (Lago di Scanno), centered hero ~(800, 540) -->
  <g transform="translate(800 540)">
    <!-- Heart formed from two arcs + point -->
    <path d="M 0 140
             C -40 110, -150 80, -200 20
             C -250 -50, -210 -130, -140 -130
             C -80 -130, -40 -90, 0 -40
             C 40 -90, 80 -130, 140 -130
             C 210 -130, 250 -50, 200 20
             C 150 80, 40 110, 0 140 Z"
          fill="url(#lake)" opacity="0.92"/>
    <!-- subtle highlight on the lake -->
    <path d="M -130 -90 C -90 -110, -50 -100, -20 -70 C -60 -75, -100 -65, -130 -90 Z" fill="#fef3ec" opacity="0.45"/>
    <path d="M 30 -70 C 60 -100, 100 -110, 140 -90 C 110 -65, 70 -75, 30 -70 Z" fill="#fef3ec" opacity="0.35"/>
  </g>

  <!-- Tiny borgo silhouette on near-ridge crest (Barrea reference) -->
  <g fill="#1a0e0e" opacity="0.85">
    <rect x="380" y="668" width="14" height="22"/>
    <rect x="394" y="660" width="18" height="30"/>
    <rect x="412" y="668" width="12" height="22"/>
    <polygon points="394,660 403,648 412,660"/>
    <rect x="402" y="640" width="3" height="10"/>
  </g>
</svg>
