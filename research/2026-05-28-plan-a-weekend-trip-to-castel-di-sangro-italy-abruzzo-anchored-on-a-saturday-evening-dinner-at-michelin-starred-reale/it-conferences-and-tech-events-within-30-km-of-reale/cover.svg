<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.95" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky background full-bleed -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Far mountain range (decoration, may crop on detail view) -->
  <path d="M0 560 L160 430 L290 500 L430 380 L560 470 L700 400 L860 480 L1000 390 L1160 460 L1300 410 L1450 480 L1600 430 L1600 900 L0 900 Z"
        fill="url(#farRange)" opacity="0.65"/>

  <!-- Mid mountain silhouette (Apennine valley) -->
  <path d="M0 720 L120 600 L240 680 L360 540 L500 660 L640 580 L780 700 L900 590 L1040 670 L1180 560 L1320 680 L1460 610 L1600 690 L1600 900 L0 900 Z"
        fill="url(#midRange)" opacity="0.9"/>

  <!-- Valley floor -->
  <path d="M0 780 Q400 760 800 790 T1600 770 L1600 900 L0 900 Z"
        fill="#5c2a1a" opacity="0.85"/>

  <!-- 30 km search radius glow (hero) -->
  <circle cx="700" cy="470" r="320" fill="url(#ringGlow)"/>

  <!-- 30 km radius ring — dashed perimeter of emptiness -->
  <circle cx="700" cy="470" r="300"
          fill="none" stroke="#c2410c" stroke-width="3"
          stroke-dasharray="14 10" opacity="0.85"/>
  <circle cx="700" cy="470" r="300"
          fill="none" stroke="#9a3309" stroke-width="1" opacity="0.4"/>

  <!-- Inner faint ring suggesting scan sweep -->
  <circle cx="700" cy="470" r="180"
          fill="none" stroke="#d97706" stroke-width="1"
          stroke-dasharray="3 7" opacity="0.5"/>

  <!-- Castel di Sangro hub at circle center -->
  <circle cx="700" cy="470" r="22" fill="url(#hub)" opacity="0.95"/>
  <circle cx="700" cy="470" r="10" fill="#78350f" opacity="0.9"/>
  <circle cx="700" cy="470" r="4" fill="#fbbf24"/>

  <!-- Radius indicator line reaching empty terrain -->
  <line x1="700" y1="470" x2="990" y2="395"
        stroke="#9a3309" stroke-width="1.5"
        stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Distant tech node — far OUTSIDE the circle, the only one -->
  <g opacity="0.9">
    <circle cx="1280" cy="320" r="14" fill="#6d28d9" opacity="0"/>
    <circle cx="1280" cy="320" r="14" fill="#c2410c"/>
    <circle cx="1280" cy="320" r="7" fill="#fbbf24"/>
    <!-- Tiny circuit traces from the lone node -->
    <path d="M1280 320 L1330 320 L1330 280 L1380 280"
          fill="none" stroke="#c2410c" stroke-width="2" opacity="0.7"/>
    <path d="M1280 320 L1240 320 L1240 360 L1200 360"
          fill="none" stroke="#c2410c" stroke-width="2" opacity="0.7"/>
    <circle cx="1380" cy="280" r="4" fill="#d97706"/>
    <circle cx="1200" cy="360" r="4" fill="#d97706"/>
  </g>

  <!-- Faint connection line from hub toward distant node, broken -->
  <line x1="722" y1="463" x2="940" y2="395"
        stroke="#9a3309" stroke-width="1" opacity="0.35"/>
  <line x1="1080" y1="360" x2="1265" y2="325"
        stroke="#9a3309" stroke-width="1" opacity="0.35"/>
</svg>
