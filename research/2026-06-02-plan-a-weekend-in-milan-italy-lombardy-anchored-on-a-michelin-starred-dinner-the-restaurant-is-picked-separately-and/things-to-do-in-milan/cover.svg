<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duomo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sunset sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm sun halo behind the cathedral -->
  <circle cx="800" cy="540" r="360" fill="url(#sun)"/>

  <!-- Distant city haze line -->
  <rect x="0" y="720" width="1600" height="6" fill="#9a3309" opacity="0.35"/>

  <!-- Duomo silhouette: stepped gothic facade with central spire.
       Hero centered ~ (800, 500), within safe zone x:200-1400, y:300-780 -->
  <g fill="url(#duomo)" opacity="0.95">
    <!-- Base body -->
    <path d="M 280 780
             L 280 600
             L 360 600 L 360 560 L 420 560 L 420 530
             L 480 530 L 480 500 L 540 500 L 540 470
             L 600 470 L 600 430 L 660 430 L 660 400
             L 720 400 L 720 360 L 760 360 L 760 300
             L 800 240
             L 840 300 L 840 360 L 880 360 L 880 400
             L 940 400 L 940 430 L 1000 430 L 1000 470
             L 1060 470 L 1060 500 L 1120 500 L 1120 530
             L 1180 530 L 1180 560 L 1240 560 L 1240 600
             L 1320 600 L 1320 780 Z"/>
  </g>

  <!-- Secondary spires accenting the facade rhythm -->
  <g fill="#1a0e0e" opacity="0.85">
    <polygon points="600,470 615,420 630,470"/>
    <polygon points="660,430 675,380 690,430"/>
    <polygon points="720,400 735,345 750,400"/>
    <polygon points="850,345 865,400 835,400"/>
    <polygon points="910,380 925,430 895,430"/>
    <polygon points="970,420 985,470 955,470"/>
  </g>

  <!-- Central tall spire crowning the hero -->
  <polygon points="790,260 800,180 810,260" fill="#1a0e0e" opacity="0.9"/>
  <circle cx="800" cy="178" r="5" fill="#fbbf24" opacity="0.9"/>

  <!-- Aperitivo glass glow: a single warm ember in the lower-right foreground,
       inside the safe zone, evoking a Negroni / Campari spritz -->
  <g opacity="0.85">
    <ellipse cx="1280" cy="720" rx="48" ry="14" fill="#1a0e0e"/>
    <path d="M 1240 720 Q 1280 660 1320 720 L 1300 720 L 1300 760 L 1260 760 L 1260 720 Z" fill="#9a3309" opacity="0.75"/>
    <ellipse cx="1280" cy="690" rx="32" ry="6" fill="#fbbf24" opacity="0.55"/>
  </g>

  <!-- Foreground ground shadow -->
  <rect x="0" y="780" width="1600" height="120" fill="#1a0e0e" opacity="0.75"/>
</svg>
