<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0707"/>
      <stop offset="60%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1505"/>
    </linearGradient>
    <!-- Warm table-glow radial -->
    <radialGradient id="glow" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plate" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>
    <!-- Duomo silhouette fill -->
    <linearGradient id="duomoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm ambient glow from table level -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — Duomo silhouette (architectural spires, safe zone y:90–810) -->
  <!-- Central nave body -->
  <rect x="620" y="310" width="360" height="390" fill="url(#duomoGrad)" rx="2"/>
  <!-- Central spire tall -->
  <polygon points="800,110 830,310 770,310" fill="url(#duomoGrad)"/>
  <!-- Central spire finial cap -->
  <polygon points="800,110 812,145 788,145" fill="#d97706" opacity="0.9"/>
  <!-- Left major spire -->
  <rect x="555" y="355" width="70" height="345" fill="#78350f" opacity="0.88" rx="1"/>
  <polygon points="590,200 610,355 570,355" fill="#78350f" opacity="0.88"/>
  <polygon points="590,200 598,228 582,228" fill="#d97706" opacity="0.75"/>
  <!-- Right major spire -->
  <rect x="975" y="355" width="70" height="345" fill="#78350f" opacity="0.88" rx="1"/>
  <polygon points="1010,200 1030,355 990,355" fill="#78350f" opacity="0.88"/>
  <polygon points="1010,200 1018,228 1002,228" fill="#d97706" opacity="0.75"/>
  <!-- Left minor spire -->
  <rect x="470" y="430" width="50" height="270" fill="#5c2a1a" opacity="0.80" rx="1"/>
  <polygon points="495,320 512,430 478,430" fill="#5c2a1a" opacity="0.80"/>
  <!-- Right minor spire -->
  <rect x="1080" y="430" width="50" height="270" fill="#5c2a1a" opacity="0.80" rx="1"/>
  <polygon points="1105,320 1122,430 1088,430" fill="#5c2a1a" opacity="0.80"/>
  <!-- Gothic arched windows on nave (decorative) -->
  <ellipse cx="720" cy="430" rx="28" ry="48" fill="#d97706" opacity="0.13"/>
  <ellipse cx="800" cy="420" rx="28" ry="52" fill="#d97706" opacity="0.15"/>
  <ellipse cx="880" cy="430" rx="28" ry="48" fill="#d97706" opacity="0.13"/>

  <!-- Tablecloth / table surface — horizontal ellipse at table level -->
  <ellipse cx="800" cy="760" rx="680" ry="95" fill="#3a1505" opacity="0.82"/>
  <ellipse cx="800" cy="755" rx="660" ry="80" fill="#5c2a1a" opacity="0.60"/>
  <!-- Subtle cloth highlight -->
  <ellipse cx="800" cy="748" rx="400" ry="30" fill="#fbbf24" opacity="0.07"/>

  <!-- Layer 2 hero: Plate left -->
  <ellipse cx="580" cy="730" rx="112" ry="26" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="580" cy="710" r="108" fill="url(#plate)" opacity="0.92"/>
  <circle cx="580" cy="710" r="86" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.45"/>
  <circle cx="580" cy="710" r="70" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.30"/>
  <!-- Food element left plate: small abstract oval (sauce dot cluster) -->
  <ellipse cx="572" cy="706" rx="18" ry="12" fill="#c2410c" opacity="0.75"/>
  <ellipse cx="595" cy="714" rx="9" ry="6" fill="#9a3309" opacity="0.65"/>
  <ellipse cx="560" cy="718" rx="7" ry="5" fill="#d97706" opacity="0.55"/>

  <!-- Plate right -->
  <ellipse cx="1020" cy="730" rx="112" ry="26" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="1020" cy="710" r="108" fill="url(#plate)" opacity="0.92"/>
  <circle cx="1020" cy="710" r="86" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.45"/>
  <circle cx="1020" cy="710" r="70" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.30"/>
  <!-- Food element right plate -->
  <ellipse cx="1012" cy="706" rx="18" ry="12" fill="#c2410c" opacity="0.75"/>
  <ellipse cx="1035" cy="714" rx="9" ry="6" fill="#9a3309" opacity="0.65"/>
  <ellipse cx="1000" cy="718" rx="7" ry="5" fill="#d97706" opacity="0.55"/>

  <!-- Wine glass silhouette centered between plates -->
  <!-- Bowl (ellipse top) -->
  <ellipse cx="800" cy="638" rx="38" ry="52" fill="url(#glassGrad)" opacity="0.78"/>
  <!-- Stem -->
  <rect x="796" y="690" width="8" height="68" fill="#fbbf24" opacity="0.55"/>
  <!-- Base -->
  <ellipse cx="800" cy="760" rx="32" ry="7" fill="#fbbf24" opacity="0.45"/>
  <!-- Wine fill inside bowl -->
  <ellipse cx="800" cy="658" rx="28" ry="22" fill="#be185d" opacity="0.42"/>

  <!-- Michelin star trio — three small decorative stars above the glass -->
  <!-- Star 1 -->
  <polygon points="756,572 760,584 773,584 763,591 767,603 756,596 745,603 749,591 739,584 752,584"
           fill="#fbbf24" opacity="0.88"/>
  <!-- Star 2 -->
  <polygon points="800,565 804,577 817,577 807,584 811,596 800,589 789,596 793,584 783,577 796,577"
           fill="#fbbf24" opacity="0.92"/>
  <!-- Star 3 -->
  <polygon points="844,572 848,584 861,584 851,591 855,603 844,596 833,603 837,591 827,584 840,584"
           fill="#fbbf24" opacity="0.88"/>

  <!-- Layer 3: Edge vignette decoration (outside safe zone is fine) -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="#0f0707" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0f0707" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
