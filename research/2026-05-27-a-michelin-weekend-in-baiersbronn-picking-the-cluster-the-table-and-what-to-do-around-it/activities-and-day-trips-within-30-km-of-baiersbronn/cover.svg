<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- hero: warm sun disc above the ridge, centered in safe zone -->
  <circle cx="820" cy="430" r="220" fill="url(#sun)"/>
  <circle cx="820" cy="430" r="95" fill="#fbbf24" opacity="0.85"/>

  <!-- distant ridge: gentle, hazy -->
  <path d="M0,560 L120,540 L210,555 L300,520 L380,545 L470,510 L560,540 L660,505 L760,535 L860,500 L960,530 L1060,500 L1170,535 L1280,515 L1390,545 L1500,520 L1600,540 L1600,900 L0,900 Z" fill="url(#r1)"/>

  <!-- mid ridge: conifer silhouettes via triangular spikes -->
  <path d="M0,640 L40,610 L70,635 L110,600 L150,640 L190,605 L230,640 L270,595 L320,640 L360,615 L410,585 L450,640 L500,605 L540,640 L590,600 L640,640 L690,610 L740,580 L790,640 L840,600 L890,640 L940,605 L990,580 L1040,640 L1090,610 L1140,640 L1200,595 L1250,640 L1300,615 L1350,585 L1400,640 L1450,605 L1500,640 L1560,610 L1600,635 L1600,900 L0,900 Z" fill="url(#r2)"/>

  <!-- near ridge: bolder conifer spikes, deepest tone -->
  <path d="M0,760 L30,720 L60,755 L100,700 L140,760 L180,715 L220,760 L260,705 L310,760 L350,725 L400,690 L450,760 L500,710 L550,760 L600,700 L660,760 L720,720 L770,685 L820,760 L880,710 L930,760 L980,720 L1030,685 L1090,760 L1140,720 L1200,760 L1260,705 L1320,760 L1380,725 L1430,690 L1480,760 L1540,720 L1600,755 L1600,900 L0,900 Z" fill="url(#r3)"/>

  <!-- thin waterfall ribbon descending through near ridge, off-center so it doesn't cross the hero -->
  <path d="M1180,640 Q1175,720 1185,800 Q1188,840 1182,880" stroke="#faf8f2" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M1180,640 Q1175,720 1185,800 Q1188,840 1182,880" stroke="#fef3ec" stroke-width="1.2" fill="none" opacity="0.95" stroke-linecap="round"/>
</svg>
