<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1e14" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2a140c" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3a1a08" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#haze)"/>

  <!-- far ridge (back valley) -->
  <path d="M0,520 L120,470 L240,490 L360,440 L480,470 L600,420 L720,460 L840,430 L960,450 L1080,420 L1200,460 L1320,430 L1440,470 L1600,440 L1600,900 L0,900 Z" fill="url(#ridgeBack)"/>

  <!-- mid ridge -->
  <path d="M0,620 L140,580 L280,610 L420,560 L560,600 L700,550 L840,590 L980,560 L1120,600 L1260,570 L1400,610 L1600,580 L1600,900 L0,900 Z" fill="url(#ridgeMid)"/>

  <!-- front ridge with valley dip for the river -->
  <path d="M0,740 L160,700 L320,730 L460,710 L600,740 L720,760 L820,770 L900,760 L1000,740 L1140,720 L1280,740 L1440,710 L1600,730 L1600,900 L0,900 Z" fill="url(#ridgeFront)"/>

  <!-- Murg-valley river spine winding through -->
  <path d="M780,900 Q800,820 760,760 Q720,700 780,640 Q840,580 800,500 Q760,420 820,340 Q860,280 830,200 Q810,140 840,90" fill="none" stroke="url(#river)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M780,900 Q800,820 760,760 Q720,700 780,640 Q840,580 800,500 Q760,420 820,340 Q860,280 830,200 Q810,140 840,90" fill="none" stroke="#fef3ec" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- pine silhouettes scattered on ridges -->
  <g fill="#1a0e0e" opacity="0.85">
    <polygon points="180,610 188,580 196,610"/>
    <polygon points="240,605 247,578 254,605"/>
    <polygon points="380,595 388,565 396,595"/>
    <polygon points="540,605 548,575 556,605"/>
    <polygon points="680,590 688,560 696,590"/>
    <polygon points="980,595 988,565 996,595"/>
    <polygon points="1120,605 1128,575 1136,605"/>
    <polygon points="1280,600 1288,570 1296,600"/>
    <polygon points="1380,608 1388,578 1396,608"/>
  </g>
  <g fill="#0d0706" opacity="0.9">
    <polygon points="120,720 130,685 140,720"/>
    <polygon points="200,725 210,690 220,725"/>
    <polygon points="340,730 350,695 360,730"/>
    <polygon points="1060,725 1070,690 1080,725"/>
    <polygon points="1220,720 1230,685 1240,720"/>
    <polygon points="1340,728 1350,693 1360,728"/>
    <polygon points="1480,720 1490,685 1500,720"/>
  </g>

  <!-- three star clusters: cluster 1 (upper, ~Tonbach valley) -->
  <circle cx="420" cy="280" r="90" fill="url(#glow)"/>
  <g transform="translate(420,280)">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#fbbf24"/>
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#fef3ec" opacity="0.4"/>
  </g>

  <!-- cluster 2 (center-right, ~Mitteltal/Obertal area) -->
  <circle cx="900" cy="430" r="110" fill="url(#glow)"/>
  <g transform="translate(900,430) scale(1.15)">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#fbbf24"/>
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#fef3ec" opacity="0.45"/>
  </g>

  <!-- cluster 3 (lower-right, ~Huzenbach/Schwarzenberg) -->
  <circle cx="1280" cy="640" r="85" fill="url(#glow)"/>
  <g transform="translate(1280,640) scale(0.95)">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#fbbf24"/>
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="#fef3ec" opacity="0.4"/>
  </g>

  <!-- faint connecting trail dots, the unwalkable distance between clusters -->
  <g fill="#fbbf24" opacity="0.35">
    <circle cx="540" cy="330" r="2.5"/>
    <circle cx="620" cy="360" r="2.5"/>
    <circle cx="700" cy="385" r="2.5"/>
    <circle cx="780" cy="405" r="2.5"/>
    <circle cx="990" cy="475" r="2.5"/>
    <circle cx="1080" cy="525" r="2.5"/>
    <circle cx="1170" cy="580" r="2.5"/>
  </g>
</svg>
