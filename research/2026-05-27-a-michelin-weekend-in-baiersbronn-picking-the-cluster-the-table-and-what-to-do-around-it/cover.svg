<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1a14"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="plateSide" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0eadb" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant pine silhouettes (decoration, edge-clippable) -->
  <polygon points="0,720 60,560 120,720" fill="#0a0606" opacity="0.7"/>
  <polygon points="90,720 160,540 230,720" fill="#0a0606" opacity="0.7"/>
  <polygon points="200,720 270,580 340,720" fill="#0a0606" opacity="0.65"/>
  <polygon points="1280,720 1350,560 1420,720" fill="#0a0606" opacity="0.7"/>
  <polygon points="1380,720 1450,540 1520,720" fill="#0a0606" opacity="0.7"/>
  <polygon points="1480,720 1550,580 1600,720"  fill="#0a0606" opacity="0.65"/>
  <rect x="0" y="715" width="1600" height="185" fill="#0a0606" opacity="0.85"/>

  <!-- Three plates across three valleys (side, hero, side) -->
  <!-- Left plate (Schwarzenberg) -->
  <ellipse cx="420" cy="540" rx="180" ry="46" fill="#000" opacity="0.45"/>
  <ellipse cx="420" cy="520" rx="180" ry="44" fill="url(#plateSide)"/>
  <ellipse cx="420" cy="516" rx="130" ry="30" fill="#1a0e0e" opacity="0.25"/>
  <circle cx="420" cy="510" r="10" fill="#c2410c" opacity="0.85"/>

  <!-- Right plate (Mitteltal) -->
  <ellipse cx="1180" cy="540" rx="180" ry="46" fill="#000" opacity="0.45"/>
  <ellipse cx="1180" cy="520" rx="180" ry="44" fill="url(#plateSide)"/>
  <ellipse cx="1180" cy="516" rx="130" ry="30" fill="#1a0e0e" opacity="0.25"/>
  <circle cx="1180" cy="510" r="10" fill="#c2410c" opacity="0.85"/>

  <!-- Hero plate (Tonbach, centered) -->
  <ellipse cx="800" cy="510" rx="280" ry="70" fill="#000" opacity="0.55"/>
  <ellipse cx="800" cy="480" rx="280" ry="68" fill="url(#plate)"/>
  <ellipse cx="800" cy="474" rx="200" ry="46" fill="#5c2a1a" opacity="0.35"/>
  <!-- Three stars-as-dots arrangement (rust dots, not glyphs) -->
  <circle cx="760" cy="468" r="9" fill="#c2410c"/>
  <circle cx="800" cy="462" r="11" fill="#9a3309"/>
  <circle cx="840" cy="468" r="9" fill="#c2410c"/>

  <!-- Wine glass silhouette rising into hero safe zone -->
  <path d="M 780 220 Q 780 320 800 350 Q 820 320 820 220 Q 800 200 780 220 Z" fill="url(#glass)" opacity="0.9"/>
  <rect x="797" y="350" width="6" height="80" fill="#78350f" opacity="0.85"/>
  <ellipse cx="800" cy="432" rx="28" ry="6" fill="#78350f" opacity="0.85"/>
  <!-- Wine surface highlight -->
  <ellipse cx="800" cy="245" rx="18" ry="3" fill="#fbbf24" opacity="0.5"/>

  <!-- Steam / aroma curls from hero plate -->
  <path d="M 720 460 Q 700 400 720 340 Q 740 300 720 250" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M 880 460 Q 900 400 880 340 Q 860 300 880 250" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35"/>
</svg>
