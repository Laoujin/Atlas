<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.92" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.96" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Distant forest hills (decoration, partially cropped on detail view) -->
  <path d="M0,720 Q200,600 420,650 T820,640 T1240,660 T1600,640 L1600,900 L0,900 Z"
        fill="#0e7490" opacity="0.18"/>
  <path d="M0,780 Q260,700 520,740 T940,720 T1360,750 T1600,730 L1600,900 L0,900 Z"
        fill="#78350f" opacity="0.22"/>

  <!-- 30 km radius ring (concentric, centered on hero pin location) -->
  <circle cx="800" cy="500" r="330" fill="url(#ringA)"/>
  <circle cx="800" cy="500" r="330" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 10" opacity="0.55"/>
  <circle cx="800" cy="500" r="210" fill="none" stroke="#9a3309" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.35"/>

  <!-- Soft glow under hero -->
  <ellipse cx="800" cy="470" rx="260" ry="200" fill="url(#glow)"/>

  <!-- Satellite pins (smaller, peripheral events) -->
  <g opacity="0.85">
    <!-- Nagold-ish: upper right -->
    <path d="M1030,360 C1030,338 1048,322 1068,322 C1088,322 1106,338 1106,360 C1106,388 1068,432 1068,432 C1068,432 1030,388 1030,360 Z"
          fill="#9a3309"/>
    <circle cx="1068" cy="358" r="13" fill="#faf8f2"/>
  </g>
  <g opacity="0.85">
    <!-- Offenburg-ish: lower left -->
    <path d="M508,580 C508,558 526,542 546,542 C566,542 584,558 584,580 C584,608 546,652 546,652 C546,652 508,608 508,580 Z"
          fill="#9a3309"/>
    <circle cx="546" cy="578" r="13" fill="#faf8f2"/>
  </g>
  <g opacity="0.7">
    <!-- Bad Herrenalb-ish: outside the ring, upper -->
    <path d="M1180,210 C1180,192 1194,180 1210,180 C1226,180 1240,192 1240,210 C1240,232 1210,266 1210,266 C1210,266 1180,232 1180,210 Z"
          fill="#78350f"/>
    <circle cx="1210" cy="208" r="10" fill="#faf8f2"/>
  </g>

  <!-- HERO: large map pin marking Baiersbronn -->
  <g>
    <!-- Pin shadow -->
    <ellipse cx="800" cy="720" rx="80" ry="14" fill="#1a0e0e" opacity="0.18"/>
    <!-- Pin body -->
    <path d="M680,420 C680,354 733,300 800,300 C867,300 920,354 920,420 C920,512 800,700 800,700 C800,700 680,512 680,420 Z"
          fill="url(#pin)"/>
    <!-- Pin highlight -->
    <path d="M730,400 C730,358 760,328 800,328 C800,328 768,344 758,376 C748,408 752,440 752,440 C740,432 730,418 730,400 Z"
          fill="#fbbf24" opacity="0.35"/>
    <!-- Pin inner circle (event icon: simple node) -->
    <circle cx="800" cy="418" r="44" fill="#faf8f2"/>
    <circle cx="800" cy="418" r="44" fill="none" stroke="#78350f" stroke-width="2" opacity="0.4"/>
    <!-- Tiny node-graph inside circle hinting "tech event" -->
    <circle cx="800" cy="418" r="6" fill="#0e7490"/>
    <circle cx="778" cy="402" r="4" fill="#c2410c"/>
    <circle cx="822" cy="402" r="4" fill="#c2410c"/>
    <circle cx="778" cy="434" r="4" fill="#c2410c"/>
    <circle cx="822" cy="434" r="4" fill="#c2410c"/>
    <line x1="800" y1="418" x2="778" y2="402" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>
    <line x1="800" y1="418" x2="822" y2="402" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>
    <line x1="800" y1="418" x2="778" y2="434" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>
    <line x1="800" y1="418" x2="822" y2="434" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
