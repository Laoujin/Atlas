<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Faint decorative screen rectangles — outside hero, low opacity -->
  <rect x="80" y="160" width="260" height="170" rx="6" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.18" transform="rotate(-6 210 245)"/>
  <rect x="110" y="200" width="200" height="110" rx="4" fill="#9a3309" opacity="0.10" transform="rotate(-6 210 255)"/>

  <rect x="1260" y="180" width="260" height="170" rx="6" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.18" transform="rotate(6 1390 265)"/>
  <rect x="1290" y="218" width="200" height="110" rx="4" fill="#9a3309" opacity="0.10" transform="rotate(6 1390 273)"/>

  <rect x="140" y="620" width="220" height="140" rx="6" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.13" transform="rotate(4 250 690)"/>
  <rect x="1240" y="600" width="220" height="140" rx="6" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.13" transform="rotate(-4 1350 670)"/>

  <!-- Layer 2: radial glow behind hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Hero: torii gate centered at (800, 450), safe zone x:125-1475 y:90-810 -->
  <!-- Bounding box approx x:550-1050, y:160-760 -->

  <!-- Ground base bar -->
  <rect x="560" y="740" width="480" height="22" rx="4" fill="url(#pillarGrad)" opacity="0.85"/>

  <!-- Left pillar -->
  <rect x="622" y="310" width="58" height="450" rx="6" fill="url(#pillarGrad)" opacity="0.92"/>
  <!-- Right pillar -->
  <rect x="920" y="310" width="58" height="450" rx="6" fill="url(#pillarGrad)" opacity="0.92"/>

  <!-- Lower crossbeam (kasagi second beam) -->
  <rect x="590" y="490" width="420" height="32" rx="4" fill="url(#beamGrad)" opacity="0.88"/>

  <!-- Upper crossbeam (kasagi) — slightly wider, with upturned ends -->
  <!-- Main beam body -->
  <rect x="555" y="320" width="490" height="46" rx="5" fill="url(#capGrad)" opacity="0.95"/>
  <!-- Left upturned tip -->
  <path d="M555 320 Q530 316 518 300 Q526 318 555 322 Z" fill="#d97706" opacity="0.90"/>
  <!-- Right upturned tip -->
  <path d="M1045 320 Q1070 316 1082 300 Q1074 318 1045 322 Z" fill="#d97706" opacity="0.90"/>

  <!-- Top cap (shimagi) — narrower decorative cap above kasagi -->
  <rect x="580" y="288" width="440" height="30" rx="4" fill="#fbbf24" opacity="0.75"/>

  <!-- Vertical centre tie (hashira nuki subtle accent) -->
  <rect x="791" y="366" width="18" height="126" rx="3" fill="#78350f" opacity="0.60"/>

  <!-- Warm accent glow dot at torii centre top -->
  <circle cx="800" cy="288" r="18" fill="#fbbf24" opacity="0.55"/>
  <circle cx="800" cy="288" r="9" fill="#fbbf24" opacity="0.85"/>

</svg>
