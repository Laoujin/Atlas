<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft glow behind hub -->
  <circle cx="560" cy="450" r="320" fill="url(#glow)"/>

  <!-- relay fan lines: source -> hub -> endpoints -->
  <g stroke="#c2410c" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M560 450 L1140 230"/>
    <path d="M560 450 L1180 450"/>
    <path d="M560 450 L1140 670"/>
    <path d="M560 450 L1080 360"/>
    <path d="M560 450 L1080 540"/>
  </g>

  <!-- incoming source signal -->
  <g stroke="#78350f" stroke-width="6" fill="none" opacity="0.65" stroke-linecap="round">
    <path d="M210 450 L560 450"/>
  </g>
  <circle cx="210" cy="450" r="34" fill="#78350f" opacity="0.85"/>
  <circle cx="210" cy="450" r="14" fill="#fef3ec"/>

  <!-- relay hub (cloud gateway) -->
  <circle cx="560" cy="450" r="118" fill="url(#hub)"/>
  <circle cx="560" cy="450" r="118" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.6"/>
  <!-- cloud bumps suggesting cloud relay -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="510" cy="430" r="34"/>
    <circle cx="565" cy="408" r="44"/>
    <circle cx="615" cy="438" r="32"/>
    <rect x="500" y="445" width="125" height="42" rx="21"/>
  </g>

  <!-- endpoint nodes (phones / chats) -->
  <g>
    <circle cx="1140" cy="230" r="46" fill="url(#node)"/>
    <rect x="1124" y="208" width="32" height="46" rx="7" fill="#fef3ec" opacity="0.92"/>

    <circle cx="1180" cy="450" r="52" fill="url(#node)"/>
    <path d="M1156 432 h48 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-30 l-16 14 v-14 a8 8 0 0 1 -2 -52 z" fill="#fef3ec" opacity="0.92" transform="translate(0 -2)"/>

    <circle cx="1140" cy="670" r="46" fill="url(#node)"/>
    <rect x="1124" y="648" width="32" height="46" rx="7" fill="#fef3ec" opacity="0.92"/>
  </g>

  <!-- decorative edge corner, croppable -->
  <circle cx="1520" cy="120" r="160" fill="#fbbf24" opacity="0.12"/>
  <circle cx="60" cy="820" r="140" fill="#c2410c" opacity="0.1"/>
</svg>
