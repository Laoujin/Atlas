<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main gradient background: rust warm -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0eadb;stop-opacity:1" />
    </linearGradient>

    <!-- Rust hero gradient (darker rust) -->
    <linearGradient id="heroRust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:0.95" />
    </linearGradient>

    <!-- Teal secondary (for interlock accent) -->
    <linearGradient id="heroTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e7490;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0c5460;stop-opacity:0.9" />
    </linearGradient>

    <!-- Radial glow for connection point -->
    <radialGradient id="glowPoint">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.2" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Faint corner message bubble decoration (top-right, outside safe zone) -->
  <circle cx="1480" cy="120" r="45" fill="#c2410c" opacity="0.15" />
  <circle cx="1520" cy="160" r="35" fill="#9a3309" opacity="0.12" />

  <!-- Faint corner message bubble decoration (bottom-left, outside safe zone) -->
  <circle cx="80" cy="800" r="50" fill="#c2410c" opacity="0.15" />
  <circle cx="50" cy="750" r="40" fill="#9a3309" opacity="0.12" />

  <!-- Hero: Two interlocking rounded rectangles representing integration channels -->
  <!-- Left block (rust, wider): official/primary integration path -->
  <rect x="500" y="300" width="440" height="300" rx="40" ry="40" fill="url(#heroRust)" opacity="0.92" />

  <!-- Right block (teal, offset): alternative/self-hosted path, interlocking -->
  <rect x="660" y="380" width="440" height="300" rx="40" ry="40" fill="url(#heroTeal)" opacity="0.88" />

  <!-- Connection glow at overlap center -->
  <circle cx="850" cy="480" r="100" fill="url(#glowPoint)" opacity="0.7" />

  <!-- Subtle connecting line/spark between centers -->
  <line x1="720" y1="450" x2="980" y2="510" stroke="#fbbf24" stroke-width="8" opacity="0.4" stroke-linecap="round" />

  <!-- Faint internal suggestion of data flow: thin horizontal lines inside left block -->
  <line x1="550" y1="370" x2="900" y2="370" stroke="#fbbf24" stroke-width="3" opacity="0.25" stroke-linecap="round" />
  <line x1="550" y1="420" x2="900" y2="420" stroke="#fbbf24" stroke-width="3" opacity="0.2" stroke-linecap="round" />
  <line x1="550" y1="470" x2="900" y2="470" stroke="#fbbf24" stroke-width="3" opacity="0.15" stroke-linecap="round" />

  <!-- Faint internal suggestion of data flow: thin horizontal lines inside right block -->
  <line x1="710" y1="450" x2="1050" y2="450" stroke="#fbbf24" stroke-width="3" opacity="0.2" stroke-linecap="round" />
  <line x1="710" y1="500" x2="1050" y2="500" stroke="#fbbf24" stroke-width="3" opacity="0.15" stroke-linecap="round" />
  <line x1="710" y1="550" x2="1050" y2="550" stroke="#fbbf24" stroke-width="3" opacity="0.12" stroke-linecap="round" />
</svg>