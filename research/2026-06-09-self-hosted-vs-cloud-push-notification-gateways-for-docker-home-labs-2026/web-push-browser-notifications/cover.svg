<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="badge" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- push / broadcast waves (teal secondary) -->
  <g fill="none" stroke="#0e7490" stroke-linecap="round">
    <path d="M 595.2 286.6 A 250 250 0 0 0 595.2 573.4" stroke-width="11" opacity="0.5"/>
    <path d="M 636.2 315.3 A 200 200 0 0 0 636.2 544.7" stroke-width="13" opacity="0.7"/>
    <path d="M 1004.8 286.6 A 250 250 0 0 1 1004.8 573.4" stroke-width="11" opacity="0.5"/>
    <path d="M 963.8 315.3 A 200 200 0 0 1 963.8 544.7" stroke-width="13" opacity="0.7"/>
  </g>

  <!-- bell hero -->
  <circle cx="800" cy="296" r="20" fill="#78350f"/>
  <path d="M 800 306
           C 758 306 722 336 716 412
           C 712 462 700 492 674 518
           C 672 528 678 534 690 534
           L 910 534
           C 922 534 928 528 926 518
           C 900 492 888 462 884 412
           C 878 336 842 306 800 306 Z"
        fill="url(#bell)" opacity="0.95"/>
  <path d="M 690 540 C 730 564 870 564 910 540 C 902 566 856 580 800 580 C 744 580 698 566 690 540 Z"
        fill="#9a3309" opacity="0.9"/>
  <circle cx="800" cy="600" r="30" fill="#c2410c"/>

  <!-- unread badge -->
  <circle cx="888" cy="338" r="46" fill="#faf8f2"/>
  <circle cx="888" cy="338" r="38" fill="url(#badge)"/>
</svg>
