<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0b5566"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="430" fill="url(#glow)"/>

  <!-- teal block with port socket -->
  <g opacity="0.92">
    <rect x="430" y="300" width="320" height="300" rx="26" fill="url(#teal)"/>
    <rect x="690" y="378" width="90" height="60" rx="12" fill="#1a0e0e" opacity="0.85"/>
    <rect x="690" y="462" width="90" height="60" rx="12" fill="#1a0e0e" opacity="0.85"/>
  </g>

  <!-- rust hero block with plug prongs interlocking -->
  <g opacity="0.95">
    <rect x="850" y="300" width="320" height="300" rx="26" fill="url(#rust)"/>
    <rect x="760" y="384" width="100" height="48" rx="10" fill="#fbbf24"/>
    <rect x="760" y="468" width="100" height="48" rx="10" fill="#fbbf24"/>
  </g>

  <!-- notification signal arcs rising from hero -->
  <g fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M1080 250 q70 -70 140 0"/>
    <path d="M1050 220 q100 -100 200 0" opacity="0.7"/>
    <path d="M1020 190 q130 -130 260 0" opacity="0.45"/>
  </g>
  <circle cx="1150" cy="280" r="22" fill="#fbbf24"/>

  <!-- decoration: faint edge dots -->
  <circle cx="150" cy="780" r="10" fill="#d97706" opacity="0.5"/>
  <circle cx="1450" cy="140" r="14" fill="#0e7490" opacity="0.5"/>
</svg>
