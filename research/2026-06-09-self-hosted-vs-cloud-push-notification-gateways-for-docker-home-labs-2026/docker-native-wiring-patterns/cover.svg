<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep slate-rust nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#1c1a2e"/>
      <stop offset="100%" stop-color="#2d1a0e"/>
    </linearGradient>

    <!-- Hero chassis face gradient -->
    <linearGradient id="chassis-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Rust hub radial glow -->
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Hub face gradient -->
    <linearGradient id="hub-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>

    <!-- Satellite node gradient -->
    <linearGradient id="node-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Connection trail gradient -->
    <linearGradient id="trail-left" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail-up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient edge glow -->
    <radialGradient id="ambient" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#ambient)"/>

  <!-- Subtle grid lines (low opacity, decorative) -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="#334155" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#334155" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="900" stroke="#334155" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#334155" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="900" stroke="#334155" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Layer 2: Hero element — centred at (800, 450), within safe zone -->

  <!-- Hub glow behind centre chassis -->
  <ellipse cx="800" cy="455" rx="160" ry="110" fill="url(#hub-glow)"/>

  <!-- Connection trails from hub to satellite nodes -->
  <!-- Left trail -->
  <rect x="490" y="446" width="230" height="3" fill="url(#trail-left)" rx="2"/>
  <!-- Right trail -->
  <rect x="880" y="446" width="230" height="3" fill="url(#trail-right)" rx="2"/>
  <!-- Up trail -->
  <rect x="797" y="245" width="3" height="160" fill="url(#trail-up)" rx="2"/>
  <!-- Down trail -->
  <rect x="797" y="500" width="3" height="155" fill="url(#trail-down)" rx="2"/>

  <!-- Satellite node: left (e.g. Traefik / proxy) -->
  <!-- Isometric top face -->
  <polygon points="390,390 490,358 490,430 390,462" fill="#475569" opacity="0.88"/>
  <!-- Front face -->
  <rect x="390" y="390" width="100" height="72" fill="url(#node-face)" opacity="0.92"/>
  <!-- Right face (depth) -->
  <polygon points="490,358 530,375 530,447 490,430" fill="#1e293b" opacity="0.85"/>
  <!-- LED accent dot -->
  <circle cx="422" cy="406" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="422" cy="406" r="9" fill="#fbbf24" opacity="0.25"/>

  <!-- Satellite node: right (e.g. ntfy / gotify) -->
  <polygon points="880,390 980,358 980,430 880,462" fill="#475569" opacity="0.88"/>
  <rect x="880" y="390" width="100" height="72" fill="url(#node-face)" opacity="0.92"/>
  <polygon points="980,358 1020,375 1020,447 980,430" fill="#1e293b" opacity="0.85"/>
  <circle cx="912" cy="406" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="912" cy="406" r="9" fill="#fbbf24" opacity="0.25"/>

  <!-- Satellite node: top (e.g. Apprise / Gotify) -->
  <polygon points="730,265 800,243 870,265 800,287" fill="#475569" opacity="0.85"/>
  <rect x="730" y="265" width="70" height="50" fill="url(#node-face)" opacity="0.92"/>
  <polygon points="800,265 870,265 870,315 800,315" fill="#1e293b" opacity="0.82"/>
  <circle cx="750" cy="280" r="4" fill="#fbbf24" opacity="0.85"/>

  <!-- Satellite node: bottom (e.g. Watchtower / alerting) -->
  <polygon points="730,560 800,538 870,560 800,582" fill="#475569" opacity="0.85"/>
  <rect x="730" y="560" width="70" height="50" fill="url(#node-face)" opacity="0.92"/>
  <polygon points="800,560 870,560 870,610 800,610" fill="#1e293b" opacity="0.82"/>
  <circle cx="750" cy="575" r="4" fill="#fbbf24" opacity="0.85"/>

  <!-- HERO: Central hub chassis (notification gateway) -->
  <!-- Isometric top face -->
  <polygon points="680,380 800,344 920,380 800,416" fill="#c2410c" opacity="0.92"/>
  <!-- Front face -->
  <rect x="680" y="380" width="120" height="90" fill="url(#hub-face)" opacity="0.95"/>
  <!-- Right face (depth) -->
  <polygon points="800,380 920,380 920,470 800,470" fill="#78350f" opacity="0.93"/>
  <!-- Hub LED stripe — three dots -->
  <circle cx="710" cy="398" r="6" fill="#fbbf24" opacity="0.95"/>
  <circle cx="710" cy="398" r="11" fill="#fbbf24" opacity="0.22"/>
  <circle cx="730" cy="398" r="4" fill="#fbbf24" opacity="0.7"/>
  <circle cx="748" cy="398" r="4" fill="#fbbf24" opacity="0.5"/>
  <!-- Vent lines on front face -->
  <line x1="688" y1="418" x2="790" y2="418" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="688" y1="430" x2="790" y2="430" stroke="#fbbf24" stroke-opacity="0.13" stroke-width="2"/>
  <line x1="688" y1="442" x2="790" y2="442" stroke="#fbbf24" stroke-opacity="0.10" stroke-width="2"/>
  <!-- Right face depth shading -->
  <line x1="840" y1="388" x2="840" y2="465" stroke="#9a3309" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="870" y1="394" x2="870" y2="465" stroke="#9a3309" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Layer 3: Edge decoration (outside safe zone, can be cropped) -->
  <!-- Corner rust arc, top-left -->
  <path d="M 0 0 Q 180 0 180 180" fill="none" stroke="#c2410c" stroke-opacity="0.12" stroke-width="40"/>
  <!-- Corner arc, bottom-right -->
  <path d="M 1600 900 Q 1420 900 1420 720" fill="none" stroke="#334155" stroke-opacity="0.14" stroke-width="40"/>
</svg>
