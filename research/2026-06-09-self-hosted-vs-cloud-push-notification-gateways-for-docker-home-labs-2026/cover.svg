<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep dark homelab -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#0f1a22"/>
    </linearGradient>

    <!-- Container body gradient: slate with depth -->
    <linearGradient id="containerTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5a6e"/>
      <stop offset="100%" stop-color="#2a3a4e"/>
    </linearGradient>

    <linearGradient id="containerMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5e"/>
      <stop offset="100%" stop-color="#1e2d3e"/>
    </linearGradient>

    <linearGradient id="containerBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3d50"/>
      <stop offset="100%" stop-color="#172336"/>
    </linearGradient>

    <!-- Rust accent glow for pulse rings -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- LED dot gradient -->
    <radialGradient id="led" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Subtle top vignette to anchor bg -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Layer 2: Notification pulse rings (concentric, centered on hero) -->
  <!-- Outermost ring -->
  <circle cx="800" cy="450" r="340" fill="none"
    stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.22"/>
  <!-- Mid ring -->
  <circle cx="800" cy="450" r="250" fill="none"
    stroke="#c2410c" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Inner ring -->
  <circle cx="800" cy="450" r="168" fill="none"
    stroke="#d97706" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Glow disc behind containers -->
  <ellipse cx="800" cy="460" rx="220" ry="140" fill="url(#pulseGlow)"/>

  <!-- Layer 2: Hero — three stacked container chassis -->
  <!-- Bottom container -->
  <rect x="580" y="530" width="440" height="68" rx="6"
    fill="url(#containerBot)" opacity="0.88"/>
  <!-- Bottom container rack stripe -->
  <rect x="580" y="530" width="440" height="7" rx="3"
    fill="#334155" opacity="0.6"/>
  <!-- Bottom LED -->
  <circle cx="878" cy="564" r="6" fill="url(#led)" opacity="0.9"/>
  <circle cx="898" cy="564" r="6" fill="#c2410c" opacity="0.75"/>

  <!-- Middle container (slightly wider, hero emphasis) -->
  <rect x="564" y="450" width="472" height="72" rx="6"
    fill="url(#containerMid)" opacity="0.93"/>
  <rect x="564" y="450" width="472" height="8" rx="3"
    fill="#c2410c" opacity="0.55"/>
  <!-- Middle LED row -->
  <circle cx="876" cy="487" r="7" fill="url(#led)" opacity="0.95"/>
  <circle cx="897" cy="487" r="6" fill="#c2410c" opacity="0.85"/>
  <circle cx="917" cy="487" r="6" fill="#9a3309" opacity="0.7"/>

  <!-- Top container -->
  <rect x="580" y="368" width="440" height="68" rx="6"
    fill="url(#containerTop)" opacity="0.88"/>
  <rect x="580" y="368" width="440" height="7" rx="3"
    fill="#334155" opacity="0.55"/>
  <!-- Top LED -->
  <circle cx="878" cy="402" r="6" fill="url(#led)" opacity="0.85"/>
  <circle cx="898" cy="402" r="6" fill="#334155" opacity="0.6"/>

  <!-- Connector port lines on left edge of containers -->
  <rect x="570" y="475" width="18" height="8" rx="2" fill="#475569" opacity="0.7"/>
  <rect x="570" y="490" width="18" height="8" rx="2" fill="#475569" opacity="0.5"/>
  <rect x="570" y="390" width="18" height="8" rx="2" fill="#475569" opacity="0.6"/>
  <rect x="570" y="545" width="18" height="8" rx="2" fill="#475569" opacity="0.5"/>

  <!-- Signal spark trail from right side of middle container outward -->
  <!-- Three small dots diminishing to the right -->
  <circle cx="1060" cy="487" r="7" fill="#d97706" opacity="0.75"/>
  <circle cx="1095" cy="487" r="5" fill="#c2410c" opacity="0.5"/>
  <circle cx="1122" cy="487" r="3.5" fill="#9a3309" opacity="0.35"/>

  <!-- Connecting line from port to first dot -->
  <line x1="1036" y1="487" x2="1053" y2="487"
    stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Layer 3: Corner decoration (outside safe zone, atmospheric) -->
  <!-- Top-left faint arc cluster -->
  <circle cx="60" cy="60" r="90" fill="none"
    stroke="#78350f" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="60" cy="60" r="55" fill="none"
    stroke="#9a3309" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Bottom-right faint arc cluster -->
  <circle cx="1540" cy="840" r="100" fill="none"
    stroke="#334155" stroke-width="1" stroke-opacity="0.18"/>
  <circle cx="1540" cy="840" r="62" fill="none"
    stroke="#475569" stroke-width="1" stroke-opacity="0.13"/>
</svg>
