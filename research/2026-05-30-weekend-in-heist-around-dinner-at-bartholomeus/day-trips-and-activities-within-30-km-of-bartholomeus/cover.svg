<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun glow, sits within safe zone -->
  <circle cx="980" cy="430" r="320" fill="url(#sun)" opacity="0.85"/>
  <circle cx="980" cy="430" r="140" fill="#fbbf24" opacity="0.9"/>

  <!-- Distant horizon haze -->
  <rect x="0" y="540" width="1600" height="6" fill="#9a3309" opacity="0.35"/>

  <!-- Sea band -->
  <path d="M0,550 Q400,540 800,552 T1600,548 L1600,640 L0,640 Z" fill="url(#sea)" opacity="0.75"/>

  <!-- Belfry silhouette (Bruges) — inland, left of hero -->
  <g fill="#5c2a1a" opacity="0.92">
    <rect x="360" y="330" width="56" height="220"/>
    <rect x="350" y="320" width="76" height="14"/>
    <polygon points="360,330 416,330 388,250"/>
    <rect x="378" y="270" width="20" height="14" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Windmill silhouette (Damme) — right side, inside safe zone -->
  <g fill="#5c2a1a" opacity="0.92">
    <polygon points="1230,560 1280,360 1330,560"/>
    <circle cx="1280" cy="370" r="14"/>
    <g stroke="#5c2a1a" stroke-width="9" stroke-linecap="round">
      <line x1="1280" y1="370" x2="1380" y2="300"/>
      <line x1="1280" y1="370" x2="1350" y2="470"/>
      <line x1="1280" y1="370" x2="1180" y2="440"/>
      <line x1="1280" y1="370" x2="1210" y2="270"/>
    </g>
  </g>

  <!-- Foreground dune (hero anchor) -->
  <path d="M0,640 Q260,580 520,610 Q820,650 1100,600 Q1360,560 1600,610 L1600,900 L0,900 Z" fill="url(#dune)" opacity="0.95"/>

  <!-- Dune grass tufts -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="280" y1="610" x2="276" y2="585"/>
    <line x1="288" y1="612" x2="292" y2="588"/>
    <line x1="295" y1="612" x2="300" y2="592"/>
    <line x1="720" y1="628" x2="716" y2="600"/>
    <line x1="728" y1="630" x2="732" y2="604"/>
    <line x1="1040" y1="608" x2="1036" y2="582"/>
    <line x1="1048" y1="610" x2="1052" y2="586"/>
  </g>

  <!-- Stork silhouette in flight (Zwin nature park) -->
  <g fill="#5c2a1a" opacity="0.85">
    <path d="M620,300 Q660,290 700,300 Q680,308 660,306 Q640,308 620,300 Z"/>
    <path d="M700,300 Q720,294 740,302 L720,308 Z"/>
    <circle cx="704" cy="299" r="3"/>
  </g>

  <!-- Secondary smaller bird, far -->
  <path d="M820,250 Q838,244 856,250 Q840,256 820,250 Z" fill="#5c2a1a" opacity="0.7"/>

  <!-- Soft warm wash bottom edge -->
  <rect x="0" y="830" width="1600" height="70" fill="#78350f" opacity="0.4"/>
</svg>
