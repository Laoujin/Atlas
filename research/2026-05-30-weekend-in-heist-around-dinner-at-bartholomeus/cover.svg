<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.78" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- horizon sun haze -->
  <ellipse cx="800" cy="560" rx="900" ry="260" fill="url(#sun)"/>

  <!-- sea -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#sea)"/>

  <!-- subtle sea reflections -->
  <rect x="0" y="600" width="1600" height="2" fill="#fbbf24" opacity="0.25"/>
  <rect x="0" y="640" width="1600" height="1" fill="#fbbf24" opacity="0.18"/>
  <rect x="0" y="685" width="1600" height="2" fill="#fbbf24" opacity="0.14"/>
  <rect x="0" y="735" width="1600" height="1" fill="#fbbf24" opacity="0.1"/>

  <!-- promenade / Zeedijk silhouette band -->
  <rect x="0" y="555" width="1600" height="8" fill="#1a0e0e" opacity="0.7"/>

  <!-- star glow halo -->
  <circle cx="800" cy="430" r="280" fill="url(#starGlow)"/>

  <!-- hero: Michelin star, 5-point, centered (800, 430) -->
  <polygon points="800,230 845,375 996,375 874,463 920,608 800,520 680,608 726,463 604,375 755,375"
           fill="url(#starBody)" opacity="0.95" stroke="#fbbf24" stroke-width="2"/>

  <!-- inner highlight on star -->
  <polygon points="800,290 826,378 920,378 845,432 873,520 800,468 727,520 755,432 680,378 774,378"
           fill="#fbbf24" opacity="0.35"/>

  <!-- distant pier / coastal posts (decoration, low) -->
  <rect x="1180" y="540" width="3" height="22" fill="#1a0e0e" opacity="0.6"/>
  <rect x="1210" y="544" width="3" height="18" fill="#1a0e0e" opacity="0.55"/>
  <rect x="1240" y="542" width="3" height="20" fill="#1a0e0e" opacity="0.55"/>
  <rect x="1270" y="546" width="3" height="16" fill="#1a0e0e" opacity="0.5"/>

  <!-- faint dune curve foreground left -->
  <path d="M 0 820 Q 200 770 420 800 L 420 900 L 0 900 Z" fill="#1a0e0e" opacity="0.55"/>
  <path d="M 1100 815 Q 1330 775 1600 805 L 1600 900 L 1100 900 Z" fill="#1a0e0e" opacity="0.55"/>
</svg>
