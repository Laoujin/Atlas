<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="bldgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#0e0707"/>
    </linearGradient>
    <linearGradient id="bldgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1c14"/>
      <stop offset="1" stop-color="#150a08"/>
    </linearGradient>
    <linearGradient id="dyke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon / warm sun glow over the sea -->
  <circle cx="800" cy="430" r="380" fill="url(#glow)"/>
  <circle cx="800" cy="430" r="70" fill="#fbbf24" opacity="0.95"/>

  <!-- sea band -->
  <rect x="0" y="560" width="1600" height="120" fill="url(#sea)" opacity="0.85"/>
  <path d="M0,580 Q400,572 800,580 T1600,580 L1600,600 L0,600 Z" fill="#fbbf24" opacity="0.18"/>
  <path d="M0,612 Q400,604 800,612 T1600,612 L1600,624 L0,624 Z" fill="#d97706" opacity="0.22"/>

  <!-- dyke / promenade -->
  <rect x="0" y="670" width="1600" height="50" fill="url(#dyke)"/>
  <rect x="0" y="715" width="1600" height="185" fill="#1a0e0e"/>

  <!-- left building (apartment block facing sea) -->
  <rect x="230" y="230" width="280" height="440" fill="url(#bldgA)"/>
  <g fill="#fbbf24" opacity="0.85">
    <rect x="255" y="270" width="36" height="22"/>
    <rect x="315" y="270" width="36" height="22" opacity="0.5"/>
    <rect x="375" y="270" width="36" height="22"/>
    <rect x="435" y="270" width="36" height="22" opacity="0.6"/>
    <rect x="255" y="320" width="36" height="22" opacity="0.55"/>
    <rect x="315" y="320" width="36" height="22"/>
    <rect x="375" y="320" width="36" height="22" opacity="0.7"/>
    <rect x="435" y="320" width="36" height="22"/>
    <rect x="255" y="370" width="36" height="22"/>
    <rect x="315" y="370" width="36" height="22" opacity="0.45"/>
    <rect x="375" y="370" width="36" height="22"/>
    <rect x="435" y="370" width="36" height="22" opacity="0.8"/>
    <rect x="255" y="420" width="36" height="22" opacity="0.6"/>
    <rect x="315" y="420" width="36" height="22"/>
    <rect x="375" y="420" width="36" height="22" opacity="0.5"/>
    <rect x="435" y="420" width="36" height="22"/>
    <rect x="255" y="470" width="36" height="22"/>
    <rect x="315" y="470" width="36" height="22" opacity="0.7"/>
    <rect x="375" y="470" width="36" height="22" opacity="0.4"/>
    <rect x="435" y="470" width="36" height="22"/>
    <rect x="255" y="520" width="36" height="22" opacity="0.5"/>
    <rect x="315" y="520" width="36" height="22"/>
    <rect x="375" y="520" width="36" height="22"/>
    <rect x="435" y="520" width="36" height="22" opacity="0.6"/>
    <rect x="255" y="570" width="36" height="22"/>
    <rect x="315" y="570" width="36" height="22" opacity="0.55"/>
    <rect x="375" y="570" width="36" height="22" opacity="0.75"/>
    <rect x="435" y="570" width="36" height="22"/>
  </g>

  <!-- right building (taller hotel) -->
  <rect x="1090" y="170" width="300" height="500" fill="url(#bldgB)"/>
  <rect x="1090" y="170" width="300" height="20" fill="#c2410c" opacity="0.4"/>
  <g fill="#fbbf24" opacity="0.85">
    <rect x="1115" y="220" width="40" height="24"/>
    <rect x="1180" y="220" width="40" height="24" opacity="0.5"/>
    <rect x="1245" y="220" width="40" height="24"/>
    <rect x="1310" y="220" width="40" height="24" opacity="0.7"/>
    <rect x="1115" y="275" width="40" height="24" opacity="0.6"/>
    <rect x="1180" y="275" width="40" height="24"/>
    <rect x="1245" y="275" width="40" height="24" opacity="0.5"/>
    <rect x="1310" y="275" width="40" height="24"/>
    <rect x="1115" y="330" width="40" height="24"/>
    <rect x="1180" y="330" width="40" height="24" opacity="0.45"/>
    <rect x="1245" y="330" width="40" height="24" opacity="0.8"/>
    <rect x="1310" y="330" width="40" height="24"/>
    <rect x="1115" y="385" width="40" height="24" opacity="0.55"/>
    <rect x="1180" y="385" width="40" height="24"/>
    <rect x="1245" y="385" width="40" height="24"/>
    <rect x="1310" y="385" width="40" height="24" opacity="0.5"/>
    <rect x="1115" y="440" width="40" height="24"/>
    <rect x="1180" y="440" width="40" height="24" opacity="0.7"/>
    <rect x="1245" y="440" width="40" height="24" opacity="0.4"/>
    <rect x="1310" y="440" width="40" height="24"/>
    <rect x="1115" y="495" width="40" height="24" opacity="0.6"/>
    <rect x="1180" y="495" width="40" height="24"/>
    <rect x="1245" y="495" width="40" height="24" opacity="0.55"/>
    <rect x="1310" y="495" width="40" height="24"/>
    <rect x="1115" y="550" width="40" height="24"/>
    <rect x="1180" y="550" width="40" height="24" opacity="0.5"/>
    <rect x="1245" y="550" width="40" height="24"/>
    <rect x="1310" y="550" width="40" height="24" opacity="0.7"/>
    <rect x="1115" y="605" width="40" height="24" opacity="0.65"/>
    <rect x="1180" y="605" width="40" height="24"/>
    <rect x="1245" y="605" width="40" height="24" opacity="0.45"/>
    <rect x="1310" y="605" width="40" height="24"/>
  </g>

  <!-- map pin marker on the promenade -->
  <g transform="translate(800, 745)">
    <ellipse cx="0" cy="42" rx="28" ry="6" fill="#000" opacity="0.5"/>
    <path d="M0,-50 C-26,-50 -42,-30 -42,-10 C-42,15 0,55 0,55 C0,55 42,15 42,-10 C42,-30 26,-50 0,-50 Z" fill="#c2410c"/>
    <path d="M0,-50 C-26,-50 -42,-30 -42,-10 C-42,15 0,55 0,55 C0,55 42,15 42,-10 C42,-30 26,-50 0,-50 Z" fill="url(#dyke)" opacity="0.6"/>
    <circle cx="0" cy="-12" r="14" fill="#faf8f2"/>
    <circle cx="0" cy="-12" r="7" fill="#9a3309"/>
  </g>

  <!-- subtle horizon shimmer -->
  <rect x="0" y="558" width="1600" height="2" fill="#fbbf24" opacity="0.4"/>
</svg>
