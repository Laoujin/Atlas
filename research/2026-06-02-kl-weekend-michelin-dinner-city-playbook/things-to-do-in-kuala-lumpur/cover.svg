<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.8" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="0.6" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm evening glow behind towers -->
  <circle cx="800" cy="560" r="520" fill="url(#sun)"/>

  <!-- distant skyline silhouettes (decoration, can be cropped) -->
  <g fill="#1a0e0e" opacity="0.55">
    <rect x="60" y="700" width="80" height="200"/>
    <rect x="150" y="660" width="50" height="240"/>
    <rect x="210" y="720" width="70" height="180"/>
    <rect x="1320" y="690" width="60" height="210"/>
    <rect x="1390" y="650" width="90" height="250"/>
    <rect x="1490" y="710" width="80" height="190"/>
  </g>

  <!-- Petronas Twin Towers (hero) - left tower -->
  <g fill="url(#tower)" opacity="0.95">
    <!-- left tower body -->
    <polygon points="640,780 640,360 660,340 660,300 700,260 740,300 740,340 760,360 760,780"/>
    <!-- left tower spire -->
    <rect x="697" y="160" width="6" height="100"/>
    <circle cx="700" cy="240" r="14" fill="#9a3309"/>
    <circle cx="700" cy="210" r="9" fill="#78350f"/>
  </g>

  <g fill="url(#tower)" opacity="0.95">
    <!-- right tower body -->
    <polygon points="840,780 840,360 860,340 860,300 900,260 940,300 940,340 960,360 960,780"/>
    <!-- right tower spire -->
    <rect x="897" y="160" width="6" height="100"/>
    <circle cx="900" cy="240" r="14" fill="#9a3309"/>
    <circle cx="900" cy="210" r="9" fill="#78350f"/>
  </g>

  <!-- skybridge connecting the towers -->
  <g fill="#78350f" opacity="0.9">
    <rect x="760" y="470" width="80" height="14"/>
    <line x1="770" y1="470" x2="770" y2="440" stroke="#78350f" stroke-width="3"/>
    <line x1="830" y1="470" x2="830" y2="440" stroke="#78350f" stroke-width="3"/>
    <rect x="768" y="438" width="64" height="4"/>
  </g>

  <!-- window light dots on towers (warm rose/amber accents) -->
  <g fill="#fbbf24" opacity="0.75">
    <circle cx="680" cy="420" r="2.5"/>
    <circle cx="700" cy="450" r="2.5"/>
    <circle cx="720" cy="500" r="2.5"/>
    <circle cx="690" cy="550" r="2.5"/>
    <circle cx="710" cy="600" r="2.5"/>
    <circle cx="680" cy="650" r="2.5"/>
    <circle cx="720" cy="700" r="2.5"/>
    <circle cx="880" cy="420" r="2.5"/>
    <circle cx="900" cy="450" r="2.5"/>
    <circle cx="920" cy="500" r="2.5"/>
    <circle cx="890" cy="550" r="2.5"/>
    <circle cx="910" cy="600" r="2.5"/>
    <circle cx="880" cy="650" r="2.5"/>
    <circle cx="920" cy="700" r="2.5"/>
  </g>
  <g fill="#be185d" opacity="0.6">
    <circle cx="700" cy="480" r="2"/>
    <circle cx="710" cy="630" r="2"/>
    <circle cx="900" cy="480" r="2"/>
    <circle cx="890" cy="630" r="2"/>
  </g>

  <!-- foreground ground/horizon -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#skyline)"/>
</svg>
