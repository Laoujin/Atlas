<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Central candlelight glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient - main plate -->
    <radialGradient id="plateMain" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="transparent"/>
      <stop offset="78%" stop-color="#78350f" stop-opacity="0.25"/>
      <stop offset="88%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Small accent plate gradient -->
    <radialGradient id="plateSmall" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="65%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>
    <!-- Food accent on plate - warm centre dot -->
    <radialGradient id="foodAccent" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="55%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Rose sauce drizzle accent -->
    <radialGradient id="sauce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Table surface gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a0a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient candlelight glow spread -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Table surface suggestion at bottom -->
  <ellipse cx="800" cy="820" rx="780" ry="120" fill="url(#table)"/>

  <!-- Layer 2: Hero element — fine-dining plate composition, centred ~(800,450) -->

  <!-- Main plate shadow -->
  <ellipse cx="810" cy="498" rx="224" ry="32" fill="#000" opacity="0.35"/>

  <!-- Main plate body -->
  <circle cx="800" cy="460" r="210" fill="url(#plateMain)"/>
  <!-- Plate rim ring -->
  <circle cx="800" cy="460" r="210" fill="url(#plateRim)"/>
  <!-- Inner well of plate (slightly recessed look) -->
  <circle cx="800" cy="456" r="155" fill="#faf8f2" opacity="0.55"/>

  <!-- Food presentation: central protein/element -->
  <ellipse cx="800" cy="450" rx="52" ry="44" fill="url(#foodAccent)" opacity="0.92"/>
  <!-- Rose sauce arc drizzle on plate -->
  <path d="M 758 430 Q 800 400 842 430 Q 858 455 842 470 Q 800 490 758 470 Q 742 455 758 430 Z" fill="none" stroke="#be185d" stroke-width="5" stroke-opacity="0.7" fill-opacity="0"/>
  <!-- Small sauce dot accents -->
  <circle cx="730" cy="448" r="7" fill="url(#sauce)" opacity="0.8"/>
  <circle cx="870" cy="448" r="7" fill="url(#sauce)" opacity="0.8"/>
  <circle cx="800" cy="415" r="5" fill="url(#sauce)" opacity="0.65"/>

  <!-- Secondary smaller plate (offset left-rear, partial) -->
  <ellipse cx="557" cy="476" rx="140" ry="20" fill="#000" opacity="0.22"/>
  <circle cx="548" cy="442" r="132" fill="url(#plateSmall)" opacity="0.88"/>
  <circle cx="548" cy="442" r="132" fill="url(#plateRim)" opacity="0.7"/>
  <circle cx="548" cy="439" r="95" fill="#fef3ec" opacity="0.45"/>
  <!-- Small food element on secondary plate -->
  <ellipse cx="548" cy="434" rx="28" ry="24" fill="#c2410c" opacity="0.75"/>
  <circle cx="535" cy="428" r="5" fill="#be185d" opacity="0.7"/>
  <circle cx="562" cy="428" r="5" fill="#be185d" opacity="0.7"/>

  <!-- Wine glass silhouette (right side, slightly behind main plate) -->
  <!-- Bowl of glass -->
  <path d="M 1040 280 Q 1090 360 1090 420 Q 1090 490 1030 510 Q 970 490 970 420 Q 970 360 1020 280 Z" fill="url(#glass)" opacity="0.7"/>
  <!-- Stem -->
  <rect x="1025" y="508" width="10" height="120" fill="#fbbf24" fill-opacity="0.18"/>
  <!-- Base -->
  <ellipse cx="1030" cy="630" rx="42" ry="7" fill="#fbbf24" fill-opacity="0.2"/>
  <!-- Wine level inside glass -->
  <path d="M 975 440 Q 1030 460 1085 440 Q 1082 490 1030 505 Q 978 490 975 440 Z" fill="#9a3309" fill-opacity="0.35"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone, atmospheric) -->
  <!-- Top-left warm candle flicker suggestion -->
  <ellipse cx="120" cy="80" rx="90" ry="60" fill="#d97706" opacity="0.08"/>
  <!-- Bottom-right corner warm wash -->
  <ellipse cx="1520" cy="860" rx="160" ry="90" fill="#c2410c" opacity="0.07"/>
  <!-- Subtle table cloth edge highlight -->
  <ellipse cx="800" cy="898" rx="700" ry="18" fill="#3d1a0a" opacity="0.6"/>
</svg>
