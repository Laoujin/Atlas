<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="700" ry="380" fill="url(#glow)"/>

  <!-- LEFT: speech bubble (ChatGPT refine stage) -->
  <g opacity="0.95">
    <path d="M 220 230
             Q 220 190 260 190
             L 660 190
             Q 700 190 700 230
             L 700 510
             Q 700 550 660 550
             L 360 550
             L 290 620
             L 310 550
             L 260 550
             Q 220 550 220 510 Z"
          fill="url(#bubble)" stroke="#78350f" stroke-width="3"/>
    <!-- prompt lines inside bubble -->
    <rect x="270" y="260" width="380" height="14" rx="6" fill="#78350f" opacity="0.55"/>
    <rect x="270" y="300" width="320" height="14" rx="6" fill="#78350f" opacity="0.45"/>
    <rect x="270" y="340" width="360" height="14" rx="6" fill="#78350f" opacity="0.40"/>
    <rect x="270" y="380" width="240" height="14" rx="6" fill="#0e7490" opacity="0.60"/>
    <rect x="270" y="420" width="300" height="14" rx="6" fill="#78350f" opacity="0.35"/>
    <rect x="270" y="460" width="200" height="14" rx="6" fill="#78350f" opacity="0.30"/>
  </g>

  <!-- ARROW handoff -->
  <g opacity="0.92">
    <path d="M 740 405
             L 870 405
             L 870 375
             L 940 425
             L 870 475
             L 870 445
             L 740 445 Z"
          fill="url(#arrow)" stroke="#5c2a1a" stroke-width="2"/>
  </g>

  <!-- RIGHT: build canvas (Lovable) -->
  <g opacity="0.95">
    <!-- canvas frame -->
    <rect x="970" y="190" width="460" height="360" rx="14" fill="url(#canvas)" stroke="#5c2a1a" stroke-width="3"/>
    <!-- title bar -->
    <rect x="970" y="190" width="460" height="42" rx="14" fill="#5c2a1a"/>
    <rect x="970" y="218" width="460" height="14" fill="#5c2a1a"/>
    <circle cx="998" cy="211" r="6" fill="#fbbf24" opacity="0.85"/>
    <circle cx="1018" cy="211" r="6" fill="#d97706" opacity="0.85"/>
    <circle cx="1038" cy="211" r="6" fill="#fef3ec" opacity="0.6"/>
    <!-- generated UI elements inside canvas -->
    <rect x="1000" y="260" width="180" height="100" rx="8" fill="#fef3ec" opacity="0.85"/>
    <rect x="1200" y="260" width="200" height="100" rx="8" fill="#fbbf24" opacity="0.55"/>
    <rect x="1000" y="380" width="400" height="22" rx="6" fill="#fef3ec" opacity="0.7"/>
    <rect x="1000" y="412" width="320" height="22" rx="6" fill="#fef3ec" opacity="0.55"/>
    <rect x="1000" y="444" width="360" height="22" rx="6" fill="#fef3ec" opacity="0.45"/>
    <!-- teal accent button -->
    <rect x="1000" y="490" width="130" height="40" rx="8" fill="#0e7490" opacity="0.85"/>
    <rect x="1150" y="490" width="100" height="40" rx="8" fill="#fef3ec" opacity="0.4" stroke="#fef3ec" stroke-width="2"/>
  </g>

  <!-- subtle ground shadow under both forms -->
  <ellipse cx="460" cy="640" rx="240" ry="10" fill="#78350f" opacity="0.12"/>
  <ellipse cx="1200" cy="640" rx="240" ry="10" fill="#78350f" opacity="0.12"/>
</svg>
