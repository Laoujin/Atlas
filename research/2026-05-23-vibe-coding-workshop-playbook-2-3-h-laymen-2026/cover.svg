<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="650" ry="380" fill="url(#glow)"/>

  <!-- presenter desk / table line (full-bleed decoration) -->
  <rect x="0" y="760" width="1600" height="6" fill="#78350f" opacity="0.18"/>
  <rect x="0" y="770" width="1600" height="130" fill="#78350f" opacity="0.08"/>

  <!-- LEFT panel: chat bubbles (ChatGPT refine) -->
  <g transform="translate(280 200)">
    <!-- laptop/screen frame -->
    <rect x="0" y="0" width="440" height="380" rx="14" fill="url(#chat)"/>
    <rect x="0" y="0" width="440" height="32" rx="14" fill="#3b0f7a" opacity="0.85"/>
    <circle cx="20" cy="16" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="38" cy="16" r="5" fill="#c2410c" opacity="0.7"/>
    <circle cx="56" cy="16" r="5" fill="#9a3309" opacity="0.6"/>

    <!-- incoming bubble -->
    <rect x="30" y="70" width="220" height="50" rx="14" fill="#faf8f2" opacity="0.92"/>
    <rect x="46" y="86" width="160" height="6" rx="3" fill="#6d28d9" opacity="0.45"/>
    <rect x="46" y="100" width="110" height="6" rx="3" fill="#6d28d9" opacity="0.3"/>

    <!-- outgoing bubble -->
    <rect x="170" y="150" width="240" height="60" rx="14" fill="#fbbf24" opacity="0.85"/>
    <rect x="188" y="168" width="200" height="6" rx="3" fill="#78350f" opacity="0.6"/>
    <rect x="188" y="184" width="150" height="6" rx="3" fill="#78350f" opacity="0.45"/>

    <!-- incoming bubble 2 -->
    <rect x="30" y="240" width="280" height="80" rx="14" fill="#faf8f2" opacity="0.92"/>
    <rect x="46" y="258" width="240" height="6" rx="3" fill="#6d28d9" opacity="0.45"/>
    <rect x="46" y="274" width="200" height="6" rx="3" fill="#6d28d9" opacity="0.35"/>
    <rect x="46" y="290" width="160" height="6" rx="3" fill="#6d28d9" opacity="0.25"/>

    <!-- screen stand -->
    <rect x="200" y="380" width="40" height="22" fill="#3b0f7a" opacity="0.6"/>
    <rect x="160" y="400" width="120" height="8" rx="3" fill="#3b0f7a" opacity="0.5"/>
  </g>

  <!-- ARROW: chat → app (refine to build) -->
  <g transform="translate(740 420)">
    <path d="M 0 30 L 100 30 L 100 10 L 140 40 L 100 70 L 100 50 L 0 50 Z" fill="url(#arrow)" opacity="0.9"/>
    <circle cx="20" cy="40" r="4" fill="#fbbf24" opacity="0.9"/>
    <circle cx="50" cy="40" r="4" fill="#fbbf24" opacity="0.7"/>
    <circle cx="80" cy="40" r="4" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- RIGHT panel: built app (Lovable output) -->
  <g transform="translate(900 200)">
    <!-- browser frame -->
    <rect x="0" y="0" width="440" height="380" rx="14" fill="url(#app)"/>
    <rect x="0" y="0" width="440" height="32" rx="14" fill="#5c2a1a" opacity="0.85"/>
    <circle cx="20" cy="16" r="5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="38" cy="16" r="5" fill="#faf8f2" opacity="0.5"/>
    <circle cx="56" cy="16" r="5" fill="#faf8f2" opacity="0.4"/>
    <rect x="80" y="9" width="340" height="14" rx="7" fill="#5c2a1a" opacity="0.55"/>

    <!-- app hero block -->
    <rect x="30" y="60" width="380" height="90" rx="8" fill="#faf8f2" opacity="0.88"/>
    <rect x="50" y="82" width="200" height="10" rx="4" fill="#9a3309" opacity="0.7"/>
    <rect x="50" y="102" width="280" height="6" rx="3" fill="#9a3309" opacity="0.4"/>
    <rect x="50" y="116" width="240" height="6" rx="3" fill="#9a3309" opacity="0.35"/>

    <!-- cards row -->
    <rect x="30" y="170" width="115" height="120" rx="8" fill="#faf8f2" opacity="0.85"/>
    <rect x="158" y="170" width="115" height="120" rx="8" fill="#faf8f2" opacity="0.85"/>
    <rect x="286" y="170" width="124" height="120" rx="8" fill="#faf8f2" opacity="0.85"/>
    <circle cx="87" cy="210" r="18" fill="#d97706" opacity="0.85"/>
    <circle cx="215" cy="210" r="18" fill="#6d28d9" opacity="0.75"/>
    <circle cx="348" cy="210" r="18" fill="#c2410c" opacity="0.85"/>
    <rect x="50" y="248" width="75" height="6" rx="3" fill="#78350f" opacity="0.5"/>
    <rect x="178" y="248" width="75" height="6" rx="3" fill="#78350f" opacity="0.5"/>
    <rect x="306" y="248" width="84" height="6" rx="3" fill="#78350f" opacity="0.5"/>
    <rect x="50" y="262" width="55" height="5" rx="2" fill="#78350f" opacity="0.35"/>
    <rect x="178" y="262" width="55" height="5" rx="2" fill="#78350f" opacity="0.35"/>
    <rect x="306" y="262" width="65" height="5" rx="2" fill="#78350f" opacity="0.35"/>

    <!-- ship button -->
    <rect x="160" y="310" width="120" height="36" rx="18" fill="#c2410c" opacity="0.95"/>

    <!-- screen stand -->
    <rect x="200" y="380" width="40" height="22" fill="#5c2a1a" opacity="0.6"/>
    <rect x="160" y="400" width="120" height="8" rx="3" fill="#5c2a1a" opacity="0.5"/>
  </g>

  <!-- audience silhouette dots (workshop feel, full-bleed bottom decoration) -->
  <g opacity="0.5">
    <circle cx="120" cy="820" r="22" fill="#78350f"/>
    <rect x="98" y="838" width="44" height="62" rx="10" fill="#78350f"/>
    <circle cx="340" cy="830" r="20" fill="#5c2a1a"/>
    <rect x="320" y="846" width="40" height="54" rx="10" fill="#5c2a1a"/>
    <circle cx="1260" cy="828" r="21" fill="#5c2a1a"/>
    <rect x="1239" y="845" width="42" height="55" rx="10" fill="#5c2a1a"/>
    <circle cx="1470" cy="822" r="22" fill="#78350f"/>
    <rect x="1448" y="840" width="44" height="60" rx="10" fill="#78350f"/>
  </g>
</svg>
