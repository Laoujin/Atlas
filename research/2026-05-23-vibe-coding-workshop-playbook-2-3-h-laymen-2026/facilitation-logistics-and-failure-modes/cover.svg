<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="460" r="520" fill="url(#glow)"/>

  <!-- back card -->
  <rect x="520" y="210" width="620" height="420" rx="18" fill="url(#cardBack)" opacity="0.5" transform="rotate(-6 830 420)"/>

  <!-- mid card -->
  <rect x="500" y="230" width="640" height="430" rx="20" fill="#78350f" opacity="0.75" transform="rotate(-2 820 445)"/>

  <!-- hero card -->
  <g>
    <rect x="480" y="240" width="660" height="440" rx="22" fill="url(#card)"/>
    <!-- checklist rows: rounded boxes (checks) + bars (lines) -->
    <rect x="520" y="290" width="36" height="36" rx="8" fill="#faf8f2" opacity="0.95"/>
    <rect x="572" y="298" width="380" height="20" rx="6" fill="#faf8f2" opacity="0.85"/>

    <rect x="520" y="350" width="36" height="36" rx="8" fill="#faf8f2" opacity="0.95"/>
    <rect x="572" y="358" width="430" height="20" rx="6" fill="#faf8f2" opacity="0.85"/>

    <rect x="520" y="410" width="36" height="36" rx="8" fill="#faf8f2" opacity="0.95"/>
    <rect x="572" y="418" width="320" height="20" rx="6" fill="#faf8f2" opacity="0.85"/>

    <!-- third row: a branching fork (success vs failure path) -->
    <rect x="520" y="470" width="36" height="36" rx="8" fill="#1a0e0e" opacity="0.6"/>
    <path d="M 572 488 L 760 488 L 820 458 L 980 458" fill="none" stroke="#faf8f2" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M 760 488 L 820 518 L 980 518" fill="none" stroke="#1a0e0e" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <circle cx="990" cy="458" r="12" fill="#faf8f2"/>
    <circle cx="990" cy="518" r="12" fill="#1a0e0e" opacity="0.6"/>

    <rect x="520" y="540" width="36" height="36" rx="8" fill="#faf8f2" opacity="0.95"/>
    <rect x="572" y="548" width="260" height="20" rx="6" fill="#faf8f2" opacity="0.85"/>

    <rect x="520" y="600" width="36" height="36" rx="8" fill="#faf8f2" opacity="0.55"/>
    <rect x="572" y="608" width="200" height="20" rx="6" fill="#faf8f2" opacity="0.55"/>
  </g>

  <!-- corner accents (out of safe zone) -->
  <circle cx="80" cy="80" r="60" fill="#c2410c" opacity="0.18"/>
  <circle cx="1520" cy="830" r="90" fill="#9a3309" opacity="0.22"/>
</svg>
