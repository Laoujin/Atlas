<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Back window: tilted left -->
  <g transform="translate(560 280) rotate(-9)" opacity="0.9">
    <rect width="620" height="420" rx="14" fill="url(#back)"/>
    <circle cx="30" cy="28" r="6" fill="#faf8f2" opacity="0.5"/>
    <circle cx="52" cy="28" r="6" fill="#faf8f2" opacity="0.5"/>
    <circle cx="74" cy="28" r="6" fill="#faf8f2" opacity="0.5"/>
    <rect x="30" y="80" width="380" height="10" rx="3" fill="#faf8f2" opacity="0.35"/>
    <rect x="30" y="110" width="280" height="10" rx="3" fill="#faf8f2" opacity="0.25"/>
    <rect x="60" y="140" width="320" height="10" rx="3" fill="#faf8f2" opacity="0.25"/>
    <rect x="60" y="170" width="220" height="10" rx="3" fill="#faf8f2" opacity="0.2"/>
    <rect x="30" y="210" width="360" height="10" rx="3" fill="#faf8f2" opacity="0.25"/>
  </g>

  <!-- Middle window: subtle tilt right -->
  <g transform="translate(620 260) rotate(5)" opacity="0.93">
    <rect width="640" height="440" rx="14" fill="url(#mid)"/>
    <circle cx="32" cy="30" r="6" fill="#fbbf24" opacity="0.65"/>
    <circle cx="54" cy="30" r="6" fill="#fbbf24" opacity="0.5"/>
    <circle cx="76" cy="30" r="6" fill="#fbbf24" opacity="0.4"/>
    <rect x="32" y="84" width="420" height="10" rx="3" fill="#fbbf24" opacity="0.35"/>
    <rect x="32" y="114" width="300" height="10" rx="3" fill="#fbbf24" opacity="0.25"/>
    <rect x="64" y="144" width="360" height="10" rx="3" fill="#fbbf24" opacity="0.28"/>
    <rect x="64" y="174" width="240" height="10" rx="3" fill="#fbbf24" opacity="0.22"/>
    <rect x="32" y="214" width="400" height="10" rx="3" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- Hero window: rust, centered, slight forward tilt -->
  <g transform="translate(500 230) rotate(-2)">
    <rect width="700" height="480" rx="16" fill="url(#hero)"/>
    <rect width="700" height="56" rx="16" fill="#78350f" opacity="0.45"/>
    <rect y="40" width="700" height="16" fill="#78350f" opacity="0.45"/>
    <circle cx="34" cy="28" r="7" fill="#fef3ec" opacity="0.85"/>
    <circle cx="58" cy="28" r="7" fill="#fef3ec" opacity="0.75"/>
    <circle cx="82" cy="28" r="7" fill="#fef3ec" opacity="0.65"/>
    <!-- prompt bar -->
    <rect x="40" y="96" width="500" height="36" rx="8" fill="#faf8f2" opacity="0.92"/>
    <rect x="56" y="110" width="180" height="8" rx="3" fill="#c2410c" opacity="0.55"/>
    <rect x="560" y="96" width="100" height="36" rx="8" fill="#78350f" opacity="0.7"/>
    <!-- "rendered preview" bars -->
    <rect x="40" y="170" width="620" height="14" rx="4" fill="#faf8f2" opacity="0.55"/>
    <rect x="40" y="200" width="460" height="14" rx="4" fill="#faf8f2" opacity="0.45"/>
    <rect x="40" y="230" width="540" height="14" rx="4" fill="#faf8f2" opacity="0.45"/>
    <!-- card cluster -->
    <rect x="40" y="280" width="190" height="160" rx="10" fill="#faf8f2" opacity="0.3"/>
    <rect x="255" y="280" width="190" height="160" rx="10" fill="#faf8f2" opacity="0.3"/>
    <rect x="470" y="280" width="190" height="160" rx="10" fill="#faf8f2" opacity="0.3"/>
    <circle cx="135" cy="340" r="22" fill="#fbbf24" opacity="0.85"/>
    <circle cx="350" cy="340" r="22" fill="#fbbf24" opacity="0.7"/>
    <circle cx="565" cy="340" r="22" fill="#fbbf24" opacity="0.55"/>
    <rect x="70" y="390" width="130" height="8" rx="3" fill="#faf8f2" opacity="0.6"/>
    <rect x="285" y="390" width="130" height="8" rx="3" fill="#faf8f2" opacity="0.55"/>
    <rect x="500" y="390" width="130" height="8" rx="3" fill="#faf8f2" opacity="0.5"/>
  </g>

  <!-- small spark hinting "ship it" -->
  <circle cx="1230" cy="245" r="10" fill="#fbbf24" opacity="0.85"/>
  <circle cx="1255" cy="220" r="5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1205" cy="220" r="4" fill="#d97706" opacity="0.7"/>
</svg>
