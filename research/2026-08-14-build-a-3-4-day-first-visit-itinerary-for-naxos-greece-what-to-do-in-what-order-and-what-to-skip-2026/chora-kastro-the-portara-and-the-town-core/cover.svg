<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="500" r="300" fill="url(#sun)"/>

  <!-- Chora hillside terraces behind the gate -->
  <path d="M0 690 L250 640 L470 665 L700 620 L960 660 L1240 615 L1600 655 L1600 720 L0 720 Z"
        fill="#9a3309" opacity="0.28"/>
  <path d="M0 700 L300 675 L620 700 L900 672 L1220 698 L1600 672 L1600 720 L0 720 Z"
        fill="#78350f" opacity="0.4"/>

  <rect x="0" y="700" width="1600" height="200" fill="url(#sea)"/>

  <!-- Portara: freestanding marble doorframe -->
  <path fill-rule="evenodd" fill="url(#stone)" opacity="0.95"
        d="M566 206 L1034 206 L1034 706 L956 706 L956 302 L644 302 L644 706 L566 706 Z"/>
  <rect x="566" y="206" width="468" height="26" fill="#fbbf24" opacity="0.45"/>
  <rect x="566" y="286" width="468" height="16" fill="#1a0e0e" opacity="0.18"/>

  <!-- Palatia rock the gate stands on -->
  <path d="M470 706 L1130 706 L1200 744 L400 744 Z" fill="#5c2a1a" opacity="0.75"/>
</svg>
