<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: radial glow behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="380" fill="url(#glow)"/>

  <!-- Layer 3: hero — concentric orbits + nodes + hub -->

  <!-- Outer orbit -->
  <ellipse cx="800" cy="450" rx="320" ry="185" fill="none" stroke="#c2410c" stroke-width="1.2" opacity="0.35"/>
  <!-- Middle orbit -->
  <ellipse cx="800" cy="450" rx="220" ry="127" fill="none" stroke="#d97706" stroke-width="1.4" opacity="0.45"/>
  <!-- Inner orbit -->
  <ellipse cx="800" cy="450" rx="128" ry="74" fill="none" stroke="#6d28d9" stroke-width="1.4" opacity="0.5"/>

  <!-- Edge lines from hub to outer nodes -->
  <line x1="800" y1="450" x2="1120" y2="450" stroke="#c2410c" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="450" x2="624" y2="285" stroke="#6d28d9" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="450" x2="976" y2="615" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="450" x2="480" y2="450" stroke="#c2410c" stroke-width="1" opacity="0.25"/>
  <line x1="800" y1="450" x2="930" y2="322" stroke="#6d28d9" stroke-width="1" opacity="0.25"/>

  <!-- Outer orbit nodes -->
  <circle cx="1120" cy="450" r="14" fill="url(#nodeRust)" opacity="0.85"/>
  <circle cx="480" cy="450" r="11" fill="url(#nodeViolet)" opacity="0.75"/>
  <circle cx="624" cy="285" r="12" fill="url(#nodeViolet)" opacity="0.8"/>
  <circle cx="976" cy="615" r="13" fill="url(#nodeRust)" opacity="0.8"/>

  <!-- Middle orbit nodes -->
  <circle cx="1020" cy="450" r="9" fill="url(#nodeRust)" opacity="0.7"/>
  <circle cx="930" cy="322" r="10" fill="url(#nodeViolet)" opacity="0.75"/>
  <circle cx="670" cy="570" r="8" fill="url(#nodeViolet)" opacity="0.65"/>

  <!-- Inner orbit nodes -->
  <circle cx="928" cy="450" r="7" fill="url(#nodeRust)" opacity="0.8"/>
  <circle cx="760" cy="381" r="6" fill="url(#nodeViolet)" opacity="0.7"/>

  <!-- Hub -->
  <circle cx="800" cy="450" r="36" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="22" fill="#fbbf24" opacity="0.55"/>

  <!-- Corner decoration (outside safe zone, purely atmospheric) -->
  <ellipse cx="0" cy="0" rx="180" ry="180" fill="#6d28d9" opacity="0.07"/>
  <ellipse cx="1600" cy="900" rx="200" ry="200" fill="#c2410c" opacity="0.06"/>
</svg>
