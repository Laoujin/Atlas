<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1410"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm radial glow behind plate -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plateGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c5b0"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="rimGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#b8a898"/>
    </radialGradient>
    <!-- Cloche gradient -->
    <linearGradient id="clocheGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3d1a08"/>
    </linearGradient>
    <!-- Star accent gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Rose accent gradient for food detail -->
    <radialGradient id="roseAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Edge vignette corners for atmosphere -->
  <rect x="0" y="0" width="500" height="900" fill="#1a0e0e" opacity="0.35"/>
  <rect x="1100" y="0" width="500" height="900" fill="#1a0e0e" opacity="0.35"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone x:125-1475, y:90-810 -->

  <!-- Warm glow halo behind plate, ~700px wide -->
  <ellipse cx="800" cy="460" rx="370" ry="330" fill="url(#glow)"/>

  <!-- Rose atmospheric accent (secondary hue) -->
  <ellipse cx="800" cy="490" rx="180" ry="120" fill="url(#roseAccent)" opacity="0.55"/>

  <!-- Plate rim (outer ring) -->
  <circle cx="800" cy="480" r="280" fill="url(#rimGrad)" opacity="0.92"/>

  <!-- Plate surface (inner dish) -->
  <circle cx="800" cy="480" r="240" fill="url(#plateGrad)" opacity="0.97"/>

  <!-- Plate inner well shadow -->
  <circle cx="800" cy="488" r="180" fill="#1a0e0e" opacity="0.06"/>

  <!-- Cloche dome — silhouette atop the plate -->
  <!-- Dome arc: half-ellipse sitting on a base bar -->
  <ellipse cx="800" cy="350" rx="195" ry="145" fill="url(#clocheGrad)" opacity="0.88"/>
  <!-- Cloche base bar -->
  <rect x="595" y="458" width="410" height="24" rx="6" fill="#78350f" opacity="0.90"/>
  <!-- Cloche highlight sheen -->
  <ellipse cx="755" cy="302" rx="55" ry="28" fill="#fef3ec" opacity="0.10"/>
  <!-- Cloche knob -->
  <circle cx="800" cy="210" r="20" fill="#c2410c" opacity="0.95"/>
  <circle cx="800" cy="210" r="10" fill="#fbbf24" opacity="0.80"/>

  <!-- Three Michelin stars — abstract star shapes, decorative accent -->
  <!-- Star 1 (left) -->
  <g transform="translate(680, 660)">
    <circle r="14" fill="url(#starGlow)" opacity="0.92"/>
    <polygon points="0,-11 3,-4 10,-4 5,1 7,8 0,4 -7,8 -5,1 -10,-4 -3,-4" fill="#fbbf24" opacity="0.95"/>
  </g>
  <!-- Star 2 (center) -->
  <g transform="translate(800, 660)">
    <circle r="16" fill="url(#starGlow)" opacity="0.95"/>
    <polygon points="0,-12 3.5,-4.5 11,-4.5 5.5,1 7.5,9 0,4.5 -7.5,9 -5.5,1 -11,-4.5 -3.5,-4.5" fill="#fbbf24" opacity="0.97"/>
  </g>
  <!-- Star 3 (right) -->
  <g transform="translate(920, 660)">
    <circle r="14" fill="url(#starGlow)" opacity="0.92"/>
    <polygon points="0,-11 3,-4 10,-4 5,1 7,8 0,4 -7,8 -5,1 -10,-4 -3,-4" fill="#fbbf24" opacity="0.95"/>
  </g>

  <!-- Plate reflection line — subtle elegance detail -->
  <ellipse cx="800" cy="480" r="240" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.12"/>
  <ellipse cx="800" cy="480" r="280" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.18"/>

  <!-- Layer 3: Decorative full-bleed bottom edge (outside safe zone, atmospheric) -->
  <rect x="0" y="820" width="1600" height="80" fill="#1a0e0e" opacity="0.55"/>
  <rect x="0" y="0" width="1600" height="70" fill="#1a0e0e" opacity="0.40"/>
</svg>
