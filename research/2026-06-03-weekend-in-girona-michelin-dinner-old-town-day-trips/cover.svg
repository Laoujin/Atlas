<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#2a0f0f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>

    <!-- Warm table glow behind plates -->
    <radialGradient id="tableGlow" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Left plate gradient -->
    <radialGradient id="plateL" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="70%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>

    <!-- Right plate gradient -->
    <radialGradient id="plateR" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="70%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>

    <!-- Plate rim ring gradient -->
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Food element on plate (artistic sauce arc) -->
    <radialGradient id="foodAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>

    <!-- Wine glass body gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Wine liquid gradient -->
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Warm ambient table glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Layer 2: Hero element — two plates + wine glass, centered in safe zone -->

  <!-- Subtle plate shadow left -->
  <ellipse cx="620" cy="560" rx="215" ry="30" fill="#000" opacity="0.35"/>
  <!-- Subtle plate shadow right -->
  <ellipse cx="980" cy="560" rx="215" ry="30" fill="#000" opacity="0.35"/>

  <!-- Left plate -->
  <circle cx="620" cy="480" r="200" fill="url(#plateL)" opacity="0.95"/>
  <!-- Left plate rim ring -->
  <circle cx="620" cy="480" r="200" fill="url(#rimGlow)" opacity="1"/>
  <circle cx="620" cy="480" r="200" fill="none" stroke="#d97706" stroke-width="3" opacity="0.5"/>
  <!-- Left plate inner well -->
  <circle cx="620" cy="480" r="155" fill="none" stroke="#c8b89a" stroke-width="1.5" opacity="0.6"/>
  <!-- Left plate food: artistic arc sauce -->
  <path d="M 555 450 Q 600 410 660 440 Q 700 460 680 500 Q 650 530 610 510 Q 570 490 555 450 Z"
        fill="url(#foodAccent)" opacity="0.85"/>
  <!-- Left plate food highlight dot -->
  <circle cx="598" cy="458" r="18" fill="#fbbf24" opacity="0.55"/>

  <!-- Right plate -->
  <circle cx="980" cy="480" r="200" fill="url(#plateR)" opacity="0.95"/>
  <!-- Right plate rim ring -->
  <circle cx="980" cy="480" r="200" fill="url(#rimGlow)" opacity="1"/>
  <circle cx="980" cy="480" r="200" fill="none" stroke="#d97706" stroke-width="3" opacity="0.5"/>
  <!-- Right plate inner well -->
  <circle cx="980" cy="480" r="155" fill="none" stroke="#c8b89a" stroke-width="1.5" opacity="0.6"/>
  <!-- Right plate food: different composition -->
  <ellipse cx="980" cy="470" rx="55" ry="38" fill="url(#foodAccent)" opacity="0.80"/>
  <ellipse cx="1010" cy="500" rx="35" ry="22" fill="#78350f" opacity="0.75"/>
  <!-- Right plate food highlight -->
  <circle cx="965" cy="455" r="14" fill="#fbbf24" opacity="0.50"/>

  <!-- Wine glass between and above the plates, centered at x=800 -->
  <!-- Glass bowl (trapezoid-ish via path) -->
  <path d="M 752 220 Q 748 310 730 370 Q 720 400 800 415 Q 880 400 870 370 Q 852 310 848 220 Z"
        fill="url(#glassGrad)" opacity="0.90"/>
  <!-- Wine liquid inside glass -->
  <path d="M 755 340 Q 752 370 730 380 Q 800 395 870 380 Q 848 370 845 340 Z"
        fill="url(#wineGrad)" opacity="0.85"/>
  <!-- Glass stem -->
  <rect x="793" y="415" width="14" height="90" fill="#fbbf24" opacity="0.20" rx="3"/>
  <!-- Glass base -->
  <ellipse cx="800" cy="510" rx="48" ry="9" fill="#fbbf24" opacity="0.22"/>
  <!-- Glass shine highlight -->
  <path d="M 760 240 Q 758 280 755 320" stroke="#fef3ec" stroke-width="3" fill="none" opacity="0.40" stroke-linecap="round"/>

  <!-- Candle flame accent (small, above glass, decorative) -->
  <ellipse cx="800" cy="200" rx="8" ry="14" fill="#fbbf24" opacity="0.70"/>
  <ellipse cx="800" cy="204" rx="5" ry="9" fill="#d97706" opacity="0.80"/>

  <!-- Layer 3: Edge decoration (outside hero safe zone — pure atmosphere) -->
  <!-- Corner rust arcs — top left -->
  <path d="M 0 0 Q 80 0 80 80" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.25"/>
  <path d="M 0 0 Q 140 0 140 140" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.18"/>
  <!-- Corner rust arcs — bottom right -->
  <path d="M 1600 900 Q 1520 900 1520 820" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.25"/>
  <path d="M 1600 900 Q 1460 900 1460 760" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.18"/>

  <!-- Full-bleed vignette overlay -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
