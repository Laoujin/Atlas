<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- cathedral tower rising behind the houses (hero anchor) -->
  <rect x="760" y="150" width="80" height="320" fill="url(#tower)"/>
  <polygon points="760,150 800,90 840,150" fill="#9a3309"/>
  <rect x="788" y="210" width="24" height="60" rx="12" fill="#fef3ec" opacity="0.85"/>

  <!-- row of colourful Onyar river houses (hero) -->
  <g>
    <rect x="500" y="300" width="130" height="280" fill="#d97706" opacity="0.92"/>
    <rect x="630" y="250" width="120" height="330" fill="#c2410c" opacity="0.92"/>
    <rect x="750" y="320" width="110" height="260" fill="#fbbf24" opacity="0.9"/>
    <rect x="860" y="270" width="125" height="310" fill="#9a3309" opacity="0.92"/>
    <rect x="985" y="310" width="115" height="270" fill="#d97706" opacity="0.9"/>
  </g>

  <!-- window dots -->
  <g fill="#1a0e0e" opacity="0.45">
    <rect x="525" y="350" width="20" height="30"/><rect x="585" y="350" width="20" height="30"/>
    <rect x="525" y="430" width="20" height="30"/><rect x="585" y="430" width="20" height="30"/>
    <rect x="660" y="300" width="20" height="30"/><rect x="710" y="300" width="20" height="30"/>
    <rect x="660" y="390" width="20" height="30"/><rect x="710" y="390" width="20" height="30"/>
    <rect x="775" y="370" width="20" height="28"/><rect x="825" y="370" width="20" height="28"/>
    <rect x="885" y="320" width="20" height="30"/><rect x="940" y="320" width="20" height="30"/>
    <rect x="885" y="410" width="20" height="30"/><rect x="940" y="410" width="20" height="30"/>
    <rect x="1010" y="360" width="20" height="28"/><rect x="1060" y="360" width="20" height="28"/>
  </g>

  <!-- the Onyar river: band + soft reflections of the facades -->
  <rect x="0" y="580" width="1600" height="320" fill="url(#river)"/>
  <g opacity="0.4">
    <rect x="500" y="580" width="130" height="120" fill="#d97706"/>
    <rect x="630" y="580" width="120" height="150" fill="#c2410c"/>
    <rect x="750" y="580" width="110" height="100" fill="#fbbf24"/>
    <rect x="860" y="580" width="125" height="130" fill="#9a3309"/>
    <rect x="985" y="580" width="115" height="110" fill="#d97706"/>
  </g>
  <!-- ripple lines -->
  <g stroke="#fef3ec" stroke-width="3" opacity="0.3">
    <line x1="480" y1="640" x2="1120" y2="640"/>
    <line x1="520" y1="700" x2="1080" y2="700"/>
  </g>
</svg>
