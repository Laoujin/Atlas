<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun halo -->
  <circle cx="800" cy="500" r="420" fill="url(#sun)" opacity="0.55"/>

  <!-- Hero: low evening sun on the horizon -->
  <circle cx="800" cy="500" r="155" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="500" r="155" fill="#fef3ec" opacity="0.4"/>

  <!-- North Sea -->
  <rect x="0" y="500" width="1600" height="180" fill="url(#sea)" opacity="0.9"/>

  <!-- Sun reflection on water -->
  <ellipse cx="800" cy="510" rx="170" ry="14" fill="#fbbf24" opacity="0.8"/>
  <ellipse cx="800" cy="540" rx="120" ry="8" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="570" rx="85" ry="6" fill="#fbbf24" opacity="0.4"/>
  <ellipse cx="800" cy="600" rx="55" ry="4" fill="#fbbf24" opacity="0.28"/>

  <!-- Tideline / wet sand sheen -->
  <rect x="0" y="678" width="1600" height="14" fill="#d97706" opacity="0.35"/>

  <!-- Beach / dike foreground -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#sand)" opacity="0.95"/>

  <!-- Row of seafront facades along the dike (decorative, behind hero plane) -->
  <g opacity="0.75">
    <rect x="80"   y="560" width="110" height="140" fill="url(#facade)"/>
    <rect x="200"  y="540" width="90"  height="160" fill="#9a3309"/>
    <rect x="300"  y="555" width="120" height="145" fill="url(#facade)"/>
    <rect x="430"  y="525" width="100" height="175" fill="#78350f"/>
    <rect x="540"  y="560" width="80"  height="140" fill="url(#facade)"/>

    <rect x="980"  y="555" width="95"  height="145" fill="url(#facade)"/>
    <rect x="1085" y="535" width="110" height="165" fill="#9a3309"/>
    <rect x="1205" y="560" width="85"  height="140" fill="url(#facade)"/>
    <rect x="1300" y="525" width="120" height="175" fill="#78350f"/>
    <rect x="1430" y="555" width="90"  height="145" fill="url(#facade)"/>
  </g>

  <!-- Dike edge line (promenade lip) -->
  <rect x="0" y="700" width="1600" height="4" fill="#fef3ec" opacity="0.45"/>
</svg>
