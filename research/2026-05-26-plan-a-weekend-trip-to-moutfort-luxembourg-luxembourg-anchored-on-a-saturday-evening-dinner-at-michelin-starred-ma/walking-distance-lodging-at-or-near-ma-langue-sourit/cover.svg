<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#faf8f2" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow, off-centre right -->
  <circle cx="1180" cy="360" r="280" fill="url(#sun)"/>

  <!-- Far hills -->
  <path d="M0,560 Q260,470 520,510 T1040,495 T1600,520 L1600,900 L0,900 Z" fill="url(#hillFar)" opacity="0.75"/>

  <!-- Distant village cluster (right branch destination) - small houses on far hill -->
  <g opacity="0.7" fill="#78350f">
    <rect x="1280" y="495" width="22" height="22"/>
    <polygon points="1278,495 1291,482 1304,495"/>
    <rect x="1305" y="500" width="18" height="18"/>
    <polygon points="1303,500 1314,490 1325,500"/>
    <rect x="1255" y="502" width="16" height="15"/>
    <polygon points="1253,502 1263,493 1273,502"/>
  </g>

  <!-- Near hill -->
  <path d="M0,680 Q400,600 800,640 T1600,660 L1600,900 L0,900 Z" fill="url(#hillNear)"/>

  <!-- Road: starts at bottom centre, forks around y=600 -->
  <!-- Left branch to mill -->
  <path d="M780,900 Q760,800 720,700 Q650,620 460,560 Q360,540 280,545"
        fill="none" stroke="url(#road)" stroke-width="38" stroke-linecap="round" opacity="0.95"/>
  <!-- Right branch to village -->
  <path d="M820,900 Q840,800 880,700 Q970,620 1140,570 Q1230,548 1290,530"
        fill="none" stroke="url(#road)" stroke-width="38" stroke-linecap="round" opacity="0.95"/>

  <!-- Hero: the mill (Éitermillen) on the left branch, centred in safe zone -->
  <g transform="translate(380,360)">
    <!-- Mill body (stone tower) -->
    <path d="M-55,200 L-40,40 L40,40 L55,200 Z" fill="#5c2a1a"/>
    <path d="M-55,200 L-40,40 L40,40 L55,200 Z" fill="url(#hillNear)" opacity="0.5"/>
    <!-- Window -->
    <rect x="-12" y="110" width="24" height="34" fill="#1a0e0e" opacity="0.7"/>
    <!-- Roof cap -->
    <path d="M-46,40 L0,-6 L46,40 Z" fill="#78350f"/>
    <!-- Sail hub -->
    <circle cx="0" cy="60" r="9" fill="#1a0e0e"/>
    <!-- Four windmill sails -->
    <g stroke="#1a0e0e" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="0" y1="60" x2="0" y2="-90"/>
      <line x1="0" y1="60" x2="150" y2="60"/>
      <line x1="0" y1="60" x2="0" y2="210"/>
      <line x1="0" y1="60" x2="-150" y2="60"/>
    </g>
    <!-- Sail blades (rust accents) -->
    <g fill="#c2410c" opacity="0.85">
      <polygon points="-6,-90 6,-90 4,-20 -4,-20"/>
      <polygon points="150,54 150,66 80,64 80,56"/>
      <polygon points="-6,210 6,210 4,140 -4,140"/>
      <polygon points="-150,54 -150,66 -80,64 -80,56"/>
    </g>
  </g>

  <!-- Small fork marker: subtle stone where road splits -->
  <ellipse cx="800" cy="710" rx="14" ry="5" fill="#1a0e0e" opacity="0.35"/>

  <!-- A few sparse trees along the near hill, decorative -->
  <g fill="#5c2a1a" opacity="0.85">
    <circle cx="120" cy="680" r="16"/>
    <rect x="117" y="680" width="6" height="14"/>
    <circle cx="1420" cy="700" r="18"/>
    <rect x="1417" y="700" width="6" height="16"/>
    <circle cx="1500" cy="690" r="14"/>
    <rect x="1498" y="690" width="4" height="12"/>
  </g>
</svg>
