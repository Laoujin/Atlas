<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="chateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow over the Moselle -->
  <circle cx="1100" cy="430" r="320" fill="url(#sun)" opacity="0.9"/>

  <!-- Distant vineyard hill -->
  <path d="M 0 560 Q 400 470 800 510 T 1600 490 L 1600 900 L 0 900 Z" fill="url(#hill)" opacity="0.85"/>

  <!-- Vineyard row striping -->
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.25">
    <path d="M 100 600 Q 500 540 900 575 T 1600 555" fill="none"/>
    <path d="M 60 640 Q 500 585 900 615 T 1600 600" fill="none"/>
    <path d="M 40 685 Q 500 635 900 660 T 1600 650" fill="none"/>
  </g>

  <!-- Foreground river band -->
  <rect x="0" y="720" width="1600" height="40" fill="#78350f" opacity="0.55"/>
  <rect x="0" y="724" width="1600" height="2" fill="#fbbf24" opacity="0.35"/>

  <!-- Townhouse row (hero, centered ~800,450) -->
  <!-- Left townhouse -->
  <rect x="430" y="500" width="160" height="240" fill="url(#wall)"/>
  <polygon points="420,500 510,400 600,500" fill="url(#roof)"/>
  <rect x="470" y="560" width="30" height="50" fill="#1a0e0e" opacity="0.7"/>
  <rect x="520" y="560" width="30" height="50" fill="#fbbf24" opacity="0.75"/>
  <rect x="470" y="640" width="30" height="50" fill="#fbbf24" opacity="0.6"/>
  <rect x="520" y="640" width="30" height="50" fill="#1a0e0e" opacity="0.7"/>

  <!-- Central chateau (hero focus) -->
  <rect x="640" y="430" width="320" height="310" fill="url(#chateau)"/>
  <polygon points="630,430 800,290 970,430" fill="#1a0e0e"/>
  <!-- Twin corner turrets -->
  <rect x="620" y="470" width="50" height="270" fill="#5c2a1a"/>
  <polygon points="615,470 645,400 675,470" fill="#1a0e0e"/>
  <rect x="930" y="470" width="50" height="270" fill="#5c2a1a"/>
  <polygon points="925,470 955,400 985,470" fill="#1a0e0e"/>
  <!-- Spire finial -->
  <rect x="797" y="250" width="6" height="45" fill="#1a0e0e"/>
  <circle cx="800" cy="248" r="6" fill="#fbbf24" opacity="0.85"/>
  <!-- Chateau windows -->
  <rect x="685" y="500" width="28" height="48" fill="#fbbf24" opacity="0.85"/>
  <rect x="740" y="500" width="28" height="48" fill="#fbbf24" opacity="0.7"/>
  <rect x="795" y="500" width="28" height="48" fill="#fbbf24" opacity="0.85"/>
  <rect x="850" y="500" width="28" height="48" fill="#fbbf24" opacity="0.7"/>
  <rect x="905" y="500" width="28" height="48" fill="#fbbf24" opacity="0.85"/>
  <rect x="685" y="595" width="28" height="48" fill="#fbbf24" opacity="0.6"/>
  <rect x="740" y="595" width="28" height="48" fill="#fbbf24" opacity="0.85"/>
  <rect x="795" y="595" width="28" height="48" fill="#fbbf24" opacity="0.55"/>
  <rect x="850" y="595" width="28" height="48" fill="#fbbf24" opacity="0.85"/>
  <rect x="905" y="595" width="28" height="48" fill="#fbbf24" opacity="0.6"/>
  <!-- Grand door -->
  <rect x="780" y="660" width="40" height="80" fill="#1a0e0e"/>
  <rect x="785" y="668" width="30" height="65" fill="#d97706" opacity="0.6"/>

  <!-- Right townhouse -->
  <rect x="1010" y="510" width="150" height="230" fill="url(#wall)" opacity="0.95"/>
  <polygon points="1000,510 1085,415 1170,510" fill="url(#roof)"/>
  <rect x="1045" y="565" width="28" height="46" fill="#fbbf24" opacity="0.75"/>
  <rect x="1095" y="565" width="28" height="46" fill="#1a0e0e" opacity="0.7"/>
  <rect x="1045" y="640" width="28" height="46" fill="#1a0e0e" opacity="0.7"/>
  <rect x="1095" y="640" width="28" height="46" fill="#fbbf24" opacity="0.65"/>

  <!-- Smaller cottage right edge -->
  <rect x="1190" y="580" width="110" height="160" fill="#9a3309" opacity="0.9"/>
  <polygon points="1180,580 1245,510 1310,580" fill="#5c2a1a"/>
  <rect x="1215" y="620" width="22" height="36" fill="#fbbf24" opacity="0.7"/>
  <rect x="1255" y="620" width="22" height="36" fill="#fbbf24" opacity="0.55"/>

  <!-- Cottage far left -->
  <rect x="290" y="590" width="120" height="150" fill="#9a3309" opacity="0.85"/>
  <polygon points="280,590 350,520 420,590" fill="#5c2a1a"/>
  <rect x="315" y="630" width="22" height="36" fill="#fbbf24" opacity="0.6"/>
  <rect x="355" y="630" width="22" height="36" fill="#fbbf24" opacity="0.8"/>

  <!-- Ground shadow tying buildings together -->
  <rect x="0" y="740" width="1600" height="160" fill="#1a0e0e" opacity="0.55"/>
</svg>
