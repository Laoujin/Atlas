<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind hero -->
  <circle cx="800" cy="470" r="320" fill="url(#sun)"/>

  <!-- far ridgeline (vineyard hills) -->
  <path d="M 0 600 Q 200 540 400 570 T 800 540 T 1200 560 T 1600 530 L 1600 900 L 0 900 Z"
        fill="url(#hillFar)" opacity="0.7"/>

  <!-- mid hills -->
  <path d="M 0 680 Q 250 620 500 660 T 1000 640 T 1600 670 L 1600 900 L 0 900 Z"
        fill="url(#hillMid)" opacity="0.85"/>

  <!-- castle hero: hill mound + keep + two towers -->
  <g>
    <!-- hill mound under castle -->
    <path d="M 560 640 Q 800 540 1040 640 L 1040 720 L 560 720 Z" fill="#5c2a1a" opacity="0.9"/>
    <!-- main keep -->
    <rect x="730" y="430" width="140" height="200" fill="url(#castle)"/>
    <!-- crenellations on keep -->
    <rect x="730" y="420" width="22" height="20" fill="#5c2a1a"/>
    <rect x="770" y="420" width="22" height="20" fill="#5c2a1a"/>
    <rect x="810" y="420" width="22" height="20" fill="#5c2a1a"/>
    <rect x="850" y="420" width="22" height="20" fill="#5c2a1a"/>
    <!-- left tower -->
    <rect x="660" y="470" width="70" height="160" fill="url(#castle)"/>
    <polygon points="660,470 695,420 730,470" fill="#5c2a1a"/>
    <!-- right tower (taller) -->
    <rect x="870" y="450" width="80" height="180" fill="url(#castle)"/>
    <polygon points="870,450 910,390 950,450" fill="#5c2a1a"/>
    <!-- arched gate -->
    <path d="M 785 630 L 785 590 Q 800 570 815 590 L 815 630 Z" fill="#1a0e0e" opacity="0.85"/>
    <!-- tower window slits -->
    <rect x="688" y="510" width="8" height="22" fill="#1a0e0e" opacity="0.7"/>
    <rect x="903" y="490" width="9" height="26" fill="#1a0e0e" opacity="0.7"/>
    <rect x="775" y="475" width="10" height="24" fill="#1a0e0e" opacity="0.7"/>
    <rect x="815" y="475" width="10" height="24" fill="#1a0e0e" opacity="0.7"/>
  </g>

  <!-- foreground vineyard rows (decorative, low-opacity diagonal lines) -->
  <g stroke="#5c2a1a" stroke-width="2" opacity="0.35" fill="none">
    <path d="M 0 780 Q 400 760 800 770 T 1600 760"/>
    <path d="M 0 820 Q 400 800 800 810 T 1600 800"/>
    <path d="M 0 860 Q 400 840 800 850 T 1600 845"/>
  </g>

  <!-- subtle grape/sun accent dot on right tower (Moselle wine nod) -->
  <circle cx="910" cy="420" r="6" fill="#fbbf24" opacity="0.9"/>
</svg>
