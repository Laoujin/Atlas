<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- decoration: clipped-safe corner arcs -->
  <g fill="none" stroke="#c2410c" stroke-opacity="0.14" stroke-width="3">
    <circle cx="60" cy="120" r="150"/>
    <circle cx="1560" cy="830" r="190"/>
  </g>

  <!-- headless: wireframe card with construction geometry -->
  <g stroke="#9a3309" fill="none" stroke-opacity="0.85">
    <rect x="392" y="272" width="520" height="286" rx="30" stroke-width="4" stroke-dasharray="14 10"/>
    <g stroke-opacity="0.34" stroke-width="2">
      <line x1="392" y1="415" x2="912" y2="415"/>
      <line x1="530" y1="272" x2="530" y2="558"/>
      <line x1="392" y1="272" x2="912" y2="558"/>
      <line x1="912" y1="272" x2="392" y2="558"/>
      <circle cx="461" cy="415" r="44"/>
      <rect x="576" y="352" width="272" height="26" rx="13"/>
      <rect x="576" y="452" width="196" height="26" rx="13"/>
    </g>
  </g>

  <!-- batteries-included: solid, skinned card -->
  <g>
    <rect x="712" y="368" width="520" height="286" rx="30" fill="#78350f" opacity="0.16" transform="translate(16,20)"/>
    <rect x="712" y="368" width="520" height="286" rx="30" fill="url(#solid)" opacity="0.94"/>
    <rect x="712" y="368" width="520" height="286" rx="30" fill="url(#shade)"/>
    <circle cx="781" cy="511" r="44" fill="#fef3ec" opacity="0.9"/>
    <rect x="896" y="448" width="272" height="26" rx="13" fill="#fbbf24" opacity="0.85"/>
    <rect x="896" y="548" width="196" height="26" rx="13" fill="#faf8f2" opacity="0.6"/>
  </g>
</svg>
