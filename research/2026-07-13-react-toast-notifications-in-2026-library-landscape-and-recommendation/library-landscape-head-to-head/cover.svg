<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.38" stop-color="#d97706"/>
      <stop offset="0.75" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rival" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#78350f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <circle cx="90" cy="820" r="240" fill="#d97706" opacity="0.07"/>
  <circle cx="1520" cy="110" r="200" fill="#c2410c" opacity="0.06"/>

  <ellipse cx="800" cy="430" rx="480" ry="360" fill="url(#glow)"/>

  <rect x="445" y="460" width="110" height="240" rx="16" fill="url(#rival)" opacity="0.62"/>
  <rect x="595" y="300" width="110" height="400" rx="16" fill="url(#rival)" opacity="0.72"/>
  <rect x="745" y="160" width="110" height="540" rx="18" fill="url(#hero)" opacity="0.95"/>
  <rect x="895" y="370" width="110" height="330" rx="16" fill="url(#rival)" opacity="0.68"/>
  <rect x="1045" y="490" width="110" height="210" rx="16" fill="url(#rival)" opacity="0.6"/>

  <rect x="745" y="160" width="110" height="150" rx="18" fill="#fbbf24" opacity="0.35"/>

  <rect x="415" y="700" width="770" height="7" rx="3.5" fill="url(#floor)"/>
