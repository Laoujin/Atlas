<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Warm dining room glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate highlight gradient -->
    <radialGradient id="plateLeft" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="plateRight" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.3"/>
    </radialGradient>
    <!-- Star fill -->
    <radialGradient id="starFill" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Rim gradient for plates -->
    <radialGradient id="rimLeft" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="rimRight" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm ambient glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two fine-dining plates + three Michelin stars -->

  <!-- Left plate -->
  <circle cx="620" cy="490" r="190" fill="url(#plateLeft)" opacity="0.92"/>
  <circle cx="620" cy="490" r="190" fill="url(#rimLeft)"/>
  <!-- Inner well / food presentation circle -->
  <circle cx="620" cy="490" r="130" fill="#faf8f2" opacity="0.18"/>
  <circle cx="620" cy="490" r="80" fill="#c2410c" opacity="0.22"/>

  <!-- Right plate -->
  <circle cx="980" cy="490" r="190" fill="url(#plateRight)" opacity="0.92"/>
  <circle cx="980" cy="490" r="190" fill="url(#rimRight)"/>
  <!-- Inner well -->
  <circle cx="980" cy="490" r="130" fill="#faf8f2" opacity="0.18"/>
  <circle cx="980" cy="490" r="80" fill="#9a3309" opacity="0.22"/>

  <!-- Three Michelin stars arranged horizontally above the plates -->
  <!-- Star helper: five-point star polygon centered at given coords, r_outer, r_inner -->
  <!-- Star 1 (left) at (660, 235) -->
  <polygon
    points="660,195 671,226 704,226 679,245 688,276 660,258 632,276 641,245 616,226 649,226"
    fill="url(#starFill)" opacity="0.90"/>

  <!-- Star 2 (center) at (800, 220) — slightly larger, more prominent -->
  <polygon
    points="800,176 813,212 851,212 821,234 832,270 800,249 768,270 779,234 749,212 787,212"
    fill="url(#starFill)" opacity="0.95"/>

  <!-- Star 3 (right) at (940, 235) -->
  <polygon
    points="940,195 951,226 984,226 959,245 968,276 940,258 912,276 921,245 896,226 929,226"
    fill="url(#starFill)" opacity="0.90"/>

  <!-- Layer 3: Subtle decorative edge vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Faint table line beneath the plates -->
  <rect x="200" y="668" width="1200" height="2" rx="1" fill="#d97706" opacity="0.18"/>
  <rect x="300" y="672" width="1000" height="1" rx="1" fill="#c2410c" opacity="0.10"/>
</svg>
