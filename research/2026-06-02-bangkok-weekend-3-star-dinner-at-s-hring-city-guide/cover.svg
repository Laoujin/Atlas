<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.70"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0707"/>
      <stop offset="100%" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="spireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric full-bleed glow -->
  <ellipse cx="800" cy="480" rx="820" ry="600" fill="url(#glow)"/>

  <!-- Horizon line — subtle -->
  <rect x="0" y="590" width="1600" height="2" fill="#c2410c" opacity="0.18"/>

  <!-- Layer 2: Hero element — temple spire LEFT (safe zone x~340) -->
  <!-- Base plinth -->
  <rect x="290" y="510" width="100" height="120" fill="url(#spireGrad)" opacity="0.80"/>
  <!-- Mid tier -->
  <rect x="305" y="450" width="70" height="65" fill="url(#spireGrad)" opacity="0.82"/>
  <!-- Upper tier -->
  <rect x="316" y="400" width="48" height="55" fill="url(#spireGrad)" opacity="0.84"/>
  <!-- Spire shaft -->
  <rect x="334" y="290" width="12" height="115" fill="#c2410c" opacity="0.78"/>
  <!-- Spire tip -->
  <polygon points="340,220 328,295 352,295" fill="#fbbf24" opacity="0.75"/>
  <!-- Decorative finial ring -->
  <ellipse cx="340" cy="295" rx="10" ry="4" fill="#d97706" opacity="0.70"/>

  <!-- Temple spire RIGHT (safe zone x~1260) -->
  <rect x="1210" y="510" width="100" height="120" fill="url(#spireGrad)" opacity="0.80"/>
  <rect x="1225" y="450" width="70" height="65" fill="url(#spireGrad)" opacity="0.82"/>
  <rect x="1236" y="400" width="48" height="55" fill="url(#spireGrad)" opacity="0.84"/>
  <rect x="1254" y="290" width="12" height="115" fill="#c2410c" opacity="0.78"/>
  <polygon points="1260,220 1248,295 1272,295" fill="#fbbf24" opacity="0.75"/>
  <ellipse cx="1260" cy="295" rx="10" ry="4" fill="#d97706" opacity="0.70"/>

  <!-- Hero orb — fine-dining plate / moon, centered (800, 445) -->
  <circle cx="800" cy="445" r="165" fill="url(#orb)" opacity="0.92"/>
  <!-- Inner ring — plate rim suggestion -->
  <circle cx="800" cy="445" r="130" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.40"/>
  <!-- Outer halo -->
  <ellipse cx="800" cy="445" rx="310" ry="310" fill="url(#halo)"/>

  <!-- Layer 3: edge vignette for depth (outside hero, full-bleed) -->
  <rect width="1600" height="900" fill="#1a0e0e" opacity="0.38"
        style="mask: none;"
        rx="0"/>
  <!-- Vignette implemented as four gradient overlays on edges -->
  <linearGradient id="vigL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.70"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vigR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.70"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vigT" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.60"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vigB" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </linearGradient>
  <rect width="400" height="900" fill="url(#vigL)"/>
  <rect x="1200" width="400" height="900" fill="url(#vigR)"/>
  <rect width="1600" height="250" fill="url(#vigT)"/>
  <rect y="650" width="1600" height="250" fill="url(#vigB)"/>
</svg>
