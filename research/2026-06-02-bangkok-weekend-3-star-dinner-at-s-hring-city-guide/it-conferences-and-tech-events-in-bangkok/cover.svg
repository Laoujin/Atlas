<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="panel3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle city-horizon band at bottom -->
  <rect x="0" y="780" width="1600" height="120" fill="#78350f" opacity="0.18"/>
  <rect x="0" y="810" width="1600" height="90" fill="#9a3309" opacity="0.12"/>

  <!-- Layer 2: Hero — three stacked conference-stage / slide panels -->
  <!-- Backmost panel (bottom layer, tilted slightly left) -->
  <rect x="370" y="310" width="820" height="480"
        rx="14" ry="14"
        fill="url(#panel1)" opacity="0.72"
        transform="rotate(-5, 800, 550)"/>

  <!-- Mid panel -->
  <rect x="370" y="295" width="820" height="460"
        rx="12" ry="12"
        fill="url(#panel2)" opacity="0.82"
        transform="rotate(2.5, 800, 530)"/>

  <!-- Front panel (hero) -->
  <rect x="390" y="275" width="820" height="440"
        rx="10" ry="10"
        fill="url(#panel3)" opacity="0.93"/>

  <!-- Accent bar near top of front panel (like a presentation header) -->
  <rect x="390" y="275" width="820" height="10"
        rx="5" ry="5"
        fill="url(#bar)" opacity="0.85"/>

  <!-- Two faint horizontal content-line bars inside front panel -->
  <rect x="470" y="380" width="480" height="14" rx="4" fill="#fbbf24" opacity="0.22"/>
  <rect x="470" y="418" width="340" height="14" rx="4" fill="#fbbf24" opacity="0.16"/>
  <rect x="470" y="456" width="400" height="14" rx="4" fill="#fbbf24" opacity="0.13"/>

  <!-- Speaker podium accent at bottom of front panel -->
  <rect x="730" y="640" width="140" height="48" rx="6" fill="#d97706" opacity="0.45"/>
  <rect x="755" y="688" width="90" height="22" rx="4" fill="#9a3309" opacity="0.6"/>

  <!-- Audience dots — three rows of small circles suggesting a crowd -->
  <circle cx="540" cy="570" r="9" fill="#fbbf24" opacity="0.18"/>
  <circle cx="590" cy="578" r="9" fill="#fbbf24" opacity="0.14"/>
  <circle cx="640" cy="568" r="9" fill="#fbbf24" opacity="0.18"/>
  <circle cx="690" cy="576" r="9" fill="#fbbf24" opacity="0.13"/>
  <circle cx="740" cy="566" r="9" fill="#fbbf24" opacity="0.16"/>
  <circle cx="860" cy="574" r="9" fill="#fbbf24" opacity="0.15"/>
  <circle cx="910" cy="567" r="9" fill="#fbbf24" opacity="0.18"/>
  <circle cx="960" cy="577" r="9" fill="#fbbf24" opacity="0.13"/>
  <circle cx="1010" cy="569" r="9" fill="#fbbf24" opacity="0.16"/>
  <circle cx="1060" cy="574" r="9" fill="#fbbf24" opacity="0.14"/>

  <!-- Layer 3: corner/edge decorations (outside safe zone, purely atmospheric) -->
  <!-- Top-left faint arc accent -->
  <circle cx="0" cy="0" r="260" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.12"/>
  <!-- Bottom-right warm arc -->
  <circle cx="1600" cy="900" r="300" fill="none" stroke="#d97706" stroke-width="2" opacity="0.10"/>
</svg>
