<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun halo -->
  <circle cx="800" cy="470" r="320" fill="url(#glow)"/>

  <!-- hero sun -->
  <circle cx="800" cy="470" r="170" fill="url(#sun)" opacity="0.95"/>

  <!-- sea band with reflection horizon -->
  <rect x="0" y="555" width="1600" height="120" fill="url(#sea)" opacity="0.85"/>

  <!-- sun reflection on water -->
  <ellipse cx="800" cy="615" rx="150" ry="14" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="800" cy="640" rx="110" ry="8" fill="#fbbf24" opacity="0.5"/>
  <ellipse cx="800" cy="660" rx="75" ry="5" fill="#fbbf24" opacity="0.35"/>

  <!-- distant dune / shoreline silhouettes -->
  <path d="M 0 560 Q 280 540 520 555 T 1100 552 T 1600 558 L 1600 555 L 0 555 Z" fill="#5c2a1a" opacity="0.4"/>

  <!-- foreground beach / dune curves -->
  <path d="M 0 700 Q 350 660 700 690 T 1200 685 T 1600 695 L 1600 900 L 0 900 Z" fill="url(#dune)" opacity="0.9"/>
  <path d="M 0 780 Q 400 745 800 770 T 1600 775 L 1600 900 L 0 900 Z" fill="#78350f" opacity="0.85"/>

  <!-- a small bird in flight for the Zwin reserve hint -->
  <path d="M 1050 320 q 18 -14 36 0 q 18 -14 36 0" stroke="#5c2a1a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 1180 280 q 12 -9 24 0 q 12 -9 24 0" stroke="#5c2a1a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>
</svg>
