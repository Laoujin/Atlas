<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.96"/>
      <stop offset="78%" stop-color="#f0eadb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="morsel" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant Bruges horizon silhouette (decoration, full-bleed) -->
  <g opacity="0.35" fill="#1a0e0e">
    <rect x="0" y="640" width="1600" height="260"/>
    <polygon points="220,640 240,640 240,580 260,580 260,640 280,640 280,510 300,470 320,510 320,640"/>
    <rect x="430" y="595" width="40" height="45"/>
    <polygon points="430,595 450,560 470,595"/>
    <rect x="1180" y="610" width="30" height="30"/>
    <rect x="1330" y="600" width="35" height="40"/>
    <polygon points="1330,600 1347,575 1365,600"/>
  </g>

  <!-- canal reflection band -->
  <rect x="0" y="640" width="1600" height="14" fill="#d97706" opacity="0.18"/>

  <!-- hero: plate centered ~ (760, 460), well inside safe zone -->
  <ellipse cx="760" cy="475" rx="42" ry="10" fill="#000" opacity="0.45"/>
  <circle cx="760" cy="460" r="245" fill="url(#plate)"/>
  <circle cx="760" cy="460" r="245" fill="none" stroke="#78350f" stroke-width="3" opacity="0.5"/>
  <circle cx="760" cy="460" r="195" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.4"/>

  <!-- composed morsel on plate -->
  <ellipse cx="760" cy="465" rx="78" ry="62" fill="url(#morsel)"/>
  <ellipse cx="735" cy="448" rx="22" ry="14" fill="#fbbf24" opacity="0.7"/>
  <path d="M 700 445 Q 760 410 820 445" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.55"/>

  <!-- wine glass to the right of plate, inside safe zone -->
  <g transform="translate(1180,330)">
    <path d="M -55 0 Q -55 90 0 110 Q 55 90 55 0 Z" fill="url(#glass)" opacity="0.85"/>
    <path d="M -55 0 Q -55 90 0 110 Q 55 90 55 0" stroke="#fbbf24" stroke-width="1.2" fill="none" opacity="0.55"/>
    <rect x="-2" y="110" width="4" height="100" fill="#9a3309" opacity="0.7"/>
    <ellipse cx="0" cy="215" rx="40" ry="6" fill="#9a3309" opacity="0.7"/>
    <ellipse cx="-20" cy="30" rx="10" ry="20" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- subtle warm sparkle near plate edge (steam / signature) -->
  <circle cx="760" cy="200" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="780" cy="240" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="745" cy="260" r="2" fill="#fbbf24" opacity="0.55"/>
</svg>
