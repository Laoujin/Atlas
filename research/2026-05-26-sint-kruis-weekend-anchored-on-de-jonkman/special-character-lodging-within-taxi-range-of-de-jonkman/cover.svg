<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="brickDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1a0a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon glow behind gables -->
  <circle cx="1180" cy="280" r="320" fill="url(#moonGlow)"/>
  <circle cx="1180" cy="280" r="46" fill="#fbbf24" opacity="0.9"/>

  <!-- distant gable silhouette row (decoration, mostly outside safe zone edges) -->
  <g opacity="0.55" fill="#3a1a0a">
    <polygon points="60,560 60,420 110,420 110,380 160,380 160,420 210,420 210,560"/>
    <polygon points="210,560 210,440 260,440 260,400 310,400 310,440 360,440 360,560"/>
    <polygon points="1380,560 1380,430 1430,430 1430,390 1480,390 1480,430 1540,430 1540,560"/>
  </g>

  <!-- HERO: three Bruges stepped-gable houses centered ~ (800, 450), within x:200-1400, y:180-720 -->
  <g>
    <!-- left house -->
    <g>
      <polygon points="300,720 300,420 360,420 360,380 420,380 420,340 480,340 480,300 540,300 540,340 600,340 600,380 660,380 660,420 720,420 720,720" fill="url(#brickDark)"/>
      <!-- windows -->
      <rect x="360" y="470" width="50" height="70" fill="url(#window)" opacity="0.9"/>
      <rect x="450" y="470" width="50" height="70" fill="url(#window)" opacity="0.85"/>
      <rect x="540" y="470" width="50" height="70" fill="url(#window)" opacity="0.7"/>
      <rect x="630" y="470" width="50" height="70" fill="url(#window)" opacity="0.9"/>
      <rect x="450" y="590" width="50" height="90" fill="url(#window)" opacity="0.95"/>
      <rect x="540" y="590" width="50" height="90" fill="#3a1a0a"/>
      <!-- door -->
      <rect x="360" y="600" width="50" height="100" fill="#3a1a0a"/>
      <rect x="630" y="600" width="50" height="100" fill="#3a1a0a"/>
    </g>

    <!-- center (tallest) house -->
    <g>
      <polygon points="720,720 720,360 780,360 780,320 840,320 840,260 900,260 900,200 960,200 960,260 1020,260 1020,320 1080,320 1080,360 1140,360 1140,720" fill="url(#brick)"/>
      <!-- tiny circular attic window -->
      <circle cx="930" cy="290" r="14" fill="url(#window)"/>
      <!-- windows grid (sparse, not micro) -->
      <rect x="770" y="410" width="60" height="80" fill="url(#window)" opacity="0.9"/>
      <rect x="870" y="410" width="60" height="80" fill="url(#window)" opacity="0.95"/>
      <rect x="970" y="410" width="60" height="80" fill="url(#window)" opacity="0.7"/>
      <rect x="1060" y="410" width="60" height="80" fill="url(#window)" opacity="0.9"/>
      <rect x="770" y="540" width="60" height="90" fill="url(#window)" opacity="0.85"/>
      <rect x="870" y="540" width="60" height="90" fill="#3a1a0a"/>
      <rect x="970" y="540" width="60" height="90" fill="url(#window)" opacity="0.95"/>
      <rect x="1060" y="540" width="60" height="90" fill="url(#window)" opacity="0.8"/>
      <!-- arched door -->
      <path d="M 880,720 L 880,680 Q 880,640 920,640 Q 960,640 960,680 L 960,720 Z" fill="#1a0e0e"/>
    </g>

    <!-- right house -->
    <g>
      <polygon points="1140,720 1140,440 1200,440 1200,400 1260,400 1260,360 1320,360 1320,400 1380,400 1380,440 1440,440 1440,720" fill="url(#brickDark)"/>
      <rect x="1180" y="490" width="55" height="70" fill="url(#window)" opacity="0.9"/>
      <rect x="1270" y="490" width="55" height="70" fill="url(#window)" opacity="0.7"/>
      <rect x="1360" y="490" width="55" height="70" fill="url(#window)" opacity="0.95"/>
      <rect x="1180" y="600" width="55" height="90" fill="#3a1a0a"/>
      <rect x="1270" y="600" width="55" height="90" fill="url(#window)" opacity="0.85"/>
      <rect x="1360" y="600" width="55" height="90" fill="#3a1a0a"/>
    </g>
  </g>

  <!-- canal in foreground -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#canal)"/>

  <!-- reflections (soft vertical streaks) -->
  <g opacity="0.5">
    <rect x="455" y="720" width="40" height="120" fill="#fbbf24" opacity="0.18"/>
    <rect x="785" y="720" width="50" height="140" fill="#fbbf24" opacity="0.22"/>
    <rect x="980" y="720" width="50" height="140" fill="#fbbf24" opacity="0.20"/>
    <rect x="1275" y="720" width="40" height="120" fill="#fbbf24" opacity="0.16"/>
  </g>

  <!-- water ripple line -->
  <line x1="0" y1="730" x2="1600" y2="730" stroke="#fbbf24" stroke-width="1" opacity="0.35"/>
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#d97706" stroke-width="1" opacity="0.25"/>
</svg>
