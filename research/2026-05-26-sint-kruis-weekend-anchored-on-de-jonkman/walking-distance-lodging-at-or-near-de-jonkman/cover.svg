<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.75" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon glow behind inn -->
  <circle cx="900" cy="320" r="280" fill="url(#moon)"/>

  <!-- Distant tree-line silhouette (suburban road feel) -->
  <path d="M0 680 Q 140 640 240 670 T 480 660 T 720 670 T 980 655 T 1240 670 T 1600 660 L 1600 760 L 0 760 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Dotted walking path arcing from lower-left toward the inn -->
  <path d="M 220 820 Q 500 760 700 660 T 900 540" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.85"/>

  <!-- Plate (dinner motif) at path origin -->
  <g transform="translate(220 820)">
    <ellipse cx="0" cy="6" rx="92" ry="22" fill="#1a0e0e" opacity="0.6"/>
    <circle r="78" fill="url(#plate)" opacity="0.95"/>
    <circle r="58" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.6"/>
    <!-- crossed cutlery suggestion -->
    <rect x="-46" y="-3" width="92" height="6" rx="3" fill="#78350f" opacity="0.75" transform="rotate(-28)"/>
    <rect x="-46" y="-3" width="92" height="6" rx="3" fill="#78350f" opacity="0.75" transform="rotate(28)"/>
  </g>

  <!-- Hero inn/lodge, centered ~ (900, 480), inside safe zone -->
  <g transform="translate(900 480)">
    <!-- Ground shadow -->
    <ellipse cx="0" cy="220" rx="320" ry="28" fill="#1a0e0e" opacity="0.55"/>

    <!-- Main body -->
    <rect x="-220" y="-20" width="440" height="240" fill="url(#inn)" opacity="0.95"/>

    <!-- Roof (steep pitched, hunting-lodge feel) -->
    <polygon points="-260,-20 0,-220 260,-20" fill="url(#roof)" opacity="0.95"/>

    <!-- Chimney with faint smoke -->
    <rect x="120" y="-180" width="36" height="80" fill="#5c2a1a"/>
    <path d="M 138 -190 Q 160 -230 140 -270 Q 120 -310 150 -350" stroke="#faf8f2" stroke-width="4" fill="none" opacity="0.25" stroke-linecap="round"/>

    <!-- Door (glowing entrance) -->
    <rect x="-30" y="80" width="60" height="140" rx="4" fill="#fbbf24" opacity="0.9"/>
    <rect x="-24" y="90" width="48" height="125" rx="2" fill="#fef3ec" opacity="0.55"/>

    <!-- Warm-lit windows -->
    <rect x="-180" y="40" width="70" height="70" fill="#fbbf24" opacity="0.85"/>
    <rect x="-90" y="40" width="70" height="70" fill="#fbbf24" opacity="0.7"/>
    <rect x="20" y="40" width="70" height="70" fill="#fbbf24" opacity="0.7"/>
    <rect x="110" y="40" width="70" height="70" fill="#fbbf24" opacity="0.85"/>
    <!-- window mullions -->
    <g stroke="#5c2a1a" stroke-width="3" opacity="0.8">
      <line x1="-145" y1="40" x2="-145" y2="110"/>
      <line x1="-180" y1="75" x2="-110" y2="75"/>
      <line x1="-55" y1="40" x2="-55" y2="110"/>
      <line x1="-90" y1="75" x2="-20" y2="75"/>
      <line x1="55" y1="40" x2="55" y2="110"/>
      <line x1="20" y1="75" x2="90" y2="75"/>
      <line x1="145" y1="40" x2="145" y2="110"/>
      <line x1="110" y1="75" x2="180" y2="75"/>
    </g>

    <!-- Dormer on roof -->
    <polygon points="-60,-110 -60,-60 60,-60 60,-110 0,-160" fill="#5c2a1a" opacity="0.9"/>
    <rect x="-30" y="-100" width="60" height="40" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Flanking tree silhouettes (decoration, partly outside safe zone is fine) -->
  <g fill="#1a0e0e" opacity="0.9">
    <ellipse cx="120" cy="640" rx="60" ry="120"/>
    <rect x="114" y="640" width="12" height="100"/>
    <ellipse cx="1500" cy="620" rx="70" ry="140"/>
    <rect x="1494" y="620" width="12" height="120"/>
  </g>
</svg>
