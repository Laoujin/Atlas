<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0608"/>
      <stop offset="60%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1208"/>
    </linearGradient>
    <!-- Warm harbour glow -->
    <radialGradient id="glow" cx="50%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Water shimmer -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Plate glow -->
    <radialGradient id="plateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Tower gradient -->
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Harbour glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — Golden Gate bridge silhouette + dining plate, centered ~800,450 -->

  <!-- Water / bay surface -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#water)" opacity="0.85"/>

  <!-- Water reflection shimmer lines -->
  <rect x="200" y="730" width="420" height="3" rx="1.5" fill="#d97706" opacity="0.18"/>
  <rect x="980" y="730" width="380" height="3" rx="1.5" fill="#d97706" opacity="0.15"/>
  <rect x="350" y="752" width="180" height="2" rx="1" fill="#fbbf24" opacity="0.12"/>
  <rect x="1050" y="748" width="220" height="2" rx="1" fill="#fbbf24" opacity="0.10"/>

  <!-- Left bridge tower -->
  <rect x="530" y="270" width="42" height="460" rx="4" fill="url(#tower)" opacity="0.92"/>
  <!-- Left tower crossbar top -->
  <rect x="510" y="290" width="82" height="14" rx="3" fill="#78350f" opacity="0.88"/>
  <!-- Left tower crossbar mid -->
  <rect x="510" y="420" width="82" height="12" rx="3" fill="#78350f" opacity="0.80"/>

  <!-- Right bridge tower -->
  <rect x="1028" y="270" width="42" height="460" rx="4" fill="url(#tower)" opacity="0.92"/>
  <!-- Right tower crossbar top -->
  <rect x="1008" y="290" width="82" height="14" rx="3" fill="#78350f" opacity="0.88"/>
  <!-- Right tower crossbar mid -->
  <rect x="1008" y="420" width="82" height="12" rx="3" fill="#78350f" opacity="0.80"/>

  <!-- Main suspension cable (left arc) -->
  <path d="M 551 290 Q 690 560 800 580 Q 910 560 1049 290"
        fill="none" stroke="#c2410c" stroke-width="5" opacity="0.80"/>

  <!-- Hanger cables (vertical drops from main cable) -->
  <line x1="620"  y1="378" x2="620"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.50"/>
  <line x1="660"  y1="420" x2="660"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.50"/>
  <line x1="700"  y1="450" x2="700"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.45"/>
  <line x1="740"  y1="468" x2="740"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.45"/>
  <line x1="780"  y1="476" x2="780"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.45"/>
  <line x1="820"  y1="476" x2="820"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.45"/>
  <line x1="860"  y1="468" x2="860"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.45"/>
  <line x1="900"  y1="450" x2="900"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.45"/>
  <line x1="940"  y1="420" x2="940"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.50"/>
  <line x1="980"  y1="378" x2="980"  y2="720" stroke="#9a3309" stroke-width="2" opacity="0.50"/>

  <!-- Road deck -->
  <rect x="530" y="715" width="540" height="10" rx="2" fill="#78350f" opacity="0.75"/>

  <!-- Fine-dining plate — centered at (800, 640), inside safe zone -->
  <!-- Outer plate glow -->
  <circle cx="800" cy="640" r="90" fill="url(#plateGlow)" opacity="0.9"/>
  <!-- Plate rim -->
  <circle cx="800" cy="640" r="72" fill="none" stroke="#d97706" stroke-width="3" opacity="0.70"/>
  <!-- Plate surface -->
  <circle cx="800" cy="640" r="62" fill="#1a0e0e" opacity="0.82"/>
  <!-- Inner plate well -->
  <circle cx="800" cy="640" r="44" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.55"/>
  <!-- Food accent — abstract smear/dot composition suggesting a plated dish -->
  <ellipse cx="800" cy="635" rx="18" ry="8" fill="#c2410c" opacity="0.80"/>
  <circle cx="778" cy="648" r="5" fill="#d97706" opacity="0.75"/>
  <circle cx="820" cy="648" r="4" fill="#fbbf24" opacity="0.65"/>
  <circle cx="800" cy="622" r="3" fill="#d97706" opacity="0.60"/>

  <!-- Layer 3: Atmospheric edge decoration (outside safe zone — intentionally clippable) -->

  <!-- Top fog band -->
  <rect x="0" y="0" width="1600" height="90" fill="#0d0608" opacity="0.60"/>

  <!-- Star dots — top region, atmospheric -->
  <circle cx="180"  cy="55"  r="1.5" fill="#fbbf24" opacity="0.50"/>
  <circle cx="340"  cy="38"  r="1"   fill="#fbbf24" opacity="0.40"/>
  <circle cx="520"  cy="62"  r="1.5" fill="#fbbf24" opacity="0.45"/>
  <circle cx="720"  cy="30"  r="1"   fill="#d97706" opacity="0.35"/>
  <circle cx="900"  cy="50"  r="1.5" fill="#fbbf24" opacity="0.50"/>
  <circle cx="1100" cy="35"  r="1"   fill="#fbbf24" opacity="0.40"/>
  <circle cx="1280" cy="58"  r="1.5" fill="#fbbf24" opacity="0.45"/>
  <circle cx="1450" cy="42"  r="1"   fill="#d97706" opacity="0.35"/>

  <!-- Distant city hill silhouette (left, low) -->
  <path d="M 0 720 L 0 660 Q 80 620 160 630 Q 220 610 280 625 Q 340 600 400 620 L 400 720 Z"
        fill="#3b1208" opacity="0.70"/>

  <!-- Distant city hill silhouette (right, low) -->
  <path d="M 1200 720 L 1200 635 Q 1280 608 1360 622 Q 1430 600 1500 618 Q 1560 605 1600 620 L 1600 720 Z"
        fill="#3b1208" opacity="0.70"/>

  <!-- Bottom edge vignette -->
  <rect x="0" y="810" width="1600" height="90" fill="#0d0608" opacity="0.55"/>
</svg>
