<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm ambient glow behind plate -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate surface gradient -->
    <radialGradient id="plate" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="45%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="rim" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Inner plate well gradient -->
    <radialGradient id="well" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </radialGradient>
    <!-- Chopstick gradient -->
    <linearGradient id="chopstick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Pearl River arc gradient -->
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="30%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
    <!-- Star glow -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warmth pool centered on plate -->
  <ellipse cx="800" cy="460" rx="620" ry="420" fill="url(#glow)"/>

  <!-- Pearl River suggestion: a soft sweeping arc low in the frame -->
  <path d="M0,780 Q400,700 800,720 Q1200,740 1600,680" stroke="url(#river)" stroke-width="38" fill="none" opacity="0.55"/>
  <path d="M0,800 Q400,730 800,748 Q1200,766 1600,710" stroke="url(#river)" stroke-width="18" fill="none" opacity="0.3"/>

  <!-- City light glimmers above river (edge decoration, intentionally outside safe zone) -->
  <ellipse cx="260" cy="670" rx="28" ry="6" fill="#d97706" opacity="0.18"/>
  <ellipse cx="420" cy="655" rx="18" ry="5" fill="#fbbf24" opacity="0.14"/>
  <ellipse cx="1180" cy="660" rx="22" ry="5" fill="#d97706" opacity="0.16"/>
  <ellipse cx="1340" cy="648" rx="16" ry="4" fill="#fbbf24" opacity="0.12"/>

  <!-- Layer 2: HERO — Plate centered at (800, 450) -->
  <!-- Outer rim shadow ring -->
  <circle cx="800" cy="454" r="246" fill="#78350f" opacity="0.55"/>
  <!-- Plate rim -->
  <circle cx="800" cy="450" r="244" fill="url(#rim)" opacity="0.88"/>
  <!-- Plate surface -->
  <circle cx="800" cy="450" r="228" fill="url(#plate)" opacity="0.97"/>
  <!-- Inner well ring (subtle indent line) -->
  <circle cx="800" cy="450" r="192" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.3"/>
  <!-- Inner well surface -->
  <circle cx="800" cy="450" r="188" fill="url(#well)" opacity="0.92"/>

  <!-- Michelin star accent: three-pointed star shape centered on plate -->
  <!-- Star composed of a small circle + three petal-like ellipses rotated 120° apart -->
  <g transform="translate(800,450)">
    <!-- Outer glow halo for the star -->
    <circle r="46" fill="url(#star)" opacity="0.6"/>
    <!-- Star body: regular six-pointed using two triangles -->
    <polygon points="0,-36 31,18 -31,18" fill="#fbbf24" opacity="0.92"/>
    <polygon points="0,36 31,-18 -31,-18" fill="#d97706" opacity="0.85"/>
    <!-- Center dot -->
    <circle r="9" fill="#fbbf24" opacity="0.98"/>
  </g>

  <!-- Layer 2b: Chopsticks — two angled rods crossing above the plate -->
  <!-- Left chopstick: angled from top-left to lower-right, resting across plate edge -->
  <rect x="-12" y="-4" width="620" height="11" rx="5.5"
        fill="url(#chopstick)" opacity="0.88"
        transform="translate(540,265) rotate(34)"/>
  <!-- Right chopstick: parallel, slightly offset -->
  <rect x="-12" y="-4" width="620" height="11" rx="5.5"
        fill="url(#chopstick)" opacity="0.80"
        transform="translate(568,245) rotate(34)"/>

  <!-- Tip accent dots where chopsticks end (lower tips, inside safe zone) -->
  <circle cx="938" cy="618" r="6" fill="#fbbf24" opacity="0.7"/>
  <circle cx="966" cy="598" r="6" fill="#fbbf24" opacity="0.6"/>

  <!-- Layer 3: Corner decoration (outside hero, variable crop) -->
  <!-- Top-left rust arc suggestion -->
  <path d="M0,0 Q120,0 120,120" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.2"/>
  <path d="M0,0 Q180,0 180,180" stroke="#9a3309" stroke-width="2" fill="none" opacity="0.12"/>
  <!-- Bottom-right rust arc -->
  <path d="M1600,900 Q1480,900 1480,780" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.2"/>
  <path d="M1600,900 Q1420,900 1420,840" stroke="#9a3309" stroke-width="2" fill="none" opacity="0.12"/>

</svg>
