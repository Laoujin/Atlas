<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- moon -->
  <circle cx="1120" cy="230" r="58" fill="#fef3ec" opacity="0.85"/>
  <circle cx="1120" cy="230" r="58" fill="url(#glow)" opacity="0.6"/>

  <!-- Pearl River -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#river)"/>

  <!-- Canton Tower hero: twin-hyperboloid silhouette via two long quad strands -->
  <g opacity="0.95">
    <!-- left strand of the waist-twist -->
    <path d="M735 700 C 770 470, 830 360, 820 180 L 838 180 C 848 360, 808 470, 773 700 Z" fill="url(#tower)"/>
    <!-- right strand -->
    <path d="M865 700 C 830 470, 770 360, 780 180 L 762 180 C 752 360, 792 470, 827 700 Z" fill="url(#tower)" opacity="0.9"/>
    <!-- central core -->
    <path d="M790 700 C 793 470, 796 360, 798 180 L 802 180 C 804 360, 807 470, 810 700 Z" fill="#c2410c" opacity="0.85"/>
    <!-- antenna spire -->
    <rect x="797" y="92" width="6" height="92" fill="#fbbf24"/>
    <circle cx="800" cy="92" r="6" fill="#fef3ec"/>
  </g>

  <!-- reflection in the river -->
  <g opacity="0.3">
    <path d="M735 700 C 770 760, 830 800, 820 720 L 838 720 C 848 800, 808 760, 773 700 Z" fill="#fbbf24"/>
    <path d="M865 700 C 830 760, 770 800, 780 720 L 762 720 C 752 800, 792 760, 827 700 Z" fill="#d97706"/>
  </g>

  <!-- distant skyline bars along the far bank -->
  <g opacity="0.6" fill="#1a0e0e">
    <rect x="180" y="560" width="46" height="80"/>
    <rect x="240" y="520" width="38" height="120"/>
    <rect x="1320" y="540" width="52" height="100"/>
    <rect x="1390" y="500" width="40" height="140"/>
  </g>
</svg>
