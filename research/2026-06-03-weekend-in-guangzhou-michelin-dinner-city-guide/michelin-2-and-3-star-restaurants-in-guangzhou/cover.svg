<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <!-- Warm central glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill: warm ivory -->
    <radialGradient id="plateFill" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.97"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Plate rim gradient for depth -->
    <radialGradient id="plateRim" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="82%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="plateWell" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0eadb" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Star glow for Michelin star accent -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.82"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm central radial glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — two plates + wine glass, centered at (800, 450) -->

  <!-- Wine glass silhouette (behind plates) -->
  <!-- Bowl of glass -->
  <ellipse cx="800" cy="340" rx="72" ry="90" fill="url(#glassGrad)" opacity="0.75"/>
  <!-- Glass stem -->
  <rect x="793" y="428" width="14" height="130" rx="7" fill="#be185d" opacity="0.35"/>
  <!-- Glass base -->
  <ellipse cx="800" cy="565" rx="52" ry="12" fill="#be185d" opacity="0.28"/>
  <!-- Glass rim highlight -->
  <ellipse cx="800" cy="252" rx="72" ry="10" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.55"/>

  <!-- Left plate (slightly behind, offset left) -->
  <!-- Outer rim -->
  <ellipse cx="670" cy="480" rx="168" ry="50" fill="url(#plateFill)" opacity="0.88"/>
  <ellipse cx="670" cy="480" rx="168" ry="50" fill="url(#plateRim)" opacity="0.75"/>
  <!-- Inner well -->
  <ellipse cx="670" cy="476" rx="120" ry="35" fill="url(#plateWell)" opacity="0.82"/>

  <!-- Right plate (slightly behind, offset right) -->
  <ellipse cx="930" cy="480" rx="168" ry="50" fill="url(#plateFill)" opacity="0.88"/>
  <ellipse cx="930" cy="480" rx="168" ry="50" fill="url(#plateRim)" opacity="0.75"/>
  <ellipse cx="930" cy="476" rx="120" ry="35" fill="url(#plateWell)" opacity="0.82"/>

  <!-- Centre hero plate (front, larger) -->
  <ellipse cx="800" cy="530" rx="210" ry="62" fill="url(#plateFill)" opacity="0.95"/>
  <ellipse cx="800" cy="530" rx="210" ry="62" fill="url(#plateRim)" opacity="0.8"/>
  <!-- Centre inner well -->
  <ellipse cx="800" cy="525" rx="152" ry="44" fill="url(#plateWell)" opacity="0.9"/>

  <!-- Michelin star accent — small 6-point star above centre plate -->
  <g transform="translate(800, 430)" opacity="0.92">
    <circle cx="0" cy="0" r="22" fill="url(#starGlow)" opacity="0.6"/>
    <!-- 6-point star made of two triangles -->
    <polygon points="0,-18 5,-8 16,-8 8,0 12,12 0,6 -12,12 -8,0 -16,-8 -5,-8" fill="#fbbf24" opacity="0.95"/>
  </g>

  <!-- Rose accent: subtle arc suggesting a cloche dome over centre plate -->
  <path d="M 590 530 Q 800 380 1010 530" fill="none" stroke="#be185d" stroke-width="2" opacity="0.22"/>

  <!-- Layer 3: Edge decoration (outside safe zone, full-bleed vignette) -->
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Corner accent lines — top left, decorative only -->
  <line x1="0" y1="0" x2="120" y2="0" stroke="#c2410c" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#c2410c" stroke-width="3" opacity="0.4"/>
  <!-- Corner accent lines — bottom right -->
  <line x1="1600" y1="900" x2="1480" y2="900" stroke="#c2410c" stroke-width="3" opacity="0.4"/>
  <line x1="1600" y1="900" x2="1600" y2="820" stroke="#c2410c" stroke-width="3" opacity="0.4"/>
</svg>
