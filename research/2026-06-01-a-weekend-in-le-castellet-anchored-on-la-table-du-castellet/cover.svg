<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="village" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind the village -->
  <circle cx="900" cy="430" r="280" fill="url(#sun)" opacity="0.9"/>

  <!-- Distant ridgeline (Calanques cliffs feel) -->
  <path d="M 0 540 L 180 470 L 340 510 L 520 460 L 720 495 L 900 455 L 1100 490 L 1300 460 L 1600 500 L 1600 620 L 0 620 Z"
        fill="#78350f" opacity="0.55"/>

  <!-- Perched medieval village silhouette (hero, centered ~800,450) -->
  <g fill="url(#village)" opacity="0.95">
    <!-- hill base -->
    <path d="M 380 620 Q 800 380 1220 620 Z"/>
    <!-- village block stack on the crest -->
    <rect x="640" y="430" width="60" height="90"/>
    <rect x="700" y="410" width="55" height="110"/>
    <rect x="755" y="395" width="70" height="125"/>
    <rect x="825" y="385" width="50" height="135"/>
    <rect x="875" y="405" width="60" height="115"/>
    <rect x="935" y="425" width="55" height="95"/>
    <!-- bell tower / chateau hint -->
    <rect x="790" y="340" width="30" height="55"/>
    <polygon points="790,340 805,310 820,340"/>
  </g>

  <!-- Mourvedre vine rows in the foreground -->
  <g stroke="#5c2a1a" stroke-width="3" opacity="0.7" fill="none">
    <path d="M 0 720 Q 800 690 1600 730"/>
    <path d="M 0 760 Q 800 735 1600 770"/>
    <path d="M 0 800 Q 800 780 1600 810"/>
    <path d="M 0 840 Q 800 825 1600 850"/>
  </g>
  <!-- vine leaf accents -->
  <g fill="#6d28d9" opacity="0.55">
    <circle cx="220" cy="715" r="6"/>
    <circle cx="460" cy="705" r="5"/>
    <circle cx="780" cy="695" r="6"/>
    <circle cx="1080" cy="700" r="5"/>
    <circle cx="1360" cy="715" r="6"/>
    <circle cx="340" cy="755" r="5"/>
    <circle cx="640" cy="745" r="6"/>
    <circle cx="980" cy="750" r="5"/>
    <circle cx="1240" cy="755" r="6"/>
  </g>

  <!-- Three Michelin stars, discreet, above the village -->
  <g fill="#fbbf24" opacity="0.9">
    <polygon points="740,250 745,265 760,265 748,274 753,289 740,280 727,289 732,274 720,265 735,265"/>
    <polygon points="800,235 805,250 820,250 808,259 813,274 800,265 787,274 792,259 780,250 795,250"/>
    <polygon points="860,250 865,265 880,265 868,274 873,289 860,280 847,289 852,274 840,265 855,265"/>
  </g>
</svg>
