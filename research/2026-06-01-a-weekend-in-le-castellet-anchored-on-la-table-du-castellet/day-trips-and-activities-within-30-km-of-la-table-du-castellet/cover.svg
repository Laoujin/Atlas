<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliffFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="cliffNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun behind cliffs -->
  <circle cx="1050" cy="430" r="180" fill="url(#sun)" opacity="0.9"/>

  <!-- distant cliff ridge -->
  <path d="M 0 620 L 180 540 L 320 580 L 470 500 L 640 560 L 820 470 L 1000 540 L 1180 490 L 1360 560 L 1600 510 L 1600 720 L 0 720 Z" fill="url(#cliffFar)" opacity="0.75"/>

  <!-- near cliff (hero — Calanques) -->
  <path d="M 240 720 L 340 560 L 430 600 L 540 460 L 660 520 L 780 380 L 900 470 L 1020 420 L 1140 540 L 1260 500 L 1360 720 Z" fill="url(#cliffNear)" opacity="0.92"/>

  <!-- vineyard hint: angled rows in foreground left -->
  <g opacity="0.6" stroke="#78350f" stroke-width="3" fill="none">
    <path d="M 180 760 Q 400 740 620 770"/>
    <path d="M 160 790 Q 400 770 660 800"/>
    <path d="M 140 820 Q 400 800 700 830"/>
  </g>

  <!-- sea band -->
  <rect x="0" y="720" width="1600" height="40" fill="url(#sea)" opacity="0.7"/>

  <!-- grape cluster motif, lower right — Bandol -->
  <g transform="translate(1200 660)" opacity="0.88">
    <circle cx="0" cy="0" r="14" fill="#9a3309"/>
    <circle cx="22" cy="6" r="14" fill="#78350f"/>
    <circle cx="-20" cy="8" r="14" fill="#9a3309"/>
    <circle cx="10" cy="26" r="14" fill="#78350f"/>
    <circle cx="-12" cy="28" r="14" fill="#9a3309"/>
    <circle cx="0" cy="48" r="14" fill="#78350f"/>
    <path d="M -4 -14 Q 8 -28 30 -22" stroke="#5c2a1a" stroke-width="3" fill="none"/>
  </g>

  <!-- ground foreground -->
  <rect x="0" y="755" width="1600" height="145" fill="#78350f" opacity="0.85"/>
</svg>
