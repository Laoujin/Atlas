<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0608"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <!-- Lake surface glow -->
    <radialGradient id="lakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Lake base -->
    <linearGradient id="lakeBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d0608" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Mountain left fill -->
    <linearGradient id="mtnLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Mountain right fill -->
    <linearGradient id="mtnRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1a0a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Candlelight glow -->
    <radialGradient id="candle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#d97706" stop-opacity="0.70"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Moon glow -->
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.90"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Water shimmer reflection -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Subtle stars — atmospheric, low opacity -->
  <circle cx="320" cy="80" r="1.5" fill="#fef3ec" opacity="0.5"/>
  <circle cx="580" cy="140" r="1" fill="#fef3ec" opacity="0.4"/>
  <circle cx="900" cy="60" r="1.5" fill="#fef3ec" opacity="0.45"/>
  <circle cx="1150" cy="110" r="1" fill="#fef3ec" opacity="0.35"/>
  <circle cx="1380" cy="75" r="2" fill="#fef3ec" opacity="0.5"/>
  <circle cx="1500" cy="160" r="1" fill="#fef3ec" opacity="0.3"/>
  <circle cx="200" cy="200" r="1" fill="#fef3ec" opacity="0.3"/>
  <circle cx="700" cy="170" r="1.5" fill="#fef3ec" opacity="0.35"/>

  <!-- Moon -->
  <circle cx="1260" cy="155" r="42" fill="url(#moon)" opacity="0.85"/>
  <circle cx="1260" cy="155" r="22" fill="#fef3ec" opacity="0.88"/>

  <!-- Layer 2: Hero element — Alpine lake scene -->

  <!-- Background mountain ridge (far, lighter) -->
  <polygon points="150,560 380,310 520,400 680,280 820,360 960,240 1100,330 1280,260 1440,350 1600,290 1600,560"
           fill="url(#mtnLeft)" opacity="0.70"/>

  <!-- Foreground mountain left -->
  <polygon points="0,680 220,370 420,500 560,420 680,560 0,560"
           fill="#1a0e0e" opacity="0.92"/>
  <!-- Snow cap left -->
  <polygon points="220,370 260,400 190,415 155,405"
           fill="#fef3ec" opacity="0.18"/>

  <!-- Foreground mountain right -->
  <polygon points="1600,680 1380,350 1160,490 1020,420 920,560 1600,560"
           fill="#2d1208" opacity="0.92"/>
  <!-- Snow cap right -->
  <polygon points="1380,350 1420,385 1350,400 1310,385"
           fill="#fef3ec" opacity="0.15"/>

  <!-- Lake body -->
  <ellipse cx="800" cy="660" rx="680" ry="160" fill="url(#lakeBase)" opacity="0.88"/>

  <!-- Lake glow (evening reflection) -->
  <ellipse cx="800" cy="640" rx="500" ry="120" fill="url(#lakeGlow)" opacity="0.9"/>

  <!-- Moon reflection shimmer on lake -->
  <ellipse cx="1000" cy="630" rx="90" ry="18" fill="url(#shimmer)" opacity="0.55"/>

  <!-- Candlelight reflection streak on water (the dining anchor) -->
  <ellipse cx="800" cy="645" rx="18" ry="55" fill="#fbbf24" opacity="0.22"/>

  <!-- Candlelight hero glow — the restaurant warmth at lake's edge -->
  <ellipse cx="800" cy="530" rx="110" ry="110" fill="url(#candle)" opacity="0.88"/>

  <!-- Candle flame core -->
  <ellipse cx="800" cy="510" rx="14" ry="22" fill="#fbbf24" opacity="0.95"/>
  <ellipse cx="800" cy="505" rx="7" ry="12" fill="#fef3ec" opacity="0.80"/>

  <!-- Plate circle — subtle dining motif at table level -->
  <circle cx="800" cy="555" r="38" fill="none" stroke="#9a3309" stroke-width="2.5" opacity="0.55"/>
  <circle cx="800" cy="555" r="30" fill="none" stroke="#d97706" stroke-width="1" opacity="0.35"/>

  <!-- Layer 3: Edge decoration (outside safe zone, atmospheric) -->
  <!-- Warm horizon glow bleeding across bottom edge -->
  <rect x="0" y="800" width="1600" height="100" fill="#78350f" opacity="0.25"/>

  <!-- Vignette corners -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
