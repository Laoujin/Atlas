<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient: deep night to twilight teal -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a2a"/>
      <stop offset="60%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0e2a2a"/>
    </linearGradient>
    <!-- Valley glow: rust warmth from below -->
    <radialGradient id="valleyglow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#78350f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Mountain fill: dark ridge -->
    <linearGradient id="mtfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3040"/>
      <stop offset="100%" stop-color="#0e1a20"/>
    </linearGradient>
    <!-- Snow cap accent -->
    <linearGradient id="snowfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2f0f5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#b0ccd6" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Node glow: teal -->
    <radialGradient id="nodeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub glow: rust -->
    <radialGradient id="hubglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Layer 1b: Valley warmth glow (full bleed, atmospheric) -->
  <rect width="1600" height="900" fill="url(#valleyglow)"/>

  <!-- Layer 2: Far mountain range (background, lighter) -->
  <polygon
    points="0,620 180,420 320,500 460,360 600,480 720,340 860,460 980,310 1100,430 1240,370 1380,450 1500,360 1600,410 1600,900 0,900"
    fill="#102030" opacity="0.7"/>

  <!-- Layer 2b: Near mountain ridge (hero mountain, darker, in safe zone) -->
  <polygon
    points="200,780 380,520 520,620 640,440 800,320 960,440 1080,600 1220,490 1400,610 1600,520 1600,900 0,900 0,760"
    fill="url(#mtfill)" opacity="0.95"/>

  <!-- Snow caps on near ridge -->
  <polygon
    points="640,440 680,475 740,455 800,320 860,455 920,470 960,440 900,430 860,390 800,320 740,395 700,430 640,440"
    fill="url(#snowfill)" opacity="0.75"/>
  <polygon
    points="1220,490 1250,515 1290,505 1340,490 1300,470 1260,465 1220,490"
    fill="url(#snowfill)" opacity="0.55"/>
  <polygon
    points="380,520 410,545 450,530 480,520 440,500 400,505 380,520"
    fill="url(#snowfill)" opacity="0.45"/>

  <!-- Layer 3: Network graph hero — nodes and edges centered on peak (800, 320) -->

  <!-- Edge lines: connecting nodes, teal, low opacity -->
  <line x1="800" y1="320" x2="640" y2="440" stroke="#0e7490" stroke-width="1.5" opacity="0.55"/>
  <line x1="800" y1="320" x2="960" y2="440" stroke="#0e7490" stroke-width="1.5" opacity="0.55"/>
  <line x1="800" y1="320" x2="700" y2="250" stroke="#0e7490" stroke-width="1.5" opacity="0.55"/>
  <line x1="800" y1="320" x2="900" y2="240" stroke="#0e7490" stroke-width="1.5" opacity="0.55"/>
  <line x1="800" y1="320" x2="780" y2="200" stroke="#0e7490" stroke-width="1.5" opacity="0.5"/>
  <line x1="700" y1="250" x2="600" y2="300" stroke="#0e7490" stroke-width="1" opacity="0.35"/>
  <line x1="900" y1="240" x2="1000" y2="290" stroke="#0e7490" stroke-width="1" opacity="0.35"/>
  <line x1="640" y1="440" x2="560" y2="390" stroke="#0e7490" stroke-width="1" opacity="0.3"/>
  <line x1="960" y1="440" x2="1040" y2="380" stroke="#0e7490" stroke-width="1" opacity="0.3"/>
  <line x1="780" y1="200" x2="700" y2="250" stroke="#0e7490" stroke-width="1" opacity="0.3"/>
  <line x1="780" y1="200" x2="900" y2="240" stroke="#0e7490" stroke-width="1" opacity="0.3"/>

  <!-- Secondary nodes: teal glows -->
  <circle cx="640" cy="440" r="22" fill="url(#nodeglow)" opacity="0.7"/>
  <circle cx="640" cy="440" r="7" fill="#0e7490" opacity="0.9"/>

  <circle cx="960" cy="440" r="22" fill="url(#nodeglow)" opacity="0.7"/>
  <circle cx="960" cy="440" r="7" fill="#0e7490" opacity="0.9"/>

  <circle cx="700" cy="250" r="18" fill="url(#nodeglow)" opacity="0.65"/>
  <circle cx="700" cy="250" r="6" fill="#0e7490" opacity="0.85"/>

  <circle cx="900" cy="240" r="18" fill="url(#nodeglow)" opacity="0.65"/>
  <circle cx="900" cy="240" r="6" fill="#0e7490" opacity="0.85"/>

  <circle cx="780" cy="200" r="14" fill="url(#nodeglow)" opacity="0.6"/>
  <circle cx="780" cy="200" r="5" fill="#22d3ee" opacity="0.8"/>

  <circle cx="560" cy="390" r="12" fill="url(#nodeglow)" opacity="0.45"/>
  <circle cx="560" cy="390" r="4" fill="#0e7490" opacity="0.7"/>

  <circle cx="1040" cy="380" r="12" fill="url(#nodeglow)" opacity="0.45"/>
  <circle cx="1040" cy="380" r="4" fill="#0e7490" opacity="0.7"/>

  <circle cx="600" cy="300" r="10" fill="url(#nodeglow)" opacity="0.4"/>
  <circle cx="600" cy="300" r="4" fill="#0e7490" opacity="0.65"/>

  <circle cx="1000" cy="290" r="10" fill="url(#nodeglow)" opacity="0.4"/>
  <circle cx="1000" cy="290" r="4" fill="#0e7490" opacity="0.65"/>

  <!-- Hero hub: rust/amber node at mountain peak -->
  <circle cx="800" cy="320" r="48" fill="url(#hubglow)" opacity="0.85"/>
  <circle cx="800" cy="320" r="18" fill="#c2410c" opacity="0.95"/>
  <circle cx="800" cy="320" r="10" fill="#fbbf24" opacity="1"/>

  <!-- Decorative: faint city-light scatter at valley base (below safe zone, atmospheric) -->
  <circle cx="420" cy="820" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="510" cy="840" r="2" fill="#d97706" opacity="0.45"/>
  <circle cx="670" cy="855" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="790" cy="848" r="2" fill="#c2410c" opacity="0.5"/>
  <circle cx="910" cy="852" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="1060" cy="838" r="2" fill="#d97706" opacity="0.45"/>
  <circle cx="1180" cy="828" r="3" fill="#fbbf24" opacity="0.4"/>
</svg>
