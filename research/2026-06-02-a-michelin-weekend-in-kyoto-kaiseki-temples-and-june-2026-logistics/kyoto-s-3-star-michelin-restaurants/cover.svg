<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient: deep lacquer -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2e1208"/>
    </linearGradient>

    <!-- Warm table-glow radial beneath plates -->
    <radialGradient id="tableGlow" cx="50%" cy="56%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate: warm porcelain fill -->
    <radialGradient id="plateMain" cx="46%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d1b89a"/>
    </radialGradient>

    <!-- Small accent plate -->
    <radialGradient id="plateSmall" cx="44%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#e5d5bc"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </radialGradient>

    <!-- Lacquer bowl gradient -->
    <radialGradient id="bowl" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1208"/>
    </radialGradient>

    <!-- Bowl highlight -->
    <radialGradient id="bowlSheen" cx="36%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim shadow for main plate -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle vignette at edges -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0d0606" stop-opacity="0.75"/>
  </radialGradient>

  <!-- Layer 3 (decorative, full-bleed): faint radial corona at top edge -->
  <ellipse cx="800" cy="-60" rx="520" ry="180" fill="#c2410c" fill-opacity="0.06"/>

  <!-- Layer 1 continued: warm table-surface glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Layer 2: Hero — kaiseki plate composition, centred ~(800,450) -->

  <!-- Hero: large porcelain dinner plate, ~440px radius → bounding box 880×880, centred 800,450 -->
  <circle cx="800" cy="450" r="310" fill="url(#plateMain)" opacity="0.93"/>
  <!-- Plate inner well (slightly smaller, gives depth) -->
  <circle cx="800" cy="450" r="260" fill="#faf8f2" opacity="0.30"/>
  <!-- Plate rim shadow overlay -->
  <circle cx="800" cy="450" r="310" fill="url(#plateRim)"/>

  <!-- Lacquer bowl placed on the plate, upper-centre -->
  <ellipse cx="800" cy="390" rx="105" ry="72" fill="url(#bowl)" opacity="0.95"/>
  <ellipse cx="800" cy="390" rx="105" ry="72" fill="url(#bowlSheen)" opacity="0.80"/>
  <!-- Bowl rim highlight line -->
  <ellipse cx="800" cy="390" rx="105" ry="72" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Bowl lid knob -->
  <ellipse cx="800" cy="323" rx="18" ry="9" fill="#9a3309" opacity="0.90"/>
  <ellipse cx="800" cy="323" rx="18" ry="9" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.50"/>

  <!-- Small garnish plate, lower-left of main plate -->
  <circle cx="635" cy="540" r="88" fill="url(#plateSmall)" opacity="0.85"/>
  <circle cx="635" cy="540" r="88" fill="url(#plateRim)" opacity="0.70"/>
  <!-- Tiny accent dot on garnish plate (a single ingredient suggestion) -->
  <circle cx="635" cy="530" r="12" fill="#c2410c" opacity="0.70"/>
  <circle cx="635" cy="530" r="6"  fill="#fbbf24" opacity="0.80"/>

  <!-- Chopstick pair: two slim lines, angled, resting at right side of plate -->
  <line x1="892" y1="348" x2="990" y2="570" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
  <line x1="908" y1="344" x2="1006" y2="566" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Layer 3: decorative edge elements (outside safe-zone — clipped variably) -->
  <!-- Bottom-left corner warm smear -->
  <ellipse cx="120" cy="820" rx="200" ry="100" fill="#c2410c" fill-opacity="0.10"/>
  <!-- Top-right corner smear -->
  <ellipse cx="1490" cy="80" rx="180" ry="90" fill="#78350f" fill-opacity="0.12"/>

  <!-- Full-bleed vignette overlay -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
