<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0608"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1505"/>
    </linearGradient>
    <!-- Radial glow behind torii -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Torii pillar gradient -->
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Kasagi (top beam) gradient -->
    <linearGradient id="beam-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Ground fog gradient -->
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon (upper-right, outside main safe zone, decorative) -->
  <ellipse cx="1380" cy="140" rx="52" ry="52" fill="url(#moon-glow)" opacity="0.85"/>
  <ellipse cx="1380" cy="140" rx="34" ry="34" fill="#fef3ec" opacity="0.55"/>

  <!-- Atmospheric haze bands (full-bleed, decorative) -->
  <rect x="0" y="580" width="1600" height="120" fill="url(#fog)" opacity="0.7"/>

  <!-- Layer 2: Hero glow -->
  <ellipse cx="800" cy="460" rx="520" ry="320" fill="url(#glow)"/>

  <!-- Layer 2: Torii gate hero — centered at (800, 450), bounding box ~560w × 480h, fits in safe zone -->
  <!-- Left pillar -->
  <rect x="610" y="240" width="52" height="430" rx="6" fill="url(#pillar)" opacity="0.93"/>
  <!-- Right pillar -->
  <rect x="938" y="240" width="52" height="430" rx="6" fill="url(#pillar)" opacity="0.93"/>

  <!-- Kasagi — top curved crossbeam (simulated with overlapping rects + slight rotation) -->
  <!-- Main kasagi bar -->
  <rect x="565" y="230" width="470" height="44" rx="8" fill="url(#beam-top)" opacity="0.95"/>
  <!-- Kasagi upswept left end -->
  <rect x="557" y="215" width="72" height="28" rx="6" transform="rotate(-6 593 229)" fill="#c2410c" opacity="0.88"/>
  <!-- Kasagi upswept right end -->
  <rect x="971" y="215" width="72" height="28" rx="6" transform="rotate(6 1007 229)" fill="#c2410c" opacity="0.88"/>

  <!-- Shimagi — lower crossbeam -->
  <rect x="594" y="330" width="412" height="30" rx="5" fill="#9a3309" opacity="0.90"/>

  <!-- Nuki — thin horizontal tie-beam between pillars (traditional detail) -->
  <rect x="622" y="390" width="356" height="14" rx="3" fill="#78350f" opacity="0.70"/>

  <!-- Ground line -->
  <rect x="300" y="672" width="1000" height="6" rx="3" fill="#c2410c" opacity="0.28"/>
  <!-- Ground reflection glow -->
  <ellipse cx="800" cy="675" rx="420" ry="18" fill="#d97706" opacity="0.12"/>

  <!-- Layer 3: Edge fog / corner vignette (decorative, full bleed) -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)" opacity="0.18"/>
</svg>
