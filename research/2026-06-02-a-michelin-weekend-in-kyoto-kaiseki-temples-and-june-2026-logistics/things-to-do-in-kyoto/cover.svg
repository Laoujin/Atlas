<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.62" r="0.32">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="pillarFar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="50%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#dusk)"/>
  <!-- low sun glow -->
  <circle cx="800" cy="560" r="280" fill="url(#sun)"/>
  <!-- ground haze -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#ground)"/>

  <!-- receding torii tunnel: farthest first, scaling outward -->

  <!-- gate 5 (farthest) -->
  <g opacity="0.55">
    <rect x="770" y="430" width="14" height="110" fill="url(#pillarFar)"/>
    <rect x="816" y="430" width="14" height="110" fill="url(#pillarFar)"/>
    <rect x="758" y="418" width="84" height="8" fill="#78350f"/>
    <rect x="752" y="406" width="96" height="10" fill="#c2410c"/>
  </g>

  <!-- gate 4 -->
  <g opacity="0.7">
    <rect x="740" y="400" width="20" height="160" fill="url(#pillarFar)"/>
    <rect x="840" y="400" width="20" height="160" fill="url(#pillarFar)"/>
    <rect x="724" y="384" width="152" height="12" fill="#78350f"/>
    <rect x="714" y="366" width="172" height="14" fill="#c2410c"/>
  </g>

  <!-- gate 3 -->
  <g opacity="0.82">
    <rect x="700" y="360" width="28" height="220" fill="url(#pillar)"/>
    <rect x="872" y="360" width="28" height="220" fill="url(#pillar)"/>
    <rect x="678" y="338" width="244" height="16" fill="#78350f"/>
    <rect x="664" y="312" width="272" height="20" fill="#c2410c"/>
  </g>

  <!-- gate 2 -->
  <g opacity="0.9">
    <rect x="640" y="300" width="40" height="300" fill="url(#pillar)"/>
    <rect x="920" y="300" width="40" height="300" fill="url(#pillar)"/>
    <rect x="610" y="270" width="380" height="22" fill="#78350f"/>
    <rect x="590" y="236" width="420" height="28" fill="#c2410c"/>
  </g>

  <!-- gate 1 (hero, nearest) -->
  <g opacity="0.95">
    <!-- left pillar -->
    <rect x="540" y="220" width="60" height="450" fill="url(#pillar)"/>
    <!-- right pillar -->
    <rect x="1000" y="220" width="60" height="450" fill="url(#pillar)"/>
    <!-- lower crossbeam (nuki) -->
    <rect x="500" y="180" width="600" height="32" fill="#78350f"/>
    <!-- upper crossbeam (kasagi) with curved upturned ends -->
    <path d="M 460 150 Q 480 110 510 130 L 1090 130 Q 1120 110 1140 150 L 1140 178 L 460 178 Z" fill="#c2410c"/>
    <!-- ridge accent on kasagi -->
    <path d="M 460 150 Q 480 110 510 130 L 1090 130 Q 1120 110 1140 150 L 1140 158 L 460 158 Z" fill="#9a3309" opacity="0.7"/>
    <!-- small central tablet block (no text) -->
    <rect x="780" y="186" width="40" height="28" fill="#5c2a1a"/>
  </g>

  <!-- ground shadow beneath nearest gate -->
  <ellipse cx="800" cy="678" rx="320" ry="14" fill="#1a0e0e" opacity="0.45"/>
</svg>
