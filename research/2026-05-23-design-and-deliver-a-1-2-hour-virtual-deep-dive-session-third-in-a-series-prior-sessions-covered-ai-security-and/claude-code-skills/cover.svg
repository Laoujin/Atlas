<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="sheetBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#e8d9bf"/>
    </linearGradient>
    <linearGradient id="sheetMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sheetHero" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tabHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="470" r="520" fill="url(#glow)"/>

  <!-- Back layer: faintest, furthest -->
  <g transform="translate(800 470) rotate(-9)" opacity="0.7">
    <rect x="-360" y="-220" width="720" height="440" rx="10" fill="url(#sheetBack)"/>
    <rect x="-360" y="-220" width="200" height="34" rx="6" fill="#d97706" opacity="0.5"/>
    <line x1="-320" y1="-130" x2="220" y2="-130" stroke="#9a3309" stroke-width="3" opacity="0.35"/>
    <line x1="-320" y1="-90" x2="120" y2="-90" stroke="#9a3309" stroke-width="3" opacity="0.35"/>
    <line x1="-320" y1="-50" x2="180" y2="-50" stroke="#9a3309" stroke-width="3" opacity="0.35"/>
  </g>

  <!-- Middle layer -->
  <g transform="translate(800 450) rotate(-4)" opacity="0.85">
    <rect x="-360" y="-220" width="720" height="440" rx="10" fill="url(#sheetMid)"/>
    <rect x="-360" y="-220" width="240" height="34" rx="6" fill="#78350f" opacity="0.55"/>
    <line x1="-320" y1="-130" x2="240" y2="-130" stroke="#78350f" stroke-width="3" opacity="0.4"/>
    <line x1="-320" y1="-90" x2="160" y2="-90" stroke="#78350f" stroke-width="3" opacity="0.4"/>
    <line x1="-320" y1="-50" x2="220" y2="-50" stroke="#78350f" stroke-width="3" opacity="0.4"/>
    <line x1="-320" y1="-10" x2="100" y2="-10" stroke="#78350f" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Hero front sheet -->
  <g transform="translate(800 440) rotate(2)">
    <rect x="-380" y="-240" width="760" height="480" rx="12" fill="url(#sheetHero)"/>
    <!-- YAML frontmatter block (bracketed bars) -->
    <rect x="-340" y="-200" width="60" height="6" fill="#fbbf24" opacity="0.9"/>
    <rect x="-340" y="-200" width="6" height="80" fill="#fbbf24" opacity="0.9"/>
    <rect x="-340" y="-126" width="60" height="6" fill="#fbbf24" opacity="0.9"/>
    <rect x="-285" y="-180" width="180" height="10" rx="2" fill="#fef3ec" opacity="0.85"/>
    <rect x="-285" y="-160" width="240" height="10" rx="2" fill="#fef3ec" opacity="0.7"/>
    <rect x="-285" y="-140" width="140" height="10" rx="2" fill="#fef3ec" opacity="0.7"/>
    <!-- Body text bars -->
    <line x1="-340" y1="-80" x2="320" y2="-80" stroke="#fef3ec" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
    <line x1="-340" y1="-50" x2="240" y2="-50" stroke="#fef3ec" stroke-width="6" opacity="0.6" stroke-linecap="round"/>
    <line x1="-340" y1="-20" x2="300" y2="-20" stroke="#fef3ec" stroke-width="6" opacity="0.6" stroke-linecap="round"/>
    <line x1="-340" y1="10" x2="180" y2="10" stroke="#fef3ec" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
    <!-- Code/script block -->
    <rect x="-340" y="50" width="500" height="140" rx="6" fill="#1a0e0e" opacity="0.55"/>
    <line x1="-320" y1="80" x2="-180" y2="80" stroke="#fbbf24" stroke-width="4" opacity="0.85" stroke-linecap="round"/>
    <line x1="-160" y1="80" x2="-60" y2="80" stroke="#fef3ec" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <line x1="-320" y1="110" x2="-220" y2="110" stroke="#6d28d9" stroke-width="4" opacity="0.85" stroke-linecap="round"/>
    <line x1="-200" y1="110" x2="-80" y2="110" stroke="#fef3ec" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <line x1="-320" y1="140" x2="-160" y2="140" stroke="#fbbf24" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="-140" y1="140" x2="40" y2="140" stroke="#fef3ec" stroke-width="4" opacity="0.55" stroke-linecap="round"/>
    <line x1="-320" y1="170" x2="-240" y2="170" stroke="#6d28d9" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <!-- Tab/folder marker -->
    <path d="M 200 -240 L 380 -240 L 380 -180 L 280 -180 L 250 -200 L 200 -200 Z" fill="url(#tabHero)"/>
    <circle cx="330" cy="-210" r="8" fill="#6d28d9" opacity="0.9"/>
  </g>
</svg>
