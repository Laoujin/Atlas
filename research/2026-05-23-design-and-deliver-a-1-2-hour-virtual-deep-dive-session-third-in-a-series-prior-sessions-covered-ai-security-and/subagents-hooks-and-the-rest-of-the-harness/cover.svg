<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="substrate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gates" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="700" ry="500" fill="url(#glow)"/>

  <!-- outer ring: substrate (settings/permissions/skills) -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="url(#substrate)" stroke-width="36" opacity="0.85"/>

  <!-- middle ring: hooks (determinism gates) — segmented arc -->
  <g opacity="0.9" fill="none" stroke="url(#gates)" stroke-width="26" stroke-linecap="butt">
    <circle cx="800" cy="450" r="230" stroke-dasharray="60 28"/>
  </g>

  <!-- inner ring: subagent isolation boundary -->
  <circle cx="800" cy="450" r="148" fill="none" stroke="#c2410c" stroke-width="4" stroke-dasharray="3 9" opacity="0.7"/>

  <!-- subagent satellites (isolated workers) -->
  <g opacity="0.85">
    <circle cx="800" cy="302" r="22" fill="#9a3309"/>
    <circle cx="800" cy="302" r="9" fill="#fbbf24" opacity="0.9"/>

    <circle cx="928" cy="376" r="22" fill="#9a3309"/>
    <circle cx="928" cy="376" r="9" fill="#fbbf24" opacity="0.9"/>

    <circle cx="928" cy="524" r="22" fill="#9a3309"/>
    <circle cx="928" cy="524" r="9" fill="#fbbf24" opacity="0.9"/>

    <circle cx="800" cy="598" r="22" fill="#9a3309"/>
    <circle cx="800" cy="598" r="9" fill="#fbbf24" opacity="0.9"/>

    <circle cx="672" cy="524" r="22" fill="#9a3309"/>
    <circle cx="672" cy="524" r="9" fill="#fbbf24" opacity="0.9"/>

    <circle cx="672" cy="376" r="22" fill="#9a3309"/>
    <circle cx="672" cy="376" r="9" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- hero: central model hub -->
  <circle cx="800" cy="450" r="78" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="78" fill="none" stroke="#78350f" stroke-width="3" opacity="0.6"/>
  <circle cx="800" cy="450" r="40" fill="none" stroke="#fef3ec" stroke-width="2" opacity="0.5"/>
</svg>
