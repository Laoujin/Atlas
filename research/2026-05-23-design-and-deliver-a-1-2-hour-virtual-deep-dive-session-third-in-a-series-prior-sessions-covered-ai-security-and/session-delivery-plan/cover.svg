<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="past" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6cdb8"/>
      <stop offset="1" stop-color="#b8ad94"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="heroShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft warm glow behind hero -->
  <ellipse cx="800" cy="500" rx="620" ry="340" fill="url(#glow)"/>

  <!-- Timeline rail -->
  <line x1="240" y1="640" x2="1360" y2="640" stroke="#78350f" stroke-width="3" opacity="0.35"/>
  <line x1="240" y1="640" x2="1010" y2="640" stroke="#c2410c" stroke-width="5" opacity="0.7"/>

  <!-- Past session block 1 (AI) -->
  <g opacity="0.75">
    <rect x="260" y="380" width="240" height="260" rx="10" fill="url(#past)"/>
    <rect x="260" y="380" width="240" height="34" rx="10" fill="#78350f" opacity="0.55"/>
    <rect x="284" y="436" width="170" height="6" rx="3" fill="#5c3a1f" opacity="0.4"/>
    <rect x="284" y="456" width="140" height="6" rx="3" fill="#5c3a1f" opacity="0.4"/>
    <rect x="284" y="476" width="160" height="6" rx="3" fill="#5c3a1f" opacity="0.4"/>
    <rect x="284" y="496" width="110" height="6" rx="3" fill="#5c3a1f" opacity="0.4"/>
    <circle cx="380" cy="640" r="11" fill="#78350f" opacity="0.6"/>
  </g>

  <!-- Past session block 2 (Security) -->
  <g opacity="0.85">
    <rect x="540" y="350" width="240" height="290" rx="10" fill="url(#past)"/>
    <rect x="540" y="350" width="240" height="34" rx="10" fill="#78350f" opacity="0.6"/>
    <rect x="564" y="406" width="170" height="6" rx="3" fill="#5c3a1f" opacity="0.45"/>
    <rect x="564" y="426" width="150" height="6" rx="3" fill="#5c3a1f" opacity="0.45"/>
    <rect x="564" y="446" width="180" height="6" rx="3" fill="#5c3a1f" opacity="0.45"/>
    <rect x="564" y="466" width="120" height="6" rx="3" fill="#5c3a1f" opacity="0.45"/>
    <rect x="564" y="486" width="160" height="6" rx="3" fill="#5c3a1f" opacity="0.45"/>
    <circle cx="660" cy="640" r="11" fill="#78350f" opacity="0.7"/>
  </g>

  <!-- HERO: third session, current -->
  <g>
    <rect x="820" y="200" width="360" height="440" rx="14" fill="url(#hero)"/>
    <rect x="820" y="200" width="360" height="52" rx="14" fill="#78350f"/>
    <rect x="820" y="244" width="360" height="8" fill="#78350f"/>
    <rect x="820" y="200" width="360" height="440" rx="14" fill="url(#heroShine)" opacity="0.6"/>

    <!-- Agenda block rows inside hero -->
    <rect x="852" y="290" width="220" height="10" rx="5" fill="#fef3ec" opacity="0.9"/>
    <rect x="852" y="310" width="80" height="6" rx="3" fill="#fbbf24" opacity="0.85"/>

    <rect x="852" y="346" width="260" height="10" rx="5" fill="#fef3ec" opacity="0.9"/>
    <rect x="852" y="366" width="120" height="6" rx="3" fill="#fbbf24" opacity="0.85"/>

    <rect x="852" y="402" width="240" height="10" rx="5" fill="#fef3ec" opacity="0.9"/>
    <rect x="852" y="422" width="100" height="6" rx="3" fill="#fbbf24" opacity="0.85"/>

    <rect x="852" y="458" width="280" height="10" rx="5" fill="#fef3ec" opacity="0.9"/>
    <rect x="852" y="478" width="90" height="6" rx="3" fill="#fbbf24" opacity="0.85"/>

    <rect x="852" y="514" width="200" height="10" rx="5" fill="#fef3ec" opacity="0.9"/>
    <rect x="852" y="534" width="140" height="6" rx="3" fill="#fbbf24" opacity="0.85"/>

    <rect x="852" y="570" width="180" height="10" rx="5" fill="#fef3ec" opacity="0.9"/>

    <!-- Timeline node for hero -->
    <circle cx="1000" cy="640" r="18" fill="#c2410c" stroke="#fbbf24" stroke-width="4"/>
  </g>

  <!-- Future / continuity marker -->
  <circle cx="1240" cy="640" r="9" fill="#78350f" opacity="0.25"/>
  <circle cx="1320" cy="640" r="7" fill="#78350f" opacity="0.18"/>
</svg>
