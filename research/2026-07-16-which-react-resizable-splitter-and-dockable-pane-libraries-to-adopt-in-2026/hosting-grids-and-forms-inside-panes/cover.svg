<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="form" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- window frame -->
  <rect x="350" y="180" width="900" height="540" rx="20" fill="#78350f" opacity="0.15"/>

  <!-- grid pane -->
  <rect x="372" y="202" width="396" height="496" rx="10" fill="url(#grid)" opacity="0.92"/>
  <g fill="#fef3ec" opacity="0.85">
    <rect x="400" y="250" width="340" height="34" rx="6" opacity="0.55"/>
    <rect x="400" y="312" width="340" height="24" rx="5"/>
    <rect x="400" y="360" width="340" height="24" rx="5"/>
    <rect x="400" y="408" width="340" height="24" rx="5"/>
    <rect x="400" y="456" width="340" height="24" rx="5"/>
    <rect x="400" y="504" width="340" height="24" rx="5"/>
    <rect x="400" y="552" width="340" height="24" rx="5"/>
    <rect x="400" y="600" width="340" height="24" rx="5"/>
  </g>

  <!-- form pane -->
  <rect x="832" y="202" width="396" height="496" rx="10" fill="url(#form)" opacity="0.92"/>
  <g opacity="0.9">
    <rect x="864" y="256" width="150" height="18" rx="5" fill="#fbbf24" opacity="0.8"/>
    <rect x="864" y="286" width="332" height="44" rx="8" fill="#faf8f2" opacity="0.85"/>
    <rect x="864" y="356" width="150" height="18" rx="5" fill="#fbbf24" opacity="0.8"/>
    <rect x="864" y="386" width="332" height="44" rx="8" fill="#faf8f2" opacity="0.85"/>
    <rect x="864" y="456" width="150" height="18" rx="5" fill="#fbbf24" opacity="0.8"/>
    <rect x="864" y="486" width="332" height="44" rx="8" fill="#faf8f2" opacity="0.85"/>
    <rect x="1076" y="618" width="120" height="46" rx="10" fill="#d97706"/>
  </g>

  <!-- resize divider handle -->
  <rect x="792" y="202" width="16" height="496" rx="8" fill="#9a3309"/>
  <g fill="#fbbf24">
    <circle cx="800" cy="436" r="6"/>
    <circle cx="800" cy="460" r="6"/>
    <circle cx="800" cy="484" r="6"/>
  </g>
</svg>
