<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f7ead9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- ghost restore layer: prior session's saved layout tree -->
  <g opacity="0.32" transform="translate(56 52)">
    <rect x="400" y="205" width="800" height="490" rx="26" fill="none" stroke="#78350f" stroke-width="6" stroke-dasharray="20 16"/>
    <line x1="720" y1="205" x2="720" y2="695" stroke="#78350f" stroke-width="5" stroke-dasharray="20 16"/>
    <line x1="720" y1="450" x2="1200" y2="450" stroke="#78350f" stroke-width="5" stroke-dasharray="20 16"/>
  </g>

  <!-- hero: restored dockable pane layout, centered ~ (800,450) -->
  <g opacity="0.95">
    <rect x="400" y="205" width="800" height="490" rx="26" fill="#ffffff" stroke="#78350f" stroke-width="5"/>

    <!-- left docked pane -->
    <rect x="424" y="229" width="272" height="442" rx="12" fill="url(#panel)"/>
    <rect x="452" y="266" width="150" height="15" rx="7" fill="#c2410c" opacity="0.55"/>
    <rect x="452" y="304" width="216" height="11" rx="5" fill="#78350f" opacity="0.3"/>
    <rect x="452" y="332" width="196" height="11" rx="5" fill="#78350f" opacity="0.3"/>
    <rect x="452" y="360" width="216" height="11" rx="5" fill="#78350f" opacity="0.3"/>

    <!-- splitter -->
    <rect x="704" y="229" width="12" height="442" rx="6" fill="#d97706" opacity="0.7"/>

    <!-- top-right hero pane (active / focused) -->
    <rect x="724" y="229" width="452" height="200" rx="12" fill="url(#hero)"/>
    <rect x="756" y="272" width="230" height="18" rx="9" fill="#fbbf24" opacity="0.85"/>
    <rect x="756" y="312" width="330" height="12" rx="6" fill="#fef3ec" opacity="0.5"/>
    <rect x="756" y="340" width="300" height="12" rx="6" fill="#fef3ec" opacity="0.5"/>

    <!-- horizontal splitter -->
    <rect x="724" y="437" width="452" height="12" rx="6" fill="#d97706" opacity="0.7"/>

    <!-- bottom-right pane -->
    <rect x="724" y="457" width="452" height="214" rx="12" fill="url(#panel)"/>
    <rect x="756" y="496" width="180" height="15" rx="7" fill="#c2410c" opacity="0.55"/>
    <rect x="756" y="534" width="388" height="11" rx="5" fill="#78350f" opacity="0.3"/>
    <rect x="756" y="562" width="360" height="11" rx="5" fill="#78350f" opacity="0.3"/>
    <rect x="756" y="590" width="388" height="11" rx="5" fill="#78350f" opacity="0.3"/>
  </g>
</svg>
