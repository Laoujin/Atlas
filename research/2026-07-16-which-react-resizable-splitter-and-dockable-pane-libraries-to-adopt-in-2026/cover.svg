<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f6e6d6"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: soft corner washes, outside hero safe zone -->
  <circle cx="90" cy="60" r="220" fill="#fbbf24" opacity="0.12"/>
  <circle cx="1530" cy="860" r="260" fill="#c2410c" opacity="0.1"/>

  <!-- hero: docking layout frame, centered ~ (800,450), inside safe zone -->
  <g opacity="0.95">
    <rect x="350" y="200" width="900" height="500" rx="26" fill="#ffffff" opacity="0.85" stroke="#78350f" stroke-opacity="0.2" stroke-width="3"/>

    <!-- left pane -->
    <rect x="378" y="228" width="300" height="444" rx="14" fill="url(#pane)"/>
    <rect x="410" y="270" width="200" height="14" rx="7" fill="#78350f" opacity="0.25"/>
    <rect x="410" y="304" width="236" height="14" rx="7" fill="#78350f" opacity="0.18"/>
    <rect x="410" y="338" width="170" height="14" rx="7" fill="#78350f" opacity="0.18"/>

    <!-- right-top pane -->
    <rect x="738" y="228" width="484" height="196" rx="14" fill="url(#pane)"/>
    <rect x="772" y="272" width="300" height="14" rx="7" fill="#9a3309" opacity="0.22"/>
    <rect x="772" y="306" width="240" height="14" rx="7" fill="#9a3309" opacity="0.16"/>

    <!-- right-bottom pane -->
    <rect x="738" y="476" width="484" height="196" rx="14" fill="url(#pane)"/>
    <rect x="772" y="520" width="270" height="14" rx="7" fill="#9a3309" opacity="0.16"/>
    <rect x="772" y="554" width="330" height="14" rx="7" fill="#9a3309" opacity="0.16"/>

    <!-- hero splitter: vertical rust divider with grab handle -->
    <rect x="690" y="228" width="34" height="444" rx="17" fill="url(#rust)"/>
    <circle cx="707" cy="428" r="6" fill="#fef3ec" opacity="0.9"/>
    <circle cx="707" cy="450" r="6" fill="#fef3ec" opacity="0.9"/>
    <circle cx="707" cy="472" r="6" fill="#fef3ec" opacity="0.9"/>

    <!-- horizontal splitter in right column -->
    <rect x="738" y="434" width="484" height="16" rx="8" fill="#c2410c" opacity="0.85"/>
  </g>
</svg>
