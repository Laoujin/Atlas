<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Docked layout: left pane + two stacked right panes -->
  <g opacity="0.9">
    <rect x="320" y="210" width="470" height="470" rx="16" fill="url(#dock)" stroke="#c2410c" stroke-width="3"/>
    <rect x="320" y="210" width="470" height="46" rx="16" fill="#c2410c" opacity="0.28"/>
    <rect x="356" y="224" width="120" height="18" rx="9" fill="#78350f" opacity="0.35"/>

    <rect x="820" y="210" width="460" height="210" rx="16" fill="url(#dock)" stroke="#c2410c" stroke-width="3"/>
    <rect x="820" y="210" width="460" height="42" rx="16" fill="#c2410c" opacity="0.28"/>
    <rect x="854" y="222" width="104" height="16" rx="8" fill="#78350f" opacity="0.35"/>

    <rect x="820" y="470" width="460" height="210" rx="16" fill="url(#dock)" stroke="#c2410c" stroke-width="3"/>
    <rect x="820" y="470" width="460" height="42" rx="16" fill="#c2410c" opacity="0.28"/>
    <rect x="854" y="482" width="104" height="16" rx="8" fill="#78350f" opacity="0.35"/>
  </g>

  <!-- Floating hero pane, elevated over the dock -->
  <g opacity="0.95">
    <rect x="612" y="392" width="520" height="316" rx="20" fill="url(#hero)"/>
    <rect x="612" y="392" width="520" height="56" rx="20" fill="#78350f" opacity="0.5"/>
    <circle cx="1096" cy="420" r="9" fill="#fbbf24"/>
    <rect x="654" y="410" width="150" height="20" rx="10" fill="#fef3ec" opacity="0.85"/>
    <rect x="654" y="492" width="360" height="16" rx="8" fill="#fbbf24" opacity="0.75"/>
    <rect x="654" y="536" width="300" height="16" rx="8" fill="#fef3ec" opacity="0.6"/>
    <rect x="654" y="580" width="330" height="16" rx="8" fill="#fef3ec" opacity="0.45"/>
    <rect x="654" y="624" width="240" height="16" rx="8" fill="#fef3ec" opacity="0.35"/>
  </g>
</svg>
