<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- Left resizable pane -->
  <rect x="370" y="210" width="380" height="480" rx="18" fill="url(#pane)" stroke="#78350f" stroke-opacity="0.18" stroke-width="3"/>
  <!-- Right-top resizable pane -->
  <rect x="810" y="210" width="420" height="230" rx="18" fill="url(#pane)" stroke="#78350f" stroke-opacity="0.18" stroke-width="3"/>
  <!-- Right-bottom resizable pane -->
  <rect x="810" y="460" width="420" height="230" rx="18" fill="url(#pane)" stroke="#78350f" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Vertical draggable divider (hero) -->
  <rect x="772" y="230" width="16" height="440" rx="8" fill="#c2410c" opacity="0.35"/>
  <rect x="762" y="400" width="36" height="100" rx="18" fill="url(#hero)" opacity="0.95"/>
</svg>
