<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1206"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Chassis top face -->
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Chassis left face -->
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Chassis right face -->
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Teal accent gradient for arc -->
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- LED dot gradient -->
    <radialGradient id="led" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Teal LED -->
    <radialGradient id="ledTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed edge decoration: faint horizontal scan lines at very low opacity -->
  <rect x="0" y="0" width="1600" height="900" fill="none"
        stroke="#c2410c" stroke-width="1" stroke-opacity="0.04"
        stroke-dasharray="1600 0"/>

  <!-- Layer 2: Hero — isometric server stack centered near (800, 450) -->

  <!-- Glow halo behind the stack -->
  <ellipse cx="800" cy="460" rx="480" ry="300" fill="url(#glow)"/>

  <!-- Isometric helper:
       For a 30° isometric projection with unit vectors:
       right  = (cos30, sin30) = (0.866, 0.5)
       left   = (-cos30, sin30) = (-0.866, 0.5)
       up     = (0, -1)

       Chassis slab: width=320, depth=220, height=48
       Each slab stacked 70px apart vertically
  -->

  <!-- === SLAB 3 (bottom) — center base at (800, 580) === -->
  <!-- Top face: parallelogram -->
  <polygon points="800,514 1077,653 800,792 523,653" fill="url(#topFace)" opacity="0.65"/>
  <!-- Left face -->
  <polygon points="523,653 800,792 800,840 523,701" fill="url(#leftFace)" opacity="0.75"/>
  <!-- Right face -->
  <polygon points="1077,653 800,792 800,840 1077,701" fill="url(#rightFace)" opacity="0.7"/>

  <!-- === SLAB 2 (middle) — shifted up 130px === -->
  <polygon points="800,384 1077,523 800,662 523,523" fill="url(#topFace)" opacity="0.78"/>
  <polygon points="523,523 800,662 800,710 523,571" fill="url(#leftFace)" opacity="0.85"/>
  <polygon points="1077,523 800,662 800,710 1077,571" fill="url(#rightFace)" opacity="0.8"/>

  <!-- === SLAB 1 (top / hero face) — shifted up another 130px === -->
  <polygon points="800,254 1077,393 800,532 523,393" fill="url(#topFace)" opacity="0.92"/>
  <polygon points="523,393 800,532 800,580 523,441" fill="url(#leftFace)" opacity="0.95"/>
  <polygon points="1077,393 800,532 800,580 1077,441" fill="url(#rightFace)" opacity="0.9"/>

  <!-- LED strip on top slab right face — amber dots -->
  <circle cx="1020" cy="472" r="7" fill="url(#led)" opacity="0.95"/>
  <circle cx="990"  cy="488" r="7" fill="url(#led)" opacity="0.75"/>
  <circle cx="960"  cy="504" r="5" fill="url(#ledTeal)" opacity="0.9"/>

  <!-- LED strip on middle slab right face -->
  <circle cx="1020" cy="602" r="7" fill="url(#ledTeal)" opacity="0.85"/>
  <circle cx="990"  cy="618" r="5" fill="url(#led)" opacity="0.6"/>

  <!-- Backup orbit arc — teal, partial circle suggesting rotation/cycle -->
  <!-- Arc centered at (800, 450), radius 370, from ~210° to ~330° (left sweep below) -->
  <!-- Using a large arc path -->
  <path d="M 480,543 A 370,370 0 0 0 1120,543"
        fill="none" stroke="url(#arcGrad)" stroke-width="5"
        stroke-linecap="round" opacity="0.7"/>

  <!-- Arrow head at arc end to suggest direction/cycle -->
  <polygon points="1120,543 1098,520 1142,520" fill="#0e7490" opacity="0.75"/>

  <!-- Teal circuit-line accent from arc to right edge (decorative, outside safe zone) -->
  <line x1="1120" y1="543" x2="1480" y2="543"
        stroke="#0e7490" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Left counterpart -->
  <line x1="480" y1="543" x2="120" y2="543"
        stroke="#0e7490" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Corner accent: top-left rust band (purely decorative, will be cropped) -->
  <rect x="0" y="0" width="180" height="6" fill="#c2410c" opacity="0.3"/>
  <rect x="0" y="0" width="6" height="180" fill="#c2410c" opacity="0.3"/>

  <!-- Corner accent: bottom-right -->
  <rect x="1420" y="894" width="180" height="6" fill="#c2410c" opacity="0.3"/>
  <rect x="1594" y="720" width="6" height="180" fill="#c2410c" opacity="0.3"/>

</svg>
