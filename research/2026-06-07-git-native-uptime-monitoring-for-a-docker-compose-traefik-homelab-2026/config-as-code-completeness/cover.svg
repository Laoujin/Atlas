<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <linearGradient id="rust-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rust-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slate-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="block-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="block-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="block-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centered on hero -->
  <ellipse cx="800" cy="450" rx="580" ry="360" fill="url(#glow)"/>

  <!-- Layer 2: Hero — 8 domain blocks arranged in isometric-style stacked rows -->
  <!-- Row 1 (top): 3 blocks -->
  <!-- Block 1 -->
  <rect x="360" y="190" width="220" height="90" rx="6" fill="url(#block-dark)" opacity="0.88"/>
  <rect x="362" y="192" width="216" height="12" rx="3" fill="#475569" opacity="0.5"/>

  <!-- Block 2 -->
  <rect x="590" y="170" width="220" height="90" rx="6" fill="url(#block-top)" opacity="0.92"/>
  <rect x="592" y="172" width="216" height="12" rx="3" fill="#c2410c" opacity="0.45"/>

  <!-- Block 3 -->
  <rect x="820" y="190" width="220" height="90" rx="6" fill="url(#block-dark)" opacity="0.88"/>
  <rect x="822" y="192" width="216" height="12" rx="3" fill="#475569" opacity="0.5"/>

  <!-- Row 2 (middle): 3 blocks, offset and slightly larger -->
  <!-- Block 4 -->
  <rect x="295" y="320" width="240" height="100" rx="6" fill="url(#block-amber)" opacity="0.85"/>
  <rect x="297" y="322" width="236" height="13" rx="3" fill="#fbbf24" opacity="0.35"/>

  <!-- Block 5 — hero center, largest, rust primary -->
  <rect x="545" y="300" width="510" height="110" rx="8" fill="url(#rust-primary)" opacity="0.95"/>
  <rect x="548" y="303" width="504" height="15" rx="4" fill="#d97706" opacity="0.4"/>
  <!-- LED dot accent on hero block -->
  <circle cx="1020" cy="355" r="7" fill="#fbbf24" opacity="0.9"/>
  <circle cx="1020" cy="355" r="13" fill="#fbbf24" opacity="0.2"/>

  <!-- Block 6 -->
  <rect x="1065" y="320" width="240" height="100" rx="6" fill="url(#block-dark)" opacity="0.85"/>
  <rect x="1067" y="322" width="236" height="13" rx="3" fill="#475569" opacity="0.5"/>

  <!-- Row 3 (bottom): 2 blocks -->
  <!-- Block 7 -->
  <rect x="430" y="455" width="310" height="90" rx="6" fill="url(#block-dark)" opacity="0.82"/>
  <rect x="432" y="457" width="306" height="12" rx="3" fill="#334155" opacity="0.5"/>

  <!-- Block 8 -->
  <rect x="760" y="455" width="310" height="90" rx="6" fill="url(#block-amber)" opacity="0.82"/>
  <rect x="762" y="457" width="306" height="12" rx="3" fill="#fbbf24" opacity="0.3"/>

  <!-- Connector lines between blocks — circuit/graph metaphor -->
  <line x1="700" y1="260" x2="700" y2="300" stroke="#c2410c" stroke-width="2" opacity="0.5"/>
  <line x1="900" y1="260" x2="900" y2="300" stroke="#c2410c" stroke-width="2" opacity="0.5"/>
  <line x1="415" y1="280" x2="415" y2="320" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <line x1="940" y1="280" x2="1185" y2="320" stroke="#475569" stroke-width="1.5" opacity="0.35"/>
  <line x1="590" y1="410" x2="590" y2="455" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <line x1="915" y1="410" x2="915" y2="455" stroke="#d97706" stroke-width="2" opacity="0.45"/>

  <!-- Layer 3: Edge decoration (outside safe zone, purely atmospheric) -->
  <!-- Corner bracket top-left -->
  <rect x="0" y="0" width="100" height="4" fill="#c2410c" opacity="0.3"/>
  <rect x="0" y="0" width="4" height="100" fill="#c2410c" opacity="0.3"/>
  <!-- Corner bracket bottom-right -->
  <rect x="1500" y="896" width="100" height="4" fill="#c2410c" opacity="0.3"/>
  <rect x="1596" y="800" width="4" height="100" fill="#c2410c" opacity="0.3"/>
</svg>
