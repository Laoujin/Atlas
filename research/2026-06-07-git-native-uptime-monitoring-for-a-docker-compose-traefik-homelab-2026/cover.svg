<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal homelab -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Rack panel face gradient -->
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Rack panel side (isometric depth) -->
    <linearGradient id="chassisSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Rust glow radial -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- LED green-ish active dot -->
    <radialGradient id="ledActive" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- LED rust dot -->
    <radialGradient id="ledRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Uptime arc gradient -->
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge grid texture (decorative, outside safe zone horizontally) -->
  <!-- Left edge columns -->
  <rect x="0" y="0" width="2" height="900" fill="#c2410c" opacity="0.08"/>
  <rect x="40" y="0" width="1" height="900" fill="#334155" opacity="0.12"/>
  <rect x="80" y="0" width="1" height="900" fill="#334155" opacity="0.08"/>
  <!-- Right edge columns -->
  <rect x="1598" y="0" width="2" height="900" fill="#c2410c" opacity="0.08"/>
  <rect x="1559" y="0" width="1" height="900" fill="#334155" opacity="0.12"/>
  <rect x="1519" y="0" width="1" height="900" fill="#334155" opacity="0.08"/>
  <!-- Top/bottom edge rows -->
  <rect x="0" y="0" width="1600" height="2" fill="#c2410c" opacity="0.08"/>
  <rect x="0" y="898" width="1600" height="2" fill="#c2410c" opacity="0.08"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone x:125-1475, y:90-810 -->

  <!-- Ambient glow behind rack -->
  <ellipse cx="800" cy="480" rx="420" ry="220" fill="url(#glow)" opacity="0.85"/>

  <!-- Rack enclosure outer shell (isometric-style, face + right side + top) -->
  <!-- Main face: 560 wide × 340 tall, centered at 800,460 → x:520,y:290 -->

  <!-- Top face of isometric rack (parallelogram) -->
  <polygon points="520,290 1080,290 1124,248 564,248" fill="#263445" opacity="0.9"/>

  <!-- Right side face (depth shadow) -->
  <polygon points="1080,290 1124,248 1124,588 1080,630" fill="#0f172a" opacity="0.95"/>

  <!-- Main front face -->
  <rect x="520" y="290" width="560" height="340" rx="6" fill="url(#chassis)" opacity="0.95"/>

  <!-- Front face bezel inset -->
  <rect x="534" y="304" width="532" height="312" rx="4" fill="#1e293b" opacity="0.7"/>

  <!-- Chassis unit rows — 4 server units stacked -->
  <!-- Unit 1 (top) -->
  <rect x="548" y="318" width="504" height="58" rx="3" fill="#334155" opacity="0.85"/>
  <rect x="548" y="318" width="504" height="2" fill="#475569" opacity="0.5"/>
  <!-- Unit 1 LED dots -->
  <circle cx="580" cy="347" r="6" fill="url(#ledActive)" opacity="0.95"/>
  <circle cx="600" cy="347" r="6" fill="url(#ledActive)" opacity="0.95"/>
  <circle cx="620" cy="347" r="4" fill="#334155" opacity="0.6"/>
  <!-- Unit 1 activity bar (rust accent) -->
  <rect x="648" y="336" width="120" height="8" rx="4" fill="#c2410c" opacity="0.7"/>
  <rect x="648" y="352" width="80" height="6" rx="3" fill="#9a3309" opacity="0.5"/>
  <!-- Unit 1 port block -->
  <rect x="960" y="332" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>
  <rect x="998" y="332" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>

  <!-- Unit 2 -->
  <rect x="548" y="384" width="504" height="58" rx="3" fill="#2d3f52" opacity="0.85"/>
  <rect x="548" y="384" width="504" height="2" fill="#475569" opacity="0.4"/>
  <circle cx="580" cy="413" r="6" fill="url(#ledActive)" opacity="0.95"/>
  <circle cx="600" cy="413" r="6" fill="url(#ledActive)" opacity="0.95"/>
  <circle cx="620" cy="413" r="4" fill="#334155" opacity="0.6"/>
  <rect x="648" y="402" width="160" height="8" rx="4" fill="#c2410c" opacity="0.65"/>
  <rect x="648" y="418" width="60" height="6" rx="3" fill="#9a3309" opacity="0.45"/>
  <rect x="960" y="398" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>
  <rect x="998" y="398" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>

  <!-- Unit 3 -->
  <rect x="548" y="450" width="504" height="58" rx="3" fill="#334155" opacity="0.85"/>
  <rect x="548" y="450" width="504" height="2" fill="#475569" opacity="0.4"/>
  <circle cx="580" cy="479" r="6" fill="url(#ledActive)" opacity="0.95"/>
  <circle cx="600" cy="479" r="6" fill="url(#ledRust)" opacity="0.9"/>
  <circle cx="620" cy="479" r="4" fill="#334155" opacity="0.6"/>
  <rect x="648" y="468" width="90" height="8" rx="4" fill="#d97706" opacity="0.7"/>
  <rect x="648" y="484" width="140" height="6" rx="3" fill="#c2410c" opacity="0.5"/>
  <rect x="960" y="464" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>
  <rect x="998" y="464" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>

  <!-- Unit 4 (bottom) -->
  <rect x="548" y="516" width="504" height="58" rx="3" fill="#2d3f52" opacity="0.85"/>
  <rect x="548" y="516" width="504" height="2" fill="#475569" opacity="0.4"/>
  <circle cx="580" cy="545" r="6" fill="url(#ledActive)" opacity="0.95"/>
  <circle cx="600" cy="545" r="6" fill="url(#ledActive)" opacity="0.95"/>
  <circle cx="620" cy="545" r="4" fill="#334155" opacity="0.6"/>
  <rect x="648" y="534" width="200" height="8" rx="4" fill="#c2410c" opacity="0.6"/>
  <rect x="648" y="550" width="110" height="6" rx="3" fill="#9a3309" opacity="0.45"/>
  <rect x="960" y="530" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>
  <rect x="998" y="530" width="32" height="14" rx="2" fill="#0f172a" opacity="0.8"/>

  <!-- Uptime pulse arc above rack (hero accent) -->
  <!-- Arc drawn as a thick stroke path, rust-amber glow -->
  <path d="M 590 290 Q 800 170 1010 290" stroke="url(#arcGrad)" stroke-width="4" fill="none" opacity="0.85"/>
  <path d="M 620 290 Q 800 195 980 290" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Pulse dot at arc apex -->
  <circle cx="800" cy="198" r="10" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="198" r="18" fill="#d97706" opacity="0.25"/>

  <!-- Rack mounting ears (left/right flanges) -->
  <rect x="510" y="294" width="12" height="330" rx="2" fill="#1e293b" opacity="0.8"/>
  <rect x="1078" y="294" width="12" height="330" rx="2" fill="#1e293b" opacity="0.7"/>

  <!-- Bottom rack foot shadow -->
  <ellipse cx="800" cy="636" rx="300" ry="18" fill="#0f172a" opacity="0.5"/>
</svg>
