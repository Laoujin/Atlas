<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="leak" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- boundary wall (the proxy) with a gap -->
  <rect x="775" y="150" width="50" height="270" fill="#78350f" opacity="0.9"/>
  <rect x="775" y="540" width="50" height="270" fill="#78350f" opacity="0.9"/>

  <!-- internal service block (left, behind the wall) -->
  <rect x="360" y="320" width="300" height="260" rx="14" fill="url(#inner)" opacity="0.92"/>
  <rect x="392" y="362" width="180" height="20" rx="10" fill="#fef3ec" opacity="0.45"/>
  <rect x="392" y="404" width="236" height="20" rx="10" fill="#fef3ec" opacity="0.3"/>
  <rect x="392" y="446" width="140" height="20" rx="10" fill="#fef3ec" opacity="0.3"/>

  <!-- exposed status page block (right, public side) -->
  <rect x="940" y="320" width="300" height="260" rx="14" fill="url(#outer)" opacity="0.95"/>
  <circle cx="985" cy="370" r="12" fill="#fbbf24"/>
  <rect x="1015" y="360" width="170" height="20" rx="10" fill="#fef3ec" opacity="0.55"/>
  <rect x="972" y="408" width="220" height="18" rx="9" fill="#fef3ec" opacity="0.35"/>
  <rect x="972" y="446" width="170" height="18" rx="9" fill="#fef3ec" opacity="0.35"/>

  <!-- leak: spark crossing the gap in the wall -->
  <circle cx="800" cy="465" r="120" fill="url(#leak)"/>
  <path d="M660 450 C 740 450, 740 465, 800 465 C 860 465, 860 450, 940 450"
        fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <circle cx="800" cy="465" r="16" fill="#fbbf24"/>
  <circle cx="800" cy="465" r="7" fill="#9a3309"/>
</svg>
