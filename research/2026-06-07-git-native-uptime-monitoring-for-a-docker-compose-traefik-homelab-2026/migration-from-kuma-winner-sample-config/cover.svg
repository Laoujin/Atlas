<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal infra tone -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1a0e"/>
      <stop offset="100%" stop-color="#0f1a22"/>
    </linearGradient>

    <!-- Rust chassis gradient (departing - Kuma) -->
    <linearGradient id="rustTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rustFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c1a05"/>
    </linearGradient>
    <linearGradient id="rustSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3d1a06"/>
    </linearGradient>

    <!-- Slate chassis gradient (arriving - Gatus) -->
    <linearGradient id="slateTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="slateFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="slateSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>

    <!-- Migration trail glow -->
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Amber glow radial for trail midpoint -->
    <radialGradient id="midGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- LED dot glow -->
    <radialGradient id="ledRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledSlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed edge vignette -->
  <rect width="1600" height="900" fill="#000" opacity="0.18"/>

  <!-- Layer 3: Corner/edge decoration (outside safe zone, atmospheric) -->
  <!-- Faint grid lines top-left corner -->
  <line x1="0" y1="120" x2="110" y2="120" stroke="#c2410c" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="160" x2="80" y2="160" stroke="#c2410c" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="200" x2="50" y2="200" stroke="#c2410c" stroke-width="1" opacity="0.06"/>
  <line x1="120" y1="0" x2="120" y2="80" stroke="#c2410c" stroke-width="1" opacity="0.12"/>
  <line x1="160" y1="0" x2="160" y2="50" stroke="#c2410c" stroke-width="1" opacity="0.08"/>
  <!-- Faint grid lines bottom-right corner -->
  <line x1="1490" y1="820" x2="1600" y2="820" stroke="#334155" stroke-width="1" opacity="0.12"/>
  <line x1="1520" y1="850" x2="1600" y2="850" stroke="#334155" stroke-width="1" opacity="0.08"/>
  <line x1="1480" y1="900" x2="1480" y2="815" stroke="#334155" stroke-width="1" opacity="0.12"/>
  <line x1="1520" y1="900" x2="1520" y2="840" stroke="#334155" stroke-width="1" opacity="0.08"/>

  <!-- Layer 2: Hero elements — two isometric chassis blocks + migration trail -->
  <!-- Safe zone: x 125-1475, y 90-810. Hero centered at ~(800,450) -->

  <!-- Mid-glow halo between the two blocks -->
  <ellipse cx="800" cy="460" rx="260" ry="120" fill="url(#midGlow)"/>

  <!-- === LEFT CHASSIS (Rust / Uptime Kuma) === -->
  <!-- Isometric box: top face, front face, right side face -->
  <!-- Top face (parallelogram, lit) -->
  <polygon points="310,290 610,230 730,300 430,360" fill="url(#rustTop)" opacity="0.92"/>
  <!-- Front face -->
  <polygon points="310,290 430,360 430,530 310,460" fill="url(#rustFront)" opacity="0.88"/>
  <!-- Right side face -->
  <polygon points="430,360 730,300 730,470 430,530" fill="url(#rustSide)" opacity="0.85"/>

  <!-- Chassis detail: vent slots on front face -->
  <line x1="318" y1="390" x2="422" y2="450" stroke="#fbbf24" stroke-width="2" opacity="0.22"/>
  <line x1="318" y1="410" x2="422" y2="470" stroke="#fbbf24" stroke-width="2" opacity="0.18"/>
  <line x1="318" y1="430" x2="422" y2="490" stroke="#fbbf24" stroke-width="2" opacity="0.14"/>

  <!-- Chassis detail: panel lines on right side -->
  <line x1="480" y1="310" x2="480" y2="480" stroke="#1a0e0e" stroke-width="2" opacity="0.30"/>
  <line x1="580" y1="290" x2="580" y2="455" stroke="#1a0e0e" stroke-width="2" opacity="0.20"/>

  <!-- LED dot on rust chassis front-right edge -->
  <circle cx="700" cy="375" r="18" fill="url(#ledRust)" opacity="0.85"/>
  <circle cx="700" cy="375" r="6" fill="#fbbf24" opacity="0.95"/>

  <!-- Status bar on top face of rust chassis -->
  <polygon points="340,310 540,270 580,285 380,325" fill="#9a3309" opacity="0.55"/>
  <polygon points="340,310 380,325 380,335 340,320" fill="#c2410c" opacity="0.40"/>

  <!-- === RIGHT CHASSIS (Slate / Gatus) === -->
  <!-- Top face -->
  <polygon points="870,230 1170,290 1290,220 990,160" fill="url(#slateTop)" opacity="0.92"/>
  <!-- Front face -->
  <polygon points="870,230 990,160 990,330 870,400" fill="url(#slateFront)" opacity="0.88"/>
  <!-- Right side face (left-facing in iso) -->
  <polygon points="990,160 1290,220 1290,390 990,330" fill="url(#slateSide)" opacity="0.85"/>

  <!-- Chassis detail: vent slots on front face (Gatus) -->
  <line x1="878" y1="290" x2="982" y2="360" stroke="#93c5fd" stroke-width="2" opacity="0.20"/>
  <line x1="878" y1="310" x2="982" y2="380" stroke="#93c5fd" stroke-width="2" opacity="0.15"/>
  <line x1="878" y1="330" x2="982" y2="400" stroke="#93c5fd" stroke-width="2" opacity="0.11"/>

  <!-- Panel lines on slate right side -->
  <line x1="1090" y1="190" x2="1090" y2="360" stroke="#0a0f1a" stroke-width="2" opacity="0.30"/>
  <line x1="1190" y1="210" x2="1190" y2="380" stroke="#0a0f1a" stroke-width="2" opacity="0.20"/>

  <!-- LED dot on slate chassis (green-blue status) -->
  <circle cx="960" cy="205" r="18" fill="url(#ledSlate)" opacity="0.85"/>
  <circle cx="960" cy="205" r="6" fill="#93c5fd" opacity="0.95"/>

  <!-- Status bar on top face of slate chassis -->
  <polygon points="900,195 1060,165 1090,175 930,205" fill="#1e293b" opacity="0.60"/>
  <polygon points="900,195 930,205 930,215 900,205" fill="#475569" opacity="0.40"/>

  <!-- === MIGRATION TRAIL (connecting the two chassis) === -->
  <!-- Main arrow/trail beam from rust LED out to slate LED -->
  <!-- Curved path: from right edge of rust chassis toward left edge of slate chassis -->
  <path d="M 730,400 C 780,420 820,440 800,450 C 780,460 820,480 870,430"
        stroke="url(#trailGrad)" stroke-width="4" fill="none" opacity="0.80"/>

  <!-- Arrow head at destination -->
  <polygon points="865,418 880,428 862,440" fill="#d97706" opacity="0.90"/>

  <!-- Trail particles -->
  <circle cx="755" cy="412" r="4" fill="#d97706" opacity="0.75"/>
  <circle cx="778" cy="424" r="3" fill="#fbbf24" opacity="0.65"/>
  <circle cx="800" cy="450" r="5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="822" cy="466" r="3" fill="#d97706" opacity="0.65"/>
  <circle cx="846" cy="448" r="4" fill="#d97706" opacity="0.70"/>

  <!-- Subtle upward arc secondary trail (overhead cable metaphor) -->
  <path d="M 730,370 C 790,310 820,300 870,310"
        stroke="#c2410c" stroke-width="2" fill="none" opacity="0.30" stroke-dasharray="8,6"/>

</svg>
