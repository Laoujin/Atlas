<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1a14"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#2a1410" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- left plate (secondary, smaller) -->
  <ellipse cx="500" cy="500" rx="240" ry="80" fill="#0a0606" opacity="0.55"/>
  <circle cx="500" cy="460" r="195" fill="url(#plate)"/>
  <circle cx="500" cy="460" r="195" fill="none" stroke="url(#rim)" stroke-width="3" opacity="0.85"/>
  <circle cx="500" cy="460" r="160" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.4"/>

  <!-- right plate (secondary, smaller) -->
  <ellipse cx="1140" cy="520" rx="220" ry="72" fill="#0a0606" opacity="0.5"/>
  <circle cx="1140" cy="480" r="175" fill="url(#plate)"/>
  <circle cx="1140" cy="480" r="175" fill="none" stroke="url(#rim)" stroke-width="3" opacity="0.8"/>
  <circle cx="1140" cy="480" r="142" fill="none" stroke="#be185d" stroke-width="1" opacity="0.35"/>

  <!-- hero: large central star on its own plate halo -->
  <circle cx="800" cy="450" r="280" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="800" cy="450" r="240" fill="url(#plate)"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.9"/>
  <circle cx="800" cy="450" r="205" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.45"/>

  <!-- hero star (5-pointed, centered at 800,450) -->
  <polygon points="800,290 833,403 951,403 855,471 891,584 800,515 709,584 745,471 649,403 767,403"
           fill="url(#star)" stroke="#78350f" stroke-width="2" opacity="0.95"/>
  <!-- inner highlight on star -->
  <polygon points="800,330 822,408 900,408 838,452 860,528 800,482 740,528 762,452 700,408 778,408"
           fill="none" stroke="#fef3ec" stroke-width="0.8" opacity="0.35"/>

  <!-- subtle skyline silhouette along the bottom (decoration, croppable) -->
  <g opacity="0.7">
    <rect x="0" y="820" width="1600" height="80" fill="#0a0606"/>
    <!-- St. Stephen's spire approx -->
    <polygon points="380,820 395,720 410,820" fill="#0a0606"/>
    <rect x="388" y="760" width="14" height="60" fill="#0a0606"/>
    <!-- domes -->
    <path d="M 1000 820 Q 1020 780 1040 820 Z" fill="#0a0606"/>
    <path d="M 1200 820 Q 1225 770 1250 820 Z" fill="#0a0606"/>
    <rect x="1208" y="800" width="34" height="20" fill="#0a0606"/>
    <!-- secondary roofline blocks -->
    <rect x="150" y="800" width="60" height="20" fill="#0a0606"/>
    <rect x="600" y="795" width="80" height="25" fill="#0a0606"/>
    <rect x="850" y="800" width="50" height="20" fill="#0a0606"/>
    <rect x="1380" y="795" width="70" height="25" fill="#0a0606"/>
  </g>

  <!-- five small stars arranged as a subtle constellation above the hero (representing the six restaurants — kept as decoration, low opacity) -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="320" cy="180" r="3"/>
    <circle cx="540" cy="130" r="2.5"/>
    <circle cx="800" cy="115" r="3.5"/>
    <circle cx="1080" cy="140" r="2.5"/>
    <circle cx="1300" cy="195" r="3"/>
  </g>
</svg>
