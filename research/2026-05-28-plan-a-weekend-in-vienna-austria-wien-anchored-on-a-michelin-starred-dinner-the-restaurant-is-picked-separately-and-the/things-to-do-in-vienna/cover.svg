<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun glow behind hero -->
  <circle cx="800" cy="520" r="380" fill="url(#sun)"/>

  <!-- distant hill / ground band -->
  <rect x="0" y="760" width="1600" height="140" fill="#5c2a1a" opacity="0.85"/>
  <rect x="0" y="755" width="1600" height="12" fill="#78350f" opacity="0.7"/>

  <!-- coffee-house circle accent (left, soft) -->
  <circle cx="320" cy="690" r="58" fill="#78350f" opacity="0.7"/>
  <ellipse cx="320" cy="678" rx="42" ry="10" fill="#c2410c" opacity="0.8"/>
  <path d="M 378 678 Q 410 678 410 700 Q 410 720 380 720" fill="none" stroke="#78350f" stroke-width="6" opacity="0.7"/>

  <!-- wine glass silhouette (right, Heuriger nod) -->
  <path d="M 1240 620 Q 1240 690 1280 700 Q 1320 690 1320 620 Z" fill="#be185d" opacity="0.75"/>
  <rect x="1278" y="700" width="4" height="50" fill="#78350f" opacity="0.8"/>
  <ellipse cx="1280" cy="752" rx="28" ry="5" fill="#78350f" opacity="0.8"/>

  <!-- HERO: Stephansdom-style Gothic spire, centered around (800, 450) -->
  <!-- cathedral body base -->
  <path d="M 700 760 L 700 600 L 740 580 L 740 520 L 760 510 L 760 460 L 780 450 L 780 250 L 800 180 L 820 250 L 820 450 L 840 460 L 840 510 L 860 520 L 860 580 L 900 600 L 900 760 Z"
        fill="url(#spire)" opacity="0.92"/>

  <!-- ornamented roof band (south tower nod, patterned roof) -->
  <path d="M 700 600 L 900 600 L 900 700 L 700 700 Z" fill="url(#roof)" opacity="0.88"/>
  <path d="M 720 610 L 740 610 L 740 690 L 720 690 Z M 760 610 L 780 610 L 780 690 L 760 690 Z M 820 610 L 840 610 L 840 690 L 820 690 Z M 860 610 L 880 610 L 880 690 L 860 690 Z"
        fill="#fbbf24" opacity="0.45"/>

  <!-- tracery windows on tower -->
  <path d="M 790 350 L 810 350 L 810 420 Q 800 410 790 420 Z" fill="#1a0e0e" opacity="0.55"/>
  <path d="M 788 470 L 812 470 L 812 510 Q 800 502 788 510 Z" fill="#1a0e0e" opacity="0.5"/>

  <!-- spire cross / orb finial -->
  <circle cx="800" cy="172" r="6" fill="#fbbf24" opacity="0.95"/>
  <rect x="797" y="150" width="6" height="22" fill="#fbbf24" opacity="0.9"/>

  <!-- subtle flanking pinnacles for cathedral feel -->
  <path d="M 660 760 L 660 640 L 670 620 L 680 640 L 680 760 Z" fill="#5c2a1a" opacity="0.85"/>
  <path d="M 920 760 L 920 640 L 930 620 L 940 640 L 940 760 Z" fill="#5c2a1a" opacity="0.85"/>

  <!-- foreground warm haze -->
  <rect x="0" y="700" width="1600" height="60" fill="#d97706" opacity="0.15"/>
</svg>
