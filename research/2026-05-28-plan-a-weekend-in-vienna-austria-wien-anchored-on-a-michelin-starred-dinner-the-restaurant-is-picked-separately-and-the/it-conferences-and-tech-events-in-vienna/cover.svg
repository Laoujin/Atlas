<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="470" r="520" fill="url(#glow)"/>

  <!-- distant skyline silhouette (decoration, full-bleed bottom) -->
  <g fill="#1a0e0e" opacity="0.85">
    <polygon points="0,760 120,760 130,720 145,720 150,760 260,760 270,700 285,690 300,700 305,760 420,760 430,740 445,720 460,740 465,760 600,760 610,710 625,690 635,675 645,690 660,710 670,760 0,760"/>
    <!-- Stephansdom-ish spire -->
    <polygon points="1080,760 1100,760 1110,640 1120,600 1130,640 1140,760 1160,760 1160,700 1175,700 1175,760 1280,760 1290,720 1300,710 1310,720 1320,760 1600,760 1600,800 0,800 0,760"/>
  </g>

  <!-- Riesenrad: hero centered at (800, 450) -->
  <g transform="translate(800 450)">
    <!-- support struts -->
    <line x1="-130" y1="320" x2="0" y2="0" stroke="#9a3309" stroke-width="9" opacity="0.9"/>
    <line x1="130" y1="320" x2="0" y2="0" stroke="#9a3309" stroke-width="9" opacity="0.9"/>
    <line x1="-90" y1="320" x2="0" y2="0" stroke="#78350f" stroke-width="6" opacity="0.75"/>
    <line x1="90" y1="320" x2="0" y2="0" stroke="#78350f" stroke-width="6" opacity="0.75"/>

    <!-- outer rim -->
    <circle r="290" fill="none" stroke="#c2410c" stroke-width="7" opacity="0.9"/>
    <circle r="282" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.55"/>

    <!-- spokes (16) doubling as network edges -->
    <g stroke="#d97706" stroke-width="2.2" opacity="0.8">
      <line x1="0" y1="0" x2="290" y2="0"/>
      <line x1="0" y1="0" x2="268" y2="111"/>
      <line x1="0" y1="0" x2="205" y2="205"/>
      <line x1="0" y1="0" x2="111" y2="268"/>
      <line x1="0" y1="0" x2="0" y2="290"/>
      <line x1="0" y1="0" x2="-111" y2="268"/>
      <line x1="0" y1="0" x2="-205" y2="205"/>
      <line x1="0" y1="0" x2="-268" y2="111"/>
      <line x1="0" y1="0" x2="-290" y2="0"/>
      <line x1="0" y1="0" x2="-268" y2="-111"/>
      <line x1="0" y1="0" x2="-205" y2="-205"/>
      <line x1="0" y1="0" x2="-111" y2="-268"/>
      <line x1="0" y1="0" x2="0" y2="-290"/>
      <line x1="0" y1="0" x2="111" y2="-268"/>
      <line x1="0" y1="0" x2="205" y2="-205"/>
      <line x1="0" y1="0" x2="268" y2="-111"/>
    </g>

    <!-- nodes at spoke ends: gondolas as network nodes -->
    <g fill="#fbbf24" opacity="0.92">
      <circle cx="290" cy="0" r="11"/>
      <circle cx="268" cy="111" r="11"/>
      <circle cx="205" cy="205" r="11"/>
      <circle cx="111" cy="268" r="11"/>
      <circle cx="0" cy="290" r="11"/>
      <circle cx="-111" cy="268" r="11"/>
      <circle cx="-205" cy="205" r="11"/>
      <circle cx="-268" cy="111" r="11"/>
      <circle cx="-290" cy="0" r="11"/>
      <circle cx="-268" cy="-111" r="11"/>
      <circle cx="-205" cy="-205" r="11"/>
      <circle cx="-111" cy="-268" r="11"/>
      <circle cx="0" cy="-290" r="11"/>
      <circle cx="111" cy="-268" r="11"/>
      <circle cx="205" cy="-205" r="11"/>
      <circle cx="268" cy="-111" r="11"/>
    </g>
    <g fill="#c2410c" opacity="0.95">
      <circle cx="290" cy="0" r="5"/>
      <circle cx="0" cy="290" r="5"/>
      <circle cx="-290" cy="0" r="5"/>
      <circle cx="0" cy="-290" r="5"/>
    </g>

    <!-- central hub -->
    <circle r="34" fill="url(#hub)"/>
    <circle r="34" fill="none" stroke="#78350f" stroke-width="2"/>
    <circle r="10" fill="#1a0e0e" opacity="0.7"/>
  </g>
</svg>
