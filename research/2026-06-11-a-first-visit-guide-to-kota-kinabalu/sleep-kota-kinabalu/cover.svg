<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sunset glow behind hero -->
  <circle cx="800" cy="470" r="320" fill="url(#sun)" opacity="0.95"/>
  <circle cx="800" cy="470" r="135" fill="#fbbf24" opacity="0.9"/>

  <!-- water -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#water)" opacity="0.92"/>
  <rect x="560" y="668" width="480" height="9" rx="4" fill="#fbbf24" opacity="0.45"/>
  <rect x="610" y="706" width="380" height="7" rx="3" fill="#d97706" opacity="0.5"/>
  <rect x="660" y="744" width="280" height="6" rx="3" fill="#fbbf24" opacity="0.35"/>

  <!-- hero: stilted eco-lodge silhouette -->
  <g fill="#1a0e0e" opacity="0.92">
    <!-- pitched roof with eaves -->
    <polygon points="588,430 800,278 1012,430 968,430 800,322 632,430"/>
    <polygon points="632,430 800,322 968,430"/>
    <!-- lodge body -->
    <rect x="668" y="430" width="264" height="178"/>
    <!-- stilts over the water -->
    <rect x="690" y="608" width="16" height="78"/>
    <rect x="752" y="608" width="16" height="78"/>
    <rect x="832" y="608" width="16" height="78"/>
    <rect x="894" y="608" width="16" height="78"/>
  </g>

  <!-- glowing doorway / window -->
  <rect x="778" y="494" width="44" height="114" rx="4" fill="#fbbf24" opacity="0.85"/>
  <rect x="700" y="476" width="40" height="54" rx="4" fill="#d97706" opacity="0.8"/>
  <rect x="860" y="476" width="40" height="54" rx="4" fill="#d97706" opacity="0.8"/>
</svg>
