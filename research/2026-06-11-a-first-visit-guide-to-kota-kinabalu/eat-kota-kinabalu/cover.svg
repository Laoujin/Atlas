<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="plate" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.92"/>
    </radialGradient>
    <radialGradient id="bowl" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- secondary plate behind, rose-tinted rim -->
  <circle cx="1075" cy="500" r="190" fill="#78350f" opacity="0.85"/>
  <circle cx="1075" cy="500" r="190" fill="none" stroke="#be185d" stroke-width="10" opacity="0.7"/>

  <!-- hero plate -->
  <circle cx="800" cy="450" r="265" fill="#5c2a1a" opacity="0.92"/>
  <circle cx="800" cy="450" r="248" fill="url(#plate)"/>
  <circle cx="800" cy="450" r="150" fill="none" stroke="#fef3ec" stroke-width="6" opacity="0.6"/>

  <!-- food mound on hero plate -->
  <circle cx="800" cy="450" r="120" fill="url(#bowl)"/>
  <path d="M 700 470 q 100 -120 200 0 q -100 60 -200 0 Z" fill="#c2410c" opacity="0.85"/>

  <!-- steam ribbons rising from the hero -->
  <path d="M 760 300 q 40 -45 0 -90 q -40 -45 0 -90" fill="none" stroke="#fef3ec" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
  <path d="M 840 300 q -40 -45 0 -90 q 40 -45 0 -90" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round" opacity="0.65"/>
</svg>
