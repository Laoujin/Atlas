<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="62%" stop-color="#2a140e"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="gong" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="78%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
