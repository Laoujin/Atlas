    <circle cx="800" cy="450" r="272" fill="#78350f" opacity="0.85"/>
    <circle cx="800" cy="450" r="258" fill="url(#gong)"/>
    <circle cx="800" cy="450" r="258" fill="none" stroke="#3a1c0c" stroke-width="6" opacity="0.6"/>
    <circle cx="800" cy="450" r="206" fill="none" stroke="#78350f" stroke-width="10" opacity="0.7"/>
    <circle cx="800" cy="450" r="150" fill="none" stroke="#9a3309" stroke-width="12" opacity="0.7"/>
    <circle cx="800" cy="450" r="92" fill="url(#boss)"/>
    <circle cx="800" cy="450" r="92" fill="none" stroke="#78350f" stroke-width="6" opacity="0.65"/>
    <ellipse cx="762" cy="408" rx="120" ry="70" fill="#fde9b8" opacity="0.18"/>
