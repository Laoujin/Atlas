<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind hero -->
  <circle cx="800" cy="430" r="320" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="450" r="150" fill="#fef3ec" opacity="0.85"/>

  <!-- hero island massif -->
  <path d="M 360 600 L 620 360 L 720 440 L 800 250 L 905 470 L 1010 380 L 1240 600 Z"
        fill="url(#peak)" opacity="0.95"/>
  <!-- ridge highlight / river facet -->
  <path d="M 800 250 L 855 380 L 800 470 L 745 400 Z" fill="#c2410c" opacity="0.7"/>

  <!-- reef / sea bands across foreground -->
  <path d="M 0 600 Q 400 560 800 600 T 1600 600 L 1600 720 Q 1200 690 800 720 T 0 720 Z"
        fill="url(#sea)" opacity="0.9"/>
  <path d="M 0 720 Q 400 690 800 720 T 1600 720 L 1600 900 L 0 900 Z"
        fill="#78350f" opacity="0.92"/>
  <path d="M 0 660 Q 500 635 1000 665 T 1600 655" fill="none"
        stroke="#fbbf24" stroke-width="6" opacity="0.65"/>
</svg>
