<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.42" stop-color="#9a3309"/>
      <stop offset="0.72" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun halo + hero sun, centred in safe zone -->
  <circle cx="800" cy="440" r="300" fill="url(#halo)"/>
  <circle cx="800" cy="440" r="150" fill="url(#sun)" opacity="0.95"/>

  <!-- Mount Kinabalu jagged silhouette behind the sun -->
  <path d="M 250 560 L 470 430 L 560 470 L 690 300 L 760 360 L 820 250 L 890 340 L 970 290 L 1060 410 L 1180 360 L 1360 560 Z"
        fill="#78350f" opacity="0.92"/>

  <!-- offshore islands on the horizon -->
  <path d="M 180 560 q 70 -34 150 0 Z" fill="#5c2a1a" opacity="0.85"/>
  <path d="M 1230 560 q 110 -46 240 0 Z" fill="#5c2a1a" opacity="0.85"/>

  <!-- sea -->
  <rect x="0" y="558" width="1600" height="342" fill="url(#sea)"/>

  <!-- sun reflection on the water -->
  <path d="M 740 560 L 860 560 L 940 900 L 660 900 Z" fill="#fbbf24" opacity="0.6"/>
  <rect x="0" y="612" width="1600" height="10" fill="#fef3ec" opacity="0.25"/>
  <rect x="0" y="690" width="1600" height="8" fill="#fbbf24" opacity="0.2"/>
</svg>
