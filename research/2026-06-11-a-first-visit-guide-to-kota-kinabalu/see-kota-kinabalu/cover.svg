<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="0.8" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.4" stop-color="#fbbf24"/>
      <stop offset="0.8" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="430" r="300" fill="url(#sun)" opacity="0.95"/>

  <!-- Mount Kinabalu jagged ridge, hero -->
  <polygon points="180,720 430,470 540,540 660,360 760,420 800,230 880,400 1010,300 1120,470 1240,420 1420,720"
           fill="url(#peak)" opacity="0.92"/>
  <!-- secondary lower ridge for depth -->
  <polygon points="180,720 360,560 520,620 700,500 860,600 1040,520 1240,610 1420,720"
           fill="#78350f" opacity="0.7"/>

  <!-- sea band with reflection -->
  <rect x="0" y="710" width="1600" height="190" fill="url(#sea)" opacity="0.9"/>
  <ellipse cx="800" cy="730" rx="240" ry="22" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="800" cy="775" rx="160" ry="14" fill="#fbbf24" opacity="0.45"/>

  <!-- island silhouettes (decoration near edges) -->
  <ellipse cx="320" cy="712" rx="150" ry="30" fill="#1a0e0e" opacity="0.75"/>
  <ellipse cx="1300" cy="712" rx="180" ry="34" fill="#1a0e0e" opacity="0.75"/>
</svg>
