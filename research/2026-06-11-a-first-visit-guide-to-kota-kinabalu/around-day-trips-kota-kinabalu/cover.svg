<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- cropped corner decoration -->
  <circle cx="120" cy="820" r="240" fill="#d97706" opacity="0.08"/>
  <circle cx="1490" cy="100" r="220" fill="#c2410c" opacity="0.08"/>

  <!-- day-trip orbit ring -->
  <circle cx="800" cy="450" r="270" fill="none" stroke="#9a3309" stroke-width="3" opacity="0.35"/>

  <!-- radiating routes -->
  <g fill="none" stroke="#c2410c" stroke-width="11" stroke-linecap="round" opacity="0.7">
    <path d="M800 450 Q760 320 800 180"/>
    <path d="M800 450 Q980 360 1044 336"/>
    <path d="M800 450 Q960 560 1021 605"/>
    <path d="M800 450 Q640 560 579 605"/>
    <path d="M800 450 Q640 350 566 315"/>
  </g>

  <!-- destination nodes -->
  <g opacity="0.92">
    <circle cx="800" cy="180" r="30" fill="#d97706"/>
    <circle cx="1044" cy="336" r="30" fill="#9a3309"/>
    <circle cx="1021" cy="605" r="30" fill="#fbbf24"/>
    <circle cx="579" cy="605" r="30" fill="#9a3309"/>
    <circle cx="566" cy="315" r="30" fill="#d97706"/>
  </g>

  <!-- central transport hub (hero) -->
  <circle cx="800" cy="450" r="92" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="44" fill="#fef3ec" opacity="0.85"/>
  <circle cx="800" cy="450" r="18" fill="#9a3309" opacity="0.9"/>
</svg>
