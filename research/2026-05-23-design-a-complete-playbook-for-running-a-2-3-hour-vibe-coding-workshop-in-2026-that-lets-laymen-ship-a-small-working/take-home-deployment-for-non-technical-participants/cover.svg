<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="topLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="midLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="botLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="fadeLayer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="700" ry="320" fill="url(#glow)"/>

  <!-- Decorative corner ticks (timeline ghosts, outside safe zone) -->
  <g opacity="0.18" fill="#78350f">
    <rect x="60" y="820" width="40" height="3"/>
    <rect x="130" y="820" width="40" height="3"/>
    <rect x="200" y="820" width="40" height="3"/>
    <rect x="1360" y="60" width="40" height="3"/>
    <rect x="1430" y="60" width="40" height="3"/>
    <rect x="1500" y="60" width="40" height="3"/>
  </g>

  <!-- Hero: stacked deployment slabs, isometric, centered ~(800,450) -->
  <!-- Bottom slab: stable foundation -->
  <g opacity="0.95">
    <polygon points="500,640 1100,640 1200,580 600,580" fill="url(#botLayer)"/>
    <polygon points="500,640 500,700 1100,700 1100,640" fill="#5c2a1a"/>
    <polygon points="1100,640 1200,580 1200,640 1100,700" fill="#78350f"/>
  </g>

  <!-- Middle slab: platform layer -->
  <g opacity="0.92">
    <polygon points="500,540 1100,540 1200,480 600,480" fill="url(#midLayer)"/>
    <polygon points="500,540 500,600 1100,600 1100,540" fill="#78350f"/>
    <polygon points="1100,540 1200,480 1200,540 1100,600" fill="#9a3309"/>
    <!-- status LED -->
    <circle cx="1150" cy="570" r="6" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Top slab: app layer, partially faded on the right (the "tail" decay) -->
  <g opacity="0.9">
    <polygon points="500,440 1100,440 1200,380 600,380" fill="url(#topLayer)"/>
    <polygon points="500,440 500,500 1100,500 1100,440" fill="url(#fadeLayer)"/>
    <polygon points="1100,440 1200,380 1200,440 1100,500" fill="#9a3309" opacity="0.6"/>
  </g>

  <!-- Hero accent: hourglass form rising from the stack, the "two-week tail" -->
  <g transform="translate(800,310)">
    <!-- upper bulb -->
    <path d="M -55,-130 L 55,-130 L 25,-65 L -25,-65 Z" fill="#c2410c" opacity="0.88"/>
    <!-- lower bulb -->
    <path d="M -25,-55 L 25,-55 L 55,10 L -55,10 Z" fill="#9a3309" opacity="0.88"/>
    <!-- sand falling -->
    <rect x="-2" y="-58" width="4" height="55" fill="#fbbf24" opacity="0.85"/>
    <!-- frame -->
    <line x1="-60" y1="-130" x2="60" y2="-130" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <line x1="-60" y1="10" x2="60" y2="10" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <!-- accumulated sand bottom -->
    <path d="M -45,5 Q 0,-15 45,5 L 45,10 L -45,10 Z" fill="#fbbf24" opacity="0.75"/>
    <!-- remaining sand top -->
    <path d="M -45,-125 L 45,-125 L 25,-75 L -25,-75 Z" fill="#fbbf24" opacity="0.55"/>
  </g>

  <!-- Subtle connector lines between slabs (signal of dependency) -->
  <g stroke="#78350f" stroke-width="1.5" opacity="0.35">
    <line x1="640" y1="500" x2="640" y2="540"/>
    <line x1="780" y1="500" x2="780" y2="540"/>
    <line x1="920" y1="500" x2="920" y2="540"/>
    <line x1="640" y1="600" x2="640" y2="640"/>
    <line x1="780" y1="600" x2="780" y2="640"/>
    <line x1="920" y1="600" x2="920" y2="640"/>
  </g>
</svg>
