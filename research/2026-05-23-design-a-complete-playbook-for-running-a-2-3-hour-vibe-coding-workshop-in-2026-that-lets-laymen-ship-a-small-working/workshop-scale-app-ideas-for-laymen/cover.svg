<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="460" r="520" fill="url(#glow)"/>

  <!-- back card 1 (teal accent) -->
  <g transform="translate(800 450) rotate(-18) translate(-260 -180)" opacity="0.85">
    <rect width="520" height="360" rx="18" fill="url(#card2)" stroke="#0e7490" stroke-width="3"/>
    <rect x="40" y="48" width="200" height="16" rx="6" fill="#0e7490" opacity="0.55"/>
    <rect x="40" y="84" width="320" height="10" rx="4" fill="#78350f" opacity="0.25"/>
    <rect x="40" y="106" width="280" height="10" rx="4" fill="#78350f" opacity="0.2"/>
    <rect x="40" y="170" width="440" height="140" rx="10" fill="#0e7490" opacity="0.12"/>
  </g>

  <!-- back card 2 (rust tint) -->
  <g transform="translate(800 450) rotate(-6) translate(-260 -180)" opacity="0.92">
    <rect width="520" height="360" rx="18" fill="#fef3ec" stroke="#c2410c" stroke-width="3"/>
    <rect x="40" y="48" width="180" height="16" rx="6" fill="#c2410c" opacity="0.7"/>
    <rect x="40" y="84" width="340" height="10" rx="4" fill="#78350f" opacity="0.3"/>
    <rect x="40" y="106" width="260" height="10" rx="4" fill="#78350f" opacity="0.25"/>
    <circle cx="100" cy="230" r="44" fill="#fbbf24" opacity="0.6"/>
    <rect x="170" y="200" width="300" height="14" rx="6" fill="#78350f" opacity="0.3"/>
    <rect x="170" y="226" width="240" height="14" rx="6" fill="#78350f" opacity="0.25"/>
    <rect x="170" y="252" width="280" height="14" rx="6" fill="#78350f" opacity="0.22"/>
  </g>

  <!-- hero card (rust gradient, slight tilt) -->
  <g transform="translate(800 450) rotate(6) translate(-260 -190)">
    <rect width="520" height="380" rx="20" fill="url(#hero)"/>
    <rect x="40" y="50" width="220" height="18" rx="7" fill="#fef3ec" opacity="0.95"/>
    <rect x="40" y="86" width="360" height="10" rx="4" fill="#fef3ec" opacity="0.55"/>
    <rect x="40" y="108" width="300" height="10" rx="4" fill="#fef3ec" opacity="0.45"/>
    <rect x="40" y="160" width="440" height="80" rx="12" fill="#fef3ec" opacity="0.18"/>
    <circle cx="90" cy="200" r="22" fill="#fbbf24" opacity="0.9"/>
    <rect x="130" y="190" width="200" height="10" rx="4" fill="#fef3ec" opacity="0.7"/>
    <rect x="130" y="210" width="150" height="10" rx="4" fill="#fef3ec" opacity="0.5"/>
    <rect x="40" y="280" width="140" height="40" rx="20" fill="#fbbf24" opacity="0.95"/>
    <rect x="200" y="280" width="100" height="40" rx="20" fill="#fef3ec" opacity="0.25"/>
  </g>

  <!-- faint decorative dots (outside hero, full-bleed safe) -->
  <circle cx="120" cy="120" r="6" fill="#c2410c" opacity="0.5"/>
  <circle cx="1500" cy="780" r="8" fill="#0e7490" opacity="0.4"/>
  <circle cx="1480" cy="140" r="5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="140" cy="800" r="7" fill="#9a3309" opacity="0.5"/>
</svg>
