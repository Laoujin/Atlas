<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="murk" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2e150e"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#murk)"/>

  <!-- ridge silhouettes behind the trees -->
  <path d="M0 660 L210 600 L430 650 L640 590 L860 645 L1080 585 L1320 648 L1600 600 L1600 900 L0 900 Z" fill="#160a08" opacity="0.85"/>

  <!-- eerie glow halo behind the central gnarled tree -->
  <ellipse cx="800" cy="430" rx="430" ry="330" fill="url(#glow)"/>

  <!-- gnarled moss-draped hero tree, centred in the safe zone -->
  <g fill="#0d0605" opacity="0.95">
    <path d="M788 800 C786 700 782 620 770 560 C700 540 648 500 612 446 C660 480 712 506 766 520 C758 470 760 410 778 352 C742 312 720 262 716 208 C742 256 770 296 792 322 C800 270 814 224 838 184 C832 236 832 286 844 330 C876 300 906 256 922 210 C914 264 894 312 862 352 C884 408 892 470 886 524 C940 506 990 476 1030 432 C998 492 944 534 880 560 C868 624 862 706 860 800 Z"/>
    <!-- companion leaning trunk -->
    <path d="M468 800 C470 700 466 612 452 548 C404 528 366 492 342 448 C384 480 428 502 470 512 C462 452 470 392 494 344 C516 392 524 452 520 512 C540 560 546 632 544 800 Z" opacity="0.9"/>
    <path d="M1132 800 C1130 712 1134 628 1148 566 C1196 546 1234 512 1258 470 C1216 502 1172 522 1130 530 C1138 472 1130 414 1108 368 C1086 414 1078 472 1086 530 C1066 596 1062 700 1064 800 Z" opacity="0.9"/>
  </g>

  <!-- drifting fog bands -->
  <rect x="-100" y="560" width="1800" height="120" fill="url(#fog)" opacity="0.8"/>
  <rect x="-100" y="668" width="1800" height="150" fill="url(#fog)" opacity="0.65"/>
  <ellipse cx="540" cy="500" rx="360" ry="46" fill="#fbbf24" opacity="0.08"/>
  <ellipse cx="1010" cy="470" rx="320" ry="40" fill="#fbbf24" opacity="0.07"/>
</svg>
