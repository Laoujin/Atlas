<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#e7dcc7"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- layered ridgelines receding into mist -->
  <path d="M0 360 L240 290 L470 350 L760 270 L1050 340 L1330 280 L1600 330 L1600 560 L0 560 Z" fill="url(#far)" opacity="0.55"/>
  <path d="M0 470 L300 390 L600 460 L900 380 L1230 450 L1600 400 L1600 640 L0 640 Z" fill="url(#mid)" opacity="0.7"/>
  <path d="M0 600 L360 520 L720 590 L1080 510 L1420 580 L1600 545 L1600 900 L0 900 Z" fill="url(#near)" opacity="0.9"/>

  <ellipse cx="800" cy="430" rx="640" ry="230" fill="url(#haze)"/>

  <!-- summit marker -->
  <path d="M820 250 L838 300 L802 300 Z" fill="#c2410c"/>
  <rect x="815" y="298" width="10" height="46" rx="3" fill="#5c2a1a"/>

  <!-- mossy boardwalk winding up the ridge (hero) -->
  <path d="M700 880 C690 760 800 700 778 600 C760 520 700 500 822 470 C880 456 852 400 820 344 L808 344 C828 398 838 452 792 470 C690 506 740 540 756 600 C780 700 760 760 818 880 Z" fill="url(#plank)" opacity="0.95"/>
  <!-- plank slats -->
  <g stroke="#fbbf24" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <line x1="716" y1="840" x2="800" y2="840"/>
    <line x1="724" y1="780" x2="792" y2="780"/>
    <line x1="742" y1="722" x2="788" y2="722"/>
    <line x1="760" y1="666" x2="790" y2="666"/>
    <line x1="744" y1="600" x2="780" y2="604"/>
    <line x1="720" y1="556" x2="772" y2="548"/>
    <line x1="768" y1="506" x2="816" y2="494"/>
    <line x1="800" y1="452" x2="834" y2="446"/>
    <line x1="804" y1="402" x2="828" y2="398"/>
  </g>

  <!-- canopy tufts flanking the path -->
  <circle cx="600" cy="640" r="46" fill="#78350f" opacity="0.8"/>
  <circle cx="650" cy="600" r="34" fill="#9a3309" opacity="0.8"/>
  <circle cx="1000" cy="650" r="50" fill="#78350f" opacity="0.8"/>
  <circle cx="950" cy="606" r="36" fill="#9a3309" opacity="0.8"/>
</svg>
