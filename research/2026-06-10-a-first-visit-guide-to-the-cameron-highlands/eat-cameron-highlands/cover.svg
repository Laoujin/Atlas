<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1411"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3a1a10"/>
    </linearGradient>
    <radialGradient id="broth" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef3ec" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="300" y="120" width="1000" height="660" fill="url(#glow)"/>

  <!-- rising steam silhouette -->
  <path d="M740 300 C700 250 790 230 760 175 C740 138 800 120 790 80 C870 130 800 200 845 250 C880 290 800 300 740 300 Z" fill="url(#steam)"/>
  <path d="M880 320 C850 275 925 258 905 215 C892 188 940 174 936 142 C998 188 944 248 980 290 C1006 320 940 326 880 320 Z" fill="url(#steam)" opacity="0.7"/>

  <!-- secondary rose plate accent (left) -->
  <ellipse cx="565" cy="560" rx="180" ry="46" fill="#be185d" opacity="0.85"/>
  <ellipse cx="565" cy="548" rx="180" ry="46" fill="#9d174d"/>
  <ellipse cx="565" cy="540" rx="120" ry="28" fill="#3a1a10" opacity="0.6"/>

  <!-- hotpot hero -->
  <ellipse cx="850" cy="640" rx="340" ry="92" fill="#1a0e0e" opacity="0.55"/>
  <path d="M530 470 C530 590 660 660 850 660 C1040 660 1170 590 1170 470 Z" fill="url(#pot)"/>
  <ellipse cx="850" cy="470" rx="320" ry="98" fill="#5c2a1a"/>
  <ellipse cx="850" cy="466" rx="288" ry="84" fill="url(#broth)"/>
  <ellipse cx="850" cy="450" rx="160" ry="40" fill="#fbbf24" opacity="0.55"/>

  <!-- floating morsels -->
  <circle cx="760" cy="455" r="20" fill="#9a3309"/>
  <circle cx="930" cy="478" r="16" fill="#78350f"/>
  <circle cx="855" cy="488" r="13" fill="#be185d" opacity="0.85"/>
  <circle cx="690" cy="478" r="11" fill="#c2410c"/>
</svg>
