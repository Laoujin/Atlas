<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f7e3cf"/>
      <stop offset="1" stop-color="#e7c4a0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- distant ridge -->
  <path d="M-50,470 Q 380,400 800,432 Q 1230,464 1650,408 L1650,900 L-50,900 Z" fill="#c98a5e" opacity="0.45"/>

  <!-- tea hillside -->
  <path d="M-50,500 Q 800,560 1650,500 L1650,900 L-50,900 Z" fill="url(#hill)"/>

  <!-- terrace contour rows receding to the ridge -->
  <g fill="none" stroke-linecap="round">
    <path d="M-50,494 Q 800,536 1650,492" stroke="#fbbf24" stroke-width="1.4" opacity="0.55"/>
    <path d="M-50,506 Q 800,552 1650,504" stroke="#5c2a1a" stroke-width="1.8" opacity="0.6"/>
    <path d="M-50,524 Q 800,576 1650,520" stroke="#d97706" stroke-width="2.2" opacity="0.7"/>
    <path d="M-60,548 Q 800,608 1660,542" stroke="#5c2a1a" stroke-width="2.6" opacity="0.6"/>
    <path d="M-60,580 Q 800,648 1660,572" stroke="#d97706" stroke-width="3" opacity="0.75"/>
    <path d="M-70,620 Q 800,700 1670,610" stroke="#5c2a1a" stroke-width="3.4" opacity="0.6"/>
    <path d="M-70,668 Q 800,760 1670,656" stroke="#fbbf24" stroke-width="3.8" opacity="0.5"/>
    <path d="M-80,726 Q 800,832 1680,712" stroke="#5c2a1a" stroke-width="4.2" opacity="0.6"/>
    <path d="M-80,794 Q 800,912 1680,778" stroke="#d97706" stroke-width="4.6" opacity="0.7"/>
  </g>

  <!-- HERO: cantilevered viewing balcony, centered ~ (800,450) -->
  <g>
    <!-- support stilts into the slope -->
    <path d="M612,500 L598,628" stroke="#5c2a1a" stroke-width="10" stroke-linecap="round"/>
    <path d="M988,500 L1004,628" stroke="#5c2a1a" stroke-width="10" stroke-linecap="round"/>
    <path d="M740,505 L734,612" stroke="#5c2a1a" stroke-width="8" stroke-linecap="round"/>
    <path d="M860,505 L866,612" stroke="#5c2a1a" stroke-width="8" stroke-linecap="round"/>

    <!-- front fascia board -->
    <polygon points="588,498 1012,498 1012,524 588,524" fill="#9a3309"/>
    <!-- deck top surface -->
    <polygon points="660,430 940,430 1012,498 588,498" fill="url(#deck)"/>
    <!-- deck plank seams -->
    <g stroke="#9a3309" stroke-width="1.4" opacity="0.5">
      <line x1="694" y1="447" x2="649" y2="498"/>
      <line x1="747" y1="447" x2="721" y2="498"/>
      <line x1="800" y1="447" x2="800" y2="498"/>
      <line x1="853" y1="447" x2="879" y2="498"/>
      <line x1="906" y1="447" x2="951" y2="498"/>
    </g>

    <!-- railing -->
    <line x1="660" y1="430" x2="660" y2="388" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <line x1="752" y1="430" x2="752" y2="388" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <line x1="848" y1="430" x2="848" y2="388" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <line x1="940" y1="430" x2="940" y2="388" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <line x1="652" y1="392" x2="948" y2="392" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
