<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3d1c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.6">
      <stop offset="0" stop-color="#7a3410" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- pagoda body mass -->
  <rect x="720" y="380" width="160" height="345" fill="#2a1408" opacity="0.92"/>

  <!-- bottom tier roof -->
  <path d="M430,685 Q615,727 800,635 Q985,727 1170,685 L1170,721 Q985,757 800,671 Q615,757 430,721 Z" fill="url(#roof)" opacity="0.95"/>
  <!-- middle tier roof -->
  <path d="M505,532 Q652,574 800,488 Q948,574 1095,532 L1095,566 Q948,608 800,522 Q652,608 505,566 Z" fill="url(#roof)" opacity="0.95"/>
  <!-- top tier roof -->
  <path d="M590,384 Q695,424 800,344 Q905,424 1010,384 L1010,418 Q905,458 800,378 Q695,458 590,418 Z" fill="url(#roof)" opacity="0.95"/>

  <!-- finial -->
  <rect x="793" y="292" width="14" height="58" fill="#d97706"/>
  <circle cx="800" cy="290" r="14" fill="#fbbf24"/>
  <circle cx="800" cy="320" r="9" fill="#c2410c"/>

  <!-- left hanging lantern -->
  <line x1="505" y1="566" x2="505" y2="606" stroke="#78350f" stroke-width="4"/>
  <rect x="487" y="602" width="36" height="10" rx="3" fill="#9a3309"/>
  <ellipse cx="505" cy="640" rx="30" ry="38" fill="url(#lantern)"/>
  <line x1="505" y1="678" x2="505" y2="706" stroke="#c2410c" stroke-width="4"/>

  <!-- right hanging lantern -->
  <line x1="1095" y1="566" x2="1095" y2="606" stroke="#78350f" stroke-width="4"/>
  <rect x="1077" y="602" width="36" height="10" rx="3" fill="#9a3309"/>
  <ellipse cx="1095" cy="640" rx="30" ry="38" fill="url(#lantern)"/>
  <line x1="1095" y1="678" x2="1095" y2="706" stroke="#c2410c" stroke-width="4"/>

  <!-- tea leaves at base -->
  <g transform="translate(648,760) rotate(-26) scale(0.8)" fill="#78350f" opacity="0.9">
    <path d="M0,-60 C26,-30 26,30 0,60 C-26,30 -26,-30 0,-60 Z"/>
    <line x1="0" y1="-52" x2="0" y2="52" stroke="#3d1c10" stroke-width="3"/>
  </g>
  <g transform="translate(952,760) rotate(26) scale(0.8)" fill="#78350f" opacity="0.9">
    <path d="M0,-60 C26,-30 26,30 0,60 C-26,30 -26,-30 0,-60 Z"/>
    <line x1="0" y1="-52" x2="0" y2="52" stroke="#3d1c10" stroke-width="3"/>
  </g>
</svg>
