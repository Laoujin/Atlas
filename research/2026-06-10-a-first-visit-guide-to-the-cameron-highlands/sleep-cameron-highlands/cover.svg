<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- misty layered hills (decoration, full bleed) -->
  <path d="M0 560 C 320 470 620 540 900 500 C 1200 460 1450 540 1600 510 L1600 900 0 900 Z" fill="#9a3309" opacity="0.30"/>
  <path d="M0 640 C 360 580 700 650 1020 610 C 1320 575 1500 640 1600 615 L1600 900 0 900 Z" fill="#78350f" opacity="0.45"/>

  <!-- warm glow behind lodge -->
  <ellipse cx="800" cy="470" rx="430" ry="280" fill="url(#glow)"/>

  <!-- HERO: mock-Tudor gabled lodge silhouette -->
  <g>
    <!-- chimney -->
    <rect x="980" y="300" width="46" height="120" fill="#5c2a1a"/>
    <!-- main body -->
    <rect x="560" y="470" width="480" height="200" fill="#5c2a1a"/>
    <!-- main long roof -->
    <polygon points="540,475 800,360 1060,475" fill="url(#roof)"/>
    <!-- left gable -->
    <rect x="600" y="500" width="160" height="170" fill="#3a1c10"/>
    <polygon points="585,505 680,400 775,505" fill="url(#roof)"/>
    <!-- right gable -->
    <rect x="840" y="500" width="160" height="170" fill="#3a1c10"/>
    <polygon points="825,505 920,400 1015,505" fill="url(#roof)"/>

    <!-- mock-Tudor timber stripes (left gable) -->
    <polygon points="680,420 760,505 690,505" fill="#9a3309" opacity="0.5"/>
    <polygon points="680,420 600,505 670,505" fill="#9a3309" opacity="0.5"/>
    <!-- mock-Tudor timber stripes (right gable) -->
    <polygon points="920,420 1000,505 930,505" fill="#9a3309" opacity="0.5"/>
    <polygon points="920,420 840,505 910,505" fill="#9a3309" opacity="0.5"/>

    <!-- warm-lit windows -->
    <rect x="635" y="430" width="44" height="44" rx="4" fill="url(#win)" opacity="0.92"/>
    <rect x="875" y="430" width="44" height="44" rx="4" fill="url(#win)" opacity="0.92"/>
    <rect x="630" y="540" width="50" height="74" rx="4" fill="url(#win)" opacity="0.92"/>
    <rect x="700" y="540" width="50" height="74" rx="4" fill="url(#win)" opacity="0.92"/>
    <rect x="850" y="540" width="50" height="74" rx="4" fill="url(#win)" opacity="0.92"/>
    <rect x="920" y="540" width="50" height="74" rx="4" fill="url(#win)" opacity="0.92"/>
    <!-- glowing doorway -->
    <rect x="775" y="560" width="50" height="110" rx="6" fill="url(#win)" opacity="0.95"/>
  </g>

  <!-- foreground mist sweep -->
  <path d="M0 720 C 380 680 780 760 1180 710 C 1420 680 1560 720 1600 705 L1600 900 0 900 Z" fill="#1a0e0e" opacity="0.55"/>
</svg>
