<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbe4d2"/>
      <stop offset="1" stop-color="#f0d3b8"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#haze)"/>

  <!-- misty highland ridgelines -->
  <path d="M0 360 C 320 300 540 360 800 330 C 1080 298 1320 358 1600 322 L1600 900 L0 900 Z" fill="#d97706" opacity="0.28"/>
  <path d="M0 430 C 300 372 560 432 820 404 C 1100 374 1340 432 1600 398 L1600 900 L0 900 Z" fill="#c2410c" opacity="0.4"/>

  <!-- hero: rolling tea-terrace contour bands -->
  <g>
    <path d="M0 520 C 300 452 560 520 820 488 C 1110 454 1360 520 1600 484 L1600 560 C 1360 596 1110 530 820 564 C 560 596 300 528 0 596 Z" fill="url(#ridge)" opacity="0.85"/>
    <path d="M0 600 C 300 536 560 604 820 572 C 1110 540 1360 604 1600 570 L1600 644 C 1360 678 1110 614 820 648 C 560 680 300 612 0 680 Z" fill="url(#band)" opacity="0.88"/>
    <path d="M0 684 C 300 622 560 690 820 658 C 1110 626 1360 690 1600 658 L1600 732 C 1360 766 1110 702 820 736 C 560 768 300 700 0 766 Z" fill="url(#ridge)" opacity="0.9"/>
    <path d="M0 770 C 300 710 560 778 820 746 C 1110 714 1360 778 1600 746 L1600 900 L0 900 Z" fill="url(#band)" opacity="0.93"/>
  </g>
</svg>
