<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fellFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fellMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fellNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow, sits behind the hero ridge -->
  <circle cx="900" cy="470" r="260" fill="url(#sun)"/>

  <!-- far fell line (hero silhouette: Coniston / Old Man profile) -->
  <path d="M 125,560 L 260,470 L 380,520 L 520,400 L 640,440 L 780,330 L 900,380 L 1040,300 L 1180,360 L 1320,420 L 1475,380 L 1475,640 L 125,640 Z" fill="url(#fellFar)"/>

  <!-- mid fell ridge -->
  <path d="M 125,640 L 240,580 L 400,610 L 560,540 L 720,580 L 880,520 L 1040,560 L 1200,500 L 1360,550 L 1475,520 L 1475,720 L 125,720 Z" fill="url(#fellMid)" opacity="0.92"/>

  <!-- near fell / foreground shore -->
  <path d="M 125,720 L 320,680 L 520,710 L 720,675 L 920,705 L 1120,670 L 1320,700 L 1475,680 L 1475,780 L 125,780 Z" fill="url(#fellNear)"/>

  <!-- lake stripe with reflection -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#lake)"/>

  <!-- reflection ripples -->
  <rect x="320" y="810" width="280" height="3" fill="#fbbf24" opacity="0.55"/>
  <rect x="700" y="830" width="420" height="3" fill="#fbbf24" opacity="0.45"/>
  <rect x="1180" y="820" width="220" height="3" fill="#fbbf24" opacity="0.5"/>
  <rect x="480" y="855" width="180" height="2" fill="#d97706" opacity="0.45"/>
  <rect x="900" y="870" width="320" height="2" fill="#d97706" opacity="0.4"/>

  <!-- a small priory tower silhouette tucked into the near ridge, nodding to Cartmel -->
  <g fill="#1a0e0e" opacity="0.85">
    <rect x="770" y="640" width="60" height="80"/>
    <rect x="760" y="628" width="10" height="14"/>
    <rect x="790" y="620" width="10" height="22"/>
    <rect x="820" y="628" width="10" height="14"/>
  </g>
</svg>
