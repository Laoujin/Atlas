<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="cottage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#241008"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- warm glow behind tower -->
  <ellipse cx="800" cy="500" rx="620" ry="340" fill="url(#dusk)"/>

  <!-- distant fells (full-bleed, decorative) -->
  <path d="M0,640 L180,560 L360,605 L540,540 L720,590 L900,535 L1080,580 L1280,520 L1460,575 L1600,545 L1600,900 L0,900 Z"
        fill="#3a1808" opacity="0.85"/>
  <path d="M0,700 L200,665 L420,690 L640,655 L860,685 L1080,650 L1300,680 L1600,660 L1600,900 L0,900 Z"
        fill="#241008" opacity="0.9"/>

  <!-- left cottage rooflines (within safe zone) -->
  <path d="M180,720 L340,640 L500,720 L500,810 L180,810 Z" fill="url(#cottage)" opacity="0.9"/>
  <rect x="240" y="700" width="22" height="28" fill="#fbbf24" opacity="0.75"/>
  <rect x="370" y="710" width="20" height="26" fill="#d97706" opacity="0.55"/>

  <!-- right cottage rooflines (within safe zone) -->
  <path d="M1100,720 L1260,635 L1420,720 L1420,810 L1100,810 Z" fill="url(#cottage)" opacity="0.9"/>
  <rect x="1180" y="705" width="22" height="28" fill="#fbbf24" opacity="0.7"/>
  <rect x="1320" y="710" width="20" height="26" fill="#d97706" opacity="0.5"/>

  <!-- Cartmel Priory tower — hero, centered -->
  <!-- tower body -->
  <rect x="700" y="300" width="200" height="430" fill="url(#stone)"/>
  <!-- crenellated parapet -->
  <rect x="690" y="285" width="220" height="22" fill="#78350f"/>
  <rect x="700" y="270" width="22" height="20" fill="#78350f"/>
  <rect x="744" y="270" width="22" height="20" fill="#78350f"/>
  <rect x="788" y="270" width="22" height="20" fill="#78350f"/>
  <rect x="832" y="270" width="22" height="20" fill="#78350f"/>
  <rect x="876" y="270" width="22" height="20" fill="#78350f"/>
  <!-- upper diagonal lantern (Cartmel Priory's distinctive offset upper stage) -->
  <g transform="rotate(45 800 240)">
    <rect x="755" y="195" width="90" height="90" fill="#9a3309"/>
    <rect x="755" y="180" width="90" height="18" fill="#78350f"/>
  </g>
  <!-- tower vertical seam shading -->
  <rect x="795" y="300" width="6" height="430" fill="#241008" opacity="0.5"/>
  <!-- glowing arched window (the "evening dining" cue) -->
  <ellipse cx="800" cy="540" rx="38" ry="120" fill="url(#window)"/>
  <rect x="780" y="500" width="40" height="120" fill="#fbbf24" opacity="0.85"/>
  <path d="M780,500 Q800,460 820,500 Z" fill="#fbbf24" opacity="0.85"/>
  <!-- mullion -->
  <rect x="798" y="470" width="4" height="150" fill="#78350f" opacity="0.8"/>
  <rect x="780" y="540" width="40" height="3" fill="#78350f" opacity="0.8"/>
  <!-- small lower window -->
  <rect x="788" y="670" width="24" height="40" fill="#d97706" opacity="0.7"/>

  <!-- foreground square paving hint -->
  <rect x="0" y="810" width="1600" height="90" fill="#1a0e0e" opacity="0.85"/>
  <rect x="0" y="810" width="1600" height="3" fill="#5c2a1a" opacity="0.6"/>
</svg>
