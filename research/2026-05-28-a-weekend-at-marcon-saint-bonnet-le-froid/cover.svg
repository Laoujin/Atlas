<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="65%" r="75%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#5c2a1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0eadb" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow disc, low on horizon -->
  <circle cx="800" cy="560" r="180" fill="#fbbf24" opacity="0.35"/>
  <circle cx="800" cy="560" r="110" fill="#fef3ec" opacity="0.45"/>

  <!-- Far rolling hills (decoration, partially cropped is fine) -->
  <path d="M 0 620 Q 250 540 480 590 T 980 575 T 1600 600 L 1600 900 L 0 900 Z" fill="url(#hillFar)" opacity="0.85"/>

  <!-- Near hills (foreground, full-bleed) -->
  <path d="M 0 740 Q 320 680 620 720 T 1180 715 T 1600 735 L 1600 900 L 0 900 Z" fill="url(#hillNear)"/>

  <!-- Hero: plate centered at ~(800, 450), inside safe zone -->
  <ellipse cx="800" cy="470" rx="380" ry="78" fill="#1a0e0e" opacity="0.45"/>
  <ellipse cx="800" cy="455" rx="370" ry="72" fill="url(#plate)"/>
  <ellipse cx="800" cy="455" rx="295" ry="55" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.45"/>

  <!-- Mushroom on the plate (the Marcon signature) -->
  <!-- Stem -->
  <path d="M 770 430 Q 765 360 778 310 Q 790 295 815 310 Q 830 360 825 430 Z" fill="url(#stem)" opacity="0.95"/>
  <!-- Cap -->
  <path d="M 690 300 Q 700 200 800 195 Q 905 198 915 305 Q 880 285 800 290 Q 720 285 690 300 Z" fill="url(#cap)"/>
  <!-- Cap highlight -->
  <path d="M 720 270 Q 760 230 820 230" fill="none" stroke="#d97706" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
  <!-- Small companion mushroom -->
  <path d="M 935 440 Q 932 405 940 388 Q 948 382 958 388 Q 965 405 962 440 Z" fill="url(#stem)" opacity="0.9"/>
  <path d="M 910 385 Q 918 355 948 354 Q 980 355 988 388 Q 965 378 948 380 Q 928 378 910 385 Z" fill="url(#cap)" opacity="0.9"/>

  <!-- A few warm sparks rising (steam / forest embers) -->
  <circle cx="660" cy="220" r="4" fill="#fbbf24" opacity="0.7"/>
  <circle cx="640" cy="180" r="3" fill="#fbbf24" opacity="0.55"/>
  <circle cx="950" cy="200" r="4" fill="#fbbf24" opacity="0.65"/>
  <circle cx="970" cy="160" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="800" cy="150" r="3" fill="#fef3ec" opacity="0.6"/>
</svg>
