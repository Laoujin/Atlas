<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yurtWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="yurtRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon haze, off-center (decoration, safe to crop) -->
  <circle cx="1280" cy="220" r="180" fill="url(#moon)" opacity="0.7"/>
  <circle cx="1280" cy="220" r="42" fill="#faf8f2" opacity="0.85"/>

  <!-- distant ridge silhouette -->
  <path d="M 0 620 L 180 540 L 340 580 L 520 500 L 700 560 L 880 510 L 1080 570 L 1260 520 L 1440 575 L 1600 540 L 1600 900 L 0 900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- mid ridge with winding road hint -->
  <path d="M 0 720 L 220 660 L 460 700 L 720 640 L 980 695 L 1240 650 L 1600 690 L 1600 900 L 0 900 Z" fill="#2a1410" opacity="0.9"/>
  <path d="M 120 870 Q 380 780 560 800 T 920 740 T 1340 760 T 1600 720" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.45" stroke-dasharray="6 10"/>

  <!-- left pine cluster -->
  <path d="M 260 780 L 230 700 L 248 705 L 222 640 L 244 645 L 218 575 L 245 580 L 260 540 L 275 580 L 302 575 L 276 645 L 298 640 L 272 705 L 290 700 Z" fill="#0d0805" opacity="0.92"/>
  <path d="M 380 800 L 358 730 L 372 734 L 352 680 L 370 684 L 350 625 L 372 630 L 380 600 L 388 630 L 410 625 L 390 684 L 408 680 L 388 734 L 402 730 Z" fill="#1a0e0e" opacity="0.9"/>

  <!-- right pine cluster -->
  <path d="M 1280 800 L 1252 720 L 1270 725 L 1246 660 L 1268 665 L 1244 600 L 1270 605 L 1280 565 L 1290 605 L 1316 600 L 1292 665 L 1314 660 L 1290 725 L 1308 720 Z" fill="#0d0805" opacity="0.92"/>
  <path d="M 1420 780 L 1396 712 L 1412 716 L 1392 660 L 1410 664 L 1390 605 L 1412 610 L 1420 580 L 1428 610 L 1450 605 L 1430 664 L 1448 660 L 1428 716 L 1442 712 Z" fill="#1a0e0e" opacity="0.9"/>

  <!-- hero: yurt centered ~(800, 500), within safe zone -->
  <!-- warm ground glow under yurt -->
  <ellipse cx="800" cy="700" rx="380" ry="80" fill="url(#glow)" opacity="0.7"/>

  <!-- yurt wall (cylinder) -->
  <path d="M 600 700 L 600 540 Q 800 520 1000 540 L 1000 700 Z" fill="url(#yurtWall)" opacity="0.92"/>
  <!-- subtle wall band -->
  <path d="M 600 660 Q 800 644 1000 660" stroke="#78350f" stroke-width="3" fill="none" opacity="0.55"/>

  <!-- yurt roof (cone) -->
  <path d="M 580 540 Q 800 480 1020 540 L 950 380 Q 800 360 650 380 Z" fill="url(#yurtRoof)" opacity="0.95"/>
  <!-- roof ribs converging to crown -->
  <path d="M 600 540 L 800 370 M 700 530 L 800 370 M 800 525 L 800 370 M 900 530 L 800 370 M 1000 540 L 800 370" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- crown ring -->
  <ellipse cx="800" cy="370" rx="44" ry="14" fill="#fbbf24" opacity="0.95"/>
  <ellipse cx="800" cy="370" rx="44" ry="14" fill="none" stroke="#78350f" stroke-width="2" opacity="0.7"/>

  <!-- doorway (warm lantern light from inside) -->
  <path d="M 760 700 L 760 600 Q 800 588 840 600 L 840 700 Z" fill="#fbbf24" opacity="0.85"/>
  <path d="M 768 698 L 768 608 Q 800 598 832 608 L 832 698 Z" fill="#fef3ec" opacity="0.6"/>

  <!-- two faint hanging lanterns flanking the yurt -->
  <circle cx="520" cy="560" r="10" fill="#fbbf24" opacity="0.85"/>
  <circle cx="520" cy="560" r="22" fill="#fbbf24" opacity="0.18"/>
  <circle cx="1080" cy="560" r="10" fill="#fbbf24" opacity="0.85"/>
  <circle cx="1080" cy="560" r="22" fill="#fbbf24" opacity="0.18"/>
</svg>
