<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3a1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table-glow radial -->
    <radialGradient id="glow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill gradient -->
    <radialGradient id="plate1" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b0"/>
    </radialGradient>
    <radialGradient id="plate2" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b0"/>
    </radialGradient>
    <!-- Inner well of plate -->
    <radialGradient id="well1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#e8d8c0"/>
    </radialGradient>
    <!-- Rose accent glow for second plate -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Wine glass body gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Wine liquid gradient -->
    <radialGradient id="wine" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm ambient glow centered on table area -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3: Corner / edge decoration (outside safe zone, atmospheric) -->
  <!-- Subtle rust arc top-left, decorative only -->
  <circle cx="0" cy="0" r="320" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.12"/>
  <circle cx="1600" cy="900" r="380" fill="none" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.10"/>

  <!-- Layer 2: Hero element — two plates + wine glass, all inside safe zone -->

  <!-- Rose-hued glow behind right plate for depth -->
  <circle cx="870" cy="490" r="310" fill="url(#roseGlow)"/>

  <!-- Left plate (slightly behind) -->
  <!-- Plate rim -->
  <circle cx="720" cy="480" r="210" fill="url(#plate1)" opacity="0.92"/>
  <!-- Plate rim ring -->
  <circle cx="720" cy="480" r="210" fill="none" stroke="#c8b89a" stroke-width="6" opacity="0.5"/>
  <!-- Inner well -->
  <circle cx="720" cy="480" r="158" fill="url(#well1)" opacity="0.88"/>
  <!-- Food accent dot — truffle suggestion, rust -->
  <circle cx="720" cy="468" r="28" fill="#78350f" opacity="0.72"/>
  <circle cx="748" cy="492" r="16" fill="#9a3309" opacity="0.60"/>
  <circle cx="698" cy="496" r="12" fill="#c2410c" opacity="0.50"/>

  <!-- Right plate (hero, slightly forward and lower) -->
  <circle cx="910" cy="498" r="220" fill="url(#plate2)" opacity="0.95"/>
  <circle cx="910" cy="498" r="220" fill="none" stroke="#c8b89a" stroke-width="7" opacity="0.55"/>
  <circle cx="910" cy="498" r="165" fill="url(#well1)" opacity="0.90"/>
  <!-- Food accent — rose/rust garnish suggestion -->
  <circle cx="910" cy="485" r="32" fill="#9a3309" opacity="0.68"/>
  <circle cx="942" cy="510" r="18" fill="#be185d" opacity="0.55"/>
  <circle cx="882" cy="512" r="14" fill="#c2410c" opacity="0.50"/>
  <circle cx="918" cy="455" r="9"  fill="#d97706" opacity="0.65"/>

  <!-- Wine glass silhouette centered between plates and slightly above -->
  <!-- Bowl (elliptical cup) -->
  <ellipse cx="800" cy="310" rx="62" ry="78" fill="url(#glassGrad)" opacity="0.88"/>
  <!-- Wine liquid inside bowl -->
  <ellipse cx="800" cy="342" rx="54" ry="46" fill="url(#wine)" opacity="0.80"/>
  <!-- Glass stem -->
  <rect x="795" y="388" width="10" height="110" rx="5" fill="#9a3309" opacity="0.75"/>
  <!-- Glass base -->
  <ellipse cx="800" cy="500" rx="52" ry="11" fill="#78350f" opacity="0.60"/>
  <!-- Subtle rim highlight on glass -->
  <ellipse cx="800" cy="232" rx="62" ry="8" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.30"/>

  <!-- Michelin star accents — three small geometric stars above the glass (symbolic, not text) -->
  <!-- Star at top center -->
  <polygon points="800,148 806,164 823,164 810,174 815,190 800,180 785,190 790,174 777,164 794,164"
           fill="#fbbf24" opacity="0.78"/>
  <!-- Star left -->
  <polygon points="748,172 753,185 767,185 756,193 760,205 748,197 736,205 740,193 729,185 743,185"
           fill="#d97706" opacity="0.60"/>
  <!-- Star right -->
  <polygon points="852,172 857,185 871,185 860,193 864,205 852,197 840,205 844,193 833,185 847,185"
           fill="#d97706" opacity="0.60"/>

</svg>
