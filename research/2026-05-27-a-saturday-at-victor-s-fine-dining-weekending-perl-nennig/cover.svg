<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#5c2a1a" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1810"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#faf8f2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm candlelit radial glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant river bend hint (decorative, lives near edges) -->
  <path d="M -50 680 Q 400 620 800 700 T 1650 660" stroke="url(#river)" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M -50 720 Q 400 660 800 740 T 1650 700" stroke="url(#river)" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- HERO: plate, centered around (800, 540) -->
  <ellipse cx="800" cy="595" rx="430" ry="38" fill="#000" opacity="0.45"/>
  <ellipse cx="800" cy="555" rx="420" ry="78" fill="url(#plate)" opacity="0.95"/>
  <ellipse cx="800" cy="548" rx="380" ry="62" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.4"/>
  <ellipse cx="800" cy="540" rx="280" ry="44" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.35"/>

  <!-- small culinary accents on the plate (three quenelles) -->
  <ellipse cx="700" cy="540" rx="22" ry="9" fill="#c2410c" opacity="0.85"/>
  <ellipse cx="800" cy="528" rx="26" ry="10" fill="#d97706" opacity="0.9"/>
  <ellipse cx="900" cy="540" rx="22" ry="9" fill="#78350f" opacity="0.85"/>
  <circle cx="750" cy="552" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="850" cy="552" r="3" fill="#fbbf24" opacity="0.9"/>

  <!-- HERO: wine glass, rising above the plate, bowl centered ~ (800, 340) -->
  <!-- stem -->
  <rect x="797" y="430" width="6" height="80" fill="url(#glass)" opacity="0.7"/>
  <!-- base -->
  <ellipse cx="800" cy="512" rx="55" ry="6" fill="#faf8f2" opacity="0.35"/>
  <!-- bowl outline -->
  <path d="M 700 220 Q 700 420 800 432 Q 900 420 900 220 Q 800 240 700 220 Z"
        fill="url(#glass)" stroke="#faf8f2" stroke-width="1.5" opacity="0.6"/>
  <!-- wine inside -->
  <path d="M 712 260 Q 720 415 800 425 Q 880 415 888 260 Q 800 275 712 260 Z"
        fill="url(#wine)" opacity="0.92"/>
  <!-- wine meniscus highlight -->
  <path d="M 712 260 Q 800 275 888 260" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.55"/>
  <!-- rim highlight -->
  <path d="M 700 220 Q 800 240 900 220" stroke="#faf8f2" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- subtle bowl reflection -->
  <path d="M 730 280 Q 740 380 770 410" stroke="#faf8f2" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- a single star above — the Michelin anchor, abstracted as a bright point -->
  <circle cx="800" cy="160" r="6" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="160" r="14" fill="#fbbf24" opacity="0.25"/>
  <circle cx="800" cy="160" r="28" fill="#fbbf24" opacity="0.08"/>
</svg>
