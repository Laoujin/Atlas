<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Radial glow under the pin -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Pin body gradient -->
    <radialGradient id="pinBody" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Pin hole fill -->
    <radialGradient id="pinHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#3b1208"/>
    </radialGradient>
    <!-- Ring stroke gradient (rust fade) -->
    <radialGradient id="ringFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: Central radial glow blob -->
  <ellipse cx="800" cy="470" rx="520" ry="380" fill="url(#glow)" opacity="0.85"/>

  <!-- Layer 3: Concentric radius rings (the "30 km" reach motif) -->
  <!-- Outer ring -->
  <circle cx="800" cy="470" r="310" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.28"/>
  <!-- Middle ring -->
  <circle cx="800" cy="470" r="210" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.38"/>
  <!-- Inner ring -->
  <circle cx="800" cy="470" r="120" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.30"/>

  <!-- Subtle tick marks on middle ring (cardinal directions — decorative only) -->
  <line x1="800" y1="258" x2="800" y2="278" stroke="#d97706" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="800" y1="660" x2="800" y2="680" stroke="#d97706" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="589" y1="470" x2="609" y2="470" stroke="#d97706" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="991" y1="470" x2="1011" y2="470" stroke="#d97706" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Node dots at cardinal ring intersections (event locations metaphor) -->
  <circle cx="800" cy="260" r="5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1010" cy="470" r="4" fill="#d97706" opacity="0.50"/>
  <circle cx="590" cy="470" r="4" fill="#d97706" opacity="0.50"/>
  <circle cx="800" cy="680" r="5" fill="#fbbf24" opacity="0.45"/>
  <!-- A few off-cardinal event nodes -->
  <circle cx="960" cy="320" r="4" fill="#c2410c" opacity="0.55"/>
  <circle cx="640" cy="340" r="3.5" fill="#c2410c" opacity="0.48"/>
  <circle cx="970" cy="620" r="3.5" fill="#c2410c" opacity="0.45"/>
  <circle cx="648" cy="618" r="4" fill="#d97706" opacity="0.42"/>

  <!-- Hero element: Location pin centered at (800, 440) -->
  <!-- Pin teardrop body (circle + downward point) -->
  <!-- Drop shape: circle top + triangle tip pointing down -->
  <path d="M800,340
             a80,80 0 1,1 0.01,0
             Z" fill="url(#pinBody)" opacity="0"/>
  <!-- Using explicit teardrop path: circle centered at (800,380) r=80, tip at (800,510) -->
  <path d="M720,380
             A80,80 0 1,1 880,380
             Q880,430 800,515
             Q720,430 720,380
             Z"
        fill="url(#pinBody)" opacity="0.92"/>
  <!-- Pin inner circle hole -->
  <circle cx="800" cy="375" r="28" fill="url(#pinHole)" opacity="0.88"/>
  <!-- Pin highlight -->
  <ellipse cx="786" cy="358" rx="14" ry="10" fill="#fbbf24" opacity="0.35"/>

  <!-- Layer 3: Corner edge decorations (outside safe zone, purely atmospheric) -->
  <!-- Top-left corner arc sweep -->
  <path d="M0,0 Q120,60 80,200" fill="none" stroke="#78350f" stroke-width="40" stroke-opacity="0.18" stroke-linecap="round"/>
  <!-- Bottom-right corner arc sweep -->
  <path d="M1600,900 Q1480,840 1520,700" fill="none" stroke="#78350f" stroke-width="40" stroke-opacity="0.18" stroke-linecap="round"/>
  <!-- Top-right faint smear -->
  <ellipse cx="1530" cy="80" rx="180" ry="60" fill="#9a3309" opacity="0.10"/>
  <!-- Bottom-left faint smear -->
  <ellipse cx="70" cy="820" rx="180" ry="60" fill="#9a3309" opacity="0.10"/>
</svg>
