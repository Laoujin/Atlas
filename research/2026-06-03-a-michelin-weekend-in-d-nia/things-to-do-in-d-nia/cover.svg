<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="430" r="230" fill="url(#sun)" opacity="0.9"/>

  <!-- Montgó massif: broad hero ridge centred in the safe zone -->
  <path d="M 125 560 L 430 470 L 640 400 L 800 250 L 980 360 L 1230 470 L 1475 540 L 1475 620 L 125 620 Z"
        fill="url(#mtn)" opacity="0.95"/>
  <path d="M 640 400 L 800 250 L 980 360 L 870 420 L 800 360 L 730 430 Z"
        fill="#5c2a1a" opacity="0.55"/>

  <!-- Mediterranean -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#sea)"/>
  <rect x="0" y="600" width="1600" height="22" fill="#fbbf24" opacity="0.6"/>

  <!-- sun reflection on water -->
  <path d="M 760 620 L 840 620 L 880 900 L 720 900 Z" fill="#fbbf24" opacity="0.45"/>
</svg>
