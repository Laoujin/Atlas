<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Warm table glow -->
    <radialGradient id="glow" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero plate gradient -->
    <radialGradient id="plate1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d9c9b0"/>
    </radialGradient>
    <!-- Second plate gradient -->
    <radialGradient id="plate2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#ede0cc"/>
      <stop offset="100%" stop-color="#c9b89a"/>
    </radialGradient>
    <!-- Rim ring gradient -->
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="83%" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Wine glass fill -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Candle glow -->
    <radialGradient id="candle" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Horizon sea shimmer -->
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm glow from table/dining area -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Horizon line — coastal evening -->
  <rect x="0" y="490" width="1600" height="6" fill="url(#sea)" opacity="0.7"/>
  <!-- Sea surface shimmer (gentle horizontal bands) -->
  <rect x="0" y="500" width="1600" height="180" fill="#9a3309" opacity="0.04"/>
  <rect x="0" y="520" width="1600" height="2" fill="#fbbf24" opacity="0.06"/>
  <rect x="0" y="548" width="1600" height="2" fill="#d97706" opacity="0.05"/>
  <rect x="0" y="578" width="1600" height="1" fill="#fbbf24" opacity="0.04"/>

  <!-- Layer 2: Hero element — centered within safe zone -->

  <!-- Back plate (slightly offset right and up) -->
  <circle cx="870" cy="430" r="190" fill="url(#plate2)" opacity="0.88"/>
  <!-- Back plate rim -->
  <circle cx="870" cy="430" r="190" fill="url(#rim)" opacity="0.9"/>
  <!-- Inner ring accent on back plate -->
  <circle cx="870" cy="430" r="148" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Front plate (hero) -->
  <circle cx="730" cy="460" r="200" fill="url(#plate1)" opacity="0.95"/>
  <!-- Front plate rim -->
  <circle cx="730" cy="460" r="200" fill="url(#rim)" opacity="0.95"/>
  <!-- Inner ring accent on front plate -->
  <circle cx="730" cy="460" r="156" fill="none" stroke="#9a3309" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Food accent on front plate — three small abstract shapes suggesting a composed dish -->
  <ellipse cx="730" cy="455" rx="38" ry="14" fill="#c2410c" opacity="0.75"/>
  <ellipse cx="714" cy="448" rx="16" ry="10" fill="#d97706" opacity="0.85"/>
  <ellipse cx="748" cy="462" rx="12" ry="8" fill="#78350f" opacity="0.7"/>
  <!-- Sauce dot accent -->
  <circle cx="766" cy="448" r="5" fill="#fbbf24" opacity="0.65"/>
  <circle cx="700" cy="465" r="4" fill="#9a3309" opacity="0.6"/>

  <!-- Food accent on back plate -->
  <ellipse cx="875" cy="428" rx="30" ry="11" fill="#9a3309" opacity="0.6"/>
  <ellipse cx="862" cy="422" rx="12" ry="8" fill="#c2410c" opacity="0.55"/>

  <!-- Wine glass silhouette — right of plates -->
  <!-- Bowl of glass -->
  <path d="M1090,285 Q1130,380 1110,430 Q1100,455 1080,460 Q1060,455 1050,430 Q1030,380 1070,285 Z"
        fill="url(#glass)" opacity="0.72"/>
  <!-- Wine level inside glass -->
  <path d="M1060,395 Q1080,410 1100,395 Q1095,430 1080,445 Q1065,430 1060,395 Z"
        fill="#c2410c" opacity="0.55"/>
  <!-- Stem -->
  <rect x="1076" y="460" width="8" height="90" fill="#d97706" opacity="0.45"/>
  <!-- Base -->
  <ellipse cx="1080" cy="555" rx="36" ry="7" fill="#d97706" opacity="0.4"/>
  <!-- Glass highlight -->
  <path d="M1068,300 Q1062,340 1064,380" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Candle accent — left of plates -->
  <!-- Candle body -->
  <rect x="536" y="370" width="18" height="90" rx="3" fill="#faf8f2" opacity="0.7"/>
  <!-- Flame -->
  <ellipse cx="545" cy="362" rx="7" ry="14" fill="url(#candle)" opacity="0.95"/>
  <!-- Flame inner -->
  <ellipse cx="545" cy="365" rx="3" ry="7" fill="#fbbf24" opacity="0.9"/>
  <!-- Candle glow halo -->
  <circle cx="545" cy="362" r="40" fill="#d97706" opacity="0.08"/>

  <!-- Layer 3: Decorative edge elements (can be cropped) -->
  <!-- Bottom table edge suggestion -->
  <rect x="0" y="700" width="1600" height="200" fill="#5c2a1a" opacity="0.25"/>
  <rect x="0" y="695" width="1600" height="3" fill="#c2410c" opacity="0.3"/>
  <!-- Subtle vignette corners -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
