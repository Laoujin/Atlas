<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>

    <!-- Warm glow behind plates -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate fill gradient -->
    <radialGradient id="plateMain" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c9b8"/>
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#e8d8c4"/>
    </radialGradient>

    <!-- Second plate (angled) -->
    <radialGradient id="plateBack" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c9b89e"/>
    </radialGradient>

    <!-- Glass silhouette gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Star accent gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm ambient glow centered on hero -->
  <ellipse cx="800" cy="450" rx="640" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — two plates + wine glass, centered ~(800,450) -->

  <!-- Back plate (slightly offset, behind) -->
  <circle cx="860" cy="468" r="218" fill="url(#plateBack)" opacity="0.72"/>
  <!-- Back plate rim ring -->
  <circle cx="860" cy="468" r="218" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.4"/>
  <!-- Back plate inner well -->
  <circle cx="860" cy="468" r="148" fill="none" stroke="#9a3309" stroke-width="3" opacity="0.35"/>

  <!-- Front plate -->
  <circle cx="740" cy="442" r="228" fill="url(#plateMain)" opacity="0.92"/>
  <!-- Front plate rim ring -->
  <circle cx="740" cy="442" r="228" fill="none" stroke="#c2410c" stroke-width="8" opacity="0.6"/>
  <!-- Front plate decorative inner ring -->
  <circle cx="740" cy="442" r="185" fill="none" stroke="#9a3309" stroke-width="2.5" opacity="0.45"/>
  <!-- Front plate well -->
  <circle cx="740" cy="442" r="140" fill="none" stroke="#78350f" stroke-width="2" opacity="0.3"/>

  <!-- Plate garnish accent — small rust dot cluster on front plate -->
  <circle cx="740" cy="430" r="22" fill="#c2410c" opacity="0.75"/>
  <circle cx="714" cy="452" r="10" fill="#9a3309" opacity="0.65"/>
  <circle cx="762" cy="458" r="7" fill="#d97706" opacity="0.8"/>
  <circle cx="728" cy="412" r="6" fill="#be185d" opacity="0.55"/>

  <!-- Wine glass silhouette to the right, partially outside safe zone bottom but base stays in -->
  <!-- Bowl -->
  <ellipse cx="1060" cy="380" rx="52" ry="66" fill="url(#glass)" opacity="0.55"/>
  <!-- Stem -->
  <rect x="1056" y="444" width="8" height="140" rx="4" fill="#fbbf24" opacity="0.45"/>
  <!-- Base -->
  <ellipse cx="1060" cy="588" rx="46" ry="10" fill="#d97706" opacity="0.4"/>
  <!-- Glass highlight -->
  <ellipse cx="1044" cy="362" rx="12" ry="28" fill="#fef3ec" opacity="0.3"/>

  <!-- Layer 3: Decorative edge elements (intentionally near/outside safe zone) -->

  <!-- Top-left corner arc sweep -->
  <path d="M 0 0 Q 180 0 180 180" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.18"/>
  <path d="M 0 0 Q 260 0 260 260" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.12"/>

  <!-- Bottom-right corner arc -->
  <path d="M 1600 900 Q 1420 900 1420 720" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.18"/>

  <!-- Michelin star motifs — three small stars in upper area, decorative only -->
  <!-- Star 1 -->
  <polygon points="800,148 807,168 828,168 812,180 818,200 800,188 782,200 788,180 772,168 793,168"
           fill="url(#starGlow)" opacity="0.82"/>
  <!-- Star 2 -->
  <polygon points="728,162 734,178 751,178 738,188 743,204 728,194 713,204 718,188 705,178 722,178"
           fill="#d97706" opacity="0.55"/>
  <!-- Star 3 -->
  <polygon points="872,162 878,178 895,178 882,188 887,204 872,194 857,204 862,188 849,178 866,178"
           fill="#d97706" opacity="0.55"/>

  <!-- Subtle rose accent wash on left edge -->
  <rect x="0" y="0" width="4" height="900" fill="#be185d" opacity="0.5"/>
  <rect x="1596" y="0" width="4" height="900" fill="#be185d" opacity="0.5"/>
</svg>
