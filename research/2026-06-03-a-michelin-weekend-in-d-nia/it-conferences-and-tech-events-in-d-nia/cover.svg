<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle warm wash in center -->
  <ellipse cx="800" cy="450" rx="620" ry="400" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — node-and-edge network centered at (800, 450) -->

  <!-- Outer ring arc (decorative, low opacity) -->
  <circle cx="800" cy="450" r="310" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.18"/>
  <circle cx="800" cy="450" r="210" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Edge lines from hub to satellite nodes -->
  <!-- Node positions (6 satellites on ~r=230 radius): -->
  <!-- N1: (800, 220)  top -->
  <!-- N2: (1010, 335) upper-right -->
  <!-- N3: (1010, 565) lower-right -->
  <!-- N4: (800, 680)  bottom -->
  <!-- N5: (590, 565)  lower-left -->
  <!-- N6: (590, 335)  upper-left -->

  <line x1="800" y1="450" x2="800" y2="220" stroke="#9a3309" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="1010" y2="335" stroke="#9a3309" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="1010" y2="565" stroke="#9a3309" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="800" y2="680" stroke="#9a3309" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="590" y2="565" stroke="#9a3309" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="590" y2="335" stroke="#9a3309" stroke-width="3" stroke-opacity="0.55"/>

  <!-- Cross-edges between adjacent satellites (ring) -->
  <line x1="800" y1="220" x2="1010" y2="335" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.3"/>
  <line x1="1010" y1="335" x2="1010" y2="565" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.3"/>
  <line x1="1010" y1="565" x2="800" y2="680" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.3"/>
  <line x1="800" y1="680" x2="590" y2="565" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.3"/>
  <line x1="590" y1="565" x2="590" y2="335" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.3"/>
  <line x1="590" y1="335" x2="800" y2="220" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.3"/>

  <!-- Satellite nodes -->
  <circle cx="800" cy="220" r="22" fill="url(#node)" opacity="0.85"/>
  <circle cx="1010" cy="335" r="22" fill="url(#node)" opacity="0.85"/>
  <circle cx="1010" cy="565" r="22" fill="url(#node)" opacity="0.85"/>
  <circle cx="800" cy="680" r="22" fill="url(#node)" opacity="0.85"/>
  <circle cx="590" cy="565" r="22" fill="url(#node)" opacity="0.85"/>
  <circle cx="590" cy="335" r="22" fill="url(#node)" opacity="0.85"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="62" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="44" fill="#fbbf24" opacity="0.22"/>

  <!-- Layer 3: Corner accents (outside safe zone, decorative only) -->
  <circle cx="0" cy="0" r="120" fill="#c2410c" opacity="0.07"/>
  <circle cx="1600" cy="900" r="120" fill="#9a3309" opacity="0.07"/>
</svg>
