<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2e1208"/>
    </linearGradient>

    <!-- Warm central glow — candlelight on the table -->
    <radialGradient id="glow" cx="50%" cy="52%" r="40%">
      <stop offset="0%"  stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate fill — warm ivory with rust rim -->
    <radialGradient id="plateHero" cx="50%" cy="42%" r="55%">
      <stop offset="0%"  stop-color="#faf8f2" stop-opacity="0.97"/>
      <stop offset="72%" stop-color="#f0eadb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Secondary plate fill — slightly darker, receding -->
    <radialGradient id="plateSecond" cx="50%" cy="38%" r="55%">
      <stop offset="0%"  stop-color="#fef3ec" stop-opacity="0.82"/>
      <stop offset="70%" stop-color="#e8d5c0" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Inner well of hero plate -->
    <radialGradient id="plateWell" cx="50%" cy="44%" r="52%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose accent for the heritage stripe detail -->
    <linearGradient id="roseAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#be185d" stop-opacity="0"/>
      <stop offset="40%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>

    <!-- Candle flame glow -->
    <radialGradient id="flameGlow" cx="50%" cy="70%" r="50%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm ambient glow spreading from center-table -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle tablecloth texture: two low-opacity horizontal bands -->
  <rect x="0" y="560" width="1600" height="6"  fill="#c2410c" opacity="0.12"/>
  <rect x="0" y="572" width="1600" height="2"  fill="#d97706" opacity="0.10"/>

  <!-- Heritage stripe — rose/rust accent band across mid-table -->
  <rect x="0" y="530" width="1600" height="3" fill="url(#roseAccent)" opacity="0.85"/>

  <!-- Layer 2: hero element — dining scene inside safe zone x:125–1475, y:90–810 -->

  <!-- Secondary plate (left, receding, slightly smaller) -->
  <ellipse cx="618" cy="500" rx="168" ry="52" fill="#2e1208" opacity="0.7"/>
  <ellipse cx="618" cy="492" rx="174" ry="56" fill="url(#plateSecond)"/>
  <ellipse cx="618" cy="492" rx="138" ry="43" fill="#e8d5c0" opacity="0.55"/>
  <ellipse cx="618" cy="492" rx="108" ry="33" fill="#fef3ec" opacity="0.40"/>

  <!-- Hero plate (center-right, larger, prominent) -->
  <ellipse cx="870" cy="490" rx="215" ry="67" fill="#1a0e0e" opacity="0.75"/>
  <ellipse cx="870" cy="480" rx="222" ry="70" fill="url(#plateHero)"/>
  <!-- Rim detail ring -->
  <ellipse cx="870" cy="480" rx="222" ry="70" fill="none" stroke="#c2410c" stroke-width="4" opacity="0.7"/>
  <!-- Inner well -->
  <ellipse cx="870" cy="480" rx="176" ry="55" fill="url(#plateWell)"/>
  <!-- Plate inner circle (the well) -->
  <ellipse cx="870" cy="480" rx="176" ry="55" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.35"/>
  <!-- Food accent: small warm cluster at plate center (abstract food presentation) -->
  <ellipse cx="868" cy="478" rx="44" ry="18" fill="#9a3309" opacity="0.55"/>
  <ellipse cx="856" cy="474" rx="22" ry="12" fill="#c2410c" opacity="0.70"/>
  <ellipse cx="882" cy="476" rx="18" ry="10" fill="#d97706" opacity="0.65"/>
  <ellipse cx="868" cy="470" rx="12" ry="7"  fill="#fbbf24" opacity="0.55"/>

  <!-- Wine glass silhouette — right of hero plate, within safe zone -->
  <!-- Stem -->
  <rect x="1100" y="370" width="6" height="140" rx="3" fill="#faf8f2" opacity="0.50"/>
  <!-- Base -->
  <ellipse cx="1103" cy="510" rx="30" ry="6" fill="#faf8f2" opacity="0.45"/>
  <!-- Bowl — two curved lines suggesting a wine glass -->
  <path d="M1083,310 Q1073,355 1077,385 Q1085,415 1103,418 Q1121,415 1129,385 Q1133,355 1123,310 Z"
        fill="#be185d" opacity="0.22"/>
  <path d="M1083,310 Q1073,355 1077,385 Q1085,415 1103,418 Q1121,415 1129,385 Q1133,355 1123,310 Z"
        fill="none" stroke="#faf8f2" stroke-width="1.8" opacity="0.45"/>
  <!-- Wine level inside glass -->
  <path d="M1082,375 Q1085,393 1103,396 Q1121,393 1124,375 Z"
        fill="#be185d" opacity="0.55"/>

  <!-- Candle — left of plates, within safe zone -->
  <!-- Candle body -->
  <rect x="536" y="330" width="18" height="110" rx="4" fill="#faf8f2" opacity="0.70"/>
  <!-- Candle top drip -->
  <path d="M536,336 Q535,328 545,326 Q555,328 554,336" fill="#faf8f2" opacity="0.55"/>
  <!-- Flame -->
  <ellipse cx="545" cy="318" rx="7" ry="12" fill="url(#flameGlow)" opacity="0.95"/>
  <ellipse cx="545" cy="322" rx="3.5" ry="6" fill="#fbbf24" opacity="0.92"/>

  <!-- Layer 3: edge decoration (may crop on card/hero) -->
  <!-- Subtle corner vignette arcs — decorative only -->
  <circle cx="0"    cy="0"   r="300" fill="none" stroke="#78350f" stroke-width="120" opacity="0.18"/>
  <circle cx="1600" cy="900" r="300" fill="none" stroke="#78350f" stroke-width="120" opacity="0.18"/>
  <!-- Top and bottom edge fade -->
  <rect x="0" y="0"   width="1600" height="80" fill="#1a0e0e" opacity="0.55"/>
  <rect x="0" y="820" width="1600" height="80" fill="#1a0e0e" opacity="0.55"/>
</svg>
