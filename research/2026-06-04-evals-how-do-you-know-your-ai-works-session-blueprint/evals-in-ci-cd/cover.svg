<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="gate" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- pipeline conduit running through the gate -->
  <rect x="180" y="424" width="1240" height="52" rx="26" fill="url(#pipe)" opacity="0.85"/>

  <!-- upstream stage blocks -->
  <rect x="250" y="402" width="150" height="96" rx="16" fill="#78350f" opacity="0.78"/>
  <rect x="430" y="402" width="150" height="96" rx="16" fill="#9a3309" opacity="0.82"/>

  <!-- downstream stage blocks (post-gate) -->
  <rect x="1020" y="402" width="150" height="96" rx="16" fill="#9a3309" opacity="0.82"/>
  <rect x="1200" y="402" width="150" height="96" rx="16" fill="#78350f" opacity="0.78"/>

  <!-- hero: the eval gate / regression checkpoint -->
  <circle cx="800" cy="450" r="178" fill="#5c2a1a" opacity="0.18"/>
  <circle cx="800" cy="450" r="150" fill="none" stroke="#9a3309" stroke-width="14" opacity="0.7"/>
  <circle cx="800" cy="450" r="112" fill="url(#gate)" opacity="0.95"/>
  <circle cx="800" cy="450" r="46" fill="#fef3ec" opacity="0.9"/>
  <circle cx="800" cy="450" r="20" fill="#c2410c" opacity="0.95"/>
</svg>
