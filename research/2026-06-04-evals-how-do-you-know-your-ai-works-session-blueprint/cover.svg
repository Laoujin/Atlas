<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="620" ry="430" fill="url(#glow)"/>

  <!-- eval orbits -->
  <ellipse cx="800" cy="450" rx="360" ry="250" fill="none" stroke="#6d28d9" stroke-opacity="0.55" stroke-width="3"/>
  <ellipse cx="800" cy="450" rx="240" ry="165" fill="none" stroke="#c2410c" stroke-opacity="0.7" stroke-width="3"/>

  <!-- node markers on orbits -->
  <circle cx="440" cy="450" r="18" fill="#6d28d9" fill-opacity="0.9"/>
  <circle cx="1160" cy="450" r="18" fill="#6d28d9" fill-opacity="0.9"/>
  <circle cx="560" cy="450" r="14" fill="#d97706"/>
  <circle cx="1040" cy="450" r="14" fill="#d97706"/>
  <circle cx="800" cy="285" r="15" fill="#fbbf24" fill-opacity="0.9"/>
  <circle cx="800" cy="615" r="15" fill="#fbbf24" fill-opacity="0.9"/>

  <!-- central hub: the model under test -->
  <circle cx="800" cy="450" r="120" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="120" fill="none" stroke="#78350f" stroke-width="6"/>

  <!-- pass check-mark carved into the hub -->
  <path d="M 745 452 L 785 492 L 862 405" fill="none" stroke="#1a0e0e" stroke-opacity="0.85" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
