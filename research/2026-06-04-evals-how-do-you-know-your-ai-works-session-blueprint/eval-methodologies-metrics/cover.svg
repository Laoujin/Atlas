<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- gauge / calibration arcs around the scoring hub -->
  <g fill="none" stroke-linecap="round">
    <circle cx="800" cy="450" r="300" stroke="#6d28d9" stroke-opacity="0.30" stroke-width="2"/>
    <path d="M 800 170 A 280 280 0 1 1 522 485" stroke="#9a3309" stroke-opacity="0.55" stroke-width="10"/>
    <path d="M 800 200 A 250 250 0 0 1 1043 489" stroke="#d97706" stroke-opacity="0.85" stroke-width="14"/>
    <circle cx="800" cy="450" r="210" stroke="#6d28d9" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- node-and-edge graph: judges feeding the central scoring hub -->
  <g stroke="#c2410c" stroke-opacity="0.5" stroke-width="3">
    <line x1="800" y1="450" x2="520" y2="270"/>
    <line x1="800" y1="450" x2="1090" y2="255"/>
    <line x1="800" y1="450" x2="560" y2="650"/>
    <line x1="800" y1="450" x2="1080" y2="640"/>
  </g>

  <g fill="url(#node)" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="2">
    <circle cx="520" cy="270" r="40"/>
    <circle cx="1090" cy="255" r="34"/>
    <circle cx="560" cy="650" r="32"/>
    <circle cx="1080" cy="640" r="44"/>
  </g>

  <!-- central rust scoring hub -->
  <circle cx="800" cy="450" r="118" fill="url(#hub)" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="3"/>
  <circle cx="800" cy="450" r="60" fill="#1a0e0e" fill-opacity="0.35"/>
  <circle cx="800" cy="450" r="60" fill="none" stroke="#fef3ec" stroke-opacity="0.5" stroke-width="4"/>
</svg>
