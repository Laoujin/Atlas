<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decorative soft glow behind gauge -->
  <circle cx="800" cy="560" r="430" fill="#fbbf24" opacity="0.12"/>

  <!-- gauge track (faint) -->
  <path d="M 470 590 A 330 330 0 0 1 1130 590" fill="none" stroke="#78350f" stroke-width="46" stroke-linecap="round" opacity="0.16"/>

  <!-- eval score arc -->
  <path d="M 470 590 A 330 330 0 0 1 1063 393" fill="none" stroke="url(#arc)" stroke-width="46" stroke-linecap="round" opacity="0.92"/>

  <!-- CI gate threshold tick -->
  <line x1="800" y1="208" x2="800" y2="300" stroke="#78350f" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- needle pointing past the gate (passing) -->
  <path d="M 800 560 L 1010 360 L 1028 386 Z" fill="url(#needle)" opacity="0.95"/>

  <!-- hub -->
  <circle cx="800" cy="560" r="42" fill="url(#hub)"/>
  <circle cx="800" cy="560" r="16" fill="#fbbf24" opacity="0.85"/>
</svg>
