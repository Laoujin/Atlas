<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="640" ry="430" fill="url(#glow)"/>

  <!-- Stack of tool cards being compared (back to front) -->
  <g opacity="0.92">
    <rect x="430" y="300" width="560" height="330" rx="26" transform="rotate(-9 710 465)" fill="url(#card)" stroke="#78350f" stroke-opacity="0.18" stroke-width="3"/>
    <rect x="500" y="280" width="560" height="330" rx="26" transform="rotate(-3 780 445)" fill="url(#card)" stroke="#78350f" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <!-- Hero card on top -->
  <g>
    <rect x="560" y="250" width="600" height="360" rx="28" fill="url(#card)" stroke="#9a3309" stroke-opacity="0.35" stroke-width="4"/>
    <!-- rust title block + faint line bars (decorative, not text) -->
    <rect x="600" y="296" width="300" height="34" rx="10" fill="url(#rust)"/>
    <rect x="600" y="364" width="520" height="16" rx="8" fill="#78350f" opacity="0.16"/>
    <rect x="600" y="400" width="470" height="16" rx="8" fill="#78350f" opacity="0.14"/>
    <rect x="600" y="436" width="500" height="16" rx="8" fill="#78350f" opacity="0.12"/>

    <!-- score gauge: the eval verdict -->
    <circle cx="1040" cy="520" r="58" fill="none" stroke="#e8dcc8" stroke-width="14"/>
    <path d="M 1040 462 A 58 58 0 1 1 988 552" fill="none" stroke="#6d28d9" stroke-width="14" stroke-linecap="round"/>
    <circle cx="1040" cy="520" r="22" fill="url(#rust)"/>

    <!-- checkmark scoring ticks down the rows -->
    <path d="M 1100 372 l 14 14 l 26 -28" fill="none" stroke="#6d28d9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 1100 408 l 14 14 l 26 -28" fill="none" stroke="#c2410c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
</svg>
