<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#e3d8c4"/>
    </radialGradient>
    <radialGradient id="hub" cx="38%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="360" fill="url(#glow)"/>

  <!-- trajectory edges: a path of decisions feeding the evaluated hub -->
  <g stroke="#78350f" stroke-width="7" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M360 300 L560 400"/>
    <path d="M560 400 L420 560"/>
    <path d="M420 560 L640 620"/>
    <path d="M640 620 L800 450"/>
    <path d="M560 400 L800 450"/>
    <path d="M800 450 L1040 320"/>
    <path d="M800 450 L1080 560"/>
    <path d="M1080 560 L1240 460"/>
  </g>

  <!-- trajectory step nodes -->
  <g opacity="0.9">
    <circle cx="360" cy="300" r="46" fill="url(#node)" stroke="#9a3309" stroke-width="5"/>
    <circle cx="560" cy="400" r="40" fill="url(#node)" stroke="#9a3309" stroke-width="5"/>
    <circle cx="420" cy="560" r="40" fill="url(#node)" stroke="#9a3309" stroke-width="5"/>
    <circle cx="640" cy="620" r="44" fill="url(#node)" stroke="#9a3309" stroke-width="5"/>
    <circle cx="1040" cy="320" r="42" fill="url(#node)" stroke="#9a3309" stroke-width="5"/>
    <circle cx="1080" cy="560" r="40" fill="url(#node)" stroke="#9a3309" stroke-width="5"/>
    <circle cx="1240" cy="460" r="46" fill="url(#node)" stroke="#9a3309" stroke-width="5"/>
  </g>

  <!-- evaluated hub: the scored / judged center -->
  <circle cx="800" cy="450" r="116" fill="url(#hub)" stroke="#78350f" stroke-width="6"/>
  <circle cx="800" cy="450" r="116" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <!-- check-arc as the judgment mark -->
  <path d="M748 452 L786 494 L860 404" fill="none" stroke="#fef3ec" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
