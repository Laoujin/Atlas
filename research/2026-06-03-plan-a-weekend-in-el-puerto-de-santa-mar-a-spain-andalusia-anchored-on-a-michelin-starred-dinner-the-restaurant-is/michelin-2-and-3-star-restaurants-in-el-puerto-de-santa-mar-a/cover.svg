<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night bay background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0605"/>
      <stop offset="45%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central warm glow — tide mill lantern on bay water -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%"  stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#9a3309" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Rose rim accent (secondary hue — food/restaurant) -->
    <radialGradient id="roseRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#be185d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.18"/>
    </radialGradient>
    <!-- Water reflection shimmer -->
    <radialGradient id="shimmer" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Salt marsh water band -->
    <linearGradient id="marsh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Bay glow wash -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Rose accent rim -->
  <rect width="1600" height="900" fill="url(#roseRim)"/>

  <!-- Layer 3: Marsh / water bands at bottom (atmospheric, safe to crop) -->
  <rect x="0" y="720" width="1600" height="40"  fill="url(#marsh)" opacity="0.60"/>
  <rect x="0" y="755" width="1600" height="30"  fill="#78350f" opacity="0.25"/>
  <rect x="0" y="780" width="1600" height="120" fill="#1a0e0e"  opacity="0.70"/>

  <!-- Horizon line — salt flat reflection -->
  <rect x="0" y="616" width="1600" height="3" fill="#d97706" opacity="0.18"/>

  <!-- Water reflection column below wheel -->
  <ellipse cx="800" cy="700" rx="180" ry="30" fill="url(#shimmer)" opacity="0.55"/>
  <ellipse cx="800" cy="735" rx="110" ry="16" fill="#fbbf24" opacity="0.10"/>

  <!-- =====================================================
       Layer 2: HERO — Tide mill wheel (safe zone x:125-1475, y:90-810)
       Wheel center at (800, 450), outer radius 230, inner hub 38
       8 spokes + outer rim + inner hub circle + partial mill-house arc
       ===================================================== -->

  <!-- Outer wheel rim -->
  <circle cx="800" cy="450" r="230" fill="none" stroke="#c2410c" stroke-width="18" opacity="0.90"/>

  <!-- Wheel rim highlight ring -->
  <circle cx="800" cy="450" r="230" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.30"/>

  <!-- 8 spokes — rotated every 45° -->
  <!-- Spoke template: line from hub edge (r=42) to inner rim (r=212) -->
  <!-- 0°: top -->
  <line x1="800" y1="238" x2="800" y2="408"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <!-- 45° -->
  <line x1="963" y1="287" x2="850" y2="337"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <!-- 90°: right -->
  <line x1="1012" y1="450" x2="842" y2="450"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <!-- 135° -->
  <line x1="963" y1="613" x2="850" y2="563"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <!-- 180°: bottom -->
  <line x1="800" y1="662" x2="800" y2="492"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <!-- 225° -->
  <line x1="637" y1="613" x2="750" y2="563"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <!-- 270°: left -->
  <line x1="588" y1="450" x2="758" y2="450"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
  <!-- 315° -->
  <line x1="637" y1="287" x2="750" y2="337"  stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.88"/>

  <!-- Paddle boards at rim tips (8 small rects tangent to rim) -->
  <!-- Top -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(0,800,450)"/>
  <!-- 45° -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(45,800,450)"/>
  <!-- 90° -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(90,800,450)"/>
  <!-- 135° -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(135,800,450)"/>
  <!-- 180° -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(180,800,450)"/>
  <!-- 225° -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(225,800,450)"/>
  <!-- 270° -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(270,800,450)"/>
  <!-- 315° -->
  <rect x="779" y="210" width="42" height="22" rx="4" fill="#d97706" opacity="0.80" transform="rotate(315,800,450)"/>

  <!-- Hub circle -->
  <circle cx="800" cy="450" r="42" fill="#78350f" stroke="#fbbf24" stroke-width="6" opacity="0.95"/>
  <circle cx="800" cy="450" r="22" fill="#d97706" opacity="0.85"/>

  <!-- Mill house silhouette: arched wall behind lower wheel half -->
  <!-- Arch opening bottom — suggests the tidal channel mouth -->
  <path d="M 570,620 Q 570,450 800,450 Q 1030,450 1030,620 Z"
        fill="#0d0605" opacity="0.55"/>
  <path d="M 560,625 L 560,760 L 1040,760 L 1040,625 Q 1040,445 800,445 Q 560,445 560,625 Z"
        fill="#0d0605" opacity="0.62"/>

  <!-- Mill house walls (flanking towers) -->
  <rect x="480" y="520" width="95" height="240" rx="6" fill="#3b1208" opacity="0.75"/>
  <rect x="1025" y="520" width="95" height="240" rx="6" fill="#3b1208" opacity="0.75"/>

  <!-- Parapet top of walls — crenellations suggestion via simple notches -->
  <rect x="480" y="505" width="28" height="22" rx="3" fill="#5c2a1a" opacity="0.80"/>
  <rect x="520" y="505" width="28" height="22" rx="3" fill="#5c2a1a" opacity="0.80"/>
  <rect x="560" y="505" width="12" height="22" rx="3" fill="#5c2a1a" opacity="0.80"/>
  <rect x="1025" y="505" width="12" height="22" rx="3" fill="#5c2a1a" opacity="0.80"/>
  <rect x="1048" y="505" width="28" height="22" rx="3" fill="#5c2a1a" opacity="0.80"/>
  <rect x="1088" y="505" width="28" height="22" rx="3" fill="#5c2a1a" opacity="0.80"/>

  <!-- Warm glow on water through mill arch -->
  <ellipse cx="800" cy="660" rx="155" ry="28" fill="#d97706" opacity="0.22"/>

  <!-- Three Michelin stars — three small warm dots above wheel (decorative, not text) -->
  <circle cx="760" cy="182" r="9" fill="#fbbf24" opacity="0.85"/>
  <circle cx="800" cy="170" r="9" fill="#fbbf24" opacity="0.85"/>
  <circle cx="840" cy="182" r="9" fill="#fbbf24" opacity="0.85"/>

</svg>
