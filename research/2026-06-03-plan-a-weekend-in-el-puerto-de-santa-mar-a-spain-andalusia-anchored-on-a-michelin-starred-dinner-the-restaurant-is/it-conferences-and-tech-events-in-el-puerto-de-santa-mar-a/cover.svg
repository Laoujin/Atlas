<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#e8d5bc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Radial glow at center -->
  <ellipse cx="800" cy="450" rx="520" ry="320" fill="url(#glow)"/>

  <!-- Layer 2: hero element — stacked angled slide shapes centered at (800, 450) -->

  <!-- Bottom slide (deepest, most offset) -->
  <rect x="420" y="255" width="760" height="420"
        rx="12"
        fill="url(#slide3)"
        opacity="0.70"
        transform="rotate(-6 800 450)"/>

  <!-- Mid slide -->
  <rect x="410" y="245" width="760" height="420"
        rx="12"
        fill="url(#slide2)"
        opacity="0.80"
        transform="rotate(-2 800 450)"/>

  <!-- Top / hero slide -->
  <rect x="400" y="235" width="760" height="420"
        rx="14"
        fill="url(#hero)"
        opacity="0.92"/>

  <!-- Content suggestion: three faint bar lines inside the hero slide -->
  <rect x="470" y="320" width="420" height="20" rx="4" fill="#fef3ec" opacity="0.25"/>
  <rect x="470" y="365" width="320" height="20" rx="4" fill="#fef3ec" opacity="0.20"/>
  <rect x="470" y="410" width="360" height="20" rx="4" fill="#fef3ec" opacity="0.18"/>

  <!-- Network / connector accent: small dot cluster suggesting attendees/nodes -->
  <circle cx="950" cy="355" r="18" fill="#fbbf24" opacity="0.65"/>
  <circle cx="998" cy="398" r="12" fill="#fbbf24" opacity="0.45"/>
  <line x1="950" y1="355" x2="998" y2="398" stroke="#fbbf24" stroke-width="3" opacity="0.40"/>

  <!-- Layer 3: corner accents (outside safe zone, purely decorative) -->
  <circle cx="0" cy="0" r="220" fill="#c2410c" opacity="0.08"/>
  <circle cx="1600" cy="900" r="280" fill="#78350f" opacity="0.10"/>
</svg>
