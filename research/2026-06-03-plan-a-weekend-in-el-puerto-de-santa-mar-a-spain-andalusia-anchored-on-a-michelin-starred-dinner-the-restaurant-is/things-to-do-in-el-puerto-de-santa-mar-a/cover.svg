<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- horizon sea band, full bleed -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#sea)" opacity="0.92"/>

  <!-- hero: setting sun over the bay, centered ~ (800,450) -->
  <circle cx="800" cy="470" r="180" fill="url(#sun)" opacity="0.95"/>

  <!-- sun reflection on water -->
  <path d="M700 560 L900 560 L860 760 L740 760 Z" fill="#fbbf24" opacity="0.55"/>
  <rect x="730" y="610" width="140" height="14" fill="#fef3ec" opacity="0.7"/>
  <rect x="745" y="660" width="110" height="12" fill="#fef3ec" opacity="0.6"/>
  <rect x="758" y="708" width="84" height="10" fill="#fef3ec" opacity="0.5"/>

  <!-- ferry / fishing boat silhouette inside safe zone -->
  <path d="M560 552 L740 552 L700 600 L600 600 Z" fill="#5c2a1a" opacity="0.92"/>
  <rect x="636" y="500" width="10" height="52" fill="#5c2a1a" opacity="0.92"/>
  <path d="M646 502 L716 548 L646 548 Z" fill="#5c2a1a" opacity="0.85"/>

  <!-- distant headland, decorative left edge -->
  <path d="M0 560 L0 500 Q120 520 240 560 Z" fill="#c2410c" opacity="0.7"/>
</svg>
