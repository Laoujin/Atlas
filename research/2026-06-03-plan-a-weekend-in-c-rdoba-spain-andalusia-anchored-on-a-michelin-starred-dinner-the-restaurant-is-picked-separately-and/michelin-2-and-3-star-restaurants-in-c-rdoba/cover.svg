<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1010"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table-glow radial -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero plate 1 fill -->
    <radialGradient id="plate1" cx="46%" cy="42%" r="54%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="70%" stop-color="#e8d8c0"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>
    <!-- Hero plate 2 fill (shadow side) -->
    <radialGradient id="plate2" cx="58%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="65%" stop-color="#dbc9ae"/>
      <stop offset="100%" stop-color="#b8966e"/>
    </radialGradient>
    <!-- Plate rim accent -->
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="95%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Rose accent gradient for michelin star motif -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Table warm glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — two plates centered at (800, 450) -->

  <!-- Back plate (slightly right-shifted, larger) -->
  <circle cx="860" cy="465" r="218" fill="url(#plate2)" opacity="0.88"/>
  <!-- Back plate rim -->
  <circle cx="860" cy="465" r="218" fill="none" stroke="#9a3309" stroke-width="12" opacity="0.65"/>
  <!-- Back plate inner ring decoration -->
  <circle cx="860" cy="465" r="185" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.4"/>

  <!-- Front plate (slightly left-shifted, prominent) -->
  <circle cx="740" cy="445" r="230" fill="url(#plate1)" opacity="0.93"/>
  <!-- Front plate rim — rust band -->
  <circle cx="740" cy="445" r="230" fill="url(#rim)"/>
  <!-- Front plate inner decorative ring -->
  <circle cx="740" cy="445" r="196" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.45"/>

  <!-- Michelin star accent — small rose glow at top of front plate -->
  <circle cx="740" cy="268" r="38" fill="url(#starGlow)" opacity="0.9"/>
  <!-- Star shape (polygon) — decorative, reads as a star motif not text -->
  <polygon points="740,240 748,262 772,262 753,276 760,300 740,286 720,300 727,276 708,262 732,262"
           fill="#be185d" opacity="0.82"/>
  <!-- Star inner highlight -->
  <polygon points="740,250 745,264 760,264 749,272 753,287 740,279 727,287 731,272 720,264 735,264"
           fill="#fbbf24" opacity="0.45"/>

  <!-- Wine glass silhouette — right side of composition, partially decorative -->
  <!-- Bowl of glass -->
  <ellipse cx="1050" cy="390" rx="52" ry="68" fill="url(#glass)" opacity="0.75"/>
  <!-- Stem -->
  <rect x="1046" y="456" width="8" height="110" fill="#fbbf24" opacity="0.2" rx="4"/>
  <!-- Base -->
  <ellipse cx="1050" cy="570" rx="38" ry="10" fill="#d97706" opacity="0.22"/>
  <!-- Wine level inside glass -->
  <ellipse cx="1050" cy="430" rx="40" ry="22" fill="#9a3309" opacity="0.35"/>

  <!-- Second smaller star — back plate star -->
  <circle cx="860" cy="280" r="30" fill="url(#starGlow)" opacity="0.75"/>
  <polygon points="860,257 867,275 887,275 871,286 877,306 860,295 843,306 849,286 833,275 853,275"
           fill="#be185d" opacity="0.70"/>
  <polygon points="860,265 865,277 877,277 868,283 871,295 860,288 849,295 852,283 843,277 855,277"
           fill="#fbbf24" opacity="0.38"/>

  <!-- Layer 3: Edge decoration (outside safe zone, atmospheric) -->
  <!-- Top-left corner warm bleed -->
  <radialGradient id="cornerTL" cx="0%" cy="0%" r="40%">
    <stop offset="0%" stop-color="#c2410c" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#cornerTL)"/>

  <!-- Bottom edge vignette -->
  <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
    <stop offset="70%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.6"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
