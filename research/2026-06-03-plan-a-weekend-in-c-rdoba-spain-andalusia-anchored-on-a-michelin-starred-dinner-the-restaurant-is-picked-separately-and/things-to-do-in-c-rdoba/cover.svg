<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- HERO: three nested striped horseshoe arches, centered ~ (800,450) -->
  <!-- outer arch -->
  <g>
    <!-- arch 1 -->
    <path d="M520 740 L520 470 A170 170 0 0 1 670 300 A170 170 0 0 1 690 470 L690 740 Z" fill="#d97706"/>
    <path d="M555 740 L555 480 A135 135 0 0 1 665 335 A135 135 0 0 1 655 480 L655 740 Z" fill="url(#stone)"/>
    <!-- arch 2 (center, hero) -->
    <path d="M700 760 L700 460 A200 200 0 0 1 880 270 A200 200 0 0 1 900 460 L900 760 Z" fill="#c2410c"/>
    <path d="M740 760 L740 470 A158 158 0 0 1 875 305 A158 158 0 0 1 860 470 L860 760 Z" fill="url(#stone)"/>
    <!-- arch 3 -->
    <path d="M910 740 L910 470 A170 170 0 0 1 1060 300 A170 170 0 0 1 1080 470 L1080 740 Z" fill="#d97706"/>
    <path d="M945 740 L945 480 A135 135 0 0 1 1055 335 A135 135 0 0 1 1045 480 L1045 740 Z" fill="url(#stone)"/>
  </g>

  <!-- voussoir stripes on the central hero arch (rust wedges) -->
  <g fill="#9a3309" opacity="0.85">
    <path d="M700 510 L740 500 A158 158 0 0 1 752 420 L712 415 A200 200 0 0 0 700 510 Z"/>
    <path d="M730 360 L765 385 A158 158 0 0 1 800 305 L780 268 A200 200 0 0 0 730 360 Z"/>
    <path d="M880 270 L880 312 A158 158 0 0 1 950 360 L990 340 A200 200 0 0 0 880 270 Z"/>
    <path d="M900 460 L860 460 A158 158 0 0 0 850 420 L890 415 A200 200 0 0 1 900 460 Z"/>
  </g>

  <!-- spring-line band tying the arches together -->
  <rect x="520" y="455" width="560" height="14" fill="#78350f" opacity="0.8"/>

  <!-- two slender columns under the hero arch -->
  <rect x="744" y="470" width="22" height="290" fill="#78350f" opacity="0.7"/>
  <rect x="834" y="470" width="22" height="290" fill="#78350f" opacity="0.7"/>

  <!-- decoration outside safe zone: floor shadow -->
  <rect x="0" y="760" width="1600" height="140" fill="#78350f" opacity="0.18"/>
</svg>
