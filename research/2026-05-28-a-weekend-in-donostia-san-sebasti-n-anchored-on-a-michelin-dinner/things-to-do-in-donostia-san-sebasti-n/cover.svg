<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow centered behind the bay -->
  <circle cx="800" cy="430" r="320" fill="url(#sun)"/>
  <circle cx="800" cy="430" r="90" fill="#fef3ec" opacity="0.85"/>

  <!-- Distant ridge line (Basque coast) -->
  <path d="M 0 540 Q 200 510 360 525 T 720 515 T 1100 520 T 1600 535 L 1600 560 L 0 560 Z" fill="#78350f" opacity="0.45"/>

  <!-- Monte Igueldo (left hill, taller) -->
  <path d="M 180 720 Q 240 520 340 470 Q 430 440 500 500 Q 560 560 600 640 L 600 720 Z" fill="url(#hill)" opacity="0.95"/>

  <!-- Monte Urgull (right hill) -->
  <path d="M 1000 720 Q 1060 590 1170 540 Q 1280 510 1360 570 Q 1420 620 1450 720 Z" fill="url(#hill)" opacity="0.95"/>

  <!-- Santa Clara island (centered, the focal punctuation) -->
  <ellipse cx="800" cy="690" rx="95" ry="22" fill="#5c2a1a" opacity="0.55"/>
  <path d="M 720 685 Q 760 625 800 620 Q 850 618 880 660 Q 885 680 870 690 L 730 690 Q 718 690 720 685 Z" fill="url(#hill)"/>

  <!-- La Concha bay water (shell-shaped curve sweeping foreground) -->
  <path d="M 0 720 Q 180 700 360 715 Q 520 730 700 720 Q 800 712 900 720 Q 1080 730 1240 715 Q 1420 700 1600 720 L 1600 900 L 0 900 Z" fill="url(#bay)"/>

  <!-- Shell-curve highlight on water -->
  <path d="M 200 760 Q 500 745 800 755 Q 1100 765 1400 750" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.55"/>
  <path d="M 280 810 Q 580 798 800 805 Q 1020 812 1320 800" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Peine del Viento accent: a single iron comb tine on the lower-left rocks -->
  <path d="M 90 740 L 90 690 M 90 695 Q 110 695 115 715" stroke="#1a0e0e" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 70 745 Q 110 735 150 745 L 150 760 Q 110 752 70 760 Z" fill="#1a0e0e" opacity="0.6"/>
</svg>
