<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mountNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- sky / full bleed -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun halo behind island -->
  <circle cx="800" cy="455" r="280" fill="url(#sun)"/>
  <circle cx="800" cy="440" r="38" fill="#fbbf24" opacity="0.95"/>

  <!-- distant horizon haze -->
  <rect y="470" width="1600" height="6" fill="#9a3309" opacity="0.35"/>

  <!-- Monte Igeldo (left, far) -->
  <path d="M 0 520 L 120 440 L 240 410 L 360 430 L 460 470 L 520 500 L 0 500 Z" fill="url(#mountFar)" opacity="0.85"/>

  <!-- Monte Urgull (right, far) -->
  <path d="M 1600 520 L 1480 430 L 1360 400 L 1240 425 L 1140 465 L 1080 500 L 1600 500 Z" fill="url(#mountFar)" opacity="0.85"/>

  <!-- Santa Clara island (centered, hero anchor) -->
  <ellipse cx="800" cy="495" rx="115" ry="22" fill="url(#mountNear)" opacity="0.95"/>
  <path d="M 690 495 Q 740 442 800 438 Q 860 442 910 495 Z" fill="url(#mountNear)"/>
  <path d="M 760 460 Q 800 450 840 460 Q 820 448 800 446 Q 780 448 760 460 Z" fill="#5c2a1a" opacity="0.6"/>

  <!-- La Concha bay crescent — the hero -->
  <!-- water body -->
  <path d="M 180 500
           C 320 560, 480 600, 800 605
           C 1120 600, 1280 560, 1420 500
           L 1420 820
           L 180 820 Z"
        fill="url(#sea)"/>

  <!-- beach crescent (rust sand) -->
  <path d="M 180 500
           C 320 560, 480 600, 800 605
           C 1120 600, 1280 560, 1420 500
           C 1280 590, 1120 640, 800 645
           C 480 640, 320 590, 180 500 Z"
        fill="#d97706" opacity="0.55"/>

  <!-- promenade rail arcs (the famous balustrade rhythm) -->
  <path d="M 240 660 Q 800 750 1360 660" stroke="#fbbf24" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M 240 685 Q 800 778 1360 685" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- water shimmer lines -->
  <path d="M 320 540 Q 800 575 1280 540" stroke="#fbbf24" stroke-width="1.2" fill="none" opacity="0.45"/>
  <path d="M 420 565 Q 800 595 1180 565" stroke="#fef3ec" stroke-width="0.8" fill="none" opacity="0.35"/>

  <!-- foreground headland silhouettes anchoring the crescent ends -->
  <path d="M 0 700 L 60 640 L 140 610 L 220 600 L 280 615 L 200 820 L 0 820 Z" fill="url(#mountNear)" opacity="0.9"/>
  <path d="M 1600 700 L 1540 640 L 1460 610 L 1380 600 L 1320 615 L 1400 820 L 1600 820 Z" fill="url(#mountNear)" opacity="0.9"/>
</svg>
