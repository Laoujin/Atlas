<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.78" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.92" stop-color="#be185d" stop-opacity="0"/>
      <stop offset="0.97" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.4" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm radial glow over the bay -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- La Concha bay curve (subtle horizon arc, evoking the shoreline) -->
  <path d="M 0 600 Q 400 540 800 600 Q 1200 660 1600 600 L 1600 900 L 0 900 Z"
        fill="#1a0e0e" opacity="0.55"/>

  <!-- Mt. Igueldo silhouette on the left, Urgull on the right -->
  <path d="M 0 600 Q 120 520 240 540 Q 340 555 420 600 Z" fill="url(#hill)" opacity="0.85"/>
  <path d="M 1180 600 Q 1280 530 1380 540 Q 1480 555 1600 590 L 1600 600 Z" fill="url(#hill)" opacity="0.85"/>

  <!-- Faint horizon shimmer line -->
  <path d="M 0 600 Q 400 540 800 600 Q 1200 660 1600 600"
        fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.35"/>

  <!-- Hero: stylized plate centered ~ (800, 480), within safe zone -->
  <!-- Outer rim glow -->
  <circle cx="800" cy="480" r="295" fill="url(#rim)" opacity="0.85"/>
  <!-- Plate body -->
  <circle cx="800" cy="480" r="270" fill="url(#plate)" opacity="0.95"/>
  <!-- Inner well ring -->
  <circle cx="800" cy="480" r="200" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.5"/>
  <!-- Centre composed accent: small rust dome (a course) -->
  <ellipse cx="800" cy="495" rx="78" ry="22" fill="#78350f" opacity="0.35"/>
  <circle cx="800" cy="470" r="58" fill="#9a3309" opacity="0.9"/>
  <circle cx="800" cy="470" r="58" fill="url(#glow)" opacity="0.6"/>
  <!-- Garnish dots -->
  <circle cx="720" cy="500" r="6" fill="#fbbf24" opacity="0.85"/>
  <circle cx="880" cy="495" r="5" fill="#fbbf24" opacity="0.75"/>
  <circle cx="820" cy="420" r="4" fill="#be185d" opacity="0.7"/>

  <!-- Michelin-evoking stars above the plate (within safe zone) -->
  <g opacity="0.95">
    <circle cx="640" cy="200" r="48" fill="url(#star)"/>
    <path d="M 640 178 L 646 196 L 664 196 L 650 206 L 656 224 L 640 214 L 624 224 L 630 206 L 616 196 L 634 196 Z"
          fill="#fbbf24"/>
    <circle cx="800" cy="170" r="56" fill="url(#star)"/>
    <path d="M 800 144 L 807 165 L 829 165 L 812 178 L 819 199 L 800 187 L 781 199 L 788 178 L 771 165 L 793 165 Z"
          fill="#fbbf24"/>
    <circle cx="960" cy="200" r="48" fill="url(#star)"/>
    <path d="M 960 178 L 966 196 L 984 196 L 970 206 L 976 224 L 960 214 L 944 224 L 950 206 L 936 196 L 954 196 Z"
          fill="#fbbf24"/>
  </g>

  <!-- Decorative bay reflection specks (atmospheric, croppable) -->
  <circle cx="280" cy="680" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="380" cy="700" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1220" cy="690" r="2" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1320" cy="710" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1400" cy="680" r="2" fill="#fbbf24" opacity="0.6"/>
</svg>
