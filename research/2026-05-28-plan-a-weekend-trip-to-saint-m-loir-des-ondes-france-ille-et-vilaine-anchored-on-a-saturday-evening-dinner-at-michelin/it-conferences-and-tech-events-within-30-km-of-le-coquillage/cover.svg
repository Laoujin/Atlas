<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rampart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- warm glow behind ramparts (sunset over the bay) -->
  <ellipse cx="800" cy="540" rx="780" ry="320" fill="url(#glow)"/>

  <!-- distant orbit / network arcs above ramparts -->
  <g fill="none" stroke="#fbbf24" stroke-opacity="0.35">
    <path d="M 200 360 Q 800 200 1400 360" stroke-width="1.4"/>
    <path d="M 260 410 Q 800 270 1340 410" stroke-width="1.1" stroke-opacity="0.22"/>
  </g>

  <!-- network nodes -->
  <g fill="#fbbf24">
    <circle cx="430" cy="312" r="4" opacity="0.85"/>
    <circle cx="640" cy="248" r="5" opacity="0.95"/>
    <circle cx="800" cy="222" r="6" opacity="1"/>
    <circle cx="960" cy="248" r="5" opacity="0.95"/>
    <circle cx="1170" cy="312" r="4" opacity="0.85"/>
  </g>
  <g stroke="#c2410c" stroke-width="1" stroke-opacity="0.55" fill="none">
    <line x1="430" y1="312" x2="640" y2="248"/>
    <line x1="640" y1="248" x2="800" y2="222"/>
    <line x1="800" y1="222" x2="960" y2="248"/>
    <line x1="960" y1="248" x2="1170" y2="312"/>
    <line x1="640" y1="248" x2="960" y2="248" stroke-opacity="0.3"/>
  </g>

  <!-- sea reflection band -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#sea)"/>

  <!-- Saint-Malo walled rampart silhouette (hero) -->
  <g fill="url(#rampart)">
    <!-- base wall -->
    <path d="M 220 640
             L 220 560
             L 260 560 L 260 540 L 280 540 L 280 560 L 320 560 L 320 540 L 340 540 L 340 560 L 380 560
             L 380 530
             L 420 530 L 420 510 L 440 510 L 440 530 L 480 530
             L 480 555
             L 540 555 L 540 535 L 560 535 L 560 555 L 600 555
             L 600 520
             L 640 520 L 640 500 L 660 500 L 660 520 L 700 520
             L 700 545
             L 760 545 L 760 525 L 780 525 L 780 545 L 820 545
             L 820 505
             L 860 505 L 860 480 L 885 480 L 885 505 L 925 505
             L 925 540
             L 980 540 L 980 520 L 1000 520 L 1000 540 L 1040 540
             L 1040 520
             L 1080 520 L 1080 500 L 1100 500 L 1100 520 L 1140 520
             L 1140 550
             L 1200 550 L 1200 530 L 1220 530 L 1220 550 L 1260 550
             L 1260 565
             L 1320 565 L 1320 545 L 1340 545 L 1340 565 L 1380 565
             L 1380 640 Z"/>
  </g>

  <!-- main tower (rust hero accent) -->
  <g>
    <rect x="855" y="410" width="60" height="160" fill="#c2410c"/>
    <polygon points="845,410 925,410 885,360" fill="#9a3309"/>
    <rect x="878" y="450" width="14" height="22" fill="#1a0e0e" opacity="0.7"/>
    <!-- small beacon -->
    <circle cx="885" cy="360" r="4" fill="#fbbf24"/>
    <circle cx="885" cy="360" r="10" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- secondary tower -->
  <g>
    <rect x="450" y="465" width="40" height="105" fill="#9a3309" opacity="0.92"/>
    <polygon points="442,465 498,465 470,432" fill="#78350f"/>
  </g>

  <!-- water reflections (thin horizontal slivers) -->
  <g stroke="#c2410c" stroke-opacity="0.35" stroke-width="1">
    <line x1="780" y1="700" x2="990" y2="700"/>
    <line x1="820" y1="730" x2="950" y2="730" stroke-opacity="0.22"/>
    <line x1="400" y1="715" x2="540" y2="715" stroke-opacity="0.22"/>
    <line x1="1050" y1="720" x2="1200" y2="720" stroke-opacity="0.22"/>
  </g>

  <!-- corner decoration: faint signal pulse top-right -->
  <g fill="none" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="1.2">
    <circle cx="1470" cy="140" r="40"/>
    <circle cx="1470" cy="140" r="70"/>
    <circle cx="1470" cy="140" r="100"/>
  </g>
  <circle cx="1470" cy="140" r="6" fill="#fbbf24" opacity="0.8"/>
</svg>
