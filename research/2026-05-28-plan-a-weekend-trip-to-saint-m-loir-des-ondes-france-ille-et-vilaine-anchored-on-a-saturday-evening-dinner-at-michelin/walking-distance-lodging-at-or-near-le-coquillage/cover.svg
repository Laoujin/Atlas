<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shellOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="shellRib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed nocturnal sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon glow halo behind shell -->
  <circle cx="800" cy="430" r="520" fill="url(#moon)" opacity="0.55"/>

  <!-- Distant bay water -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#bay)"/>

  <!-- Mont-Saint-Michel silhouette nub on horizon -->
  <path d="M 1180 640 L 1210 600 L 1218 588 L 1226 600 L 1256 640 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Faint moonlight reflection on water -->
  <ellipse cx="800" cy="700" rx="240" ry="14" fill="#fbbf24" opacity="0.18"/>
  <ellipse cx="800" cy="730" rx="160" ry="8" fill="#fbbf24" opacity="0.12"/>

  <!-- Hero: scallop shell, centered ~ (800, 450) -->
  <g transform="translate(800 470)">
    <!-- Outer shell body -->
    <path d="M -360 60
             C -360 -180, -200 -300, 0 -300
             C 200 -300, 360 -180, 360 60
             C 340 90, 280 110, 200 110
             C 160 110, 130 100, 100 110
             C 60 120, 40 100, 0 110
             C -40 100, -60 120, -100 110
             C -130 100, -160 110, -200 110
             C -280 110, -340 90, -360 60 Z"
          fill="url(#shellOuter)" opacity="0.95"/>

    <!-- Ribs radiating from hinge -->
    <g stroke="url(#shellRib)" stroke-width="6" fill="none" opacity="0.75" stroke-linecap="round">
      <path d="M 0 80 L -330 30"/>
      <path d="M 0 80 L -260 -120"/>
      <path d="M 0 80 L -160 -240"/>
      <path d="M 0 80 L -55 -290"/>
      <path d="M 0 80 L 55 -290"/>
      <path d="M 0 80 L 160 -240"/>
      <path d="M 0 80 L 260 -120"/>
      <path d="M 0 80 L 330 30"/>
    </g>
    <g stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round">
      <path d="M 0 80 L -210 -60"/>
      <path d="M 0 80 L -110 -180"/>
      <path d="M 0 80 L 0 -290"/>
      <path d="M 0 80 L 110 -180"/>
      <path d="M 0 80 L 210 -60"/>
    </g>

    <!-- Hinge ear (the small fan at the base of a scallop) -->
    <path d="M -55 78 Q 0 60 55 78 Q 30 100 0 100 Q -30 100 -55 78 Z"
          fill="#78350f" opacity="0.9"/>
    <path d="M -55 78 Q 0 60 55 78" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Soft highlight on upper shell -->
    <path d="M -300 -40 C -240 -200, -80 -270, 0 -270 C 80 -270, 240 -200, 300 -40"
          stroke="#fef3ec" stroke-width="3" fill="none" opacity="0.35"/>
  </g>

  <!-- Coastal road suggestion: thin curve along lower bay, with three lodging dots -->
  <path d="M 80 760 Q 500 720, 800 745 T 1520 760"
        stroke="#be185d" stroke-width="2" fill="none" opacity="0.55" stroke-dasharray="3 7"/>
  <circle cx="430" cy="740" r="6" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="745" r="6" fill="#fbbf24" opacity="0.9"/>
  <circle cx="1170" cy="752" r="6" fill="#fbbf24" opacity="0.9"/>

  <!-- Subtle warm light haloes around the three lodging dots -->
  <circle cx="430" cy="740" r="18" fill="#d97706" opacity="0.2"/>
  <circle cx="800" cy="745" r="18" fill="#d97706" opacity="0.2"/>
  <circle cx="1170" cy="752" r="18" fill="#d97706" opacity="0.2"/>
</svg>
