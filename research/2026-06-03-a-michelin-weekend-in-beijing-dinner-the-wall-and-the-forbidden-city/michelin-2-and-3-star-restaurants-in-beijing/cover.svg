<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background deep nocturnal gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Warm radial glow centered on table -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill gradient -->
    <radialGradient id="plateFill" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b5"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#5c2a1a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1506" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Cloche gradient -->
    <linearGradient id="clocheGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3a1506"/>
    </linearGradient>
    <!-- Inner sauce dot -->
    <radialGradient id="sauceDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle ambient arcs suggesting a formal table setting context -->
  <ellipse cx="800" cy="680" rx="520" ry="38" fill="#78350f" opacity="0.18"/>

  <!-- Layer 2: Hero — fine-dining plate presentation, centered ~(800, 440) -->

  <!-- Plate base shadow -->
  <ellipse cx="800" cy="468" rx="268" ry="268" fill="#1a0808" opacity="0.5"/>

  <!-- Main plate -->
  <circle cx="800" cy="450" r="258" fill="url(#plateFill)" opacity="0.97"/>
  <!-- Plate rim ring -->
  <circle cx="800" cy="450" r="258" fill="url(#plateRim)" opacity="1"/>
  <!-- Inner well of the plate -->
  <circle cx="800" cy="450" r="188" fill="#faf8f2" opacity="0.6"/>

  <!-- Sauce smear — abstract culinary accent, slightly off-center -->
  <ellipse cx="784" cy="442" rx="72" ry="18" fill="url(#sauceDot)" opacity="0.82" transform="rotate(-18 784 442)"/>
  <!-- Secondary sauce dot -->
  <circle cx="834" cy="408" r="14" fill="#c2410c" opacity="0.7"/>
  <!-- Tertiary micro dot -->
  <circle cx="758" cy="472" r="8" fill="#d97706" opacity="0.6"/>

  <!-- Cloche dome (lifted, top-right of plate — classic reveal pose) -->
  <!-- Cloche base ellipse -->
  <ellipse cx="800" cy="450" rx="230" ry="22" fill="url(#clocheGrad)" opacity="0.0"/>

  <!-- Michelin star trio above the plate — decorative, reads as atmospheric -->
  <!-- Star 1 (center, prominent) -->
  <circle cx="800" cy="220" r="28" fill="url(#starGlow)" opacity="0.85"/>
  <polygon points="800,200 806,215 822,215 810,224 815,240 800,231 785,240 790,224 778,215 794,215"
           fill="#fbbf24" opacity="0.92"/>

  <!-- Star 2 (left) -->
  <circle cx="724" cy="238" r="20" fill="url(#starGlow)" opacity="0.65"/>
  <polygon points="724,222 729,234 742,234 732,241 736,253 724,246 712,253 716,241 706,234 719,234"
           fill="#fbbf24" opacity="0.75"/>

  <!-- Star 3 (right) -->
  <circle cx="876" cy="238" r="20" fill="url(#starGlow)" opacity="0.65"/>
  <polygon points="876,222 881,234 894,234 884,241 888,253 876,246 864,253 868,241 858,234 871,234"
           fill="#fbbf24" opacity="0.75"/>

  <!-- Connecting ambient glow beneath stars -->
  <ellipse cx="800" cy="258" rx="120" ry="18" fill="#d97706" opacity="0.12"/>

  <!-- Layer 3: Edge decoration (gets cropped variably — carries no meaning) -->
  <!-- Corner warm vignette reinforcement -->
  <radialGradient id="vigTL" cx="0%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#78350f" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <radialGradient id="vigBR" cx="100%" cy="100%" r="60%">
    <stop offset="0%" stop-color="#78350f" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vigTL)"/>
  <rect width="1600" height="900" fill="url(#vigBR)"/>
</svg>
