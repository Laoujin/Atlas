<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm central glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero plate gradient (main plate) -->
    <radialGradient id="plate1" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c8b0"/>
    </radialGradient>
    <!-- Inner well of main plate -->
    <radialGradient id="well1" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </radialGradient>
    <!-- Second plate gradient -->
    <radialGradient id="plate2" cx="48%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </radialGradient>
    <!-- Rim accent on main plate -->
    <radialGradient id="rimAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="82%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="88%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="94%" stop-color="#d97706" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Food accent radial -->
    <radialGradient id="food" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="60%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Cloche lid gradient -->
    <linearGradient id="cloche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#c8b898" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm glow bloom -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centred at (800, 450), within safe zone x:125–1475, y:90–810 -->

  <!-- Second plate (offset back-left, partially behind hero) -->
  <ellipse cx="660" cy="508" rx="230" ry="42" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="660" cy="495" rx="228" ry="228" fill="url(#plate2)" opacity="0.72"/>
  <ellipse cx="660" cy="485" rx="172" ry="172" fill="url(#well1)" opacity="0.55"/>

  <!-- Main plate shadow -->
  <ellipse cx="806" cy="526" rx="272" ry="48" fill="#1a0e0e" opacity="0.55"/>

  <!-- Main plate body -->
  <ellipse cx="806" cy="490" rx="270" ry="270" fill="url(#plate1)" opacity="0.95"/>

  <!-- Plate rim accent ring (golden band) -->
  <ellipse cx="806" cy="490" rx="270" ry="270" fill="url(#rimAccent)" opacity="0.9"/>

  <!-- Inner plate well -->
  <ellipse cx="806" cy="482" rx="202" ry="202" fill="url(#well1)" opacity="0.88"/>

  <!-- Food composition on plate — three organic shapes suggesting a plated dish -->
  <ellipse cx="806" cy="468" rx="62" ry="38" fill="url(#food)" opacity="0.90"/>
  <ellipse cx="775" cy="495" rx="28" ry="18" fill="#d97706" opacity="0.82"/>
  <ellipse cx="838" cy="500" rx="22" ry="14" fill="#78350f" opacity="0.78"/>

  <!-- Sauce arc suggesting fine-dining plating technique -->
  <path d="M 742 460 Q 800 430 862 458" stroke="#fbbf24" stroke-width="3.5" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- Cloche dome lifted to the right — suggesting reveal of dish -->
  <ellipse cx="1060" cy="430" rx="195" ry="130" fill="url(#cloche)" opacity="0.68"/>
  <ellipse cx="1060" cy="430" rx="195" ry="28" fill="#c8b898" opacity="0.45"/>
  <!-- Cloche knob -->
  <ellipse cx="1060" cy="304" rx="22" ry="14" fill="#d97706" opacity="0.82"/>
  <rect x="1051" y="304" width="18" height="32" rx="6" fill="#d97706" opacity="0.72"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone, atmospheric) -->
  <!-- Subtle red-amber arc top-left corner (decorative, gets cropped on card) -->
  <path d="M 0 200 Q 120 80 300 140" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>
  <!-- Bottom-right warm haze -->
  <ellipse cx="1480" cy="820" rx="320" ry="200" fill="#d97706" opacity="0.07"/>
</svg>
