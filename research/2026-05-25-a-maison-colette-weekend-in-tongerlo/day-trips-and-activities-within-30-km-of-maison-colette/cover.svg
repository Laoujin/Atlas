<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="moat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind castle -->
  <circle cx="800" cy="470" r="320" fill="url(#sun)"/>

  <!-- distant forest line (Kempen) -->
  <path d="M0,560 L120,540 L240,555 L360,530 L500,548 L640,525 L780,545 L920,520 L1060,540 L1200,522 L1340,545 L1480,528 L1600,545 L1600,620 L0,620 Z"
        fill="#78350f" opacity="0.45"/>

  <!-- heath ridge -->
  <path d="M0,640 L180,615 L360,628 L540,605 L720,622 L900,608 L1080,625 L1260,612 L1440,624 L1600,615 L1600,720 L0,720 Z"
        fill="url(#heath)" opacity="0.75"/>

  <!-- hero: moated castle silhouette, centered ~(800, 450), inside safe zone -->
  <g>
    <!-- main keep body -->
    <rect x="640" y="380" width="320" height="240" fill="url(#castle)"/>
    <!-- left tower -->
    <rect x="580" y="330" width="90" height="290" fill="url(#castle)"/>
    <!-- right tower -->
    <rect x="930" y="330" width="90" height="290" fill="url(#castle)"/>
    <!-- left conical roof -->
    <polygon points="580,330 670,330 625,250" fill="#5c2a1a"/>
    <!-- right conical roof -->
    <polygon points="930,330 1020,330 975,250" fill="#5c2a1a"/>
    <!-- center gable roof -->
    <polygon points="640,380 960,380 800,300" fill="#5c2a1a"/>
    <!-- crenellation notches on main body -->
    <rect x="660" y="370" width="30" height="14" fill="#faf8f2" opacity="0.05"/>
    <rect x="710" y="370" width="30" height="14" fill="#faf8f2" opacity="0.05"/>
    <rect x="760" y="370" width="30" height="14" fill="#faf8f2" opacity="0.05"/>
    <rect x="810" y="370" width="30" height="14" fill="#faf8f2" opacity="0.05"/>
    <rect x="860" y="370" width="30" height="14" fill="#faf8f2" opacity="0.05"/>
    <rect x="910" y="370" width="30" height="14" fill="#faf8f2" opacity="0.05"/>
    <!-- finial spires -->
    <line x1="625" y1="250" x2="625" y2="220" stroke="#5c2a1a" stroke-width="4"/>
    <line x1="975" y1="250" x2="975" y2="220" stroke="#5c2a1a" stroke-width="4"/>
    <line x1="800" y1="300" x2="800" y2="260" stroke="#5c2a1a" stroke-width="4"/>
    <!-- arched gateway -->
    <path d="M770,620 L770,560 Q800,520 830,560 L830,620 Z" fill="#1a0e0e"/>
  </g>

  <!-- moat with reflection -->
  <rect x="440" y="620" width="720" height="120" fill="url(#moat)"/>
  <!-- castle reflection (faint) -->
  <g opacity="0.35">
    <rect x="640" y="620" width="320" height="80" fill="#1a0e0e"/>
    <rect x="580" y="620" width="90" height="100" fill="#1a0e0e"/>
    <rect x="930" y="620" width="90" height="100" fill="#1a0e0e"/>
  </g>
  <!-- water ripple lines -->
  <line x1="480" y1="680" x2="620" y2="680" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <line x1="1000" y1="690" x2="1140" y2="690" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <line x1="700" y1="710" x2="900" y2="710" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>

  <!-- foreground heath bank -->
  <path d="M0,720 Q400,700 800,720 T1600,715 L1600,900 L0,900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- a few heath sprigs (decoration, edges) -->
  <circle cx="120" cy="740" r="6" fill="#c2410c" opacity="0.6"/>
  <circle cx="180" cy="755" r="4" fill="#d97706" opacity="0.6"/>
  <circle cx="1450" cy="745" r="5" fill="#c2410c" opacity="0.6"/>
  <circle cx="1510" cy="760" r="4" fill="#d97706" opacity="0.6"/>
</svg>
