<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="anchor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Concentric radius rings centered on anchor (800, 450) -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.35"/>
  <circle cx="800" cy="450" r="230" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.45"/>
  <circle cx="800" cy="450" r="130" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.6"/>

  <!-- Compass cross-hairs -->
  <line x1="800" y1="90" x2="800" y2="810" stroke="#9a3309" stroke-width="1.2" opacity="0.3"/>
  <line x1="200" y1="450" x2="1400" y2="450" stroke="#9a3309" stroke-width="1.2" opacity="0.3"/>

  <!-- Connection lines from anchor to venue nodes -->
  <line x1="800" y1="450" x2="510" y2="290" stroke="#6d28d9" stroke-width="1.6" opacity="0.55"/>
  <line x1="800" y1="450" x2="1120" y2="270" stroke="#6d28d9" stroke-width="1.6" opacity="0.55"/>
  <line x1="800" y1="450" x2="1180" y2="620" stroke="#6d28d9" stroke-width="1.6" opacity="0.55"/>
  <line x1="800" y1="450" x2="470" y2="640" stroke="#6d28d9" stroke-width="1.6" opacity="0.55"/>

  <!-- Venue nodes (conferences) -->
  <circle cx="510" cy="290" r="22" fill="url(#node)" opacity="0.9"/>
  <circle cx="510" cy="290" r="38" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.35"/>

  <circle cx="1120" cy="270" r="26" fill="url(#node)" opacity="0.9"/>
  <circle cx="1120" cy="270" r="44" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.35"/>

  <circle cx="1180" cy="620" r="20" fill="url(#node)" opacity="0.9"/>
  <circle cx="1180" cy="620" r="34" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.35"/>

  <circle cx="470" cy="640" r="24" fill="url(#node)" opacity="0.9"/>
  <circle cx="470" cy="640" r="40" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.35"/>

  <!-- Hero: anchor pin (Maison Colette) at center -->
  <path d="M 800 350 C 760 350, 730 380, 730 420 C 730 470, 800 540, 800 540 C 800 540, 870 470, 870 420 C 870 380, 840 350, 800 350 Z"
        fill="url(#anchor)" opacity="0.95"/>
  <circle cx="800" cy="418" r="22" fill="#faf8f2" opacity="0.95"/>
  <circle cx="800" cy="418" r="10" fill="#78350f" opacity="0.85"/>
</svg>
