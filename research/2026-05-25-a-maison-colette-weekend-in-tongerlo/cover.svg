<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="abbey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant stars (decoration, will crop variably) -->
  <circle cx="220" cy="140" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1380" cy="180" r="2.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="1480" cy="320" r="1.8" fill="#fef3ec" opacity="0.6"/>
  <circle cx="160" cy="380" r="1.8" fill="#fef3ec" opacity="0.6"/>
  <circle cx="1250" cy="120" r="1.5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="320" cy="220" r="1.5" fill="#fef3ec" opacity="0.5"/>

  <!-- abbey silhouette beneath the star, inside safe zone -->
  <g fill="url(#abbey)" opacity="0.92">
    <!-- main nave -->
    <rect x="640" y="640" width="320" height="140"/>
    <!-- nave roof -->
    <polygon points="640,640 800,560 960,640"/>
    <!-- left tower -->
    <rect x="560" y="600" width="70" height="180"/>
    <polygon points="560,600 595,540 630,600"/>
    <!-- right tower (taller, central spire) -->
    <rect x="770" y="500" width="60" height="280"/>
    <polygon points="770,500 800,430 830,500"/>
    <!-- right wing -->
    <rect x="970" y="660" width="180" height="120"/>
    <polygon points="970,660 1060,600 1150,660"/>
    <!-- ground extension -->
    <rect x="500" y="760" width="700" height="20"/>
  </g>

  <!-- small cross on central spire -->
  <rect x="797" y="410" width="6" height="22" fill="#78350f" opacity="0.85"/>
  <rect x="791" y="416" width="18" height="5" fill="#78350f" opacity="0.85"/>

  <!-- hero: Michelin star, centered around (800, 320) -->
  <polygon points="800,140 838,272 974,272 864,352 906,484 800,404 694,484 736,352 626,272 762,272"
           fill="url(#star)" opacity="0.95"/>
  <!-- inner highlight -->
  <polygon points="800,200 826,290 920,290 844,346 872,438 800,382 728,438 756,346 680,290 774,290"
           fill="#fbbf24" opacity="0.35"/>
</svg>
