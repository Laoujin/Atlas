<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringFill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.78" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.95" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- rolling Loire hills, full-bleed (decorative, safe to crop) -->
  <path d="M0,650 C200,600 360,680 560,640 C760,600 920,690 1140,650 C1340,615 1480,665 1600,640 L1600,900 L0,900 Z" fill="url(#hills)" opacity="0.7"/>
  <path d="M0,730 C220,700 380,760 600,730 C820,700 1020,765 1240,740 C1420,720 1520,755 1600,745 L1600,900 L0,900 Z" fill="#78350f" opacity="0.18"/>

  <!-- river hint, low along the base -->
  <path d="M0,810 C260,795 480,825 760,810 C1020,796 1260,824 1600,810" fill="none" stroke="#0e7490" stroke-width="3" opacity="0.35"/>

  <!-- HERO: 30 km radius circle, centered (800, 450), r=300 -> bbox 500-1100, 150-750, inside safe zone -->
  <!-- outermost soft ring fill -->
  <circle cx="800" cy="450" r="300" fill="url(#ringFill)"/>

  <!-- the radius ring itself -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.85"/>

  <!-- inner concentric tick rings (10km, 20km) -->
  <circle cx="800" cy="450" r="200" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.45" stroke-dasharray="2 6"/>
  <circle cx="800" cy="450" r="100" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.5" stroke-dasharray="2 6"/>

  <!-- compass crosshair, faint, lives inside the ring -->
  <line x1="800" y1="170" x2="800" y2="730" stroke="#9a3309" stroke-width="0.8" opacity="0.3"/>
  <line x1="520" y1="450" x2="1080" y2="450" stroke="#9a3309" stroke-width="0.8" opacity="0.3"/>

  <!-- central hub glow: Roanne, the only real cluster -->
  <circle cx="800" cy="450" r="95" fill="url(#hub)"/>

  <!-- venue dots clustered tight around the hub (the sparse scene) -->
  <circle cx="800" cy="450" r="9" fill="#c2410c"/>
  <circle cx="782" cy="438" r="5" fill="#9a3309" opacity="0.9"/>
  <circle cx="818" cy="462" r="5" fill="#9a3309" opacity="0.9"/>
  <circle cx="824" cy="436" r="4" fill="#c2410c" opacity="0.85"/>
  <circle cx="778" cy="466" r="4" fill="#c2410c" opacity="0.85"/>

  <!-- one lonely outlier dot toward the ring edge, emphasising sparsity -->
  <circle cx="690" cy="380" r="4" fill="#9a3309" opacity="0.7"/>
  <line x1="690" y1="380" x2="800" y2="450" stroke="#9a3309" stroke-width="0.7" opacity="0.35" stroke-dasharray="3 4"/>

  <!-- pin marker on the hub: simple teardrop, no text -->
  <path d="M800,378 C775,378 758,398 758,420 C758,448 800,490 800,490 C800,490 842,448 842,420 C842,398 825,378 800,378 Z" fill="#c2410c" opacity="0.92"/>
  <circle cx="800" cy="418" r="11" fill="#faf8f2"/>
  <circle cx="800" cy="418" r="5" fill="#78350f"/>

  <!-- four cardinal tick marks on the 30km ring -->
  <line x1="800" y1="142" x2="800" y2="158" stroke="#9a3309" stroke-width="2" opacity="0.7"/>
  <line x1="800" y1="742" x2="800" y2="758" stroke="#9a3309" stroke-width="2" opacity="0.7"/>
  <line x1="492" y1="450" x2="508" y2="450" stroke="#9a3309" stroke-width="2" opacity="0.7"/>
  <line x1="1092" y1="450" x2="1108" y2="450" stroke="#9a3309" stroke-width="2" opacity="0.7"/>
</svg>
