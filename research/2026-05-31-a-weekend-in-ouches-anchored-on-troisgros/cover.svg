<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#5c2a1a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="plateOuter" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="70%" stop-color="#d9c9a8"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="plateInner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="80%" stop-color="#e8d6b8"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="wineSurface" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Under plate (charger) -->
  <ellipse cx="780" cy="540" rx="430" ry="95" fill="#1a0e0e" opacity="0.55"/>
  <ellipse cx="780" cy="520" rx="420" ry="88" fill="url(#plateOuter)" opacity="0.92"/>
  <ellipse cx="780" cy="520" rx="330" ry="68" fill="#1a0e0e" opacity="0.35"/>

  <!-- Top plate -->
  <ellipse cx="820" cy="465" rx="330" ry="70" fill="url(#plateInner)" opacity="0.95"/>
  <ellipse cx="820" cy="465" rx="245" ry="50" fill="none" stroke="#78350f" stroke-width="2" opacity="0.45"/>

  <!-- Plated accent: small warm dab, like a sauce dot -->
  <ellipse cx="820" cy="462" rx="36" ry="9" fill="#c2410c" opacity="0.75"/>
  <ellipse cx="820" cy="460" rx="14" ry="4" fill="#fbbf24" opacity="0.85"/>

  <!-- Wine glass silhouette -->
  <g opacity="0.92">
    <!-- bowl -->
    <path d="M 1180 250
             C 1180 360, 1280 400, 1280 430
             C 1280 400, 1380 360, 1380 250
             C 1380 230, 1340 220, 1280 220
             C 1220 220, 1180 230, 1180 250 Z"
          fill="url(#glass)"/>
    <!-- wine surface ellipse inside bowl -->
    <ellipse cx="1280" cy="252" rx="95" ry="14" fill="url(#wineSurface)"/>
    <!-- highlight on bowl -->
    <path d="M 1210 260 C 1215 320, 1235 360, 1255 385" stroke="#fef3ec" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- stem -->
    <rect x="1276" y="430" width="8" height="120" fill="#78350f" opacity="0.85"/>
    <!-- base -->
    <ellipse cx="1280" cy="555" rx="70" ry="10" fill="#1a0e0e" opacity="0.6"/>
    <ellipse cx="1280" cy="552" rx="65" ry="8" fill="#78350f" opacity="0.8"/>
  </g>

  <!-- Distant rolling-hill horizon hint (Loire countryside), low opacity, behind glow -->
  <path d="M 0 720 Q 300 660 600 700 T 1200 690 T 1600 710 L 1600 760 L 0 760 Z" fill="#78350f" opacity="0.18"/>
  <path d="M 0 760 Q 400 720 800 745 T 1600 740 L 1600 800 L 0 800 Z" fill="#5c2a1a" opacity="0.35"/>

  <!-- Subtle candle-light specks (ambiance, decorative; outside hero focus) -->
  <circle cx="220" cy="200" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="180" cy="260" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1450" cy="180" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1500" cy="240" r="2" fill="#fbbf24" opacity="0.45"/>
</svg>
