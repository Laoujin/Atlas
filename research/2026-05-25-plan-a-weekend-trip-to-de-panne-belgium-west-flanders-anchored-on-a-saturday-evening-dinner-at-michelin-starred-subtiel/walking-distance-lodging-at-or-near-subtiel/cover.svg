<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="villa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm radial glow: the restaurant beacon at center -->
  <circle cx="800" cy="470" r="520" fill="url(#glow)"/>

  <!-- Distant dune ridge (decorative, full-bleed bottom) -->
  <path d="M -50 720 Q 200 640 460 690 T 980 660 T 1660 700 L 1660 950 L -50 950 Z" fill="url(#dune)" opacity="0.85"/>

  <!-- Hero: a Dumontwijk-style brick villa silhouette, centered in safe zone -->
  <g transform="translate(560 340)">
    <!-- Main villa body -->
    <rect x="80" y="180" width="380" height="260" fill="url(#villa)" opacity="0.95"/>
    <!-- Side wing -->
    <rect x="0" y="240" width="120" height="200" fill="#78350f" opacity="0.92"/>
    <!-- Steep pitched roof (signature Dumontwijk) -->
    <polygon points="60,180 270,40 480,180" fill="url(#roof)" opacity="0.95"/>
    <!-- Wing roof -->
    <polygon points="-10,240 60,180 130,240" fill="#5c2a1a" opacity="0.9"/>
    <!-- Chimney -->
    <rect x="350" y="70" width="28" height="80" fill="#5c2a1a"/>
    <!-- Lit windows: warm amber rectangles (no text, just glow) -->
    <rect x="140" y="240" width="40" height="60" fill="#fbbf24" opacity="0.9"/>
    <rect x="220" y="240" width="40" height="60" fill="#fbbf24" opacity="0.75"/>
    <rect x="300" y="240" width="40" height="60" fill="#fbbf24" opacity="0.9"/>
    <rect x="380" y="240" width="40" height="60" fill="#d97706" opacity="0.8"/>
    <rect x="170" y="350" width="50" height="80" fill="#fbbf24" opacity="0.85"/>
    <rect x="280" y="350" width="50" height="80" fill="#d97706" opacity="0.7"/>
    <rect x="30" y="300" width="34" height="50" fill="#fbbf24" opacity="0.8"/>
    <rect x="30" y="380" width="34" height="50" fill="#d97706" opacity="0.7"/>
    <!-- Dormer in roof -->
    <rect x="240" y="120" width="60" height="60" fill="#5c2a1a"/>
    <polygon points="230,120 270,85 310,120" fill="#5c2a1a"/>
    <rect x="255" y="135" width="30" height="35" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- Foreground dune (full-bleed, will crop on detail hero) -->
  <path d="M -50 820 Q 300 760 700 800 T 1280 810 T 1660 790 L 1660 950 L -50 950 Z" fill="#1a0e0e" opacity="0.95"/>

  <!-- Subtle moon high in sky, outside hero safe zone safety not needed since within -->
  <circle cx="1280" cy="180" r="42" fill="#faf8f2" opacity="0.85"/>
  <circle cx="1268" cy="172" r="38" fill="#5c2a1a" opacity="0.55"/>
</svg>
