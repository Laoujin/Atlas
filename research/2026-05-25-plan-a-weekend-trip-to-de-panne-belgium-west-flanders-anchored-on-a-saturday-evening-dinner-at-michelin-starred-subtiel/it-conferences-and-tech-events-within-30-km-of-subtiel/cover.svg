<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- subtle horizon glow -->
  <ellipse cx="800" cy="900" rx="1200" ry="280" fill="#d97706" opacity="0.18"/>

  <!-- coastline arc, full-bleed decoration (cropping is fine) -->
  <path d="M -50 620 Q 280 540 560 580 T 1100 540 Q 1380 510 1680 560 L 1680 920 L -50 920 Z"
        fill="url(#coast)" opacity="0.78"/>
  <path d="M -50 620 Q 280 540 560 580 T 1100 540 Q 1380 510 1680 560"
        fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.45"/>

  <!-- radial-radius hero centred at (800, 450) -->
  <g opacity="0.9">
    <!-- outer ring -->
    <circle cx="800" cy="450" r="320" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>
    <circle cx="800" cy="450" r="230" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.55"/>
    <circle cx="800" cy="450" r="140" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.65"/>
  </g>

  <!-- lighthouse beam sweeping across the radius -->
  <path d="M 800 450 L 1450 240 L 1450 660 Z" fill="url(#beam)" opacity="0.7"/>

  <!-- beacon glow at centre -->
  <circle cx="800" cy="450" r="180" fill="url(#beacon)"/>

  <!-- event nodes within the radius -->
  <g fill="#fbbf24">
    <circle cx="640" cy="380" r="7" opacity="0.95"/>
    <circle cx="940" cy="410" r="9" opacity="0.95"/>
    <circle cx="1050" cy="500" r="6" opacity="0.9"/>
    <circle cx="700" cy="540" r="5" opacity="0.85"/>
    <circle cx="870" cy="560" r="6" opacity="0.9"/>
  </g>
  <g stroke="#fbbf24" stroke-width="1" opacity="0.35" fill="none">
    <line x1="800" y1="450" x2="640" y2="380"/>
    <line x1="800" y1="450" x2="940" y2="410"/>
    <line x1="800" y1="450" x2="1050" y2="500"/>
    <line x1="800" y1="450" x2="700" y2="540"/>
    <line x1="800" y1="450" x2="870" y2="560"/>
  </g>

  <!-- lighthouse silhouette as hero anchor -->
  <g opacity="0.95">
    <rect x="788" y="380" width="24" height="110" fill="#1a0e0e"/>
    <polygon points="780,380 820,380 810,360 790,360" fill="#1a0e0e"/>
    <rect x="784" y="360" width="32" height="6" fill="#1a0e0e"/>
    <polygon points="790,360 810,360 800,338" fill="#1a0e0e"/>
    <rect x="780" y="490" width="40" height="14" fill="#1a0e0e"/>
    <circle cx="800" cy="348" r="6" fill="#fbbf24" opacity="0.95"/>
  </g>

  <!-- centre marker pip -->
  <circle cx="800" cy="450" r="4" fill="#c2410c"/>
</svg>
