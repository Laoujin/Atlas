  <g opacity="0.55" stroke="#78350f" stroke-width="2" stroke-linecap="round">
    <line x1="500" y1="780" x2="498" y2="745"/>
    <line x1="540" y1="785" x2="542" y2="750"/>
    <line x1="520" y1="788" x2="520" y2="748"/>
    <line x1="1020" y1="760" x2="1018" y2="728"/>
