<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duneFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="duneNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <circle cx="800" cy="430" r="320" fill="url(#halo)"/>
  <circle cx="800" cy="450" r="150" fill="url(#sun)" opacity="0.95"/>

  <rect x="0" y="500" width="1600" height="40" fill="url(#sea)" opacity="0.55"/>
  <rect x="0" y="545" width="1600" height="14" fill="#c2410c" opacity="0.35"/>

  <path d="M0,620 Q260,540 520,590 T1080,580 T1600,600 L1600,900 L0,900 Z" fill="url(#duneFar)" opacity="0.85"/>
  <path d="M0,720 Q200,640 440,680 Q700,720 940,670 Q1200,620 1600,690 L1600,900 L0,900 Z" fill="url(#duneNear)"/>

  <path d="M0,720 Q200,640 440,680 Q700,720 940,670 Q1200,620 1600,690" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.45"/>

  <g opacity="0.7" fill="#fbbf24">
    <circle cx="380" cy="710" r="3"/>
    <circle cx="640" cy="700" r="2.5"/>
    <circle cx="880" cy="685" r="3"/>
    <circle cx="1180" cy="660" r="2.5"/>
