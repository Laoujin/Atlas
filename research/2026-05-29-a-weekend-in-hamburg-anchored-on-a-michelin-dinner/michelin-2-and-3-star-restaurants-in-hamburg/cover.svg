<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.7">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="plateA" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#faf8f2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="plateB" cx="0.4" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Back plate (larger, off-center left) -->
  <ellipse cx="640" cy="500" rx="280" ry="60" fill="#000" opacity="0.35"/>
  <circle cx="640" cy="470" r="240" fill="url(#plateA)" opacity="0.9"/>
  <circle cx="640" cy="470" r="240" fill="none" stroke="#78350f" stroke-width="3" opacity="0.6"/>
  <circle cx="640" cy="470" r="180" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>

  <!-- Front plate (smaller, overlapping right) -->
  <ellipse cx="990" cy="560" rx="210" ry="45" fill="#000" opacity="0.4"/>
  <circle cx="990" cy="535" r="185" fill="url(#plateB)" opacity="0.92"/>
  <circle cx="990" cy="535" r="185" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.55"/>
  <circle cx="990" cy="535" r="135" fill="none" stroke="#fef3ec" stroke-width="1.2" opacity="0.35"/>

  <!-- Food morsel accents on the front plate -->
  <circle cx="960" cy="510" r="14" fill="#78350f" opacity="0.75"/>
  <circle cx="1015" cy="540" r="10" fill="#9a3309" opacity="0.8"/>
  <circle cx="985" cy="565" r="8" fill="#fbbf24" opacity="0.7"/>

  <!-- Wine glass silhouette (rose secondary, used with restraint) -->
  <path d="M 1200 230 Q 1200 360 1260 380 Q 1320 360 1320 230 Z" fill="url(#glass)" opacity="0.85"/>
  <rect x="1257" y="380" width="6" height="180" fill="#9a3309" opacity="0.75"/>
  <ellipse cx="1260" cy="565" rx="55" ry="8" fill="#9a3309" opacity="0.8"/>
  <!-- Wine surface highlight inside the bowl -->
  <ellipse cx="1260" cy="240" rx="55" ry="6" fill="#fbbf24" opacity="0.4"/>

  <!-- Subtle star spark (single, restrained — nod to Michelin) -->
  <g opacity="0.7" transform="translate(380 220)">
    <path d="M 0 -28 L 8 -8 L 28 0 L 8 8 L 0 28 L -8 8 L -28 0 L -8 -8 Z" fill="#fbbf24"/>
  </g>

  <!-- Faint secondary spark for balance -->
  <g opacity="0.4" transform="translate(1150 720)">
    <path d="M 0 -16 L 5 -5 L 16 0 L 5 5 L 0 16 L -5 5 L -16 0 L -5 -5 Z" fill="#fbbf24"/>
  </g>
</svg>
