<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun glow behind building -->
  <circle cx="1050" cy="320" r="240" fill="url(#sun)" opacity="0.8"/>
  <circle cx="1050" cy="320" r="60" fill="#fbbf24" opacity="0.9"/>

  <!-- distant brick warehouse row (Speicherstadt suggestion) -->
  <g opacity="0.55">
    <rect x="180" y="500" width="180" height="170" fill="#9a3309"/>
    <polygon points="180,500 270,440 360,500" fill="#78350f"/>
    <rect x="360" y="520" width="140" height="150" fill="#78350f"/>
    <polygon points="360,520 430,470 500,520" fill="#5c2a1a"/>
    <rect x="1200" y="510" width="160" height="160" fill="#9a3309"/>
    <polygon points="1200,510 1280,455 1360,510" fill="#78350f"/>
    <rect x="1360" y="530" width="120" height="140" fill="#78350f"/>
    <polygon points="1360,530 1420,485 1480,530" fill="#5c2a1a"/>
  </g>

  <!-- Elbphilharmonie hero: brick warehouse base -->
  <rect x="560" y="430" width="480" height="260" fill="url(#brick)" opacity="0.95"/>

  <!-- horizontal window bands on brick base -->
  <g fill="#1a0e0e" opacity="0.35">
    <rect x="580" y="470" width="440" height="8"/>
    <rect x="580" y="510" width="440" height="8"/>
    <rect x="580" y="550" width="440" height="8"/>
    <rect x="580" y="590" width="440" height="8"/>
    <rect x="580" y="630" width="440" height="8"/>
  </g>

  <!-- glass wave roof: zig-zag silhouette -->
  <polygon points="560,430 620,330 700,400 780,300 860,390 940,290 1020,380 1040,430"
           fill="url(#glass)" opacity="0.92"/>

  <!-- roof grid lines (glass facets) -->
  <g stroke="#78350f" stroke-width="2" opacity="0.6" fill="none">
    <line x1="620" y1="330" x2="620" y2="430"/>
    <line x1="700" y1="400" x2="700" y2="430"/>
    <line x1="780" y1="300" x2="780" y2="430"/>
    <line x1="860" y1="390" x2="860" y2="430"/>
    <line x1="940" y1="290" x2="940" y2="430"/>
    <line x1="1020" y1="380" x2="1020" y2="430"/>
  </g>

  <!-- water band -->
  <rect x="0" y="690" width="1600" height="210" fill="url(#water)"/>

  <!-- reflection of hero in water -->
  <rect x="560" y="690" width="480" height="80" fill="#78350f" opacity="0.25"/>

  <!-- water ripples -->
  <g stroke="#c2410c" stroke-width="2" opacity="0.45" fill="none">
    <line x1="120" y1="740" x2="280" y2="740"/>
    <line x1="340" y1="770" x2="500" y2="770"/>
    <line x1="180" y1="800" x2="360" y2="800"/>
    <line x1="1100" y1="740" x2="1260" y2="740"/>
    <line x1="1320" y1="770" x2="1480" y2="770"/>
    <line x1="1180" y1="800" x2="1360" y2="800"/>
    <line x1="600" y1="830" x2="780" y2="830"/>
    <line x1="820" y1="830" x2="1000" y2="830"/>
  </g>

  <!-- small ferry silhouette on left water -->
  <g opacity="0.75">
    <rect x="280" y="700" width="90" height="20" fill="#5c2a1a"/>
    <polygon points="280,700 370,700 360,690 290,690" fill="#5c2a1a"/>
    <rect x="310" y="678" width="30" height="14" fill="#9a3309"/>
    <rect x="322" y="664" width="6" height="16" fill="#5c2a1a"/>
  </g>
</svg>
