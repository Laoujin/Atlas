<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warehouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Warm harbor glow behind hero -->
  <ellipse cx="800" cy="500" rx="780" ry="380" fill="url(#glow)"/>

  <!-- Faint calendar grid (decoration, low opacity) -->
  <g stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="280" x2="1600" y2="280"/>
    <line x1="0" y1="380" x2="1600" y2="380"/>
    <line x1="200" y1="120" x2="200" y2="700"/>
    <line x1="400" y1="120" x2="400" y2="700"/>
    <line x1="600" y1="120" x2="600" y2="700"/>
    <line x1="800" y1="120" x2="800" y2="700"/>
    <line x1="1000" y1="120" x2="1000" y2="700"/>
    <line x1="1200" y1="120" x2="1200" y2="700"/>
    <line x1="1400" y1="120" x2="1400" y2="700"/>
  </g>

  <!-- Distant crane silhouettes (background, soft) -->
  <g fill="#1a0e0e" fill-opacity="0.55">
    <polygon points="240,560 250,560 250,360 460,330 460,345 255,375 255,560"/>
    <rect x="244" y="360" width="3" height="200"/>
    <polygon points="1340,540 1350,540 1350,350 1180,325 1180,340 1345,365 1345,540"/>
  </g>

  <!-- Speicherstadt warehouse rooflines (hero, centered around 800,450) -->
  <g>
    <!-- Left warehouse block -->
    <path d="M 340 640 L 340 460 L 400 400 L 460 460 L 460 420 L 520 420 L 520 380 L 580 380 L 580 420 L 640 420 L 640 460 L 700 400 L 760 460 L 760 640 Z"
          fill="url(#warehouse)" opacity="0.92"/>
    <!-- Right warehouse block (taller, hero centerpiece) -->
    <path d="M 760 640 L 760 480 L 820 420 L 880 480 L 880 360 L 940 300 L 1000 360 L 1000 480 L 1060 420 L 1120 480 L 1120 640 Z"
          fill="url(#warehouse)" opacity="0.95"/>
    <!-- Far right warehouse block -->
    <path d="M 1120 640 L 1120 460 L 1180 400 L 1240 460 L 1240 420 L 1300 420 L 1300 460 L 1360 400 L 1420 460 L 1420 640 Z"
          fill="url(#warehouse)" opacity="0.88"/>

    <!-- Warehouse window grid (dim, evokes badge/conference rooms lit at night) -->
    <g fill="#fbbf24" opacity="0.85">
      <rect x="370" y="500" width="10" height="14"/>
      <rect x="400" y="500" width="10" height="14"/>
      <rect x="430" y="500" width="10" height="14"/>
      <rect x="370" y="540" width="10" height="14"/>
      <rect x="400" y="540" width="10" height="14"/>
      <rect x="430" y="540" width="10" height="14"/>
      <rect x="500" y="500" width="10" height="14" opacity="0.4"/>
      <rect x="530" y="500" width="10" height="14"/>
      <rect x="560" y="500" width="10" height="14"/>
      <rect x="590" y="500" width="10" height="14" opacity="0.4"/>
      <rect x="500" y="540" width="10" height="14"/>
      <rect x="530" y="540" width="10" height="14"/>
      <rect x="560" y="540" width="10" height="14"/>
      <rect x="590" y="540" width="10" height="14"/>
      <rect x="650" y="500" width="10" height="14"/>
      <rect x="680" y="500" width="10" height="14" opacity="0.4"/>
      <rect x="710" y="500" width="10" height="14"/>
      <rect x="650" y="540" width="10" height="14"/>
      <rect x="710" y="540" width="10" height="14"/>

      <!-- Hero centerpiece windows (brighter) -->
      <rect x="810" y="510" width="12" height="16"/>
      <rect x="840" y="510" width="12" height="16"/>
      <rect x="870" y="510" width="12" height="16"/>
      <rect x="900" y="510" width="12" height="16"/>
      <rect x="930" y="510" width="12" height="16"/>
      <rect x="960" y="510" width="12" height="16"/>
      <rect x="990" y="510" width="12" height="16"/>
      <rect x="810" y="555" width="12" height="16"/>
      <rect x="840" y="555" width="12" height="16" opacity="0.4"/>
      <rect x="870" y="555" width="12" height="16"/>
      <rect x="900" y="555" width="12" height="16"/>
      <rect x="930" y="555" width="12" height="16"/>
      <rect x="960" y="555" width="12" height="16" opacity="0.4"/>
      <rect x="990" y="555" width="12" height="16"/>
      <rect x="900" y="440" width="12" height="16"/>
      <rect x="930" y="440" width="12" height="16"/>
      <rect x="960" y="440" width="12" height="16"/>

      <rect x="1150" y="500" width="10" height="14"/>
      <rect x="1180" y="500" width="10" height="14"/>
      <rect x="1210" y="500" width="10" height="14" opacity="0.4"/>
      <rect x="1240" y="500" width="10" height="14"/>
      <rect x="1270" y="500" width="10" height="14"/>
      <rect x="1300" y="500" width="10" height="14"/>
      <rect x="1330" y="500" width="10" height="14"/>
      <rect x="1150" y="540" width="10" height="14"/>
      <rect x="1180" y="540" width="10" height="14"/>
      <rect x="1240" y="540" width="10" height="14"/>
      <rect x="1300" y="540" width="10" height="14"/>
      <rect x="1330" y="540" width="10" height="14" opacity="0.4"/>
    </g>
  </g>

  <!-- Water foreground with warehouse reflections -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#water)"/>
  <g fill="#c2410c" opacity="0.22">
    <rect x="340" y="640" width="420" height="90"/>
    <rect x="760" y="640" width="360" height="110"/>
    <rect x="1120" y="640" width="300" height="80"/>
  </g>
  <g stroke="#0e7490" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="280" y1="700" x2="520" y2="700"/>
    <line x1="600" y1="730" x2="900" y2="730"/>
    <line x1="950" y1="760" x2="1280" y2="760"/>
    <line x1="380" y1="790" x2="700" y2="790"/>
    <line x1="820" y1="820" x2="1150" y2="820"/>
  </g>
</svg>
