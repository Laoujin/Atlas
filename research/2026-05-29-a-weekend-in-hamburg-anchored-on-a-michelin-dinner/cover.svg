<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun glow over the harbor -->
  <circle cx="1100" cy="380" r="320" fill="url(#sun)"/>

  <!-- Distant crane silhouette (decoration, outside hero center) -->
  <g opacity="0.35" fill="#78350f">
    <rect x="200" y="380" width="6" height="200"/>
    <polygon points="203,380 350,330 350,345 203,395"/>
    <rect x="195" y="320" width="20" height="70"/>
  </g>
  <g opacity="0.3" fill="#78350f">
    <rect x="1380" y="400" width="5" height="180"/>
    <polygon points="1382,400 1500,360 1500,372 1382,412"/>
  </g>

  <!-- HERO: Elbphilharmonie — red-brick Speicherstadt base + wave-glass roof -->
  <!-- Brick warehouse base, centered around (800, 520) -->
  <g>
    <!-- Main brick block -->
    <rect x="430" y="500" width="740" height="280" fill="url(#brick)"/>
    <!-- Arched window rows (rust on rust, low contrast) -->
    <g fill="#5c2a1a" opacity="0.55">
      <rect x="470" y="540" width="40" height="60" rx="20"/>
      <rect x="530" y="540" width="40" height="60" rx="20"/>
      <rect x="590" y="540" width="40" height="60" rx="20"/>
      <rect x="650" y="540" width="40" height="60" rx="20"/>
      <rect x="710" y="540" width="40" height="60" rx="20"/>
      <rect x="770" y="540" width="40" height="60" rx="20"/>
      <rect x="830" y="540" width="40" height="60" rx="20"/>
      <rect x="890" y="540" width="40" height="60" rx="20"/>
      <rect x="950" y="540" width="40" height="60" rx="20"/>
      <rect x="1010" y="540" width="40" height="60" rx="20"/>
      <rect x="1070" y="540" width="40" height="60" rx="20"/>
      <rect x="1130" y="540" width="40" height="60" rx="20"/>
    </g>
    <g fill="#5c2a1a" opacity="0.45">
      <rect x="470" y="640" width="40" height="60" rx="20"/>
      <rect x="530" y="640" width="40" height="60" rx="20"/>
      <rect x="590" y="640" width="40" height="60" rx="20"/>
      <rect x="650" y="640" width="40" height="60" rx="20"/>
      <rect x="710" y="640" width="40" height="60" rx="20"/>
      <rect x="770" y="640" width="40" height="60" rx="20"/>
      <rect x="830" y="640" width="40" height="60" rx="20"/>
      <rect x="890" y="640" width="40" height="60" rx="20"/>
      <rect x="950" y="640" width="40" height="60" rx="20"/>
      <rect x="1010" y="640" width="40" height="60" rx="20"/>
      <rect x="1070" y="640" width="40" height="60" rx="20"/>
      <rect x="1130" y="640" width="40" height="60" rx="20"/>
    </g>

    <!-- Glass crown — facetted, with the signature wave roofline -->
    <polygon points="430,500 460,380 540,340 640,300 760,270 870,265 980,275 1080,300 1150,340 1170,500"
             fill="url(#glass)" opacity="0.9"/>
    <!-- Faceted glass panels (a few key ridges) -->
    <g stroke="#9a3309" stroke-width="1.5" opacity="0.45" fill="none">
      <line x1="540" y1="340" x2="540" y2="500"/>
      <line x1="640" y1="300" x2="640" y2="500"/>
      <line x1="760" y1="270" x2="760" y2="500"/>
      <line x1="870" y1="265" x2="870" y2="500"/>
      <line x1="980" y1="275" x2="980" y2="500"/>
      <line x1="1080" y1="300" x2="1080" y2="500"/>
    </g>
    <!-- The signature wave: a curved highlight on top -->
    <path d="M 430 500 Q 500 360 640 305 T 870 268 Q 1000 274 1080 302 T 1170 500"
          fill="none" stroke="#fef3ec" stroke-width="3" opacity="0.85"/>
  </g>

  <!-- Water reflection band, full-bleed -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#water)"/>
  <!-- Reflection ripples -->
  <g stroke="#fbbf24" stroke-width="1.5" opacity="0.4" fill="none">
    <line x1="500" y1="810" x2="700" y2="810"/>
    <line x1="780" y1="825" x2="980" y2="825"/>
    <line x1="600" y1="845" x2="820" y2="845"/>
    <line x1="900" y1="860" x2="1100" y2="860"/>
    <line x1="450" y1="870" x2="600" y2="870"/>
  </g>

  <!-- A small HADAG ferry hint, decorative, lower-right -->
  <g opacity="0.7" fill="#78350f">
    <rect x="1220" y="770" width="120" height="22" rx="4"/>
    <rect x="1240" y="752" width="80" height="20" rx="3"/>
    <rect x="1265" y="738" width="8" height="16" fill="#c2410c"/>
  </g>
</svg>
