<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="alps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow over the lake -->
  <circle cx="1080" cy="430" r="320" fill="url(#sun)"/>

  <!-- Distant Alps across the lake -->
  <path d="M0,470 L160,420 L290,445 L430,395 L560,430 L700,400 L860,440 L1010,410 L1180,445 L1330,420 L1480,450 L1600,430 L1600,520 L0,520 Z" fill="url(#alps)" opacity="0.75"/>

  <!-- Lake Geneva -->
  <rect x="0" y="510" width="1600" height="120" fill="url(#lake)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="1080" cy="535" rx="180" ry="8" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="1080" cy="555" rx="120" ry="5" fill="#fbbf24" opacity="0.4"/>
  <ellipse cx="1080" cy="575" rx="80"  ry="4" fill="#fbbf24" opacity="0.3"/>

  <!-- Lavaux vineyard hillside: stacked terrace bands sweeping down to lake -->
  <path d="M0,620 Q400,560 800,600 T1600,610 L1600,650 L0,660 Z" fill="url(#terrace)" opacity="0.88"/>
  <path d="M0,665 Q400,610 800,650 T1600,660 L1600,700 L0,710 Z" fill="#9a3309" opacity="0.85"/>
  <path d="M0,715 Q400,665 800,705 T1600,715 L1600,755 L0,765 Z" fill="#78350f" opacity="0.9"/>
  <path d="M0,770 Q400,725 800,760 T1600,770 L1600,820 L0,830 Z" fill="#5c2a1a" opacity="0.92"/>
  <path d="M0,830 L1600,825 L1600,900 L0,900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Subtle terrace stripe texture (vine rows) -->
  <path d="M0,625 Q400,565 800,605 T1600,615" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.25"/>
  <path d="M0,675 Q400,620 800,660 T1600,670" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M0,725 Q400,675 800,715 T1600,725" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.18"/>

  <!-- HERO: Michelin star centered in safe zone, anchored over the lake/horizon -->
  <g transform="translate(800 430)">
    <!-- soft halo -->
    <circle r="180" fill="#fbbf24" opacity="0.18"/>
    <circle r="120" fill="#fbbf24" opacity="0.22"/>
    <!-- five-pointed star -->
    <path d="M0,-110 L26,-34 L106,-34 L42,14 L66,90 L0,44 L-66,90 L-42,14 L-106,-34 L-26,-34 Z"
          fill="#fbbf24" stroke="#c2410c" stroke-width="3" opacity="0.95"/>
    <!-- inner highlight -->
    <path d="M0,-90 L20,-28 L82,-28 L34,10 L52,72 L0,36 L-52,72 L-34,10 L-82,-28 L-20,-28 Z"
          fill="#fef3ec" opacity="0.35"/>
    <!-- tiny rose accent dot at star center -->
    <circle r="6" fill="#be185d" opacity="0.7"/>
  </g>

  <!-- Old Town hillside silhouette on the left, foreground depth -->
  <path d="M0,600 L40,590 L60,560 L80,575 L100,545 L130,560 L155,530 L180,555 L205,540 L230,565 L260,545 L285,575 L310,560 L335,585 L360,575 L380,600 Z" fill="#1a0e0e" opacity="0.55"/>
  <!-- Cathedral spire hint -->
  <path d="M150,560 L155,500 L160,560 Z" fill="#1a0e0e" opacity="0.65"/>
</svg>
