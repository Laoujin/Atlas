<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#e8d9bf"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="rolex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun glow over the lake horizon -->
  <circle cx="820" cy="500" r="380" fill="url(#sun)"/>

  <!-- Distant alpine silhouette across the horizon -->
  <path d="M 0 540 L 180 470 L 320 500 L 460 440 L 600 490 L 760 430 L 920 480 L 1080 445 L 1240 495 L 1400 455 L 1600 490 L 1600 560 L 0 560 Z"
        fill="#78350f" opacity="0.28"/>

  <!-- Lake Geneva surface -->
  <rect x="0" y="555" width="1600" height="345" fill="url(#lake)"/>

  <!-- Lake reflections (horizontal strokes) -->
  <g stroke="#fbbf24" stroke-opacity="0.35" stroke-linecap="round">
    <line x1="540" y1="610" x2="720" y2="610" stroke-width="2"/>
    <line x1="780" y1="640" x2="900" y2="640" stroke-width="2"/>
    <line x1="660" y1="680" x2="980" y2="680" stroke-width="2"/>
    <line x1="720" y1="720" x2="860" y2="720" stroke-width="1.5"/>
  </g>

  <!-- HERO: Rolex Learning Center inspired curved slab + supports -->
  <g transform="translate(800 450)">
    <!-- Shadow under the slab -->
    <ellipse cx="0" cy="120" rx="440" ry="22" fill="#5c2a1a" opacity="0.25"/>

    <!-- Curved roof slab (top surface) -->
    <path d="M -460 60
             C -380 -10, -200 -40, 0 -30
             C 200 -20, 380 -50, 460 -10
             L 460 50
             C 380 10, 200 40, 0 30
             C -200 20, -380 50, -460 0 Z"
          fill="url(#rolex)" opacity="0.95"/>

    <!-- Underside curve (shadowed) -->
    <path d="M -460 60
             C -380 100, -200 130, 0 120
             C 200 110, 380 140, 460 100
             L 460 50
             C 380 90, 200 120, 0 110
             C -200 100, -380 130, -460 70 Z"
          fill="#78350f" opacity="0.85"/>

    <!-- Circular oculi (signature openings) -->
    <ellipse cx="-220" cy="55" rx="55" ry="14" fill="#faf8f2" opacity="0.55"/>
    <ellipse cx="-220" cy="55" rx="55" ry="14" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.6"/>
    <ellipse cx="120" cy="40" rx="70" ry="16" fill="#faf8f2" opacity="0.55"/>
    <ellipse cx="120" cy="40" rx="70" ry="16" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.6"/>
    <ellipse cx="320" cy="55" rx="45" ry="12" fill="#faf8f2" opacity="0.45"/>

    <!-- Conference badge / lanyard hanging in front (small accent) -->
    <g transform="translate(-30 130)">
      <line x1="0" y1="-110" x2="0" y2="-40" stroke="#6d28d9" stroke-width="3" opacity="0.7"/>
      <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#badge)" stroke="#9a3309" stroke-width="2" opacity="0.95"/>
      <circle cx="0" cy="-40" r="4" fill="#6d28d9"/>
      <!-- Stylised agenda lines on the badge -->
      <rect x="-44" y="-22" width="60" height="4" rx="2" fill="#c2410c" opacity="0.8"/>
      <rect x="-44" y="-10" width="80" height="3" rx="1.5" fill="#78350f" opacity="0.5"/>
      <rect x="-44" y="0"   width="72" height="3" rx="1.5" fill="#78350f" opacity="0.5"/>
      <rect x="-44" y="10"  width="84" height="3" rx="1.5" fill="#78350f" opacity="0.5"/>
      <rect x="-44" y="20"  width="50" height="3" rx="1.5" fill="#78350f" opacity="0.5"/>
    </g>
  </g>

  <!-- Network nodes drifting above (subtle nod to hackathons / AMLD) -->
  <g opacity="0.55">
    <circle cx="280" cy="200" r="6" fill="#c2410c"/>
    <circle cx="420" cy="150" r="4" fill="#6d28d9"/>
    <circle cx="540" cy="240" r="5" fill="#d97706"/>
    <line x1="280" y1="200" x2="420" y2="150" stroke="#9a3309" stroke-width="1.2"/>
    <line x1="420" y1="150" x2="540" y2="240" stroke="#9a3309" stroke-width="1.2"/>

    <circle cx="1180" cy="180" r="5" fill="#6d28d9"/>
    <circle cx="1320" cy="230" r="6" fill="#c2410c"/>
    <circle cx="1240" cy="290" r="4" fill="#d97706"/>
    <line x1="1180" y1="180" x2="1320" y2="230" stroke="#9a3309" stroke-width="1.2"/>
    <line x1="1320" y1="230" x2="1240" y2="290" stroke="#9a3309" stroke-width="1.2"/>
  </g>
</svg>
