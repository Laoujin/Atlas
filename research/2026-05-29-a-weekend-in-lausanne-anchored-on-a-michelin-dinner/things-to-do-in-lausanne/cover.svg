<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="alps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="800" cy="430" r="220" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="430" r="95" fill="#fef3ec" opacity="0.95"/>

  <!-- Distant alps (behind hero, partly in safe zone) -->
  <path d="M 100 510 L 260 380 L 360 460 L 480 360 L 600 450 L 740 350 L 880 440 L 1020 360 L 1160 450 L 1300 380 L 1500 480 L 1500 560 L 100 560 Z" fill="url(#alps)"/>
  <path d="M 100 540 L 220 470 L 340 510 L 460 450 L 600 520 L 760 460 L 900 510 L 1060 460 L 1200 520 L 1360 470 L 1500 520 L 1500 580 L 100 580 Z" fill="#5c2a1a" opacity="0.55"/>

  <!-- Lake band -->
  <rect x="0" y="560" width="1600" height="80" fill="url(#lake)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="800" cy="590" rx="110" ry="10" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="800" cy="605" rx="70" ry="5" fill="#fef3ec" opacity="0.5"/>

  <!-- Hero: Lavaux terraced vineyards rising from lake -->
  <path d="M 200 640 Q 800 615 1400 640 L 1400 660 Q 800 640 200 660 Z" fill="#c2410c" opacity="0.9"/>
  <path d="M 180 680 Q 800 650 1420 680 L 1420 705 Q 800 680 180 705 Z" fill="url(#terrace)" opacity="0.92"/>
  <path d="M 160 725 Q 800 690 1440 725 L 1440 755 Q 800 725 160 755 Z" fill="#9a3309" opacity="0.94"/>
  <path d="M 140 775 Q 800 735 1460 775 L 1460 810 Q 800 775 140 810 Z" fill="#78350f" opacity="0.95"/>

  <!-- Subtle vineyard row hints (vertical posts) on each terrace, inside safe zone -->
  <g stroke="#5c2a1a" stroke-width="2" opacity="0.45">
    <line x1="320" y1="635" x2="320" y2="655"/>
    <line x1="500" y1="630" x2="500" y2="652"/>
    <line x1="680" y1="625" x2="680" y2="650"/>
    <line x1="920" y1="625" x2="920" y2="650"/>
    <line x1="1100" y1="630" x2="1100" y2="652"/>
    <line x1="1280" y1="635" x2="1280" y2="655"/>
  </g>
  <g stroke="#5c2a1a" stroke-width="2" opacity="0.5">
    <line x1="280" y1="678" x2="280" y2="702"/>
    <line x1="460" y1="670" x2="460" y2="698"/>
    <line x1="640" y1="663" x2="640" y2="695"/>
    <line x1="820" y1="660" x2="820" y2="693"/>
    <line x1="980" y1="663" x2="980" y2="695"/>
    <line x1="1160" y1="670" x2="1160" y2="698"/>
    <line x1="1340" y1="678" x2="1340" y2="702"/>
  </g>
  <g stroke="#3a1a0a" stroke-width="2" opacity="0.55">
    <line x1="240" y1="722" x2="240" y2="752"/>
    <line x1="440" y1="712" x2="440" y2="747"/>
    <line x1="620" y1="703" x2="620" y2="743"/>
    <line x1="800" y1="700" x2="800" y2="742"/>
    <line x1="980" y1="703" x2="980" y2="743"/>
    <line x1="1160" y1="712" x2="1160" y2="747"/>
    <line x1="1360" y1="722" x2="1360" y2="752"/>
  </g>
</svg>
