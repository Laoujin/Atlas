<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="plateHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="plateSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm horizon glow -->
  <ellipse cx="800" cy="560" rx="780" ry="320" fill="url(#glow)"/>

  <!-- Alpine ridges (far, mid) -->
  <path d="M 0 540 L 180 470 L 320 510 L 470 430 L 620 490 L 760 440 L 900 495 L 1060 445 L 1220 500 L 1380 460 L 1600 510 L 1600 600 L 0 600 Z"
        fill="#3a1a10" opacity="0.85"/>
  <path d="M 0 580 L 140 530 L 290 565 L 440 510 L 600 555 L 760 515 L 920 560 L 1080 520 L 1240 565 L 1400 530 L 1600 565 L 1600 620 L 0 620 Z"
        fill="#2a1208" opacity="0.9"/>

  <!-- Lake Léman -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#lake)"/>

  <!-- Lake reflection shimmer lines -->
  <line x1="500" y1="660" x2="1100" y2="660" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="560" y1="700" x2="1040" y2="700" stroke="#fbbf24" stroke-opacity="0.14" stroke-width="2"/>
  <line x1="600" y1="740" x2="1000" y2="740" stroke="#fbbf24" stroke-opacity="0.10" stroke-width="2"/>
  <line x1="650" y1="780" x2="950" y2="780" stroke="#fbbf24" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Three plates: two flanking, one hero centered -->
  <!-- Left plate -->
  <ellipse cx="490" cy="640" rx="150" ry="38" fill="#1a0e0e" opacity="0.55"/>
  <ellipse cx="490" cy="628" rx="140" ry="34" fill="url(#plateSide)" opacity="0.92"/>
  <ellipse cx="490" cy="622" rx="105" ry="24" fill="#1a0e0e" opacity="0.45"/>

  <!-- Right plate -->
  <ellipse cx="1110" cy="640" rx="150" ry="38" fill="#1a0e0e" opacity="0.55"/>
  <ellipse cx="1110" cy="628" rx="140" ry="34" fill="url(#plateSide)" opacity="0.92"/>
  <ellipse cx="1110" cy="622" rx="105" ry="24" fill="#1a0e0e" opacity="0.45"/>

  <!-- Hero plate (center, elevated, larger) -->
  <ellipse cx="800" cy="612" rx="230" ry="55" fill="#1a0e0e" opacity="0.6"/>
  <ellipse cx="800" cy="595" rx="220" ry="50" fill="url(#plateHero)"/>
  <ellipse cx="800" cy="585" rx="170" ry="36" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="800" cy="582" rx="150" ry="30" fill="#1a0e0e" opacity="0.5"/>

  <!-- Three stars rising above the hero plate, suggesting Michelin -->
  <!-- Star geometry: 5-pointed -->
  <g opacity="0.95">
    <!-- Left star -->
    <circle cx="610" cy="340" r="50" fill="url(#starGlow)"/>
    <polygon points="610,300 619,326 647,326 624,343 633,370 610,353 587,370 596,343 573,326 601,326"
             fill="#fef3ec"/>
    <!-- Right star -->
    <circle cx="990" cy="340" r="50" fill="url(#starGlow)"/>
    <polygon points="990,300 999,326 1027,326 1004,343 1013,370 990,353 967,370 976,343 953,326 981,326"
             fill="#fef3ec"/>
    <!-- Center hero star (larger, brighter) -->
    <circle cx="800" cy="265" r="78" fill="url(#starGlow)"/>
    <polygon points="800,200 814,243 859,243 823,270 837,313 800,287 763,313 777,270 741,243 786,243"
             fill="#fef3ec"/>
    <polygon points="800,200 814,243 859,243 823,270 837,313 800,287 763,313 777,270 741,243 786,243"
             fill="#fbbf24" opacity="0.35"/>
  </g>

  <!-- Subtle rose accent: a thin steam-curl rising from the hero plate -->
  <path d="M 800 580 C 790 540 815 510 800 470 C 785 440 810 410 800 380"
        stroke="#be185d" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M 760 585 C 755 555 770 530 760 500"
        stroke="#be185d" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M 840 585 C 845 555 830 530 840 500"
        stroke="#be185d" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>
