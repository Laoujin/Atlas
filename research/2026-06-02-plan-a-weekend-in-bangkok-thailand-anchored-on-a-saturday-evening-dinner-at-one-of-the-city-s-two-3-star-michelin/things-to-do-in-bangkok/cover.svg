<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sunset sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun halo behind the prang -->
  <circle cx="800" cy="520" r="380" fill="url(#sun)"/>

  <!-- River band -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#water)"/>

  <!-- Sun reflection shimmer on water -->
  <ellipse cx="800" cy="735" rx="220" ry="6" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="755" rx="160" ry="3" fill="#d97706" opacity="0.45"/>
  <ellipse cx="800" cy="775" rx="110" ry="2" fill="#fbbf24" opacity="0.3"/>

  <!-- Distant smaller prangs (corner satellites) -->
  <g opacity="0.55" fill="url(#prang)">
    <polygon points="320,720 340,560 360,720"/>
    <polygon points="300,720 320,610 340,720"/>
    <polygon points="360,720 380,610 400,720"/>
    <polygon points="1240,720 1260,580 1280,720"/>
    <polygon points="1220,720 1240,625 1260,720"/>
    <polygon points="1280,720 1300,625 1320,720"/>
  </g>

  <!-- Hero: Wat Arun central prang (centered at ~800,450, within safe zone) -->
  <g fill="url(#prang)">
    <!-- base tiers -->
    <polygon points="640,720 960,720 940,660 660,660"/>
    <polygon points="670,660 930,660 915,615 685,615"/>
    <!-- main spire body -->
    <polygon points="700,615 900,615 870,480 730,480"/>
    <!-- shoulders / corner motifs -->
    <polygon points="700,615 685,560 715,540 730,565"/>
    <polygon points="900,615 915,560 885,540 870,565"/>
    <!-- tapering tower -->
    <polygon points="730,480 870,480 855,380 745,380"/>
    <polygon points="745,380 855,380 840,300 760,300"/>
    <polygon points="760,300 840,300 825,230 775,230"/>
    <!-- finial / pinnacle -->
    <polygon points="775,230 825,230 815,180 785,180"/>
    <polygon points="785,180 815,180 808,150 792,150"/>
    <polygon points="792,150 808,150 800,110"/>
  </g>

  <!-- Subtle rust highlight along left edge of prang to give form -->
  <g fill="#c2410c" opacity="0.35">
    <polygon points="730,480 760,300 775,230 785,180 792,150 800,110 800,180 790,300 780,480"/>
    <polygon points="660,720 685,615 700,615 700,660 690,720"/>
  </g>

  <!-- Longtail boat silhouette on the river -->
  <g fill="#1a0e0e">
    <path d="M 1020 760 Q 1110 745 1200 760 L 1215 772 Q 1110 782 1005 772 Z"/>
    <!-- long propeller shaft trailing right -->
    <rect x="1200" y="763" width="80" height="3"/>
    <!-- small cabin -->
    <rect x="1085" y="742" width="50" height="14"/>
    <polygon points="1085,742 1110,732 1135,742"/>
  </g>
  <!-- boat wake -->
  <path d="M 980 780 Q 1100 786 1220 782" stroke="#d97706" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 990 790 Q 1100 794 1210 791" stroke="#fbbf24" stroke-width="0.8" fill="none" opacity="0.35"/>
</svg>
