<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="cliffFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="cliffNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.32" r="0.22">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- low sun glow -->
  <circle cx="1150" cy="290" r="320" fill="url(#sun)"/>

  <!-- far cliff bluff (left) -->
  <path d="M 0 560 L 120 470 L 260 430 L 420 460 L 560 510 L 620 560 Z"
        fill="url(#cliffFar)" opacity="0.7"/>

  <!-- HERO: limestone bluff with citadel silhouette, centered ~ (800,450) -->
  <path d="M 380 620
           L 520 540
           L 640 470
           L 760 410
           L 880 380
           L 980 360
           L 1080 370
           L 1180 410
           L 1260 470
           L 1320 540
           L 1360 620
           Z"
        fill="url(#cliffNear)"/>

  <!-- citadel keep silhouette on the bluff (one clear element) -->
  <g fill="#1a0e0e" opacity="0.85">
    <!-- ramparts wall -->
    <rect x="820" y="338" width="200" height="38"/>
    <!-- crenellations -->
    <rect x="822" y="328" width="18" height="14"/>
    <rect x="852" y="328" width="18" height="14"/>
    <rect x="882" y="328" width="18" height="14"/>
    <rect x="912" y="328" width="18" height="14"/>
    <rect x="942" y="328" width="18" height="14"/>
    <rect x="972" y="328" width="18" height="14"/>
    <rect x="1002" y="328" width="18" height="14"/>
    <!-- keep tower -->
    <rect x="900" y="282" width="58" height="60"/>
    <rect x="900" y="274" width="14" height="12"/>
    <rect x="922" y="274" width="14" height="12"/>
    <rect x="944" y="274" width="14" height="12"/>
    <!-- flag pole hint -->
    <rect x="927" y="252" width="3" height="24"/>
  </g>

  <!-- Meuse river curving through valley -->
  <path d="M 0 760
           C 260 720, 460 740, 660 720
           C 820 705, 920 695, 1040 700
           C 1220 708, 1380 740, 1600 720
           L 1600 900 L 0 900 Z"
        fill="url(#river)"/>

  <!-- river highlights / ripples -->
  <path d="M 180 780 C 360 770, 540 778, 720 768"
        stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M 880 790 C 1080 782, 1260 792, 1440 780"
        stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- two kayaks (small, on river, within safe zone) -->
  <g opacity="0.9">
    <ellipse cx="560" cy="800" rx="36" ry="6" fill="#c2410c"/>
    <ellipse cx="620" cy="812" rx="32" ry="5.5" fill="#d97706"/>
  </g>
</svg>
