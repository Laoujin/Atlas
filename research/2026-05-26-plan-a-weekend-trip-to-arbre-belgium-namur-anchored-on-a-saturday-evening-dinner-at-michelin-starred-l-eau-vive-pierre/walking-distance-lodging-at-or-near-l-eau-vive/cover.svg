<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cubeFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- River band -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#river)"/>

  <!-- Distant far bank -->
  <rect x="0" y="600" width="1600" height="30" fill="#1a0e0e" opacity="0.75"/>

  <!-- Distant mill silhouette (left, outside hero safe zone center) -->
  <g opacity="0.78" fill="#1a0e0e">
    <rect x="195" y="500" width="150" height="100"/>
    <polygon points="195,500 270,440 345,500"/>
    <rect x="305" y="455" width="22" height="40"/>
  </g>

  <!-- Soft warm glow behind the cube (hero) -->
  <ellipse cx="800" cy="500" rx="520" ry="220" fill="url(#glow)"/>

  <!-- Tree masses framing (kept partly inside safe zone, partly bleeding) -->
  <g fill="url(#tree)">
    <ellipse cx="180" cy="430" rx="170" ry="200"/>
    <ellipse cx="80" cy="510" rx="160" ry="220"/>
    <ellipse cx="1480" cy="420" rx="180" ry="210"/>
    <ellipse cx="1560" cy="500" rx="150" ry="230"/>
    <ellipse cx="1320" cy="470" rx="110" ry="150"/>
  </g>

  <!-- HERO: glass cube cottage, centered ~(800,500), inside safe zone -->
  <!-- Reflection on water -->
  <rect x="640" y="620" width="320" height="120" fill="#fbbf24" opacity="0.18"/>
  <rect x="680" y="640" width="240" height="6" fill="#fbbf24" opacity="0.35"/>
  <rect x="700" y="670" width="200" height="4" fill="#d97706" opacity="0.3"/>

  <!-- Cube: front face -->
  <rect x="660" y="360" width="280" height="260" fill="url(#cubeFace)" stroke="#78350f" stroke-width="3"/>
  <!-- Cube: right side (perspective) -->
  <polygon points="940,360 1010,330 1010,590 940,620" fill="url(#cubeSide)" stroke="#78350f" stroke-width="3"/>
  <!-- Cube: roof slab -->
  <polygon points="660,360 940,360 1010,330 730,330" fill="#5c2a1a" stroke="#78350f" stroke-width="3"/>

  <!-- Mullions on front face (glazing grid) -->
  <line x1="753" y1="360" x2="753" y2="620" stroke="#78350f" stroke-width="2" opacity="0.7"/>
  <line x1="846" y1="360" x2="846" y2="620" stroke="#78350f" stroke-width="2" opacity="0.7"/>
  <line x1="660" y1="490" x2="940" y2="490" stroke="#78350f" stroke-width="2" opacity="0.7"/>

  <!-- Mullions on right face -->
  <line x1="975" y1="345" x2="975" y2="605" stroke="#78350f" stroke-width="2" opacity="0.6"/>
  <line x1="940" y1="490" x2="1010" y2="460" stroke="#78350f" stroke-width="2" opacity="0.6"/>

  <!-- Warm interior light bloom inside the cube -->
  <ellipse cx="800" cy="500" rx="90" ry="60" fill="#fbbf24" opacity="0.45"/>

  <!-- A couple of bright window panes (lit rooms) -->
  <rect x="755" y="365" width="89" height="122" fill="#fbbf24" opacity="0.25"/>
  <rect x="663" y="493" width="88" height="124" fill="#d97706" opacity="0.22"/>

  <!-- Subtle moon -->
  <circle cx="1180" cy="190" r="38" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1180" cy="190" r="60" fill="url(#glow)"/>
</svg>
