<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- lattice: existing modules -->
  <g fill="#78350f" fill-opacity="0.10" stroke="#78350f" stroke-opacity="0.35" stroke-width="3">
    <rect x="405" y="180" width="160" height="160" rx="10"/>
    <rect x="595" y="180" width="160" height="160" rx="10"/>
    <rect x="785" y="180" width="160" height="160" rx="10"/>
    <rect x="405" y="370" width="160" height="160" rx="10"/>
    <rect x="595" y="370" width="160" height="160" rx="10"/>
    <rect x="405" y="560" width="160" height="160" rx="10"/>
    <rect x="595" y="560" width="160" height="160" rx="10"/>
    <rect x="785" y="560" width="160" height="160" rx="10"/>
  </g>

  <!-- the vacant socket: shaped for the module, holding its place -->
  <rect x="785" y="370" width="160" height="160" rx="10" fill="#c2410c" fill-opacity="0.09"
        stroke="#c2410c" stroke-opacity="0.75" stroke-width="4" stroke-dasharray="18 14"/>

  <!-- two-way track between socket and module -->
  <g fill="#9a3309" fill-opacity="0.55">
    <rect x="945" y="418" width="90" height="12" rx="6"/>
    <rect x="945" y="470" width="90" height="12" rx="6"/>
  </g>

  <!-- hero: the module, slotted out and still able to slot back -->
  <rect x="1035" y="370" width="160" height="160" rx="10" fill="url(#mod)" fill-opacity="0.95"/>
  <rect x="1035" y="418" width="26" height="12" rx="6" fill="#fbbf24" fill-opacity="0.9"/>
  <rect x="1035" y="470" width="26" height="12" rx="6" fill="#fbbf24" fill-opacity="0.9"/>
  <rect x="1075" y="410" width="80" height="80" rx="6" fill="#faf8f2" fill-opacity="0.18"/>
</svg>
