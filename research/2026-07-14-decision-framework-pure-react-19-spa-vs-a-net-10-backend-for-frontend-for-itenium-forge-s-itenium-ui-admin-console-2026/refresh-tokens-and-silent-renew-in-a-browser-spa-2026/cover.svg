<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="handoff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="corner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="120" cy="820" r="360" fill="url(#corner)"/>
  <circle cx="1520" cy="80" r="320" fill="url(#corner)"/>

  <g fill="none" stroke="#78350f">
    <circle cx="800" cy="450" r="330" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="800" cy="450" r="110" stroke-opacity="0.22" stroke-width="2"/>
  </g>
  <circle cx="800" cy="450" r="120" fill="url(#core)"/>

  <circle cx="800" cy="450" r="250" fill="none" stroke="#9a3309" stroke-opacity="0.32" stroke-width="3"/>

  <path d="M 800 200 A 250 250 0 0 1 1050 450" fill="none" stroke="url(#handoff)"
        stroke-width="16" stroke-linecap="round"/>

  <circle cx="530" cy="360" r="24" fill="none" stroke="#78350f" stroke-opacity="0.32"
          stroke-width="3" stroke-dasharray="7 9"/>

  <circle cx="800" cy="200" r="96" fill="url(#halo)"/>
  <circle cx="800" cy="200" r="46" fill="url(#node)"/>
  <circle cx="800" cy="200" r="46" fill="none" stroke="#fef3ec" stroke-opacity="0.7" stroke-width="3"/>

  <circle cx="1050" cy="450" r="30" fill="#fbbf24" fill-opacity="0.9"
          stroke="#c2410c" stroke-opacity="0.85" stroke-width="4"/>
