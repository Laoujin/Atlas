<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.78" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lodge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a0c"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low setting sun glow behind lodge -->
  <circle cx="800" cy="560" r="380" fill="url(#sun)"/>

  <!-- distant pine ridge (decoration, edges may crop) -->
  <polygon points="0,640 60,600 90,625 140,580 180,615 230,575 280,610 330,585 380,605 430,575 480,600 520,585 560,605 600,590 640,608 680,595 720,610 760,600 800,612 840,600 880,610 920,595 960,608 1000,590 1040,605 1080,585 1120,600 1170,575 1220,605 1270,580 1320,615 1370,580 1420,625 1460,600 1520,615 1600,640 1600,720 0,720" fill="#1a0e0e" opacity="0.88"/>

  <!-- soft dune curve foreground -->
  <path d="M0,780 C 280,720 540,760 800,740 C 1080,720 1340,770 1600,750 L1600,900 L0,900 Z" fill="url(#dune)" opacity="0.95"/>

  <!-- hero: gabled lodge silhouette centered ~(800,470), within safe zone -->
  <g>
    <!-- main body -->
    <rect x="700" y="500" width="200" height="140" fill="url(#lodge)"/>
    <!-- gable roof -->
    <polygon points="680,500 800,400 920,500" fill="#2a1208"/>
    <!-- chimney -->
    <rect x="855" y="425" width="22" height="50" fill="#2a1208"/>
    <!-- side wing -->
    <rect x="600" y="540" width="110" height="100" fill="#2a1208" opacity="0.95"/>
    <polygon points="590,540 655,478 720,540" fill="#1a0e0e"/>
    <!-- lit windows: warm glow -->
    <circle cx="760" cy="560" r="34" fill="url(#window)"/>
    <rect x="748" y="548" width="24" height="28" fill="#fef3ec" opacity="0.95"/>
    <rect x="820" y="555" width="20" height="24" fill="#fbbf24" opacity="0.85"/>
    <circle cx="650" cy="580" r="22" fill="url(#window)" opacity="0.85"/>
    <rect x="642" y="572" width="16" height="20" fill="#fef3ec" opacity="0.9"/>
    <!-- window light spill on ground -->
    <ellipse cx="760" cy="650" rx="120" ry="14" fill="#d97706" opacity="0.35"/>
  </g>

  <!-- foreground pine accents framing the lodge (decoration) -->
  <polygon points="380,720 360,580 340,720" fill="#0d0606"/>
  <polygon points="395,720 380,610 365,720" fill="#0d0606" opacity="0.9"/>
  <polygon points="1230,720 1250,560 1270,720" fill="#0d0606"/>
  <polygon points="1210,720 1225,605 1240,720" fill="#0d0606" opacity="0.9"/>

  <!-- a few drifting embers / stars high in sky (decoration outside safe zone bottom) -->
  <circle cx="320" cy="140" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="480" cy="95" r="1.5" fill="#fef3ec" opacity="0.6"/>
  <circle cx="1180" cy="120" r="2" fill="#fbbf24" opacity="0.65"/>
  <circle cx="1340" cy="170" r="1.5" fill="#fef3ec" opacity="0.55"/>
</svg>
