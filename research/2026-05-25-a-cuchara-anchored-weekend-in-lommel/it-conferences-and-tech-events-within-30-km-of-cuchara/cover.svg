<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="ring" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.85" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.95" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle map graticule (decorative, full-bleed) -->
  <g stroke="#78350f" stroke-opacity="0.07" stroke-width="1" fill="none">
    <path d="M0 200 L1600 220"/>
    <path d="M0 380 L1600 360"/>
    <path d="M0 560 L1600 580"/>
    <path d="M0 740 L1600 720"/>
    <path d="M260 0 L240 900"/>
    <path d="M560 0 L580 900"/>
    <path d="M900 0 L880 900"/>
    <path d="M1200 0 L1220 900"/>
  </g>

  <!-- Stylised border curve (BE/NL line), decorative -->
  <path d="M120 520 Q 500 460 820 500 T 1500 470"
        stroke="#9a3309" stroke-opacity="0.18" stroke-width="2"
        stroke-dasharray="6 8" fill="none"/>

  <!-- Hero: 30 km radius circle centered on Lommel/Cuchara (~800,520) -->
  <!-- Glow under the circle -->
  <circle cx="800" cy="520" r="290" fill="url(#glow)"/>

  <!-- Filled radius disc -->
  <circle cx="800" cy="520" r="270"
          fill="#d97706" fill-opacity="0.10"
          stroke="#c2410c" stroke-opacity="0.85" stroke-width="3"/>

  <!-- Inner faint ring for depth -->
  <circle cx="800" cy="520" r="260"
          fill="none" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Eindhoven cluster (inside radius, north) -->
  <g>
    <circle cx="820" cy="320" r="14" fill="#c2410c" opacity="0.9"/>
    <circle cx="820" cy="320" r="26" fill="none" stroke="#c2410c" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="780" cy="345" r="6" fill="#9a3309" opacity="0.8"/>
    <circle cx="855" cy="350" r="5" fill="#9a3309" opacity="0.8"/>
    <circle cx="800" cy="295" r="4" fill="#d97706" opacity="0.9"/>
  </g>

  <!-- Hasselt dot (just outside radius, south-west) -->
  <circle cx="495" cy="640" r="9" fill="#78350f" opacity="0.55"/>
  <circle cx="495" cy="640" r="16" fill="none" stroke="#78350f" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Genk dot (just outside radius, south-east) -->
  <circle cx="1110" cy="660" r="9" fill="#78350f" opacity="0.55"/>
  <circle cx="1110" cy="660" r="16" fill="none" stroke="#78350f" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Center pin: Lommel / Cuchara -->
  <g>
    <ellipse cx="800" cy="540" rx="22" ry="5" fill="#78350f" opacity="0.35"/>
    <path d="M800 440
             C 770 440, 752 466, 752 492
             C 752 522, 778 540, 800 538
             C 822 540, 848 522, 848 492
             C 848 466, 830 440, 800 440 Z"
          fill="url(#pin)"/>
    <circle cx="800" cy="488" r="14" fill="#faf8f2" opacity="0.95"/>
    <circle cx="800" cy="488" r="7" fill="#c2410c"/>
  </g>
</svg>
