<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1a14"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="80%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c9b896"/>
    </radialGradient>
    <radialGradient id="plateInner" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e8dcc0"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#faf8f2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- table surface hint -->
  <ellipse cx="800" cy="820" rx="900" ry="80" fill="#000" opacity="0.35"/>

  <!-- wine glass (left of hero) -->
  <g opacity="0.92">
    <!-- bowl -->
    <path d="M 540 320 Q 540 470 640 490 Q 740 470 740 320 Z" fill="url(#wine)" opacity="0.88"/>
    <!-- bowl outline / glass shell -->
    <path d="M 530 300 Q 530 480 640 505 Q 750 480 750 300" fill="none" stroke="url(#glass)" stroke-width="3"/>
    <!-- stem -->
    <rect x="636" y="498" width="8" height="160" fill="#faf8f2" opacity="0.22"/>
    <!-- base -->
    <ellipse cx="640" cy="668" rx="70" ry="9" fill="#faf8f2" opacity="0.25"/>
  </g>

  <!-- plate (hero, centered) -->
  <g>
    <ellipse cx="980" cy="510" rx="320" ry="70" fill="#000" opacity="0.45"/>
    <circle cx="980" cy="470" r="270" fill="url(#plate)"/>
    <circle cx="980" cy="470" r="230" fill="url(#plateInner)"/>
    <circle cx="980" cy="470" r="230" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35"/>

    <!-- plated composition: a small rust quenelle + accent dots -->
    <ellipse cx="980" cy="470" rx="78" ry="40" fill="#9a3309" opacity="0.85"/>
    <ellipse cx="965" cy="458" rx="55" ry="22" fill="#c2410c" opacity="0.9"/>
    <ellipse cx="955" cy="452" rx="22" ry="8" fill="#fbbf24" opacity="0.75"/>

    <!-- garnish dots -->
    <circle cx="1080" cy="455" r="6" fill="#be185d" opacity="0.85"/>
    <circle cx="1100" cy="478" r="4" fill="#be185d" opacity="0.7"/>
    <circle cx="880" cy="490" r="5" fill="#78350f" opacity="0.8"/>
    <circle cx="865" cy="465" r="3" fill="#d97706" opacity="0.85"/>

    <!-- sauce arc -->
    <path d="M 850 510 Q 980 555 1110 505" fill="none" stroke="#78350f" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- star accent above the plate (the Michelin idea, abstracted as a warm point of light) -->
  <g opacity="0.92">
    <circle cx="980" cy="220" r="36" fill="url(#star)"/>
    <circle cx="980" cy="220" r="80" fill="#fbbf24" opacity="0.12"/>
    <circle cx="980" cy="220" r="130" fill="#d97706" opacity="0.06"/>
  </g>
</svg>
