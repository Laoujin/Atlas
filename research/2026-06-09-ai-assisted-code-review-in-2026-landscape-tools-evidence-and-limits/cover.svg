<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep rust-night to deep violet-night -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2a1228"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Hub radial glow: rust -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Violet ambient glow for orbit area -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Node gradient -->
    <radialGradient id="nodeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Hub core gradient -->
    <radialGradient id="hubCore" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Subtle diff-line bars — evoke code diff, reads as atmosphere not text -->
  <!-- Lines left of center: "old code" side, muted rust tint -->
  <rect x="160" y="210" width="520" height="6" rx="3" fill="#c2410c" opacity="0.13"/>
  <rect x="160" y="240" width="390" height="6" rx="3" fill="#c2410c" opacity="0.10"/>
  <rect x="160" y="270" width="460" height="6" rx="3" fill="#c2410c" opacity="0.08"/>
  <rect x="160" y="300" width="340" height="6" rx="3" fill="#9a3309" opacity="0.10"/>
  <rect x="160" y="330" width="500" height="6" rx="3" fill="#c2410c" opacity="0.07"/>
  <rect x="160" y="360" width="410" height="6" rx="3" fill="#c2410c" opacity="0.09"/>
  <rect x="160" y="390" width="480" height="6" rx="3" fill="#9a3309" opacity="0.08"/>
  <rect x="160" y="420" width="360" height="6" rx="3" fill="#c2410c" opacity="0.11"/>
  <rect x="160" y="540" width="430" height="6" rx="3" fill="#c2410c" opacity="0.09"/>
  <rect x="160" y="570" width="370" height="6" rx="3" fill="#9a3309" opacity="0.07"/>
  <rect x="160" y="600" width="490" height="6" rx="3" fill="#c2410c" opacity="0.08"/>
  <rect x="160" y="630" width="350" height="6" rx="3" fill="#c2410c" opacity="0.10"/>
  <rect x="160" y="660" width="440" height="6" rx="3" fill="#9a3309" opacity="0.07"/>

  <!-- Lines right of center: "new code" side, muted violet tint -->
  <rect x="920" y="210" width="520" height="6" rx="3" fill="#6d28d9" opacity="0.12"/>
  <rect x="920" y="240" width="400" height="6" rx="3" fill="#6d28d9" opacity="0.09"/>
  <rect x="920" y="270" width="470" height="6" rx="3" fill="#6d28d9" opacity="0.08"/>
  <rect x="920" y="300" width="350" height="6" rx="3" fill="#6d28d9" opacity="0.11"/>
  <rect x="920" y="330" width="510" height="6" rx="3" fill="#6d28d9" opacity="0.07"/>
  <rect x="920" y="360" width="420" height="6" rx="3" fill="#6d28d9" opacity="0.09"/>
  <rect x="920" y="390" width="490" height="6" rx="3" fill="#6d28d9" opacity="0.08"/>
  <rect x="920" y="420" width="370" height="6" rx="3" fill="#6d28d9" opacity="0.10"/>
  <rect x="920" y="540" width="440" height="6" rx="3" fill="#6d28d9" opacity="0.08"/>
  <rect x="920" y="570" width="380" height="6" rx="3" fill="#6d28d9" opacity="0.07"/>
  <rect x="920" y="600" width="500" height="6" rx="3" fill="#6d28d9" opacity="0.09"/>
  <rect x="920" y="630" width="360" height="6" rx="3" fill="#6d28d9" opacity="0.08"/>
  <rect x="920" y="660" width="450" height="6" rx="3" fill="#6d28d9" opacity="0.07"/>

  <!-- Vertical divider line suggesting a diff split view -->
  <line x1="800" y1="140" x2="800" y2="760" stroke="#d97706" stroke-width="1.5" opacity="0.18"/>

  <!-- Layer 2: Hero element — AI orbit graph centered at (800, 450) -->

  <!-- Ambient violet glow behind orbits -->
  <ellipse cx="800" cy="450" rx="420" ry="310" fill="url(#orbitGlow)"/>

  <!-- Orbit ring outer -->
  <ellipse cx="800" cy="450" rx="340" ry="230"
           fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.45"/>

  <!-- Orbit ring inner -->
  <ellipse cx="800" cy="450" rx="210" ry="145"
           fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.50"/>

  <!-- Hub ambient rust glow -->
  <ellipse cx="800" cy="450" rx="190" ry="190" fill="url(#hubGlow)"/>

  <!-- Edge lines: hub to outer nodes -->
  <line x1="800" y1="450" x2="520" y2="310" stroke="#6d28d9" stroke-width="1.8" opacity="0.55"/>
  <line x1="800" y1="450" x2="1100" y2="295" stroke="#6d28d9" stroke-width="1.8" opacity="0.55"/>
  <line x1="800" y1="450" x2="1095" y2="610" stroke="#6d28d9" stroke-width="1.8" opacity="0.55"/>
  <line x1="800" y1="450" x2="500" y2="618" stroke="#6d28d9" stroke-width="1.8" opacity="0.55"/>

  <!-- Edge lines: hub to inner nodes -->
  <line x1="800" y1="450" x2="665" y2="318" stroke="#d97706" stroke-width="1.4" opacity="0.50"/>
  <line x1="800" y1="450" x2="942" y2="322" stroke="#d97706" stroke-width="1.4" opacity="0.50"/>

  <!-- Outer orbit nodes -->
  <circle cx="520" cy="310" r="22" fill="url(#nodeGrad)" opacity="0.88"/>
  <circle cx="520" cy="310" r="30" fill="none" stroke="#6d28d9" stroke-width="1.2" opacity="0.40"/>

  <circle cx="1100" cy="295" r="22" fill="url(#nodeGrad)" opacity="0.88"/>
  <circle cx="1100" cy="295" r="30" fill="none" stroke="#6d28d9" stroke-width="1.2" opacity="0.40"/>

  <circle cx="1095" cy="610" r="22" fill="url(#nodeGrad)" opacity="0.88"/>
  <circle cx="1095" cy="610" r="30" fill="none" stroke="#6d28d9" stroke-width="1.2" opacity="0.40"/>

  <circle cx="500" cy="618" r="22" fill="url(#nodeGrad)" opacity="0.88"/>
  <circle cx="500" cy="618" r="30" fill="none" stroke="#6d28d9" stroke-width="1.2" opacity="0.40"/>

  <!-- Inner orbit nodes -->
  <circle cx="665" cy="318" r="14" fill="#fbbf24" opacity="0.80"/>
  <circle cx="942" cy="322" r="14" fill="#fbbf24" opacity="0.80"/>

  <!-- Hub core -->
  <circle cx="800" cy="450" r="68" fill="url(#hubCore)" opacity="0.95"/>
  <!-- Hub ring -->
  <circle cx="800" cy="450" r="75" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.60"/>
  <!-- Hub inner highlight -->
  <circle cx="780" cy="432" r="20" fill="#fbbf24" opacity="0.18"/>

  <!-- Layer 3: Corner decorations (outside safe zone, atmospheric only) -->
  <!-- Top-left corner wash -->
  <radialGradient id="cornerTL" cx="0%" cy="0%" r="100%">
    <stop offset="0%" stop-color="#78350f" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#cornerTL)"/>

  <!-- Bottom-right corner wash -->
  <radialGradient id="cornerBR" cx="100%" cy="100%" r="100%">
    <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>
  <rect x="1200" y="600" width="400" height="300" fill="url(#cornerBR)"/>

</svg>
