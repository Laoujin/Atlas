<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- stacked code pages (hero base) -->
  <g>
    <rect x="620" y="280" width="560" height="360" rx="14" fill="#78350f" opacity="0.55" transform="rotate(-6 900 460)"/>
    <rect x="600" y="260" width="560" height="360" rx="14" fill="#9a3309" opacity="0.7" transform="rotate(-2 880 440)"/>
    <rect x="580" y="250" width="560" height="370" rx="14" fill="url(#page)" opacity="0.95"/>
  </g>

  <!-- code lines on top page -->
  <g fill="#9a3309" opacity="0.55">
    <rect x="615" y="290" width="220" height="14" rx="7"/>
    <rect x="615" y="322" width="340" height="14" rx="7"/>
    <rect x="655" y="354" width="280" height="14" rx="7"/>
    <rect x="655" y="386" width="180" height="14" rx="7"/>
    <rect x="615" y="418" width="300" height="14" rx="7"/>
    <rect x="615" y="482" width="240" height="14" rx="7"/>
    <rect x="655" y="514" width="320" height="14" rx="7"/>
    <rect x="615" y="546" width="200" height="14" rx="7"/>
  </g>

  <!-- flagged risk line -->
  <rect x="615" y="450" width="360" height="16" rx="8" fill="#c2410c" opacity="0.9"/>

  <!-- magnifier lens hero -->
  <g>
    <circle cx="980" cy="460" r="150" fill="url(#lens)"/>
    <circle cx="980" cy="460" r="150" fill="none" stroke="#c2410c" stroke-width="20"/>
    <circle cx="980" cy="460" r="150" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.8"/>
    <rect x="1085" y="565" width="150" height="46" rx="23" fill="#9a3309" transform="rotate(45 1085 565)"/>
  </g>

  <!-- warning accent inside lens -->
  <g transform="translate(980 455)">
    <path d="M0 -52 L48 32 L-48 32 Z" fill="none" stroke="#fbbf24" stroke-width="11" stroke-linejoin="round"/>
    <rect x="-7" y="-26" width="14" height="34" rx="7" fill="#fbbf24"/>
    <circle cx="0" cy="22" r="9" fill="#fbbf24"/>
  </g>
</svg>
