<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0eadb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9a3309;stop-opacity:0.75" />
      <stop offset="100%" style="stop-color:#78350f;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#9a3309;stop-opacity:0.75" />
    </linearGradient>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.2" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Decorative accent: bottom-right corner gradient -->
  <rect x="1200" y="600" width="500" height="400" fill="url(#layerGrad1)" opacity="0.3" />

  <!-- Hero: Stacked scan layers (angled rectangles) -->
  <!-- Bottom layer (back) -->
  <g transform="translate(800, 450)">
    <rect x="-320" y="-150" width="640" height="180" fill="url(#layerGrad1)" opacity="0.7" transform="rotate(-8)" rx="8" />

    <!-- Middle layer -->
    <rect x="-300" y="-80" width="600" height="160" fill="url(#layerGrad2)" opacity="0.8" transform="rotate(4)" rx="8" />

    <!-- Top layer (hero) -->
    <rect x="-280" y="-20" width="560" height="140" fill="url(#heroGrad)" opacity="0.95" rx="8" />

    <!-- Scan line accent (vertical beam down the center) -->
    <line x1="0" y1="-150" x2="0" y2="180" stroke="#fbbf24" stroke-width="3" opacity="0.6" />

    <!-- Pulse dot (center, representing detection) -->
    <circle cx="0" cy="0" r="18" fill="url(#pulseGrad)" opacity="0.85" />
    <circle cx="0" cy="0" r="8" fill="#fbbf24" opacity="0.9" />

    <!-- Faint horizontal "scan" lines inside top layer to suggest code/analysis -->
    <line x1="-260" y1="-40" x2="260" y2="-40" stroke="#fbbf24" stroke-width="1.5" opacity="0.35" />
    <line x1="-260" y1="-10" x2="260" y2="-10" stroke="#fbbf24" stroke-width="1.5" opacity="0.3" />
    <line x1="-260" y1="20" x2="260" y2="20" stroke="#fbbf24" stroke-width="1.5" opacity="0.25" />
  </g>

  <!-- Corner accent (top-left, decorative, outside safe zone) -->
  <circle cx="200" cy="150" r="80" fill="#d97706" opacity="0.15" />
</svg>