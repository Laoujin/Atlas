<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1408"/>
    </linearGradient>

    <!-- Panel face gradient: warm rust -->
    <linearGradient id="panelBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Hero top panel gradient: brighter rust -->
    <linearGradient id="panelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Violet AI glow -->
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber accent glow on hub -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Panel edge shadow -->
    <linearGradient id="edgeShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle violet AI atmosphere glow behind hero -->
  <ellipse cx="800" cy="450" rx="580" ry="340" fill="url(#aiGlow)"/>

  <!-- Layer 2: Hero — three stacked angled panels centered at (800, 450) -->
  <!-- Panel 3 (back, darkest) — offset up-left -->
  <g transform="translate(740, 220)">
    <!-- Main face -->
    <rect x="0" y="0" width="420" height="300" rx="6" fill="url(#panelBack)" opacity="0.7"/>
    <!-- Right side depth -->
    <polygon points="420,0 460,30 460,330 420,300" fill="#2d0e06" opacity="0.8"/>
    <!-- Top face depth -->
    <polygon points="0,0 420,0 460,30 40,30" fill="#5c2a1a" opacity="0.6"/>
    <!-- Code line bars inside -->
    <rect x="18" y="40" width="200" height="7" rx="3" fill="#d97706" opacity="0.25"/>
    <rect x="18" y="58" width="270" height="7" rx="3" fill="#d97706" opacity="0.18"/>
    <rect x="18" y="76" width="160" height="7" rx="3" fill="#d97706" opacity="0.20"/>
    <rect x="18" y="110" width="240" height="7" rx="3" fill="#6d28d9" opacity="0.20"/>
    <rect x="18" y="128" width="180" height="7" rx="3" fill="#6d28d9" opacity="0.15"/>
    <rect x="18" y="160" width="210" height="7" rx="3" fill="#d97706" opacity="0.18"/>
    <rect x="18" y="178" width="140" height="7" rx="3" fill="#d97706" opacity="0.15"/>
  </g>

  <!-- Panel 2 (middle) — offset slightly -->
  <g transform="translate(770, 270)">
    <rect x="0" y="0" width="420" height="300" rx="6" fill="url(#panelBack)" opacity="0.82"/>
    <polygon points="420,0 460,30 460,330 420,300" fill="#2d0e06" opacity="0.85"/>
    <polygon points="0,0 420,0 460,30 40,30" fill="#78350f" opacity="0.65"/>
    <!-- Code line bars -->
    <rect x="18" y="40" width="240" height="7" rx="3" fill="#fbbf24" opacity="0.22"/>
    <rect x="18" y="58" width="190" height="7" rx="3" fill="#fbbf24" opacity="0.17"/>
    <rect x="18" y="76" width="300" height="7" rx="3" fill="#fbbf24" opacity="0.20"/>
    <rect x="18" y="110" width="170" height="7" rx="3" fill="#6d28d9" opacity="0.22"/>
    <rect x="18" y="128" width="260" height="7" rx="3" fill="#6d28d9" opacity="0.17"/>
    <rect x="18" y="160" width="200" height="7" rx="3" fill="#fbbf24" opacity="0.18"/>
    <rect x="18" y="178" width="150" height="7" rx="3" fill="#fbbf24" opacity="0.14"/>
  </g>

  <!-- Panel 1 (front/hero, brightest rust) -->
  <g transform="translate(800, 320)">
    <rect x="0" y="0" width="420" height="300" rx="6" fill="url(#panelTop)" opacity="0.93"/>
    <polygon points="420,0 460,30 460,330 420,300" fill="#431407" opacity="0.9"/>
    <polygon points="0,0 420,0 460,30 40,30" fill="#c2410c" opacity="0.7"/>
    <!-- Code line bars — violet accent for AI review marks -->
    <rect x="18" y="42" width="260" height="8" rx="3" fill="#fbbf24" opacity="0.30"/>
    <rect x="18" y="62" width="200" height="8" rx="3" fill="#fef3ec" opacity="0.18"/>
    <rect x="18" y="82" width="320" height="8" rx="3" fill="#fef3ec" opacity="0.15"/>
    <!-- AI review highlight: violet underline on one "line" -->
    <rect x="18" y="116" width="280" height="8" rx="3" fill="#6d28d9" opacity="0.55"/>
    <rect x="18" y="136" width="220" height="8" rx="3" fill="#6d28d9" opacity="0.35"/>
    <rect x="18" y="170" width="180" height="8" rx="3" fill="#fbbf24" opacity="0.22"/>
    <rect x="18" y="190" width="240" height="8" rx="3" fill="#fef3ec" opacity="0.14"/>
    <!-- Violet side-marker (review annotation) -->
    <rect x="0" y="110" width="6" height="42" rx="2" fill="#7c3aed" opacity="0.9"/>
  </g>

  <!-- Hub dot: amber glow at panel stack focal point -->
  <ellipse cx="800" cy="318" rx="36" ry="36" fill="url(#hubGlow)" opacity="0.85"/>
  <circle cx="800" cy="318" r="10" fill="#fbbf24" opacity="0.95"/>

  <!-- Violet orbit arc — AI connectivity suggestion -->
  <ellipse cx="800" cy="450" rx="500" ry="280" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.18"/>
  <ellipse cx="800" cy="450" rx="560" ry="320" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.10"/>

  <!-- Corner decoration (outside safe zone, atmospheric) -->
  <circle cx="100" cy="100" r="120" fill="#c2410c" opacity="0.06"/>
  <circle cx="1500" cy="800" r="160" fill="#6d28d9" opacity="0.07"/>
</svg>
