<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decorative corner wedges (croppable) -->
  <path d="M0 0 L260 0 L0 200 Z" fill="#6d28d9" opacity="0.08"/>
  <path d="M1600 900 L1340 900 L1600 700 Z" fill="#c2410c" opacity="0.10"/>

  <!-- HERO: gauge dial centered ~ (700,470) -->
  <!-- track -->
  <path d="M460 560 A240 240 0 0 1 940 560" fill="none" stroke="#e3dccb" stroke-width="40" stroke-linecap="round"/>
  <!-- value arc (reading ~0.72 of sweep) -->
  <path d="M460 560 A240 240 0 0 1 901 442" fill="none" stroke="url(#arc)" stroke-width="40" stroke-linecap="round" opacity="0.92"/>
  <!-- tick marks -->
  <g stroke="#78350f" stroke-width="5" opacity="0.55" stroke-linecap="round">
    <line x1="470" y1="525" x2="500" y2="513"/>
    <line x1="560" y1="385" x2="582" y2="408"/>
    <line x1="700" y1="320" x2="700" y2="352"/>
    <line x1="840" y1="385" x2="818" y2="408"/>
    <line x1="930" y1="525" x2="900" y2="513"/>
  </g>
  <!-- needle -->
  <line x1="700" y1="560" x2="848" y2="438" stroke="#9a3309" stroke-width="11" stroke-linecap="round"/>
  <circle cx="700" cy="560" r="26" fill="#c2410c"/>
  <circle cx="700" cy="560" r="11" fill="#fbbf24"/>

  <!-- rubric scorecard bars (the benchmark spread) -->
  <g>
    <rect x="1010" y="620" width="70" height="110" rx="8" fill="url(#bar)" opacity="0.92"/>
    <rect x="1100" y="500" width="70" height="230" rx="8" fill="url(#bar)" opacity="0.92"/>
    <rect x="1190" y="420" width="70" height="310" rx="8" fill="url(#bar)" opacity="0.92"/>
    <rect x="1280" y="560" width="70" height="170" rx="8" fill="#6d28d9" opacity="0.80"/>
    <line x1="990" y1="730" x2="1370" y2="730" stroke="#78350f" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- checkmark accent (signal vs noise) -->
  <path d="M1205 250 l40 44 l86 -104" fill="none" stroke="#c2410c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
