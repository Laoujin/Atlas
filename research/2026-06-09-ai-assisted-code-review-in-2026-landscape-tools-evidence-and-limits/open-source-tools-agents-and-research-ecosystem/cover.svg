<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="hub" cx="40%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="430" fill="url(#glow)"/>

  <!-- orbit rings -->
  <circle cx="800" cy="450" r="210" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.35"/>
  <circle cx="800" cy="450" r="320" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.22"/>

  <!-- edges -->
  <g stroke-linecap="round" fill="none">
    <path d="M800 450 L560 300" stroke="#9a3309" stroke-width="6" stroke-opacity="0.75"/>
    <path d="M800 450 L1060 290" stroke="#9a3309" stroke-width="6" stroke-opacity="0.75"/>
    <path d="M800 450 L520 560" stroke="#6d28d9" stroke-width="6" stroke-opacity="0.65"/>
    <path d="M800 450 L1090 590" stroke="#9a3309" stroke-width="6" stroke-opacity="0.75"/>
    <path d="M800 450 L800 660" stroke="#6d28d9" stroke-width="6" stroke-opacity="0.65"/>
    <path d="M560 300 L1060 290" stroke="#c2410c" stroke-width="3" stroke-opacity="0.3"/>
    <path d="M520 560 L800 660" stroke="#c2410c" stroke-width="3" stroke-opacity="0.3"/>
    <path d="M1090 590 L800 660" stroke="#c2410c" stroke-width="3" stroke-opacity="0.3"/>
  </g>

  <!-- satellite nodes -->
  <circle cx="560" cy="300" r="46" fill="#c2410c" fill-opacity="0.92"/>
  <circle cx="1060" cy="290" r="52" fill="#d97706" fill-opacity="0.92"/>
  <circle cx="520" cy="560" r="48" fill="url(#vio)" fill-opacity="0.9"/>
  <circle cx="1090" cy="590" r="44" fill="#9a3309" fill-opacity="0.92"/>
  <circle cx="800" cy="660" r="50" fill="url(#vio)" fill-opacity="0.9"/>

  <!-- hero hub -->
  <circle cx="800" cy="450" r="118" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="118" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.55"/>
  <circle cx="800" cy="450" r="60" fill="#1a0e0e" fill-opacity="0.15"/>
  <circle cx="772" cy="424" r="20" fill="#fef3ec" fill-opacity="0.5"/>
</svg>
