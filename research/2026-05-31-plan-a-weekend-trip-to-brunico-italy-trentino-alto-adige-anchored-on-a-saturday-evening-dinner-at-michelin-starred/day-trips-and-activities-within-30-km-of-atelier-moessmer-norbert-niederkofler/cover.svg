<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="peakMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="#faf8f2"/>
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind peaks -->
  <circle cx="980" cy="430" r="220" fill="url(#sun)"/>
  <circle cx="980" cy="430" r="58" fill="#fbbf24" opacity="0.85"/>

  <!-- Far ridge -->
  <path d="M 80 620 L 240 480 L 360 560 L 500 430 L 640 540 L 780 410 L 920 520 L 1080 440 L 1240 540 L 1380 460 L 1520 560 L 1520 720 L 80 720 Z" fill="url(#peakFar)" opacity="0.75"/>

  <!-- Mid jagged Dolomite peaks (hero) -->
  <path d="M 200 700 L 360 380 L 460 520 L 560 320 L 690 540 L 800 220 L 920 500 L 1040 350 L 1180 540 L 1300 400 L 1420 700 Z" fill="url(#peakMid)" opacity="0.92"/>

  <!-- Snow caps on hero peaks -->
  <path d="M 560 320 L 600 380 L 580 400 L 540 360 Z" fill="#faf8f2" opacity="0.85"/>
  <path d="M 800 220 L 850 310 L 820 330 L 770 270 Z" fill="#faf8f2" opacity="0.9"/>
  <path d="M 1040 350 L 1080 415 L 1055 430 L 1015 380 Z" fill="#faf8f2" opacity="0.8"/>

  <!-- Near rounded foothill (Plan de Corones shape) -->
  <path d="M 0 760 Q 300 640 700 720 Q 1100 800 1600 700 L 1600 900 L 0 900 Z" fill="url(#peakNear)"/>

  <!-- Alpine lake -->
  <ellipse cx="800" cy="800" rx="520" ry="48" fill="url(#lake)" opacity="0.85"/>

  <!-- Lake reflection of sun -->
  <ellipse cx="980" cy="795" rx="55" ry="6" fill="#fbbf24" opacity="0.55"/>

  <!-- Tiny rowboat silhouette -->
  <path d="M 640 790 Q 680 800 720 790 L 712 798 Q 680 805 648 798 Z" fill="#1a0e0e" opacity="0.9"/>
  <line x1="680" y1="790" x2="680" y2="778" stroke="#1a0e0e" stroke-width="1.5" opacity="0.8"/>
</svg>
