<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="peakMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.38" r="0.18">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- warm sun glow -->
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- far slate peaks (jagged Dolomites) -->
  <path d="M0,520 L140,380 L240,440 L360,300 L470,400 L560,340 L690,260 L820,360 L940,290 L1060,380 L1180,310 L1320,400 L1450,340 L1600,420 L1600,560 L0,560 Z"
        fill="url(#peakFar)"/>

  <!-- snow caps on far peaks (small slate-white highlights) -->
  <path d="M340,310 L360,300 L380,316 L370,322 Z" fill="#e2e8f0" opacity="0.75"/>
  <path d="M680,272 L690,260 L710,278 L700,284 Z" fill="#e2e8f0" opacity="0.75"/>
  <path d="M930,300 L940,290 L958,306 L948,312 Z" fill="#e2e8f0" opacity="0.7"/>
  <path d="M1170,322 L1180,310 L1198,328 L1188,334 Z" fill="#e2e8f0" opacity="0.7"/>

  <!-- mid rust ridges -->
  <path d="M0,640 L120,560 L260,610 L400,530 L540,600 L680,540 L820,620 L960,550 L1100,610 L1240,560 L1380,620 L1520,580 L1600,610 L1600,720 L0,720 Z"
        fill="url(#peakMid)" opacity="0.9"/>

  <!-- forested valley floor -->
  <path d="M0,700 L1600,700 L1600,900 L0,900 Z" fill="url(#valley)"/>

  <!-- tree silhouettes scattered on valley -->
  <g fill="#1a0e0e" opacity="0.85">
    <polygon points="120,710 130,690 140,710"/>
    <polygon points="200,712 212,688 224,712"/>
    <polygon points="280,710 290,694 300,710"/>
    <polygon points="1180,712 1192,690 1204,712"/>
    <polygon points="1280,710 1290,694 1300,710"/>
    <polygon points="1360,712 1372,688 1384,712"/>
    <polygon points="1460,710 1470,694 1480,710"/>
  </g>

  <!-- HERO: stone-walled inn / castle silhouette, centered around x=800, sits on valley line -->
  <g>
    <!-- main body -->
    <rect x="700" y="560" width="200" height="160" fill="url(#castle)"/>
    <!-- left tower (taller) -->
    <rect x="660" y="500" width="70" height="220" fill="url(#castle)"/>
    <!-- right tower (shorter) -->
    <rect x="880" y="540" width="55" height="180" fill="url(#castle)"/>
    <!-- crenellations on left tower -->
    <rect x="660" y="490" width="14" height="14" fill="#5c2a1a"/>
    <rect x="688" y="490" width="14" height="14" fill="#5c2a1a"/>
    <rect x="716" y="490" width="14" height="14" fill="#5c2a1a"/>
    <!-- crenellations on right tower -->
    <rect x="880" y="530" width="12" height="12" fill="#5c2a1a"/>
    <rect x="903" y="530" width="12" height="12" fill="#5c2a1a"/>
    <rect x="923" y="530" width="12" height="12" fill="#5c2a1a"/>
    <!-- pitched roof on main body -->
    <polygon points="690,560 800,500 910,560" fill="#5c2a1a"/>
    <!-- warm lit windows (small) -->
    <rect x="685" y="560" width="10" height="16" fill="#fbbf24" opacity="0.9"/>
    <rect x="705" y="560" width="10" height="16" fill="#fbbf24" opacity="0.9"/>
    <rect x="745" y="600" width="12" height="20" fill="#fbbf24" opacity="0.95"/>
    <rect x="775" y="600" width="12" height="20" fill="#fbbf24" opacity="0.95"/>
    <rect x="805" y="600" width="12" height="20" fill="#fbbf24" opacity="0.95"/>
    <rect x="835" y="600" width="12" height="20" fill="#fbbf24" opacity="0.95"/>
    <rect x="895" y="580" width="10" height="14" fill="#fbbf24" opacity="0.9"/>
    <rect x="912" y="580" width="10" height="14" fill="#fbbf24" opacity="0.9"/>
    <!-- arched door -->
    <path d="M790,720 L790,690 Q800,675 810,690 L810,720 Z" fill="#1a0e0e"/>
    <!-- flag on left tower -->
    <rect x="694" y="460" width="2" height="32" fill="#1a0e0e"/>
    <polygon points="696,462 712,468 696,476" fill="#c2410c"/>
  </g>

  <!-- foreground hill shadow grounding the castle -->
  <path d="M0,720 Q400,700 800,720 Q1200,740 1600,720 L1600,760 L0,760 Z" fill="#1a0e0e" opacity="0.6"/>
</svg>
