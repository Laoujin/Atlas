<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lake" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.04"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- subtle warm glow centred on hub -->
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- stylised lake shape behind the radius (irregular blob suggesting Lake Orta) -->
  <path d="M 720 220 C 820 200, 880 240, 900 340 C 920 440, 905 540, 870 620 C 840 690, 780 720, 730 695 C 670 665, 645 580, 660 470 C 670 380, 680 280, 720 220 Z"
        fill="url(#lake)" opacity="0.9"/>

  <!-- concentric radius rings (30km radius metaphor) -->
  <circle cx="800" cy="450" r="120" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <circle cx="800" cy="450" r="220" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
  <circle cx="800" cy="450" r="320" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.7"/>

  <!-- crosshair tick marks on outer ring (cardinal) -->
  <line x1="800" y1="118" x2="800" y2="142" stroke="#9a3309" stroke-width="2" opacity="0.7"/>
  <line x1="800" y1="758" x2="800" y2="782" stroke="#9a3309" stroke-width="2" opacity="0.7"/>
  <line x1="468" y1="450" x2="492" y2="450" stroke="#9a3309" stroke-width="2" opacity="0.7"/>
  <line x1="1108" y1="450" x2="1132" y2="450" stroke="#9a3309" stroke-width="2" opacity="0.7"/>

  <!-- sparse event dots within the radius (only 3 — the thin scene) -->
  <!-- Stresa (Ambrosetti) — SW of hub -->
  <circle cx="640" cy="560" r="14" fill="#c2410c" opacity="0.9"/>
  <circle cx="640" cy="560" r="26" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.5"/>

  <!-- Baveno (AUSED) — W of hub -->
  <circle cx="590" cy="430" r="14" fill="#d97706" opacity="0.9"/>
  <circle cx="590" cy="430" r="26" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>

  <!-- Verbania (TEDx) — NW of hub -->
  <circle cx="680" cy="280" r="14" fill="#c2410c" opacity="0.9"/>
  <circle cx="680" cy="280" r="26" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.5"/>

  <!-- hero: central hub (Villa Crespi) — outer halo + solid core -->
  <circle cx="800" cy="450" r="48" fill="#fbbf24" opacity="0.35"/>
  <circle cx="800" cy="450" r="32" fill="#9a3309" opacity="0.95"/>
  <circle cx="800" cy="450" r="14" fill="#fef3ec" opacity="0.9"/>

  <!-- thin connector lines from hub to each event dot -->
  <line x1="800" y1="450" x2="640" y2="560" stroke="#78350f" stroke-width="1.2" opacity="0.45" stroke-dasharray="3 5"/>
  <line x1="800" y1="450" x2="590" y2="430" stroke="#78350f" stroke-width="1.2" opacity="0.45" stroke-dasharray="3 5"/>
  <line x1="800" y1="450" x2="680" y2="280" stroke="#78350f" stroke-width="1.2" opacity="0.45" stroke-dasharray="3 5"/>
</svg>
