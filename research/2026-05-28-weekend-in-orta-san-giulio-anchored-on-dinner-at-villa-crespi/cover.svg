<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#0e0808"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed nocturnal sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon accent (decoration, upper safe zone) -->
  <circle cx="1240" cy="200" r="42" fill="#fef3ec" opacity="0.85"/>
  <circle cx="1240" cy="200" r="78" fill="#fbbf24" opacity="0.15"/>

  <!-- Distant far shore (decoration) -->
  <path d="M0 540 L260 510 L520 525 L820 500 L1120 520 L1380 505 L1600 515 L1600 560 L0 560 Z" fill="#3a1a12" opacity="0.7"/>

  <!-- Water plane -->
  <rect x="0" y="555" width="1600" height="345" fill="url(#water)"/>

  <!-- Warm glow on water (Villa Crespi side) -->
  <ellipse cx="800" cy="600" rx="620" ry="180" fill="url(#glow)"/>

  <!-- HERO: Isola San Giulio silhouette, centered ~ (800, 450), inside safe zone -->
  <!-- Island landmass -->
  <path d="M560 580 Q600 555 680 552 Q780 545 880 548 Q980 552 1040 558 Q1060 562 1055 580 Z" fill="url(#island)" opacity="0.95"/>

  <!-- Basilica & monastery cluster (rising from island) -->
  <!-- Main basilica body -->
  <rect x="740" y="470" width="120" height="85" fill="#1a0e0e"/>
  <!-- Basilica nave roof -->
  <polygon points="740,470 800,430 860,470" fill="#1a0e0e"/>
  <!-- Bell tower (the distinctive feature) -->
  <rect x="810" y="380" width="34" height="90" fill="#1a0e0e"/>
  <polygon points="810,380 827,355 844,380" fill="#1a0e0e"/>
  <!-- Tiny illuminated window on tower -->
  <rect x="822" y="410" width="8" height="12" fill="#fbbf24" opacity="0.9"/>
  <rect x="822" y="438" width="8" height="12" fill="#fbbf24" opacity="0.75"/>

  <!-- Secondary monastery buildings -->
  <rect x="660" y="500" width="70" height="55" fill="#1a0e0e"/>
  <polygon points="660,500 695,478 730,500" fill="#1a0e0e"/>
  <rect x="870" y="495" width="90" height="60" fill="#1a0e0e"/>
  <polygon points="870,495 915,470 960,495" fill="#1a0e0e"/>

  <!-- A few warm windows (rose accent — restraint) -->
  <rect x="678" y="520" width="6" height="9" fill="#be185d" opacity="0.85"/>
  <rect x="695" y="520" width="6" height="9" fill="#fbbf24" opacity="0.8"/>
  <rect x="888" y="515" width="6" height="9" fill="#fbbf24" opacity="0.85"/>
  <rect x="905" y="515" width="6" height="9" fill="#be185d" opacity="0.7"/>
  <rect x="925" y="515" width="6" height="9" fill="#fbbf24" opacity="0.8"/>
  <rect x="760" y="500" width="7" height="11" fill="#fbbf24" opacity="0.9"/>
  <rect x="778" y="500" width="7" height="11" fill="#fbbf24" opacity="0.75"/>
  <rect x="800" y="500" width="7" height="11" fill="#be185d" opacity="0.8"/>
  <rect x="822" y="500" width="7" height="11" fill="#fbbf24" opacity="0.85"/>

  <!-- Reflection in the water -->
  <g opacity="0.45" transform="translate(0,1170) scale(1,-1)">
    <rect x="740" y="470" width="120" height="85" fill="url(#reflect)"/>
    <rect x="810" y="380" width="34" height="90" fill="url(#reflect)"/>
    <rect x="660" y="500" width="70" height="55" fill="url(#reflect)"/>
    <rect x="870" y="495" width="90" height="60" fill="url(#reflect)"/>
  </g>

  <!-- Shimmer streaks on water (horizontal) -->
  <rect x="500" y="640" width="600" height="2" fill="#fbbf24" opacity="0.35"/>
  <rect x="580" y="675" width="440" height="2" fill="#d97706" opacity="0.3"/>
  <rect x="640" y="710" width="320" height="2" fill="#fbbf24" opacity="0.25"/>
  <rect x="700" y="745" width="200" height="1.5" fill="#be185d" opacity="0.25"/>

  <!-- Subtle foreground water edge (decoration, outside safe zone) -->
  <rect x="0" y="860" width="1600" height="40" fill="#0a0505" opacity="0.6"/>
</svg>
