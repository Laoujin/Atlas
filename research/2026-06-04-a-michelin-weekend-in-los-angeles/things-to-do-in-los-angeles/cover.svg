<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- hero: setting sun -->
  <circle cx="800" cy="430" r="190" fill="url(#sun)" opacity="0.95"/>
  <circle cx="800" cy="430" r="240" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.45"/>

  <!-- distant ridge -->
  <path d="M125 560 Q500 470 850 540 T1475 510 L1475 810 L125 810 Z" fill="#c2410c" opacity="0.7"/>

  <!-- near hills -->
  <path d="M125 660 Q420 580 760 650 Q1100 720 1475 620 L1475 810 L125 810 Z" fill="url(#hill)" opacity="0.92"/>

  <!-- palm silhouette accent on the near hill -->
  <g fill="#5c2a1a" opacity="0.85">
    <rect x="1186" y="600" width="10" height="100"/>
    <path d="M1191 600 Q1130 580 1100 595 Q1140 600 1191 612 Z"/>
    <path d="M1191 600 Q1252 580 1282 595 Q1242 600 1191 612 Z"/>
    <path d="M1191 600 Q1160 548 1135 540 Q1175 560 1191 605 Z"/>
    <path d="M1191 600 Q1222 548 1247 540 Q1207 560 1191 605 Z"/>
  </g>
</svg>
