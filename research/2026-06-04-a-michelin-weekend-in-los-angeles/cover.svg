<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal warm -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1206"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central table-glow radial -->
    <radialGradient id="glow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill gradient -->
    <radialGradient id="plate1fill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0.06"/>
    </radialGradient>
    <radialGradient id="plate2fill" cx="60%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fef3ec" stop-opacity="0.04"/>
    </radialGradient>
    <!-- Wine glass stem gradient -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Star/highlight accent -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Warm ambient glow from table area -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centered around (800, 470), safe zone x:125-1475, y:90-810 -->

  <!-- Wine glass: bowl (ellipse), stem (rect), base (ellipse), all centered at x=800 -->
  <!-- Bowl top y~165, base y~690 — fits within safe zone -->

  <!-- Glass bowl outline -->
  <ellipse cx="800" cy="330" rx="105" ry="130" fill="url(#glassFill)" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Wine liquid inside bowl -->
  <ellipse cx="800" cy="395" rx="88" ry="65" fill="#9a3309" fill-opacity="0.62"/>
  <!-- Bowl highlight sheen -->
  <ellipse cx="770" cy="290" rx="28" ry="42" fill="#fbbf24" fill-opacity="0.10"/>

  <!-- Stem -->
  <rect x="791" y="458" width="18" height="155" rx="5" fill="url(#glassFill)" opacity="0.75"/>

  <!-- Base of glass -->
  <ellipse cx="800" cy="622" rx="72" ry="14" fill="#c2410c" fill-opacity="0.50" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Plate 1 (left, slightly behind) -->
  <ellipse cx="640" cy="710" rx="170" ry="38" fill="url(#plate1fill)" stroke="#faf8f2" stroke-width="2" stroke-opacity="0.22"/>
  <!-- Plate 1 inner rim -->
  <ellipse cx="640" cy="710" rx="140" ry="31" fill="none" stroke="#faf8f2" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Plate 2 (right, slightly behind) -->
  <ellipse cx="960" cy="710" rx="170" ry="38" fill="url(#plate2fill)" stroke="#fef3ec" stroke-width="2" stroke-opacity="0.20"/>
  <!-- Plate 2 inner rim -->
  <ellipse cx="960" cy="710" rx="140" ry="31" fill="none" stroke="#fef3ec" stroke-width="1" stroke-opacity="0.10"/>

  <!-- Michelin-star accent: small 6-pointed star above glass -->
  <!-- Rendered as two overlapping triangles at low opacity — decorative, not a letter -->
  <polygon points="800,148 812,172 840,172 818,188 826,212 800,196 774,212 782,188 760,172 788,172"
           fill="url(#starGlow)" opacity="0.82"/>

  <!-- Layer 3: Edge decoration (outside safe zone — full bleed atmosphere) -->
  <!-- Faint warm arc upper-left corner -->
  <path d="M0,0 Q260,180 0,420" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.12"/>
  <!-- Faint warm arc lower-right corner -->
  <path d="M1600,900 Q1340,720 1600,480" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.12"/>
  <!-- Subtle vignette overlay: dark edges reinforce depth -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.60"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
