<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cabinFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cabinSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky/background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm halo behind the cabin -->
  <ellipse cx="800" cy="470" rx="720" ry="360" fill="url(#glow)"/>

  <!-- Distant manor silhouette (decoration, partly outside safe zone vertically is fine) -->
  <g opacity="0.45" fill="#1a0e0e">
    <rect x="180" y="430" width="220" height="90"/>
    <polygon points="180,430 290,380 400,430"/>
    <rect x="240" y="395" width="22" height="35"/>
    <rect x="1240" y="440" width="180" height="80"/>
    <polygon points="1240,440 1330,395 1420,440"/>
    <rect x="1350" y="410" width="18" height="30"/>
  </g>

  <!-- Lake band -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#lake)"/>

  <!-- Lake reflection ripples -->
  <g stroke="#fbbf24" stroke-opacity="0.18" stroke-width="2" fill="none">
    <line x1="640" y1="660" x2="960" y2="660"/>
    <line x1="690" y1="690" x2="910" y2="690"/>
    <line x1="720" y1="720" x2="880" y2="720"/>
    <line x1="660" y1="750" x2="940" y2="750"/>
  </g>

  <!-- Hero: isometric Koto-style timber garden cabin, centered ~(800, 450) -->
  <g>
    <!-- Cabin shadow on ground -->
    <ellipse cx="800" cy="615" rx="280" ry="22" fill="#1a0e0e" opacity="0.55"/>

    <!-- Side wall (right) -->
    <polygon points="900,420 1060,470 1060,605 900,580" fill="url(#cabinSide)" opacity="0.92"/>

    <!-- Front wall (the Koto pitched gable) -->
    <polygon points="540,470 900,420 900,580 540,605" fill="url(#cabinFront)" opacity="0.95"/>

    <!-- Steep pitched roof front face -->
    <polygon points="540,470 720,330 900,420" fill="#78350f" opacity="0.95"/>
    <!-- Roof side face -->
    <polygon points="900,420 720,330 880,360 1060,470" fill="#5c2a1a" opacity="0.95"/>

    <!-- Tall front window (warm-lit) - signature Koto feature -->
    <polygon points="680,490 820,470 820,580 680,580" fill="url(#window)" opacity="0.9"/>
    <!-- Window mullion -->
    <line x1="750" y1="480" x2="750" y2="580" stroke="#9a3309" stroke-width="3" opacity="0.7"/>
    <line x1="680" y1="525" x2="820" y2="518" stroke="#9a3309" stroke-width="2" opacity="0.6"/>

    <!-- Vertical timber cladding lines on front -->
    <g stroke="#1a0e0e" stroke-opacity="0.25" stroke-width="1">
      <line x1="580" y1="464" x2="580" y2="600"/>
      <line x1="610" y1="460" x2="610" y2="598"/>
      <line x1="640" y1="455" x2="640" y2="595"/>
      <line x1="850" y1="427" x2="850" y2="583"/>
      <line x1="875" y1="423" x2="875" y2="582"/>
    </g>
    <!-- Vertical timber cladding lines on side -->
    <g stroke="#1a0e0e" stroke-opacity="0.28" stroke-width="1">
      <line x1="930" y1="430" x2="930" y2="586"/>
      <line x1="970" y1="442" x2="970" y2="592"/>
      <line x1="1010" y1="455" x2="1010" y2="599"/>
    </g>

    <!-- Small window on side -->
    <polygon points="950,490 1000,506 1000,545 950,535" fill="url(#window)" opacity="0.75"/>

    <!-- Reflection in lake -->
    <g opacity="0.35">
      <polygon points="540,605 900,605 900,665 540,650" fill="#9a3309"/>
      <polygon points="680,605 820,605 820,665 680,660" fill="#fbbf24" opacity="0.7"/>
    </g>
  </g>

  <!-- Few warm dots: lanterns / fireflies -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="430" cy="540" r="3"/>
    <circle cx="1180" cy="520" r="3"/>
    <circle cx="1280" cy="560" r="2.5"/>
    <circle cx="380" cy="580" r="2"/>
  </g>
</svg>
