<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun, sits inside hero safe zone -->
  <circle cx="800" cy="470" r="170" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="470" r="78" fill="#fbbf24" opacity="0.85"/>

  <!-- water band reflecting the sun -->
  <rect x="0" y="540" width="1600" height="90" fill="url(#water)" opacity="0.7"/>
  <ellipse cx="800" cy="555" rx="220" ry="10" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="585" rx="160" ry="6" fill="#fbbf24" opacity="0.4"/>
  <ellipse cx="800" cy="610" rx="100" ry="4" fill="#fbbf24" opacity="0.3"/>

  <!-- distant dune ridge -->
  <path d="M0,560 Q220,520 420,545 T820,535 T1240,545 T1600,530 L1600,640 L0,640 Z" fill="#c2410c" opacity="0.45"/>

  <!-- foreground dune / beach -->
  <path d="M0,640 Q260,605 520,625 T1080,620 T1600,610 L1600,900 L0,900 Z" fill="url(#sand)"/>
  <path d="M0,720 Q380,690 740,710 T1340,705 T1600,695 L1600,900 L0,900 Z" fill="url(#dune)" opacity="0.85"/>

  <!-- Gormley-esque iron-men silhouettes along the tideline, inside safe zone -->
  <g fill="#1a0e0e" opacity="0.85">
    <!-- figure 1 -->
    <circle cx="430" cy="612" r="6"/>
    <rect x="427" y="618" width="6" height="26" rx="2"/>
    <rect x="425" y="644" width="4" height="22"/>
    <rect x="431" y="644" width="4" height="22"/>
    <!-- figure 2 (closer, larger) -->
    <circle cx="620" cy="628" r="8"/>
    <rect x="616" y="636" width="8" height="34" rx="2"/>
    <rect x="613" y="670" width="5" height="28"/>
    <rect x="622" y="670" width="5" height="28"/>
    <!-- figure 3 (hero-adjacent, slightly tilted) -->
    <circle cx="970" cy="622" r="7"/>
    <rect x="966" y="629" width="8" height="30" rx="2"/>
    <rect x="964" y="659" width="4" height="26"/>
    <rect x="972" y="659" width="4" height="26"/>
    <!-- figure 4 (far right, small) -->
    <circle cx="1180" cy="608" r="5"/>
    <rect x="1178" y="613" width="5" height="22" rx="2"/>
    <rect x="1176" y="635" width="3" height="18"/>
    <rect x="1182" y="635" width="3" height="18"/>
  </g>

  <!-- Formby pines on the right, breaking the horizon -->
  <g fill="#1a0e0e" opacity="0.9">
    <rect x="1338" y="500" width="6" height="180"/>
    <path d="M1341,420 L1310,510 L1372,510 Z"/>
    <path d="M1341,460 L1300,540 L1382,540 Z"/>
    <path d="M1341,500 L1295,580 L1387,580 Z"/>

    <rect x="1416" y="540" width="5" height="140"/>
    <path d="M1418,470 L1394,545 L1442,545 Z"/>
    <path d="M1418,510 L1388,575 L1448,575 Z"/>
    <path d="M1418,545 L1384,610 L1452,610 Z"/>
  </g>

  <!-- a single pine on the left for balance -->
  <g fill="#1a0e0e" opacity="0.85">
    <rect x="206" y="560" width="5" height="120"/>
    <path d="M208,500 L182,565 L234,565 Z"/>
    <path d="M208,535 L178,595 L238,595 Z"/>
    <path d="M208,565 L174,625 L242,625 Z"/>
  </g>

  <!-- a few wetland birds drifting across the sky, inside safe zone -->
  <g fill="none" stroke="#78350f" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <path d="M540,260 q10,-10 20,0 q10,-10 20,0"/>
    <path d="M700,220 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M1050,250 q9,-9 18,0 q9,-9 18,0"/>
    <path d="M1160,300 q7,-7 14,0 q7,-7 14,0"/>
  </g>
</svg>
