<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a140e"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="75%" stop-color="#d8cdb4"/>
      <stop offset="100%" stop-color="#8a7858"/>
    </radialGradient>
    <radialGradient id="plateInner" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="80%" stop-color="#e8dcc2"/>
      <stop offset="100%" stop-color="#b5a384"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm ambient glow -->
  <circle cx="800" cy="500" r="520" fill="url(#glow)"/>

  <!-- Plate (hero, centered ~800,520) -->
  <ellipse cx="800" cy="540" rx="340" ry="80" fill="#000" opacity="0.35"/>
  <circle cx="800" cy="500" r="270" fill="url(#plate)" opacity="0.95"/>
  <circle cx="800" cy="500" r="232" fill="url(#plateInner)" opacity="0.9"/>
  <circle cx="800" cy="500" r="232" fill="none" stroke="#8a7858" stroke-width="1.2" opacity="0.55"/>

  <!-- Tiny culinary accent: a single rose-tinted droplet centered on plate -->
  <circle cx="800" cy="510" r="14" fill="#be185d" opacity="0.85"/>
  <circle cx="794" cy="504" r="4" fill="#fef3ec" opacity="0.7"/>

  <!-- Michelin star anchor above plate (within safe zone) -->
  <circle cx="800" cy="230" r="95" fill="url(#starHalo)"/>
  <path d="M 800 150 L 818 208 L 878 208 L 829 243 L 848 300 L 800 265 L 752 300 L 771 243 L 722 208 L 782 208 Z"
        fill="url(#star)" opacity="0.95"/>
  <path d="M 800 150 L 818 208 L 878 208 L 829 243 L 848 300 L 800 265 L 752 300 L 771 243 L 722 208 L 782 208 Z"
        fill="none" stroke="#9a3309" stroke-width="1.2" opacity="0.6"/>

  <!-- Subtle horizon hint (West Lancashire flatland) — decorative, full-bleed bottom -->
  <rect x="0" y="820" width="1600" height="80" fill="#78350f" opacity="0.35"/>
  <rect x="0" y="855" width="1600" height="45" fill="#1a0e0e" opacity="0.6"/>
</svg>
