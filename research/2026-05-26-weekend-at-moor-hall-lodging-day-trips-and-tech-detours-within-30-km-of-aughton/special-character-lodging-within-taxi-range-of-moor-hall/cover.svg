<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1c12"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow behind house -->
  <ellipse cx="800" cy="620" rx="720" ry="280" fill="url(#sun)" opacity="0.85"/>

  <!-- Distant rolling hills (decoration, edges may crop) -->
  <path d="M 0 640 Q 220 580 440 615 T 880 605 T 1320 600 T 1600 615 L 1600 700 L 0 700 Z" fill="#4a2218" opacity="0.7"/>
  <path d="M 0 680 Q 280 640 560 665 T 1100 660 T 1600 670 L 1600 760 L 0 760 Z" fill="#3a1c12" opacity="0.8"/>

  <!-- Country house hero, centered ~ (800, 470), well inside safe zone -->
  <g opacity="0.95">
    <!-- Left wing -->
    <rect x="470" y="490" width="180" height="200" fill="url(#house)"/>
    <polygon points="470,490 560,420 650,490" fill="#1a0e0e"/>

    <!-- Main central block -->
    <rect x="640" y="430" width="320" height="260" fill="url(#house)"/>
    <polygon points="640,430 800,330 960,430" fill="#1a0e0e"/>

    <!-- Right wing -->
    <rect x="950" y="490" width="180" height="200" fill="url(#house)"/>
    <polygon points="950,490 1040,420 1130,490" fill="#1a0e0e"/>

    <!-- Chimneys -->
    <rect x="700" y="350" width="30" height="60" fill="#1a0e0e"/>
    <rect x="870" y="350" width="30" height="60" fill="#1a0e0e"/>
    <rect x="560" y="450" width="22" height="40" fill="#1a0e0e"/>
    <rect x="1038" y="450" width="22" height="40" fill="#1a0e0e"/>

    <!-- Lit windows: main block, upper row -->
    <rect x="680" y="475" width="36" height="50" fill="url(#window)"/>
    <rect x="752" y="475" width="36" height="50" fill="url(#window)"/>
    <rect x="812" y="475" width="36" height="50" fill="url(#window)"/>
    <rect x="884" y="475" width="36" height="50" fill="url(#window)"/>

    <!-- Lit windows: main block, lower row -->
    <rect x="680" y="565" width="36" height="60" fill="url(#window)"/>
    <rect x="752" y="565" width="36" height="60" fill="url(#window)" opacity="0.7"/>
    <rect x="812" y="565" width="36" height="60" fill="url(#window)"/>
    <rect x="884" y="565" width="36" height="60" fill="url(#window)" opacity="0.7"/>

    <!-- Central door -->
    <rect x="785" y="600" width="30" height="90" fill="url(#window)" opacity="0.9"/>

    <!-- Wing windows -->
    <rect x="510" y="540" width="28" height="40" fill="url(#window)" opacity="0.85"/>
    <rect x="580" y="540" width="28" height="40" fill="url(#window)" opacity="0.6"/>
    <rect x="510" y="610" width="28" height="40" fill="url(#window)" opacity="0.7"/>
    <rect x="580" y="610" width="28" height="40" fill="url(#window)" opacity="0.85"/>

    <rect x="990" y="540" width="28" height="40" fill="url(#window)" opacity="0.6"/>
    <rect x="1060" y="540" width="28" height="40" fill="url(#window)" opacity="0.9"/>
    <rect x="990" y="610" width="28" height="40" fill="url(#window)" opacity="0.85"/>
    <rect x="1060" y="610" width="28" height="40" fill="url(#window)" opacity="0.7"/>
  </g>

  <!-- Foreground hedgerow / lawn -->
  <rect y="690" width="1600" height="210" fill="url(#ground)"/>
  <path d="M 0 700 Q 180 678 360 695 T 720 692 T 1080 696 T 1440 690 T 1600 695 L 1600 720 L 0 720 Z" fill="#2a1410" opacity="0.9"/>

  <!-- Tree silhouettes flanking (decoration outside safe zone center) -->
  <ellipse cx="180" cy="640" rx="90" ry="120" fill="#1a0e0e" opacity="0.85"/>
  <rect x="172" y="640" width="16" height="80" fill="#1a0e0e"/>
  <ellipse cx="1430" cy="650" rx="100" ry="130" fill="#1a0e0e" opacity="0.85"/>
  <rect x="1422" y="650" width="16" height="80" fill="#1a0e0e"/>
</svg>
