<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="92%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="nodeV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b1378"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- radius rings around the hub at (800,450) -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 8"/>
  <circle cx="800" cy="450" r="230" fill="none" stroke="#9a3309" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="3 7"/>
  <circle cx="800" cy="450" r="120" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.2"/>

  <!-- soft outer glow halo on the radius -->
  <circle cx="800" cy="450" r="340" fill="url(#ring)"/>

  <!-- connecting edges from hub to satellite city nodes -->
  <g stroke="#9a3309" stroke-width="1.6" stroke-opacity="0.55" fill="none">
    <line x1="800" y1="450" x2="510" y2="320"/>
    <line x1="800" y1="450" x2="1100" y2="280"/>
    <line x1="800" y1="450" x2="1090" y2="620"/>
    <line x1="800" y1="450" x2="540" y2="600"/>
    <line x1="800" y1="450" x2="800" y2="170"/>
  </g>

  <!-- secondary violet edges (AI/meetup overlay) -->
  <g stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.4" fill="none">
    <line x1="510" y1="320" x2="1100" y2="280"/>
    <line x1="1090" y1="620" x2="540" y2="600"/>
    <line x1="800" y1="170" x2="1100" y2="280"/>
  </g>

  <!-- satellite city nodes -->
  <circle cx="510" cy="320" r="22" fill="url(#node)" opacity="0.92"/>
  <circle cx="1100" cy="280" r="26" fill="url(#node)" opacity="0.92"/>
  <circle cx="1090" cy="620" r="20" fill="url(#nodeV)" opacity="0.85"/>
  <circle cx="540" cy="600" r="24" fill="url(#node)" opacity="0.9"/>
  <circle cx="800" cy="170" r="18" fill="url(#nodeV)" opacity="0.85"/>

  <!-- secondary minor nodes along the ring -->
  <circle cx="680" cy="220" r="10" fill="#c2410c" opacity="0.7"/>
  <circle cx="960" cy="730" r="11" fill="#c2410c" opacity="0.7"/>
  <circle cx="470" cy="470" r="9" fill="#6d28d9" opacity="0.65"/>

  <!-- central hub: Moor Hall anchor -->
  <circle cx="800" cy="450" r="68" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="68" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="800" cy="450" r="28" fill="#faf8f2" opacity="0.85"/>
  <circle cx="800" cy="450" r="10" fill="#9a3309"/>

  <!-- subtle calendar-tick decoration on the inner ring (decorative, croppable) -->
  <g stroke="#78350f" stroke-width="1.2" stroke-opacity="0.35">
    <line x1="800" y1="220" x2="800" y2="240"/>
    <line x1="1030" y1="450" x2="1010" y2="450"/>
    <line x1="800" y1="680" x2="800" y2="660"/>
    <line x1="570" y1="450" x2="590" y2="450"/>
  </g>
</svg>
