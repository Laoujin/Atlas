<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm central glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Large plate gradient: warm rim, pale centre -->
    <radialGradient id="plateLarge" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="72%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Small plate gradient -->
    <radialGradient id="plateSmall" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Cloche dome gradient -->
    <linearGradient id="cloche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b1208" stop-opacity="0.70"/>
    </linearGradient>
    <!-- Star accent radial for Michelin dots -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Warm radial glow over background -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centred around (800, 450), safe zone x:125–1475, y:90–810 -->

  <!-- Large plate: circle centred at (800, 460), radius 240 -->
  <!-- Outer rim ring -->
  <circle cx="800" cy="460" r="244" fill="#c2410c" opacity="0.55"/>
  <circle cx="800" cy="460" r="236" fill="url(#plateLarge)" opacity="0.95"/>
  <!-- Inner plate well -->
  <circle cx="800" cy="460" r="170" fill="#faf8f2" opacity="0.72"/>

  <!-- Cloche dome sitting on the plate — a semi-ellipse -->
  <!-- Using a path: arc from (580, 460) to (1020, 460) peaking at (800, 270) -->
  <path d="M 560 462 Q 580 258 800 238 Q 1020 258 1040 462 Z"
        fill="url(#cloche)" opacity="0.88"/>
  <!-- Cloche handle knob -->
  <ellipse cx="800" cy="238" rx="28" ry="14" fill="#d97706" opacity="0.90"/>
  <ellipse cx="800" cy="232" rx="14" ry="8" fill="#fbbf24" opacity="0.85"/>

  <!-- Cloche base band / rim strip -->
  <rect x="556" y="456" width="488" height="16" rx="6" fill="#9a3309" opacity="0.80"/>

  <!-- Small accent plate lower-right — slightly outside centre but within safe zone -->
  <!-- Centred at (1080, 590), radius 110 -->
  <circle cx="1080" cy="590" r="113" fill="#9a3309" opacity="0.45"/>
  <circle cx="1080" cy="590" r="106" fill="url(#plateSmall)" opacity="0.82"/>
  <circle cx="1080" cy="590" r="72" fill="#fef3ec" opacity="0.60"/>

  <!-- Small accent plate lower-left -->
  <!-- Centred at (520, 590), radius 90 -->
  <circle cx="520" cy="590" r="93" fill="#78350f" opacity="0.40"/>
  <circle cx="520" cy="590" r="86" fill="url(#plateSmall)" opacity="0.78"/>
  <circle cx="520" cy="590" r="58" fill="#fef3ec" opacity="0.55"/>

  <!-- Three Michelin star dots above the cloche, within safe zone -->
  <!-- Arranged horizontally around x=800, y=165 -->
  <circle cx="740" cy="162" r="14" fill="url(#starGlow)" opacity="0.90"/>
  <circle cx="740" cy="162" r="7"  fill="#fbbf24" opacity="0.95"/>

  <circle cx="800" cy="152" r="16" fill="url(#starGlow)" opacity="0.92"/>
  <circle cx="800" cy="152" r="8"  fill="#fbbf24" opacity="0.97"/>

  <circle cx="860" cy="162" r="14" fill="url(#starGlow)" opacity="0.90"/>
  <circle cx="860" cy="162" r="7"  fill="#fbbf24" opacity="0.95"/>

  <!-- Layer 3: Corner/edge atmospheric decoration — intentionally outside or near safe-zone edges -->
  <!-- Soft warm arc in bottom-left corner -->
  <path d="M 0 900 Q 200 700 400 820" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.18"/>
  <!-- Soft warm arc in top-right corner -->
  <path d="M 1600 0 Q 1400 180 1250 100" stroke="#d97706" stroke-width="2" fill="none" opacity="0.15"/>
</svg>
