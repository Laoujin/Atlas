<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1508"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slide1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric city-horizon bar at bottom edge -->
  <rect x="0" y="780" width="1600" height="120" fill="#5c2a1a" opacity="0.35"/>
  <rect x="0" y="820" width="1600" height="80" fill="#3b1508" opacity="0.5"/>

  <!-- Subtle horizon glow low in frame -->
  <ellipse cx="800" cy="860" rx="700" ry="120" fill="#c2410c" opacity="0.18"/>

  <!-- Layer 2: radial glow behind hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Hero: stacked angled conference slides centered at (800, 450) -->

  <!-- Back slide — largest, most rotated, darkest -->
  <polygon
    points="460,620 520,250 1140,250 1080,620"
    fill="url(#slide1)"
    opacity="0.55"/>

  <!-- Mid slide — slightly less rotated -->
  <polygon
    points="490,600 540,275 1110,275 1060,600"
    fill="url(#slide2)"
    opacity="0.72"/>

  <!-- Front slide — hero, least skew, brightest -->
  <polygon
    points="530,580 570,305 1070,305 1030,580"
    fill="url(#slide3)"
    opacity="0.92"/>

  <!-- Screen surface accent: inner highlight bar suggesting a stage screen -->
  <polygon
    points="555,530 582,355 1048,355 1021,530"
    fill="#fbbf24"
    opacity="0.10"/>

  <!-- Speaker podium silhouette at base of front slide -->
  <rect x="740" y="560" width="120" height="60" rx="6" fill="#78350f" opacity="0.85"/>
  <rect x="720" y="610" width="160" height="14" rx="4" fill="#9a3309" opacity="0.9"/>

  <!-- Accent: two thin horizontal bars inside front slide suggesting content rows -->
  <line x1="600" y1="420" x2="1000" y2="420" stroke="#fbbf24" stroke-width="4" opacity="0.22"/>
  <line x1="610" y1="460" x2="990" y2="460" stroke="#fbbf24" stroke-width="4" opacity="0.14"/>
  <line x1="620" y1="495" x2="980" y2="495" stroke="#fbbf24" stroke-width="4" opacity="0.10"/>

  <!-- Layer 3: corner decoration — faint grid lines suggesting venue floor plan -->
  <line x1="0" y1="870" x2="400" y2="640" stroke="#c2410c" stroke-width="1.5" opacity="0.18"/>
  <line x1="1600" y1="870" x2="1200" y2="640" stroke="#c2410c" stroke-width="1.5" opacity="0.18"/>
  <line x1="0" y1="900" x2="500" y2="700" stroke="#d97706" stroke-width="1" opacity="0.10"/>
  <line x1="1600" y1="900" x2="1100" y2="700" stroke="#d97706" stroke-width="1" opacity="0.10"/>
</svg>
