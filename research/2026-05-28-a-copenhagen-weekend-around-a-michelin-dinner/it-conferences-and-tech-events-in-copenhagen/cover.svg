<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow behind skyline -->
  <circle cx="1080" cy="500" r="260" fill="url(#sun)"/>

  <!-- distant Vor Frelsers spire (decorative, partially in safe zone) -->
  <g opacity="0.55" fill="#78350f">
    <rect x="318" y="240" width="14" height="320"/>
    <polygon points="325,180 308,240 342,240"/>
    <polygon points="298,260 352,260 348,290 302,290"/>
    <polygon points="302,300 348,300 344,330 306,330"/>
    <polygon points="306,340 344,340 340,370 310,370"/>
    <circle cx="325" cy="200" r="4" fill="#fbbf24"/>
  </g>

  <!-- Nyhavn rowhouse facades — the hero, centered in safe zone -->
  <!-- back row, softer -->
  <g opacity="0.75">
    <rect x="420" y="380" width="120" height="200" fill="#9a3309"/>
    <polygon points="420,380 480,330 540,380" fill="#5c2a1a"/>
    <rect x="540" y="360" width="130" height="220" fill="#c2410c"/>
    <polygon points="540,360 605,310 670,360" fill="#5c2a1a"/>
    <rect x="670" y="385" width="115" height="195" fill="#d97706"/>
    <polygon points="670,385 727,335 785,385" fill="#5c2a1a"/>
  </g>

  <!-- front row, the hero facades -->
  <g>
    <!-- house 1 -->
    <rect x="460" y="420" width="140" height="240" fill="#c2410c"/>
    <polygon points="460,420 530,360 600,420" fill="#78350f"/>
    <rect x="485" y="470" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="525" y="470" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="565" y="470" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="485" y="525" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="525" y="525" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="565" y="525" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="510" y="595" width="30" height="65" fill="#5c2a1a"/>

    <!-- house 2 -->
    <rect x="600" y="395" width="150" height="265" fill="#9a3309"/>
    <polygon points="600,395 675,330 750,395" fill="#5c2a1a"/>
    <rect x="625" y="445" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="668" y="445" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="711" y="445" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="625" y="500" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="668" y="500" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="711" y="500" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="625" y="555" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="668" y="555" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="711" y="555" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="660" y="615" width="32" height="45" fill="#5c2a1a"/>

    <!-- house 3 -->
    <rect x="750" y="430" width="135" height="230" fill="#d97706"/>
    <polygon points="750,430 817,375 885,430" fill="#78350f"/>
    <rect x="775" y="475" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="815" y="475" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="855" y="475" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="775" y="530" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="815" y="530" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="855" y="530" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="800" y="595" width="30" height="65" fill="#5c2a1a"/>

    <!-- house 4 -->
    <rect x="885" y="410" width="145" height="250" fill="#c2410c"/>
    <polygon points="885,410 957,350 1030,410" fill="#5c2a1a"/>
    <rect x="910" y="460" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="953" y="460" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="996" y="460" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="910" y="515" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="953" y="515" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="996" y="515" width="24" height="34" fill="#fef3ec" opacity="0.85"/>
    <rect x="945" y="605" width="32" height="55" fill="#5c2a1a"/>

    <!-- house 5 -->
    <rect x="1030" y="440" width="130" height="220" fill="#9a3309"/>
    <polygon points="1030,440 1095,385 1160,440" fill="#78350f"/>
    <rect x="1055" y="485" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="1093" y="485" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="1131" y="485" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="1055" y="540" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="1093" y="540" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="1131" y="540" width="22" height="32" fill="#fef3ec" opacity="0.85"/>
    <rect x="1080" y="605" width="30" height="55" fill="#5c2a1a"/>
  </g>

  <!-- harbor waterline -->
  <rect x="0" y="660" width="1600" height="240" fill="url(#water)"/>

  <!-- water reflections (soft mirrored bands) -->
  <g opacity="0.4" fill="#fbbf24">
    <rect x="480" y="680" width="120" height="3"/>
    <rect x="620" y="700" width="140" height="3"/>
    <rect x="770" y="685" width="120" height="3"/>
    <rect x="910" y="705" width="130" height="3"/>
    <rect x="1050" y="690" width="120" height="3"/>
  </g>
  <g opacity="0.25" fill="#c2410c">
    <rect x="500" y="720" width="100" height="2"/>
    <rect x="640" y="740" width="120" height="2"/>
    <rect x="800" y="725" width="100" height="2"/>
    <rect x="940" y="745" width="110" height="2"/>
    <rect x="1070" y="730" width="100" height="2"/>
  </g>

  <!-- mast of a moored sailboat (Nyhavn signature) -->
  <g opacity="0.7">
    <rect x="1228" y="320" width="3" height="340" fill="#5c2a1a"/>
    <rect x="1170" y="430" width="120" height="2" fill="#5c2a1a"/>
    <polygon points="1231,440 1231,640 1310,640" fill="#78350f" opacity="0.5"/>
  </g>
</svg>
