<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2e1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="houseA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="houseB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="houseC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow behind hero -->
  <circle cx="800" cy="430" r="460" fill="url(#glow)"/>

  <!-- row of Nyhavn townhouses (decoration grounding the hero) -->
  <g opacity="0.92">
    <!-- left house -->
    <rect x="380" y="500" width="200" height="260" fill="url(#houseA)"/>
    <polygon points="380,500 480,430 580,500" fill="#78350f"/>
    <rect x="410" y="540" width="40" height="60" fill="#1a0e0e" opacity="0.55"/>
    <rect x="510" y="540" width="40" height="60" fill="#1a0e0e" opacity="0.55"/>
    <rect x="410" y="640" width="40" height="60" fill="#fbbf24" opacity="0.35"/>
    <rect x="510" y="640" width="40" height="60" fill="#1a0e0e" opacity="0.55"/>

    <!-- center-left house -->
    <rect x="600" y="470" width="200" height="290" fill="url(#houseB)"/>
    <polygon points="600,470 700,395 800,470" fill="#5c2a1a"/>
    <rect x="630" y="515" width="40" height="65" fill="#fbbf24" opacity="0.4"/>
    <rect x="730" y="515" width="40" height="65" fill="#1a0e0e" opacity="0.55"/>
    <rect x="630" y="620" width="40" height="65" fill="#1a0e0e" opacity="0.55"/>
    <rect x="730" y="620" width="40" height="65" fill="#fbbf24" opacity="0.4"/>

    <!-- center-right house -->
    <rect x="820" y="490" width="200" height="270" fill="url(#houseC)"/>
    <polygon points="820,490 920,420 1020,490" fill="#1a0e0e"/>
    <rect x="850" y="530" width="40" height="60" fill="#1a0e0e" opacity="0.55"/>
    <rect x="950" y="530" width="40" height="60" fill="#fbbf24" opacity="0.45"/>
    <rect x="850" y="630" width="40" height="60" fill="#fbbf24" opacity="0.35"/>
    <rect x="950" y="630" width="40" height="60" fill="#1a0e0e" opacity="0.55"/>

    <!-- right house -->
    <rect x="1040" y="510" width="180" height="250" fill="url(#houseA)"/>
    <polygon points="1040,510 1130,445 1220,510" fill="#78350f"/>
    <rect x="1065" y="550" width="35" height="55" fill="#1a0e0e" opacity="0.55"/>
    <rect x="1160" y="550" width="35" height="55" fill="#fbbf24" opacity="0.35"/>
    <rect x="1065" y="645" width="35" height="55" fill="#1a0e0e" opacity="0.55"/>
    <rect x="1160" y="645" width="35" height="55" fill="#1a0e0e" opacity="0.55"/>
  </g>

  <!-- hero: Michelin-style five-point star, centered upper -->
  <g transform="translate(800 320)">
    <polygon
      points="0,-170 50,-52 175,-52 75,25 113,150 0,75 -113,150 -75,25 -175,-52 -50,-52"
      fill="url(#star)"
      stroke="#fbbf24"
      stroke-width="3"
      opacity="0.95"/>
    <polygon
      points="0,-170 50,-52 175,-52 75,25 113,150 0,75 -113,150 -75,25 -175,-52 -50,-52"
      fill="none"
      stroke="#fef3ec"
      stroke-width="1"
      opacity="0.35"/>
  </g>

  <!-- harbour water with reflection ripples -->
  <rect x="0" y="760" width="1600" height="140" fill="url(#water)"/>
  <g stroke="#d97706" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 420 790 Q 480 798 540 790"/>
    <path d="M 640 800 Q 700 808 760 800"/>
    <path d="M 860 795 Q 920 803 980 795"/>
    <path d="M 1060 800 Q 1120 808 1180 800"/>
    <path d="M 500 820 Q 560 828 620 820"/>
    <path d="M 900 825 Q 960 833 1020 825"/>
  </g>
</svg>
