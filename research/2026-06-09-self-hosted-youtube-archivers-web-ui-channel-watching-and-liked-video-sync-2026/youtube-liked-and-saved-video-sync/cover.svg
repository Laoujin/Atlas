<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Left block gradient -->
    <linearGradient id="blockL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Right block gradient -->
    <linearGradient id="blockR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#155e75" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Orbit ring gradient -->
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Spark trail gradient -->
    <linearGradient id="sparkL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sparkR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Ambient corner glow -->
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Corner ambient glow (decorative, outside safe zone — no meaning) -->
  <ellipse cx="800" cy="900" rx="700" ry="300" fill="url(#cornerGlow)" opacity="0.7"/>

  <!-- Layer 2: Hero element — centered at (800, 450) within safe zone -->

  <!-- Left block: source / library -->
  <rect x="185" y="330" width="270" height="240" rx="18" fill="url(#blockL)" opacity="0.88"/>
  <!-- Left block inner lines (faint, suggesting stacked content) -->
  <rect x="215" y="368" width="210" height="14" rx="5" fill="#fbbf24" opacity="0.18"/>
  <rect x="215" y="398" width="175" height="10" rx="4" fill="#fbbf24" opacity="0.13"/>
  <rect x="215" y="422" width="195" height="10" rx="4" fill="#fbbf24" opacity="0.12"/>
  <rect x="215" y="446" width="155" height="10" rx="4" fill="#fbbf24" opacity="0.10"/>
  <!-- Left block port nub -->
  <rect x="452" y="435" width="28" height="30" rx="5" fill="#0e7490" opacity="0.9"/>

  <!-- Right block: destination / self-hosted server -->
  <rect x="1145" y="330" width="270" height="240" rx="18" fill="url(#blockR)" opacity="0.88"/>
  <!-- Right block inner lines -->
  <rect x="1175" y="368" width="210" height="14" rx="5" fill="#fbbf24" opacity="0.18"/>
  <rect x="1200" y="398" width="155" height="10" rx="4" fill="#fbbf24" opacity="0.13"/>
  <rect x="1185" y="422" width="185" height="10" rx="4" fill="#fbbf24" opacity="0.12"/>
  <rect x="1205" y="446" width="145" height="10" rx="4" fill="#fbbf24" opacity="0.10"/>
  <!-- Right block port nub -->
  <rect x="1120" y="435" width="28" height="30" rx="5" fill="#0e7490" opacity="0.9"/>

  <!-- Spark trails connecting blocks to hub -->
  <rect x="480" y="447" width="210" height="6" rx="3" fill="url(#sparkL)" opacity="0.85"/>
  <rect x="910" y="447" width="210" height="6" rx="3" fill="url(#sparkR)" opacity="0.85"/>

  <!-- Outer orbit ring -->
  <circle cx="800" cy="450" r="200" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" opacity="0.55"/>
  <!-- Inner orbit ring -->
  <circle cx="800" cy="450" r="155" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="18 10" opacity="0.35"/>

  <!-- Hub circle -->
  <circle cx="800" cy="450" r="115" fill="url(#hubGlow)" opacity="0.95"/>
  <!-- Hub rim -->
  <circle cx="800" cy="450" r="115" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.55"/>

  <!-- Play triangle (YouTube motif) — centered in hub -->
  <polygon points="773,405 773,495 855,450" fill="#faf8f2" opacity="0.92"/>

  <!-- Orbit nodes: small teal dots on outer ring suggesting sync points -->
  <circle cx="800" cy="250" r="9" fill="#0e7490" opacity="0.75"/>
  <circle cx="800" cy="650" r="9" fill="#0e7490" opacity="0.75"/>
  <circle cx="990" cy="362" r="7" fill="#fbbf24" opacity="0.55"/>
  <circle cx="610" cy="538" r="7" fill="#fbbf24" opacity="0.55"/>

</svg>
