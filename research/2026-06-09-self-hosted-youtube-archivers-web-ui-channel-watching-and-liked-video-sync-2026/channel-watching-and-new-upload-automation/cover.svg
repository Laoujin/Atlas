<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="hub" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- 1. full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- 3. decoration: faint outer poll-cycle rings (cropped freely) -->
  <circle cx="800" cy="450" r="430" fill="none" stroke="#0e7490" stroke-width="2" opacity="0.18"/>
  <circle cx="800" cy="450" r="520" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.10"/>

  <!-- 2. HERO centred at (800,450) -->

  <!-- watch-loop orbit: dashed cycle = polling on a schedule -->
  <circle cx="800" cy="450" r="270" fill="none" stroke="url(#arc)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="118 60" opacity="0.85"/>
  <circle cx="800" cy="450" r="210" fill="none" stroke="#0e7490" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="40 70" opacity="0.6"/>

  <!-- direction arrowhead riding the loop (clockwise poll) -->
  <polygon points="1070,420 1070,480 1112,450" fill="#9a3309" opacity="0.9"/>

  <!-- feed pulse: concentric signal rings arriving at a node (new upload) -->
  <circle cx="800" cy="450" r="150" fill="none" stroke="#0e7490" stroke-width="5" opacity="0.55"/>
  <circle cx="800" cy="450" r="110" fill="none" stroke="#0e7490" stroke-width="6" opacity="0.7"/>

  <!-- rust hub: the play / signal source -->
  <circle cx="800" cy="450" r="78" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="78" fill="none" stroke="#fef3ec" stroke-width="3" opacity="0.5"/>
  <polygon points="778,415 778,485 838,450" fill="#fef3ec" opacity="0.95"/>

  <!-- scheduled poll nodes on the orbit -->
  <circle cx="800" cy="180" r="16" fill="#0e7490" opacity="0.85"/>
  <circle cx="1070" cy="450" r="14" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="720" r="13" fill="#c2410c" opacity="0.8"/>
  <circle cx="530" cy="450" r="12" fill="#78350f" opacity="0.75"/>

  <!-- incoming new-upload signal arriving from top-right -->
  <line x1="1180" y1="200" x2="990" y2="320" stroke="#0e7490" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="6 14" opacity="0.55"/>
  <circle cx="990" cy="320" r="20" fill="#d97706" opacity="0.9"/>
</svg>
