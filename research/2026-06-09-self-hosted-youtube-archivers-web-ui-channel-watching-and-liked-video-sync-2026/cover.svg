<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1008"/>
    </linearGradient>
    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Screen face gradient -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1210"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <!-- Screen bezel gradient -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#4a1e07"/>
    </linearGradient>
    <!-- Arrow teal gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Left connector gradient -->
    <linearGradient id="connL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Right connector gradient -->
    <linearGradient id="connR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: radial glow centred on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="420" fill="url(#glow)"/>

  <!-- Layer 3 decoration: left cable/connector bar -->
  <rect x="0" y="418" width="460" height="14" rx="7"
        fill="url(#connL)" opacity="0.9"/>
  <!-- Left plug block -->
  <rect x="440" y="402" width="40" height="46" rx="6"
        fill="#9a3309" opacity="0.85"/>
  <!-- Left plug pins -->
  <rect x="480" y="413" width="18" height="8" rx="3" fill="#d97706" opacity="0.9"/>
  <rect x="480" y="429" width="18" height="8" rx="3" fill="#d97706" opacity="0.9"/>

  <!-- Layer 3 decoration: right cable/connector bar -->
  <rect x="1140" y="418" width="460" height="14" rx="7"
        fill="url(#connR)" opacity="0.9"/>
  <!-- Right plug block -->
  <rect x="1120" y="402" width="40" height="46" rx="6"
        fill="#0e7490" opacity="0.85"/>
  <!-- Right plug pins -->
  <rect x="1102" y="413" width="18" height="8" rx="3" fill="#0891b2" opacity="0.9"/>
  <rect x="1102" y="429" width="18" height="8" rx="3" fill="#0891b2" opacity="0.9"/>

  <!-- Layer 2: hero monitor/screen -->
  <!-- Monitor outer bezel -->
  <rect x="490" y="200" width="620" height="420" rx="28"
        fill="url(#bezel)" opacity="0.95"/>
  <!-- Monitor screen face -->
  <rect x="514" y="224" width="572" height="372" rx="14"
        fill="url(#screen)" opacity="1"/>
  <!-- Screen subtle inner border -->
  <rect x="514" y="224" width="572" height="372" rx="14"
        fill="none" stroke="#c2410c" stroke-width="2" opacity="0.4"/>

  <!-- Monitor stand neck -->
  <rect x="776" y="620" width="48" height="52" rx="6"
        fill="#4a1e07" opacity="0.9"/>
  <!-- Monitor stand base -->
  <rect x="680" y="666" width="240" height="22" rx="11"
        fill="#4a1e07" opacity="0.9"/>

  <!-- Screen content: progress bar track (web UI feel) -->
  <rect x="558" y="530" width="484" height="10" rx="5"
        fill="#3a1a10" opacity="0.9"/>
  <!-- Progress bar fill -->
  <rect x="558" y="530" width="290" height="10" rx="5"
        fill="#c2410c" opacity="0.85"/>
  <!-- Progress dot -->
  <circle cx="848" cy="535" r="8" fill="#fbbf24" opacity="0.95"/>

  <!-- Screen content: play icon (triangle) -->
  <polygon points="720,340 720,440 820,390"
           fill="#c2410c" opacity="0.85"/>

  <!-- Screen content: download arrow (teal) -->
  <!-- Arrow shaft -->
  <rect x="858" y="345" width="22" height="60" rx="4"
        fill="url(#arrowGrad)" opacity="0.92"/>
  <!-- Arrow head -->
  <polygon points="840,405 902,405 869,445"
           fill="url(#arrowGrad)" opacity="0.92"/>
  <!-- Arrow base line (landing platform) -->
  <rect x="838" y="450" width="62" height="8" rx="4"
        fill="#0891b2" opacity="0.85"/>

  <!-- Teal LED dot on bezel top-right (infra accent) -->
  <circle cx="1080" cy="238" r="6" fill="#0e7490" opacity="0.9"/>
  <circle cx="1080" cy="238" r="10" fill="#0e7490" opacity="0.2"/>

</svg>
