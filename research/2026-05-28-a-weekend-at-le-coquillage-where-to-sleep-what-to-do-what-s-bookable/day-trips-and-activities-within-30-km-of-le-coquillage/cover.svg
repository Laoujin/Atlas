<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun halo behind the mount -->
  <circle cx="800" cy="500" r="420" fill="url(#sun)"/>

  <!-- distant horizon haze line -->
  <rect x="0" y="555" width="1600" height="3" fill="#9a3309" opacity="0.35"/>

  <!-- concentric distance rings radiating from Mont-Saint-Michel hero -->
  <circle cx="800" cy="560" r="200" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
  <circle cx="800" cy="560" r="310" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.32"/>
  <circle cx="800" cy="560" r="430" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.22"/>
  <circle cx="800" cy="560" r="560" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.14"/>

  <!-- Mont-Saint-Michel silhouette: pyramidal mound + abbey spire -->
  <path d="M 620 560 Q 660 540 700 525 Q 740 505 770 475 Q 790 455 800 430 Q 808 400 800 380 L 800 320 L 808 312 L 808 268 L 814 262 L 814 232 L 820 226 L 820 232 L 826 238 L 826 268 L 832 274 L 832 318 L 840 326 L 840 380 Q 840 405 858 435 Q 880 470 920 500 Q 960 530 1000 548 Q 1040 558 1080 560 Z" fill="url(#mount)"/>

  <!-- tiny abbey detail: cross at peak (geometric, not text) -->
  <rect x="817" y="208" width="6" height="22" fill="#fbbf24" opacity="0.85"/>
  <rect x="812" y="216" width="16" height="4" fill="#fbbf24" opacity="0.85"/>

  <!-- reflection on tidal flat -->
  <path d="M 620 560 Q 700 575 800 580 Q 920 575 1080 560 L 1080 568 Q 920 595 800 600 Q 700 595 620 568 Z" fill="#9a3309" opacity="0.45"/>

  <!-- bay / tidal flat foreground -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#bay)"/>

  <!-- two oyster-shell crescents on the tidal flat (Cancale nod) -->
  <path d="M 280 780 Q 340 750 410 770 Q 380 800 320 800 Q 290 795 280 780 Z" fill="#c2410c" opacity="0.75"/>
  <path d="M 295 778 Q 345 760 395 772 Q 370 788 325 788 Q 305 785 295 778 Z" fill="#fbbf24" opacity="0.5"/>

  <path d="M 1210 800 Q 1275 770 1345 790 Q 1315 820 1255 820 Q 1225 815 1210 800 Z" fill="#c2410c" opacity="0.75"/>
  <path d="M 1225 798 Q 1275 780 1325 792 Q 1300 808 1255 808 Q 1235 805 1225 798 Z" fill="#fbbf24" opacity="0.5"/>

  <!-- lighthouse silhouette far right, marking GR34/Saint-Malo coast -->
  <path d="M 1380 555 L 1388 555 L 1390 510 L 1386 506 L 1386 498 L 1382 498 L 1382 506 L 1378 510 Z" fill="#78350f" opacity="0.85"/>
  <circle cx="1384" cy="494" r="3" fill="#fbbf24" opacity="0.9"/>
</svg>
