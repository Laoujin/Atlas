<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.78" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shellOuter" cx="0.5" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="shellInner" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant bay silhouette (decoration, lower edge) -->
  <path d="M0,720 L240,712 L380,716 L520,708 L680,712 L820,690 L860,665 L880,690 L1020,710 L1180,706 L1340,712 L1480,708 L1600,714 L1600,760 L0,760 Z" fill="#1a0e0e" opacity="0.55"/>

  <!-- Water reflection band -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#water)"/>

  <!-- Warm radial glow behind hero -->
  <ellipse cx="800" cy="470" rx="620" ry="320" fill="url(#glow)"/>

  <!-- Hero: oyster half-shell, centered in safe zone -->
  <!-- Outer (rough) shell, slightly tilted -->
  <g transform="translate(800,470) rotate(-8)">
    <!-- Lower (deep) cup -->
    <ellipse cx="0" cy="40" rx="430" ry="180" fill="url(#shellOuter)" opacity="0.95"/>
    <!-- Inner pearly interior -->
    <ellipse cx="0" cy="20" rx="380" ry="150" fill="url(#shellInner)" opacity="0.95"/>
    <!-- Ridges fanning from hinge -->
    <g stroke="#9a3309" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M-360,-20 Q-180,90 -40,150"/>
      <path d="M-300,-50 Q-140,80 0,160"/>
      <path d="M-220,-70 Q-90,70 40,160"/>
      <path d="M-130,-80 Q-40,60 80,155"/>
      <path d="M-30,-85 Q30,50 130,145"/>
      <path d="M80,-80 Q120,40 200,135"/>
      <path d="M180,-70 Q200,30 280,120"/>
      <path d="M270,-55 Q280,20 350,100"/>
      <path d="M340,-30 Q340,10 400,75"/>
    </g>
    <!-- Pearl / oyster centerpiece -->
    <ellipse cx="20" cy="30" rx="38" ry="32" fill="#faf8f2" opacity="0.9"/>
    <ellipse cx="14" cy="22" rx="18" ry="14" fill="#fef3ec" opacity="0.85"/>
    <!-- Liquor highlight -->
    <path d="M-300,10 Q0,-60 320,10 Q280,40 0,30 Q-280,40 -300,10 Z" fill="#fbbf24" opacity="0.18"/>
  </g>

  <!-- A few faint distant lights along horizon (decoration) -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="140" cy="708" r="2"/>
    <circle cx="310" cy="712" r="1.8"/>
    <circle cx="1280" cy="710" r="2"/>
    <circle cx="1430" cy="706" r="1.6"/>
  </g>
</svg>
