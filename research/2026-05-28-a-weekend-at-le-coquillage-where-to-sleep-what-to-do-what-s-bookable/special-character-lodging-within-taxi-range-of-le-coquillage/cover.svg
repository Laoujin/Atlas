<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="manor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="tide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun behind manor -->
  <circle cx="800" cy="500" r="280" fill="url(#sun)"/>

  <!-- distant headland (Mont-Saint-Michel bay hint) -->
  <path d="M 0 600 Q 250 580 480 595 L 540 605 L 540 660 L 0 660 Z" fill="#9a3309" opacity="0.35"/>
  <path d="M 1100 605 Q 1330 590 1600 600 L 1600 660 L 1100 660 Z" fill="#9a3309" opacity="0.35"/>

  <!-- tide / bay water -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#tide)"/>

  <!-- tide ripples -->
  <path d="M 200 700 Q 400 692 600 700 T 1000 700 T 1400 700" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M 100 745 Q 350 738 600 745 T 1100 745 T 1500 745" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M 250 795 Q 500 788 750 795 T 1250 795 T 1500 795" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.28"/>

  <!-- HERO: granite manor silhouette, centered ~ (800, 480), within safe zone -->
  <g>
    <!-- main mass -->
    <rect x="600" y="430" width="400" height="220" fill="url(#manor)"/>
    <!-- left wing -->
    <rect x="500" y="490" width="120" height="160" fill="#78350f"/>
    <!-- right wing -->
    <rect x="980" y="475" width="140" height="175" fill="#78350f"/>
    <!-- pitched roof main -->
    <polygon points="590,430 800,310 1010,430" fill="#5c2a1a"/>
    <!-- left wing roof -->
    <polygon points="495,490 560,420 625,490" fill="#5c2a1a"/>
    <!-- right wing roof -->
    <polygon points="975,475 1050,400 1125,475" fill="#5c2a1a"/>
    <!-- chimneys -->
    <rect x="720" y="320" width="22" height="60" fill="#5c2a1a"/>
    <rect x="860" y="335" width="22" height="55" fill="#5c2a1a"/>
    <rect x="1040" y="415" width="18" height="48" fill="#5c2a1a"/>
    <!-- windows: warm lit glow -->
    <rect x="640" y="475" width="24" height="40" fill="#fbbf24" opacity="0.85"/>
    <rect x="690" y="475" width="24" height="40" fill="#fbbf24" opacity="0.75"/>
    <rect x="740" y="475" width="24" height="40" fill="#fbbf24" opacity="0.85"/>
    <rect x="790" y="475" width="24" height="40" fill="#fbbf24" opacity="0.7"/>
    <rect x="840" y="475" width="24" height="40" fill="#fbbf24" opacity="0.85"/>
    <rect x="890" y="475" width="24" height="40" fill="#fbbf24" opacity="0.75"/>
    <rect x="940" y="475" width="24" height="40" fill="#fbbf24" opacity="0.85"/>
    <!-- upper-floor narrower windows -->
    <rect x="660" y="555" width="20" height="34" fill="#fbbf24" opacity="0.7"/>
    <rect x="720" y="555" width="20" height="34" fill="#fbbf24" opacity="0.8"/>
    <rect x="780" y="555" width="20" height="34" fill="#fbbf24" opacity="0.65"/>
    <rect x="840" y="555" width="20" height="34" fill="#fbbf24" opacity="0.8"/>
    <rect x="900" y="555" width="20" height="34" fill="#fbbf24" opacity="0.7"/>
    <!-- wing windows -->
    <rect x="530" y="540" width="20" height="34" fill="#fbbf24" opacity="0.7"/>
    <rect x="575" y="540" width="20" height="34" fill="#fbbf24" opacity="0.8"/>
    <rect x="1005" y="520" width="20" height="34" fill="#fbbf24" opacity="0.75"/>
    <rect x="1050" y="520" width="20" height="34" fill="#fbbf24" opacity="0.7"/>
    <rect x="1090" y="520" width="20" height="34" fill="#fbbf24" opacity="0.8"/>
    <!-- arched doorway -->
    <path d="M 790 650 L 790 605 Q 800 585 810 605 L 810 650 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- reflection of manor in tide, faint -->
  <g opacity="0.18">
    <rect x="600" y="650" width="400" height="80" fill="#78350f"/>
    <rect x="500" y="650" width="120" height="60" fill="#78350f"/>
    <rect x="980" y="650" width="140" height="70" fill="#78350f"/>
  </g>
</svg>
