<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <!-- Back card gradient (teal) -->
    <linearGradient id="cardBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#155e75" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Mid card gradient -->
    <linearGradient id="cardMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Hero card gradient (rust) -->
    <linearGradient id="cardHero" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Bar row fill -->
    <linearGradient id="barAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Radial glow behind stack -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle full-bleed vignette edge — decorative, safe outside hero zone -->
  <rect width="1600" height="900" fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.12"/>

  <!-- Layer 2: Hero element — three stacked comparison cards centered at (800,450) -->
  <!-- All cards within safe zone: x 125–1475, y 90–810 -->

  <!-- Back card: teal, rotated left -->
  <g transform="rotate(-7 800 450)">
    <rect x="290" y="195" width="760" height="510" rx="18" fill="url(#cardBack)" opacity="0.82"/>
    <!-- Header band -->
    <rect x="290" y="195" width="760" height="54" rx="18" fill="#0e7490" opacity="0.6"/>
    <rect x="290" y="231" width="760" height="18" fill="#0e7490" opacity="0.6"/>
    <!-- Row bars inside back card -->
    <rect x="322" y="288" width="540" height="22" rx="4" fill="url(#barTeal)"/>
    <rect x="322" y="332" width="480" height="22" rx="4" fill="url(#barTeal)"/>
    <rect x="322" y="376" width="510" height="22" rx="4" fill="url(#barTeal)"/>
    <rect x="322" y="420" width="460" height="22" rx="4" fill="url(#barTeal)"/>
    <rect x="322" y="464" width="530" height="22" rx="4" fill="url(#barTeal)"/>
    <rect x="322" y="508" width="490" height="22" rx="4" fill="url(#barTeal)"/>
  </g>

  <!-- Mid card: dark rust, rotated right -->
  <g transform="rotate(5 800 450)">
    <rect x="340" y="210" width="760" height="510" rx="18" fill="url(#cardMid)" opacity="0.88"/>
    <!-- Header band -->
    <rect x="340" y="210" width="760" height="54" rx="18" fill="#78350f" opacity="0.7"/>
    <rect x="340" y="246" width="760" height="18" fill="#78350f" opacity="0.7"/>
    <!-- Row bars inside mid card -->
    <rect x="374" y="303" width="580" height="22" rx="4" fill="url(#barAccent)" opacity="0.6"/>
    <rect x="374" y="347" width="520" height="22" rx="4" fill="url(#barAccent)" opacity="0.6"/>
    <rect x="374" y="391" width="550" height="22" rx="4" fill="url(#barAccent)" opacity="0.6"/>
    <rect x="374" y="435" width="500" height="22" rx="4" fill="url(#barAccent)" opacity="0.6"/>
    <rect x="374" y="479" width="560" height="22" rx="4" fill="url(#barAccent)" opacity="0.6"/>
    <rect x="374" y="523" width="510" height="22" rx="4" fill="url(#barAccent)" opacity="0.6"/>
  </g>

  <!-- Hero card: rust, upright, front-most -->
  <rect x="390" y="168" width="760" height="510" rx="18" fill="url(#cardHero)" opacity="0.95"/>
  <!-- Header band on hero card -->
  <rect x="390" y="168" width="760" height="58" rx="18" fill="#9a3309" opacity="0.9"/>
  <rect x="390" y="208" width="760" height="18" fill="#9a3309" opacity="0.9"/>
  <!-- Divider line under header -->
  <line x1="410" y1="244" x2="1130" y2="244" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Row bars inside hero card — varied widths to simulate data -->
  <rect x="422" y="268" width="620" height="24" rx="5" fill="url(#barAccent)"/>
  <rect x="422" y="314" width="480" height="24" rx="5" fill="url(#barAccent)"/>
  <rect x="422" y="360" width="560" height="24" rx="5" fill="url(#barAccent)"/>
  <rect x="422" y="406" width="520" height="24" rx="5" fill="url(#barAccent)"/>
  <rect x="422" y="452" width="590" height="24" rx="5" fill="url(#barAccent)"/>
  <rect x="422" y="498" width="500" height="24" rx="5" fill="url(#barAccent)"/>
  <rect x="422" y="544" width="545" height="24" rx="5" fill="url(#barAccent)"/>
  <!-- Column dividers inside hero card (matrix columns) -->
  <line x1="620" y1="244" x2="620" y2="660" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="820" y1="244" x2="820" y2="660" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="1020" y1="244" x2="1020" y2="660" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Dot accent: health indicator on hero card top-right -->
  <circle cx="1090" cy="197" r="14" fill="#d97706" opacity="0.9"/>
  <circle cx="1090" cy="197" r="8" fill="#fbbf24" opacity="0.95"/>

  <!-- Layer 3: Decorative corner accents (outside hero safe zone — pure atmosphere) -->
  <!-- Bottom-left corner arc -->
  <path d="M0,900 Q120,760 240,820" stroke="#c2410c" stroke-width="2" stroke-opacity="0.18" fill="none"/>
  <!-- Top-right corner arc -->
  <path d="M1600,0 Q1480,140 1360,80" stroke="#0e7490" stroke-width="2" stroke-opacity="0.15" fill="none"/>
</svg>
