<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero plate fill -->
    <radialGradient id="plate1" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Second plate fill -->
    <radialGradient id="plate2" cx="55%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Rose accent glow for rim -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Michelin star radial -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm ambient glow at center -->
  <ellipse cx="800" cy="450" rx="720" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone x:125–1475, y:90–810 -->

  <!-- Rose rim glow behind plates -->
  <ellipse cx="800" cy="458" rx="370" ry="370" fill="url(#roseGlow)" opacity="0.7"/>

  <!-- Back plate (slightly offset, larger) -->
  <circle cx="830" cy="465" r="240" fill="url(#plate2)" opacity="0.82"/>
  <!-- Back plate rim ring -->
  <circle cx="830" cy="465" r="240" fill="none" stroke="#d97706" stroke-width="6" opacity="0.55"/>
  <circle cx="830" cy="465" r="225" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.35"/>

  <!-- Front plate (hero, slightly left-center) -->
  <circle cx="770" cy="445" r="210" fill="url(#plate1)" opacity="0.92"/>
  <!-- Front plate outer rim -->
  <circle cx="770" cy="445" r="210" fill="none" stroke="#c2410c" stroke-width="7" opacity="0.8"/>
  <!-- Front plate inner rim -->
  <circle cx="770" cy="445" r="194" fill="none" stroke="#9a3309" stroke-width="2.5" opacity="0.5"/>
  <!-- Front plate inner decorative ring -->
  <circle cx="770" cy="445" r="160" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <!-- Chopstick accent — two slim diagonal lines crossing over plates -->
  <!-- Chopstick 1 -->
  <line x1="920" y1="220" x2="640" y2="680" stroke="#78350f" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <line x1="920" y1="220" x2="640" y2="680" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Chopstick 2 -->
  <line x1="970" y1="230" x2="688" y2="688" stroke="#78350f" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <line x1="970" y1="230" x2="688" y2="688" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Michelin star shape centered on front plate -->
  <!-- Using a simple 6-point star as the Michelin motif (decorative, not a logo) -->
  <polygon points="800,360 813,393 850,393 821,413 832,447 800,427 768,447 779,413 750,393 787,393"
    fill="url(#starGlow)" opacity="0.88"/>
  <polygon points="800,360 813,393 850,393 821,413 832,447 800,427 768,447 779,413 750,393 787,393"
    fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>

  <!-- Layer 3: Edge decoration (outside safe zone — atmospheric) -->
  <!-- Subtle rose arc, bottom-left corner -->
  <ellipse cx="0" cy="900" rx="380" ry="280" fill="none" stroke="#be185d" stroke-width="40" opacity="0.08"/>
  <!-- Rust arc, top-right corner -->
  <ellipse cx="1600" cy="0" rx="420" ry="310" fill="none" stroke="#c2410c" stroke-width="50" opacity="0.10"/>
  <!-- Very faint full-bleed vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.65"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
