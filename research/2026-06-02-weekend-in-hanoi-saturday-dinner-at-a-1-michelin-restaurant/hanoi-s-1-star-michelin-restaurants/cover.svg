<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm candlelight glow at center -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate fill: warm porcelain -->
    <radialGradient id="plateLeft" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </radialGradient>

    <radialGradient id="plateRight" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c9a87c"/>
    </radialGradient>

    <!-- Plate rim shadow -->
    <radialGradient id="rimShadow" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="transparent"/>
      <stop offset="80%" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose accent glow for garnish -->
    <radialGradient id="garnishGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass body gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#fef3ec" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Candle flame glow -->
    <radialGradient id="flameGlow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow emanating from table center -->
  <ellipse cx="800" cy="490" rx="680" ry="400" fill="url(#glow)"/>

  <!-- =============================================
       Layer 2: Hero element — two plates + wine glass
       Safe zone: x 125–1475, y 90–810
       Hero bounding box: roughly x 270–1330, y 200–760
       ============================================= -->

  <!-- Table surface suggestion: a very subtle ellipse -->
  <ellipse cx="800" cy="650" rx="560" ry="90" fill="#3d1a08" opacity="0.55"/>
  <ellipse cx="800" cy="650" rx="560" ry="90" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.18"/>

  <!-- LEFT PLATE -->
  <!-- Outer rim -->
  <ellipse cx="595" cy="510" rx="195" ry="185" fill="#c2410c" opacity="0.28"/>
  <!-- Plate body -->
  <ellipse cx="595" cy="510" rx="185" ry="175" fill="url(#plateLeft)"/>
  <!-- Rim shadow ring -->
  <ellipse cx="595" cy="510" rx="185" ry="175" fill="url(#rimShadow)"/>
  <!-- Inner well -->
  <ellipse cx="595" cy="512" rx="130" ry="122" fill="#faf8f2" opacity="0.65"/>
  <!-- Garnish dot — rose accent -->
  <ellipse cx="595" cy="505" rx="28" ry="26" fill="url(#garnishGlow)" opacity="0.85"/>
  <ellipse cx="595" cy="505" rx="14" ry="13" fill="#be185d" opacity="0.75"/>
  <!-- Sauce arc suggestion on plate (decorative arc, not text) -->
  <path d="M 530 540 Q 575 490 648 525" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>

  <!-- RIGHT PLATE -->
  <!-- Outer rim -->
  <ellipse cx="1005" cy="510" rx="195" ry="185" fill="#9a3309" opacity="0.28"/>
  <!-- Plate body -->
  <ellipse cx="1005" cy="510" rx="185" ry="175" fill="url(#plateRight)"/>
  <!-- Rim shadow ring -->
  <ellipse cx="1005" cy="510" rx="185" ry="175" fill="url(#rimShadow)"/>
  <!-- Inner well -->
  <ellipse cx="1005" cy="512" rx="130" ry="122" fill="#faf8f2" opacity="0.65"/>
  <!-- Garnish dot — amber accent -->
  <ellipse cx="1005" cy="505" rx="28" ry="26" fill="#d97706" opacity="0.5"/>
  <ellipse cx="1005" cy="505" rx="14" ry="13" fill="#d97706" opacity="0.7"/>
  <!-- Sauce arc suggestion on plate -->
  <path d="M 940 538 Q 988 486 1062 522" fill="none" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>

  <!-- WINE GLASS silhouette between the plates -->
  <!-- Bowl of glass (rounded trapezoid) -->
  <path d="M 768 310 Q 758 390 742 435 Q 730 455 800 462 Q 870 455 858 435 Q 842 390 832 310 Z"
        fill="url(#glassGrad)" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.3"/>
  <!-- Wine fill inside bowl -->
  <path d="M 752 395 Q 749 430 742 435 Q 730 455 800 462 Q 870 455 858 435 Q 851 430 848 395 Z"
        fill="#9a3309" opacity="0.55"/>
  <!-- Stem -->
  <rect x="796" y="462" width="8" height="95" fill="#fbbf24" opacity="0.22"/>
  <!-- Base -->
  <ellipse cx="800" cy="558" rx="42" ry="9" fill="#fbbf24" opacity="0.2"/>
  <!-- Glass highlight -->
  <path d="M 776 325 Q 772 360 770 385" fill="none" stroke="#fef3ec" stroke-width="2.5" stroke-linecap="round" opacity="0.28"/>

  <!-- CANDLE — right side, between glass and right plate -->
  <!-- Candle body -->
  <rect x="892" y="360" width="18" height="105" rx="3" fill="#faf8f2" opacity="0.7"/>
  <!-- Candle wax drip -->
  <path d="M 892 375 Q 888 385 887 400" fill="none" stroke="#faf8f2" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- Flame glow halo -->
  <ellipse cx="901" cy="352" rx="22" ry="24" fill="url(#flameGlow)"/>
  <!-- Flame shape -->
  <path d="M 901 330 Q 908 342 904 354 Q 901 360 898 354 Q 894 342 901 330 Z" fill="#fbbf24" opacity="0.92"/>
  <!-- Flame core -->
  <path d="M 901 336 Q 905 345 902 353 Q 901 357 899 353 Q 897 345 901 336 Z" fill="#fef3ec" opacity="0.85"/>

  <!-- Layer 3: Edge atmosphere (gets cropped on card but adds depth at detail scale) -->
  <!-- Subtle vignette top and bottom edges -->
  <rect x="0" y="0" width="1600" height="120" fill="#1a0e0e" opacity="0.55"/>
  <rect x="0" y="780" width="1600" height="120" fill="#1a0e0e" opacity="0.45"/>
  <!-- Subtle left/right side darkening -->
  <rect x="0" y="0" width="80" height="900" fill="#1a0e0e" opacity="0.5"/>
  <rect x="1520" y="0" width="80" height="900" fill="#1a0e0e" opacity="0.5"/>
</svg>
