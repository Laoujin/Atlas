<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="idp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="260" fill="#c2410c" opacity="0.06"/>
  <circle cx="1520" cy="850" r="300" fill="#78350f" opacity="0.07"/>

  <ellipse cx="870" cy="450" rx="430" ry="330" fill="url(#glow)"/>

  <!-- client block: tab reaching toward the provider -->
  <path d="M 350 250 H 780 V 380 H 840 V 520 H 780 V 650 H 350 Z"
        fill="url(#client)" opacity="0.9" stroke="#78350f" stroke-width="3" stroke-linejoin="round"/>
  <rect x="410" y="316" width="300" height="16" rx="8" fill="#fef3ec" opacity="0.28"/>
  <rect x="410" y="568" width="220" height="16" rx="8" fill="#fef3ec" opacity="0.2"/>

  <!-- provider block: socket cut to receive the tab -->
  <path d="M 1250 250 H 900 V 380 H 970 V 520 H 900 V 650 H 1250 Z"
        fill="url(#idp)" opacity="0.95" stroke="#9a3309" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="1130" cy="450" r="72" fill="none" stroke="#fef3ec" stroke-width="14" opacity="0.55"/>
  <circle cx="1130" cy="450" r="20" fill="#78350f" opacity="0.7"/>

  <!-- token in flight across the boundary -->
  <path d="M 846 450 C 862 402, 892 498, 906 450" fill="none" stroke="#fbbf24"
        stroke-width="9" stroke-linecap="round" opacity="0.95"/>
  <circle cx="876" cy="450" r="15" fill="#fbbf24" opacity="0.85"/>
  <circle cx="876" cy="450" r="34" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.4"/>
</svg>
