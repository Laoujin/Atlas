<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- the request path threading every layer of the stack -->
  <rect x="772" y="150" width="56" height="610" fill="url(#spine)"/>

  <!-- layer 1 — generated API client -->
  <polygon points="340,230 1260,180 1260,250 340,300" fill="url(#slab)" opacity="0.72"/>
  <polygon points="340,300 1260,250 1260,268 340,318" fill="#78350f" opacity="0.5"/>

  <!-- layer 2 — server-state cache (hero) -->
  <polygon points="300,380 1300,326 1300,404 300,458" fill="url(#hero)" opacity="0.95"/>
  <polygon points="300,458 1300,404 1300,428 300,482" fill="#78350f" opacity="0.8"/>
  <line x1="300" y1="458" x2="1300" y2="404" stroke="#fbbf24" stroke-width="4" opacity="0.9"/>

  <!-- layer 3 — typed router owning URL state -->
  <polygon points="340,530 1260,480 1260,550 340,600" fill="url(#slab)" opacity="0.68"/>
  <polygon points="340,600 1260,550 1260,568 340,618" fill="#78350f" opacity="0.45"/>

  <!-- layer 4 — the thin client store -->
  <polygon points="340,660 1260,610 1260,648 340,698" fill="url(#slab)" opacity="0.5"/>
  <polygon points="340,698 1260,648 1260,660 340,710" fill="#78350f" opacity="0.35"/>
</svg>
