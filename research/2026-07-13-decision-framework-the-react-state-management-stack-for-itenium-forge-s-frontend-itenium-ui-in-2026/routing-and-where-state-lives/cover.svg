<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#fdeee2"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- decoration: horizon strata, cropped freely -->
  <rect x="-60" y="806" width="1720" height="10" rx="5" fill="#78350f" opacity="0.10"/>
  <rect x="-60" y="86" width="1720" height="6" rx="3" fill="#c2410c" opacity="0.08"/>

  <!-- hero: the URL bar as the store -->
  <g>
    <rect x="256" y="286" width="1088" height="164" rx="82" fill="#78350f" opacity="0.10"/>
    <rect x="250" y="272" width="1100" height="164" rx="82" fill="url(#bar)" stroke="#c2410c" stroke-opacity="0.55" stroke-width="4"/>

    <circle cx="336" cy="354" r="26" fill="none" stroke="#9a3309" stroke-width="8" opacity="0.75"/>
    <line x1="356" y1="374" x2="376" y2="396" stroke="#9a3309" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

    <rect x="430" y="330" width="150" height="48" rx="24" fill="url(#deep)" opacity="0.75"/>
    <rect x="604" y="330" width="104" height="48" rx="24" fill="url(#deep)" opacity="0.55"/>

    <circle cx="742" cy="354" r="8" fill="#78350f" opacity="0.5"/>

    <rect x="776" y="322" width="164" height="64" rx="32" fill="url(#hot)" opacity="0.95"/>
    <rect x="960" y="322" width="132" height="64" rx="32" fill="url(#hot)" opacity="0.8"/>
    <rect x="1112" y="322" width="176" height="64" rx="32" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- the three state slices, fed from the query chips -->
  <g fill="none" stroke="#c2410c" stroke-width="5" opacity="0.55" stroke-linecap="round">
    <path d="M858 386 V524 Q858 560 822 560 H476 Q440 560 440 596 V632"/>
    <path d="M1026 386 V524 Q1026 560 990 560 H836 Q800 560 800 596 V632"/>
    <path d="M1200 386 V524 Q1200 560 1184 560 H1176 Q1160 560 1160 596 V632"/>
  </g>

  <g>
    <rect x="310" y="632" width="260" height="132" rx="26" fill="#fffdf9" stroke="#9a3309" stroke-opacity="0.45" stroke-width="4"/>
    <rect x="670" y="632" width="260" height="132" rx="26" fill="#fffdf9" stroke="#9a3309" stroke-opacity="0.45" stroke-width="4"/>
    <rect x="1030" y="632" width="260" height="132" rx="26" fill="#fffdf9" stroke="#9a3309" stroke-opacity="0.45" stroke-width="4"/>

    <rect x="350" y="678" width="180" height="14" rx="7" fill="#c2410c" opacity="0.65"/>
    <rect x="350" y="710" width="116" height="14" rx="7" fill="#78350f" opacity="0.35"/>

    <rect x="710" y="678" width="180" height="14" rx="7" fill="#c2410c" opacity="0.65"/>
    <rect x="710" y="710" width="88" height="14" rx="7" fill="#78350f" opacity="0.35"/>

    <rect x="1070" y="678" width="180" height="14" rx="7" fill="#c2410c" opacity="0.65"/>
    <rect x="1070" y="710" width="140" height="14" rx="7" fill="#78350f" opacity="0.35"/>
  </g>
</svg>
