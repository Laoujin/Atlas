<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="450" rx="640" ry="420" fill="url(#glow)"/>

  <!-- source of truth: the OpenAPI document -->
  <g opacity="0.95">
    <rect x="330" y="240" width="300" height="420" rx="18" fill="url(#spec)"/>
    <rect x="372" y="300" width="216" height="16" rx="8" fill="#fbbf24" opacity="0.85"/>
    <rect x="372" y="352" width="150" height="12" rx="6" fill="#faf8f2" opacity="0.38"/>
    <rect x="372" y="396" width="196" height="12" rx="6" fill="#faf8f2" opacity="0.30"/>
    <rect x="372" y="440" width="124" height="12" rx="6" fill="#faf8f2" opacity="0.30"/>
    <rect x="372" y="484" width="176" height="12" rx="6" fill="#faf8f2" opacity="0.24"/>
    <rect x="372" y="528" width="104" height="12" rx="6" fill="#faf8f2" opacity="0.24"/>
    <rect x="372" y="590" width="140" height="12" rx="6" fill="#d97706" opacity="0.65"/>
  </g>

  <!-- generation: spec flows into emitted artefacts -->
  <path d="M640 450 C 700 450, 700 372, 776 372" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <path d="M640 450 C 706 450, 706 450, 776 450" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round"/>
  <path d="M640 450 C 700 450, 700 528, 776 528" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <circle cx="640" cy="450" r="15" fill="#fbbf24"/>

  <!-- emitted client + hooks: fanned stack, rust hero on top -->
  <g transform="translate(1060 450)">
    <rect x="-190" y="-215" width="380" height="430" rx="20" fill="#78350f" opacity="0.22" transform="rotate(-7)"/>
    <rect x="-190" y="-215" width="380" height="430" rx="20" fill="#9a3309" opacity="0.45" transform="rotate(-3.5)"/>
    <rect x="-190" y="-215" width="380" height="430" rx="20" fill="url(#hero)"/>
    <rect x="-146" y="-160" width="234" height="16" rx="8" fill="#faf8f2" opacity="0.90"/>
    <rect x="-146" y="-108" width="150" height="12" rx="6" fill="#faf8f2" opacity="0.55"/>
    <rect x="-108" y="-56" width="196" height="12" rx="6" fill="#fbbf24" opacity="0.80"/>
    <rect x="-108" y="-4" width="150" height="12" rx="6" fill="#faf8f2" opacity="0.45"/>
    <rect x="-146" y="48" width="120" height="12" rx="6" fill="#faf8f2" opacity="0.55"/>
    <rect x="-108" y="100" width="180" height="12" rx="6" fill="#fbbf24" opacity="0.65"/>
    <rect x="-146" y="152" width="96" height="12" rx="6" fill="#faf8f2" opacity="0.40"/>
  </g>

  <circle cx="132" cy="806" r="76" fill="#c2410c" opacity="0.10"/>
  <circle cx="1508" cy="122" r="110" fill="#d97706" opacity="0.10"/>
</svg>
