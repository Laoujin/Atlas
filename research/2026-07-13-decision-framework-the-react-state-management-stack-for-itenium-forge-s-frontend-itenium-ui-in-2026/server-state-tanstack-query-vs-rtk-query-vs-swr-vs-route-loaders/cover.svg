<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="780" ry="470" fill="url(#glow)"/>

  <!-- refetch / invalidation cycle -->
  <ellipse cx="800" cy="450" rx="520" ry="250" fill="none" stroke="url(#ring)" stroke-width="7"
           opacity="0.7" transform="rotate(-12 800 450)"/>

  <!-- cold cache layer -->
  <polygon points="500,560 800,470 1100,560 800,650" fill="#78350f" opacity="0.62"/>
  <polygon points="500,560 800,650 1100,560 1100,600 800,690 500,600" fill="#5c2a1a" opacity="0.68"/>

  <!-- warm cache layer -->
  <polygon points="500,470 800,380 1100,470 800,560" fill="#9a3309" opacity="0.8"/>
  <polygon points="500,470 800,560 1100,470 1100,510 800,600 500,510" fill="#78350f" opacity="0.85"/>

  <!-- fresh data hero layer -->
  <polygon points="500,380 800,290 1100,380 800,470" fill="url(#hot)" opacity="0.95"/>
  <polygon points="500,380 800,470 1100,380 1100,420 800,510 500,420" fill="#c2410c" opacity="0.9"/>
  <polygon points="800,290 1100,380 800,470" fill="#fbbf24" opacity="0.28"/>

  <!-- endpoints on the cycle: request out, response in -->
  <circle cx="1309" cy="342" r="26" fill="#c2410c" opacity="0.95"/>
  <circle cx="1309" cy="342" r="46" fill="none" stroke="#d97706" stroke-width="4" opacity="0.55"/>
  <circle cx="291" cy="558" r="17" fill="#9a3309" opacity="0.85"/>

  <!-- edge decoration -->
  <path d="M0 760 L240 620 M0 840 L360 630" stroke="#c2410c" stroke-width="5" opacity="0.18" fill="none"/>
  <path d="M1600 140 L1360 280 M1600 60 L1240 270" stroke="#78350f" stroke-width="5" opacity="0.16" fill="none"/>
</svg>
