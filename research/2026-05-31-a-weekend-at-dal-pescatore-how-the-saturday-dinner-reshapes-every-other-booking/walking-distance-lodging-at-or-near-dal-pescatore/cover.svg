<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="plate2" cx="55%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="75%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="780" ry="380" fill="url(#glow)"/>

  <!-- back plate -->
  <ellipse cx="560" cy="540" rx="240" ry="60" fill="#000" opacity="0.35"/>
  <circle cx="560" cy="500" r="225" fill="url(#plate)" opacity="0.92"/>
  <circle cx="560" cy="500" r="225" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.6"/>
  <circle cx="560" cy="500" r="150" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.5"/>
  <circle cx="540" cy="485" r="22" fill="#be185d" opacity="0.75"/>
  <circle cx="585" cy="510" r="14" fill="#c2410c" opacity="0.85"/>
  <circle cx="560" cy="455" r="9" fill="#fbbf24" opacity="0.9"/>

  <!-- front plate (hero) -->
  <ellipse cx="930" cy="620" rx="290" ry="70" fill="#000" opacity="0.4"/>
  <circle cx="930" cy="560" r="270" fill="url(#plate2)" opacity="0.95"/>
  <circle cx="930" cy="560" r="270" fill="none" stroke="#78350f" stroke-width="3" opacity="0.7"/>
  <circle cx="930" cy="560" r="185" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.6"/>
  <circle cx="910" cy="540" r="30" fill="#be185d" opacity="0.7"/>
  <circle cx="960" cy="575" r="20" fill="#9a3309" opacity="0.85"/>
  <circle cx="930" cy="500" r="12" fill="#fbbf24" opacity="0.95"/>
  <circle cx="895" cy="585" r="8" fill="#fef3ec" opacity="0.9"/>

  <!-- wine glass silhouette (right) -->
  <path d="M 1240 200 Q 1240 360 1320 380 Q 1400 360 1400 200 Z" fill="url(#glass)" opacity="0.9"/>
  <path d="M 1240 200 Q 1240 360 1320 380 Q 1400 360 1400 200" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <rect x="1317" y="380" width="6" height="180" fill="url(#stem)" opacity="0.85"/>
  <ellipse cx="1320" cy="565" rx="55" ry="8" fill="#78350f" opacity="0.9"/>
  <ellipse cx="1310" cy="240" rx="22" ry="40" fill="#fbbf24" opacity="0.18"/>
</svg>
