<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant atmospheric band -->
  <rect x="0" y="430" width="1600" height="80" fill="#d97706" opacity="0.08"/>

  <!-- Hero sun disc, centered in safe zone -->
  <circle cx="800" cy="430" r="170" fill="url(#sun)" opacity="0.92"/>
  <circle cx="800" cy="430" r="170" fill="none" stroke="#78350f" stroke-width="2" opacity="0.35"/>

  <!-- Rolling hills (far) -->
  <path d="M 0 560 Q 280 480 560 530 T 1120 510 T 1600 540 L 1600 620 L 0 620 Z" fill="url(#hill2)" opacity="0.75"/>

  <!-- Rolling hills (near) -->
  <path d="M 0 640 Q 360 580 720 620 T 1340 615 T 1600 640 L 1600 720 L 0 720 Z" fill="url(#hill1)" opacity="0.9"/>

  <!-- Winding river (Po/Oglio) — meanders across the valley floor -->
  <path d="M 0 820 C 240 760 360 880 600 800 S 980 720 1180 790 S 1460 860 1600 800 L 1600 900 L 0 900 Z" fill="url(#river)"/>

  <!-- River highlight -->
  <path d="M 0 820 C 240 760 360 880 600 800 S 980 720 1180 790 S 1460 860 1600 800" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.55"/>

  <!-- Two distant village markers on hill ridge (abstract dot accents, inside safe zone) -->
  <circle cx="430" cy="525" r="6" fill="#78350f" opacity="0.85"/>
  <circle cx="1080" cy="505" r="6" fill="#78350f" opacity="0.85"/>
  <circle cx="1280" cy="595" r="5" fill="#78350f" opacity="0.75"/>
</svg>
