<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#5c2a1a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="plateA" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="plateB" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Table surface band -->
  <rect x="0" y="560" width="1600" height="340" fill="#5c2a1a" opacity="0.35"/>
  <rect x="0" y="560" width="1600" height="3" fill="#fbbf24" opacity="0.18"/>

  <!-- Left plate (rear) -->
  <ellipse cx="610" cy="520" rx="220" ry="58" fill="#78350f" opacity="0.45"/>
  <ellipse cx="610" cy="500" rx="215" ry="56" fill="url(#plateA)"/>
  <ellipse cx="610" cy="495" rx="155" ry="38" fill="#1a0e0e" opacity="0.12"/>
  <circle cx="610" cy="488" r="22" fill="#c2410c" opacity="0.85"/>
  <circle cx="585" cy="498" r="10" fill="#fbbf24" opacity="0.75"/>
  <circle cx="640" cy="500" r="7" fill="#9a3309" opacity="0.9"/>

  <!-- Right plate (front, hero) -->
  <ellipse cx="980" cy="600" rx="280" ry="72" fill="#78350f" opacity="0.5"/>
  <ellipse cx="980" cy="578" rx="272" ry="68" fill="url(#plateB)"/>
  <ellipse cx="980" cy="572" rx="195" ry="46" fill="#1a0e0e" opacity="0.1"/>
  <circle cx="980" cy="562" r="30" fill="#c2410c" opacity="0.88"/>
  <circle cx="940" cy="578" r="14" fill="#fbbf24" opacity="0.8"/>
  <circle cx="1025" cy="582" r="11" fill="#d97706" opacity="0.85"/>
  <circle cx="995" cy="595" r="6" fill="#9a3309" opacity="0.9"/>

  <!-- Wine glass silhouette, left of plates -->
  <path d="M 320 280
           C 320 380 280 410 280 470
           L 280 545
           L 230 545
           L 230 555
           L 330 555
           L 330 545
           L 280 545
           L 280 470
           C 280 410 240 380 240 280
           C 240 270 245 265 280 265
           C 315 265 320 270 320 280 Z"
        fill="#1a0e0e" opacity="0.55"/>
  <path d="M 248 285
           C 248 360 258 395 273 420
           L 273 295
           C 273 285 260 282 252 282
           C 250 282 248 283 248 285 Z"
        fill="url(#glass)"/>
  <ellipse cx="280" cy="278" rx="8" ry="3" fill="#fbbf24" opacity="0.5"/>

  <!-- Small candle flame glow, right edge of safe zone -->
  <circle cx="1320" cy="430" r="80" fill="#fbbf24" opacity="0.12"/>
  <circle cx="1320" cy="430" r="40" fill="#fbbf24" opacity="0.18"/>
  <ellipse cx="1320" cy="425" rx="9" ry="18" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="1320" cy="421" rx="5" ry="11" fill="#fef3ec" opacity="0.8"/>
  <rect x="1316" y="445" width="8" height="55" fill="#78350f" opacity="0.75"/>

  <!-- Soft ambient sparks -->
  <circle cx="430" cy="200" r="3" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1150" cy="170" r="2.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1430" cy="260" r="2" fill="#fbbf24" opacity="0.45"/>
  <circle cx="200" cy="160" r="2" fill="#fbbf24" opacity="0.4"/>
</svg>
