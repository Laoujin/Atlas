<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#3b1509"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="620" ry="400" fill="url(#glow)"/>

  <!-- Layer 2: Hero — stacked story cards -->

  <!-- Card 3 (back, rotated left) -->
  <g transform="rotate(-8, 800, 450)">
    <rect x="430" y="230" width="740" height="460" rx="14" fill="url(#card3)" opacity="0.75"/>
    <!-- faint line bars -->
    <rect x="480" y="310" width="560" height="14" rx="4" fill="#fbbf24" opacity="0.10"/>
    <rect x="480" y="348" width="420" height="11" rx="4" fill="#fbbf24" opacity="0.08"/>
    <rect x="480" y="400" width="500" height="11" rx="4" fill="#fbbf24" opacity="0.08"/>
    <rect x="480" y="430" width="380" height="11" rx="4" fill="#fbbf24" opacity="0.07"/>
    <rect x="480" y="510" width="460" height="11" rx="4" fill="#fbbf24" opacity="0.08"/>
    <rect x="480" y="540" width="320" height="11" rx="4" fill="#fbbf24" opacity="0.06"/>
  </g>

  <!-- Card 2 (middle, rotated right) -->
  <g transform="rotate(5, 800, 450)">
    <rect x="450" y="218" width="740" height="460" rx="14" fill="url(#card2)" opacity="0.82"/>
    <!-- faint line bars -->
    <rect x="500" y="298" width="540" height="14" rx="4" fill="#fbbf24" opacity="0.11"/>
    <rect x="500" y="336" width="400" height="11" rx="4" fill="#fbbf24" opacity="0.09"/>
    <rect x="500" y="390" width="480" height="11" rx="4" fill="#fbbf24" opacity="0.09"/>
    <rect x="500" y="420" width="360" height="11" rx="4" fill="#fbbf24" opacity="0.07"/>
    <rect x="500" y="500" width="440" height="11" rx="4" fill="#fbbf24" opacity="0.08"/>
    <rect x="500" y="530" width="300" height="11" rx="4" fill="#fbbf24" opacity="0.06"/>
  </g>

  <!-- Card 1 (front hero, straight) -->
  <rect x="465" y="205" width="670" height="490" rx="16" fill="url(#card1)" opacity="0.95"/>

  <!-- Accent bar at top of hero card (role strip) -->
  <rect x="465" y="205" width="670" height="52" rx="16" fill="url(#accent)" opacity="0.85"/>
  <rect x="465" y="230" width="670" height="27" fill="url(#accent)" opacity="0.85"/>

  <!-- Checkbox row — three squares suggesting acceptance criteria ticks -->
  <rect x="510" y="298" width="28" height="28" rx="5" fill="#fbbf24" opacity="0.30"/>
  <rect x="510" y="298" width="28" height="28" rx="5" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.60"/>
  <!-- checkmark in first box -->
  <polyline points="516,312 522,320 536,304" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.90"/>

  <rect x="510" y="346" width="28" height="28" rx="5" fill="#fbbf24" opacity="0.30"/>
  <rect x="510" y="346" width="28" height="28" rx="5" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.60"/>
  <polyline points="516,360 522,368 536,352" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.90"/>

  <rect x="510" y="394" width="28" height="28" rx="5" fill="#fbbf24" opacity="0.15"/>
  <rect x="510" y="394" width="28" height="28" rx="5" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.40"/>

  <!-- Text-line bars beside checkboxes -->
  <rect x="556" y="305" width="430" height="12" rx="4" fill="#fef3ec" opacity="0.22"/>
  <rect x="556" y="353" width="360" height="12" rx="4" fill="#fef3ec" opacity="0.20"/>
  <rect x="556" y="401" width="400" height="12" rx="4" fill="#fef3ec" opacity="0.16"/>

  <!-- Divider line -->
  <line x1="510" y1="450" x2="1090" y2="450" stroke="#fbbf24" stroke-width="1.5" opacity="0.28"/>

  <!-- Lower block — "given/when/then" three rows -->
  <rect x="510" y="472" width="120" height="12" rx="3" fill="#d97706" opacity="0.55"/>
  <rect x="648" y="472" width="340" height="12" rx="3" fill="#fef3ec" opacity="0.18"/>

  <rect x="510" y="502" width="120" height="12" rx="3" fill="#d97706" opacity="0.45"/>
  <rect x="648" y="502" width="300" height="12" rx="3" fill="#fef3ec" opacity="0.16"/>

  <rect x="510" y="532" width="120" height="12" rx="3" fill="#d97706" opacity="0.45"/>
  <rect x="648" y="532" width="380" height="12" rx="3" fill="#fef3ec" opacity="0.16"/>

  <!-- Subtle corner dots — decorative, outside meaning -->
  <circle cx="120" cy="100" r="60" fill="#9a3309" opacity="0.12"/>
  <circle cx="1480" cy="800" r="80" fill="#78350f" opacity="0.10"/>
</svg>
