<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Card face gradients -->
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Highlight bar gradient -->
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3"/>
    </linearGradient>
    <!-- AI node glow -->
    <radialGradient id="nodeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Radial glow centered on hero -->
  <ellipse cx="800" cy="450" rx="520" ry="360" fill="url(#glow)"/>

  <!-- Layer 2: Hero — stacked backlog cards, angled slightly, centered at (800,450) -->

  <!-- Card 3 (bottom / backlog tail) — offset down-right, rotated slightly -->
  <g transform="translate(800,450)">
    <rect x="-290" y="60" width="620" height="170" rx="14"
          fill="url(#card3)" opacity="0.72"
          transform="rotate(4)"/>
    <!-- faint line bars suggesting text rows -->
    <rect x="-240" y="88" width="340" height="12" rx="4" fill="#fbbf24" opacity="0.13" transform="rotate(4)"/>
    <rect x="-240" y="112" width="260" height="10" rx="4" fill="#fbbf24" opacity="0.09" transform="rotate(4)"/>
    <rect x="-240" y="134" width="200" height="10" rx="4" fill="#fbbf24" opacity="0.07" transform="rotate(4)"/>
  </g>

  <!-- Card 2 (middle) — slight counter-rotation -->
  <g transform="translate(800,450)">
    <rect x="-290" y="-30" width="620" height="170" rx="14"
          fill="url(#card2)" opacity="0.82"
          transform="rotate(-2)"/>
    <rect x="-240" y="-4" width="300" height="12" rx="4" fill="#fbbf24" opacity="0.15" transform="rotate(-2)"/>
    <rect x="-240" y="20" width="230" height="10" rx="4" fill="#fbbf24" opacity="0.10" transform="rotate(-2)"/>
    <rect x="-240" y="42" width="180" height="10" rx="4" fill="#fbbf24" opacity="0.08" transform="rotate(-2)"/>
    <!-- small priority badge -->
    <rect x="210" y="-10" width="50" height="28" rx="6" fill="#d97706" opacity="0.6" transform="rotate(-2)"/>
  </g>

  <!-- Card 1 (top / highest priority) — nearly flat, prominent -->
  <g transform="translate(800,450)">
    <rect x="-290" y="-150" width="620" height="170" rx="14"
          fill="url(#card1)" opacity="0.95"/>
    <!-- Highlight bar top edge -->
    <rect x="-290" y="-150" width="620" height="6" rx="3" fill="url(#bar)" opacity="0.9"/>
    <!-- Text-line bars -->
    <rect x="-240" y="-118" width="360" height="13" rx="4" fill="#fbbf24" opacity="0.22"/>
    <rect x="-240" y="-96" width="280" height="11" rx="4" fill="#fbbf24" opacity="0.15"/>
    <rect x="-240" y="-74" width="200" height="11" rx="4" fill="#fbbf24" opacity="0.11"/>
    <!-- Priority star / rank indicator — small glowing dot cluster top-right -->
    <circle cx="255" cy="-118" r="14" fill="url(#nodeglow)" opacity="0.95"/>
    <circle cx="255" cy="-118" r="7" fill="#fbbf24" opacity="1"/>
  </g>

  <!-- AI processing arrow: upward chevron suggesting ranking/lift -->
  <g transform="translate(800, 450)" opacity="0.55">
    <!-- Left arm -->
    <line x1="-44" y1="-195" x2="0" y2="-225" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <!-- Right arm -->
    <line x1="44" y1="-195" x2="0" y2="-225" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Layer 3: corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Bottom-left warm arc hint -->
  <circle cx="0" cy="900" r="320" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.12"/>
  <!-- Top-right subtle arc -->
  <circle cx="1600" cy="0" r="380" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.10"/>
</svg>
