<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="450" rx="640" ry="360" fill="url(#glow)"/>

  <!-- Strata: stacked decision/validation layers at a slight angle -->
  <g transform="rotate(-7 800 450)">
    <rect x="300" y="210" width="1000" height="70" rx="14" fill="#78350f" opacity="0.45"/>
    <rect x="300" y="300" width="1000" height="70" rx="14" fill="#c2410c" opacity="0.62"/>

    <!-- hero validated band -->
    <rect x="300" y="392" width="1000" height="96" rx="16" fill="url(#hero)"/>
    <circle cx="1230" cy="440" r="26" fill="#fbbf24"/>
    <path d="M1218 440 l9 10 l16 -20" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="300" y="510" width="1000" height="70" rx="14" fill="#d97706" opacity="0.7"/>
    <rect x="300" y="600" width="1000" height="70" rx="14" fill="#78350f" opacity="0.4"/>
  </g>
</svg>
