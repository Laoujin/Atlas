<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2a120c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="plateBack" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b1608" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="plateFront" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant ambient sparkles outside hero zone -->
  <circle cx="180" cy="180" r="90" fill="url(#spark)" opacity="0.35"/>
  <circle cx="1430" cy="760" r="110" fill="url(#spark)" opacity="0.3"/>

  <!-- Back plate (offset, partly behind) -->
  <ellipse cx="1080" cy="540" rx="280" ry="70" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="1080" cy="500" r="230" fill="url(#plateBack)" opacity="0.9"/>
  <circle cx="1080" cy="500" r="230" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <circle cx="1080" cy="500" r="150" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>

  <!-- Front plate (hero, centered in safe zone) -->
  <ellipse cx="650" cy="640" rx="340" ry="50" fill="#000" opacity="0.45"/>
  <circle cx="650" cy="540" r="290" fill="url(#plateFront)"/>
  <circle cx="650" cy="540" r="290" fill="none" stroke="#fef3ec" stroke-width="2.5" opacity="0.55"/>
  <circle cx="650" cy="540" r="200" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.4"/>

  <!-- Wine glass silhouette accent -->
  <path d="M 880 220
           L 980 220
           C 980 320, 960 360, 930 380
           L 930 470
           L 970 480
           L 970 495
           L 890 495
           L 890 480
           L 930 470
           L 930 380
           C 900 360, 880 320, 880 220 Z"
        fill="url(#glass)" opacity="0.85"/>
  <!-- Liquid in glass -->
  <path d="M 893 240
           L 967 240
           C 965 305, 950 345, 930 360
           C 910 345, 895 305, 893 240 Z"
        fill="#c2410c" opacity="0.75"/>

  <!-- Highlight on glass rim -->
  <ellipse cx="930" cy="225" rx="42" ry="6" fill="#fef3ec" opacity="0.35"/>

  <!-- Subtle steam / aroma curve from front plate -->
  <path d="M 580 390 C 600 340, 560 300, 600 260" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 660 380 C 680 330, 640 290, 680 250" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M 740 390 C 760 340, 720 300, 760 260" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
