<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slide1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Background radial glow centered on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="420" fill="url(#glow)"/>

  <!-- Faint background arc lines suggesting connectivity -->
  <path d="M 200 700 Q 800 200 1400 700" stroke="#c2410c" stroke-width="1.5" fill="none" opacity="0.12"/>
  <path d="M 150 600 Q 800 50 1450 600" stroke="#d97706" stroke-width="1" fill="none" opacity="0.08"/>
  <path d="M 250 800 Q 800 300 1350 800" stroke="#c2410c" stroke-width="1" fill="none" opacity="0.08"/>

  <!-- Layer 2: Hero element — stacked conference slides centered at (800, 450) -->

  <!-- Back slide (bottom-most, offset left and down, angled) -->
  <g transform="rotate(-8, 800, 450)">
    <rect x="355" y="195" width="620" height="430" rx="14" fill="url(#slide1)" opacity="0.62"/>
    <!-- Slide content bars (decorative, not text) -->
    <rect x="385" y="280" width="340" height="18" rx="4" fill="#fbbf24" opacity="0.18"/>
    <rect x="385" y="318" width="260" height="12" rx="4" fill="#fbbf24" opacity="0.12"/>
    <rect x="385" y="344" width="300" height="12" rx="4" fill="#fbbf24" opacity="0.10"/>
  </g>

  <!-- Middle slide (offset right and up, slight angle) -->
  <g transform="rotate(5, 800, 450)">
    <rect x="430" y="170" width="620" height="430" rx="14" fill="url(#slide2)" opacity="0.72"/>
    <!-- Slide content bars -->
    <rect x="462" y="250" width="380" height="20" rx="4" fill="#fbbf24" opacity="0.20"/>
    <rect x="462" y="292" width="280" height="13" rx="4" fill="#fbbf24" opacity="0.13"/>
    <rect x="462" y="320" width="320" height="13" rx="4" fill="#fbbf24" opacity="0.11"/>
    <rect x="462" y="348" width="240" height="13" rx="4" fill="#fbbf24" opacity="0.09"/>
    <!-- Small node dot accent -->
    <circle cx="860" cy="510" r="10" fill="#fbbf24" opacity="0.30"/>
  </g>

  <!-- Front hero slide (centered, upright) -->
  <rect x="490" y="195" width="620" height="430" rx="14" fill="url(#slide3)" opacity="0.90"/>
  <!-- Hero slide: decorative content bars -->
  <rect x="524" y="278" width="400" height="22" rx="5" fill="#78350f" opacity="0.55"/>
  <rect x="524" y="322" width="300" height="14" rx="4" fill="#78350f" opacity="0.40"/>
  <rect x="524" y="352" width="340" height="14" rx="4" fill="#78350f" opacity="0.35"/>
  <rect x="524" y="382" width="260" height="14" rx="4" fill="#78350f" opacity="0.30"/>
  <!-- Hero slide: bold amber top bar (header strip) -->
  <rect x="490" y="195" width="620" height="48" rx="14" fill="#c2410c" opacity="0.85"/>
  <rect x="490" y="219" width="620" height="24" rx="0" fill="#c2410c" opacity="0.85"/>
  <!-- Node dot on hero slide corner -->
  <circle cx="1070" cy="580" r="12" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1070" cy="580" r="6" fill="#fbbf24" opacity="0.90"/>

  <!-- Connection line from node dot to lower area (networking metaphor) -->
  <line x1="1070" y1="580" x2="1200" y2="670" stroke="#fbbf24" stroke-width="2" opacity="0.30"/>
  <circle cx="1200" cy="670" r="7" fill="#fbbf24" opacity="0.25"/>

  <!-- Amber horizontal accent line below slides -->
  <rect x="125" y="650" width="1350" height="2" rx="1" fill="url(#accent)" opacity="0.45"/>

  <!-- Layer 3: Corner decoration (outside safe zone, intentionally clippable) -->
  <circle cx="80" cy="80" r="60" fill="#c2410c" opacity="0.08"/>
  <circle cx="1520" cy="820" r="80" fill="#d97706" opacity="0.07"/>
  <circle cx="1540" cy="100" r="45" fill="#9a3309" opacity="0.10"/>
</svg>
