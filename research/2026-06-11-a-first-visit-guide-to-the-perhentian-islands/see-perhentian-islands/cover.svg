<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.62" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e63"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- hero: setting sun glow over Coral Bay, centred in safe zone -->
  <circle cx="800" cy="430" r="320" fill="url(#sun)"/>
  <circle cx="800" cy="430" r="150" fill="#fef3ec" opacity="0.95"/>

  <!-- layered sea with warm sun reflection band -->
  <path d="M0,560 Q400,535 800,560 Q1200,585 1600,560 L1600,900 L0,900 Z" fill="url(#sea)"/>
  <path d="M0,560 Q400,535 800,560 Q1200,585 1600,560 L1600,620 L0,620 Z" fill="#fbbf24" opacity="0.55"/>

  <!-- beach / headland curve, decorative foreground -->
  <path d="M0,720 Q500,660 1000,730 Q1300,770 1600,705 L1600,900 L0,900 Z" fill="#78350f" opacity="0.9"/>
  <path d="M0,760 Q520,710 1080,780 Q1340,815 1600,760 L1600,900 L0,900 Z" fill="#c2410c" opacity="0.85"/>
</svg>
