<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="470" r="300" fill="url(#sun)"/>

  <!-- mosque silhouette: dome + finial + two minarets -->
  <g fill="url(#dome)">
    <!-- left minaret -->
    <rect x="560" y="300" width="40" height="360"/>
    <path d="M560 300 q20 -70 40 0 z"/>
    <circle cx="580" cy="288" r="16"/>
    <!-- right minaret -->
    <rect x="1000" y="300" width="40" height="360"/>
    <path d="M1000 300 q20 -70 40 0 z"/>
    <circle cx="1020" cy="288" r="16"/>
    <!-- prayer hall base -->
    <rect x="640" y="500" width="320" height="160"/>
    <!-- central dome (onion) -->
    <path d="M660 500 q140 -260 280 0 q-140 -70 -280 0 z"/>
    <path d="M800 252 q-26 -34 0 -70 q26 36 0 70 z"/>
    <circle cx="800" cy="172" r="18"/>
  </g>

  <!-- water band -->
  <rect x="0" y="660" width="1600" height="240" fill="url(#water)" opacity="0.92"/>
  <path d="M0 660 h1600 v40 q-400 28 -800 0 q-400 -28 -800 0 z" fill="#9a3309" opacity="0.55"/>
</svg>
