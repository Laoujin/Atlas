<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.5" stop-color="#5c2a1a"/>
      <stop offset="0.8" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="470" r="520" fill="url(#sun)" opacity="0.85"/>

  <!-- grill plate hero -->
  <ellipse cx="800" cy="470" rx="330" ry="170" fill="url(#ember)" opacity="0.7"/>
  <circle cx="800" cy="450" r="250" fill="url(#plate)"/>
  <circle cx="800" cy="450" r="250" fill="none" stroke="#d97706" stroke-width="10" opacity="0.85"/>
  <g stroke="#9a3309" stroke-width="9" opacity="0.7">
    <line x1="610" y1="395" x2="990" y2="395"/>
    <line x1="585" y1="450" x2="1015" y2="450"/>
    <line x1="610" y1="505" x2="990" y2="505"/>
  </g>

  <!-- fish silhouette on the grill -->
  <g fill="#fbbf24" opacity="0.92">
    <path d="M690 450 C 740 400, 880 400, 945 450 C 880 500, 740 500, 690 450 Z"/>
    <path d="M690 450 L 625 410 L 650 450 L 625 490 Z"/>
    <circle cx="905" cy="440" r="9" fill="#1a0e0e"/>
  </g>

  <!-- palm frond accent (corner decoration) -->
  <g fill="#1a0e0e" opacity="0.9">
    <path d="M1600 0 C 1430 70, 1340 200, 1330 360 C 1380 210, 1470 110, 1600 60 Z"/>
    <path d="M1600 0 C 1500 130, 1480 280, 1520 440 C 1520 270, 1560 130, 1600 70 Z"/>
  </g>
</svg>
