<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1593a0"/>
      <stop offset="0.55" stop-color="#0e5566"/>
      <stop offset="1" stop-color="#072a38"/>
    </linearGradient>
    <radialGradient id="shell" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="0.8" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)"/>

  <!-- sun shafts piercing the water (decoration, full-bleed) -->
  <g fill="#bdf0ea" opacity="0.10">
    <polygon points="800,-40 470,940 600,940"/>
    <polygon points="800,-40 770,940 880,940"/>
    <polygon points="800,-40 1010,940 1140,940"/>
  </g>

  <!-- sea turtle hero, centered ~ (800,460) -->
  <g opacity="0.95">
    <!-- flippers -->
    <ellipse cx="575" cy="318" rx="140" ry="58" fill="url(#limb)" transform="rotate(-40 575 318)"/>
    <ellipse cx="1025" cy="318" rx="140" ry="58" fill="url(#limb)" transform="rotate(40 1025 318)"/>
    <ellipse cx="628" cy="648" rx="102" ry="46" fill="url(#limb)" transform="rotate(-52 628 648)"/>
    <ellipse cx="972" cy="648" rx="102" ry="46" fill="url(#limb)" transform="rotate(52 972 648)"/>
    <!-- head -->
    <ellipse cx="800" cy="222" rx="58" ry="52" fill="url(#limb)"/>
    <!-- carapace -->
    <ellipse cx="800" cy="468" rx="236" ry="212" fill="url(#shell)"/>
    <!-- scute divisions -->
    <g stroke="#7c2d10" stroke-width="6" stroke-linecap="round" opacity="0.55" fill="none">
      <ellipse cx="800" cy="468" rx="70" ry="150"/>
      <path d="M800 318 L730 256 M800 318 L870 256"/>
      <path d="M730 468 L573 372 M870 468 L1027 372"/>
      <path d="M730 468 L600 620 M870 468 L1000 620"/>
      <path d="M800 618 L740 668 M800 618 L860 668"/>
    </g>
  </g>
</svg>
