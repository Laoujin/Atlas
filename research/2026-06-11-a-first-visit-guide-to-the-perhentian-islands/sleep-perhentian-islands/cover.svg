<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed warm sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <!-- low sun glow -->
  <circle cx="800" cy="430" r="420" fill="url(#sun)"/>

  <!-- calm water -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#water)"/>
  <path d="M0 660 q 200 -22 400 0 t 400 0 t 400 0 t 400 0 v 240 H0 Z" fill="#0e7490" opacity="0.25"/>
  <path d="M0 730 q 240 -26 480 0 t 480 0 t 480 0 v 170 H0 Z" fill="#9a3309" opacity="0.22"/>

  <!-- hero: A-frame chalet on stilts over the water -->
  <g>
    <!-- reflection -->
    <path d="M800 760 L 968 620 L 632 620 Z" fill="#78350f" opacity="0.22"/>
    <!-- stilts -->
    <rect x="690" y="560" width="22" height="70" fill="#5c2a1a" opacity="0.85"/>
    <rect x="888" y="560" width="22" height="70" fill="#5c2a1a" opacity="0.85"/>
    <!-- deck -->
    <rect x="650" y="548" width="300" height="20" rx="4" fill="#9a3309" opacity="0.9"/>
    <!-- A-frame roof -->
    <path d="M800 200 L 980 558 L 620 558 Z" fill="url(#roof)"/>
    <!-- ridge highlight + door void -->
    <path d="M800 200 L 808 216 L 808 558 L 792 558 L 792 216 Z" fill="#fbbf24" opacity="0.35"/>
    <rect x="762" y="448" width="76" height="110" rx="6" fill="#1a0e0e" opacity="0.55"/>
  </g>

  <!-- decoration: palm leaning in from the left edge -->
  <g opacity="0.9">
    <path d="M250 560 q 26 -180 70 -300" fill="none" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>
    <path d="M320 262 q -120 -10 -190 30 q 110 -8 180 22 Z" fill="#9a3309" opacity="0.8"/>
    <path d="M320 262 q -70 -100 -150 -120 q 70 40 110 130 Z" fill="#c2410c" opacity="0.8"/>
    <path d="M320 262 q 110 -70 210 -58 q -110 30 -170 92 Z" fill="#d97706" opacity="0.8"/>
  </g>
</svg>
