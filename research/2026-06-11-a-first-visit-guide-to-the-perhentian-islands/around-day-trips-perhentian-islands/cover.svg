<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fde2cd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8bd"/>
      <stop offset="1" stop-color="#2f7d83"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="200" r="190" fill="url(#sun)"/>

  <rect y="430" width="1600" height="470" fill="url(#sea)"/>

  <!-- island humps on the horizon -->
  <path d="M 300,432 Q 420,338 545,432 Z" fill="#9a3309" opacity="0.9"/>
  <path d="M 1070,434 Q 1235,356 1385,434 Z" fill="#78350f" opacity="0.9"/>

  <!-- gentle sea wave bands -->
  <path d="M 0,505 Q 400,488 800,505 T 1600,505 L 1600,540 L 0,540 Z" fill="#bfe0e1" opacity="0.35"/>
  <path d="M 0,640 Q 520,620 1040,642 T 1600,640 L 1600,690 L 0,690 Z" fill="#1f6c72" opacity="0.4"/>

  <!-- dotted island-hopping route -->
  <path d="M 545,424 Q 800,580 1075,428" fill="none" stroke="#fef3ec" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.85"/>

  <!-- speedboat wake -->
  <path d="M 668,498 C 560,500 480,524 372,566" fill="none" stroke="#eef6f6" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <path d="M 672,508 C 580,524 520,550 438,592" fill="none" stroke="#eef6f6" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

  <!-- speedboat hero -->
  <path d="M 800,470 L 858,470 L 848,448 L 814,448 Z" fill="#d97706"/>
  <path d="M 665,486 L 872,484 L 984,500 L 872,516 C 758,520 690,512 665,506 Z" fill="url(#hull)"/>
  <path d="M 700,489 L 940,500 L 700,503 Z" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="820" cy="528" rx="170" ry="10" fill="#1c5a60" opacity="0.45"/>
</svg>
