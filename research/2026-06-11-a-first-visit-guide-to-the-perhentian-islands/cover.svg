<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fde4c8"/>
      <stop offset="1" stop-color="#fbcf9a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="0.35" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="isle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- setting sun glow -->
  <circle cx="800" cy="370" r="300" fill="url(#sun)"/>
  <circle cx="800" cy="372" r="92" fill="#fbbf24" opacity="0.9"/>

  <!-- sea -->
  <path d="M0 540 H1600 V900 H0 Z" fill="url(#sea)"/>
  <!-- shimmer reflection of sun -->
  <path d="M735 540 H865 L905 900 H695 Z" fill="#fde68a" opacity="0.45"/>
  <!-- wave bands -->
  <path d="M0 612 Q400 596 800 612 T1600 612 V650 Q1200 636 800 650 T0 650 Z" fill="#5eead4" opacity="0.4"/>
  <path d="M0 720 Q420 700 800 720 T1600 720 V770 Q1180 750 800 770 T0 770 Z" fill="#99f6e4" opacity="0.3"/>

  <!-- twin islands (backlit silhouettes) -->
  <path d="M520 541 Q560 460 700 420 Q840 460 880 541 Z" fill="url(#isle)"/>
  <path d="M905 541 Q955 478 1000 462 Q1055 478 1095 541 Z" fill="url(#isle)" opacity="0.92"/>
  <!-- sand line -->
  <path d="M520 541 H880" stroke="#fde8c8" stroke-width="4" opacity="0.7"/>
  <path d="M905 541 H1095" stroke="#fde8c8" stroke-width="3" opacity="0.6"/>

  <!-- palms on left island -->
  <g fill="none" stroke="#5c2a1a" stroke-width="8" stroke-linecap="round">
    <path d="M700 432 Q694 360 712 300"/>
    <path d="M712 300 Q672 280 632 300" stroke-width="7"/>
    <path d="M712 300 Q688 262 656 248" stroke-width="7"/>
    <path d="M712 300 Q716 256 700 220" stroke-width="7"/>
    <path d="M712 300 Q748 262 786 252" stroke-width="7"/>
    <path d="M712 300 Q760 282 800 304" stroke-width="7"/>
  </g>
  <!-- palm on right island -->
  <g fill="none" stroke="#5c2a1a" stroke-width="6" stroke-linecap="round">
    <path d="M1000 470 Q996 418 1010 378"/>
    <path d="M1010 378 Q982 366 956 380"/>
    <path d="M1010 378 Q1000 346 980 332"/>
    <path d="M1010 378 Q1016 344 1004 316"/>
    <path d="M1010 378 Q1040 348 1068 348"/>
  </g>
</svg>
