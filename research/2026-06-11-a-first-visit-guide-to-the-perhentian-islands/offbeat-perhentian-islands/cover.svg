<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1622"/>
      <stop offset="0.55" stop-color="#0d1a1f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)"/>
  <ellipse cx="810" cy="470" rx="620" ry="300" fill="url(#glow)"/>

  <!-- sunken wreck hull silhouette, listing on the seabed -->
  <g fill="#160c0c" opacity="0.92">
    <path d="M430 560 Q700 470 1180 520 L1130 615 Q780 700 470 640 Z"/>
