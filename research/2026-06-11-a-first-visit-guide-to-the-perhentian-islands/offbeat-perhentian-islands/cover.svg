    <path d="M430 560 L470 640 L505 632 L478 556 Z"/>
  </g>
  <path d="M455 642 Q780 706 1135 618" fill="none" stroke="#78350f" stroke-width="6" opacity="0.5"/>

  <!-- bioluminescent plankton drifting up from the wreck -->
  <g fill="url(#spark)">
    <circle cx="560" cy="430" r="22"/>
    <circle cx="690" cy="360" r="14"/>
    <circle cx="845" cy="300" r="26"/>
    <circle cx="980" cy="380" r="12"/>
    <circle cx="1090" cy="320" r="18"/>
    <circle cx="1210" cy="420" r="20"/>
    <circle cx="615" cy="520" r="10"/>
    <circle cx="780" cy="440" r="9"/>
    <circle cx="935" cy="470" r="11"/>
    <circle cx="1140" cy="500" r="13"/>
    <circle cx="500" cy="350" r="9"/>
    <circle cx="1290" cy="350" r="10"/>
  </g>
  <g fill="#fde68a" opacity="0.9">
    <circle cx="560" cy="430" r="4"/>
    <circle cx="845" cy="300" r="5"/>
    <circle cx="1090" cy="320" r="3.5"/>
    <circle cx="1210" cy="420" r="3.5"/>
