<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f6dcc6"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- skeleton: bare wireframe grid -->
  <g opacity="0.9">
    <rect x="190" y="210" width="550" height="480" rx="16" fill="#ffffff" fill-opacity="0.35" stroke="#9a3309" stroke-width="3" stroke-opacity="0.8"/>
    <path d="M190 292 H740" stroke="#9a3309" stroke-width="3" stroke-opacity="0.75"/>
    <path d="M190 372 H740 M190 452 H740 M190 532 H740 M190 612 H740 M373 210 V690 M557 210 V690"
          stroke="#78350f" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="7 8"/>
    <circle cx="190" cy="210" r="7" fill="#c2410c"/>
    <circle cx="740" cy="210" r="7" fill="#c2410c"/>
    <circle cx="190" cy="690" r="7" fill="#c2410c"/>
    <circle cx="740" cy="690" r="7" fill="#c2410c"/>
  </g>

  <!-- design tokens flowing into the shell -->
  <path d="M830 336 H862 M830 412 H862 M830 488 H862 M830 564 H862"
        stroke="#c2410c" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="5 6"/>
  <g opacity="0.95">
    <rect x="770" y="308" width="60" height="56" rx="14" fill="#78350f"/>
    <rect x="770" y="384" width="60" height="56" rx="14" fill="#c2410c"/>
    <rect x="770" y="460" width="60" height="56" rx="14" fill="#d97706"/>
    <rect x="770" y="536" width="60" height="56" rx="14" fill="#fbbf24"/>
  </g>

  <!-- skin: the same grid clothed in tokens -->
  <ellipse cx="1140" cy="712" rx="270" ry="26" fill="#78350f" opacity="0.14"/>
  <g opacity="0.95">
    <rect x="860" y="210" width="550" height="480" rx="18" fill="url(#skin)" stroke="#c2410c" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M878 210 H1392 a18 18 0 0 1 18 18 V292 H860 V228 a18 18 0 0 1 18 -18 Z" fill="url(#head)"/>
    <rect x="890" y="322" width="490" height="52" rx="10" fill="#d97706" opacity="0.30"/>
    <rect x="890" y="398" width="490" height="52" rx="10" fill="#fbbf24" opacity="0.42"/>
    <rect x="890" y="474" width="490" height="52" rx="10" fill="#d97706" opacity="0.30"/>
    <rect x="890" y="550" width="490" height="52" rx="10" fill="#fbbf24" opacity="0.42"/>
    <rect x="1176" y="398" width="204" height="52" rx="10" fill="#9a3309" opacity="0.88"/>
  </g>
</svg>
