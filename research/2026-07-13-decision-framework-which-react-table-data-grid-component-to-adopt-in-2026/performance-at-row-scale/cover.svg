<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="press" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rowsDim" patternUnits="userSpaceOnUse" width="480" height="26" patternTransform="translate(560 168)">
      <rect x="18" y="7" width="118" height="11" rx="3" fill="#78350f" opacity="0.55"/>
      <rect x="154" y="7" width="176" height="11" rx="3" fill="#78350f" opacity="0.45"/>
      <rect x="348" y="7" width="112" height="11" rx="3" fill="#78350f" opacity="0.55"/>
    </pattern>
    <pattern id="rowsLit" patternUnits="userSpaceOnUse" width="480" height="26" patternTransform="translate(560 168)">
      <rect x="18" y="7" width="118" height="11" rx="3" fill="#fef3ec" opacity="0.92"/>
      <rect x="154" y="7" width="176" height="11" rx="3" fill="#fef3ec" opacity="0.7"/>
      <rect x="348" y="7" width="112" height="11" rx="3" fill="#fef3ec" opacity="0.92"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="560" rx="520" ry="300" fill="url(#glow)"/>

  <!-- the vast unrendered row column, running up into a hard ceiling -->
  <g>
    <rect x="560" y="156" width="480" height="634" rx="16" fill="url(#stack)"/>
    <rect x="560" y="156" width="480" height="634" rx="16" fill="url(#rowsDim)" opacity="0.45"/>
    <rect x="560" y="156" width="480" height="120" fill="url(#press)"/>
  </g>

  <!-- the cap the stack cannot grow past -->
  <rect x="480" y="118" width="640" height="26" rx="8" fill="#78350f" opacity="0.92"/>
  <rect x="480" y="150" width="640" height="6" rx="3" fill="#9a3309" opacity="0.35"/>

  <!-- hero: the small band of actually-rendered rows -->
  <g>
    <rect x="560" y="480" width="480" height="160" rx="12" fill="url(#band)" opacity="0.95"/>
    <rect x="560" y="480" width="480" height="160" rx="12" fill="url(#rowsLit)"/>
    <rect x="538" y="458" width="524" height="204" rx="18" fill="none" stroke="#9a3309" stroke-width="4" opacity="0.75"/>
    <rect x="538" y="546" width="10" height="28" rx="5" fill="#9a3309" opacity="0.8"/>
    <rect x="1052" y="546" width="10" height="28" rx="5" fill="#9a3309" opacity="0.8"/>
  </g>
</svg>
