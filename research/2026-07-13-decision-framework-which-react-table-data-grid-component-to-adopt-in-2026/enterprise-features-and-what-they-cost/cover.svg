<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="452" rx="660" ry="150" fill="url(#glow)"/>

  <g transform="translate(96,0) skewX(-12)">
    <!-- gated tiers: above the line -->
    <rect x="420" y="201" width="760" height="84" rx="10" fill="#c2410c" fill-opacity="0.08" stroke="#9a3309" stroke-opacity="0.38" stroke-width="2.5"/>
    <rect x="420" y="297" width="760" height="84" rx="10" fill="#c2410c" fill-opacity="0.13" stroke="#9a3309" stroke-opacity="0.5" stroke-width="2.5"/>

    <!-- the licence line -->
    <rect x="350" y="401" width="900" height="8" rx="4" fill="url(#line)"/>

    <!-- included tiers: below the line -->
    <rect x="420" y="429" width="760" height="84" rx="10" fill="url(#slab)" fill-opacity="0.95"/>
    <rect x="420" y="525" width="760" height="84" rx="10" fill="url(#slab)" fill-opacity="0.82"/>
    <rect x="420" y="621" width="760" height="84" rx="10" fill="#78350f" fill-opacity="0.72"/>
  </g>
</svg>
