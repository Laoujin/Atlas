<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3e9db"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="440" rx="720" ry="430" fill="url(#glow)"/>

  <!-- hero: the table plate -->
  <ellipse cx="800" cy="706" rx="450" ry="26" fill="#78350f" opacity="0.12"/>
  <rect x="340" y="210" width="920" height="480" rx="16" fill="url(#plate)" stroke="#78350f" stroke-opacity="0.28" stroke-width="2"/>

  <!-- header band -->
  <path d="M340 226a16 16 0 0 1 16-16h888a16 16 0 0 1 16 16v62H340z" fill="url(#rust)"/>

  <!-- lattice -->
  <g stroke="#78350f" stroke-opacity="0.2" stroke-width="2">
    <path d="M524 288V690M708 288V690M892 288V690M1076 288V690"/>
    <path d="M340 368h920M340 448h920M340 528h920M340 608h920"/>
  </g>

  <!-- the columns you don't write yourself -->
  <path d="M892 288h368v386a16 16 0 0 1-16 16H892z" fill="url(#wall)"/>
  <path d="M892 210v480" stroke="#9a3309" stroke-width="6" stroke-opacity="0.9"/>
  <path d="M892 210v480" stroke="#fbbf24" stroke-width="14" stroke-opacity="0.18"/>

  <!-- the chosen cell -->
  <rect x="524" y="368" width="184" height="80" fill="url(#cell)" opacity="0.94"/>
  <rect x="524" y="368" width="184" height="80" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.75"/>

  <!-- data you hand-roll -->
  <g fill="#78350f" opacity="0.22">
    <rect x="372" y="398" width="112" height="12" rx="6"/>
    <rect x="372" y="478" width="86" height="12" rx="6"/>
    <rect x="372" y="558" width="120" height="12" rx="6"/>
    <rect x="372" y="638" width="72" height="12" rx="6"/>
    <rect x="748" y="478" width="98" height="12" rx="6"/>
    <rect x="748" y="638" width="76" height="12" rx="6"/>
  </g>
</svg>
