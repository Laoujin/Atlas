<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="460" rx="720" ry="430" fill="url(#glow)"/>

  <g transform="rotate(-5 800 450)">
    <!-- headless tier: structure only, columns you draw yourself -->
    <rect x="300" y="188" width="1000" height="112" rx="10" fill="#fef3ec" fill-opacity="0.55" stroke="#c2410c" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M540 188V300M780 188V300M1020 188V300M300 232H1300" stroke="#c2410c" stroke-opacity="0.32" stroke-width="2.5" fill="none"/>

    <!-- hero tier: the batteries-included grid -->
    <rect x="278" y="332" width="1044" height="242" rx="14" fill="url(#hero)"/>
    <rect x="278" y="332" width="1044" height="52" rx="14" fill="#78350f" fill-opacity="0.38"/>
    <rect x="530" y="384" width="230" height="190" fill="#fbbf24" fill-opacity="0.12"/>
    <rect x="1010" y="384" width="230" height="190" fill="#fbbf24" fill-opacity="0.12"/>
    <rect x="790" y="424" width="190" height="62" rx="6" fill="#fbbf24" fill-opacity="0.92"/>
    <path d="M278 486H1322" stroke="#78350f" stroke-opacity="0.3" stroke-width="2.5"/>

    <!-- commercial tier: fully filled chrome -->
    <rect x="322" y="606" width="956" height="112" rx="10" fill="#78350f" fill-opacity="0.82"/>
    <rect x="322" y="606" width="956" height="34" rx="10" fill="#fbbf24" fill-opacity="0.22"/>
    <rect x="600" y="662" width="180" height="34" rx="5" fill="#faf8f2" fill-opacity="0.16"/>
    <rect x="860" y="662" width="180" height="34" rx="5" fill="#faf8f2" fill-opacity="0.16"/>
  </g>
</svg>
