<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3a1a0a" />
      <stop offset="100%" stop-color="#0d0605" />
    </radialGradient>

    <!-- Table surface warm glow -->
    <radialGradient id="tableGlow" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0" />
    </radialGradient>

    <!-- Hero plate gradient -->
    <radialGradient id="plateMain" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f0eadb" />
      <stop offset="60%" stop-color="#d6cabb" />
      <stop offset="100%" stop-color="#b8a898" />
    </radialGradient>

    <!-- Inner plate rim gradient -->
    <radialGradient id="plateInner" cx="48%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e8dfd0" stop-opacity="0.90" />
    </radialGradient>

    <!-- Food element gradient -->
    <radialGradient id="foodGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.80" />
    </radialGradient>

    <!-- Sauce arc gradient -->
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.60" />
    </linearGradient>

    <!-- Wine glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#fef3ec" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.08" />
    </linearGradient>

    <!-- Candle flame gradient -->
    <radialGradient id="flameGrad" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient halo for candle -->
    <radialGradient id="candleHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Plate shadow -->
    <radialGradient id="plateShadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#0d0605" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0d0605" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)" />
  <rect width="1600" height="900" fill="url(#tableGlow)" />

  <!-- Subtle table surface line (horizon) -->
  <ellipse cx="800" cy="690" rx="780" ry="60" fill="#1a0e0e" opacity="0.55" />
  <ellipse cx="800" cy="700" rx="680" ry="28" fill="#3a1a0a" opacity="0.40" />

  <!-- Layer 2: Hero element — fine dining plate composition, centered at (800, 450) -->

  <!-- Plate drop shadow -->
  <ellipse cx="800" cy="582" rx="290" ry="32" fill="url(#plateShadow)" />

  <!-- Outer plate rim -->
  <circle cx="800" cy="450" r="268" fill="url(#plateMain)" opacity="0.92" />

  <!-- Plate rim band (subtle raised edge) -->
  <circle cx="800" cy="450" r="268" fill="none" stroke="#c8bfb0" stroke-width="18" opacity="0.35" />

  <!-- Inner plate well -->
  <circle cx="800" cy="450" r="210" fill="url(#plateInner)" opacity="0.88" />

  <!-- Inner plate well shadow rim -->
  <circle cx="800" cy="450" r="210" fill="none" stroke="#b0a090" stroke-width="6" opacity="0.25" />

  <!-- Sauce swipe arc — artistic plating gesture -->
  <path d="M 622 480 Q 740 370 920 440 Q 980 465 950 510" fill="none" stroke="url(#sauceGrad)" stroke-width="22" stroke-linecap="round" opacity="0.82" />

  <!-- Secondary sauce dot cluster -->
  <circle cx="930" cy="416" r="10" fill="#c2410c" opacity="0.70" />
  <circle cx="948" cy="428" r="6" fill="#9a3309" opacity="0.55" />
  <circle cx="912" cy="404" r="5" fill="#d97706" opacity="0.50" />

  <!-- Hero food element — central composed bite / quenelle -->
  <ellipse cx="780" cy="448" rx="78" ry="42" fill="url(#foodGrad)" opacity="0.93" />
  <!-- Highlight sheen on food -->
  <ellipse cx="766" cy="436" rx="28" ry="14" fill="#fef3ec" opacity="0.30" />

  <!-- Micro herb accent (three thin leaf shapes) -->
  <ellipse cx="790" cy="413" rx="5" ry="15" fill="#78350f" opacity="0.75" transform="rotate(-18 790 413)" />
  <ellipse cx="806" cy="408" rx="4" ry="13" fill="#9a3309" opacity="0.65" transform="rotate(8 806 408)" />
  <ellipse cx="775" cy="410" rx="3" ry="11" fill="#c2410c" opacity="0.55" transform="rotate(-35 775 410)" />

  <!-- Layer 3: Atmospheric decoration outside hero zone -->

  <!-- Wine glass silhouette — right side, partially outside safe zone edge -->
  <!-- Bowl -->
  <ellipse cx="1210" cy="398" rx="52" ry="36" fill="url(#glassGrad)" stroke="#faf8f2" stroke-width="1.5" stroke-opacity="0.18" />
  <!-- Stem -->
  <rect x="1207" y="432" width="6" height="130" fill="#faf8f2" opacity="0.10" rx="3" />
  <!-- Base -->
  <ellipse cx="1210" cy="562" rx="36" ry="8" fill="#faf8f2" opacity="0.08" />
  <!-- Wine fill -->
  <ellipse cx="1210" cy="418" rx="40" ry="22" fill="#9a3309" opacity="0.30" />

  <!-- Candle left side -->
  <!-- Halo -->
  <ellipse cx="390" cy="310" rx="80" ry="80" fill="url(#candleHalo)" />
  <!-- Candle body -->
  <rect x="378" y="330" width="24" height="90" fill="#faf8f2" opacity="0.14" rx="4" />
  <!-- Flame -->
  <ellipse cx="390" cy="318" rx="11" ry="18" fill="url(#flameGrad)" />
  <ellipse cx="390" cy="322" rx="5" ry="9" fill="#fbbf24" opacity="0.90" />

  <!-- Edge vignette — deepens corners for drama -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="#0d0605" stop-opacity="0" />
    <stop offset="100%" stop-color="#0d0605" stop-opacity="0.72" />
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)" />
</svg>
