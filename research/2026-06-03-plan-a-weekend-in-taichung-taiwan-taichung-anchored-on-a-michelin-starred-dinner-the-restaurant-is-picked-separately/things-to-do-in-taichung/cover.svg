<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.72" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.4" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow, hero centre -->
  <circle cx="800" cy="470" r="280" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="470" r="120" fill="#fef3ec" opacity="0.85"/>

  <!-- tidal flat with mirrored reflection band -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#flat)"/>
  <ellipse cx="800" cy="620" rx="360" ry="34" fill="#fef3ec" opacity="0.55"/>
  <ellipse cx="800" cy="690" rx="240" ry="20" fill="#fbbf24" opacity="0.4"/>

  <!-- wind turbine hero: tower + three blades -->
  <g fill="#1a0e0e" opacity="0.9">
    <polygon points="794,615 806,615 802,360 798,360"/>
    <circle cx="800" cy="356" r="14"/>
    <path d="M800 356 L806 200 Q800 190 794 196 Z"/>
    <path d="M800 356 L938 430 Q944 420 938 412 Z"/>
    <path d="M800 356 L668 440 Q664 428 672 424 Z"/>
  </g>

  <!-- second, smaller turbine for depth, outside hero centre -->
  <g fill="#1a0e0e" opacity="0.55">
    <polygon points="1126,612 1134,612 1131,500 1129,500"/>
    <circle cx="1130" cy="497" r="8"/>
    <path d="M1130 497 L1133 410 Q1130 405 1127 408 Z"/>
    <path d="M1130 497 L1205 538 Q1208 532 1204 528 Z"/>
    <path d="M1130 497 L1058 542 Q1056 535 1060 532 Z"/>
  </g>

  <!-- foreground horizon ground -->
  <rect x="0" y="730" width="1600" height="170" fill="#5c2a1a" opacity="0.85"/>
  <path d="M0 730 Q400 712 800 728 T1600 726 L1600 760 L0 760 Z" fill="#78350f" opacity="0.7"/>
</svg>
