<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Abstract cover: a single schema document refracted through a prism into four differently shaped generated clients">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EDE2"/>
      <stop offset="1" stop-color="#E7D5C1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#F9F2E8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F9F2E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6A468"/>
      <stop offset="1" stop-color="#DE8B3E"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9772F"/>
      <stop offset="1" stop-color="#C25A29"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B94E24"/>
      <stop offset="1" stop-color="#9A3C1D"/>
    </linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A4A2E"/>
      <stop offset="1" stop-color="#6E4131"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332C27"/>
      <stop offset="1" stop-color="#201B18"/>
    </linearGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="500" cy="400" r="470" fill="url(#glow)"/>

  <!-- horizon anchors -->
  <rect x="0" y="742" width="1200" height="58" fill="#241F1C" opacity="0.06"/>
  <circle cx="1010" cy="400" r="330" fill="none" stroke="#8A4A2E" stroke-opacity="0.14" stroke-width="2"/>

  <!-- refracted fan: one spec becoming four differently shaped clients -->
  <g opacity="0.94">
    <path d="M515,235 C700,235 860,80 1040,80 L1040,225 C860,225 700,313 515,313 Z" fill="url(#b1)"/>
    <path d="M515,321 C700,321 860,245 1040,245 L1040,390 C860,390 700,399 515,399 Z" fill="url(#b2)"/>
    <path d="M515,407 C700,407 860,410 1040,410 L1040,555 C860,555 700,485 515,485 Z" fill="url(#b3)"/>
    <path d="M515,493 C700,493 860,575 1040,575 L1040,720 C860,720 700,571 515,571 Z" fill="url(#b4)"/>
  </g>

  <!-- flow lines through the fan -->
  <g fill="none" stroke="#F6EDE2" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M540,274 C720,274 870,152 1030,152"/>
    <path d="M540,360 C720,360 870,317 1030,317"/>
    <path d="M540,446 C720,446 870,482 1030,482"/>
    <path d="M540,532 C720,532 870,647 1030,647"/>
  </g>

  <!-- generated client shapes: same source, four silhouettes -->
  <g>
    <circle cx="1108" cy="152" r="54" fill="#241F1C"/>
    <circle cx="1108" cy="152" r="18" fill="#E6A468"/>

    <path d="M1108,262 L1163,317 L1108,372 L1053,317 Z" fill="#241F1C"/>
    <path d="M1108,296 L1129,317 L1108,338 L1087,317 Z" fill="#D9772F"/>

    <path d="M1055,455 L1108,425 L1161,455 L1161,510 L1108,540 L1055,510 Z" fill="#241F1C"/>
    <circle cx="1108" cy="482" r="18" fill="#B94E24"/>

    <rect x="1054" y="593" width="108" height="108" rx="26" fill="#241F1C"/>
    <rect x="1090" y="629" width="36" height="36" rx="10" fill="#B9846A"/>
  </g>

  <!-- prism / codegen -->
  <path d="M470,240 L516,212 L516,588 L470,560 Z" fill="url(#prism)"/>
  <path d="M470,240 L516,212 L516,238 L470,266 Z" fill="#C25A29" opacity="0.85"/>
  <path d="M470,534 L516,562 L516,588 L470,560 Z" fill="#8A4A2E" opacity="0.7"/>

  <!-- single source spec: stacked sheets -->
  <rect x="176" y="281" width="262" height="292" rx="14" fill="#CDA98A" opacity="0.55"/>
  <rect x="163" y="268" width="262" height="292" rx="14" fill="#E0BE9D" opacity="0.75"/>
  <rect x="150" y="255" width="262" height="292" rx="14" fill="#FBF4EA" stroke="#241F1C" stroke-width="4"/>

  <g>
    <circle cx="188" cy="316" r="9" fill="#B94E24"/>
    <rect x="212" y="306" width="168" height="20" rx="10" fill="#241F1C" opacity="0.82"/>

    <circle cx="188" cy="372" r="9" fill="#D9772F"/>
    <rect x="212" y="362" width="118" height="20" rx="10" fill="#C25A29"/>

    <circle cx="188" cy="428" r="9" fill="#B94E24"/>
    <rect x="212" y="418" width="150" height="20" rx="10" fill="#8A4A2E" opacity="0.75"/>

    <circle cx="188" cy="484" r="9" fill="#D9772F"/>
    <rect x="212" y="474" width="92" height="20" rx="10" fill="#C25A29" opacity="0.6"/>
  </g>

  <!-- spec into prism -->
  <path d="M412,400 L470,400" stroke="#241F1C" stroke-width="6" stroke-linecap="round"/>
  <circle cx="440" cy="400" r="12" fill="#FBF4EA" stroke="#241F1C" stroke-width="5"/>

  <rect width="1200" height="800" filter="url(#paper)" opacity="0.05"/>
</svg>
