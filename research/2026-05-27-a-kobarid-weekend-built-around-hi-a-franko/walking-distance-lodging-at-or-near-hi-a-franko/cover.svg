<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm valley glow behind hero -->
  <ellipse cx="800" cy="540" rx="700" ry="280" fill="url(#glow)"/>

  <!-- distant hill -->
  <path d="M0,560 L240,420 L520,500 L820,380 L1180,470 L1430,400 L1600,460 L1600,900 L0,900 Z" fill="url(#hill1)"/>

  <!-- nearer hill -->
  <path d="M0,650 L300,560 L640,610 L960,540 L1280,600 L1600,560 L1600,900 L0,900 Z" fill="url(#hill2)" opacity="0.85"/>

  <!-- lane (subtle horizontal band) -->
  <rect x="0" y="760" width="1600" height="6" fill="#78350f" opacity="0.25"/>

  <!-- small satellite apartment (left, behind/beside) -->
  <g opacity="0.9">
    <rect x="520" y="600" width="180" height="150" fill="url(#house)" stroke="#78350f" stroke-width="2"/>
    <polygon points="510,600 710,600 610,520" fill="url(#roof2)"/>
    <rect x="555" y="650" width="30" height="40" fill="#fbbf24" opacity="0.85"/>
    <rect x="635" y="650" width="30" height="40" fill="#fbbf24" opacity="0.7"/>
    <rect x="595" y="710" width="40" height="40" fill="#5c2a1a" opacity="0.7"/>
  </g>

  <!-- HERO: farmhouse guesthouse, centered ~ (900, 500) -->
  <g>
    <!-- main body -->
    <rect x="740" y="440" width="430" height="320" fill="url(#house)" stroke="#5c2a1a" stroke-width="3"/>
    <!-- roof -->
    <polygon points="720,440 1190,440 955,300" fill="url(#roof)" stroke="#5c2a1a" stroke-width="3"/>
    <!-- chimney -->
    <rect x="1050" y="320" width="32" height="70" fill="#78350f"/>
    <!-- second-floor windows -->
    <rect x="790" y="480" width="55" height="70" fill="#fbbf24" opacity="0.9"/>
    <rect x="885" y="480" width="55" height="70" fill="#fbbf24" opacity="0.95"/>
    <rect x="980" y="480" width="55" height="70" fill="#fbbf24" opacity="0.9"/>
    <rect x="1075" y="480" width="55" height="70" fill="#fbbf24" opacity="0.85"/>
    <!-- window frames -->
    <line x1="817.5" y1="480" x2="817.5" y2="550" stroke="#5c2a1a" stroke-width="2"/>
    <line x1="912.5" y1="480" x2="912.5" y2="550" stroke="#5c2a1a" stroke-width="2"/>
    <line x1="1007.5" y1="480" x2="1007.5" y2="550" stroke="#5c2a1a" stroke-width="2"/>
    <line x1="1102.5" y1="480" x2="1102.5" y2="550" stroke="#5c2a1a" stroke-width="2"/>
    <!-- ground-floor windows + door -->
    <rect x="790" y="610" width="55" height="80" fill="#fbbf24" opacity="0.95"/>
    <rect x="885" y="610" width="55" height="80" fill="#d97706" opacity="0.85"/>
    <rect x="1075" y="610" width="55" height="80" fill="#fbbf24" opacity="0.9"/>
    <!-- door (hero accent) -->
    <rect x="975" y="600" width="70" height="160" fill="#c2410c" stroke="#5c2a1a" stroke-width="3"/>
    <circle cx="1030" cy="685" r="4" fill="#fbbf24"/>
  </g>

  <!-- small chimney smoke wisp -->
  <path d="M1066 320 Q1080 290 1060 260 Q1040 235 1060 210" stroke="#78350f" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round"/>
</svg>
