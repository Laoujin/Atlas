<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="chaletRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="chaletWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind peaks -->
  <circle cx="1050" cy="380" r="280" fill="url(#sun)"/>

  <!-- distant peaks layer -->
  <path d="M 0 540 L 180 380 L 340 460 L 520 310 L 720 420 L 900 290 L 1080 400 L 1280 330 L 1460 420 L 1600 380 L 1600 620 L 0 620 Z" fill="url(#farPeak)" opacity="0.7"/>

  <!-- mid peaks (hero ridge) -->
  <path d="M 120 620 L 320 440 L 480 540 L 680 360 L 880 500 L 1060 380 L 1240 500 L 1420 420 L 1480 620 Z" fill="url(#midPeak)" opacity="0.92"/>

  <!-- snow caps on mid peaks -->
  <path d="M 660 380 L 680 360 L 700 380 L 690 395 Z M 1050 398 L 1060 380 L 1075 400 Z M 310 458 L 320 440 L 335 460 Z" fill="#faf8f2" opacity="0.85"/>

  <!-- valley / river ribbon -->
  <path d="M 0 700 Q 400 670 800 690 T 1600 700 L 1600 740 Q 1200 760 800 735 T 0 740 Z" fill="#c2410c" opacity="0.55"/>
  <path d="M 0 712 Q 420 690 800 705 T 1600 715" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>

  <!-- chalet hero, centered around (800, 560), inside safe zone -->
  <!-- chalet body -->
  <rect x="720" y="560" width="200" height="140" fill="url(#chaletWall)" opacity="0.95"/>
  <!-- stone base -->
  <rect x="720" y="670" width="200" height="30" fill="#5c2a1a" opacity="0.9"/>
  <!-- pitched roof -->
  <path d="M 700 565 L 820 470 L 940 565 Z" fill="url(#chaletRoof)"/>
  <!-- roof overhang shadow -->
  <path d="M 700 565 L 940 565 L 925 580 L 715 580 Z" fill="#5c2a1a" opacity="0.7"/>
  <!-- balcony band -->
  <rect x="720" y="620" width="200" height="14" fill="#78350f" opacity="0.85"/>
  <!-- windows (two pairs) -->
  <rect x="745" y="585" width="28" height="28" fill="#78350f" opacity="0.85"/>
  <rect x="790" y="585" width="28" height="28" fill="#78350f" opacity="0.85"/>
  <rect x="835" y="585" width="28" height="28" fill="#78350f" opacity="0.85"/>
  <rect x="880" y="585" width="28" height="28" fill="#78350f" opacity="0.85"/>
  <!-- lower windows -->
  <rect x="755" y="645" width="22" height="22" fill="#fbbf24" opacity="0.85"/>
  <rect x="862" y="645" width="22" height="22" fill="#fbbf24" opacity="0.85"/>
  <!-- door -->
  <rect x="805" y="645" width="30" height="25" fill="#5c2a1a"/>
  <!-- chimney -->
  <rect x="860" y="490" width="18" height="35" fill="#5c2a1a"/>
  <!-- ridge accent -->
  <path d="M 700 565 L 820 470 L 940 565" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>

  <!-- foreground meadow rise -->
  <path d="M 0 740 Q 300 730 600 745 T 1100 750 T 1600 745 L 1600 900 L 0 900 Z" fill="#78350f" opacity="0.85"/>
  <path d="M 0 780 Q 400 770 800 785 T 1600 780" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.7"/>

  <!-- small pine accents flanking chalet -->
  <path d="M 640 700 L 655 660 L 670 700 Z" fill="#5c2a1a" opacity="0.85"/>
  <path d="M 970 700 L 985 655 L 1000 700 Z" fill="#5c2a1a" opacity="0.85"/>
  <path d="M 612 710 L 625 678 L 638 710 Z" fill="#5c2a1a" opacity="0.7"/>
  <path d="M 1010 708 L 1022 678 L 1035 708 Z" fill="#5c2a1a" opacity="0.7"/>
</svg>
