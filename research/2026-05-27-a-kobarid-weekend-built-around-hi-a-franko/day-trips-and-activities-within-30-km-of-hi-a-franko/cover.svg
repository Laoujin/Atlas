<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nearWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind peaks -->
  <circle cx="900" cy="360" r="280" fill="url(#sun)"/>

  <!-- far Julian Alps silhouette (Mangart/Krn) -->
  <polygon points="0,520 180,360 320,440 470,260 620,400 780,200 950,380 1120,280 1280,420 1440,320 1600,460 1600,560 0,560"
           fill="url(#farRange)"/>

  <!-- mid ridge -->
  <polygon points="0,640 140,520 280,580 440,460 600,560 760,480 920,540 1080,440 1240,560 1400,500 1600,580 1600,700 0,700"
           fill="url(#midRange)" opacity="0.9"/>

  <!-- left limestone gorge wall -->
  <polygon points="0,560 240,640 360,720 300,900 0,900" fill="url(#nearWall)"/>
  <polygon points="0,640 180,700 220,820 90,900 0,900" fill="#5c2a1a" opacity="0.6"/>

  <!-- right limestone gorge wall -->
  <polygon points="1600,540 1340,620 1240,720 1320,900 1600,900" fill="url(#nearWall)"/>
  <polygon points="1600,620 1440,690 1400,820 1520,900 1600,900" fill="#5c2a1a" opacity="0.6"/>

  <!-- emerald Soča river winding through gorge (hero) -->
  <path d="M 760,900 C 780,820 720,760 760,680 C 800,600 880,580 840,500 C 800,420 860,380 900,340 L 940,340 C 920,400 880,440 920,500 C 960,580 880,620 840,680 C 800,760 860,820 840,900 Z"
        fill="url(#river)" opacity="0.92"/>

  <!-- river highlights -->
  <path d="M 800,860 C 810,800 770,750 800,690 C 830,620 880,600 855,520 C 835,460 870,410 895,370"
        stroke="#faf8f2" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- waterfall accent on left wall (Kozjak/Boka reference) -->
  <path d="M 220,580 L 215,760 L 230,760 L 235,580 Z" fill="#faf8f2" opacity="0.7"/>
  <ellipse cx="225" cy="765" rx="22" ry="6" fill="#faf8f2" opacity="0.5"/>
</svg>
