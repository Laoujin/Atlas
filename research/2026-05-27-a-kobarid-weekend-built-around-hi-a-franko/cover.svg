<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0e7490" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm valley glow behind house -->
  <ellipse cx="800" cy="560" rx="520" ry="220" fill="url(#glow)"/>

  <!-- far alpine ridge -->
  <path d="M 0 540 L 180 420 L 320 470 L 460 360 L 600 430 L 740 320 L 860 400 L 980 310 L 1120 380 L 1260 330 L 1400 410 L 1600 380 L 1600 700 L 0 700 Z" fill="url(#ridgeFar)" opacity="0.9"/>

  <!-- emerald Soča river curve -->
  <path d="M 120 720 Q 500 690 800 705 T 1480 720 L 1480 740 Q 1100 730 800 728 T 120 740 Z" fill="url(#river)"/>

  <!-- near ridge / valley floor -->
  <path d="M 0 660 L 220 600 L 380 640 L 540 590 L 700 630 L 900 600 L 1080 640 L 1260 605 L 1440 640 L 1600 615 L 1600 900 L 0 900 Z" fill="url(#ridgeNear)"/>

  <!-- farmhouse hero, centered ~(800, 540) -->
  <g>
    <!-- house body -->
    <rect x="720" y="500" width="160" height="140" fill="#1a0e0e" stroke="#78350f" stroke-width="2"/>
    <!-- roof -->
    <polygon points="700,500 800,430 900,500" fill="#1a0e0e" stroke="#78350f" stroke-width="2"/>
    <!-- chimney -->
    <rect x="850" y="450" width="18" height="42" fill="#1a0e0e" stroke="#78350f" stroke-width="1.5"/>
    <!-- glowing window (the anchor) -->
    <rect x="765" y="540" width="70" height="60" fill="url(#window)"/>
    <!-- window mullion -->
    <line x1="800" y1="540" x2="800" y2="600" stroke="#78350f" stroke-width="2"/>
    <line x1="765" y1="570" x2="835" y2="570" stroke="#78350f" stroke-width="2"/>
    <!-- soft window halo -->
    <ellipse cx="800" cy="570" rx="140" ry="60" fill="#fbbf24" opacity="0.18"/>
  </g>

  <!-- a single distant pine, asymmetric, on near ridge -->
  <polygon points="280,610 268,640 292,640" fill="#1a0e0e"/>
  <polygon points="280,590 264,625 296,625" fill="#1a0e0e"/>
  <rect x="278" y="635" width="4" height="12" fill="#1a0e0e"/>

  <!-- rose dusk accent: faint moon/star over peak -->
  <circle cx="1180" cy="260" r="6" fill="#be185d" opacity="0.7"/>
  <circle cx="1180" cy="260" r="14" fill="#be185d" opacity="0.18"/>
</svg>
