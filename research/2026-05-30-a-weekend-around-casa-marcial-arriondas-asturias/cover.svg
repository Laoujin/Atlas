<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a10"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow (hero anchor, centered in safe zone) -->
  <circle cx="800" cy="470" r="360" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="470" r="110" fill="#fef3ec" opacity="0.95"/>

  <!-- Far ridge (Picos de Europa, distant) -->
  <path d="M0,560 L160,470 L290,510 L420,420 L560,490 L700,400 L820,460 L960,380 L1100,450 L1240,410 L1380,470 L1520,430 L1600,460 L1600,900 L0,900 Z"
        fill="url(#ridgeBack)" opacity="0.75"/>

  <!-- Mid ridge -->
  <path d="M0,650 L120,560 L240,610 L380,520 L520,600 L660,510 L800,580 L940,500 L1080,590 L1220,540 L1360,610 L1500,550 L1600,600 L1600,900 L0,900 Z"
        fill="url(#ridgeMid)" opacity="0.9"/>

  <!-- Front ridge (closest, with Sella valley dip) -->
  <path d="M0,760 L140,690 L280,730 L420,670 L560,720 L700,690 L800,740 L900,690 L1040,720 L1180,670 L1320,720 L1460,680 L1600,710 L1600,900 L0,900 Z"
        fill="url(#ridgeFront)"/>

  <!-- Sella river — single sinuous gleam catching the sunset -->
  <path d="M0,820 Q200,795 380,810 T760,800 Q900,795 1040,810 T1400,805 L1600,815 L1600,840 Q1400,830 1240,838 T880,830 Q700,832 520,830 T160,838 L0,845 Z"
        fill="url(#river)"/>
</svg>
