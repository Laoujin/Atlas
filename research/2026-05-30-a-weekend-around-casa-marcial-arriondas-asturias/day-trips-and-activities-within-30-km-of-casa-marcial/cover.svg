<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="peakBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="peakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.32" r="0.18">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Back mountain ridge (Picos de Europa silhouette) -->
  <path d="M 140 600 L 320 380 L 470 470 L 640 280 L 820 410 L 980 300 L 1180 440 L 1340 360 L 1470 500 L 1470 720 L 140 720 Z"
        fill="url(#peakBack)" opacity="0.75"/>

  <!-- Front mountain ridge -->
  <path d="M 140 720 L 280 540 L 420 620 L 580 470 L 740 580 L 900 460 L 1080 590 L 1240 510 L 1400 640 L 1470 600 L 1470 810 L 140 810 Z"
        fill="url(#peakFront)" opacity="0.95"/>

  <!-- Snow caps on back peaks -->
  <path d="M 620 290 L 640 280 L 680 320 L 660 330 Z" fill="#faf8f2" opacity="0.85"/>
  <path d="M 965 310 L 980 300 L 1015 335 L 995 345 Z" fill="#faf8f2" opacity="0.8"/>

  <!-- Sella river arc winding from mountains to foreground -->
  <path d="M 720 560 C 820 600, 880 640, 820 690 C 740 740, 580 760, 420 790 L 360 810 L 880 810 C 940 770, 1020 730, 1060 680 C 1100 630, 1000 590, 880 580 Z"
        fill="url(#river)" opacity="0.9"/>

  <!-- Canoe silhouette on the river (hero accent) -->
  <ellipse cx="780" cy="700" rx="60" ry="9" fill="#78350f" opacity="0.9"/>
  <path d="M 740 698 Q 780 686 820 698 Q 780 710 740 698 Z" fill="#c2410c"/>
  <line x1="755" y1="688" x2="765" y2="672" stroke="#78350f" stroke-width="3" opacity="0.85"/>
  <line x1="800" y1="672" x2="810" y2="688" stroke="#78350f" stroke-width="3" opacity="0.85"/>
</svg>
