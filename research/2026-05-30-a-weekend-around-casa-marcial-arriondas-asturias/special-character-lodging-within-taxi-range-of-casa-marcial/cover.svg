<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.5" cy="0.78" r="0.45">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
    <linearGradient id="palace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- Sky / dusk -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#dusk)"/>

  <!-- Far Picos de Europa silhouette -->
  <path d="M 0 520 L 140 420 L 240 460 L 360 360 L 460 410 L 600 320 L 740 380 L 880 300 L 1020 360 L 1160 290 L 1300 350 L 1440 310 L 1600 380 L 1600 900 L 0 900 Z"
        fill="url(#ridgeFar)" opacity="0.85"/>

  <!-- Mid hills (Sierra del Sueve curve) -->
  <path d="M 0 640 Q 200 560 420 600 T 820 590 T 1240 610 T 1600 580 L 1600 900 L 0 900 Z"
        fill="url(#ridgeMid)" opacity="0.9"/>

  <!-- Sella river curve -->
  <path d="M 0 780 Q 300 760 600 790 T 1200 810 T 1600 800 L 1600 820 Q 1200 830 800 815 T 0 800 Z"
        fill="#c2410c" opacity="0.35"/>

  <!-- HERO: stone palacio centered ~(800, 480) -->
  <g>
    <!-- Main body -->
    <rect x="640" y="470" width="320" height="220" fill="url(#palace)" opacity="0.95"/>
    <!-- Left wing -->
    <rect x="540" y="520" width="120" height="170" fill="url(#palace)" opacity="0.92"/>
    <!-- Right tower -->
    <rect x="940" y="420" width="100" height="270" fill="url(#palace)" opacity="0.95"/>

    <!-- Hipped slate roofs -->
    <polygon points="640,470 800,400 960,470" fill="url(#roof)" opacity="0.92"/>
    <polygon points="540,520 600,475 660,520" fill="url(#roof)" opacity="0.9"/>
    <polygon points="940,420 990,370 1040,420" fill="url(#roof)" opacity="0.92"/>

    <!-- Chimney -->
    <rect x="870" y="410" width="20" height="40" fill="#2a1410"/>

    <!-- Glowing windows — main body, two rows -->
    <rect x="680" y="510" width="22" height="34" fill="url(#window)" opacity="0.9"/>
    <rect x="730" y="510" width="22" height="34" fill="url(#window)" opacity="0.85"/>
    <rect x="780" y="510" width="22" height="34" fill="url(#window)" opacity="0.92"/>
    <rect x="830" y="510" width="22" height="34" fill="url(#window)" opacity="0.88"/>
    <rect x="880" y="510" width="22" height="34" fill="url(#window)" opacity="0.9"/>

    <rect x="680" y="580" width="22" height="34" fill="url(#window)" opacity="0.85"/>
    <rect x="730" y="580" width="22" height="34" fill="url(#window)" opacity="0.92"/>
    <rect x="830" y="580" width="22" height="34" fill="url(#window)" opacity="0.88"/>
    <rect x="880" y="580" width="22" height="34" fill="url(#window)" opacity="0.9"/>

    <!-- Arched entry door -->
    <path d="M 780 690 L 780 640 Q 780 615 800 615 Q 820 615 820 640 L 820 690 Z" fill="url(#window)" opacity="0.95"/>

    <!-- Left wing windows -->
    <rect x="560" y="555" width="20" height="30" fill="url(#window)" opacity="0.85"/>
    <rect x="600" y="555" width="20" height="30" fill="url(#window)" opacity="0.9"/>
    <rect x="600" y="615" width="20" height="30" fill="url(#window)" opacity="0.82"/>

    <!-- Tower windows -->
    <rect x="970" y="450" width="20" height="28" fill="url(#window)" opacity="0.9"/>
    <rect x="1005" y="450" width="20" height="28" fill="url(#window)" opacity="0.85"/>
    <rect x="970" y="510" width="20" height="28" fill="url(#window)" opacity="0.92"/>
    <rect x="1005" y="510" width="20" height="28" fill="url(#window)" opacity="0.88"/>
    <rect x="970" y="570" width="20" height="28" fill="url(#window)" opacity="0.85"/>
    <rect x="1005" y="570" width="20" height="28" fill="url(#window)" opacity="0.9"/>

    <!-- Warm glow halo behind palace -->
    <ellipse cx="800" cy="690" rx="380" ry="40" fill="#fbbf24" opacity="0.18"/>
  </g>

  <!-- Foreground meadow -->
  <path d="M 0 760 Q 400 740 800 755 T 1600 750 L 1600 900 L 0 900 Z"
        fill="#1a0e0e" opacity="0.88"/>
</svg>
