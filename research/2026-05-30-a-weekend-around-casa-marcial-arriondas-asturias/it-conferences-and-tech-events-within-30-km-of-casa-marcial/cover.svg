<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="cityglow" cx="0.5" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- ambient warmth behind hero -->
  <ellipse cx="800" cy="450" rx="700" ry="420" fill="url(#glow)"/>

  <!-- distant city silhouette (Oviedo/Gijon) far left edge — atmospheric, gets cropped variably -->
  <g opacity="0.45">
    <ellipse cx="120" cy="600" rx="200" ry="100" fill="url(#cityglow)"/>
    <rect x="40"  y="555" width="14" height="50" fill="#fbbf24" opacity="0.55"/>
    <rect x="62"  y="535" width="10" height="70" fill="#d97706" opacity="0.6"/>
    <rect x="80"  y="545" width="16" height="60" fill="#fbbf24" opacity="0.5"/>
    <rect x="104" y="520" width="12" height="85" fill="#d97706" opacity="0.7"/>
    <rect x="124" y="540" width="10" height="65" fill="#fbbf24" opacity="0.55"/>
    <rect x="142" y="525" width="14" height="80" fill="#d97706" opacity="0.6"/>
    <rect x="164" y="550" width="10" height="55" fill="#fbbf24" opacity="0.5"/>
    <rect x="180" y="535" width="12" height="70" fill="#d97706" opacity="0.6"/>
    <rect x="200" y="560" width="8"  height="45" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- distant city silhouette right edge — counterweight -->
  <g opacity="0.4">
    <ellipse cx="1490" cy="610" rx="180" ry="90" fill="url(#cityglow)"/>
    <rect x="1410" y="555" width="12" height="55" fill="#fbbf24" opacity="0.55"/>
    <rect x="1430" y="535" width="14" height="75" fill="#d97706" opacity="0.6"/>
    <rect x="1452" y="550" width="10" height="60" fill="#fbbf24" opacity="0.5"/>
    <rect x="1470" y="525" width="12" height="85" fill="#d97706" opacity="0.65"/>
    <rect x="1490" y="545" width="10" height="65" fill="#fbbf24" opacity="0.55"/>
    <rect x="1508" y="530" width="14" height="80" fill="#d97706" opacity="0.6"/>
    <rect x="1530" y="555" width="10" height="55" fill="#fbbf24" opacity="0.5"/>
    <rect x="1550" y="540" width="12" height="70" fill="#d97706" opacity="0.6"/>
  </g>

  <!-- far ridgeline (Picos de Europa) -->
  <path d="M 0 620 L 180 470 L 320 530 L 470 410 L 620 490 L 780 380 L 940 470 L 1110 400 L 1280 500 L 1440 430 L 1600 510 L 1600 900 L 0 900 Z"
        fill="url(#ridge2)" opacity="0.85"/>

  <!-- near ridgeline -->
  <path d="M 0 720 L 160 640 L 310 680 L 470 600 L 640 660 L 820 580 L 1000 650 L 1170 600 L 1330 670 L 1490 620 L 1600 660 L 1600 900 L 0 900 Z"
        fill="url(#ridge1)" opacity="0.95"/>

  <!-- hero: the 30km radius circle, centered, empty inside -->
  <!-- outer faint reach -->
  <circle cx="800" cy="450" r="290" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 8" opacity="0.45"/>
  <!-- main radius ring -->
  <circle cx="800" cy="450" r="260" fill="#1a0e0e" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2.5" opacity="0.9"/>
  <!-- crosshair tick marks at cardinals -->
  <line x1="800" y1="178" x2="800" y2="200" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <line x1="800" y1="700" x2="800" y2="722" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <line x1="528" y1="450" x2="550" y2="450" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <line x1="1050" y1="450" x2="1072" y2="450" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>

  <!-- centre pin: Casa Marcial location marker -->
  <circle cx="800" cy="450" r="10" fill="#c2410c" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="800" cy="450" r="3"  fill="#fef3ec"/>

  <!-- faint radial spokes suggesting "scanned, nothing found" -->
  <g stroke="#d97706" stroke-width="1" opacity="0.25">
    <line x1="800" y1="450" x2="1010" y2="282"/>
    <line x1="800" y1="450" x2="590"  y2="282"/>
    <line x1="800" y1="450" x2="1010" y2="618"/>
    <line x1="800" y1="450" x2="590"  y2="618"/>
  </g>
</svg>
