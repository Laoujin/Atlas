<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.74" r="0.62">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Roman Arena: nested elliptical arcade rings, hero centred ~ (800,470) -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="800" cy="470" rx="470" ry="250" fill="#78350f" fill-opacity="0.55" stroke="#c2410c" stroke-opacity="0.85" stroke-width="10"/>
    <ellipse cx="800" cy="470" rx="370" ry="195" fill="#5c2a1a" fill-opacity="0.7" stroke="url(#stone)" stroke-opacity="0.9" stroke-width="12"/>
    <ellipse cx="800" cy="470" rx="270" ry="142" fill="#1a0e0e" fill-opacity="0.75" stroke="#d97706" stroke-opacity="0.9" stroke-width="9"/>
  </g>

  <!-- Outer arcade arches as a clipped band of bars along the top ring -->
  <g fill="#fbbf24" fill-opacity="0.8">
    <rect x="372" y="262" width="16" height="56" rx="7"/>
    <rect x="458" y="240" width="16" height="60" rx="7"/>
    <rect x="552" y="226" width="16" height="62" rx="7"/>
    <rect x="652" y="218" width="16" height="64" rx="7"/>
    <rect x="756" y="216" width="16" height="64" rx="7"/>
    <rect x="864" y="218" width="16" height="64" rx="7"/>
    <rect x="966" y="226" width="16" height="62" rx="7"/>
    <rect x="1062" y="240" width="16" height="60" rx="7"/>
    <rect x="1148" y="262" width="16" height="56" rx="7"/>
  </g>

  <!-- Moon over the open-air arena -->
  <circle cx="800" cy="320" r="26" fill="#fef3ec" fill-opacity="0.92"/>
</svg>
