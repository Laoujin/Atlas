<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow hero -->
  <circle cx="800" cy="360" r="300" fill="url(#sun)" opacity="0.85"/>
  <circle cx="800" cy="360" r="120" fill="#fbbf24" opacity="0.9"/>

  <!-- far ridge -->
  <polygon points="125,640 430,420 640,560 880,360 1120,540 1340,400 1475,560 1475,810 125,810"
           fill="url(#peakFar)" opacity="0.85"/>

  <!-- near hero peaks -->
  <polygon points="250,810 560,470 720,640 900,430 1080,650 1230,500 1430,810"
           fill="url(#peakNear)" opacity="0.95"/>

  <!-- snowcaps on hero peaks -->
  <polygon points="560,470 620,520 560,500 510,540 530,500" fill="#fef3ec" opacity="0.9"/>
  <polygon points="900,430 970,500 900,475 835,520 855,478" fill="#fef3ec" opacity="0.92"/>

  <!-- foreground slope -->
  <polygon points="0,900 0,720 700,820 1600,700 1600,900" fill="#1a0e0e" opacity="0.7"/>
</svg>
