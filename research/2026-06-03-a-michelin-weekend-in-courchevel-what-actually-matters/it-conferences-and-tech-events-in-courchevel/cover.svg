<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1008"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="mountainFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="peakGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant ridge silhouette (decorative, below safe zone) -->
  <path d="M0,720 L180,580 L340,650 L520,490 L680,600 L800,520 L920,600 L1080,490 L1260,650 L1420,580 L1600,720 L1600,900 L0,900 Z"
        fill="#3b0f05" opacity="0.7"/>

  <!-- Layer 2: Hero element — main mountain, centred ~(800,450) -->
  <!-- Peak glow halo -->
  <ellipse cx="800" cy="310" rx="320" ry="220" fill="url(#peakGlow)"/>

  <!-- Main mountain body -->
  <path d="M800,155 L480,680 L1120,680 Z" fill="url(#mountainFill)" opacity="0.92"/>

  <!-- Snow cap -->
  <path d="M800,155 L700,340 Q750,310 800,295 Q850,310 900,340 Z" fill="url(#snowGrad)" opacity="0.88"/>

  <!-- Signal / broadcast arcs from peak — tech layer -->
  <path d="M800,220 m-90,60 a108,108 0 0,1 180,0"
        fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M800,220 m-155,100 a186,186 0 0,1 310,0"
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.42"/>
  <path d="M800,220 m-220,145 a264,264 0 0,1 440,0"
        fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" opacity="0.32"/>

  <!-- Node dot at peak (signal origin) -->
  <circle cx="800" cy="220" r="7" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="220" r="14" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>

  <!-- Foreground slope / ground plane -->
  <path d="M0,780 Q400,700 800,720 Q1200,740 1600,680 L1600,900 L0,900 Z"
        fill="#3b0f05" opacity="0.85"/>
  <path d="M0,820 Q400,760 800,775 Q1200,790 1600,740 L1600,900 L0,900 Z"
        fill="#1a0e0e" opacity="0.9"/>

  <!-- Layer 3: Corner atmosphere (decorative, outside safe zone) -->
  <circle cx="0" cy="0" r="260" fill="#c2410c" opacity="0.06"/>
  <circle cx="1600" cy="900" r="300" fill="#9a3309" opacity="0.07"/>
</svg>
