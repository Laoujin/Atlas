<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0608"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Cloche body gradient -->
    <linearGradient id="cloche-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Cloche shine -->
    <radialGradient id="cloche-shine" cx="38%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plate-grad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c8b4"/>
    </radialGradient>
    <!-- Mountain fill -->
    <linearGradient id="mtn-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Rose accent gradient for rim -->
    <linearGradient id="rim-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: Central warm atmospheric glow -->
  <ellipse cx="800" cy="460" rx="620" ry="420" fill="url(#glow)" opacity="0.9"/>

  <!-- Layer 3: Decorative stars (outside safe zone top, atmospheric) -->
  <circle cx="180" cy="60" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="340" cy="30" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="520" cy="70" r="1.5" fill="#fbbf24" opacity="0.35"/>
  <circle cx="700" cy="40" r="2" fill="#fbbf24" opacity="0.45"/>
  <circle cx="920" cy="55" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="1100" cy="25" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1280" cy="65" r="1.5" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1450" cy="45" r="2" fill="#fbbf24" opacity="0.45"/>

  <!-- Layer 4: Hero — Dinner plate base (left) -->
  <ellipse cx="590" cy="620" rx="155" ry="28" fill="url(#plate-grad)" opacity="0.72"/>
  <!-- Plate rim ring left -->
  <ellipse cx="590" cy="618" rx="155" ry="28" fill="none" stroke="#be185d" stroke-width="3" opacity="0.45"/>

  <!-- Dinner plate base (right) -->
  <ellipse cx="1010" cy="620" rx="155" ry="28" fill="url(#plate-grad)" opacity="0.72"/>
  <!-- Plate rim ring right -->
  <ellipse cx="1010" cy="618" rx="155" ry="28" fill="none" stroke="#be185d" stroke-width="3" opacity="0.45"/>

  <!-- Hero: Cloche dome — centered at (800, 450) -->
  <!-- Cloche base plate / stand -->
  <ellipse cx="800" cy="625" rx="230" ry="22" fill="url(#plate-grad)" opacity="0.88"/>
  <ellipse cx="800" cy="623" rx="230" ry="22" fill="none" stroke="url(#rim-grad)" stroke-width="4" opacity="0.85"/>

  <!-- Cloche dome body -->
  <path d="M 570 625
             C 570 490, 630 360, 800 345
             C 970 360, 1030 490, 1030 625
             Z"
        fill="url(#cloche-body)" opacity="0.92"/>

  <!-- Cloche shine overlay -->
  <path d="M 570 625
             C 570 490, 630 360, 800 345
             C 970 360, 1030 490, 1030 625
             Z"
        fill="url(#cloche-shine)" opacity="0.85"/>

  <!-- Cloche knob/handle -->
  <ellipse cx="800" cy="347" rx="32" ry="14" fill="#fbbf24" opacity="0.95"/>
  <ellipse cx="800" cy="340" rx="20" ry="10" fill="#d97706" opacity="0.9"/>
  <ellipse cx="800" cy="335" rx="10" ry="6" fill="#fbbf24" opacity="0.85"/>

  <!-- Rose accent: subtle inner glow ring on cloche -->
  <path d="M 590 613
             C 590 490, 645 372, 800 358
             C 955 372, 1010 490, 1010 613"
        fill="none" stroke="#be185d" stroke-width="2.5" opacity="0.35"/>

  <!-- Layer 5: Mountain ridge silhouette (atmospheric bottom decoration) -->
  <!-- Far ridge (lighter, atmospheric) -->
  <path d="M 0 820
             L 90 760, 200 790, 320 710, 430 750,
               540 680, 640 720, 720 695, 800 720,
               880 695, 960 720, 1060 680,
               1170 750, 1280 710, 1400 790, 1510 760, 1600 820
             L 1600 900, 0 900 Z"
        fill="#3a1a0a" opacity="0.6"/>
  <!-- Near ridge (darker, dominant) -->
  <path d="M 0 870
             L 80 830, 180 850, 290 800, 400 840,
               500 790, 600 820, 700 795, 800 815,
               900 795, 1000 820, 1100 790,
               1200 840, 1310 800, 1420 850, 1520 830, 1600 870
             L 1600 900, 0 900 Z"
        fill="#1a0e0e" opacity="0.85"/>
</svg>
