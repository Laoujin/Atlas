<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow -->
  <circle cx="800" cy="560" r="380" fill="url(#sun)"/>
  <circle cx="800" cy="560" r="95" fill="#fef3ec" opacity="0.85"/>
  <circle cx="800" cy="560" r="60" fill="#fbbf24"/>

  <!-- Far horizon haze -->
  <rect x="0" y="555" width="1600" height="6" fill="#fbbf24" opacity="0.35"/>

  <!-- Skyline silhouette: left to right -->
  <!-- Westminster / Big Ben (left) -->
  <g fill="url(#city)">
    <rect x="240" y="500" width="60" height="180"/>
    <rect x="232" y="490" width="76" height="14"/>
    <polygon points="240,490 270,440 300,490"/>
    <rect x="265" y="395" width="10" height="50"/>
    <rect x="248" y="470" width="44" height="22" fill="#5c2a1a"/>
    <!-- Parliament block -->
    <rect x="120" y="560" width="120" height="120"/>
    <rect x="135" y="540" width="14" height="22"/>
    <rect x="165" y="540" width="14" height="22"/>
    <rect x="195" y="540" width="14" height="22"/>
    <rect x="225" y="540" width="14" height="22"/>
  </g>

  <!-- St Paul's dome (left-center) -->
  <g fill="url(#city)">
    <rect x="430" y="560" width="180" height="120"/>
    <path d="M 460 560 Q 460 460 520 460 Q 580 460 580 560 Z"/>
    <rect x="510" y="430" width="20" height="35"/>
    <circle cx="520" cy="425" r="8"/>
    <rect x="517" y="395" width="6" height="32"/>
  </g>

  <!-- The Shard (center-right, tall pyramid) -->
  <g fill="url(#city)">
    <polygon points="820,680 870,300 875,680"/>
    <polygon points="870,300 875,300 875,680 870,680" fill="#5c2a1a" opacity="0.6"/>
    <rect x="869" y="295" width="3" height="20"/>
  </g>

  <!-- London Eye (right of center) -->
  <g stroke="#3a1810" stroke-width="4" fill="none">
    <circle cx="700" cy="540" r="105"/>
    <circle cx="700" cy="540" r="6" fill="#3a1810"/>
    <line x1="700" y1="540" x2="700" y2="435"/>
    <line x1="700" y1="540" x2="700" y2="645"/>
    <line x1="700" y1="540" x2="595" y2="540"/>
    <line x1="700" y1="540" x2="805" y2="540"/>
    <line x1="700" y1="540" x2="774" y2="466"/>
    <line x1="700" y1="540" x2="626" y2="466"/>
    <line x1="700" y1="540" x2="774" y2="614"/>
    <line x1="700" y1="540" x2="626" y2="614"/>
    <line x1="700" y1="645" x2="685" y2="680"/>
    <line x1="700" y1="645" x2="715" y2="680"/>
  </g>

  <!-- Tower Bridge (right) -->
  <g fill="url(#city)">
    <!-- Left tower -->
    <rect x="990" y="470" width="55" height="210"/>
    <polygon points="985,470 1017,420 1050,470"/>
    <rect x="1010" y="395" width="14" height="28"/>
    <polygon points="1010,395 1017,378 1024,395"/>
    <!-- Right tower -->
    <rect x="1175" y="470" width="55" height="210"/>
    <polygon points="1170,470 1202,420 1235,470"/>
    <rect x="1195" y="395" width="14" height="28"/>
    <polygon points="1195,395 1202,378 1209,395"/>
    <!-- Upper walkway -->
    <rect x="1040" y="455" width="140" height="14"/>
    <rect x="1040" y="490" width="140" height="8"/>
    <!-- Suspension arch (decorative) -->
    <path d="M 1045 680 Q 1110 615 1175 680" fill="none" stroke="#3a1810" stroke-width="5"/>
    <!-- Side spans -->
    <rect x="900" y="660" width="90" height="20"/>
    <rect x="1230" y="660" width="90" height="20"/>
  </g>

  <!-- Gherkin (far right, small) -->
  <g fill="url(#city)">
    <ellipse cx="1380" cy="540" rx="32" ry="140"/>
    <rect x="1378" y="395" width="4" height="20"/>
  </g>

  <!-- Foreground waterline reflection -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#water)"/>

  <!-- Water shimmer streaks -->
  <g fill="#fbbf24" opacity="0.4">
    <rect x="720" y="710" width="160" height="2"/>
    <rect x="680" y="735" width="240" height="2"/>
    <rect x="740" y="760" width="120" height="2"/>
    <rect x="660" y="785" width="280" height="2"/>
  </g>
  <g fill="#d97706" opacity="0.3">
    <rect x="200" y="720" width="80" height="2"/>
    <rect x="450" y="745" width="120" height="2"/>
    <rect x="1100" y="725" width="100" height="2"/>
    <rect x="1280" y="755" width="140" height="2"/>
  </g>
</svg>
