<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="cityFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant skyline (back layer) -->
  <path d="M0,640 L0,560 L80,560 L80,540 L140,540 L140,580 L220,580 L220,500 L260,500 L260,520 L320,520 L320,560 L400,560 L400,510 L460,510 L460,540 L540,540 L540,490 L600,490 L600,520 L680,520 L680,470 L720,470 L720,500 L800,500 L800,540 L880,540 L880,480 L940,480 L940,510 L1020,510 L1020,460 L1080,460 L1080,500 L1160,500 L1160,530 L1240,530 L1240,490 L1320,490 L1320,520 L1400,520 L1400,500 L1480,500 L1480,540 L1600,540 L1600,640 Z" fill="url(#city)" opacity="0.7"/>

  <!-- Mid skyline with iconic shapes (hero zone, centered around 800,450) -->
  <!-- Gherkin (egg-shaped tower) -->
  <path d="M540,640 Q540,520 580,470 Q600,440 610,420 Q620,440 640,470 Q680,520 680,640 Z" fill="url(#cityFront)" opacity="0.92"/>
  <path d="M555,580 L665,580 M560,550 L660,550 M570,520 L650,520 M580,495 L640,495" stroke="#fbbf24" stroke-width="1.2" opacity="0.45"/>

  <!-- Big Ben tower -->
  <rect x="720" y="380" width="50" height="260" fill="url(#cityFront)" opacity="0.92"/>
  <polygon points="720,380 770,380 760,355 730,355" fill="#78350f" opacity="0.92"/>
  <rect x="728" y="395" width="34" height="28" fill="#fbbf24" opacity="0.55"/>
  <polygon points="745,330 735,355 755,355" fill="#9a3309" opacity="0.92"/>

  <!-- Shard (triangular spire) - hero element -->
  <polygon points="830,640 880,180 930,640" fill="url(#cityFront)" opacity="0.95"/>
  <polygon points="876,200 880,180 884,200" fill="#fbbf24" opacity="0.8"/>
  <path d="M848,560 L912,560 M852,500 L908,500 M858,440 L902,440 M862,380 L898,380 M866,320 L894,320 M870,260 L890,260" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>

  <!-- Walkie-Talkie building -->
  <path d="M980,640 L980,420 Q980,380 1010,375 L1080,375 Q1110,380 1110,420 L1110,640 Z" fill="url(#cityFront)" opacity="0.92"/>
  <path d="M995,420 L1095,420 M995,470 L1095,470 M995,520 L1095,520 M995,570 L1095,570" stroke="#fbbf24" stroke-width="1" opacity="0.35"/>

  <!-- Network overlay nodes connecting buildings (tech motif) -->
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.55" fill="none">
    <line x1="610" y1="420" x2="745" y2="330"/>
    <line x1="745" y1="330" x2="880" y2="180"/>
    <line x1="880" y1="180" x2="1045" y2="375"/>
    <line x1="610" y1="420" x2="880" y2="180"/>
    <line x1="745" y1="330" x2="1045" y2="375"/>
    <line x1="610" y1="420" x2="1045" y2="375"/>
  </g>

  <g fill="#fbbf24">
    <circle cx="610" cy="420" r="6" opacity="0.95"/>
    <circle cx="745" cy="330" r="5" opacity="0.95"/>
    <circle cx="880" cy="180" r="7" opacity="1"/>
    <circle cx="1045" cy="375" r="6" opacity="0.95"/>
  </g>
  <g fill="#fbbf24" opacity="0.3">
    <circle cx="610" cy="420" r="14"/>
    <circle cx="880" cy="180" r="16"/>
    <circle cx="1045" cy="375" r="14"/>
  </g>

  <!-- Foreground ground / river reflection -->
  <rect x="0" y="640" width="1600" height="260" fill="#1a0e0e" opacity="0.85"/>
  <rect x="0" y="640" width="1600" height="4" fill="#d97706" opacity="0.6"/>

  <!-- Subtle reflection hints -->
  <g opacity="0.18" fill="#fbbf24">
    <rect x="608" y="650" width="4" height="80"/>
    <rect x="743" y="650" width="4" height="100"/>
    <rect x="878" y="650" width="4" height="140"/>
    <rect x="1043" y="650" width="4" height="90"/>
  </g>
</svg>
