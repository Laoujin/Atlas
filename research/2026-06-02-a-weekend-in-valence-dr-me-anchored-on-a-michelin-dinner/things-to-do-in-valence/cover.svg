<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="vine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow centered behind hero -->
  <circle cx="900" cy="420" r="280" fill="url(#sun)"/>
  <circle cx="900" cy="420" r="70" fill="#fbbf24" opacity="0.95"/>

  <!-- Distant ridge (atmospheric, low opacity) -->
  <path d="M 0 560 L 180 520 L 360 545 L 540 500 L 720 530 L 900 495 L 1080 525 L 1260 505 L 1440 535 L 1600 515 L 1600 620 L 0 620 Z"
        fill="#9a3309" opacity="0.35"/>

  <!-- Vineyard terraces (Hermitage) — stepped on the right -->
  <g opacity="0.85">
    <path d="M 980 640 L 1475 600 L 1475 645 L 980 685 Z" fill="url(#vine)"/>
    <path d="M 1020 700 L 1475 655 L 1475 705 L 1020 745 Z" fill="url(#vine)" opacity="0.88"/>
    <path d="M 1060 760 L 1475 715 L 1475 770 L 1060 810 Z" fill="url(#vine)" opacity="0.82"/>
    <!-- vine row lines -->
    <line x1="990" y1="660" x2="1470" y2="618" stroke="#fef3ec" stroke-width="1.2" opacity="0.35"/>
    <line x1="1000" y1="673" x2="1472" y2="630" stroke="#fef3ec" stroke-width="1.2" opacity="0.3"/>
    <line x1="1030" y1="720" x2="1472" y2="678" stroke="#fef3ec" stroke-width="1.2" opacity="0.32"/>
    <line x1="1070" y1="780" x2="1472" y2="738" stroke="#fef3ec" stroke-width="1.2" opacity="0.3"/>
  </g>

  <!-- HERO: Château de Crussol — ruined silhouette on a cliff -->
  <g>
    <!-- cliff mass -->
    <path d="M 200 810 L 240 720 L 310 660 L 420 600 L 540 560 L 660 540 L 760 555 L 820 600 L 860 670 L 880 760 L 870 810 Z"
          fill="url(#cliff)"/>
    <!-- cliff highlight (sun-facing edge) -->
    <path d="M 540 560 L 660 540 L 760 555 L 820 600 L 800 610 L 720 575 L 640 565 L 560 580 Z"
          fill="#c2410c" opacity="0.7"/>
    <!-- ruined castle wall on the ridge -->
    <path d="M 460 540 L 460 500 L 480 500 L 480 515 L 500 515 L 500 495 L 525 495 L 525 510 L 545 510 L 545 485 L 580 485 L 580 505 L 605 505 L 605 480 L 625 480 L 625 500 L 645 500 L 645 510 L 700 510 L 700 540 Z"
          fill="#1a0e0e" opacity="0.92"/>
    <!-- tower stump -->
    <path d="M 555 485 L 555 455 L 575 450 L 580 485 Z" fill="#1a0e0e" opacity="0.92"/>
    <!-- crenellation notches lost to ruin -->
    <rect x="510" y="495" width="8" height="10" fill="url(#sky)" opacity="0.6"/>
    <rect x="660" y="505" width="6" height="8" fill="url(#sky)" opacity="0.6"/>
  </g>

  <!-- Rhône river ribbon between cliff and vineyards -->
  <path d="M 870 760 L 880 800 Q 940 810 1000 800 Q 1080 790 1140 805 Q 1220 815 1300 805 L 1475 795 L 1475 810 L 870 810 Z"
        fill="url(#river)" opacity="0.75"/>
  <path d="M 900 790 Q 1000 783 1100 790 Q 1220 798 1340 788"
        stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.55"/>

  <!-- Foreground base anchoring the composition -->
  <rect x="0" y="805" width="1600" height="95" fill="#5c2a1a" opacity="0.85"/>
</svg>
