<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm candlelight radial glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill gradient -->
    <radialGradient id="plate1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.92"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d4c5b0" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="plate2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.82"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#d4c5b0" stop-opacity="0.60"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="rim1" cx="50%" cy="40%" r="55%">
      <stop offset="80%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="95%" stop-color="#9a3309" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.20"/>
    </linearGradient>
    <!-- Dome/cloche gradient -->
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Warm candlelight atmospheric glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — fine dining table setting, centered ~(800, 450) -->

  <!-- Table surface: subtle ellipse suggesting a round dining table -->
  <ellipse cx="800" cy="620" rx="520" ry="95" fill="#3d1a0a" opacity="0.70"/>
  <ellipse cx="800" cy="615" rx="510" ry="85" fill="#2d1208" opacity="0.55"/>

  <!-- Left plate (slightly behind, offset left) -->
  <ellipse cx="680" cy="490" rx="145" ry="145" fill="url(#plate2)" opacity="0.78"/>
  <ellipse cx="680" cy="490" rx="145" ry="145" fill="url(#rim1)" opacity="0.70"/>
  <!-- Inner plate well -->
  <ellipse cx="680" cy="490" rx="108" ry="108" fill="#faf8f2" opacity="0.30"/>

  <!-- Right plate (hero, front center-right) -->
  <ellipse cx="850" cy="500" rx="162" ry="162" fill="url(#plate1)" opacity="0.90"/>
  <ellipse cx="850" cy="500" rx="162" ry="162" fill="url(#rim1)" opacity="0.80"/>
  <!-- Inner plate well -->
  <ellipse cx="850" cy="500" rx="122" ry="122" fill="#faf8f2" opacity="0.38"/>

  <!-- Wine glass (right side of composition) -->
  <!-- Bowl of glass -->
  <ellipse cx="1060" cy="430" rx="42" ry="55" fill="url(#glass)" opacity="0.75"/>
  <!-- Stem -->
  <rect x="1056" y="483" width="8" height="90" rx="4" fill="#fbbf24" opacity="0.35"/>
  <!-- Base -->
  <ellipse cx="1060" cy="575" rx="34" ry="8" fill="#d97706" opacity="0.40"/>
  <!-- Wine fill inside bowl -->
  <ellipse cx="1060" cy="460" rx="30" ry="22" fill="#9a3309" opacity="0.55"/>

  <!-- Candle (between plates, slightly behind) -->
  <!-- Candle body -->
  <rect x="790" y="365" width="18" height="70" rx="3" fill="#faf8f2" opacity="0.70"/>
  <!-- Flame outer -->
  <ellipse cx="799" cy="352" rx="11" ry="17" fill="#fbbf24" opacity="0.80"/>
  <!-- Flame inner -->
  <ellipse cx="799" cy="357" rx="6" ry="10" fill="#d97706" opacity="0.95"/>
  <!-- Candle glow halo -->
  <ellipse cx="799" cy="355" rx="28" ry="24" fill="#fbbf24" opacity="0.14"/>

  <!-- Layer 3: Edge decorations (outside hero safe zone — purely atmospheric) -->
  <!-- Top-left warm arc suggestion -->
  <ellipse cx="-60" cy="-40" rx="320" ry="250" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.12"/>
  <!-- Bottom-right warm arc suggestion -->
  <ellipse cx="1680" cy="960" rx="340" ry="260" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.10"/>
  <!-- Subtle top edge warmth -->
  <rect x="0" y="0" width="1600" height="3" fill="#d97706" opacity="0.18"/>
  <!-- Subtle bottom edge warmth -->
  <rect x="0" y="897" width="1600" height="3" fill="#c2410c" opacity="0.18"/>
</svg>
