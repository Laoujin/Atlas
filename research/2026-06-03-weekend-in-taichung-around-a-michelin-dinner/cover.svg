<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#0e0606"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient: warm porcelain -->
    <radialGradient id="plateGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>
    <!-- Inner ring gradient -->
    <radialGradient id="innerGrad" cx="40%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#b8a88a"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#78350f" stop-opacity="0"/>
      <stop offset="94%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.75"/>
    </radialGradient>
    <!-- Rose accent glow (bottom-left decorative) -->
    <radialGradient id="roseGlow" cx="0%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Top-right rust accent -->
    <radialGradient id="rustCorner" cx="100%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Fork gradient -->
    <linearGradient id="forkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Decorative corner glows (outside safe zone, purely atmospheric) -->
  <rect width="1600" height="900" fill="url(#roseGlow)"/>
  <rect width="1600" height="900" fill="url(#rustCorner)"/>

  <!-- Central warm glow halo -->
  <ellipse cx="800" cy="450" rx="620" ry="420" fill="url(#glowGrad)"/>

  <!-- Layer 2: Hero element — fine dining plate centered at (800, 450) -->
  <!-- Outer plate (rim) -->
  <circle cx="800" cy="450" r="280" fill="url(#plateGrad)" opacity="0.95"/>
  <!-- Rim shadow overlay -->
  <circle cx="800" cy="450" r="280" fill="url(#rimGrad)"/>
  <!-- Inner well of the plate -->
  <circle cx="800" cy="450" r="205" fill="url(#innerGrad)" opacity="0.92"/>

  <!-- Michelin-star motif: a small elegant 6-point star on the plate center -->
  <!-- Built from two overlapping triangles, rust gold -->
  <polygon points="800,330 820,385 880,385 833,420 851,475 800,442 749,475 767,420 720,385 780,385"
           fill="#d97706" opacity="0.82"/>
  <!-- Star inner highlight -->
  <polygon points="800,348 814,383 852,383 822,405 834,442 800,421 766,442 778,405 748,383 786,383"
           fill="#fbbf24" opacity="0.55"/>

  <!-- Fork silhouette — left of plate, within safe zone -->
  <!-- Handle -->
  <rect x="490" y="310" width="18" height="220" rx="9" fill="url(#forkGrad)" opacity="0.78"/>
  <!-- Tines (three vertical rects at top) -->
  <rect x="480" y="260" width="8" height="75" rx="4" fill="url(#forkGrad)" opacity="0.78"/>
  <rect x="495" y="260" width="8" height="75" rx="4" fill="url(#forkGrad)" opacity="0.78"/>
  <rect x="510" y="260" width="8" height="75" rx="4" fill="url(#forkGrad)" opacity="0.78"/>
  <!-- Tine base connector -->
  <rect x="480" y="326" width="38" height="10" rx="3" fill="url(#forkGrad)" opacity="0.78"/>

  <!-- Knife silhouette — right of plate, within safe zone -->
  <!-- Handle -->
  <rect x="1092" y="310" width="18" height="220" rx="9" fill="url(#forkGrad)" opacity="0.70"/>
  <!-- Blade: tapered trapezoid pointing upward -->
  <polygon points="1092,310 1110,310 1106,230 1096,230" fill="url(#forkGrad)" opacity="0.70"/>

  <!-- Subtle plate shadow beneath hero -->
  <ellipse cx="800" cy="760" rx="270" ry="28" fill="#78350f" opacity="0.30"/>

</svg>
