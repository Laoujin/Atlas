<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1206"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub node gradient -->
    <radialGradient id="hub" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Satellite node gradient A -->
    <radialGradient id="nodeA" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Satellite node gradient B -->
    <radialGradient id="nodeB" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Edge glow filter -->
    <filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Central ambient glow -->
  <ellipse cx="800" cy="450" rx="520" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: Hero — node-and-edge graph centred at (800, 450) -->
  <!-- Hero bounding box approx 700×500, centred at (800,450): x 450–1150, y 200–700 -->

  <!-- Edges (drawn before nodes so nodes sit on top) -->
  <!-- Hub (800,450) to node 1 (570,270) -->
  <line x1="800" y1="450" x2="570" y2="270" stroke="#c2410c" stroke-width="3" stroke-opacity="0.7" filter="url(#edgeGlow)"/>
  <!-- Hub to node 2 (1050,260) -->
  <line x1="800" y1="450" x2="1050" y2="260" stroke="#c2410c" stroke-width="3" stroke-opacity="0.7" filter="url(#edgeGlow)"/>
  <!-- Hub to node 3 (1120,520) -->
  <line x1="800" y1="450" x2="1120" y2="520" stroke="#c2410c" stroke-width="3" stroke-opacity="0.6" filter="url(#edgeGlow)"/>
  <!-- Hub to node 4 (970,670) -->
  <line x1="800" y1="450" x2="970" y2="670" stroke="#c2410c" stroke-width="3" stroke-opacity="0.6" filter="url(#edgeGlow)"/>
  <!-- Hub to node 5 (590,660) -->
  <line x1="800" y1="450" x2="590" y2="660" stroke="#c2410c" stroke-width="3" stroke-opacity="0.6" filter="url(#edgeGlow)"/>
  <!-- Hub to node 6 (470,490) -->
  <line x1="800" y1="450" x2="470" y2="490" stroke="#c2410c" stroke-width="3" stroke-opacity="0.5" filter="url(#edgeGlow)"/>
  <!-- Cross edges between satellites (secondary connections) -->
  <line x1="570" y1="270" x2="1050" y2="260" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="1050" y1="260" x2="1120" y2="520" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="1120" y1="520" x2="970" y2="670" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.40"/>
  <line x1="970" y1="670" x2="590" y2="660" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.40"/>
  <line x1="590" y1="660" x2="470" y2="490" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.40"/>
  <line x1="470" y1="490" x2="570" y2="270" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.40"/>

  <!-- Satellite halos (glow rings) -->
  <circle cx="570" cy="270" r="38" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="1050" cy="260" r="38" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="1120" cy="520" r="34" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.30"/>
  <circle cx="970" cy="670" r="34" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.30"/>
  <circle cx="590" cy="660" r="34" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.30"/>
  <circle cx="470" cy="490" r="30" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.28"/>

  <!-- Satellite nodes -->
  <circle cx="570" cy="270" r="28" fill="url(#nodeA)" opacity="0.88"/>
  <circle cx="1050" cy="260" r="28" fill="url(#nodeA)" opacity="0.88"/>
  <circle cx="1120" cy="520" r="24" fill="url(#nodeB)" opacity="0.82"/>
  <circle cx="970" cy="670" r="24" fill="url(#nodeB)" opacity="0.82"/>
  <circle cx="590" cy="660" r="24" fill="url(#nodeA)" opacity="0.80"/>
  <circle cx="470" cy="490" r="22" fill="url(#nodeB)" opacity="0.78"/>

  <!-- Hub halo (outer) -->
  <circle cx="800" cy="450" r="90" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.30"/>
  <!-- Hub halo (inner) -->
  <circle cx="800" cy="450" r="72" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Hub node -->
  <circle cx="800" cy="450" r="58" fill="url(#hub)" opacity="0.95"/>
  <!-- Hub highlight -->
  <circle cx="784" cy="433" r="16" fill="#fbbf24" opacity="0.28"/>

  <!-- Layer 3: Corner decorations (outside safe zone — atmospheric only) -->
  <!-- Top-left arc cluster -->
  <circle cx="80" cy="80" r="120" fill="none" stroke="#78350f" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="80" cy="80" r="80" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.20"/>
  <!-- Bottom-right arc cluster -->
  <circle cx="1520" cy="820" r="130" fill="none" stroke="#78350f" stroke-width="1" stroke-opacity="0.22"/>
  <circle cx="1520" cy="820" r="85" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.18"/>
</svg>
