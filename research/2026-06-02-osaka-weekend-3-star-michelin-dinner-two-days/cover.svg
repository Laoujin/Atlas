<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1008"/>
      <stop offset="100%" stop-color="#0e0808"/>
    </linearGradient>

    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate fill — outer ring -->
    <radialGradient id="plateOuter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="70%" stop-color="#3a1508"/>
      <stop offset="100%" stop-color="#2a0e04"/>
    </radialGradient>

    <!-- Hero plate fill — inner well -->
    <radialGradient id="plateInner" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a0a04"/>
      <stop offset="100%" stop-color="#0e0603"/>
    </radialGradient>

    <!-- Accent dish fill -->
    <radialGradient id="dishAccent" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3a1508"/>
    </radialGradient>

    <!-- Rose accent glow for small dish -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), fits comfortably in safe zone -->

  <!-- Main plate rim (outer decorative ring) -->
  <circle cx="800" cy="450" r="280" fill="url(#plateOuter)" opacity="0.92"/>

  <!-- Main plate rim highlight arc — upper left -->
  <circle cx="800" cy="450" r="280" fill="none"
    stroke="#c2410c" stroke-width="3" stroke-opacity="0.55"
    stroke-dasharray="620 1160"/>

  <!-- Main plate well -->
  <circle cx="800" cy="450" r="220" fill="url(#plateInner)" opacity="0.95"/>

  <!-- Inner plate lip ring -->
  <circle cx="800" cy="450" r="222" fill="none"
    stroke="#d97706" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle concentric detail ring on main plate -->
  <circle cx="800" cy="450" r="160" fill="none"
    stroke="#78350f" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Food presentation dot — amber -->
  <circle cx="800" cy="415" r="22" fill="#d97706" opacity="0.82"/>

  <!-- Food presentation dot — rust -->
  <circle cx="755" cy="465" r="14" fill="#c2410c" opacity="0.75"/>

  <!-- Food presentation dot — rose accent -->
  <circle cx="840" cy="468" r="10" fill="#be185d" opacity="0.70"/>

  <!-- Micro garnish line (kaiseki presentation element) -->
  <line x1="770" y1="450" x2="830" y2="450"
    stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Accompanying small dish (overlapping, offset lower-right) -->
  <circle cx="1020" cy="580" r="130" fill="url(#dishAccent)" opacity="0.78"/>
  <circle cx="1020" cy="580" r="130" fill="none"
    stroke="#c2410c" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="1020" cy="580" r="98" fill="#1a0804" opacity="0.88"/>
  <circle cx="1020" cy="580" r="100" fill="none"
    stroke="#9a3309" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Rose glow behind small dish -->
  <circle cx="1020" cy="580" r="160" fill="url(#roseGlow)"/>

  <!-- Small dish food dot -->
  <circle cx="1020" cy="568" r="11" fill="#be185d" opacity="0.72"/>
  <circle cx="1003" cy="588" r="7" fill="#d97706" opacity="0.65"/>

  <!-- Layer 3: Decorative full-bleed edge elements (get cropped variably — no meaning) -->

  <!-- Top-left corner warm smear -->
  <ellipse cx="80" cy="80" rx="200" ry="140" fill="#c2410c" opacity="0.08"/>

  <!-- Bottom-right corner glow -->
  <ellipse cx="1540" cy="840" rx="220" ry="160" fill="#9a3309" opacity="0.10"/>

  <!-- Thin horizontal rule — very subtle, full width -->
  <line x1="0" y1="720" x2="1600" y2="720"
    stroke="#d97706" stroke-width="0.5" stroke-opacity="0.10"/>
</svg>
