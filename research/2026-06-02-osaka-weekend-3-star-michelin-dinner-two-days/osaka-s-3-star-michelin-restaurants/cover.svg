<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>

    <!-- Warm ambient glow behind plates -->
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Main plate gradient — lacquer finish -->
    <radialGradient id="plate1" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d1a0a"/>
      <stop offset="55%" stop-color="#1f0b04"/>
      <stop offset="100%" stop-color="#0e0503"/>
    </radialGradient>

    <!-- Second plate — slightly lighter -->
    <radialGradient id="plate2" cx="62%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#2d1208"/>
      <stop offset="55%" stop-color="#180802"/>
      <stop offset="100%" stop-color="#0e0503"/>
    </radialGradient>

    <!-- Rim highlight -->
    <radialGradient id="rim" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose accent for garnish dot -->
    <radialGradient id="garnish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a1050" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Star glow -->
    <radialGradient id="starglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow -->
  <ellipse cx="800" cy="450" rx="620" ry="400" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two lacquer plates, overlapping, centered around (800,450) -->

  <!-- Back plate (right, slightly behind) -->
  <circle cx="860" cy="470" r="230" fill="#0e0503" opacity="0.92"/>
  <circle cx="860" cy="470" r="230" fill="url(#plate2)" opacity="0.85"/>
  <!-- Back plate rim -->
  <circle cx="860" cy="470" r="230" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.55"/>
  <circle cx="860" cy="470" r="215" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.4"/>

  <!-- Front plate (left, foreground) -->
  <circle cx="740" cy="450" r="240" fill="#0e0503" opacity="0.95"/>
  <circle cx="740" cy="450" r="240" fill="url(#plate1)" opacity="0.9"/>
  <!-- Front plate rim — amber highlight -->
  <circle cx="740" cy="450" r="240" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0.65"/>
  <circle cx="740" cy="450" r="224" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.45"/>

  <!-- Rim sheen on front plate -->
  <ellipse cx="710" cy="340" rx="90" ry="18" fill="#fbbf24" opacity="0.12" transform="rotate(-15,710,340)"/>

  <!-- Chopstick silhouette — two thin angled lines above the plates -->
  <line x1="680" y1="185" x2="760" y2="420" stroke="#c2410c" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="710" y1="185" x2="790" y2="420" stroke="#9a3309" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Garnish accent — small rose dot on front plate center -->
  <circle cx="730" cy="445" r="22" fill="url(#garnish)" opacity="0.85"/>
  <!-- Garnish inner highlight -->
  <circle cx="724" cy="438" r="7" fill="#fbbf24" opacity="0.45"/>

  <!-- Three Michelin-star abstract dots — floating above hero, within safe zone -->
  <!-- Star 1 -->
  <circle cx="680" cy="220" r="14" fill="url(#starglow)" opacity="0.9"/>
  <!-- Star 2 -->
  <circle cx="800" cy="195" r="14" fill="url(#starglow)" opacity="0.9"/>
  <!-- Star 3 -->
  <circle cx="920" cy="220" r="14" fill="url(#starglow)" opacity="0.9"/>

  <!-- Subtle connective arc between the three stars — decorative, earned -->
  <path d="M680,220 Q800,160 920,220" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.25"/>

  <!-- Layer 3: edge decoration — corner rose vignette, will crop variably -->
  <radialGradient id="vignette" cx="0%" cy="100%" r="70%">
    <stop offset="0%" stop-color="#be185d" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
