<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="tako" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="500" rx="780" ry="430" fill="url(#glow)"/>

  <!-- distant moon disk behind castle -->
  <circle cx="1080" cy="280" r="95" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1080" cy="280" r="70" fill="#fef3ec" opacity="0.55"/>

  <!-- torii arch left (decoration, partial bleed acceptable) -->
  <g opacity="0.78">
    <rect x="180" y="420" width="22" height="340" fill="#c2410c"/>
    <rect x="310" y="420" width="22" height="340" fill="#c2410c"/>
    <rect x="160" y="395" width="192" height="18" fill="#9a3309"/>
    <rect x="140" y="365" width="232" height="26" fill="#c2410c"/>
    <rect x="245" y="413" width="22" height="60" fill="#9a3309"/>
  </g>

  <!-- HERO: Osaka Castle silhouette, centered ~ (800,470), within safe zone -->
  <g opacity="0.95">
    <!-- stone base (trapezoid) -->
    <polygon points="560,720 1040,720 1000,610 600,610" fill="#78350f"/>
    <polygon points="560,720 1040,720 1000,610 600,610" fill="url(#castle)" opacity="0.55"/>

    <!-- main tower body -->
    <rect x="680" y="430" width="240" height="180" fill="url(#castle)"/>

    <!-- tier 1 roof (widest) -->
    <polygon points="640,430 960,430 920,395 680,395" fill="url(#roof)"/>
    <!-- upturned eaves -->
    <path d="M 640 430 Q 628 422 632 412 L 648 418 Z" fill="#9a3309"/>
    <path d="M 960 430 Q 972 422 968 412 L 952 418 Z" fill="#9a3309"/>

    <!-- tier 2 body -->
    <rect x="710" y="340" width="180" height="55" fill="url(#castle)"/>

    <!-- tier 2 roof -->
    <polygon points="680,340 920,340 890,305 710,305" fill="url(#roof)"/>
    <path d="M 680 340 Q 670 332 674 322 L 688 328 Z" fill="#9a3309"/>
    <path d="M 920 340 Q 930 332 926 322 L 912 328 Z" fill="#9a3309"/>

    <!-- tier 3 body -->
    <rect x="735" y="260" width="130" height="45" fill="url(#castle)"/>

    <!-- tier 3 roof (peaked top) -->
    <polygon points="710,260 890,260 860,225 740,225" fill="url(#roof)"/>

    <!-- top spire / shachihoko base -->
    <rect x="785" y="190" width="30" height="35" fill="#9a3309"/>
    <rect x="797" y="160" width="6" height="30" fill="#fbbf24"/>
    <circle cx="800" cy="158" r="6" fill="#fbbf24"/>

    <!-- window slits -->
    <rect x="710" y="470" width="14" height="40" fill="#1a0e0e" opacity="0.6"/>
    <rect x="755" y="470" width="14" height="40" fill="#fbbf24" opacity="0.7"/>
    <rect x="800" y="470" width="14" height="40" fill="#1a0e0e" opacity="0.6"/>
    <rect x="845" y="470" width="14" height="40" fill="#fbbf24" opacity="0.7"/>
    <rect x="890" y="470" width="14" height="40" fill="#1a0e0e" opacity="0.6"/>

    <rect x="745" y="355" width="10" height="22" fill="#fbbf24" opacity="0.7"/>
    <rect x="795" y="355" width="10" height="22" fill="#1a0e0e" opacity="0.6"/>
    <rect x="845" y="355" width="10" height="22" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- takoyaki trio at base, food accent inside safe zone -->
  <g>
    <circle cx="1180" cy="755" r="42" fill="url(#tako)"/>
    <circle cx="1268" cy="755" r="42" fill="url(#tako)"/>
    <circle cx="1356" cy="755" r="42" fill="url(#tako)"/>
    <!-- sauce drizzle highlights -->
    <path d="M 1148 740 Q 1180 728 1212 740" stroke="#5c2a1a" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M 1236 740 Q 1268 728 1300 740" stroke="#5c2a1a" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M 1324 740 Q 1356 728 1388 740" stroke="#5c2a1a" stroke-width="4" fill="none" opacity="0.7"/>
    <!-- specular highlights -->
    <ellipse cx="1168" cy="742" rx="10" ry="6" fill="#fef3ec" opacity="0.55"/>
    <ellipse cx="1256" cy="742" rx="10" ry="6" fill="#fef3ec" opacity="0.55"/>
    <ellipse cx="1344" cy="742" rx="10" ry="6" fill="#fef3ec" opacity="0.55"/>
  </g>

  <!-- foreground ground line / moat reflection hint -->
  <rect x="0" y="720" width="1600" height="180" fill="#1a0e0e" opacity="0.45"/>
  <rect x="0" y="720" width="1600" height="4" fill="#fbbf24" opacity="0.35"/>
</svg>
