<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plateOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a1f18"/>
      <stop offset="85%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plateInner" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d9c9a8" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sauce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow behind plate -->
  <circle cx="800" cy="450" r="520" fill="url(#glow)" opacity="0.45"/>

  <!-- Plate: outer rim -->
  <circle cx="800" cy="450" r="340" fill="url(#plateOuter)" opacity="0.95"/>
  <circle cx="800" cy="450" r="332" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>

  <!-- Plate: inner well -->
  <circle cx="800" cy="450" r="280" fill="url(#plateInner)"/>
  <circle cx="800" cy="450" r="272" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.35"/>

  <!-- Abstract sauce smear / reduction (rose-tinted, nodding to balsamic + Emilia color) -->
  <ellipse cx="760" cy="540" rx="155" ry="32" fill="url(#sauce)" opacity="0.7" transform="rotate(-12 760 540)"/>
  <ellipse cx="785" cy="555" rx="90" ry="14" fill="#be185d" opacity="0.35" transform="rotate(-12 785 555)"/>

  <!-- Three small plated dots (composition / dressing) -->
  <circle cx="690" cy="395" r="14" fill="#c2410c" opacity="0.8"/>
  <circle cx="900" cy="380" r="10" fill="#9a3309" opacity="0.75"/>
  <circle cx="870" cy="510" r="7" fill="#be185d" opacity="0.7"/>

  <!-- Hero: a single Michelin star, centered on the plate -->
  <g transform="translate(800 430)">
    <!-- soft halo -->
    <circle r="150" fill="#fbbf24" opacity="0.15"/>
    <circle r="100" fill="#fbbf24" opacity="0.2"/>
    <!-- star (5-point) -->
    <polygon points="0,-110 26,-34 106,-34 42,16 66,92 0,46 -66,92 -42,16 -106,-34 -26,-34"
             fill="url(#starGrad)" stroke="#78350f" stroke-width="2" opacity="0.95"/>
    <!-- inner facet highlight -->
    <polygon points="0,-110 26,-34 106,-34 42,16 0,0"
             fill="#fbbf24" opacity="0.35"/>
  </g>

  <!-- Subtle corner decoration: faint diagonal light streaks (outside hero zone) -->
  <path d="M 0 0 L 220 0 L 0 180 Z" fill="#c2410c" opacity="0.08"/>
  <path d="M 1600 900 L 1380 900 L 1600 720 Z" fill="#c2410c" opacity="0.08"/>

  <!-- Faint cutlery hint: two slender vertical accents far outside safe zone, suggesting place setting -->
  <rect x="60" y="280" width="6" height="340" rx="2" fill="#d97706" opacity="0.25"/>
  <rect x="1534" y="280" width="6" height="340" rx="2" fill="#d97706" opacity="0.25"/>
</svg>
