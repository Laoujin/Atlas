<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow -->
  <circle cx="800" cy="430" r="260" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="430" r="120" fill="#fef3ec" opacity="0.85"/>

  <!-- sea -->
  <rect x="0" y="470" width="1600" height="230" fill="url(#sea)" opacity="0.92"/>

  <!-- sun reflection on water -->
  <polygon points="760,475 840,475 900,690 700,690" fill="#fbbf24" opacity="0.55"/>

  <!-- beach foreground -->
  <path d="M0,690 Q800,640 1600,690 L1600,900 L0,900 Z" fill="url(#sand)" opacity="0.95"/>

  <!-- Rotonda a Mare: pavilion on the water, hero -->
  <g opacity="0.92">
    <!-- pier deck -->
    <rect x="690" y="540" width="220" height="14" fill="#78350f"/>
    <!-- pylons -->
    <rect x="706" y="552" width="10" height="120" fill="#5c2a1a"/>
    <rect x="884" y="552" width="10" height="120" fill="#5c2a1a"/>
    <rect x="795" y="552" width="10" height="120" fill="#5c2a1a"/>
    <!-- pavilion body -->
    <rect x="700" y="470" width="200" height="72" fill="#9a3309"/>
    <!-- arched colonnade -->
    <rect x="718" y="492" width="22" height="50" fill="#78350f"/>
    <rect x="758" y="492" width="22" height="50" fill="#78350f"/>
    <rect x="798" y="492" width="22" height="50" fill="#78350f"/>
    <rect x="838" y="492" width="22" height="50" fill="#78350f"/>
    <!-- shallow dome roof -->
    <path d="M690,470 Q800,418 910,470 Z" fill="#c2410c"/>
    <!-- finial -->
    <rect x="796" y="404" width="8" height="18" fill="#78350f"/>
    <circle cx="800" cy="402" r="7" fill="#fbbf24"/>
  </g>
</svg>
