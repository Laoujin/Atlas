<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1208"/>
    </linearGradient>

    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate sheen gradient -->
    <radialGradient id="plateMain" cx="42%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2e100a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>

    <!-- Inner plate surface -->
    <radialGradient id="plateInner" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Second plate, slightly offset -->
    <radialGradient id="plateSecond" cx="55%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#4a1a0e"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>

    <!-- Cloche dome gradient -->
    <linearGradient id="cloche" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Star accent glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose accent gradient for rim -->
    <linearGradient id="rimAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle edge vignette corners (decorative, outside safe zone) -->
  <ellipse cx="0" cy="0" rx="320" ry="220" fill="#be185d" opacity="0.06"/>
  <ellipse cx="1600" cy="900" rx="320" ry="220" fill="#c2410c" opacity="0.08"/>

  <!-- Layer 2: Hero — plate compositions, centered at (800, 450) -->

  <!-- Back plate (slightly right and up, creates depth) -->
  <ellipse cx="870" cy="420" rx="310" ry="80" fill="url(#plateSecond)" opacity="0.7"/>
  <!-- Back plate rim highlight -->
  <ellipse cx="870" cy="420" rx="310" ry="80" fill="none" stroke="#be185d" stroke-width="2" opacity="0.3"/>
  <!-- Back plate inner well -->
  <ellipse cx="870" cy="415" rx="240" ry="60" fill="#1a0e0e" opacity="0.85"/>

  <!-- Main plate (foreground, slightly left) -->
  <ellipse cx="740" cy="490" rx="340" ry="88" fill="url(#plateMain)" opacity="0.95"/>
  <!-- Main plate rim — rose accent -->
  <ellipse cx="740" cy="490" rx="340" ry="88" fill="none" stroke="url(#rimAccent)" stroke-width="3" opacity="0.7"/>
  <!-- Main plate rim inner highlight -->
  <ellipse cx="740" cy="490" rx="310" ry="78" fill="none" stroke="#d97706" stroke-width="1" opacity="0.25"/>
  <!-- Main plate inner well -->
  <ellipse cx="740" cy="487" rx="260" ry="64" fill="url(#plateInner)" opacity="0.9"/>
  <!-- Main plate center mark — fine dining sauce dot -->
  <circle cx="740" cy="487" r="28" fill="#c2410c" opacity="0.75"/>
  <circle cx="740" cy="487" r="14" fill="#d97706" opacity="0.6"/>
  <circle cx="740" cy="487" r="5" fill="#fbbf24" opacity="0.85"/>

  <!-- Cloche dome over the back plate -->
  <ellipse cx="870" cy="350" rx="215" ry="130" fill="url(#cloche)" opacity="0.82"/>
  <!-- Cloche base band -->
  <rect x="655" y="415" width="430" height="12" rx="6" fill="#9a3309" opacity="0.75"/>
  <!-- Cloche handle knob -->
  <ellipse cx="870" cy="228" rx="22" ry="12" fill="#d97706" opacity="0.9"/>
  <rect x="862" y="228" width="16" height="32" rx="8" fill="#c2410c" opacity="0.85"/>
  <!-- Cloche sheen -->
  <ellipse cx="820" cy="305" rx="60" ry="25" fill="#fbbf24" opacity="0.08" transform="rotate(-20 820 305)"/>

  <!-- Michelin star accent — three small stars above, positioned in safe zone -->
  <!-- Star 1 -->
  <circle cx="740" cy="340" r="18" fill="url(#starGlow)" opacity="0.0"/>
  <polygon points="740,322 745,336 760,336 749,344 753,358 740,350 727,358 731,344 720,336 735,336" fill="#fbbf24" opacity="0.85"/>

  <!-- Star 2 -->
  <polygon points="800,318 804,330 817,330 807,337 810,349 800,342 790,349 793,337 783,330 796,330" fill="#fbbf24" opacity="0.65"/>

  <!-- Star 3 -->
  <polygon points="680,318 684,330 697,330 687,337 690,349 680,342 670,349 673,337 663,330 676,330" fill="#fbbf24" opacity="0.65"/>

  <!-- Rose accent: fine line arc suggesting plating artistry -->
  <path d="M 500 560 Q 650 510 740 487 Q 840 462 980 490" fill="none" stroke="#be185d" stroke-width="1.5" opacity="0.35" stroke-dasharray="none"/>

  <!-- Subtle ambient glow beneath the plates -->
  <ellipse cx="800" cy="560" rx="380" ry="55" fill="#c2410c" opacity="0.08"/>
</svg>
