<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- hero: sun glow centred in safe zone -->
  <circle cx="800" cy="430" r="320" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="430" r="150" fill="#fef3ec" opacity="0.95"/>

  <!-- skyline silhouette (a tall tower hero + supporting towers), sitting on dune crest -->
  <polygon points="780,150 812,150 826,560 766,560" fill="#1a0e0e" opacity="0.9"/>
  <polygon points="780,150 796,120 812,150" fill="#1a0e0e" opacity="0.9"/>
  <rect x="640" y="320" width="46" height="240" fill="#1a0e0e" opacity="0.82"/>
  <rect x="910" y="280" width="38" height="280" fill="#1a0e0e" opacity="0.82"/>
  <rect x="990" y="360" width="34" height="200" fill="#1a0e0e" opacity="0.78"/>
  <rect x="560" y="380" width="34" height="180" fill="#1a0e0e" opacity="0.78"/>

  <!-- dune crests across full bleed -->
  <path d="M0,620 Q420,540 820,600 T1600,580 L1600,900 L0,900 Z" fill="url(#dune)" opacity="0.92"/>
  <path d="M0,720 Q500,660 1000,710 T1600,700 L1600,900 L0,900 Z" fill="#5c2a1a"/>
</svg>
