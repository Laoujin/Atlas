<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1200"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Hub diamond fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Node fill -->
    <radialGradient id="nodeFill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <!-- Orbit ring gradient -->
    <linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.0"/>
      <stop offset="40%" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Spoke gradient -->
    <linearGradient id="spoke1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed warm radial wash centred on hero -->
  <ellipse cx="800" cy="450" rx="700" ry="480" fill="url(#hubGlow)" opacity="0.25"/>

  <!-- Layer 3 decoration: faint outer orbit (extends beyond safe zone, purely atmospheric) -->
  <ellipse cx="800" cy="450" rx="580" ry="310" fill="none" stroke="url(#orbitStroke)" stroke-width="1.5" opacity="0.45"/>
  <ellipse cx="800" cy="450" rx="420" ry="225" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.25"/>
  <ellipse cx="800" cy="450" rx="250" ry="135" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.3"/>

  <!-- Layer 2: Spokes from hub to each orbit node -->
  <!-- Node positions (on outer ellipse, rx=420 ry=225): angles 30°, 110°, 190°, 270°, 350° -->
  <!-- 30°:  800+420cos30=800+364=1164, 450+225sin30=450+113=563 -->
  <line x1="800" y1="450" x2="1164" y2="563" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>
  <!-- 110°: 800+420cos110=800-144=656, 450+225sin110=450+211=661 -->
  <line x1="800" y1="450" x2="656" y2="661" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>
  <!-- 190°: 800+420cos190=800-413=387, 450+225sin190=450-39=411 -->
  <line x1="800" y1="450" x2="387" y2="411" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>
  <!-- 270°: 800+420cos270=800+0=800, 450+225sin270=450-225=225 -->
  <line x1="800" y1="450" x2="800" y2="225" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>
  <!-- 350°: 800+420cos350=800+414=1214, 450+225sin350=450-39=411 -->
  <line x1="800" y1="450" x2="1214" y2="411" stroke="#fbbf24" stroke-width="1.5" opacity="0.45"/>

  <!-- Orbit nodes — violet, medium size -->
  <circle cx="1164" cy="563" r="22" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="656" cy="661" r="22" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="387" cy="411" r="22" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="800" cy="225" r="22" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="1214" cy="411" r="22" fill="url(#nodeFill)" opacity="0.88"/>

  <!-- Inner secondary nodes on inner ellipse (rx=250 ry=135): angles 60°, 180°, 300° -->
  <!-- 60°:  800+250cos60=800+125=925, 450+135sin60=450+117=567 -->
  <circle cx="925" cy="567" r="13" fill="#d97706" opacity="0.75"/>
  <!-- 180°: 800+250cos180=800-250=550, 450+135sin180=450 -->
  <circle cx="550" cy="450" r="13" fill="#d97706" opacity="0.75"/>
  <!-- 300°: 800+250cos300=800+125=925, 450+135sin300=450-117=333 -->
  <circle cx="925" cy="333" r="13" fill="#d97706" opacity="0.75"/>

  <!-- Hero hub: rust diamond centred at 800,450 -->
  <!-- Diamond = rotated square, half-diagonal ~90px -->
  <polygon points="800,355 895,450 800,545 705,450" fill="url(#hubFill)" opacity="0.95"/>
  <!-- Inner diamond highlight -->
  <polygon points="800,390 840,450 800,510 760,450" fill="#fbbf24" opacity="0.55"/>
  <!-- Hub centre dot -->
  <circle cx="800" cy="450" r="18" fill="#fef3ec" opacity="0.85"/>
</svg>
