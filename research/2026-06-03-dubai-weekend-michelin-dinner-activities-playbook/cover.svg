<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Evening sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Radial glow: setting sun / city warmth -->
    <radialGradient id="glow" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Dome gradient -->
    <linearGradient id="domeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Dune gradient -->
    <linearGradient id="duneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Dune front gradient -->
    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Atmospheric glow behind hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — stylised mosque dome and minarets, centered ~(800,420) -->

  <!-- Left minaret -->
  <rect x="645" y="340" width="36" height="200" rx="4" fill="url(#domeGrad)" opacity="0.88"/>
  <ellipse cx="663" cy="338" rx="18" ry="28" fill="#fbbf24" opacity="0.85"/>
  <!-- Minaret cap left -->
  <ellipse cx="663" cy="314" rx="7" ry="11" fill="#d97706" opacity="0.9"/>

  <!-- Right minaret -->
  <rect x="919" y="340" width="36" height="200" rx="4" fill="url(#domeGrad)" opacity="0.88"/>
  <ellipse cx="937" cy="338" rx="18" ry="28" fill="#fbbf24" opacity="0.85"/>
  <!-- Minaret cap right -->
  <ellipse cx="937" cy="314" rx="7" ry="11" fill="#d97706" opacity="0.9"/>

  <!-- Main mosque body -->
  <rect x="660" y="530" width="280" height="120" rx="6" fill="#9a3309" opacity="0.92"/>

  <!-- Arched doorway suggestion (three arches as decorative negative) -->
  <ellipse cx="740" cy="530" rx="26" ry="34" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="800" cy="530" rx="26" ry="34" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="860" cy="530" rx="26" ry="34" fill="#5c2a1a" opacity="0.7"/>

  <!-- Main dome -->
  <path d="M 680,535 Q 680,340 800,320 Q 920,340 920,535 Z" fill="url(#domeGrad)" opacity="0.95"/>

  <!-- Dome highlight arc -->
  <path d="M 720,510 Q 720,390 800,370 Q 850,385 870,430" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.35"/>

  <!-- Dome finial -->
  <line x1="800" y1="318" x2="800" y2="285" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
  <ellipse cx="800" cy="281" rx="7" ry="7" fill="#fbbf24" opacity="0.85"/>
  <!-- Crescent on finial -->
  <path d="M 793,275 A 10,10 0 0 1 807,275 A 7,7 0 0 0 793,275 Z" fill="#d97706" opacity="0.9"/>

  <!-- Layer 3: Dune shapes in lower portion -->

  <!-- Back dune -->
  <path d="M 0,820 Q 250,680 550,740 Q 800,800 1050,700 Q 1300,620 1600,730 L 1600,900 L 0,900 Z"
        fill="url(#duneGrad)" opacity="0.72"/>

  <!-- Mid dune -->
  <path d="M 0,870 Q 200,760 480,810 Q 700,850 900,780 Q 1150,710 1400,790 Q 1500,820 1600,800 L 1600,900 L 0,900 Z"
        fill="#78350f" opacity="0.80"/>

  <!-- Front dune -->
  <path d="M 0,900 Q 300,830 600,870 Q 900,910 1200,850 Q 1430,820 1600,860 L 1600,900 Z"
        fill="url(#duneFront)" opacity="0.88"/>

</svg>
