<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.38" r="0.28">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="vine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Distant hill silhouette -->
  <path d="M0,560 Q280,470 560,510 T1120,490 Q1360,460 1600,500 L1600,900 L0,900 Z" fill="#d97706" opacity="0.25"/>

  <!-- Vineyard hill (mid) with terraced rows -->
  <path d="M0,620 Q300,540 640,580 Q980,615 1280,560 Q1450,530 1600,560 L1600,900 L0,900 Z" fill="url(#vine)" opacity="0.85"/>

  <!-- Terrace rows: faint contour lines on vineyard -->
  <g stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35">
    <path d="M0,660 Q320,590 660,625 Q1000,655 1300,605 Q1460,580 1600,605"/>
    <path d="M0,710 Q320,645 660,680 Q1000,710 1300,665 Q1460,645 1600,665"/>
    <path d="M0,760 Q320,705 660,735 Q1000,760 1300,725 Q1460,710 1600,725"/>
  </g>

  <!-- River curve sweeping foreground -->
  <path d="M0,820 Q380,760 720,790 Q1060,820 1340,775 Q1480,752 1600,765 L1600,900 L0,900 Z" fill="url(#river)"/>
  <path d="M0,820 Q380,760 720,790 Q1060,820 1340,775 Q1480,752 1600,765" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- Castle hero, centered ~ (800, 430), within safe zone -->
  <g transform="translate(640,260)">
    <!-- Main keep body -->
    <rect x="80" y="120" width="180" height="220" fill="url(#castle)"/>
    <!-- Crenellations on keep -->
    <g fill="#78350f">
      <rect x="80"  y="110" width="22" height="18"/>
      <rect x="120" y="110" width="22" height="18"/>
      <rect x="160" y="110" width="22" height="18"/>
      <rect x="200" y="110" width="22" height="18"/>
      <rect x="240" y="110" width="22" height="18"/>
    </g>

    <!-- Left tower (shorter) -->
    <rect x="20" y="180" width="70" height="160" fill="#9a3309"/>
    <polygon points="20,180 55,120 90,180" fill="#c2410c"/>

    <!-- Right tower (taller, hero turret) -->
    <rect x="250" y="80" width="90" height="260" fill="#9a3309"/>
    <polygon points="250,80 295,0 340,80" fill="#c2410c"/>
    <!-- Turret finial dot -->
    <circle cx="295" cy="-4" r="5" fill="#fbbf24"/>

    <!-- Far right small tower -->
    <rect x="300" y="200" width="48" height="140" fill="#78350f"/>
    <polygon points="300,200 324,160 348,200" fill="#9a3309"/>

    <!-- Windows on keep (arched glow) -->
    <g fill="#fbbf24" opacity="0.85">
      <rect x="105" y="200" width="18" height="32" rx="9"/>
      <rect x="155" y="200" width="18" height="32" rx="9"/>
      <rect x="205" y="200" width="18" height="32" rx="9"/>
      <rect x="130" y="265" width="22" height="40" rx="11"/>
      <rect x="180" y="265" width="22" height="40" rx="11"/>
    </g>
    <!-- Tower windows -->
    <rect x="40"  y="220" width="14" height="22" rx="7" fill="#fbbf24" opacity="0.85"/>
    <rect x="62"  y="260" width="14" height="22" rx="7" fill="#fbbf24" opacity="0.7"/>
    <rect x="275" y="140" width="16" height="26" rx="8" fill="#fbbf24" opacity="0.9"/>
    <rect x="298" y="140" width="16" height="26" rx="8" fill="#fbbf24" opacity="0.9"/>
    <rect x="285" y="210" width="20" height="30" rx="10" fill="#fbbf24" opacity="0.85"/>

    <!-- Base shadow grounding the castle into vineyard -->
    <ellipse cx="180" cy="345" rx="200" ry="12" fill="#5c2a1a" opacity="0.35"/>
  </g>

  <!-- Faint reflection in river below castle -->
  <g opacity="0.18" transform="translate(640,260)">
    <rect x="80" y="560" width="180" height="60" fill="#78350f"/>
    <rect x="250" y="560" width="90" height="70" fill="#9a3309"/>
    <rect x="20" y="560" width="70" height="50" fill="#9a3309"/>
  </g>
</svg>
