<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="470" r="520" fill="url(#sun)"/>

  <!-- forested peninsula enclosed by the loop -->
  <path d="M 800 240
           C 970 245, 1080 330, 1080 470
           C 1080 600, 980 680, 820 680
           C 760 680, 720 660, 700 620
           C 720 600, 740 560, 740 510
           C 740 430, 700 380, 660 350
           C 700 300, 750 260, 800 240 Z"
        fill="url(#forest)"/>

  <!-- the Saarschleife: 300-degree horseshoe bend, hero element -->
  <path d="M 420 760
           C 420 660, 480 600, 560 590
           C 660 580, 740 620, 760 510
           C 780 380, 660 320, 580 320
           C 480 320, 420 380, 420 240"
        fill="none"
        stroke="url(#river)"
        stroke-width="58"
        stroke-linecap="round"/>

  <!-- river continuing south, lighter -->
  <path d="M 420 760 C 430 800, 460 830, 510 850"
        fill="none"
        stroke="#c2410c"
        stroke-width="42"
        stroke-linecap="round"
        opacity="0.55"/>
  <path d="M 420 240 C 415 200, 400 170, 370 140"
        fill="none"
        stroke="#c2410c"
        stroke-width="42"
        stroke-linecap="round"
        opacity="0.55"/>

  <!-- highlight glint on the river -->
  <path d="M 460 540
           C 470 470, 520 430, 600 420"
        fill="none"
        stroke="#fbbf24"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.75"/>

  <!-- viewpoint marker (Cloef lookout) at the apex of the bend -->
  <circle cx="785" cy="455" r="14" fill="#78350f"/>
  <circle cx="785" cy="455" r="6" fill="#fbbf24"/>

  <!-- distant ridgeline accents, outside hero focus -->
  <path d="M 1100 500 L 1200 460 L 1290 490 L 1380 450 L 1460 480 L 1500 470"
        fill="none" stroke="#9a3309" stroke-width="3" opacity="0.45"/>
  <path d="M 1100 560 L 1220 530 L 1320 555 L 1430 525 L 1500 545"
        fill="none" stroke="#9a3309" stroke-width="3" opacity="0.30"/>
</svg>
