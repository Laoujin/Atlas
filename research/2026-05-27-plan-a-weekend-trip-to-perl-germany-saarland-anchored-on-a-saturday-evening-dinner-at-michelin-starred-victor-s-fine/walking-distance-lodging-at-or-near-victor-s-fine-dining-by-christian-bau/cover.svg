<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="lodge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm sun glow -->
  <circle cx="800" cy="380" r="360" fill="url(#sun)"/>

  <!-- distant vineyard hill ridges -->
  <path d="M 0 620 Q 300 560 600 600 T 1200 590 T 1600 610 L 1600 700 L 0 700 Z" fill="#9a3309" opacity="0.18"/>
  <path d="M 0 660 Q 400 620 800 640 T 1600 650 L 1600 720 L 0 720 Z" fill="#78350f" opacity="0.22"/>

  <!-- Mosel river band -->
  <path d="M 0 720 Q 400 700 800 715 T 1600 710 L 1600 780 Q 1200 795 800 778 T 0 785 Z" fill="url(#river)"/>

  <!-- Castle (left hero): main keep + two flanking towers -->
  <g opacity="0.92">
    <!-- left tower -->
    <rect x="540" y="430" width="70" height="240" fill="url(#castle)"/>
    <polygon points="535,430 615,430 575,390" fill="#78350f"/>
    <!-- main body -->
    <rect x="610" y="380" width="170" height="290" fill="url(#castle)"/>
    <!-- crenellations on main body -->
    <rect x="610" y="370" width="22" height="14" fill="#78350f"/>
    <rect x="644" y="370" width="22" height="14" fill="#78350f"/>
    <rect x="678" y="370" width="22" height="14" fill="#78350f"/>
    <rect x="712" y="370" width="22" height="14" fill="#78350f"/>
    <rect x="746" y="370" width="22" height="14" fill="#78350f"/>
    <!-- central tower with conical roof -->
    <rect x="665" y="310" width="60" height="80" fill="#9a3309"/>
    <polygon points="660,310 730,310 695,250" fill="#78350f"/>
    <!-- right tower -->
    <rect x="780" y="430" width="70" height="240" fill="url(#castle)"/>
    <polygon points="775,430 855,430 815,390" fill="#78350f"/>
    <!-- arched gate -->
    <path d="M 680 670 L 680 590 Q 695 560 710 590 L 710 670 Z" fill="#1a0e0e" opacity="0.55"/>
    <!-- small windows -->
    <rect x="555" y="490" width="14" height="22" fill="#1a0e0e" opacity="0.55"/>
    <rect x="582" y="490" width="14" height="22" fill="#1a0e0e" opacity="0.55"/>
    <rect x="795" y="490" width="14" height="22" fill="#1a0e0e" opacity="0.55"/>
    <rect x="822" y="490" width="14" height="22" fill="#1a0e0e" opacity="0.55"/>
    <rect x="685" y="450" width="14" height="22" fill="#1a0e0e" opacity="0.55"/>
    <rect x="712" y="450" width="14" height="22" fill="#1a0e0e" opacity="0.55"/>
  </g>

  <!-- Lodge (right): simpler villa with portico -->
  <g opacity="0.9">
    <!-- main body -->
    <rect x="1000" y="500" width="280" height="170" fill="url(#lodge)"/>
    <!-- roof -->
    <polygon points="990,500 1290,500 1240,440 1040,440" fill="#78350f"/>
    <!-- portico columns -->
    <rect x="1030" y="540" width="10" height="130" fill="#fef3ec" opacity="0.55"/>
    <rect x="1075" y="540" width="10" height="130" fill="#fef3ec" opacity="0.55"/>
    <rect x="1195" y="540" width="10" height="130" fill="#fef3ec" opacity="0.55"/>
    <rect x="1240" y="540" width="10" height="130" fill="#fef3ec" opacity="0.55"/>
    <!-- door -->
    <path d="M 1125 670 L 1125 580 Q 1140 560 1155 580 L 1155 670 Z" fill="#1a0e0e" opacity="0.55"/>
    <!-- pediment accent -->
    <polygon points="1090,490 1190,490 1140,460" fill="#fbbf24" opacity="0.35"/>
  </g>

  <!-- Walking path between castle and lodge: dotted footsteps -->
  <g fill="#78350f" opacity="0.75">
    <ellipse cx="880" cy="685" rx="10" ry="6"/>
    <ellipse cx="910" cy="700" rx="10" ry="6"/>
    <ellipse cx="940" cy="685" rx="10" ry="6"/>
    <ellipse cx="970" cy="700" rx="10" ry="6"/>
    <ellipse cx="1000" cy="685" rx="10" ry="6"/>
  </g>

  <!-- foreground vineyard rows hinted as diagonal strokes (decoration, edge) -->
  <g stroke="#78350f" stroke-width="2" opacity="0.22" fill="none">
    <line x1="60" y1="820" x2="180" y2="760"/>
    <line x1="120" y1="850" x2="260" y2="780"/>
    <line x1="200" y1="870" x2="340" y2="800"/>
    <line x1="1380" y1="780" x2="1520" y2="830"/>
    <line x1="1340" y1="800" x2="1480" y2="860"/>
  </g>
</svg>
