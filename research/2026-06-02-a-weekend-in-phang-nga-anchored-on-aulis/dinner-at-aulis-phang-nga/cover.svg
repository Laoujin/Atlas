<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark evening background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1008"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm central glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate fill gradient -->
    <radialGradient id="plateMain" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4bfa8"/>
    </radialGradient>

    <!-- Plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="86%" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3d1a08" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Second plate fill -->
    <radialGradient id="plateSecond" cx="55%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="60%" stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#c8aa90"/>
    </radialGradient>

    <!-- Wine glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Rose wine glow in glass -->
    <radialGradient id="wineGlow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Candle flame glow -->
    <radialGradient id="flameGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed dark background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Warm ambient glow at center -->
  <rect width="1600" height="900" fill="url(#glowCenter)"/>

  <!-- Subtle rose accent wash — bottom edge atmosphere -->
  <ellipse cx="800" cy="950" rx="700" ry="300" fill="#be185d" opacity="0.07"/>

  <!-- Layer 2: Hero — two overlapping plates centered around (800, 450) -->

  <!-- Back plate (slightly offset, larger, behind) -->
  <circle cx="870" cy="460" r="230" fill="url(#plateSecond)" opacity="0.88"/>
  <circle cx="870" cy="460" r="230" fill="url(#plateRim)" opacity="0.75"/>
  <!-- Inner well of back plate -->
  <circle cx="870" cy="460" r="165" fill="#ede3d7" opacity="0.6"/>

  <!-- Front plate (hero, centered left-of-center) -->
  <circle cx="730" cy="450" r="245" fill="url(#plateMain)" opacity="0.95"/>
  <circle cx="730" cy="450" r="245" fill="url(#plateRim)" opacity="0.8"/>
  <!-- Inner well of front plate -->
  <circle cx="730" cy="450" r="178" fill="#f5ede3" opacity="0.65"/>

  <!-- Subtle food composition suggestion — small rust dot cluster on front plate -->
  <circle cx="730" cy="440" r="28" fill="#c2410c" opacity="0.72"/>
  <circle cx="762" cy="460" r="14" fill="#9a3309" opacity="0.6"/>
  <circle cx="700" cy="458" r="10" fill="#d97706" opacity="0.65"/>
  <circle cx="718" cy="474" r="8" fill="#78350f" opacity="0.5"/>

  <!-- Wine glass silhouette — right of plates, inside safe zone -->
  <!-- Bowl of glass -->
  <ellipse cx="1120" cy="420" rx="48" ry="60" fill="url(#wineGlow)" opacity="0.75"/>
  <ellipse cx="1120" cy="420" rx="48" ry="60" fill="url(#glassGrad)" opacity="0.55"/>
  <!-- Stem -->
  <rect x="1116" y="478" width="8" height="110" fill="#be185d" opacity="0.45"/>
  <!-- Base -->
  <ellipse cx="1120" cy="590" rx="36" ry="8" fill="#be185d" opacity="0.4"/>
  <!-- Rim highlight -->
  <ellipse cx="1120" cy="362" rx="48" ry="7" fill="#f472b6" opacity="0.3"/>

  <!-- Candle accent — left side of composition, inside safe zone -->
  <!-- Candle body -->
  <rect x="554" y="490" width="18" height="100" rx="3" fill="#fef3ec" opacity="0.75"/>
  <!-- Flame glow -->
  <ellipse cx="563" cy="480" rx="22" ry="28" fill="url(#flameGlow)" opacity="0.85"/>
  <!-- Flame shape -->
  <ellipse cx="563" cy="476" rx="8" ry="16" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="563" cy="480" rx="4" ry="8" fill="#fff7ed" opacity="0.95"/>

  <!-- Layer 3: Decorative edge atmosphere (safe to crop) -->
  <!-- Corner rust wash top-left -->
  <ellipse cx="0" cy="0" rx="350" ry="250" fill="#c2410c" opacity="0.08"/>
  <!-- Corner accent bottom-right -->
  <ellipse cx="1600" cy="900" rx="400" ry="280" fill="#9a3309" opacity="0.1"/>
  <!-- Top edge thin line accent -->
  <rect x="0" y="0" width="1600" height="3" fill="#d97706" opacity="0.25"/>
  <!-- Bottom edge thin line accent -->
  <rect x="0" y="897" width="1600" height="3" fill="#d97706" opacity="0.2"/>
</svg>
