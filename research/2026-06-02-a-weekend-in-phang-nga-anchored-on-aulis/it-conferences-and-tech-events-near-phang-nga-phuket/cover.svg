<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#glow)"/>

  <!-- Layer 2: Hero — three stacked angled conference badge / slide cards -->

  <!-- Back card (bottom-most, shifted left and up slightly) -->
  <rect x="480" y="240" width="560" height="390" rx="14"
        fill="url(#card3)" opacity="0.72"
        transform="rotate(-7 760 435)"/>

  <!-- Middle card -->
  <rect x="510" y="225" width="560" height="390" rx="14"
        fill="url(#card2)" opacity="0.85"
        transform="rotate(-2 790 420)"/>

  <!-- Decorative stripe on middle card -->
  <rect x="510" y="310" width="560" height="18" rx="4"
        fill="url(#stripe)" opacity="0.9"
        transform="rotate(-2 790 420)"/>
  <rect x="510" y="346" width="560" height="10" rx="4"
        fill="url(#stripe)" opacity="0.6"
        transform="rotate(-2 790 420)"/>
  <rect x="510" y="368" width="560" height="10" rx="4"
        fill="url(#stripe)" opacity="0.45"
        transform="rotate(-2 790 420)"/>

  <!-- Front card (hero face) -->
  <rect x="540" y="210" width="560" height="390" rx="14"
        fill="url(#card1)" opacity="0.95"
        transform="rotate(3 820 405)"/>

  <!-- Accent bar on front card top -->
  <rect x="540" y="210" width="560" height="36" rx="14"
        fill="#fbbf24" opacity="0.55"
        transform="rotate(3 820 405)"/>
  <rect x="540" y="232" width="560" height="14" rx="0"
        fill="#fbbf24" opacity="0.55"
        transform="rotate(3 820 405)"/>

  <!-- Decorative horizontal lines on front card (faux text-line bars) -->
  <rect x="600" y="310" width="380" height="14" rx="4"
        fill="#fef3ec" opacity="0.30"
        transform="rotate(3 820 405)"/>
  <rect x="600" y="338" width="280" height="10" rx="4"
        fill="#fef3ec" opacity="0.22"
        transform="rotate(3 820 405)"/>
  <rect x="600" y="362" width="320" height="10" rx="4"
        fill="#fef3ec" opacity="0.22"
        transform="rotate(3 820 405)"/>
  <rect x="600" y="386" width="240" height="10" rx="4"
        fill="#fef3ec" opacity="0.18"
        transform="rotate(3 820 405)"/>

  <!-- Node-and-edge accent: two dots with connecting line (top-right of safe zone) -->
  <line x1="1220" y1="200" x2="1380" y2="300"
        stroke="#d97706" stroke-width="3" opacity="0.45"/>
  <circle cx="1220" cy="200" r="14" fill="#c2410c" opacity="0.65"/>
  <circle cx="1380" cy="300" r="10" fill="#d97706" opacity="0.55"/>

  <!-- Second smaller node pair (bottom-left) -->
  <line x1="220" y1="640" x2="340" y2="730"
        stroke="#d97706" stroke-width="2.5" opacity="0.35"/>
  <circle cx="220" cy="640" r="11" fill="#9a3309" opacity="0.55"/>
  <circle cx="340" cy="730" r="8" fill="#c2410c" opacity="0.45"/>

</svg>
