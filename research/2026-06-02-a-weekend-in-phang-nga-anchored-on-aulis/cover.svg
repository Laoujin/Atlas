<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm candlelight glow at centre -->
    <radialGradient id="glowGrad" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate surface gradient -->
    <radialGradient id="plateGrad1" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b8"/>
    </radialGradient>
    <radialGradient id="plateGrad2" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#ede4d5"/>
      <stop offset="100%" stop-color="#cfc3b1"/>
    </radialGradient>
    <!-- Rim shadow -->
    <radialGradient id="rimShadow" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#0000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Horizon sea shimmer -->
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Candle flame gradient -->
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Sea horizon band (lower third, decorative) -->
  <rect x="0" y="620" width="1600" height="120" fill="url(#seaGrad)" opacity="0.7"/>
  <!-- Horizon line -->
  <line x1="0" y1="620" x2="1600" y2="620" stroke="#9a3309" stroke-width="1.5" opacity="0.4"/>
  <!-- Subtle sea shimmer streaks -->
  <rect x="300" y="630" width="220" height="3" rx="2" fill="#d97706" opacity="0.12"/>
  <rect x="680" y="645" width="340" height="3" rx="2" fill="#d97706" opacity="0.15"/>
  <rect x="1100" y="638" width="180" height="3" rx="2" fill="#d97706" opacity="0.10"/>

  <!-- Layer 2: Warm ambient glow (centred on table scene) -->
  <rect width="1600" height="900" fill="url(#glowGrad)"/>

  <!-- TABLE SURFACE — dark ellipse suggesting a round chef's-table -->
  <ellipse cx="800" cy="600" rx="420" ry="80" fill="#3b1408" opacity="0.85"/>
  <ellipse cx="800" cy="600" rx="420" ry="80" fill="#c2410c" opacity="0.08"/>

  <!-- PLATE 1 (left, slightly behind) -->
  <ellipse cx="680" cy="510" rx="115" ry="115" fill="#78350f" opacity="0.55"/>
  <ellipse cx="680" cy="510" rx="108" ry="108" fill="url(#plateGrad2)"/>
  <ellipse cx="680" cy="510" rx="108" ry="108" fill="url(#rimShadow)"/>
  <!-- Inner well -->
  <ellipse cx="680" cy="510" rx="76" ry="76" fill="#f0eadb" opacity="0.9"/>
  <!-- Food element — abstract garnish arc -->
  <ellipse cx="680" cy="505" rx="28" ry="10" fill="#c2410c" opacity="0.75" transform="rotate(-18 680 505)"/>
  <circle cx="680" cy="498" r="6" fill="#d97706" opacity="0.9"/>

  <!-- PLATE 2 (right, hero, front) -->
  <ellipse cx="930" cy="490" rx="130" ry="130" fill="#78350f" opacity="0.6"/>
  <ellipse cx="930" cy="490" rx="122" ry="122" fill="url(#plateGrad1)"/>
  <ellipse cx="930" cy="490" rx="122" ry="122" fill="url(#rimShadow)"/>
  <!-- Inner well -->
  <ellipse cx="930" cy="490" rx="86" ry="86" fill="#faf8f2" opacity="0.92"/>
  <!-- Food element — abstract sauce arc + dot accent -->
  <ellipse cx="930" cy="483" rx="32" ry="11" fill="#9a3309" opacity="0.78" transform="rotate(12 930 483)"/>
  <circle cx="916" cy="472" r="7" fill="#c2410c" opacity="0.88"/>
  <circle cx="945" cy="476" r="4" fill="#d97706" opacity="0.9"/>
  <circle cx="932" cy="462" r="3" fill="#fbbf24" opacity="0.85"/>

  <!-- CANDLE — between plates, on table -->
  <!-- Candle body -->
  <rect x="793" y="478" width="14" height="52" rx="3" fill="#fef3ec" opacity="0.9"/>
  <!-- Flame -->
  <ellipse cx="800" cy="472" rx="7" ry="12" fill="url(#flameGrad)" opacity="0.95"/>
  <ellipse cx="800" cy="476" rx="3.5" ry="6" fill="#fbbf24" opacity="0.9"/>
  <!-- Candle glow halo -->
  <ellipse cx="800" cy="472" rx="26" ry="22" fill="#d97706" opacity="0.12"/>

  <!-- Layer 3: Corner decoration (outside safe zone — purely atmospheric) -->
  <!-- Top-left warm vignette arc -->
  <ellipse cx="0" cy="0" rx="320" ry="220" fill="#c2410c" opacity="0.07"/>
  <!-- Bottom-right warm vignette arc -->
  <ellipse cx="1600" cy="900" rx="360" ry="240" fill="#9a3309" opacity="0.10"/>
</svg>
