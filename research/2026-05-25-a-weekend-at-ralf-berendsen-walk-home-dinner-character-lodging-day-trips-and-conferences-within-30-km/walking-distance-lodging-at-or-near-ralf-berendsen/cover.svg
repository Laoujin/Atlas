<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="lampA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Warm evening glow centered on hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant tree-line silhouette (decorative, full-bleed) -->
  <path d="M0,560 L60,520 L110,545 L170,500 L230,535 L290,495 L360,525 L430,490 L500,520 L570,485 L640,515 L720,480 L800,510 L880,475 L960,505 L1040,470 L1110,500 L1180,465 L1250,495 L1320,460 L1390,490 L1460,455 L1530,485 L1600,470 L1600,620 L0,620 Z"
        fill="#2a1410" opacity="0.85"/>

  <!-- Ground -->
  <rect y="600" width="1600" height="300" fill="url(#ground)"/>

  <!-- Winding path connecting the two lodgings -->
  <path d="M250,860 Q500,720 780,700 Q1050,680 1330,820"
        stroke="#9a3309" stroke-width="14" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M250,860 Q500,720 780,700 Q1050,680 1330,820"
        stroke="#d97706" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- Smaller secondary lodging (family hotel) — right side, further/smaller -->
  <g opacity="0.95">
    <rect x="1230" y="600" width="180" height="120" fill="#3a1a10"/>
    <polygon points="1220,600 1320,545 1420,600" fill="#2a1410"/>
    <rect x="1255" y="635" width="22" height="30" fill="url(#window)" opacity="0.9"/>
    <rect x="1295" y="635" width="22" height="30" fill="url(#window)" opacity="0.9"/>
    <rect x="1335" y="635" width="22" height="30" fill="url(#window)" opacity="0.9"/>
    <rect x="1375" y="635" width="22" height="30" fill="url(#window)" opacity="0.9"/>
    <rect x="1275" y="680" width="26" height="40" fill="url(#window)" opacity="0.85"/>
    <rect x="1335" y="680" width="26" height="40" fill="url(#window)" opacity="0.85"/>
  </g>

  <!-- Hero: the estate manor — left-center, larger, centered roughly at (560, 500) -->
  <g>
    <!-- Lamp glow halo behind manor -->
    <ellipse cx="560" cy="540" rx="420" ry="180" fill="url(#lampA)" opacity="0.6"/>

    <!-- Main manor body -->
    <rect x="380" y="440" width="380" height="200" fill="#3a1a10"/>
    <!-- Side wing -->
    <rect x="730" y="490" width="120" height="150" fill="#2a1410"/>
    <!-- Central tower -->
    <rect x="510" y="380" width="120" height="260" fill="#3a1a10"/>

    <!-- Roofs -->
    <polygon points="370,440 570,330 770,440" fill="#78350f"/>
    <polygon points="500,380 570,320 640,380" fill="#9a3309"/>
    <polygon points="720,490 790,445 860,490" fill="#5c2a1a"/>

    <!-- Chimney -->
    <rect x="450" y="370" width="22" height="40" fill="#2a1410"/>

    <!-- Window grid — warm glow -->
    <g fill="url(#window)">
      <rect x="405" y="475" width="26" height="34"/>
      <rect x="445" y="475" width="26" height="34"/>
      <rect x="660" y="475" width="26" height="34"/>
      <rect x="700" y="475" width="26" height="34"/>
      <rect x="405" y="545" width="26" height="34"/>
      <rect x="445" y="545" width="26" height="34"/>
      <rect x="660" y="545" width="26" height="34"/>
      <rect x="700" y="545" width="26" height="34"/>
      <rect x="535" y="430" width="28" height="38"/>
      <rect x="577" y="430" width="28" height="38"/>
      <rect x="535" y="490" width="28" height="38"/>
      <rect x="577" y="490" width="28" height="38"/>
      <rect x="555" y="560" width="30" height="80" opacity="0.95"/>
      <rect x="755" y="525" width="22" height="30"/>
      <rect x="795" y="525" width="22" height="30"/>
      <rect x="755" y="575" width="22" height="30"/>
      <rect x="795" y="575" width="22" height="30"/>
    </g>
  </g>

  <!-- Foreground tree silhouettes framing the scene -->
  <g fill="#1a0e0e" opacity="0.92">
    <path d="M140,900 L140,560 Q150,530 165,520 Q175,500 185,520 Q200,510 205,535 Q220,545 215,580 L220,900 Z"/>
    <path d="M1490,900 L1490,580 Q1500,550 1515,540 Q1525,520 1535,540 Q1550,530 1555,555 Q1570,565 1565,600 L1570,900 Z"/>
  </g>

  <!-- Subtle starlight specks (decoration outside hero band) -->
  <g fill="#fbbf24" opacity="0.5">
    <circle cx="180" cy="120" r="2"/>
    <circle cx="320" cy="80" r="1.5"/>
    <circle cx="1280" cy="110" r="2"/>
    <circle cx="1450" cy="70" r="1.5"/>
    <circle cx="900" cy="60" r="2"/>
  </g>
</svg>
