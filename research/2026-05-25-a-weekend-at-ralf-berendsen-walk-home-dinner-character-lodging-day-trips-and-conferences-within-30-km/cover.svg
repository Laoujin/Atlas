<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d97706" stop-offset="0.7" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.75" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="treeline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant warm haze, full-bleed so card and detail both feel lit -->
  <ellipse cx="800" cy="560" rx="1100" ry="380" fill="url(#glow)" opacity="0.85"/>

  <!-- silhouette estate treeline (decoration, mostly below safe zone) -->
  <path d="M0,720 L60,690 L110,705 L160,665 L210,695 L260,670 L310,700 L360,675 L410,695 L470,660 L520,690 L580,675 L640,695 L700,665 L760,690 L820,672 L880,695 L940,668 L1000,690 L1060,672 L1120,695 L1180,665 L1240,690 L1300,670 L1360,695 L1420,668 L1480,690 L1540,672 L1600,695 L1600,900 L0,900 Z" fill="url(#treeline)" opacity="0.92"/>

  <!-- hero: glowing dinner plate, centered in safe zone -->
  <g transform="translate(800 450)">
    <!-- soft underplate glow -->
    <circle r="320" fill="#d97706" opacity="0.18"/>
    <circle r="240" fill="#fbbf24" opacity="0.22"/>
    <!-- outer rim -->
    <circle r="210" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.75"/>
    <!-- plate -->
    <circle r="195" fill="url(#plate)" opacity="0.92"/>
    <!-- inner rim -->
    <circle r="150" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.55"/>
    <!-- composed star: five-pointed michelin nod, but reads as plated arrangement -->
    <g opacity="0.9">
      <path d="M0,-70 L16,-22 L66,-22 L26,7 L41,55 L0,26 L-41,55 L-26,7 L-66,-22 L-16,-22 Z" fill="#c2410c"/>
      <path d="M0,-70 L16,-22 L66,-22 L26,7 L41,55 L0,26 L-41,55 L-26,7 L-66,-22 L-16,-22 Z" fill="none" stroke="#78350f" stroke-width="1.2" opacity="0.7"/>
    </g>
    <!-- garnish dots -->
    <circle cx="-95" cy="60" r="6" fill="#fbbf24" opacity="0.85"/>
    <circle cx="100" cy="-55" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="80" cy="80" r="4" fill="#d97706" opacity="0.9"/>
    <circle cx="-70" cy="-80" r="3.5" fill="#d97706" opacity="0.85"/>
  </g>

  <!-- estate spires breaking the treeline into the safe zone, framing the hero -->
  <path d="M180,720 L180,560 L195,545 L210,560 L210,720 Z" fill="#1a0e0e" opacity="0.95"/>
  <path d="M195,545 L195,520" stroke="#1a0e0e" stroke-width="3"/>
  <path d="M1390,720 L1390,575 L1405,558 L1420,575 L1420,720 Z" fill="#1a0e0e" opacity="0.95"/>
  <path d="M1405,558 L1405,532" stroke="#1a0e0e" stroke-width="3"/>

  <!-- a few faint stars / hearth sparks above -->
  <circle cx="320" cy="160" r="1.8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1280" cy="200" r="1.6" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1100" cy="130" r="1.4" fill="#fef3ec" opacity="0.55"/>
  <circle cx="500" cy="180" r="1.5" fill="#fef3ec" opacity="0.5"/>
</svg>
