<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="node" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- concentric radius rings -->
  <g fill="none" stroke="#c2410c" stroke-opacity="0.32">
    <circle cx="800" cy="450" r="120" stroke-width="1.4"/>
    <circle cx="800" cy="450" r="220" stroke-width="1.4"/>
    <circle cx="800" cy="450" r="320" stroke-width="1.4"/>
    <circle cx="800" cy="450" r="420" stroke-width="1.2" stroke-dasharray="3 7"/>
  </g>

  <!-- crosshair axes, faint -->
  <g stroke="#78350f" stroke-opacity="0.18" stroke-width="1">
    <line x1="800" y1="20" x2="800" y2="880"/>
    <line x1="260" y1="450" x2="1340" y2="450"/>
  </g>

  <!-- connector lines from hub to venue nodes -->
  <g stroke="#9a3309" stroke-opacity="0.55" stroke-width="1.6">
    <line x1="800" y1="450" x2="1080" y2="280"/>
    <line x1="800" y1="450" x2="540" y2="320"/>
    <line x1="800" y1="450" x2="1140" y2="610"/>
    <line x1="800" y1="450" x2="500" y2="600"/>
  </g>

  <!-- venue nodes: Maastricht, Hasselt, Brightlands Heerlen, Thor Park Genk -->
  <g>
    <circle cx="1080" cy="280" r="18" fill="url(#node)" opacity="0.92"/>
    <circle cx="540" cy="320" r="18" fill="url(#node)" opacity="0.92"/>
    <circle cx="1140" cy="610" r="18" fill="url(#node)" opacity="0.92"/>
    <circle cx="500" cy="600" r="18" fill="url(#node)" opacity="0.92"/>
  </g>

  <!-- central hub: Ralf Berendsen / Lanaken anchor -->
  <g>
    <circle cx="800" cy="450" r="58" fill="url(#hub)" opacity="0.95"/>
    <circle cx="800" cy="450" r="58" fill="none" stroke="#fef3ec" stroke-width="3" opacity="0.9"/>
    <circle cx="800" cy="450" r="22" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- subtle outer compass marks (decorative, may be cropped) -->
  <g stroke="#78350f" stroke-opacity="0.35" stroke-width="2">
    <line x1="800" y1="40" x2="800" y2="70"/>
    <line x1="800" y1="830" x2="800" y2="860"/>
    <line x1="280" y1="450" x2="310" y2="450"/>
    <line x1="1290" y1="450" x2="1320" y2="450"/>
  </g>
</svg>
