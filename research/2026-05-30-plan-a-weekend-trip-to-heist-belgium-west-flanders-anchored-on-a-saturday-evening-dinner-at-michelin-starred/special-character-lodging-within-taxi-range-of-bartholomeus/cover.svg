<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="villa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Sky / horizon -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow on horizon -->
  <circle cx="800" cy="560" r="320" fill="url(#sun)" opacity="0.9"/>

  <!-- Sea -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#sea)" opacity="0.92"/>

  <!-- Sun reflection on water -->
  <ellipse cx="800" cy="570" rx="180" ry="6" fill="#fbbf24" opacity="0.85"/>
  <ellipse cx="800" cy="600" rx="140" ry="3" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="630" rx="100" ry="2" fill="#fbbf24" opacity="0.4"/>
  <ellipse cx="800" cy="660" rx="70" ry="2" fill="#fbbf24" opacity="0.25"/>

  <!-- Dijk / promenade line -->
  <rect x="0" y="555" width="1600" height="8" fill="#c2410c" opacity="0.8"/>

  <!-- Villa row hero (Belle-Époque silhouettes along the Zeedijk) -->
  <!-- Villa 1: small gabled -->
  <g fill="url(#villa)" opacity="0.92">
    <rect x="300" y="430" width="120" height="125"/>
    <polygon points="300,430 360,380 420,430"/>
    <rect x="345" y="455" width="18" height="30" fill="#fbbf24" opacity="0.85"/>
    <rect x="375" y="455" width="18" height="30" fill="#fbbf24" opacity="0.75"/>
    <rect x="315" y="500" width="18" height="35" fill="#fbbf24" opacity="0.6"/>
  </g>

  <!-- Villa 2: tall tower (hero center-left) -->
  <g fill="url(#villa)" opacity="0.95">
    <rect x="520" y="340" width="160" height="215"/>
    <polygon points="520,340 600,260 680,340"/>
    <rect x="630" y="300" width="22" height="40"/>
    <polygon points="625,300 641,272 657,300"/>
    <rect x="545" y="380" width="22" height="35" fill="#fbbf24" opacity="0.9"/>
    <rect x="585" y="380" width="22" height="35" fill="#fbbf24" opacity="0.7"/>
    <rect x="625" y="380" width="22" height="35" fill="#fbbf24" opacity="0.85"/>
    <rect x="545" y="440" width="22" height="35" fill="#fbbf24" opacity="0.55"/>
    <rect x="585" y="440" width="22" height="35" fill="#fbbf24" opacity="0.8"/>
    <rect x="625" y="440" width="22" height="35" fill="#fbbf24" opacity="0.65"/>
    <rect x="585" y="500" width="30" height="55" fill="#1a0e0e"/>
  </g>

  <!-- Villa 3: central grand hotel (the hero anchor) -->
  <g fill="url(#villa)" opacity="0.95">
    <rect x="730" y="310" width="240" height="245"/>
    <polygon points="730,310 850,240 970,310"/>
    <rect x="838" y="265" width="24" height="50"/>
    <polygon points="832,265 850,232 868,265"/>
    <circle cx="850" cy="240" r="4" fill="#c2410c"/>
    <rect x="760" y="360" width="26" height="38" fill="#fbbf24" opacity="0.88"/>
    <rect x="805" y="360" width="26" height="38" fill="#fbbf24" opacity="0.78"/>
    <rect x="850" y="360" width="26" height="38" fill="#fbbf24" opacity="0.92"/>
    <rect x="895" y="360" width="26" height="38" fill="#fbbf24" opacity="0.7"/>
    <rect x="930" y="360" width="26" height="38" fill="#fbbf24" opacity="0.85"/>
    <rect x="760" y="420" width="26" height="38" fill="#fbbf24" opacity="0.6"/>
    <rect x="805" y="420" width="26" height="38" fill="#fbbf24" opacity="0.85"/>
    <rect x="850" y="420" width="26" height="38" fill="#fbbf24" opacity="0.7"/>
    <rect x="895" y="420" width="26" height="38" fill="#fbbf24" opacity="0.9"/>
    <rect x="930" y="420" width="26" height="38" fill="#fbbf24" opacity="0.65"/>
    <rect x="835" y="485" width="40" height="70" fill="#1a0e0e"/>
    <polygon points="830,485 850,470 875,485" fill="#1a0e0e"/>
  </g>

  <!-- Villa 4: gabled cottage -->
  <g fill="url(#villa)" opacity="0.92">
    <rect x="1010" y="400" width="140" height="155"/>
    <polygon points="1010,400 1080,345 1150,400"/>
    <rect x="1055" y="430" width="20" height="32" fill="#fbbf24" opacity="0.82"/>
    <rect x="1090" y="430" width="20" height="32" fill="#fbbf24" opacity="0.7"/>
    <rect x="1070" y="495" width="22" height="60" fill="#1a0e0e"/>
  </g>

  <!-- Villa 5: distant slim -->
  <g fill="url(#villa)" opacity="0.88">
    <rect x="1190" y="420" width="100" height="135"/>
    <polygon points="1190,420 1240,375 1290,420"/>
    <rect x="1215" y="450" width="16" height="28" fill="#fbbf24" opacity="0.75"/>
    <rect x="1245" y="450" width="16" height="28" fill="#fbbf24" opacity="0.6"/>
    <rect x="1215" y="500" width="16" height="55" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- Foreground: subtle wave crest -->
  <path d="M 0 720 Q 200 705 400 720 T 800 720 T 1200 720 T 1600 720 L 1600 740 L 0 740 Z" fill="#1a0e0e" opacity="0.35"/>
  <path d="M 0 790 Q 250 775 500 790 T 1000 790 T 1600 790 L 1600 810 L 0 810 Z" fill="#1a0e0e" opacity="0.45"/>
</svg>
