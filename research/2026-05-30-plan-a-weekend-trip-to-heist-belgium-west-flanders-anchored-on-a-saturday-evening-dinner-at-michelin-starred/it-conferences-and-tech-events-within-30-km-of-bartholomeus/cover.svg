<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Atmospheric sun glow (decoration, partially outside safe zone) -->
  <circle cx="1180" cy="320" r="420" fill="url(#sun)"/>

  <!-- Coastal horizon band -->
  <rect x="0" y="610" width="1600" height="290" fill="url(#sea)"/>
  <path d="M0 610 Q 400 600 800 612 T 1600 610 L 1600 640 L 0 640 Z" fill="#0e7490" opacity="0.35"/>

  <!-- Network edges (community graph) -->
  <g stroke="#78350f" stroke-width="2.2" opacity="0.65" fill="none">
    <line x1="800" y1="450" x2="540" y2="280"/>
    <line x1="800" y1="450" x2="1080" y2="270"/>
    <line x1="800" y1="450" x2="430" y2="500"/>
    <line x1="800" y1="450" x2="1170" y2="510"/>
    <line x1="800" y1="450" x2="610" y2="680"/>
    <line x1="800" y1="450" x2="1000" y2="700"/>
    <line x1="540" y1="280" x2="1080" y2="270"/>
    <line x1="430" y1="500" x2="610" y2="680"/>
    <line x1="1170" y1="510" x2="1000" y2="700"/>
    <line x1="540" y1="280" x2="430" y2="500"/>
    <line x1="1080" y1="270" x2="1170" y2="510"/>
  </g>

  <!-- Satellite nodes -->
  <g opacity="0.92">
    <circle cx="540" cy="280" r="26" fill="#c2410c"/>
    <circle cx="1080" cy="270" r="22" fill="#9a3309"/>
    <circle cx="430" cy="500" r="20" fill="#d97706"/>
    <circle cx="1170" cy="510" r="28" fill="#c2410c"/>
    <circle cx="610" cy="680" r="18" fill="#78350f"/>
    <circle cx="1000" cy="700" r="24" fill="#9a3309"/>
  </g>

  <!-- Hero hub: layered concentric rust core -->
  <circle cx="800" cy="450" r="120" fill="#78350f" opacity="0.25"/>
  <circle cx="800" cy="450" r="92" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="58" fill="#fbbf24" opacity="0.85"/>
  <circle cx="800" cy="450" r="22" fill="#faf8f2" opacity="0.9"/>
</svg>
