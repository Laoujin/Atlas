<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: warm ochre to deep sienna -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>

    <!-- Hero card gradient: rust to dark rust -->
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>

    <!-- Back card gradient: ochre warm -->
    <linearGradient id="backGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Third card: deep warm -->
    <linearGradient id="thirdGrad" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric warm glow centred on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="400" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — stacked angled event-badge / slide cards -->

  <!-- Third (back) card — angled right -->
  <rect x="560" y="205" width="520" height="340" rx="18"
        fill="url(#thirdGrad)" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.35"
        opacity="0.72"
        transform="rotate(10 800 375)"/>

  <!-- Second (mid) card — slight left tilt -->
  <rect x="560" y="195" width="520" height="340" rx="18"
        fill="url(#backGrad)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4"
        opacity="0.82"
        transform="rotate(-5 800 365)"/>

  <!-- Hero (front) card — upright, centred -->
  <rect x="545" y="210" width="510" height="330" rx="16"
        fill="url(#heroGrad)" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.55"
        opacity="0.95"/>

  <!-- Decorative line bars inside hero card (suggest slide content / agenda rows) -->
  <rect x="590" y="290" width="300" height="12" rx="6" fill="#fbbf24" opacity="0.28"/>
  <rect x="590" y="318" width="220" height="10" rx="5" fill="#fbbf24" opacity="0.18"/>
  <rect x="590" y="342" width="260" height="10" rx="5" fill="#fbbf24" opacity="0.18"/>
  <rect x="590" y="366" width="180" height="10" rx="5" fill="#fbbf24" opacity="0.14"/>
  <rect x="590" y="390" width="240" height="10" rx="5" fill="#fbbf24" opacity="0.14"/>

  <!-- Badge accent strip at top of hero card -->
  <rect x="545" y="210" width="510" height="52" rx="16" fill="#9a3309" opacity="0.85"/>
  <!-- (only top corners rounded — simulate with a plain rect overlay on bottom of strip) -->
  <rect x="545" y="242" width="510" height="20" fill="#9a3309" opacity="0.85"/>

  <!-- Three small circle nodes — tech/conference network motif -->
  <!-- Left node -->
  <circle cx="620" cy="236" r="14" fill="url(#nodeGlow)" opacity="0.88"/>
  <!-- Centre node -->
  <circle cx="800" cy="236" r="14" fill="url(#nodeGlow)" opacity="0.88"/>
  <!-- Right node -->
  <circle cx="980" cy="236" r="14" fill="url(#nodeGlow)" opacity="0.88"/>

  <!-- Connecting lines between nodes (inside the badge strip) -->
  <line x1="634" y1="236" x2="786" y2="236" stroke="#fbbf24" stroke-width="2" opacity="0.45"/>
  <line x1="814" y1="236" x2="966" y2="236" stroke="#fbbf24" stroke-width="2" opacity="0.45"/>

  <!-- Layer 3: Edge decorations (outside safe zone, purely atmospheric) -->

  <!-- Bottom-left arch hint -->
  <path d="M 0 900 Q 200 600 80 300" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.12"/>

  <!-- Top-right arch hint -->
  <path d="M 1600 0 Q 1400 300 1520 600" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.12"/>

  <!-- Subtle corner fills to ensure no raw page bg bleeds -->
  <rect x="0" y="0" width="180" height="900" fill="url(#bg)" opacity="0.35"/>
  <rect x="1420" y="0" width="180" height="900" fill="url(#bg)" opacity="0.35"/>
</svg>
