<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: warm dark wine-country evening -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1408"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Central hub fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Node fill -->
    <radialGradient id="nodeFill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Outer ambient glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warmth behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero — node-and-edge graph centered at (800, 450) -->

  <!-- Edges from hub to satellite nodes -->
  <!-- Hub (800,450) to node NE (1020,290) -->
  <line x1="800" y1="450" x2="1020" y2="290" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Hub to node E (1080,460) -->
  <line x1="800" y1="450" x2="1080" y2="460" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Hub to node SE (980,630) -->
  <line x1="800" y1="450" x2="980" y2="630" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Hub to node SW (620,630) -->
  <line x1="800" y1="450" x2="620" y2="630" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Hub to node W (520,445) -->
  <line x1="800" y1="450" x2="520" y2="445" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.55"/>
  <!-- Hub to node NW (590,295) -->
  <line x1="800" y1="450" x2="590" y2="295" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Cross-edges between satellite nodes (sparse) -->
  <line x1="1020" y1="290" x2="1080" y2="460" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="590" y1="295" x2="520" y2="445" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="980" y1="630" x2="620" y2="630" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="1020" y1="290" x2="590" y2="295" stroke="#9a3309" stroke-width="1.2" stroke-opacity="0.22"/>

  <!-- Hub glow halo -->
  <circle cx="800" cy="450" r="140" fill="url(#hubGlow)"/>

  <!-- Satellite nodes -->
  <circle cx="1020" cy="290" r="30" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="1080" cy="460" r="24" fill="url(#nodeFill)" opacity="0.80"/>
  <circle cx="980"  cy="630" r="28" fill="url(#nodeFill)" opacity="0.82"/>
  <circle cx="620"  cy="630" r="26" fill="url(#nodeFill)" opacity="0.80"/>
  <circle cx="520"  cy="445" r="24" fill="url(#nodeFill)" opacity="0.78"/>
  <circle cx="590"  cy="295" r="28" fill="url(#nodeFill)" opacity="0.85"/>

  <!-- Inner ring highlight on a few satellites -->
  <circle cx="1020" cy="290" r="14" fill="#fbbf24" opacity="0.30"/>
  <circle cx="590"  cy="295" r="13" fill="#fbbf24" opacity="0.28"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="62" fill="url(#hubFill)" opacity="0.95"/>
  <!-- Hub inner bright core -->
  <circle cx="800" cy="450" r="28" fill="#fbbf24" opacity="0.55"/>

  <!-- Layer 3: Decorative full-bleed edge accents (can be cropped) -->
  <!-- Top-left corner arc suggestion -->
  <circle cx="80" cy="80" r="160" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Bottom-right corner arc -->
  <circle cx="1520" cy="820" r="200" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.20"/>
  <!-- Subtle top-right dot accent -->
  <circle cx="1480" cy="120" r="10" fill="#d97706" opacity="0.22"/>
  <circle cx="1510" cy="160" r="6"  fill="#c2410c" opacity="0.18"/>
</svg>
