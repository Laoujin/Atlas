<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <!-- Warm candlelight/firelight radial glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Wine glass body gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Building fill -->
    <linearGradient id="bldgLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <linearGradient id="bldgRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#2a0e06"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Ground plane -->
  <rect x="0" y="720" width="1600" height="180" fill="#2a0e06" opacity="0.85"/>

  <!-- Layer 3 decoration: horizon glow strip -->
  <rect x="0" y="690" width="1600" height="60" fill="#c2410c" opacity="0.12"/>

  <!-- Layer 2: Hero radial glow centered at (800, 450) -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Left building (inn silhouette) — safely inside safe zone -->
  <!-- Main body -->
  <rect x="200" y="480" width="320" height="245" fill="url(#bldgLeft)" rx="3"/>
  <!-- Pitched roof -->
  <polygon points="185,480 360,360 535,480" fill="#78350f" opacity="0.95"/>
  <!-- Chimney -->
  <rect x="290" y="340" width="38" height="70" fill="#5c2a1a"/>
  <!-- Windows (warm lit) -->
  <rect x="240" y="530" width="55" height="45" fill="#d97706" opacity="0.70" rx="3"/>
  <rect x="330" y="530" width="55" height="45" fill="#fbbf24" opacity="0.55" rx="3"/>
  <rect x="420" y="530" width="55" height="45" fill="#d97706" opacity="0.60" rx="3"/>
  <!-- Door -->
  <rect x="330" y="635" width="60" height="90" fill="#9a3309" opacity="0.80" rx="4"/>

  <!-- Right building (lodge silhouette) -->
  <rect x="1080" y="510" width="290" height="215" fill="url(#bldgRight)" rx="3"/>
  <!-- Flat stepped roof -->
  <rect x="1065" y="490" width="320" height="28" fill="#5c2a1a" rx="2"/>
  <rect x="1100" y="465" width="250" height="28" fill="#4a1e10" rx="2"/>
  <!-- Windows -->
  <rect x="1110" y="555" width="50" height="40" fill="#fbbf24" opacity="0.50" rx="3"/>
  <rect x="1195" y="555" width="50" height="40" fill="#d97706" opacity="0.65" rx="3"/>
  <rect x="1280" y="555" width="50" height="40" fill="#fbbf24" opacity="0.45" rx="3"/>
  <!-- Door -->
  <rect x="1185" y="640" width="55" height="85" fill="#78350f" opacity="0.85" rx="3"/>

  <!-- Hero element: wine glass centered at (800, 450) -->
  <!-- Bowl (elliptical shape via path) -->
  <path d="M680,260 Q660,420 720,520 Q760,570 800,575 Q840,570 880,520 Q940,420 920,260 Z"
        fill="url(#glassGrad)" opacity="0.82"/>
  <!-- Wine level inside bowl -->
  <path d="M694,390 Q690,420 720,490 Q760,540 800,545 Q840,540 880,490 Q910,420 906,390 Z"
        fill="#9a3309" opacity="0.70"/>
  <!-- Stem -->
  <rect x="790" y="575" width="20" height="110" fill="#c2410c" opacity="0.80" rx="3"/>
  <!-- Base -->
  <ellipse cx="800" cy="692" rx="72" ry="14" fill="#c2410c" opacity="0.75"/>
  <!-- Rim highlight -->
  <path d="M680,260 Q800,240 920,260" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.55"/>
  <!-- Subtle reflection in bowl -->
  <path d="M720,340 Q740,380 730,450" stroke="#fbbf24" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Stars / distant lights (decoration, outside core safe zone top) -->
  <circle cx="400" cy="80" r="2.5" fill="#fbbf24" opacity="0.50"/>
  <circle cx="620" cy="55" r="2" fill="#fbbf24" opacity="0.40"/>
  <circle cx="800" cy="70" r="1.8" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1050" cy="45" r="2.2" fill="#fbbf24" opacity="0.45"/>
  <circle cx="1280" cy="75" r="2" fill="#fbbf24" opacity="0.40"/>
  <circle cx="1480" cy="60" r="1.8" fill="#fbbf24" opacity="0.38"/>
  <circle cx="190" cy="130" r="1.8" fill="#d97706" opacity="0.35"/>
  <circle cx="1430" cy="120" r="2" fill="#d97706" opacity="0.35"/>

  <!-- Vineyard row suggestion on ground — low horizontal strokes -->
  <line x1="0" y1="760" x2="520" y2="760" stroke="#5c2a1a" stroke-width="3" opacity="0.45"/>
  <line x1="0" y1="790" x2="480" y2="790" stroke="#5c2a1a" stroke-width="2.5" opacity="0.35"/>
  <line x1="1080" y1="760" x2="1600" y2="760" stroke="#5c2a1a" stroke-width="3" opacity="0.45"/>
  <line x1="1120" y1="790" x2="1600" y2="790" stroke="#5c2a1a" stroke-width="2.5" opacity="0.35"/>
</svg>
