<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fde3cf"/>
      <stop offset="1" stop-color="#f8cfa8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="320" r="360" fill="url(#sun)" opacity="0.7"/>

  <!-- rolling vineyard hills (decoration, bleeds off bottom) -->
  <path d="M0 690 Q360 600 720 660 T1600 640 V900 H0 Z" fill="url(#hillB)" opacity="0.85"/>
  <path d="M0 760 Q420 690 880 740 T1600 720 V900 H0 Z" fill="url(#hillA)" opacity="0.92"/>
  <!-- faint vine rows on near hill -->
  <g stroke="#fef3ec" stroke-width="3" opacity="0.18">
    <path d="M40 820 Q420 760 880 800 T1560 790" fill="none"/>
    <path d="M40 855 Q420 800 880 838 T1560 830" fill="none"/>
  </g>

  <!-- HERO: hot-air balloon, centered ~ (800,420) -->
  <g>
    <!-- envelope -->
    <path d="M800 200
             C 668 200 588 300 588 396
             C 588 482 668 548 736 612
             L 864 612
             C 932 548 1012 482 1012 396
             C 1012 300 932 200 800 200 Z"
          fill="url(#balloon)"/>
    <!-- gore panels -->
    <path d="M800 200 C 740 286 740 524 800 612 800 524 800 286 800 200 Z" fill="#78350f" opacity="0.45"/>
    <path d="M676 232 C 654 360 690 510 740 600 716 470 696 330 676 232 Z" fill="#fbbf24" opacity="0.30"/>
    <path d="M924 232 C 946 360 910 510 860 600 884 470 904 330 924 232 Z" fill="#fbbf24" opacity="0.22"/>
    <!-- base ring -->
    <ellipse cx="800" cy="612" rx="64" ry="14" fill="#5c2a1a" opacity="0.9"/>
    <!-- rigging -->
    <g stroke="#5c2a1a" stroke-width="3" opacity="0.8">
      <line x1="748" y1="616" x2="772" y2="690"/>
      <line x1="852" y1="616" x2="828" y2="690"/>
    </g>
    <!-- basket -->
    <path d="M768 690 L832 690 L824 738 L776 738 Z" fill="#78350f"/>
    <rect x="772" y="700" width="56" height="6" fill="#5c2a1a" opacity="0.6"/>
  </g>
</svg>
