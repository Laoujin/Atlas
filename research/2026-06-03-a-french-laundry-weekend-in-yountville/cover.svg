<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm candlelight glow behind glass -->
    <radialGradient id="glowGrad" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Wine in glass gradient -->
    <linearGradient id="wineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Glass body gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#fef3ec" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#fef3ec" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#fef3ec" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Vineyard row gradient -->
    <linearGradient id="vineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Hill silhouette gradient -->
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b1a0a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Rim highlight gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.05"/>
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Warm glow pool — candlelight atmosphere -->
  <rect width="1600" height="900" fill="url(#glowGrad)"/>

  <!-- Layer 2: Vineyard landscape — rolling hills silhouette -->
  <!-- Far hill left -->
  <ellipse cx="320" cy="820" rx="480" ry="200" fill="url(#hillGrad)" opacity="0.6"/>
  <!-- Far hill right -->
  <ellipse cx="1340" cy="840" rx="420" ry="180" fill="url(#hillGrad)" opacity="0.5"/>
  <!-- Ground plane -->
  <rect x="0" y="780" width="1600" height="120" fill="#3b1a0a" opacity="0.85"/>

  <!-- Vineyard rows — converging perspective lines suggesting Napa rows -->
  <!-- Each row: a thin tapered trapezoid angled from ground toward center vanishing point ~(800,680) -->
  <!-- Row 1 left -->
  <polygon points="0,900 180,900 800,680 720,680" fill="url(#vineGrad)" opacity="0.55"/>
  <!-- Row 2 left -->
  <polygon points="220,900 360,900 800,680 760,680" fill="url(#vineGrad)" opacity="0.45"/>
  <!-- Row 3 left -->
  <polygon points="400,900 500,900 800,680 785,680" fill="url(#vineGrad)" opacity="0.35"/>
  <!-- Row 1 right -->
  <polygon points="1600,900 1420,900 800,680 880,680" fill="url(#vineGrad)" opacity="0.55"/>
  <!-- Row 2 right -->
  <polygon points="1380,900 1240,900 800,680 840,680" fill="url(#vineGrad)" opacity="0.45"/>
  <!-- Row 3 right -->
  <polygon points="1200,900 1100,900 800,680 815,680" fill="url(#vineGrad)" opacity="0.35"/>

  <!-- Subtle moon / ambient light source top-right -->
  <circle cx="1300" cy="130" r="55" fill="#fbbf24" opacity="0.12"/>
  <circle cx="1300" cy="130" r="38" fill="#fbbf24" opacity="0.10"/>

  <!-- Layer 2 hero: Wine glass centred at ~(800, 430) -->
  <!-- Glass bowl — wide elliptical cup shape using a path -->
  <!-- Bowl outline: tapers from wide top (~240 wide) to narrow stem join (~40 wide) -->
  <!-- Bottom of bowl at y=600, top opening at y=220 -->

  <!-- Wine fill inside bowl (clipped by bowl shape) -->
  <!-- Wine is ~55% full, so from y=600 up to y=430 -->
  <path d="M 680,440 Q 672,560 700,600 Q 750,620 800,620 Q 850,620 900,600 Q 928,560 920,440 Q 870,470 800,472 Q 730,470 680,440 Z"
        fill="url(#wineGrad)" opacity="0.88"/>

  <!-- Glass bowl transparent walls -->
  <path d="M 660,220 Q 640,400 672,560 Q 700,640 800,650 Q 900,640 928,560 Q 960,400 940,220 Z"
        fill="url(#glassGrad)" stroke="#fef3ec" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Rim ellipse top of glass -->
  <ellipse cx="800" cy="222" rx="140" ry="22" fill="url(#rimGrad)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Wine surface meniscus -->
  <ellipse cx="800" cy="442" rx="120" ry="16" fill="#be185d" opacity="0.60"/>
  <!-- Wine surface highlight -->
  <ellipse cx="775" cy="438" rx="55" ry="6" fill="#fbbf24" opacity="0.22"/>

  <!-- Stem — narrow rectangle with slight taper -->
  <path d="M 785,650 L 780,750 L 820,750 L 815,650 Z"
        fill="#fef3ec" fill-opacity="0.14" stroke="#fef3ec" stroke-width="1.5" stroke-opacity="0.20"/>

  <!-- Base — flat ellipse -->
  <ellipse cx="800" cy="750" rx="90" ry="14" fill="#fef3ec" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.30"/>

  <!-- Glass highlight — vertical light streak on bowl -->
  <path d="M 720,260 Q 712,380 718,520" stroke="#fef3ec" stroke-width="3" stroke-opacity="0.20" fill="none" stroke-linecap="round"/>

  <!-- Secondary highlight narrower -->
  <path d="M 730,270 Q 724,370 728,480" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.18" fill="none" stroke-linecap="round"/>

  <!-- Layer 3: Decorative corner accents (outside safe zone, atmospheric only) -->
  <!-- Bottom-left warm vignette -->
  <radialGradient id="vigLB" cx="0%" cy="100%" r="50%">
    <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vigLB)"/>

  <!-- Top vignette to deepen sky -->
  <linearGradient id="vigTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.55"/>
    <stop offset="30%" stop-color="#1a0e0e" stop-opacity="0"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#vigTop)"/>

  <!-- Bottom vignette -->
  <linearGradient id="vigBot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="70%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.60"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#vigBot)"/>

</svg>
