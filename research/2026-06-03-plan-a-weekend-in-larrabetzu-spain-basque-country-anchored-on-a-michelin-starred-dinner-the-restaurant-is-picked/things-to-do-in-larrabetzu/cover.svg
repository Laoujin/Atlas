<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow, hilltop -->
  <circle cx="800" cy="360" r="320" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="360" r="120" fill="#fbbf24" opacity="0.9"/>

  <!-- far hill -->
  <path d="M0 560 C 350 430 650 470 900 540 C 1150 600 1400 540 1600 500 L1600 900 L0 900 Z" fill="url(#hillFar)" opacity="0.75"/>

  <!-- mid hill (hero ridge) -->
  <path d="M0 660 C 300 560 600 600 800 600 C 1050 600 1300 660 1600 620 L1600 900 L0 900 Z" fill="url(#hillMid)" opacity="0.88"/>

  <!-- hilltop restaurant mass -->
  <rect x="752" y="540" width="96" height="62" rx="6" fill="#1a0e0e" opacity="0.85"/>
  <rect x="770" y="510" width="60" height="34" rx="4" fill="#1a0e0e" opacity="0.85"/>

  <!-- near hill with vineyard rows -->
  <path d="M0 760 C 350 680 700 720 1000 720 C 1300 720 1450 760 1600 740 L1600 900 L0 900 Z" fill="url(#hillNear)" opacity="0.95"/>
  <g stroke="#fbbf24" stroke-width="3" opacity="0.5" fill="none">
    <path d="M120 820 C 450 760 800 778 1180 770"/>
    <path d="M160 850 C 480 798 820 812 1240 805"/>
    <path d="M210 882 C 520 836 860 848 1300 842"/>
  </g>
</svg>
