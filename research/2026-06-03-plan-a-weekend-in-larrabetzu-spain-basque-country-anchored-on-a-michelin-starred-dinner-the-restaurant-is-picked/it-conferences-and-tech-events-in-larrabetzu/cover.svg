<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1510"/>
    </linearGradient>
    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Slide face gradient -->
    <linearGradient id="slideA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="slideB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slideC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Top slide accent bar -->
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.9"/>

  <!-- Layer 2: Hero — stacked angled slide/card shapes centered ~(800,450) -->

  <!-- Back slide (deepest, most offset) -->
  <g transform="translate(800,450)">
    <rect x="-290" y="-195" width="580" height="390" rx="10"
          fill="url(#slideA)" opacity="0.62"
          transform="rotate(-8)"/>
  </g>

  <!-- Middle slide -->
  <g transform="translate(800,450)">
    <rect x="-290" y="-195" width="580" height="390" rx="10"
          fill="url(#slideB)" opacity="0.78"
          transform="rotate(-3)"/>
    <!-- Faint horizontal content bars on middle slide -->
    <rect x="-220" y="-80" width="440" height="14" rx="4"
          fill="#fbbf24" opacity="0.18" transform="rotate(-3)"/>
    <rect x="-220" y="-48" width="320" height="10" rx="4"
          fill="#fbbf24" opacity="0.12" transform="rotate(-3)"/>
    <rect x="-220" y="-20" width="360" height="10" rx="4"
          fill="#fbbf24" opacity="0.10" transform="rotate(-3)"/>
    <rect x="-220" y="8" width="280" height="10" rx="4"
          fill="#fbbf24" opacity="0.10" transform="rotate(-3)"/>
  </g>

  <!-- Front slide (hero, upright) -->
  <g transform="translate(800,450)">
    <rect x="-290" y="-195" width="580" height="390" rx="10"
          fill="url(#slideC)" opacity="0.92"/>
    <!-- Amber accent bar at top of front slide -->
    <rect x="-290" y="-195" width="580" height="18" rx="5"
          fill="url(#accentBar)" opacity="0.95"/>
    <!-- Content bar lines on front slide -->
    <rect x="-220" y="-140" width="440" height="16" rx="4"
          fill="#fef3ec" opacity="0.22"/>
    <rect x="-220" y="-108" width="320" height="11" rx="3"
          fill="#fef3ec" opacity="0.14"/>
    <rect x="-220" y="-82" width="380" height="11" rx="3"
          fill="#fef3ec" opacity="0.12"/>
    <!-- Divider -->
    <rect x="-220" y="-50" width="440" height="2" rx="1"
          fill="#d97706" opacity="0.35"/>
    <!-- Lower content rows -->
    <rect x="-220" y="-28" width="300" height="10" rx="3"
          fill="#fef3ec" opacity="0.13"/>
    <rect x="-220" y="-8" width="260" height="10" rx="3"
          fill="#fef3ec" opacity="0.11"/>
    <rect x="-220" y="12" width="340" height="10" rx="3"
          fill="#fef3ec" opacity="0.11"/>
    <!-- Bottom accent dot cluster (wifi / signal icon suggestion) -->
    <circle cx="180" cy="130" r="22" fill="#d97706" opacity="0.30"/>
    <circle cx="180" cy="130" r="13" fill="#fbbf24" opacity="0.40"/>
    <circle cx="180" cy="130" r="5"  fill="#fef3ec" opacity="0.80"/>
  </g>

  <!-- Layer 3: Edge decorations (outside safe zone, no meaning if clipped) -->
  <!-- Top-left faint arc sweep -->
  <circle cx="0" cy="0" r="320" fill="none"
          stroke="#c2410c" stroke-width="2" opacity="0.15"/>
  <!-- Bottom-right faint arc sweep -->
  <circle cx="1600" cy="900" r="380" fill="none"
          stroke="#9a3309" stroke-width="2" opacity="0.12"/>
</svg>
