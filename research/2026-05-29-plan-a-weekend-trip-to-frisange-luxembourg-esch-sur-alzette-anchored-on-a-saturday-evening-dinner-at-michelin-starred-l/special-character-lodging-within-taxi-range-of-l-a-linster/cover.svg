<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="turret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="vine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- vineyard / Moselle bands, full-bleed decorative -->
  <path d="M0 640 Q 400 600 800 630 T 1600 615 L 1600 660 Q 1200 640 800 670 T 0 685 Z" fill="url(#vine)" opacity="0.55"/>
  <path d="M0 720 Q 400 690 800 715 T 1600 700 L 1600 745 Q 1200 720 800 750 T 0 770 Z" fill="url(#vine)" opacity="0.4"/>

  <!-- central warm glow (Michelin star presence) -->
  <circle cx="800" cy="450" r="380" fill="url(#glow)"/>

  <!-- orbital ring of stay options -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="2 8"/>
  <circle cx="800" cy="450" r="220" fill="none" stroke="#9a3309" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2 6"/>

  <!-- seven orbiting dots = seven stays -->
  <circle cx="800" cy="150" r="14" fill="#c2410c" opacity="0.9"/>
  <circle cx="1034" cy="244" r="14" fill="#9a3309" opacity="0.9"/>
  <circle cx="1093" cy="487" r="14" fill="#c2410c" opacity="0.9"/>
  <circle cx="976" cy="708" r="14" fill="#78350f" opacity="0.9"/>
  <circle cx="624" cy="708" r="14" fill="#c2410c" opacity="0.9"/>
  <circle cx="507" cy="487" r="14" fill="#9a3309" opacity="0.9"/>
  <circle cx="566" cy="244" r="14" fill="#78350f" opacity="0.9"/>

  <!-- hero: stylised castle keep with two turrets, centered ~(800,450) -->
  <!-- spa water pool beneath -->
  <ellipse cx="800" cy="640" rx="220" ry="22" fill="#d97706" opacity="0.25"/>
  <ellipse cx="800" cy="640" rx="160" ry="14" fill="#fbbf24" opacity="0.35"/>

  <!-- main keep -->
  <rect x="710" y="380" width="180" height="240" fill="url(#castle)" opacity="0.95"/>
  <!-- crenellations -->
  <rect x="710" y="368" width="22" height="20" fill="#78350f"/>
  <rect x="748" y="368" width="22" height="20" fill="#78350f"/>
  <rect x="786" y="368" width="22" height="20" fill="#78350f"/>
  <rect x="824" y="368" width="22" height="20" fill="#78350f"/>
  <rect x="862" y="368" width="22" height="20" fill="#78350f"/>

  <!-- left turret -->
  <rect x="640" y="430" width="68" height="190" fill="url(#turret)" opacity="0.92"/>
  <polygon points="640,430 708,430 674,360" fill="#78350f" opacity="0.95"/>

  <!-- right turret -->
  <rect x="892" y="410" width="76" height="210" fill="url(#turret)" opacity="0.92"/>
  <polygon points="892,410 968,410 930,330" fill="#78350f" opacity="0.95"/>

  <!-- arched doorway -->
  <path d="M770 620 L 770 545 Q 770 510 800 510 Q 830 510 830 545 L 830 620 Z" fill="#1a0e0e" opacity="0.7"/>

  <!-- narrow windows on keep -->
  <rect x="735" y="430" width="8" height="22" fill="#fbbf24" opacity="0.85"/>
  <rect x="857" y="430" width="8" height="22" fill="#fbbf24" opacity="0.85"/>
  <rect x="735" y="475" width="8" height="22" fill="#fbbf24" opacity="0.7"/>
  <rect x="857" y="475" width="8" height="22" fill="#fbbf24" opacity="0.7"/>

  <!-- turret windows -->
  <rect x="666" y="475" width="6" height="16" fill="#fbbf24" opacity="0.8"/>
  <rect x="924" y="455" width="6" height="16" fill="#fbbf24" opacity="0.8"/>

  <!-- central Michelin star-dot, sitting just above the keep crown -->
  <circle cx="800" cy="320" r="18" fill="#fbbf24"/>
  <circle cx="800" cy="320" r="9" fill="#fef3ec"/>
</svg>
