<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#be185d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun / Michelin star anchor, centred in hero safe zone -->
  <circle cx="800" cy="380" r="135" fill="url(#sun)" opacity="0.92"/>
  <circle cx="800" cy="380" r="175" fill="none" stroke="#d97706" stroke-width="2" opacity="0.35"/>
  <circle cx="800" cy="380" r="215" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.18"/>

  <!-- far ridge, soft amphitheatre curve -->
  <path d="M 0 540 Q 380 430 760 470 Q 1180 515 1600 440 L 1600 720 L 0 720 Z" fill="url(#hillFar)" opacity="0.85"/>

  <!-- terraced vineyard lines on far ridge -->
  <path d="M 60 555 Q 420 470 780 505 Q 1180 545 1560 480" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.35"/>
  <path d="M 80 590 Q 430 510 790 540 Q 1180 575 1560 520" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.3"/>
  <path d="M 100 625 Q 440 550 800 575 Q 1180 605 1560 560" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.25"/>
  <path d="M 120 660 Q 450 590 810 610 Q 1180 635 1560 600" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.22"/>

  <!-- Mosel river hairpin bend, full-bleed across the foreground -->
  <path d="M 0 770 Q 320 690 640 740 Q 900 780 1120 720 Q 1340 660 1600 700 L 1600 760 Q 1340 720 1120 775 Q 900 830 640 790 Q 320 745 0 815 Z" fill="url(#river)" opacity="0.88"/>

  <!-- near hill, foreground promontory -->
  <path d="M 0 720 Q 240 660 480 700 Q 600 720 560 770 Q 420 820 200 810 Q 80 800 0 820 Z" fill="url(#hillNear)" opacity="0.9"/>
  <path d="M 1100 715 Q 1320 685 1500 720 Q 1600 740 1600 790 Q 1400 800 1200 790 Q 1080 780 1100 730 Z" fill="url(#hillNear)" opacity="0.88"/>

  <!-- sundial post on near promontory (Mosel signature marker) -->
  <line x1="340" y1="765" x2="340" y2="690" stroke="#1a0e0e" stroke-width="3" opacity="0.75"/>
  <circle cx="340" cy="685" r="14" fill="none" stroke="#1a0e0e" stroke-width="2.5" opacity="0.75"/>
  <line x1="340" y1="685" x2="362" y2="668" stroke="#1a0e0e" stroke-width="2" opacity="0.75"/>
</svg>
