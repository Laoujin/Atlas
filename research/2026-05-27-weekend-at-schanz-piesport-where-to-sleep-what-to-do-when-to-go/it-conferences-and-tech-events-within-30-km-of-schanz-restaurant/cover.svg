<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decorative vineyard hills, edges (croppable) -->
  <path d="M0 720 Q 200 660 420 695 T 820 690 T 1200 700 T 1600 685 L 1600 900 L 0 900 Z" fill="url(#hill)" opacity="0.7"/>
  <path d="M0 780 Q 260 740 520 760 T 1040 765 T 1600 755 L 1600 900 L 0 900 Z" fill="#78350f" opacity="0.55"/>

  <!-- vineyard row strokes (decorative, edges) -->
  <g stroke="#5c2a1a" stroke-width="2" opacity="0.25" fill="none">
    <path d="M40 800 L 180 770"/>
    <path d="M80 830 L 220 800"/>
    <path d="M1380 775 L 1540 800"/>
    <path d="M1420 805 L 1560 830"/>
  </g>

  <!-- soft warm glow behind hero -->
  <circle cx="800" cy="450" r="380" fill="url(#glow)"/>

  <!-- Moselle river loop (hero, behind gate) -->
  <path d="M 380 470
           C 520 360, 700 360, 800 440
           C 900 520, 1080 540, 1220 470
           C 1320 420, 1340 360, 1280 320
           C 1200 270, 1040 290, 940 360
           C 840 430, 700 440, 580 400
           C 480 370, 400 410, 380 470 Z"
        fill="none" stroke="url(#river)" stroke-width="22" stroke-linejoin="round" opacity="0.9"/>

  <!-- 30 km radius ring centered on river loop, violet accent -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.7"/>
  <circle cx="800" cy="450" r="6" fill="#6d28d9" opacity="0.85"/>

  <!-- Porta Nigra silhouette (hero centerpiece), centered (800, 450) -->
  <g transform="translate(640 320)">
    <!-- base block -->
    <rect x="0" y="120" width="320" height="180" fill="url(#gate)"/>
    <!-- twin towers -->
    <rect x="0" y="20" width="100" height="280" fill="url(#gate)"/>
    <rect x="220" y="20" width="100" height="280" fill="url(#gate)"/>
    <!-- tower crenellations -->
    <rect x="0"   y="10" width="20" height="14" fill="#5c2a1a"/>
    <rect x="40"  y="10" width="20" height="14" fill="#5c2a1a"/>
    <rect x="80"  y="10" width="20" height="14" fill="#5c2a1a"/>
    <rect x="220" y="10" width="20" height="14" fill="#5c2a1a"/>
    <rect x="260" y="10" width="20" height="14" fill="#5c2a1a"/>
    <rect x="300" y="10" width="20" height="14" fill="#5c2a1a"/>
    <!-- arches in base -->
    <path d="M 60 300 L 60 200 A 40 40 0 0 1 140 200 L 140 300 Z" fill="#1a0e0e" opacity="0.75"/>
    <path d="M 180 300 L 180 200 A 40 40 0 0 1 260 200 L 260 300 Z" fill="#1a0e0e" opacity="0.75"/>
    <!-- tower windows (arched, Roman tier marks) -->
    <rect x="30" y="70"  width="40" height="30" fill="#1a0e0e" opacity="0.7"/>
    <rect x="30" y="130" width="40" height="30" fill="#1a0e0e" opacity="0.7"/>
    <rect x="30" y="190" width="40" height="30" fill="#1a0e0e" opacity="0.7"/>
    <rect x="250" y="70"  width="40" height="30" fill="#1a0e0e" opacity="0.7"/>
    <rect x="250" y="130" width="40" height="30" fill="#1a0e0e" opacity="0.7"/>
    <rect x="250" y="190" width="40" height="30" fill="#1a0e0e" opacity="0.7"/>
    <!-- warm highlight on left tower -->
    <rect x="0" y="20" width="14" height="280" fill="#fbbf24" opacity="0.25"/>
    <rect x="220" y="20" width="14" height="280" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- grape cluster accent (vineyard nod), inside safe zone -->
  <g transform="translate(1240 600)" opacity="0.85">
    <circle cx="0"  cy="0"  r="10" fill="#6d28d9" opacity="0.8"/>
    <circle cx="16" cy="4"  r="10" fill="#6d28d9" opacity="0.8"/>
    <circle cx="8"  cy="18" r="10" fill="#6d28d9" opacity="0.8"/>
    <circle cx="24" cy="20" r="10" fill="#6d28d9" opacity="0.8"/>
    <circle cx="14" cy="34" r="10" fill="#6d28d9" opacity="0.8"/>
    <path d="M 8 -10 Q 20 -22 36 -14" stroke="#5c2a1a" stroke-width="2.5" fill="none"/>
  </g>
</svg>
