<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ddca"/>
      <stop offset="1" stop-color="#d8c9ad"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ead8"/>
      <stop offset="1" stop-color="#e3d5ba"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- stacked option cards (framework candidates) -->
  <g transform="rotate(-9 800 450)">
    <rect x="360" y="230" width="820" height="460" rx="26" fill="url(#card1)" opacity="0.9"/>
  </g>
  <g transform="rotate(-4.5 800 450)">
    <rect x="380" y="215" width="820" height="470" rx="26" fill="url(#card2)" opacity="0.95"/>
  </g>

  <!-- hero card: the chosen router -->
  <rect x="400" y="200" width="800" height="500" rx="28" fill="url(#hero)"/>

  <!-- routing motif: hub branching to routes -->
  <g stroke="#fef3ec" stroke-width="7" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M540 450 H700"/>
    <path d="M700 450 C780 450 780 320 880 320"/>
    <path d="M700 450 H900"/>
    <path d="M700 450 C780 450 780 580 880 580"/>
  </g>
  <circle cx="540" cy="450" r="34" fill="#78350f"/>
  <circle cx="540" cy="450" r="16" fill="#fbbf24"/>
  <circle cx="700" cy="450" r="15" fill="#fef3ec"/>
  <circle cx="900" cy="320" r="26" fill="#fbbf24"/>
  <circle cx="960" cy="450" r="26" fill="#fef3ec"/>
  <circle cx="900" cy="580" r="26" fill="#fbbf24"/>
</svg>
