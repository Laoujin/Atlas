<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="stay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="switch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- migration tracks: one source route forking into stay vs switch -->
  <path d="M 370 450 L 754 450" fill="none" stroke="#9a3309" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M 838 424 Q 1010 300 1130 265" fill="none" stroke="#c2410c" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M 838 476 Q 1010 600 1130 635" fill="none" stroke="#d97706" stroke-width="16" stroke-linecap="round" opacity="0.85"/>

  <!-- source block (current router) -->
  <rect x="180" y="385" width="190" height="130" rx="18" fill="url(#src)"/>
  <rect x="212" y="425" width="126" height="14" rx="7" fill="#faf8f2" opacity="0.35"/>
  <rect x="212" y="460" width="90" height="14" rx="7" fill="#faf8f2" opacity="0.35"/>

  <!-- stay: v6 to v7 codemods -->
  <rect x="1130" y="200" width="210" height="130" rx="18" fill="url(#stay)"/>
  <rect x="1164" y="240" width="142" height="14" rx="7" fill="#fef3ec" opacity="0.4"/>
  <rect x="1164" y="275" width="100" height="14" rx="7" fill="#fef3ec" opacity="0.4"/>

  <!-- switch: entirely new router -->
  <rect x="1130" y="570" width="210" height="130" rx="18" fill="url(#switch)"/>
  <rect x="1164" y="610" width="142" height="14" rx="7" fill="#78350f" opacity="0.4"/>
  <rect x="1164" y="645" width="100" height="14" rx="7" fill="#78350f" opacity="0.4"/>

  <!-- decision hub (hero focal point) -->
  <circle cx="800" cy="450" r="52" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="52" fill="none" stroke="#78350f" stroke-width="6" opacity="0.7"/>
  <circle cx="800" cy="450" r="18" fill="#faf8f2" opacity="0.9"/>
</svg>
