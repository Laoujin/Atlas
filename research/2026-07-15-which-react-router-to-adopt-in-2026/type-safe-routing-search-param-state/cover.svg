<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="node" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="640" cy="450" rx="640" ry="460" fill="url(#glow)"/>

  <!-- typed route edges: origin branches to three routes -->
  <g fill="none" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.7">
    <path d="M560 450 C 760 450, 820 250, 1040 250"/>
    <path d="M580 450 L 1040 450"/>
    <path d="M560 450 C 760 450, 820 650, 1040 650"/>
  </g>

  <!-- branch route nodes -->
  <g stroke="#9a3309" stroke-width="6" opacity="0.95">
    <circle cx="1085" cy="250" r="52" fill="url(#node)"/>
    <circle cx="1085" cy="450" r="52" fill="url(#node)"/>
    <circle cx="1085" cy="650" r="52" fill="url(#node)"/>
  </g>
  <g fill="#78350f" opacity="0.85">
    <circle cx="1085" cy="250" r="16"/>
    <circle cx="1085" cy="450" r="16"/>
    <circle cx="1085" cy="650" r="16"/>
  </g>

  <!-- hero: the type-safe routing origin -->
  <circle cx="500" cy="450" r="96" fill="url(#hero)" stroke="#78350f" stroke-width="8"/>
  <circle cx="500" cy="450" r="42" fill="#fbbf24" opacity="0.9"/>
  <circle cx="500" cy="450" r="18" fill="#9a3309"/>
</svg>
