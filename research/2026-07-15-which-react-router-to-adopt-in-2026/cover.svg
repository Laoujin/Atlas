<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="pick" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- incoming route into the decision hub -->
  <path d="M 210 450 H 740" fill="none" stroke="#9a3309" stroke-width="26" stroke-linecap="round" opacity="0.85"/>

  <!-- three diverging router options -->
  <path d="M 780 450 C 980 450 1000 250 1360 250" fill="none" stroke="#78350f" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
  <path d="M 780 450 C 980 450 1000 650 1360 650" fill="none" stroke="#78350f" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
  <path d="M 780 450 C 1020 450 1120 450 1360 450" fill="none" stroke="url(#pick)" stroke-width="30" stroke-linecap="round" opacity="0.95"/>

  <!-- destination nodes -->
  <circle cx="1360" cy="250" r="34" fill="#78350f" opacity="0.55"/>
  <circle cx="1360" cy="650" r="34" fill="#78350f" opacity="0.55"/>
  <circle cx="1360" cy="450" r="60" fill="#fbbf24" opacity="0.25"/>
  <circle cx="1360" cy="450" r="46" fill="url(#pick)"/>

  <!-- decision hub -->
  <circle cx="760" cy="450" r="92" fill="#faf8f2" opacity="0.9"/>
  <circle cx="760" cy="450" r="78" fill="url(#hub)"/>
  <circle cx="760" cy="450" r="30" fill="#fef3ec" opacity="0.85"/>
</svg>
