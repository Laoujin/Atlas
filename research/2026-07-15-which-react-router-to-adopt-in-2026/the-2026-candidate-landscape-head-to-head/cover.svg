<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="800" cy="450" r="150" fill="none" stroke="#78350f" stroke-width="2" opacity="0.18"/>
  <circle cx="800" cy="450" r="230" fill="none" stroke="#78350f" stroke-width="2" opacity="0.12"/>

  <!-- routes: three contenders -->
  <path d="M800 450 C 620 400 470 320 360 230" fill="none" stroke="#78350f" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <path d="M800 450 C 600 500 460 620 350 700" fill="none" stroke="#9a3309" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
  <path d="M800 450 C 1010 510 1170 630 1265 700" fill="none" stroke="#78350f" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

  <!-- hero route: the front-runner -->
  <path d="M800 450 C 1010 390 1170 300 1275 225" fill="none" stroke="#c2410c" stroke-width="26" stroke-linecap="round" opacity="0.95"/>

  <!-- endpoint nodes -->
  <circle cx="360" cy="230" r="34" fill="#78350f" opacity="0.7"/>
  <circle cx="350" cy="700" r="34" fill="#9a3309" opacity="0.72"/>
  <circle cx="1265" cy="700" r="34" fill="#78350f" opacity="0.7"/>
  <circle cx="1275" cy="225" r="52" fill="#d97706"/>
  <circle cx="1275" cy="225" r="52" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.85"/>

  <!-- central hub -->
  <circle cx="800" cy="450" r="72" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="72" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.5"/>
  <circle cx="800" cy="450" r="26" fill="#fef3ec" opacity="0.9"/>
</svg>
