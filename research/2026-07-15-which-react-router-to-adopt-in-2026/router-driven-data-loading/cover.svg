<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="620" ry="360" fill="url(#glow)"/>

  <!-- spark arc: router hands off to cache -->
  <path d="M 655 340 C 720 250, 940 250, 1010 340" fill="none"
        stroke="#78350f" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <circle cx="832" cy="268" r="15" fill="#c2410c" opacity="0.9"/>
  <circle cx="832" cy="268" r="26" fill="#c2410c" opacity="0.18"/>

  <!-- router block -->
  <rect x="540" y="330" width="250" height="240" rx="26" fill="url(#router)" opacity="0.95"/>
  <!-- routing fork inside router -->
  <path d="M 590 450 L 690 400 M 590 450 L 700 450 M 590 450 L 690 500"
        stroke="#fef3ec" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
  <circle cx="588" cy="450" r="11" fill="#fef3ec" opacity="0.85"/>
  <circle cx="692" cy="400" r="8" fill="#fef3ec" opacity="0.7"/>
  <circle cx="702" cy="450" r="8" fill="#fef3ec" opacity="0.7"/>
  <circle cx="692" cy="500" r="8" fill="#fef3ec" opacity="0.7"/>

  <!-- interlock plug bridging the two blocks -->
  <rect x="768" y="418" width="64" height="64" rx="14" fill="#78350f" opacity="0.92"/>

  <!-- cache block -->
  <rect x="810" y="330" width="250" height="240" rx="26" fill="url(#cache)" opacity="0.95"/>
  <!-- cached entries -->
  <rect x="850" y="382" width="172" height="18" rx="9" fill="#fef3ec" opacity="0.6"/>
  <rect x="850" y="436" width="172" height="18" rx="9" fill="#fef3ec" opacity="0.5"/>
  <rect x="850" y="490" width="120" height="18" rx="9" fill="#fef3ec" opacity="0.4"/>
</svg>
