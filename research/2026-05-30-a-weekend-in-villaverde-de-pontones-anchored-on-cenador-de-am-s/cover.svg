<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="0.85" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1208"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- broad warm halo behind the sun -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- hero sun / plate, centered, well inside safe zone -->
  <circle cx="800" cy="430" r="200" fill="url(#sun)"/>
  <circle cx="800" cy="430" r="120" fill="#fef3ec" opacity="0.92"/>
  <circle cx="800" cy="430" r="120" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.6"/>
  <circle cx="800" cy="430" r="96" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.5"/>

  <!-- distant coastal ridge (Bay of Santander silhouette to the west) -->
  <path d="M 0 560 Q 200 510 420 540 T 820 525 Q 1050 510 1280 545 T 1600 540 L 1600 600 L 0 600 Z" fill="url(#hill1)" opacity="0.85"/>

  <!-- sea band reflecting the warm sky -->
  <rect x="0" y="595" width="1600" height="55" fill="url(#sea)" opacity="0.75"/>

  <!-- mid hill -->
  <path d="M 0 650 Q 260 590 540 630 Q 800 670 1080 615 Q 1340 580 1600 640 L 1600 760 L 0 760 Z" fill="url(#hill2)" opacity="0.9"/>

  <!-- foreground hill with hamlet silhouettes -->
  <path d="M 0 760 Q 300 700 640 740 Q 960 780 1280 720 Q 1460 690 1600 740 L 1600 900 L 0 900 Z" fill="url(#hill3)"/>

  <!-- tiny stone hamlet rooftops at Plaza del Sol -->
  <g fill="#1a0e0e" opacity="0.95">
    <rect x="690" y="740" width="34" height="22"/>
    <polygon points="685,740 729,740 707,724"/>
    <rect x="728" y="746" width="28" height="18"/>
    <polygon points="724,746 760,746 742,732"/>
    <rect x="762" y="742" width="40" height="22"/>
    <polygon points="757,742 807,742 782,726"/>
    <rect x="808" y="748" width="26" height="18"/>
    <polygon points="804,748 838,748 821,734"/>
    <rect x="840" y="744" width="36" height="22"/>
    <polygon points="835,744 881,744 858,728"/>
  </g>

  <!-- a single chimney smoke wisp from the hamlet -->
  <path d="M 782 726 Q 778 706 786 690 Q 794 674 786 656" stroke="#fef3ec" stroke-width="1.5" fill="none" opacity="0.35"/>
</svg>
