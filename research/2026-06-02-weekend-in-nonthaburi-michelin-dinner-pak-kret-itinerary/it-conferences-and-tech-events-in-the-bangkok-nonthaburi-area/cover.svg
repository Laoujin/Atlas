<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1308"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Radial glow behind hub -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub node fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Satellite node fill -->
    <radialGradient id="satFill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Outer orbit glow ring -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="82%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: Hero element — network node graph centered at (800, 450) -->

  <!-- Radial glow halo centered on hub -->
  <ellipse cx="800" cy="450" rx="420" ry="340" fill="url(#glow)" opacity="0.9"/>

  <!-- Orbit ring suggestion -->
  <circle cx="800" cy="450" r="260" fill="url(#ringGlow)" opacity="0.7"/>

  <!-- Connection lines from hub to satellites — drawn first so nodes sit on top -->
  <!-- Satellite positions (kept within safe zone x:125-1475, y:90-810):
       A: (570, 270)  B: (1020, 210)  C: (1120, 480)
       D: (960, 670)  E: (600, 650)   F: (440, 480)  -->
  <line x1="800" y1="450" x2="570" y2="270" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="1020" y2="210" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="1120" y2="480" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="960" y2="670" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="600" y2="650" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="440" y2="480" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>

  <!-- Secondary edges between satellites (sparse, for network feel) -->
  <line x1="570" y1="270" x2="1020" y2="210" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>
  <line x1="1020" y1="210" x2="1120" y2="480" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>
  <line x1="1120" y1="480" x2="960" y2="670" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>
  <line x1="960" y1="670" x2="600" y2="650" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>
  <line x1="600" y1="650" x2="440" y2="480" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>
  <line x1="440" y1="480" x2="570" y2="270" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>

  <!-- Satellite nodes -->
  <circle cx="570" cy="270" r="28" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="570" cy="270" r="36" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="1020" cy="210" r="22" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="1020" cy="210" r="30" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="1120" cy="480" r="26" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="1120" cy="480" r="34" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="960" cy="670" r="24" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="960" cy="670" r="32" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="600" cy="650" r="20" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="600" cy="650" r="28" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="440" cy="480" r="24" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="440" cy="480" r="32" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <!-- Hub node: large central circle -->
  <circle cx="800" cy="450" r="68" fill="url(#hubFill)" opacity="0.95"/>
  <circle cx="800" cy="450" r="82" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <circle cx="800" cy="450" r="98" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.28"/>

  <!-- Layer 3: Decorative — stylized city skyline silhouette at bottom edge (partially outside safe zone) -->
  <!-- Simple rectangular skyline bar, low opacity, purely atmospheric -->
  <g opacity="0.18" fill="#fbbf24">
    <!-- Skyline towers along bottom — decorative, will be partially cropped on detail hero -->
    <rect x="130"  y="820" width="18" height="80"/>
    <rect x="160"  y="795" width="30" height="105"/>
    <rect x="200"  y="808" width="22" height="92"/>
    <rect x="235"  y="780" width="15" height="120"/>
    <rect x="260"  y="790" width="40" height="110"/>
    <rect x="312"  y="818" width="18" height="82"/>
    <rect x="340"  y="772" width="25" height="128"/>
    <rect x="376"  y="800" width="20" height="100"/>
    <rect x="410"  y="815" width="14" height="85"/>
    <rect x="435"  y="758" width="35" height="142"/>
    <rect x="482"  y="800" width="22" height="100"/>
    <rect x="515"  y="820" width="16" height="80"/>
    <rect x="545"  y="782" width="28" height="118"/>
    <rect x="588"  y="795" width="20" height="105"/>
    <rect x="618"  y="810" width="16" height="90"/>
    <rect x="650"  y="775" width="30" height="125"/>
    <rect x="695"  y="800" width="18" height="100"/>
    <rect x="726"  y="760" width="45" height="140"/>
    <rect x="784"  y="818" width="20" height="82"/>
    <rect x="820"  y="778" width="30" height="122"/>
    <rect x="865"  y="798" width="22" height="102"/>
    <rect x="900"  y="768" width="38" height="132"/>
    <rect x="950"  y="810" width="16" height="90"/>
    <rect x="978"  y="788" width="28" height="112"/>
    <rect x="1020" y="800" width="20" height="100"/>
    <rect x="1054" y="775" width="15" height="125"/>
    <rect x="1082" y="758" width="40" height="142"/>
    <rect x="1136" y="808" width="18" height="92"/>
    <rect x="1168" y="792" width="25" height="108"/>
    <rect x="1206" y="818" width="20" height="82"/>
    <rect x="1240" y="778" width="32" height="122"/>
    <rect x="1286" y="800" width="18" height="100"/>
    <rect x="1318" y="815" width="15" height="85"/>
    <rect x="1346" y="768" width="38" height="132"/>
    <rect x="1398" y="798" width="22" height="102"/>
    <rect x="1432" y="780" width="28" height="120"/>
    <rect x="1472" y="810" width="16" height="90"/>
  </g>
</svg>
