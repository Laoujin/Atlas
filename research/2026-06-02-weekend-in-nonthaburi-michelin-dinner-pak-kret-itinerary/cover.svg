<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1410"/>
      <stop offset="100%" stop-color="#3d1a08"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient — hero plate A -->
    <radialGradient id="plateA" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Plate gradient — hero plate B -->
    <radialGradient id="plateB" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- River band gradient -->
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#9a3309" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0"/>
    </linearGradient>
    <!-- Lotus glow -->
    <radialGradient id="lotusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Rim ring gradient -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="90%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Central atmospheric glow — large, behind hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glowCenter)"/>

  <!-- River band across lower portion — decorative, full-bleed width -->
  <ellipse cx="800" cy="730" rx="900" ry="80" fill="url(#riverGrad)" opacity="0.7"/>
  <!-- River shimmer line -->
  <path d="M 0 690 Q 400 670 800 695 Q 1200 720 1600 700" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.25"/>
  <path d="M 0 715 Q 500 700 800 718 Q 1100 738 1600 722" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.18"/>

  <!-- Layer 2: Hero — two overlapping plate forms centered at (800, 440) -->

  <!-- Back plate (offset slightly left-up) -->
  <circle cx="760" cy="430" r="210" fill="url(#plateA)" opacity="0.82"/>
  <!-- Back plate rim ring -->
  <circle cx="760" cy="430" r="210" fill="url(#rimGrad)" opacity="0.9"/>
  <!-- Back plate inner well -->
  <circle cx="760" cy="430" r="140" fill="#78350f" opacity="0.55"/>
  <circle cx="760" cy="430" r="90" fill="#9a3309" opacity="0.45"/>

  <!-- Front plate (offset slightly right-down) -->
  <circle cx="845" cy="468" r="195" fill="url(#plateB)" opacity="0.88"/>
  <!-- Front plate rim ring -->
  <circle cx="845" cy="468" r="195" fill="url(#rimGrad)" opacity="0.95"/>
  <!-- Front plate inner well -->
  <circle cx="845" cy="468" r="130" fill="#3d1a08" opacity="0.6"/>
  <circle cx="845" cy="468" r="80" fill="#5c2a1a" opacity="0.5"/>
  <!-- Small accent dot — garnish suggestion -->
  <circle cx="845" cy="455" r="14" fill="#fbbf24" opacity="0.75"/>
  <circle cx="830" cy="475" r="8" fill="#c2410c" opacity="0.8"/>
  <circle cx="862" cy="478" r="6" fill="#d97706" opacity="0.7"/>

  <!-- Lotus accent — left side of hero, inside safe zone -->
  <ellipse cx="530" cy="600" rx="48" ry="18" fill="#c2410c" opacity="0.55"/>
  <ellipse cx="530" cy="590" rx="32" ry="28" fill="url(#lotusGlow)" opacity="0.65"/>
  <ellipse cx="530" cy="578" rx="14" ry="22" fill="#d97706" opacity="0.7"/>
  <ellipse cx="518" cy="585" rx="18" ry="12" fill="#fbbf24" opacity="0.45" transform="rotate(-30 518 585)"/>
  <ellipse cx="542" cy="585" rx="18" ry="12" fill="#fbbf24" opacity="0.45" transform="rotate(30 542 585)"/>

  <!-- Lotus accent — right side of hero, inside safe zone -->
  <ellipse cx="1075" cy="580" rx="44" ry="16" fill="#c2410c" opacity="0.5"/>
  <ellipse cx="1075" cy="570" rx="28" ry="26" fill="url(#lotusGlow)" opacity="0.6"/>
  <ellipse cx="1075" cy="558" rx="12" ry="20" fill="#d97706" opacity="0.65"/>
  <ellipse cx="1063" cy="565" rx="16" ry="11" fill="#fbbf24" opacity="0.4" transform="rotate(-28 1063 565)"/>
  <ellipse cx="1087" cy="565" rx="16" ry="11" fill="#fbbf24" opacity="0.4" transform="rotate(28 1087 565)"/>

  <!-- Layer 3: Edge decorations (outside/near safe zone edges — purely atmospheric) -->
  <!-- Top-left warm bleed -->
  <ellipse cx="160" cy="120" rx="200" ry="140" fill="#9a3309" opacity="0.12"/>
  <!-- Bottom-right warm bleed -->
  <ellipse cx="1450" cy="810" rx="220" ry="130" fill="#78350f" opacity="0.15"/>
  <!-- Top edge subtle line accent -->
  <path d="M 500 40 Q 800 20 1100 40" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.2"/>
</svg>
