<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1508"/>
    </linearGradient>
    <!-- Warm candlelight glow at table centre -->
    <radialGradient id="glow" cx="50%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate highlight -->
    <radialGradient id="plateL" cx="38%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f0eadb" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#d4c4a8" stop-opacity="0.70"/>
    </radialGradient>
    <radialGradient id="plateR" cx="62%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.90"/>
      <stop offset="55%" stop-color="#f0eadb" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#d4c4a8" stop-opacity="0.65"/>
    </radialGradient>
    <!-- Food morsel on plate — warm sauce highlight -->
    <radialGradient id="morsel" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Candle flame -->
    <radialGradient id="flame" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Rose accent for orchid petals -->
    <radialGradient id="petal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.70"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle table surface line -->
  <rect x="0" y="610" width="1600" height="290" fill="#0d0707" opacity="0.45"/>
  <rect x="0" y="608" width="1600" height="4" fill="#5c2a1a" opacity="0.6"/>

  <!-- Layer 2: Hero — two plates centered in safe zone -->

  <!-- Left plate (ellipse to suggest perspective) -->
  <ellipse cx="640" cy="530" rx="155" ry="148" fill="url(#plateL)"/>
  <!-- Plate rim ring -->
  <ellipse cx="640" cy="530" rx="155" ry="148" fill="none" stroke="#c8b89a" stroke-width="6" opacity="0.5"/>
  <!-- Inner plate circle -->
  <ellipse cx="640" cy="528" rx="108" ry="103" fill="#faf8f2" opacity="0.55"/>
  <!-- Food morsel on left plate -->
  <ellipse cx="640" cy="522" rx="42" ry="34" fill="url(#morsel)" opacity="0.9"/>
  <!-- Sauce trail left plate -->
  <path d="M 605 515 Q 638 498 670 520" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Right plate -->
  <ellipse cx="960" cy="530" rx="155" ry="148" fill="url(#plateR)"/>
  <ellipse cx="960" cy="530" rx="155" ry="148" fill="none" stroke="#c8b89a" stroke-width="6" opacity="0.5"/>
  <ellipse cx="960" cy="528" rx="108" ry="103" fill="#faf8f2" opacity="0.50"/>
  <!-- Food morsel on right plate -->
  <ellipse cx="955" cy="519" rx="38" ry="30" fill="url(#morsel)" opacity="0.88"/>
  <!-- Sauce trail right plate -->
  <path d="M 923 513 Q 954 496 986 516" fill="none" stroke="#9a3309" stroke-width="5" stroke-linecap="round" opacity="0.70"/>

  <!-- Candle between the plates -->
  <!-- Candle body -->
  <rect x="790" y="430" width="20" height="90" rx="3" fill="#fef3ec" opacity="0.88"/>
  <!-- Wax drip -->
  <path d="M 790 445 Q 786 460 788 475" fill="none" stroke="#f0eadb" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- Flame -->
  <ellipse cx="800" cy="422" rx="10" ry="16" fill="url(#flame)" opacity="0.95"/>
  <!-- Flame inner bright core -->
  <ellipse cx="800" cy="425" rx="4" ry="7" fill="#fbbf24" opacity="1"/>

  <!-- Thai orchid accent — left of left plate -->
  <!-- Petal 1 -->
  <ellipse cx="452" cy="488" rx="30" ry="14" fill="url(#petal)" transform="rotate(-35 452 488)" opacity="0.85"/>
  <!-- Petal 2 -->
  <ellipse cx="478" cy="468" rx="30" ry="14" fill="url(#petal)" transform="rotate(10 478 468)" opacity="0.80"/>
  <!-- Petal 3 -->
  <ellipse cx="435" cy="462" rx="28" ry="13" fill="url(#petal)" transform="rotate(-70 435 462)" opacity="0.78"/>
  <!-- Petal 4 -->
  <ellipse cx="468" cy="455" rx="26" ry="12" fill="url(#petal)" transform="rotate(50 468 455)" opacity="0.75"/>
  <!-- Orchid centre -->
  <circle cx="460" cy="472" r="9" fill="#fbbf24" opacity="0.90"/>
  <circle cx="460" cy="472" r="5" fill="#c2410c" opacity="0.95"/>

  <!-- Thai orchid accent — right of right plate -->
  <ellipse cx="1148" cy="488" rx="30" ry="14" fill="url(#petal)" transform="rotate(35 1148 488)" opacity="0.82"/>
  <ellipse cx="1122" cy="468" rx="30" ry="14" fill="url(#petal)" transform="rotate(-10 1122 468)" opacity="0.78"/>
  <ellipse cx="1165" cy="462" rx="28" ry="13" fill="url(#petal)" transform="rotate(70 1165 462)" opacity="0.76"/>
  <ellipse cx="1132" cy="455" rx="26" ry="12" fill="url(#petal)" transform="rotate(-50 1132 455)" opacity="0.73"/>
  <circle cx="1140" cy="472" r="9" fill="#fbbf24" opacity="0.88"/>
  <circle cx="1140" cy="472" r="5" fill="#c2410c" opacity="0.93"/>

  <!-- Layer 3: Edge atmosphere — deep vignette corners (outside safe zone) -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0d0707" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
