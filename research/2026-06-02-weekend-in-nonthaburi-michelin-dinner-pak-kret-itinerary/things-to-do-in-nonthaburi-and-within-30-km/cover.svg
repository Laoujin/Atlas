<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind spire -->
  <circle cx="800" cy="470" r="320" fill="url(#sun)"/>

  <!-- distant minor pagoda silhouettes (decoration, partially outside safe zone is fine) -->
  <g fill="#78350f" opacity="0.45">
    <polygon points="280,640 300,560 320,640"/>
    <rect x="288" y="640" width="24" height="40"/>
    <polygon points="1290,650 1310,580 1330,650"/>
    <rect x="1298" y="650" width="24" height="36"/>
    <polygon points="1380,660 1395,605 1410,660"/>
    <rect x="1385" y="660" width="20" height="30"/>
  </g>

  <!-- hero: central temple spire (prang/chedi), centered ~ (800, 450), within safe zone -->
  <g>
    <!-- base platform -->
    <rect x="680" y="640" width="240" height="70" fill="#78350f" opacity="0.92"/>
    <rect x="650" y="700" width="300" height="20" fill="#5c2a1a" opacity="0.95"/>
    <!-- main body -->
    <polygon points="800,180 880,440 870,640 730,640 720,440" fill="url(#spire)" opacity="0.95"/>
    <!-- tip needle -->
    <polygon points="800,140 808,200 792,200" fill="#c2410c"/>
    <circle cx="800" cy="210" r="10" fill="#fbbf24" opacity="0.9"/>
    <!-- tier rings -->
    <polygon points="745,400 855,400 845,420 755,420" fill="#9a3309" opacity="0.9"/>
    <polygon points="735,500 865,500 858,525 742,525" fill="#9a3309" opacity="0.9"/>
    <!-- side stepped tiers -->
    <polygon points="730,440 720,440 705,500 720,500" fill="#78350f" opacity="0.85"/>
    <polygon points="870,440 880,440 895,500 880,500" fill="#78350f" opacity="0.85"/>
    <!-- inset arch (entrance) -->
    <path d="M780,610 Q780,560 800,560 Q820,560 820,610 Z" fill="#1a0e0e" opacity="0.55"/>
  </g>

  <!-- secondary smaller spire (companion temple) -->
  <g opacity="0.85">
    <rect x="1020" y="680" width="100" height="30" fill="#5c2a1a"/>
    <polygon points="1070,420 1115,680 1025,680" fill="#9a3309"/>
    <polygon points="1070,395 1076,430 1064,430" fill="#c2410c"/>
    <polygon points="1045,560 1095,560 1090,575 1050,575" fill="#78350f"/>
  </g>

  <!-- river: curving band across lower third -->
  <path d="M0,720 Q400,690 800,730 T1600,720 L1600,900 L0,900 Z" fill="url(#river)"/>
  <!-- river highlight ripples -->
  <path d="M120,760 Q300,745 480,760" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M600,790 Q800,775 1000,795" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M1100,770 Q1300,755 1500,775" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Koh Kret island hint (small landmass with palm) -->
  <g>
    <ellipse cx="380" cy="780" rx="110" ry="18" fill="#5c2a1a" opacity="0.85"/>
    <rect x="376" y="745" width="4" height="35" fill="#78350f"/>
    <path d="M378,745 Q360,735 348,742 Q362,742 378,750 Q394,742 408,742 Q396,735 378,745 Z" fill="#78350f" opacity="0.9"/>
  </g>

  <!-- long-tail boat silhouette on the river -->
  <g opacity="0.9">
    <path d="M1080,800 Q1130,790 1220,800 L1210,815 L1090,815 Z" fill="#1a0e0e"/>
    <line x1="1220" y1="800" x2="1270" y2="785" stroke="#1a0e0e" stroke-width="3"/>
    <circle cx="1272" cy="784" r="3" fill="#c2410c"/>
  </g>
</svg>
