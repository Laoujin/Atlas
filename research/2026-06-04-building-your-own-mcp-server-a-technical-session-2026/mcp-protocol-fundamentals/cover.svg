<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration outside safe zone -->
  <circle cx="80" cy="60" r="160" fill="#c2410c" opacity="0.06"/>
  <circle cx="1530" cy="850" r="190" fill="#0e7490" opacity="0.07"/>

  <!-- client plug: block on left with two prongs reaching right -->
  <path d="M360 320 H700 V410 H800 V370 H880 V430 H800 V470 H880 V530 H800 V490 H700 V580 H360 Z"
        fill="url(#client)" opacity="0.9"/>

  <!-- server port: block on right with two slots receiving prongs -->
  <path d="M1240 300 H900 V400 H810 V440 H890 V450 H810 V510 H890 V510 H900 V600 H1240 Z"
        fill="url(#server)" opacity="0.88"/>

  <!-- connection spark/trail between plug and port -->
  <circle cx="848" cy="450" r="120" fill="url(#spark)" opacity="0.85"/>
  <path d="M812 408 L860 408 L838 446 L876 446 L800 506 L824 462 L788 462 Z"
        fill="#fbbf24" opacity="0.92"/>
</svg>
