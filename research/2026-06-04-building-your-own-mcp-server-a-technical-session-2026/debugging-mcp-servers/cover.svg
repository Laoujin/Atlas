<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="fault" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint stream bars outside safe zone -->
  <g opacity="0.25" fill="#78350f">
    <rect x="40" y="430" width="70" height="14" rx="7"/>
    <rect x="40" y="462" width="48" height="14" rx="7"/>
    <rect x="1500" y="430" width="64" height="14" rx="7"/>
    <rect x="1512" y="462" width="80" height="14" rx="7"/>
  </g>

  <!-- hero: staggered message stream -->
  <g opacity="0.85">
    <rect x="200" y="436" width="180" height="18" rx="9" fill="url(#bar)"/>
    <rect x="410" y="436" width="120" height="18" rx="9" fill="url(#bar)"/>
    <rect x="560" y="436" width="210" height="18" rx="9" fill="url(#bar)"/>
    <rect x="800" y="436" width="90" height="18" rx="9" fill="url(#fault)" opacity="0.95"/>
    <rect x="920" y="436" width="160" height="18" rx="9" fill="url(#bar)"/>
    <rect x="1110" y="436" width="130" height="18" rx="9" fill="url(#bar)"/>
    <rect x="1270" y="436" width="190" height="18" rx="9" fill="url(#bar)"/>
  </g>

  <!-- hero: concentric rust lens rings over the fault bar -->
  <g fill="none" stroke-linecap="round">
    <circle cx="845" cy="445" r="190" stroke="#9a3309" stroke-width="10" opacity="0.6"/>
    <circle cx="845" cy="445" r="150" stroke="#c2410c" stroke-width="14" opacity="0.7"/>
    <circle cx="845" cy="445" r="108" stroke="#d97706" stroke-width="18" opacity="0.8"/>
  </g>
  <circle cx="845" cy="445" r="80" fill="url(#lens)" opacity="0.6"/>
</svg>
