<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="teal" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e63"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint orbit rings outside safe zone -->
  <circle cx="120" cy="120" r="240" fill="none" stroke="#78350f" stroke-width="6" opacity="0.35"/>
  <circle cx="1500" cy="800" r="300" fill="none" stroke="#0e7490" stroke-width="5" opacity="0.25"/>

  <!-- HERO: two interlocking plug/port blocks with a connection spark -->
  <!-- left block (rust port) with prong slot -->
  <path d="M 470 320 L 720 320 L 720 420 L 770 420 L 770 480 L 720 480 L 720 580 L 470 580 Z"
        fill="url(#rust)" opacity="0.92"/>

  <!-- right block (teal plug) with prong -->
  <path d="M 1130 320 L 880 320 L 880 420 L 830 420 L 830 480 L 880 480 L 880 580 L 1130 580 Z"
        fill="url(#teal)" opacity="0.88"/>

  <!-- connection spark trail bridging the gap -->
  <path d="M 760 450 L 800 412 L 790 446 L 840 450 L 800 488 L 810 454 Z"
        fill="url(#spark)" opacity="0.95"/>

  <!-- spark node dots along the seam -->
  <circle cx="800" cy="360" r="10" fill="#fbbf24" opacity="0.85"/>
  <circle cx="800" cy="540" r="10" fill="#fbbf24" opacity="0.85"/>
</svg>
