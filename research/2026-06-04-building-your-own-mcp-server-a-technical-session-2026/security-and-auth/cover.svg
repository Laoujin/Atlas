<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="slot" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#06363f"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint hex echo outside safe zone -->
  <polygon points="800,30 1500,75 1540,500 800,860 60,500 100,75" fill="none" stroke="#fbbf24" stroke-opacity="0.12" stroke-width="3"/>

  <!-- hero: rust angular hex shield -->
  <polygon points="800,120 1180,300 1180,560 800,800 420,560 420,300" fill="url(#shield)" opacity="0.95"/>
  <polygon points="800,120 1180,300 1180,560 800,800 420,560 420,300" fill="none" stroke="url(#bevel)" stroke-width="14" stroke-linejoin="miter" opacity="0.85"/>

  <!-- teal keyhole-slot auth boundary -->
  <circle cx="800" cy="400" r="78" fill="url(#slot)" opacity="0.92"/>
  <polygon points="762,440 838,440 868,640 732,640" fill="url(#slot)" opacity="0.92"/>

  <!-- barred gap across the slot -->
  <rect x="700" y="498" width="200" height="26" rx="6" fill="#1a0e0e" opacity="0.75"/>
  <rect x="700" y="560" width="200" height="26" rx="6" fill="#1a0e0e" opacity="0.75"/>
</svg>
