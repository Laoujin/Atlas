<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint teal arc outside safe zone -->
  <circle cx="60" cy="840" r="150" fill="#0e7490" opacity="0.12"/>
  <circle cx="1540" cy="70" r="120" fill="#0e7490" opacity="0.1"/>

  <!-- hero: angled stacked code-page rectangles -->
  <g transform="rotate(-12 800 450)" opacity="0.9">
    <!-- back page -->
    <g transform="translate(70 70)">
      <rect x="520" y="230" width="560" height="440" rx="24" fill="url(#page)" opacity="0.6"/>
    </g>
    <!-- mid page -->
    <g transform="translate(35 35)">
      <rect x="520" y="230" width="560" height="440" rx="24" fill="url(#page)" opacity="0.75"/>
    </g>
    <!-- front page with line-bars -->
    <rect x="520" y="230" width="560" height="440" rx="24" fill="url(#page)" opacity="0.92"/>
    <rect x="520" y="230" width="14" height="440" rx="7" fill="#0e7490" opacity="0.85"/>
    <g fill="#9a3309" opacity="0.45">
      <rect x="575" y="285" width="300" height="20" rx="10"/>
      <rect x="575" y="335" width="430" height="20" rx="10"/>
      <rect x="620" y="385" width="240" height="20" rx="10"/>
      <rect x="620" y="435" width="350" height="20" rx="10"/>
      <rect x="575" y="540" width="200" height="20" rx="10"/>
      <rect x="575" y="590" width="380" height="20" rx="10"/>
    </g>
  </g>

  <!-- hero: rust run/play triangle on top -->
  <path d="M 690 320 L 690 580 L 940 450 Z" fill="url(#play)" opacity="0.95"/>
  <path d="M 690 320 L 690 580 L 940 450 Z" fill="none" stroke="#0e7490" stroke-width="10" opacity="0.7"/>
</svg>
