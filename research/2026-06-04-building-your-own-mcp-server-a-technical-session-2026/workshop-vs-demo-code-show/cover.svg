<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint echo paths outside safe zone -->
  <path d="M800 880 C760 700 360 560 60 470" fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="round" opacity="0.18"/>
  <path d="M800 880 C840 700 1240 560 1540 470" fill="none" stroke="#0e7490" stroke-width="14" stroke-linecap="round" opacity="0.16"/>

  <!-- hero: trunk rising then forking -->
  <path d="M785 800 C785 660 770 600 760 540 L840 540 C830 600 815 660 815 800 Z" fill="url(#trunk)" opacity="0.92"/>

  <!-- rust branch (workshop) -->
  <path d="M770 545 C700 470 540 420 360 360 C300 340 230 320 165 300 L150 360 C220 388 300 410 380 440 C540 500 690 560 790 590 Z" fill="url(#rust)" opacity="0.9"/>

  <!-- teal branch (demo) -->
  <path d="M830 545 C900 470 1060 420 1240 360 C1300 340 1370 320 1435 300 L1450 360 C1380 388 1300 410 1220 440 C1060 500 910 560 810 590 Z" fill="url(#teal)" opacity="0.82"/>

  <!-- fork node -->
  <circle cx="800" cy="548" r="56" fill="url(#node)" opacity="0.95"/>
  <circle cx="800" cy="548" r="56" fill="none" stroke="#78350f" stroke-width="6" opacity="0.6"/>
</svg>
