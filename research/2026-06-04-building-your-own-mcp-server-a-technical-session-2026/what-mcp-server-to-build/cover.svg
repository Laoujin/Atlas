<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: oversized faint card outside safe zone -->
  <rect x="1300" y="-60" width="320" height="440" rx="28" fill="#fbbf24" opacity="0.18" transform="rotate(14 1460 160)"/>
  <rect x="-40" y="560" width="300" height="420" rx="28" fill="#0e7490" opacity="0.14" transform="rotate(-12 110 770)"/>

  <!-- fanned candidate cards -->
  <rect x="560" y="300" width="380" height="520" rx="30" fill="url(#cardC)" opacity="0.8" transform="rotate(-15 750 560)"/>
  <rect x="620" y="300" width="380" height="520" rx="30" fill="url(#cardB)" opacity="0.7" transform="rotate(-5 810 560)"/>
  <rect x="680" y="300" width="380" height="520" rx="30" fill="url(#cardA)" opacity="0.85" transform="rotate(7 870 560)"/>

  <!-- hero chosen card, lifted and centered -->
  <g transform="translate(800 430) rotate(-3)">
    <rect x="-205" y="-265" width="410" height="540" rx="34" fill="#5c2a1a" opacity="0.35" transform="translate(14 22)"/>
    <rect x="-205" y="-265" width="410" height="540" rx="34" fill="url(#hero)" opacity="0.95"/>
    <rect x="-150" y="-205" width="300" height="40" rx="20" fill="#fbbf24" opacity="0.7"/>
    <circle cx="0" cy="30" r="92" fill="#fef3ec" opacity="0.85"/>
    <circle cx="0" cy="30" r="54" fill="#9a3309" opacity="0.9"/>
  </g>
</svg>
