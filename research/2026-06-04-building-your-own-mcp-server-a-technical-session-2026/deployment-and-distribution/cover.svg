<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="heroTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="heroLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="heroRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="baseLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="baseRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 3: decoration outside safe zone (branching distribution cubes) -->
  <g opacity="0.65">
    <!-- top-left branch cube -->
    <g transform="translate(180,150)">
      <path d="M0,-30 L52,0 L0,30 L-52,0 Z" fill="#0e7490"/>
      <path d="M-52,0 L0,30 L0,90 L-52,60 Z" fill="#78350f"/>
      <path d="M52,0 L0,30 L0,90 L52,60 Z" fill="#5c2a1a"/>
    </g>
    <!-- bottom-right branch cube -->
    <g transform="translate(1430,760)">
      <path d="M0,-26 L46,0 L0,26 L-46,0 Z" fill="#d97706"/>
      <path d="M-46,0 L0,26 L0,78 L-46,52 Z" fill="#9a3309"/>
      <path d="M46,0 L0,26 L0,78 L46,52 Z" fill="#78350f"/>
    </g>
  </g>

  <!-- Layer 2: hero stack centered ~(800,450) -->
  <g opacity="0.92">
    <!-- base cube (bottom, large) -->
    <g transform="translate(800,560)">
      <path d="M0,-95 L165,0 L0,95 L-165,0 Z" fill="url(#baseTop)"/>
      <path d="M-165,0 L0,95 L0,265 L-165,170 Z" fill="url(#baseLeft)"/>
      <path d="M165,0 L0,95 L0,265 L165,170 Z" fill="url(#baseRight)"/>
    </g>
    <!-- left neighbor cube (distribution) -->
    <g transform="translate(540,470)" opacity="0.85">
      <path d="M0,-65 L112,0 L0,65 L-112,0 Z" fill="#d97706"/>
      <path d="M-112,0 L0,65 L0,180 L-112,115 Z" fill="#9a3309"/>
      <path d="M112,0 L0,65 L0,180 L112,115 Z" fill="#78350f"/>
    </g>
    <!-- right neighbor cube (distribution) -->
    <g transform="translate(1060,470)" opacity="0.85">
      <path d="M0,-65 L112,0 L0,65 L-112,0 Z" fill="#d97706"/>
      <path d="M-112,0 L0,65 L0,180 L-112,115 Z" fill="#9a3309"/>
      <path d="M112,0 L0,65 L0,180 L112,115 Z" fill="#78350f"/>
    </g>
    <!-- rust hero cube on top -->
    <g transform="translate(800,330)">
      <path d="M0,-80 L138,0 L0,80 L-138,0 Z" fill="url(#heroTop)"/>
      <path d="M-138,0 L0,80 L0,215 L-138,135 Z" fill="url(#heroLeft)"/>
      <path d="M138,0 L0,80 L0,215 L138,135 Z" fill="url(#heroRight)"/>
      <!-- teal LED-dot accent -->
      <ellipse cx="-69" cy="115" rx="13" ry="16" fill="#0e7490" opacity="0.95"/>
    </g>
  </g>
</svg>
