<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hero" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- faint teal vector cloud, pushed to the edge and cropped -->
  <g fill="#0e7490" opacity="0.6">
    <circle cx="1500" cy="120" r="5"/>
    <circle cx="1545" cy="180" r="4"/>
    <circle cx="1470" cy="200" r="3"/>
    <circle cx="1560" cy="260" r="6"/>
    <circle cx="1505" cy="300" r="3"/>
    <circle cx="1580" cy="360" r="4"/>
    <circle cx="1455" cy="350" r="3"/>
    <circle cx="1535" cy="430" r="5"/>
    <circle cx="1590" cy="500" r="3"/>
    <circle cx="1490" cy="510" r="4"/>
    <circle cx="1560" cy="600" r="3"/>
    <circle cx="1520" cy="690" r="5"/>
    <circle cx="1585" cy="760" r="4"/>
    <circle cx="1475" cy="730" r="3"/>
    <circle cx="1540" cy="830" r="4"/>
    <circle cx="60" cy="70" r="3"/>
    <circle cx="40" cy="830" r="4"/>
  </g>

  <!-- hero: one small rust node alone amid negative space -->
  <circle cx="800" cy="450" r="190" fill="url(#halo)"/>
  <circle cx="800" cy="450" r="78" fill="url(#hero)" opacity="0.92"/>
  <circle cx="772" cy="422" r="22" fill="#fef3ec" opacity="0.6"/>
</svg>
