<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- decorative gate accent, bleeds off left edge -->
  <g opacity="0.18" fill="#78350f">
    <rect x="40" y="668" width="66" height="14" rx="7"/>
    <rect x="40" y="682" width="14" height="150" rx="7"/>
    <rect x="92" y="682" width="14" height="150" rx="7"/>
  </g>

  <!-- stacked form pages -->
  <g transform="rotate(-9 800 450)">
    <rect x="570" y="290" width="460" height="320" rx="28" fill="#78350f" opacity="0.4"/>
  </g>
  <g transform="rotate(-4 800 450)">
    <rect x="570" y="290" width="460" height="320" rx="28" fill="#9a3309" opacity="0.6"/>
  </g>
  <g transform="rotate(3 800 450)">
    <rect x="570" y="290" width="460" height="320" rx="28" fill="url(#heroGrad)" opacity="0.95"/>
    <rect x="610" y="340" width="260" height="16" rx="8" fill="#fef3ec" opacity="0.4"/>
    <rect x="610" y="384" width="300" height="16" rx="8" fill="#fef3ec" opacity="0.4"/>
    <rect x="610" y="428" width="220" height="16" rx="8" fill="#fef3ec" opacity="0.35"/>
    <rect x="610" y="472" width="260" height="16" rx="8" fill="#fef3ec" opacity="0.35"/>
  </g>

  <!-- local file, about to bypass the form via direct upload -->
  <g transform="rotate(-6 530 598)">
    <rect x="480" y="560" width="100" height="76" rx="16" fill="#d97706" opacity="0.85"/>
    <rect x="500" y="585" width="56" height="10" rx="5" fill="#fef3ec" opacity="0.45"/>
    <rect x="500" y="605" width="40" height="10" rx="5" fill="#fef3ec" opacity="0.35"/>
  </g>

  <!-- arc bypassing the stacked pages, landing in remote storage -->
  <path d="M560,552 C650,378 950,300 1088,268" fill="none" stroke="#9a3309" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
  <polygon points="1082,252 1108,262 1086,280" fill="#78350f" opacity="0.7"/>

  <circle cx="1150" cy="260" r="54" fill="url(#storeGrad)" opacity="0.95"/>
  <path d="M1100,246 A54,20 0 0 1 1200,246" fill="none" stroke="#fef3ec" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
</svg>
