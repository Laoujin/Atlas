<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="blockA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- faint stacked page bars, corner decoration only -->
  <g opacity="0.25">
    <rect x="120" y="140" width="220" height="34" rx="6" fill="#9a3309"/>
    <rect x="120" y="190" width="160" height="34" rx="6" fill="#9a3309"/>
    <rect x="1260" y="700" width="220" height="34" rx="6" fill="#78350f"/>
    <rect x="1320" y="750" width="160" height="34" rx="6" fill="#78350f"/>
  </g>

  <!-- connective glow behind the bridge -->
  <circle cx="800" cy="450" r="230" fill="url(#glow)"/>

  <!-- spark trail bridging the two blocks -->
  <path d="M 610 500 C 720 430, 880 470, 990 400" fill="none" stroke="url(#spark)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <circle cx="610" cy="500" r="14" fill="#fbbf24" opacity="0.9"/>
  <circle cx="990" cy="400" r="14" fill="#fbbf24" opacity="0.9"/>

  <!-- two interlocking blocks: the design-system component and the form engine -->
  <rect x="480" y="330" width="300" height="230" rx="28" fill="url(#blockA)" opacity="0.95" transform="rotate(-6 630 445)"/>
  <rect x="800" y="360" width="300" height="230" rx="28" fill="url(#blockB)" opacity="0.9" transform="rotate(5 950 475)"/>

  <!-- interlock notch accents -->
  <rect x="742" y="410" width="70" height="70" rx="16" fill="#fbbf24" opacity="0.8" transform="rotate(-6 777 445)"/>
</svg>
