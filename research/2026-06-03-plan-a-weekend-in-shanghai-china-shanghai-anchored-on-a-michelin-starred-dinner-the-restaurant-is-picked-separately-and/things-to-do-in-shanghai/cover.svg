<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="0.78" stop-color="#9a3309"/>
      <stop offset="0.92" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="620" rx="760" ry="320" fill="url(#glow)"/>

  <!-- Hero skyline silhouette, baseline at y=620, within safe zone -->
  <g fill="url(#tower)" opacity="0.95">
    <!-- low Bund-side blocks left -->
    <rect x="300" y="490" width="80" height="130"/>
    <rect x="385" y="450" width="60" height="170"/>
    <rect x="450" y="520" width="70" height="100"/>

    <!-- Oriental Pearl: spire + two spheres -->
    <rect x="640" y="200" width="14" height="420"/>
    <circle cx="647" cy="430" r="46"/>
    <circle cx="647" cy="300" r="30"/>
    <polygon points="647,150 640,200 654,200"/>

    <!-- Shanghai Tower: tall tapered hero -->
    <polygon points="800,180 848,180 838,620 810,620"/>
    <!-- Jin Mao / SWFC neighbours -->
    <polygon points="880,300 930,300 922,620 888,620"/>
    <rect x="950" y="350" width="46" height="270"/>
    <polygon points="996,350 1042,350 1042,620 996,620"/>

    <!-- right-side blocks -->
    <rect x="1080" y="470" width="70" height="150"/>
    <rect x="1155" y="430" width="55" height="190"/>
    <rect x="1215" y="500" width="80" height="120"/>
  </g>

  <!-- accent lit windows on the tapered hero -->
  <g fill="#fbbf24" opacity="0.8">
    <rect x="816" y="260" width="6" height="6"/>
    <rect x="828" y="340" width="6" height="6"/>
    <rect x="818" y="430" width="6" height="6"/>
    <circle cx="647" cy="430" r="6"/>
  </g>

  <!-- water with reflection -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#water)"/>
  <g fill="#fbbf24" opacity="0.3">
    <rect x="804" y="620" width="6" height="120"/>
    <rect x="643" y="620" width="8" height="90"/>
    <rect x="900" y="620" width="6" height="70"/>
  </g>
</svg>
