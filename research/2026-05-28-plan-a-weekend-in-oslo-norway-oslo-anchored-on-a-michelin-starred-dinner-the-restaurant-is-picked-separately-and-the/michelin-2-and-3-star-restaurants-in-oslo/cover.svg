<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plateA" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="plateB" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="fjord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Faint fjord horizon glow band -->
  <rect x="0" y="540" width="1600" height="140" fill="url(#fjord)"/>

  <!-- Distant Bjørvika silhouette (Opera House sloping roof + skyline) outside hero safe zone -->
  <polygon points="0,620 180,610 320,560 440,540 540,560 640,600 760,620 880,610 1000,580 1120,560 1240,580 1360,600 1480,610 1600,620 1600,680 0,680" fill="#0d0807" opacity="0.85"/>

  <!-- Star glow halos behind each plate -->
  <circle cx="600" cy="380" r="230" fill="url(#starGlow)" opacity="0.4"/>
  <circle cx="1080" cy="500" r="180" fill="url(#starGlow)" opacity="0.35"/>

  <!-- Plate A: Maaemo, 3-star, larger, left-of-center -->
  <circle cx="600" cy="450" r="240" fill="url(#plateA)" opacity="0.92"/>
  <circle cx="600" cy="450" r="240" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.55"/>
  <circle cx="600" cy="450" r="180" fill="none" stroke="#fef3ec" stroke-width="1.2" opacity="0.35"/>

  <!-- Three stars above Plate A -->
  <g fill="#fbbf24" opacity="0.95">
    <polygon points="510,200 519,222 543,222 524,236 532,258 510,245 488,258 496,236 477,222 501,222"/>
    <polygon points="600,180 609,202 633,202 614,216 622,238 600,225 578,238 586,216 567,202 591,202"/>
    <polygon points="690,200 699,222 723,222 704,236 712,258 690,245 668,258 676,236 657,222 681,222"/>
  </g>

  <!-- Plate B: Kontrast, 2-star, smaller, right-of-center, overlapping foreground -->
  <circle cx="1080" cy="540" r="180" fill="url(#plateB)" opacity="0.9"/>
  <circle cx="1080" cy="540" r="180" fill="none" stroke="#be185d" stroke-width="1.8" opacity="0.5"/>
  <circle cx="1080" cy="540" r="135" fill="none" stroke="#fef3ec" stroke-width="1.2" opacity="0.3"/>

  <!-- Two stars above Plate B -->
  <g fill="#fbbf24" opacity="0.95">
    <polygon points="1035,320 1043,340 1064,340 1047,353 1054,373 1035,361 1016,373 1023,353 1006,340 1027,340"/>
    <polygon points="1125,320 1133,340 1154,340 1137,353 1144,373 1125,361 1106,373 1113,353 1096,340 1117,340"/>
  </g>

  <!-- Subtle plate accents: a small rust dot garnish on each -->
  <circle cx="600" cy="450" r="14" fill="#9a3309" opacity="0.7"/>
  <circle cx="1080" cy="540" r="10" fill="#be185d" opacity="0.65"/>
</svg>
