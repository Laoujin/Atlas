<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fjord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="roofLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roofShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Low sun glow over fjord (hero accent) -->
  <circle cx="800" cy="560" r="320" fill="url(#sun)"/>

  <!-- Distant ridge -->
  <path d="M0,640 L260,580 L520,610 L820,560 L1100,595 L1380,555 L1600,585 L1600,720 L0,720 Z"
        fill="#9a3309" opacity="0.35"/>

  <!-- Fjord water -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#fjord)"/>

  <!-- Opera House: two long sloping roof planes meeting at the water -->
  <!-- Left plane (light) -->
  <path d="M400,700 L880,360 L980,360 L520,700 Z"
        fill="url(#roofLight)" opacity="0.95"/>
  <!-- Right plane (shaded) -->
  <path d="M880,360 L980,360 L1300,700 L1180,700 Z"
        fill="url(#roofShade)" opacity="0.9"/>
  <!-- Back/secondary plane -->
  <path d="M780,440 L1050,300 L1120,300 L900,440 Z"
        fill="#78350f" opacity="0.55"/>

  <!-- Ridge lines along the roof, suggesting the marble panels -->
  <g stroke="#c2410c" stroke-width="1.5" opacity="0.55" fill="none">
    <line x1="500" y1="640" x2="900" y2="360"/>
    <line x1="600" y1="570" x2="940" y2="360"/>
    <line x1="700" y1="500" x2="970" y2="360"/>
  </g>
  <g stroke="#9a3309" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="940" y1="360" x2="1200" y2="680"/>
    <line x1="970" y1="360" x2="1260" y2="690"/>
  </g>

  <!-- Water reflection of the structure -->
  <path d="M520,700 L1180,700 L1100,760 L600,760 Z"
        fill="#1a0e0e" opacity="0.25"/>
  <g stroke="#faf8f2" stroke-width="1" opacity="0.35">
    <line x1="560" y1="720" x2="1140" y2="720"/>
    <line x1="600" y1="740" x2="1080" y2="740"/>
    <line x1="660" y1="755" x2="1020" y2="755"/>
  </g>

  <!-- Subtle calendar-grid hint in upper corner (decoration, gets cropped on detail) -->
  <g stroke="#c2410c" stroke-width="1" opacity="0.2" fill="none">
    <rect x="60" y="60" width="180" height="120"/>
    <line x1="60" y1="90" x2="240" y2="90"/>
    <line x1="60" y1="120" x2="240" y2="120"/>
    <line x1="60" y1="150" x2="240" y2="150"/>
    <line x1="105" y1="60" x2="105" y2="180"/>
    <line x1="150" y1="60" x2="150" y2="180"/>
    <line x1="195" y1="60" x2="195" y2="180"/>
  </g>
  <!-- One highlighted "date" cell, rust accent -->
  <rect x="150" y="120" width="45" height="30" fill="#c2410c" opacity="0.55"/>
</svg>
