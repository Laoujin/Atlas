<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="pageBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="pageMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pageHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- back page -->
  <g transform="translate(800 450) rotate(-14)" opacity="0.85">
    <rect x="-340" y="-230" width="600" height="440" rx="14" fill="url(#pageBack)" stroke="#78350f" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="-290" y1="-160" x2="180" y2="-160" stroke="#78350f" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round"/>
    <line x1="-290" y1="-110" x2="120" y2="-110" stroke="#78350f" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>
    <line x1="-290" y1="-60" x2="160" y2="-60" stroke="#78350f" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- mid page -->
  <g transform="translate(800 450) rotate(-4)" opacity="0.92">
    <rect x="-320" y="-220" width="620" height="450" rx="14" fill="url(#pageMid)" stroke="#9a3309" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="-270" y1="-150" x2="220" y2="-150" stroke="#78350f" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
    <line x1="-270" y1="-100" x2="160" y2="-100" stroke="#78350f" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
    <line x1="-270" y1="-50" x2="200" y2="-50" stroke="#78350f" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- hero page front -->
  <g transform="translate(800 450) rotate(6)">
    <rect x="-300" y="-210" width="640" height="460" rx="16" fill="url(#pageHero)" stroke="#1a0e0e" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="-250" y1="-140" x2="240" y2="-140" stroke="#fbbf24" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
    <line x1="-250" y1="-85" x2="180" y2="-85" stroke="#fef3ec" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    <line x1="-250" y1="-30" x2="220" y2="-30" stroke="#fef3ec" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
    <line x1="-250" y1="25" x2="140" y2="25" stroke="#fef3ec" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
    <line x1="-250" y1="80" x2="200" y2="80" stroke="#fef3ec" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round"/>

    <!-- link nodes on hero -->
    <circle cx="-180" cy="170" r="14" fill="#fbbf24"/>
    <circle cx="-80" cy="170" r="14" fill="#fef3ec" fill-opacity="0.9"/>
    <circle cx="20" cy="170" r="14" fill="#fef3ec" fill-opacity="0.7"/>
    <line x1="-180" y1="170" x2="20" y2="170" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="3"/>
  </g>

  <!-- floating link node connecting hero to outer graph -->
  <g opacity="0.85">
    <line x1="800" y1="270" x2="1180" y2="180" stroke="#0e7490" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="800" y1="630" x2="480" y2="720" stroke="#0e7490" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="540" y1="320" x2="320" y2="220" stroke="#0e7490" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <circle cx="1180" cy="180" r="18" fill="#0e7490"/>
    <circle cx="1180" cy="180" r="8" fill="#fef3ec"/>
    <circle cx="480" cy="720" r="16" fill="#0e7490" opacity="0.85"/>
    <circle cx="320" cy="220" r="14" fill="#0e7490" opacity="0.75"/>
  </g>
</svg>
