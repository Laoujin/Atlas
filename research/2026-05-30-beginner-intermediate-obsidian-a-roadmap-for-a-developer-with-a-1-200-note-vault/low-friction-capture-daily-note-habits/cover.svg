<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f5e6d3"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="380" rx="780" ry="420" fill="url(#glow)"/>

  <!-- back page -->
  <g transform="translate(560 230) rotate(-6)">
    <rect width="520" height="620" rx="14" fill="url(#page)" opacity="0.85" stroke="#c2410c" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="36" y="44" width="180" height="14" rx="3" fill="#c2410c" opacity="0.35"/>
    <line x1="36" y1="100" x2="484" y2="100" stroke="#78350f" stroke-opacity="0.18" stroke-width="2"/>
    <line x1="36" y1="160" x2="420" y2="160" stroke="#78350f" stroke-opacity="0.18" stroke-width="2"/>
    <line x1="36" y1="220" x2="460" y2="220" stroke="#78350f" stroke-opacity="0.18" stroke-width="2"/>
    <line x1="36" y1="280" x2="380" y2="280" stroke="#78350f" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- middle page -->
  <g transform="translate(600 200) rotate(-2)">
    <rect width="520" height="620" rx="14" fill="url(#page)" opacity="0.92" stroke="#c2410c" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="36" y="44" width="200" height="14" rx="3" fill="#c2410c" opacity="0.45"/>
    <line x1="36" y1="100" x2="484" y2="100" stroke="#78350f" stroke-opacity="0.22" stroke-width="2"/>
    <line x1="36" y1="160" x2="440" y2="160" stroke="#78350f" stroke-opacity="0.22" stroke-width="2"/>
    <line x1="36" y1="220" x2="468" y2="220" stroke="#78350f" stroke-opacity="0.22" stroke-width="2"/>
    <line x1="36" y1="280" x2="400" y2="280" stroke="#78350f" stroke-opacity="0.22" stroke-width="2"/>
    <line x1="36" y1="340" x2="450" y2="340" stroke="#78350f" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <!-- front (hero) page -->
  <g transform="translate(640 170) rotate(3)">
    <rect width="520" height="620" rx="14" fill="#fef3ec" stroke="url(#hero)" stroke-width="3"/>
    <rect x="0" y="0" width="520" height="56" rx="14" fill="url(#hero)"/>
    <rect x="0" y="42" width="520" height="14" fill="url(#hero)"/>
    <circle cx="36" cy="98" r="6" fill="#c2410c"/>
    <line x1="60" y1="98" x2="380" y2="98" stroke="#78350f" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="36" cy="148" r="6" fill="#c2410c"/>
    <line x1="60" y1="148" x2="440" y2="148" stroke="#78350f" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="36" cy="198" r="6" fill="#c2410c"/>
    <line x1="60" y1="198" x2="320" y2="198" stroke="#78350f" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="36" cy="248" r="6" fill="#d97706"/>
    <line x1="60" y1="248" x2="400" y2="248" stroke="#78350f" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="36" cy="298" r="6" fill="#d97706"/>
    <line x1="60" y1="298" x2="360" y2="298" stroke="#78350f" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="36" cy="348" r="6" fill="#fbbf24"/>
    <line x1="60" y1="348" x2="280" y2="348" stroke="#78350f" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="36" cy="398" r="6" fill="#fbbf24" opacity="0.7"/>
    <line x1="60" y1="398" x2="240" y2="398" stroke="#78350f" stroke-opacity="0.25" stroke-width="3"/>
  </g>

  <!-- capture funnel: bullets flowing in from top-right -->
  <g opacity="0.9">
    <circle cx="1320" cy="180" r="10" fill="#c2410c"/>
    <circle cx="1240" cy="220" r="8" fill="#d97706"/>
    <circle cx="1170" cy="265" r="7" fill="#fbbf24"/>
    <circle cx="1110" cy="305" r="6" fill="#d97706" opacity="0.8"/>
    <circle cx="1060" cy="340" r="5" fill="#c2410c" opacity="0.7"/>
    <path d="M 1340 165 Q 1180 240 1020 355" stroke="#9a3309" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="2 8" fill="none"/>
  </g>
</svg>
