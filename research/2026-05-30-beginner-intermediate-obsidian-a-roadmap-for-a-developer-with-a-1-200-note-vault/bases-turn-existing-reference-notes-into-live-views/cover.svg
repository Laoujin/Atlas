<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- ambient warm wash behind hero -->
  <circle cx="820" cy="460" r="380" fill="#fbbf24" opacity="0.12"/>

  <!-- left side: stack of reference notes (angled pages) -->
  <g transform="translate(380 470) rotate(-9)">
    <rect x="-150" y="-200" width="300" height="380" rx="8" fill="url(#page)" stroke="#c2410c" stroke-width="2" opacity="0.85"/>
    <rect x="-110" y="-150" width="200" height="6" fill="#c2410c" opacity="0.35"/>
    <rect x="-110" y="-125" width="160" height="4" fill="#78350f" opacity="0.3"/>
    <rect x="-110" y="-105" width="180" height="4" fill="#78350f" opacity="0.3"/>
    <rect x="-110" y="-85" width="120" height="4" fill="#78350f" opacity="0.3"/>
    <rect x="-110" y="-55" width="170" height="4" fill="#78350f" opacity="0.3"/>
    <rect x="-110" y="-35" width="140" height="4" fill="#78350f" opacity="0.3"/>
    <rect x="-110" y="-15" width="180" height="4" fill="#78350f" opacity="0.3"/>
    <rect x="-110" y="15" width="100" height="4" fill="#78350f" opacity="0.3"/>
  </g>

  <g transform="translate(340 440) rotate(-3)">
    <rect x="-150" y="-200" width="300" height="380" rx="8" fill="url(#page)" stroke="#c2410c" stroke-width="2" opacity="0.92"/>
    <rect x="-110" y="-150" width="180" height="6" fill="#c2410c" opacity="0.45"/>
    <rect x="-110" y="-125" width="200" height="4" fill="#78350f" opacity="0.4"/>
    <rect x="-110" y="-105" width="150" height="4" fill="#78350f" opacity="0.4"/>
    <rect x="-110" y="-85" width="170" height="4" fill="#78350f" opacity="0.4"/>
    <rect x="-110" y="-55" width="190" height="4" fill="#78350f" opacity="0.4"/>
    <rect x="-110" y="-35" width="120" height="4" fill="#78350f" opacity="0.4"/>
    <rect x="-110" y="-15" width="160" height="4" fill="#78350f" opacity="0.4"/>
    <rect x="-110" y="15" width="180" height="4" fill="#78350f" opacity="0.4"/>
    <rect x="-110" y="35" width="130" height="4" fill="#78350f" opacity="0.4"/>
  </g>

  <!-- transformation arrow -->
  <g opacity="0.7">
    <path d="M 620 450 L 780 450" stroke="#9a3309" stroke-width="6" stroke-linecap="round"/>
    <path d="M 760 425 L 790 450 L 760 475" stroke="#9a3309" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- right side: HERO — live database/table view -->
  <g transform="translate(1080 450)">
    <!-- card shadow -->
    <rect x="-238" y="-218" width="476" height="436" rx="14" fill="#78350f" opacity="0.18"/>
    <!-- main card -->
    <rect x="-245" y="-225" width="476" height="436" rx="14" fill="url(#hero)"/>

    <!-- header bar (teal accent) -->
    <rect x="-245" y="-225" width="476" height="56" rx="14" fill="url(#grid)"/>
    <rect x="-245" y="-185" width="476" height="16" fill="url(#grid)"/>

    <!-- column header dots -->
    <circle cx="-205" cy="-197" r="6" fill="#fbbf24" opacity="0.9"/>
    <circle cx="-180" cy="-197" r="6" fill="#fef3ec" opacity="0.7"/>
    <circle cx="-155" cy="-197" r="6" fill="#fef3ec" opacity="0.5"/>

    <!-- table rows -->
    <g fill="#fef3ec">
      <!-- column dividers -->
      <line x1="-100" y1="-169" x2="-100" y2="200" stroke="#fef3ec" stroke-width="1.5" opacity="0.35"/>
      <line x1="40" y1="-169" x2="40" y2="200" stroke="#fef3ec" stroke-width="1.5" opacity="0.35"/>
      <line x1="150" y1="-169" x2="150" y2="200" stroke="#fef3ec" stroke-width="1.5" opacity="0.35"/>

      <!-- row separators and cell content -->
      <g opacity="0.85">
        <!-- row 1 -->
        <rect x="-225" y="-150" width="100" height="8" rx="2"/>
        <rect x="-85" y="-150" width="110" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="-150" width="80" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="-146" r="6" fill="#fbbf24"/>
        <line x1="-235" y1="-125" x2="221" y2="-125" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>

        <!-- row 2 -->
        <rect x="-225" y="-105" width="80" height="8" rx="2"/>
        <rect x="-85" y="-105" width="130" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="-105" width="60" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="-101" r="6" fill="#fef3ec"/>
        <line x1="-235" y1="-80" x2="221" y2="-80" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>

        <!-- row 3 -->
        <rect x="-225" y="-60" width="110" height="8" rx="2"/>
        <rect x="-85" y="-60" width="100" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="-60" width="90" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="-56" r="6" fill="#fbbf24"/>
        <line x1="-235" y1="-35" x2="221" y2="-35" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>

        <!-- row 4 -->
        <rect x="-225" y="-15" width="90" height="8" rx="2"/>
        <rect x="-85" y="-15" width="120" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="-15" width="70" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="-11" r="6" fill="#fef3ec"/>
        <line x1="-235" y1="10" x2="221" y2="10" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>

        <!-- row 5 -->
        <rect x="-225" y="30" width="100" height="8" rx="2"/>
        <rect x="-85" y="30" width="90" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="30" width="85" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="34" r="6" fill="#fbbf24"/>
        <line x1="-235" y1="55" x2="221" y2="55" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>

        <!-- row 6 -->
        <rect x="-225" y="75" width="85" height="8" rx="2"/>
        <rect x="-85" y="75" width="105" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="75" width="75" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="79" r="6" fill="#fef3ec"/>
        <line x1="-235" y1="100" x2="221" y2="100" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>

        <!-- row 7 -->
        <rect x="-225" y="120" width="95" height="8" rx="2"/>
        <rect x="-85" y="120" width="115" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="120" width="65" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="124" r="6" fill="#fbbf24"/>
        <line x1="-235" y1="145" x2="221" y2="145" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>

        <!-- row 8 -->
        <rect x="-225" y="165" width="100" height="8" rx="2"/>
        <rect x="-85" y="165" width="95" height="8" rx="2" opacity="0.7"/>
        <rect x="55" y="165" width="80" height="8" rx="2" opacity="0.7"/>
        <circle cx="190" cy="169" r="6" fill="#fef3ec"/>
      </g>
    </g>
  </g>
</svg>
