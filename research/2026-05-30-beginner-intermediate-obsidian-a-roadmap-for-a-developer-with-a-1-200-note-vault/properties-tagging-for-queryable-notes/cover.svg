<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f5e6d3"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- back note (rotated, plain) -->
  <g transform="rotate(-8 800 450)">
    <rect x="480" y="220" width="640" height="460" rx="14" fill="url(#note)" stroke="#9a3309" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="520" y="280" width="380" height="10" rx="5" fill="#78350f" opacity="0.18"/>
    <rect x="520" y="320" width="480" height="10" rx="5" fill="#78350f" opacity="0.14"/>
    <rect x="520" y="360" width="320" height="10" rx="5" fill="#78350f" opacity="0.14"/>
  </g>

  <!-- middle note (slight tilt, has YAML block) -->
  <g transform="rotate(3 800 450)">
    <rect x="520" y="200" width="640" height="500" rx="14" fill="url(#note)" stroke="#9a3309" stroke-opacity="0.35" stroke-width="2"/>
    <!-- YAML frontmatter band -->
    <rect x="540" y="230" width="600" height="140" rx="6" fill="#fbbf24" opacity="0.18"/>
    <!-- key: value rows (key bar + value bar) -->
    <rect x="560" y="252" width="90"  height="10" rx="4" fill="#c2410c" opacity="0.85"/>
    <rect x="664" y="252" width="220" height="10" rx="4" fill="#78350f" opacity="0.35"/>
    <rect x="560" y="280" width="70"  height="10" rx="4" fill="#c2410c" opacity="0.85"/>
    <rect x="644" y="280" width="280" height="10" rx="4" fill="#78350f" opacity="0.35"/>
    <rect x="560" y="308" width="110" height="10" rx="4" fill="#c2410c" opacity="0.85"/>
    <rect x="684" y="308" width="180" height="10" rx="4" fill="#78350f" opacity="0.35"/>
    <rect x="560" y="336" width="60"  height="10" rx="4" fill="#c2410c" opacity="0.85"/>
    <rect x="634" y="336" width="320" height="10" rx="4" fill="#78350f" opacity="0.35"/>
    <!-- body text bars below frontmatter -->
    <rect x="540" y="410" width="500" height="8" rx="4" fill="#78350f" opacity="0.18"/>
    <rect x="540" y="438" width="560" height="8" rx="4" fill="#78350f" opacity="0.18"/>
    <rect x="540" y="466" width="440" height="8" rx="4" fill="#78350f" opacity="0.18"/>
    <rect x="540" y="494" width="520" height="8" rx="4" fill="#78350f" opacity="0.18"/>
    <rect x="540" y="522" width="380" height="8" rx="4" fill="#78350f" opacity="0.18"/>

    <!-- tag pills along the bottom -->
    <rect x="540" y="600" width="120" height="36" rx="18" fill="url(#hero)" opacity="0.92"/>
    <circle cx="562" cy="618" r="5" fill="#fef3ec"/>
    <rect x="680" y="600" width="150" height="36" rx="18" fill="#9a3309" opacity="0.88"/>
    <circle cx="702" cy="618" r="5" fill="#fef3ec"/>
    <rect x="850" y="600" width="100" height="36" rx="18" fill="#c2410c" opacity="0.85"/>
    <circle cx="872" cy="618" r="5" fill="#fef3ec"/>
    <rect x="970" y="600" width="140" height="36" rx="18" fill="#78350f" opacity="0.8"/>
    <circle cx="992" cy="618" r="5" fill="#fef3ec"/>
  </g>

  <!-- query funnel accent: subtle converging lines pulling from the stack toward a focal dot -->
  <g opacity="0.55" fill="none" stroke="#9a3309" stroke-width="2">
    <path d="M1180 360 Q1280 420 1340 480"/>
    <path d="M1180 460 Q1280 470 1340 480"/>
    <path d="M1180 560 Q1280 520 1340 480"/>
  </g>
  <circle cx="1352" cy="480" r="14" fill="url(#hero)"/>
  <circle cx="1352" cy="480" r="22" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.5"/>
</svg>
