<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <!-- water plane -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#water)"/>

  <!-- sun glow hero centre -->
  <circle cx="800" cy="430" r="280" fill="url(#sun)"/>
  <circle cx="800" cy="430" r="120" fill="#fef3ec" opacity="0.95"/>

  <!-- distant hills -->
  <path d="M0 560 Q 340 470 700 540 T 1600 510 V 560 Z" fill="#78350f" opacity="0.45"/>

  <!-- pagoda hero silhouette -->
  <g fill="#5c2a1a" opacity="0.92">
    <rect x="788" y="430" width="24" height="130"/>
    <polygon points="800,150 760,210 840,210"/>
    <polygon points="745,232 855,232 870,262 730,262"/>
    <polygon points="760,232 840,232 840,290 760,290"/>
    <polygon points="730,290 870,290 888,322 712,322"/>
    <polygon points="748,290 852,290 852,352 748,352"/>
    <polygon points="712,352 888,352 908,388 692,388"/>
    <polygon points="736,352 864,352 864,420 736,420"/>
    <polygon points="692,420 908,420 930,460 670,460"/>
  </g>

  <!-- water reflection of pagoda -->
  <g fill="#1a0e0e" opacity="0.18">
    <rect x="736" y="560" width="128" height="40"/>
    <rect x="712" y="600" width="176" height="30"/>
    <rect x="788" y="560" width="24" height="120"/>
  </g>

  <!-- reflected sun shimmer -->
  <ellipse cx="800" cy="640" rx="150" ry="14" fill="#fef3ec" opacity="0.4"/>
  <ellipse cx="800" cy="700" rx="110" ry="9" fill="#fbbf24" opacity="0.3"/>
</svg>
