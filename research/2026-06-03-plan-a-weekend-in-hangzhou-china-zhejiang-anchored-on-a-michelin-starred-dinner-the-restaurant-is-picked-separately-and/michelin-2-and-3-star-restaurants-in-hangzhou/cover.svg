<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1510"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <!-- Warm radial glow at plate centre -->
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.96"/>
      <stop offset="72%" stop-color="#f0eadb" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="plateWell" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#f0eadb" stop-opacity="0.78"/>
    </radialGradient>
    <!-- Sauce drizzle accent -->
    <linearGradient id="sauce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Bamboo stalk gradient -->
    <linearGradient id="bambooL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9a3309" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bambooR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.38"/>
    </linearGradient>
    <!-- Gold accent ring -->
    <radialGradient id="goldRing" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="94%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm radial glow centred on hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3 decoration: bamboo silhouettes — left cluster (partly outside safe zone, atmospheric) -->
  <!-- Left bamboo stalk 1 -->
  <rect x="195" y="60" width="18" height="780" rx="4" fill="url(#bambooL)" opacity="0.7"/>
  <!-- Left bamboo node rings -->
  <rect x="193" y="210" width="22" height="6" rx="3" fill="#d97706" opacity="0.35"/>
  <rect x="193" y="390" width="22" height="6" rx="3" fill="#d97706" opacity="0.35"/>
  <rect x="193" y="570" width="22" height="6" rx="3" fill="#d97706" opacity="0.3"/>

  <!-- Left bamboo stalk 2 -->
  <rect x="240" y="90" width="13" height="720" rx="3" fill="url(#bambooL)" opacity="0.5"/>
  <rect x="238" y="260" width="17" height="5" rx="2" fill="#d97706" opacity="0.28"/>
  <rect x="238" y="470" width="17" height="5" rx="2" fill="#d97706" opacity="0.28"/>
  <rect x="238" y="660" width="17" height="5" rx="2" fill="#d97706" opacity="0.25"/>

  <!-- Left bamboo leaves (simple elongated ellipses) -->
  <ellipse cx="220" cy="130" rx="48" ry="10" fill="#78350f" opacity="0.45" transform="rotate(-32 220 130)"/>
  <ellipse cx="210" cy="165" rx="42" ry="9" fill="#9a3309" opacity="0.38" transform="rotate(28 210 165)"/>
  <ellipse cx="255" cy="185" rx="36" ry="8" fill="#78350f" opacity="0.35" transform="rotate(-18 255 185)"/>

  <!-- Right bamboo stalk 1 -->
  <rect x="1365" y="70" width="16" height="760" rx="4" fill="url(#bambooR)" opacity="0.65"/>
  <rect x="1363" y="230" width="20" height="5" rx="2" fill="#d97706" opacity="0.32"/>
  <rect x="1363" y="420" width="20" height="5" rx="2" fill="#d97706" opacity="0.32"/>
  <rect x="1363" y="600" width="20" height="5" rx="2" fill="#d97706" opacity="0.28"/>

  <!-- Right bamboo stalk 2 -->
  <rect x="1400" y="100" width="12" height="700" rx="3" fill="url(#bambooR)" opacity="0.48"/>
  <rect x="1398" y="275" width="16" height="4" rx="2" fill="#d97706" opacity="0.26"/>
  <rect x="1398" y="490" width="16" height="4" rx="2" fill="#d97706" opacity="0.26"/>

  <!-- Right bamboo leaves -->
  <ellipse cx="1380" cy="140" rx="46" ry="9" fill="#5c2a1a" opacity="0.42" transform="rotate(35 1380 140)"/>
  <ellipse cx="1395" cy="175" rx="38" ry="8" fill="#78350f" opacity="0.36" transform="rotate(-25 1395 175)"/>

  <!-- Layer 2: Hero — fine dining plate centred at (800, 450) -->
  <!-- Plate outer rim (large porcelain circle) -->
  <circle cx="800" cy="450" r="260" fill="url(#plateRim)" opacity="0.93"/>
  <!-- Gold accent ring -->
  <circle cx="800" cy="450" r="260" fill="url(#goldRing)"/>
  <!-- Plate inner well -->
  <circle cx="800" cy="450" r="198" fill="url(#plateWell)" opacity="0.88"/>

  <!-- Sauce element: elegant curved drizzle arcs on plate -->
  <!-- Arc as a thin crescent path suggesting plating artistry -->
  <path d="M 735 400 Q 790 360 855 395 Q 820 375 770 398 Z" fill="url(#sauce)" opacity="0.82"/>
  <!-- Small sauce dot accent -->
  <circle cx="858" cy="412" r="9" fill="#c2410c" opacity="0.78"/>
  <circle cx="872" cy="432" r="5" fill="#9a3309" opacity="0.65"/>
  <circle cx="745" cy="418" r="6" fill="#d97706" opacity="0.7"/>

  <!-- Central garnish form: a small elegant oval (the hero food element) -->
  <ellipse cx="800" cy="447" rx="52" ry="28" fill="#78350f" opacity="0.72"/>
  <ellipse cx="800" cy="443" rx="40" ry="20" fill="#9a3309" opacity="0.85"/>
  <!-- Micro gloss highlight on garnish -->
  <ellipse cx="790" cy="438" rx="14" ry="7" fill="#fbbf24" opacity="0.28"/>

  <!-- Chopstick rest: two elegant parallel lines right of plate (fine dining Zhejiang touch) -->
  <rect x="1085" y="436" width="115" height="5" rx="2.5" fill="#d97706" opacity="0.55"/>
  <rect x="1085" y="459" width="115" height="5" rx="2.5" fill="#c2410c" opacity="0.45"/>

</svg>
