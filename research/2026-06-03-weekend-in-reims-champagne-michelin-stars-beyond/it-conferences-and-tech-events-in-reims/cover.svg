<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slide1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Glow behind hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — stacked angled presentation slides centered at (800,450) -->
  <!-- Back slide (deepest) -->
  <rect x="300" y="210" width="820" height="520" rx="8"
        fill="url(#slide1)" opacity="0.55"
        transform="rotate(-6 800 450)"/>

  <!-- Middle slide -->
  <rect x="330" y="200" width="820" height="520" rx="8"
        fill="url(#slide2)" opacity="0.72"
        transform="rotate(-2 800 450)"/>

  <!-- Hero slide (front) -->
  <rect x="360" y="195" width="820" height="510" rx="8"
        fill="url(#slide3)" opacity="0.92"/>

  <!-- Faux content bars on hero slide — suggest agenda/speaker lines -->
  <rect x="420" y="270" width="480" height="18" rx="4" fill="url(#bar)" opacity="0.85"/>
  <rect x="420" y="310" width="360" height="12" rx="3" fill="#fbbf24" opacity="0.45"/>
  <rect x="420" y="338" width="420" height="12" rx="3" fill="#fbbf24" opacity="0.35"/>
  <rect x="420" y="366" width="300" height="12" rx="3" fill="#fbbf24" opacity="0.30"/>

  <!-- Divider rule on hero slide -->
  <rect x="420" y="405" width="700" height="3" rx="1" fill="#fbbf24" opacity="0.50"/>

  <!-- Lower content bars -->
  <rect x="420" y="430" width="640" height="14" rx="3" fill="#fef3ec" opacity="0.25"/>
  <rect x="420" y="460" width="540" height="14" rx="3" fill="#fef3ec" opacity="0.20"/>
  <rect x="420" y="490" width="580" height="14" rx="3" fill="#fef3ec" opacity="0.18"/>
  <rect x="420" y="520" width="460" height="14" rx="3" fill="#fef3ec" opacity="0.15"/>

  <!-- Corner accent dot (LED feel) on hero slide -->
  <circle cx="1100" cy="245" r="10" fill="#fbbf24" opacity="0.90"/>
  <circle cx="1100" cy="245" r="20" fill="#fbbf24" opacity="0.20"/>

  <!-- Layer 3: Decorative edge elements (may crop on card/detail) -->
  <!-- Bottom-left corner glow arc suggestion -->
  <circle cx="120" cy="820" r="180" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.18"/>
  <circle cx="120" cy="820" r="230" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.10"/>

  <!-- Top-right faint arc -->
  <circle cx="1520" cy="80" r="200" fill="none" stroke="#d97706" stroke-width="2" opacity="0.14"/>
</svg>
