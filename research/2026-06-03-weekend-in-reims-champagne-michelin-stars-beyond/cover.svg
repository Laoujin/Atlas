<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Flute bowl gradient -->
    <linearGradient id="flute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Champagne liquid fill -->
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Arch stroke gradient -->
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Stem gradient -->
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle warm radial glow centred on hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3: Edge atmosphere — rose haze at top corners (decorative, outside safe zone) -->
  <ellipse cx="200" cy="60" rx="280" ry="120" fill="#be185d" opacity="0.07"/>
  <ellipse cx="1400" cy="60" rx="280" ry="120" fill="#be185d" opacity="0.07"/>

  <!-- Layer 2: Hero element — gothic cathedral arch silhouette (background of hero) -->
  <!-- Two gothic pointed arches suggesting Reims Cathedral, centered, inside safe zone -->
  <path d="M630,780 L630,440 Q630,300 800,240 Q970,300 970,440 L970,780 Z"
        fill="none" stroke="url(#arch)" stroke-width="3" opacity="0.55"/>
  <!-- Inner arch (smaller, tighter) -->
  <path d="M680,780 L680,460 Q680,360 800,320 Q920,360 920,460 L920,780 Z"
        fill="none" stroke="#be185d" stroke-width="1.5" opacity="0.3"/>

  <!-- Champagne flute: bowl (tapered trapezoid pointing down to stem) -->
  <!-- Bowl: wider at top (~200px wide), narrower at bottom (~40px), height ~320px -->
  <!-- Top of bowl at y=200, bottom of bowl at y=520 — all within safe zone -->
  <path d="M700,200 L900,200 L840,520 L760,520 Z"
        fill="url(#flute)" opacity="0.82"/>

  <!-- Champagne liquid level inside bowl (fills lower ~65% of bowl) -->
  <path d="M718,330 L882,330 L840,520 L760,520 Z"
        fill="url(#liquid)" opacity="0.75"/>

  <!-- Meniscus line (surface of champagne) -->
  <line x1="718" y1="330" x2="882" y2="330"
        stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>

  <!-- Flute stem: thin vertical rectangle from bowl base to base disc -->
  <rect x="793" y="520" width="14" height="160"
        fill="url(#stem)" opacity="0.8"/>

  <!-- Flute base disc -->
  <ellipse cx="800" cy="682" rx="68" ry="10"
           fill="#c2410c" opacity="0.7"/>
  <ellipse cx="800" cy="682" rx="68" ry="10"
           fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>

  <!-- Bubbles rising inside the flute (small circles, motivated decoration) -->
  <circle cx="790" cy="490" r="4" fill="#fbbf24" opacity="0.55"/>
  <circle cx="808" cy="455" r="3" fill="#fbbf24" opacity="0.45"/>
  <circle cx="795" cy="415" r="5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="812" cy="380" r="3" fill="#fbbf24" opacity="0.4"/>
  <circle cx="785" cy="352" r="4" fill="#fbbf24" opacity="0.45"/>

  <!-- Bubbles escaping above the flute (just above liquid, still within safe zone) -->
  <circle cx="780" cy="310" r="5" fill="#fbbf24" opacity="0.3"/>
  <circle cx="815" cy="290" r="4" fill="#d97706" opacity="0.28"/>
  <circle cx="795" cy="265" r="6" fill="#fbbf24" opacity="0.22"/>
  <circle cx="762" cy="245" r="3" fill="#d97706" opacity="0.2"/>
  <circle cx="830" cy="230" r="4" fill="#fbbf24" opacity="0.18"/>

  <!-- Rose accent: thin arc suggesting the rose window of the cathedral -->
  <!-- Centered at (800, 450), radius ~260, arc across upper portion -->
  <circle cx="800" cy="450" r="260"
          fill="none" stroke="#be185d" stroke-width="2" opacity="0.18"
          stroke-dasharray="none"/>
  <circle cx="800" cy="450" r="200"
          fill="none" stroke="#c2410c" stroke-width="1" opacity="0.12"/>

  <!-- Bottom edge warm band (full-bleed, decorative) -->
  <rect x="0" y="820" width="1600" height="80" fill="#c2410c" opacity="0.08"/>
</svg>
