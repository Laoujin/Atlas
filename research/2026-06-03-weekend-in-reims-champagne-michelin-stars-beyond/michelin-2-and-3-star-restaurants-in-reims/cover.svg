<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background radial: warm hearth glow from center -->
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="62%" gradientUnits="userSpaceOnUse" fx="800" fy="468">
      <stop offset="0%"   stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#2d0f0f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="plateLeft" cx="44%" cy="44%" r="50%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="plateRight" cx="56%" cy="44%" r="50%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Inner plate well -->
    <radialGradient id="wellLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fef3ec" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.20"/>
    </radialGradient>
    <radialGradient id="wellRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fef3ec" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.20"/>
    </radialGradient>

    <!-- Flute gradient -->
    <linearGradient id="fluteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#fef3ec" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.50"/>
    </linearGradient>

    <!-- Bubble glow inside flute -->
    <radialGradient id="bubbleGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.00"/>
    </radialGradient>

    <!-- Table surface gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3b1208" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Halo behind flute -->
    <radialGradient id="fluteHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.00"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Subtle table surface band at bottom -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#tableGrad)" opacity="0.85"/>

  <!-- Soft horizon divider -->
  <rect x="0" y="618" width="1600" height="3" fill="#c2410c" opacity="0.25"/>

  <!-- Layer 2: Hero element — two plates + champagne flute, centered ~(800, 450) -->

  <!-- Left plate: outer rim -->
  <ellipse cx="620" cy="570" rx="210" ry="38" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.45"/>
  <ellipse cx="620" cy="570" rx="210" ry="38" fill="url(#plateLeft)" opacity="0.70"/>
  <!-- Left plate: disc body (foreshortened) -->
  <ellipse cx="620" cy="530" rx="196" ry="130" fill="#2d1208" opacity="0.80"/>
  <ellipse cx="620" cy="530" rx="196" ry="130" fill="url(#wellLeft)" opacity="1"/>
  <!-- Left plate: inner well rim highlight -->
  <ellipse cx="620" cy="530" rx="140" ry="92" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.22"/>
  <!-- Left plate: sauce accent dot -->
  <ellipse cx="598" cy="524" rx="22" ry="14" fill="#c2410c" opacity="0.60"/>
  <ellipse cx="598" cy="524" rx="10" ry="6"  fill="#fbbf24" opacity="0.35"/>

  <!-- Right plate: outer rim -->
  <ellipse cx="980" cy="570" rx="210" ry="38" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.45"/>
  <ellipse cx="980" cy="570" rx="210" ry="38" fill="url(#plateRight)" opacity="0.70"/>
  <!-- Right plate: disc body -->
  <ellipse cx="980" cy="530" rx="196" ry="130" fill="#2d1208" opacity="0.80"/>
  <ellipse cx="980" cy="530" rx="196" ry="130" fill="url(#wellRight)" opacity="1"/>
  <!-- Right plate: inner well rim highlight -->
  <ellipse cx="980" cy="530" rx="140" ry="92" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.22"/>
  <!-- Right plate: sauce accent dot -->
  <ellipse cx="1004" cy="522" rx="22" ry="14" fill="#9a3309" opacity="0.65"/>
  <ellipse cx="1004" cy="522" rx="10" ry="6"  fill="#fbbf24" opacity="0.30"/>

  <!-- Champagne flute — centered at x=800, base at y=620, top at y=165 -->
  <!-- Halo behind flute -->
  <ellipse cx="800" cy="390" rx="90" ry="230" fill="url(#fluteHalo)" opacity="1"/>

  <!-- Flute bowl (tapered trapezoid shape) -->
  <polygon points="764,340 836,340 818,480 782,480" fill="url(#fluteGrad)" opacity="0.82"/>
  <!-- Flute bowl interior glow -->
  <polygon points="770,345 830,345 814,475 786,475" fill="url(#bubbleGlow)" opacity="0.70"/>
  <!-- Flute bowl top rim ellipse -->
  <ellipse cx="800" cy="340" rx="36" ry="7" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.65"/>
  <!-- Flute bowl bottom ellipse (join to stem) -->
  <ellipse cx="800" cy="480" rx="18" ry="4" fill="#fbbf24" opacity="0.40"/>

  <!-- Rising bubbles inside flute -->
  <circle cx="793" cy="460" r="3" fill="#fbbf24" opacity="0.55"/>
  <circle cx="808" cy="430" r="2.5" fill="#fbbf24" opacity="0.45"/>
  <circle cx="797" cy="400" r="2" fill="#fbbf24" opacity="0.40"/>
  <circle cx="805" cy="370" r="1.8" fill="#fbbf24" opacity="0.35"/>

  <!-- Flute stem -->
  <rect x="796" y="480" width="8" height="95" fill="#fbbf24" opacity="0.52" rx="2"/>
  <!-- Flute base foot -->
  <ellipse cx="800" cy="578" rx="30" ry="7" fill="#d97706" opacity="0.55"/>
  <ellipse cx="800" cy="578" rx="30" ry="7" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.35"/>

  <!-- Flute highlight streak -->
  <line x1="778" y1="350" x2="772" y2="468" stroke="#fef3ec" stroke-width="2" opacity="0.30" stroke-linecap="round"/>

  <!-- Rim glow accent: top of flute opening -->
  <ellipse cx="800" cy="165" rx="42" ry="10" fill="#d97706" opacity="0.18"/>

  <!-- Layer 3: Edge decoration (outside safe zone — atmospheric) -->
  <!-- Corner ember wisps, very low opacity -->
  <ellipse cx="0"    cy="0"   rx="280" ry="200" fill="#c2410c" opacity="0.07"/>
  <ellipse cx="1600" cy="900" rx="280" ry="200" fill="#78350f" opacity="0.09"/>
  <!-- Subtle top vignette -->
  <rect x="0" y="0" width="1600" height="90" fill="#1a0e0e" opacity="0.45"/>
  <!-- Subtle bottom vignette -->
  <rect x="0" y="810" width="1600" height="90" fill="#1a0e0e" opacity="0.45"/>
</svg>
