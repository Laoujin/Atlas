<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#c2410c" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outsideDot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Faint rolling hills (decoration, partly outside safe zone) -->
  <path d="M0,640 Q200,580 420,620 T820,610 T1240,625 T1600,600 L1600,900 L0,900 Z" fill="url(#hills)" opacity="0.45"/>
  <path d="M0,720 Q260,670 540,705 T1060,700 T1600,690 L1600,900 L0,900 Z" fill="#9a3309" opacity="0.18"/>

  <!-- Faint network/circuit lines across countryside -->
  <g stroke="#78350f" stroke-width="1" opacity="0.18" fill="none">
    <path d="M180,500 L420,520 L640,490 L880,510 L1120,495 L1380,515"/>
    <path d="M220,560 L460,580 L700,555 L960,575 L1200,560 L1440,580"/>
    <circle cx="420" cy="520" r="3" fill="#78350f"/>
    <circle cx="880" cy="510" r="3" fill="#78350f"/>
    <circle cx="640" cy="490" r="3" fill="#78350f"/>
    <circle cx="1120" cy="495" r="3" fill="#78350f"/>
    <circle cx="700" cy="555" r="3" fill="#78350f"/>
    <circle cx="960" cy="575" r="3" fill="#78350f"/>
  </g>

  <!-- HERO: 30 km radius circle centered around (800, 450) -->
  <!-- Soft glow inside the radius -->
  <circle cx="800" cy="450" r="320" fill="url(#centerGlow)"/>

  <!-- The radius ring itself -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.85"/>
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.35"/>

  <!-- Center pin: Les Prés d'Eugénie -->
  <g transform="translate(800,450)">
    <circle r="22" fill="#c2410c" opacity="0.25"/>
    <circle r="11" fill="#c2410c"/>
    <circle r="4" fill="#fbbf24"/>
  </g>

  <!-- Faint dot inside radius: Mont-de-Marsan (~26 km, NE) -->
  <g transform="translate(1050,300)">
    <circle r="10" fill="#9a3309" opacity="0.35"/>
    <circle r="4.5" fill="#9a3309" opacity="0.7"/>
  </g>

  <!-- Connector line from center to Mont-de-Marsan -->
  <line x1="800" y1="450" x2="1050" y2="300" stroke="#9a3309" stroke-width="1" stroke-dasharray="3 5" opacity="0.45"/>

  <!-- Bright dot OUTSIDE the radius: Pau Béarn French Tech (~60 km, SE) -->
  <g transform="translate(1270,620)">
    <circle r="34" fill="url(#outsideDot)" opacity="0.55"/>
    <circle r="14" fill="#6d28d9" opacity="0.85"/>
    <circle r="6" fill="#fbbf24"/>
  </g>

  <!-- Connector line from center toward Pau, dashed and trailing off -->
  <line x1="800" y1="450" x2="1270" y2="620" stroke="#6d28d9" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Compass tick marks on the ring (subtle) -->
  <g stroke="#c2410c" stroke-width="2" opacity="0.55">
    <line x1="800" y1="125" x2="800" y2="138"/>
    <line x1="800" y1="762" x2="800" y2="775"/>
    <line x1="475" y1="450" x2="488" y2="450"/>
    <line x1="1112" y1="450" x2="1125" y2="450"/>
  </g>
</svg>
