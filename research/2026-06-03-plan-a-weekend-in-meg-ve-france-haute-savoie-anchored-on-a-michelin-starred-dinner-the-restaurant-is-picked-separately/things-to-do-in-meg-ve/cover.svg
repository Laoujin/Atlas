<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbe3cf"/>
      <stop offset="1" stop-color="#f0dcc4"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow behind the massif -->
  <circle cx="1080" cy="300" r="260" fill="url(#sun)" opacity="0.7"/>

  <!-- Mont Blanc massif silhouette, full-bleed backdrop -->
  <path d="M0 560 L240 430 L420 500 L640 360 L860 470 L1040 330 L1260 460 L1460 380 L1600 470 L1600 900 L0 900 Z"
        fill="url(#peak)" opacity="0.85"/>
  <path d="M640 360 L700 398 L660 412 L740 460 L580 460 Z" fill="#faf8f2" opacity="0.8"/>
  <path d="M1040 330 L1100 366 L1062 380 L1140 430 L980 430 Z" fill="#faf8f2" opacity="0.8"/>

  <!-- foreground meadow ridge -->
  <path d="M0 700 L380 650 L760 690 L1180 645 L1600 695 L1600 900 L0 900 Z"
        fill="#78350f" opacity="0.9"/>

  <!-- hero: bulbous church bell tower (centred ~800,450) -->
  <g>
    <!-- tower body -->
    <rect x="745" y="430" width="110" height="270" rx="6" fill="url(#tower)"/>
    <!-- bulbous onion dome -->
    <path d="M745 430 C745 360 760 320 800 312 C840 320 855 360 855 430 Z" fill="url(#tower)"/>
    <path d="M770 430 C770 372 782 342 800 336 C818 342 830 372 830 430 Z" fill="#d97706" opacity="0.55"/>
    <!-- spire finial -->
    <rect x="794" y="278" width="12" height="40" rx="4" fill="#9a3309"/>
    <circle cx="800" cy="276" r="11" fill="#fbbf24"/>
    <!-- belfry openings -->
    <rect x="765" y="470" width="22" height="46" rx="11" fill="#1a0e0e" opacity="0.55"/>
    <rect x="813" y="470" width="22" height="46" rx="11" fill="#1a0e0e" opacity="0.55"/>
  </g>

  <!-- flanking village roofs (decoration, within safe zone) -->
  <path d="M560 700 L640 600 L720 700 Z" fill="#9a3309" opacity="0.85"/>
  <path d="M880 700 L960 590 L1040 700 Z" fill="#c2410c" opacity="0.85"/>
  <path d="M1010 700 L1075 620 L1140 700 Z" fill="#9a3309" opacity="0.8"/>
  <path d="M470 700 L530 630 L590 700 Z" fill="#c2410c" opacity="0.78"/>
</svg>
