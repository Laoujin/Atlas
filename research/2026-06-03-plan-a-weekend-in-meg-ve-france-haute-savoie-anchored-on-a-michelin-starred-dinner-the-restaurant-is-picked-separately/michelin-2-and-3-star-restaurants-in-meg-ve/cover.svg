<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120808"/>
      <stop offset="60%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1008"/>
    </linearGradient>

    <!-- Central warm candlelight glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate rim gradient — main plate -->
    <radialGradient id="plate-main" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.92"/>
      <stop offset="68%" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#d4c9b4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a89070" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Plate rim gradient — second plate -->
    <radialGradient id="plate-second" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.82"/>
      <stop offset="68%" stop-color="#e8dcc8" stop-opacity="0.72"/>
      <stop offset="85%" stop-color="#c4b49a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a7860" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Inner plate well gradient -->
    <radialGradient id="well-main" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8dcc8" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Rose accent glow -->
    <radialGradient id="rose-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Wine in glass gradient -->
    <linearGradient id="wine-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Ambient mountain haze at top -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </linearGradient>

    <!-- Table surface gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a0a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle mountain haze top edge -->
  <rect width="1600" height="320" fill="url(#haze)"/>

  <!-- Central ambient glow -->
  <ellipse cx="800" cy="450" rx="680" ry="480" fill="url(#glow)"/>

  <!-- Rose glow — off-center to the right (wine glass side) -->
  <ellipse cx="1050" cy="400" rx="300" ry="260" fill="url(#rose-glow)"/>

  <!-- Table surface — lower third -->
  <rect x="0" y="670" width="1600" height="230" fill="url(#table)"/>
  <!-- Table edge highlight line -->
  <rect x="0" y="669" width="1600" height="2" fill="#c2410c" opacity="0.4"/>

  <!-- Layer 2: Hero element — two plates + wine glass, centered ~800,430 -->

  <!-- Second plate (background, slightly left and lower) -->
  <ellipse cx="700" cy="490" rx="210" ry="210" fill="url(#plate-second)" opacity="0.82"/>
  <!-- Second plate inner well -->
  <ellipse cx="700" cy="490" rx="155" ry="155" fill="url(#well-main)" opacity="0.45"/>
  <!-- Second plate rim accent -->
  <ellipse cx="700" cy="490" rx="210" ry="210" fill="none" stroke="#d4c9b4" stroke-width="2.5" opacity="0.4"/>
  <!-- Second plate inner rim line -->
  <ellipse cx="700" cy="490" rx="172" ry="172" fill="none" stroke="#c2410c" stroke-width="1.2" opacity="0.35"/>

  <!-- Main plate (foreground, centered right) -->
  <ellipse cx="850" cy="470" rx="240" ry="240" fill="url(#plate-main)" opacity="0.92"/>
  <!-- Main plate inner well -->
  <ellipse cx="850" cy="470" rx="178" ry="178" fill="url(#well-main)" opacity="0.55"/>
  <!-- Main plate rim outer line -->
  <ellipse cx="850" cy="470" rx="240" ry="240" fill="none" stroke="#e8dcc8" stroke-width="3" opacity="0.55"/>
  <!-- Main plate inner rim accent — rust -->
  <ellipse cx="850" cy="470" rx="196" ry="196" fill="none" stroke="#c2410c" stroke-width="1.8" opacity="0.5"/>
  <!-- Main plate decorative gold ring -->
  <ellipse cx="850" cy="470" rx="208" ry="208" fill="none" stroke="#d97706" stroke-width="1" opacity="0.4"/>

  <!-- Sauce/food accent on main plate — abstract arc smear -->
  <path d="M 790 430 Q 850 390 910 440" fill="none" stroke="#9a3309" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M 800 465 Q 855 445 900 468" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Wine glass — right of plates, tall elegant silhouette -->
  <!-- Bowl of glass -->
  <path d="M 1090 310 Q 1050 400 1065 465 L 1135 465 Q 1150 400 1110 310 Z"
        fill="url(#wine-fill)" opacity="0.82"/>
  <!-- Wine glass bowl outline -->
  <path d="M 1090 310 Q 1050 400 1065 465 L 1135 465 Q 1150 400 1110 310 Z"
        fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <!-- Wine surface shimmer inside bowl -->
  <ellipse cx="1100" cy="390" rx="32" ry="8" fill="#fbbf24" opacity="0.18"/>
  <!-- Stem -->
  <rect x="1097" y="465" width="6" height="95" fill="#e8dcc8" opacity="0.55"/>
  <!-- Base -->
  <ellipse cx="1100" cy="562" rx="40" ry="7" fill="#e8dcc8" opacity="0.45"/>
  <!-- Base highlight -->
  <ellipse cx="1100" cy="560" rx="40" ry="5" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <!-- Glass highlight — specular -->
  <path d="M 1095 325 Q 1086 370 1088 415" fill="none" stroke="#faf8f2" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Layer 3: Atmospheric decoration outside safe zone / edges -->

  <!-- Bottom-left corner warm ember glow -->
  <ellipse cx="60" cy="870" rx="200" ry="140" fill="#c2410c" opacity="0.12"/>

  <!-- Top-right subtle warm wash -->
  <ellipse cx="1560" cy="80" rx="220" ry="160" fill="#d97706" opacity="0.1"/>

  <!-- Very subtle horizontal table reflection lines -->
  <rect x="0" y="685" width="1600" height="1" fill="#d97706" opacity="0.15"/>
  <rect x="0" y="700" width="1600" height="1" fill="#c2410c" opacity="0.1"/>
</svg>
