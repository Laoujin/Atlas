<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Mountain left gradient -->
    <linearGradient id="mtnLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Mountain right gradient -->
    <linearGradient id="mtnRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Snow cap glow -->
    <radialGradient id="snowGlow" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Foreground ground -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Layer 2: Hero — mountain forms, centered safe zone -->

  <!-- Background mountain (right, larger, darker) -->
  <polygon
    points="800,140 1260,720 340,720"
    fill="url(#mtnRight)"
    opacity="0.72"
  />

  <!-- Foreground mountain (left, taller, rust hero) -->
  <polygon
    points="580,170 980,720 180,720"
    fill="url(#mtnLeft)"
    opacity="0.88"
  />

  <!-- Snow cap on foreground mountain -->
  <polygon
    points="580,170 660,310 500,310"
    fill="#fef3ec"
    opacity="0.90"
  />
  <!-- Snow cap glow radial overlay -->
  <ellipse cx="580" cy="230" rx="130" ry="90" fill="url(#snowGlow)" opacity="0.75"/>

  <!-- Snow cap on background mountain (peak at 800,140) -->
  <polygon
    points="800,140 870,270 730,270"
    fill="#fef3ec"
    opacity="0.70"
  />

  <!-- Ground plane -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#ground)"/>

  <!-- Layer 2b: Tech network overlay — nodes and edges on hero mountain face -->
  <!-- Edges (low opacity, reads as atmospheric decoration) -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.38" fill="none">
    <line x1="580" y1="380" x2="700" y2="480"/>
    <line x1="700" y1="480" x2="800" y2="420"/>
    <line x1="800" y1="420" x2="860" y2="520"/>
    <line x1="700" y1="480" x2="630" y2="570"/>
    <line x1="800" y1="420" x2="740" y2="570"/>
    <line x1="630" y1="570" x2="740" y2="570"/>
    <line x1="580" y1="380" x2="680" y2="350"/>
    <line x1="680" y1="350" x2="800" y2="420"/>
  </g>

  <!-- Nodes -->
  <g fill="#fbbf24" opacity="0.75">
    <circle cx="580" cy="380" r="9"/>
    <circle cx="700" cy="480" r="11"/>
    <circle cx="800" cy="420" r="14"/>
    <circle cx="860" cy="520" r="8"/>
    <circle cx="630" cy="570" r="8"/>
    <circle cx="740" cy="570" r="8"/>
    <circle cx="680" cy="350" r="7"/>
  </g>
  <!-- Hub node highlight -->
  <circle cx="800" cy="420" r="22" fill="url(#nodeGlow)" opacity="0.65"/>

  <!-- Layer 3: Corner decoration (outside safe zone, atmospheric) -->
  <!-- Subtle arc in bottom-right corner — mountain terrain suggestion -->
  <path d="M1600,900 Q1400,680 1600,600" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.18"/>
  <path d="M0,900 Q200,700 0,580" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.18"/>
</svg>
