<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="0.25" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind the towers -->
  <circle cx="800" cy="560" r="520" fill="url(#sun)"/>

  <!-- water reflection band, kept outside hero safe zone bottom edge -->
  <rect x="0" y="760" width="1600" height="140" fill="#1a0e0e" opacity="0.55"/>
  <rect x="0" y="770" width="1600" height="2" fill="#fbbf24" opacity="0.35"/>

  <!-- left tower: glass cylinder -->
  <ellipse cx="640" cy="200" rx="150" ry="28" fill="#9a3309" opacity="0.85"/>
  <rect x="490" y="200" width="300" height="520" fill="url(#glass)" opacity="0.9"/>
  <ellipse cx="640" cy="720" rx="150" ry="28" fill="#1a0e0e" opacity="0.9"/>

  <!-- left tower: stacked car decks (horizontal bars suggesting parked cars) -->
  <g opacity="0.55" fill="#faf8f2">
    <rect x="510" y="240" width="260" height="3"/>
    <rect x="510" y="285" width="260" height="3"/>
    <rect x="510" y="330" width="260" height="3"/>
    <rect x="510" y="375" width="260" height="3"/>
    <rect x="510" y="420" width="260" height="3"/>
    <rect x="510" y="465" width="260" height="3"/>
    <rect x="510" y="510" width="260" height="3"/>
    <rect x="510" y="555" width="260" height="3"/>
    <rect x="510" y="600" width="260" height="3"/>
    <rect x="510" y="645" width="260" height="3"/>
    <rect x="510" y="690" width="260" height="3"/>
  </g>

  <!-- vertical highlight on left tower -->
  <rect x="540" y="210" width="6" height="500" fill="#fbbf24" opacity="0.35"/>

  <!-- right tower: glass cylinder -->
  <ellipse cx="960" cy="200" rx="150" ry="28" fill="#9a3309" opacity="0.85"/>
  <rect x="810" y="200" width="300" height="520" fill="url(#glass)" opacity="0.9"/>
  <ellipse cx="960" cy="720" rx="150" ry="28" fill="#1a0e0e" opacity="0.9"/>

  <!-- right tower: stacked car decks -->
  <g opacity="0.55" fill="#faf8f2">
    <rect x="830" y="240" width="260" height="3"/>
    <rect x="830" y="285" width="260" height="3"/>
    <rect x="830" y="330" width="260" height="3"/>
    <rect x="830" y="375" width="260" height="3"/>
    <rect x="830" y="420" width="260" height="3"/>
    <rect x="830" y="465" width="260" height="3"/>
    <rect x="830" y="510" width="260" height="3"/>
    <rect x="830" y="555" width="260" height="3"/>
    <rect x="830" y="600" width="260" height="3"/>
    <rect x="830" y="645" width="260" height="3"/>
    <rect x="830" y="690" width="260" height="3"/>
  </g>

  <!-- vertical highlight on right tower -->
  <rect x="860" y="210" width="6" height="500" fill="#fbbf24" opacity="0.35"/>

  <!-- connecting deck shadow at base -->
  <rect x="490" y="720" width="620" height="50" fill="url(#deck)" opacity="0.75"/>
</svg>
