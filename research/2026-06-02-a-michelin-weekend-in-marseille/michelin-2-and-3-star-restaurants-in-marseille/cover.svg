<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust/brown -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3b1a10"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm radial glow at table centre -->
    <radialGradient id="tableGlow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate fill: elegant off-white porcelain -->
    <radialGradient id="plateGrad" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c9b8"/>
    </radialGradient>

    <!-- Rim shadow on plate -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.38"/>
    </radialGradient>

    <!-- Sauce pool on plate — terracotta bisque reduction -->
    <radialGradient id="sauceGrad" cx="48%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.82"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Small accent plate fill -->
    <radialGradient id="plate2Grad" cx="44%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e8ddd0"/>
    </radialGradient>

    <!-- Fish body gradient -->
    <linearGradient id="fishGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Ambient table glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Layer 3: faint corner vignette decoration (outside safe zone) -->
  <ellipse cx="0" cy="0" rx="320" ry="220" fill="#c2410c" fill-opacity="0.07"/>
  <ellipse cx="1600" cy="900" rx="320" ry="220" fill="#c2410c" fill-opacity="0.07"/>

  <!-- Layer 2: HERO — two fine-dining plates + fish accent, centred ~(800,450) -->

  <!-- Left plate (slightly behind, lower-left of centre) -->
  <ellipse cx="680" cy="490" rx="195" ry="195" fill="url(#plate2Grad)" opacity="0.72"/>
  <ellipse cx="680" cy="490" rx="195" ry="195" fill="url(#plateRim)" opacity="0.85"/>
  <!-- Small sauce pool on left plate -->
  <ellipse cx="672" cy="498" rx="88" ry="72" fill="#c2410c" fill-opacity="0.52"/>
  <ellipse cx="660" cy="490" rx="44" ry="36" fill="#d97706" fill-opacity="0.38"/>

  <!-- Main hero plate (front, centred slightly right) -->
  <ellipse cx="860" cy="442" rx="240" ry="240" fill="url(#plateGrad)" opacity="0.95"/>
  <ellipse cx="860" cy="442" rx="240" ry="240" fill="url(#plateRim)" opacity="0.9"/>

  <!-- Sauce pool — bisque/reduction on hero plate -->
  <ellipse cx="852" cy="455" rx="108" ry="88" fill="url(#sauceGrad)" opacity="0.88"/>

  <!-- Fish silhouette on hero plate — stylised Mediterranean sea bass -->
  <!-- Body -->
  <ellipse cx="858" cy="444" rx="72" ry="26" fill="url(#fishGrad)" opacity="0.92"/>
  <!-- Tail fin -->
  <polygon points="930,444 960,424 960,464" fill="#d97706" opacity="0.85"/>
  <!-- Dorsal fin -->
  <polygon points="820,418 840,396 868,418" fill="#fbbf24" opacity="0.7"/>
  <!-- Eye dot -->
  <circle cx="800" cy="441" r="5" fill="#1a0e0e" opacity="0.8"/>
  <circle cx="799" cy="440" r="2" fill="#fbbf24" opacity="0.6"/>
  <!-- Pectoral fin hint -->
  <ellipse cx="836" cy="452" rx="14" ry="7" fill="#fbbf24" opacity="0.45" transform="rotate(-18,836,452)"/>

  <!-- Micro garnish dots on hero plate — saffron / herb -->
  <circle cx="900" cy="418" r="5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="814" cy="412" r="4" fill="#fbbf24" opacity="0.55"/>
  <circle cx="882" cy="398" r="3" fill="#d97706" opacity="0.65"/>

  <!-- Michelin star motifs — three five-point stars, rust/amber, above plates -->
  <!-- Star 1 -->
  <polygon points="800,330 807,352 830,352 813,365 820,388 800,374 780,388 787,365 770,352 793,352"
           fill="#d97706" opacity="0.82"/>
  <!-- Star 2 -->
  <polygon points="840,318 846,337 866,337 850,348 856,368 840,356 824,368 830,348 814,337 834,337"
           fill="#fbbf24" opacity="0.7" transform="scale(0.78) translate(280,110)"/>
  <!-- Star 3 -->
  <polygon points="858,308 863,325 880,325 867,334 872,352 858,342 844,352 849,334 836,325 853,325"
           fill="#c2410c" opacity="0.6" transform="scale(0.72) translate(330,140)"/>

</svg>
