<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm central glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate left gradient -->
    <radialGradient id="plateL" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c4a8"/>
    </radialGradient>
    <!-- Plate right gradient -->
    <radialGradient id="plateR" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#ede3d0"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="rimL" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="transparent"/>
      <stop offset="82%" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="88%" stop-color="#9a3309" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="rimR" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="transparent"/>
      <stop offset="82%" stop-color="#78350f" stop-opacity="0.4"/>
      <stop offset="88%" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.25"/>
    </radialGradient>
    <!-- Wine glass rust accent -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Central warm glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two plate forms + wine glass -->

  <!-- Plate shadow left -->
  <ellipse cx="685" cy="468" rx="205" ry="18" fill="#000" opacity="0.35"/>
  <!-- Plate left (back) -->
  <circle cx="680" cy="450" r="200" fill="url(#plateL)" opacity="0.92"/>
  <circle cx="680" cy="450" r="200" fill="url(#rimL)"/>
  <!-- Inner well left -->
  <circle cx="680" cy="450" r="130" fill="#faf8f2" opacity="0.6"/>
  <!-- Food accent left: small rust dot composition (herb/sauce) -->
  <circle cx="665" cy="440" r="22" fill="#c2410c" opacity="0.75"/>
  <circle cx="695" cy="455" r="14" fill="#9a3309" opacity="0.65"/>
  <circle cx="655" cy="462" r="9"  fill="#d97706" opacity="0.8"/>

  <!-- Plate shadow right -->
  <ellipse cx="925" cy="468" rx="185" ry="16" fill="#000" opacity="0.3"/>
  <!-- Plate right (front, slightly overlapping) -->
  <circle cx="920" cy="448" r="182" fill="url(#plateR)" opacity="0.93"/>
  <circle cx="920" cy="448" r="182" fill="url(#rimR)"/>
  <!-- Inner well right -->
  <circle cx="920" cy="448" r="118" fill="#fef3ec" opacity="0.58"/>
  <!-- Food accent right: rust/amber dots -->
  <circle cx="930" cy="438" r="18" fill="#78350f" opacity="0.72"/>
  <circle cx="908" cy="455" r="12" fill="#c2410c" opacity="0.68"/>
  <circle cx="940" cy="458" r="8"  fill="#fbbf24" opacity="0.8"/>

  <!-- Wine glass silhouette centered between plates, slightly back -->
  <!-- Bowl of glass -->
  <path d="M790,220 Q760,310 755,370 Q750,410 800,415 Q850,410 845,370 Q840,310 810,220 Z"
        fill="url(#glassGrad)" opacity="0.78"/>
  <!-- Stem -->
  <rect x="796" y="415" width="8" height="110" fill="#d97706" opacity="0.7"/>
  <!-- Base -->
  <ellipse cx="800" cy="527" rx="38" ry="7" fill="#c2410c" opacity="0.65"/>
  <!-- Wine liquid inside bowl -->
  <path d="M768,360 Q762,400 800,406 Q838,400 832,360 Z"
        fill="#9a3309" opacity="0.55"/>

  <!-- Layer 3: Decorative edge accents (outside safe zone, atmospheric) -->
  <!-- Top-left rust wash -->
  <ellipse cx="0" cy="0" rx="320" ry="220" fill="#c2410c" opacity="0.08"/>
  <!-- Bottom-right warm wash -->
  <ellipse cx="1600" cy="900" rx="380" ry="260" fill="#d97706" opacity="0.07"/>
  <!-- Subtle top vignette -->
  <rect x="0" y="0" width="1600" height="90" fill="#1a0e0e" opacity="0.4"/>
  <!-- Subtle bottom vignette -->
  <rect x="0" y="810" width="1600" height="90" fill="#1a0e0e" opacity="0.4"/>
</svg>
