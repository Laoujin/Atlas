<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1409"/>
      <stop offset="100%" stop-color="#0f1a1f"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="satFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="satGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle atmospheric ring far behind hub -->
  <circle cx="800" cy="450" r="420" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.12"/>
  <circle cx="800" cy="450" r="290" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.15"/>

  <!-- Hub ambient glow -->
  <circle cx="800" cy="450" r="230" fill="url(#hubGlow)" opacity="0.85"/>

  <!-- Layer 2: hero element — node graph centered at (800,450) -->

  <!-- Satellite positions (5 nodes arranged around hub):
       N:  (800, 210)
       NE: (1060, 295)
       SE: (1010, 620)
       SW: (545, 620)
       NW: (540, 295)
  -->

  <!-- Edge lines: hub to each satellite -->
  <line x1="800" y1="450" x2="800"  y2="210" stroke="#0e7490" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="1060" y2="295" stroke="#0e7490" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="1010" y2="620" stroke="#0e7490" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="545"  y2="620" stroke="#0e7490" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="540"  y2="295" stroke="#0e7490" stroke-width="2.5" opacity="0.55"/>

  <!-- Faint cross-edges (peripheral connections) — low weight -->
  <line x1="800"  y1="210" x2="1060" y2="295" stroke="#0e7490" stroke-width="1.2" opacity="0.25"/>
  <line x1="545"  y1="620" x2="1010" y2="620" stroke="#0e7490" stroke-width="1.2" opacity="0.25"/>

  <!-- Satellite node glows -->
  <circle cx="800"  cy="210" r="60" fill="url(#satGlow)"/>
  <circle cx="1060" cy="295" r="60" fill="url(#satGlow)"/>
  <circle cx="1010" cy="620" r="60" fill="url(#satGlow)"/>
  <circle cx="545"  cy="620" r="60" fill="url(#satGlow)"/>
  <circle cx="540"  cy="295" r="60" fill="url(#satGlow)"/>

  <!-- Satellite nodes -->
  <circle cx="800"  cy="210" r="28" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="1060" cy="295" r="28" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="1010" cy="620" r="28" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="545"  cy="620" r="28" fill="url(#satFill)" opacity="0.88"/>
  <circle cx="540"  cy="295" r="28" fill="url(#satFill)" opacity="0.88"/>

  <!-- Central hub node (hero) -->
  <circle cx="800" cy="450" r="90" fill="url(#hubFill)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="90" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>

  <!-- Layer 3: corner decoration (outside safe zone) -->
  <circle cx="0"    cy="0"   r="180" fill="#9a3309" opacity="0.07"/>
  <circle cx="1600" cy="900" r="200" fill="#0e7490" opacity="0.07"/>
</svg>
