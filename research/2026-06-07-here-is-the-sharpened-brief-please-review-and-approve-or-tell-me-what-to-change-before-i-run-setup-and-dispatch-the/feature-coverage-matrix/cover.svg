<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <linearGradient id="cellFull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="cellPartial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind matrix -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#glow)"/>

  <!-- Layer 2: Hero — coverage matrix grid, centered at (800,450), safe zone x:125–1475 y:90–810 -->
  <!-- Grid: 6 columns × 5 rows, cell size 110×90, total 660×450, top-left at (470, 225) -->

  <!-- Grid background panel -->
  <rect x="455" y="210" width="690" height="480" rx="8" fill="#2a1208" opacity="0.85"/>

  <!-- Row header bars (left edge, decorative — suggesting row labels) -->
  <rect x="463" y="252" width="58" height="72" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="463" y="342" width="58" height="72" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="463" y="432" width="58" height="72" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="463" y="522" width="58" height="72" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="463" y="612" width="58" height="72" rx="4" fill="#5c2a1a" opacity="0.7"/>

  <!-- Column header bars (top edge) -->
  <rect x="531" y="218" width="95" height="24" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="636" y="218" width="95" height="24" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="741" y="218" width="95" height="24" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="846" y="218" width="95" height="24" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="951" y="218" width="95" height="24" rx="4" fill="#5c2a1a" opacity="0.7"/>
  <rect x="1056" y="218" width="80" height="24" rx="4" fill="#5c2a1a" opacity="0.7"/>

  <!-- Data cells: row 1 -->
  <rect x="531" y="252" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.92"/>
  <rect x="636" y="252" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.88"/>
  <rect x="741" y="252" width="95" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>
  <rect x="846" y="252" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.90"/>
  <rect x="951" y="252" width="95" height="72" rx="4" fill="url(#cellPartial)" opacity="0.75"/>
  <rect x="1056" y="252" width="80" height="72" rx="4" fill="url(#cellFull)" opacity="0.85"/>

  <!-- Data cells: row 2 -->
  <rect x="531" y="342" width="95" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>
  <rect x="636" y="342" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.90"/>
  <rect x="741" y="342" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.85"/>
  <rect x="846" y="342" width="95" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>
  <rect x="951" y="342" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.88"/>
  <rect x="1056" y="342" width="80" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>

  <!-- Data cells: row 3 -->
  <rect x="531" y="432" width="95" height="72" rx="4" fill="url(#cellPartial)" opacity="0.80"/>
  <rect x="636" y="432" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.92"/>
  <rect x="741" y="432" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.88"/>
  <rect x="846" y="432" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.90"/>
  <rect x="951" y="432" width="95" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>
  <rect x="1056" y="432" width="80" height="72" rx="4" fill="url(#cellPartial)" opacity="0.75"/>

  <!-- Data cells: row 4 -->
  <rect x="531" y="522" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.88"/>
  <rect x="636" y="522" width="95" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>
  <rect x="741" y="522" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.85"/>
  <rect x="846" y="522" width="95" height="72" rx="4" fill="url(#cellPartial)" opacity="0.78"/>
  <rect x="951" y="522" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.90"/>
  <rect x="1056" y="522" width="80" height="72" rx="4" fill="url(#cellFull)" opacity="0.86"/>

  <!-- Data cells: row 5 -->
  <rect x="531" y="612" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.90"/>
  <rect x="636" y="612" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.85"/>
  <rect x="741" y="612" width="95" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>
  <rect x="846" y="612" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.88"/>
  <rect x="951" y="612" width="95" height="72" rx="4" fill="url(#cellFull)" opacity="0.92"/>
  <rect x="1056" y="612" width="80" height="72" rx="4" fill="#3b1a0a" opacity="0.6"/>

  <!-- Checkmark accent inside hero cells (simple tick shapes, no letters) -->
  <!-- Row1 col1 tick -->
  <polyline points="548,291 567,310 600,272" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <!-- Row3 col2 tick -->
  <polyline points="653,471 672,490 705,452" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <!-- Row5 col5 tick -->
  <polyline points="968,651 987,670 1020,632" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

  <!-- Layer 3: edge decoration (outside safe zone or at borders) -->
  <!-- Subtle corner accent lines -->
  <line x1="0" y1="0" x2="200" y2="0" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
  <line x1="0" y1="0" x2="0" y2="200" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
  <line x1="1600" y1="900" x2="1400" y2="900" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
  <line x1="1600" y1="900" x2="1600" y2="700" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
</svg>
