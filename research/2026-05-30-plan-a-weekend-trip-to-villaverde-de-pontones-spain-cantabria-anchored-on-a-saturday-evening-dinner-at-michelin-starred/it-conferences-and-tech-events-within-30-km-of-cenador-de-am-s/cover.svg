<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="coast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Coastline suggestion (Santander Bay) — full-bleed decorative band -->
  <path d="M0,560 C200,540 360,600 540,580 C720,560 820,520 980,540 C1140,560 1320,600 1600,580 L1600,720 C1380,700 1180,740 980,720 C780,700 600,740 400,720 C260,710 120,730 0,720 Z"
        fill="url(#coast)" opacity="0.75"/>

  <!-- Subtle wave line -->
  <path d="M0,560 C200,540 360,600 540,580 C720,560 820,520 980,540 C1140,560 1320,600 1600,580"
        fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.35"/>

  <!-- Radar glow behind hero -->
  <circle cx="800" cy="450" r="340" fill="url(#glow)"/>

  <!-- Concentric range rings (30 km radius motif) -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-width="1.2" opacity="0.35"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#c2410c" stroke-width="1.2" opacity="0.45"/>
  <circle cx="800" cy="450" r="160" fill="none" stroke="#9a3309" stroke-width="1.4" opacity="0.55"/>
  <circle cx="800" cy="450" r="80"  fill="none" stroke="#9a3309" stroke-width="1.6" opacity="0.7"/>

  <!-- Crosshair axes -->
  <line x1="460" y1="450" x2="1140" y2="450" stroke="#78350f" stroke-width="0.8" opacity="0.3"/>
  <line x1="800" y1="110" x2="800" y2="790" stroke="#78350f" stroke-width="0.8" opacity="0.3"/>

  <!-- Network edges from hub to event nodes -->
  <g stroke="#9a3309" stroke-width="1.1" opacity="0.55" fill="none">
    <line x1="800" y1="450" x2="620" y2="320"/>
    <line x1="800" y1="450" x2="980" y2="340"/>
    <line x1="800" y1="450" x2="1020" y2="540"/>
    <line x1="800" y1="450" x2="640" y2="560"/>
    <line x1="800" y1="450" x2="900" y2="260"/>
    <line x1="800" y1="450" x2="700" y2="640"/>
  </g>

  <!-- Event nodes -->
  <g fill="#c2410c" opacity="0.9">
    <circle cx="620" cy="320" r="9"/>
    <circle cx="980" cy="340" r="9"/>
    <circle cx="1020" cy="540" r="9"/>
    <circle cx="640" cy="560" r="9"/>
    <circle cx="900" cy="260" r="9"/>
    <circle cx="700" cy="640" r="9"/>
  </g>
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="620" cy="320" r="3.5"/>
    <circle cx="980" cy="340" r="3.5"/>
    <circle cx="1020" cy="540" r="3.5"/>
    <circle cx="640" cy="560" r="3.5"/>
    <circle cx="900" cy="260" r="3.5"/>
    <circle cx="700" cy="640" r="3.5"/>
  </g>

  <!-- Central pin (hero) -->
  <path d="M800,360 C760,360 728,392 728,432 C728,478 778,520 800,560 C822,520 872,478 872,432 C872,392 840,360 800,360 Z"
        fill="url(#pin)" opacity="0.95"/>
  <circle cx="800" cy="430" r="22" fill="#faf8f2" opacity="0.95"/>
  <circle cx="800" cy="430" r="10" fill="#9a3309"/>

  <!-- Pin shadow ellipse -->
  <ellipse cx="800" cy="575" rx="34" ry="6" fill="#5c2a1a" opacity="0.25"/>
</svg>
