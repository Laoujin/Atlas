<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="manor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1607"/>
    </linearGradient>
    <linearGradient id="solana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- full-bleed night sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon glow halo, also acts as Michelin star anchor -->
  <circle cx="800" cy="300" r="320" fill="url(#moonGlow)"/>

  <!-- moon disc -->
  <circle cx="800" cy="300" r="78" fill="#fef3ec" opacity="0.92"/>
  <circle cx="780" cy="285" r="14" fill="#f0eadb" opacity="0.55"/>
  <circle cx="822" cy="318" r="9" fill="#f0eadb" opacity="0.45"/>

  <!-- distant flanking posadas (left) -->
  <g opacity="0.7">
    <polygon points="240,640 240,560 290,520 340,560 340,640" fill="#5c2a1a"/>
    <rect x="255" y="580" width="14" height="20" fill="#fbbf24" opacity="0.7"/>
    <rect x="310" y="580" width="14" height="20" fill="#fbbf24" opacity="0.7"/>
  </g>
  <g opacity="0.78">
    <polygon points="400,660 400,580 470,535 540,580 540,660" fill="#78350f"/>
    <rect x="430" y="600" width="16" height="22" fill="#fbbf24" opacity="0.8"/>
    <rect x="490" y="600" width="16" height="22" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- distant flanking casonas (right) -->
  <g opacity="0.78">
    <polygon points="1060,660 1060,580 1130,535 1200,580 1200,660" fill="#78350f"/>
    <rect x="1090" y="600" width="16" height="22" fill="#fbbf24" opacity="0.8"/>
    <rect x="1150" y="600" width="16" height="22" fill="#fbbf24" opacity="0.8"/>
  </g>
  <g opacity="0.7">
    <polygon points="1260,640 1260,560 1310,520 1360,560 1360,640" fill="#5c2a1a"/>
    <rect x="1275" y="580" width="14" height="20" fill="#fbbf24" opacity="0.7"/>
    <rect x="1330" y="580" width="14" height="20" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- hero: central stone manor with solana sun-gallery -->
  <g>
    <!-- main body -->
    <rect x="640" y="500" width="320" height="240" fill="url(#manor)"/>
    <!-- gable roof -->
    <polygon points="620,500 800,400 980,500" fill="#3a1607"/>
    <!-- chimney -->
    <rect x="900" y="420" width="28" height="55" fill="#3a1607"/>
    <!-- solana (covered wooden sun-gallery, classic Cantabrian feature) -->
    <rect x="660" y="560" width="280" height="70" fill="url(#solana)" opacity="0.9"/>
    <!-- solana mullions -->
    <rect x="720" y="560" width="4" height="70" fill="#5c2a1a" opacity="0.85"/>
    <rect x="780" y="560" width="4" height="70" fill="#5c2a1a" opacity="0.85"/>
    <rect x="816" y="560" width="4" height="70" fill="#5c2a1a" opacity="0.85"/>
    <rect x="876" y="560" width="4" height="70" fill="#5c2a1a" opacity="0.85"/>
    <!-- solana base beam -->
    <rect x="655" y="628" width="290" height="8" fill="#3a1607"/>
    <!-- ground floor arched doorway -->
    <rect x="780" y="660" width="40" height="80" fill="#1a0e0e"/>
    <ellipse cx="800" cy="660" rx="20" ry="14" fill="#1a0e0e"/>
    <!-- upper windows -->
    <rect x="680" y="660" width="26" height="36" fill="#fbbf24" opacity="0.85"/>
    <rect x="894" y="660" width="26" height="36" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- four-point Michelin/guiding star above the moon -->
  <g transform="translate(800 300)" opacity="0.95">
    <polygon points="0,-46 8,-8 46,0 8,8 0,46 -8,8 -46,0 -8,-8" fill="#fbbf24"/>
  </g>

  <!-- radiating taxi-range dotted arc, anchored to the star -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="500" cy="320" r="3"/>
    <circle cx="430" cy="370" r="2.5"/>
    <circle cx="380" cy="440" r="3"/>
    <circle cx="1100" cy="320" r="3"/>
    <circle cx="1170" cy="370" r="2.5"/>
    <circle cx="1220" cy="440" r="3"/>
    <circle cx="640" cy="220" r="2.5"/>
    <circle cx="960" cy="220" r="2.5"/>
  </g>

  <!-- foreground ground line -->
  <rect x="0" y="740" width="1600" height="160" fill="#1a0e0e" opacity="0.85"/>
  <rect x="0" y="738" width="1600" height="4" fill="#9a3309" opacity="0.5"/>
</svg>
