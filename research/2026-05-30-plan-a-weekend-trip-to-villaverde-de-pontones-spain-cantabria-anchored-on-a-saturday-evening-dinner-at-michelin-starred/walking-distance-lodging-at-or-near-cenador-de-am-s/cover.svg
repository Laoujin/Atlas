<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stoneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="stoneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="420" rx="900" ry="380" fill="url(#glow)"/>

  <!-- distant hills -->
  <path d="M0,620 Q220,470 460,540 T940,500 T1600,560 L1600,900 L0,900 Z" fill="url(#hillBack)"/>
  <path d="M0,720 Q280,600 540,660 T1080,640 T1600,700 L1600,900 L0,900 Z" fill="url(#hillFront)" opacity="0.9"/>

  <!-- footpath winding from foreground toward the mansion -->
  <path d="M780,900 Q820,820 870,760 Q930,700 900,640 Q880,605 860,590" stroke="#fbbf24" stroke-width="22" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
  <path d="M780,900 Q820,820 870,760 Q930,700 900,640 Q880,605 860,590" stroke="#faf8f2" stroke-width="10" stroke-opacity="0.7" fill="none" stroke-linecap="round"/>

  <!-- HERO: stone mansion (left, larger) -->
  <g>
    <!-- mansion body -->
    <rect x="560" y="430" width="320" height="220" fill="url(#stoneA)"/>
    <!-- mansion roof -->
    <polygon points="540,430 900,430 850,360 590,360" fill="url(#roof)"/>
    <!-- chimney -->
    <rect x="640" y="335" width="32" height="60" fill="#78350f"/>
    <!-- windows -->
    <rect x="600" y="470" width="40" height="56" fill="#5c2a1a" opacity="0.85"/>
    <rect x="680" y="470" width="40" height="56" fill="#5c2a1a" opacity="0.85"/>
    <rect x="760" y="470" width="40" height="56" fill="#5c2a1a" opacity="0.85"/>
    <!-- door -->
    <rect x="690" y="560" width="50" height="90" fill="#5c2a1a"/>
    <!-- warm window glow (the restaurant) -->
    <rect x="600" y="470" width="40" height="56" fill="#fbbf24" opacity="0.55"/>
    <rect x="760" y="470" width="40" height="56" fill="#fbbf24" opacity="0.55"/>
    <!-- stone seam suggestion -->
    <line x1="560" y1="540" x2="880" y2="540" stroke="#9a3309" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- ADJACENT lodging (right, smaller, set slightly back) -->
  <g>
    <rect x="940" y="490" width="200" height="160" fill="url(#stoneB)"/>
    <polygon points="925,490 1155,490 1115,435 965,435" fill="#9a3309"/>
    <rect x="975" y="525" width="32" height="44" fill="#5c2a1a" opacity="0.85"/>
    <rect x="1035" y="525" width="32" height="44" fill="#5c2a1a" opacity="0.85"/>
    <rect x="1095" y="525" width="32" height="44" fill="#5c2a1a" opacity="0.85"/>
    <rect x="1030" y="585" width="40" height="65" fill="#5c2a1a"/>
    <rect x="1035" y="525" width="32" height="44" fill="#fbbf24" opacity="0.45"/>
  </g>

  <!-- low stone wall connecting the two buildings (the "walking distance") -->
  <rect x="880" y="620" width="60" height="30" fill="#78350f" opacity="0.7"/>

  <!-- a couple of tree silhouettes for scale -->
  <circle cx="500" cy="600" r="38" fill="#5c2a1a" opacity="0.7"/>
  <rect x="496" y="600" width="8" height="40" fill="#5c2a1a" opacity="0.7"/>
  <circle cx="1200" cy="640" r="30" fill="#5c2a1a" opacity="0.65"/>
  <rect x="1197" y="640" width="6" height="32" fill="#5c2a1a" opacity="0.65"/>
</svg>
