<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Low sun behind the headland -->
  <circle cx="560" cy="470" r="280" fill="url(#sun)"/>

  <!-- Far rolling hills (twin tetas silhouette) -->
  <path d="M0 560 Q 180 470 360 520 Q 480 450 600 510 Q 760 430 920 500 Q 1100 460 1280 510 Q 1440 470 1600 520 L 1600 620 L 0 620 Z"
        fill="#5c2a1a" opacity="0.55"/>

  <!-- Mid hills -->
  <path d="M0 640 Q 220 580 440 620 Q 640 560 860 610 Q 1080 580 1280 620 Q 1440 600 1600 630 L 1600 720 L 0 720 Z"
        fill="url(#hill)" opacity="0.85"/>

  <!-- Sea -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#sea)"/>

  <!-- Sun reflection on water -->
  <ellipse cx="560" cy="720" rx="220" ry="10" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="560" cy="760" rx="160" ry="6" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="560" cy="800" rx="110" ry="4" fill="#fbbf24" opacity="0.25"/>

  <!-- Cliff headland (hero base) -->
  <path d="M820 720 Q 880 700 940 705 L 1080 700 Q 1140 705 1180 720 L 1180 900 L 820 900 Z"
        fill="url(#cliff)"/>
  <path d="M820 720 Q 880 700 940 705 L 1080 700 Q 1140 705 1180 720 L 1170 740 Q 1100 725 1000 730 Q 900 725 830 740 Z"
        fill="#9a3309" opacity="0.5"/>

  <!-- Lighthouse hero, centered ~(1000, 520), inside safe zone -->
  <!-- Base platform -->
  <rect x="960" y="680" width="80" height="22" fill="#78350f"/>
  <!-- Tower body -->
  <path d="M982 700 L 1018 700 L 1024 480 L 976 480 Z" fill="url(#tower)"/>
  <!-- Tower banding -->
  <rect x="978" y="555" width="44" height="10" fill="#c2410c" opacity="0.85"/>
  <rect x="980" y="620" width="40" height="8" fill="#c2410c" opacity="0.7"/>
  <!-- Gallery walkway -->
  <rect x="968" y="468" width="64" height="14" fill="#5c2a1a"/>
  <!-- Lantern room -->
  <rect x="978" y="430" width="44" height="40" fill="#fbbf24" opacity="0.95"/>
  <rect x="978" y="430" width="44" height="40" fill="none" stroke="#78350f" stroke-width="3"/>
  <!-- Lantern dome -->
  <path d="M978 430 Q 1000 400 1022 430 Z" fill="#78350f"/>
  <!-- Finial -->
  <rect x="998" y="388" width="4" height="14" fill="#5c2a1a"/>
  <circle cx="1000" cy="386" r="4" fill="#c2410c"/>

  <!-- Light beam glow -->
  <path d="M1000 450 L 1380 360 L 1420 500 Z" fill="#fbbf24" opacity="0.18"/>
  <path d="M1000 450 L 620 360 L 580 500 Z" fill="#fbbf24" opacity="0.14"/>

  <!-- A few coastal birds, far from hero -->
  <path d="M220 280 q 12 -8 24 0 q 12 -8 24 0" stroke="#5c2a1a" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M310 230 q 10 -6 20 0 q 10 -6 20 0" stroke="#5c2a1a" stroke-width="2.2" fill="none" opacity="0.6"/>
  <path d="M1380 240 q 10 -6 20 0 q 10 -6 20 0" stroke="#5c2a1a" stroke-width="2.2" fill="none" opacity="0.6"/>
</svg>
