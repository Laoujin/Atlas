<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant tree line (Kempen forest horizon) -->
  <path d="M0,560 L60,540 110,555 160,520 220,545 280,525 340,550 400,515 460,545 520,530 580,550 640,520 700,545 760,535 820,520 880,545 940,525 1000,550 1060,520 1120,545 1180,530 1240,550 1300,515 1360,545 1420,530 1480,545 1540,525 1600,545 1600,640 0,640 Z"
        fill="#78350f" opacity="0.35"/>

  <!-- nearer treeline -->
  <path d="M0,620 L70,595 130,615 200,580 260,610 330,590 400,615 470,585 540,610 610,595 680,615 750,590 820,610 890,585 960,615 1030,595 1100,615 1170,585 1240,610 1310,595 1380,615 1450,590 1520,610 1600,600 1600,700 0,700 Z"
        fill="#9a3309" opacity="0.55"/>

  <!-- HERO: stepped-gable Kempen townhouse + watermill wheel, centered ~(800, 470) -->
  <!-- main building body -->
  <rect x="640" y="430" width="360" height="290" fill="url(#wall)"/>
  <!-- side wing (lower) -->
  <rect x="500" y="510" width="160" height="210" fill="#d97706" opacity="0.75"/>
  <!-- side wing roof -->
  <polygon points="495,510 580,455 665,510" fill="url(#roof)"/>

  <!-- stepped gable (signature Belgian/Kempen form) -->
  <polygon points="640,430 640,360 680,360 680,330 720,330 720,300 760,300 760,270 820,270 820,300 880,300 880,330 920,330 920,360 960,360 960,430"
           fill="url(#roof)"/>
  <!-- main roof ridge behind -->
  <polygon points="635,430 800,355 1005,430" fill="#5c2a1a" opacity="0.9"/>

  <!-- chimney -->
  <rect x="900" y="345" width="28" height="70" fill="#5c2a1a"/>

  <!-- windows: dark rectangles, no text -->
  <rect x="680" y="470" width="40" height="60" fill="#1a0e0e" opacity="0.8"/>
  <rect x="745" y="470" width="40" height="60" fill="#1a0e0e" opacity="0.8"/>
  <rect x="810" y="470" width="40" height="60" fill="#1a0e0e" opacity="0.8"/>
  <rect x="875" y="470" width="40" height="60" fill="#1a0e0e" opacity="0.8"/>

  <rect x="680" y="560" width="40" height="60" fill="#fbbf24" opacity="0.85"/>
  <rect x="745" y="560" width="40" height="60" fill="#1a0e0e" opacity="0.8"/>
  <rect x="810" y="560" width="40" height="60" fill="#fbbf24" opacity="0.85"/>
  <rect x="875" y="560" width="40" height="60" fill="#1a0e0e" opacity="0.8"/>

  <!-- arched door -->
  <path d="M780,720 L780,660 Q800,635 820,660 L820,720 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- small dormer window in side wing -->
  <rect x="540" y="555" width="34" height="50" fill="#fbbf24" opacity="0.8"/>
  <rect x="600" y="555" width="34" height="50" fill="#1a0e0e" opacity="0.75"/>
  <rect x="540" y="635" width="34" height="50" fill="#1a0e0e" opacity="0.75"/>
  <rect x="600" y="635" width="34" height="50" fill="#1a0e0e" opacity="0.75"/>

  <!-- watermill wheel, attached at right side -->
  <circle cx="1080" cy="640" r="92" fill="none" stroke="#5c2a1a" stroke-width="8"/>
  <circle cx="1080" cy="640" r="70" fill="none" stroke="#78350f" stroke-width="3" opacity="0.7"/>
  <circle cx="1080" cy="640" r="10" fill="#5c2a1a"/>
  <line x1="1080" y1="548" x2="1080" y2="732" stroke="#5c2a1a" stroke-width="5"/>
  <line x1="988" y1="640" x2="1172" y2="640" stroke="#5c2a1a" stroke-width="5"/>
  <line x1="1015" y1="575" x2="1145" y2="705" stroke="#5c2a1a" stroke-width="5"/>
  <line x1="1145" y1="575" x2="1015" y2="705" stroke="#5c2a1a" stroke-width="5"/>
  <!-- paddles -->
  <rect x="1072" y="548" width="16" height="22" fill="#78350f"/>
  <rect x="1072" y="710" width="16" height="22" fill="#78350f"/>
  <rect x="988" y="632" width="22" height="16" fill="#78350f"/>
  <rect x="1150" y="632" width="22" height="16" fill="#78350f"/>
  <rect x="1010" y="570" width="18" height="18" fill="#78350f" transform="rotate(-45 1019 579)"/>
  <rect x="1132" y="692" width="18" height="18" fill="#78350f" transform="rotate(-45 1141 701)"/>
  <rect x="1132" y="570" width="18" height="18" fill="#78350f" transform="rotate(45 1141 579)"/>
  <rect x="1010" y="692" width="18" height="18" fill="#78350f" transform="rotate(45 1019 701)"/>

  <!-- mill race / water at base -->
  <rect x="0" y="730" width="1600" height="170" fill="url(#water)"/>
  <path d="M0,745 Q200,735 400,745 T800,745 T1200,745 T1600,745" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.45"/>
  <path d="M0,770 Q200,760 400,770 T800,770 T1200,770 T1600,770" stroke="#fef3ec" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M0,800 Q220,790 440,800 T880,800 T1320,800 T1600,800" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- a couple of foreground trees flanking (decoration, may clip on detail crop) -->
  <ellipse cx="180" cy="640" rx="55" ry="80" fill="#5c2a1a" opacity="0.6"/>
  <rect x="172" y="640" width="16" height="60" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="1440" cy="635" rx="50" ry="75" fill="#5c2a1a" opacity="0.55"/>
  <rect x="1432" y="635" width="14" height="55" fill="#5c2a1a" opacity="0.7"/>
</svg>
