<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="manor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1810" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon halo, off-center, outside hero -->
  <circle cx="1280" cy="220" r="260" fill="url(#moonglow)"/>
  <circle cx="1280" cy="220" r="42" fill="#fef3ec" opacity="0.85"/>

  <!-- Stars (decoration, mostly outside hero safe zone) -->
  <circle cx="180" cy="160" r="2.2" fill="#fef3ec" opacity="0.85"/>
  <circle cx="320" cy="110" r="1.6" fill="#fbbf24" opacity="0.7"/>
  <circle cx="520" cy="180" r="2" fill="#fef3ec" opacity="0.9"/>
  <circle cx="740" cy="130" r="1.4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="980" cy="170" r="1.8" fill="#fef3ec" opacity="0.8"/>
  <circle cx="1100" cy="100" r="1.5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1450" cy="380" r="1.8" fill="#fef3ec" opacity="0.7"/>
  <circle cx="90" cy="320" r="1.6" fill="#fef3ec" opacity="0.6"/>
  <circle cx="240" cy="260" r="1.3" fill="#fbbf24" opacity="0.5"/>

  <!-- Distant tree line silhouette, behind manor -->
  <path d="M 0 640 L 80 600 L 160 620 L 240 580 L 340 610 L 420 590 L 520 620 L 600 600 L 700 615 L 800 590 L 900 610 L 1000 595 L 1100 620 L 1200 600 L 1300 615 L 1400 595 L 1500 620 L 1600 605 L 1600 700 L 0 700 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Manor house silhouette — hero, centered ~(800, 500) -->
  <!-- Main wing -->
  <rect x="560" y="470" width="480" height="240" fill="url(#manor)"/>
  <!-- Steep Flemish gable roof -->
  <polygon points="540,470 800,330 1060,470" fill="#1a0e0e"/>
  <!-- Side wing left -->
  <rect x="430" y="540" width="140" height="170" fill="url(#manor)" opacity="0.92"/>
  <polygon points="420,540 500,460 580,540" fill="#1a0e0e"/>
  <!-- Side wing right -->
  <rect x="1030" y="540" width="140" height="170" fill="url(#manor)" opacity="0.92"/>
  <polygon points="1020,540 1100,460 1180,540" fill="#1a0e0e"/>
  <!-- Chimney -->
  <rect x="880" y="350" width="28" height="60" fill="#1a0e0e"/>

  <!-- Warm window glow (the hospitality hero accent) -->
  <ellipse cx="800" cy="600" rx="180" ry="90" fill="url(#windowglow)"/>

  <!-- Lit central doorway / window -->
  <rect x="770" y="560" width="60" height="110" fill="#fbbf24" opacity="0.92"/>
  <rect x="775" y="565" width="50" height="100" fill="#fef3ec" opacity="0.75"/>
  <!-- Window divider -->
  <line x1="800" y1="560" x2="800" y2="670" stroke="#78350f" stroke-width="2" opacity="0.7"/>
  <line x1="770" y1="615" x2="830" y2="615" stroke="#78350f" stroke-width="2" opacity="0.7"/>

  <!-- Flanking smaller lit windows -->
  <rect x="660" y="580" width="34" height="50" fill="#d97706" opacity="0.78"/>
  <rect x="906" y="580" width="34" height="50" fill="#d97706" opacity="0.78"/>
  <rect x="480" y="600" width="26" height="38" fill="#fbbf24" opacity="0.65"/>
  <rect x="1094" y="600" width="26" height="38" fill="#fbbf24" opacity="0.65"/>

  <!-- A single warm rose accent — distant lantern by the path -->
  <circle cx="380" cy="680" r="6" fill="#be185d" opacity="0.8"/>
  <circle cx="380" cy="680" r="14" fill="#be185d" opacity="0.2"/>

  <!-- Foreground ground wash -->
  <rect x="0" y="690" width="1600" height="210" fill="url(#ground)"/>

  <!-- Path suggestion leading to door -->
  <path d="M 740 900 L 780 700 L 820 700 L 860 900 Z" fill="#fbbf24" opacity="0.08"/>
</svg>
