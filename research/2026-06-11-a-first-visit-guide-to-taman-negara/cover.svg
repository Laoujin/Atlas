<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="mist" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- (1) full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- decoration: distant canopy ridge, mostly cropped -->
  <path d="M-50 870 Q 300 700 650 800 T 1250 780 Q 1500 720 1700 820 L 1700 950 L -50 950 Z"
        fill="#3f6212" opacity="0.6"/>

  <!-- warm misty glow behind hero -->
  <ellipse cx="800" cy="440" rx="560" ry="380" fill="url(#mist)"/>

  <!-- (2) hero: emblematic broad rainforest tree -->
  <!-- canopy crown -->
  <path d="M800 120
           Q 560 150 470 320
           Q 380 470 560 510
           Q 470 590 660 610
           Q 600 700 800 690
           Q 1000 700 940 610
           Q 1130 590 1040 510
           Q 1220 470 1130 320
           Q 1040 150 800 120 Z"
        fill="#4d7c3a" opacity="0.92"/>
  <path d="M800 170
           Q 640 200 600 340
           Q 560 470 720 480
           Q 660 560 800 555
           Q 940 560 880 480
           Q 1040 470 1000 340
           Q 960 200 800 170 Z"
        fill="#3f6212" opacity="0.85"/>

  <!-- broad buttressed trunk -->
  <path d="M770 640
           L 770 760
           Q 690 800 640 810
           Q 720 790 770 800
           L 770 810 L 830 810 L 830 800
           Q 880 790 960 810
           Q 910 800 830 760
           L 830 640 Z"
        fill="url(#trunk)" opacity="0.95"/>

  <!-- quiet river ribbon accent, lower safe zone -->
  <path d="M520 805 Q 800 720 1080 805 Q 800 780 520 805 Z"
        fill="#fbbf24" opacity="0.7"/>
</svg>
