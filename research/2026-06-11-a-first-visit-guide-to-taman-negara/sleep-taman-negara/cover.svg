<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7c3a"/>
      <stop offset="1" stop-color="#3f6212"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- canopy crowning the scene -->
  <path d="M150 250 C320 90 520 110 690 200 C780 120 1000 110 1130 210 C1300 130 1480 180 1520 320 C1420 280 1360 320 1310 360 C1180 300 1060 330 990 380 C860 320 740 330 660 380 C520 330 380 340 300 380 C240 320 170 320 110 350 C110 300 120 270 150 250 Z" fill="url(#canopy)" opacity="0.88"/>

  <!-- hero: stilted riverside chalet -->
  <g opacity="0.95">
    <!-- roof -->
    <path d="M800 300 L1030 470 L570 470 Z" fill="#9a3309"/>
    <path d="M800 330 L985 470 L615 470 Z" fill="#c2410c" opacity="0.9"/>
    <!-- body -->
    <rect x="635" y="470" width="330" height="210" fill="url(#cabin)"/>
    <!-- warm window -->
    <rect x="735" y="525" width="130" height="105" rx="6" fill="#fbbf24" opacity="0.92"/>
    <!-- stilts -->
    <rect x="660" y="680" width="26" height="150" fill="#3f1f0c"/>
    <rect x="914" y="680" width="26" height="150" fill="#3f1f0c"/>
    <rect x="787" y="680" width="26" height="150" fill="#3f1f0c" opacity="0.85"/>
  </g>

  <!-- river reflection band -->
  <path d="M0 818 C400 800 1200 836 1600 808 L1600 900 L0 900 Z" fill="#78350f" opacity="0.7"/>
  <path d="M735 826 L865 826 L840 880 L760 880 Z" fill="#fbbf24" opacity="0.35"/>
</svg>
