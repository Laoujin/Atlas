<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- subordinate jungle canopy decoration, cropped -->
  <path d="M0,820 Q260,700 520,800 Q800,720 1080,800 Q1360,710 1600,810 L1600,900 L0,900 Z"
        fill="#4d7c3a" opacity="0.7"/>

  <!-- HERO: thatched Orang Asli shelter -->
  <g opacity="0.92">
    <!-- stilts / posts -->
    <rect x="540" y="560" width="22" height="200" fill="#78350f"/>
    <rect x="1038" y="560" width="22" height="200" fill="#78350f"/>
    <rect x="720" y="560" width="22" height="200" fill="#9a3309"/>
    <rect x="858" y="560" width="22" height="200" fill="#9a3309"/>
    <!-- platform -->
    <rect x="520" y="540" width="560" height="36" rx="6" fill="#c2410c"/>
    <!-- thatched roof -->
    <path d="M800,250 L1110,560 L490,560 Z" fill="url(#roof)"/>
    <path d="M800,250 L1110,560 L490,560 Z" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.5"/>
    <!-- thatch ridges -->
    <path d="M650,560 L800,330 L950,560" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.4"/>
    <path d="M590,560 L800,290 L1010,560" fill="none" stroke="#d97706" stroke-width="5" opacity="0.45"/>
  </g>

  <!-- crossed blowpipes -->
  <g opacity="0.9">
    <rect x="430" y="690" width="740" height="16" rx="8" fill="url(#pipe)" transform="rotate(-18 800 698)"/>
    <rect x="430" y="690" width="740" height="16" rx="8" fill="url(#pipe)" transform="rotate(18 800 698)"/>
    <circle cx="800" cy="698" r="22" fill="#fbbf24" opacity="0.85"/>
  </g>
</svg>
