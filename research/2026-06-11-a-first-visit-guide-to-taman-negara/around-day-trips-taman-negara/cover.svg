  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- jungle banks framing -->
  <path d="M0 0 H1600 V120 C1180 230 1080 80 720 180 C420 262 220 150 0 250 Z" fill="#4d7c3a" opacity="0.7"/>
  <path d="M0 900 H1600 V760 C1240 690 1040 840 700 770 C400 708 230 820 0 740 Z" fill="#4d7c3a" opacity="0.78"/>

  <!-- winding river route ribbon -->
  <path d="M40 360 C360 300 520 470 820 430 C1140 388 1300 540 1580 470 L1580 600 C1300 660 1140 510 820 560 C520 606 360 470 40 540 Z" fill="url(#river)" opacity="0.8"/>
  <path d="M60 460 C380 408 540 560 840 520 C1160 478 1320 600 1560 545" fill="none" stroke="#fef3ec" stroke-width="6" opacity="0.65" stroke-linecap="round"/>

  <!-- hero longboat -->
  <g opacity="0.95">
    <path d="M470 540 C520 520 1080 520 1120 540 C1148 556 1126 596 1080 600 C840 620 560 620 510 600 C470 584 442 556 470 540 Z" fill="url(#hull)"/>
    <path d="M500 552 C620 540 980 540 1090 552 C1080 568 920 576 800 576 C660 576 520 568 500 552 Z" fill="#c2410c" opacity="0.9"/>
    <path d="M510 540 C560 470 1040 470 1090 540" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <rect x="745" y="478" width="14" height="76" rx="6" fill="#9a3309"/>
    <path d="M752 480 C800 470 858 488 880 520 C846 520 792 510 752 516 Z" fill="#fbbf24" opacity="0.9"/>
