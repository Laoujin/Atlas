<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="canopyFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="canopyNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="boat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3f6212"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- far canopy ridge -->
  <path d="M0 430 C 260 350 480 470 760 400 C 1040 330 1300 460 1600 380 L1600 900 0 900 Z"
        fill="url(#canopyFar)" opacity="0.78"/>

  <!-- subordinate jungle-green mid ridge -->
  <path d="M0 540 C 300 480 540 600 820 520 C 1100 440 1340 580 1600 510 L1600 900 0 900 Z"
        fill="#4d7c3a" opacity="0.62"/>

  <!-- near canopy -->
  <path d="M0 640 C 280 580 520 700 800 620 C 1080 540 1340 690 1600 610 L1600 900 0 900 Z"
        fill="url(#canopyNear)" opacity="0.9"/>

  <!-- river ribbon, hero context -->
  <path d="M250 880 C 560 760 600 640 800 560 C 1000 480 1060 420 1330 360 L1390 410 C 1140 470 1070 540 880 620 C 690 700 660 800 360 900 Z"
        fill="url(#river)" opacity="0.9"/>

  <!-- HERO: longboat cutting the river -->
  <g opacity="0.95">
    <path d="M560 560 C 700 530 920 545 1050 590 C 1010 624 880 642 770 636 C 660 630 600 600 560 560 Z"
          fill="url(#boat)"/>
    <path d="M600 566 C 740 548 900 560 1010 594 L1000 606 C 880 580 740 572 612 588 Z"
          fill="#d97706" opacity="0.85"/>
    <!-- wake -->
    <path d="M760 642 C 700 690 640 740 540 820 L520 806 C 620 720 690 668 742 632 Z"
          fill="#fbbf24" opacity="0.7"/>
  </g>
</svg>
