<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#dusk)"/>

  <!-- dusk sun disc -->
  <circle cx="800" cy="380" r="130" fill="#fbbf24" opacity="0.85"/>

  <!-- canopy silhouette behind, cropped left/right -->
  <path d="M0,560 Q120,440 230,520 Q320,400 440,500 Q560,410 700,510 Q760,470 760,560 L760,900 L0,900 Z" fill="#1a0e0e" opacity="0.88"/>
  <path d="M840,560 Q900,470 900,510 Q1040,410 1160,500 Q1280,400 1370,520 Q1480,440 1600,560 L1600,900 L840,900 Z" fill="#1a0e0e" opacity="0.88"/>

  <!-- trestle deck -->
  <rect x="180" y="600" width="1240" height="22" fill="#78350f" opacity="0.92"/>
  <!-- trestle legs -->
  <path d="M300,622 L290,860 M460,622 L455,860 M620,622 L620,860 M780,622 L785,860 M940,622 L950,860 M1100,622 L1110,860 M1260,622 L1275,860" stroke="#5c2a1a" stroke-width="14" opacity="0.85"/>
  <!-- trestle cross braces -->
  <path d="M300,640 L460,820 M460,640 L300,820 M620,640 L780,820 M780,640 L620,820 M940,640 L1100,820 M1100,640 L940,820" stroke="#78350f" stroke-width="7" opacity="0.6"/>

  <!-- HERO: jungle train silhouette crossing trestle -->
  <g fill="url(#train)" opacity="0.95">
    <!-- locomotive body -->
    <path d="M540,520 L540,475 Q540,455 560,455 L640,455 L660,500 L760,500 L760,600 L540,600 Z"/>
    <!-- cab roof overhang -->
    <rect x="525" y="500" width="120" height="14"/>
    <!-- smokestack -->
    <rect x="700" y="430" width="26" height="40"/>
    <!-- carriages -->
    <rect x="780" y="510" width="170" height="90" rx="8"/>
    <rect x="968" y="510" width="170" height="90" rx="8"/>
  </g>
  <!-- carriage glowing windows -->
  <g fill="#fbbf24" opacity="0.9">
    <rect x="800" y="530" width="34" height="34" rx="4"/>
    <rect x="850" y="530" width="34" height="34" rx="4"/>
    <rect x="900" y="530" width="34" height="34" rx="4"/>
    <rect x="988" y="530" width="34" height="34" rx="4"/>
    <rect x="1038" y="530" width="34" height="34" rx="4"/>
    <rect x="1088" y="530" width="34" height="34" rx="4"/>
  </g>
  <!-- headlamp beam -->
  <circle cx="552" cy="555" r="14" fill="#fbbf24" opacity="0.95"/>

  <!-- bioluminescent fungi dots, green-glow accent, cropped foreground -->
  <g fill="#4d7c3a" opacity="0.85">
    <circle cx="120" cy="780" r="10"/>
    <circle cx="160" cy="820" r="7"/>
    <circle cx="90" cy="840" r="6"/>
    <circle cx="1480" cy="800" r="9"/>
    <circle cx="1520" cy="760" r="6"/>
    <circle cx="1450" cy="850" r="7"/>
  </g>
</svg>
