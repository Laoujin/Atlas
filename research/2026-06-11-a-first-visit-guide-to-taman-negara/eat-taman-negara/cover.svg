<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#3a1709"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="raft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant jungle bank crop, outside safe zone top -->
  <path d="M0 250 Q 300 180 620 240 Q 950 300 1320 215 Q 1480 195 1600 235 L1600 0 L0 0 Z" fill="#0d0707" opacity="0.7"/>

  <!-- warm lantern glow halo behind hero -->
  <ellipse cx="800" cy="470" rx="470" ry="320" fill="url(#glow)" opacity="0.85"/>

  <!-- river surface -->
  <rect x="0" y="580" width="1600" height="320" fill="url(#river)" opacity="0.9"/>

  <!-- HERO: floating raft restaurant silhouette -->
  <g opacity="0.95">
    <!-- pitched roof -->
    <path d="M540 470 L800 320 L1060 470 Z" fill="url(#raft)"/>
    <rect x="560" y="468" width="480" height="20" rx="6" fill="#c2410c"/>
    <!-- hut body with warm windows -->
    <rect x="585" y="486" width="430" height="120" rx="8" fill="#3a1709"/>
    <rect x="640" y="512" width="80" height="70" rx="6" fill="#fbbf24" opacity="0.92"/>
    <rect x="760" y="512" width="80" height="70" rx="6" fill="#fcd34d" opacity="0.95"/>
    <rect x="880" y="512" width="80" height="70" rx="6" fill="#fbbf24" opacity="0.92"/>
    <!-- raft logs deck on water -->
    <rect x="540" y="600" width="520" height="34" rx="14" fill="#78350f"/>
    <rect x="525" y="618" width="550" height="20" rx="10" fill="#1a0e0e" opacity="0.85"/>
  </g>

  <!-- hanging lantern accent (rose secondary) -->
  <circle cx="1080" cy="430" r="20" fill="#be185d" opacity="0.8"/>
  <circle cx="520" cy="445" r="16" fill="#d97706" opacity="0.85"/>

  <!-- reflections shimmering on river -->
  <path d="M700 638 Q 720 720 740 800 Q 800 770 860 800 Q 880 720 900 638 Z" fill="url(#refl)" opacity="0.6"/>
  <ellipse cx="800" cy="660" rx="260" ry="18" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="800" cy="710" rx="180" ry="12" fill="#d97706" opacity="0.3"/>
</svg>
