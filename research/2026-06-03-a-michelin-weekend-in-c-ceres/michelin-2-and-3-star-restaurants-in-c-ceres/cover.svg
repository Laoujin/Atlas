<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm radial glow behind the plate -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate fill gradient -->
    <radialGradient id="plateFill" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b5"/>
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e8d5c0"/>
      <stop offset="100%" stop-color="#b89a80"/>
    </radialGradient>

    <!-- Cloche dome gradient -->
    <radialGradient id="clocheFill" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1208"/>
    </radialGradient>

    <!-- Cloche sheen -->
    <linearGradient id="clocheSheen" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </linearGradient>

    <!-- Rose accent glow for garnish dot -->
    <radialGradient id="garnishGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer decorative ring gradient -->
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="82%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="90%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric warm glow, centered -->
  <ellipse cx="800" cy="460" rx="620" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — plate + cloche, centered at (800, 480) -->

  <!-- Decorative outer ring around the plate -->
  <circle cx="800" cy="510" r="310" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.30"/>
  <circle cx="800" cy="510" r="295" fill="none" stroke="#c2410c" stroke-width="0.8" opacity="0.18"/>

  <!-- Plate rim (slightly larger) -->
  <ellipse cx="800" cy="545" rx="248" ry="48" fill="url(#plateRim)" opacity="0.70"/>
  <circle cx="800" cy="510" r="248" fill="url(#plateRim)" opacity="0.88"/>

  <!-- Plate face -->
  <circle cx="800" cy="505" r="228" fill="url(#plateFill)" opacity="0.95"/>

  <!-- Inner plate well (subtle inset ring) -->
  <circle cx="800" cy="505" r="175" fill="none" stroke="#c2b09a" stroke-width="1.2" opacity="0.45"/>

  <!-- Cloche dome — hero accent, sits on top of the plate -->
  <!-- Dome body: an ellipse arc via path, wide at base, narrowing to top -->
  <path d="M 560 510
             C 560 340, 680 230, 800 225
             C 920 230, 1040 340, 1040 510
             Z"
        fill="url(#clocheFill)" opacity="0.92"/>

  <!-- Cloche sheen overlay -->
  <path d="M 560 510
             C 560 340, 680 230, 800 225
             C 920 230, 1040 340, 1040 510
             Z"
        fill="url(#clocheSheen)" opacity="0.85"/>

  <!-- Cloche base band -->
  <rect x="548" y="502" width="504" height="22" rx="8" fill="#9a3309" opacity="0.90"/>
  <rect x="548" y="502" width="504" height="7" rx="4" fill="#fbbf24" opacity="0.22"/>

  <!-- Cloche handle — small knob at the top -->
  <ellipse cx="800" cy="224" rx="32" ry="14" fill="#c2410c" opacity="0.95"/>
  <ellipse cx="800" cy="218" rx="16" ry="10" fill="#d97706" opacity="0.80"/>
  <ellipse cx="800" cy="215" rx="8" ry="5" fill="#fbbf24" opacity="0.55"/>

  <!-- Rose garnish dot — small accent on the visible plate front, below cloche base -->
  <ellipse cx="800" cy="680" rx="28" ry="12" fill="url(#garnishGlow)" opacity="0.72"/>
  <circle cx="800" cy="678" r="9" fill="#be185d" opacity="0.88"/>

  <!-- Layer 3: Subtle corner decoration (outside safe zone, atmospheric only) -->
  <!-- Bottom-left amber arc -->
  <path d="M 0 900 Q 180 720, 320 820" fill="none" stroke="#d97706" stroke-width="60" stroke-linecap="round" opacity="0.07"/>
  <!-- Top-right arc -->
  <path d="M 1600 0 Q 1400 180, 1300 80" fill="none" stroke="#c2410c" stroke-width="50" stroke-linecap="round" opacity="0.06"/>

</svg>
