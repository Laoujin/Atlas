<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="620" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: hero — three stacked angled conference cards centered at (800,450) -->

  <!-- Back card (bottom stack) -->
  <rect x="480" y="310" width="640" height="340" rx="14"
        fill="url(#card1)" opacity="0.72"
        transform="rotate(-6 800 480)"/>
  <!-- Decorative line bars inside back card -->
  <rect x="530" y="370" width="240" height="14" rx="4" fill="#fbbf24" opacity="0.22"
        transform="rotate(-6 800 480)"/>
  <rect x="530" y="398" width="180" height="10" rx="4" fill="#fbbf24" opacity="0.15"
        transform="rotate(-6 800 480)"/>

  <!-- Middle card -->
  <rect x="490" y="300" width="640" height="340" rx="14"
        fill="url(#card2)" opacity="0.82"
        transform="rotate(-1.5 800 470)"/>
  <rect x="545" y="358" width="260" height="14" rx="4" fill="#fbbf24" opacity="0.28"
        transform="rotate(-1.5 800 470)"/>
  <rect x="545" y="386" width="200" height="10" rx="4" fill="#fbbf24" opacity="0.18"
        transform="rotate(-1.5 800 470)"/>
  <rect x="545" y="410" width="150" height="10" rx="4" fill="#fbbf24" opacity="0.12"
        transform="rotate(-1.5 800 470)"/>

  <!-- Front card (hero) -->
  <rect x="500" y="295" width="600" height="320" rx="14"
        fill="url(#card3)" opacity="0.93"
        transform="rotate(3 800 455)"/>
  <!-- Accent bar at top of front card -->
  <rect x="500" y="295" width="600" height="28" rx="14"
        fill="#fbbf24" opacity="0.55"
        transform="rotate(3 800 455)"/>
  <!-- Line bars inside front card -->
  <rect x="548" y="352" width="280" height="15" rx="4" fill="#78350f" opacity="0.45"
        transform="rotate(3 800 455)"/>
  <rect x="548" y="382" width="210" height="11" rx="4" fill="#78350f" opacity="0.30"
        transform="rotate(3 800 455)"/>
  <rect x="548" y="406" width="160" height="11" rx="4" fill="#78350f" opacity="0.22"
        transform="rotate(3 800 455)"/>

  <!-- Layer 3: corner decoration (outside safe zone, purely atmospheric) -->
  <circle cx="120" cy="820" r="180" fill="#c2410c" opacity="0.07"/>
  <circle cx="1480" cy="80" r="140" fill="#d97706" opacity="0.07"/>
</svg>
