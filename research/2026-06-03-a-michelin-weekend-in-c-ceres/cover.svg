<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1209"/>
    </linearGradient>
    <!-- Warm radial glow behind plate -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plate" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c5b0"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="rim" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8d8c4"/>
      <stop offset="100%" stop-color="#c4a882"/>
    </radialGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Wine liquid -->
    <radialGradient id="wine" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Arch gradient -->
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a1508" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Star accent -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm atmospheric glow centered on hero -->
  <ellipse cx="800" cy="450" rx="520" ry="400" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone compliant -->

  <!-- Left arch silhouette (decorative city architecture) -->
  <path d="M 310 810 L 310 490 Q 310 370 410 370 Q 510 370 510 490 L 510 810 Z" fill="url(#arch)" opacity="0.75"/>
  <rect x="310" y="810" width="200" height="30" fill="#3a1508" opacity="0.5"/>

  <!-- Right arch silhouette -->
  <path d="M 1090 810 L 1090 490 Q 1090 370 1190 370 Q 1290 370 1290 490 L 1290 810 Z" fill="url(#arch)" opacity="0.75"/>
  <rect x="1090" y="810" width="200" height="30" fill="#3a1508" opacity="0.5"/>

  <!-- Plate rim (outer circle) -->
  <circle cx="800" cy="460" r="230" fill="url(#rim)" opacity="0.92"/>

  <!-- Plate surface (inner circle) -->
  <circle cx="800" cy="460" r="195" fill="url(#plate)" opacity="0.95"/>

  <!-- Plate inner well -->
  <circle cx="800" cy="460" r="140" fill="#faf8f2" opacity="0.6"/>

  <!-- Food accent — a small artistic dot composition suggesting plated food -->
  <circle cx="800" cy="445" r="28" fill="#c2410c" opacity="0.82"/>
  <circle cx="800" cy="445" r="16" fill="#d97706" opacity="0.75"/>
  <circle cx="763" cy="465" r="10" fill="#9a3309" opacity="0.7"/>
  <circle cx="837" cy="465" r="10" fill="#9a3309" opacity="0.7"/>
  <circle cx="800" cy="478" r="7" fill="#78350f" opacity="0.65"/>

  <!-- Wine glass shape (right of plate) -->
  <!-- Bowl -->
  <ellipse cx="1010" cy="390" rx="52" ry="70" fill="url(#glass)" opacity="0.88"/>
  <!-- Wine fill in bowl -->
  <ellipse cx="1010" cy="428" rx="44" ry="32" fill="url(#wine)" opacity="0.85"/>
  <!-- Stem -->
  <rect x="1005" y="458" width="10" height="110" fill="#9a3309" opacity="0.82"/>
  <!-- Base -->
  <ellipse cx="1010" cy="572" rx="38" ry="10" fill="#78350f" opacity="0.8"/>

  <!-- Michelin star accent above plate -->
  <!-- Six-pointed star composed of two triangles -->
  <polygon points="800,198 812,222 838,222 818,238 826,264 800,248 774,264 782,238 762,222 788,222"
           fill="url(#star)" opacity="0.92"/>
  <!-- Inner star highlight -->
  <polygon points="800,208 808,224 826,224 812,234 818,252 800,242 782,252 788,234 774,224 792,224"
           fill="#fbbf24" opacity="0.55"/>

  <!-- Layer 3: Edge atmosphere (may be cropped — purely decorative) -->
  <!-- Subtle warm horizon bar at bottom -->
  <rect x="0" y="860" width="1600" height="40" fill="#c2410c" opacity="0.12"/>
  <!-- Corner vignette left -->
  <radialGradient id="vign-l" cx="0%" cy="100%" r="60%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect x="0" y="0" width="400" height="900" fill="url(#vign-l)" opacity="0.5"/>
  <!-- Corner vignette right -->
  <radialGradient id="vign-r" cx="100%" cy="100%" r="60%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect x="1200" y="0" width="400" height="900" fill="url(#vign-r)" opacity="0.5"/>
</svg>
