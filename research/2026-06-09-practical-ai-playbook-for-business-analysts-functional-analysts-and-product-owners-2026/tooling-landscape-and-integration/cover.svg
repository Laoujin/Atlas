<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="540" y="230" width="520" height="440" fill="url(#glow)"/>

  <!-- integration edges: tools wiring into the central hub -->
  <g stroke="#6d28d9" stroke-width="6" stroke-opacity="0.55" fill="none">
    <path d="M 560 300 H 720 V 410"/>
    <path d="M 1040 300 H 880 V 410"/>
    <path d="M 560 600 H 720 V 490"/>
    <path d="M 1040 600 H 880 V 490"/>
    <path d="M 470 450 H 700"/>
    <path d="M 1130 450 H 900"/>
  </g>
  <g fill="#6d28d9" fill-opacity="0.7">
    <circle cx="720" cy="450" r="11"/>
    <circle cx="880" cy="450" r="11"/>
  </g>

  <!-- surrounding tool modules (the landscape) -->
  <g fill="#78350f" fill-opacity="0.85">
    <rect x="470" y="250" width="190" height="100" rx="16"/>
    <rect x="940" y="250" width="190" height="100" rx="16"/>
    <rect x="470" y="550" width="190" height="100" rx="16"/>
    <rect x="940" y="550" width="190" height="100" rx="16"/>
  </g>
  <g fill="#fef3ec" fill-opacity="0.7">
    <rect x="500" y="284" width="110" height="14" rx="7"/>
    <rect x="500" y="312" width="80" height="14" rx="7"/>
    <rect x="970" y="284" width="110" height="14" rx="7"/>
    <rect x="970" y="312" width="80" height="14" rx="7"/>
    <rect x="500" y="584" width="110" height="14" rx="7"/>
    <rect x="500" y="612" width="80" height="14" rx="7"/>
    <rect x="970" y="584" width="110" height="14" rx="7"/>
    <rect x="970" y="612" width="80" height="14" rx="7"/>
  </g>

  <!-- hero: the integrated platform at the centre -->
  <rect x="690" y="380" width="220" height="140" rx="24" fill="url(#hero)"/>
  <circle cx="800" cy="450" r="40" fill="#fef3ec" fill-opacity="0.9"/>
  <circle cx="800" cy="450" r="18" fill="#c2410c"/>
</svg>
