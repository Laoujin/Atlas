<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark warm ground -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1206"/>
    </linearGradient>
    <!-- Hero glow: violet center radiating outward -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub gradient -->
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Node fill -->
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Orbit ring gradient -->
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Subtle full-bleed violet atmosphere -->
  <ellipse cx="800" cy="450" rx="820" ry="500" fill="url(#glow)" opacity="0.7"/>

  <!-- Layer 2: Hero element — concentric orbit rings + node graph centered at (800,450) -->

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="370" ry="220"
           fill="none" stroke="url(#ring1)" stroke-width="2" opacity="0.75"/>

  <!-- Middle orbit ring -->
  <ellipse cx="800" cy="450" rx="240" ry="148"
           fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>

  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="128" ry="78"
           fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>

  <!-- Spoke lines: hub to outer nodes -->
  <line x1="800" y1="450" x2="800" y2="230" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
  <line x1="800" y1="450" x2="1060" y2="370" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
  <line x1="800" y1="450" x2="980" y2="620" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
  <line x1="800" y1="450" x2="560" y2="620" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
  <line x1="800" y1="450" x2="510" y2="340" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>

  <!-- Cross-edges between outer nodes -->
  <line x1="800" y1="230" x2="1060" y2="370" stroke="#c2410c" stroke-width="1" opacity="0.35"/>
  <line x1="1060" y1="370" x2="980" y2="620" stroke="#c2410c" stroke-width="1" opacity="0.35"/>
  <line x1="980" y1="620" x2="560" y2="620" stroke="#c2410c" stroke-width="1" opacity="0.35"/>
  <line x1="560" y1="620" x2="510" y2="340" stroke="#c2410c" stroke-width="1" opacity="0.35"/>
  <line x1="510" y1="340" x2="800" y2="230" stroke="#c2410c" stroke-width="1" opacity="0.35"/>

  <!-- Outer orbit nodes -->
  <circle cx="800" cy="230" r="18" fill="url(#node)" opacity="0.9"/>
  <circle cx="1060" cy="370" r="18" fill="url(#node)" opacity="0.9"/>
  <circle cx="980" cy="620" r="18" fill="url(#node)" opacity="0.9"/>
  <circle cx="560" cy="620" r="18" fill="url(#node)" opacity="0.9"/>
  <circle cx="510" cy="340" r="18" fill="url(#node)" opacity="0.9"/>

  <!-- Middle orbit small nodes -->
  <circle cx="800" cy="302" r="10" fill="#6d28d9" opacity="0.8"/>
  <circle cx="1027" cy="450" r="10" fill="#6d28d9" opacity="0.8"/>
  <circle cx="573" cy="450" r="10" fill="#6d28d9" opacity="0.8"/>

  <!-- Hub: central rust disc -->
  <circle cx="800" cy="450" r="52" fill="url(#hub)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="38" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <!-- Hub core dot -->
  <circle cx="800" cy="450" r="14" fill="#fef3ec" opacity="0.85"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Top-left sweep -->
  <path d="M0,0 Q200,120 0,280" fill="none" stroke="#78350f" stroke-width="60" opacity="0.18"/>
  <!-- Bottom-right sweep -->
  <path d="M1600,900 Q1400,780 1600,620" fill="none" stroke="#78350f" stroke-width="60" opacity="0.18"/>
</svg>
