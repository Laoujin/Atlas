<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1a0e"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub-fill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="orbit-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="node-fill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <linearGradient id="spoke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle corner warmth -->
  <ellipse cx="0" cy="900" rx="500" ry="400" fill="#9a3309" opacity="0.12"/>
  <ellipse cx="1600" cy="0" rx="400" ry="350" fill="#6d28d9" opacity="0.08"/>

  <!-- Layer 2: Hero element centered at (800, 450) -->

  <!-- Outer ambient glow -->
  <ellipse cx="800" cy="450" rx="340" ry="320" fill="url(#hub-glow)" opacity="0.9"/>

  <!-- Orbit ring 1 (outer) -->
  <circle cx="800" cy="450" r="280" fill="none" stroke="url(#orbit-fade)" stroke-width="1.5" opacity="0.5"/>
  <!-- Orbit ring 2 (inner) -->
  <circle cx="800" cy="450" r="190" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.45"/>
  <!-- Orbit ring 3 (tight) -->
  <circle cx="800" cy="450" r="112" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.4"/>

  <!-- Spokes from hub to nodes -->
  <line x1="800" y1="450" x2="800" y2="172" stroke="url(#spoke-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="800" y1="450" x2="1066" y2="317" stroke="url(#spoke-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="800" y1="450" x2="1066" y2="583" stroke="url(#spoke-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="800" y1="450" x2="800" y2="728" stroke="url(#spoke-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="800" y1="450" x2="534" y2="583" stroke="url(#spoke-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="800" y1="450" x2="534" y2="317" stroke="url(#spoke-grad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Outer nodes at orbit ring 1 (r=280) — hexagonal arrangement -->
  <!-- Top -->
  <circle cx="800" cy="172" r="22" fill="url(#node-fill)" opacity="0.85" filter="url(#glow-soft)"/>
  <!-- Top-right -->
  <circle cx="1043" cy="310" r="18" fill="url(#node-fill)" opacity="0.75"/>
  <!-- Bottom-right -->
  <circle cx="1043" cy="590" r="22" fill="url(#node-fill)" opacity="0.85" filter="url(#glow-soft)"/>
  <!-- Bottom -->
  <circle cx="800" cy="728" r="18" fill="url(#node-fill)" opacity="0.75"/>
  <!-- Bottom-left -->
  <circle cx="557" cy="590" r="22" fill="url(#node-fill)" opacity="0.85" filter="url(#glow-soft)"/>
  <!-- Top-left -->
  <circle cx="557" cy="310" r="18" fill="url(#node-fill)" opacity="0.75"/>

  <!-- Inner ring nodes (r=190) — document/artifact rectangles -->
  <!-- Right -->
  <rect x="968" y="426" width="44" height="48" rx="5" fill="#c2410c" opacity="0.8"/>
  <rect x="974" y="432" width="32" height="6" rx="2" fill="#fbbf24" opacity="0.7"/>
  <rect x="974" y="442" width="24" height="4" rx="2" fill="#fbbf24" opacity="0.4"/>
  <rect x="974" y="450" width="28" height="4" rx="2" fill="#fbbf24" opacity="0.4"/>
  <!-- Left -->
  <rect x="588" y="426" width="44" height="48" rx="5" fill="#c2410c" opacity="0.8"/>
  <rect x="594" y="432" width="32" height="6" rx="2" fill="#fbbf24" opacity="0.7"/>
  <rect x="594" y="442" width="24" height="4" rx="2" fill="#fbbf24" opacity="0.4"/>
  <rect x="594" y="450" width="28" height="4" rx="2" fill="#fbbf24" opacity="0.4"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="68" fill="#78350f" opacity="0.95"/>
  <circle cx="800" cy="450" r="58" fill="url(#hub-fill)" opacity="0.95" filter="url(#glow-soft)"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="58" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <!-- Hub center dot -->
  <circle cx="800" cy="450" r="16" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="450" r="8" fill="#fff" opacity="0.5"/>

  <!-- Layer 3: Edge decoration (outside safe zone, atmospheric only) -->
  <rect x="0" y="0" width="1600" height="3" fill="#c2410c" opacity="0.3"/>
  <rect x="0" y="897" width="1600" height="3" fill="#c2410c" opacity="0.3"/>
</svg>
