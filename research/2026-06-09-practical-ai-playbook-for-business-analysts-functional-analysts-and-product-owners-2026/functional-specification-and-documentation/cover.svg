<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="pageBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="pageMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="pageHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#faf8f2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineBarShort" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#faf8f2" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle warm glow centred on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="400" fill="url(#glow)"/>

  <!-- Layer 2: Hero — three stacked document pages -->

  <!-- Back page — rotated left -->
  <g transform="rotate(-9, 800, 450)">
    <rect x="540" y="210" width="380" height="490" rx="10" ry="10" fill="url(#pageBack)" opacity="0.82"/>
    <rect x="572" y="268" width="260" height="12" rx="4" fill="url(#lineBar)"/>
    <rect x="572" y="296" width="240" height="10" rx="4" fill="url(#lineBar)"/>
    <rect x="572" y="320" width="220" height="10" rx="4" fill="url(#lineBar)"/>
    <rect x="572" y="354" width="260" height="10" rx="4" fill="url(#lineBar)"/>
    <rect x="572" y="378" width="180" height="10" rx="4" fill="url(#lineBarShort)"/>
  </g>

  <!-- Middle page — rotated right -->
  <g transform="rotate(7, 800, 450)">
    <rect x="590" y="195" width="380" height="490" rx="10" ry="10" fill="url(#pageMid)" opacity="0.88"/>
    <rect x="624" y="255" width="270" height="12" rx="4" fill="url(#lineBar)"/>
    <rect x="624" y="283" width="245" height="10" rx="4" fill="url(#lineBar)"/>
    <rect x="624" y="307" width="210" height="10" rx="4" fill="url(#lineBar)"/>
    <rect x="624" y="341" width="265" height="10" rx="4" fill="url(#lineBar)"/>
    <rect x="624" y="365" width="190" height="10" rx="4" fill="url(#lineBarShort)"/>
    <rect x="624" y="399" width="255" height="10" rx="4" fill="url(#lineBar)"/>
    <rect x="624" y="423" width="160" height="10" rx="4" fill="url(#lineBarShort)"/>
  </g>

  <!-- Front hero page — upright -->
  <rect x="615" y="180" width="370" height="490" rx="10" ry="10" fill="url(#pageHero)" opacity="0.95"/>
  <!-- Subtle fold corner top-right -->
  <path d="M945,180 L945,218 L983,180 Z" fill="#78350f" opacity="0.60"/>
  <!-- Heading bar accent -->
  <rect x="648" y="230" width="200" height="18" rx="5" fill="#fbbf24" opacity="0.85"/>
  <!-- Text line bars on hero page -->
  <rect x="648" y="272" width="280" height="11" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="298" width="255" height="10" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="322" width="235" height="10" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="352" width="280" height="10" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="376" width="200" height="10" rx="4" fill="url(#lineBarShort)"/>
  <rect x="648" y="406" width="275" height="10" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="430" width="220" height="10" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="462" width="180" height="10" rx="4" fill="url(#lineBarShort)"/>
  <!-- Divider rule -->
  <rect x="648" y="492" width="305" height="2" rx="1" fill="#fbbf24" opacity="0.45"/>
  <rect x="648" y="510" width="265" height="10" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="534" width="240" height="10" rx="4" fill="url(#lineBar)"/>
  <rect x="648" y="558" width="195" height="10" rx="4" fill="url(#lineBarShort)"/>

  <!-- Amber accent dot — top-left of hero page, like a status indicator -->
  <circle cx="638" cy="207" r="10" fill="#d97706" opacity="0.90"/>
  <circle cx="662" cy="207" r="6" fill="#fbbf24" opacity="0.70"/>

  <!-- Layer 3: Edge decoration — faint large arc suggesting a broader context -->
  <circle cx="1480" cy="100" r="260" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.10"/>
  <circle cx="120" cy="800" r="180" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.10"/>
</svg>
