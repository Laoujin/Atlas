<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero document gradient -->
    <linearGradient id="docMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="docBack1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="docBack2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3d1a0a" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Node radial glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.2"/>
    </radialGradient>
    <!-- Hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.1"/>
    </radialGradient>
    <!-- Ambient warm glow behind hero -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="600" ry="380" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero element — stacked report/document pages centered at (800, 450) -->

  <!-- Back document (furthest) — offset up-left -->
  <rect x="580" y="235" width="380" height="480" rx="10" ry="10"
        fill="url(#docBack2)" transform="rotate(-8, 770, 475)"/>

  <!-- Mid document — offset slightly right -->
  <rect x="620" y="220" width="380" height="480" rx="10" ry="10"
        fill="url(#docBack1)" transform="rotate(4, 810, 460)"/>

  <!-- Front document (hero face) -->
  <rect x="630" y="210" width="380" height="480" rx="10" ry="10"
        fill="url(#docMain)"/>

  <!-- Document content lines (decorative bars, no text) -->
  <rect x="665" y="270" width="220" height="14" rx="4" fill="#fbbf24" opacity="0.6"/>
  <rect x="665" y="305" width="180" height="10" rx="3" fill="#fef3ec" opacity="0.3"/>
  <rect x="665" y="326" width="200" height="10" rx="3" fill="#fef3ec" opacity="0.25"/>
  <rect x="665" y="347" width="160" height="10" rx="3" fill="#fef3ec" opacity="0.2"/>

  <!-- Divider line -->
  <line x1="665" y1="375" x2="885" y2="375" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>

  <!-- Bar chart bars inside document -->
  <rect x="670" y="440" width="30" height="80" rx="3" fill="#fbbf24" opacity="0.55"/>
  <rect x="712" y="400" width="30" height="120" rx="3" fill="#d97706" opacity="0.6"/>
  <rect x="754" y="420" width="30" height="100" rx="3" fill="#fbbf24" opacity="0.5"/>
  <rect x="796" y="390" width="30" height="130" rx="3" fill="#c2410c" opacity="0.7"/>
  <rect x="838" y="415" width="30" height="105" rx="3" fill="#d97706" opacity="0.55"/>

  <!-- Bottom line row -->
  <rect x="665" y="545" width="150" height="9" rx="3" fill="#fef3ec" opacity="0.2"/>
  <rect x="665" y="562" width="120" height="9" rx="3" fill="#fef3ec" opacity="0.15"/>

  <!-- Layer 3: Stakeholder network nodes and connectors -->

  <!-- Connector lines from document center to nodes -->
  <!-- Top-left node -->
  <line x1="720" y1="320" x2="310" y2="195" stroke="#d97706" stroke-width="2" opacity="0.45"/>
  <!-- Top-right node -->
  <line x1="880" y1="310" x2="1220" y2="180" stroke="#d97706" stroke-width="2" opacity="0.4"/>
  <!-- Bottom-left node -->
  <line x1="680" y1="560" x2="280" y2="680" stroke="#d97706" stroke-width="2" opacity="0.4"/>
  <!-- Bottom-right node -->
  <line x1="970" y1="580" x2="1280" y2="710" stroke="#d97706" stroke-width="2" opacity="0.4"/>
  <!-- Right node -->
  <line x1="1010" y1="450" x2="1300" y2="450" stroke="#d97706" stroke-width="2" opacity="0.35"/>

  <!-- Stakeholder nodes -->
  <!-- Top-left -->
  <circle cx="310" cy="195" r="38" fill="url(#nodeGlow)" opacity="0.85"/>
  <circle cx="310" cy="195" r="22" fill="#9a3309" opacity="0.9"/>
  <!-- Top-right -->
  <circle cx="1220" cy="180" r="34" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="1220" cy="180" r="20" fill="#9a3309" opacity="0.9"/>
  <!-- Bottom-left -->
  <circle cx="280" cy="680" r="40" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="280" cy="680" r="24" fill="#78350f" opacity="0.9"/>
  <!-- Bottom-right -->
  <circle cx="1280" cy="710" r="36" fill="url(#nodeGlow)" opacity="0.75"/>
  <circle cx="1280" cy="710" r="21" fill="#78350f" opacity="0.9"/>
  <!-- Right -->
  <circle cx="1300" cy="450" r="42" fill="url(#nodeGlow)" opacity="0.85"/>
  <circle cx="1300" cy="450" r="25" fill="#9a3309" opacity="0.9"/>

  <!-- Hub dot on the front document (central connection point) -->
  <circle cx="820" cy="450" r="16" fill="url(#hubGlow)" opacity="0.9"/>
  <circle cx="820" cy="450" r="7" fill="#fbbf24" opacity="1"/>

  <!-- Decorative corner accents (outside safe zone, purely atmospheric) -->
  <circle cx="0" cy="0" r="180" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.15"/>
  <circle cx="1600" cy="900" r="200" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.12"/>
</svg>
