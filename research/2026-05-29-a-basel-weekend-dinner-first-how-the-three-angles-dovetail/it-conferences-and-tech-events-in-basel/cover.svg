<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rhine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm glow behind tower -->
  <circle cx="800" cy="450" r="420" fill="url(#glow)"/>

  <!-- Rhine river bend (decorative, partially in safe zone) -->
  <path d="M 80 720 Q 500 660 800 740 T 1520 700 L 1520 760 Q 1100 820 800 790 T 80 780 Z" fill="url(#rhine)" opacity="0.7"/>

  <!-- Concentric orbits (conference connections) -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35"/>
  <circle cx="800" cy="450" r="220" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.45"/>

  <!-- Hero: Messeturm-inspired tower silhouette, centered -->
  <g>
    <!-- Tower shaft -->
    <rect x="730" y="180" width="140" height="560" fill="url(#tower)" opacity="0.95"/>
    <!-- Tower crown -->
    <rect x="710" y="160" width="180" height="30" fill="#78350f" opacity="0.9"/>
    <!-- Antenna -->
    <rect x="796" y="100" width="8" height="60" fill="#5c2a1a"/>
    <!-- Window grid lines (faint horizontals only — atmospheric, not text-like) -->
    <g stroke="#fbbf24" stroke-width="1" opacity="0.45">
      <line x1="730" y1="240" x2="870" y2="240"/>
      <line x1="730" y1="290" x2="870" y2="290"/>
      <line x1="730" y1="340" x2="870" y2="340"/>
      <line x1="730" y1="390" x2="870" y2="390"/>
      <line x1="730" y1="440" x2="870" y2="440"/>
      <line x1="730" y1="490" x2="870" y2="490"/>
      <line x1="730" y1="540" x2="870" y2="540"/>
      <line x1="730" y1="590" x2="870" y2="590"/>
      <line x1="730" y1="640" x2="870" y2="640"/>
      <line x1="730" y1="690" x2="870" y2="690"/>
    </g>
    <!-- Vertical accent dividing the shaft -->
    <line x1="800" y1="190" x2="800" y2="740" stroke="#5c2a1a" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- Connection nodes around the tower (conference/community graph) -->
  <g fill="#c2410c">
    <circle cx="500" cy="350" r="14" opacity="0.85"/>
    <circle cx="1100" cy="320" r="18" opacity="0.9"/>
    <circle cx="450" cy="560" r="12" opacity="0.8"/>
    <circle cx="1150" cy="580" r="16" opacity="0.85"/>
    <circle cx="600" cy="220" r="10" opacity="0.75"/>
    <circle cx="1020" cy="660" r="11" opacity="0.8"/>
  </g>

  <!-- Edges connecting nodes to tower hub -->
  <g stroke="#9a3309" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="500" y1="350" x2="730" y2="420"/>
    <line x1="1100" y1="320" x2="870" y2="400"/>
    <line x1="450" y1="560" x2="730" y2="540"/>
    <line x1="1150" y1="580" x2="870" y2="560"/>
    <line x1="600" y1="220" x2="780" y2="300"/>
    <line x1="1020" y1="660" x2="850" y2="640"/>
  </g>

  <!-- Tower base shadow grounding -->
  <ellipse cx="800" cy="745" rx="120" ry="10" fill="#5c2a1a" opacity="0.35"/>
</svg>
