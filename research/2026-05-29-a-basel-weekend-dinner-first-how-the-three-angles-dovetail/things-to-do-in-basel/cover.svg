<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="munster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rhine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm sun glow behind spires -->
  <circle cx="800" cy="430" r="320" fill="url(#sun)"/>

  <!-- Münster: twin spires + nave block, centered ~(800, 450) -->
  <!-- left spire -->
  <polygon points="640,180 600,560 700,560" fill="url(#munster)" opacity="0.95"/>
  <rect x="610" y="540" width="80" height="40" fill="#78350f" opacity="0.9"/>
  <!-- right spire -->
  <polygon points="960,180 900,560 1000,560" fill="url(#munster)" opacity="0.95"/>
  <rect x="910" y="540" width="80" height="40" fill="#78350f" opacity="0.9"/>
  <!-- nave between spires -->
  <rect x="690" y="380" width="220" height="200" fill="#9a3309" opacity="0.9"/>
  <!-- rose window -->
  <circle cx="800" cy="455" r="34" fill="#fef3ec" opacity="0.6"/>
  <circle cx="800" cy="455" r="18" fill="#fbbf24" opacity="0.7"/>
  <!-- roof ridge -->
  <polygon points="690,380 800,330 910,380" fill="#78350f" opacity="0.95"/>

  <!-- Mittlere Brücke: arched bridge over the Rhine -->
  <path d="M 180 640 Q 800 580 1420 640 L 1420 670 Q 800 612 180 670 Z" fill="#78350f" opacity="0.9"/>
  <!-- bridge piers -->
  <rect x="430" y="640" width="22" height="60" fill="#5c2a1a" opacity="0.85"/>
  <rect x="790" y="618" width="22" height="82" fill="#5c2a1a" opacity="0.85"/>
  <rect x="1150" y="640" width="22" height="60" fill="#5c2a1a" opacity="0.85"/>

  <!-- Rhine: flowing band -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#rhine)"/>
  <!-- current ripples -->
  <path d="M 0 740 Q 200 730 400 740 T 800 740 T 1200 740 T 1600 740" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M 0 790 Q 240 780 480 790 T 960 790 T 1440 790 T 1600 790" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M 0 840 Q 180 830 360 840 T 720 840 T 1080 840 T 1440 840 T 1600 840" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
