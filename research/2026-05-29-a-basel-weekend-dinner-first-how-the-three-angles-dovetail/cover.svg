<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="rhine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant hill / far bank -->
  <path d="M0,640 L260,610 L520,625 L860,605 L1180,620 L1600,600 L1600,720 L0,720 Z" fill="#78350f" opacity="0.35"/>

  <!-- soft sun/plate disc, off to the right as a counterpoint moon -->
  <circle cx="1260" cy="310" r="180" fill="url(#moon)"/>
  <circle cx="1260" cy="310" r="92" fill="#fef3ec" opacity="0.9"/>
  <circle cx="1260" cy="310" r="92" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.5"/>
  <circle cx="1260" cy="310" r="62" fill="none" stroke="#9a3309" stroke-width="1.2" opacity="0.45"/>

  <!-- Münster: twin spired towers as hero, centered ~ (720, 470) -->
  <!-- main cathedral body -->
  <path d="M520,720 L520,540 L560,540 L560,510 L600,510 L600,540 L680,540 L680,500 L760,500 L760,540 L840,540 L840,510 L880,510 L880,540 L920,540 L920,720 Z" fill="url(#stone)" opacity="0.95"/>

  <!-- left tower -->
  <path d="M580,540 L580,300 L600,260 L620,300 L620,540 Z" fill="url(#stone)"/>
  <polygon points="580,300 600,180 620,300" fill="#78350f"/>
  <rect x="595" y="380" width="10" height="40" fill="#1a0e0e" opacity="0.5"/>
  <rect x="595" y="440" width="10" height="40" fill="#1a0e0e" opacity="0.5"/>

  <!-- right tower (slightly different height — the Münster's towers are asymmetric) -->
  <path d="M820,540 L820,330 L840,290 L860,330 L860,540 Z" fill="url(#stone)"/>
  <polygon points="820,330 840,220 860,330" fill="#78350f"/>
  <rect x="835" y="400" width="10" height="40" fill="#1a0e0e" opacity="0.5"/>
  <rect x="835" y="460" width="10" height="40" fill="#1a0e0e" opacity="0.5"/>

  <!-- central rose window -->
  <circle cx="720" cy="600" r="34" fill="#fbbf24" opacity="0.85"/>
  <circle cx="720" cy="600" r="34" fill="none" stroke="#1a0e0e" stroke-width="2" opacity="0.6"/>
  <line x1="686" y1="600" x2="754" y2="600" stroke="#1a0e0e" stroke-width="1.5" opacity="0.6"/>
  <line x1="720" y1="566" x2="720" y2="634" stroke="#1a0e0e" stroke-width="1.5" opacity="0.6"/>

  <!-- arched windows on nave -->
  <path d="M640,660 Q650,640 660,660 L660,700 L640,700 Z" fill="#1a0e0e" opacity="0.45"/>
  <path d="M780,660 Q790,640 800,660 L800,700 L780,700 Z" fill="#1a0e0e" opacity="0.45"/>

  <!-- the Rhine: flowing band across the foreground -->
  <path d="M0,720 L1600,720 L1600,900 L0,900 Z" fill="url(#rhine)"/>

  <!-- ripples on the river -->
  <path d="M120,760 Q220,752 320,760 T520,760" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.45"/>
  <path d="M420,800 Q540,790 660,800 T900,800" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.35"/>
  <path d="M820,780 Q940,772 1060,780 T1300,780" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <path d="M1080,830 Q1200,822 1320,830 T1520,830" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.3"/>

  <!-- a single Wickelfisch-style float drifting in the Rhine -->
  <ellipse cx="380" cy="820" rx="46" ry="14" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="380" cy="816" rx="46" ry="6" fill="#fef3ec" opacity="0.55"/>

  <!-- reflection hint of the tower in the water -->
  <rect x="595" y="720" width="10" height="60" fill="#fbbf24" opacity="0.2"/>
  <rect x="835" y="720" width="10" height="50" fill="#fbbf24" opacity="0.2"/>
</svg>
