<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: rust to violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c2410c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>

    <!-- Radial glow for latent core -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#d97706;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0" />
    </radialGradient>

    <!-- Soft highlight for sphere edges -->
    <radialGradient id="sphereShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Hero: VAE latent space encoding/decoding -->

  <!-- Outer encoder orbit (faint guide circles) -->
  <circle cx="800" cy="450" r="280" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.2" />
  <circle cx="800" cy="450" r="200" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.15" />

  <!-- Node trail left (encoder input) -->
  <g opacity="0.6">
    <circle cx="520" cy="350" r="8" fill="#d97706" />
    <circle cx="580" cy="380" r="6" fill="#c2410c" />
    <circle cx="630" cy="410" r="5" fill="#9a3309" />
    <line x1="520" y1="350" x2="630" y2="410" stroke="#fbbf24" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Node trail right (decoder output) -->
  <g opacity="0.6">
    <circle cx="1080" cy="350" r="8" fill="#d97706" />
    <circle cx="1020" cy="380" r="6" fill="#c2410c" />
    <circle cx="970" cy="410" r="5" fill="#9a3309" />
    <line x1="1080" y1="350" x2="970" y2="410" stroke="#fbbf24" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Latent space core: concentric compressed spheres -->
  <!-- Outer compression layer (encoder boundary) -->
  <circle cx="800" cy="450" r="120" fill="#6d28d9" opacity="0.25" />
  <circle cx="800" cy="450" r="120" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" />

  <!-- Middle latent sphere (the essence) -->
  <circle cx="800" cy="450" r="80" fill="url(#coreGlow)" />
  <circle cx="800" cy="450" r="80" fill="url(#sphereShine)" />
  <circle cx="800" cy="450" r="80" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7" />

  <!-- Inner high-density core -->
  <circle cx="800" cy="450" r="45" fill="#fbbf24" opacity="0.85" />
  <circle cx="800" cy="450" r="45" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.6" />

  <!-- Decoder expansion glow (subtle) -->
  <circle cx="800" cy="450" r="150" fill="none" stroke="#6d28d9" stroke-width="3" opacity="0.15" stroke-dasharray="8,4" />

  <!-- Accent nodes on vertical axis (dimensional collapse) -->
  <g opacity="0.7">
    <circle cx="800" cy="280" r="5" fill="#fbbf24" />
    <circle cx="800" cy="620" r="5" fill="#fbbf24" />
    <line x1="800" y1="280" x2="800" y2="620" stroke="#fbbf24" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Small decorative nodes at cardinal points (latent dimensions) -->
  <circle cx="950" cy="450" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="650" cy="450" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="800" cy="300" r="4" fill="#d97706" opacity="0.8" />
  <circle cx="800" cy="600" r="4" fill="#d97706" opacity="0.8" />
</svg>