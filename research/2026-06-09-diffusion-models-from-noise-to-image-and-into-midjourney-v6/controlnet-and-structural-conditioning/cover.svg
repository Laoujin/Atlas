<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="struct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint corner rings, cropped freely -->
  <circle cx="120" cy="150" r="220" fill="none" stroke="#d97706" stroke-width="3" opacity="0.12"/>
  <circle cx="1480" cy="780" r="260" fill="none" stroke="#9a3309" stroke-width="3" opacity="0.12"/>

  <!-- HERO -->
  <!-- conditioning structure block (edge/skeleton map) -->
  <rect x="360" y="270" width="360" height="360" rx="26" fill="url(#struct)" opacity="0.95"/>
  <g stroke="#fbbf24" stroke-width="5" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M430 560 L470 400 L560 470 L600 350 L660 440"/>
    <path d="M430 470 L520 520 L610 410 L660 540"/>
    <circle cx="470" cy="400" r="9" fill="#fef3ec" stroke="none"/>
    <circle cx="600" cy="350" r="9" fill="#fef3ec" stroke="none"/>
    <circle cx="610" cy="410" r="9" fill="#fef3ec" stroke="none"/>
  </g>

  <!-- generated output block (glow) -->
  <rect x="880" y="270" width="360" height="360" rx="26" fill="url(#glow)" opacity="0.95"/>
  <circle cx="1060" cy="430" r="118" fill="#fef3ec" opacity="0.30"/>

  <!-- conditioning flow: spark/arc bridging structure -> output -->
  <path d="M720 450 C 790 380, 810 520, 880 450" fill="none" stroke="#c2410c" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <circle cx="800" cy="447" r="15" fill="#fbbf24" opacity="0.95"/>
</svg>
