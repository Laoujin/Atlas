<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Central hub radial glow -->
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>

    <!-- Hub core -->
    <radialGradient id="hub-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Output beam gradient (right side) -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>

    <!-- Token node: violet secondary -->
    <radialGradient id="node-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>

    <!-- Token node: rust -->
    <radialGradient id="node-rust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Input beam gradient (left side) -->
    <linearGradient id="input-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed edge vignette -->
  <rect width="1600" height="900" fill="#1a0e0e" opacity="0.35"/>
  <radialGradient id="vignette-clear" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette-clear)"/>

  <!-- Layer 2: Hero element — CLIP conditioning graph centered at (800, 450) -->

  <!-- Large hub glow bloom (background warmth) -->
  <ellipse cx="800" cy="450" rx="320" ry="260" fill="url(#hub-glow)" opacity="0.45"/>

  <!-- Input beam from left: text tokens flowing in -->
  <rect x="160" y="415" width="570" height="70" rx="35" fill="url(#input-beam)" opacity="0.85"/>

  <!-- Output beam to right: conditioned latent flowing out -->
  <rect x="870" y="415" width="570" height="70" rx="35" fill="url(#beam)" opacity="0.75"/>

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="280" ry="185" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.22"/>

  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="175" ry="115" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.30"/>

  <!-- Edge lines: token nodes to hub (drawn before nodes so hub sits on top) -->
  <!-- Token A top-left -->
  <line x1="575" y1="308" x2="780" y2="435" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <!-- Token B left -->
  <line x1="528" y1="450" x2="770" y2="450" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <!-- Token C bottom-left -->
  <line x1="578" y1="595" x2="780" y2="465" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <!-- Token D top-right -->
  <line x1="1022" y1="308" x2="820" y2="435" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
  <!-- Token E right -->
  <line x1="1072" y1="450" x2="830" y2="450" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
  <!-- Token F bottom-right -->
  <line x1="1022" y1="595" x2="820" y2="465" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>

  <!-- Token nodes on outer orbit — violet (text-side) -->
  <circle cx="575" cy="308" r="22" fill="url(#node-violet)" opacity="0.88"/>
  <circle cx="528" cy="450" r="22" fill="url(#node-violet)" opacity="0.88"/>
  <circle cx="578" cy="595" r="22" fill="url(#node-violet)" opacity="0.88"/>

  <!-- Token nodes on outer orbit — rust (image-side) -->
  <circle cx="1022" cy="308" r="22" fill="url(#node-rust)" opacity="0.85"/>
  <circle cx="1072" cy="450" r="22" fill="url(#node-rust)" opacity="0.85"/>
  <circle cx="1022" cy="595" r="22" fill="url(#node-rust)" opacity="0.85"/>

  <!-- Central hub: the CLIP encoder / conditioning core -->
  <circle cx="800" cy="450" r="78" fill="url(#hub-core)" opacity="0.95"/>

  <!-- Hub inner accent ring -->
  <circle cx="800" cy="450" r="78" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.55"/>

  <!-- Hub center dot -->
  <circle cx="800" cy="450" r="22" fill="#fbbf24" opacity="0.95"/>

  <!-- Layer 3: Corner decorations (outside safe zone — purely atmospheric) -->
  <!-- Top-left arc sweep -->
  <path d="M 0,0 Q 200,0 200,200" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.18"/>
  <!-- Bottom-right arc sweep -->
  <path d="M 1600,900 Q 1400,900 1400,700" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.18"/>
</svg>
