<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Rust radial glow for center node -->
    <radialGradient id="rustGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="35%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Noise haze gradient for outer diffusion rings -->
    <radialGradient id="noiseHaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Violet step fill -->
    <radialGradient id="violetStep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Schedule arc gradient -->
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="url(#noiseHaze)" opacity="0.4"/>

  <!-- Layer 3: Corner decoration (outside safe zone, no meaning lost if clipped) -->
  <circle cx="0" cy="0" r="280" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.12"/>
  <circle cx="1600" cy="900" r="320" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.12"/>

  <!-- Layer 2: Hero — forward diffusion steps centered at (800, 450) -->

  <!-- Step 3 (most noise) — outermost diffusion shell, ellipse ~900×560 -->
  <ellipse cx="800" cy="450" rx="430" ry="268" fill="none" stroke="#6d28d9" stroke-width="1.8" opacity="0.38"/>
  <ellipse cx="800" cy="450" rx="430" ry="268" fill="#6d28d9" fill-opacity="0.07"/>

  <!-- Noise scatter dots for step 3 — small circles on the ring perimeter -->
  <circle cx="1224" cy="450" r="5" fill="#6d28d9" opacity="0.45"/>
  <circle cx="376"  cy="450" r="5" fill="#6d28d9" opacity="0.45"/>
  <circle cx="1170" cy="310" r="4" fill="#6d28d9" opacity="0.38"/>
  <circle cx="430"  cy="590" r="4" fill="#6d28d9" opacity="0.38"/>
  <circle cx="1100" cy="640" r="4" fill="#6d28d9" opacity="0.30"/>
  <circle cx="500"  cy="260" r="4" fill="#6d28d9" opacity="0.30"/>
  <circle cx="940"  cy="718" r="3" fill="#9a3309" opacity="0.40"/>
  <circle cx="660"  cy="182" r="3" fill="#9a3309" opacity="0.40"/>

  <!-- Step 2 (medium noise) — mid ring ~560×348 -->
  <ellipse cx="800" cy="450" rx="275" ry="174" fill="none" stroke="#d97706" stroke-width="2.2" opacity="0.52"/>
  <ellipse cx="800" cy="450" rx="275" ry="174" fill="url(#violetStep)" fill-opacity="0.22"/>

  <!-- Noise scatter dots for step 2 -->
  <circle cx="1074" cy="450" r="5" fill="#d97706" opacity="0.55"/>
  <circle cx="526"  cy="450" r="5" fill="#d97706" opacity="0.55"/>
  <circle cx="1010" cy="340" r="4" fill="#d97706" opacity="0.45"/>
  <circle cx="590"  cy="560" r="4" fill="#d97706" opacity="0.45"/>
  <circle cx="936"  cy="596" r="3" fill="#c2410c" opacity="0.40"/>
  <circle cx="664"  cy="304" r="3" fill="#c2410c" opacity="0.40"/>

  <!-- Step 1 (low noise) — inner ring ~320×198 -->
  <ellipse cx="800" cy="450" rx="155" ry="99" fill="none" stroke="#c2410c" stroke-width="2.8" opacity="0.75"/>
  <ellipse cx="800" cy="450" rx="155" ry="99" fill="#9a3309" fill-opacity="0.28"/>

  <!-- Step 0 — core solid image node (rust glow) -->
  <circle cx="800" cy="450" r="62" fill="url(#rustGlow)" opacity="0.92"/>
  <circle cx="800" cy="450" r="38" fill="#fbbf24" opacity="0.82"/>
  <circle cx="800" cy="450" r="18" fill="#fff8f0" opacity="0.70"/>

  <!-- Schedule curve arc: a path from lower-left to upper-right suggesting β(t) -->
  <!-- Cubic bezier from ~(300, 680) to ~(1300, 220) with control points that give a convex noise schedule shape -->
  <path d="M 300 680 C 520 660, 900 380, 1300 220"
        fill="none" stroke="url(#arcGrad)" stroke-width="2.5"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Small endpoint markers on the arc -->
  <circle cx="300" cy="680" r="7" fill="#c2410c" opacity="0.70"/>
  <circle cx="1300" cy="220" r="7" fill="#6d28d9" opacity="0.70"/>

  <!-- Connector tick marks along arc (schedule ticks) -->
  <line x1="550"  y1="648" x2="550"  y2="668" stroke="#d97706" stroke-width="2" opacity="0.50"/>
  <line x1="800"  y1="530" x2="800"  y2="550" stroke="#d97706" stroke-width="2" opacity="0.50"/>
  <line x1="1050" y1="358" x2="1050" y2="378" stroke="#6d28d9" stroke-width="2" opacity="0.50"/>
</svg>
