<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2d0f1e"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#0d0808"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitFade1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbitFade2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="25%" stop-color="#c2410c" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#c2410c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle outer glow behind hero -->
  <ellipse cx="800" cy="450" rx="620" ry="420" fill="url(#outerGlow)"/>

  <!-- Layer 2: Hero — diffusion orbits + denoising nodes centered at (800,450) -->

  <!-- Violet ambient glow -->
  <ellipse cx="800" cy="450" rx="480" ry="340" fill="url(#glow)"/>

  <!-- Orbit ring 3 — outermost, faint violet -->
  <ellipse cx="800" cy="450" rx="430" ry="260" fill="none" stroke="url(#orbitFade1)" stroke-width="1.2" opacity="0.45"/>

  <!-- Orbit ring 2 — mid rust -->
  <ellipse cx="800" cy="450" rx="300" ry="182" fill="none" stroke="url(#orbitFade2)" stroke-width="1.8" opacity="0.65"/>

  <!-- Orbit ring 1 — inner violet -->
  <ellipse cx="800" cy="450" rx="178" ry="108" fill="none" stroke="#6d28d9" stroke-width="2" opacity="0.7"/>

  <!-- Noise/diffusion nodes on outermost orbit — scattered, low opacity -->
  <circle cx="370" cy="450" r="5" fill="#6d28d9" opacity="0.5"/>
  <circle cx="1230" cy="450" r="5" fill="#6d28d9" opacity="0.5"/>
  <circle cx="490" cy="234" r="4" fill="#6d28d9" opacity="0.4"/>
  <circle cx="1110" cy="666" r="4" fill="#6d28d9" opacity="0.4"/>
  <circle cx="1110" cy="234" r="4" fill="#6d28d9" opacity="0.35"/>
  <circle cx="490" cy="666" r="4" fill="#6d28d9" opacity="0.35"/>

  <!-- Nodes on mid orbit — becoming more defined -->
  <circle cx="500" cy="450" r="6" fill="#c2410c" opacity="0.6"/>
  <circle cx="1100" cy="450" r="6" fill="#c2410c" opacity="0.6"/>
  <circle cx="590" cy="290" r="5" fill="#d97706" opacity="0.55"/>
  <circle cx="1010" cy="610" r="5" fill="#d97706" opacity="0.55"/>
  <circle cx="1010" cy="290" r="5" fill="#c2410c" opacity="0.5"/>
  <circle cx="590" cy="610" r="5" fill="#c2410c" opacity="0.5"/>

  <!-- Nodes on inner orbit — sharply defined -->
  <circle cx="622" cy="450" r="7" fill="#fbbf24" opacity="0.75"/>
  <circle cx="978" cy="450" r="7" fill="#fbbf24" opacity="0.75"/>
  <circle cx="680" cy="352" r="6" fill="#d97706" opacity="0.8"/>
  <circle cx="920" cy="548" r="6" fill="#d97706" opacity="0.8"/>
  <circle cx="920" cy="352" r="6" fill="#fbbf24" opacity="0.75"/>
  <circle cx="680" cy="548" r="6" fill="#fbbf24" opacity="0.75"/>

  <!-- Convergence lines from outer nodes toward hub — faint, violet -->
  <line x1="500" y1="450" x2="730" y2="450" stroke="#6d28d9" stroke-width="1" opacity="0.22"/>
  <line x1="1100" y1="450" x2="870" y2="450" stroke="#6d28d9" stroke-width="1" opacity="0.22"/>
  <line x1="590" y1="290" x2="720" y2="390" stroke="#6d28d9" stroke-width="1" opacity="0.18"/>
  <line x1="1010" y1="610" x2="880" y2="510" stroke="#6d28d9" stroke-width="1" opacity="0.18"/>
  <line x1="1010" y1="290" x2="880" y2="390" stroke="#6d28d9" stroke-width="1" opacity="0.18"/>
  <line x1="590" y1="610" x2="720" y2="510" stroke="#6d28d9" stroke-width="1" opacity="0.18"/>

  <!-- Central hub — the resolved image focal point -->
  <circle cx="800" cy="450" r="68" fill="url(#hub)" opacity="0.92"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="74" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Faint violet wash top-left -->
  <ellipse cx="0" cy="0" rx="260" ry="200" fill="#6d28d9" opacity="0.07"/>
  <!-- Faint rust wash bottom-right -->
  <ellipse cx="1600" cy="900" rx="280" ry="210" fill="#9a3309" opacity="0.09"/>
</svg>
