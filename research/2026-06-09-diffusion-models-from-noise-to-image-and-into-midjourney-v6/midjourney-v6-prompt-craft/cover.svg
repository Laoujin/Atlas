<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3a1810"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="0.8" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- noise field: scattered violet-tinted dots resolving toward the rust core -->
  <g fill="#6d28d9" opacity="0.5">
    <circle cx="220" cy="180" r="7"/><circle cx="330" cy="640" r="6"/>
    <circle cx="180" cy="430" r="8"/><circle cx="430" cy="280" r="5"/>
    <circle cx="290" cy="760" r="7"/><circle cx="510" cy="700" r="6"/>
    <circle cx="1380" cy="220" r="7"/><circle cx="1290" cy="650" r="6"/>
    <circle cx="1420" cy="470" r="8"/><circle cx="1180" cy="170" r="5"/>
    <circle cx="1330" cy="760" r="7"/><circle cx="1100" cy="710" r="6"/>
    <circle cx="640" cy="150" r="5"/><circle cx="980" cy="160" r="6"/>
    <circle cx="700" cy="790" r="6"/><circle cx="920" cy="800" r="5"/>
  </g>
  <g fill="#d97706" opacity="0.6">
    <circle cx="560" cy="360" r="9"/><circle cx="1060" cy="560" r="9"/>
    <circle cx="600" cy="560" r="8"/><circle cx="1020" cy="350" r="8"/>
    <circle cx="780" cy="240" r="7"/><circle cx="820" cy="660" r="7"/>
  </g>

  <!-- violet halo behind hero -->
  <circle cx="800" cy="450" r="360" fill="url(#halo)"/>

  <!-- hero: rust diffusion bloom resolving from noise -->
  <circle cx="800" cy="450" r="280" fill="url(#core)"/>
  <circle cx="800" cy="450" r="150" fill="#fef3ec" opacity="0.92"/>
  <circle cx="800" cy="450" r="92" fill="#c2410c" opacity="0.9"/>
</svg>
