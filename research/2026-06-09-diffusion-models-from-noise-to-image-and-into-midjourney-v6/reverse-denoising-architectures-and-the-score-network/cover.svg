<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#2a1410"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#120808"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="78%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24" fill-opacity="0.85"/>
    </marker>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- noise field, outer (decoration, gets cropped) -->
  <g fill="#9a3309" fill-opacity="0.35">
    <circle cx="180" cy="160" r="5"/><circle cx="320" cy="90" r="4"/>
    <circle cx="120" cy="430" r="6"/><circle cx="240" cy="640" r="4"/>
    <circle cx="430" cy="780" r="5"/><circle cx="1480" cy="180" r="5"/>
    <circle cx="1380" cy="100" r="4"/><circle cx="1520" cy="520" r="6"/>
    <circle cx="1340" cy="720" r="4"/><circle cx="1180" cy="800" r="5"/>
  </g>

  <!-- halo behind hero -->
  <circle cx="800" cy="450" r="330" fill="url(#halo)"/>

  <!-- score field: vectors converging from noise toward the structured core -->
  <g stroke="#d97706" stroke-opacity="0.6" stroke-width="3" marker-end="url(#ah)" fill="none">
    <path d="M470,250 Q580,330 640,375"/>
    <path d="M1130,250 Q1020,330 960,375"/>
    <path d="M470,650 Q580,570 640,525"/>
    <path d="M1130,650 Q1020,570 960,525"/>
    <path d="M800,160 L800,300"/>
    <path d="M800,740 L800,600"/>
    <path d="M380,450 L560,450"/>
    <path d="M1220,450 L1040,450"/>
  </g>

  <!-- transformer / U-Net structured lattice emerging at center -->
  <g stroke="url(#vio)" stroke-width="2.5" stroke-opacity="0.85" fill="none">
    <rect x="700" y="350" width="200" height="200" rx="8"/>
    <line x1="700" y1="417" x2="900" y2="417"/>
    <line x1="700" y1="483" x2="900" y2="483"/>
    <line x1="767" y1="350" x2="767" y2="550"/>
    <line x1="833" y1="350" x2="833" y2="550"/>
  </g>

  <!-- hero: emergent structured core -->
  <circle cx="800" cy="450" r="120" fill="url(#core)" fill-opacity="0.95"/>
  <circle cx="800" cy="450" r="120" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="800" cy="450" r="58" fill="#fef3ec" fill-opacity="0.18"/>
</svg>
