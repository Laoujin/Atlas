<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="villa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="1100" cy="430" r="280" fill="url(#sun)"/>

  <!-- distant pilgrimage hill (Sacro Monte) behind -->
  <path d="M 0 540 Q 280 380 560 480 Q 780 420 980 500 Q 1240 430 1600 510 L 1600 600 L 0 600 Z"
        fill="#5c2a1a" opacity="0.75"/>

  <!-- nearer ridge -->
  <path d="M 0 600 Q 360 520 700 580 Q 1020 540 1380 590 L 1600 580 L 1600 640 L 0 640 Z"
        fill="#9a3309" opacity="0.7"/>

  <!-- small island (Isola San Giulio) on the lake -->
  <ellipse cx="430" cy="650" rx="95" ry="14" fill="#78350f" opacity="0.85"/>
  <path d="M 365 650 Q 380 605 410 612 L 420 580 L 430 612 Q 470 600 495 650 Z"
        fill="#5c2a1a"/>
  <rect x="416" y="572" width="6" height="22" fill="#5c2a1a"/>

  <!-- water -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#water)"/>

  <!-- water highlights -->
  <path d="M 100 700 L 1500 700" stroke="#fbbf24" stroke-width="1" opacity="0.35"/>
  <path d="M 200 740 L 1400 740" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <path d="M 300 780 L 1300 780" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>

  <!-- HERO: Villa Crespi silhouette, centered ~ (800, 500) -->
  <g>
    <!-- main villa body -->
    <rect x="700" y="500" width="220" height="140" fill="url(#villa)"/>
    <!-- side wing -->
    <rect x="640" y="540" width="80" height="100" fill="#9a3309"/>
    <!-- roof line -->
    <path d="M 700 500 L 810 460 L 920 500 Z" fill="#78350f"/>
    <path d="M 640 540 L 680 510 L 720 540 Z" fill="#5c2a1a"/>

    <!-- moorish minaret tower (hero accent) -->
    <rect x="845" y="360" width="50" height="180" fill="url(#villa)"/>
    <!-- balcony ring -->
    <rect x="838" y="395" width="64" height="8" fill="#fbbf24" opacity="0.9"/>
    <!-- onion dome -->
    <path d="M 845 360 Q 820 340 845 320 Q 855 305 870 300 Q 885 305 895 320 Q 920 340 895 360 Z"
          fill="#c2410c"/>
    <!-- spire -->
    <path d="M 868 300 L 870 270 L 872 300 Z" fill="#fbbf24"/>
    <circle cx="870" cy="305" r="4" fill="#fbbf24"/>

    <!-- arched windows on villa -->
    <path d="M 730 560 Q 730 540 745 540 Q 760 540 760 560 L 760 600 L 730 600 Z" fill="#fbbf24" opacity="0.85"/>
    <path d="M 780 560 Q 780 540 795 540 Q 810 540 810 560 L 810 600 L 780 600 Z" fill="#fbbf24" opacity="0.85"/>
    <path d="M 830 560 Q 830 540 845 540 Q 860 540 860 560 L 860 600 L 830 600 Z" fill="#fbbf24" opacity="0.7"/>
    <path d="M 880 560 Q 880 540 895 540 Q 910 540 910 560 L 910 600 L 880 600 Z" fill="#fbbf24" opacity="0.7"/>

    <!-- tower window -->
    <path d="M 858 440 Q 858 425 870 425 Q 882 425 882 440 L 882 470 L 858 470 Z" fill="#fbbf24" opacity="0.9"/>

    <!-- villa reflection in water -->
    <g opacity="0.35" transform="translate(0,1280) scale(1,-1)">
      <rect x="700" y="500" width="220" height="140" fill="#78350f"/>
      <rect x="640" y="540" width="80" height="100" fill="#5c2a1a"/>
      <rect x="845" y="360" width="50" height="180" fill="#78350f"/>
      <path d="M 845 360 Q 820 340 845 320 Q 855 305 870 300 Q 885 305 895 320 Q 920 340 895 360 Z" fill="#9a3309"/>
    </g>
  </g>
</svg>
