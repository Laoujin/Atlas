<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.42" r="0.35">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant hills (back layer) -->
  <path d="M0 540 L160 470 L320 500 L500 440 L700 480 L900 430 L1120 470 L1320 440 L1600 480 L1600 620 L0 620 Z"
        fill="#78350f" opacity="0.7"/>

  <!-- nearer wooded hills -->
  <path d="M0 600 L180 540 L360 580 L560 520 L780 560 L1000 510 L1240 555 L1460 520 L1600 545 L1600 660 L0 660 Z"
        fill="url(#hill)" opacity="0.85"/>

  <!-- lake plane -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#lake)"/>

  <!-- lake reflection bands -->
  <rect x="0" y="700" width="1600" height="3" fill="#fbbf24" opacity="0.25"/>
  <rect x="0" y="740" width="1600" height="2" fill="#fef3ec" opacity="0.2"/>
  <rect x="0" y="790" width="1600" height="2" fill="#fbbf24" opacity="0.18"/>

  <!-- Villa Crespi accent on left: Moorish minaret tower silhouette -->
  <g opacity="0.9">
    <!-- main villa block -->
    <rect x="360" y="500" width="160" height="135" fill="#1a0e0e" opacity="0.78"/>
    <!-- minaret shaft -->
    <rect x="448" y="370" width="34" height="265" fill="#1a0e0e" opacity="0.85"/>
    <!-- minaret balcony -->
    <rect x="440" y="430" width="50" height="8" fill="#c2410c"/>
    <!-- onion dome -->
    <path d="M465 370 Q438 355 448 330 Q455 305 465 295 Q475 305 482 330 Q492 355 465 370 Z"
          fill="#c2410c"/>
    <!-- spire -->
    <rect x="463" y="278" width="4" height="20" fill="#c2410c"/>
    <circle cx="465" cy="278" r="5" fill="#fbbf24"/>
    <!-- small window glow -->
    <rect x="420" y="540" width="14" height="22" fill="#fbbf24" opacity="0.7"/>
    <rect x="460" y="540" width="14" height="22" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- HERO: Isola San Giulio — island with basilica and bell tower, centered -->
  <g>
    <!-- island landmass -->
    <ellipse cx="850" cy="670" rx="280" ry="34" fill="#5c2a1a" opacity="0.95"/>
    <ellipse cx="850" cy="660" rx="260" ry="26" fill="#78350f"/>

    <!-- low building cluster (monastery wing left) -->
    <rect x="680" y="585" width="90" height="75" fill="#faf8f2" opacity="0.92"/>
    <polygon points="680,585 725,555 770,585" fill="#c2410c"/>
    <rect x="700" y="615" width="10" height="20" fill="#78350f" opacity="0.6"/>
    <rect x="725" y="615" width="10" height="20" fill="#78350f" opacity="0.6"/>
    <rect x="750" y="615" width="10" height="20" fill="#78350f" opacity="0.6"/>

    <!-- basilica main body (center) -->
    <rect x="780" y="555" width="160" height="105" fill="#faf8f2" opacity="0.95"/>
    <polygon points="780,555 860,505 940,555" fill="#9a3309"/>
    <rect x="810" y="595" width="18" height="35" fill="#78350f" opacity="0.6"/>
    <rect x="848" y="595" width="18" height="35" fill="#78350f" opacity="0.6"/>
    <rect x="888" y="595" width="18" height="35" fill="#78350f" opacity="0.6"/>

    <!-- bell tower (campanile) — vertical hero accent -->
    <rect x="955" y="420" width="58" height="240" fill="#faf8f2" opacity="0.95"/>
    <!-- bell openings -->
    <rect x="968" y="450" width="14" height="28" fill="#78350f" opacity="0.7"/>
    <rect x="986" y="450" width="14" height="28" fill="#78350f" opacity="0.7"/>
    <rect x="968" y="490" width="14" height="28" fill="#78350f" opacity="0.7"/>
    <rect x="986" y="490" width="14" height="28" fill="#78350f" opacity="0.7"/>
    <!-- cornice -->
    <rect x="950" y="415" width="68" height="8" fill="#c2410c"/>
    <!-- pyramidal roof -->
    <polygon points="950,415 984,360 1018,415" fill="#c2410c"/>
    <!-- cross-like finial (geometric, not religious symbol — a small cap) -->
    <rect x="982" y="345" width="4" height="18" fill="#78350f"/>
    <circle cx="984" cy="343" r="5" fill="#fbbf24"/>

    <!-- right monastery wing -->
    <rect x="1020" y="595" width="105" height="65" fill="#faf8f2" opacity="0.9"/>
    <polygon points="1020,595 1072,565 1125,595" fill="#c2410c"/>
    <rect x="1040" y="620" width="10" height="20" fill="#78350f" opacity="0.6"/>
    <rect x="1065" y="620" width="10" height="20" fill="#78350f" opacity="0.6"/>
    <rect x="1090" y="620" width="10" height="20" fill="#78350f" opacity="0.6"/>

    <!-- island reflection in lake -->
    <ellipse cx="850" cy="700" rx="220" ry="14" fill="#1a0e0e" opacity="0.25"/>
    <rect x="975" y="680" width="18" height="55" fill="#1a0e0e" opacity="0.18"/>
  </g>

  <!-- a few cypresses on far right shore for depth -->
  <g opacity="0.7">
    <ellipse cx="1340" cy="595" rx="8" ry="28" fill="#1a0e0e"/>
    <ellipse cx="1365" cy="600" rx="7" ry="24" fill="#1a0e0e"/>
    <ellipse cx="1390" cy="598" rx="9" ry="30" fill="#1a0e0e"/>
  </g>
</svg>
