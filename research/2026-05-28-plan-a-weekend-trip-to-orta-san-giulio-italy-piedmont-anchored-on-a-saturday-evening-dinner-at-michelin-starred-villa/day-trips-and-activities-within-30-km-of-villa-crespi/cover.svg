<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun halo (hero glow, centered ~800,420) -->
  <circle cx="800" cy="420" r="520" fill="url(#sun)" opacity="0.7"/>

  <!-- far mountain ridge (Mottarone-ish) -->
  <path d="M0,560 L180,470 L340,510 L520,420 L720,470 L900,400 L1080,460 L1280,430 L1450,490 L1600,470 L1600,620 L0,620 Z" fill="url(#mtnFar)" opacity="0.85"/>

  <!-- near mountain ridge -->
  <path d="M0,640 L160,570 L320,610 L480,560 L660,600 L840,555 L1020,605 L1200,575 L1380,615 L1600,580 L1600,720 L0,720 Z" fill="url(#mtnNear)"/>

  <!-- sun disc (the hero) -->
  <circle cx="800" cy="420" r="115" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="420" r="115" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.5"/>

  <!-- lake -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#lake)"/>

  <!-- sun reflection on water -->
  <ellipse cx="800" cy="730" rx="120" ry="14" fill="url(#reflect)"/>
  <rect x="690" y="735" width="220" height="2" fill="#fbbf24" opacity="0.4"/>
  <rect x="710" y="755" width="180" height="2" fill="#d97706" opacity="0.35"/>
  <rect x="730" y="775" width="140" height="2" fill="#fbbf24" opacity="0.25"/>
  <rect x="750" y="795" width="100" height="2" fill="#d97706" opacity="0.2"/>

  <!-- Isola San Giulio: small island with basilica silhouette, offset from center -->
  <ellipse cx="1080" cy="720" rx="95" ry="9" fill="#1a0e0e" opacity="0.7"/>
  <path d="M1010,720 Q1025,700 1060,698 L1100,696 Q1140,698 1155,720 Z" fill="#1a0e0e"/>
  <!-- basilica block + tower -->
  <rect x="1058" y="678" width="44" height="22" fill="#1a0e0e"/>
  <rect x="1072" y="652" width="14" height="46" fill="#1a0e0e"/>
  <polygon points="1072,652 1079,640 1086,652" fill="#1a0e0e"/>

  <!-- small boat silhouette on the water (left, balances composition) -->
  <path d="M480,742 Q500,752 540,752 Q560,748 555,742 Z" fill="#1a0e0e" opacity="0.85"/>
  <rect x="513" y="722" width="1.5" height="20" fill="#1a0e0e" opacity="0.85"/>

  <!-- corner decoration: faint stars (outside safe zone, croppable) -->
  <circle cx="120" cy="140" r="2" fill="#fef3ec" opacity="0.6"/>
  <circle cx="240" cy="90" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1480" cy="120" r="2" fill="#fef3ec" opacity="0.55"/>
  <circle cx="1380" cy="200" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1540" cy="260" r="1.5" fill="#fef3ec" opacity="0.45"/>
</svg>
