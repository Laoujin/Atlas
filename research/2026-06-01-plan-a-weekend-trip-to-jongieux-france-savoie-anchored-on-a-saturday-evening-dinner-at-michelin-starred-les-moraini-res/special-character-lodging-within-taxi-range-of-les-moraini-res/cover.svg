<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="chateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow behind the hill -->
  <circle cx="980" cy="430" r="320" fill="url(#sun)"/>

  <!-- Far ridge -->
  <path d="M0,560 C220,500 420,540 640,500 C860,460 1080,520 1300,490 C1440,470 1540,500 1600,490 L1600,900 L0,900 Z"
        fill="#9a3309" opacity="0.45"/>

  <!-- Mid hillside (Marestel) -->
  <path d="M0,640 C260,560 520,600 780,540 C1020,485 1240,560 1460,520 C1530,508 1580,520 1600,515 L1600,900 L0,900 Z"
        fill="url(#hill2)" opacity="0.85"/>

  <!-- Terraced vineyard rows on the mid hill -->
  <g stroke="#fef3ec" stroke-width="1.4" opacity="0.28" fill="none">
    <path d="M120,680 C360,615 600,640 840,595 C1080,555 1300,600 1500,575"/>
    <path d="M140,720 C380,660 620,680 860,635 C1100,595 1320,640 1520,615"/>
    <path d="M160,760 C400,705 640,720 880,675 C1120,640 1340,680 1540,660"/>
    <path d="M180,800 C420,750 660,760 900,720 C1140,685 1360,720 1560,705"/>
  </g>

  <!-- Foreground hill -->
  <path d="M0,760 C220,700 480,740 720,700 C960,665 1200,720 1440,690 C1520,680 1580,690 1600,688 L1600,900 L0,900 Z"
        fill="url(#hill1)"/>

  <!-- Vineyard rows on foreground -->
  <g stroke="#fbbf24" stroke-width="1.6" opacity="0.22" fill="none">
    <path d="M0,810 C260,760 520,780 780,755 C1040,732 1300,770 1600,758"/>
    <path d="M0,850 C260,808 520,825 780,805 C1040,785 1300,820 1600,815"/>
  </g>

  <!-- Château silhouette on the crest, in the hero safe zone -->
  <g fill="url(#chateau)">
    <!-- Main keep -->
    <rect x="745" y="445" width="120" height="115"/>
    <!-- Round tower left -->
    <rect x="700" y="420" width="50" height="140"/>
    <circle cx="725" cy="420" r="25"/>
    <!-- Conical roof left -->
    <polygon points="700,420 750,420 725,372"/>
    <!-- Square tower right -->
    <rect x="855" y="405" width="58" height="155"/>
    <!-- Crenellated roof right -->
    <polygon points="850,405 918,405 905,378 895,395 880,378 870,395 858,378"/>
    <!-- Lower wing -->
    <rect x="900" y="480" width="95" height="80"/>
    <!-- Roof on wing -->
    <polygon points="895,480 1000,480 970,452 925,452"/>
    <!-- Roof on keep -->
    <polygon points="740,445 870,445 850,410 760,410"/>
  </g>

  <!-- Tiny warm window glows -->
  <g fill="#fbbf24" opacity="0.9">
    <rect x="718" y="490" width="6" height="10"/>
    <rect x="785" y="495" width="7" height="11"/>
    <rect x="820" y="495" width="7" height="11"/>
    <rect x="872" y="475" width="6" height="10"/>
    <rect x="893" y="475" width="6" height="10"/>
    <rect x="930" y="515" width="7" height="10"/>
    <rect x="960" y="515" width="7" height="10"/>
  </g>

  <!-- Winding road catching evening light -->
  <path d="M260,895 C420,820 560,790 700,740 C800,705 760,640 720,610"
        stroke="#fbbf24" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M260,895 C420,820 560,790 700,740 C800,705 760,640 720,610"
        stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
</svg>
