<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1a0a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- setting sun glow -->
  <circle cx="1180" cy="430" r="380" fill="url(#sun)"/>

  <!-- distant ridge -->
  <path d="M0,560 L220,500 L420,540 L620,470 L880,520 L1140,480 L1400,510 L1600,490 L1600,640 L0,640 Z"
        fill="#78350f" opacity="0.55"/>

  <!-- winding Rhône river -->
  <path d="M0,615 Q260,600 460,625 T940,635 T1600,610 L1600,665 Q1180,675 880,665 T420,670 Q220,665 0,665 Z"
        fill="url(#river)" opacity="0.7"/>

  <!-- main hillside with terraced vineyard rows (hero) -->
  <path d="M120,900 L120,640 Q400,560 800,500 Q1180,450 1480,520 L1480,900 Z" fill="url(#hill)"/>

  <!-- terrace rows following the slope -->
  <g stroke="#c2410c" stroke-width="2.5" fill="none" opacity="0.75">
    <path d="M150,690 Q500,610 820,560 Q1150,510 1460,575"/>
    <path d="M150,735 Q500,660 820,615 Q1150,570 1460,625"/>
    <path d="M150,775 Q500,710 820,670 Q1150,625 1460,670"/>
    <path d="M150,810 Q500,755 820,720 Q1150,680 1460,715"/>
    <path d="M150,845 Q500,795 820,765 Q1150,730 1460,755"/>
  </g>
  <g stroke="#fbbf24" stroke-width="1.2" fill="none" opacity="0.45">
    <path d="M150,685 Q500,605 820,555 Q1150,505 1460,570"/>
    <path d="M150,730 Q500,655 820,610 Q1150,565 1460,620"/>
    <path d="M150,770 Q500,705 820,665 Q1150,620 1460,665"/>
  </g>

  <!-- footpath winding up through the vines toward the building -->
  <path d="M540,895 Q620,820 700,760 Q760,710 800,665 Q820,640 815,610"
        stroke="#fef3ec" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M540,895 Q620,820 700,760 Q760,710 800,665 Q820,640 815,610"
        stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>

  <!-- the lone perched building (hero focal point, centered ~800,540) -->
  <g>
    <!-- building shadow on slope -->
    <ellipse cx="820" cy="608" rx="55" ry="8" fill="#1a0e0e" opacity="0.5"/>
    <!-- main body -->
    <rect x="772" y="548" width="78" height="58" fill="#faf8f2" opacity="0.95"/>
    <!-- second wing -->
    <rect x="838" y="562" width="42" height="44" fill="#f0eadb" opacity="0.92"/>
    <!-- main roof -->
    <path d="M762,548 L811,512 L860,548 Z" fill="#9a3309"/>
    <!-- wing roof -->
    <path d="M832,562 L859,540 L886,562 Z" fill="#78350f"/>
    <!-- warm lit window -->
    <rect x="795" y="572" width="12" height="16" fill="#fbbf24" opacity="0.95"/>
    <rect x="818" y="575" width="9" height="13" fill="#d97706" opacity="0.9"/>
    <!-- chimney -->
    <rect x="800" y="500" width="8" height="18" fill="#5c2a1a"/>
  </g>

  <!-- foreground vine sprig (corner decoration, croppable) -->
  <g opacity="0.7">
    <path d="M80,880 Q120,840 160,860 Q200,880 240,855" stroke="#3a1a0a" stroke-width="3" fill="none"/>
    <circle cx="120" cy="850" r="5" fill="#5c2a1a"/>
    <circle cx="155" cy="858" r="4" fill="#5c2a1a"/>
    <circle cx="195" cy="862" r="5" fill="#5c2a1a"/>
  </g>
</svg>
