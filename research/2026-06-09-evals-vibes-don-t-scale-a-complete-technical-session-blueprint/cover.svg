<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1410"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="edgeFade1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="edgeFade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="edgeFade3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="edgeFade4" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed radial glow behind hero -->
  <ellipse cx="800" cy="450" rx="560" ry="380" fill="url(#hubGlow)" opacity="0.7"/>

  <!-- Layer 2: Hero — eval pipeline graph, centered at (800, 450) -->

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="310" ry="230" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.28"/>
  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="185" ry="138" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.32"/>

  <!-- Edge lines: hub to outer nodes -->
  <!-- Hub to node NE (1058, 282) -->
  <line x1="800" y1="450" x2="1058" y2="282" stroke="url(#edgeFade1)" stroke-width="2.2" stroke-opacity="0.85"/>
  <!-- Hub to node W (492, 430) -->
  <line x1="800" y1="450" x2="492" y2="430" stroke="url(#edgeFade2)" stroke-width="2.2" stroke-opacity="0.85"/>
  <!-- Hub to node S (780, 670) -->
  <line x1="800" y1="450" x2="780" y2="670" stroke="url(#edgeFade3)" stroke-width="2.2" stroke-opacity="0.85"/>
  <!-- Hub to node NW (562, 260) -->
  <line x1="800" y1="450" x2="562" y2="260" stroke="url(#edgeFade4)" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Cross-edges between outer nodes -->
  <line x1="1058" y1="282" x2="780" y2="670" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.28"/>
  <line x1="492" y1="430" x2="562" y2="260" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="1058" y1="282" x2="492" y2="430" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Inner ring nodes (judge layer) -->
  <!-- NE inner: 800+185*cos(-45°), 450+138*sin(-45°) ≈ (931, 352) -->
  <circle cx="931" cy="352" r="18" fill="url(#nodeRust)" opacity="0.82"/>
  <!-- W inner: (615, 450) -->
  <circle cx="615" cy="450" r="18" fill="url(#nodeViolet)" opacity="0.82"/>
  <!-- SE inner: (931, 548) -->
  <circle cx="931" cy="548" r="16" fill="url(#nodeViolet)" opacity="0.72"/>
  <!-- NW inner: (669, 352) -->
  <circle cx="669" cy="352" r="16" fill="url(#nodeRust)" opacity="0.72"/>

  <!-- Outer nodes (dataset / CI nodes) -->
  <!-- NE outer -->
  <circle cx="1058" cy="282" r="30" fill="url(#nodeViolet)" opacity="0.88"/>
  <!-- W outer -->
  <circle cx="492" cy="430" r="30" fill="url(#nodeViolet)" opacity="0.88"/>
  <!-- S outer -->
  <circle cx="780" cy="670" r="28" fill="url(#nodeRust)" opacity="0.85"/>
  <!-- NW outer -->
  <circle cx="562" cy="260" r="26" fill="url(#nodeRust)" opacity="0.80"/>

  <!-- Hub: central eval hub -->
  <circle cx="800" cy="450" r="72" fill="url(#hubGlow)" opacity="0.9"/>
  <circle cx="800" cy="450" r="52" fill="url(#hub)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="38" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Layer 3: corner decoration (outside safe zone, atmospheric only) -->
  <!-- Top-left corner arc — decorative, fully outside safe zone -->
  <path d="M 0 0 Q 120 80 0 220" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.18"/>
  <!-- Bottom-right corner arc -->
  <path d="M 1600 900 Q 1480 820 1600 680" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.18"/>
</svg>
