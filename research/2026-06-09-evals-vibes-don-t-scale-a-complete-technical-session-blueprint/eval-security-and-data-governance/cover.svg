<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- ambient glow at the boundary -->
  <circle cx="800" cy="450" r="320" fill="url(#spark)" opacity="0.45"/>

  <!-- left interlocking block (eval domain) with a tab reaching across -->
  <path d="M360 270 H760 V410 H840 V490 H760 V630 H360 Z"
        fill="url(#left)" opacity="0.92"/>

  <!-- right interlocking block (governance domain) with a notch receiving the tab -->
  <path d="M1240 270 H840 V410 H760 V490 H840 V630 H1240 Z"
        fill="url(#right)" opacity="0.9"/>

  <!-- boundary seam -->
  <line x1="800" y1="240" x2="800" y2="660" stroke="#1a0e0e" stroke-width="6" opacity="0.55"/>

  <!-- spark core at the interlock -->
  <circle cx="800" cy="450" r="34" fill="#fef3ec"/>
  <circle cx="800" cy="450" r="34" fill="url(#spark)"/>

  <!-- containment ring around the governed boundary -->
  <circle cx="800" cy="450" r="250" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
  <circle cx="800" cy="450" r="250" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.5" stroke-dasharray="4 36"/>
</svg>
