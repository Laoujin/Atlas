<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="520" ry="420" fill="url(#glow)"/>

  <!-- confusion-matrix grid (hero), 3x3, slight tilt -->
  <g transform="rotate(-7 800 450)">
    <!-- off-diagonal cells: faint -->
    <rect x="560" y="210" width="150" height="150" rx="14" fill="#78350f" opacity="0.12"/>
    <rect x="725" y="210" width="150" height="150" rx="14" fill="#78350f" opacity="0.12"/>
    <rect x="560" y="375" width="150" height="150" rx="14" fill="#78350f" opacity="0.12"/>
    <rect x="890" y="375" width="150" height="150" rx="14" fill="#78350f" opacity="0.12"/>
    <rect x="725" y="540" width="150" height="150" rx="14" fill="#78350f" opacity="0.12"/>
    <rect x="890" y="540" width="150" height="150" rx="14" fill="#78350f" opacity="0.12"/>

    <!-- diagonal (true positives): rust gradient -->
    <rect x="560" y="210" width="150" height="150" rx="14" fill="url(#hero)" opacity="0.55"/>
    <rect x="725" y="375" width="150" height="150" rx="14" fill="url(#hero)" opacity="0.95"/>
    <rect x="890" y="540" width="150" height="150" rx="14" fill="url(#hero)" opacity="0.7"/>

    <!-- highlighted off-diagonal error cell: amber ring (the metric "beyond accuracy" lives here) -->
    <rect x="890" y="210" width="150" height="150" rx="14" fill="#fef3ec" opacity="0.85"/>
    <rect x="890" y="210" width="150" height="150" rx="14" fill="none" stroke="#c2410c" stroke-width="9"/>
    <circle cx="965" cy="285" r="34" fill="#d97706"/>

    <rect x="725" y="210" width="150" height="150" rx="14" fill="none" stroke="#9a3309" stroke-width="3" opacity="0.25"/>
  </g>
</svg>
