<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1a0e"/>
      <stop offset="100%" stop-color="#3b1f0a"/>
    </linearGradient>
    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Hub core -->
    <radialGradient id="hubCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Outer glow halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Node gradient violet -->
    <radialGradient id="nodeViolet" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <!-- Node gradient rust -->
    <radialGradient id="nodeRust" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Pipeline lane gradient -->
    <linearGradient id="laneGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Background halo (decorative, full-bleed) -->
  <ellipse cx="800" cy="450" rx="680" ry="480" fill="url(#halo)"/>

  <!-- Layer 3 decoration: faint pipeline lanes (low opacity, edges) -->
  <rect x="0" y="310" width="1600" height="48" fill="url(#laneGrad)" opacity="0.5"/>
  <rect x="0" y="390" width="1600" height="48" fill="url(#laneGrad)" opacity="0.5"/>
  <rect x="0" y="462" width="1600" height="48" fill="url(#laneGrad)" opacity="0.5"/>
  <rect x="0" y="542" width="1600" height="48" fill="url(#laneGrad)" opacity="0.5"/>

  <!-- Layer 2: Hero element — centred at (800, 450) -->

  <!-- Outer orbit ring -->
  <circle cx="800" cy="450" r="280" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.35"/>
  <!-- Inner orbit ring -->
  <circle cx="800" cy="450" r="170" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>

  <!-- Orbit dashes on inner ring for rhythm -->
  <circle cx="800" cy="450" r="170" fill="none" stroke="#d97706" stroke-width="2.5"
    stroke-dasharray="18 22" stroke-dashoffset="0" opacity="0.30"/>

  <!-- Edge lines: hub to outer nodes -->
  <!-- Node A: top-right ~50deg -->
  <line x1="800" y1="450" x2="980" y2="270" stroke="#6d28d9" stroke-width="1.8" opacity="0.45"/>
  <!-- Node B: bottom ~260deg -->
  <line x1="800" y1="450" x2="527" y2="597" stroke="#6d28d9" stroke-width="1.8" opacity="0.45"/>
  <!-- Node C: right ~10deg -->
  <line x1="800" y1="450" x2="1076" y2="499" stroke="#6d28d9" stroke-width="1.8" opacity="0.45"/>

  <!-- Edge lines between outer nodes (forming a triangle — eval pipeline loop) -->
  <line x1="980" y1="270" x2="1076" y2="499" stroke="#9a3309" stroke-width="1.2" opacity="0.30"/>
  <line x1="1076" y1="499" x2="527" y2="597" stroke="#9a3309" stroke-width="1.2" opacity="0.30"/>
  <line x1="527" y1="597" x2="980" y2="270" stroke="#9a3309" stroke-width="1.2" opacity="0.30"/>

  <!-- Inner orbit node markers (small, on inner ring) -->
  <circle cx="800" cy="280" r="10" fill="#d97706" opacity="0.55"/>
  <circle cx="970" cy="540" r="10" fill="#d97706" opacity="0.55"/>
  <circle cx="630" cy="540" r="10" fill="#d97706" opacity="0.55"/>

  <!-- Outer nodes -->
  <!-- Node A: run -->
  <circle cx="980" cy="270" r="36" fill="url(#nodeViolet)" opacity="0.90"/>
  <circle cx="980" cy="270" r="36" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.60"/>
  <!-- Node B: score -->
  <circle cx="527" cy="597" r="36" fill="url(#nodeViolet)" opacity="0.90"/>
  <circle cx="527" cy="597" r="36" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.60"/>
  <!-- Node C: gate -->
  <circle cx="1076" cy="499" r="36" fill="url(#nodeRust)" opacity="0.90"/>
  <circle cx="1076" cy="499" r="36" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.60"/>

  <!-- Hub glow layer -->
  <circle cx="800" cy="450" r="100" fill="url(#hubGlow)" opacity="0.75"/>
  <!-- Hub core -->
  <circle cx="800" cy="450" r="64" fill="url(#hubCore)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="64" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.70"/>
  <!-- Hub centre dot -->
  <circle cx="800" cy="450" r="18" fill="#fbbf24" opacity="0.95"/>

</svg>
