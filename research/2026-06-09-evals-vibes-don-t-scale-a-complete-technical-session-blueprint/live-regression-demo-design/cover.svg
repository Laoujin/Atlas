<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- concentric eval orbits -->
  <g fill="none" stroke="#c2410c" stroke-opacity="0.28" stroke-width="3">
    <circle cx="800" cy="450" r="150"/>
    <circle cx="800" cy="450" r="240"/>
    <circle cx="800" cy="450" r="330"/>
  </g>

  <!-- regression comparison axis: edges from hub to test nodes -->
  <g stroke="#78350f" stroke-opacity="0.45" stroke-width="4">
    <line x1="800" y1="450" x2="560" y2="300"/>
    <line x1="800" y1="450" x2="1050" y2="280"/>
    <line x1="800" y1="450" x2="1110" y2="560"/>
    <line x1="800" y1="450" x2="540" y2="600"/>
    <line x1="800" y1="450" x2="800" y2="120"/>
  </g>

  <!-- passing test nodes (rust) -->
  <g fill="#d97706" stroke="#9a3309" stroke-width="3">
    <circle cx="560" cy="300" r="26"/>
    <circle cx="1050" cy="280" r="30"/>
    <circle cx="540" cy="600" r="24"/>
    <circle cx="800" cy="120" r="22"/>
  </g>

  <!-- regression / flagged node (violet accent) -->
  <circle cx="1110" cy="560" r="34" fill="url(#node)" stroke="#4c1d95" stroke-width="3"/>
  <circle cx="1110" cy="560" r="58" fill="none" stroke="#6d28d9" stroke-opacity="0.4" stroke-width="3"/>

  <!-- central hub: the live demo run -->
  <circle cx="800" cy="450" r="74" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="74" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="4"/>
  <circle cx="800" cy="450" r="30" fill="#fef3ec" fill-opacity="0.9"/>

  <!-- corner decoration (croppable) -->
  <circle cx="150" cy="150" r="10" fill="#c2410c" fill-opacity="0.5"/>
  <circle cx="1450" cy="780" r="12" fill="#6d28d9" fill-opacity="0.4"/>
</svg>
