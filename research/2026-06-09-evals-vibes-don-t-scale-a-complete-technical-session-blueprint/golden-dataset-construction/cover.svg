<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gemTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gemBody" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="gemRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- candidate pool: scattered raw data points -->
  <g fill="#6d28d9" opacity="0.55">
    <circle cx="430" cy="690" r="9"/>
    <circle cx="540" cy="740" r="7"/>
    <circle cx="660" cy="705" r="11"/>
    <circle cx="770" cy="755" r="8"/>
    <circle cx="900" cy="715" r="10"/>
    <circle cx="1010" cy="745" r="7"/>
    <circle cx="1130" cy="700" r="9"/>
    <circle cx="610" cy="650" r="6"/>
    <circle cx="990" cy="655" r="6"/>
  </g>

  <!-- selected points rising toward the gem -->
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="720" cy="620" r="8"/>
    <circle cx="800" cy="600" r="9"/>
    <circle cx="880" cy="625" r="8"/>
  </g>

  <!-- HERO: faceted golden gem, the curated ground-truth set -->
  <g>
    <!-- crown (top facet plane) -->
    <polygon points="800,260 980,400 800,440 620,400" fill="url(#gemTop)" opacity="0.95"/>
    <!-- left pavilion -->
    <polygon points="620,400 800,440 800,580 690,490" fill="url(#gemBody)" opacity="0.92"/>
    <!-- right pavilion -->
    <polygon points="980,400 910,490 800,580 800,440" fill="url(#gemRight)" opacity="0.92"/>
    <!-- center facet seam -->
    <polygon points="620,400 800,440 980,400 800,440" fill="#fef3ec" opacity="0.18"/>
    <!-- crown highlight -->
    <polygon points="800,260 800,440 700,395" fill="#fef3ec" opacity="0.22"/>
  </g>
</svg>
