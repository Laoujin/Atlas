<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="640" ry="430" fill="url(#glow)"/>

  <!-- stacked review pages (diff sheets) -->
  <g transform="rotate(-7 800 450)">
    <rect x="500" y="260" width="560" height="380" rx="20" fill="url(#page)" opacity="0.55"/>
  </g>
  <g transform="rotate(-2 800 450)">
    <rect x="540" y="250" width="560" height="380" rx="20" fill="url(#page)" opacity="0.78"/>
  </g>

  <!-- hero diff sheet -->
  <g transform="rotate(3 800 450)">
    <rect x="560" y="240" width="560" height="400" rx="22" fill="url(#hero)"/>
    <!-- diff change bars -->
    <rect x="600" y="300" width="40" height="18" rx="4" fill="#fbbf24" opacity="0.9"/>
    <rect x="660" y="300" width="300" height="18" rx="4" fill="#fef3ec" opacity="0.85"/>
    <rect x="600" y="350" width="40" height="18" rx="4" fill="#fef3ec" opacity="0.6"/>
    <rect x="660" y="350" width="240" height="18" rx="4" fill="#fef3ec" opacity="0.6"/>
    <rect x="600" y="400" width="40" height="18" rx="4" fill="#fbbf24" opacity="0.9"/>
    <rect x="660" y="400" width="360" height="18" rx="4" fill="#fef3ec" opacity="0.85"/>
    <rect x="600" y="450" width="40" height="18" rx="4" fill="#fef3ec" opacity="0.6"/>
    <rect x="660" y="450" width="200" height="18" rx="4" fill="#fef3ec" opacity="0.6"/>
    <rect x="600" y="500" width="40" height="18" rx="4" fill="#fbbf24" opacity="0.9"/>
    <rect x="660" y="500" width="280" height="18" rx="4" fill="#fef3ec" opacity="0.85"/>
  </g>

  <!-- agent node-and-edge overlay scanning the sheet -->
  <g stroke="#6d28d9" stroke-width="3" opacity="0.92" fill="none">
    <line x1="1090" y1="330" x2="1210" y2="280"/>
    <line x1="1090" y1="330" x2="1230" y2="430"/>
    <line x1="1210" y1="280" x2="1230" y2="430"/>
    <line x1="1230" y1="430" x2="1150" y2="540"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="1090" cy="330" r="20"/>
    <circle cx="1210" cy="280" r="14"/>
    <circle cx="1230" cy="430" r="16"/>
    <circle cx="1150" cy="540" r="12"/>
  </g>
  <circle cx="1090" cy="330" r="32" fill="none" stroke="#6d28d9" stroke-width="3" opacity="0.6"/>
</svg>
