<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <g id="chassis" stroke="#78350f" stroke-width="3" stroke-linejoin="round">
      <polygon points="450,420 800,600 800,690 450,510" fill="url(#left)"/>
      <polygon points="800,600 1150,420 1150,510 800,690" fill="url(#right)"/>
      <polygon points="800,240 1150,420 800,600 450,420" fill="url(#top)"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <polygon points="0,610 1600,180 1600,330 0,760" fill="#c2410c" opacity="0.06"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <use href="#chassis" transform="translate(-74,-112)" opacity="0.2"/>
  <use href="#chassis" transform="translate(-37,-56)" opacity="0.34"/>
  <use href="#chassis"/>

  <polygon points="962,524 1052,478 1052,508 962,554" fill="#3f1d0a" opacity="0.8"/>
  <polygon points="978,522 1036,492 1036,502 978,532" fill="#fbbf24" opacity="0.7"/>

  <circle cx="628" cy="424" r="46" fill="url(#led)"/>
  <circle cx="628" cy="424" r="13" fill="#fbbf24" opacity="0.95"/>
</svg>
