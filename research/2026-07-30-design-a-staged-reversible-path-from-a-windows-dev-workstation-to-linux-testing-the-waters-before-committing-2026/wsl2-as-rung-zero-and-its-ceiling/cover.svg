<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="step" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="700">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hero" gradientUnits="userSpaceOnUse" x1="0" y1="320" x2="0" y2="700">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="1170" y1="0" x2="1290" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3f1d08"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <rect x="240" y="700" width="1220" height="7" rx="3.5" fill="#78350f" opacity="0.32"/>

  <rect x="340" y="590" width="180" height="110" rx="6" fill="url(#step)" opacity="0.7"/>
  <rect x="540" y="510" width="180" height="190" rx="6" fill="url(#step)" opacity="0.8"/>
  <rect x="740" y="420" width="180" height="280" rx="6" fill="url(#step)" opacity="0.88"/>
  <rect x="940" y="320" width="180" height="380" rx="6" fill="url(#hero)" opacity="0.95"/>

  <rect x="1170" y="170" width="120" height="530" rx="5" fill="url(#wall)" opacity="0.92"/>
  <rect x="1170" y="170" width="10" height="530" fill="#fbbf24" opacity="0.55"/>

  <rect x="1320" y="230" width="140" height="470" rx="6" fill="none" stroke="#9a3309" stroke-width="5" stroke-dasharray="18 16" opacity="0.28"/>
