<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e1e"/>
      <stop offset="0.45" stop-color="#3b1f1a"/>
      <stop offset="0.8" stop-color="#78350f"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.5" stop-color="#2a1820"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
    <linearGradient id="mill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1f15"/>
      <stop offset="1" stop-color="#1a0e0a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon glow, sits in upper safe zone -->
  <circle cx="1180" cy="220" r="140" fill="url(#moon)"/>
  <circle cx="1180" cy="220" r="34" fill="#fef3ec" opacity="0.9"/>

  <!-- far limestone cliffs receding (decorative band, partially outside hero safe but readable) -->
  <path d="M 0 560 L 180 470 L 320 510 L 480 440 L 640 490 L 820 430 L 1000 480 L 1180 450 L 1360 500 L 1600 460 L 1600 640 L 0 640 Z"
        fill="url(#cliff)" opacity="0.7"/>

  <!-- nearer cliff ridge -->
  <path d="M 0 640 L 140 580 L 300 620 L 460 560 L 620 600 L 780 550 L 940 590 L 1120 540 L 1280 590 L 1460 560 L 1600 600 L 1600 720 L 0 720 Z"
        fill="#3b1f15" opacity="0.85"/>

  <!-- Meuse river -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#river)"/>

  <!-- warm restaurant glow halo behind mill -->
  <ellipse cx="800" cy="560" rx="520" ry="280" fill="url(#glow)"/>

  <!-- ===== HERO: 17th-century mill silhouette, centered ~(800, 510) ===== -->
  <!-- main mill body -->
  <rect x="640" y="430" width="280" height="260" fill="url(#mill)"/>
  <!-- pitched roof -->
  <polygon points="620,430 940,430 880,330 680,330" fill="#2a1410"/>
  <!-- chimney -->
  <rect x="830" y="290" width="36" height="60" fill="#2a1410"/>
  <!-- annex wing -->
  <rect x="900" y="490" width="180" height="200" fill="#3b1f15"/>
  <polygon points="890,490 1090,490 1050,420 920,420" fill="#2a1410"/>

  <!-- warm lit windows (the Michelin glow) -->
  <rect x="680" y="480" width="50" height="70" fill="#fbbf24" opacity="0.92"/>
  <rect x="750" y="480" width="50" height="70" fill="#fbbf24" opacity="0.92"/>
  <rect x="820" y="480" width="50" height="70" fill="#fef3ec" opacity="0.95"/>
  <rect x="680" y="580" width="50" height="70" fill="#d97706" opacity="0.85"/>
  <rect x="750" y="580" width="50" height="70" fill="#fbbf24" opacity="0.9"/>
  <rect x="820" y="580" width="50" height="70" fill="#d97706" opacity="0.85"/>
  <!-- annex windows -->
  <rect x="930" y="540" width="40" height="55" fill="#fbbf24" opacity="0.88"/>
  <rect x="990" y="540" width="40" height="55" fill="#d97706" opacity="0.8"/>
  <rect x="930" y="615" width="40" height="55" fill="#fbbf24" opacity="0.85"/>
  <rect x="990" y="615" width="40" height="55" fill="#fbbf24" opacity="0.85"/>

  <!-- waterwheel on the Burnot brook side -->
  <circle cx="600" cy="630" r="70" fill="none" stroke="#5c2a1a" stroke-width="8"/>
  <circle cx="600" cy="630" r="14" fill="#3b1f15"/>
  <line x1="600" y1="560" x2="600" y2="700" stroke="#5c2a1a" stroke-width="6"/>
  <line x1="530" y1="630" x2="670" y2="630" stroke="#5c2a1a" stroke-width="6"/>
  <line x1="550" y1="580" x2="650" y2="680" stroke="#5c2a1a" stroke-width="6"/>
  <line x1="650" y1="580" x2="550" y2="680" stroke="#5c2a1a" stroke-width="6"/>

  <!-- "Le Cube" guesthouse accent in the garden -->
  <g transform="translate(1140 600)">
    <polygon points="0,40 60,15 60,85 0,110" fill="#9a3309" opacity="0.9"/>
    <polygon points="60,15 120,40 120,110 60,85" fill="#78350f" opacity="0.9"/>
    <polygon points="0,40 60,15 120,40 60,65" fill="#c2410c" opacity="0.95"/>
    <rect x="20" y="55" width="20" height="22" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- river reflections of warm lights -->
  <ellipse cx="800" cy="760" rx="180" ry="8" fill="#d97706" opacity="0.45"/>
  <ellipse cx="800" cy="800" rx="120" ry="5" fill="#fbbf24" opacity="0.3"/>
  <ellipse cx="1160" cy="760" rx="40" ry="4" fill="#c2410c" opacity="0.4"/>
</svg>
