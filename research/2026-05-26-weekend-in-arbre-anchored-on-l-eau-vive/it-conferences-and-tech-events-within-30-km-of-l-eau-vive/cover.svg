<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint digital-culture grid (decoration, will partially crop) -->
  <g stroke="#c2410c" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M100 0 V900 M300 0 V900 M500 0 V900 M700 0 V900 M900 0 V900 M1100 0 V900 M1300 0 V900 M1500 0 V900"/>
  </g>

  <!-- Citadel ridge silhouette along bottom edge of safe zone -->
  <path d="M125 760 L260 700 L380 720 L500 660 L620 690 L760 620 L880 660 L1010 640 L1150 690 L1290 670 L1475 720 L1475 810 L125 810 Z"
        fill="url(#ridge)" opacity="0.82"/>

  <!-- Meuse river accent: thin curve threading horizontally -->
  <path d="M125 740 Q400 770 760 720 T1475 760"
        fill="none" stroke="#d97706" stroke-opacity="0.55" stroke-width="3"/>

  <!-- 30 km radius rings, centered on hub -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#9a3309" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#9a3309" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="800" cy="450" r="150" fill="none" stroke="#c2410c" stroke-opacity="0.65" stroke-width="2.5"/>

  <!-- venue node dots on the rings -->
  <g fill="#78350f">
    <circle cx="540" cy="380" r="7" opacity="0.85"/>
    <circle cx="1050" cy="320" r="7" opacity="0.85"/>
    <circle cx="1130" cy="540" r="9" opacity="0.9"/>
    <circle cx="640" cy="610" r="6" opacity="0.8"/>
    <circle cx="950" cy="610" r="7" opacity="0.85"/>
  </g>

  <!-- signal lines from hub to two key nodes -->
  <g stroke="#c2410c" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="800" y1="450" x2="1130" y2="540"/>
    <line x1="800" y1="450" x2="540" y2="380"/>
  </g>

  <!-- hero: rust hub -->
  <circle cx="800" cy="450" r="90" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="90" fill="none" stroke="#9a3309" stroke-opacity="0.6" stroke-width="2"/>

  <!-- inner glyph: concentric arc segments suggesting signal / festival pulse -->
  <g fill="none" stroke="#faf8f2" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round">
    <path d="M765 450 A35 35 0 0 1 835 450"/>
    <path d="M755 450 A45 45 0 0 0 845 450" stroke-opacity="0.55"/>
    <path d="M745 450 A55 55 0 0 1 855 450" stroke-opacity="0.35"/>
  </g>
  <circle cx="800" cy="450" r="6" fill="#faf8f2"/>
</svg>
