<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="mill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="1080" cy="340" r="220" fill="url(#sun)"/>

  <!-- far valley hills (decorative, can be clipped) -->
  <path d="M0,560 L240,470 L480,520 L720,440 L960,490 L1200,420 L1440,470 L1600,440 L1600,640 L0,640 Z" fill="#9a3309" opacity="0.35"/>

  <!-- nearer valley ridge framing the hero -->
  <path d="M0,640 L180,580 L380,610 L560,560 L760,590 L980,540 L1200,580 L1400,545 L1600,575 L1600,720 L0,720 Z" fill="url(#hill)"/>

  <!-- river surface (hero foreground band) -->
  <path d="M0,720 L1600,720 L1600,900 L0,900 Z" fill="url(#river)"/>

  <!-- river highlight ripples -->
  <path d="M180,770 Q360,758 540,770 T900,770" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.45" fill="none"/>
  <path d="M260,820 Q460,808 660,820 T1040,820" stroke="#fef3ec" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <path d="M700,855 Q900,845 1100,855 T1480,855" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" fill="none"/>

  <!-- HERO: stone mill silhouette, centered near (760, 540) -->
  <!-- main mill body -->
  <rect x="640" y="470" width="280" height="250" fill="url(#mill)"/>
  <!-- roof -->
  <path d="M620,470 L780,370 L940,470 Z" fill="#5c2a1a"/>
  <!-- chimney -->
  <rect x="850" y="395" width="34" height="80" fill="#78350f"/>
  <!-- small attic window -->
  <rect x="755" y="425" width="50" height="36" fill="#fbbf24" opacity="0.85"/>
  <!-- ground-floor arched mill-race opening -->
  <path d="M660,720 L660,640 Q660,600 700,600 L740,600 Q780,600 780,640 L780,720 Z" fill="#1a0e0e" opacity="0.75"/>
  <!-- side windows, warm-lit -->
  <rect x="810" y="540" width="38" height="50" fill="#fbbf24" opacity="0.9"/>
  <rect x="870" y="540" width="38" height="50" fill="#fbbf24" opacity="0.75"/>
  <rect x="810" y="620" width="38" height="50" fill="#fbbf24" opacity="0.7"/>
  <rect x="870" y="620" width="38" height="50" fill="#fbbf24" opacity="0.85"/>

  <!-- waterwheel attached to mill, left side, partly in river -->
  <g transform="translate(600 640)">
    <circle r="90" fill="none" stroke="#78350f" stroke-width="10"/>
    <circle r="90" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.8"/>
    <circle r="14" fill="#5c2a1a"/>
    <!-- spokes & paddles -->
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#78350f" stroke-width="6"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#78350f" stroke-width="6"/>
    <line x1="-64" y1="-64" x2="64" y2="64" stroke="#78350f" stroke-width="6"/>
    <line x1="-64" y1="64" x2="64" y2="-64" stroke="#78350f" stroke-width="6"/>
    <!-- paddle blades at rim -->
    <rect x="-96" y="-10" width="18" height="20" fill="#c2410c"/>
    <rect x="78" y="-10" width="18" height="20" fill="#c2410c"/>
    <rect x="-10" y="-96" width="20" height="18" fill="#c2410c"/>
    <rect x="-10" y="78" width="20" height="18" fill="#c2410c"/>
    <rect x="-74" y="-74" width="20" height="18" fill="#c2410c" transform="rotate(45)"/>
    <rect x="-74" y="56" width="20" height="18" fill="#c2410c" transform="rotate(45)"/>
  </g>

  <!-- water splash where wheel meets river -->
  <path d="M520,720 Q560,705 600,720 Q640,735 680,720" stroke="#fef3ec" stroke-width="3" stroke-opacity="0.7" fill="none"/>

</svg>
