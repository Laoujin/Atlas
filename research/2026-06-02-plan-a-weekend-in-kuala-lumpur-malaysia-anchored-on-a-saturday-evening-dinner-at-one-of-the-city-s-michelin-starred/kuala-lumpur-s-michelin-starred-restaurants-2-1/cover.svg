<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Warm central glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient - main plate -->
    <radialGradient id="plate1" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="72%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="plate1rim" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Second plate gradient -->
    <radialGradient id="plate2" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#e8d8c8"/>
      <stop offset="100%" stop-color="#c4b09a"/>
    </radialGradient>
    <!-- Sauce pool gradient on main plate -->
    <radialGradient id="sauce" cx="46%" cy="54%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Wine glass fill -->
    <linearGradient id="glassfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Star accent gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle warm arc sweep at bottom edge (decorative, outside safe zone) -->
  <ellipse cx="800" cy="960" rx="820" ry="280" fill="#9a3309" opacity="0.10"/>

  <!-- Layer 2: Hero element — centered near (800, 450), within safe zone x:125-1475, y:90-810 -->

  <!-- Background plate (offset right and slightly lower) -->
  <circle cx="880" cy="470" r="230" fill="url(#plate2)" opacity="0.88"/>
  <circle cx="880" cy="470" r="230" fill="url(#plate1rim)" opacity="0.7"/>
  <!-- Inner ring on back plate -->
  <circle cx="880" cy="470" r="188" fill="none" stroke="#b8a090" stroke-width="2.5" opacity="0.5"/>

  <!-- Main foreground plate (hero center) -->
  <circle cx="730" cy="445" r="255" fill="url(#plate1)" opacity="0.95"/>
  <circle cx="730" cy="445" r="255" fill="url(#plate1rim)" opacity="0.65"/>
  <!-- Inner ring on main plate -->
  <circle cx="730" cy="445" r="210" fill="none" stroke="#c8b8a4" stroke-width="3" opacity="0.6"/>

  <!-- Sauce pool / composed element on main plate -->
  <ellipse cx="720" cy="452" rx="98" ry="72" fill="url(#sauce)" opacity="0.80"/>
  <!-- Small accent dot (quenelle / garnish suggestion) -->
  <ellipse cx="720" cy="448" rx="22" ry="12" fill="#fbbf24" opacity="0.70"/>
  <ellipse cx="720" cy="448" rx="12" ry="6" fill="#fef3ec" opacity="0.60"/>

  <!-- Wine glass silhouette — right of plates, within safe zone -->
  <!-- Bowl of glass -->
  <ellipse cx="1180" cy="410" rx="52" ry="70" fill="url(#glassfill)" opacity="0.72"/>
  <!-- Glass bowl lower curve (tapering) -->
  <path d="M1138,455 Q1148,510 1180,522 Q1212,510 1222,455" fill="url(#glassfill)" opacity="0.55"/>
  <!-- Stem -->
  <rect x="1176" y="522" width="8" height="110" rx="4" fill="#c2410c" opacity="0.60"/>
  <!-- Base -->
  <ellipse cx="1180" cy="636" rx="42" ry="9" fill="#9a3309" opacity="0.55"/>

  <!-- Michelin star accents — two large, one small (2★ + 1★ motif), within safe zone -->
  <!-- Two-star marker (left of hero) -->
  <circle cx="490" cy="310" r="28" fill="url(#starGlow)" opacity="0.0"/>
  <!-- Star 1 -->
  <polygon points="490,282 497,302 519,302 502,315 508,336 490,323 472,336 478,315 461,302 483,302"
           fill="#fbbf24" opacity="0.82"/>
  <!-- Star 2 (slightly offset) -->
  <polygon points="538,282 545,302 567,302 550,315 556,336 538,323 520,336 526,315 509,302 531,302"
           fill="#fbbf24" opacity="0.68"/>
  <!-- One-star marker (upper right, within safe zone) -->
  <polygon points="1100,200 1107,220 1129,220 1112,233 1118,254 1100,241 1082,254 1088,233 1071,220 1093,220"
           fill="#fbbf24" opacity="0.55"/>

  <!-- Layer 3: Edge decoration (outside safe zone — purely atmospheric) -->
  <!-- Top-left corner warm bleed -->
  <ellipse cx="0" cy="0" rx="320" ry="220" fill="#9a3309" opacity="0.07"/>
  <!-- Bottom-right warm bleed -->
  <ellipse cx="1600" cy="900" rx="380" ry="260" fill="#78350f" opacity="0.09"/>
</svg>
