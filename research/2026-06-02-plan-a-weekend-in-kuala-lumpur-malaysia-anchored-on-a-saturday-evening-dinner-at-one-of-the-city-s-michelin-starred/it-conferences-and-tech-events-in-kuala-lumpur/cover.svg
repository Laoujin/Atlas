<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="panel3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Radial glow centered on hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3: Edge atmosphere — low-opacity arcs suggesting a city horizon, safe to crop -->
  <ellipse cx="800" cy="960" rx="900" ry="320" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.12"/>
  <ellipse cx="800" cy="1010" rx="1100" ry="380" fill="none" stroke="#d97706" stroke-width="1" opacity="0.08"/>

  <!-- Layer 2: Hero — three stacked angled panels (conference stage / slide deck motif) -->
  <!-- Back panel (largest, darkest) -->
  <polygon points="420,620 580,290 1220,290 1060,620" fill="url(#panel2)" opacity="0.72"/>

  <!-- Mid panel -->
  <polygon points="470,600 610,320 1150,320 1010,600" fill="url(#panel1)" opacity="0.85"/>

  <!-- Accent bar inside mid panel — represents slide content lines -->
  <rect x="570" y="380" width="380" height="14" rx="4" fill="#fbbf24" opacity="0.30"/>
  <rect x="570" y="410" width="260" height="10" rx="3" fill="#fbbf24" opacity="0.18"/>
  <rect x="570" y="434" width="310" height="10" rx="3" fill="#fbbf24" opacity="0.14"/>

  <!-- Front hero panel (brightest, top of the stack) -->
  <polygon points="530,575 648,355 1050,355 932,575" fill="url(#panel3)" opacity="0.92"/>

  <!-- Speaker podium accent — a small bright rectangle at the base of the front panel -->
  <rect x="740" y="560" width="120" height="28" rx="6" fill="#fbbf24" opacity="0.75"/>

  <!-- Network nodes — three dots with connecting lines (conference networking motif) -->
  <!-- Node cluster, positioned below-left of hero, within safe zone -->
  <line x1="250" y1="720" x2="410" y2="660" stroke="#d97706" stroke-width="1.5" opacity="0.35"/>
  <line x1="410" y1="660" x2="530" y2="700" stroke="#c2410c" stroke-width="1.5" opacity="0.30"/>
  <line x1="530" y1="700" x2="410" y2="660" stroke="#c2410c" stroke-width="1" opacity="0.25"/>
  <circle cx="250" cy="720" r="9" fill="#d97706" opacity="0.55"/>
  <circle cx="410" cy="660" r="13" fill="#c2410c" opacity="0.70"/>
  <circle cx="530" cy="700" r="8" fill="#9a3309" opacity="0.55"/>

  <!-- Node cluster right side -->
  <line x1="1070" y1="680" x2="1240" y2="720" stroke="#d97706" stroke-width="1.5" opacity="0.30"/>
  <line x1="1240" y1="720" x2="1350" y2="680" stroke="#c2410c" stroke-width="1.5" opacity="0.28"/>
  <circle cx="1070" cy="680" r="10" fill="#c2410c" opacity="0.60"/>
  <circle cx="1240" cy="720" r="14" fill="#d97706" opacity="0.65"/>
  <circle cx="1350" cy="680" r="8" fill="#9a3309" opacity="0.50"/>

  <!-- Subtle top-edge node — upper safe zone decoration -->
  <circle cx="800" cy="180" r="18" fill="#c2410c" opacity="0.40"/>
  <line x1="800" y1="198" x2="800" y2="290" stroke="#c2410c" stroke-width="1.5" opacity="0.25"/>
</svg>
