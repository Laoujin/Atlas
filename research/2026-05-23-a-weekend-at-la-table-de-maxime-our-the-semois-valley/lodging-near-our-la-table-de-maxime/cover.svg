<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#1f1f26"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a32"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon glow behind hero -->
  <circle cx="800" cy="380" r="280" fill="url(#moon)"/>

  <!-- distant forest ridge, full-bleed (decoration, croppable) -->
  <path d="M0 620 L120 580 L210 600 L290 560 L380 590 L470 555 L560 585 L660 545 L760 580 L860 540 L960 575 L1060 545 L1170 580 L1270 555 L1380 590 L1490 565 L1600 585 L1600 900 L0 900 Z" fill="#2a1410" opacity="0.85"/>

  <!-- flanking pine silhouettes (within safe zone edges) -->
  <g fill="#0f0a0a" opacity="0.9">
    <path d="M260 720 L290 540 L320 720 Z"/>
    <path d="M255 720 L290 580 L325 720 Z"/>
    <path d="M1280 720 L1310 560 L1340 720 Z"/>
    <path d="M1275 720 L1310 600 L1345 720 Z"/>
  </g>

  <!-- HERO: slate-grey gabled stone house, centered (800, 450) -->
  <!-- main body -->
  <rect x="640" y="440" width="320" height="240" fill="url(#stone)"/>
  <!-- gable roof -->
  <polygon points="620,445 800,290 980,445" fill="url(#roof)"/>
  <!-- chimney -->
  <rect x="900" y="320" width="32" height="80" fill="#1f1f26"/>
  <!-- stone texture seams -->
  <g stroke="#0a0a0e" stroke-width="1.2" opacity="0.7">
    <line x1="640" y1="490" x2="960" y2="490"/>
    <line x1="640" y1="540" x2="960" y2="540"/>
    <line x1="640" y1="590" x2="960" y2="590"/>
    <line x1="640" y1="640" x2="960" y2="640"/>
    <line x1="720" y1="440" x2="720" y2="680"/>
    <line x1="800" y1="490" x2="800" y2="540"/>
    <line x1="880" y1="540" x2="880" y2="590"/>
  </g>
  <!-- warm glowing windows -->
  <rect x="680" y="500" width="60" height="80" fill="url(#window)" opacity="0.95"/>
  <rect x="860" y="500" width="60" height="80" fill="url(#window)" opacity="0.95"/>
  <!-- window cross mullions -->
  <g stroke="#1a0e0e" stroke-width="3">
    <line x1="710" y1="500" x2="710" y2="580"/>
    <line x1="680" y1="540" x2="740" y2="540"/>
    <line x1="890" y1="500" x2="890" y2="580"/>
    <line x1="860" y1="540" x2="920" y2="540"/>
  </g>
  <!-- door, warm glow spilling -->
  <rect x="770" y="580" width="60" height="100" fill="url(#window)" opacity="0.9"/>
  <rect x="778" y="592" width="44" height="80" fill="#9a3309" opacity="0.7"/>

  <!-- soft pool of light at door -->
  <ellipse cx="800" cy="700" rx="100" ry="18" fill="#fbbf24" opacity="0.25"/>

  <!-- river ribbon foreground (within safe zone bottom) -->
  <path d="M0 760 Q400 740 800 770 T1600 760 L1600 810 Q1200 790 800 800 T0 810 Z" fill="url(#river)"/>

  <!-- subtle shimmer on river -->
  <g stroke="#fbbf24" stroke-width="1.5" opacity="0.35">
    <line x1="540" y1="780" x2="600" y2="780"/>
    <line x1="700" y1="785" x2="760" y2="785"/>
    <line x1="900" y1="785" x2="960" y2="785"/>
    <line x1="1060" y1="780" x2="1120" y2="780"/>
  </g>
</svg>
