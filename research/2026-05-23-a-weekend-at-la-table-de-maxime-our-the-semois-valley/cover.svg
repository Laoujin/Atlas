<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.85" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind the meander -->
  <circle cx="800" cy="520" r="380" fill="url(#sun)"/>
  <circle cx="800" cy="520" r="70" fill="#fbbf24" opacity="0.9"/>

  <!-- Far ridges -->
  <path d="M 0 540 Q 200 500 380 520 T 760 510 T 1140 515 T 1600 525 L 1600 600 L 0 600 Z" fill="url(#ridgeFar)" opacity="0.85"/>

  <!-- Semois oxbow meander: the iconic peninsula viewed from above -->
  <!-- River loop wrapping a forested peninsula -->
  <path d="M 80 660
           C 220 640, 380 640, 520 660
           C 640 680, 700 760, 720 820
           L 720 900 L 80 900 Z" fill="url(#ridgeMid)" opacity="0.9"/>

  <!-- The peninsula (forested promontory in the meander) -->
  <path d="M 560 600
           C 720 580, 920 590, 1060 610
           C 1180 630, 1240 700, 1230 800
           C 1220 860, 1160 880, 1060 870
           C 920 855, 820 800, 720 760
           C 640 730, 580 680, 560 600 Z"
        fill="url(#ridgeNear)" opacity="0.95"/>

  <!-- River bend hugging the peninsula (the bright water line) -->
  <path d="M 60 670
           C 220 650, 400 650, 540 675
           C 660 695, 720 740, 740 800
           C 760 845, 820 865, 920 875
           C 1080 890, 1240 870, 1340 820
           C 1420 780, 1460 720, 1470 640"
        fill="none" stroke="url(#river)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- Thin highlight on the river -->
  <path d="M 120 668
           C 260 652, 420 654, 540 678
           C 650 700, 710 745, 735 800"
        fill="none" stroke="#fef3ec" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Near ridge / foreground viewing platform silhouette -->
  <path d="M 0 780 Q 200 760 420 790 L 420 900 L 0 900 Z" fill="#1a0e0e" opacity="0.95"/>

  <!-- Fine-dining cue: stemmed wine glass silhouette on the foreground ridge -->
  <g opacity="0.92" transform="translate(220 720)">
    <path d="M -28 0
             C -28 28, -14 44, 0 44
             C 14 44, 28 28, 28 0
             C 28 -8, 24 -14, 16 -16
             L -16 -16
             C -24 -14, -28 -8, -28 0 Z"
          fill="#1a0e0e" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- liquid in glass catching the sunset -->
    <path d="M -22 -4
             C -22 20, -10 34, 0 34
             C 10 34, 22 20, 22 -4 Z"
          fill="#c2410c" opacity="0.85"/>
    <rect x="-1.5" y="44" width="3" height="32" fill="#1a0e0e"/>
    <ellipse cx="0" cy="78" rx="20" ry="3" fill="#1a0e0e"/>
  </g>
</svg>
