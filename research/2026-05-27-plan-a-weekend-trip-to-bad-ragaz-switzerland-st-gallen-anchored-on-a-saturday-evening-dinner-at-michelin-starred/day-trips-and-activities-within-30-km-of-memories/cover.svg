<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.78" r="0.42">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="peakMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Thermal valley glow (decoration, low in frame) -->
  <ellipse cx="800" cy="720" rx="780" ry="240" fill="url(#glow)"/>

  <!-- Far ridge -->
  <path d="M 0 560 L 180 470 L 320 520 L 460 430 L 620 500 L 780 410 L 940 480 L 1120 420 L 1280 490 L 1440 440 L 1600 510 L 1600 900 L 0 900 Z"
        fill="url(#peakFar)" opacity="0.85"/>

  <!-- Hero: central alpine peak (within safe zone x:125-1475, y:90-810) -->
  <path d="M 800 180 L 1080 720 L 520 720 Z" fill="url(#peakMid)"/>
  <!-- Snow cap on hero peak -->
  <path d="M 800 180 L 870 315 L 835 305 L 815 330 L 790 310 L 765 335 L 740 320 L 730 315 Z" fill="url(#snow)"/>
  <!-- Shadow face of hero -->
  <path d="M 800 180 L 1080 720 L 800 720 Z" fill="#1a0e0e" opacity="0.35"/>

  <!-- Secondary peak left -->
  <path d="M 430 330 L 700 740 L 220 740 Z" fill="url(#peakNear)" opacity="0.92"/>
  <path d="M 430 330 L 480 425 L 455 415 L 440 435 L 420 420 L 400 440 L 385 425 Z" fill="url(#snow)" opacity="0.85"/>

  <!-- Secondary peak right -->
  <path d="M 1180 290 L 1450 760 L 950 760 Z" fill="url(#peakNear)" opacity="0.88"/>
  <path d="M 1180 290 L 1230 380 L 1210 372 L 1195 392 L 1175 378 L 1160 395 L 1145 380 Z" fill="url(#snow)" opacity="0.85"/>

  <!-- Thermal steam wisps rising from valley (decoration, hero-adjacent) -->
  <ellipse cx="800" cy="760" rx="220" ry="22" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="760" cy="790" rx="320" ry="18" fill="#fef3ec" opacity="0.18"/>
  <ellipse cx="840" cy="820" rx="380" ry="14" fill="#fef3ec" opacity="0.12"/>

  <!-- Vineyard row hint: warm dots along the valley floor (decoration band) -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="340" cy="800" r="4"/>
    <circle cx="395" cy="805" r="3"/>
    <circle cx="450" cy="802" r="4"/>
    <circle cx="1180" cy="800" r="4"/>
    <circle cx="1235" cy="804" r="3"/>
    <circle cx="1290" cy="800" r="4"/>
  </g>
</svg>
