<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a0c"/>
      <stop offset="1" stop-color="#1a0904"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="warmth" cx="0.5" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon glow over the resort -->
  <circle cx="1180" cy="220" r="320" fill="url(#moon)"/>
  <circle cx="1180" cy="220" r="46" fill="#fef3ec" opacity="0.85"/>

  <!-- far alpine ridge -->
  <path d="M0,560 L160,430 L300,500 L440,360 L600,470 L760,320 L920,450 L1080,300 L1240,440 L1400,360 L1600,490 L1600,900 L0,900 Z" fill="url(#peakFar)" opacity="0.85"/>

  <!-- snow caps on far peaks -->
  <path d="M440,360 L470,395 L455,398 L440,388 L425,400 L410,395 Z" fill="#faf8f2" opacity="0.55"/>
  <path d="M760,320 L795,360 L778,362 L760,348 L742,362 L725,358 Z" fill="#faf8f2" opacity="0.6"/>
  <path d="M1080,300 L1118,345 L1098,348 L1080,330 L1060,348 L1042,344 Z" fill="#faf8f2" opacity="0.6"/>

  <!-- near ridge -->
  <path d="M0,700 L220,600 L420,680 L640,580 L880,690 L1120,610 L1360,700 L1600,640 L1600,900 L0,900 Z" fill="url(#peakNear)"/>

  <!-- warm pool of light at hotel base -->
  <ellipse cx="800" cy="780" rx="520" ry="120" fill="url(#warmth)"/>

  <!-- grand hotel facade (hero, centered ~800,520) -->
  <g>
    <!-- main body -->
    <rect x="520" y="500" width="560" height="260" fill="url(#facade)"/>
    <!-- central pavilion taller -->
    <rect x="720" y="430" width="160" height="330" fill="url(#facade)"/>
    <!-- mansard / pitched roof central -->
    <path d="M720,430 L800,360 L880,430 Z" fill="#2a1408"/>
    <!-- side wing roofs -->
    <path d="M520,500 L560,460 L720,460 L720,500 Z" fill="#2a1408"/>
    <path d="M880,500 L880,460 L1040,460 L1080,500 Z" fill="#2a1408"/>
    <!-- corner towers -->
    <rect x="500" y="540" width="40" height="220" fill="#2a1408"/>
    <rect x="1060" y="540" width="40" height="220" fill="#2a1408"/>
    <path d="M500,540 L520,510 L540,540 Z" fill="#1a0904"/>
    <path d="M1060,540 L1080,510 L1100,540 Z" fill="#1a0904"/>
    <!-- flag spire on central roof -->
    <line x1="800" y1="360" x2="800" y2="320" stroke="#78350f" stroke-width="3"/>
    <circle cx="800" cy="320" r="4" fill="#fbbf24"/>

    <!-- windows: rows of warm glow -->
    <!-- central pavilion 3 floors x 3 -->
    <rect x="740" y="470" width="22" height="32" fill="url(#window)" opacity="0.9"/>
    <rect x="789" y="470" width="22" height="32" fill="url(#window)" opacity="0.55"/>
    <rect x="838" y="470" width="22" height="32" fill="url(#window)" opacity="0.9"/>
    <rect x="740" y="530" width="22" height="32" fill="url(#window)" opacity="0.85"/>
    <rect x="789" y="530" width="22" height="32" fill="url(#window)" opacity="0.95"/>
    <rect x="838" y="530" width="22" height="32" fill="url(#window)" opacity="0.6"/>
    <rect x="740" y="590" width="22" height="32" fill="url(#window)" opacity="0.5"/>
    <rect x="789" y="590" width="22" height="32" fill="url(#window)" opacity="0.9"/>
    <rect x="838" y="590" width="22" height="32" fill="url(#window)" opacity="0.85"/>

    <!-- left wing windows -->
    <g fill="url(#window)">
      <rect x="555" y="540" width="18" height="26" opacity="0.7"/>
      <rect x="595" y="540" width="18" height="26" opacity="0.9"/>
      <rect x="635" y="540" width="18" height="26" opacity="0.6"/>
      <rect x="675" y="540" width="18" height="26" opacity="0.85"/>
      <rect x="555" y="595" width="18" height="26" opacity="0.85"/>
      <rect x="595" y="595" width="18" height="26" opacity="0.55"/>
      <rect x="635" y="595" width="18" height="26" opacity="0.9"/>
      <rect x="675" y="595" width="18" height="26" opacity="0.7"/>
      <rect x="555" y="650" width="18" height="26" opacity="0.6"/>
      <rect x="595" y="650" width="18" height="26" opacity="0.9"/>
      <rect x="635" y="650" width="18" height="26" opacity="0.5"/>
      <rect x="675" y="650" width="18" height="26" opacity="0.85"/>
    </g>

    <!-- right wing windows -->
    <g fill="url(#window)">
      <rect x="907" y="540" width="18" height="26" opacity="0.85"/>
      <rect x="947" y="540" width="18" height="26" opacity="0.6"/>
      <rect x="987" y="540" width="18" height="26" opacity="0.9"/>
      <rect x="1027" y="540" width="18" height="26" opacity="0.7"/>
      <rect x="907" y="595" width="18" height="26" opacity="0.55"/>
      <rect x="947" y="595" width="18" height="26" opacity="0.9"/>
      <rect x="987" y="595" width="18" height="26" opacity="0.7"/>
      <rect x="1027" y="595" width="18" height="26" opacity="0.85"/>
      <rect x="907" y="650" width="18" height="26" opacity="0.9"/>
      <rect x="947" y="650" width="18" height="26" opacity="0.5"/>
      <rect x="987" y="650" width="18" height="26" opacity="0.85"/>
      <rect x="1027" y="650" width="18" height="26" opacity="0.6"/>
    </g>

    <!-- grand entrance: tall arched doorway, brightest glow -->
    <path d="M780,760 L780,690 Q800,660 820,690 L820,760 Z" fill="url(#window)"/>
    <rect x="794" y="700" width="2" height="60" fill="#3a1a0c" opacity="0.6"/>
    <rect x="804" y="700" width="2" height="60" fill="#3a1a0c" opacity="0.6"/>
  </g>

  <!-- footpath leading toward entrance -->
  <path d="M800,760 L770,820 L1600,860 L1600,900 L0,900 L0,870 L830,820 Z" fill="#c2410c" opacity="0.18"/>
  <path d="M800,760 Q700,810 200,870" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- a couple of faint lamps along the path (decoration in safe zone) -->
  <circle cx="640" cy="800" r="6" fill="#fbbf24" opacity="0.75"/>
  <circle cx="640" cy="800" r="18" fill="#fbbf24" opacity="0.18"/>
  <circle cx="420" cy="840" r="5" fill="#fbbf24" opacity="0.65"/>
  <circle cx="420" cy="840" r="16" fill="#fbbf24" opacity="0.15"/>
</svg>
