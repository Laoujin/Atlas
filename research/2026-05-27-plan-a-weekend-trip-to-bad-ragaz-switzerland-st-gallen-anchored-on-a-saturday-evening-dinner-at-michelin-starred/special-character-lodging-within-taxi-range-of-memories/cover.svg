<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm glow behind hero (lodge lamplight) -->
  <ellipse cx="800" cy="470" rx="520" ry="320" fill="url(#glow)"/>

  <!-- Distant Alpine ridge (decoration, may crop) -->
  <path d="M 0 620 L 180 480 L 320 560 L 480 430 L 640 540 L 800 410 L 960 520 L 1120 420 L 1280 530 L 1440 450 L 1600 560 L 1600 900 L 0 900 Z"
        fill="url(#ridge)" opacity="0.85"/>

  <!-- Foreground ridge -->
  <path d="M 0 720 L 240 640 L 420 700 L 620 620 L 820 690 L 1020 630 L 1220 700 L 1420 650 L 1600 710 L 1600 900 L 0 900 Z"
        fill="#1a0e0e" opacity="0.95"/>

  <!-- HERO: Wine barrel / lodging cask, centered ~(800,470) -->
  <!-- Barrel body -->
  <ellipse cx="800" cy="470" rx="280" ry="200" fill="url(#barrel)" opacity="0.95"/>
  <!-- Barrel shadow side -->
  <path d="M 800 270 A 280 200 0 0 1 800 670 L 800 270 Z" fill="#78350f" opacity="0.35"/>
  <!-- Barrel staves (vertical hint) -->
  <path d="M 800 275 Q 805 470 800 665" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 680 290 Q 690 470 680 650" stroke="#78350f" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 920 290 Q 910 470 920 650" stroke="#78350f" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Iron hoops -->
  <ellipse cx="800" cy="470" rx="280" ry="200" fill="none" stroke="#1a0e0e" stroke-width="6" opacity="0.7"/>
  <ellipse cx="800" cy="470" rx="245" ry="195" fill="none" stroke="#1a0e0e" stroke-width="4" opacity="0.55"/>
  <ellipse cx="800" cy="470" rx="180" ry="188" fill="none" stroke="#1a0e0e" stroke-width="4" opacity="0.5"/>

  <!-- Lit window/door (lodging inside the barrel) -->
  <rect x="755" y="420" width="90" height="120" rx="6" fill="#fef3ec" opacity="0.9"/>
  <rect x="755" y="420" width="90" height="120" rx="6" fill="url(#glow)"/>
  <line x1="800" y1="420" x2="800" y2="540" stroke="#c2410c" stroke-width="2" opacity="0.6"/>
  <line x1="755" y1="480" x2="845" y2="480" stroke="#c2410c" stroke-width="2" opacity="0.6"/>

  <!-- Tiny chimney smoke/star above (single accent) -->
  <circle cx="1180" cy="200" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="1320" cy="160" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="380" cy="180" r="2.5" fill="#fbbf24" opacity="0.75"/>
</svg>
