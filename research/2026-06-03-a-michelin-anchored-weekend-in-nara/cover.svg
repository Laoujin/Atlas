<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0707"/>
      <stop offset="100%" stop-color="#3a1408"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="toriiTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: atmospheric warm glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: hero element — torii gate centered at (800, 450) -->

  <!-- Moon / ground circle behind torii -->
  <circle cx="800" cy="530" r="170" fill="url(#moonGlow)" opacity="0.55"/>

  <!-- Kasagi — top curved bar (represented as wide rounded rect, slightly wider than the two pillars) -->
  <rect x="545" y="215" width="510" height="52" rx="26" ry="26" fill="url(#toriiTop)" opacity="0.92"/>

  <!-- Shimaki — second horizontal bar -->
  <rect x="590" y="300" width="420" height="36" rx="4" fill="url(#torii)" opacity="0.90"/>

  <!-- Left pillar -->
  <rect x="610" y="300" width="56" height="390" rx="6" fill="url(#torii)" opacity="0.88"/>

  <!-- Right pillar -->
  <rect x="934" y="300" width="56" height="390" rx="6" fill="url(#torii)" opacity="0.88"/>

  <!-- Nuki — small decorative inset on kasagi ends (left and right corner brackets, suggestive of curved upswept ends) -->
  <rect x="545" y="238" width="68" height="28" rx="14" fill="#9a3309" opacity="0.70"/>
  <rect x="987" y="238" width="68" height="28" rx="14" fill="#9a3309" opacity="0.70"/>

  <!-- Layer 3: decorative edge elements (outside safe zone) -->
  <!-- Faint horizontal ground line -->
  <rect x="0" y="688" width="1600" height="3" fill="#c2410c" opacity="0.18"/>
  <!-- Subtle corner warmth — bottom left -->
  <circle cx="0" cy="900" r="320" fill="#78350f" opacity="0.12"/>
  <!-- Subtle corner warmth — bottom right -->
  <circle cx="1600" cy="900" r="320" fill="#78350f" opacity="0.12"/>
</svg>
