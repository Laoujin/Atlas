<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- evening sun glow behind the gate -->
  <circle cx="800" cy="470" r="230" fill="url(#sun)" opacity="0.92"/>
  <circle cx="800" cy="470" r="300" fill="#fbbf24" opacity="0.12"/>

  <!-- rolling hill (deer park) silhouette -->
  <path d="M0 700 Q400 600 800 660 Q1200 720 1600 640 L1600 900 L0 900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- HERO: torii gate, centered ~ (800,450), within safe zone -->
  <g fill="url(#torii)" opacity="0.95">
    <!-- top lintel (kasagi), curved -->
    <path d="M540 250 Q800 215 1060 250 L1060 295 Q800 262 540 295 Z"/>
    <!-- second beam (nuki) -->
    <rect x="565" y="330" width="470" height="38"/>
    <!-- left pillar -->
    <rect x="600" y="265" width="46" height="455"/>
    <!-- right pillar -->
    <rect x="954" y="265" width="46" height="455"/>
  </g>

  <!-- two hanging lanterns flanking the gate -->
  <g opacity="0.9">
    <rect x="666" y="368" width="6" height="34" fill="#78350f"/>
    <ellipse cx="669" cy="424" rx="26" ry="34" fill="#fbbf24" opacity="0.85"/>
    <rect x="928" y="368" width="6" height="34" fill="#78350f"/>
    <ellipse cx="931" cy="424" rx="26" ry="34" fill="#fbbf24" opacity="0.85"/>
  </g>
</svg>
