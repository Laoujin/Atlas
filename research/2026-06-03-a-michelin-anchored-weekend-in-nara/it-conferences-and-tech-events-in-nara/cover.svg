<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1507"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Node fill -->
    <radialGradient id="nodeFill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Arc stroke gradient -->
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 3 (decoration): faint full-bleed arc rings at low opacity, outer rings may clip -->
  <circle cx="800" cy="450" r="420" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.12"/>
  <circle cx="800" cy="450" r="500" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="800" cy="450" r="580" fill="none" stroke="#78350f" stroke-width="1" stroke-opacity="0.06"/>

  <!-- Layer 2: Hero element — node-and-edge graph centered at (800, 450) -->
  <!-- Hub glow halo -->
  <circle cx="800" cy="450" r="220" fill="url(#hubGlow)"/>

  <!-- Edge lines from hub to satellite nodes -->
  <!-- Node positions (6 nodes on a 260-radius ring) -->
  <!-- 0°: (1060, 450), 60°: (930, 675), 120°: (670, 675), 180°: (540, 450), 240°: (670, 225), 300°: (930, 225) -->
  <line x1="800" y1="450" x2="1052" y2="450"  stroke="#d97706" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="800" y1="450" x2="930"  y2="675"  stroke="#d97706" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="800" y1="450" x2="670"  y2="675"  stroke="#d97706" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="800" y1="450" x2="548"  y2="450"  stroke="#d97706" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="800" y1="450" x2="670"  y2="225"  stroke="#d97706" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="800" y1="450" x2="930"  y2="225"  stroke="#d97706" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Inner orbit ring -->
  <circle cx="800" cy="450" r="260" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 12"/>

  <!-- Satellite nodes -->
  <circle cx="1052" cy="450" r="28" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="930"  cy="675" r="28" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="670"  cy="675" r="28" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="548"  cy="450" r="28" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="670"  cy="225" r="28" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="930"  cy="225" r="28" fill="url(#nodeFill)" opacity="0.88"/>

  <!-- Secondary edges between adjacent satellite nodes -->
  <line x1="1052" y1="450" x2="930"  y2="225"  stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="930"  y1="225" x2="670"  y2="225"  stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="670"  y1="225" x2="548"  y2="450"  stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="548"  y1="450" x2="670"  y2="675"  stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="670"  cy="675" x2="930"  y2="675"  stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="930"  y1="675" x2="1052" y2="450"  stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Hub -->
  <circle cx="800" cy="450" r="58" fill="url(#hubFill)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="44" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5"/>
</svg>
