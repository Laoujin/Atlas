<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="95%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.35"/>
    </linearGradient>
    <symbol id="star" viewBox="-50 -50 100 100">
      <path d="M0,-44 L12,-14 L44,-14 L18,5 L28,36 L0,18 L-28,36 L-18,5 L-44,-14 L-12,-14 Z"
            fill="#fbbf24" stroke="#fef3ec" stroke-width="1.2" stroke-opacity="0.6"/>
    </symbol>
  </defs>

  <!-- Full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm radial restaurant glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Faint horizon water line (fjord) -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#water)" opacity="0.7"/>

  <!-- Decorative warehouse silhouettes (corners, cropped freely) -->
  <g opacity="0.45" fill="#1a0e0e">
    <polygon points="0,640 90,640 110,610 180,610 200,640 280,640 280,900 0,900"/>
    <rect x="120" y="660" width="14" height="22" fill="#d97706" opacity="0.5"/>
    <rect x="160" y="660" width="14" height="22" fill="#d97706" opacity="0.5"/>
    <polygon points="1320,640 1360,610 1430,610 1460,640 1540,640 1560,620 1600,620 1600,900 1320,900"/>
    <rect x="1380" y="665" width="12" height="20" fill="#d97706" opacity="0.5"/>
    <rect x="1420" y="665" width="12" height="20" fill="#d97706" opacity="0.5"/>
    <rect x="1480" y="665" width="12" height="20" fill="#d97706" opacity="0.5"/>
  </g>

  <!-- Hero: plate centered at (800, 510), within safe zone -->
  <g>
    <!-- soft shadow under plate -->
    <ellipse cx="800" cy="640" rx="340" ry="28" fill="#000" opacity="0.45"/>
    <!-- outer rim glow -->
    <circle cx="800" cy="510" r="295" fill="url(#rim)" opacity="0.9"/>
    <!-- plate body -->
    <circle cx="800" cy="510" r="275" fill="url(#plate)"/>
    <!-- inner well -->
    <circle cx="800" cy="510" r="205" fill="#1a0e0e" opacity="0.35"/>
    <!-- scallop / oyster centerpiece: two overlapping coastal forms -->
    <path d="M720,520 Q720,430 800,420 Q880,430 880,520 Q880,560 800,575 Q720,560 720,520 Z"
          fill="#fef3ec" opacity="0.92"/>
    <g stroke="#9a3309" stroke-width="2" opacity="0.55" fill="none">
      <path d="M800,420 Q795,490 800,575"/>
      <path d="M760,425 Q768,495 770,572"/>
      <path d="M840,425 Q832,495 830,572"/>
      <path d="M735,440 Q748,500 745,565"/>
      <path d="M865,440 Q852,500 855,565"/>
    </g>
    <!-- accent drop -->
    <circle cx="800" cy="500" r="10" fill="#be185d" opacity="0.85"/>
  </g>

  <!-- Three stars arcing above the plate (the 3-star achievement) -->
  <use href="#star" x="640" y="200" width="78" height="78"/>
  <use href="#star" x="800" y="160" width="92" height="92"/>
  <use href="#star" x="960" y="200" width="78" height="78"/>
</svg>
