<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#e3d8c2"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="canvas2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- background wall -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#wall)"/>
  <!-- gallery floor band -->
  <rect x="0" y="760" width="1600" height="140" fill="#c9bca0" opacity="0.7"/>
  <!-- spotlight glow -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#spot)"/>

  <!-- side small frame (decorative, partly cropped on card) -->
  <g opacity="0.85">
    <rect x="1300" y="320" width="190" height="240" rx="6" fill="url(#frame)"/>
    <rect x="1322" y="342" width="146" height="196" fill="url(#canvas2)"/>
    <circle cx="1395" cy="430" r="38" fill="#9a3309" opacity="0.75"/>
  </g>

  <!-- left small frame -->
  <g opacity="0.85">
    <rect x="190" y="350" width="170" height="210" rx="6" fill="#78350f"/>
    <rect x="210" y="370" width="130" height="170" fill="#f0eadb"/>
    <path d="M210 470 L260 410 L300 460 L340 400 L340 540 L210 540 Z" fill="#c2410c" opacity="0.8"/>
  </g>

  <!-- HERO: central framed canvas, centered ~ (800,450) -->
  <g>
    <!-- frame -->
    <rect x="560" y="210" width="480" height="470" rx="8" fill="url(#frame)"/>
    <!-- inner mat -->
    <rect x="592" y="242" width="416" height="406" fill="#fef3ec"/>
    <!-- canvas -->
    <rect x="620" y="270" width="360" height="350" fill="url(#canvas)"/>
    <!-- abstract composition inside -->
    <circle cx="745" cy="385" r="78" fill="#fbbf24" opacity="0.9"/>
    <path d="M620 560 L760 430 L860 540 L980 420 L980 620 L620 620 Z" fill="#78350f" opacity="0.85"/>
    <rect x="860" y="320" width="70" height="170" fill="#fef3ec" opacity="0.55"/>
  </g>

  <!-- pedestal light line under hero -->
  <rect x="600" y="700" width="400" height="10" rx="5" fill="#9a3309" opacity="0.5"/>
</svg>
