<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="78%" r="85%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2c130d"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- stage light beams fanning from the source -->
  <g opacity="0.8">
    <polygon points="800,250 560,820 740,820" fill="url(#beam)"/>
    <polygon points="800,250 720,820 880,820" fill="url(#beam)" opacity="0.9"/>
    <polygon points="800,250 860,820 1040,820" fill="url(#beam)"/>
    <polygon points="800,250 1020,820 1280,820" fill="url(#beam)" opacity="0.7"/>
  </g>

  <!-- travel-radius arcs around the venue point -->
  <g fill="none" stroke="#d97706" opacity="0.5">
    <circle cx="800" cy="600" r="150" stroke-width="3" opacity="0.7"/>
    <circle cx="800" cy="600" r="245" stroke-width="2.5"/>
    <circle cx="800" cy="600" r="335" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- hero glow + venue node -->
  <ellipse cx="800" cy="600" rx="320" ry="120" fill="url(#glow)" opacity="0.55"/>
  <circle cx="800" cy="600" r="42" fill="#fbbf24"/>
  <circle cx="800" cy="600" r="42" fill="none" stroke="#fef3ec" stroke-width="3" opacity="0.8"/>

  <!-- light source fixture -->
  <circle cx="800" cy="250" r="26" fill="#c2410c"/>
  <circle cx="800" cy="250" r="26" fill="url(#glow)"/>
</svg>
