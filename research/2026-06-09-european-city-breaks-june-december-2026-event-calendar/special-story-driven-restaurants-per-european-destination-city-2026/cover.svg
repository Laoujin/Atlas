<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="45%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="#1a0e0e"/>
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.9"/>

  <!-- left plate -->
  <circle cx="600" cy="470" r="220" fill="url(#rim)" opacity="0.9"/>
  <circle cx="600" cy="470" r="168" fill="url(#plate)" opacity="0.92"/>
  <circle cx="600" cy="470" r="120" fill="#1a0e0e" opacity="0.25"/>

  <!-- right plate (overlapping, behind) -->
  <circle cx="1000" cy="430" r="190" fill="url(#rim)" opacity="0.85"/>
  <circle cx="1000" cy="430" r="142" fill="url(#plate)" opacity="0.88"/>
  <circle cx="1000" cy="430" r="100" fill="#1a0e0e" opacity="0.22"/>

  <!-- wine glass silhouette (hero accent, centred) -->
  <path d="M760 300 L840 300 Q840 380 800 408 Q760 380 760 300 Z" fill="url(#wine)" opacity="0.95"/>
  <rect x="796" y="408" width="8" height="118" fill="#5c2a1a" opacity="0.95"/>
  <ellipse cx="800" cy="530" rx="46" ry="14" fill="#5c2a1a" opacity="0.95"/>
  <ellipse cx="800" cy="324" rx="40" ry="11" fill="#fbbf24" opacity="0.55"/>

  <!-- faint table-edge decoration, full bleed bottom -->
  <rect x="0" y="760" width="1600" height="140" fill="#78350f" opacity="0.35"/>
</svg>
