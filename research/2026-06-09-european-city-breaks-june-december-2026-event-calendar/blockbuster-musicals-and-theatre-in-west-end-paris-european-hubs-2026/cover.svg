<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2c130d"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="stage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Hero: spotlight cone from above -->
  <path d="M800 150 L1050 760 L550 760 Z" fill="url(#cone)"/>
  <ellipse cx="800" cy="760" rx="250" ry="40" fill="url(#stage)"/>

  <!-- Lamp source -->
  <circle cx="800" cy="150" r="26" fill="#fbbf24"/>
  <circle cx="800" cy="150" r="44" fill="#fbbf24" opacity="0.25"/>

  <!-- Stage floor band -->
  <rect x="125" y="760" width="1350" height="60" fill="#78350f" opacity="0.7"/>

  <!-- Draped curtains framing the hero -->
  <path d="M125 90 Q300 200 290 760 L125 760 Z" fill="url(#curtain)" opacity="0.92"/>
  <path d="M1475 90 Q1300 200 1310 760 L1475 760 Z" fill="url(#curtain)" opacity="0.92"/>

  <!-- Curtain pleat highlights -->
  <path d="M200 110 Q250 380 230 760" stroke="#c2410c" stroke-width="6" fill="none" opacity="0.6"/>
  <path d="M1400 110 Q1350 380 1370 760" stroke="#c2410c" stroke-width="6" fill="none" opacity="0.6"/>

  <!-- Top valance -->
  <path d="M125 90 Q800 60 1475 90 L1475 150 Q800 130 125 150 Z" fill="#9a3309" opacity="0.9"/>
</svg>
