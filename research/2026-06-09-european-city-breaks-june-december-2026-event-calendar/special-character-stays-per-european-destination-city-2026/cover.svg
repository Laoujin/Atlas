<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- hero: historic facade, centered ~ (800,450) -->
  <g opacity="0.95">
    <!-- main building block -->
    <rect x="560" y="250" width="480" height="430" rx="6" fill="url(#facade)" opacity="0.92"/>
    <!-- pediment / cornice -->
    <path d="M540 250 L800 150 L1060 250 Z" fill="#78350f" opacity="0.9"/>
    <rect x="560" y="244" width="480" height="14" fill="#fbbf24" opacity="0.5"/>

    <!-- arched doorway (the lit conversion entrance) -->
    <path d="M720 680 L720 500 a80 80 0 0 1 160 0 L880 680 Z" fill="url(#door)" opacity="0.92"/>
    <path d="M745 680 L745 510 a55 55 0 0 1 110 0 L855 680 Z" fill="#5c2a1a" opacity="0.55"/>

    <!-- window rows, warm-lit -->
    <g fill="#fbbf24" opacity="0.42">
      <rect x="600" y="320" width="60" height="90" rx="4"/>
      <rect x="940" y="320" width="60" height="90" rx="4"/>
      <rect x="600" y="470" width="60" height="90" rx="4"/>
      <rect x="940" y="470" width="60" height="90" rx="4"/>
    </g>
    <g stroke="#78350f" stroke-width="4" opacity="0.5">
      <line x1="630" y1="320" x2="630" y2="410"/>
      <line x1="970" y1="320" x2="970" y2="410"/>
      <line x1="630" y1="470" x2="630" y2="560"/>
      <line x1="970" y1="470" x2="970" y2="560"/>
    </g>
  </g>

  <!-- foreground street line -->
  <rect x="0" y="678" width="1600" height="10" fill="#1a0e0e" opacity="0.7"/>
</svg>
