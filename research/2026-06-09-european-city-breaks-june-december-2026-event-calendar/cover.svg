<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Hero radial glow centred on arc midpoint -->
    <radialGradient id="glow-centre" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Node inner glow -->
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Node halo -->
    <radialGradient id="node-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Arc gradient -->
    <linearGradient id="arc-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Horizon glow at bottom -->
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Horizon warmth strip at bottom -->
  <rect width="1600" height="900" fill="url(#horizon)"/>

  <!-- Layer 2: Hero — journey arc + destination nodes -->
  <!-- Central radial glow behind entire hero -->
  <ellipse cx="800" cy="450" rx="680" ry="340" fill="url(#glow-centre)"/>

  <!-- The journey arc: cubic bezier sweeping through 6 city positions -->
  <!-- Arc path connects 6 nodes in a gentle S-curve across safe zone -->
  <path d="M 200 560 C 350 390, 550 320, 700 420 S 950 540, 1100 420 S 1320 310, 1400 420"
        fill="none"
        stroke="url(#arc-grad)"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- Faint dashed echo of the arc for depth -->
  <path d="M 200 560 C 350 390, 550 320, 700 420 S 950 540, 1100 420 S 1320 310, 1400 420"
        fill="none"
        stroke="#d97706"
        stroke-width="1"
        stroke-dasharray="8 18"
        stroke-linecap="round"
        opacity="0.3"/>

  <!-- Node halos (large soft circles) -->
  <circle cx="200" cy="560" r="72" fill="url(#node-halo)"/>
  <circle cx="460" cy="368" r="72" fill="url(#node-halo)"/>
  <circle cx="700" cy="420" r="72" fill="url(#node-halo)"/>
  <circle cx="940" cy="515" r="72" fill="url(#node-halo)"/>
  <circle cx="1150" cy="395" r="72" fill="url(#node-halo)"/>
  <circle cx="1400" cy="420" r="72" fill="url(#node-halo)"/>

  <!-- Node rings (outer ring) -->
  <circle cx="200" cy="560" r="34" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
  <circle cx="460" cy="368" r="34" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
  <circle cx="700" cy="420" r="34" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
  <circle cx="940" cy="515" r="34" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
  <circle cx="1150" cy="395" r="34" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
  <circle cx="1400" cy="420" r="34" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>

  <!-- Node fills (inner glow dots) -->
  <circle cx="200" cy="560" r="22" fill="url(#node-glow)" opacity="0.88"/>
  <circle cx="460" cy="368" r="22" fill="url(#node-glow)" opacity="0.88"/>
  <circle cx="700" cy="420" r="22" fill="url(#node-glow)" opacity="0.88"/>
  <circle cx="940" cy="515" r="22" fill="url(#node-glow)" opacity="0.88"/>
  <circle cx="1150" cy="395" r="22" fill="url(#node-glow)" opacity="0.88"/>
  <circle cx="1400" cy="420" r="22" fill="url(#node-glow)" opacity="0.88"/>

  <!-- Node centre dots (brightest point) -->
  <circle cx="200" cy="560" r="7" fill="#fbbf24" opacity="0.95"/>
  <circle cx="460" cy="368" r="7" fill="#fbbf24" opacity="0.95"/>
  <circle cx="700" cy="420" r="7" fill="#fbbf24" opacity="0.95"/>
  <circle cx="940" cy="515" r="7" fill="#fbbf24" opacity="0.95"/>
  <circle cx="1150" cy="395" r="7" fill="#fbbf24" opacity="0.95"/>
  <circle cx="1400" cy="420" r="7" fill="#fbbf24" opacity="0.95"/>

  <!-- Layer 3: Edge decorations (outside safe zone, atmospheric only) -->
  <!-- Top-left corner warm haze -->
  <ellipse cx="0" cy="0" rx="260" ry="200" fill="#c2410c" opacity="0.07"/>
  <!-- Bottom-right corner warm haze -->
  <ellipse cx="1600" cy="900" rx="300" ry="220" fill="#78350f" opacity="0.09"/>
  <!-- Subtle horizontal rule near top edge -->
  <line x1="0" y1="68" x2="1600" y2="68" stroke="#9a3309" stroke-width="1" opacity="0.25"/>
  <!-- Subtle horizontal rule near bottom edge -->
  <line x1="0" y1="832" x2="1600" y2="832" stroke="#9a3309" stroke-width="1" opacity="0.25"/>
</svg>
