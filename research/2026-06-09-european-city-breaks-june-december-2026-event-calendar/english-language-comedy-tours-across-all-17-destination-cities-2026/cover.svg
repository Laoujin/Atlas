<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- spotlight beam from top, widening to the stage -->
  <polygon points="720,90 880,90 1060,720 540,720" fill="url(#beam)"/>

  <!-- light pool on the floor -->
  <ellipse cx="800" cy="730" rx="360" ry="70" fill="url(#pool)"/>

  <!-- microphone hero, centered ~800,450 -->
  <g>
    <!-- stand -->
    <rect x="788" y="470" width="24" height="250" rx="10" fill="url(#mic)" opacity="0.95"/>
    <!-- base -->
    <ellipse cx="800" cy="725" rx="70" ry="16" fill="#78350f" opacity="0.9"/>
    <!-- body / capsule -->
    <rect x="752" y="240" width="96" height="180" rx="48" fill="url(#mic)" opacity="0.95"/>
    <!-- grille head -->
    <circle cx="800" cy="290" r="64" fill="#c2410c" opacity="0.95"/>
    <circle cx="800" cy="290" r="64" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
    <!-- grille slats -->
    <path d="M752 270 H848 M748 290 H852 M752 310 H848" stroke="#1a0e0e" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
    <!-- highlight -->
    <ellipse cx="778" cy="270" rx="16" ry="26" fill="#fbbf24" opacity="0.45"/>
  </g>
</svg>
