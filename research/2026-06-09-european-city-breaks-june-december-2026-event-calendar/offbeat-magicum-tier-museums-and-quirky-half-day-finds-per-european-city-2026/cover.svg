<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- quirky aura behind facade -->
  <ellipse cx="800" cy="430" rx="520" ry="420" fill="url(#glow)"/>

  <!-- pediment -->
  <polygon points="800,170 1090,330 510,330" fill="url(#stone)" opacity="0.95"/>
  <circle cx="800" cy="295" r="30" fill="#1a0e0e" opacity="0.85"/>
  <circle cx="800" cy="295" r="14" fill="#fbbf24" opacity="0.9"/>

  <!-- architrave -->
  <rect x="500" y="330" width="600" height="46" fill="url(#stone)"/>

  <!-- columns -->
  <rect x="540" y="382" width="58" height="320" rx="6" fill="url(#col)"/>
  <rect x="660" y="382" width="58" height="320" rx="6" fill="url(#col)"/>
  <rect x="781" y="382" width="58" height="320" rx="6" fill="url(#col)"/>
  <rect x="902" y="382" width="58" height="320" rx="6" fill="url(#col)"/>
  <rect x="1022" y="382" width="58" height="320" rx="6" fill="url(#col)"/>

  <!-- base / steps -->
  <rect x="500" y="702" width="600" height="26" fill="url(#stone)"/>
  <rect x="468" y="728" width="664" height="26" fill="#78350f"/>
  <rect x="436" y="754" width="728" height="26" fill="#5c2a1a"/>

  <!-- floating curiosities (offbeat accent) -->
  <circle cx="430" cy="300" r="9" fill="#fbbf24" opacity="0.85"/>
  <circle cx="1175" cy="360" r="7" fill="#fbbf24" opacity="0.8"/>
  <circle cx="1230" cy="250" r="11" fill="#d97706" opacity="0.7"/>
  <circle cx="370" cy="420" r="6" fill="#fbbf24" opacity="0.7"/>
</svg>
