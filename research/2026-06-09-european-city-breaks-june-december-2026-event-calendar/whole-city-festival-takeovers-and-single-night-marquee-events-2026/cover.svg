<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- full-bleed night sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- horizon festival glow behind the city -->
  <rect x="0" y="560" width="1600" height="180" fill="url(#glow)" opacity="0.7"/>

  <!-- hero: firework burst centered above skyline -->
  <g opacity="0.92">
    <circle cx="800" cy="350" r="210" fill="url(#burst)"/>
    <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="800" y1="350" x2="800" y2="150"/>
      <line x1="800" y1="350" x2="800" y2="550"/>
      <line x1="800" y1="350" x2="600" y2="350"/>
      <line x1="800" y1="350" x2="1000" y2="350"/>
      <line x1="800" y1="350" x2="658" y2="208"/>
      <line x1="800" y1="350" x2="942" y2="208"/>
      <line x1="800" y1="350" x2="658" y2="492"/>
      <line x1="800" y1="350" x2="942" y2="492"/>
    </g>
    <g fill="#fef3ec">
      <circle cx="800" cy="150" r="7"/>
      <circle cx="800" cy="550" r="7"/>
      <circle cx="600" cy="350" r="7"/>
      <circle cx="1000" cy="350" r="7"/>
      <circle cx="658" cy="208" r="6"/>
      <circle cx="942" cy="208" r="6"/>
      <circle cx="658" cy="492" r="6"/>
      <circle cx="942" cy="492" r="6"/>
    </g>
  </g>

  <!-- secondary smaller bursts -->
  <circle cx="430" cy="280" r="70" fill="url(#burst)" opacity="0.7"/>
  <circle cx="1180" cy="300" r="90" fill="url(#burst)" opacity="0.7"/>

  <!-- city skyline silhouette, hero baseline inside safe zone -->
  <path d="M0 740
    L0 620 L60 620 L60 660 L130 660 L130 580 L210 580 L210 640 L300 640 L300 540 L360 540 L360 600
    L450 600 L450 500 L500 500 L500 470 L540 470 L540 560 L630 560 L630 520 L700 520 L700 600
    L770 600 L770 460 L820 460 L820 600 L900 600 L900 540 L980 540 L980 580 L1060 580 L1060 500
    L1110 500 L1110 470 L1150 470 L1150 560 L1240 560 L1240 600 L1320 600 L1320 540 L1400 540
    L1400 620 L1480 620 L1480 660 L1560 660 L1600 660 L1600 740 Z"
    fill="#1a0e0e" opacity="0.95"/>

  <!-- lit windows -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="785" y="490" width="12" height="14"/>
    <rect x="785" y="520" width="12" height="14"/>
    <rect x="475" y="510" width="10" height="12"/>
    <rect x="1075" y="510" width="10" height="12"/>
    <rect x="315" y="560" width="10" height="12"/>
    <rect x="1335" y="560" width="10" height="12"/>
  </g>
</svg>
