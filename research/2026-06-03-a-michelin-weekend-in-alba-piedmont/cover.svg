<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm radial glow behind the plate -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate gradient (ivory warm) -->
    <radialGradient id="plate" cx="46%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b8"/>
    </radialGradient>

    <!-- Inner plate ring gradient -->
    <radialGradient id="innerPlate" cx="46%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e8ddd0"/>
    </radialGradient>

    <!-- Wine glass fill gradient -->
    <linearGradient id="wineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9a1756" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Rose accent gradient for second decorative element -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="url(#roseGlow)" opacity="0.5"/>

  <!-- Layer 2: Warm radial glow at center -->
  <ellipse cx="800" cy="468" rx="560" ry="380" fill="url(#glow)"/>

  <!-- Hero: Plate -->
  <!-- Outer plate rim (shadow ring) -->
  <circle cx="800" cy="490" r="248" fill="#2a1008" opacity="0.55"/>
  <!-- Plate body -->
  <circle cx="800" cy="483" r="244" fill="url(#plate)" opacity="0.97"/>
  <!-- Inner plate ring (decorative band) -->
  <circle cx="800" cy="483" r="210" fill="none" stroke="#c9baa8" stroke-width="6" opacity="0.6"/>
  <!-- Inner plate well -->
  <circle cx="800" cy="483" r="190" fill="url(#innerPlate)" opacity="0.85"/>

  <!-- Rust accent: small sauce arc / dot composition on plate -->
  <circle cx="800" cy="460" r="28" fill="#c2410c" opacity="0.82"/>
  <circle cx="800" cy="460" r="16" fill="#fbbf24" opacity="0.65"/>
  <!-- Two smaller sauce dots -->
  <circle cx="748" cy="500" r="10" fill="#9a3309" opacity="0.72"/>
  <circle cx="856" cy="496" r="8" fill="#d97706" opacity="0.68"/>
  <!-- Delicate herb-line strokes on plate -->
  <line x1="780" y1="440" x2="764" y2="415" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="820" y1="437" x2="836" y2="412" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="800" y1="430" x2="800" y2="403" stroke="#9a3309" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Hero: Wine glass silhouette (right of plate, still within safe zone) -->
  <!-- Glass bowl (upper) -->
  <path d="M1060,220 Q1060,380 1000,400 Q980,406 1000,406 L1005,500 L970,510 L970,525 L1065,525 L1065,510 L1030,500 L1035,406 Q1055,406 1035,400 Q975,380 975,220 Z"
        fill="url(#wineGrad)" opacity="0.78"/>
  <!-- Wine level inside glass -->
  <path d="M978,310 Q978,380 1000,400 Q980,406 1035,406 Q1057,400 1037,380 Q1012,360 1012,310 Z"
        fill="#be185d" opacity="0.45"/>
  <!-- Glass highlight -->
  <path d="M982,240 Q982,300 988,340" stroke="#faf8f2" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- Layer 3: Corner/edge decorations (may be cropped — carry no meaning) -->
  <!-- Top-left rust arc -->
  <circle cx="0" cy="0" r="320" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.12"/>
  <circle cx="0" cy="0" r="360" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.08"/>

  <!-- Bottom-right subtle arc -->
  <circle cx="1600" cy="900" r="380" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.1"/>

  <!-- Faint hillside silhouette (Langhe landscape) at bottom edge -->
  <path d="M0,820 Q200,750 400,780 Q600,810 800,755 Q1000,700 1200,745 Q1400,790 1600,760 L1600,900 L0,900 Z"
        fill="#3d1508" opacity="0.45"/>
  <path d="M0,860 Q300,820 550,840 Q750,855 900,830 Q1100,805 1350,835 Q1500,850 1600,838 L1600,900 L0,900 Z"
        fill="#2d1008" opacity="0.6"/>
</svg>
