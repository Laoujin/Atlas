<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slide1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3 decorative: faint edge lines suggesting venue architecture -->
  <line x1="0" y1="900" x2="400" y2="90" stroke="#c2410c" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="1600" y1="900" x2="1200" y2="90" stroke="#c2410c" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Layer 2: hero — stacked presentation slides, centered ~(800,450) -->

  <!-- Back slide (bottom of stack) -->
  <g transform="rotate(-6, 800, 450)">
    <rect x="360" y="210" width="760" height="480" rx="10"
          fill="url(#slide1)" opacity="0.65"/>
    <!-- faint content bars suggesting slide content -->
    <rect x="400" y="270" width="400" height="18" rx="4" fill="url(#bar)" opacity="0.5"/>
    <rect x="400" y="306" width="280" height="12" rx="3" fill="url(#bar)" opacity="0.35"/>
    <rect x="400" y="332" width="320" height="12" rx="3" fill="url(#bar)" opacity="0.28"/>
  </g>

  <!-- Mid slide -->
  <g transform="rotate(-2, 800, 450)">
    <rect x="330" y="190" width="760" height="480" rx="10"
          fill="url(#slide2)" opacity="0.80"/>
    <rect x="370" y="255" width="380" height="18" rx="4" fill="url(#bar)" opacity="0.5"/>
    <rect x="370" y="291" width="260" height="12" rx="3" fill="url(#bar)" opacity="0.35"/>
    <rect x="370" y="317" width="300" height="12" rx="3" fill="url(#bar)" opacity="0.28"/>
    <!-- speaker podium hint: small rectangle at bottom centre -->
    <rect x="680" y="600" width="80" height="40" rx="4" fill="#fbbf24" opacity="0.18"/>
  </g>

  <!-- Front/hero slide -->
  <rect x="295" y="170" width="760" height="480" rx="12"
        fill="url(#slide3)" opacity="0.92"/>
  <!-- screen header bar -->
  <rect x="295" y="170" width="760" height="52" rx="12" fill="#78350f" opacity="0.7"/>
  <rect x="295" y="200" width="760" height="22" fill="#78350f" opacity="0.7"/>
  <!-- three dots (window chrome) -->
  <circle cx="332" cy="196" r="9" fill="#fbbf24" opacity="0.55"/>
  <circle cx="364" cy="196" r="9" fill="#d97706" opacity="0.45"/>
  <circle cx="396" cy="196" r="9" fill="#c2410c" opacity="0.4"/>
  <!-- content bars on front slide -->
  <rect x="340" y="256" width="420" height="22" rx="5" fill="#fef3ec" opacity="0.22"/>
  <rect x="340" y="296" width="300" height="14" rx="3" fill="#fef3ec" opacity="0.16"/>
  <rect x="340" y="322" width="340" height="14" rx="3" fill="#fef3ec" opacity="0.14"/>
  <rect x="340" y="348" width="260" height="14" rx="3" fill="#fef3ec" opacity="0.12"/>
  <!-- graph bars at bottom of slide — suggests data/tech talk -->
  <rect x="340" y="530" width="36" height="70" rx="3" fill="#fbbf24" opacity="0.55"/>
  <rect x="390" y="510" width="36" height="90" rx="3" fill="#fbbf24" opacity="0.48"/>
  <rect x="440" y="490" width="36" height="110" rx="3" fill="#d97706" opacity="0.60"/>
  <rect x="490" y="505" width="36" height="95" rx="3" fill="#d97706" opacity="0.52"/>
  <rect x="540" y="475" width="36" height="125" rx="3" fill="#c2410c" opacity="0.65"/>
  <rect x="590" y="495" width="36" height="105" rx="3" fill="#c2410c" opacity="0.55"/>
  <rect x="640" y="515" width="36" height="85" rx="3" fill="#9a3309" opacity="0.50"/>

  <!-- node dots at safe-zone corners suggesting network/tech -->
  <circle cx="200" cy="150" r="14" fill="#c2410c" opacity="0.35"/>
  <circle cx="1400" cy="150" r="14" fill="#c2410c" opacity="0.35"/>
  <circle cx="200" cy="750" r="14" fill="#d97706" opacity="0.30"/>
  <circle cx="1400" cy="750" r="14" fill="#d97706" opacity="0.30"/>
  <!-- connector lines between nodes and slide corners -->
  <line x1="200" y1="150" x2="295" y2="222" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.20"/>
  <line x1="1400" y1="150" x2="1055" y2="222" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.20"/>
</svg>
