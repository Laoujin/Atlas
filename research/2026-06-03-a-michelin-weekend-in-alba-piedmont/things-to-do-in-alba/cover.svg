<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="300" r="320" fill="url(#sun)" opacity="0.7"/>

  <!-- far hill band -->
  <path d="M0 560 Q 400 470 820 540 Q 1200 600 1600 510 L1600 900 L0 900 Z" fill="url(#hillFar)" opacity="0.85"/>

  <!-- vineyard rows on far hill (decorative contour lines) -->
  <g stroke="#fef3ec" stroke-width="3" opacity="0.35" fill="none">
    <path d="M120 590 Q 460 510 840 575"/>
    <path d="M150 640 Q 480 560 870 625"/>
    <path d="M180 690 Q 500 615 900 678"/>
  </g>

  <!-- hero: medieval tower on the central hilltop -->
  <g>
    <rect x="752" y="300" width="96" height="280" rx="6" fill="url(#tower)"/>
    <!-- crenellations -->
    <rect x="752" y="288" width="20" height="22" fill="#c2410c"/>
    <rect x="790" y="288" width="20" height="22" fill="#c2410c"/>
    <rect x="828" y="288" width="20" height="22" fill="#c2410c"/>
    <!-- arched opening -->
    <path d="M784 540 a16 16 0 0 1 32 0 v40 h-32 z" fill="#1a0e0e" opacity="0.55"/>
  </g>

  <!-- near hill -->
  <path d="M0 700 Q 380 620 800 680 Q 1230 740 1600 660 L1600 900 L0 900 Z" fill="url(#hillNear)"/>
  <g stroke="#fbbf24" stroke-width="3" opacity="0.28" fill="none">
    <path d="M160 740 Q 520 670 920 730"/>
    <path d="M200 800 Q 560 735 980 790"/>
  </g>
</svg>
