<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- stacked archive drives (the self-hosted store) -->
  <g opacity="0.9">
    <rect x="560" y="600" width="480" height="74" rx="14" fill="url(#drive)" opacity="0.7"/>
    <rect x="540" y="540" width="520" height="74" rx="14" fill="url(#drive)" opacity="0.82"/>
    <rect x="520" y="478" width="560" height="78" rx="16" fill="url(#drive)"/>
    <circle cx="1020" cy="517" r="9" fill="#fbbf24"/>
    <circle cx="985" cy="517" r="9" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
  </g>

  <!-- hero: rounded play badge -->
  <g>
    <rect x="640" y="180" width="320" height="280" rx="44" fill="url(#play)"/>
    <rect x="640" y="180" width="320" height="280" rx="44" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.7"/>
    <path d="M758 256 L758 384 L862 320 Z" fill="#fef3ec"/>
  </g>

  <!-- download arrow: content flowing from play badge into the store -->
  <g opacity="0.85">
    <rect x="788" y="446" width="24" height="36" rx="6" fill="#fbbf24"/>
    <path d="M768 478 L832 478 L800 520 Z" fill="#fbbf24"/>
  </g>
</svg>
