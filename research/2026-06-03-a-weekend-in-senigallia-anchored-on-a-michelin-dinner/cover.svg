<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0608"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1208"/>
    </linearGradient>
    <!-- Warm glow at horizon / candlelight -->
    <radialGradient id="glow" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Left plate gradient -->
    <radialGradient id="plateL" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c8b0"/>
    </radialGradient>
    <!-- Right plate gradient -->
    <radialGradient id="plateR" cx="38%" cy="36%" r="52%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="60%" stop-color="#ede0cc"/>
      <stop offset="100%" stop-color="#c9b89a"/>
    </radialGradient>
    <!-- Sea shimmer gradient -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b1208" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="rimShadow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm atmospheric glow -->
  <ellipse cx="800" cy="520" rx="760" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Adriatic sea band -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#sea)" opacity="0.7"/>

  <!-- Gentle wave arc suggesting coastline -->
  <path d="M 0,620 Q 200,580 400,610 Q 600,640 800,605 Q 1000,570 1200,600 Q 1400,625 1600,595 L 1600,660 Q 1400,690 1200,660 Q 1000,630 800,665 Q 600,700 400,670 Q 200,645 0,680 Z"
        fill="#c2410c" opacity="0.18"/>

  <!-- Moonlight / light ripple on water -->
  <ellipse cx="800" cy="660" rx="180" ry="28" fill="#fbbf24" opacity="0.10"/>
  <ellipse cx="800" cy="680" rx="110" ry="14" fill="#d97706" opacity="0.12"/>

  <!-- Left plate (hero, slightly behind) -->
  <ellipse cx="710" cy="420" rx="190" ry="52" fill="#5c2a1a" opacity="0.45"/>
  <ellipse cx="710" cy="410" rx="192" ry="53" fill="url(#rimShadow)"/>
  <ellipse cx="710" cy="405" rx="185" ry="48" fill="url(#plateL)" opacity="0.93"/>
  <!-- Small food composition dot on left plate -->
  <ellipse cx="710" cy="402" rx="52" ry="22" fill="#c2410c" opacity="0.55"/>
  <ellipse cx="710" cy="400" rx="28" ry="12" fill="#d97706" opacity="0.70"/>

  <!-- Right plate (hero, in front) -->
  <ellipse cx="920" cy="455" rx="200" ry="55" fill="#5c2a1a" opacity="0.50"/>
  <ellipse cx="920" cy="445" rx="202" ry="56" fill="url(#rimShadow)"/>
  <ellipse cx="920" cy="440" rx="195" ry="50" fill="url(#plateR)" opacity="0.95"/>
  <!-- Small food composition dot on right plate -->
  <ellipse cx="924" cy="436" rx="58" ry="24" fill="#9a3309" opacity="0.50"/>
  <ellipse cx="924" cy="433" rx="30" ry="13" fill="#c2410c" opacity="0.65"/>
  <ellipse cx="924" cy="431" rx="12" ry="6" fill="#fbbf24" opacity="0.55"/>

  <!-- Candlelight accent between the plates -->
  <ellipse cx="820" cy="360" rx="6" ry="22" fill="#fbbf24" opacity="0.85"/>
  <ellipse cx="820" cy="338" rx="9" ry="9" fill="#fbbf24" opacity="0.70"/>
  <ellipse cx="820" cy="380" rx="18" ry="8" fill="#d97706" opacity="0.20"/>

  <!-- Layer 3: decorative stars (outside safe zone, corners) -->
  <circle cx="80" cy="60" r="2.5" fill="#fbbf24" opacity="0.50"/>
  <circle cx="140" cy="40" r="1.8" fill="#fbbf24" opacity="0.35"/>
  <circle cx="55" cy="110" r="1.5" fill="#d97706" opacity="0.40"/>
  <circle cx="1480" cy="55" r="2.2" fill="#fbbf24" opacity="0.45"/>
  <circle cx="1540" cy="80" r="1.6" fill="#fbbf24" opacity="0.30"/>
  <circle cx="1510" cy="30" r="1.2" fill="#d97706" opacity="0.35"/>
  <circle cx="300" cy="70" r="1.4" fill="#fbbf24" opacity="0.28"/>
  <circle cx="1320" cy="50" r="1.8" fill="#fbbf24" opacity="0.32"/>
  <circle cx="960" cy="45" r="1.3" fill="#d97706" opacity="0.25"/>
</svg>
