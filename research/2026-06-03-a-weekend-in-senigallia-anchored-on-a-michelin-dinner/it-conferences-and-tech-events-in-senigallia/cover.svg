<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1408"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero glow: warm radial burst at center -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub circle gradient -->
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Node gradient -->
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Outer ring decoration gradient -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Background atmosphere: large soft radial fill -->
  <ellipse cx="800" cy="450" rx="780" ry="440" fill="url(#outerGlow)"/>

  <!-- Decorative faint concentric rings (background, outside hero safe zone edges) -->
  <circle cx="800" cy="450" r="420" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.12"/>
  <circle cx="800" cy="450" r="340" fill="none" stroke="#d97706" stroke-width="1" opacity="0.10"/>
  <circle cx="800" cy="450" r="260" fill="none" stroke="#d97706" stroke-width="1" opacity="0.08"/>

  <!-- Layer 2: Hero element — conference node graph centered at (800, 450) -->
  <!-- Hero glow burst -->
  <ellipse cx="800" cy="450" rx="480" ry="340" fill="url(#glow)"/>

  <!-- Spoke lines from hub to satellite nodes -->
  <!-- Node positions: 6 satellites on an orbit radius ~210px around (800,450) -->
  <!-- Top:         (800, 240)  -->
  <!-- Upper-right: (982, 345)  -->
  <!-- Lower-right: (982, 555)  -->
  <!-- Bottom:      (800, 660)  -->
  <!-- Lower-left:  (618, 555)  -->
  <!-- Upper-left:  (618, 345)  -->
  <line x1="800" y1="450" x2="800" y2="255" stroke="#d97706" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="978" y2="348" stroke="#d97706" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="978" y2="552" stroke="#d97706" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="800" y2="645" stroke="#d97706" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="622" y2="552" stroke="#d97706" stroke-width="2.5" opacity="0.55"/>
  <line x1="800" y1="450" x2="622" y2="348" stroke="#d97706" stroke-width="2.5" opacity="0.55"/>

  <!-- Secondary connection arcs between adjacent nodes (conference network feel) -->
  <line x1="800" y1="255" x2="978" y2="348" stroke="#c2410c" stroke-width="1.5" opacity="0.30"/>
  <line x1="978" y1="348" x2="978" y2="552" stroke="#c2410c" stroke-width="1.5" opacity="0.30"/>
  <line x1="978" y1="552" x2="800" y2="645" stroke="#c2410c" stroke-width="1.5" opacity="0.30"/>
  <line x1="800" y1="645" x2="622" y2="552" stroke="#c2410c" stroke-width="1.5" opacity="0.30"/>
  <line x1="622" y1="552" x2="622" y2="348" stroke="#c2410c" stroke-width="1.5" opacity="0.30"/>
  <line x1="622" y1="348" x2="800" y2="255" stroke="#c2410c" stroke-width="1.5" opacity="0.30"/>

  <!-- Satellite nodes -->
  <circle cx="800" cy="255" r="22" fill="url(#node)" opacity="0.88"/>
  <circle cx="978" cy="348" r="22" fill="url(#node)" opacity="0.88"/>
  <circle cx="978" cy="552" r="22" fill="url(#node)" opacity="0.88"/>
  <circle cx="800" cy="645" r="22" fill="url(#node)" opacity="0.88"/>
  <circle cx="622" cy="552" r="22" fill="url(#node)" opacity="0.88"/>
  <circle cx="622" cy="348" r="22" fill="url(#node)" opacity="0.88"/>

  <!-- Hub: central stage/podium circle -->
  <circle cx="800" cy="450" r="72" fill="#78350f" opacity="0.95"/>
  <circle cx="800" cy="450" r="60" fill="url(#hub)" opacity="0.95"/>
  <!-- Inner accent ring on hub -->
  <circle cx="800" cy="450" r="48" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.60"/>

  <!-- Layer 3: Corner decorations (outside safe zone, purely atmospheric) -->
  <!-- Top-left corner arc -->
  <path d="M 0 0 Q 160 0 160 160" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.18"/>
  <!-- Bottom-right corner arc -->
  <path d="M 1600 900 Q 1440 900 1440 740" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.18"/>
</svg>
