<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1508"/>
    </linearGradient>
    <!-- Warm ambient glow at center -->
    <radialGradient id="glow" cx="50%" cy="52%" r="45%" gradientUnits="userSpaceOnUse"
      fx="800" fy="468" fr="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate radial fills -->
    <radialGradient id="plate-left" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="70%" stop-color="#3a1508"/>
      <stop offset="100%" stop-color="#2a0f05"/>
    </radialGradient>
    <radialGradient id="plate-right" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="70%" stop-color="#3a1508"/>
      <stop offset="100%" stop-color="#2a0f05"/>
    </radialGradient>
    <!-- Plate rim highlight -->
    <radialGradient id="rim-glow" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="94%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Ambient warm glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — two plates and a wine glass, centered around (800, 450) -->

  <!-- Left plate (cx≈620, cy≈470) -->
  <circle cx="620" cy="470" r="185" fill="url(#plate-left)" opacity="0.92"/>
  <circle cx="620" cy="470" r="185" fill="url(#rim-glow)"/>
  <!-- Inner well of left plate -->
  <circle cx="620" cy="470" r="130" fill="#2a0f05" opacity="0.7"/>
  <!-- Food accent dot — a small seared morsel -->
  <circle cx="620" cy="455" r="28" fill="#c2410c" opacity="0.85"/>
  <circle cx="620" cy="455" r="14" fill="#d97706" opacity="0.7"/>

  <!-- Right plate (cx≈980, cy≈470) -->
  <circle cx="980" cy="470" r="185" fill="url(#plate-right)" opacity="0.92"/>
  <circle cx="980" cy="470" r="185" fill="url(#rim-glow)"/>
  <circle cx="980" cy="470" r="130" fill="#2a0f05" opacity="0.7"/>
  <!-- Food accent dot -->
  <circle cx="980" cy="455" r="28" fill="#c2410c" opacity="0.85"/>
  <circle cx="980" cy="455" r="14" fill="#d97706" opacity="0.7"/>

  <!-- Wine glass silhouette centered between the plates at (800, 430) -->
  <!-- Bowl of glass -->
  <path d="M755 290 Q755 430 800 440 Q845 430 845 290 Z"
        fill="#9a3309" opacity="0.75"/>
  <!-- Stem -->
  <rect x="795" y="440" width="10" height="110" fill="#78350f" opacity="0.8"/>
  <!-- Base -->
  <ellipse cx="800" cy="555" rx="48" ry="10" fill="#78350f" opacity="0.7"/>
  <!-- Glass highlight -->
  <path d="M768 310 Q762 390 775 420"
        stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.35"
        stroke-linecap="round"/>
  <!-- Wine fill inside glass -->
  <path d="M762 390 Q762 430 800 440 Q838 430 838 390 Z"
        fill="#c2410c" opacity="0.55"/>

  <!-- Star accent dots — Michelin star suggestion (three small diamonds above glass) -->
  <polygon points="800,248 806,262 821,262 810,271 814,285 800,276 786,285 790,271 779,262 794,262"
           fill="#d97706" opacity="0.85"/>
  <polygon points="754,268 758,278 769,278 761,284 763,294 754,288 745,294 747,284 739,278 750,278"
           fill="#fbbf24" opacity="0.6"/>
  <polygon points="846,268 850,278 861,278 853,284 855,294 846,288 837,294 839,284 831,278 842,278"
           fill="#fbbf24" opacity="0.6"/>

  <!-- Layer 3: Decorative edge — faint rust arcs at corners (outside safe zone) -->
  <circle cx="0" cy="0" r="280" fill="none"
          stroke="#c2410c" stroke-width="1.5" opacity="0.12"/>
  <circle cx="1600" cy="900" r="280" fill="none"
          stroke="#c2410c" stroke-width="1.5" opacity="0.12"/>
  <circle cx="800" cy="900" r="420" fill="none"
          stroke="#d97706" stroke-width="1" opacity="0.08"/>
</svg>
