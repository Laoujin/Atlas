<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="farMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="midMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="radius" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Far ridge -->
  <path d="M 0 520 L 180 430 L 340 470 L 520 380 L 700 440 L 880 360 L 1080 430 L 1280 390 L 1460 450 L 1600 420 L 1600 600 L 0 600 Z" fill="url(#farMtn)" opacity="0.7"/>

  <!-- Mid ridge (hero massif behind lake) -->
  <path d="M 120 600 L 320 470 L 470 540 L 640 420 L 820 510 L 980 440 L 1180 530 L 1340 470 L 1480 540 L 1480 640 L 120 640 Z" fill="url(#midMtn)" opacity="0.92"/>

  <!-- Lake band -->
  <rect x="0" y="640" width="1600" height="180" fill="url(#lake)"/>
  <path d="M 0 640 Q 400 660 800 645 T 1600 650 L 1600 820 L 0 820 Z" fill="#c2410c" opacity="0.25"/>

  <!-- Foreground shore -->
  <path d="M 0 820 L 1600 820 L 1600 900 L 0 900 Z" fill="#78350f" opacity="0.85"/>

  <!-- 30 km radius — the hero element, centered on the lake/mountains -->
  <circle cx="800" cy="450" r="270" fill="url(#radius)"/>
  <circle cx="800" cy="450" r="270" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 8" opacity="0.85"/>
  <circle cx="800" cy="450" r="270" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.55"/>

  <!-- Pin / locus at center -->
  <circle cx="800" cy="450" r="14" fill="#c2410c"/>
  <circle cx="800" cy="450" r="6" fill="#fbbf24"/>
</svg>
