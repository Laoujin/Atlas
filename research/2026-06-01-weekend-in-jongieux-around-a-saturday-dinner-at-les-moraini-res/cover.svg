<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun behind the ridge -->
  <circle cx="980" cy="430" r="180" fill="url(#sun)" opacity="0.9"/>

  <!-- Far ridge: Mont du Chat silhouette -->
  <path d="M 0 520 L 180 470 L 340 440 L 520 400 L 720 360 L 900 340 L 1100 370 L 1280 410 L 1450 440 L 1600 460 L 1600 620 L 0 620 Z"
        fill="url(#ridgeFar)" opacity="0.75"/>

  <!-- Lake band -->
  <rect x="0" y="600" width="1600" height="60" fill="url(#lake)" opacity="0.85"/>

  <!-- Mid ridge / vineyard hillside, hero element -->
  <path d="M 120 660 L 260 600 L 440 560 L 640 520 L 820 490 L 1000 510 L 1180 550 L 1360 600 L 1480 640 L 1480 810 L 120 810 Z"
        fill="url(#ridgeMid)" opacity="0.95"/>

  <!-- Vineyard rows: diagonal stripes following the slope, low opacity -->
  <g opacity="0.35" stroke="#78350f" stroke-width="3" fill="none">
    <path d="M 260 600 L 280 800"/>
    <path d="M 340 580 L 370 800"/>
    <path d="M 440 560 L 470 800"/>
    <path d="M 540 540 L 575 800"/>
    <path d="M 640 520 L 680 800"/>
    <path d="M 740 505 L 785 800"/>
    <path d="M 820 490 L 870 800"/>
    <path d="M 910 498 L 960 800"/>
    <path d="M 1000 510 L 1050 800"/>
    <path d="M 1090 530 L 1140 800"/>
    <path d="M 1180 550 L 1225 800"/>
    <path d="M 1270 575 L 1310 800"/>
    <path d="M 1360 600 L 1390 800"/>
  </g>

  <!-- Hillside restaurant: a small terraced block perched on the ridge -->
  <g>
    <!-- terrace plinth -->
    <rect x="770" y="490" width="120" height="14" fill="#1a0e0e" opacity="0.75"/>
    <!-- building -->
    <rect x="790" y="458" width="80" height="36" fill="#faf8f2" opacity="0.92"/>
    <!-- roof -->
    <path d="M 784 458 L 830 438 L 876 458 Z" fill="#9a3309"/>
    <!-- warm window glow -->
    <rect x="804" y="470" width="14" height="14" fill="#fbbf24" opacity="0.95"/>
    <rect x="828" y="470" width="14" height="14" fill="#fbbf24" opacity="0.95"/>
    <rect x="852" y="470" width="10" height="14" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- Wine glass silhouette on the right, evening accent -->
  <g opacity="0.85" transform="translate(1260 460)">
    <path d="M -38 0 Q -38 -70 0 -70 Q 38 -70 38 0 Q 38 50 0 60 Q -38 50 -38 0 Z"
          fill="#9a3309" opacity="0.75"/>
    <rect x="-3" y="60" width="6" height="80" fill="#78350f"/>
    <ellipse cx="0" cy="142" rx="40" ry="6" fill="#78350f"/>
    <!-- wine fill -->
    <path d="M -34 -10 Q -34 40 0 50 Q 34 40 34 -10 Z" fill="#c2410c" opacity="0.85"/>
  </g>

  <!-- Foreground lake foam / shoreline accent (decorative, outside safe-zone bottom) -->
  <path d="M 0 820 Q 400 800 800 820 T 1600 820 L 1600 900 L 0 900 Z"
        fill="#78350f" opacity="0.85"/>
</svg>
