<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind the ridge (off-center, west-facing) -->
  <circle cx="1080" cy="360" r="260" fill="url(#sun)"/>

  <!-- Far ridge: Grand Colombier across the Rhône -->
  <path d="M 0 470 L 180 410 L 340 440 L 520 380 L 720 415 L 900 365 L 1100 405 L 1320 370 L 1600 400 L 1600 560 L 0 560 Z"
        fill="url(#ridgeFar)" opacity="0.75"/>

  <!-- Lac du Bourget: thin band of water -->
  <rect x="0" y="555" width="1600" height="38" fill="url(#lake)" opacity="0.85"/>

  <!-- Hero: Mont du Chat ridge with terraced vineyard slope -->
  <path d="M 120 590 L 320 470 L 540 380 L 760 270 L 980 220 L 1180 290 L 1360 380 L 1480 470 L 1480 760 L 120 760 Z"
        fill="url(#ridgeNear)"/>

  <!-- Terrace lines on the vineyard slope (south-west facing, descending right) -->
  <g stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 760 320 Q 980 295 1280 380"/>
    <path d="M 700 380 Q 960 355 1340 440"/>
    <path d="M 640 440 Q 940 415 1400 500"/>
    <path d="M 560 500 Q 920 475 1450 560"/>
    <path d="M 460 560 Q 900 535 1480 620"/>
    <path d="M 340 620 Q 880 595 1480 680"/>
  </g>

  <!-- Vineyard row dots, sparse, following the slope -->
  <g fill="#fef3ec" opacity="0.6">
    <circle cx="820" cy="318" r="3"/>
    <circle cx="900" cy="310" r="3"/>
    <circle cx="980" cy="302" r="3"/>
    <circle cx="1080" cy="320" r="3"/>
    <circle cx="780" cy="378" r="3"/>
    <circle cx="900" cy="368" r="3"/>
    <circle cx="1040" cy="372" r="3"/>
    <circle cx="1180" cy="398" r="3"/>
    <circle cx="720" cy="438" r="3"/>
    <circle cx="880" cy="428" r="3"/>
    <circle cx="1080" cy="434" r="3"/>
    <circle cx="1260" cy="458" r="3"/>
    <circle cx="660" cy="498" r="3"/>
    <circle cx="860" cy="488" r="3"/>
    <circle cx="1100" cy="496" r="3"/>
    <circle cx="1320" cy="520" r="3"/>
  </g>

  <!-- Peak highlight on Mont du Chat summit -->
  <path d="M 760 270 L 870 240 L 980 220 L 1020 245 L 980 260 L 870 270 Z"
        fill="#d97706" opacity="0.7"/>
</svg>
