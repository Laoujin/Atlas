<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#fef3ec" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pin" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="pinTeal" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.6" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft countryside field bands (full-bleed decoration) -->
  <path d="M0 640 Q 400 600 800 625 T 1600 615 L 1600 900 L 0 900 Z" fill="#e8dfc7" opacity="0.55"/>
  <path d="M0 730 Q 500 700 900 720 T 1600 705 L 1600 900 L 0 900 Z" fill="#d8c89f" opacity="0.45"/>

  <!-- Faint grid lines suggesting fields/map (decoration, cropped freely) -->
  <g stroke="#c2410c" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 200 L1600 200"/>
    <path d="M0 320 L1600 320"/>
    <path d="M0 440 L1600 440"/>
    <path d="M0 560 L1600 560"/>
    <path d="M200 0 L200 900"/>
    <path d="M520 0 L520 900"/>
    <path d="M1080 0 L1080 900"/>
    <path d="M1400 0 L1400 900"/>
  </g>

  <!-- Hero group centred at 800, 450 -->
  <g transform="translate(800 450)">
    <!-- Radial glow halo -->
    <ellipse cx="0" cy="0" rx="520" ry="360" fill="url(#glow)"/>

    <!-- 30km radius circle (dashed outer, solid inner) -->
    <circle cx="0" cy="0" r="340" fill="none" stroke="#9a3309" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="10 8"/>
    <circle cx="0" cy="0" r="340" fill="#c2410c" fill-opacity="0.04"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 6"/>

    <!-- Crosshair / cardinal marks on radius circle -->
    <g stroke="#9a3309" stroke-opacity="0.45" stroke-width="2">
      <line x1="-340" y1="0" x2="-322" y2="0"/>
      <line x1="322" y1="0" x2="340" y2="0"/>
      <line x1="0" y1="-340" x2="0" y2="-322"/>
      <line x1="0" y1="322" x2="0" y2="340"/>
    </g>

    <!-- Centre: L'Air du Temps (rust hub, fork-like notch implied by ring) -->
    <circle cx="0" cy="0" r="22" fill="url(#pin)"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Event markers within the circle, with connecting trace lines from hub -->
    <g stroke="#9a3309" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 5" fill="none">
      <line x1="0" y1="0" x2="-210" y2="160"/>
      <line x1="0" y1="0" x2="-260" y2="-90"/>
      <line x1="0" y1="0" x2="160" y2="-180"/>
      <line x1="0" y1="0" x2="240" y2="120"/>
      <line x1="0" y1="0" x2="-60" y2="220"/>
    </g>

    <!-- Namur / KIKK marker (south-west, teal hero pin, largest secondary) -->
    <g transform="translate(-210 160)">
      <circle cx="0" cy="6" rx="14" ry="4" fill="#000" opacity="0.15"/>
      <circle cx="0" cy="0" r="20" fill="url(#pinTeal)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="-6" cy="-6" r="4" fill="#fef3ec" opacity="0.7"/>
    </g>

    <!-- Louvain-la-Neuve marker (north-west, rust) -->
    <g transform="translate(-260 -90)">
      <circle cx="0" cy="5" rx="12" ry="3" fill="#000" opacity="0.15"/>
      <circle cx="0" cy="0" r="17" fill="url(#pin)"/>
      <circle cx="-5" cy="-5" r="3.5" fill="#fef3ec" opacity="0.7"/>
    </g>

    <!-- Gembloux marker (north-east, smaller rust) -->
    <g transform="translate(160 -180)">
      <circle cx="0" cy="4" rx="10" ry="3" fill="#000" opacity="0.12"/>
      <circle cx="0" cy="0" r="14" fill="url(#pin)"/>
      <circle cx="-4" cy="-4" r="3" fill="#fef3ec" opacity="0.6"/>
    </g>

    <!-- Eastern secondary marker (teal small) -->
    <g transform="translate(240 120)">
      <circle cx="0" cy="4" rx="10" ry="3" fill="#000" opacity="0.12"/>
      <circle cx="0" cy="0" r="13" fill="url(#pinTeal)"/>
      <circle cx="-4" cy="-4" r="3" fill="#fef3ec" opacity="0.6"/>
    </g>

    <!-- Southern small marker (rust) -->
    <g transform="translate(-60 220)">
      <circle cx="0" cy="3" rx="8" ry="2.5" fill="#000" opacity="0.12"/>
      <circle cx="0" cy="0" r="11" fill="url(#pin)"/>
      <circle cx="-3" cy="-3" r="2.5" fill="#fef3ec" opacity="0.6"/>
    </g>

    <!-- Subtle compass tick at top of outer ring -->
    <polygon points="0,-360 6,-345 -6,-345" fill="#9a3309" opacity="0.55"/>
  </g>
</svg>
