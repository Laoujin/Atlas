<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#3a1a0e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a0e"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1a0e"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun disc behind farmhouse -->
  <circle cx="820" cy="500" r="320" fill="url(#sun)" opacity="0.9"/>

  <!-- distant rolling hill -->
  <path d="M 0 640 Q 280 560 560 600 T 1120 590 T 1600 620 L 1600 900 L 0 900 Z"
        fill="url(#hill1)" opacity="0.85"/>

  <!-- foreground hill -->
  <path d="M 0 740 Q 360 680 720 720 T 1320 740 T 1600 760 L 1600 900 L 0 900 Z"
        fill="url(#hill2)" opacity="0.95"/>

  <!-- hero: farmhouse silhouette, centered ~ (800, 600) -->
  <!-- main barn body -->
  <rect x="640" y="600" width="320" height="160" fill="url(#wall)"/>
  <!-- pitched roof -->
  <polygon points="620,600 800,470 980,600" fill="url(#roof)"/>
  <!-- smaller side wing -->
  <rect x="940" y="650" width="160" height="110" fill="url(#wall)" opacity="0.92"/>
  <polygon points="930,650 1020,580 1110,650" fill="url(#roof)" opacity="0.92"/>
  <!-- chimney -->
  <rect x="730" y="500" width="28" height="60" fill="#1a0e0e"/>
  <!-- glowing window (the hero accent) -->
  <rect x="752" y="660" width="56" height="60" fill="url(#window)"/>
  <!-- window mullions -->
  <rect x="778" y="660" width="4" height="60" fill="#3a1a0e" opacity="0.6"/>
  <rect x="752" y="686" width="56" height="4" fill="#3a1a0e" opacity="0.6"/>
  <!-- second smaller lit window on wing -->
  <rect x="990" y="690" width="34" height="36" fill="url(#window)" opacity="0.85"/>

  <!-- warm window glow halo on ground -->
  <ellipse cx="780" cy="740" rx="120" ry="14" fill="#fbbf24" opacity="0.18"/>

  <!-- lone tree to the left, balances composition -->
  <rect x="380" y="660" width="10" height="80" fill="#1a0e0e"/>
  <ellipse cx="385" cy="650" rx="56" ry="64" fill="#3a1a0e" opacity="0.95"/>

  <!-- distant tree cluster right -->
  <ellipse cx="1280" cy="700" rx="70" ry="32" fill="#3a1a0e" opacity="0.75"/>
  <ellipse cx="1360" cy="710" rx="50" ry="24" fill="#3a1a0e" opacity="0.7"/>

  <!-- subtle rose-tinted cloud band high in sky (secondary hue, restrained) -->
  <ellipse cx="500" cy="220" rx="380" ry="22" fill="#be185d" opacity="0.18"/>
  <ellipse cx="1150" cy="160" rx="300" ry="16" fill="#be185d" opacity="0.14"/>
</svg>
