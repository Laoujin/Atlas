<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbe6cf"/>
      <stop offset="1" stop-color="#f0d4a8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="farm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm sun glow behind tower, slightly off-center -->
  <circle cx="930" cy="430" r="290" fill="url(#sun)"/>

  <!-- Distant rolling hills (faint) -->
  <path d="M0,640 Q200,600 420,615 T880,605 T1300,615 T1600,605 L1600,900 L0,900 Z"
        fill="#d97706" opacity="0.18"/>

  <!-- Farmstead long wing (left of tower) -->
  <g opacity="0.92">
    <!-- main body -->
    <rect x="430" y="555" width="360" height="170" fill="url(#farm)"/>
    <!-- pitched roof -->
    <polygon points="420,555 800,555 770,505 450,505" fill="#5c2a1a"/>
    <!-- chimney -->
    <rect x="690" y="475" width="22" height="40" fill="#5c2a1a"/>
    <!-- door arch -->
    <path d="M590,725 L590,665 Q610,640 630,665 L630,725 Z" fill="#1a0e0e" opacity="0.6"/>
    <!-- window squares (no letters, decorative) -->
    <rect x="470" y="595" width="26" height="32" fill="#fbbf24" opacity="0.55"/>
    <rect x="520" y="595" width="26" height="32" fill="#fbbf24" opacity="0.55"/>
    <rect x="670" y="595" width="26" height="32" fill="#fbbf24" opacity="0.4"/>
    <rect x="720" y="595" width="26" height="32" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- Castle tower (hero, centered around x=900) -->
  <g>
    <!-- main shaft -->
    <rect x="830" y="280" width="150" height="445" fill="url(#tower)"/>
    <!-- crenellations -->
    <rect x="830" y="260" width="22" height="28" fill="#78350f"/>
    <rect x="862" y="260" width="22" height="28" fill="#78350f"/>
    <rect x="894" y="260" width="22" height="28" fill="#78350f"/>
    <rect x="926" y="260" width="22" height="28" fill="#78350f"/>
    <rect x="958" y="260" width="22" height="28" fill="#78350f"/>
    <!-- ruined corner (notch out top-right to read as ruin) -->
    <polygon points="980,260 980,360 940,330 940,260" fill="#fbe6cf"/>
    <!-- narrow arched window -->
    <path d="M888,400 L888,460 Q905,378 922,460 L922,400 Z" fill="#1a0e0e" opacity="0.7"/>
    <!-- lower arrow slit -->
    <rect x="898" y="540" width="14" height="44" fill="#1a0e0e" opacity="0.7"/>
  </g>

  <!-- Right wing — shorter outbuilding (courtyard close) -->
  <g opacity="0.88">
    <rect x="980" y="600" width="260" height="125" fill="#9a3309"/>
    <polygon points="970,600 1250,600 1225,560 990,560" fill="#5c2a1a"/>
    <rect x="1020" y="635" width="22" height="28" fill="#fbbf24" opacity="0.5"/>
    <rect x="1065" y="635" width="22" height="28" fill="#fbbf24" opacity="0.5"/>
    <rect x="1170" y="635" width="22" height="28" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Foreground vegetable-garden rows -->
  <g>
    <path d="M0,725 L1600,725 L1600,900 L0,900 Z" fill="url(#ground)"/>
    <!-- garden furrow lines, perspective -->
    <path d="M-50,760 Q800,748 1650,760" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M-50,795 Q800,780 1650,795" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.45"/>
    <path d="M-50,835 Q800,818 1650,835" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M-50,875 Q800,858 1650,875" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.35"/>
    <!-- a few crop tufts -->
    <circle cx="220" cy="755" r="6" fill="#fbbf24" opacity="0.55"/>
    <circle cx="380" cy="752" r="5" fill="#fbbf24" opacity="0.5"/>
    <circle cx="1280" cy="758" r="6" fill="#fbbf24" opacity="0.55"/>
    <circle cx="1430" cy="754" r="5" fill="#fbbf24" opacity="0.5"/>
  </g>
</svg>
