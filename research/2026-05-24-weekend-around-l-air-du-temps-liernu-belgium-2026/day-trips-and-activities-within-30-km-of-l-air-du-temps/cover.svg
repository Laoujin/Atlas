<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow, low and warm -->
  <circle cx="980" cy="430" r="380" fill="url(#sun)"/>
  <circle cx="980" cy="430" r="70" fill="#fef3ec" opacity="0.9"/>

  <!-- Far rolling hills (Hesbaye farmland silhouette) -->
  <path d="M 0 540 Q 200 480 420 510 T 820 495 Q 1050 475 1280 505 T 1600 510 L 1600 600 L 0 600 Z"
        fill="url(#hillFar)"/>

  <!-- Mid hill with citadel silhouette on its crest -->
  <path d="M 0 620 Q 260 540 520 575 Q 720 600 880 555 Q 1080 500 1320 555 T 1600 580 L 1600 700 L 0 700 Z"
        fill="url(#hillMid)" opacity="0.92"/>

  <!-- Citadel cluster atop mid hill (around x=880, y=555) -->
  <g fill="#5c2a1a" opacity="0.95">
    <rect x="820" y="525" width="14" height="32"/>
    <rect x="838" y="510" width="22" height="47"/>
    <polygon points="838,510 849,496 860,510"/>
    <rect x="864" y="520" width="30" height="37"/>
    <rect x="898" y="500" width="18" height="57"/>
    <polygon points="898,500 907,484 916,500"/>
    <rect x="920" y="528" width="26" height="29"/>
    <rect x="950" y="538" width="14" height="19"/>
  </g>

  <!-- Near hill with winding road -->
  <path d="M 0 740 Q 300 660 620 700 Q 880 730 1180 680 T 1600 700 L 1600 900 L 0 900 Z"
        fill="url(#hillNear)"/>

  <!-- Winding road snaking up toward the citadel -->
  <path d="M 240 900 Q 480 820 600 790 Q 720 760 760 700 Q 800 640 870 600 Q 920 575 880 555"
        fill="none" stroke="url(#road)" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
  <path d="M 240 900 Q 480 820 600 790 Q 720 760 760 700 Q 800 640 870 600 Q 920 575 880 555"
        fill="none" stroke="#fef3ec" stroke-width="3" stroke-dasharray="14 18" stroke-linecap="round" opacity="0.7"/>

  <!-- Vineyard rows on near-right slope -->
  <g stroke="#5c2a1a" stroke-width="2" opacity="0.55">
    <line x1="1180" y1="730" x2="1300" y2="700"/>
    <line x1="1210" y1="755" x2="1340" y2="722"/>
    <line x1="1240" y1="780" x2="1380" y2="745"/>
    <line x1="1270" y1="805" x2="1420" y2="770"/>
    <line x1="1300" y1="830" x2="1460" y2="795"/>
  </g>

  <!-- Abbey silhouette small on far-left ridge -->
  <g fill="#78350f" opacity="0.85">
    <rect x="280" y="495" width="36" height="22"/>
    <rect x="316" y="485" width="14" height="32"/>
    <polygon points="316,485 323,472 330,485"/>
    <rect x="330" y="495" width="22" height="22"/>
  </g>
</svg>
