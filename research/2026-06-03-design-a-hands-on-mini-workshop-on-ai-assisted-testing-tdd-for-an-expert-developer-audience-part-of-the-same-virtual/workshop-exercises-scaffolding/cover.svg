<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: warm dark to lighter rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Hero glow: radial warm amber -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Page card gradient -->
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Hub fill -->
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Orbit ring gradient -->
    <linearGradient id="orbitA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="orbitB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centered on hero -->
  <ellipse cx="800" cy="450" rx="560" ry="360" fill="url(#glow)"/>

  <!-- Layer 2: Hero — stacked angled "exercise cards" + TDD orbit arcs -->

  <!-- Back card (deepest, most offset) -->
  <rect x="540" y="205" width="480" height="340"
        rx="14" ry="14"
        fill="url(#card1)" opacity="0.62"
        transform="rotate(-8, 780, 375)"/>

  <!-- Middle card -->
  <rect x="560" y="200" width="480" height="340"
        rx="14" ry="14"
        fill="url(#card2)" opacity="0.78"
        transform="rotate(-3, 800, 370)"/>

  <!-- Front card (hero face) -->
  <rect x="580" y="195" width="480" height="340"
        rx="14" ry="14"
        fill="url(#card3)" opacity="0.92"
        transform="rotate(2, 820, 365)"/>

  <!-- Faint horizontal "code line" bars on front card — decorative only -->
  <g opacity="0.18" transform="rotate(2, 820, 365)">
    <rect x="612" y="248" width="200" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="274" width="280" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="300" width="160" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="340" width="240" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="366" width="180" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="392" width="260" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="432" width="140" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="458" width="220" height="10" rx="5" fill="#faf8f2"/>
    <rect x="612" y="484" width="190" height="10" rx="5" fill="#faf8f2"/>
  </g>

  <!-- TDD orbit arcs — red arc (failing test) and green arc (passing) -->
  <!-- Outer orbit ellipse, bottom-right arc — "red" phase -->
  <path d="M 800 280 A 190 140 0 0 1 990 420"
        fill="none" stroke="#c2410c" stroke-width="7"
        stroke-linecap="round" opacity="0.85"/>

  <!-- Outer orbit ellipse, top-left arc — "green" phase -->
  <path d="M 990 420 A 190 140 0 0 1 800 280"
        fill="none" stroke="#d97706" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="18 10" opacity="0.70"/>

  <!-- Inner orbit — tighter cycle representing the AI iteration loop -->
  <ellipse cx="895" cy="350" rx="115" ry="80"
           fill="none" stroke="#fbbf24" stroke-width="3.5"
           stroke-dasharray="14 8" opacity="0.45"/>

  <!-- Node dots on the orbit: red (fail) and amber (pass) -->
  <circle cx="800" cy="280" r="14" fill="#c2410c" opacity="0.95"/>
  <circle cx="990" cy="420" r="14" fill="#d97706" opacity="0.95"/>

  <!-- Central hub — the AI-assist / kata core -->
  <circle cx="895" cy="350" r="42" fill="url(#hub)" opacity="0.97"/>
  <!-- Inner ring accent -->
  <circle cx="895" cy="350" r="52" fill="none"
          stroke="#fbbf24" stroke-width="2.5" opacity="0.55"/>

  <!-- Scaffolding bracket marks — two thin L-shapes suggesting structure/skeleton -->
  <!-- Top-left bracket -->
  <polyline points="660,220 635,220 635,260"
            fill="none" stroke="#fbbf24" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.50"/>
  <!-- Bottom-right bracket -->
  <polyline points="1010,530 1035,530 1035,490"
            fill="none" stroke="#fbbf24" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.50"/>

  <!-- Layer 3: edge decoration — corner wash, stays outside hero safe zone -->
  <ellipse cx="0" cy="900" rx="320" ry="260"
           fill="#c2410c" opacity="0.08"/>
  <ellipse cx="1600" cy="0" rx="300" ry="220"
           fill="#d97706" opacity="0.07"/>
</svg>
