<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1508"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero ring gradient -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Card gradient warm -->
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1508"/>
    </linearGradient>
    <!-- Card gradient brighter -->
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Top card gradient -->
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Outer ring stroke gradient -->
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Inner arc gradient -->
    <linearGradient id="innerArcGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="500" ry="380" fill="url(#ringGlow)"/>

  <!-- Layer 2: Stacked tool-card rectangles (hero zone, angled) -->
  <!-- Back card — bottom-most, rotated slightly left -->
  <rect x="490" y="230" width="620" height="380" rx="18"
        fill="url(#card1)" opacity="0.55"
        transform="rotate(-6 800 420)"/>

  <!-- Mid card — center, rotated slightly right -->
  <rect x="510" y="215" width="620" height="380" rx="18"
        fill="url(#card2)" opacity="0.70"
        transform="rotate(4 800 405)"/>

  <!-- Line-bar decorations on mid card (code lines, no glyphs) -->
  <rect x="560" y="300" width="200" height="10" rx="5"
        fill="#fbbf24" opacity="0.25"
        transform="rotate(4 800 405)"/>
  <rect x="560" y="325" width="140" height="10" rx="5"
        fill="#fbbf24" opacity="0.18"
        transform="rotate(4 800 405)"/>
  <rect x="560" y="350" width="180" height="10" rx="5"
        fill="#fbbf24" opacity="0.15"
        transform="rotate(4 800 405)"/>

  <!-- Top card — front, straight -->
  <rect x="530" y="200" width="540" height="340" rx="18"
        fill="url(#card3)" opacity="0.80"/>

  <!-- Code-line bars on front card -->
  <rect x="580" y="270" width="220" height="11" rx="5"
        fill="#fbbf24" opacity="0.35"/>
  <rect x="580" y="298" width="160" height="11" rx="5"
        fill="#fbbf24" opacity="0.28"/>
  <rect x="580" y="326" width="190" height="11" rx="5"
        fill="#fbbf24" opacity="0.22"/>
  <rect x="580" y="354" width="130" height="11" rx="5"
        fill="#fbbf24" opacity="0.18"/>
  <rect x="580" y="382" width="210" height="11" rx="5"
        fill="#fbbf24" opacity="0.14"/>

  <!-- Layer 2b: TDD cycle ring — centered at (800, 450) -->
  <!-- Outer glowing ring -->
  <circle cx="800" cy="450" r="290" fill="none"
          stroke="#c2410c" stroke-width="6" opacity="0.30"/>
  <!-- Main arc ring (partial, suggesting cycle) -->
  <circle cx="800" cy="450" r="260" fill="none"
          stroke="url(#arcGrad)" stroke-width="12"
          stroke-dasharray="1130 500" stroke-dashoffset="120"
          opacity="0.90"/>
  <!-- Inner arc (refactor arc) -->
  <circle cx="800" cy="450" r="200" fill="none"
          stroke="url(#innerArcGrad)" stroke-width="7"
          stroke-dasharray="700 557" stroke-dashoffset="300"
          opacity="0.70"/>

  <!-- Cycle node: RED — fail state, top-left of ring -->
  <circle cx="595" cy="280" r="34" fill="#7f1d1d" opacity="0.95"/>
  <circle cx="595" cy="280" r="24" fill="#c2410c" opacity="0.90"/>

  <!-- Cycle node: GREEN — pass state, top-right of ring -->
  <circle cx="1005" cy="280" r="34" fill="#14532d" opacity="0.85"/>
  <circle cx="1005" cy="280" r="24" fill="#166534" opacity="0.80"/>

  <!-- Cycle node: REFACTOR — amber, bottom of ring -->
  <circle cx="800" cy="690" r="34" fill="#78350f" opacity="0.95"/>
  <circle cx="800" cy="690" r="24" fill="#d97706" opacity="0.90"/>

  <!-- Arrow connector: red -> green (top arc, small arrowhead suggestion) -->
  <path d="M 625 262 Q 800 170 975 262" fill="none"
        stroke="#c2410c" stroke-width="4" opacity="0.45"
        stroke-dasharray="12 8"/>

  <!-- Arrow connector: green -> refactor -->
  <path d="M 1020 305 Q 980 560 830 675" fill="none"
        stroke="#d97706" stroke-width="4" opacity="0.35"
        stroke-dasharray="12 8"/>

  <!-- Arrow connector: refactor -> red -->
  <path d="M 770 675 Q 620 560 580 310" fill="none"
        stroke="#9a3309" stroke-width="4" opacity="0.35"
        stroke-dasharray="12 8"/>

  <!-- Hub: AI spark at center -->
  <circle cx="800" cy="450" r="52" fill="#78350f" opacity="0.85"/>
  <circle cx="800" cy="450" r="36" fill="#c2410c" opacity="0.95"/>
  <circle cx="800" cy="450" r="18" fill="#fbbf24" opacity="0.80"/>

  <!-- Layer 3: Corner edge decorations (outside safe zone, atmospheric) -->
  <!-- Bottom-left corner arc -->
  <circle cx="0" cy="900" r="220" fill="none"
          stroke="#c2410c" stroke-width="3" opacity="0.12"/>
  <!-- Top-right faint arc -->
  <circle cx="1600" cy="0" r="260" fill="none"
          stroke="#78350f" stroke-width="3" opacity="0.10"/>
</svg>
