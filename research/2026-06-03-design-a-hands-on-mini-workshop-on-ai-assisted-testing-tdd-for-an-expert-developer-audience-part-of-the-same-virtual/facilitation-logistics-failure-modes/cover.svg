<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1a10"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Satellite fill -->
    <radialGradient id="satFill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Connector glow gradient -->
    <linearGradient id="lineGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Outer ring -->
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed edge vignette for depth -->
  <rect width="1600" height="900" fill="url(#ringGrad)"/>

  <!-- Layer 2: Hero element — node-and-edge facilitation graph, centered at (800, 450) -->

  <!-- Ambient glow behind hub -->
  <ellipse cx="800" cy="450" rx="310" ry="280" fill="url(#hubGlow)" opacity="0.9"/>

  <!-- Connector lines from hub to satellites -->
  <!-- Top-left satellite: (480, 230) -->
  <line x1="800" y1="450" x2="480" y2="230"
        stroke="url(#lineGrad1)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <!-- Top-right satellite: (1120, 230) -->
  <line x1="800" y1="450" x2="1120" y2="230"
        stroke="url(#lineGrad2)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <!-- Bottom-left satellite: (480, 670) -->
  <line x1="800" y1="450" x2="480" y2="670"
        stroke="url(#lineGrad2)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <!-- Bottom-right satellite: (1120, 670) -->
  <line x1="800" y1="450" x2="1120" y2="670"
        stroke="url(#lineGrad1)" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Secondary ring connectors between adjacent satellites (flow loop) -->
  <path d="M 480 230 Q 800 120 1120 230"
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"
        opacity="0.28"/>
  <path d="M 1120 230 Q 1310 450 1120 670"
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"
        opacity="0.28"/>
  <path d="M 1120 670 Q 800 780 480 670"
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"
        opacity="0.28"/>
  <path d="M 480 670 Q 290 450 480 230"
        fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"
        opacity="0.28"/>

  <!-- Satellite nodes (breakout rooms / stages) -->
  <!-- Top-left -->
  <circle cx="480" cy="230" r="58" fill="#78350f" opacity="0.7"/>
  <circle cx="480" cy="230" r="44" fill="url(#satFill)" opacity="0.92"/>
  <!-- Top-right -->
  <circle cx="1120" cy="230" r="58" fill="#78350f" opacity="0.7"/>
  <circle cx="1120" cy="230" r="44" fill="url(#satFill)" opacity="0.92"/>
  <!-- Bottom-left -->
  <circle cx="480" cy="670" r="58" fill="#78350f" opacity="0.7"/>
  <circle cx="480" cy="670" r="44" fill="url(#satFill)" opacity="0.92"/>
  <!-- Bottom-right -->
  <circle cx="1120" cy="670" r="58" fill="#78350f" opacity="0.7"/>
  <circle cx="1120" cy="670" r="44" fill="url(#satFill)" opacity="0.92"/>

  <!-- Central hub (facilitator node) -->
  <circle cx="800" cy="450" r="118" fill="#5c2a1a" opacity="0.75"/>
  <circle cx="800" cy="450" r="96" fill="url(#hubFill)" opacity="0.95"/>
  <!-- Inner accent ring on hub -->
  <circle cx="800" cy="450" r="72" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.35"/>

  <!-- Layer 3: Corner decoration (outside hero safe zone — atmospheric only) -->
  <!-- Top-left corner arc -->
  <path d="M 0 0 Q 160 0 160 160"
        fill="none" stroke="#9a3309" stroke-width="40" opacity="0.12"/>
  <!-- Bottom-right corner arc -->
  <path d="M 1600 900 Q 1440 900 1440 740"
        fill="none" stroke="#9a3309" stroke-width="40" opacity="0.12"/>
</svg>
