<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2c1008"/>
    </linearGradient>
    <!-- Warm ambient glow at table centre -->
    <radialGradient id="tableGlow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate sheen gradient -->
    <radialGradient id="plateGrad" cx="42%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.92"/>
      <stop offset="70%" stop-color="#e8e0d0" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#c8b89a" stop-opacity="0.70"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Small sauce dot accent -->
    <radialGradient id="sauceGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Rose accent glow for star motif -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Candle flame glow -->
    <radialGradient id="flameGlow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Ambient warm table glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Subtle rose star-rating glow, upper-right of hero, decorative -->
  <ellipse cx="1050" cy="290" rx="180" ry="120" fill="url(#starGlow)" opacity="0.5"/>

  <!-- Layer 2: Hero element — centred around (800, 450), safe zone x:125–1475, y:90–810 -->

  <!-- Table surface hint: a soft ellipse suggesting a white tablecloth -->
  <ellipse cx="800" cy="590" rx="520" ry="110" fill="#faf8f2" opacity="0.07"/>

  <!-- Main plate (hero) -->
  <!-- Plate body -->
  <ellipse cx="800" cy="460" rx="195" ry="195" fill="url(#plateGrad)"/>
  <!-- Plate rim darkening ring -->
  <ellipse cx="800" cy="460" rx="195" ry="195" fill="url(#plateRim)"/>
  <!-- Inner well of plate -->
  <ellipse cx="800" cy="460" rx="155" ry="155" fill="#faf8f2" opacity="0.72"/>

  <!-- Food element: artful sauce swipe across inner well -->
  <path d="M680,450 Q730,420 800,445 Q870,468 920,455" stroke="url(#sauceGrad)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.88"/>

  <!-- Food element: two small quenelle / dot accents on the plate -->
  <ellipse cx="756" cy="435" rx="18" ry="10" fill="#c2410c" opacity="0.85" transform="rotate(-18 756 435)"/>
  <ellipse cx="848" cy="465" rx="14" ry="8" fill="#9a3309" opacity="0.80" transform="rotate(10 848 465)"/>

  <!-- Micro herb dot -->
  <circle cx="800" cy="430" r="6" fill="#78350f" opacity="0.70"/>

  <!-- Wine glass silhouette — left of plate, elegant accent -->
  <!-- Bowl -->
  <ellipse cx="555" cy="390" rx="48" ry="62" fill="#be185d" opacity="0.18"/>
  <path d="M510,390 Q510,480 555,495 Q600,480 600,390 Z" fill="#c2410c" opacity="0.22"/>
  <!-- Stem -->
  <rect x="551" y="492" width="8" height="90" rx="4" fill="#faf8f2" opacity="0.30"/>
  <!-- Base -->
  <ellipse cx="555" cy="584" rx="34" ry="8" fill="#faf8f2" opacity="0.22"/>
  <!-- Wine level inside glass -->
  <path d="M516,420 Q555,434 594,420 Q600,390 510,390 Z" fill="#be185d" opacity="0.45"/>

  <!-- Candle — right of plate, warm accent -->
  <!-- Candle body -->
  <rect x="1020" y="460" width="18" height="90" rx="5" fill="#faf8f2" opacity="0.55"/>
  <!-- Wax drip -->
  <path d="M1020,478 Q1014,490 1016,500 Q1018,508 1020,505" stroke="#faf8f2" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.30"/>
  <!-- Flame glow halo -->
  <ellipse cx="1029" cy="452" rx="28" ry="36" fill="url(#flameGlow)" opacity="0.85"/>
  <!-- Flame shape -->
  <path d="M1029,430 Q1038,442 1034,454 Q1029,460 1024,454 Q1020,442 1029,430 Z" fill="#fbbf24" opacity="0.95"/>
  <path d="M1029,436 Q1034,445 1031,453 Q1029,456 1027,453 Q1024,445 1029,436 Z" fill="#fef3ec" opacity="0.80"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone or at periphery) -->

  <!-- Faint rose Michelin-star motif: abstract 6-point star shape, top-left, low opacity -->
  <g transform="translate(200, 150)" opacity="0.13">
    <polygon points="0,-44 10,-14 42,-14 18,6 28,36 0,18 -28,36 -18,6 -42,-14 -10,-14" fill="#be185d"/>
  </g>
  <!-- Second star, bottom-right corner decoration -->
  <g transform="translate(1400, 750)" opacity="0.10">
    <polygon points="0,-44 10,-14 42,-14 18,6 28,36 0,18 -28,36 -18,6 -42,-14 -10,-14" fill="#c2410c"/>
  </g>

  <!-- Very faint city skyline silhouette at bottom edge — Chicago reference -->
  <g opacity="0.09" fill="#fbbf24">
    <!-- Simplified skyline blocks along bottom -->
    <rect x="60"   y="820" width="30"  height="80"/>
    <rect x="100"  y="800" width="20"  height="100"/>
    <rect x="130"  y="780" width="25"  height="120"/>
    <rect x="165"  y="795" width="18"  height="105"/>
    <rect x="193"  y="810" width="30"  height="90"/>
    <!-- Willis tower (Sears) -->
    <rect x="240"  y="730" width="34"  height="170"/>
    <rect x="250"  y="710" width="14"  height="20"/>
    <rect x="258"  y="695" width="6"   height="15"/>
    <rect x="285"  y="760" width="22"  height="140"/>
    <rect x="318"  y="790" width="28"  height="110"/>
    <rect x="356"  y="810" width="20"  height="90"/>
    <rect x="386"  y="800" width="24"  height="100"/>
    <rect x="420"  y="815" width="18"  height="85"/>
    <rect x="1160" y="810" width="22"  height="90"/>
    <rect x="1192" y="790" width="30"  height="110"/>
    <rect x="1232" y="805" width="20"  height="95"/>
    <rect x="1262" y="775" width="28"  height="125"/>
    <rect x="1300" y="760" width="32"  height="140"/>
    <rect x="1342" y="800" width="18"  height="100"/>
    <rect x="1370" y="815" width="24"  height="85"/>
    <rect x="1404" y="820" width="20"  height="80"/>
    <rect x="1434" y="810" width="26"  height="90"/>
    <rect x="1470" y="825" width="18"  height="75"/>
    <rect x="1498" y="815" width="30"  height="85"/>
    <rect x="1538" y="800" width="22"  height="100"/>
  </g>

</svg>
