<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Main plate fill -->
    <radialGradient id="plateFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6cfc4"/>
    </radialGradient>
    <!-- Second plate fill -->
    <radialGradient id="plateFill2" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="65%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#cfc8bc"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="83%" stop-color="#9a3309" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8"/>
    </radialGradient>
    <!-- Rose accent glow -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Star accent -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow centered -->
  <ellipse cx="800" cy="450" rx="620" ry="400" fill="url(#glow)"/>

  <!-- Rose accent glow, slightly offset -->
  <ellipse cx="870" cy="430" rx="350" ry="260" fill="url(#roseGlow)"/>

  <!-- Layer 2: Hero — two overlapping plate forms -->

  <!-- Left plate: slightly behind -->
  <!-- Plate shadow -->
  <ellipse cx="700" cy="472" rx="214" ry="22" fill="#000" opacity="0.35"/>
  <!-- Plate body -->
  <circle cx="700" cy="450" r="212" fill="url(#plateFill2)" opacity="0.92"/>
  <!-- Plate rim ring -->
  <circle cx="700" cy="450" r="212" fill="none" stroke="#9a3309" stroke-width="14" opacity="0.55"/>
  <!-- Inner well -->
  <circle cx="700" cy="450" r="148" fill="#f0eadb" opacity="0.6"/>
  <!-- Inner rim line -->
  <circle cx="700" cy="450" r="148" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.35"/>
  <!-- Food element: rust smear arc on left plate -->
  <path d="M 640,420 Q 700,395 760,418 Q 710,432 640,420 Z" fill="#c2410c" opacity="0.55"/>
  <path d="M 655,450 Q 695,438 735,454 Q 700,465 655,450 Z" fill="#9a3309" opacity="0.4"/>

  <!-- Right plate: in front -->
  <!-- Plate shadow -->
  <ellipse cx="900" cy="472" rx="214" ry="22" fill="#000" opacity="0.4"/>
  <!-- Plate body -->
  <circle cx="900" cy="450" r="212" fill="url(#plateFill)" opacity="0.95"/>
  <!-- Plate rim ring -->
  <circle cx="900" cy="450" r="212" fill="none" stroke="#78350f" stroke-width="16" opacity="0.65"/>
  <!-- Inner well -->
  <circle cx="900" cy="450" r="148" fill="#faf8f2" opacity="0.65"/>
  <!-- Inner rim line -->
  <circle cx="900" cy="450" r="148" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.4"/>
  <!-- Food element: elegant swoosh on right plate -->
  <path d="M 840,435 Q 900,408 960,432 Q 905,448 840,435 Z" fill="#d97706" opacity="0.6"/>
  <path d="M 860,460 Q 900,446 940,462 Q 900,474 860,460 Z" fill="#c2410c" opacity="0.5"/>
  <!-- Accent dot — garnish -->
  <circle cx="918" cy="428" r="10" fill="#be185d" opacity="0.7"/>
  <circle cx="882" cy="468" r="7" fill="#9a3309" opacity="0.6"/>

  <!-- Wine glass silhouette — right side, within safe zone -->
  <!-- Bowl -->
  <path d="M 1148,290 Q 1198,370 1188,430 Q 1168,470 1118,470 Q 1068,470 1048,430 Q 1038,370 1088,290 Z"
        fill="url(#glassGrad)" opacity="0.6"/>
  <!-- Stem -->
  <rect x="1111" y="470" width="14" height="120" fill="#c2410c" opacity="0.5" rx="4"/>
  <!-- Base -->
  <ellipse cx="1118" cy="592" rx="48" ry="10" fill="#9a3309" opacity="0.55"/>
  <!-- Wine level inside glass -->
  <path d="M 1058,420 Q 1118,440 1178,420 Q 1168,470 1118,470 Q 1068,470 1058,420 Z"
        fill="#be185d" opacity="0.45"/>

  <!-- Michelin star accent — above hero, within safe zone -->
  <!-- Simple five-point star at top center -->
  <polygon points="800,155 812,188 848,188 819,208 830,241 800,221 770,241 781,208 752,188 788,188"
           fill="url(#starGrad)" opacity="0.85"/>

  <!-- Layer 3: Edge decorations (may crop on card/hero) -->
  <!-- Top-left warm corner wash -->
  <radialGradient id="cornerTL" cx="0%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#c2410c" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#cornerTL)"/>

  <!-- Bottom-right rose corner wash -->
  <radialGradient id="cornerBR" cx="100%" cy="100%" r="50%">
    <stop offset="0%" stop-color="#be185d" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect x="1200" y="600" width="400" height="300" fill="url(#cornerBR)"/>
</svg>
