<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow over the sea -->
  <circle cx="800" cy="540" r="320" fill="url(#sun)"/>

  <!-- distant sea band -->
  <rect x="0" y="555" width="1600" height="30" fill="#9a3309" opacity="0.35"/>
  <rect x="0" y="560" width="1600" height="6" fill="#fbbf24" opacity="0.6"/>

  <!-- villa silhouettes row (hero band, centered ~y=450-720, inside safe zone) -->
  <g fill="url(#ground)">
    <!-- left villa: mansard roof -->
    <path d="M 200 720 L 200 600 L 230 600 L 260 555 L 320 555 L 350 600 L 350 720 Z"/>
    <!-- chimney -->
    <rect x="305" y="540" width="14" height="25" fill="#5c2a1a"/>

    <!-- second villa: anglo-norman gable, taller -->
    <path d="M 410 720 L 410 580 L 470 510 L 530 580 L 530 720 Z"/>
    <rect x="490" y="495" width="12" height="22" fill="#5c2a1a"/>

    <!-- third villa: belle-epoque turret (HERO, slightly bigger) -->
    <path d="M 600 720 L 600 540 L 660 540 L 660 470 L 690 420 L 720 470 L 720 540 L 780 540 L 780 720 Z"/>

    <!-- fourth villa: low manor -->
    <path d="M 840 720 L 840 595 L 880 545 L 1000 545 L 1040 595 L 1040 720 Z"/>
    <rect x="990" y="525" width="13" height="25" fill="#5c2a1a"/>

    <!-- fifth villa: stepped gable (flemish) -->
    <path d="M 1100 720 L 1100 565 L 1130 565 L 1130 540 L 1170 540 L 1170 510 L 1210 510 L 1210 540 L 1250 540 L 1250 565 L 1280 565 L 1280 720 Z"/>

    <!-- sixth villa: small with pitched roof, end of row -->
    <path d="M 1340 720 L 1340 605 L 1395 555 L 1450 605 L 1450 720 Z"/>
  </g>

  <!-- window glints (warm lamps) -->
  <g fill="#fbbf24" opacity="0.9">
    <rect x="275" y="640" width="14" height="22"/>
    <rect x="450" y="630" width="14" height="22"/>
    <rect x="488" y="630" width="14" height="22"/>
    <rect x="675" y="600" width="14" height="22"/>
    <rect x="700" y="600" width="14" height="22"/>
    <rect x="920" y="640" width="14" height="22"/>
    <rect x="960" y="640" width="14" height="22"/>
    <rect x="1170" y="620" width="14" height="22"/>
    <rect x="1390" y="650" width="12" height="20"/>
  </g>

  <!-- destination marker: a single bright lamp/star above the turret villa -->
  <circle cx="690" cy="380" r="22" fill="#fbbf24" opacity="0.35"/>
  <circle cx="690" cy="380" r="11" fill="#fef3ec"/>
  <circle cx="690" cy="380" r="5" fill="#c2410c"/>

  <!-- the walking path: winds from far-left lodging across the row to the hero villa -->
  <path d="M 160 800 Q 320 770 460 790 T 690 770" fill="none" stroke="url(#path)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <!-- footsteps along the path -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="220" cy="795" r="5"/>
    <circle cx="300" cy="790" r="5"/>
    <circle cx="380" cy="790" r="5"/>
    <circle cx="460" cy="790" r="5"/>
    <circle cx="540" cy="785" r="5"/>
    <circle cx="620" cy="778" r="5"/>
  </g>

  <!-- foreground ground tone, full-bleed -->
  <rect x="0" y="720" width="1600" height="180" fill="#1a0e0e" opacity="0.55"/>
</svg>
