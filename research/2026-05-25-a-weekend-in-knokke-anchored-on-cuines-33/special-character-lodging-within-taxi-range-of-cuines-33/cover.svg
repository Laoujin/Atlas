<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="villa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#120808"/>
    </linearGradient>
  </defs>

  <!-- full-bleed twilight sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun disk on horizon -->
  <circle cx="1080" cy="540" r="220" fill="url(#sun)"/>
  <circle cx="1080" cy="540" r="70" fill="#fbbf24" opacity="0.85"/>

  <!-- distant dune ridge -->
  <path d="M0 640 Q 300 590 580 615 T 1180 605 T 1600 620 L 1600 900 L 0 900 Z" fill="#5c2a1a" opacity="0.75"/>

  <!-- HERO: two Anglo-Norman gabled villa silhouettes (centered ~800,450) -->
  <!-- smaller villa, back-left -->
  <g opacity="0.92">
    <!-- body -->
    <rect x="430" y="470" width="220" height="170" fill="url(#villa)"/>
    <!-- steep gabled roof -->
    <polygon points="420,475 540,330 660,475" fill="#1a0e0e"/>
    <!-- secondary gable -->
    <polygon points="600,475 660,395 720,475" fill="#1a0e0e"/>
    <rect x="650" y="465" width="70" height="175" fill="url(#villa)"/>
    <!-- chimney -->
    <rect x="500" y="355" width="22" height="55" fill="#120808"/>
    <!-- half-timbering hint -->
    <rect x="455" y="540" width="170" height="3" fill="#78350f" opacity="0.55"/>
    <rect x="490" y="500" width="3" height="40" fill="#78350f" opacity="0.45"/>
    <rect x="555" y="500" width="3" height="40" fill="#78350f" opacity="0.45"/>
    <!-- lit window -->
    <rect x="510" y="555" width="28" height="38" fill="#fbbf24" opacity="0.9"/>
    <rect x="670" y="555" width="22" height="32" fill="#d97706" opacity="0.8"/>
  </g>

  <!-- larger foreground villa, right-center -->
  <g opacity="0.95">
    <!-- main body -->
    <rect x="780" y="430" width="340" height="270" fill="url(#villa)"/>
    <!-- steep main gable -->
    <polygon points="765,438 950,250 1135,438" fill="#1a0e0e"/>
    <!-- side wing with lower gable -->
    <rect x="1100" y="495" width="170" height="205" fill="url(#villa)"/>
    <polygon points="1090,500 1185,385 1280,500" fill="#1a0e0e"/>
    <!-- chimneys -->
    <rect x="900" y="285" width="28" height="70" fill="#120808"/>
    <rect x="1170" y="410" width="24" height="60" fill="#120808"/>
    <!-- half-timbering crossbeams on gable -->
    <line x1="855" y1="380" x2="1045" y2="380" stroke="#78350f" stroke-width="3" opacity="0.6"/>
    <line x1="950" y1="290" x2="880" y2="380" stroke="#78350f" stroke-width="2.5" opacity="0.5"/>
    <line x1="950" y1="290" x2="1020" y2="380" stroke="#78350f" stroke-width="2.5" opacity="0.5"/>
    <!-- floor line -->
    <rect x="790" y="555" width="320" height="3" fill="#78350f" opacity="0.55"/>
    <!-- lit windows -->
    <rect x="830" y="475" width="36" height="50" fill="#fbbf24" opacity="0.92"/>
    <rect x="900" y="475" width="36" height="50" fill="#d97706" opacity="0.78"/>
    <rect x="980" y="475" width="36" height="50" fill="#fbbf24" opacity="0.88"/>
    <rect x="830" y="585" width="36" height="60" fill="#fbbf24" opacity="0.9"/>
    <rect x="980" y="585" width="36" height="60" fill="#d97706" opacity="0.75"/>
    <rect x="1145" y="555" width="30" height="44" fill="#fbbf24" opacity="0.85"/>
    <rect x="1210" y="555" width="30" height="44" fill="#d97706" opacity="0.7"/>
  </g>

  <!-- foreground dune sweep -->
  <path d="M0 740 Q 260 700 520 730 Q 820 770 1180 720 Q 1380 695 1600 735 L 1600 900 L 0 900 Z" fill="url(#dune)"/>
  <!-- dune grass strokes (decorative, low contrast) -->
  <path d="M120 740 Q 130 715 138 745 M180 735 Q 192 708 200 742 M1320 730 Q 1330 705 1338 738 M1420 738 Q 1432 712 1440 742" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
