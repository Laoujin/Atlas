<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow on horizon -->
  <ellipse cx="800" cy="560" rx="520" ry="220" fill="url(#sun)" opacity="0.85"/>

  <!-- sea band -->
  <rect x="0" y="555" width="1600" height="95" fill="url(#sea)" opacity="0.7"/>

  <!-- sea shimmer lines -->
  <rect x="200" y="580" width="1200" height="2" fill="#fbbf24" opacity="0.35"/>
  <rect x="350" y="605" width="900" height="2" fill="#fbbf24" opacity="0.25"/>
  <rect x="450" y="628" width="700" height="2" fill="#fef3ec" opacity="0.2"/>

  <!-- distant bell tower silhouette (Bruges / Flemish coast) -->
  <g opacity="0.92" fill="url(#dune)">
    <rect x="1140" y="430" width="42" height="220"/>
    <rect x="1132" y="420" width="58" height="14"/>
    <polygon points="1140,420 1161,378 1182,420"/>
    <rect x="1156" y="365" width="10" height="18"/>
  </g>

  <!-- foreground dune ridge -->
  <path d="M 0 720 Q 220 660 440 695 Q 660 735 880 690 Q 1100 645 1320 700 Q 1480 740 1600 715 L 1600 900 L 0 900 Z" fill="url(#dune)"/>

  <!-- secondary dune crest, lighter -->
  <path d="M 0 760 Q 280 715 540 745 Q 820 780 1080 740 Q 1340 705 1600 755 L 1600 900 L 0 900 Z" fill="#1a0e0e" opacity="0.75"/>

  <!-- marram-grass tufts on near dune -->
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.45" fill="none">
    <path d="M 240 735 L 236 720 M 244 735 L 248 718 M 250 735 L 252 722"/>
    <path d="M 580 745 L 576 728 M 584 745 L 588 726 M 590 745 L 592 730"/>
    <path d="M 980 738 L 976 722 M 984 738 L 988 720 M 990 738 L 992 724"/>
    <path d="M 1340 748 L 1336 732 M 1344 748 L 1348 730 M 1350 748 L 1352 734"/>
  </g>

  <!-- HERO: two Michelin stars hanging over the horizon -->
  <circle cx="700" cy="380" r="105" fill="url(#star)"/>
  <circle cx="900" cy="380" r="105" fill="url(#star)"/>
  <circle cx="700" cy="380" r="22" fill="#fef3ec" opacity="0.95"/>
  <circle cx="900" cy="380" r="22" fill="#fef3ec" opacity="0.95"/>
  <circle cx="700" cy="380" r="10" fill="#c2410c"/>
  <circle cx="900" cy="380" r="10" fill="#c2410c"/>

  <!-- faint light reflection on sea below stars -->
  <ellipse cx="800" cy="610" rx="180" ry="8" fill="#fef3ec" opacity="0.35"/>
  <ellipse cx="800" cy="625" rx="120" ry="4" fill="#fbbf24" opacity="0.3"/>
</svg>
