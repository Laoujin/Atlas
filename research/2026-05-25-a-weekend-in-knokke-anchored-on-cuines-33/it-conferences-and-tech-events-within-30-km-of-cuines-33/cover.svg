<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#e8dcc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint coast/sea band along the top edge (decoration, croppable) -->
  <path d="M0 0 H1600 V160 Q1200 200 800 170 Q400 145 0 195 Z" fill="#c2410c" opacity="0.08"/>
  <path d="M0 0 H1600 V90 Q1100 130 600 100 Q300 85 0 120 Z" fill="#78350f" opacity="0.06"/>

  <!-- soft radial glow behind the hero -->
  <circle cx="800" cy="450" r="380" fill="url(#glow)"/>

  <!-- HERO: concentric radius rings centered at 800,450 (within safe zone) -->
  <g fill="none" stroke="#9a3309" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="800" cy="450" r="320"/>
    <circle cx="800" cy="450" r="240"/>
    <circle cx="800" cy="450" r="160"/>
    <circle cx="800" cy="450" r="80"/>
  </g>

  <!-- outer radius ring emphasised (the 30km boundary) -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="url(#rust)" stroke-width="3.5" stroke-opacity="0.85" stroke-dasharray="6 8"/>

  <!-- signal-processing waveform threading through the rings (EUSIPCO nod) -->
  <path d="M 460 450
           Q 500 380 540 450 T 620 450 T 700 450
           Q 740 340 780 450 T 860 450
           Q 900 360 940 450 T 1020 450 T 1100 450
           Q 1140 400 1140 450"
        fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.9" stroke-linecap="round"/>

  <!-- secondary, lower-amplitude wave for depth -->
  <path d="M 460 450
           Q 510 470 560 450 T 660 450 T 760 450 T 860 450 T 960 450 T 1060 450 T 1140 450"
        fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- anchor city nodes on the rings -->
  <!-- Knokke (centre/anchor) -->
  <circle cx="800" cy="450" r="14" fill="url(#rust)"/>
  <circle cx="800" cy="450" r="22" fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Bruges (inland, lower-left of centre) -->
  <circle cx="640" cy="560" r="10" fill="#9a3309"/>
  <line x1="800" y1="450" x2="640" y2="560" stroke="#9a3309" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- Oostende (coastal west, upper-left) -->
  <circle cx="520" cy="380" r="10" fill="#9a3309"/>
  <line x1="800" y1="450" x2="520" y2="380" stroke="#9a3309" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- a third event node, eastward -->
  <circle cx="1020" cy="510" r="8" fill="#d97706"/>
  <line x1="800" y1="450" x2="1020" y2="510" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- corner decoration: subtle circuit trace, croppable -->
  <g stroke="#78350f" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <path d="M 0 820 L 120 820 L 160 780 L 260 780"/>
    <path d="M 1600 100 L 1480 100 L 1440 140 L 1340 140"/>
    <circle cx="260" cy="780" r="4" fill="#78350f" fill-opacity="0.35" stroke="none"/>
    <circle cx="1340" cy="140" r="4" fill="#78350f" fill-opacity="0.35" stroke="none"/>
  </g>
</svg>
