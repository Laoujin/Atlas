<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1008"/>
    </linearGradient>
    <!-- Warm table-glow radial -->
    <radialGradient id="tableGlow" cx="50%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero plate gradient — outer ring -->
    <radialGradient id="plateOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="72%" stop-color="#3b120a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Hero plate gradient — inner well -->
    <radialGradient id="plateInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1008"/>
    </radialGradient>
    <!-- Star accent gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Rim highlight -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: warm ambient table glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Layer 2: hero — dinner plate composition centered at (800, 455) -->

  <!-- Outer plate ring shadow -->
  <ellipse cx="800" cy="470" rx="360" ry="210" fill="#000" opacity="0.45"/>

  <!-- Outer plate body -->
  <ellipse cx="800" cy="455" rx="355" ry="205" fill="url(#plateOuter)" opacity="0.92"/>

  <!-- Rim highlight arc — top edge shimmer -->
  <ellipse cx="800" cy="455" rx="355" ry="205" fill="none"
           stroke="url(#rimLight)" stroke-width="18" opacity="0.7"/>

  <!-- Inner plate well -->
  <ellipse cx="800" cy="455" rx="270" ry="155" fill="url(#plateInner)" opacity="0.95"/>

  <!-- Inner rim ring — subtle warm stroke -->
  <ellipse cx="800" cy="455" rx="270" ry="155" fill="none"
           stroke="#78350f" stroke-width="6" opacity="0.55"/>

  <!-- Cloche dome silhouette (abstract arc above plate) -->
  <path d="M 540,455 Q 800,220 1060,455" fill="none"
        stroke="#c2410c" stroke-width="22" stroke-linecap="round" opacity="0.38"/>
  <path d="M 560,455 Q 800,240 1040,455" fill="none"
        stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity="0.25"/>

  <!-- Michelin star motifs — three stars arranged horizontally above plate center -->
  <!-- Star helper: each star is a small 6-point shape built from two triangles -->

  <!-- Star 1 (left) -->
  <g transform="translate(718, 342)">
    <polygon points="0,-18 5,-6 18,-6 8,3 12,16 0,8 -12,16 -8,3 -18,-6 -5,-6"
             fill="url(#starGlow)" opacity="0.88"/>
  </g>

  <!-- Star 2 (center, slightly larger) -->
  <g transform="translate(800, 330)">
    <polygon points="0,-22 6,-7 22,-7 10,4 15,19 0,10 -15,19 -10,4 -22,-7 -6,-7"
             fill="url(#starGlow)" opacity="0.95"/>
  </g>

  <!-- Star 3 (right) -->
  <g transform="translate(882, 342)">
    <polygon points="0,-18 5,-6 18,-6 8,3 12,16 0,8 -12,16 -8,3 -18,-6 -5,-6"
             fill="url(#starGlow)" opacity="0.88"/>
  </g>

  <!-- Micro accent: single garnish dot cluster on plate (abstract) -->
  <circle cx="800" cy="448" r="22" fill="#9a3309" opacity="0.55"/>
  <circle cx="800" cy="448" r="12" fill="#c2410c" opacity="0.7"/>
  <circle cx="800" cy="448" r="5"  fill="#fbbf24" opacity="0.85"/>

  <!-- Layer 3: edge decoration (outside safe zone, purely atmospheric) -->
  <!-- Top-left corner warm vignette -->
  <radialGradient id="cornerTL" cx="0%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#9a3309" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#cornerTL)"/>

  <!-- Bottom edge deepening -->
  <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </linearGradient>
  <rect y="600" width="1600" height="300" fill="url(#bottomFade)"/>
</svg>
