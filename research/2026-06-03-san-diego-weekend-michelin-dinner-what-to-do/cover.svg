<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Evening sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Sunset radial glow on horizon -->
    <radialGradient id="sunGlow" cx="50%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.72"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.48"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Ocean water gradient -->
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Plate dish radial -->
    <radialGradient id="plateSheen" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.97"/>
      <stop offset="65%" stop-color="#f0eadb" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#d4c4a8" stop-opacity="0.88"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0"/>
      <stop offset="82%" stop-color="#faf8f2" stop-opacity="0"/>
      <stop offset="88%" stop-color="#e8d9c4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2a882" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Cloche dome gradient -->
    <linearGradient id="cloche" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#d4c4a8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Sun disc glow -->
    <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sunset horizon radial glow -->
  <rect width="1600" height="900" fill="url(#sunGlow)"/>

  <!-- Sun disc on horizon -->
  <ellipse cx="800" cy="618" rx="88" ry="82" fill="url(#sunDisc)" opacity="0.88"/>

  <!-- Ocean / water band -->
  <rect x="0" y="614" width="1600" height="286" fill="url(#ocean)" opacity="0.92"/>

  <!-- Horizon shimmer line -->
  <rect x="0" y="612" width="1600" height="5" fill="#fbbf24" opacity="0.28"/>

  <!-- Coastal silhouette — gentle headland left -->
  <path d="M0 614 Q180 540 320 614 L0 614 Z" fill="#1a0e0e" opacity="0.72"/>

  <!-- Coastal silhouette — gentle headland right -->
  <path d="M1600 614 Q1420 548 1270 614 L1600 614 Z" fill="#1a0e0e" opacity="0.72"/>

  <!-- Water sun reflection column -->
  <rect x="756" y="618" width="88" height="240" fill="#fbbf24" opacity="0.09" rx="6"/>

  <!-- Layer 2: Hero — fine dining plate, centered safe zone -->
  <!-- Plate base ellipse -->
  <ellipse cx="800" cy="440" rx="248" ry="68" fill="url(#plateSheen)"/>
  <!-- Plate rim ring -->
  <ellipse cx="800" cy="440" rx="248" ry="68" fill="none" stroke="#c2a882" stroke-width="10" opacity="0.62"/>
  <!-- Inner plate well -->
  <ellipse cx="800" cy="436" rx="188" ry="52" fill="#faf8f2" opacity="0.88"/>
  <!-- Micro food accent — central dot cluster (abstract plating) -->
  <circle cx="800" cy="432" r="18" fill="#c2410c" opacity="0.82"/>
  <circle cx="770" cy="438" r="9" fill="#d97706" opacity="0.70"/>
  <circle cx="828" cy="438" r="7" fill="#9a3309" opacity="0.75"/>
  <circle cx="800" cy="418" r="5" fill="#fbbf24" opacity="0.65"/>

  <!-- Cloche dome over plate -->
  <ellipse cx="800" cy="390" rx="220" ry="115" fill="url(#cloche)" stroke="#faf8f2" stroke-width="3" opacity="0.22"/>
  <!-- Cloche highlight arc -->
  <path d="M640 390 Q720 280 800 272 Q880 280 960 390" fill="none" stroke="#faf8f2" stroke-width="4" opacity="0.18"/>
  <!-- Cloche knob -->
  <ellipse cx="800" cy="276" rx="18" ry="10" fill="#d97706" opacity="0.72"/>

  <!-- Table surface suggestion — thin horizontal band -->
  <rect x="0" y="490" width="1600" height="28" fill="#78350f" opacity="0.32" rx="0"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone, atmospheric) -->
  <!-- Left edge warm wash -->
  <rect x="0" y="0" width="90" height="900" fill="#c2410c" opacity="0.08"/>
  <!-- Right edge warm wash -->
  <rect x="1510" y="0" width="90" height="900" fill="#c2410c" opacity="0.08"/>
  <!-- Top vignette -->
  <rect x="0" y="0" width="1600" height="80" fill="#1a0e0e" opacity="0.45"/>
  <!-- Bottom vignette -->
  <rect x="0" y="820" width="1600" height="80" fill="#1a0e0e" opacity="0.55"/>
</svg>
