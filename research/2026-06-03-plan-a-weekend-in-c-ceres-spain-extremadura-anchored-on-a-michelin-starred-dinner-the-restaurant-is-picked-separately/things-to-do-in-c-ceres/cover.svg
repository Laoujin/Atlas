<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- low evening sun behind towers -->
  <circle cx="800" cy="470" r="300" fill="url(#sun)" opacity="0.9"/>

  <!-- tower skyline (hero), centered ~800,450, within safe zone -->
  <g fill="url(#stone)">
    <!-- left squat tower -->
    <rect x="300" y="430" width="150" height="370"/>
    <rect x="288" y="408" width="24" height="34"/>
    <rect x="350" y="408" width="24" height="34"/>
    <rect x="412" y="408" width="24" height="34"/>

    <!-- central tall tower (Torre de Bujaco style) -->
    <rect x="690" y="230" width="220" height="570"/>
    <rect x="678" y="206" width="32" height="36"/>
    <rect x="750" y="206" width="32" height="36"/>
    <rect x="822" y="206" width="32" height="36"/>
    <rect x="894" y="206" width="32" height="36"/>

    <!-- right tower -->
    <rect x="1100" y="360" width="170" height="440"/>
    <rect x="1088" y="338" width="26" height="34"/>
    <rect x="1155" y="338" width="26" height="34"/>
    <rect x="1222" y="338" width="26" height="34"/>
  </g>

  <!-- window slits -->
  <g fill="#1a0e0e" opacity="0.55">
    <rect x="788" y="320" width="24" height="60"/>
    <rect x="788" y="440" width="24" height="60"/>
    <rect x="360" y="500" width="20" height="48"/>
    <rect x="1165" y="450" width="18" height="44"/>
  </g>

  <!-- stork nest atop central tower -->
  <ellipse cx="800" cy="200" rx="70" ry="20" fill="#78350f" opacity="0.9"/>
  <ellipse cx="800" cy="196" rx="48" ry="12" fill="#5c2a1a"/>

  <!-- stork silhouette on the nest -->
  <g fill="#1a0e0e" opacity="0.85">
    <path d="M800 188 q14 -28 6 -60 q-4 -6 4 -8 q10 0 8 10 q-6 30 6 56 z"/>
    <path d="M804 122 l38 -10 l-36 4 z"/>
  </g>

  <!-- two distant storks in flight -->
  <g stroke="#1a0e0e" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M1040 250 q22 -20 44 0 q22 -20 44 0"/>
    <path d="M520 300 q16 -14 32 0 q16 -14 32 0"/>
  </g>
</svg>
