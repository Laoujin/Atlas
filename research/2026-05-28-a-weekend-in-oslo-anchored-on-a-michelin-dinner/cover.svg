<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.75" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fjord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5c2a1a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="opera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed twilight sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Low Nordic sun glow behind skyline -->
  <circle cx="1080" cy="560" r="320" fill="url(#sun)"/>

  <!-- Distant Bjørvika skyline / Barcode buildings (decoration band) -->
  <g opacity="0.78" fill="#1a0e0e">
    <rect x="900" y="430" width="32" height="170"/>
    <rect x="940" y="400" width="34" height="200"/>
    <rect x="982" y="380" width="30" height="220"/>
    <rect x="1020" y="410" width="36" height="190"/>
    <rect x="1064" y="370" width="32" height="230"/>
    <rect x="1104" y="395" width="34" height="205"/>
    <rect x="1146" y="350" width="30" height="250"/>
    <rect x="1184" y="385" width="36" height="215"/>
    <rect x="1228" y="365" width="32" height="235"/>
    <!-- Munch tower: taller, slim, slight lean -->
    <polygon points="1280,260 1322,260 1326,600 1276,600"/>
  </g>

  <!-- Distant hills across fjord (left side) -->
  <path d="M 0 540 Q 200 490 380 520 T 740 535 L 740 600 L 0 600 Z" fill="#1a0e0e" opacity="0.6"/>

  <!-- HERO: Opera House sloping marble roof (centered ~800,500, inside safe zone) -->
  <!-- Main angular roof descending into water -->
  <polygon points="320,560 1080,290 1180,290 1180,580 320,605"
           fill="url(#opera)" opacity="0.95"/>
  <!-- Ridge highlight along the upper slope -->
  <polygon points="320,560 1080,290 1180,290 1170,300 340,572"
           fill="#fef3ec" opacity="0.55"/>
  <!-- Roof facet seams (marble panels) -->
  <g stroke="#c2410c" stroke-width="1.4" opacity="0.45" fill="none">
    <line x1="460" y1="510" x2="500" y2="568"/>
    <line x1="600" y1="460" x2="640" y2="572"/>
    <line x1="740" y1="410" x2="780" y2="576"/>
    <line x1="880" y1="360" x2="920" y2="580"/>
    <line x1="1020" y1="310" x2="1060" y2="584"/>
  </g>
  <!-- Shadowed underside of the roof where it meets the fjord -->
  <polygon points="320,605 1180,580 1180,612 320,628" fill="#5c2a1a" opacity="0.85"/>

  <!-- Fjord water in front, full-bleed -->
  <rect x="0" y="612" width="1600" height="288" fill="url(#fjord)"/>

  <!-- Reflection of the opera roof in the water -->
  <polygon points="320,612 1180,612 1180,640 320,660"
           fill="#fbbf24" opacity="0.35"/>
  <polygon points="340,665 1170,640 1160,700 360,720"
           fill="#d97706" opacity="0.18"/>

  <!-- Water ripple lines -->
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.35" fill="none">
    <line x1="120" y1="720" x2="320" y2="720"/>
    <line x1="1240" y1="710" x2="1480" y2="710"/>
    <line x1="200" y1="770" x2="500" y2="770"/>
    <line x1="1100" y1="780" x2="1420" y2="780"/>
    <line x1="60" y1="820" x2="380" y2="820"/>
    <line x1="980" y1="830" x2="1300" y2="830"/>
  </g>

  <!-- A few warm window lights on the Munch tower (anchors the skyline) -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="1290" y="320" width="4" height="6"/>
    <rect x="1300" y="320" width="4" height="6"/>
    <rect x="1290" y="360" width="4" height="6"/>
    <rect x="1308" y="380" width="4" height="6"/>
    <rect x="1290" y="420" width="4" height="6"/>
    <rect x="1300" y="460" width="4" height="6"/>
  </g>
</svg>
