<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="fjord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roofShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="munch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low dusk sun glow, behind skyline -->
  <circle cx="950" cy="540" r="220" fill="url(#sun)"/>

  <!-- distant low hills across fjord -->
  <path d="M 0 555 L 220 530 L 420 545 L 620 525 L 820 540 L 1020 530 L 1220 545 L 1420 535 L 1600 545 L 1600 600 L 0 600 Z" fill="#5c2a1a" opacity="0.7"/>

  <!-- angular Munch museum silhouette, tilted top (decorative, behind hero) -->
  <path d="M 1090 560 L 1090 360 L 1200 330 L 1200 560 Z" fill="url(#munch)" opacity="0.92"/>
  <path d="M 1200 330 L 1200 350 L 1090 380 L 1090 360 Z" fill="#1a0e0e" opacity="0.85"/>
  <!-- subtle window grid on Munch tower -->
  <g fill="#fbbf24" opacity="0.18">
    <rect x="1105" y="400" width="14" height="10"/>
    <rect x="1130" y="400" width="14" height="10"/>
    <rect x="1155" y="400" width="14" height="10"/>
    <rect x="1180" y="395" width="14" height="10"/>
    <rect x="1105" y="440" width="14" height="10"/>
    <rect x="1130" y="440" width="14" height="10"/>
    <rect x="1155" y="440" width="14" height="10"/>
    <rect x="1180" y="435" width="14" height="10"/>
    <rect x="1105" y="480" width="14" height="10"/>
    <rect x="1130" y="480" width="14" height="10"/>
    <rect x="1155" y="480" width="14" height="10"/>
    <rect x="1180" y="475" width="14" height="10"/>
  </g>

  <!-- HERO: Opera House sloped marble roof rising from fjord -->
  <!-- main slope -->
  <path d="M 320 620 L 1280 620 L 980 360 L 620 360 Z" fill="url(#roof)" opacity="0.95"/>
  <!-- right-side angled wing -->
  <path d="M 980 360 L 1280 620 L 1280 560 L 1100 410 Z" fill="url(#roofShade)" opacity="0.85"/>
  <!-- left-side angled wing -->
  <path d="M 620 360 L 320 620 L 320 580 L 540 410 Z" fill="#d97706" opacity="0.25"/>
  <!-- ridgeline marble seams -->
  <g stroke="#c2410c" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M 360 600 L 700 380"/>
    <path d="M 460 600 L 760 380"/>
    <path d="M 560 600 L 820 380"/>
    <path d="M 660 600 L 880 380"/>
    <path d="M 760 600 L 940 380"/>
    <path d="M 860 600 L 980 380"/>
    <path d="M 960 600 L 980 380"/>
    <path d="M 1060 600 L 1060 400"/>
    <path d="M 1160 600 L 1140 420"/>
  </g>
  <!-- glass facade strip along the base -->
  <rect x="320" y="600" width="960" height="22" fill="#1a0e0e" opacity="0.55"/>
  <rect x="320" y="600" width="960" height="22" fill="url(#roofShade)" opacity="0.4"/>

  <!-- fjord water -->
  <rect x="0" y="622" width="1600" height="278" fill="url(#fjord)"/>

  <!-- opera roof reflection in water -->
  <path d="M 320 622 L 1280 622 L 1180 700 L 420 700 Z" fill="#fef3ec" opacity="0.15"/>
  <path d="M 1090 622 L 1200 622 L 1200 690 L 1090 690 Z" fill="#5c2a1a" opacity="0.35"/>

  <!-- floating sauna: small wooden hut on water, foreground left -->
  <rect x="420" y="700" width="120" height="48" fill="#78350f" opacity="0.95"/>
  <path d="M 420 700 L 480 678 L 540 700 Z" fill="#9a3309" opacity="0.95"/>
  <rect x="445" y="715" width="22" height="20" fill="#fbbf24" opacity="0.75"/>
  <rect x="495" y="715" width="22" height="20" fill="#fbbf24" opacity="0.65"/>
  <!-- sauna pontoon line -->
  <rect x="410" y="748" width="140" height="6" fill="#5c2a1a" opacity="0.9"/>
  <!-- ripples around sauna -->
  <g stroke="#fbbf24" stroke-width="1" opacity="0.35" fill="none">
    <path d="M 380 770 Q 480 766 580 770"/>
    <path d="M 400 786 Q 480 782 560 786"/>
  </g>

  <!-- distant water ripples catching dusk light -->
  <g stroke="#d97706" stroke-width="1" opacity="0.25" fill="none">
    <path d="M 700 660 Q 900 657 1100 660"/>
    <path d="M 800 685 Q 1000 682 1200 685"/>
    <path d="M 200 720 Q 350 717 500 720"/>
    <path d="M 1000 740 Q 1200 737 1400 740"/>
  </g>
</svg>
