<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="heath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#78350f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.32" r="0.28">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- soft low sun glow -->
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant pine horizon -->
  <path d="M0 560 L120 545 L180 560 L260 535 L340 555 L420 540 L520 560 L620 545 L740 555 L860 540 L980 560 L1100 545 L1220 555 L1340 540 L1460 560 L1600 550 L1600 600 L0 600 Z"
        fill="#5c2a1a" opacity="0.45"/>

  <!-- heath ground -->
  <path d="M0 600 Q 400 580 800 600 T 1600 605 L1600 900 L0 900 Z" fill="url(#heath)"/>

  <!-- heather speckle (a few rust tufts, not a grid) -->
  <circle cx="220" cy="720" r="38" fill="#be185d" opacity="0.18"/>
  <circle cx="380" cy="780" r="52" fill="#9a3309" opacity="0.22"/>
  <circle cx="1180" cy="740" r="46" fill="#be185d" opacity="0.18"/>
  <circle cx="1380" cy="800" r="60" fill="#9a3309" opacity="0.22"/>
  <circle cx="760" cy="820" r="70" fill="#78350f" opacity="0.3"/>

  <!-- HERO: curved elevated cycling bridge (Fietsen door de Heide) -->
  <!-- deck -->
  <path d="M 180 520 Q 800 250 1420 520 L 1420 560 Q 800 295 180 560 Z"
        fill="url(#bridge)" opacity="0.95"/>
  <!-- inner highlight along deck -->
  <path d="M 200 520 Q 800 268 1400 520"
        fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <!-- shadow underside -->
  <path d="M 180 560 Q 800 295 1420 560"
        fill="none" stroke="#1a0e0e" stroke-width="4" opacity="0.4"/>

  <!-- bridge piers, evenly spaced along the curve -->
  <g fill="#78350f" opacity="0.85">
    <rect x="350" y="465" width="14" height="180"/>
    <rect x="540" y="395" width="14" height="260"/>
    <rect x="760" y="350" width="14" height="320"/>
    <rect x="980" y="370" width="14" height="300"/>
    <rect x="1190" y="430" width="14" height="220"/>
  </g>
  <!-- pier shadows on the heath -->
  <g fill="#1a0e0e" opacity="0.25">
    <ellipse cx="357" cy="650" rx="22" ry="5"/>
    <ellipse cx="547" cy="660" rx="22" ry="5"/>
    <ellipse cx="767" cy="675" rx="22" ry="5"/>
    <ellipse cx="987" cy="668" rx="22" ry="5"/>
    <ellipse cx="1197" cy="655" rx="22" ry="5"/>
  </g>

  <!-- a single pine in foreground left, silhouette accent -->
  <path d="M 90 720 L 110 640 L 95 645 L 115 580 L 100 585 L 120 530 L 140 585 L 125 580 L 145 645 L 130 640 L 150 720 Z"
        fill="#1a0e0e" opacity="0.75"/>
  <rect x="117" y="720" width="6" height="40" fill="#1a0e0e" opacity="0.75"/>

  <!-- a single pine foreground right -->
  <path d="M 1470 740 L 1488 670 L 1474 675 L 1492 615 L 1478 620 L 1496 570 L 1514 620 L 1500 615 L 1518 675 L 1504 670 L 1522 740 Z"
        fill="#1a0e0e" opacity="0.7"/>
  <rect x="1493" y="740" width="6" height="40" fill="#1a0e0e" opacity="0.7"/>
</svg>
