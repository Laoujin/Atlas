<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1608"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#2a0f06"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: evening sky over heath -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon glow behind mill, low and warm -->
  <circle cx="1080" cy="360" r="280" fill="url(#moon)"/>
  <circle cx="1080" cy="360" r="70" fill="#fbbf24" opacity="0.85"/>

  <!-- Distant pine canopy silhouette (decoration; safe to crop on detail view) -->
  <path d="M0 640 L80 590 L140 615 L220 570 L290 605 L370 575 L450 600 L520 565 L600 595 L680 570 L760 600 L820 580 L900 605 L980 575 L1060 600 L1140 580 L1220 605 L1300 580 L1380 600 L1460 575 L1540 600 L1600 590 L1600 900 L0 900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Heath foreground band (Calluna purple-rust haze) -->
  <rect x="0" y="700" width="1600" height="200" fill="#5c2a1a" opacity="0.55"/>

  <!-- Bosbeek stream: gentle horizontal ribbon catching moonlight -->
  <path d="M120 720 Q 500 705, 800 725 T 1480 715" stroke="url(#stream)" stroke-width="14" fill="none" opacity="0.9"/>
  <path d="M120 740 Q 500 728, 800 748 T 1480 738" stroke="url(#stream)" stroke-width="6" fill="none" opacity="0.6"/>

  <!-- HERO: watermill, centered around (700, 500), inside safe zone -->
  <!-- Mill body -->
  <rect x="540" y="430" width="320" height="270" fill="url(#mill)"/>
  <!-- Roof -->
  <polygon points="510,430 700,310 890,430" fill="url(#roof)"/>
  <!-- Small chimney -->
  <rect x="800" y="340" width="32" height="70" fill="#3a1608"/>
  <!-- Window glow (no text, just a warm slit) -->
  <rect x="620" y="500" width="50" height="70" fill="#fbbf24" opacity="0.85"/>
  <rect x="730" y="500" width="50" height="70" fill="#fbbf24" opacity="0.7"/>

  <!-- Waterwheel on left side of mill -->
  <g transform="translate(470 580)">
    <circle r="110" fill="none" stroke="url(#wheel)" stroke-width="14" opacity="0.95"/>
    <circle r="88" fill="none" stroke="#78350f" stroke-width="3" opacity="0.7"/>
    <circle r="14" fill="#c2410c"/>
    <!-- 8 spokes -->
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#c2410c" stroke-width="7"/>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#c2410c" stroke-width="7"/>
    <line x1="-78" y1="-78" x2="78" y2="78" stroke="#c2410c" stroke-width="7"/>
    <line x1="-78" y1="78" x2="78" y2="-78" stroke="#c2410c" stroke-width="7"/>
    <!-- A few paddle hints on the rim -->
    <rect x="-8" y="-110" width="16" height="22" fill="#78350f"/>
    <rect x="-8" y="88" width="16" height="22" fill="#78350f"/>
    <rect x="-110" y="-8" width="22" height="16" fill="#78350f"/>
    <rect x="88" y="-8" width="22" height="16" fill="#78350f"/>
  </g>

  <!-- Water splash at base of wheel -->
  <ellipse cx="470" cy="700" rx="150" ry="14" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="470" cy="700" rx="90" ry="6" fill="#fef3ec" opacity="0.5"/>

  <!-- A few drifting sparks/embers from chimney (motivated by chimney) -->
  <circle cx="820" cy="280" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="840" cy="240" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="810" cy="200" r="2" fill="#fbbf24" opacity="0.45"/>
</svg>
