<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a130d"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plateRim" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="80%" stop-color="#d4c8a8"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="plateWell" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e8dcc0"/>
    </radialGradient>
    <radialGradient id="smallPlate" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8dcc0"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="garnish" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="900" ry="500" fill="url(#glow)"/>

  <!-- secondary plate (rose-tinted shadow, off-center, partially behind) -->
  <ellipse cx="1130" cy="540" rx="240" ry="60" fill="#be185d" opacity="0.18"/>
  <circle cx="1130" cy="510" r="200" fill="url(#smallPlate)" opacity="0.85"/>
  <circle cx="1130" cy="510" r="155" fill="#2a130d" opacity="0.55"/>
  <circle cx="1130" cy="500" r="22" fill="url(#garnish)" opacity="0.9"/>
  <circle cx="1095" cy="525" r="10" fill="#c2410c" opacity="0.85"/>
  <circle cx="1158" cy="528" r="8" fill="#be185d" opacity="0.7"/>

  <!-- hero plate, centered in safe zone -->
  <ellipse cx="720" cy="540" rx="360" ry="80" fill="#000" opacity="0.45"/>
  <circle cx="720" cy="470" r="305" fill="url(#plateRim)"/>
  <circle cx="720" cy="465" r="245" fill="url(#plateWell)"/>
  <circle cx="720" cy="465" r="245" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>

  <!-- plated composition: a smear arc + garnish dots -->
  <path d="M 580 510 Q 720 580 860 500" stroke="#9a3309" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.65"/>
  <path d="M 600 495 Q 720 555 840 490" stroke="#c2410c" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- central garnish element -->
  <circle cx="720" cy="445" r="48" fill="url(#garnish)"/>
  <circle cx="720" cy="438" r="48" fill="#78350f" opacity="0.55"/>
  <ellipse cx="715" cy="425" rx="22" ry="10" fill="#fbbf24" opacity="0.7"/>

  <!-- micro garnish dots -->
  <circle cx="650" cy="430" r="7" fill="#be185d" opacity="0.85"/>
  <circle cx="790" cy="420" r="6" fill="#d97706" opacity="0.9"/>
  <circle cx="660" cy="500" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="780" cy="495" r="6" fill="#c2410c" opacity="0.85"/>
  <circle cx="720" cy="510" r="4" fill="#fbbf24" opacity="0.9"/>

  <!-- Michelin star accent, upper right of hero -->
  <g transform="translate(965 240)">
    <circle r="62" fill="#fbbf24" opacity="0.18"/>
    <polygon points="0,-46 13,-14 47,-14 19,7 30,40 0,20 -30,40 -19,7 -47,-14 -13,-14"
             fill="url(#star)" opacity="0.95"/>
    <polygon points="0,-46 13,-14 47,-14 19,7 30,40 0,20 -30,40 -19,7 -47,-14 -13,-14"
             fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- smaller secondary star, distant -->
  <g transform="translate(1280 290)" opacity="0.7">
    <polygon points="0,-26 7,-8 27,-8 11,4 17,23 0,12 -17,23 -11,4 -27,-8 -7,-8"
             fill="url(#star)"/>
  </g>

  <!-- subtle table edge / corner decoration (full-bleed, croppable) -->
  <rect x="0" y="820" width="1600" height="80" fill="#1a0e0e" opacity="0.6"/>
  <line x1="0" y1="820" x2="1600" y2="820" stroke="#c2410c" stroke-width="1" opacity="0.35"/>
</svg>
