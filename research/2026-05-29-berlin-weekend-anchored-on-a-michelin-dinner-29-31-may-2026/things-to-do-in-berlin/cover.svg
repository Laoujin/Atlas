<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow centered on the tower -->
  <ellipse cx="800" cy="560" rx="780" ry="420" fill="url(#glow)"/>

  <!-- moon / sun disc behind tower -->
  <circle cx="800" cy="430" r="180" fill="#fbbf24" opacity="0.18"/>
  <circle cx="800" cy="430" r="120" fill="#fbbf24" opacity="0.22"/>

  <!-- distant skyline silhouette (decoration; bleeds off edges) -->
  <path d="M 0 760 L 120 760 L 130 720 L 180 720 L 190 740 L 260 740 L 270 700 L 340 700 L 350 730 L 430 730 L 440 690 L 510 690 L 520 720 L 600 720 L 610 740 L 1600 740 L 1600 900 L 0 900 Z"
        fill="#1a0e0e" opacity="0.75"/>
  <path d="M 0 780 L 1600 780 L 1600 900 L 0 900 Z" fill="#1a0e0e" opacity="0.6"/>
  <path d="M 1000 730 L 1060 730 L 1070 690 L 1140 690 L 1150 720 L 1230 720 L 1240 700 L 1320 700 L 1330 735 L 1420 735 L 1430 710 L 1500 710 L 1510 740 L 1600 740 L 1600 780 L 1000 780 Z"
        fill="#1a0e0e" opacity="0.75"/>

  <!-- Fernsehturm: hero, centered ~(800, 450) -->
  <!-- antenna spire -->
  <rect x="797" y="170" width="6" height="180" fill="#c2410c"/>
  <circle cx="800" cy="170" r="5" fill="#fbbf24"/>

  <!-- upper observation cone (small ring above sphere) -->
  <polygon points="780,360 820,360 815,345 785,345" fill="#9a3309"/>

  <!-- main sphere -->
  <circle cx="800" cy="430" r="78" fill="url(#sphere)"/>
  <ellipse cx="800" cy="430" rx="78" ry="14" fill="#5c2a1a" opacity="0.55"/>
  <ellipse cx="800" cy="416" rx="78" ry="10" fill="#fbbf24" opacity="0.35"/>
  <!-- window band -->
  <rect x="722" y="424" width="156" height="10" fill="#1a0e0e" opacity="0.55"/>

  <!-- shaft tapered: trapezoid from sphere base to ground -->
  <polygon points="788,508 812,508 836,760 764,760" fill="url(#shaft)"/>
  <!-- shaft highlight -->
  <polygon points="788,508 796,508 808,760 780,760" fill="#fbbf24" opacity="0.18"/>
  <!-- shaft shadow -->
  <polygon points="806,508 812,508 836,760 822,760" fill="#1a0e0e" opacity="0.35"/>

  <!-- base plinth -->
  <rect x="744" y="755" width="112" height="14" fill="#1a0e0e" opacity="0.85"/>

  <!-- single warm window dot on the sphere as accent -->
  <circle cx="800" cy="430" r="3" fill="#fbbf24" opacity="0.9"/>
</svg>
