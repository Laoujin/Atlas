<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#faf8f2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="plate2" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant skyline silhouette (decoration, partly outside safe zone) -->
  <g fill="#1a0e0e" opacity="0.55">
    <rect x="0" y="710" width="1600" height="190"/>
    <rect x="180" y="660" width="50" height="60"/>
    <rect x="280" y="640" width="70" height="80"/>
    <rect x="400" y="675" width="40" height="50"/>
    <rect x="1180" y="650" width="60" height="70"/>
    <rect x="1280" y="620" width="45" height="100"/>
    <rect x="1380" y="665" width="55" height="55"/>
    <!-- TV tower silhouette nod -->
    <rect x="1100" y="500" width="6" height="220"/>
    <circle cx="1103" cy="495" r="22"/>
  </g>

  <!-- Hero: two overlapping plates centered around (800, 450) -->
  <ellipse cx="690" cy="510" rx="260" ry="58" fill="#000" opacity="0.35"/>
  <circle cx="690" cy="470" r="230" fill="url(#plate)" opacity="0.92"/>
  <circle cx="690" cy="470" r="180" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.5"/>
  <circle cx="690" cy="470" r="55" fill="#c2410c" opacity="0.75"/>
  <circle cx="690" cy="470" r="55" fill="url(#plate2)" opacity="0.85"/>

  <!-- Star accent on plate (Michelin nod, abstract 4-point) -->
  <path d="M 690 430 L 702 462 L 734 470 L 702 478 L 690 510 L 678 478 L 646 470 L 678 462 Z" fill="#fbbf24" opacity="0.9"/>

  <!-- Second smaller plate, back-right -->
  <ellipse cx="1010" cy="395" rx="160" ry="36" fill="#000" opacity="0.3"/>
  <circle cx="1010" cy="365" r="140" fill="url(#plate)" opacity="0.85"/>
  <circle cx="1010" cy="365" r="105" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.4"/>
  <circle cx="1010" cy="365" r="32" fill="#d97706" opacity="0.7"/>

  <!-- Wine glass silhouette accent, right of plates -->
  <g opacity="0.85">
    <path d="M 1230 220 Q 1230 340 1190 360 Q 1170 370 1170 400 L 1170 510 L 1230 510 L 1230 400 Q 1230 370 1250 360 Q 1290 340 1290 220 Z" fill="#5c2a1a" opacity="0.7"/>
    <path d="M 1240 230 Q 1240 335 1210 355 L 1280 355 Q 1280 335 1280 230 Z" fill="url(#glass)"/>
    <ellipse cx="1260" cy="278" rx="14" ry="6" fill="#fef3ec" opacity="0.4"/>
    <rect x="1150" y="505" width="160" height="8" fill="#1a0e0e" opacity="0.6"/>
  </g>

  <!-- Soft sparkles around hero (motivated: candlelight) -->
  <circle cx="540" cy="320" r="3" fill="#fbbf24" opacity="0.85"/>
  <circle cx="900" cy="260" r="2.5" fill="#fbbf24" opacity="0.75"/>
  <circle cx="450" cy="540" r="2" fill="#fbbf24" opacity="0.7"/>
</svg>
