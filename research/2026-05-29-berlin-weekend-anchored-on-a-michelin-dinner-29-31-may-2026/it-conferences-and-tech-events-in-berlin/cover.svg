<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sphere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed night sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm radial glow behind the tower -->
  <ellipse cx="800" cy="500" rx="620" ry="380" fill="url(#glow)"/>

  <!-- Conference network grid: orbits + nodes around the sphere -->
  <g stroke="#0e7490" stroke-opacity="0.45" fill="none" stroke-width="1.2">
    <ellipse cx="800" cy="360" rx="280" ry="70"/>
    <ellipse cx="800" cy="360" rx="380" ry="95"/>
    <ellipse cx="800" cy="360" rx="480" ry="120"/>
  </g>
  <g fill="#0e7490" fill-opacity="0.75">
    <circle cx="520" cy="360" r="5"/>
    <circle cx="1080" cy="360" r="5"/>
    <circle cx="420" cy="360" r="4"/>
    <circle cx="1180" cy="360" r="4"/>
    <circle cx="800" cy="290" r="4"/>
    <circle cx="800" cy="430" r="4"/>
  </g>

  <!-- Faint horizon skyline silhouette (Berlin rooftops) -->
  <path d="M0,720 L80,720 L80,690 L140,690 L140,710 L220,710 L220,680 L260,680 L260,700 L340,700 L340,675 L400,675 L400,705 L500,705 L500,685 L560,685 L560,715 L640,715 L640,690 L700,690 L700,710 L1600,710 L1600,900 L0,900 Z"
        fill="#1a0e0e" fill-opacity="0.85"/>
  <path d="M700,710 L760,710 L760,690 L820,690 L820,705 L900,705 L900,680 L960,680 L960,700 L1040,700 L1040,685 L1120,685 L1120,710 L1200,710 L1200,690 L1280,690 L1280,705 L1360,705 L1360,685 L1440,685 L1440,712 L1600,712 L1600,900 L700,900 Z"
        fill="#1a0e0e" fill-opacity="0.85"/>

  <!-- Fernsehturm: antenna spire -->
  <rect x="797" y="120" width="6" height="180" fill="#c2410c"/>
  <rect x="794" y="200" width="12" height="6" fill="#fbbf24" opacity="0.8"/>

  <!-- Fernsehturm: sphere (hero) -->
  <circle cx="800" cy="360" r="78" fill="url(#sphere)"/>
  <!-- Sphere facet bands -->
  <path d="M722,360 Q800,330 878,360" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M722,360 Q800,390 878,360" stroke="#fef3ec" stroke-width="1" fill="none" opacity="0.35"/>
  <ellipse cx="800" cy="360" rx="78" ry="22" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.55"/>
  <!-- Highlight -->
  <ellipse cx="775" cy="335" rx="22" ry="14" fill="#fef3ec" opacity="0.35"/>

  <!-- Tower shaft tapering down -->
  <path d="M790,438 L810,438 L818,720 L782,720 Z" fill="url(#shaft)"/>
  <!-- Shaft windows / observation deck band -->
  <rect x="788" y="445" width="24" height="5" fill="#fbbf24" opacity="0.85"/>
  <rect x="787" y="455" width="26" height="3" fill="#fbbf24" opacity="0.5"/>

  <!-- Tower base platform -->
  <path d="M760,720 L840,720 L850,735 L750,735 Z" fill="#1a0e0e" opacity="0.9"/>

  <!-- A few drifting node sparks (event markers) -->
  <circle cx="280" cy="220" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1340" cy="180" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1420" cy="320" r="2.5" fill="#0e7490" opacity="0.8"/>
  <circle cx="200" cy="380" r="2.5" fill="#0e7490" opacity="0.8"/>
</svg>
