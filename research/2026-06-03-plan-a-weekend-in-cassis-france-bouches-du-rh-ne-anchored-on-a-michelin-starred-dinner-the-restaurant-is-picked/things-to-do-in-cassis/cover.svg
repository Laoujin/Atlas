<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fde2cf"/>
      <stop offset="1" stop-color="#fbceb0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="cliff2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow over the cliff shoulder -->
  <circle cx="1080" cy="300" r="360" fill="url(#sun)"/>
  <circle cx="1080" cy="300" r="95" fill="#fbbf24" opacity="0.9"/>

  <!-- the great Cap Canaille cliff, hero, rising from the sea -->
  <path d="M 560 760 L 600 470 L 720 360 L 880 300 L 1030 330 L 1180 430 L 1280 540 L 1340 760 Z" fill="url(#cliff)" opacity="0.95"/>
  <!-- shaded fold of the cliff face -->
  <path d="M 880 300 L 1030 330 L 1180 430 L 1280 540 L 1340 760 L 980 760 Z" fill="url(#cliff2)" opacity="0.55"/>
  <!-- limestone ledge highlight -->
  <path d="M 600 470 L 720 360 L 880 300 L 870 345 L 730 405 L 625 505 Z" fill="#fbbf24" opacity="0.4"/>

  <!-- Mediterranean sea band, full-bleed foot -->
  <rect x="0" y="760" width="1600" height="140" fill="url(#sea)" opacity="0.9"/>
  <path d="M 0 760 Q 400 742 800 760 T 1600 760 L 1600 800 L 0 800 Z" fill="#0e7490" opacity="0.6"/>

  <!-- lone sail on the water -->
  <path d="M 470 690 L 470 760 L 520 760 Z" fill="#faf8f2" opacity="0.95"/>
  <path d="M 472 690 L 472 758 L 448 758 Z" fill="#f0eadb" opacity="0.85"/>
</svg>
