<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: warm dusk sky over Mediterranean -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Radial glow behind hub -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub node fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Satellite node fill -->
    <radialGradient id="nodeFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Bay water gradient -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle coastal cliff silhouette at bottom edge (decorative, outside safe zone) -->
  <path d="M0 820 Q200 780 380 810 Q520 835 640 790 Q740 755 800 770 Q860 755 960 790 Q1080 835 1220 810 Q1400 780 1600 820 L1600 900 L0 900 Z"
        fill="#78350f" opacity="0.55"/>
  <path d="M0 850 Q300 820 500 845 Q700 865 800 840 Q900 865 1100 845 Q1300 820 1600 850 L1600 900 L0 900 Z"
        fill="#5c2a1a" opacity="0.6"/>

  <!-- Layer 2: Hero element — node-and-edge graph centered at (800, 430) -->

  <!-- Glow pool behind hub -->
  <ellipse cx="800" cy="430" rx="320" ry="220" fill="url(#hubGlow)"/>

  <!-- Concentric arc rings (conference signal / bay waves) -->
  <circle cx="800" cy="430" r="280" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.25"/>
  <circle cx="800" cy="430" r="200" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.30"/>
  <circle cx="800" cy="430" r="120" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.35"/>

  <!-- Edge lines from hub to satellite nodes -->
  <!-- Node positions: NW, N, NE, E, SE, SW -->
  <line x1="800" y1="430" x2="570" y2="270" stroke="#d97706" stroke-width="2" opacity="0.65"/>
  <line x1="800" y1="430" x2="800" y2="220" stroke="#d97706" stroke-width="2" opacity="0.65"/>
  <line x1="800" y1="430" x2="1030" y2="270" stroke="#d97706" stroke-width="2" opacity="0.65"/>
  <line x1="800" y1="430" x2="1060" y2="480" stroke="#c2410c" stroke-width="2" opacity="0.55"/>
  <line x1="800" y1="430" x2="920" y2="620" stroke="#c2410c" stroke-width="2" opacity="0.55"/>
  <line x1="800" y1="430" x2="540" y2="590" stroke="#c2410c" stroke-width="2" opacity="0.55"/>

  <!-- Satellite nodes -->
  <circle cx="570" cy="270" r="22" fill="url(#nodeFill)" opacity="0.85"/>
  <circle cx="570" cy="270" r="28" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="800" cy="220" r="22" fill="url(#nodeFill)" opacity="0.85"/>
  <circle cx="800" cy="220" r="28" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="1030" cy="270" r="22" fill="url(#nodeFill)" opacity="0.85"/>
  <circle cx="1030" cy="270" r="28" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <circle cx="1060" cy="480" r="18" fill="url(#nodeFill)" opacity="0.80"/>
  <circle cx="1060" cy="480" r="24" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35"/>

  <circle cx="920" cy="620" r="18" fill="url(#nodeFill)" opacity="0.80"/>
  <circle cx="920" cy="620" r="24" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35"/>

  <circle cx="540" cy="590" r="18" fill="url(#nodeFill)" opacity="0.80"/>
  <circle cx="540" cy="590" r="24" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35"/>

  <!-- Central hub node -->
  <circle cx="800" cy="430" r="52" fill="url(#hubFill)" opacity="0.95"/>
  <circle cx="800" cy="430" r="62" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.6"/>
  <circle cx="800" cy="430" r="72" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.35"/>

  <!-- Layer 3: Decorative top-edge horizon haze (outside safe zone y<90) -->
  <rect x="0" y="0" width="1600" height="90" fill="url(#bg)" opacity="0.4"/>
</svg>
