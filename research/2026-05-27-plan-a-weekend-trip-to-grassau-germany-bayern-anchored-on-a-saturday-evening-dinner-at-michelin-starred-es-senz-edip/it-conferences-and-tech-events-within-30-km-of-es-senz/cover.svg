<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nearPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind peaks -->
  <circle cx="980" cy="430" r="240" fill="url(#sun)" opacity="0.9"/>

  <!-- far range -->
  <path d="M0,560 L180,440 L320,500 L470,380 L640,470 L820,360 L1000,440 L1180,370 L1360,460 L1520,400 L1600,440 L1600,900 L0,900 Z"
        fill="url(#farPeak)"/>

  <!-- mid range (hero silhouette, centered) -->
  <path d="M120,640 L300,470 L420,540 L580,360 L720,470 L860,300 L1000,420 L1140,340 L1280,500 L1420,420 L1480,640 Z"
        fill="url(#midPeak)" opacity="0.92"/>

  <!-- network constellation over hero peak -->
  <g stroke="#fbbf24" stroke-width="1.6" opacity="0.85" fill="none">
    <line x1="700" y1="240" x2="860" y2="300"/>
    <line x1="860" y1="300" x2="1000" y2="230"/>
    <line x1="700" y1="240" x2="780" y2="180"/>
    <line x1="780" y1="180" x2="920" y2="170"/>
    <line x1="920" y1="170" x2="1000" y2="230"/>
    <line x1="860" y1="300" x2="920" y2="170"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="860" cy="300" r="9"/>
    <circle cx="700" cy="240" r="5"/>
    <circle cx="780" cy="180" r="5"/>
    <circle cx="920" cy="170" r="6"/>
    <circle cx="1000" cy="230" r="5"/>
  </g>
  <circle cx="860" cy="300" r="16" fill="none" stroke="#fef3ec" stroke-width="1.2" opacity="0.6"/>

  <!-- near foreground ridge -->
  <path d="M0,780 L140,700 L280,740 L440,660 L600,720 L780,640 L960,710 L1140,650 L1320,730 L1480,680 L1600,720 L1600,900 L0,900 Z"
        fill="url(#nearPeak)"/>

  <!-- small lake reflection band -->
  <rect x="0" y="820" width="1600" height="14" fill="#c2410c" opacity="0.35"/>
  <rect x="0" y="838" width="1600" height="6" fill="#fbbf24" opacity="0.25"/>
</svg>
