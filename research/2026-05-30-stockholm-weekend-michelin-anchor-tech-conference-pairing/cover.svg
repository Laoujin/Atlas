<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2a1410"/>
    </linearGradient>
    <radialGradient id="plateBack" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a1a0a" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="plateFront" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="morsel" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Decorative distant city lights along bottom (outside hero safe zone vertically on detail) -->
  <g opacity="0.35">
    <circle cx="120" cy="820" r="2" fill="#fbbf24"/>
    <circle cx="180" cy="835" r="1.5" fill="#fbbf24"/>
    <circle cx="240" cy="825" r="2" fill="#d97706"/>
    <circle cx="300" cy="840" r="1.5" fill="#fbbf24"/>
    <circle cx="1320" cy="830" r="2" fill="#fbbf24"/>
    <circle cx="1380" cy="820" r="1.5" fill="#d97706"/>
    <circle cx="1440" cy="835" r="2" fill="#fbbf24"/>
    <circle cx="1500" cy="825" r="1.5" fill="#fbbf24"/>
  </g>

  <!-- Hero: two plate forms, the back plate behind, front plate centered -->
  <!-- Back plate (companion, offset right) -->
  <ellipse cx="1010" cy="470" rx="240" ry="232" fill="url(#plateBack)" opacity="0.75"/>
  <ellipse cx="1010" cy="470" rx="170" ry="164" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="1010" cy="470" r="14" fill="#be185d" opacity="0.7"/>

  <!-- Front plate (the anchor Michelin dinner) -->
  <ellipse cx="700" cy="470" rx="310" ry="300" fill="#0a0505" opacity="0.55"/>
  <ellipse cx="700" cy="460" rx="295" ry="285" fill="url(#plateFront)"/>
  <ellipse cx="700" cy="460" rx="210" ry="202" fill="#3a1a0a" opacity="0.45"/>

  <!-- Plated morsel / star quenelle as focal point -->
  <circle cx="700" cy="455" r="46" fill="url(#morsel)"/>
  <circle cx="688" cy="445" r="14" fill="#faf8f2" opacity="0.55"/>

  <!-- Small garnish dots around the morsel -->
  <circle cx="640" cy="430" r="5" fill="#be185d" opacity="0.85"/>
  <circle cx="760" cy="495" r="4" fill="#fbbf24" opacity="0.9"/>
  <circle cx="755" cy="420" r="3.5" fill="#fef3ec" opacity="0.8"/>
  <circle cx="635" cy="490" r="4" fill="#d97706" opacity="0.85"/>

  <!-- Subtle steam wisps rising from the plate (within safe zone) -->
  <path d="M 685 380 Q 675 340 695 305 Q 710 270 690 235" stroke="#fef3ec" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 715 385 Q 730 350 715 315 Q 700 280 720 245" stroke="#fef3ec" stroke-opacity="0.14" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
