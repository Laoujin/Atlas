<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="lanyard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun glow behind skyline -->
  <circle cx="1180" cy="430" r="260" fill="url(#sun)"/>

  <!-- distant skyline silhouette (decoration, partially safe to clip) -->
  <g fill="#5c2a1a" opacity="0.55">
    <rect x="80" y="540" width="60" height="160"/>
    <rect x="150" y="510" width="80" height="190"/>
    <rect x="240" y="560" width="50" height="140"/>
    <rect x="1380" y="520" width="70" height="180"/>
    <rect x="1460" y="555" width="60" height="145"/>
    <rect x="1530" y="540" width="55" height="160"/>
  </g>

  <!-- Kista TV-style tower (left of hero, in safe zone edge) -->
  <g fill="#78350f" opacity="0.75">
    <polygon points="300,700 320,330 332,330 352,700"/>
    <ellipse cx="326" cy="335" rx="34" ry="14"/>
    <ellipse cx="326" cy="305" rx="22" ry="9"/>
    <rect x="322" y="220" width="8" height="80"/>
    <circle cx="326" cy="215" r="6"/>
  </g>

  <!-- Stockholm City Hall tower (right side, in safe zone) -->
  <g fill="#9a3309" opacity="0.85">
    <rect x="1150" y="380" width="90" height="320"/>
    <polygon points="1150,380 1195,355 1240,380"/>
    <rect x="1170" y="340" width="50" height="20"/>
    <polygon points="1170,340 1195,295 1220,340"/>
    <rect x="1188" y="240" width="14" height="60"/>
    <circle cx="1195" cy="232" r="8" fill="#fbbf24"/>
    <circle cx="1180" cy="222" r="5" fill="#fbbf24"/>
    <circle cx="1210" cy="222" r="5" fill="#fbbf24"/>
    <circle cx="1195" cy="212" r="5" fill="#fbbf24"/>
  </g>

  <!-- water band -->
  <rect x="0" y="700" width="1600" height="120" fill="url(#water)"/>
  <rect x="0" y="700" width="1600" height="3" fill="#fbbf24" opacity="0.4"/>

  <!-- lanyard cord arcing into hero badge -->
  <path d="M 640 90 Q 720 240 760 330 L 780 380" stroke="url(#lanyard)" stroke-width="14" fill="none" opacity="0.9"/>
  <path d="M 960 90 Q 880 240 840 330 L 820 380" stroke="url(#lanyard)" stroke-width="14" fill="none" opacity="0.9"/>

  <!-- conference badge (hero) -->
  <g>
    <!-- clip/ring at top of badge -->
    <rect x="780" y="355" width="40" height="40" rx="6" fill="#334155"/>
    <rect x="788" y="362" width="24" height="6" rx="2" fill="#1a0e0e" opacity="0.6"/>

    <!-- badge body -->
    <rect x="620" y="390" width="360" height="440" rx="18" fill="url(#badge)"/>
    <rect x="620" y="390" width="360" height="440" rx="18" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>

    <!-- inner photo/area panel -->
    <rect x="650" y="425" width="300" height="200" rx="6" fill="#faf8f2" opacity="0.92"/>

    <!-- skyline silhouette inside the badge photo area -->
    <g fill="#5c2a1a" opacity="0.85">
      <rect x="670" y="555" width="22" height="65"/>
      <rect x="695" y="540" width="28" height="80"/>
      <polygon points="730,540 744,520 758,540 758,620 730,620"/>
      <rect x="765" y="555" width="20" height="65"/>
      <polygon points="790,560 806,500 822,560 822,620 790,620"/>
      <circle cx="806" cy="495" r="4" fill="#c2410c"/>
      <rect x="830" y="545" width="26" height="75"/>
      <rect x="862" y="560" width="20" height="60"/>
      <rect x="888" y="535" width="32" height="85"/>
      <rect x="925" y="555" width="18" height="65"/>
    </g>

    <!-- horizontal info bars (decoration suggesting text lines, no actual letters) -->
    <rect x="650" y="660" width="220" height="10" rx="3" fill="#fbbf24" opacity="0.85"/>
    <rect x="650" y="685" width="160" height="6" rx="2" fill="#faf8f2" opacity="0.5"/>
    <rect x="650" y="700" width="180" height="6" rx="2" fill="#faf8f2" opacity="0.5"/>

    <!-- calendar mini-grid on badge -->
    <g fill="#faf8f2" opacity="0.75">
      <rect x="650" y="730" width="300" height="70" rx="4"/>
    </g>
    <g fill="#c2410c">
      <rect x="660" y="745" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="688" y="745" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="716" y="745" width="20" height="16" rx="2" opacity="0.9"/>
      <rect x="744" y="745" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="772" y="745" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="800" y="745" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="828" y="745" width="20" height="16" rx="2" opacity="0.35"/>

      <rect x="660" y="770" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="688" y="770" width="20" height="16" rx="2" opacity="0.9"/>
      <rect x="716" y="770" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="744" y="770" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="772" y="770" width="20" height="16" rx="2" opacity="0.35"/>
      <rect x="800" y="770" width="20" height="16" rx="2" opacity="0.9"/>
      <rect x="828" y="770" width="20" height="16" rx="2" opacity="0.35"/>
    </g>
  </g>
</svg>
