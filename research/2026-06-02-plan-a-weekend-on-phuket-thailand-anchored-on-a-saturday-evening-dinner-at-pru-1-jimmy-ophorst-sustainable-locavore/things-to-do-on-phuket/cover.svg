<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="karstFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="karstMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="karstNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow, hero -->
  <circle cx="820" cy="430" r="280" fill="url(#sun)"/>
  <circle cx="820" cy="430" r="130" fill="#fef3ec" opacity="0.9"/>

  <!-- distant karst silhouettes -->
  <path d="M 180 540 Q 230 430 280 460 Q 320 380 360 440 Q 400 470 420 520 Q 440 560 460 540 L 460 560 L 180 560 Z" fill="url(#karstFar)"/>
  <path d="M 1180 530 Q 1230 440 1280 470 Q 1320 400 1380 450 Q 1430 470 1460 520 L 1460 560 L 1180 560 Z" fill="url(#karstFar)" opacity="0.85"/>

  <!-- mid karst island, left -->
  <path d="M 380 560 Q 400 470 440 460 Q 460 380 510 400 Q 540 360 580 410 Q 620 430 640 490 Q 660 540 680 560 Z" fill="url(#karstMid)"/>
  <!-- mid karst island, right (hero anchor) -->
  <path d="M 900 580 Q 920 480 970 470 Q 1000 380 1050 410 Q 1080 360 1130 400 Q 1170 420 1200 480 Q 1230 540 1240 580 Z" fill="url(#karstMid)"/>

  <!-- water band -->
  <rect x="0" y="555" width="1600" height="120" fill="url(#water)"/>

  <!-- near karst, tall hero pillar centered -->
  <path d="M 700 670 Q 720 560 760 540 Q 780 430 820 420 Q 850 360 890 410 Q 920 440 940 510 Q 960 580 980 640 Q 990 670 970 670 Z" fill="url(#karstNear)"/>

  <!-- water reflections / horizon line -->
  <rect x="0" y="675" width="1600" height="6" fill="#fbbf24" opacity="0.4"/>
  <ellipse cx="820" cy="700" rx="180" ry="8" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="500" cy="690" rx="130" ry="5" fill="#fbbf24" opacity="0.25"/>
  <ellipse cx="1080" cy="695" rx="150" ry="6" fill="#fbbf24" opacity="0.25"/>

  <!-- foreground water deepening -->
  <rect x="0" y="760" width="1600" height="140" fill="#1a0e0e" opacity="0.6"/>

  <!-- subtle bird specks far from hero, decorative -->
  <path d="M 1320 240 q 10 -8 20 0 q 10 -8 20 0" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 1380 290 q 8 -6 16 0 q 8 -6 16 0" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
