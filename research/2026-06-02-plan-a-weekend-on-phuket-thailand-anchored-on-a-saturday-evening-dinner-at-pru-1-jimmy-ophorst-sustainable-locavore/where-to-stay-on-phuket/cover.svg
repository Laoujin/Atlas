<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0608"/>
      <stop offset="60%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Ambient resort glow -->
    <radialGradient id="glow" cx="50%" cy="72%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Water surface gradient -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a0a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Building face gradient -->
    <linearGradient id="bldgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Lit building gradient -->
    <linearGradient id="bldgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Reflection shimmer -->
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon halo (upper right, outside safe zone vertically but adds atmosphere) -->
  <ellipse cx="1280" cy="130" rx="90" ry="90" fill="url(#moon)" opacity="0.7"/>
  <circle cx="1280" cy="130" r="28" fill="#fef3ec" opacity="0.85"/>

  <!-- Ambient resort glow on horizon -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — resort architecture scene, centered ~800,430 -->

  <!-- Water plane -->
  <rect x="0" y="590" width="1600" height="310" fill="url(#water)" opacity="0.95"/>

  <!-- Horizon line shimmer -->
  <rect x="0" y="588" width="1600" height="4" fill="#d97706" opacity="0.18"/>

  <!-- Left villa block (taller, set back) -->
  <rect x="310" y="310" width="220" height="282" rx="4" fill="url(#bldgA)" opacity="0.88"/>
  <!-- Left villa roof ridge -->
  <polygon points="310,310 420,250 530,310" fill="#3d1a0a" opacity="0.9"/>
  <!-- Left villa window glows -->
  <rect x="340" y="355" width="52" height="38" rx="3" fill="#fbbf24" opacity="0.45"/>
  <rect x="420" y="355" width="52" height="38" rx="3" fill="#d97706" opacity="0.35"/>
  <rect x="340" y="430" width="52" height="38" rx="3" fill="#d97706" opacity="0.30"/>
  <rect x="420" y="430" width="52" height="38" rx="3" fill="#fbbf24" opacity="0.25"/>

  <!-- Hero centre villa (tallest, brightest) -->
  <rect x="620" y="240" width="360" height="352" rx="5" fill="url(#bldgB)" opacity="0.92"/>
  <!-- Centre villa roof — shallow hip -->
  <polygon points="620,240 800,160 980,240" fill="#5c2a1a" opacity="0.95"/>
  <!-- Centre villa ridge cap -->
  <rect x="740" y="160" width="120" height="12" rx="4" fill="#c2410c" opacity="0.7"/>
  <!-- Centre villa lit windows — 3 rows -->
  <rect x="650" y="285" width="65" height="45" rx="3" fill="#fbbf24" opacity="0.55"/>
  <rect x="740" y="285" width="65" height="45" rx="3" fill="#fbbf24" opacity="0.60"/>
  <rect x="830" y="285" width="65" height="45" rx="3" fill="#d97706" opacity="0.50"/>
  <rect x="650" y="365" width="65" height="45" rx="3" fill="#d97706" opacity="0.40"/>
  <rect x="740" y="365" width="65" height="45" rx="3" fill="#fbbf24" opacity="0.55"/>
  <rect x="830" y="365" width="65" height="45" rx="3" fill="#fbbf24" opacity="0.45"/>
  <rect x="650" y="445" width="65" height="45" rx="3" fill="#fbbf24" opacity="0.35"/>
  <rect x="740" y="445" width="65" height="45" rx="3" fill="#d97706" opacity="0.30"/>
  <rect x="830" y="445" width="65" height="45" rx="3" fill="#fbbf24" opacity="0.40"/>
  <!-- Centre villa terrace balustrade -->
  <rect x="620" y="590" width="360" height="10" rx="2" fill="#9a3309" opacity="0.8"/>

  <!-- Right villa block -->
  <rect x="1060" y="340" width="230" height="252" rx="4" fill="url(#bldgA)" opacity="0.85"/>
  <!-- Right villa roof -->
  <polygon points="1060,340 1175,278 1290,340" fill="#3d1a0a" opacity="0.9"/>
  <!-- Right villa windows -->
  <rect x="1090" y="385" width="52" height="38" rx="3" fill="#fbbf24" opacity="0.40"/>
  <rect x="1172" y="385" width="52" height="38" rx="3" fill="#d97706" opacity="0.30"/>
  <rect x="1090" y="458" width="52" height="38" rx="3" fill="#d97706" opacity="0.28"/>
  <rect x="1172" y="458" width="52" height="38" rx="3" fill="#fbbf24" opacity="0.35"/>

  <!-- Water reflections of buildings (impressionistic vertical bars) -->
  <rect x="650" y="595" width="360" height="120" rx="2" fill="url(#reflect)" opacity="0.45"/>
  <rect x="330" y="595" width="180" height="80" rx="2" fill="url(#reflect)" opacity="0.25"/>
  <rect x="1080" y="595" width="190" height="80" rx="2" fill="url(#reflect)" opacity="0.22"/>

  <!-- Moon reflection on water -->
  <ellipse cx="1280" cy="640" rx="18" ry="6" fill="#fbbf24" opacity="0.30"/>
  <ellipse cx="1280" cy="660" rx="10" ry="3" fill="#fbbf24" opacity="0.18"/>

  <!-- Layer 3: Palm frond silhouettes at edges (decorative, partially outside safe zone) -->
  <!-- Left palm -->
  <g opacity="0.70">
    <ellipse cx="145" cy="420" rx="140" ry="28" fill="#1a0e0e" transform="rotate(-38,145,420)"/>
    <ellipse cx="115" cy="390" rx="120" ry="22" fill="#2d1208" transform="rotate(-20,115,390)"/>
    <ellipse cx="80" cy="450" rx="110" ry="20" fill="#1a0e0e" transform="rotate(-55,80,450)"/>
    <rect x="60" y="420" width="14" height="200" rx="6" fill="#2d1208"/>
  </g>
  <!-- Right palm -->
  <g opacity="0.65">
    <ellipse cx="1455" cy="400" rx="140" ry="26" fill="#1a0e0e" transform="rotate(40,1455,400)"/>
    <ellipse cx="1490" cy="370" rx="120" ry="20" fill="#2d1208" transform="rotate(22,1490,370)"/>
    <ellipse cx="1520" cy="445" rx="110" ry="20" fill="#1a0e0e" transform="rotate(58,1520,445)"/>
    <rect x="1526" y="400" width="14" height="210" rx="6" fill="#2d1208"/>
  </g>
</svg>
