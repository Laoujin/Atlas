<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- low sun glow -->
  <circle cx="800" cy="560" r="360" fill="url(#sun)" opacity="0.85"/>

  <!-- sea -->
  <rect y="560" width="1600" height="340" fill="url(#sea)"/>
  <!-- sun reflection on water -->
  <polygon points="720,560 880,560 940,900 660,900" fill="#fbbf24" opacity="0.55"/>
  <rect y="600" width="1600" height="6" fill="#fbbf24" opacity="0.3"/>
  <rect y="660" width="1600" height="5" fill="#fef3ec" opacity="0.25"/>
  <rect y="730" width="1600" height="5" fill="#fbbf24" opacity="0.22"/>

  <!-- hero: sailing yacht, centered ~ (800,450) -->
  <!-- hull -->
  <path d="M620 612 L980 612 L900 668 L700 668 Z" fill="#9a3309"/>
  <path d="M620 612 L980 612 L900 668 L700 668 Z" fill="#c2410c" opacity="0.5"/>
  <!-- mast -->
  <rect x="797" y="210" width="6" height="402" fill="#78350f"/>
  <!-- mainsail -->
  <path d="M797 220 L797 600 L640 600 Q740 420 797 220 Z" fill="url(#sail)" opacity="0.95"/>
  <!-- jib -->
  <path d="M803 250 L803 600 L960 600 Q900 430 803 250 Z" fill="url(#sail)" opacity="0.88"/>
  <path d="M803 250 L803 600 L960 600 Q900 430 803 250 Z" fill="#fbbf24" opacity="0.18"/>

  <!-- distant headland (decoration, upper edges) -->
  <path d="M1180 560 Q1320 500 1600 530 L1600 560 Z" fill="#5c2a1a" opacity="0.5"/>
  <path d="M0 560 Q140 522 300 560 Z" fill="#5c2a1a" opacity="0.4"/>
</svg>
