<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>

    <!-- Warm radial glow: candlelight ambiance -->
    <radialGradient id="warmGlow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose accent glow -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate gradient -->
    <radialGradient id="plateGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6cfc4"/>
    </radialGradient>

    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#fef3ec" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Wine fill gradient -->
    <linearGradient id="wineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.90"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Warm ambient glow behind hero -->
  <ellipse cx="800" cy="468" rx="600" ry="380" fill="url(#warmGlow)"/>

  <!-- Rose accent glow — upper hero area -->
  <ellipse cx="800" cy="320" rx="340" ry="220" fill="url(#roseGlow)"/>

  <!-- Layer 2: Hero element — wine glass centered at (800, 420) -->

  <!-- Glass bowl: tapered chalice shape using path -->
  <!-- Bowl outer shape -->
  <path d="M 724 210 Q 710 320 690 390 Q 675 440 760 460 L 840 460 Q 925 440 910 390 Q 890 320 876 210 Z"
        fill="url(#glassGrad)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4" opacity="0.85"/>

  <!-- Wine inside bowl (lower portion) -->
  <path d="M 700 375 Q 688 428 760 448 L 840 448 Q 912 428 900 375 Q 870 355 800 352 Q 730 355 700 375 Z"
        fill="url(#wineGrad)" opacity="0.82"/>

  <!-- Wine surface shimmer -->
  <ellipse cx="800" cy="375" rx="78" ry="12" fill="#be185d" opacity="0.35"/>
  <ellipse cx="787" cy="373" rx="32" ry="4" fill="#fbbf24" opacity="0.25"/>

  <!-- Glass stem -->
  <rect x="793" y="460" width="14" height="140" rx="7"
        fill="#fef3ec" opacity="0.55"/>

  <!-- Glass base -->
  <ellipse cx="800" cy="608" rx="72" ry="12" fill="#fef3ec" opacity="0.45"/>
  <ellipse cx="800" cy="608" rx="72" ry="12" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Plate left — elegantly set table -->
  <ellipse cx="560" cy="668" rx="130" ry="22" fill="#1a0e0e" opacity="0.6"/>
  <ellipse cx="560" cy="660" rx="130" ry="22" fill="url(#plateGrad)" opacity="0.88"/>
  <ellipse cx="560" cy="658" rx="108" ry="17" fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.55"/>
  <ellipse cx="560" cy="656" rx="72" ry="11" fill="#faf8f2" opacity="0.60"/>

  <!-- Plate right -->
  <ellipse cx="1040" cy="668" rx="130" ry="22" fill="#1a0e0e" opacity="0.6"/>
  <ellipse cx="1040" cy="660" rx="130" ry="22" fill="url(#plateGrad)" opacity="0.88"/>
  <ellipse cx="1040" cy="658" rx="108" ry="17" fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.55"/>
  <ellipse cx="1040" cy="656" rx="72" ry="11" fill="#faf8f2" opacity="0.60"/>

  <!-- Candle accent — left of glass -->
  <rect x="672" y="560" width="10" height="56" rx="5" fill="#fef3ec" opacity="0.70"/>
  <!-- Candle flame -->
  <ellipse cx="677" cy="553" rx="6" ry="10" fill="#fbbf24" opacity="0.90"/>
  <ellipse cx="677" cy="549" rx="3" ry="6" fill="#fef3ec" opacity="0.80"/>

  <!-- Candle accent — right of glass -->
  <rect x="918" y="560" width="10" height="56" rx="5" fill="#fef3ec" opacity="0.70"/>
  <!-- Candle flame -->
  <ellipse cx="923" cy="553" rx="6" ry="10" fill="#fbbf24" opacity="0.90"/>
  <ellipse cx="923" cy="549" rx="3" ry="6" fill="#fef3ec" opacity="0.80"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone, purely atmospheric) -->

  <!-- Table surface suggestion: subtle horizontal band at bottom -->
  <rect x="0" y="820" width="1600" height="80" fill="#2d1208" opacity="0.55"/>
  <rect x="0" y="818" width="1600" height="4" fill="#d97706" opacity="0.22"/>

  <!-- Corner rose glow top-left -->
  <ellipse cx="0" cy="0" rx="320" ry="220" fill="#be185d" opacity="0.07"/>

  <!-- Corner glow top-right -->
  <ellipse cx="1600" cy="0" rx="320" ry="220" fill="#c2410c" opacity="0.08"/>
</svg>
