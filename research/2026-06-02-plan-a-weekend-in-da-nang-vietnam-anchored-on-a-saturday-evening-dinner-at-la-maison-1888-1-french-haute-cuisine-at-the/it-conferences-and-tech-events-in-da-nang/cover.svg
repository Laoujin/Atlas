<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="slide1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="560" ry="360" fill="url(#glow)"/>

  <!-- Layer 2: hero — three stacked angled slide rectangles -->
  <!-- Back slide -->
  <rect x="310" y="210" width="820" height="500" rx="10"
        fill="url(#slide1)" opacity="0.72"
        transform="rotate(-5 720 460)"/>

  <!-- Mid slide -->
  <rect x="340" y="200" width="820" height="500" rx="10"
        fill="url(#slide2)" opacity="0.82"
        transform="rotate(-2 750 450)"/>

  <!-- Front slide (hero) -->
  <rect x="370" y="195" width="820" height="490" rx="10"
        fill="url(#slide3)" opacity="0.93"/>

  <!-- Stage-screen detail: three faint horizontal bars inside front slide (text-line suggestion) -->
  <rect x="430" y="290" width="500" height="18" rx="4" fill="#fef3ec" opacity="0.18"/>
  <rect x="430" y="330" width="360" height="14" rx="4" fill="#fef3ec" opacity="0.13"/>
  <rect x="430" y="364" width="420" height="14" rx="4" fill="#fef3ec" opacity="0.13"/>

  <!-- Divider line below "title" area -->
  <line x1="430" y1="398" x2="1130" y2="398" stroke="#fbbf24" stroke-width="2" opacity="0.35"/>

  <!-- Speaker podium silhouette — triangle below slide center -->
  <polygon points="800,590 730,680 870,680" fill="#78350f" opacity="0.75"/>
  <rect x="765" y="678" width="70" height="16" rx="3" fill="#78350f" opacity="0.75"/>

  <!-- Node-edge network in lower portion of slide: 4 nodes + 5 edges -->
  <line x1="480" y1="560" x2="620" y2="530" stroke="#fbbf24" stroke-width="1.5" opacity="0.28"/>
  <line x1="620" y1="530" x2="730" y2="560" stroke="#fbbf24" stroke-width="1.5" opacity="0.28"/>
  <line x1="730" y1="560" x2="870" y2="530" stroke="#fbbf24" stroke-width="1.5" opacity="0.28"/>
  <line x1="870" y1="530" x2="980" y2="555" stroke="#fbbf24" stroke-width="1.5" opacity="0.28"/>
  <line x1="620" y1="530" x2="870" y2="530" stroke="#fbbf24" stroke-width="1" opacity="0.15"/>

  <circle cx="480" cy="560" r="9" fill="#fbbf24" opacity="0.55"/>
  <circle cx="620" cy="530" r="11" fill="#d97706" opacity="0.65"/>
  <circle cx="730" cy="560" r="9" fill="#fbbf24" opacity="0.55"/>
  <circle cx="870" cy="530" r="13" fill="#c2410c" opacity="0.85"/>
  <circle cx="980" cy="555" r="9" fill="#fbbf24" opacity="0.55"/>

  <!-- Layer 3: corner/edge decoration (outside safe zone, purely atmospheric) -->
  <!-- Bottom-left warm smear -->
  <ellipse cx="120" cy="820" rx="200" ry="120" fill="#c2410c" opacity="0.12"/>
  <!-- Top-right subtle arc -->
  <ellipse cx="1480" cy="80" rx="180" ry="110" fill="#d97706" opacity="0.10"/>
</svg>
