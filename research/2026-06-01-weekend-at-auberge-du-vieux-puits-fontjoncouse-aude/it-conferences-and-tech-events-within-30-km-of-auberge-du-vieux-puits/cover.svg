<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="outDot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant hills (back) -->
  <path d="M0,560 C220,500 380,540 560,520 C760,498 940,560 1140,540 C1320,522 1460,548 1600,530 L1600,900 L0,900 Z" fill="url(#hill3)"/>

  <!-- mid hills -->
  <path d="M0,640 C180,600 340,660 540,640 C720,622 900,680 1080,660 C1260,642 1440,690 1600,670 L1600,900 L0,900 Z" fill="url(#hill2)"/>

  <!-- front hills -->
  <path d="M0,760 C200,720 420,780 640,760 C860,740 1080,800 1300,780 C1420,770 1520,790 1600,780 L1600,900 L0,900 Z" fill="url(#hill1)"/>

  <!-- HERO: radius circle centered at (800, 450), r=300, inside safe zone (y 150-750) -->
  <!-- soft ring glow -->
  <circle cx="800" cy="450" r="330" fill="url(#ringGlow)" opacity="0.7"/>

  <!-- the radius ring itself -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#9a3309" stroke-width="3" stroke-opacity="0.85" stroke-dasharray="10 8"/>
  <circle cx="800" cy="450" r="300" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- center anchor: Auberge du Vieux Puits (Fontjoncouse) -->
  <circle cx="800" cy="450" r="14" fill="#78350f" opacity="0.95"/>
  <circle cx="800" cy="450" r="6" fill="#fbbf24"/>
  <!-- faint cross-hair guides, no text -->
  <line x1="800" y1="430" x2="800" y2="470" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="780" y1="450" x2="820" y2="450" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- one faint node INSIDE the radius (Narbonne, ~23 km NE) -->
  <circle cx="980" cy="320" r="22" fill="#6b7280" opacity="0.15"/>
  <circle cx="980" cy="320" r="6" fill="#9a3309" opacity="0.55"/>
  <line x1="800" y1="450" x2="980" y2="320" stroke="#78350f" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 5"/>

  <!-- BRIGHTER nodes OUTSIDE the radius — the real tech-event cities -->
  <!-- Béziers NE -->
  <circle cx="1230" cy="230" r="42" fill="url(#outDot)" opacity="0.85"/>
  <circle cx="1230" cy="230" r="9" fill="#9a3309"/>
  <!-- Montpellier far NE -->
  <circle cx="1430" cy="160" r="48" fill="url(#outDot)" opacity="0.9"/>
  <circle cx="1430" cy="160" r="10" fill="#9a3309"/>
  <!-- Carcassonne W -->
  <circle cx="350" cy="420" r="40" fill="url(#outDot)" opacity="0.85"/>
  <circle cx="350" cy="420" r="9" fill="#9a3309"/>
  <!-- Perpignan S -->
  <circle cx="700" cy="800" r="44" fill="url(#outDot)" opacity="0.85"/>
  <circle cx="700" cy="800" r="9" fill="#9a3309"/>

  <!-- thin distance lines reaching out beyond the circle -->
  <line x1="800" y1="450" x2="1230" y2="230" stroke="#9a3309" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 6"/>
  <line x1="800" y1="450" x2="1430" y2="160" stroke="#9a3309" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2 6"/>
  <line x1="800" y1="450" x2="350" y2="420" stroke="#9a3309" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 6"/>
  <line x1="800" y1="450" x2="700" y2="800" stroke="#9a3309" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 6"/>
</svg>
