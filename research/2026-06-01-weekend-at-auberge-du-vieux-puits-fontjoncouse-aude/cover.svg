<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#fef3ec" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Mediterranean sun haze -->
  <circle cx="1150" cy="380" r="280" fill="url(#sun)"/>

  <!-- Distant Mediterranean horizon sliver -->
  <rect x="0" y="455" width="1600" height="18" fill="url(#sea)"/>

  <!-- Far ridge -->
  <path d="M 0 510 L 180 470 L 360 495 L 540 460 L 760 485 L 980 455 L 1240 480 L 1440 465 L 1600 490 L 1600 560 L 0 560 Z" fill="url(#far)" opacity="0.75"/>

  <!-- Mid ridge with castle hero -->
  <path d="M 0 620 L 220 580 L 420 600 L 600 555 L 720 540 L 820 545 L 920 555 L 1080 600 L 1280 585 L 1460 610 L 1600 595 L 1600 700 L 0 700 Z" fill="url(#mid)" opacity="0.9"/>

  <!-- Cathar castle silhouette on ridge (hero, centered ~800,500) -->
  <g fill="#1a0e0e" opacity="0.88">
    <!-- main keep / curtain wall base -->
    <path d="M 700 560 L 700 500 L 720 500 L 720 485 L 740 485 L 740 500 L 770 500 L 770 470 L 790 470 L 790 440 L 810 440 L 810 470 L 830 470 L 830 500 L 860 500 L 860 485 L 880 485 L 880 500 L 900 500 L 900 560 Z"/>
    <!-- secondary tower right -->
    <path d="M 900 560 L 900 520 L 920 520 L 920 505 L 940 505 L 940 520 L 955 520 L 955 560 Z"/>
    <!-- watchtower left -->
    <path d="M 660 560 L 660 510 L 678 510 L 678 495 L 695 495 L 695 510 L 700 510 L 700 560 Z"/>
    <!-- crenellation notches (subtractive look via small rects in bg color) -->
  </g>
  <g fill="#c2410c" opacity="0.9">
    <rect x="775" y="468" width="6" height="6"/>
    <rect x="795" y="468" width="6" height="6"/>
    <rect x="725" y="498" width="5" height="5"/>
    <rect x="755" y="498" width="5" height="5"/>
    <rect x="845" y="498" width="5" height="5"/>
    <rect x="865" y="498" width="5" height="5"/>
  </g>

  <!-- Stone village clustered at castle base -->
  <g fill="#78350f" opacity="0.85">
    <rect x="630" y="595" width="28" height="35"/>
    <path d="M 630 595 L 644 583 L 658 595 Z" fill="#5c2a1a"/>
    <rect x="940" y="600" width="32" height="30"/>
    <path d="M 940 600 L 956 588 L 972 600 Z" fill="#5c2a1a"/>
    <rect x="975" y="608" width="22" height="22"/>
    <path d="M 975 608 L 986 599 L 997 608 Z" fill="#5c2a1a"/>
  </g>

  <!-- Near hill with vineyard rows -->
  <path d="M 0 760 L 200 720 L 420 740 L 680 710 L 920 725 L 1180 705 L 1400 730 L 1600 715 L 1600 900 L 0 900 Z" fill="url(#near)"/>

  <!-- Vineyard row stripes (faint) -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.22" fill="none">
    <path d="M 0 790 Q 400 760 800 770 T 1600 760"/>
    <path d="M 0 815 Q 400 788 800 798 T 1600 790"/>
    <path d="M 0 840 Q 400 815 800 825 T 1600 818"/>
    <path d="M 0 865 Q 400 842 800 852 T 1600 845"/>
  </g>
  <g stroke="#fbbf24" stroke-width="2" opacity="0.18" fill="none">
    <path d="M 0 790 L 0 900"/>
    <path d="M 160 783 L 160 900"/>
    <path d="M 320 776 L 320 900"/>
    <path d="M 480 770 L 480 900"/>
    <path d="M 640 764 L 640 900"/>
    <path d="M 800 770 L 800 900"/>
    <path d="M 960 766 L 960 900"/>
    <path d="M 1120 760 L 1120 900"/>
    <path d="M 1280 765 L 1280 900"/>
    <path d="M 1440 762 L 1440 900"/>
  </g>

  <!-- Cypress accent (Mediterranean signal) -->
  <ellipse cx="1090" cy="700" rx="10" ry="35" fill="#1a0e0e" opacity="0.7"/>
  <ellipse cx="510" cy="710" rx="8" ry="28" fill="#1a0e0e" opacity="0.65"/>
</svg>
