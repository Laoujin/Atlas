<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="0.85" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="village" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <radialGradient id="wellGlow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="stoneShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Sun haze -->
  <ellipse cx="800" cy="520" rx="650" ry="280" fill="url(#sun)"/>

  <!-- Far hills (garrigue ridge) -->
  <path d="M0,560 L120,500 L260,540 L400,470 L560,520 L720,460 L880,510 L1040,450 L1200,500 L1360,470 L1500,510 L1600,490 L1600,900 L0,900 Z" fill="url(#hillFar)" opacity="0.75"/>

  <!-- Mid village cluster on a rise -->
  <path d="M380,640 L520,580 L700,560 L900,555 L1100,575 L1240,620 L1240,760 L380,760 Z" fill="url(#village)" opacity="0.9"/>
  <!-- Village rooftops as a few angled rectangles -->
  <g opacity="0.95">
    <rect x="540" y="570" width="70" height="80" fill="#3a1a10"/>
    <polygon points="535,575 615,575 575,545" fill="#1a0e0e"/>
    <rect x="630" y="555" width="85" height="95" fill="#2a1208"/>
    <polygon points="625,560 720,560 672,525" fill="#1a0e0e"/>
    <rect x="740" y="560" width="60" height="90" fill="#3a1a10"/>
    <polygon points="735,565 805,565 770,535" fill="#1a0e0e"/>
    <rect x="820" y="555" width="95" height="95" fill="#2a1208"/>
    <polygon points="815,560 920,560 867,525" fill="#1a0e0e"/>
    <rect x="940" y="565" width="70" height="85" fill="#3a1a10"/>
    <polygon points="935,570 1015,570 975,540" fill="#1a0e0e"/>
    <rect x="1030" y="575" width="80" height="80" fill="#2a1208"/>
    <polygon points="1025,580 1115,580 1070,548" fill="#1a0e0e"/>
    <!-- A few warm lit windows -->
    <rect x="560" y="605" width="10" height="14" fill="#fbbf24" opacity="0.9"/>
    <rect x="660" y="600" width="11" height="15" fill="#fbbf24" opacity="0.85"/>
    <rect x="850" y="600" width="12" height="16" fill="#fbbf24" opacity="0.95"/>
    <rect x="880" y="600" width="12" height="16" fill="#fbbf24" opacity="0.7"/>
    <rect x="960" y="610" width="10" height="14" fill="#fbbf24" opacity="0.8"/>
    <rect x="1060" y="612" width="11" height="14" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Near hill / vineyard ground -->
  <path d="M0,720 L300,690 L600,730 L1000,705 L1300,735 L1600,710 L1600,900 L0,900 Z" fill="url(#hillNear)"/>

  <!-- Vineyard row hints -->
  <g stroke="#3a1a10" stroke-width="2" opacity="0.5" fill="none">
    <path d="M50,790 Q400,775 800,795 T1550,790"/>
    <path d="M30,830 Q400,815 800,835 T1570,830"/>
    <path d="M20,870 Q400,855 800,875 T1580,870"/>
  </g>

  <!-- Hero: stone well centred at ~(800, 560), within safe zone -->
  <!-- Glow halo behind well -->
  <ellipse cx="800" cy="600" rx="280" ry="180" fill="url(#wellGlow)"/>

  <!-- Well body: cylindrical stone curb -->
  <g>
    <!-- Base shadow on ground -->
    <ellipse cx="800" cy="790" rx="190" ry="22" fill="#000" opacity="0.5"/>
    <!-- Well drum -->
    <path d="M650,640 Q650,610 800,610 Q950,610 950,640 L950,780 Q950,810 800,810 Q650,810 650,780 Z" fill="url(#stone)"/>
    <!-- Drum side shade -->
    <path d="M650,640 Q650,610 800,610 Q950,610 950,640 L950,780 Q950,810 800,810 Q650,810 650,780 Z" fill="url(#stoneShade)" opacity="0.7"/>
    <!-- Top rim ellipse -->
    <ellipse cx="800" cy="640" rx="150" ry="30" fill="#c2410c"/>
    <ellipse cx="800" cy="640" rx="150" ry="30" fill="url(#stoneShade)" opacity="0.4"/>
    <!-- Dark water opening -->
    <ellipse cx="800" cy="642" rx="125" ry="22" fill="#1a0e0e"/>
    <ellipse cx="800" cy="640" rx="125" ry="22" fill="#0a0505"/>
    <!-- Faint water shimmer -->
    <ellipse cx="780" cy="643" rx="40" ry="3" fill="#9a3309" opacity="0.4"/>

    <!-- Stone courses (horizontal seams) -->
    <path d="M655,690 Q800,705 945,690" stroke="#1a0e0e" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M652,740 Q800,755 948,740" stroke="#1a0e0e" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Vertical stone joints -->
    <g stroke="#1a0e0e" stroke-width="1.2" opacity="0.45" fill="none">
      <path d="M700,672 L700,700"/>
      <path d="M760,668 L760,696"/>
      <path d="M840,668 L840,696"/>
      <path d="M900,672 L900,700"/>
      <path d="M680,720 L680,748"/>
      <path d="M740,716 L740,744"/>
      <path d="M800,714 L800,742"/>
      <path d="M860,716 L860,744"/>
      <path d="M920,720 L920,748"/>
      <path d="M710,770 L710,798"/>
      <path d="M790,768 L790,796"/>
      <path d="M870,770 L870,798"/>
    </g>

    <!-- Wrought-iron arch over the well (two posts + curved bar) -->
    <rect x="654" y="500" width="10" height="145" fill="#1a0e0e"/>
    <rect x="936" y="500" width="10" height="145" fill="#1a0e0e"/>
    <path d="M654,510 Q800,420 946,510" stroke="#1a0e0e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Small pulley wheel -->
    <circle cx="800" cy="478" r="14" fill="#3a1a10"/>
    <circle cx="800" cy="478" r="14" fill="none" stroke="#1a0e0e" stroke-width="2"/>
    <circle cx="800" cy="478" r="4" fill="#1a0e0e"/>
    <!-- Rope hanging down into the well -->
    <path d="M800,492 L800,640" stroke="#78350f" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- A couple of garrigue tufts at the well's foot -->
  <g fill="#1a0e0e" opacity="0.7">
    <path d="M610,800 Q620,780 632,800 Q625,790 615,795 Z"/>
    <path d="M960,805 Q972,782 985,805 Q978,792 968,798 Z"/>
  </g>
</svg>
