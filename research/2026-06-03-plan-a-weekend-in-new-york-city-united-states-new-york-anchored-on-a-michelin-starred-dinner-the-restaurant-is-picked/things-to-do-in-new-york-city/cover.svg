<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="towerDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1a0e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="560" r="420" fill="url(#sun)"/>

  <!-- skyline hero, centered ~ (800,450), within safe zone -->
  <g opacity="0.95">
    <rect x="300" y="430" width="90" height="380" fill="url(#towerDark)"/>
    <rect x="410" y="330" width="110" height="480" fill="url(#tower)"/>
    <rect x="540" y="470" width="80" height="340" fill="url(#towerDark)"/>
    <rect x="700" y="200" width="120" height="610" fill="url(#tower)"/>
    <polygon points="700,200 760,120 820,200" fill="#fbbf24" opacity="0.9"/>
    <rect x="752" y="60" width="16" height="70" fill="#fbbf24" opacity="0.85"/>
    <rect x="840" y="360" width="100" height="450" fill="url(#towerDark)"/>
    <rect x="960" y="280" width="120" height="530" fill="url(#tower)"/>
    <polygon points="960,280 1020,210 1080,280" fill="#d97706" opacity="0.85"/>
    <rect x="1100" y="450" width="90" height="360" fill="url(#towerDark)"/>
    <rect x="1210" y="400" width="80" height="410" fill="url(#tower)" opacity="0.8"/>
  </g>

  <!-- lit windows, decorative -->
  <g fill="#fef3ec" opacity="0.6">
    <rect x="445" y="370" width="14" height="20"/>
    <rect x="480" y="420" width="14" height="20"/>
    <rect x="730" y="260" width="16" height="24"/>
    <rect x="775" y="340" width="16" height="24"/>
    <rect x="730" y="430" width="16" height="24"/>
    <rect x="995" y="340" width="14" height="22"/>
    <rect x="1035" y="420" width="14" height="22"/>
  </g>
</svg>
