<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1a2e"/>
      <stop offset="60%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#0f0a0a"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Outer ambient glow centered -->
  <ellipse cx="800" cy="450" rx="600" ry="420" fill="url(#outerGlow)"/>

  <!-- Layer 2: Hero element — node-and-orbit graph centered at (800, 450) -->

  <!-- Orbit rings -->
  <circle cx="800" cy="450" r="240" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="800" cy="450" r="340" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Hub glow -->
  <circle cx="800" cy="450" r="120" fill="url(#hubGlow)" opacity="0.7"/>

  <!-- Edge lines from hub to outer nodes -->
  <!-- Node at ~30deg -->
  <line x1="800" y1="450" x2="1040" y2="330" stroke="url(#edgeGrad)" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Node at ~150deg -->
  <line x1="800" y1="450" x2="560" y2="330" stroke="url(#edgeGrad)" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Node at ~270deg -->
  <line x1="800" y1="450" x2="800" y2="695" stroke="#c2410c" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Node at ~60deg -->
  <line x1="800" y1="450" x2="1000" y2="555" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Node at ~200deg -->
  <line x1="800" y1="450" x2="600" y2="555" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Inner ring nodes (on 240r orbit) -->
  <!-- ~30deg: (800+240*cos30, 450-240*sin30) = (1008, 330) approx -->
  <circle cx="1008" cy="322" r="18" fill="#d97706" opacity="0.85"/>
  <circle cx="1008" cy="322" r="30" fill="#d97706" opacity="0.15"/>
  <!-- ~150deg: (800-208, 450-120) -->
  <circle cx="592" cy="322" r="18" fill="#d97706" opacity="0.85"/>
  <circle cx="592" cy="322" r="30" fill="#d97706" opacity="0.15"/>
  <!-- ~270deg: (800, 450+240) -->
  <circle cx="800" cy="690" r="16" fill="#fbbf24" opacity="0.75"/>
  <circle cx="800" cy="690" r="28" fill="#fbbf24" opacity="0.12"/>
  <!-- ~60deg -->
  <circle cx="1008" cy="578" r="14" fill="#c2410c" opacity="0.8"/>
  <circle cx="1008" cy="578" r="24" fill="#c2410c" opacity="0.12"/>
  <!-- ~200deg -->
  <circle cx="592" cy="578" r="14" fill="#c2410c" opacity="0.8"/>
  <circle cx="592" cy="578" r="24" fill="#c2410c" opacity="0.12"/>

  <!-- Outer ring nodes (on 340r orbit) -->
  <!-- cross-connect violet nodes at larger orbit -->
  <circle cx="1100" cy="230" r="12" fill="#6d28d9" opacity="0.75"/>
  <circle cx="1100" cy="230" r="22" fill="#6d28d9" opacity="0.12"/>
  <circle cx="500" cy="230" r="12" fill="#6d28d9" opacity="0.75"/>
  <circle cx="500" cy="230" r="22" fill="#6d28d9" opacity="0.12"/>
  <circle cx="1120" cy="650" r="10" fill="#6d28d9" opacity="0.65"/>
  <circle cx="1120" cy="650" r="20" fill="#6d28d9" opacity="0.1"/>
  <circle cx="480" cy="650" r="10" fill="#6d28d9" opacity="0.65"/>
  <circle cx="480" cy="650" r="20" fill="#6d28d9" opacity="0.1"/>

  <!-- Violet edge lines to outer ring -->
  <line x1="1008" y1="322" x2="1100" y2="230" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="592" y1="322" x2="500" y2="230" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="1008" y1="578" x2="1120" y2="650" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="592" y1="578" x2="480" y2="650" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Hub core -->
  <circle cx="800" cy="450" r="52" fill="#9a3309" opacity="0.9"/>
  <circle cx="800" cy="450" r="38" fill="#c2410c" opacity="0.95"/>
  <circle cx="800" cy="450" r="22" fill="#d97706" opacity="1"/>

  <!-- Layer 3: Edge decoration — city grid suggestion at bottom, very faint -->
  <rect x="0" y="820" width="1600" height="80" fill="#78350f" opacity="0.08"/>
  <!-- Faint vertical city-block lines -->
  <line x1="200" y1="820" x2="200" y2="900" stroke="#d97706" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="400" y1="820" x2="400" y2="900" stroke="#d97706" stroke-width="1" stroke-opacity="0.10"/>
  <line x1="600" y1="820" x2="600" y2="900" stroke="#d97706" stroke-width="1" stroke-opacity="0.10"/>
  <line x1="800" y1="820" x2="800" y2="900" stroke="#d97706" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="1000" y1="820" x2="1000" y2="900" stroke="#d97706" stroke-width="1" stroke-opacity="0.10"/>
  <line x1="1200" y1="820" x2="1200" y2="900" stroke="#d97706" stroke-width="1" stroke-opacity="0.10"/>
  <line x1="1400" y1="820" x2="1400" y2="900" stroke="#d97706" stroke-width="1" stroke-opacity="0.12"/>
</svg>
