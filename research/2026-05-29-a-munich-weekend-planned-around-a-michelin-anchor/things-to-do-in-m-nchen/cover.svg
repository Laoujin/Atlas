<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="stein" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm evening glow behind hero -->
  <circle cx="800" cy="470" r="520" fill="url(#glow)"/>

  <!-- twin onion-domed towers (Frauenkirche silhouette) behind hero -->
  <g opacity="0.85">
    <!-- left tower -->
    <rect x="430" y="280" width="120" height="430" fill="url(#tower)"/>
    <path d="M 430 280 Q 430 220 490 200 Q 550 220 550 280 Z" fill="#78350f" opacity="0.55"/>
    <ellipse cx="490" cy="220" rx="62" ry="38" fill="#78350f" opacity="0.6"/>
    <path d="M 480 195 L 490 165 L 500 195 Z" fill="#78350f" opacity="0.6"/>
    <!-- right tower -->
    <rect x="1050" y="280" width="120" height="430" fill="url(#tower)"/>
    <path d="M 1050 280 Q 1050 220 1110 200 Q 1170 220 1170 280 Z" fill="#78350f" opacity="0.55"/>
    <ellipse cx="1110" cy="220" rx="62" ry="38" fill="#78350f" opacity="0.6"/>
    <path d="M 1100 195 L 1110 165 L 1120 195 Z" fill="#78350f" opacity="0.6"/>
  </g>

  <!-- hero: beer stein, centered around (800, 470) -->
  <g>
    <!-- handle -->
    <path d="M 1010 380 Q 1110 380 1110 470 Q 1110 560 1010 560 L 1010 530 Q 1070 530 1070 470 Q 1070 410 1010 410 Z" fill="#9a3309" opacity="0.9"/>
    <!-- body of stein -->
    <rect x="600" y="340" width="420" height="370" rx="14" fill="url(#stein)" opacity="0.92"/>
    <!-- vertical highlight -->
    <rect x="625" y="360" width="30" height="330" rx="10" fill="#fbbf24" opacity="0.35"/>
    <!-- base shadow band -->
    <rect x="600" y="680" width="420" height="30" rx="6" fill="#78350f" opacity="0.6"/>
    <!-- foam dome -->
    <path d="M 590 360 Q 600 290 680 280 Q 740 240 810 270 Q 880 240 950 280 Q 1020 290 1030 360 Q 1030 380 1010 380 L 610 380 Q 590 380 590 360 Z" fill="url(#foam)" opacity="0.95"/>
    <!-- foam bubbles -->
    <circle cx="700" cy="305" r="14" fill="#faf8f2" opacity="0.8"/>
    <circle cx="850" cy="290" r="10" fill="#faf8f2" opacity="0.7"/>
    <circle cx="920" cy="315" r="8" fill="#faf8f2" opacity="0.7"/>
    <!-- stein lid hinge -->
    <rect x="980" y="270" width="40" height="14" rx="3" fill="#78350f" opacity="0.85"/>
  </g>

  <!-- subtle ground line -->
  <rect x="0" y="780" width="1600" height="120" fill="#1a0e0e" opacity="0.5"/>
</svg>
