<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="heroTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="block2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="block3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9a3309" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft radial warmth -->
  <circle cx="800" cy="450" r="520" fill="#fbbf24" opacity="0.12"/>

  <!-- Timeline running through composition -->
  <rect x="180" y="610" width="1240" height="3" fill="url(#timeline)"/>
  <circle cx="380" cy="611" r="6" fill="#9a3309" opacity="0.55"/>
  <circle cx="640" cy="611" r="6" fill="#9a3309" opacity="0.55"/>
  <circle cx="960" cy="611" r="6" fill="#9a3309" opacity="0.55"/>
  <circle cx="1220" cy="611" r="6" fill="#9a3309" opacity="0.55"/>

  <!-- Back block (isometric chassis, far) -->
  <g opacity="0.85">
    <polygon points="540,520 820,460 820,700 540,760" fill="url(#block3)"/>
    <polygon points="540,520 700,470 700,710 540,760" fill="#5c2a1a" opacity="0.3"/>
    <polygon points="540,520 820,460 880,490 600,550" fill="#78350f" opacity="0.6"/>
  </g>

  <!-- Middle block -->
  <g opacity="0.92">
    <polygon points="820,490 1100,430 1100,670 820,730" fill="url(#block2)"/>
    <polygon points="820,490 1100,430 1160,460 880,520" fill="#c2410c" opacity="0.75"/>
    <!-- subtle session bars -->
    <rect x="860" y="560" width="180" height="6" fill="#fbbf24" opacity="0.35" transform="rotate(-12 950 563)"/>
    <rect x="860" y="590" width="140" height="6" fill="#fbbf24" opacity="0.3" transform="rotate(-12 930 593)"/>
    <rect x="860" y="620" width="200" height="6" fill="#fbbf24" opacity="0.25" transform="rotate(-12 960 623)"/>
  </g>

  <!-- Hero block (front, rust glow) -->
  <g>
    <polygon points="640,380 980,310 980,600 640,670" fill="url(#hero)"/>
    <polygon points="640,380 980,310 1050,345 710,415" fill="url(#heroTop)"/>
    <polygon points="980,310 980,600 1050,565 1050,345" fill="#78350f" opacity="0.7"/>
    <!-- LED accent on hero -->
    <circle cx="945" cy="350" r="9" fill="#fbbf24"/>
    <circle cx="945" cy="350" r="16" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- Faint scaffold marks (corners, decorative) -->
  <rect x="160" y="160" width="40" height="2" fill="#9a3309" opacity="0.35"/>
  <rect x="160" y="160" width="2" height="40" fill="#9a3309" opacity="0.35"/>
  <rect x="1400" y="160" width="40" height="2" fill="#9a3309" opacity="0.35"/>
  <rect x="1438" y="160" width="2" height="40" fill="#9a3309" opacity="0.35"/>
  <rect x="160" y="738" width="40" height="2" fill="#9a3309" opacity="0.35"/>
  <rect x="160" y="700" width="2" height="40" fill="#9a3309" opacity="0.35"/>
  <rect x="1400" y="738" width="40" height="2" fill="#9a3309" opacity="0.35"/>
  <rect x="1438" y="700" width="2" height="40" fill="#9a3309" opacity="0.35"/>
</svg>
