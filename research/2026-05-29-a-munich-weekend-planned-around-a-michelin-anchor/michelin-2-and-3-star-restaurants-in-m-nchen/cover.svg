<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2a1410" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d9c9a8" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8d8b8" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="rustDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="roseDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed warm dark background -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Frauenkirche twin-tower silhouette, far horizon, low opacity (decoration outside safe zone center) -->
  <g opacity="0.18" fill="#1a0e0e">
    <rect x="120" y="640" width="55" height="180"/>
    <rect x="220" y="640" width="55" height="180"/>
    <ellipse cx="147" cy="635" rx="32" ry="22"/>
    <ellipse cx="247" cy="635" rx="32" ry="22"/>
    <rect x="170" y="700" width="80" height="120"/>
    <rect x="1340" y="660" width="40" height="160"/>
    <rect x="1410" y="660" width="40" height="160"/>
    <ellipse cx="1360" cy="655" rx="24" ry="16"/>
    <ellipse cx="1430" cy="655" rx="24" ry="16"/>
  </g>

  <!-- Hero: tasting plate centered at (800, 450) -->
  <!-- Outer plate rim -->
  <circle cx="800" cy="450" r="320" fill="url(#plate)" opacity="0.92"/>
  <!-- Inner plate well -->
  <circle cx="800" cy="450" r="240" fill="url(#inner)" opacity="0.85"/>
  <!-- Subtle rim highlight ring -->
  <circle cx="800" cy="450" r="305" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.35"/>
  <circle cx="800" cy="450" r="245" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.25"/>

  <!-- Plated composition: three abstracted course elements -->
  <!-- Rust quenelle / main element -->
  <ellipse cx="760" cy="445" rx="95" ry="55" fill="url(#rustDrop)" opacity="0.92" transform="rotate(-18 760 445)"/>
  <ellipse cx="755" cy="430" rx="70" ry="30" fill="#fbbf24" opacity="0.55" transform="rotate(-18 755 430)"/>

  <!-- Rose accent garnish -->
  <ellipse cx="870" cy="490" rx="55" ry="30" fill="url(#roseDrop)" opacity="0.88" transform="rotate(25 870 490)"/>

  <!-- Smear / sauce stroke -->
  <path d="M 620 460 Q 700 420 800 440 Q 880 455 920 430" fill="none" stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.55"/>

  <!-- Three Michelin star markers around plate (stars as abstract glowing dots, not text) -->
  <circle cx="800" cy="180" r="22" fill="url(#starGlow)" opacity="0.95"/>
  <circle cx="800" cy="180" r="10" fill="#fef3ec" opacity="0.9"/>
  <circle cx="640" cy="220" r="18" fill="url(#starGlow)" opacity="0.85"/>
  <circle cx="640" cy="220" r="7" fill="#fef3ec" opacity="0.85"/>
  <circle cx="960" cy="220" r="18" fill="url(#starGlow)" opacity="0.85"/>
  <circle cx="960" cy="220" r="7" fill="#fef3ec" opacity="0.85"/>

  <!-- Soft ambient glow over plate center -->
  <circle cx="800" cy="430" r="180" fill="#fbbf24" opacity="0.06"/>
</svg>
