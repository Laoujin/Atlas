<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="church" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed warm dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow behind church -->
  <circle cx="800" cy="560" r="340" fill="url(#sun)" opacity="0.85"/>

  <!-- distant Alps silhouette (background, may crop on detail view — that's fine) -->
  <path d="M 0 640 L 150 540 L 260 600 L 380 470 L 500 580 L 620 510 L 760 600 L 880 500 L 1010 590 L 1140 490 L 1280 580 L 1420 520 L 1600 600 L 1600 900 L 0 900 Z"
        fill="url(#alps)" opacity="0.75"/>

  <!-- mid-ground hills -->
  <path d="M 0 720 L 180 670 L 360 710 L 540 660 L 720 705 L 900 665 L 1080 710 L 1260 670 L 1440 705 L 1600 685 L 1600 900 L 0 900 Z"
        fill="#5c2a1a" opacity="0.65"/>

  <!-- Frauenkirche hero: twin towers with onion domes, centered at ~(800, 450) -->
  <!-- left tower -->
  <rect x="660" y="350" width="120" height="380" fill="url(#church)"/>
  <!-- right tower -->
  <rect x="820" y="350" width="120" height="380" fill="url(#church)"/>

  <!-- onion dome left -->
  <path d="M 660 350
           Q 660 280 720 270
           Q 780 280 780 350 Z"
        fill="#c2410c"/>
  <path d="M 685 270
           Q 685 240 720 235
           Q 755 240 755 270 Z"
        fill="#9a3309"/>
  <line x1="720" y1="235" x2="720" y2="210" stroke="#78350f" stroke-width="4"/>
  <circle cx="720" cy="208" r="6" fill="#fbbf24"/>

  <!-- onion dome right -->
  <path d="M 820 350
           Q 820 280 880 270
           Q 940 280 940 350 Z"
        fill="#c2410c"/>
  <path d="M 845 270
           Q 845 240 880 235
           Q 915 240 915 270 Z"
        fill="#9a3309"/>
  <line x1="880" y1="235" x2="880" y2="210" stroke="#78350f" stroke-width="4"/>
  <circle cx="880" cy="208" r="6" fill="#fbbf24"/>

  <!-- low nave between towers -->
  <rect x="780" y="500" width="40" height="230" fill="#78350f" opacity="0.9"/>

  <!-- window slits suggesting tower details (decoration, earns its place) -->
  <rect x="695" y="450" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>
  <rect x="725" y="450" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>
  <rect x="855" y="450" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>
  <rect x="885" y="450" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>

  <rect x="695" y="560" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>
  <rect x="725" y="560" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>
  <rect x="855" y="560" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>
  <rect x="885" y="560" width="20" height="40" fill="#1a0e0e" opacity="0.55"/>

  <!-- Michelin star floating above, between towers — the fine-dining anchor -->
  <circle cx="800" cy="180" r="55" fill="url(#starGlow)"/>
  <path d="M 800 140
           L 811 170
           L 843 170
           L 817 189
           L 827 220
           L 800 201
           L 773 220
           L 783 189
           L 757 170
           L 789 170 Z"
        fill="#fbbf24" opacity="0.95"/>

  <!-- foreground ground line -->
  <rect x="0" y="730" width="1600" height="170" fill="#1a0e0e" opacity="0.7"/>
</svg>
