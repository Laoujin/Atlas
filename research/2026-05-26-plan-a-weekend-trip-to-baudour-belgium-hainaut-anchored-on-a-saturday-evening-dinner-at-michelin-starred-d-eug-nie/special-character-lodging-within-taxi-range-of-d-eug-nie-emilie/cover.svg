<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chapel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="townhouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant townhouse row (decoration, partly croppable) -->
  <g opacity="0.7">
    <polygon points="180,720 260,640 340,720" fill="url(#townhouse)"/>
    <rect x="200" y="720" width="120" height="100" fill="#78350f" opacity="0.7"/>
    <polygon points="1280,720 1360,640 1440,720" fill="url(#townhouse)"/>
    <rect x="1300" y="720" width="120" height="100" fill="#78350f" opacity="0.7"/>
    <polygon points="1410,720 1490,640 1570,720" fill="url(#townhouse)"/>
    <rect x="1430" y="720" width="120" height="100" fill="#78350f" opacity="0.6"/>
  </g>

  <!-- Hero: neo-Gothic chapel facade silhouette, centered ~ (800, 450) -->
  <g>
    <!-- Chapel body -->
    <rect x="560" y="380" width="480" height="380" fill="url(#chapel)"/>

    <!-- Pointed gable roof -->
    <polygon points="560,380 800,180 1040,380" fill="#5c2a1a"/>

    <!-- Side wings (lower) -->
    <rect x="430" y="500" width="130" height="260" fill="#78350f" opacity="0.92"/>
    <polygon points="430,500 495,420 560,500" fill="#5c2a1a" opacity="0.92"/>
    <rect x="1040" y="500" width="130" height="260" fill="#78350f" opacity="0.92"/>
    <polygon points="1040,500 1105,420 1170,500" fill="#5c2a1a" opacity="0.92"/>

    <!-- Central pointed-arch window (the glowing one) -->
    <path d="M 720 580 L 720 470 Q 720 400 800 400 Q 880 400 880 470 L 880 580 Z" fill="url(#window)"/>
    <!-- Window mullion -->
    <line x1="800" y1="400" x2="800" y2="580" stroke="#5c2a1a" stroke-width="6" opacity="0.85"/>
    <line x1="720" y1="500" x2="880" y2="500" stroke="#5c2a1a" stroke-width="5" opacity="0.85"/>

    <!-- Smaller side arched windows -->
    <path d="M 470 660 L 470 600 Q 470 565 495 565 Q 520 565 520 600 L 520 660 Z" fill="url(#window)" opacity="0.85"/>
    <path d="M 1080 660 L 1080 600 Q 1080 565 1105 565 Q 1130 565 1130 600 L 1130 660 Z" fill="url(#window)" opacity="0.85"/>

    <!-- Oculus / rose window above main arch -->
    <circle cx="800" cy="310" r="38" fill="url(#window)" opacity="0.9"/>
    <circle cx="800" cy="310" r="38" fill="none" stroke="#5c2a1a" stroke-width="4"/>

    <!-- Cross-trefoil hint inside oculus -->
    <line x1="800" y1="272" x2="800" y2="348" stroke="#5c2a1a" stroke-width="3" opacity="0.7"/>
    <line x1="762" y1="310" x2="838" y2="310" stroke="#5c2a1a" stroke-width="3" opacity="0.7"/>

    <!-- Base ground line / courtyard shadow -->
    <rect x="380" y="760" width="840" height="6" fill="#5c2a1a" opacity="0.6"/>
  </g>

  <!-- Foreground courtyard wash -->
  <rect x="0" y="760" width="1600" height="140" fill="#5c2a1a" opacity="0.35"/>
</svg>
