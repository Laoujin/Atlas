<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow (hero anchor, upper right of safe zone) -->
  <circle cx="1080" cy="360" r="260" fill="url(#sun)"/>
  <circle cx="1080" cy="360" r="95" fill="#fbbf24" opacity="0.92"/>

  <!-- back hills (rolling RAVeL countryside) -->
  <path d="M 0 620 Q 280 520 560 580 T 1120 560 T 1600 600 L 1600 900 L 0 900 Z" fill="url(#hillBack)"/>

  <!-- belfry hero silhouette, centered near (760, 480), within safe zone -->
  <g opacity="0.95">
    <!-- base -->
    <rect x="710" y="500" width="100" height="240" fill="url(#tower)"/>
    <!-- mid taper -->
    <polygon points="700,500 820,500 810,460 710,460" fill="#5c2a1a"/>
    <!-- upper shaft -->
    <rect x="725" y="380" width="70" height="80" fill="#78350f"/>
    <!-- belfry crown -->
    <polygon points="720,380 800,380 790,340 730,340" fill="#5c2a1a"/>
    <!-- spire -->
    <polygon points="730,340 790,340 760,250" fill="#9a3309"/>
    <!-- finial -->
    <circle cx="760" cy="240" r="8" fill="#fbbf24"/>
    <!-- arched windows -->
    <rect x="745" y="400" width="10" height="28" rx="5" fill="#1a0e0e" opacity="0.7"/>
    <rect x="765" y="400" width="10" height="28" rx="5" fill="#1a0e0e" opacity="0.7"/>
    <rect x="735" y="560" width="14" height="40" rx="7" fill="#1a0e0e" opacity="0.6"/>
    <rect x="770" y="560" width="14" height="40" rx="7" fill="#1a0e0e" opacity="0.6"/>
  </g>

  <!-- front hill ridge -->
  <path d="M 0 720 Q 200 660 420 700 Q 640 740 880 710 Q 1140 680 1380 720 Q 1500 740 1600 720 L 1600 900 L 0 900 Z" fill="url(#hillFront)"/>

  <!-- winding path (RAVeL cycle line) -->
  <path d="M 740 900 Q 780 820 820 770 Q 880 720 940 740 Q 1020 760 1080 730" stroke="#fbbf24" stroke-width="6" fill="none" opacity="0.75" stroke-linecap="round"/>
  <path d="M 740 900 Q 780 820 820 770 Q 880 720 940 740 Q 1020 760 1080 730" stroke="#faf8f2" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="8 10" stroke-linecap="round"/>

  <!-- two small distant tree/dome dots suggesting Pairi Daiza domes & countryside -->
  <circle cx="380" cy="650" r="22" fill="#78350f" opacity="0.8"/>
  <circle cx="430" cy="660" r="16" fill="#9a3309" opacity="0.75"/>
  <circle cx="1320" cy="690" r="18" fill="#78350f" opacity="0.75"/>
</svg>
