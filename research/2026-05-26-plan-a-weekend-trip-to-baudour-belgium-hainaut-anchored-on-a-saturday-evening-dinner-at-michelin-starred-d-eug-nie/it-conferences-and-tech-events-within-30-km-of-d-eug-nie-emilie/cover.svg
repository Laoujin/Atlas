<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft halo behind the radius -->
  <circle cx="800" cy="450" r="360" fill="url(#halo)"/>

  <!-- 30km radius rings (concentric, dashed/solid mix) -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.75" stroke-dasharray="10 8"/>
  <circle cx="800" cy="450" r="250" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="4 6"/>
  <circle cx="800" cy="450" r="160" fill="none" stroke="#78350f" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3 5"/>

  <!-- network edges from the center pin to surrounding venue nodes -->
  <g stroke="#9a3309" stroke-width="1.6" stroke-opacity="0.55">
    <line x1="800" y1="450" x2="580" y2="300"/>
    <line x1="800" y1="450" x2="1020" y2="290"/>
    <line x1="800" y1="450" x2="1080" y2="560"/>
    <line x1="800" y1="450" x2="600" y2="610"/>
    <line x1="800" y1="450" x2="500" y2="470"/>
    <line x1="800" y1="450" x2="1100" y2="430"/>
    <line x1="800" y1="450" x2="870" y2="240"/>
    <line x1="800" y1="450" x2="740" y2="680"/>
  </g>

  <!-- venue nodes (tech-event markers around the radius) -->
  <g>
    <circle cx="580" cy="300" r="14" fill="url(#node)" opacity="0.9"/>
    <circle cx="1020" cy="290" r="11" fill="url(#node)" opacity="0.9"/>
    <circle cx="1080" cy="560" r="15" fill="url(#node)" opacity="0.9"/>
    <circle cx="600" cy="610" r="12" fill="url(#node)" opacity="0.9"/>
    <circle cx="500" cy="470" r="10" fill="url(#node)" opacity="0.9"/>
    <circle cx="1100" cy="430" r="13" fill="url(#node)" opacity="0.9"/>
    <circle cx="870" cy="240" r="10" fill="url(#node)" opacity="0.9"/>
    <circle cx="740" cy="680" r="12" fill="url(#node)" opacity="0.9"/>
  </g>

  <!-- a few faint outer nodes just outside the radius (events beyond reach) -->
  <g fill="#78350f" opacity="0.35">
    <circle cx="420" cy="250" r="6"/>
    <circle cx="1180" cy="200" r="5"/>
    <circle cx="1220" cy="700" r="6"/>
    <circle cx="430" cy="700" r="5"/>
  </g>

  <!-- hero: location pin at centre (the dinner anchor) -->
  <g transform="translate(800 450)">
    <!-- pin shadow -->
    <ellipse cx="0" cy="100" rx="38" ry="8" fill="#5c2a1a" opacity="0.25"/>
    <!-- pin body: teardrop -->
    <path d="M 0 -90 C 50 -90 70 -50 70 -20 C 70 30 30 60 0 100 C -30 60 -70 30 -70 -20 C -70 -50 -50 -90 0 -90 Z" fill="url(#pin)" opacity="0.95"/>
    <!-- inner cutout (negative space) -->
    <circle cx="0" cy="-25" r="26" fill="#faf8f2" opacity="0.95"/>
    <!-- fork glyph inside the pin (dinner anchor) -->
    <g stroke="#9a3309" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="-10" y1="-40" x2="-10" y2="-22"/>
      <line x1="0" y1="-40" x2="0" y2="-22"/>
      <line x1="10" y1="-40" x2="10" y2="-22"/>
      <line x1="0" y1="-22" x2="0" y2="-8"/>
    </g>
  </g>

  <!-- corner decoration (gets variably cropped, no meaning lost) -->
  <g opacity="0.18" fill="#c2410c">
    <rect x="40" y="40" width="60" height="3"/>
    <rect x="40" y="40" width="3" height="60"/>
    <rect x="1500" y="857" width="60" height="3"/>
    <rect x="1557" y="800" width="3" height="60"/>
  </g>
</svg>
