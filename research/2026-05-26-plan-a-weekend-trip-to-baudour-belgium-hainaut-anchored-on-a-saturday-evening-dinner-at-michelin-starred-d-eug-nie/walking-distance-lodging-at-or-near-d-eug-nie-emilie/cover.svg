<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1d12"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="rightFacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- cobblestone square (ground plane) -->
  <polygon points="0,720 1600,720 1600,900 0,900" fill="url(#ground)"/>

  <!-- subtle cobble suggestion lines -->
  <g stroke="#78350f" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M0,760 Q800,740 1600,760"/>
    <path d="M0,800 Q800,780 1600,800"/>
    <path d="M0,850 Q800,830 1600,850"/>
  </g>

  <!-- ambient warm glow from square center -->
  <ellipse cx="800" cy="720" rx="700" ry="180" fill="url(#lamp)" opacity="0.55"/>

  <!-- LEFT building: the restaurant (larger, more prominent) -->
  <g opacity="0.95">
    <!-- main facade -->
    <rect x="180" y="300" width="480" height="420" fill="url(#leftFacade)"/>
    <!-- pitched roof -->
    <polygon points="160,300 680,300 620,210 220,210" fill="#3a1d12"/>
    <!-- chimney -->
    <rect x="540" y="160" width="40" height="70" fill="#3a1d12"/>
    <!-- ground-floor large windows (dining room glow) -->
    <rect x="220" y="520" width="120" height="180" fill="url(#window)" opacity="0.92"/>
    <rect x="370" y="520" width="120" height="180" fill="url(#window)" opacity="0.92"/>
    <rect x="520" y="520" width="120" height="180" fill="url(#window)" opacity="0.92"/>
    <!-- mullions -->
    <line x1="280" y1="520" x2="280" y2="700" stroke="#3a1d12" stroke-width="3"/>
    <line x1="430" y1="520" x2="430" y2="700" stroke="#3a1d12" stroke-width="3"/>
    <line x1="580" y1="520" x2="580" y2="700" stroke="#3a1d12" stroke-width="3"/>
    <line x1="220" y1="610" x2="640" y2="610" stroke="#3a1d12" stroke-width="2"/>
    <!-- upper floor windows -->
    <rect x="240" y="360" width="70" height="100" fill="#fbbf24" opacity="0.7"/>
    <rect x="385" y="360" width="70" height="100" fill="#78350f" opacity="0.85"/>
    <rect x="530" y="360" width="70" height="100" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- RIGHT building: the boutique inn (smaller, intimate) -->
  <g opacity="0.95">
    <rect x="980" y="380" width="340" height="340" fill="url(#rightFacade)"/>
    <!-- pitched roof -->
    <polygon points="965,380 1335,380 1280,300 1020,300" fill="#3a1d12"/>
    <!-- door (warm interior light spilling out) -->
    <rect x="1120" y="600" width="60" height="120" fill="url(#window)"/>
    <!-- three guest-room windows (the 3 rooms) -->
    <rect x="1010" y="430" width="60" height="80" fill="#fbbf24" opacity="0.8"/>
    <rect x="1120" y="430" width="60" height="80" fill="#fbbf24" opacity="0.8"/>
    <rect x="1230" y="430" width="60" height="80" fill="#fbbf24" opacity="0.8"/>
    <!-- ground floor side windows -->
    <rect x="1010" y="600" width="80" height="100" fill="#d97706" opacity="0.7"/>
    <rect x="1210" y="600" width="80" height="100" fill="#d97706" opacity="0.7"/>
  </g>

  <!-- single street lamp glow between the buildings -->
  <circle cx="800" cy="640" r="90" fill="url(#lamp)" opacity="0.9"/>
  <circle cx="800" cy="640" r="14" fill="#fbbf24" opacity="0.95"/>
  <line x1="800" y1="654" x2="800" y2="720" stroke="#3a1d12" stroke-width="4"/>
</svg>
