<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="farm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f0eadb" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="980" cy="430" r="520" fill="url(#sun)"/>
  <circle cx="980" cy="430" r="70" fill="#fef3ec" opacity="0.85"/>

  <!-- Distant tree line / rolling hills -->
  <path d="M0,560 Q200,520 400,545 T800,540 T1200,548 T1600,535 L1600,640 L0,640 Z" fill="#5c2a1a" opacity="0.7"/>

  <!-- Castle ruin tower (small, left of farmstead) -->
  <g opacity="0.9">
    <rect x="430" y="420" width="60" height="170" fill="#78350f"/>
    <path d="M430,420 L432,408 L440,408 L442,420 M448,420 L450,408 L458,408 L460,420 M466,420 L468,408 L476,408 L478,420 M484,420 L486,408 L490,408 L490,420 Z" fill="#78350f"/>
    <rect x="450" y="470" width="12" height="22" fill="#1a0e0e"/>
    <rect x="450" y="510" width="12" height="22" fill="#1a0e0e"/>
  </g>

  <!-- Farmstead: main long whitewashed building (hero) -->
  <g>
    <!-- Main long barn -->
    <rect x="540" y="470" width="540" height="135" fill="url(#farm)"/>
    <polygon points="540,470 600,418 1020,418 1080,470" fill="url(#roof)"/>
    <!-- Roof shading line -->
    <line x1="540" y1="470" x2="1080" y2="470" stroke="#5c2a1a" stroke-width="2" opacity="0.6"/>

    <!-- Right wing (perpendicular) -->
    <rect x="1020" y="445" width="170" height="160" fill="url(#farm)"/>
    <polygon points="1020,445 1060,400 1150,400 1190,445" fill="url(#roof)"/>

    <!-- Chimney -->
    <rect x="720" y="402" width="20" height="40" fill="#78350f"/>

    <!-- Windows (warm glow, no letters) -->
    <rect x="600" y="510" width="28" height="38" fill="#fbbf24" opacity="0.9"/>
    <rect x="668" y="510" width="28" height="38" fill="#fbbf24" opacity="0.9"/>
    <rect x="780" y="510" width="28" height="38" fill="#fbbf24" opacity="0.75"/>
    <rect x="848" y="510" width="28" height="38" fill="#fbbf24" opacity="0.9"/>
    <rect x="916" y="510" width="28" height="38" fill="#fbbf24" opacity="0.85"/>
    <rect x="984" y="510" width="28" height="38" fill="#fbbf24" opacity="0.75"/>

    <!-- Door -->
    <rect x="720" y="525" width="40" height="80" fill="#5c2a1a"/>
    <rect x="724" y="530" width="32" height="50" fill="#d97706" opacity="0.7"/>

    <!-- Right wing windows -->
    <rect x="1055" y="490" width="26" height="34" fill="#fbbf24" opacity="0.85"/>
    <rect x="1110" y="490" width="26" height="34" fill="#fbbf24" opacity="0.85"/>
    <rect x="1055" y="545" width="26" height="34" fill="#fbbf24" opacity="0.7"/>
    <rect x="1110" y="545" width="26" height="34" fill="#fbbf24" opacity="0.7"/>

    <!-- Wall shading -->
    <rect x="540" y="590" width="650" height="15" fill="#78350f" opacity="0.35"/>
  </g>

  <!-- Foreground: vegetable garden rows in perspective -->
  <rect x="0" y="605" width="1600" height="295" fill="url(#ground)"/>

  <!-- Garden rows (converging slightly toward farmstead) -->
  <g opacity="0.85">
    <path d="M0,635 Q800,628 1600,635 L1600,648 Q800,641 0,648 Z" fill="#5c2a1a"/>
    <path d="M0,675 Q800,668 1600,675 L1600,692 Q800,685 0,692 Z" fill="#78350f"/>
    <path d="M0,725 Q800,718 1600,725 L1600,748 Q800,741 0,748 Z" fill="#5c2a1a"/>
    <path d="M0,785 Q800,778 1600,785 L1600,815 Q800,808 0,815 Z" fill="#78350f"/>
    <path d="M0,855 Q800,848 1600,855 L1600,895 Q800,888 0,895 Z" fill="#5c2a1a"/>
  </g>

  <!-- Sparse plants dotting the rows -->
  <g fill="#c2410c" opacity="0.7">
    <circle cx="180" cy="690" r="5"/>
    <circle cx="360" cy="688" r="5"/>
    <circle cx="540" cy="687" r="5"/>
    <circle cx="1080" cy="687" r="5"/>
    <circle cx="1260" cy="688" r="5"/>
    <circle cx="1440" cy="690" r="5"/>
    <circle cx="220" cy="740" r="6"/>
    <circle cx="460" cy="738" r="6"/>
    <circle cx="1140" cy="738" r="6"/>
    <circle cx="1380" cy="740" r="6"/>
    <circle cx="140" cy="800" r="7"/>
    <circle cx="420" cy="798" r="7"/>
    <circle cx="1180" cy="798" r="7"/>
    <circle cx="1460" cy="800" r="7"/>
  </g>
</svg>
