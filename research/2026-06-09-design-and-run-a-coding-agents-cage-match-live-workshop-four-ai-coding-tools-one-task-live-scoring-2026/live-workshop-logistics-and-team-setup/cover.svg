<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1408"/>
    </linearGradient>
    <!-- Left panel gradient -->
    <linearGradient id="panelL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Right panel gradient -->
    <linearGradient id="panelR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Central glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <!-- Panel inner lines gradient -->
    <linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: Hero element — two opposing angled panels + central burst -->

  <!-- Left panel (angled, leaning right) -->
  <polygon points="180,130 720,160 680,740 140,710" fill="url(#panelL)" opacity="0.82"/>
  <!-- Left panel inner code-line bars (decorative horizontal stripes suggesting code) -->
  <rect x="195" y="240" width="430" height="12" rx="3" fill="url(#lineL)" opacity="0.7"/>
  <rect x="195" y="290" width="370" height="12" rx="3" fill="url(#lineL)" opacity="0.6"/>
  <rect x="195" y="340" width="410" height="12" rx="3" fill="url(#lineL)" opacity="0.55"/>
  <rect x="195" y="390" width="340" height="12" rx="3" fill="url(#lineL)" opacity="0.5"/>
  <rect x="195" y="440" width="390" height="12" rx="3" fill="url(#lineL)" opacity="0.45"/>
  <rect x="195" y="490" width="360" height="12" rx="3" fill="url(#lineL)" opacity="0.4"/>
  <rect x="195" y="540" width="400" height="12" rx="3" fill="url(#lineL)" opacity="0.35"/>
  <rect x="195" y="590" width="330" height="12" rx="3" fill="url(#lineL)" opacity="0.3"/>

  <!-- Right panel (angled, mirrored) -->
  <polygon points="1420,130 880,160 920,740 1460,710" fill="url(#panelR)" opacity="0.82"/>
  <!-- Right panel inner code-line bars -->
  <rect x="975" y="240" width="430" height="12" rx="3" fill="url(#lineR)" opacity="0.7"/>
  <rect x="1035" y="290" width="370" height="12" rx="3" fill="url(#lineR)" opacity="0.6"/>
  <rect x="995" y="340" width="410" height="12" rx="3" fill="url(#lineR)" opacity="0.55"/>
  <rect x="1065" y="390" width="340" height="12" rx="3" fill="url(#lineR)" opacity="0.5"/>
  <rect x="1015" y="440" width="390" height="12" rx="3" fill="url(#lineR)" opacity="0.45"/>
  <rect x="1045" y="490" width="360" height="12" rx="3" fill="url(#lineR)" opacity="0.4"/>
  <rect x="1005" y="540" width="400" height="12" rx="3" fill="url(#lineR)" opacity="0.35"/>
  <rect x="1075" y="590" width="330" height="12" rx="3" fill="url(#lineR)" opacity="0.3"/>

  <!-- VS dividing line (vertical slash between panels) -->
  <line x1="800" y1="130" x2="800" y2="770" stroke="#c2410c" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Central radial glow burst (hero focal point) -->
  <circle cx="800" cy="450" r="160" fill="url(#glow)" opacity="0.9"/>

  <!-- Central core dot -->
  <circle cx="800" cy="450" r="28" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="450" r="14" fill="#fff" opacity="0.7"/>

  <!-- Layer 3: full-bleed vignette (decorative edge, variably cropped) -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
