<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="rust" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.6" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#3b0764"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- fulcrum / divide line -->
  <rect x="797" y="170" width="6" height="560" fill="#fbbf24" opacity="0.35"/>

  <!-- rust hero sphere (left, larger — frontier weight) -->
  <circle cx="560" cy="450" r="215" fill="url(#rust)" opacity="0.95"/>
  <circle cx="560" cy="450" r="215" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
  <ellipse cx="560" cy="450" rx="285" ry="100" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.55"/>

  <!-- violet challenger sphere (right, smaller — local) -->
  <circle cx="1075" cy="475" r="150" fill="url(#violet)" opacity="0.92"/>
  <circle cx="1075" cy="475" r="150" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.5"/>
  <ellipse cx="1075" cy="475" rx="205" ry="72" fill="none" stroke="#6d28d9" stroke-width="2.5" opacity="0.55"/>

  <!-- node accents bridging the two -->
  <circle cx="560" cy="450" r="9" fill="#fef3ec"/>
  <circle cx="1075" cy="475" r="7" fill="#ede9fe"/>
  <line x1="775" y1="455" x2="925" y2="470" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
</svg>
