<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1410"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm harbour glow -->
    <radialGradient id="glow" cx="50%" cy="58%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate radial for centre dish motif -->
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.70"/>
    </radialGradient>
    <!-- Inner plate highlight -->
    <radialGradient id="plateInner" cx="42%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Skyline building fill -->
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Star shimmer on horizon -->
    <radialGradient id="horizon" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#horizon)"/>

  <!-- Layer 1b: Harbour warm glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Skyline silhouette — buildings anchored bottom, tops vary -->
  <!-- Far-left buildings -->
  <rect x="130" y="560" width="55" height="290" fill="url(#bldg)" opacity="0.70"/>
  <rect x="195" y="510" width="40" height="340" fill="url(#bldg)" opacity="0.65"/>
  <rect x="245" y="540" width="70" height="310" fill="url(#bldg)" opacity="0.72"/>
  <!-- Left cluster -->
  <rect x="325" y="480" width="50" height="370" fill="url(#bldg)" opacity="0.75"/>
  <rect x="385" y="530" width="35" height="320" fill="url(#bldg)" opacity="0.68"/>
  <rect x="430" y="460" width="60" height="390" fill="url(#bldg)" opacity="0.80"/>
  <!-- IFC-style tall tower left of centre -->
  <rect x="500" y="340" width="48" height="510" fill="#78350f" opacity="0.88"/>
  <rect x="512" y="330" width="24" height="20" fill="#9a3309" opacity="0.90"/>
  <!-- Centre-left -->
  <rect x="560" y="490" width="55" height="360" fill="url(#bldg)" opacity="0.72"/>
  <rect x="625" y="520" width="40" height="330" fill="url(#bldg)" opacity="0.68"/>

  <!-- Right cluster -->
  <rect x="960" y="520" width="40" height="330" fill="url(#bldg)" opacity="0.68"/>
  <rect x="1010" y="490" width="55" height="360" fill="url(#bldg)" opacity="0.72"/>
  <!-- IFC-style tall tower right of centre -->
  <rect x="1038" y="340" width="48" height="510" fill="#78350f" opacity="0.88"/>
  <rect x="1050" y="330" width="24" height="20" fill="#9a3309" opacity="0.90"/>
  <rect x="1105" y="460" width="60" height="390" fill="url(#bldg)" opacity="0.80"/>
  <rect x="1175" y="530" width="35" height="320" fill="url(#bldg)" opacity="0.68"/>
  <rect x="1220" y="480" width="50" height="370" fill="url(#bldg)" opacity="0.75"/>
  <!-- Far-right buildings -->
  <rect x="1285" y="540" width="70" height="310" fill="url(#bldg)" opacity="0.72"/>
  <rect x="1365" y="510" width="40" height="340" fill="url(#bldg)" opacity="0.65"/>
  <rect x="1415" y="560" width="55" height="290" fill="url(#bldg)" opacity="0.70"/>

  <!-- Harbour water reflection strip -->
  <rect x="0" y="845" width="1600" height="55" fill="#5c2a1a" opacity="0.50"/>
  <rect x="0" y="848" width="1600" height="8" fill="#d97706" opacity="0.18"/>

  <!-- Layer 2 Hero: Plate / Michelin dinner motif centred at (800, 470) -->
  <!-- Outer plate rim -->
  <circle cx="800" cy="470" r="210" fill="url(#plate)" opacity="0.88"/>
  <!-- Plate rim ring -->
  <circle cx="800" cy="470" r="210" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.55"/>
  <!-- Inner plate well -->
  <circle cx="800" cy="470" r="155" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="800" cy="470" r="155" fill="url(#plateInner)" opacity="0.80"/>
  <!-- Food composition: abstract elegant brushstroke shapes on plate -->
  <!-- Central sauce swoosh -->
  <ellipse cx="800" cy="465" rx="70" ry="18" fill="#c2410c" opacity="0.90" transform="rotate(-18 800 465)"/>
  <ellipse cx="818" cy="458" rx="28" ry="10" fill="#fbbf24" opacity="0.75" transform="rotate(-18 818 458)"/>
  <!-- Micro garnish dots -->
  <circle cx="755" cy="455" r="8" fill="#d97706" opacity="0.85"/>
  <circle cx="848" cy="472" r="6" fill="#fbbf24" opacity="0.80"/>
  <circle cx="770" cy="485" r="5" fill="#9a3309" opacity="0.90"/>

  <!-- Three Michelin stars above the plate (decorative dots, not text) -->
  <!-- Star 1 -->
  <polygon points="800,210 808,232 832,232 813,246 820,268 800,255 780,268 787,246 768,232 792,232"
           fill="#fbbf24" opacity="0.90"/>
  <!-- Star 2 -->
  <polygon points="740,235 746,252 764,252 750,262 755,279 740,269 725,279 730,262 716,252 734,252"
           fill="#d97706" opacity="0.78"/>
  <!-- Star 3 -->
  <polygon points="860,235 866,252 884,252 870,262 875,279 860,269 845,279 850,262 836,252 854,252"
           fill="#d97706" opacity="0.78"/>

  <!-- Layer 3: Edge decorations (may be cropped, carry no meaning) -->
  <!-- Top-left corner accent arc -->
  <path d="M 0,0 Q 120,0 120,120" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.25"/>
  <!-- Bottom-right corner accent arc -->
  <path d="M 1600,900 Q 1480,900 1480,780" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.25"/>
  <!-- Subtle full-bleed vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
