<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- setting sun glow over the peak -->
  <circle cx="800" cy="470" r="290" fill="url(#sun)" opacity="0.85"/>

  <!-- skyline silhouette (hero), sitting on the waterline ~y=560 -->
  <g fill="url(#tower)" opacity="0.92">
    <rect x="430" y="430" width="46" height="130"/>
    <rect x="486" y="360" width="40" height="200"/>
    <rect x="536" y="300" width="34" height="260"/>
    <polygon points="600,200 624,300 576,300"/>
    <rect x="592" y="290" width="64" height="270"/>
    <rect x="666" y="400" width="42" height="160"/>
    <rect x="718" y="340" width="48" height="220"/>
    <rect x="776" y="240" width="54" height="320"/>
    <rect x="840" y="190" width="40" height="370"/>
    <rect x="888" y="320" width="46" height="240"/>
    <rect x="944" y="280" width="52" height="280"/>
    <rect x="1006" y="380" width="44" height="180"/>
    <rect x="1060" y="420" width="40" height="140"/>
    <rect x="1110" y="350" width="46" height="210"/>
  </g>

  <!-- waterline / harbour -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#water)" opacity="0.9"/>

  <!-- reflection streak -->
  <rect x="760" y="560" width="80" height="220" fill="#fbbf24" opacity="0.18"/>

  <!-- Star Ferry crossing the harbour -->
  <g opacity="0.9">
    <path d="M650 640 h120 l-16 28 h-88 z" fill="#78350f"/>
    <rect x="668" y="614" width="84" height="28" fill="#9a3309"/>
    <rect x="700" y="596" width="22" height="20" fill="#c2410c"/>
  </g>
</svg>
