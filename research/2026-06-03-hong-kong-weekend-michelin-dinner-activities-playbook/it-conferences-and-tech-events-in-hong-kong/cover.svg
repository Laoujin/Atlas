<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="panel1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="ledbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Radial glow centered at hero -->
  <ellipse cx="800" cy="450" rx="520" ry="370" fill="url(#glow)"/>

  <!-- Layer 2: stacked angled panels (back to front) -->

  <!-- Panel 3 (deepest) -->
  <polygon points="480,620 1120,620 1160,300 440,300" fill="url(#panel3)" opacity="0.6"/>

  <!-- Panel 2 (mid) -->
  <polygon points="510,600 1090,600 1125,330 475,330" fill="url(#panel2)" opacity="0.75"/>

  <!-- Panel 1 (hero, front) — slightly smaller, fully opaque rust -->
  <polygon points="545,580 1055,580 1085,365 515,365" fill="url(#panel1)" opacity="0.95"/>

  <!-- LED accent bar across top edge of hero panel -->
  <rect x="515" y="362" width="574" height="6" rx="3" fill="url(#ledbar)" opacity="0.9"/>

  <!-- Node-and-edge emblem on hero panel -->
  <!-- Central hub node -->
  <circle cx="800" cy="472" r="22" fill="#fbbf24" opacity="0.95"/>
  <!-- Satellite nodes -->
  <circle cx="680" cy="430" r="13" fill="#d97706" opacity="0.85"/>
  <circle cx="920" cy="430" r="13" fill="#d97706" opacity="0.85"/>
  <circle cx="730" cy="525" r="10" fill="#c2410c" opacity="0.80"/>
  <circle cx="870" cy="525" r="10" fill="#c2410c" opacity="0.80"/>
  <!-- Edges -->
  <line x1="800" y1="472" x2="680" y2="430" stroke="#fbbf24" stroke-width="2.5" opacity="0.60"/>
  <line x1="800" y1="472" x2="920" y2="430" stroke="#fbbf24" stroke-width="2.5" opacity="0.60"/>
  <line x1="800" y1="472" x2="730" y2="525" stroke="#fbbf24" stroke-width="2" opacity="0.50"/>
  <line x1="800" y1="472" x2="870" y2="525" stroke="#fbbf24" stroke-width="2" opacity="0.50"/>
  <!-- Cross-edges for network feel -->
  <line x1="680" y1="430" x2="730" y2="525" stroke="#d97706" stroke-width="1.5" opacity="0.35"/>
  <line x1="920" y1="430" x2="870" y2="525" stroke="#d97706" stroke-width="1.5" opacity="0.35"/>

  <!-- Layer 3: corner decoration (outside safe zone, atmospheric) -->
  <!-- Top-left corner sweep -->
  <path d="M0,0 Q200,0 200,120 Q200,0 0,0 Z" fill="#c2410c" opacity="0.08"/>
  <!-- Bottom-right corner sweep -->
  <path d="M1600,900 Q1400,900 1400,780 Q1400,900 1600,900 Z" fill="#c2410c" opacity="0.08"/>
  <!-- Thin horizon line for stage atmosphere -->
  <rect x="0" y="638" width="1600" height="1.5" fill="#d97706" opacity="0.18"/>
</svg>
