<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep evening -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>

    <!-- Hero plate glow -->
    <radialGradient id="plateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Main plate fill -->
    <radialGradient id="plateFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>

    <!-- Plate rim highlight -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="90%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Small accent plate fill -->
    <radialGradient id="accentPlateFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#2d1008"/>
    </radialGradient>

    <!-- Sauce pool gradient -->
    <radialGradient id="saucePool" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Chopstick gradient -->
    <linearGradient id="chopstickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Soft ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="380" fill="url(#plateGlow)" opacity="0.9"/>

  <!-- Layer 2: Hero — main plate -->
  <!-- Outer glow ring -->
  <circle cx="800" cy="460" r="290" fill="none" stroke="#d97706" stroke-width="2" opacity="0.15"/>
  <circle cx="800" cy="460" r="265" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.25"/>

  <!-- Main plate body -->
  <circle cx="800" cy="460" r="250" fill="url(#plateFill)" opacity="0.95"/>

  <!-- Plate rim highlight ring -->
  <circle cx="800" cy="460" r="250" fill="url(#rimGrad)"/>

  <!-- Sauce pool / food element on main plate -->
  <ellipse cx="800" cy="480" rx="140" ry="100" fill="url(#saucePool)" opacity="0.85"/>

  <!-- Inner well of plate (depth shadow) -->
  <circle cx="800" cy="460" r="200" fill="#1a0e0e" opacity="0.25"/>

  <!-- Food highlight — a small gleam suggesting a plated morsel -->
  <ellipse cx="780" cy="450" rx="38" ry="26" fill="#fbbf24" opacity="0.18"/>
  <ellipse cx="780" cy="448" rx="18" ry="12" fill="#fbbf24" opacity="0.30"/>

  <!-- Accent plate (slightly behind/offset, lower right) -->
  <circle cx="1020" cy="590" r="130" fill="url(#accentPlateFill)" opacity="0.75"/>
  <circle cx="1020" cy="590" r="130" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="1020" cy="600" rx="60" ry="42" fill="#c2410c" opacity="0.35"/>

  <!-- Second small accent plate (upper left) -->
  <circle cx="570" cy="320" r="90" fill="url(#accentPlateFill)" opacity="0.55"/>
  <circle cx="570" cy="320" r="90" fill="none" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <ellipse cx="570" cy="328" rx="40" ry="28" fill="#d97706" opacity="0.22"/>

  <!-- Layer 3: Chopstick pair — decorative silhouette, angled across hero -->
  <line x1="640" y1="210" x2="890" y2="720" stroke="url(#chopstickGrad)" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <line x1="670" y1="205" x2="920" y2="715" stroke="url(#chopstickGrad)" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- Chopstick tips — small rounded caps -->
  <circle cx="890" cy="720" r="5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="920" cy="715" r="5" fill="#fbbf24" opacity="0.5"/>

  <!-- Corner decorations (outside safe zone, purely atmospheric) -->
  <!-- Top-left ember arc -->
  <path d="M 0 0 Q 120 80 60 200" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.15"/>
  <!-- Bottom-right ember arc -->
  <path d="M 1600 900 Q 1480 820 1540 700" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.15"/>

  <!-- Subtle vignette overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
