<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant Euganean hills (decoration, may crop) -->
  <path d="M0 640 Q 200 560 380 600 T 760 590 T 1180 580 T 1600 600 L 1600 720 L 0 720 Z" fill="#c2410c" opacity="0.18"/>
  <path d="M0 680 Q 260 620 520 660 T 1040 650 T 1600 660 L 1600 760 L 0 760 Z" fill="#9a3309" opacity="0.22"/>

  <!-- warm sun glow behind villa -->
  <circle cx="800" cy="470" r="360" fill="url(#sun)"/>

  <!-- cypress accents (decoration outside hero) -->
  <ellipse cx="200" cy="640" rx="22" ry="90" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="1410" cy="650" rx="20" ry="80" fill="#5c2a1a" opacity="0.7"/>

  <!-- VILLA hero: centered ~(800,470), within safe zone -->
  <!-- side wings -->
  <rect x="360" y="500" width="240" height="240" fill="#c2410c" opacity="0.85"/>
  <rect x="1000" y="500" width="240" height="240" fill="#c2410c" opacity="0.85"/>
  <!-- wing roofs -->
  <polygon points="350,500 610,500 580,460 380,460" fill="url(#roof)"/>
  <polygon points="990,500 1250,500 1220,460 1020,460" fill="url(#roof)"/>

  <!-- central main block -->
  <rect x="580" y="380" width="440" height="360" fill="url(#facade)"/>
  <!-- pediment / pitched roof -->
  <polygon points="560,380 1040,380 920,290 680,290" fill="url(#roof)"/>
  <!-- pediment tympanum highlight -->
  <polygon points="700,360 900,360 800,310" fill="#fbbf24" opacity="0.45"/>

  <!-- arched portico: three arches, ground floor -->
  <rect x="610" y="560" width="380" height="180" fill="#1a0e0e" opacity="0.55"/>
  <path d="M635 740 L 635 640 Q 635 600 685 600 Q 735 600 735 640 L 735 740 Z" fill="#faf8f2"/>
  <path d="M755 740 L 755 640 Q 755 600 805 600 Q 855 600 855 640 L 855 740 Z" fill="#faf8f2"/>
  <path d="M875 740 L 875 640 Q 875 600 925 600 Q 975 600 975 640 L 975 740 Z" fill="#faf8f2"/>

  <!-- palazzo windows: upper floor on main block -->
  <rect x="640" y="430" width="50" height="90" fill="#1a0e0e" opacity="0.7"/>
  <rect x="720" y="430" width="50" height="90" fill="#1a0e0e" opacity="0.7"/>
  <rect x="830" y="430" width="50" height="90" fill="#1a0e0e" opacity="0.7"/>
  <rect x="910" y="430" width="50" height="90" fill="#1a0e0e" opacity="0.7"/>
  <!-- arched tops on windows -->
  <path d="M640 430 Q 665 410 690 430 Z" fill="#1a0e0e" opacity="0.7"/>
  <path d="M720 430 Q 745 410 770 430 Z" fill="#1a0e0e" opacity="0.7"/>
  <path d="M830 430 Q 855 410 880 430 Z" fill="#1a0e0e" opacity="0.7"/>
  <path d="M910 430 Q 935 410 960 430 Z" fill="#1a0e0e" opacity="0.7"/>

  <!-- wing windows -->
  <rect x="400" y="540" width="40" height="70" fill="#1a0e0e" opacity="0.65"/>
  <rect x="520" y="540" width="40" height="70" fill="#1a0e0e" opacity="0.65"/>
  <rect x="1040" y="540" width="40" height="70" fill="#1a0e0e" opacity="0.65"/>
  <rect x="1160" y="540" width="40" height="70" fill="#1a0e0e" opacity="0.65"/>

  <!-- subtle facade shadow line -->
  <rect x="580" y="555" width="440" height="6" fill="#78350f" opacity="0.6"/>

  <!-- ground line -->
  <rect x="0" y="740" width="1600" height="60" fill="#78350f" opacity="0.25"/>
</svg>
