<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="75%" stop-color="#e8d4b8"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant Euganean hills (decoration, partly outside safe zone vertically) -->
  <path d="M 0 720 Q 180 640 360 680 T 720 660 Q 900 620 1100 670 T 1400 650 Q 1520 640 1600 670 L 1600 900 L 0 900 Z" fill="url(#hills)" opacity="0.7"/>
  <path d="M 0 780 Q 240 720 480 760 T 960 740 Q 1200 720 1400 760 T 1600 760 L 1600 900 L 0 900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Three Michelin stars (abstract bursts, kept inside safe zone) -->
  <g opacity="0.9">
    <circle cx="640" cy="220" r="55" fill="url(#star)"/>
    <circle cx="640" cy="220" r="12" fill="#fef3ec"/>

    <circle cx="800" cy="180" r="70" fill="url(#star)"/>
    <circle cx="800" cy="180" r="15" fill="#fef3ec"/>

    <circle cx="960" cy="220" r="55" fill="url(#star)"/>
    <circle cx="960" cy="220" r="12" fill="#fef3ec"/>
  </g>

  <!-- Hero: plate at center (within safe zone, ~800,520) -->
  <ellipse cx="810" cy="555" rx="270" ry="62" fill="#1a0e0e" opacity="0.55"/>
  <ellipse cx="800" cy="510" rx="285" ry="78" fill="url(#plate)" opacity="0.95"/>
  <ellipse cx="800" cy="505" rx="220" ry="58" fill="#5c2a1a" opacity="0.35"/>
  <ellipse cx="800" cy="498" rx="155" ry="38" fill="#c2410c" opacity="0.55"/>
  <circle cx="800" cy="492" r="18" fill="#fbbf24" opacity="0.9"/>

  <!-- Wine glass silhouette to the right of plate (accent, inside safe zone) -->
  <g opacity="0.85">
    <path d="M 1140 360 Q 1140 470 1185 490 Q 1230 470 1230 360 Z" fill="url(#glass)"/>
    <rect x="1182" y="488" width="6" height="90" fill="#78350f"/>
    <ellipse cx="1185" cy="585" rx="42" ry="6" fill="#78350f"/>
  </g>
</svg>
