<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coneFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="coneMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="coneNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow, low and warm -->
  <circle cx="1080" cy="470" r="280" fill="url(#sun)" opacity="0.9"/>

  <!-- Far cones (Euganean volcanic silhouettes) -->
  <path d="M 0 620 Q 220 470 380 560 Q 520 470 680 580 Q 820 470 980 560 Q 1140 460 1300 570 Q 1460 480 1600 600 L 1600 900 L 0 900 Z"
        fill="url(#coneFar)" opacity="0.7"/>

  <!-- Mid cones -->
  <path d="M 0 720 Q 180 580 340 670 Q 480 560 620 680 Q 760 580 900 700 Q 1060 580 1220 690 Q 1380 600 1600 700 L 1600 900 L 0 900 Z"
        fill="url(#coneMid)" opacity="0.88"/>

  <!-- Hero: a single prominent cone with a medieval tower on its crest, centered in safe zone -->
  <!-- Cone -->
  <path d="M 560 770 Q 740 380 800 360 Q 860 380 1040 770 Z" fill="url(#coneNear)"/>
  <!-- Subtle ridge highlight -->
  <path d="M 800 360 Q 860 480 900 770" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.45"/>

  <!-- Walled town silhouette / tower on the crest -->
  <!-- Low wall segments -->
  <rect x="745" y="360" width="34" height="36" fill="#5c2a1a"/>
  <rect x="815" y="365" width="42" height="32" fill="#5c2a1a"/>
  <!-- Crenellation notches on the right wall -->
  <rect x="819" y="358" width="8" height="9" fill="#5c2a1a"/>
  <rect x="835" y="358" width="8" height="9" fill="#5c2a1a"/>
  <rect x="851" y="358" width="6" height="9" fill="#5c2a1a"/>
  <!-- Tower (Monselice / Este vibe) -->
  <rect x="780" y="298" width="38" height="98" fill="url(#tower)"/>
  <!-- Tower crenellations -->
  <rect x="780" y="292" width="9" height="8" fill="#78350f"/>
  <rect x="794" y="292" width="9" height="8" fill="#78350f"/>
  <rect x="808" y="292" width="10" height="8" fill="#78350f"/>
  <!-- Tower window slit -->
  <rect x="794" y="328" width="6" height="14" fill="#1a0e0e" opacity="0.7"/>

  <!-- Near foreground: dark rolling foothill -->
  <path d="M 0 820 Q 200 760 420 800 Q 640 840 880 790 Q 1120 760 1340 810 Q 1480 830 1600 800 L 1600 900 L 0 900 Z"
        fill="#1a0e0e" opacity="0.78"/>

  <!-- Vine hint: a slender curl in lower foreground (decoration, mostly outside hero) -->
  <path d="M 180 860 Q 230 820 270 845 Q 310 870 350 830 Q 390 800 430 835"
        stroke="#c2410c" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
  <circle cx="270" cy="845" r="5" fill="#9a3309" opacity="0.75"/>
  <circle cx="350" cy="830" r="4" fill="#9a3309" opacity="0.75"/>
</svg>
