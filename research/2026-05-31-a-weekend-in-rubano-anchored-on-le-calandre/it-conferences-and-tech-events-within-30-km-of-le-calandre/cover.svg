<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rustHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint circuit lines, decorative, full-bleed -->
  <g stroke="#c2410c" stroke-width="1.2" fill="none" opacity="0.18">
    <path d="M 0 220 L 360 220 L 420 280 L 720 280"/>
    <path d="M 1600 180 L 1280 180 L 1220 240 L 1000 240"/>
    <path d="M 0 720 L 280 720 L 340 660 L 600 660"/>
    <path d="M 1600 740 L 1340 740 L 1280 680 L 1040 680"/>
    <circle cx="360" cy="220" r="4" fill="#c2410c" stroke="none"/>
    <circle cx="1280" cy="180" r="4" fill="#c2410c" stroke="none"/>
    <circle cx="280" cy="720" r="4" fill="#c2410c" stroke="none"/>
    <circle cx="1340" cy="740" r="4" fill="#c2410c" stroke="none"/>
  </g>

  <!-- warm radial glow centred on the hub -->
  <circle cx="800" cy="450" r="420" fill="url(#glow)"/>

  <!-- 30 km radius rings (compass) -->
  <g fill="none" stroke="#9a3309" opacity="0.45">
    <circle cx="800" cy="450" r="360" stroke-width="1.4" stroke-dasharray="2 6"/>
    <circle cx="800" cy="450" r="270" stroke-width="1.2" stroke-dasharray="2 6"/>
    <circle cx="800" cy="450" r="180" stroke-width="1.1" stroke-dasharray="2 6"/>
  </g>

  <!-- compass cross-hairs (cardinal axes) -->
  <g stroke="#78350f" stroke-width="1.2" opacity="0.55">
    <line x1="800" y1="60" x2="800" y2="840"/>
    <line x1="380" y1="450" x2="1220" y2="450"/>
  </g>

  <!-- venue node markers around the radius -->
  <g fill="#c2410c" opacity="0.85">
    <circle cx="1040" cy="320" r="9"/>
    <circle cx="560" cy="380" r="9"/>
    <circle cx="980" cy="600" r="9"/>
    <circle cx="620" cy="560" r="9"/>
    <circle cx="800" cy="180" r="7"/>
    <circle cx="800" cy="720" r="7"/>
  </g>

  <!-- connection traces from hub to venues -->
  <g stroke="#c2410c" stroke-width="1.6" opacity="0.5" fill="none">
    <line x1="800" y1="450" x2="1040" y2="320"/>
    <line x1="800" y1="450" x2="560" y2="380"/>
    <line x1="800" y1="450" x2="980" y2="600"/>
    <line x1="800" y1="450" x2="620" y2="560"/>
  </g>

  <!-- compass needle (north-east) -->
  <g opacity="0.95">
    <polygon points="800,450 770,470 800,260 830,470" fill="url(#needle)"/>
    <polygon points="800,450 770,430 800,640 830,430" fill="#78350f" opacity="0.75"/>
  </g>

  <!-- central hub (the anchor) -->
  <circle cx="800" cy="450" r="44" fill="url(#rustHub)"/>
  <circle cx="800" cy="450" r="44" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
  <circle cx="800" cy="450" r="14" fill="#fef3ec" opacity="0.9"/>
</svg>
