<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="houseB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="houseC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow behind the row -->
  <circle cx="800" cy="540" r="320" fill="url(#sun)"/>

  <!-- Distant rooftop silhouette band -->
  <path d="M0 640 L120 615 L260 625 L400 605 L560 620 L720 600 L900 615 L1080 595 L1260 615 L1420 600 L1600 615 L1600 900 L0 900 Z" fill="#78350f" opacity="0.35"/>

  <!-- Heritage shophouse row (hero, within safe zone) -->
  <!-- House A (left) -->
  <g opacity="0.92">
    <rect x="280" y="380" width="220" height="380" fill="url(#houseA)"/>
    <!-- pitched roof -->
    <polygon points="270,380 510,380 490,340 290,340" fill="#5c2a1a"/>
    <!-- upper-floor shuttered windows -->
    <rect x="312" y="430" width="46" height="78" fill="#1a0e0e" opacity="0.75"/>
    <rect x="372" y="430" width="46" height="78" fill="#1a0e0e" opacity="0.75"/>
    <rect x="432" y="430" width="46" height="78" fill="#1a0e0e" opacity="0.75"/>
    <!-- five-foot-way arcade arches -->
    <rect x="290" y="620" width="210" height="140" fill="#1a0e0e" opacity="0.55"/>
    <path d="M310 760 L310 670 Q345 620 380 670 L380 760 Z" fill="#fef3ec" opacity="0.85"/>
    <path d="M400 760 L400 670 Q435 620 470 670 L470 760 Z" fill="#fef3ec" opacity="0.85"/>
  </g>

  <!-- House B (centre, tallest — hero anchor) -->
  <g opacity="0.95">
    <rect x="520" y="320" width="260" height="440" fill="url(#houseB)"/>
    <polygon points="510,320 790,320 765,275 535,275" fill="#5c2a1a"/>
    <!-- decorative cornice band -->
    <rect x="520" y="360" width="260" height="14" fill="#fbbf24" opacity="0.55"/>
    <!-- tall louvred windows -->
    <rect x="555" y="400" width="52" height="110" fill="#1a0e0e" opacity="0.78"/>
    <rect x="627" y="400" width="52" height="110" fill="#1a0e0e" opacity="0.78"/>
    <rect x="699" y="400" width="52" height="110" fill="#1a0e0e" opacity="0.78"/>
    <!-- arcade -->
    <rect x="530" y="620" width="240" height="140" fill="#1a0e0e" opacity="0.6"/>
    <path d="M555 760 L555 665 Q600 605 645 665 L645 760 Z" fill="#fef3ec" opacity="0.88"/>
    <path d="M665 760 L665 665 Q710 605 755 665 L755 760 Z" fill="#fef3ec" opacity="0.88"/>
    <!-- hanging lantern -->
    <line x1="655" y1="620" x2="655" y2="650" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    <circle cx="655" cy="664" r="14" fill="#fbbf24" opacity="0.92"/>
    <circle cx="655" cy="664" r="22" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- House C (right) -->
  <g opacity="0.92">
    <rect x="800" y="360" width="230" height="400" fill="url(#houseC)"/>
    <polygon points="790,360 1040,360 1018,318 812,318" fill="#5c2a1a"/>
    <rect x="836" y="408" width="48" height="84" fill="#1a0e0e" opacity="0.75"/>
    <rect x="898" y="408" width="48" height="84" fill="#1a0e0e" opacity="0.75"/>
    <rect x="960" y="408" width="48" height="84" fill="#1a0e0e" opacity="0.75"/>
    <rect x="810" y="620" width="220" height="140" fill="#1a0e0e" opacity="0.55"/>
    <path d="M832 760 L832 670 Q870 620 908 670 L908 760 Z" fill="#fef3ec" opacity="0.85"/>
    <path d="M928 760 L928 670 Q966 620 1004 670 L1004 760 Z" fill="#fef3ec" opacity="0.85"/>
  </g>

  <!-- House D (far right, partly cropped on card) -->
  <g opacity="0.88">
    <rect x="1050" y="400" width="200" height="360" fill="url(#houseA)"/>
    <polygon points="1040,400 1260,400 1240,362 1060,362" fill="#5c2a1a"/>
    <rect x="1082" y="442" width="44" height="76" fill="#1a0e0e" opacity="0.75"/>
    <rect x="1140" y="442" width="44" height="76" fill="#1a0e0e" opacity="0.75"/>
    <rect x="1198" y="442" width="44" height="76" fill="#1a0e0e" opacity="0.75"/>
    <rect x="1060" y="630" width="190" height="130" fill="#1a0e0e" opacity="0.55"/>
    <path d="M1080 760 L1080 678 Q1115 628 1150 678 L1150 760 Z" fill="#fef3ec" opacity="0.82"/>
    <path d="M1170 760 L1170 678 Q1205 628 1240 678 L1240 760 Z" fill="#fef3ec" opacity="0.82"/>
  </g>

  <!-- Street foreground -->
  <rect x="0" y="760" width="1600" height="140" fill="#1a0e0e" opacity="0.7"/>
  <rect x="0" y="760" width="1600" height="6" fill="#fbbf24" opacity="0.35"/>
</svg>
