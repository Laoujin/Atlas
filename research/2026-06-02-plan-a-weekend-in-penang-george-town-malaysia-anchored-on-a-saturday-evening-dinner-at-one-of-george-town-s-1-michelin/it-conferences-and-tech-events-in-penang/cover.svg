<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="panel3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centered on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: Hero — stacked conference panels with network overlay -->
  <!-- Back panel (deepest, offset top-left) -->
  <rect x="290" y="190" width="780" height="480" rx="18"
        fill="url(#panel1)" opacity="0.7"
        transform="rotate(-6, 680, 430)"/>

  <!-- Mid panel -->
  <rect x="320" y="200" width="780" height="480" rx="18"
        fill="url(#panel2)" opacity="0.8"
        transform="rotate(-2, 710, 440)"/>

  <!-- Front panel (hero face) -->
  <rect x="350" y="210" width="780" height="480" rx="18"
        fill="url(#panel3)" opacity="0.85"
        transform="rotate(2, 740, 450)"/>

  <!-- Subtle horizontal bar lines on front panel suggesting slide content -->
  <rect x="390" y="295" width="480" height="14" rx="4" fill="#fbbf24" opacity="0.22" transform="rotate(2, 740, 450)"/>
  <rect x="390" y="333" width="360" height="10" rx="4" fill="#fbbf24" opacity="0.15" transform="rotate(2, 740, 450)"/>
  <rect x="390" y="390" width="420" height="10" rx="4" fill="#fbbf24" opacity="0.15" transform="rotate(2, 740, 450)"/>
  <rect x="390" y="420" width="300" height="10" rx="4" fill="#fbbf24" opacity="0.12" transform="rotate(2, 740, 450)"/>

  <!-- Network nodes and edges (right side, bleeding into safe zone edge) -->
  <!-- Edges first so nodes sit on top -->
  <line x1="800" y1="450" x2="990" y2="310" stroke="#fbbf24" stroke-width="2" opacity="0.35"/>
  <line x1="800" y1="450" x2="1050" y2="480" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="450" x2="950" y2="590" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <line x1="990" y1="310" x2="1050" y2="480" stroke="#c2410c" stroke-width="1.5" opacity="0.25"/>
  <line x1="1050" y1="480" x2="950" y2="590" stroke="#c2410c" stroke-width="1.5" opacity="0.25"/>
  <line x1="990" y1="310" x2="1120" y2="340" stroke="#d97706" stroke-width="1.5" opacity="0.2"/>

  <!-- Peripheral nodes -->
  <circle cx="990" cy="310" r="14" fill="#c2410c" opacity="0.85"/>
  <circle cx="990" cy="310" r="7"  fill="#fbbf24" opacity="0.9"/>
  <circle cx="1050" cy="480" r="14" fill="#9a3309" opacity="0.85"/>
  <circle cx="1050" cy="480" r="7"  fill="#d97706" opacity="0.9"/>
  <circle cx="950" cy="590" r="12" fill="#78350f" opacity="0.85"/>
  <circle cx="950" cy="590" r="6"  fill="#c2410c" opacity="0.9"/>
  <circle cx="1120" cy="340" r="10" fill="#9a3309" opacity="0.75"/>
  <circle cx="1120" cy="340" r="5"  fill="#fbbf24" opacity="0.8"/>

  <!-- Central hub node -->
  <circle cx="800" cy="450" r="36" fill="url(#hubglow)" opacity="0.95"/>
  <circle cx="800" cy="450" r="18" fill="#fbbf24" opacity="0.85"/>
  <circle cx="800" cy="450" r="9"  fill="#78350f" opacity="0.9"/>

  <!-- Layer 3: Corner accents (decorative, will be variably cropped) -->
  <circle cx="0" cy="0" r="220" fill="#c2410c" opacity="0.07"/>
  <circle cx="1600" cy="900" r="260" fill="#d97706" opacity="0.06"/>
</svg>
