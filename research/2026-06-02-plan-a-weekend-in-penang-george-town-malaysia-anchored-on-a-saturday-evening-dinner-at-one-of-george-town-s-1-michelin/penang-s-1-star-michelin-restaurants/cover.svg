<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#2a0e08" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>

    <!-- Plate surface gradient -->
    <radialGradient id="plateMain" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f0eadb" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Second plate gradient (slightly cooler tint) -->
    <radialGradient id="plateSecond" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#f0eadb" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.20"/>
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="92%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.80"/>
    </radialGradient>

    <!-- Rose accent glow (secondary hue) -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm table glow beneath plates -->
    <radialGradient id="tableGlow" cx="50%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Wine glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.50"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Subtle warm table-surface glow -->
  <ellipse cx="800" cy="560" rx="680" ry="220" fill="url(#tableGlow)"/>

  <!-- Rose atmospheric halo behind plates -->
  <ellipse cx="800" cy="430" rx="420" ry="380" fill="url(#roseGlow)"/>

  <!-- Layer 2: Hero element — two overlapping plates + wine glass -->

  <!-- Wine glass stem + base (behind plates) -->
  <!-- Base -->
  <ellipse cx="800" cy="700" rx="68" ry="14" fill="url(#glassGrad)" opacity="0.70"/>
  <!-- Stem -->
  <rect x="793" y="560" width="14" height="142" rx="7" fill="url(#glassGrad)" opacity="0.65"/>
  <!-- Bowl (tapered trapezoid path) -->
  <path d="M748,370 Q756,420 762,470 Q776,530 800,540 Q824,530 838,470 Q844,420 852,370 Z"
        fill="url(#glassGrad)" opacity="0.55"/>
  <!-- Bowl rim highlight -->
  <path d="M748,370 Q800,352 852,370"
        fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.50"/>

  <!-- Back plate (slightly offset, right) -->
  <circle cx="860" cy="460" r="230" fill="url(#plateSecond)" opacity="0.78"/>
  <circle cx="860" cy="460" r="230" fill="url(#plateRim)" opacity="0.70"/>
  <!-- Inner well of back plate -->
  <circle cx="860" cy="460" r="168" fill="none" stroke="#d97706" stroke-width="2" opacity="0.35"/>

  <!-- Front plate (hero, slightly left and forward) -->
  <circle cx="740" cy="470" r="248" fill="url(#plateMain)" opacity="0.92"/>
  <circle cx="740" cy="470" r="248" fill="url(#plateRim)" opacity="0.75"/>
  <!-- Inner well of front plate -->
  <circle cx="740" cy="470" r="180" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.40"/>
  <!-- Subtle food dot accent — small rose garnish shape on front plate -->
  <circle cx="740" cy="458" r="22" fill="#be185d" opacity="0.55"/>
  <circle cx="740" cy="458" r="13" fill="#9a3309" opacity="0.65"/>

  <!-- Layer 3: Edge decorations (Peranakan-esque leaf motifs, outside safe zone) -->
  <!-- Top-left corner leaf pair -->
  <ellipse cx="60" cy="60" rx="55" ry="25" fill="#78350f" opacity="0.45" transform="rotate(-35 60 60)"/>
  <ellipse cx="100" cy="30" rx="45" ry="18" fill="#9a3309" opacity="0.35" transform="rotate(-55 100 30)"/>

  <!-- Top-right corner leaf pair -->
  <ellipse cx="1540" cy="55" rx="55" ry="25" fill="#78350f" opacity="0.45" transform="rotate(35 1540 55)"/>
  <ellipse cx="1500" cy="28" rx="45" ry="18" fill="#9a3309" opacity="0.35" transform="rotate(55 1500 28)"/>

  <!-- Bottom-left corner leaf pair -->
  <ellipse cx="65" cy="845" rx="52" ry="22" fill="#78350f" opacity="0.40" transform="rotate(30 65 845)"/>
  <ellipse cx="105" cy="875" rx="40" ry="16" fill="#9a3309" opacity="0.30" transform="rotate(50 105 875)"/>

  <!-- Bottom-right corner leaf pair -->
  <ellipse cx="1535" cy="848" rx="52" ry="22" fill="#78350f" opacity="0.40" transform="rotate(-30 1535 848)"/>
  <ellipse cx="1495" cy="876" rx="40" ry="16" fill="#9a3309" opacity="0.30" transform="rotate(-50 1495 876)"/>

  <!-- Subtle full-bleed vignette to seal edges -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="65%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
