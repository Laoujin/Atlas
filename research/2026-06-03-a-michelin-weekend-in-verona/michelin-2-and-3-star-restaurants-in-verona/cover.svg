<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm candlelight radial glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Left plate gradient -->
    <radialGradient id="plateLeft" cx="38%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Right plate gradient -->
    <radialGradient id="plateRight" cx="62%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Wine glass fill gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.60"/>
    </linearGradient>

    <!-- Wine liquid gradient -->
    <radialGradient id="wineGrad" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.70"/>
    </radialGradient>

    <!-- Rim highlight -->
    <radialGradient id="rimHighlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Candlelight ambient glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — two plates + wine glass, centered ~(800, 460) -->

  <!-- Left plate: circle centered at (620, 490), r=175 -->
  <circle cx="620" cy="490" r="175" fill="url(#plateLeft)" opacity="0.92"/>
  <!-- Left plate rim ring -->
  <circle cx="620" cy="490" r="175" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.45"/>
  <!-- Left plate inner ring suggestion -->
  <circle cx="620" cy="490" r="135" fill="none" stroke="#d97706" stroke-width="2" opacity="0.30"/>

  <!-- Right plate: circle centered at (980, 490), r=175 -->
  <circle cx="980" cy="490" r="175" fill="url(#plateRight)" opacity="0.92"/>
  <!-- Right plate rim ring -->
  <circle cx="980" cy="490" r="175" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.45"/>
  <!-- Right plate inner ring suggestion -->
  <circle cx="980" cy="490" r="135" fill="none" stroke="#d97706" stroke-width="2" opacity="0.30"/>

  <!-- Wine glass silhouette centered at (800, 370) -->
  <!-- Bowl: ellipse suggesting a filled wine glass bowl -->
  <ellipse cx="800" cy="350" rx="68" ry="80" fill="url(#glassGrad)" opacity="0.88"/>
  <!-- Wine level inside bowl (lower portion filled with wine) -->
  <ellipse cx="800" cy="400" rx="62" ry="32" fill="url(#wineGrad)" opacity="0.90"/>
  <!-- Stem: thin rect -->
  <rect x="793" y="428" width="14" height="115" rx="5" fill="#78350f" opacity="0.80"/>
  <!-- Base: flat ellipse -->
  <ellipse cx="800" cy="545" rx="55" ry="12" fill="#78350f" opacity="0.75"/>
  <!-- Glass bowl outline / highlight -->
  <ellipse cx="800" cy="350" rx="68" ry="80" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.35"/>
  <!-- Rim highlight arc at top of bowl -->
  <ellipse cx="800" cy="275" rx="68" ry="12" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.40"/>

  <!-- Michelin star accents: three small 6-pointed stars above the hero -->
  <!-- Star 1: centered at (720, 185) -->
  <polygon points="720,168 724,180 737,180 727,188 731,200 720,193 709,200 713,188 703,180 716,180" fill="#fbbf24" opacity="0.85"/>
  <!-- Star 2: centered at (800, 175) -->
  <polygon points="800,158 804,170 817,170 807,178 811,190 800,183 789,190 793,178 783,170 796,170" fill="#fbbf24" opacity="0.90"/>
  <!-- Star 3: centered at (880, 185) -->
  <polygon points="880,168 884,180 897,180 887,188 891,200 880,193 869,200 873,188 863,180 876,180" fill="#fbbf24" opacity="0.85"/>

  <!-- Layer 3: Edge decorations (may be cropped — carry no meaning) -->
  <!-- Bottom full-bleed shadow fade -->
  <rect x="0" y="720" width="1600" height="180" fill="#1a0e0e" opacity="0.55"/>
  <!-- Top vignette -->
  <rect x="0" y="0" width="1600" height="120" fill="#1a0e0e" opacity="0.45"/>
  <!-- Left edge vignette -->
  <rect x="0" y="0" width="90" height="900" fill="#1a0e0e" opacity="0.35"/>
  <!-- Right edge vignette -->
  <rect x="1510" y="0" width="90" height="900" fill="#1a0e0e" opacity="0.35"/>
</svg>
