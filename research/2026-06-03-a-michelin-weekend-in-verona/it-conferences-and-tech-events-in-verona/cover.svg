<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>

    <!-- Central spotlight radial -->
    <radialGradient id="spotlight" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Podium face gradient -->
    <linearGradient id="podiumFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Podium top gradient -->
    <linearGradient id="podiumTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Screen gradient -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Stage floor gradient -->
    <linearGradient id="stageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Spotlight wash -->
  <rect width="1600" height="900" fill="url(#spotlight)"/>

  <!-- Auditorium arc suggestion — faint curves at bottom edges, decorative -->
  <ellipse cx="800" cy="980" rx="920" ry="300" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.18"/>
  <ellipse cx="800" cy="1040" rx="1080" ry="360" fill="none" stroke="#78350f" stroke-width="1" stroke-opacity="0.10"/>

  <!-- Layer 2: Hero element — stage + podium + presentation screen -->

  <!-- Stage platform -->
  <rect x="480" y="620" width="640" height="28" rx="4" fill="url(#stageFloor)" opacity="0.85"/>
  <rect x="430" y="640" width="740" height="12" rx="3" fill="#78350f" opacity="0.5"/>

  <!-- Presentation screen (back wall) -->
  <rect x="560" y="220" width="480" height="290" rx="6" fill="url(#screen)" opacity="0.80"/>
  <!-- Screen inner highlight bar — suggests slide content, purely decorative -->
  <rect x="588" y="248" width="380" height="14" rx="3" fill="#c2410c" opacity="0.45"/>
  <rect x="588" y="276" width="280" height="10" rx="3" fill="#9a3309" opacity="0.35"/>
  <rect x="588" y="300" width="320" height="10" rx="3" fill="#9a3309" opacity="0.30"/>
  <rect x="588" y="324" width="200" height="10" rx="3" fill="#9a3309" opacity="0.25"/>

  <!-- Screen frame -->
  <rect x="560" y="220" width="480" height="290" rx="6" fill="none" stroke="#d97706" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Podium body -->
  <polygon points="730,510 870,510 850,622 750,622" fill="url(#podiumFace)" opacity="0.92"/>
  <!-- Podium top surface -->
  <rect x="718" y="498" width="164" height="20" rx="4" fill="url(#podiumTop)" opacity="0.95"/>
  <!-- Podium mic stand — thin vertical line -->
  <line x1="800" y1="498" x2="800" y2="458" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.75"/>
  <!-- Mic head -->
  <ellipse cx="800" cy="450" rx="10" ry="13" fill="#d97706" opacity="0.90"/>

  <!-- Radiating spokes from podium to network nodes -->
  <!-- Spoke 1: upper-left -->
  <line x1="800" y1="450" x2="290" y2="195" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Spoke 2: upper-right -->
  <line x1="800" y1="450" x2="1310" y2="195" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Spoke 3: mid-left -->
  <line x1="800" y1="450" x2="195" y2="420" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.28"/>
  <!-- Spoke 4: mid-right -->
  <line x1="800" y1="450" x2="1405" y2="420" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.28"/>
  <!-- Spoke 5: lower-left -->
  <line x1="800" y1="450" x2="350" y2="690" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.22"/>
  <!-- Spoke 6: lower-right -->
  <line x1="800" y1="450" x2="1250" y2="690" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.22"/>

  <!-- Node glows at spoke ends (inside or near safe zone) -->
  <!-- Node upper-left -->
  <circle cx="290" cy="195" r="26" fill="url(#nodeGlow)" opacity="0.7"/>
  <circle cx="290" cy="195" r="11" fill="#d97706" opacity="0.85"/>
  <!-- Node upper-right -->
  <circle cx="1310" cy="195" r="26" fill="url(#nodeGlow)" opacity="0.7"/>
  <circle cx="1310" cy="195" r="11" fill="#d97706" opacity="0.85"/>
  <!-- Node mid-left -->
  <circle cx="195" cy="420" r="20" fill="url(#nodeGlow)" opacity="0.55"/>
  <circle cx="195" cy="420" r="8" fill="#c2410c" opacity="0.80"/>
  <!-- Node mid-right -->
  <circle cx="1405" cy="420" r="20" fill="url(#nodeGlow)" opacity="0.55"/>
  <circle cx="1405" cy="420" r="8" fill="#c2410c" opacity="0.80"/>
  <!-- Node lower-left -->
  <circle cx="350" cy="690" r="18" fill="url(#nodeGlow)" opacity="0.45"/>
  <circle cx="350" cy="690" r="7" fill="#9a3309" opacity="0.75"/>
  <!-- Node lower-right -->
  <circle cx="1250" cy="690" r="18" fill="url(#nodeGlow)" opacity="0.45"/>
  <circle cx="1250" cy="690" r="7" fill="#9a3309" opacity="0.75"/>

  <!-- Layer 3: Edge decoration — corner rust accents, fully outside safe zone or at boundary -->
  <!-- Top-left corner bracket -->
  <polyline points="30,30 30,110 110,110" fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.30"/>
  <!-- Top-right corner bracket -->
  <polyline points="1570,30 1570,110 1490,110" fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.30"/>
  <!-- Bottom-left corner bracket -->
  <polyline points="30,870 30,790 110,790" fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.30"/>
  <!-- Bottom-right corner bracket -->
  <polyline points="1570,870 1570,790 1490,790" fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.30"/>
</svg>
