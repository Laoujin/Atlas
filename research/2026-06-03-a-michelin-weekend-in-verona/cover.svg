<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0608"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1408"/>
    </linearGradient>
    <!-- Warm glow behind arch opening -->
    <radialGradient id="glowInner" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient warm horizon glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Stone texture gradient for pillars -->
    <linearGradient id="pillarLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="45%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1408"/>
    </linearGradient>
    <linearGradient id="pillarRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b1408"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Arch stone gradient -->
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Plate gradient -->
    <radialGradient id="plateGrad" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b0"/>
    </radialGradient>
    <!-- Food accent on plate -->
    <radialGradient id="foodGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Candlelight glow on table -->
    <radialGradient id="candleGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Horizon warm glow -->
  <rect width="1600" height="900" fill="url(#horizonGlow)"/>

  <!-- Stars — decorative, outside safe zone emphasis, scattered across sky -->
  <circle cx="200" cy="80" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="380" cy="55" r="1" fill="#fef3ec" opacity="0.5"/>
  <circle cx="620" cy="70" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="820" cy="45" r="1" fill="#fef3ec" opacity="0.6"/>
  <circle cx="1050" cy="65" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1280" cy="50" r="1" fill="#fef3ec" opacity="0.4"/>
  <circle cx="1480" cy="78" r="1.5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="950" cy="88" r="1" fill="#fef3ec" opacity="0.35"/>
  <circle cx="460" cy="110" r="1" fill="#fbbf24" opacity="0.3"/>
  <circle cx="1150" cy="95" r="1" fill="#fef3ec" opacity="0.3"/>

  <!-- Layer 2: Warm glow fill behind arch -->
  <rect width="1600" height="900" fill="url(#glowInner)"/>

  <!-- Layer 3: Hero — Roman arch silhouette -->

  <!-- Ground base / floor line -->
  <rect x="300" y="768" width="1000" height="18" rx="2" fill="#5c2a1a" opacity="0.85"/>

  <!-- Left pillar -->
  <rect x="430" y="220" width="145" height="548" fill="url(#pillarLeft)" opacity="0.92"/>
  <!-- Left pillar capital detail -->
  <rect x="418" y="210" width="169" height="22" rx="3" fill="#9a3309" opacity="0.9"/>
  <!-- Left pillar base detail -->
  <rect x="415" y="756" width="175" height="14" rx="2" fill="#9a3309" opacity="0.85"/>

  <!-- Right pillar -->
  <rect x="1025" y="220" width="145" height="548" fill="url(#pillarRight)" opacity="0.92"/>
  <!-- Right pillar capital detail -->
  <rect x="1013" y="210" width="169" height="22" rx="3" fill="#9a3309" opacity="0.9"/>
  <!-- Right pillar base detail -->
  <rect x="1010" y="756" width="175" height="14" rx="2" fill="#9a3309" opacity="0.85"/>

  <!-- Arch ring — drawn as thick path arc -->
  <!-- Outer arch: semicircle from left pillar top-center to right pillar top-center -->
  <!-- Center of arch: x=800, top of pillars y=220, arch spans 575px radius -->
  <path d="M 430 232 A 370 370 0 0 1 1170 232" stroke="url(#archGrad)" stroke-width="90" fill="none" opacity="0.93" stroke-linecap="butt"/>

  <!-- Arch inner shadow / depth line -->
  <path d="M 455 238 A 345 345 0 0 1 1145 238" stroke="#78350f" stroke-width="18" fill="none" opacity="0.5" stroke-linecap="butt"/>
  <path d="M 490 244 A 310 310 0 0 1 1110 244" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.18" stroke-linecap="butt"/>

  <!-- Candle flame glow above table (inside arch) -->
  <ellipse cx="800" cy="660" rx="90" ry="70" fill="url(#candleGlow)" opacity="0.85"/>

  <!-- Dining table surface suggestion -->
  <ellipse cx="800" cy="745" rx="220" ry="22" fill="#3b1408" opacity="0.75"/>
  <ellipse cx="800" cy="740" rx="210" ry="14" fill="#5c2a1a" opacity="0.6"/>

  <!-- Plate on table -->
  <ellipse cx="800" cy="710" rx="72" ry="16" fill="#3b1408" opacity="0.35"/>
  <circle cx="800" cy="698" r="64" fill="url(#plateGrad)" opacity="0.95"/>
  <!-- Plate rim ring -->
  <circle cx="800" cy="698" r="64" fill="none" stroke="#d6c9b0" stroke-width="5" opacity="0.6"/>
  <circle cx="800" cy="698" r="54" fill="none" stroke="#e8dcc8" stroke-width="1.5" opacity="0.4"/>
  <!-- Food element on plate — elegant abstract dot composition -->
  <circle cx="800" cy="695" r="22" fill="url(#foodGrad)" opacity="0.88"/>
  <circle cx="800" cy="695" r="10" fill="#fbbf24" opacity="0.55"/>
  <!-- Sauce swirl suggestion — two small arcs -->
  <path d="M 782 685 Q 793 675 808 688" stroke="#c2410c" stroke-width="3.5" fill="none" opacity="0.65" stroke-linecap="round"/>
  <path d="M 790 706 Q 805 716 818 704" stroke="#9a3309" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Candle stick -->
  <rect x="795" y="630" width="10" height="34" rx="2" fill="#fef3ec" opacity="0.75"/>
  <!-- Candle flame -->
  <ellipse cx="800" cy="625" rx="6" ry="10" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="800" cy="621" rx="3" ry="6" fill="#fef3ec" opacity="0.85"/>

</svg>
