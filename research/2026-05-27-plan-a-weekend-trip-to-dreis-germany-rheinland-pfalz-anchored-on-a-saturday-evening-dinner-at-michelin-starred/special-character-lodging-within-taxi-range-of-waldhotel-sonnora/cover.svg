<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="inn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed twilight sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon halo behind ridges, near top of safe zone -->
  <circle cx="1120" cy="240" r="260" fill="url(#moon)"/>
  <circle cx="1120" cy="240" r="55" fill="#fbbf24" opacity="0.85"/>

  <!-- far forest ridge -->
  <path d="M0 560 L120 520 L240 545 L360 500 L500 530 L640 495 L780 520 L920 485 L1060 515 L1200 490 L1340 520 L1460 495 L1600 515 L1600 900 L0 900 Z" fill="url(#ridge2)" opacity="0.85"/>

  <!-- mid forest ridge with conifer tooth pattern -->
  <path d="M0 650 L60 615 L110 640 L170 600 L230 635 L290 605 L360 640 L420 610 L500 645 L570 615 L640 645 L720 610 L800 640 L880 605 L960 635 L1040 600 L1120 630 L1200 600 L1280 635 L1360 605 L1440 640 L1520 615 L1600 640 L1600 900 L0 900 Z" fill="url(#ridge1)"/>

  <!-- hero: inn silhouette centered around (800, 560), inside safe zone -->
  <!-- main body -->
  <rect x="660" y="560" width="280" height="180" fill="url(#inn)"/>
  <!-- steep gabled roof -->
  <polygon points="640,565 800,430 960,565" fill="#3a1a10"/>
  <!-- side wing -->
  <rect x="900" y="600" width="130" height="140" fill="#78350f"/>
  <polygon points="890,605 965,540 1040,605" fill="#3a1a10"/>
  <!-- left tower -->
  <rect x="600" y="500" width="60" height="240" fill="#9a3309"/>
  <polygon points="590,505 630,440 670,505" fill="#3a1a10"/>
  <!-- chimney -->
  <rect x="745" y="450" width="22" height="50" fill="#3a1a10"/>

  <!-- warm lit windows -->
  <circle cx="630" cy="600" r="40" fill="url(#glow)"/>
  <rect x="624" y="592" width="12" height="16" fill="#fbbf24"/>
  <circle cx="710" cy="630" r="35" fill="url(#glow)" opacity="0.9"/>
  <rect x="704" y="624" width="12" height="14" fill="#fbbf24"/>
  <circle cx="790" cy="630" r="35" fill="url(#glow)" opacity="0.9"/>
  <rect x="784" y="624" width="12" height="14" fill="#fbbf24"/>
  <circle cx="870" cy="630" r="35" fill="url(#glow)" opacity="0.9"/>
  <rect x="864" y="624" width="12" height="14" fill="#fbbf24"/>
  <circle cx="960" cy="660" r="30" fill="url(#glow)" opacity="0.85"/>
  <rect x="955" y="654" width="10" height="12" fill="#fbbf24"/>
  <circle cx="995" cy="660" r="30" fill="url(#glow)" opacity="0.85"/>
  <rect x="990" y="654" width="10" height="12" fill="#fbbf24"/>

  <!-- upper-floor smaller windows -->
  <rect x="704" y="690" width="10" height="14" fill="#fbbf24" opacity="0.9"/>
  <rect x="784" y="690" width="10" height="14" fill="#fbbf24" opacity="0.9"/>
  <rect x="864" y="690" width="10" height="14" fill="#fbbf24" opacity="0.9"/>

  <!-- foreground grass shadow -->
  <path d="M0 760 L1600 760 L1600 900 L0 900 Z" fill="#1a0e0e" opacity="0.85"/>
</svg>
