<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="320" r="220" fill="url(#sun)"/>

  <!-- far ridge -->
  <path d="M0,560 C160,520 280,540 420,510 C600,470 760,520 920,495 C1100,465 1280,505 1440,485 L1600,490 L1600,900 L0,900 Z" fill="url(#hillFar)"/>

  <!-- mid ridge -->
  <path d="M0,640 C180,600 320,625 500,605 C680,585 820,625 1000,610 C1180,595 1340,635 1500,615 L1600,620 L1600,900 L0,900 Z" fill="url(#hillMid)" opacity="0.92"/>

  <!-- near ridge -->
  <path d="M0,740 C200,710 380,735 580,715 C780,695 940,735 1140,720 C1320,706 1460,735 1600,720 L1600,900 L0,900 Z" fill="url(#hillNear)"/>

  <!-- 30 km radius glow -->
  <circle cx="800" cy="450" r="300" fill="url(#ringGlow)"/>

  <!-- outer ring -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="3 7" opacity="0.75"/>
  <!-- inner ring -->
  <circle cx="800" cy="450" r="210" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.55"/>

  <!-- circuit traces connecting nodes through the ring -->
  <g stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M800,450 L640,360 L520,360"/>
    <path d="M800,450 L960,380 L1080,380"/>
    <path d="M800,450 L720,580 L600,610"/>
    <path d="M800,450 L900,560 L1020,590"/>
    <path d="M800,450 L800,290"/>
  </g>

  <!-- central hub (Sonnora) -->
  <circle cx="800" cy="450" r="14" fill="#c2410c"/>
  <circle cx="800" cy="450" r="6" fill="#fbbf24"/>

  <!-- perimeter nodes (conferences/events around the radius) -->
  <g fill="#6d28d9" opacity="0.9">
    <circle cx="520" cy="360" r="8"/>
    <circle cx="1080" cy="380" r="8"/>
    <circle cx="600" cy="610" r="8"/>
    <circle cx="1020" cy="590" r="8"/>
    <circle cx="800" cy="290" r="8"/>
  </g>
  <g fill="#fbbf24" opacity="0.95">
    <circle cx="520" cy="360" r="3"/>
    <circle cx="1080" cy="380" r="3"/>
    <circle cx="600" cy="610" r="3"/>
    <circle cx="1020" cy="590" r="3"/>
    <circle cx="800" cy="290" r="3"/>
  </g>

  <!-- intermediate trace joints -->
  <g fill="#d97706" opacity="0.85">
    <circle cx="640" cy="360" r="4"/>
    <circle cx="960" cy="380" r="4"/>
    <circle cx="720" cy="580" r="4"/>
    <circle cx="900" cy="560" r="4"/>
  </g>

  <!-- compass tick on outer ring -->
  <g stroke="#c2410c" stroke-width="2" opacity="0.65">
    <line x1="800" y1="142" x2="800" y2="158"/>
    <line x1="800" y1="742" x2="800" y2="758"/>
    <line x1="492" y1="450" x2="508" y2="450"/>
    <line x1="1092" y1="450" x2="1108" y2="450"/>
  </g>
</svg>
