<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun disc (hero focal, centered in safe zone) -->
  <circle cx="820" cy="430" r="320" fill="url(#sun)"/>
  <circle cx="820" cy="430" r="155" fill="#fbbf24" opacity="0.92"/>
  <circle cx="820" cy="430" r="155" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.5"/>

  <!-- distant Hai Van mountain ridge -->
  <path d="M 0 540 L 180 470 L 320 510 L 470 440 L 640 490 L 780 430 L 920 470 L 1080 410 L 1240 460 L 1400 420 L 1600 470 L 1600 600 L 0 600 Z"
        fill="#9a3309" opacity="0.75"/>

  <!-- near headland (Son Tra peninsula silhouette) -->
  <path d="M 0 640 L 120 580 L 280 610 L 420 555 L 560 595 L 700 545 L 760 560 L 760 700 L 0 700 Z"
        fill="url(#ridge)" opacity="0.95"/>

  <!-- Lady Buddha pagoda silhouette atop the headland -->
  <g opacity="0.95" fill="#1a0e0e">
    <!-- pedestal -->
    <rect x="688" y="545" width="24" height="18"/>
    <!-- robe body -->
    <path d="M 684 545 Q 700 470 716 545 Z"/>
    <!-- head -->
    <circle cx="700" cy="468" r="9"/>
    <!-- halo accent -->
    <circle cx="700" cy="468" r="14" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- sea -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#sea)"/>

  <!-- sun reflection on water -->
  <ellipse cx="820" cy="720" rx="170" ry="6" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="820" cy="745" rx="120" ry="4" fill="#fbbf24" opacity="0.45"/>
  <ellipse cx="820" cy="770" rx="80" ry="3" fill="#fbbf24" opacity="0.3"/>
  <ellipse cx="820" cy="795" rx="50" ry="2" fill="#fbbf24" opacity="0.2"/>

  <!-- floating lantern (Hoi An nod) inside safe zone -->
  <g opacity="0.9">
    <ellipse cx="1180" cy="380" rx="22" ry="28" fill="#c2410c"/>
    <ellipse cx="1180" cy="380" rx="22" ry="28" fill="url(#sun)" opacity="0.6"/>
    <line x1="1180" y1="408" x2="1180" y2="420" stroke="#78350f" stroke-width="1.5"/>
    <line x1="1180" y1="352" x2="1180" y2="340" stroke="#78350f" stroke-width="1.5"/>
  </g>
  <g opacity="0.8">
    <ellipse cx="1280" cy="320" rx="16" ry="20" fill="#d97706"/>
    <line x1="1280" y1="340" x2="1280" y2="350" stroke="#78350f" stroke-width="1.2"/>
  </g>
  <g opacity="0.75">
    <ellipse cx="430" cy="350" rx="18" ry="22" fill="#c2410c"/>
    <line x1="430" y1="372" x2="430" y2="384" stroke="#78350f" stroke-width="1.2"/>
  </g>
</svg>
