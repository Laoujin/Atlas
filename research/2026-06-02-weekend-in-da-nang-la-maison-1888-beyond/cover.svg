<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2e1108"/>
      <stop offset="100%" stop-color="#0d0707"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient — warm ivory rim -->
    <radialGradient id="plate1" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="72%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Plate inner well -->
    <radialGradient id="well1" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#2e1108"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <!-- Rose accent gradient for sauce arc -->
    <linearGradient id="sauceArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.0"/>
      <stop offset="40%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Rim highlight -->
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow centered -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centered plate with wine glass -->

  <!-- Main plate (large, centered) -->
  <ellipse cx="800" cy="470" rx="310" ry="295" fill="url(#plate1)" opacity="0.93"/>
  <!-- Plate inner rim shadow ring -->
  <ellipse cx="800" cy="470" rx="278" ry="264" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.35"/>
  <!-- Plate well (dark center — food presentation area) -->
  <ellipse cx="800" cy="462" rx="220" ry="208" fill="url(#well1)" opacity="0.88"/>

  <!-- Sauce smear arc — rose accent, artistic brush stroke feel -->
  <path d="M 640 388 Q 780 330 930 400" fill="none" stroke="url(#sauceArc)" stroke-width="18" stroke-linecap="round" opacity="0.70"/>
  <!-- Micro sauce dot cluster -->
  <circle cx="920" cy="402" r="7" fill="#be185d" opacity="0.65"/>
  <circle cx="938" cy="392" r="4" fill="#be185d" opacity="0.45"/>
  <circle cx="908" cy="415" r="5" fill="#d97706" opacity="0.55"/>

  <!-- Herb garnish suggestion — two simple leaf strokes -->
  <path d="M 775 415 Q 790 395 808 410" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round" opacity="0.80"/>
  <path d="M 808 410 Q 825 395 840 415" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round" opacity="0.70"/>

  <!-- Wine glass silhouette (right of plate, inside safe zone) -->
  <!-- Bowl (ellipse top) -->
  <ellipse cx="1085" cy="355" rx="58" ry="72" fill="url(#glassGrad)" opacity="0.82"/>
  <!-- Bowl lower curve merging to stem -->
  <path d="M 1027 355 Q 1028 435 1085 448 Q 1142 435 1143 355" fill="url(#glassGrad)" opacity="0.55"/>
  <!-- Stem -->
  <rect x="1081" y="446" width="8" height="110" rx="4" fill="#fbbf24" opacity="0.65"/>
  <!-- Base -->
  <ellipse cx="1085" cy="562" rx="42" ry="9" fill="#d97706" opacity="0.60"/>
  <!-- Glass interior highlight -->
  <ellipse cx="1072" cy="340" rx="18" ry="30" fill="#fef3ec" opacity="0.18"/>

  <!-- Second plate — smaller, left of hero, partially overlapping -->
  <ellipse cx="545" cy="505" rx="175" ry="166" fill="url(#plate1)" opacity="0.72"/>
  <ellipse cx="545" cy="505" rx="155" ry="147" fill="none" stroke="#c2410c" stroke-width="4" opacity="0.28"/>
  <ellipse cx="545" cy="500" rx="122" ry="116" fill="url(#well1)" opacity="0.78"/>
  <!-- Small sauce dot on second plate -->
  <circle cx="530" cy="475" r="14" fill="#be185d" opacity="0.42"/>
  <circle cx="562" cy="460" r="8" fill="#d97706" opacity="0.38"/>

  <!-- Layer 3: Decorative — full-bleed ambient arcs (outside safe zone edges) -->
  <!-- Top-left corner warm sweep -->
  <path d="M -60 0 Q 200 80 180 260" fill="none" stroke="#c2410c" stroke-width="55" stroke-linecap="round" opacity="0.09"/>
  <!-- Bottom-right warm sweep -->
  <path d="M 1660 900 Q 1400 820 1430 640" fill="none" stroke="#9a3309" stroke-width="55" stroke-linecap="round" opacity="0.09"/>
  <!-- Subtle rose edge bloom bottom -->
  <ellipse cx="800" cy="970" rx="600" ry="200" fill="#be185d" opacity="0.07"/>
</svg>
