<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sea background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a2a"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2a1205"/>
    </linearGradient>
    <!-- Central warm glow (candlelight / harbour glow) -->
    <radialGradient id="glow" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero disc gradient (plate / moon) -->
    <radialGradient id="disc" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.80"/>
    </radialGradient>
    <!-- Disc rim highlight -->
    <radialGradient id="discRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.30"/>
    </radialGradient>
    <!-- Left cliff gradient -->
    <linearGradient id="cliffL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Right cliff gradient -->
    <linearGradient id="cliffR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Water shimmer gradient -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1a2a" stop-opacity="0.60"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Atmospheric warm glow over sea -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Left Calanque cliff — tall angular mass -->
  <polygon points="0,900 0,280 180,220 340,310 420,480 380,620 300,900" fill="url(#cliffL)" opacity="0.90"/>

  <!-- Left cliff face highlight edge -->
  <polygon points="180,220 340,310 300,280 160,190" fill="#c2410c" opacity="0.22"/>

  <!-- Layer 2: Right Calanque cliff — mirrored mass -->
  <polygon points="1600,900 1600,200 1420,170 1260,290 1180,450 1240,660 1320,900" fill="url(#cliffR)" opacity="0.88"/>

  <!-- Right cliff face highlight edge -->
  <polygon points="1420,170 1260,290 1290,255 1450,150" fill="#d97706" opacity="0.20"/>

  <!-- Layer 2: Hero disc (moon / plate / harbour light) centered at 800,440 -->
  <!-- Outer glow ring -->
  <circle cx="800" cy="440" r="230" fill="#d97706" opacity="0.12"/>
  <circle cx="800" cy="440" r="195" fill="#c2410c" opacity="0.18"/>

  <!-- Hero disc body -->
  <circle cx="800" cy="440" r="168" fill="url(#disc)" opacity="0.93"/>

  <!-- Disc rim shimmer -->
  <circle cx="800" cy="440" r="168" fill="url(#discRim)"/>

  <!-- Inner plate well — dark inset suggesting depth -->
  <circle cx="800" cy="440" r="110" fill="#78350f" opacity="0.55"/>
  <circle cx="800" cy="440" r="108" fill="#1a0e0e" opacity="0.30"/>

  <!-- Inner well warm highlight — single arc suggestion of a rim light -->
  <circle cx="800" cy="440" r="88" fill="#d97706" opacity="0.10"/>

  <!-- Layer 3: Water reflection band at base (full-bleed, decorative) -->
  <rect x="0" y="730" width="1600" height="170" fill="url(#water)" opacity="0.70"/>

  <!-- Reflection shimmer lines — three horizontal, low opacity -->
  <rect x="200" y="762" width="480" height="3" rx="1" fill="#fbbf24" opacity="0.12"/>
  <rect x="920" y="762" width="380" height="3" rx="1" fill="#fbbf24" opacity="0.10"/>
  <rect x="340" y="800" width="280" height="2" rx="1" fill="#d97706" opacity="0.14"/>
  <rect x="980" y="800" width="220" height="2" rx="1" fill="#d97706" opacity="0.12"/>

  <!-- Disc sea reflection — ellipse below center, decorative -->
  <ellipse cx="800" cy="820" rx="120" ry="22" fill="#d97706" opacity="0.13"/>
</svg>
