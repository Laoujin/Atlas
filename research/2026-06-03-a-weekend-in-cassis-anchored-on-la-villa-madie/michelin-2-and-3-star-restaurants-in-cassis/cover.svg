<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2d1408"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm candlelight radial glow at center -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" gradientUnits="userSpaceOnUse"
                    fx="800" fy="460" cx="800" cy="460">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate gradient: warm rim, deep well -->
    <radialGradient id="plateHero" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1408"/>
      <stop offset="68%" stop-color="#3b1a0a"/>
      <stop offset="85%" stop-color="#78350f"/>
      <stop offset="93%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>

    <!-- Secondary plate gradient -->
    <radialGradient id="plateSecond" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1206"/>
      <stop offset="70%" stop-color="#331508"/>
      <stop offset="87%" stop-color="#6b2e0d"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Inner plate well highlight -->
    <radialGradient id="plateWell" cx="42%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Wine glass fill -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Star Michelin accent glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm candlelight atmosphere glow -->
  <ellipse cx="800" cy="460" rx="680" ry="480" fill="url(#glow)"/>

  <!-- Layer 2: Hero composition, safe zone x:125-1475, y:90-810 -->

  <!-- Secondary plate (left, slightly behind) -->
  <circle cx="630" cy="480" r="195" fill="url(#plateSecond)" opacity="0.82"/>
  <!-- Plate rim highlight ring -->
  <circle cx="630" cy="480" r="195" fill="none" stroke="#78350f" stroke-width="3" opacity="0.6"/>
  <circle cx="630" cy="480" r="170" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35"/>

  <!-- Hero plate (center-right, foreground) -->
  <circle cx="890" cy="450" r="248" fill="url(#plateHero)" opacity="0.95"/>
  <!-- Well highlight -->
  <circle cx="890" cy="450" r="248" fill="url(#plateWell)"/>
  <!-- Plate rim bands -->
  <circle cx="890" cy="450" r="248" fill="none" stroke="#c2410c" stroke-width="4" opacity="0.75"/>
  <circle cx="890" cy="450" r="228" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.45"/>
  <circle cx="890" cy="450" r="185" fill="none" stroke="#d97706" stroke-width="1" opacity="0.2"/>

  <!-- Wine glass silhouette (right of plates) -->
  <!-- Bowl of glass -->
  <ellipse cx="1210" cy="380" rx="55" ry="70" fill="url(#glassGrad)" opacity="0.78"/>
  <!-- Glass bowl taper to stem -->
  <path d="M1165 430 Q1180 470 1200 480 L1220 480 Q1240 470 1255 430 Z"
        fill="url(#glassGrad)" opacity="0.72"/>
  <!-- Stem -->
  <rect x="1204" y="480" width="12" height="95" rx="6" fill="#be185d" opacity="0.55"/>
  <!-- Base -->
  <ellipse cx="1210" cy="578" rx="42" ry="9" fill="#9a3309" opacity="0.6"/>
  <!-- Wine fill inside bowl -->
  <ellipse cx="1210" cy="400" rx="44" ry="36" fill="#be185d" opacity="0.35"/>

  <!-- Michelin star accent above hero plate (three small stars, felt not spelled) -->
  <!-- Star 1 (center, brightest) -->
  <circle cx="890" cy="178" r="11" fill="url(#starGlow)" opacity="0.92"/>
  <circle cx="890" cy="178" r="5" fill="#fbbf24" opacity="0.95"/>
  <!-- Star 2 (left) -->
  <circle cx="844" cy="184" r="7" fill="url(#starGlow)" opacity="0.72"/>
  <circle cx="844" cy="184" r="3.5" fill="#fbbf24" opacity="0.8"/>
  <!-- Star 3 (right) -->
  <circle cx="936" cy="184" r="7" fill="url(#starGlow)" opacity="0.72"/>
  <circle cx="936" cy="184" r="3.5" fill="#fbbf24" opacity="0.8"/>

  <!-- Layer 3: Edge atmosphere (outside safe zone, decorative only) -->
  <!-- Top-left corner vignette warmth -->
  <radialGradient id="cornerTL" cx="0%" cy="0%" r="60%" gradientUnits="userSpaceOnUse"
                  fx="0" fy="0" cx="0" cy="0">
    <stop offset="0%" stop-color="#9a3309" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="320" fill="url(#cornerTL)"/>

  <!-- Bottom edge warm ground -->
  <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3b1206" stop-opacity="0.55"/>
  </linearGradient>
  <rect y="700" width="1600" height="200" fill="url(#groundFade)"/>
</svg>
