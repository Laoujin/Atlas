<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm radial wash behind hub -->
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- orbit rings -->
  <circle cx="800" cy="450" r="200" fill="none" stroke="#9a3309" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="800" cy="450" r="310" fill="none" stroke="#9a3309" stroke-opacity="0.2" stroke-width="2"/>

  <!-- spokes to destination nodes -->
  <g stroke="#c2410c" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round">
    <line x1="800" y1="450" x2="540" y2="280"/>
    <line x1="800" y1="450" x2="1075" y2="295"/>
    <line x1="800" y1="450" x2="1140" y2="560"/>
    <line x1="800" y1="450" x2="560" y2="610"/>
    <line x1="800" y1="450" x2="800" y2="180"/>
  </g>

  <!-- destination nodes (cities/sites around Duffel) -->
  <g>
    <circle cx="540" cy="280" r="22" fill="#9a3309" opacity="0.9"/>
    <circle cx="1075" cy="295" r="26" fill="#c2410c" opacity="0.9"/>
    <circle cx="1140" cy="560" r="18" fill="#78350f" opacity="0.85"/>
    <circle cx="560" cy="610" r="20" fill="#9a3309" opacity="0.85"/>
    <circle cx="800" cy="180" r="16" fill="#d97706" opacity="0.9"/>
  </g>

  <!-- secondary tiny satellite dots (forts / breweries) -->
  <g fill="#78350f" opacity="0.55">
    <circle cx="660" cy="360" r="5"/>
    <circle cx="950" cy="360" r="5"/>
    <circle cx="970" cy="555" r="5"/>
    <circle cx="650" cy="540" r="5"/>
  </g>

  <!-- central hub disc (Nuance / Duffel) -->
  <circle cx="800" cy="450" r="78" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="78" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2"/>

  <!-- hero: belfry/tower silhouette rising from hub (St. Rumbold / Zimmertoren motif) -->
  <g>
    <!-- tower shaft -->
    <rect x="762" y="250" width="76" height="200" fill="url(#tower)"/>
    <!-- tapered top -->
    <polygon points="762,250 838,250 820,210 780,210" fill="#78350f"/>
    <!-- spire -->
    <polygon points="780,210 820,210 800,140" fill="#9a3309"/>
    <!-- crown finial -->
    <circle cx="800" cy="132" r="6" fill="#fbbf24"/>
    <!-- narrow window slits -->
    <rect x="790" y="290" width="20" height="34" fill="#1a0e0e" opacity="0.55"/>
    <rect x="790" y="350" width="20" height="34" fill="#1a0e0e" opacity="0.55"/>
    <!-- base shadow on hub -->
    <ellipse cx="800" cy="455" rx="60" ry="10" fill="#1a0e0e" opacity="0.18"/>
  </g>

  <!-- subtle compass tick marks on outer orbit, low opacity -->
  <g stroke="#9a3309" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <line x1="800" y1="135" x2="800" y2="155"/>
    <line x1="1120" y1="450" x2="1100" y2="450"/>
    <line x1="800" y1="765" x2="800" y2="745"/>
    <line x1="480" y1="450" x2="500" y2="450"/>
  </g>
</svg>
