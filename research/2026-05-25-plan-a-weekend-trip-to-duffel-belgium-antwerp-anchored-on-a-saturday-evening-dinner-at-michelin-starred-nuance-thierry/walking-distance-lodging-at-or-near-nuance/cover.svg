<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.78"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1180" cy="450" rx="520" ry="360" fill="url(#glow)"/>

  <!-- faint path of dashes connecting the lodging (left) to the plate (right) -->
  <path d="M 470 540 Q 800 600 1180 470" stroke="#fbbf24" stroke-width="3" stroke-dasharray="2 22" fill="none" opacity="0.55"/>

  <!-- LODGING: pitched-roof building, left side, set apart -->
  <g opacity="0.94">
    <rect x="360" y="430" width="220" height="170" fill="url(#wall)"/>
    <polygon points="350,432 470,330 590,432" fill="url(#roof)"/>
    <rect x="395" y="475" width="40" height="55" fill="#1a0e0e" opacity="0.7"/>
    <rect x="500" y="475" width="40" height="55" fill="#1a0e0e" opacity="0.7"/>
    <rect x="445" y="540" width="50" height="60" fill="#78350f"/>
    <rect x="455" y="370" width="22" height="55" fill="#78350f" opacity="0.85"/>
  </g>

  <!-- PLATE + STAR: the destination, right side -->
  <g opacity="0.95">
    <circle cx="1180" cy="450" r="200" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
    <circle cx="1180" cy="450" r="160" fill="url(#plate)" opacity="0.88"/>
    <circle cx="1180" cy="450" r="120" fill="#1a0e0e" opacity="0.35"/>
    <!-- five-point star centered at (1180, 450) -->
    <polygon points="1180,375 1198,432 1258,432 1210,468 1228,525 1180,490 1132,525 1150,468 1102,432 1162,432" fill="#fbbf24"/>
  </g>

  <!-- decorative corner accents (outside safe zone, croppable) -->
  <circle cx="80" cy="80" r="6" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1540" cy="840" r="6" fill="#fbbf24" opacity="0.5"/>
</svg>
