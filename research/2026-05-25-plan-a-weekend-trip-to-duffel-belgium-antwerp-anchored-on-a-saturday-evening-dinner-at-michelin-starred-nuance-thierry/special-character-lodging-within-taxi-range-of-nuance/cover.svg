<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm aura behind the building -->
  <ellipse cx="800" cy="560" rx="780" ry="320" fill="url(#glow)" opacity="0.7"/>

  <!-- distant left wing silhouette -->
  <path d="M 180 820 L 180 600 L 320 600 L 320 540 L 460 540 L 460 820 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- distant right wing silhouette -->
  <path d="M 1140 820 L 1140 560 L 1280 560 L 1280 620 L 1420 620 L 1420 820 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- central heritage tower (Mechelen-inspired stepped silhouette) -->
  <path d="M 560 820
           L 560 460
           L 600 460
           L 600 380
           L 640 380
           L 640 280
           L 720 200
           L 800 160
           L 880 200
           L 960 280
           L 960 380
           L 1000 380
           L 1000 460
           L 1040 460
           L 1040 820 Z"
        fill="url(#facade)"/>

  <!-- tower spire cross-bar shadow -->
  <rect x="780" y="170" width="40" height="14" fill="#5c2a1a" opacity="0.7"/>

  <!-- gothic arched hero window (the single lit room) -->
  <path d="M 740 600
           L 740 500
           Q 740 430 800 430
           Q 860 430 860 500
           L 860 600 Z"
        fill="url(#window)" opacity="0.95"/>

  <!-- window mullions -->
  <rect x="797" y="440" width="6" height="160" fill="#5c2a1a" opacity="0.75"/>
  <path d="M 740 520 Q 800 480 860 520" stroke="#5c2a1a" stroke-width="5" fill="none" opacity="0.75"/>
  <rect x="740" y="595" width="120" height="6" fill="#5c2a1a" opacity="0.75"/>

  <!-- small secondary windows, dimmer -->
  <path d="M 670 700 L 670 660 Q 670 640 690 640 Q 710 640 710 660 L 710 700 Z" fill="#d97706" opacity="0.55"/>
  <path d="M 890 700 L 890 660 Q 890 640 910 640 Q 930 640 930 660 L 930 700 Z" fill="#d97706" opacity="0.55"/>

  <!-- foreground ground line -->
  <rect x="0" y="820" width="1600" height="80" fill="#0d0707"/>

  <!-- subtle cobblestone reflection of the lit window -->
  <ellipse cx="800" cy="845" rx="120" ry="10" fill="#fbbf24" opacity="0.25"/>
</svg>
