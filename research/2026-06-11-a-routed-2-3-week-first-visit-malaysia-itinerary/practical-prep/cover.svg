<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#e6d9c2"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rustB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint outer bearing ring -->
  <circle cx="800" cy="450" r="280" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.30"/>
  <circle cx="800" cy="450" r="246" fill="none" stroke="#9a3309" stroke-width="6" stroke-dasharray="3 24" opacity="0.45"/>

  <!-- compass disc -->
  <circle cx="800" cy="450" r="214" fill="#faf8f2" opacity="0.92"/>
  <circle cx="800" cy="450" r="214" fill="none" stroke="#78350f" stroke-width="4" opacity="0.7"/>
  <circle cx="800" cy="450" r="190" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.4"/>

  <!-- secondary (NE/SW) needle, muted -->
  <polygon points="800,450 951,299 838,488" fill="#d97706" opacity="0.55"/>
  <polygon points="800,450 649,601 762,412" fill="#78350f" opacity="0.45"/>

  <!-- primary N/S needle -->
  <polygon points="800,450 836,470 800,254" fill="url(#rust)" opacity="0.95"/>
  <polygon points="800,450 764,470 800,254" fill="url(#rustB)" opacity="0.9"/>
  <polygon points="800,450 836,430 800,646" fill="#5c2a1a" opacity="0.85"/>
  <polygon points="800,450 764,430 800,646" fill="#9a3309" opacity="0.8"/>

  <!-- hub -->
  <circle cx="800" cy="450" r="26" fill="#78350f"/>
  <circle cx="800" cy="450" r="14" fill="#fbbf24" opacity="0.95"/>

  <!-- corner decoration (cropped freely) -->
  <path d="M0 760 Q 360 700 720 752 T 1600 720 L 1600 900 L 0 900 Z" fill="#c2410c" opacity="0.18"/>
</svg>
