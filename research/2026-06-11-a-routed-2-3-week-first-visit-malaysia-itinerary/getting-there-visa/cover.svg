<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- horizon glow -->
  <ellipse cx="800" cy="900" rx="900" ry="380" fill="url(#glow)"/>

  <!-- globe curve (horizon arc) -->
  <path d="M 120 820 Q 800 560 1480 820" fill="none" stroke="#78350f" stroke-width="10" opacity="0.7"/>
  <path d="M 120 850 Q 800 590 1480 850" fill="none" stroke="#c2410c" stroke-width="4" opacity="0.5"/>

  <!-- great-circle flight path: Ghent -> Kuala Lumpur -->
  <path d="M 320 600 Q 800 130 1300 470" fill="none" stroke="url(#arc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.95"/>
  <path d="M 320 600 Q 800 130 1300 470" fill="none" stroke="#fef3ec" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- origin node (Ghent) -->
  <circle cx="320" cy="600" r="16" fill="#9a3309"/>
  <circle cx="320" cy="600" r="8" fill="#fbbf24"/>

  <!-- destination node (Kuala Lumpur) -->
  <circle cx="1300" cy="470" r="20" fill="#c2410c"/>
  <circle cx="1300" cy="470" r="10" fill="#fef3ec"/>
  <circle cx="1300" cy="470" r="34" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>

  <!-- aircraft at apex of the arc -->
  <g transform="translate(800 168) rotate(22)">
    <path d="M 0 -34 L 9 14 L 40 30 L 9 26 L 6 50 L 0 42 L -6 50 L -9 26 L -40 30 L -9 14 Z" fill="#fef3ec" opacity="0.95"/>
  </g>
</svg>
