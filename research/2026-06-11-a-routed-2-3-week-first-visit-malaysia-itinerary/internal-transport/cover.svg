<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="430" fill="url(#glow)"/>

  <!-- the route: a multi-hop journey arc threading the bases -->
  <path d="M 300 600 Q 430 360 560 470 Q 690 580 800 380 Q 910 200 1040 430 Q 1170 660 1300 360"
        fill="none" stroke="url(#route)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <path d="M 300 600 Q 430 360 560 470 Q 690 580 800 380 Q 910 200 1040 430 Q 1170 660 1300 360"
        fill="none" stroke="#78350f" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="2 34" opacity="0.5"/>

  <!-- base nodes along the route -->
  <g stroke="#faf8f2" stroke-width="6">
    <circle cx="300" cy="600" r="20" fill="#9a3309"/>
    <circle cx="560" cy="470" r="16" fill="#c2410c"/>
    <circle cx="1040" cy="430" r="16" fill="#c2410c"/>
    <circle cx="1300" cy="360" r="20" fill="#9a3309"/>
  </g>

  <!-- hero node: a transport hub ring at the journey's pivot -->
  <circle cx="800" cy="380" r="74" fill="none" stroke="#78350f" stroke-width="3" opacity="0.45"/>
  <circle cx="800" cy="380" r="52" fill="#c2410c"/>
  <circle cx="800" cy="380" r="52" fill="none" stroke="#fbbf24" stroke-width="5"/>

  <!-- plane glyph inside the hub -->
  <g fill="#faf8f2" transform="translate(800 380) rotate(35)">
    <path d="M 0 -34 C 6 -34 8 -20 8 -8 L 32 6 L 32 14 L 8 7 L 8 22 L 16 28 L 16 33 L 0 29 L -16 33 L -16 28 L -8 22 L -8 7 L -32 14 L -32 6 L -8 -8 C -8 -20 -6 -34 0 -34 Z"/>
  </g>

  <!-- ferry accent: a small boat hull riding a wave near a coastal node -->
  <g transform="translate(1040 430)" opacity="0.95">
    <path d="M -26 4 L 26 4 L 18 22 L -18 22 Z" fill="#78350f"/>
    <rect x="-4" y="-16" width="6" height="20" fill="#9a3309"/>
    <path d="M 2 -16 L 22 0 L 2 0 Z" fill="#d97706"/>
  </g>
</svg>
