<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="640" ry="420" fill="url(#glow)"/>

  <!-- main journey route: west sweep -> east leg -> Borneo -->
  <path d="M 260 640 C 360 420 520 380 620 470 C 720 560 760 700 880 660 C 1010 616 1010 380 1140 360"
        fill="none" stroke="#9a3309" stroke-width="11" stroke-linecap="round" opacity="0.9"/>

  <!-- monsoon reroute branch (dashed, forking off east leg) -->
  <path d="M 880 660 C 980 720 1120 720 1230 600"
        fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="4 22" opacity="0.7"/>

  <!-- waypoint stops -->
  <circle cx="260" cy="640" r="20" fill="#78350f" opacity="0.9"/>
  <circle cx="620" cy="470" r="20" fill="#c2410c" opacity="0.9"/>
  <circle cx="880" cy="660" r="20" fill="#d97706" opacity="0.9"/>
  <circle cx="1230" cy="600" r="16" fill="#c2410c" opacity="0.6"/>

  <!-- hero stop: Borneo terminus -->
  <circle cx="1140" cy="360" r="62" fill="url(#hub)"/>
  <circle cx="1140" cy="360" r="62" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.85"/>
  <circle cx="1140" cy="360" r="22" fill="#fef3ec" opacity="0.9"/>
</svg>
