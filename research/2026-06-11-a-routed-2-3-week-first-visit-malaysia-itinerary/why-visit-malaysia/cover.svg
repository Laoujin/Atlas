<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- hero: tropical sun glow + disc, centered in safe zone -->
  <circle cx="800" cy="430" r="360" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="430" r="150" fill="#fbbf24" opacity="0.95"/>

  <!-- layered rainforest canopy ridges (strata) -->
  <path d="M0 560 Q400 500 800 545 T1600 530 V900 H0 Z" fill="#78350f" opacity="0.85"/>
  <path d="M0 660 Q450 600 900 650 T1600 640 V900 H0 Z" fill="#9a3309" opacity="0.88"/>
  <path d="M0 760 Q500 705 1000 755 T1600 745 V900 H0 Z" fill="#c2410c" opacity="0.92"/>

  <!-- canopy texture: a few emergent tree crowns on the nearest ridge -->
  <circle cx="430" cy="720" r="34" fill="#78350f" opacity="0.7"/>
  <circle cx="1130" cy="730" r="40" fill="#78350f" opacity="0.7"/>
  <circle cx="700" cy="745" r="26" fill="#5c2a1a" opacity="0.65"/>
</svg>
