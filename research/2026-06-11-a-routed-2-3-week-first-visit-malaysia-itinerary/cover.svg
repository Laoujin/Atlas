<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <!-- warm sun glow behind the route -->
  <circle cx="800" cy="470" r="520" fill="url(#sun)" opacity="0.85"/>

  <!-- hero: the stitched journey route with waypoints -->
  <path d="M 250 600 C 430 660 470 380 660 400 S 880 560 1010 470 S 1280 250 1360 330"
        fill="none" stroke="url(#route)" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="2 26" opacity="0.95"/>
  <path d="M 250 600 C 430 660 470 380 660 400 S 880 560 1010 470 S 1280 250 1360 330"
        fill="none" stroke="#c2410c" stroke-width="3"
        stroke-linecap="round" opacity="0.5"/>

  <g opacity="0.95">
    <circle cx="250" cy="600" r="20" fill="#78350f" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="660" cy="400" r="16" fill="#9a3309" stroke="#fef3ec" stroke-width="3"/>
    <circle cx="1010" cy="470" r="16" fill="#9a3309" stroke="#fef3ec" stroke-width="3"/>
    <circle cx="1360" cy="330" r="26" fill="#c2410c" stroke="#fbbf24" stroke-width="5"/>
    <circle cx="1360" cy="330" r="9" fill="#fef3ec"/>
  </g>

  <!-- decoration: island ridgeline along the bottom bleed -->
  <path d="M 0 900 L 0 780 C 220 720 360 800 560 760 S 940 700 1180 770 1600 740 1600 740 L 1600 900 Z"
        fill="#1a0e0e" opacity="0.85"/>
  <path d="M 0 900 L 0 840 C 300 800 520 860 820 825 S 1320 800 1600 850 L 1600 900 Z"
        fill="#000000" opacity="0.45"/>
</svg>
