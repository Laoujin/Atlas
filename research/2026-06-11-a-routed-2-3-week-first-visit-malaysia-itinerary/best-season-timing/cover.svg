<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- dry-season sun: hero, left of centre -->
  <circle cx="690" cy="430" r="170" fill="url(#sun)" opacity="0.95"/>
  <g stroke="#d97706" stroke-width="9" stroke-linecap="round" opacity="0.7">
    <line x1="690" y1="195" x2="690" y2="240"/>
    <line x1="525" y1="265" x2="557" y2="297"/>
    <line x1="455" y1="430" x2="500" y2="430"/>
    <line x1="525" y1="595" x2="557" y2="563"/>
    <line x1="690" y1="665" x2="690" y2="620"/>
  </g>

  <!-- monsoon side: angled rain streaks (NE monsoon, east-coast) -->
  <g stroke="#9a3309" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <line x1="1010" y1="190" x2="950" y2="350"/>
    <line x1="1110" y1="200" x2="1050" y2="360"/>
    <line x1="1210" y1="210" x2="1150" y2="370"/>
    <line x1="1060" y1="320" x2="1000" y2="480"/>
    <line x1="1160" y1="330" x2="1100" y2="490"/>
    <line x1="1260" y1="340" x2="1200" y2="500"/>
  </g>

  <!-- monsoon cloud over the rain -->
  <path d="M930 250 q-55 -70 35 -85 q30 -75 110 -40 q70 -55 120 15 q80 -10 60 70 q20 55 -55 60 l-240 0 q-55 -5 -30 -45 z" fill="#5c2a1a" opacity="0.82"/>

  <!-- sea / island horizon (east-coast closes) -->
  <path d="M0 690 q400 -55 800 0 t800 0 v210 H0 Z" fill="url(#sea)" opacity="0.9"/>
  <ellipse cx="430" cy="700" rx="130" ry="26" fill="#c2410c" opacity="0.55"/>
  <ellipse cx="1180" cy="715" rx="160" ry="30" fill="#78350f" opacity="0.6"/>
</svg>
