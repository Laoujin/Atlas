<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: warm evening sky -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Radial glow behind the arch -->
    <radialGradient id="glowGrad" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Arch fill gradient -->
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Arch opening (sky through arch) -->
    <radialGradient id="archOpenGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </radialGradient>
    <!-- Stripe on columns -->
    <linearGradient id="colGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Horseshoe opening glow -->
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <!-- Violet accent gradient for secondary hue (food/fine-dining → rose #be185d, but first tag is cordoba → no match → rust-only... but topic is food/fine-dining so use rose) -->
    <radialGradient id="roseAccent" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <!-- Rose accent at base (fine-dining secondary hue) -->
  <rect width="1600" height="900" fill="url(#roseAccent)"/>
  <!-- Glow behind hero -->
  <rect width="1600" height="900" fill="url(#glowGrad)"/>

  <!-- Layer 3: Decorative stars (outside safe zone — upper corners) -->
  <circle cx="160" cy="60" r="2.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="320" cy="40" r="1.8" fill="#fbbf24" opacity="0.4"/>
  <circle cx="520" cy="75" r="2" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1080" cy="50" r="2.2" fill="#fbbf24" opacity="0.45"/>
  <circle cx="1280" cy="30" r="1.6" fill="#fbbf24" opacity="0.4"/>
  <circle cx="1440" cy="65" r="2.8" fill="#fbbf24" opacity="0.5"/>
  <circle cx="740" cy="28" r="1.5" fill="#d97706" opacity="0.3"/>
  <circle cx="900" cy="42" r="1.9" fill="#fbbf24" opacity="0.35"/>

  <!-- Layer 2: HERO — Moorish horseshoe arch (Mezquita motif), centered ~(800,450) -->
  <!-- The arch sits within safe zone x:125-1475, y:90-810 -->

  <!-- Left column -->
  <rect x="595" y="310" width="72" height="390" rx="4" fill="url(#archGrad)" opacity="0.92"/>
  <rect x="595" y="310" width="72" height="390" rx="4" fill="url(#colGrad)"/>
  <!-- Column capital left -->
  <rect x="580" y="300" width="102" height="22" rx="3" fill="#c2410c" opacity="0.95"/>
  <rect x="572" y="285" width="118" height="20" rx="3" fill="#9a3309" opacity="0.9"/>

  <!-- Right column -->
  <rect x="933" y="310" width="72" height="390" rx="4" fill="url(#archGrad)" opacity="0.92"/>
  <rect x="933" y="310" width="72" height="390" rx="4" fill="url(#colGrad)"/>
  <!-- Column capital right -->
  <rect x="918" y="300" width="102" height="22" rx="3" fill="#c2410c" opacity="0.95"/>
  <rect x="910" y="285" width="118" height="20" rx="3" fill="#9a3309" opacity="0.9"/>

  <!-- Horseshoe arch body (the voussoir arch — alternating rust and cream bands) -->
  <!-- Arch outer boundary path: horseshoe shape -->
  <!-- Outer arch (the masonry ring) -->
  <path d="
    M 572 285
    L 572 430
    A 228 228 0 0 0 1028 430
    L 1028 285
    Z
  " fill="#78350f" opacity="0.95"/>

  <!-- Voussoir bands — alternating colors suggesting the red/white striped arch of Mezquita -->
  <!-- Band 1 -->
  <path d="M 600 285 L 600 420 A 200 200 0 0 0 636 340 Z" fill="#c2410c" opacity="0.6"/>
  <path d="M 636 340 A 200 200 0 0 0 680 300 L 680 285 L 636 285 Z" fill="#faf8f2" opacity="0.12"/>
  <path d="M 920 285 L 920 300 A 200 200 0 0 0 964 340 Z" fill="#faf8f2" opacity="0.12"/>
  <path d="M 964 340 A 200 200 0 0 0 1000 420 L 1000 285 L 964 285 Z" fill="#c2410c" opacity="0.6"/>
  <!-- Keystone highlight -->
  <path d="M 760 285 A 200 200 0 0 0 840 285 L 840 295 A 195 195 0 0 1 760 295 Z" fill="#fbbf24" opacity="0.25"/>

  <!-- Inner arch cutout — the opening, filled with the warm glow -->
  <path d="
    M 615 285
    L 615 425
    A 185 185 0 0 0 985 425
    L 985 285
    Z
  " fill="url(#innerGlow)" opacity="0.9"/>

  <!-- Arch stripe decorative band at top of arch -->
  <path d="
    M 572 285 L 615 285
    L 615 295
    A 185 185 0 0 0 985 295
    L 985 285 L 1028 285
    A 228 228 0 0 1 572 285
    Z
  " fill="#d97706" opacity="0.5"/>

  <!-- Floor / ground plane -->
  <rect x="595" y="695" width="410" height="5" rx="2" fill="#d97706" opacity="0.35"/>
  <!-- Reflection on ground -->
  <ellipse cx="800" cy="720" rx="200" ry="18" fill="#d97706" opacity="0.12"/>

  <!-- Decorative geometric tile pattern on arch spandrels (small diamonds) -->
  <!-- Left spandrel -->
  <polygon points="530,340 550,320 570,340 550,360" fill="#c2410c" opacity="0.35"/>
  <polygon points="500,370 520,350 540,370 520,390" fill="#9a3309" opacity="0.3"/>
  <!-- Right spandrel -->
  <polygon points="1030,340 1050,320 1070,340 1050,360" fill="#c2410c" opacity="0.35"/>
  <polygon points="1060,370 1080,350 1100,370 1080,390" fill="#9a3309" opacity="0.3"/>

  <!-- Subtle ground plane extending full width (edge decoration) -->
  <rect x="0" y="830" width="1600" height="70" fill="#78350f" opacity="0.4"/>
  <rect x="0" y="820" width="1600" height="12" fill="#c2410c" opacity="0.2"/>
</svg>
