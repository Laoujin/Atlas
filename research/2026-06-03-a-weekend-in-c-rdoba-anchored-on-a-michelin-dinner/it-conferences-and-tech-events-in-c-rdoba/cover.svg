<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Warm glow behind arch -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <!-- Card face gradient -->
    <linearGradient id="card1" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <!-- Bar line fill -->
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm glow centred on hero zone -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: hero — Moorish arch silhouette -->
  <!-- Arch: two pillars + a rounded top, centred at 800,450 -->
  <!-- Left pillar -->
  <rect x="660" y="310" width="70" height="300" rx="4" fill="#9a3309" opacity="0.55"/>
  <!-- Right pillar -->
  <rect x="870" y="310" width="70" height="300" rx="4" fill="#9a3309" opacity="0.55"/>
  <!-- Arch curve (semicircle spanning pillars) -->
  <path d="M660 395 Q660 250 800 250 Q940 250 940 395" fill="none" stroke="#d97706" stroke-width="14" opacity="0.65" stroke-linecap="round"/>
  <!-- Arch inner fill -->
  <path d="M674 395 Q674 268 800 268 Q926 268 926 395 L926 610 L674 610 Z" fill="#3b1208" opacity="0.45"/>

  <!-- Layer 2: hero — stacked agenda-card rectangles -->
  <!-- Back card (rotated slightly left) -->
  <g transform="rotate(-6 800 450)">
    <rect x="530" y="295" width="540" height="340" rx="14" fill="url(#card2)" opacity="0.78"/>
    <!-- faint line bars -->
    <rect x="570" y="370" width="260" height="14" rx="4" fill="url(#bar)" opacity="0.45"/>
    <rect x="570" y="405" width="200" height="10" rx="4" fill="url(#bar)" opacity="0.35"/>
    <rect x="570" y="434" width="230" height="10" rx="4" fill="url(#bar)" opacity="0.30"/>
  </g>
  <!-- Mid card (rotated slightly right) -->
  <g transform="rotate(4 800 450)">
    <rect x="545" y="280" width="540" height="340" rx="14" fill="url(#card1)" opacity="0.82"/>
    <rect x="585" y="355" width="270" height="14" rx="4" fill="url(#bar)" opacity="0.50"/>
    <rect x="585" y="390" width="210" height="10" rx="4" fill="url(#bar)" opacity="0.38"/>
    <rect x="585" y="418" width="240" height="10" rx="4" fill="url(#bar)" opacity="0.32"/>
    <rect x="585" y="446" width="180" height="10" rx="4" fill="url(#bar)" opacity="0.26"/>
  </g>
  <!-- Front card (upright, hero face) -->
  <rect x="560" y="262" width="480" height="370" rx="14" fill="url(#card3)" opacity="0.92"/>
  <!-- Accent stripe at top of front card -->
  <rect x="560" y="262" width="480" height="32" rx="14" fill="#fbbf24" opacity="0.55"/>
  <rect x="560" y="282" width="480" height="12" fill="#fbbf24" opacity="0.55"/>
  <!-- Agenda line bars on front card -->
  <rect x="598" y="335" width="280" height="16" rx="5" fill="url(#bar)" opacity="0.60"/>
  <rect x="598" y="372" width="220" height="11" rx="4" fill="url(#bar)" opacity="0.46"/>
  <rect x="598" y="400" width="250" height="11" rx="4" fill="url(#bar)" opacity="0.40"/>
  <rect x="598" y="428" width="190" height="11" rx="4" fill="url(#bar)" opacity="0.34"/>
  <rect x="598" y="456" width="230" height="11" rx="4" fill="url(#bar)" opacity="0.30"/>
  <rect x="598" y="484" width="160" height="11" rx="4" fill="url(#bar)" opacity="0.26"/>
  <!-- Small amber dot accent (schedule bullet) -->
  <circle cx="578" cy="343" r="7" fill="#fbbf24" opacity="0.80"/>
  <circle cx="578" cy="378" r="5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="578" cy="406" r="5" fill="#fbbf24" opacity="0.50"/>
  <circle cx="578" cy="434" r="5" fill="#fbbf24" opacity="0.44"/>
  <circle cx="578" cy="462" r="5" fill="#fbbf24" opacity="0.38"/>
  <circle cx="578" cy="490" r="5" fill="#fbbf24" opacity="0.32"/>

  <!-- Layer 3: edge decoration (outside safe zone — atmospheric) -->
  <!-- Faint geometric pattern corners -->
  <circle cx="0" cy="900" r="260" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.10"/>
  <circle cx="0" cy="900" r="200" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.08"/>
  <circle cx="1600" cy="0" r="220" fill="none" stroke="#d97706" stroke-width="2" opacity="0.10"/>
  <circle cx="1600" cy="0" r="160" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.08"/>
</svg>
