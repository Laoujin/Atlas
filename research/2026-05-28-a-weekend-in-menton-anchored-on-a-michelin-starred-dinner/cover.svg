<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="townA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="townB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="townC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="campanile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun halo behind basilica -->
  <circle cx="880" cy="430" r="320" fill="url(#sun)" opacity="0.75"/>

  <!-- distant headland (Italian border hillside) -->
  <path d="M 1080 540 Q 1260 470 1400 500 L 1600 510 L 1600 640 L 1080 640 Z"
        fill="#78350f" opacity="0.55"/>

  <!-- mid headland -->
  <path d="M 0 600 Q 180 520 360 560 L 360 660 L 0 660 Z"
        fill="#9a3309" opacity="0.6"/>

  <!-- stacked old town: lower tier -->
  <path d="M 420 620 L 420 540 L 470 540 L 470 510 L 540 510 L 540 525 L 600 525 L 600 495 L 680 495 L 680 515 L 760 515 L 760 485 L 840 485 L 840 510 L 920 510 L 920 495 L 1000 495 L 1000 520 L 1080 520 L 1080 540 L 1160 540 L 1160 560 L 1220 560 L 1220 620 Z"
        fill="url(#townA)" opacity="0.92"/>

  <!-- mid tier -->
  <path d="M 500 540 L 500 470 L 560 470 L 560 450 L 640 450 L 640 465 L 720 465 L 720 430 L 800 430 L 800 455 L 880 455 L 880 440 L 960 440 L 960 470 L 1040 470 L 1040 490 L 1100 490 L 1100 540 Z"
        fill="url(#townB)" opacity="0.9"/>

  <!-- upper tier with basilica -->
  <path d="M 600 470 L 600 410 L 660 410 L 660 390 L 720 390 L 720 405 L 780 405 L 780 370 L 820 370 L 820 405 L 880 405 L 880 380 L 940 380 L 940 410 L 1000 410 L 1000 470 Z"
        fill="url(#townC)" opacity="0.92"/>

  <!-- basilica campanile — the hero peak -->
  <rect x="800" y="245" width="44" height="165" fill="url(#campanile)" opacity="0.95"/>
  <polygon points="800,245 822,205 844,245" fill="#be185d" opacity="0.85"/>
  <rect x="809" y="290" width="26" height="36" fill="#5c2a1a" opacity="0.55"/>
  <rect x="809" y="345" width="26" height="36" fill="#5c2a1a" opacity="0.55"/>

  <!-- small secondary tower -->
  <rect x="730" y="335" width="22" height="70" fill="#fef3ec" opacity="0.85"/>
  <polygon points="730,335 741,315 752,335" fill="#9a3309" opacity="0.8"/>

  <!-- window dots — restrained -->
  <g fill="#5c2a1a" opacity="0.5">
    <rect x="445" y="560" width="6" height="10"/>
    <rect x="480" y="555" width="6" height="10"/>
    <rect x="555" y="495" width="6" height="10"/>
    <rect x="615" y="480" width="6" height="10"/>
    <rect x="700" y="475" width="6" height="10"/>
    <rect x="785" y="445" width="6" height="10"/>
    <rect x="865" y="470" width="6" height="10"/>
    <rect x="945" y="455" width="6" height="10"/>
    <rect x="1025" y="485" width="6" height="10"/>
    <rect x="650" y="425" width="6" height="10"/>
    <rect x="745" y="420" width="6" height="10"/>
    <rect x="905" y="395" width="6" height="10"/>
  </g>

  <!-- sea -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#sea)"/>

  <!-- reflection shimmer -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.35" fill="none">
    <line x1="500" y1="680" x2="700" y2="680"/>
    <line x1="620" y1="720" x2="900" y2="720"/>
    <line x1="780" y1="760" x2="1000" y2="760"/>
    <line x1="680" y1="800" x2="860" y2="800"/>
  </g>

  <!-- floating lemon (Menton's emblem) -->
  <ellipse cx="1280" cy="730" rx="58" ry="46" fill="#fbbf24" opacity="0.92"/>
  <ellipse cx="1265" cy="715" rx="20" ry="14" fill="#fef3ec" opacity="0.5"/>
  <path d="M 1338 728 Q 1352 720 1346 712" stroke="#9a3309" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- second smaller lemon -->
  <ellipse cx="220" cy="775" rx="38" ry="30" fill="#d97706" opacity="0.85"/>
  <ellipse cx="212" cy="767" rx="13" ry="9" fill="#fbbf24" opacity="0.6"/>
</svg>
