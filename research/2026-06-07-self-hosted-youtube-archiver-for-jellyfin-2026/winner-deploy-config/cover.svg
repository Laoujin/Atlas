<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slabBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="slabMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- stacked deployment slabs: base config -> deployed layer -> winner -->
  <g transform="translate(800 470)">
    <!-- bottom slab -->
    <polygon points="-380,150 0,260 380,150 0,40" fill="url(#slabBase)" opacity="0.85"/>
    <!-- middle slab -->
    <polygon points="-380,40 0,150 380,40 0,-70" fill="url(#slabMid)" opacity="0.9"/>
    <!-- hero top slab -->
    <polygon points="-380,-70 0,40 380,-70 0,-180" fill="url(#rust)"/>

    <!-- config line bars on hero slab -->
    <g stroke="#fbbf24" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <line x1="-150" y1="-95" x2="-30" y2="-60"/>
      <line x1="20" y1="-110" x2="170" y2="-65"/>
      <line x1="-120" y1="-50" x2="40" y2="-2"/>
    </g>

    <!-- teal network node + edges linking the layers (deployment/network) -->
    <g stroke="#0e7490" stroke-width="5" fill="#0e7490" opacity="0.9">
      <line x1="380" y1="-70" x2="470" y2="-150"/>
      <line x1="380" y1="40" x2="470" y2="-150"/>
      <line x1="-380" y1="40" x2="-470" y2="-40"/>
      <circle cx="470" cy="-150" r="22"/>
      <circle cx="-470" cy="-40" r="18"/>
    </g>
    <circle cx="470" cy="-150" r="9" fill="#fef3ec"/>
  </g>
</svg>
