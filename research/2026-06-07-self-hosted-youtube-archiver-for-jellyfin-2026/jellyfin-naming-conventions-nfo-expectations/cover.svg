<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- back media file card (slate) -->
  <g transform="rotate(-9 800 450)">
    <rect x="470" y="250" width="520" height="400" rx="22" fill="url(#slate)" opacity="0.7"/>
  </g>

  <!-- middle media file card (slate) -->
  <g transform="rotate(-3 800 450)">
    <rect x="540" y="265" width="520" height="400" rx="22" fill="url(#slate)" opacity="0.85"/>
  </g>

  <!-- hero NFO card (rust) with metadata lines -->
  <g transform="rotate(5 800 450)">
    <rect x="610" y="250" width="540" height="410" rx="24" fill="url(#rust)"/>
    <circle cx="690" cy="330" r="34" fill="#fbbf24" opacity="0.9"/>
    <rect x="760" y="316" width="300" height="26" rx="13" fill="#fef3ec" opacity="0.92"/>
    <rect x="650" y="410" width="450" height="20" rx="10" fill="#fef3ec" opacity="0.55"/>
    <rect x="650" y="460" width="450" height="20" rx="10" fill="#fef3ec" opacity="0.55"/>
    <rect x="650" y="510" width="330" height="20" rx="10" fill="#fef3ec" opacity="0.55"/>
    <rect x="650" y="560" width="400" height="20" rx="10" fill="#fef3ec" opacity="0.55"/>
  </g>
</svg>
