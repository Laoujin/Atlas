<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust-dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Shield body gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="55%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Shield inner highlight -->
    <radialGradient id="shieldGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient glow behind shield -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Lock shackle gradient -->
    <linearGradient id="lockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed edge vignette for depth -->
  <rect width="1600" height="900" fill="#1a0e0e" opacity="0.35"/>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Decorative: faint concentric ring (session orbit) — decorative, can be clipped at edges -->
  <circle cx="800" cy="450" r="370" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.18"/>
  <circle cx="800" cy="450" r="310" fill="none" stroke="#d97706" stroke-width="1" opacity="0.12"/>

  <!-- Decorative: faint play-button echo in lower-right — intentionally outside hero, reads as atmosphere -->
  <polygon points="1380,720 1480,790 1380,860" fill="#c2410c" opacity="0.07"/>

  <!-- Decorative: faint play-button echo upper-left -->
  <polygon points="130,100 200,145 130,190" fill="#78350f" opacity="0.09"/>

  <!-- Layer 2: Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="480" ry="400" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero — Shield shape centered at (800, 450) -->
  <!-- Shield path: top-flat with pointed bottom, bounding box approx x:590–1010, y:180–730 -->
  <path d="M800,195 L1005,270 L1005,490 Q1005,620 800,730 Q595,620 595,490 L595,270 Z"
        fill="url(#shieldGrad)" opacity="0.92"/>

  <!-- Shield inner highlight overlay -->
  <path d="M800,195 L1005,270 L1005,490 Q1005,620 800,730 Q595,620 595,490 L595,270 Z"
        fill="url(#shieldGlow)"/>

  <!-- Shield border -->
  <path d="M800,195 L1005,270 L1005,490 Q1005,620 800,730 Q595,620 595,490 L595,270 Z"
        fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.55"/>

  <!-- Lock body (padlock rectangle) centered on shield -->
  <rect x="734" y="460" width="132" height="108" rx="10" ry="10"
        fill="#78350f" stroke="#d97706" stroke-width="2.5" opacity="0.95"/>

  <!-- Lock shackle (U-shape arc) -->
  <path d="M762,462 L762,418 Q762,382 800,382 Q838,382 838,418 L838,462"
        fill="none" stroke="url(#lockGrad)" stroke-width="11" stroke-linecap="round" opacity="0.9"/>

  <!-- Lock keyhole: circle -->
  <circle cx="800" cy="500" r="18" fill="#1a0e0e" opacity="0.85"/>

  <!-- Lock keyhole: slot -->
  <rect x="793" y="516" width="14" height="26" rx="4" fill="#1a0e0e" opacity="0.85"/>

</svg>
