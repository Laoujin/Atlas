<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1410"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Chassis body gradient -->
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Chassis face panel -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <!-- Teal arc gradient -->
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <!-- Arrow/chevron fill -->
    <linearGradient id="chevronGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Slot line gradient -->
    <linearGradient id="slotGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed edge vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0a0505" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Layer 2: Hero glow (centered at 800,450) -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#glow)" opacity="0.9"/>

  <!-- Teal network-source arc above (decoration, top of safe zone) -->
  <path d="M 380,210 Q 800,110 1220,210"
        fill="none" stroke="url(#arcGrad)" stroke-width="3" opacity="0.7"/>
  <path d="M 440,240 Q 800,150 1160,240"
        fill="none" stroke="url(#arcGrad)" stroke-width="2" opacity="0.45"/>

  <!-- Vertical teal "stream" lines descending from arc to chevron -->
  <line x1="800" y1="210" x2="800" y2="305"
        stroke="#0e7490" stroke-width="3" opacity="0.6"/>
  <line x1="720" y1="225" x2="730" y2="305"
        stroke="#0e7490" stroke-width="1.5" opacity="0.3"/>
  <line x1="880" y1="225" x2="870" y2="305"
        stroke="#0e7490" stroke-width="1.5" opacity="0.3"/>

  <!-- Hero chevron / downward arrow (download indicator) centered ~800,330 -->
  <!-- Large downward-pointing chevron: a thick V shape -->
  <polygon points="660,295 800,390 940,295 905,295 800,375 695,295"
           fill="url(#chevronGrad)" opacity="0.92"/>
  <!-- Second smaller chevron above for motion feel -->
  <polygon points="700,250 800,330 900,250 872,250 800,318 728,250"
           fill="#0e7490" opacity="0.55"/>

  <!-- NAS chassis body: main server block -->
  <rect x="560" y="430" width="480" height="190" rx="12" ry="12"
        fill="url(#chassis)" opacity="0.95"/>

  <!-- Chassis face panel (front face highlight) -->
  <rect x="572" y="442" width="456" height="166" rx="8" ry="8"
        fill="url(#panel)" opacity="0.85"/>

  <!-- Drive bays: three horizontal slot groups -->
  <rect x="596" y="462" width="200" height="18" rx="4"
        fill="#78350f" opacity="0.9"/>
  <rect x="596" y="488" width="200" height="18" rx="4"
        fill="#78350f" opacity="0.9"/>
  <rect x="596" y="514" width="200" height="18" rx="4"
        fill="#78350f" opacity="0.9"/>

  <!-- Activity LED strip on each bay -->
  <rect x="788" y="465" width="28" height="12" rx="3"
        fill="#fbbf24" opacity="0.85"/>
  <rect x="788" y="491" width="28" height="12" rx="3"
        fill="#d97706" opacity="0.7"/>
  <rect x="788" y="517" width="28" height="12" rx="3"
        fill="#fbbf24" opacity="0.6"/>

  <!-- Right-side panel: USB/power area -->
  <rect x="840" y="462" width="170" height="78" rx="6"
        fill="#7c2d12" opacity="0.8"/>
  <!-- Power button circle -->
  <circle cx="960" cy="501" r="22"
          fill="#9a3309" stroke="#c2410c" stroke-width="3" opacity="0.95"/>
  <circle cx="960" cy="501" r="14"
          fill="#c2410c" opacity="0.8"/>

  <!-- Bottom status bar on chassis -->
  <rect x="572" y="576" width="456" height="20" rx="4"
        fill="#78350f" opacity="0.7"/>
  <!-- Amber active-transfer glow line -->
  <rect x="596" y="580" width="0" height="12" rx="2" opacity="0"/>
  <rect x="596" y="580" width="320" height="12" rx="2"
        fill="url(#slotGrad)" opacity="0.85"/>

  <!-- Subtle teal connection port indicators on chassis bottom edge -->
  <rect x="620" y="612" width="30" height="8" rx="2"
        fill="#0e7490" opacity="0.7"/>
  <rect x="660" y="612" width="30" height="8" rx="2"
        fill="#0e7490" opacity="0.5"/>

  <!-- Layer 3: Corner atmosphere (outside safe zone, full-bleed decoration) -->
  <!-- Top-left faint teal arc segment -->
  <path d="M 0,180 Q 120,80 280,140"
        fill="none" stroke="#0e7490" stroke-width="2" opacity="0.2"/>
  <!-- Top-right -->
  <path d="M 1600,180 Q 1480,80 1320,140"
        fill="none" stroke="#0e7490" stroke-width="2" opacity="0.2"/>
  <!-- Bottom rust edge glow -->
  <rect x="0" y="830" width="1600" height="70"
        fill="#c2410c" opacity="0.06"/>
</svg>
