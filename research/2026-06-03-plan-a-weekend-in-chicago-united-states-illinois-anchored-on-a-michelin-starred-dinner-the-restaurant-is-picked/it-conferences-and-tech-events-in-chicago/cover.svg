<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal city -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hub radial gradient: rust glow -->
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Outer glow for hub -->
    <radialGradient id="hubglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Node gradient: violet accent -->
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Orbit node secondary -->
    <radialGradient id="node2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Edge decoration: faint city-grid diagonals (corners, clipped by crop) -->
  <g opacity="0.07" stroke="#d97706" stroke-width="1" fill="none">
    <line x1="0" y1="0" x2="400" y2="900"/>
    <line x1="80" y1="0" x2="480" y2="900"/>
    <line x1="160" y1="0" x2="560" y2="900"/>
    <line x1="1200" y1="0" x2="800" y2="900"/>
    <line x1="1280" y1="0" x2="880" y2="900"/>
    <line x1="1360" y1="0" x2="960" y2="900"/>
    <line x1="1440" y1="0" x2="1040" y2="900"/>
    <line x1="1600" y1="100" x2="1100" y2="900"/>
  </g>

  <!-- Layer 2: Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="480" ry="290"
           fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.35"/>

  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="300" ry="180"
           fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.25"/>

  <!-- Hub outer glow -->
  <circle cx="800" cy="450" r="200" fill="url(#hubglow)"/>

  <!-- Spoke lines from hub to outer nodes -->
  <g stroke="#c2410c" stroke-width="1.5" opacity="0.5">
    <!-- Top node -->
    <line x1="800" y1="390" x2="800" y2="165"/>
    <!-- Top-right node -->
    <line x1="840" y1="410" x2="1200" y2="250"/>
    <!-- Bottom-right node -->
    <line x1="845" y1="470" x2="1230" y2="620"/>
    <!-- Bottom node -->
    <line x1="800" y1="510" x2="680" y2="730"/>
    <!-- Bottom-left node -->
    <line x1="755" y1="470" x2="390" y2="640"/>
    <!-- Top-left node -->
    <line x1="760" y1="415" x2="415" y2="230"/>
  </g>

  <!-- Inner orbit node dots (on inner ring) -->
  <g>
    <!-- Inner node top -->
    <circle cx="800" cy="270" r="12" fill="url(#node2)" opacity="0.8"/>
    <!-- Inner node right -->
    <circle cx="1095" cy="390" r="12" fill="url(#node2)" opacity="0.8"/>
    <!-- Inner node bottom-right -->
    <circle cx="1020" cy="585" r="12" fill="url(#node2)" opacity="0.8"/>
    <!-- Inner node bottom-left -->
    <circle cx="580" cy="580" r="12" fill="url(#node2)" opacity="0.8"/>
    <!-- Inner node left -->
    <circle cx="505" cy="390" r="12" fill="url(#node2)" opacity="0.8"/>
  </g>

  <!-- Outer orbit node dots (larger, violet) -->
  <g>
    <!-- Outer top -->
    <circle cx="800" cy="165" r="18" fill="url(#node)" opacity="0.85"/>
    <!-- Outer top-right -->
    <circle cx="1200" cy="250" r="18" fill="url(#node)" opacity="0.85"/>
    <!-- Outer bottom-right -->
    <circle cx="1230" cy="620" r="18" fill="url(#node)" opacity="0.85"/>
    <!-- Outer bottom -->
    <circle cx="680" cy="730" r="18" fill="url(#node)" opacity="0.85"/>
    <!-- Outer bottom-left -->
    <circle cx="390" cy="640" r="18" fill="url(#node)" opacity="0.85"/>
    <!-- Outer top-left -->
    <circle cx="415" cy="230" r="18" fill="url(#node)" opacity="0.85"/>
  </g>

  <!-- Hero: central hub circle -->
  <circle cx="800" cy="450" r="90" fill="url(#hub)" opacity="0.95"/>

  <!-- Inner hub accent ring -->
  <circle cx="800" cy="450" r="90"
          fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.5"/>

  <!-- Small centre dot -->
  <circle cx="800" cy="450" r="18" fill="#fbbf24" opacity="0.9"/>

</svg>
