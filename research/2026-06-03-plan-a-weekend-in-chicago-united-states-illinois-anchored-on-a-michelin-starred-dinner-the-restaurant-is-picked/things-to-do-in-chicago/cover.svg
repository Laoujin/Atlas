<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.75" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low summer sun glow over the lake -->
  <circle cx="800" cy="540" r="320" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="540" r="120" fill="#fbbf24" opacity="0.85"/>

  <!-- skyline hero, silhouetted on the glow (safe zone x125-1475 y90-810) -->
  <g fill="url(#tower)">
    <rect x="300" y="430" width="70" height="180"/>
    <rect x="380" y="360" width="90" height="250"/>
    <rect x="480" y="300" width="60" height="310"/>
    <rect x="540" y="240" width="110" height="370"/>
    <rect x="600" y="200" width="14" height="60"/>
    <rect x="680" y="180" width="120" height="430"/>
    <rect x="720" y="120" width="40" height="70"/>
    <rect x="730" y="80" width="20" height="50"/>
    <rect x="830" y="280" width="80" height="330"/>
    <rect x="940" y="220" width="130" height="390"/>
    <rect x="985" y="160" width="40" height="70"/>
    <rect x="1100" y="340" width="70" height="270"/>
    <rect x="1180" y="300" width="100" height="310"/>
    <rect x="1300" y="400" width="60" height="210"/>
  </g>

  <!-- lake band -->
  <rect x="0" y="610" width="1600" height="290" fill="url(#water)" opacity="0.92"/>

  <!-- sun reflection on the water -->
  <rect x="760" y="610" width="80" height="290" fill="#fbbf24" opacity="0.45"/>
  <rect x="730" y="640" width="140" height="14" fill="#fbbf24" opacity="0.35"/>
  <rect x="745" y="700" width="110" height="12" fill="#d97706" opacity="0.4"/>
  <rect x="755" y="760" width="90" height="10" fill="#c2410c" opacity="0.45"/>
</svg>
