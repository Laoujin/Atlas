<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="plateBack" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0eadb" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="plateFront" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="garnish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- back plate (offset right, partly behind front plate) -->
  <ellipse cx="1010" cy="470" rx="245" ry="235" fill="url(#plateBack)" opacity="0.85"/>
  <ellipse cx="1010" cy="470" rx="180" ry="172" fill="#1a0e0e" opacity="0.45"/>
  <circle cx="1010" cy="470" r="14" fill="url(#garnish)" opacity="0.9"/>

  <!-- front plate (hero, centered near 800,450) -->
  <ellipse cx="700" cy="470" rx="290" ry="278" fill="url(#plateFront)"/>
  <ellipse cx="700" cy="470" rx="215" ry="206" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
  <!-- minimal plated composition: three small garnish forms -->
  <circle cx="680" cy="450" r="22" fill="url(#garnish)" opacity="0.95"/>
  <ellipse cx="735" cy="478" rx="16" ry="9" fill="#9a3309" opacity="0.85" transform="rotate(25 735 478)"/>
  <path d="M 660 495 Q 700 510 740 498" stroke="#78350f" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>

  <!-- wine glass silhouette accent (right side, rose secondary) -->
  <path d="M 1300 240 Q 1300 360 1340 380 Q 1380 360 1380 240 Z" fill="url(#glass)" opacity="0.9"/>
  <rect x="1338" y="378" width="4" height="170" fill="#5c2a1a" opacity="0.85"/>
  <ellipse cx="1340" cy="555" rx="42" ry="6" fill="#5c2a1a" opacity="0.85"/>

  <!-- subtle highlight on wine surface -->
  <ellipse cx="1340" cy="270" rx="28" ry="6" fill="#fbbf24" opacity="0.25"/>

  <!-- atmospheric edge vignette -->
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.15"/>
</svg>
