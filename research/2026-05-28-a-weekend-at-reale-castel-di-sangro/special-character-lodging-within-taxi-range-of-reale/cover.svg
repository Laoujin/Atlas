<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="archGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- setting sun glow behind arch -->
  <circle cx="800" cy="500" r="380" fill="url(#sun)"/>

  <!-- far mountain ridge -->
  <path d="M 0 600 L 180 480 L 320 540 L 480 440 L 640 510 L 820 420 L 980 500 L 1160 430 L 1320 510 L 1480 460 L 1600 520 L 1600 900 L 0 900 Z"
        fill="#78350f" opacity="0.75"/>

  <!-- mid mountain ridge -->
  <path d="M 0 700 L 140 620 L 280 670 L 440 580 L 600 660 L 780 590 L 940 670 L 1120 600 L 1280 680 L 1440 620 L 1600 690 L 1600 900 L 0 900 Z"
        fill="#5c2a1a" opacity="0.85"/>

  <!-- hero: stone loggia / arched doorway, centered ~(800,500), within safe zone -->
  <g>
    <!-- stone facade block -->
    <rect x="560" y="340" width="480" height="430" fill="url(#stone)" opacity="0.95"/>
    <!-- roof line / cornice -->
    <rect x="540" y="330" width="520" height="22" fill="#1a0e0e" opacity="0.9"/>
    <!-- central archway opening -->
    <path d="M 680 770 L 680 540 A 120 120 0 0 1 920 540 L 920 770 Z"
          fill="url(#archGlow)" opacity="0.9"/>
    <!-- keystone shadow inside arch top -->
    <path d="M 700 540 A 100 100 0 0 1 900 540 L 900 560 A 100 100 0 0 0 700 560 Z"
          fill="#78350f" opacity="0.5"/>
    <!-- side narrow windows -->
    <rect x="600" y="440" width="40" height="90" rx="4" fill="#1a0e0e" opacity="0.85"/>
    <rect x="960" y="440" width="40" height="90" rx="4" fill="#1a0e0e" opacity="0.85"/>
    <!-- stone seam lines (subtle) -->
    <line x1="560" y1="450" x2="1040" y2="450" stroke="#1a0e0e" stroke-width="2" opacity="0.4"/>
    <line x1="560" y1="630" x2="1040" y2="630" stroke="#1a0e0e" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- foreground ground shadow -->
  <rect x="0" y="770" width="1600" height="130" fill="#1a0e0e" opacity="0.7"/>
</svg>
