<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="0.78" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5c2a1a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- full-bleed twilight sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow over the lake -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant Kampenwand ridge silhouette -->
  <path d="M0 540 L120 470 L210 500 L320 430 L430 460 L540 400 L650 440 L760 380 L860 420 L970 390 L1080 430 L1200 410 L1320 450 L1430 420 L1600 460 L1600 600 L0 600 Z"
        fill="url(#ridge)" opacity="0.85"/>

  <!-- nearer secondary ridge -->
  <path d="M0 580 L140 540 L260 565 L390 520 L520 555 L660 525 L800 550 L940 520 L1080 555 L1220 530 L1360 560 L1490 535 L1600 555 L1600 620 L0 620 Z"
        fill="#3a1a10" opacity="0.7"/>

  <!-- lake surface -->
  <rect x="0" y="590" width="1600" height="310" fill="url(#lake)"/>

  <!-- water reflection lines -->
  <line x1="380" y1="660" x2="540" y2="660" stroke="#d97706" stroke-width="2" opacity="0.35"/>
  <line x1="620" y1="690" x2="780" y2="690" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <line x1="860" y1="720" x2="1020" y2="720" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <line x1="1080" y1="700" x2="1200" y2="700" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>
  <line x1="500" y1="750" x2="720" y2="750" stroke="#d97706" stroke-width="1.5" opacity="0.25"/>
  <line x1="900" y1="780" x2="1100" y2="780" stroke="#fbbf24" stroke-width="1.5" opacity="0.25"/>

  <!-- island reflection (downward, faint) -->
  <ellipse cx="800" cy="640" rx="170" ry="14" fill="#1a0e0e" opacity="0.5"/>
  <path d="M740 640 Q740 700 750 730 L760 720 L770 740 L780 725 L800 745 L820 725 L830 740 L840 720 L850 730 Q860 700 860 640 Z"
        fill="#3a1a10" opacity="0.35"/>

  <!-- ISLAND base -->
  <ellipse cx="800" cy="595" rx="190" ry="18" fill="#1a0e0e" opacity="0.9"/>
  <path d="M620 595 Q650 575 720 568 Q800 560 880 568 Q950 575 980 595 Z"
        fill="#3a1a10"/>

  <!-- linden tree trunk -->
  <rect x="795" y="430" width="10" height="150" fill="#1a0e0e"/>

  <!-- linden tree crown (the defining tree of Fraueninsel) -->
  <circle cx="800" cy="400" r="78" fill="#5c2a1a" opacity="0.95"/>
  <circle cx="770" cy="410" r="50" fill="#78350f" opacity="0.85"/>
  <circle cx="830" cy="405" r="55" fill="#78350f" opacity="0.85"/>
  <circle cx="800" cy="370" r="45" fill="#9a3309" opacity="0.7"/>
  <circle cx="785" cy="395" r="38" fill="#c2410c" opacity="0.55"/>

  <!-- small pitched-roof inn beside the tree -->
  <rect x="870" y="530" width="70" height="55" fill="#78350f"/>
  <path d="M862 530 L905 488 L948 530 Z" fill="#9a3309"/>
  <rect x="890" y="552" width="12" height="18" fill="#fbbf24" opacity="0.85"/>
  <rect x="912" y="552" width="12" height="18" fill="#fbbf24" opacity="0.6"/>
  <!-- chimney -->
  <rect x="920" y="500" width="8" height="16" fill="#5c2a1a"/>

  <!-- tiny turret / castle hint on the left side of the island -->
  <rect x="680" y="540" width="22" height="45" fill="#78350f"/>
  <path d="M676 540 L691 522 L706 540 Z" fill="#c2410c"/>
  <rect x="687" y="558" width="8" height="10" fill="#fbbf24" opacity="0.7"/>

  <!-- one warm star / lantern point above ridge to anchor the evening -->
  <circle cx="800" cy="200" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="200" r="8" fill="#fbbf24" opacity="0.25"/>
</svg>
