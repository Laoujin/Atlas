<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nearRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow centered in hero safe zone -->
  <circle cx="980" cy="430" r="280" fill="url(#sun)"/>
  <circle cx="980" cy="430" r="70" fill="#fef3ec" opacity="0.9"/>

  <!-- far mountain range -->
  <path d="M0,560 L120,500 L240,530 L360,470 L520,510 L660,460 L820,500 L980,440 L1140,490 L1300,450 L1460,500 L1600,470 L1600,620 L0,620 Z" fill="url(#farRange)"/>

  <!-- mid range: Kampenwand-like jagged silhouette, hero -->
  <path d="M0,640 L90,580 L180,610 L280,540 L360,575 L450,490 L540,540 L640,460 L760,510 L850,420 L960,470 L1060,400 L1170,460 L1280,410 L1380,470 L1490,440 L1600,490 L1600,720 L0,720 Z" fill="url(#midRange)"/>

  <!-- near range / foreshore hills -->
  <path d="M0,720 L140,680 L300,710 L460,670 L640,705 L820,675 L1000,710 L1180,680 L1340,710 L1500,685 L1600,705 L1600,760 L0,760 Z" fill="url(#nearRange)"/>

  <!-- lake -->
  <rect x="0" y="755" width="1600" height="145" fill="url(#lake)"/>

  <!-- sun reflection on lake -->
  <ellipse cx="980" cy="770" rx="140" ry="10" fill="#fbbf24" opacity="0.85"/>
  <rect x="940" y="770" width="80" height="120" fill="url(#reflect)" opacity="0.6"/>

  <!-- ripple lines -->
  <path d="M860,800 Q900,795 940,800 T1020,800 T1100,800" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M820,830 Q880,825 940,830 T1060,830 T1180,830" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.35"/>
  <path d="M780,860 Q860,855 940,860 T1100,860 T1260,860" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.25"/>

  <!-- small sailboat hint, decoration -->
  <path d="M540,748 L540,720 L575,748 Z" fill="#faf8f2" opacity="0.85"/>
  <path d="M540,748 L540,732 L520,748 Z" fill="#faf8f2" opacity="0.7"/>
  <rect x="520" y="748" width="58" height="4" fill="#1a0e0e" opacity="0.7"/>
</svg>
