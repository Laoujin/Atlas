<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.5" r="0.18">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="nearRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="chaletWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Far mountain range (snowcaps via lighter overlay) -->
  <polygon points="0,520 180,360 320,440 480,300 640,420 820,320 980,440 1180,340 1360,460 1520,380 1600,440 1600,900 0,900"
           fill="url(#farRange)" opacity="0.75"/>
  <!-- Snowcap highlights -->
  <polygon points="450,320 480,300 520,335 500,345" fill="#faf8f2" opacity="0.7"/>
  <polygon points="800,340 820,320 855,348 835,360" fill="#faf8f2" opacity="0.7"/>
  <polygon points="1160,360 1180,340 1215,365 1195,378" fill="#faf8f2" opacity="0.6"/>

  <!-- Mid mountain range -->
  <polygon points="0,640 140,500 280,580 440,460 600,560 760,480 920,580 1080,490 1240,590 1400,500 1600,580 1600,900 0,900"
           fill="url(#midRange)" opacity="0.9"/>

  <!-- Near foreground hills -->
  <polygon points="0,760 200,680 400,720 600,670 800,710 1000,665 1200,715 1400,680 1600,720 1600,900 0,900"
           fill="url(#nearRange)"/>

  <!-- Hero chalet centered around (800, 560) — fully within safe zone -->
  <!-- Roof shadow on snow -->
  <ellipse cx="800" cy="755" rx="220" ry="14" fill="#1a0e0e" opacity="0.4"/>

  <!-- Chalet body -->
  <rect x="700" y="600" width="200" height="150" fill="url(#chaletWall)"/>
  <!-- Roof: wide overhanging gable -->
  <polygon points="660,610 800,490 940,610 900,610 800,520 700,610" fill="url(#roof)"/>
  <polygon points="660,610 940,610 920,620 680,620" fill="#5c2a1a"/>

  <!-- Balcony band -->
  <rect x="700" y="670" width="200" height="10" fill="#78350f" opacity="0.85"/>

  <!-- Windows (glowing warm) -->
  <rect x="725" y="625" width="30" height="35" fill="#fbbf24" opacity="0.9"/>
  <rect x="775" y="625" width="30" height="35" fill="#fbbf24" opacity="0.9"/>
  <rect x="825" y="625" width="30" height="35" fill="#fbbf24" opacity="0.9"/>
  <rect x="865" y="625" width="22" height="35" fill="#fbbf24" opacity="0.75"/>

  <!-- Lower windows / door -->
  <rect x="740" y="695" width="28" height="45" fill="#fbbf24" opacity="0.85"/>
  <rect x="785" y="695" width="30" height="55" fill="#78350f"/>
  <rect x="790" y="700" width="20" height="45" fill="#fbbf24" opacity="0.7"/>
  <rect x="835" y="695" width="28" height="45" fill="#fbbf24" opacity="0.85"/>

  <!-- Roof ridge accent -->
  <polygon points="795,495 800,490 805,495 805,520 795,520" fill="#1a0e0e" opacity="0.6"/>

  <!-- A couple of evergreen silhouettes flanking the chalet -->
  <polygon points="580,750 600,670 620,750" fill="#1a0e0e" opacity="0.85"/>
  <polygon points="585,720 600,680 615,720" fill="#1a0e0e" opacity="0.85"/>
  <polygon points="980,755 1000,680 1020,755" fill="#1a0e0e" opacity="0.85"/>
  <polygon points="985,725 1000,690 1015,725" fill="#1a0e0e" opacity="0.85"/>
  <polygon points="1050,765 1068,705 1086,765" fill="#1a0e0e" opacity="0.8"/>
  <polygon points="510,760 528,705 546,760" fill="#1a0e0e" opacity="0.8"/>

  <!-- Subtle warm glow around chalet -->
  <ellipse cx="800" cy="640" rx="280" ry="120" fill="#fbbf24" opacity="0.08"/>
</svg>
