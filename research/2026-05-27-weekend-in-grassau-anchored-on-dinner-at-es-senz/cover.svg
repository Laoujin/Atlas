<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="45%" stop-color="#5c2a1a"/>
      <stop offset="80%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peaksFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="peaksNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="reflection" cx="0.5" cy="0" r="0.6">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow, hero anchor -->
  <circle cx="980" cy="540" r="360" fill="url(#sun)"/>
  <circle cx="980" cy="540" r="70" fill="#fde68a" opacity="0.95"/>

  <!-- Far alpine ridge (Chiemgau, softer) -->
  <path d="M 0,560 L 140,500 L 260,540 L 380,470 L 520,520 L 660,440 L 820,500 L 960,430 L 1120,490 L 1260,420 L 1400,480 L 1600,440 L 1600,620 L 0,620 Z"
        fill="url(#peaksFar)"/>

  <!-- Near alpine ridge (Kampenwand-like jagged silhouette) -->
  <path d="M 0,640 L 110,580 L 200,610 L 310,520 L 380,560 L 470,470 L 555,510 L 640,440 L 720,495 L 810,420 L 895,475 L 985,450 L 1075,505 L 1180,455 L 1290,520 L 1410,475 L 1520,540 L 1600,510 L 1600,720 L 0,720 Z"
        fill="url(#peaksNear)"/>

  <!-- Lake surface -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#lake)"/>

  <!-- Sun reflection on water -->
  <ellipse cx="980" cy="720" rx="280" ry="80" fill="url(#reflection)"/>

  <!-- Island silhouette (Fraueninsel / Herreninsel) -->
  <path d="M 380,720 Q 430,690 510,695 Q 590,692 640,718 Q 600,725 510,724 Q 420,724 380,720 Z"
        fill="#1a0e0e" opacity="0.95"/>
  <!-- Small tree cluster on island -->
  <path d="M 460,700 L 470,680 L 480,700 Z M 500,695 L 512,672 L 524,695 Z M 545,700 L 555,683 L 565,700 Z"
        fill="#1a0e0e" opacity="0.9"/>

  <!-- Subtle ripple lines on lake -->
  <path d="M 200,780 Q 400,775 600,780" stroke="#d97706" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M 900,800 Q 1150,795 1400,800" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 100,830 Q 350,825 600,830" stroke="#d97706" stroke-width="1" fill="none" opacity="0.25"/>
</svg>
