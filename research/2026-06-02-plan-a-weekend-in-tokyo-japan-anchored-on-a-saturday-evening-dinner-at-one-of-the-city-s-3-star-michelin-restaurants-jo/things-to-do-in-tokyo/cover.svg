<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun disc behind hero -->
  <circle cx="800" cy="430" r="280" fill="url(#sun)" opacity="0.9"/>

  <!-- distant mountain silhouettes (decoration, partially in safe zone but low) -->
  <path d="M 0 760 L 280 600 L 420 680 L 560 560 L 700 700 L 860 540 L 1020 690 L 1180 600 L 1340 720 L 1600 640 L 1600 900 L 0 900 Z" fill="url(#mountain)" opacity="0.75"/>
  <path d="M 0 820 L 200 740 L 380 790 L 600 720 L 820 780 L 1040 730 L 1260 800 L 1480 750 L 1600 780 L 1600 900 L 0 900 Z" fill="#78350f" opacity="0.6"/>

  <!-- Torii gate hero, centered ~800,450, within safe zone -->
  <!-- pillars -->
  <rect x="640" y="280" width="44" height="430" fill="url(#torii)"/>
  <rect x="916" y="280" width="44" height="430" fill="url(#torii)"/>
  <!-- pillar bases -->
  <rect x="628" y="700" width="68" height="22" fill="#5c2a1a"/>
  <rect x="904" y="700" width="68" height="22" fill="#5c2a1a"/>
  <!-- lower crossbeam (nuki) -->
  <rect x="600" y="360" width="400" height="28" fill="#9a3309"/>
  <!-- top crossbeam (kasagi) - upturned ends -->
  <path d="M 560 250 Q 800 220 1040 250 L 1060 230 Q 800 196 540 230 Z" fill="#c2410c"/>
  <!-- second top beam (shimaki) -->
  <rect x="580" y="258" width="440" height="22" fill="#78350f"/>
  <!-- small center tablet -->
  <rect x="780" y="300" width="40" height="50" fill="#5c2a1a" opacity="0.85"/>

  <!-- hanging lantern accent (silhouette + glow) -->
  <line x1="800" y1="388" x2="800" y2="430" stroke="#5c2a1a" stroke-width="3"/>
  <ellipse cx="800" cy="470" rx="38" ry="46" fill="url(#lantern)" opacity="0.9"/>
  <rect x="772" y="462" width="56" height="6" fill="#5c2a1a" opacity="0.7"/>
  <rect x="772" y="478" width="56" height="6" fill="#5c2a1a" opacity="0.7"/>

  <!-- ground line shadow -->
  <rect x="0" y="720" width="1600" height="6" fill="#5c2a1a" opacity="0.25"/>
</svg>
