<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm horizon glow (the villa) -->
  <ellipse cx="800" cy="640" rx="520" ry="180" fill="url(#glow)"/>

  <!-- far dune ridge -->
  <path d="M 0 660 Q 280 580 540 615 T 1060 600 T 1600 625 L 1600 900 L 0 900 Z"
        fill="url(#dune2)" opacity="0.82"/>

  <!-- near dune ridge -->
  <path d="M 0 745 Q 320 680 620 720 T 1180 710 T 1600 735 L 1600 900 L 0 900 Z"
        fill="url(#dune1)" opacity="0.95"/>

  <!-- small warm window dot on the horizon (the restaurant) -->
  <circle cx="800" cy="648" r="6" fill="#fef3ec" opacity="0.9"/>

  <!-- star halo -->
  <circle cx="800" cy="300" r="140" fill="url(#starGlow)"/>

  <!-- Michelin-style five-point star, hero element -->
  <g transform="translate(800 300)">
    <path d="M 0 -110 L 25.9 -34 L 104.6 -34 L 41.3 13 L 65.6 89 L 0 42 L -65.6 89 L -41.3 13 L -104.6 -34 L -25.9 -34 Z"
          fill="#fbbf24" opacity="0.95"/>
    <path d="M 0 -110 L 25.9 -34 L 104.6 -34 L 41.3 13 L 0 -10 Z"
          fill="#be185d" opacity="0.35"/>
  </g>
</svg>
