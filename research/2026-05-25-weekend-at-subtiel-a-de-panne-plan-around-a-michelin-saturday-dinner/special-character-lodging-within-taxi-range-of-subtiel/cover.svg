<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fde4cc"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duneBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="villa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft seaside sun, low on horizon -->
  <circle cx="1100" cy="430" r="260" fill="url(#sun)"/>

  <!-- Distant dune ridge -->
  <path d="M0,560 C220,500 380,540 560,520 C760,498 920,540 1120,510 C1300,485 1450,520 1600,500 L1600,900 L0,900 Z" fill="url(#duneBack)" opacity="0.8"/>

  <!-- Foreground dune cradling the villa -->
  <path d="M0,720 C180,640 340,690 520,680 C700,670 820,710 980,690 C1180,665 1360,710 1600,680 L1600,900 L0,900 Z" fill="url(#duneFront)"/>

  <!-- Villa hero, centered ~ (800, 470), inside safe zone -->
  <g>
    <!-- Main body -->
    <rect x="700" y="500" width="260" height="200" fill="url(#villa)" opacity="0.95"/>
    <!-- Pitched roof -->
    <polygon points="680,510 830,380 980,510" fill="url(#roof)"/>
    <!-- Dormer -->
    <polygon points="845,430 895,380 945,430 945,470 845,470" fill="#c2410c" opacity="0.92"/>
    <rect x="870" y="440" width="50" height="30" fill="#fbbf24" opacity="0.85"/>
    <!-- Chimney -->
    <rect x="900" y="395" width="22" height="50" fill="#78350f"/>
    <!-- Windows, glowing warm -->
    <rect x="725" y="540" width="50" height="70" fill="#fbbf24" opacity="0.9"/>
    <rect x="800" y="540" width="50" height="70" fill="#d97706" opacity="0.85"/>
    <rect x="875" y="540" width="50" height="70" fill="#fbbf24" opacity="0.9"/>
    <!-- Door -->
    <rect x="810" y="630" width="40" height="70" fill="#78350f"/>
    <!-- Subtle Belle Époque cornice line -->
    <rect x="695" y="495" width="270" height="10" fill="#9a3309" opacity="0.7"/>
  </g>

  <!-- Marram grass tufts on foreground dune, decorative -->
  <g stroke="#78350f" stroke-width="2" opacity="0.7" fill="none">
    <path d="M180,700 l-4,-22 M186,700 l0,-26 M192,700 l4,-22"/>
    <path d="M1280,700 l-4,-22 M1286,700 l0,-26 M1292,700 l4,-22"/>
    <path d="M420,720 l-3,-18 M425,720 l0,-22 M430,720 l3,-18"/>
  </g>
</svg>
