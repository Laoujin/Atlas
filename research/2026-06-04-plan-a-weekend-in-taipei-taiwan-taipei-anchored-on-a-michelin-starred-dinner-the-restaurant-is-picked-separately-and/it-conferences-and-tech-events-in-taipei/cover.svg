<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal city -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1407"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Hub fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Node fill -->
    <radialGradient id="nodeFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>

    <!-- Orbit ring gradient -->
    <radialGradient id="orbitGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="85%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle grid lines (atmospheric, low opacity) -->
  <g stroke="#78350f" stroke-width="0.8" opacity="0.15">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Layer 2: Hero element — network/orbit graph, centered at (800,450) -->

  <!-- Wide glow behind hub -->
  <circle cx="800" cy="450" r="320" fill="url(#hubGlow)" opacity="0.7"/>

  <!-- Outer orbit ring -->
  <circle cx="800" cy="450" r="280" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.3"/>

  <!-- Inner orbit ring -->
  <circle cx="800" cy="450" r="160" fill="none" stroke="#d97706" stroke-width="1" opacity="0.35"/>

  <!-- Connector lines from hub to satellite nodes (8 directions) -->
  <!-- Node positions on outer orbit, radius ~280 -->
  <!-- N  --> <line x1="800" y1="450" x2="800" y2="172" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <!-- NE --> <line x1="800" y1="450" x2="998" y2="252" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <!-- E  --> <line x1="800" y1="450" x2="1080" y2="450" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <!-- SE --> <line x1="800" y1="450" x2="998" y2="648" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <!-- S  --> <line x1="800" y1="450" x2="800" y2="728" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <!-- SW --> <line x1="800" y1="450" x2="602" y2="648" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <!-- W  --> <line x1="800" y1="450" x2="520" y2="450" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>
  <!-- NW --> <line x1="800" y1="450" x2="602" y2="252" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>

  <!-- Satellite nodes on outer orbit -->
  <!-- N node (800, 172) — safe zone y min 90, so 172 is fine -->
  <circle cx="800" cy="172" r="22" fill="url(#nodeFill)" opacity="0.9"/>
  <circle cx="800" cy="172" r="28" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>

  <!-- NE node (998, 252) -->
  <circle cx="998" cy="252" r="26" fill="url(#nodeFill)" opacity="0.85"/>
  <circle cx="998" cy="252" r="33" fill="none" stroke="#d97706" stroke-width="1" opacity="0.45"/>

  <!-- E node (1080, 450) — safe zone x max 1475, fine -->
  <circle cx="1080" cy="450" r="20" fill="url(#nodeFill)" opacity="0.9"/>
  <circle cx="1080" cy="450" r="26" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>

  <!-- SE node (998, 648) — safe zone y max 810, fine -->
  <circle cx="998" cy="648" r="24" fill="url(#nodeFill)" opacity="0.85"/>
  <circle cx="998" cy="648" r="31" fill="none" stroke="#d97706" stroke-width="1" opacity="0.45"/>

  <!-- S node (800, 728) -->
  <circle cx="800" cy="728" r="20" fill="url(#nodeFill)" opacity="0.9"/>
  <circle cx="800" cy="728" r="26" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>

  <!-- SW node (602, 648) -->
  <circle cx="602" cy="648" r="24" fill="url(#nodeFill)" opacity="0.85"/>
  <circle cx="602" cy="648" r="31" fill="none" stroke="#d97706" stroke-width="1" opacity="0.45"/>

  <!-- W node (520, 450) -->
  <circle cx="520" cy="450" r="20" fill="url(#nodeFill)" opacity="0.9"/>
  <circle cx="520" cy="450" r="26" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>

  <!-- NW node (602, 252) -->
  <circle cx="602" cy="252" r="26" fill="url(#nodeFill)" opacity="0.85"/>
  <circle cx="602" cy="252" r="33" fill="none" stroke="#d97706" stroke-width="1" opacity="0.45"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="72" fill="url(#hubFill)" opacity="0.95"/>
  <circle cx="800" cy="450" r="84" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <circle cx="800" cy="450" r="96" fill="none" stroke="#d97706" stroke-width="1" opacity="0.35"/>

  <!-- Small accent dot at hub center -->
  <circle cx="800" cy="450" r="14" fill="#fbbf24" opacity="0.9"/>

  <!-- Layer 3: Corner decorations (outside/near safe-zone edges, purely atmospheric) -->
  <!-- Top-left corner arc -->
  <path d="M 0 0 Q 180 0 180 180" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.25"/>
  <path d="M 0 0 Q 100 0 100 100" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.2"/>

  <!-- Bottom-right corner arc -->
  <path d="M 1600 900 Q 1420 900 1420 720" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.25"/>
  <path d="M 1600 900 Q 1500 900 1500 800" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.2"/>

  <!-- Top-right subtle accent -->
  <circle cx="1480" cy="120" r="60" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.15"/>

  <!-- Bottom-left subtle accent -->
  <circle cx="120" cy="780" r="60" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.15"/>
</svg>
