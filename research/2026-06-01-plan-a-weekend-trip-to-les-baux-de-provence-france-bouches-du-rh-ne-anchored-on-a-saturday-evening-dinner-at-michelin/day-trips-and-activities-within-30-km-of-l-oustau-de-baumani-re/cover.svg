<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="grove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow, hero anchor -->
  <circle cx="900" cy="430" r="320" fill="url(#sun)" opacity="0.85"/>
  <circle cx="900" cy="430" r="95" fill="#fbbf24" opacity="0.95"/>

  <!-- distant Alpilles ridge -->
  <path d="M 0,560 L 140,500 L 260,540 L 380,470 L 520,520 L 640,480 L 780,510 L 920,460 L 1060,505 L 1200,475 L 1340,520 L 1460,490 L 1600,530 L 1600,900 L 0,900 Z"
        fill="url(#ridgeBack)" opacity="0.7"/>

  <!-- hero: limestone hilltop village ridge with the famous two-holes rock -->
  <path d="M 120,720
           L 220,640
           L 290,665
           L 360,600
           L 430,615
           L 500,560
           L 560,575
           L 640,520
           L 720,545
           L 780,500
           L 820,510
           L 860,470
           L 920,485
           L 980,440
           L 1040,460
           L 1100,420
           L 1180,445
           L 1260,490
           L 1340,530
           L 1420,575
           L 1480,620
           L 1480,800
           L 120,800 Z"
        fill="url(#ridgeFront)"/>

  <!-- "two holes" pierced rock detail on hero ridge -->
  <ellipse cx="1075" cy="445" rx="14" ry="20" fill="#faf8f2" opacity="0.85"/>
  <ellipse cx="1115" cy="438" rx="11" ry="16" fill="#faf8f2" opacity="0.85"/>

  <!-- village rooftops perched on the ridge -->
  <rect x="700" y="500" width="22" height="28" fill="#5c2a1a" opacity="0.9"/>
  <rect x="725" y="492" width="18" height="36" fill="#78350f" opacity="0.9"/>
  <polygon points="694,500 712,484 730,500" fill="#9a3309" opacity="0.9"/>
  <polygon points="722,492 738,478 754,492" fill="#9a3309" opacity="0.9"/>
  <rect x="755" y="498" width="14" height="30" fill="#5c2a1a" opacity="0.85"/>

  <!-- a single cypress, Van Gogh nod -->
  <path d="M 380,720 Q 370,640 378,560 Q 386,640 392,720 Z" fill="url(#grove)" opacity="0.92"/>

  <!-- olive grove dots in foreground -->
  <g fill="#5c2a1a" opacity="0.6">
    <ellipse cx="240" cy="760" rx="24" ry="14"/>
    <ellipse cx="320" cy="775" rx="22" ry="13"/>
    <ellipse cx="490" cy="770" rx="26" ry="15"/>
    <ellipse cx="580" cy="780" rx="20" ry="12"/>
    <ellipse cx="900" cy="775" rx="24" ry="14"/>
    <ellipse cx="1000" cy="785" rx="22" ry="13"/>
    <ellipse cx="1180" cy="775" rx="26" ry="15"/>
    <ellipse cx="1300" cy="785" rx="20" ry="12"/>
  </g>

  <!-- foreground earth band -->
  <rect x="0" y="795" width="1600" height="105" fill="#78350f" opacity="0.85"/>
</svg>
