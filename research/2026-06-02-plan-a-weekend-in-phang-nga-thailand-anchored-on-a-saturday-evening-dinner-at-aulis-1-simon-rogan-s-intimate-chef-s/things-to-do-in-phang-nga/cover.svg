<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="karstFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="karstNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="800" cy="500" r="320" fill="url(#sun)"/>
  <circle cx="800" cy="500" r="95" fill="#fef3ec" opacity="0.9"/>

  <!-- distant karsts (decoration, fine to clip) -->
  <path d="M 0 560 Q 80 470 140 510 Q 200 440 260 520 Q 320 470 380 530 L 380 600 L 0 600 Z" fill="url(#karstFar)" opacity="0.7"/>
  <path d="M 1200 560 Q 1280 460 1340 510 Q 1410 430 1480 510 Q 1540 470 1600 530 L 1600 600 L 1200 600 Z" fill="url(#karstFar)" opacity="0.7"/>

  <!-- hero karsts inside safe zone (x:125-1475, y:90-810) -->
  <path d="M 360 600 Q 380 380 430 320 Q 470 240 520 290 Q 560 200 610 260 Q 650 320 670 420 Q 690 500 680 600 Z" fill="url(#karstNear)" opacity="0.95"/>
  <path d="M 900 600 Q 920 360 970 300 Q 1010 220 1070 270 Q 1110 200 1170 250 Q 1220 310 1240 410 Q 1255 510 1240 600 Z" fill="url(#karstNear)" opacity="0.95"/>
  <path d="M 720 600 Q 740 480 780 440 Q 820 400 860 440 Q 890 480 880 600 Z" fill="url(#karstNear)" opacity="0.9"/>

  <!-- water -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#water)"/>

  <!-- water highlights -->
  <ellipse cx="800" cy="615" rx="280" ry="6" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="635" rx="180" ry="3" fill="#fbbf24" opacity="0.4"/>
  <ellipse cx="800" cy="655" rx="120" ry="2" fill="#fef3ec" opacity="0.3"/>

  <!-- karst reflections -->
  <path d="M 360 600 Q 380 740 430 760 Q 470 780 520 760 Q 560 790 610 770 Q 650 750 670 700 Q 690 650 680 600 Z" fill="#1a0e0e" opacity="0.35"/>
  <path d="M 900 600 Q 920 760 970 780 Q 1010 800 1070 780 Q 1110 790 1170 770 Q 1220 740 1240 690 Q 1255 640 1240 600 Z" fill="#1a0e0e" opacity="0.35"/>

  <!-- longtail kayak in foreground, silhouette -->
  <path d="M 640 720 Q 720 705 800 715 Q 880 705 960 720 Q 880 745 800 738 Q 720 745 640 720 Z" fill="#1a0e0e" opacity="0.95"/>
  <!-- paddler torso (no face, abstract blob) -->
  <ellipse cx="800" cy="700" rx="14" ry="22" fill="#1a0e0e"/>
  <!-- paddle -->
  <path d="M 760 685 L 855 720" stroke="#1a0e0e" stroke-width="4" stroke-linecap="round"/>
</svg>
