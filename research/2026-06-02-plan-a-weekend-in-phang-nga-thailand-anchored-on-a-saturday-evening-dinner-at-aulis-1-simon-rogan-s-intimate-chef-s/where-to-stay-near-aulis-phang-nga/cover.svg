<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient: deep mahogany night at top, warm dusk at horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0e0e"/>
      <stop offset="55%"  stop-color="#3d1a10"/>
      <stop offset="85%"  stop-color="#78350f"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Sea gradient: deep dark rust-tinged water -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Horizon glow: warm amber radial burst -->
    <radialGradient id="glow" cx="50%" cy="100%" r="60%" fx="50%" fy="100%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="30%"  stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="65%"  stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Roof fill: warm rust with slight gradient -->
    <linearGradient id="roofFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Overhang fill: slightly lighter -->
    <linearGradient id="overhangFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Reflection: water shimmer -->
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed sky background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Horizon glow emanating from horizon line -->
  <rect x="0" y="420" width="1600" height="480" fill="url(#glow)"/>

  <!-- Layer 2: Sea (lower ~40%) -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#sea)" opacity="0.92"/>

  <!-- Horizon line: thin warm amber band -->
  <rect x="0" y="557" width="1600" height="6" fill="#d97706" opacity="0.6"/>

  <!-- Water reflection: vertical shimmer streak from horizon downward -->
  <rect x="700" y="563" width="200" height="180" fill="url(#reflection)" opacity="0.55"/>

  <!-- Layer 3: Hero — tropical villa / bungalow silhouette, centred ~(800,450) -->
  <!-- Main roof: wide shallow peaked triangle -->
  <!-- Peak at (800, 310), eaves at y=480, spanning x 480–1120 -->
  <polygon points="800,310 480,480 1120,480"
           fill="url(#roofFill)" opacity="0.95"/>

  <!-- Overhanging eave layer: slightly wider, a few px below gives depth -->
  <polygon points="800,325 455,492 1145,492"
           fill="url(#overhangFill)" opacity="0.70"/>

  <!-- Roof ridge cap: slim dark strip at the apex -->
  <polygon points="790,310 810,310 820,332 780,332"
           fill="#78350f" opacity="0.90"/>

  <!-- Villa body: rectangular block below roof peak -->
  <rect x="620" y="478" width="360" height="120" fill="#3d1a10" opacity="0.88"/>

  <!-- Door opening: darker rect centred on facade -->
  <rect x="765" y="510" width="70" height="88" fill="#1a0e0e" opacity="0.95"/>

  <!-- Left window -->
  <rect x="650" y="520" width="70" height="50" fill="#d97706" opacity="0.30"/>
  <!-- Right window -->
  <rect x="880" y="520" width="70" height="50" fill="#d97706" opacity="0.30"/>

  <!-- Warm window glow: soft radial behind each window -->
  <ellipse cx="685" cy="545" rx="42" ry="30" fill="#fbbf24" opacity="0.12"/>
  <ellipse cx="915" cy="545" rx="42" ry="30" fill="#fbbf24" opacity="0.12"/>

  <!-- Optional decoration: faint large moon disc near upper-right, outside safe zone vertically -->
  <circle cx="1300" cy="120" r="70" fill="#d97706" opacity="0.18"/>
  <circle cx="1300" cy="120" r="55" fill="#fbbf24" opacity="0.10"/>

  <!-- Faint palm-silhouette left: two angular strokes suggesting fronds -->
  <!-- Left palm trunk -->
  <line x1="230" y1="600" x2="310" y2="460" stroke="#3d1a10" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <!-- Left frond arcs (simple polylines) -->
  <polyline points="310,460 210,390 150,340" fill="none" stroke="#3d1a10" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <polyline points="310,460 270,360 300,290" fill="none" stroke="#3d1a10" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <polyline points="310,460 380,370 420,310" fill="none" stroke="#3d1a10" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- Right palm trunk -->
  <line x1="1370" y1="600" x2="1295" y2="455" stroke="#3d1a10" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <!-- Right frond arcs -->
  <polyline points="1295,455 1395,385 1460,335" fill="none" stroke="#3d1a10" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <polyline points="1295,455 1340,360 1315,290" fill="none" stroke="#3d1a10" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <polyline points="1295,455 1220,370 1185,315" fill="none" stroke="#3d1a10" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

</svg>
