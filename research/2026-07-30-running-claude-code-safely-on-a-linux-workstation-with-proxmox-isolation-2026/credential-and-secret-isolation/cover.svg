  <circle cx="800" cy="450" r="110" fill="url(#glow)"/>

  <path d="M 705 430 Q 760 460 800 450 Q 840 440 895 470" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.6"/>

  <polygon points="800,404 828,450 800,496 772,450" fill="#fbbf24" opacity="0.95"/>
  <polygon points="800,424 814,450 800,476 786,450" fill="#78350f" opacity="0.55"/>
