  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.5">
    <rect x="-80" y="-80" width="420" height="60" fill="url(#edge)" transform="rotate(35 60 60)"/>
    <rect x="1260" y="760" width="420" height="60" fill="url(#edge)" transform="rotate(35 1480 820)"/>
  </g>

  <g transform="translate(620,450) rotate(-8)">
