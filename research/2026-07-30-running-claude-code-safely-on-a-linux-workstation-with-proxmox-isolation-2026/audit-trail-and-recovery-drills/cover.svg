<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- faint edge decoration, cropped variably, no meaning lost -->
  <g stroke="#d97706" stroke-width="2" opacity="0.12">
    <line x1="60" y1="60" x2="60" y2="840"/>
    <line x1="90" y1="120" x2="90" y2="780"/>
    <line x1="1510" y1="90" x2="1510" y2="810"/>
    <line x1="1540" y1="150" x2="1540" y2="750"/>
  </g>

  <!-- git-log / audit-trail spine -->
  <line x1="430" y1="195" x2="430" y2="705" stroke="#d97706" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

  <!-- log entries / snapshot bands -->
  <rect x="460" y="195" width="640" height="70" rx="10" fill="#78350f" opacity="0.55"/>
  <rect x="490" y="305" width="640" height="70" rx="10" fill="#78350f" opacity="0.6"/>
  <rect x="465" y="525" width="640" height="70" rx="10" fill="#78350f" opacity="0.55"/>
  <rect x="500" y="635" width="640" height="70" rx="10" fill="#78350f" opacity="0.5"/>

  <!-- hero: the restore-point snapshot -->
  <rect x="450" y="404" width="700" height="92" rx="12" fill="url(#hero)" opacity="0.95"/>
  <line x1="500" y1="428" x2="820" y2="428" stroke="#fef3ec" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  <line x1="500" y1="450" x2="1020" y2="450" stroke="#fef3ec" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  <line x1="500" y1="472" x2="900" y2="472" stroke="#fef3ec" stroke-width="4" opacity="0.35" stroke-linecap="round"/>

  <!-- commit dots along the spine -->
  <circle cx="430" cy="230" r="7" fill="#d97706" opacity="0.6"/>
  <circle cx="430" cy="340" r="7" fill="#d97706" opacity="0.6"/>
  <circle cx="430" cy="560" r="7" fill="#d97706" opacity="0.6"/>
  <circle cx="430" cy="670" r="7" fill="#d97706" opacity="0.6"/>

  <!-- restore marker: highlighted node at the hero snapshot -->
  <circle cx="430" cy="450" r="15" fill="url(#hero)" stroke="#fbbf24" stroke-width="3" opacity="0.95"/>

  <!-- rewind arc: recovery drill jumping back to the restore point -->
  <path d="M 436 230 C 300 280 300 420 418 448" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.75" stroke-linecap="round"/>
  <polygon points="408,438 408,460 430,449" fill="#fbbf24" opacity="0.85"/>
</svg>
