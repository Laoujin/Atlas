<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroTop" x1="677" y1="455" x2="843" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="470" rx="420" ry="300" fill="url(#glow)"/>

  <!-- outer containment layer -->
  <polygon points="712,465 860,550 860,737 712,652" fill="#78350f" opacity="0.55"/>
  <polygon points="860,550 1008,465 1008,652 860,737" fill="#78350f" opacity="0.7"/>
  <polygon points="860,380 1008,465 860,550 712,465" fill="#78350f" opacity="0.85"/>

  <!-- middle containment layer -->
  <polygon points="687,485 800,550 800,693 687,628" fill="#9a3309" opacity="0.6"/>
  <polygon points="800,550 913,485 913,628 800,693" fill="#9a3309" opacity="0.78"/>
  <polygon points="800,420 913,485 800,550 687,485" fill="#9a3309" opacity="0.92"/>

  <!-- inner hero layer -->
  <polygon points="677,502 760,550 760,654 677,606" fill="#c2410c" opacity="0.7"/>
  <polygon points="760,550 843,502 843,606 760,654" fill="#d97706" opacity="0.88"/>
  <polygon points="760,455 843,502 760,550 677,502" fill="url(#heroTop)"/>

  <circle cx="760" cy="440" r="13" fill="#6d28d9" opacity="0.85"/>

  <!-- egress-filter mesh accents -->
  <line x1="1420" y1="60" x2="1560" y2="200" stroke="#6d28d9" stroke-width="2" opacity="0.18"/>
  <rect x="1436" y="76" width="10" height="10" fill="#6d28d9" opacity="0.3"/>
  <rect x="1466" y="106" width="10" height="10" fill="#6d28d9" opacity="0.3"/>
  <rect x="1496" y="136" width="10" height="10" fill="#6d28d9" opacity="0.3"/>
  <rect x="1526" y="166" width="10" height="10" fill="#6d28d9" opacity="0.3"/>

  <line x1="40" y1="700" x2="180" y2="840" stroke="#c2410c" stroke-width="2" opacity="0.2"/>
  <rect x="56" y="716" width="10" height="10" fill="#c2410c" opacity="0.3"/>
  <rect x="86" y="746" width="10" height="10" fill="#c2410c" opacity="0.3"/>
  <rect x="116" y="776" width="10" height="10" fill="#c2410c" opacity="0.3"/>
  <rect x="146" y="806" width="10" height="10" fill="#c2410c" opacity="0.3"/>
