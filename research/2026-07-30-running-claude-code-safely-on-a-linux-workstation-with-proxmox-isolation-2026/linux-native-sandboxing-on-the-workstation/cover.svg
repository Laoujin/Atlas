<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="outerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- faint corner texture, decorative only -->
  <g stroke="#d97706" stroke-width="2" opacity="0.12">
    <line x1="40" y1="0" x2="220" y2="180"/>
    <line x1="0" y1="60" x2="180" y2="240"/>
    <line x1="0" y1="120" x2="120" y2="240"/>
    <line x1="1400" y1="720" x2="1580" y2="900"/>
    <line x1="1460" y1="660" x2="1600" y2="800"/>
    <line x1="1520" y1="780" x2="1600" y2="860"/>
  </g>

  <!-- hero: host boundary block (outer) -->
  <rect x="590" y="300" width="340" height="220" rx="18"
        fill="url(#outerGrad)" opacity="0.88" transform="rotate(-6 760 410)"/>

  <!-- sandboxed process block (inner), overlapping the host boundary -->
  <rect x="730" y="410" width="260" height="180" rx="16"
        fill="url(#innerGrad)" opacity="0.93" transform="rotate(5 860 500)"/>

  <!-- landlock / seccomp filter ring around the sandboxed block -->
  <rect x="708" y="392" width="304" height="216" rx="22"
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 12"
        opacity="0.7" transform="rotate(5 860 500)"/>

  <!-- blocked-syscall spark at the boundary overlap -->
  <g stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="758" y1="452" x2="778" y2="430"/>
    <line x1="758" y1="452" x2="784" y2="452"/>
    <line x1="758" y1="452" x2="774" y2="478"/>
    <line x1="758" y1="452" x2="742" y2="476"/>
    <line x1="758" y1="452" x2="734" y2="452"/>
  </g>
</svg>
