<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="55%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <circle cx="800" cy="450" r="330" fill="url(#glow)"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#6d28d9" stroke-opacity="0.25" stroke-width="2"/>

  <g transform="rotate(-4 800 450)">
    <rect x="450" y="272" width="700" height="56" rx="8" fill="#78350f" opacity="0.45"/>
    <rect x="420" y="348" width="760" height="72" rx="8" fill="#d97706" opacity="0.6"/>
    <rect x="400" y="440" width="800" height="100" rx="10" fill="url(#hero)" opacity="0.92"/>
    <rect x="460" y="562" width="680" height="60" rx="8" fill="#5c2a1a" opacity="0.5"/>
  </g>

  <circle cx="1180" cy="480" r="10" fill="#6d28d9" opacity="0.85"/>
  <circle cx="1180" cy="480" r="20" fill="none" stroke="#6d28d9" stroke-opacity="0.4" stroke-width="2"/>

  <circle cx="120" cy="90" r="4" fill="#c2410c" opacity="0.3"/>
  <circle cx="1500" cy="810" r="5" fill="#9a3309" opacity="0.3"/>
</svg>
