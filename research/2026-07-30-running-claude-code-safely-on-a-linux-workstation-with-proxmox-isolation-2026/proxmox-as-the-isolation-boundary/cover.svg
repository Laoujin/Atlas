<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#334155" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#334155" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <circle cx="160" cy="120" r="220" fill="url(#corner)"/>
  <circle cx="1470" cy="800" r="260" fill="url(#corner)"/>

  <polygon points="800,200 1060,350 1060,650 800,800 540,650 540,350"
           fill="#334155" fill-opacity="0.1" stroke="#94a3b8" stroke-opacity="0.55" stroke-width="3"/>

  <polygon points="800,300 980,390 800,480 620,390" fill="url(#top)" opacity="0.95"/>
  <polygon points="620,390 800,480 800,700 620,610" fill="#78350f" opacity="0.9"/>
  <polygon points="800,480 980,390 980,610 800,700" fill="#9a3309" opacity="0.9"/>

  <circle cx="900" cy="555" r="26" fill="url(#glow)"/>
  <circle cx="900" cy="555" r="8" fill="#fbbf24"/>
</svg>
