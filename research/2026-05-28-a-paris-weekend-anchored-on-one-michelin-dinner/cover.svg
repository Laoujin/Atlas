<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="cloche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant skyline hint -->
  <rect x="0" y="760" width="1600" height="140" fill="#1a0e0e" opacity="0.55"/>
  <rect x="180" y="720" width="80" height="80" fill="#1a0e0e" opacity="0.5"/>
  <rect x="1320" y="710" width="110" height="90" fill="#1a0e0e" opacity="0.5"/>
  <rect x="1430" y="735" width="60" height="65" fill="#1a0e0e" opacity="0.5"/>

  <!-- Plate beneath the tower -->
  <ellipse cx="800" cy="780" rx="380" ry="42" fill="url(#plate)" opacity="0.85"/>
  <ellipse cx="800" cy="775" rx="320" ry="30" fill="#faf8f2" opacity="0.6"/>

  <!-- Eiffel tower silhouette (hero) -->
  <g fill="url(#tower)" opacity="0.95">
    <!-- Base legs -->
    <polygon points="640,770 720,770 770,560 750,560"/>
    <polygon points="960,770 880,770 830,560 850,560"/>
    <!-- Arch under first deck -->
    <path d="M 720 770 Q 800 700 880 770 L 870 740 Q 800 690 730 740 Z" opacity="0.85"/>
    <!-- First platform -->
    <rect x="735" y="555" width="130" height="18"/>
    <!-- Mid section -->
    <polygon points="755,555 845,555 825,360 775,360"/>
    <!-- Second platform -->
    <rect x="770" y="355" width="60" height="12"/>
    <!-- Upper tapered section -->
    <polygon points="778,355 822,355 812,230 788,230"/>
    <!-- Top platform -->
    <rect x="785" y="225" width="30" height="8"/>
    <!-- Antenna -->
    <polygon points="795,225 805,225 803,170 797,170"/>
    <rect x="798" y="135" width="4" height="38"/>
  </g>

  <!-- Lattice hints on tower -->
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.35" fill="none">
    <line x1="755" y1="560" x2="775" y2="370"/>
    <line x1="845" y1="560" x2="825" y2="370"/>
    <line x1="735" y1="600" x2="865" y2="600"/>
    <line x1="745" y1="660" x2="855" y2="660"/>
    <line x1="755" y1="720" x2="845" y2="720"/>
  </g>

  <!-- Wine glass accent, right -->
  <g opacity="0.85">
    <path d="M 1180 380 Q 1180 470 1220 490 Q 1260 470 1260 380 Z" fill="#9a3309" opacity="0.7"/>
    <path d="M 1180 380 Q 1180 470 1220 490 Q 1260 470 1260 380" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <rect x="1218" y="490" width="4" height="80" fill="#fbbf24" opacity="0.7"/>
    <ellipse cx="1220" cy="572" rx="34" ry="6" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Cloche dome, left -->
  <g opacity="0.9">
    <path d="M 320 540 Q 320 430 420 430 Q 520 430 520 540 Z" fill="url(#cloche)"/>
    <circle cx="420" cy="418" r="10" fill="#fbbf24"/>
    <ellipse cx="420" cy="545" rx="115" ry="10" fill="#faf8f2" opacity="0.75"/>
  </g>

  <!-- Stars / lights -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="260" cy="180" r="3"/>
    <circle cx="430" cy="120" r="2.5"/>
    <circle cx="1180" cy="160" r="3"/>
    <circle cx="1340" cy="220" r="2.5"/>
    <circle cx="1020" cy="110" r="2"/>
  </g>
</svg>
