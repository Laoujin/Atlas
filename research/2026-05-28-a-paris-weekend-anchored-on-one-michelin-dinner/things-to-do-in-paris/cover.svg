<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm radial glow (the dinner anchor) -->
  <ellipse cx="800" cy="540" rx="780" ry="420" fill="url(#glow)"/>

  <!-- Plate: round form behind tower base -->
  <ellipse cx="800" cy="760" rx="360" ry="42" fill="#1a0e0e" opacity="0.55"/>
  <ellipse cx="800" cy="750" rx="320" ry="32" fill="url(#plate)" opacity="0.75"/>

  <!-- Eiffel tower silhouette hero, vertical center ~450, height ~520 -->
  <g opacity="0.92">
    <!-- Four legs as a single filled silhouette via path -->
    <path d="M 800 180
             L 820 240
             L 840 360
             L 870 520
             L 920 720
             L 720 720
             L 770 520
             L 800 520
             L 800 360
             L 780 360
             L 760 240
             Z"
          fill="url(#tower)"/>
    <!-- Mirror left side using symmetric path -->
    <path d="M 800 180
             L 780 240
             L 760 360
             L 730 520
             L 680 720
             L 880 720
             L 830 520
             L 800 520
             Z"
          fill="url(#tower)" opacity="0.85"/>
    <!-- Top spire -->
    <path d="M 795 100 L 805 100 L 800 60 Z" fill="#fbbf24" opacity="0.95"/>
    <rect x="797" y="100" width="6" height="80" fill="#d97706" opacity="0.9"/>
    <!-- Mid platforms -->
    <rect x="745" y="350" width="110" height="14" fill="#78350f" opacity="0.85"/>
    <rect x="720" y="510" width="160" height="16" fill="#78350f" opacity="0.85"/>
    <!-- Lattice cross-bracing as thin lines -->
    <g stroke="#fbbf24" stroke-width="1.5" opacity="0.5" fill="none">
      <line x1="780" y1="240" x2="820" y2="350"/>
      <line x1="820" y1="240" x2="780" y2="350"/>
      <line x1="760" y1="360" x2="840" y2="510"/>
      <line x1="840" y1="360" x2="760" y2="510"/>
      <line x1="730" y1="520" x2="870" y2="720"/>
      <line x1="870" y1="520" x2="730" y2="720"/>
    </g>
  </g>

  <!-- Wine glass silhouette accent, right of tower -->
  <g opacity="0.75">
    <path d="M 1180 380
             Q 1180 480 1230 510
             Q 1280 480 1280 380
             Z"
          fill="#9a3309" opacity="0.85"/>
    <ellipse cx="1230" cy="420" rx="42" ry="14" fill="#fbbf24" opacity="0.7"/>
    <rect x="1227" y="510" width="6" height="90" fill="#78350f"/>
    <ellipse cx="1230" cy="605" rx="40" ry="6" fill="#78350f"/>
  </g>

  <!-- Distant scattered lights (city dots) -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="260" cy="640" r="2"/>
    <circle cx="320" cy="660" r="1.5"/>
    <circle cx="180" cy="680" r="2"/>
    <circle cx="400" cy="650" r="1.5"/>
    <circle cx="1380" cy="660" r="2"/>
    <circle cx="1440" cy="680" r="1.5"/>
    <circle cx="1500" cy="650" r="2"/>
    <circle cx="1320" cy="640" r="1.5"/>
    <circle cx="500" cy="670" r="1.5"/>
    <circle cx="1100" cy="660" r="1.5"/>
  </g>

  <!-- Horizon line softening -->
  <rect x="0" y="720" width="1600" height="180" fill="#1a0e0e" opacity="0.45"/>
</svg>
