<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: corner sun glow outside safe zone -->
  <circle cx="1500" cy="60" r="170" fill="#fbbf24" opacity="0.6"/>

  <!-- hero: heritage shophouse facade -->
  <g opacity="0.92">
    <!-- pitched roofline -->
    <polygon points="470,300 800,210 1130,300" fill="url(#roof)"/>
    <!-- wall block -->
    <rect x="490" y="300" width="620" height="420" fill="url(#wall)"/>
    <!-- row of tall louvred-shutter windows (glow) -->
    <g fill="url(#glow)" opacity="0.9">
      <rect x="535" y="360" width="110" height="300" rx="14"/>
      <rect x="690" y="360" width="110" height="300" rx="14"/>
      <rect x="845" y="360" width="110" height="300" rx="14"/>
      <rect x="1000" y="360" width="60" height="300" rx="14"/>
    </g>
    <!-- louvre slats -->
    <g stroke="#78350f" stroke-width="6" opacity="0.7">
      <line x1="535" y1="400" x2="645" y2="400"/><line x1="535" y1="440" x2="645" y2="440"/><line x1="535" y1="480" x2="645" y2="480"/><line x1="535" y1="520" x2="645" y2="520"/><line x1="535" y1="560" x2="645" y2="560"/><line x1="535" y1="600" x2="645" y2="600"/>
      <line x1="690" y1="400" x2="800" y2="400"/><line x1="690" y1="440" x2="800" y2="440"/><line x1="690" y1="480" x2="800" y2="480"/><line x1="690" y1="520" x2="800" y2="520"/><line x1="690" y1="560" x2="800" y2="560"/><line x1="690" y1="600" x2="800" y2="600"/>
      <line x1="845" y1="400" x2="955" y2="400"/><line x1="845" y1="440" x2="955" y2="440"/><line x1="845" y1="480" x2="955" y2="480"/><line x1="845" y1="520" x2="955" y2="520"/><line x1="845" y1="560" x2="955" y2="560"/><line x1="845" y1="600" x2="955" y2="600"/>
    </g>
  </g>
</svg>
