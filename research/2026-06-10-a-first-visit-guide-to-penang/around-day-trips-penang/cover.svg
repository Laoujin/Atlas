<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint radiating route arcs outside safe zone -->
  <path d="M -40 760 Q 400 560 900 700 T 1640 640" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.6"/>
  <circle cx="1430" cy="160" r="70" fill="#fbbf24" opacity="0.6"/>

  <!-- hero group: ferry hull on a water band -->
  <g opacity="0.92">
    <!-- water band -->
    <rect x="250" y="470" width="1100" height="170" rx="40" fill="url(#water)" opacity="0.85"/>
    <!-- route arc with node dot -->
    <path d="M 320 540 Q 800 300 1280 540" fill="none" stroke="#d97706" stroke-width="10" opacity="0.85"/>
    <circle cx="1280" cy="540" r="26" fill="#fbbf24" opacity="0.95"/>
    <!-- ferry hull -->
    <path d="M 470 430 L 1130 430 L 1040 575 Q 800 615 560 575 Z" fill="url(#hull)" opacity="0.95"/>
    <!-- hull deck stripe -->
    <path d="M 520 470 L 1080 470 L 1030 525 Q 800 552 570 525 Z" fill="#d97706" opacity="0.7"/>
  </g>
</svg>
