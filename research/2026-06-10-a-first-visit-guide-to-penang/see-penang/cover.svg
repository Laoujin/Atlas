<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pagoda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- decoration: low sun glow, outside safe zone -->
  <circle cx="800" cy="120" r="70" fill="#fef3ec" opacity="0.6"/>

  <!-- hero: stacked tiered pagoda silhouette, centered ~ (800,450) -->
  <g fill="url(#pagoda)" opacity="0.92">
    <polygon points="690,720 910,720 880,640 720,640"/>
    <polygon points="712,640 888,640 862,560 738,560"/>
    <polygon points="734,560 866,560 842,480 758,480"/>
    <polygon points="756,480 844,480 822,400 778,400"/>
    <polygon points="778,400 822,400 800,320 800,320"/>
    <rect x="794" y="270" width="12" height="60"/>
  </g>

  <!-- decoration: water band along bottom edge, below safe zone -->
  <rect x="0" y="816" width="1600" height="84" fill="#9a3309" opacity="0.7"/>
</svg>
