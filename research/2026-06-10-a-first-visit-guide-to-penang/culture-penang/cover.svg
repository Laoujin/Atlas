<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lant" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.9"/>

  <!-- decoration: suspension lines (outside safe zone, top) -->
  <path d="M620 0 L620 200 M800 0 L800 150 M980 0 L980 230" stroke="#fbbf24" stroke-width="3" opacity="0.6" fill="none"/>

  <!-- hero: cluster of three hanging lanterns centered ~ (800,450) -->
  <g opacity="0.92">
    <!-- side lantern left -->
    <ellipse cx="615" cy="470" rx="120" ry="155" fill="url(#lant)" opacity="0.85"/>
    <path d="M615 315 v-30 M615 625 v30" stroke="#fbbf24" stroke-width="5" opacity="0.7"/>
    <ellipse cx="615" cy="470" rx="60" ry="155" fill="#fef3ec" opacity="0.18"/>

    <!-- side lantern right -->
    <ellipse cx="985" cy="500" rx="120" ry="155" fill="url(#lant)" opacity="0.85"/>
    <path d="M985 345 v-30 M985 655 v30" stroke="#fbbf24" stroke-width="5" opacity="0.7"/>
    <ellipse cx="985" cy="500" rx="60" ry="155" fill="#fef3ec" opacity="0.18"/>

    <!-- central hero lantern (largest, front) -->
    <ellipse cx="800" cy="450" rx="160" ry="210" fill="url(#lant)"/>
    <path d="M800 240 v-40 M800 660 v40" stroke="#fbbf24" stroke-width="7" opacity="0.8"/>
    <rect x="700" y="225" width="200" height="22" rx="11" fill="#78350f" opacity="0.85"/>
    <rect x="700" y="655" width="200" height="22" rx="11" fill="#78350f" opacity="0.85"/>
    <ellipse cx="800" cy="450" rx="78" ry="200" fill="#fef3ec" opacity="0.22"/>
    <path d="M725 450 q75 -90 150 0 q-75 90 -150 0 z" fill="#c2410c" opacity="0.7"/>
  </g>
</svg>
