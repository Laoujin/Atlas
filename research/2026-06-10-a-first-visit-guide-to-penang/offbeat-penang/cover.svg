<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitcher" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="60%" stop-color="#7a2c12"/>
      <stop offset="100%" stop-color="#3a1709"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm nocturnal glow behind hero -->
  <circle cx="800" cy="430" r="430" fill="url(#glow)"/>

  <!-- HERO: carnivorous pitcher-plant silhouette, hanging from a tendril -->
  <g opacity="0.92">
    <path d="M800 120 C 760 200 700 250 690 330" fill="none" stroke="#7a2c12" stroke-width="10" stroke-linecap="round"/>
    <path d="M610 360
             C 560 380 560 440 575 520
             C 590 620 640 720 700 760
             C 760 790 840 790 900 760
             C 960 720 1010 620 1025 520
             C 1040 440 1040 380 990 360
             C 920 335 680 335 610 360 Z"
          fill="url(#pitcher)"/>
    <!-- mouth rim -->
    <ellipse cx="800" cy="360" rx="195" ry="48" fill="#fbbf24" opacity="0.85"/>
    <ellipse cx="800" cy="368" rx="150" ry="34" fill="#1a0e0e" opacity="0.9"/>
    <!-- lid -->
    <path d="M650 350 C 700 250 900 250 950 350 C 880 320 720 320 650 350 Z" fill="#c2410c" opacity="0.9"/>
  </g>

  <!-- decoration: faint reflected pool below safe zone -->
  <ellipse cx="800" cy="870" rx="320" ry="40" fill="#c2410c" opacity="0.6"/>
</svg>
