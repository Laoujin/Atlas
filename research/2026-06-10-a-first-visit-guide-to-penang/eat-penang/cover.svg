<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="broth" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fef3ec" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="92%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- decoration: warm spice flecks outside safe zone -->
  <circle cx="70" cy="120" r="8" fill="#d97706" opacity="0.5"/>
  <circle cx="1540" cy="780" r="10" fill="#c2410c" opacity="0.5"/>
  <circle cx="1500" cy="120" r="6" fill="#fbbf24" opacity="0.45"/>
  <circle cx="90" cy="820" r="7" fill="#be185d" opacity="0.4"/>

  <!-- steam silhouettes rising behind the bowl -->
  <path d="M720 470 C690 380 760 350 730 270 C710 220 760 180 745 130" fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M870 470 C900 380 830 350 860 270 C880 220 830 180 850 130" fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- hero: bowl of broth -->
  <ellipse cx="800" cy="470" rx="320" ry="300" fill="url(#bowl)" opacity="0.92"/>
  <ellipse cx="800" cy="470" rx="320" ry="300" fill="url(#rim)" opacity="0.9"/>
  <ellipse cx="800" cy="455" rx="270" ry="252" fill="url(#broth)" opacity="0.9"/>
  <ellipse cx="800" cy="700" rx="180" ry="40" fill="#78350f" opacity="0.85"/>

  <!-- chopsticks accent crossing the bowl -->
  <rect x="640" y="300" width="430" height="14" rx="7" fill="#1a0e0e" opacity="0.8" transform="rotate(22 855 307)"/>
  <rect x="640" y="334" width="430" height="14" rx="7" fill="#1a0e0e" opacity="0.8" transform="rotate(22 855 341)"/>
</svg>
