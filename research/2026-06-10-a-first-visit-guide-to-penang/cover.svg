<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="pagoda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="shop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- layered hillside ridge behind -->
  <path d="M0,560 C300,495 600,520 900,560 C1120,595 1400,535 1600,575 L1600,900 L0,900 Z" fill="url(#hill)" opacity="0.7"/>

  <!-- HERO: tiered pagoda -->
  <g fill="url(#pagoda)" opacity="0.92">
    <rect x="680" y="640" width="240" height="75"/>
    <rect x="690" y="530" width="220" height="50"/>
    <rect x="710" y="430" width="180" height="40"/>
    <rect x="730" y="340" width="140" height="40"/>
    <rect x="794" y="258" width="12" height="34"/>
    <circle cx="800" cy="252" r="9"/>
    <path d="M500,640 C570,632 700,580 800,580 C900,580 1030,632 1100,640 L1045,654 C940,612 660,612 555,654 Z"/>
    <path d="M570,530 C630,523 720,470 800,470 C880,470 970,523 1030,530 L985,544 C895,505 705,505 615,544 Z"/>
    <path d="M610,430 C660,424 740,380 800,380 C860,380 940,424 990,430 L948,444 C875,408 725,408 652,444 Z"/>
    <path d="M650,340 C695,334 760,290 800,290 C840,290 905,334 950,340 L912,354 C855,320 745,320 688,354 Z"/>
  </g>

  <!-- shophouse roofline band in front -->
  <path d="M0,800 L120,800 L180,760 L240,800 L420,800 L480,765 L540,800 L760,800 L820,756 L880,800 L1080,800 L1140,765 L1200,800 L1400,800 L1460,760 L1520,800 L1600,800 L1600,900 L0,900 Z" fill="url(#shop)" opacity="0.9"/>
