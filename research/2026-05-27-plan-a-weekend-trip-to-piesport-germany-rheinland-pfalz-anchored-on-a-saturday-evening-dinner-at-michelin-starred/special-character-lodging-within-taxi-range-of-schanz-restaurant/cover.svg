<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Warm sun glow over the river bend -->
  <ellipse cx="800" cy="560" rx="780" ry="360" fill="url(#glow)"/>

  <!-- Far ridge (left bank) -->
  <path d="M 0 540 L 220 470 L 420 495 L 640 455 L 860 480 L 1080 445 L 1280 470 L 1600 440 L 1600 620 L 0 620 Z"
        fill="url(#ridgeFar)" opacity="0.85"/>

  <!-- Terrace lines on far ridge (slate vineyard rows) -->
  <g stroke="#9a3309" stroke-width="1.2" opacity="0.45" fill="none">
    <path d="M 0 560 Q 400 530 800 545 T 1600 535"/>
    <path d="M 0 580 Q 400 555 800 568 T 1600 560"/>
    <path d="M 0 600 Q 400 580 800 590 T 1600 585"/>
  </g>

  <!-- River bend: sweeping curve catching the warm sky -->
  <path d="M 0 720 C 280 680 480 700 720 660 C 940 625 1100 640 1320 620 C 1450 610 1530 615 1600 612 L 1600 690 C 1500 700 1380 705 1240 715 C 1020 730 880 745 660 760 C 420 776 200 790 0 800 Z"
        fill="url(#river)" opacity="0.9"/>

  <!-- Near ridge (right bank, foreground) -->
  <path d="M 0 760 L 180 735 L 380 752 L 600 725 L 820 745 L 1040 720 L 1260 740 L 1600 715 L 1600 900 L 0 900 Z"
        fill="url(#ridgeNear)"/>

  <!-- Terrace lines on near ridge -->
  <g stroke="#5c2a1a" stroke-width="1.4" opacity="0.55" fill="none">
    <path d="M 0 790 Q 400 770 800 782 T 1600 772"/>
    <path d="M 0 815 Q 400 800 800 808 T 1600 800"/>
    <path d="M 0 845 Q 400 830 800 838 T 1600 832"/>
  </g>

  <!-- Hero: castle/inn silhouette on the ridge above the river bend, centered ~(800,450) -->
  <g transform="translate(720,360)">
    <!-- Main keep -->
    <rect x="40" y="40" width="100" height="120" fill="#1a0e0e"/>
    <!-- Roof -->
    <path d="M 30 40 L 90 0 L 150 40 Z" fill="#1a0e0e"/>
    <!-- Left tower -->
    <rect x="0" y="60" width="44" height="100" fill="#1a0e0e"/>
    <path d="M -4 60 L 22 30 L 48 60 Z" fill="#1a0e0e"/>
    <!-- Right tower (taller) -->
    <rect x="136" y="20" width="48" height="140" fill="#1a0e0e"/>
    <path d="M 132 20 L 160 -14 L 188 20 Z" fill="#1a0e0e"/>
    <!-- Tiny pennant pole -->
    <line x1="160" y1="-14" x2="160" y2="-34" stroke="#1a0e0e" stroke-width="2"/>
    <!-- Warm lit windows -->
    <rect x="60" y="80" width="8" height="14" fill="#fbbf24" opacity="0.95"/>
    <rect x="80" y="80" width="8" height="14" fill="#fbbf24" opacity="0.9"/>
    <rect x="110" y="80" width="8" height="14" fill="#fbbf24" opacity="0.95"/>
    <rect x="60" y="115" width="8" height="14" fill="#d97706" opacity="0.85"/>
    <rect x="110" y="115" width="8" height="14" fill="#fbbf24" opacity="0.9"/>
    <rect x="14" y="100" width="6" height="12" fill="#fbbf24" opacity="0.9"/>
    <rect x="14" y="130" width="6" height="12" fill="#d97706" opacity="0.8"/>
    <rect x="150" y="70" width="6" height="12" fill="#fbbf24" opacity="0.95"/>
    <rect x="166" y="70" width="6" height="12" fill="#fbbf24" opacity="0.9"/>
    <rect x="150" y="100" width="6" height="12" fill="#d97706" opacity="0.85"/>
    <rect x="166" y="130" width="6" height="12" fill="#fbbf24" opacity="0.9"/>

    <!-- Reflection shimmer hint below ridge -->
    <rect x="20" y="170" width="160" height="2" fill="#fbbf24" opacity="0.4"/>
  </g>

  <!-- A few subtle terrace vine markers on the slope below the castle -->
  <g fill="#c2410c" opacity="0.55">
    <circle cx="640" cy="610" r="2"/>
    <circle cx="700" cy="615" r="2"/>
    <circle cx="760" cy="600" r="2"/>
    <circle cx="900" cy="605" r="2"/>
    <circle cx="960" cy="612" r="2"/>
    <circle cx="1020" cy="600" r="2"/>
  </g>
</svg>
