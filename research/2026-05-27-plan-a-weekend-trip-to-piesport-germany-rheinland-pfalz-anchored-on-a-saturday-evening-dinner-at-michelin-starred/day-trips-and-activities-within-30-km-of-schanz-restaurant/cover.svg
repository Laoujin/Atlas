<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.28" r="0.22">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- far hill (left ridge of the Mosel bend) -->
  <path d="M 0 540 L 220 410 L 470 470 L 720 360 L 980 430 L 1240 380 L 1600 470 L 1600 900 L 0 900 Z"
        fill="url(#hillFar)" opacity="0.75"/>

  <!-- terraced vineyard lines on far hill -->
  <g stroke="#78350f" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M 200 460 Q 470 510 720 410 T 1240 430"/>
    <path d="M 180 495 Q 470 545 720 445 T 1240 465"/>
    <path d="M 160 530 Q 470 580 720 480 T 1240 500"/>
  </g>

  <!-- river bend (hero element, centered ~800,560) -->
  <path d="M 0 660 Q 360 600 700 640 T 1100 600 T 1600 640 L 1600 720 Q 1180 700 880 720 T 380 740 T 0 740 Z"
        fill="url(#river)" opacity="0.92"/>

  <!-- near hill / vineyard slope (hero foreground) -->
  <path d="M 0 760 L 240 660 L 520 700 L 820 600 L 1120 670 L 1380 620 L 1600 680 L 1600 900 L 0 900 Z"
        fill="url(#hillNear)"/>

  <!-- terraced vineyard rows on near hill -->
  <g stroke="#fbbf24" stroke-width="1.6" opacity="0.5" fill="none">
    <path d="M 60 770 Q 420 740 820 660 T 1500 700"/>
    <path d="M 60 805 Q 420 775 820 695 T 1500 735"/>
    <path d="M 60 840 Q 420 810 820 730 T 1500 770"/>
    <path d="M 60 875 Q 420 845 820 765 T 1500 805"/>
  </g>

  <!-- castle silhouette on the ridge crest (hero accent at ~820,580) -->
  <g fill="#1a0e0e" opacity="0.85">
    <rect x="788" y="556" width="64" height="44"/>
    <rect x="780" y="544" width="16" height="14"/>
    <rect x="820" y="540" width="14" height="18"/>
    <rect x="844" y="544" width="16" height="14"/>
    <polygon points="780,544 788,530 796,544"/>
    <polygon points="844,544 852,528 860,544"/>
    <rect x="812" y="572" width="6" height="14" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>
