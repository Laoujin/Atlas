<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="farSlope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="nearSlope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1100" cy="280" r="220" fill="url(#sun)" opacity="0.75"/>

  <!-- Far ridge -->
  <path d="M0,420 Q300,360 600,400 T1200,380 T1600,410 L1600,640 L0,640 Z" fill="url(#farSlope)" opacity="0.75"/>

  <!-- Near vineyard slope, curving with river bend -->
  <path d="M0,520 Q280,440 620,470 Q900,495 1180,455 Q1400,425 1600,470 L1600,720 L0,720 Z" fill="url(#nearSlope)" opacity="0.95"/>

  <!-- Vineyard rows: short angled strokes following the slope -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.45" stroke-linecap="round">
    <line x1="180" y1="540" x2="220" y2="525"/>
    <line x1="260" y1="535" x2="300" y2="520"/>
    <line x1="340" y1="528" x2="380" y2="515"/>
    <line x1="420" y1="522" x2="460" y2="510"/>
    <line x1="500" y1="518" x2="540" y2="508"/>
    <line x1="600" y1="512" x2="640" y2="505"/>
    <line x1="700" y1="510" x2="740" y2="503"/>
    <line x1="820" y1="508" x2="860" y2="500"/>
    <line x1="940" y1="500" x2="980" y2="492"/>
    <line x1="1060" y1="488" x2="1100" y2="478"/>
    <line x1="1180" y1="472" x2="1220" y2="462"/>
    <line x1="1300" y1="462" x2="1340" y2="455"/>

    <line x1="200" y1="580" x2="244" y2="565"/>
    <line x1="300" y1="575" x2="344" y2="560"/>
    <line x1="400" y1="568" x2="444" y2="554"/>
    <line x1="520" y1="560" x2="564" y2="548"/>
    <line x1="660" y1="554" x2="704" y2="544"/>
    <line x1="800" y1="548" x2="844" y2="540"/>
    <line x1="940" y1="540" x2="984" y2="532"/>
    <line x1="1080" y1="528" x2="1124" y2="518"/>
    <line x1="1220" y1="512" x2="1264" y2="502"/>

    <line x1="240" y1="625" x2="288" y2="610"/>
    <line x1="360" y1="618" x2="408" y2="602"/>
    <line x1="500" y1="610" x2="548" y2="596"/>
    <line x1="660" y1="600" x2="708" y2="588"/>
    <line x1="820" y1="592" x2="868" y2="582"/>
    <line x1="980" y1="582" x2="1028" y2="572"/>
    <line x1="1140" y1="570" x2="1188" y2="558"/>
  </g>

  <!-- River bend, sweeping across the middle -->
  <path d="M0,740 Q300,690 640,720 Q920,745 1220,710 Q1420,688 1600,712 L1600,820 Q1400,800 1200,810 Q900,825 620,810 Q300,795 0,820 Z" fill="url(#river)"/>
  <path d="M0,740 Q300,690 640,720 Q920,745 1220,710 Q1420,688 1600,712" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>

  <!-- Village cluster on the river bank -->
  <g opacity="0.92">
    <!-- Roof line cluster, small houses huddled at slope foot -->
    <rect x="640" y="668" width="38" height="34" fill="#78350f"/>
    <polygon points="640,668 659,650 678,668" fill="#9a3309"/>

    <rect x="678" y="660" width="46" height="42" fill="#5c2a1a"/>
    <polygon points="678,660 701,640 724,660" fill="#c2410c"/>

    <rect x="724" y="666" width="40" height="36" fill="#78350f"/>
    <polygon points="724,666 744,648 764,666" fill="#9a3309"/>

    <rect x="764" y="658" width="50" height="44" fill="#5c2a1a"/>
    <polygon points="764,658 789,636 814,658" fill="#c2410c"/>

    <!-- Church / hero building with steeple -->
    <rect x="820" y="640" width="44" height="62" fill="#78350f"/>
    <polygon points="820,640 842,612 864,640" fill="#9a3309"/>
    <rect x="836" y="600" width="12" height="40" fill="#5c2a1a"/>
    <polygon points="836,600 842,580 848,600" fill="#fbbf24"/>

    <rect x="864" y="666" width="42" height="36" fill="#78350f"/>
    <polygon points="864,666 885,648 906,666" fill="#9a3309"/>

    <rect x="906" y="662" width="38" height="40" fill="#5c2a1a"/>
    <polygon points="906,662 925,644 944,662" fill="#c2410c"/>

    <rect x="944" y="668" width="36" height="34" fill="#78350f"/>
    <polygon points="944,668 962,652 980,668" fill="#9a3309"/>
  </g>

  <!-- Reflection hints in river -->
  <g opacity="0.35">
    <rect x="678" y="725" width="46" height="20" fill="#5c2a1a"/>
    <rect x="764" y="728" width="50" height="22" fill="#5c2a1a"/>
    <rect x="820" y="725" width="44" height="28" fill="#78350f"/>
    <rect x="906" y="730" width="38" height="20" fill="#5c2a1a"/>
  </g>
</svg>
