<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="badgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="badgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="lanyard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- faint network lines (decoration, full-bleed-safe) -->
  <g stroke="#6d28d9" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M 0 180 L 340 260 L 620 200 L 980 300 L 1280 220 L 1600 280"/>
    <path d="M 0 720 L 280 640 L 600 720 L 940 660 L 1260 740 L 1600 680"/>
  </g>
  <g fill="#6d28d9" fill-opacity="0.35">
    <circle cx="340" cy="260" r="4"/>
    <circle cx="620" cy="200" r="4"/>
    <circle cx="980" cy="300" r="4"/>
    <circle cx="1280" cy="220" r="4"/>
    <circle cx="280" cy="640" r="4"/>
    <circle cx="600" cy="720" r="4"/>
    <circle cx="940" cy="660" r="4"/>
    <circle cx="1260" cy="740" r="4"/>
  </g>

  <!-- back badge (rotated left) -->
  <g transform="rotate(-7 720 470)" opacity="0.85">
    <rect x="470" y="240" width="500" height="460" rx="22" fill="url(#badgeBack)"/>
    <rect x="510" y="430" width="420" height="14" rx="4" fill="#fbbf24" opacity="0.5"/>
    <rect x="510" y="470" width="320" height="10" rx="3" fill="#fbbf24" opacity="0.4"/>
    <rect x="510" y="500" width="380" height="10" rx="3" fill="#fbbf24" opacity="0.35"/>
  </g>

  <!-- lanyard strap behind hero badge -->
  <path d="M 700 90 Q 800 200 800 260 L 800 300" stroke="url(#lanyard)" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M 900 90 Q 800 200 800 260 L 800 300" stroke="url(#lanyard)" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.85"/>
  <rect x="775" y="285" width="50" height="42" rx="6" fill="#334155"/>
  <circle cx="800" cy="306" r="6" fill="#1a0e0e"/>

  <!-- hero badge (front, slight right tilt) -->
  <g transform="rotate(4 830 510)">
    <rect x="580" y="310" width="500" height="460" rx="22" fill="url(#badgeFront)"/>
    <rect x="580" y="310" width="500" height="90" rx="22" fill="#9a3309" opacity="0.55"/>
    <rect x="580" y="380" width="500" height="6" fill="#78350f" opacity="0.5"/>
    <!-- abstract "speaker dot" + signal arcs as hero motif -->
    <circle cx="830" cy="540" r="26" fill="#faf8f2"/>
    <path d="M 770 540 A 60 60 0 0 1 890 540" stroke="#faf8f2" stroke-width="6" fill="none" opacity="0.9"/>
    <path d="M 740 540 A 90 90 0 0 1 920 540" stroke="#faf8f2" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M 710 540 A 120 120 0 0 1 950 540" stroke="#faf8f2" stroke-width="4" fill="none" opacity="0.5"/>
    <!-- info bars -->
    <rect x="640" y="650" width="380" height="12" rx="4" fill="#faf8f2" opacity="0.85"/>
    <rect x="640" y="680" width="280" height="10" rx="3" fill="#faf8f2" opacity="0.6"/>
    <rect x="640" y="708" width="320" height="10" rx="3" fill="#faf8f2" opacity="0.5"/>
  </g>
</svg>
