<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2e1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="mill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- full-bleed nocturnal sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant vineyard hills (decoration, partially cropped on detail view) -->
  <path d="M 0 620 Q 200 540 420 580 T 820 560 T 1240 590 T 1600 570 L 1600 900 L 0 900 Z" fill="url(#hills)" opacity="0.85"/>
  <path d="M 0 700 Q 260 640 540 670 T 1020 660 T 1600 680 L 1600 900 L 0 900 Z" fill="#1a0e0e" opacity="0.9"/>

  <!-- ambient glow behind hero -->
  <ellipse cx="800" cy="430" rx="520" ry="320" fill="url(#glow)"/>

  <!-- Michelin star, hero centerpiece, well inside safe zone -->
  <g transform="translate(800 280)">
    <polygon points="0,-130 38,-40 134,-40 56,18 86,110 0,55 -86,110 -56,18 -134,-40 -38,-40"
             fill="url(#star)" opacity="0.95"/>
    <polygon points="0,-130 38,-40 134,-40 56,18 86,110 0,55 -86,110 -56,18 -134,-40 -38,-40"
             fill="none" stroke="#fef3ec" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- mill silhouette directly below the star, hero anchor -->
  <g transform="translate(800 560)">
    <!-- mill body -->
    <rect x="-110" y="-110" width="220" height="220" fill="url(#mill)"/>
    <!-- pitched roof -->
    <polygon points="-130,-110 130,-110 0,-200" fill="#3a1808"/>
    <!-- warm-lit window -->
    <rect x="-30" y="-50" width="60" height="70" fill="#fbbf24" opacity="0.85"/>
    <rect x="-30" y="-50" width="60" height="70" fill="none" stroke="#78350f" stroke-width="3"/>
    <line x1="0" y1="-50" x2="0" y2="20" stroke="#78350f" stroke-width="3"/>
    <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#78350f" stroke-width="3"/>
    <!-- waterwheel on the side -->
    <circle cx="135" cy="60" r="55" fill="none" stroke="#9a3309" stroke-width="6" opacity="0.9"/>
    <circle cx="135" cy="60" r="10" fill="#9a3309"/>
    <line x1="135" y1="5" x2="135" y2="115" stroke="#9a3309" stroke-width="4"/>
    <line x1="80" y1="60" x2="190" y2="60" stroke="#9a3309" stroke-width="4"/>
    <line x1="96" y1="21" x2="174" y2="99" stroke="#9a3309" stroke-width="4"/>
    <line x1="96" y1="99" x2="174" y2="21" stroke="#9a3309" stroke-width="4"/>
  </g>

  <!-- rose accent: a single ribbon of vineyard rows curving toward the mill -->
  <path d="M 200 740 Q 600 700 800 720 T 1400 740"
        fill="none" stroke="#be185d" stroke-width="3" opacity="0.55"/>
  <path d="M 240 770 Q 620 730 800 750 T 1380 770"
        fill="none" stroke="#be185d" stroke-width="2" opacity="0.4"/>

  <!-- scattered stars (decoration, edges may crop) -->
  <circle cx="180" cy="160" r="2.5" fill="#fef3ec" opacity="0.8"/>
  <circle cx="320" cy="110" r="1.8" fill="#fef3ec" opacity="0.7"/>
  <circle cx="500" cy="180" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1100" cy="140" r="2.2" fill="#fef3ec" opacity="0.8"/>
  <circle cx="1280" cy="200" r="1.8" fill="#fef3ec" opacity="0.65"/>
  <circle cx="1440" cy="120" r="2.5" fill="#fbbf24" opacity="0.75"/>
  <circle cx="1380" cy="280" r="1.6" fill="#fef3ec" opacity="0.6"/>
  <circle cx="240" cy="280" r="1.6" fill="#fef3ec" opacity="0.55"/>
</svg>
