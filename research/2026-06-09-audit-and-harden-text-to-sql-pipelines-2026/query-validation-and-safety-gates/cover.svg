<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#3b1a10"/>
    </linearGradient>
    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Shield inner fill -->
    <radialGradient id="shieldFill" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.05"/>
    </radialGradient>
    <!-- Orbit glow -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Node violet -->
    <radialGradient id="nodeV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Node rust -->
    <radialGradient id="nodeR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#orbitGlow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), bounding box ~700 wide x 500 tall -->

  <!-- Outer orbit ring -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Mid orbit ring -->
  <circle cx="800" cy="450" r="195" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- Inner orbit ring -->
  <circle cx="800" cy="450" r="105" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Flow lines from outer nodes to hub — violet input nodes at top-left and bottom-left -->
  <!-- Top-left node to hub -->
  <line x1="560" y1="270" x2="730" y2="390" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Bottom-left node to hub -->
  <line x1="555" y1="625" x2="730" y2="510" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Right node outbound from hub — rust output -->
  <line x1="870" y1="450" x2="1060" y2="385" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.65"/>
  <!-- Blocked line (diagonal cut) at hub exit — right-side reject path -->
  <line x1="870" y1="450" x2="1045" y2="530" stroke="#78350f" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Outer violet input nodes -->
  <circle cx="560" cy="270" r="22" fill="url(#nodeV)" opacity="0.9"/>
  <circle cx="555" cy="625" r="22" fill="url(#nodeV)" opacity="0.85"/>

  <!-- Outer rust output node (approved) -->
  <circle cx="1060" cy="385" r="18" fill="url(#nodeR)" opacity="0.9"/>
  <!-- Outer rust node (rejected/blocked) -->
  <circle cx="1045" cy="530" r="14" fill="#78350f" opacity="0.55"/>
  <!-- Rejection X mark on blocked node -->
  <line x1="1037" y1="522" x2="1053" y2="538" stroke="#c2410c" stroke-width="2.2" stroke-opacity="0.75"/>
  <line x1="1053" y1="522" x2="1037" y2="538" stroke="#c2410c" stroke-width="2.2" stroke-opacity="0.75"/>

  <!-- Mid-ring relay nodes on orbit path -->
  <circle cx="680" cy="265" r="11" fill="#6d28d9" opacity="0.55"/>
  <circle cx="920" cy="260" r="9" fill="#6d28d9" opacity="0.38"/>
  <circle cx="660" cy="635" r="11" fill="#6d28d9" opacity="0.5"/>

  <!-- Central hub: shield shape -->
  <!-- Shield body -->
  <path d="M800,340 L880,370 L880,455 Q880,515 800,545 Q720,515 720,455 L720,370 Z"
        fill="url(#hubGlow)" opacity="0.92"/>
  <!-- Shield inner highlight -->
  <path d="M800,355 L866,381 L866,453 Q866,507 800,533 Q734,507 734,453 L734,381 Z"
        fill="url(#shieldFill)" opacity="0.85"/>
  <!-- Shield border -->
  <path d="M800,340 L880,370 L880,455 Q880,515 800,545 Q720,515 720,455 L720,370 Z"
        fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Check mark inside shield — gate passed symbol -->
  <polyline points="768,445 790,468 838,415"
            fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/>

  <!-- Layer 3: corner/edge decoration (outside hero safe zone, atmospheric only) -->
  <!-- Top-left faint arc -->
  <path d="M0,0 Q200,80 120,260" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.18"/>
  <!-- Bottom-right faint arc -->
  <path d="M1600,900 Q1400,820 1480,640" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.18"/>
  <!-- Top-right corner dot cluster -->
  <circle cx="1480" cy="80" r="5" fill="#6d28d9" opacity="0.22"/>
  <circle cx="1510" cy="110" r="3" fill="#6d28d9" opacity="0.15"/>
  <!-- Bottom-left corner dot -->
  <circle cx="110" cy="820" r="5" fill="#d97706" opacity="0.2"/>
</svg>
