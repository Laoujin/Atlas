<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: warm rust to amber -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0eadb;stop-opacity:1" />
    </linearGradient>

    <!-- Rust hero gradient: deep to mid rust -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9a3309;stop-opacity:0.85" />
    </linearGradient>

    <!-- Slate security accent: teal-slate with opacity -->
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:0.6" />
    </linearGradient>

    <!-- Highlight: subtle amber accent for "access granted" metaphor -->
    <radialGradient id="accessGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Decorative corner geometry (will be cropped, non-essential) -->
  <g opacity="0.08">
    <circle cx="100" cy="50" r="150" fill="#78350f" />
    <circle cx="1550" cy="900" r="200" fill="#78350f" />
  </g>

  <!-- Hero: stacked row rectangles (data partitions) -->
  <g>
    <!-- Row 1: topmost -->
    <rect x="550" y="200" width="500" height="80" fill="url(#rustGrad)" rx="4" />

    <!-- Row 2: middle-upper -->
    <rect x="550" y="310" width="500" height="80" fill="#c2410c" opacity="0.8" rx="4" />

    <!-- Row 3: middle -->
    <rect x="550" y="420" width="500" height="80" fill="url(#rustGrad)" opacity="0.75" rx="4" />

    <!-- Row 4: lower -->
    <rect x="550" y="530" width="500" height="80" fill="#9a3309" opacity="0.7" rx="4" />
  </g>

  <!-- Security boundary overlay: diagonal gate / barrier across rows -->
  <g opacity="0.65">
    <rect x="920" y="180" width="140" height="480" fill="url(#securityGrad)" transform="skewX(-15)" rx="8" />
  </g>

  <!-- Access control indicator: small gate shape on the boundary -->
  <g>
    <!-- Left pillar of gate -->
    <rect x="920" y="340" width="25" height="180" fill="#334155" opacity="0.85" rx="3" />

    <!-- Right pillar of gate -->
    <rect x="1035" y="340" width="25" height="180" fill="#334155" opacity="0.85" rx="3" />

    <!-- Top bar of gate -->
    <rect x="920" y="335" width="140" height="20" fill="#0e7490" opacity="0.75" rx="2" />

    <!-- Glow effect: access granted in center -->
    <circle cx="992" cy="430" r="80" fill="url(#accessGlow)" />
  </g>

  <!-- Faint inner lines on rows (suggests data/partitioning without being text) -->
  <g opacity="0.15" stroke="#78350f" stroke-width="2">
    <line x1="570" y1="240" x2="1020" y2="240" />
    <line x1="570" y1="350" x2="1020" y2="350" />
    <line x1="570" y1="460" x2="1020" y2="460" />
    <line x1="570" y1="570" x2="1020" y2="570" />
  </g>

  <!-- Optional corner accent: minimal geometric frame (decorative, crops variably) -->
  <g opacity="0.12" stroke="#9a3309" stroke-width="3" fill="none">
    <path d="M 150 100 L 200 100 L 200 150" />
    <path d="M 1450 800 L 1400 800 L 1400 750" />
  </g>
</svg>