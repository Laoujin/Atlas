<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal feel for a security topic -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero block top face -->
    <linearGradient id="heroTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Hero block side face -->
    <linearGradient id="heroSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Pipeline layer 1 (bottom) -->
    <linearGradient id="layer1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e0338" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Pipeline layer 2 -->
    <linearGradient id="layer2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.80"/>
    </linearGradient>
    <!-- Shield gradient -->
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Semantic glow radial -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Arrow connector gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Semantic glow behind hero -->
  <ellipse cx="800" cy="460" rx="520" ry="300" fill="url(#glow)"/>

  <!-- Layer 2: Pipeline stacked parallelogram blocks (isometric-ish) -->
  <!-- Block 3 (bottom / back): NL input layer -->
  <polygon points="480,590 1040,590 1120,640 560,640" fill="url(#layer1)" opacity="0.75"/>
  <polygon points="1040,590 1120,590 1120,640 1040,640" fill="#1e0338" opacity="0.6"/>
  <polygon points="480,590 480,640 560,640 560,590" fill="#2a0548" opacity="0.6"/>

  <!-- Block 2 (middle): LLM schema-grounding layer -->
  <polygon points="500,510 1060,510 1140,560 580,560" fill="url(#layer2)" opacity="0.85"/>
  <polygon points="1060,510 1140,510 1140,560 1060,560" fill="#2e1065" opacity="0.65"/>
  <polygon points="500,510 500,560 580,560 580,510" fill="#3b0764" opacity="0.65"/>

  <!-- Block 1 (hero / top): safe SQL execution layer — rust colour -->
  <polygon points="520,430 1080,430 1160,480 600,480" fill="url(#heroTop)" opacity="0.95"/>
  <polygon points="1080,430 1160,430 1160,480 1080,480" fill="url(#heroSide)" opacity="0.90"/>
  <polygon points="520,430 520,480 600,480 600,430" fill="#78350f" opacity="0.85"/>

  <!-- Connector arrows between blocks (right side, flowing down) -->
  <line x1="1150" y1="455" x2="1150" y2="485" stroke="url(#arrowGrad)" stroke-width="3" opacity="0.7"/>
  <line x1="1130" y1="535" x2="1130" y2="565" stroke="url(#arrowGrad)" stroke-width="3" opacity="0.7"/>

  <!-- Layer 3: Shield hero element centred on the top block -->
  <!-- Shield body -->
  <path d="M800,350 L870,380 L870,440 Q870,490 800,510 Q730,490 730,440 L730,380 Z"
        fill="url(#shield)" opacity="0.92"/>
  <!-- Shield inner inset (darker) -->
  <path d="M800,368 L854,393 L854,442 Q854,483 800,500 Q746,483 746,442 L746,393 Z"
        fill="#78350f" opacity="0.55"/>
  <!-- Shield check-mark (lock bolt) — simple geometric, no letters -->
  <rect x="787" y="428" width="26" height="20" rx="3" fill="#fbbf24" opacity="0.90"/>
  <rect x="792" y="418" width="16" height="16" rx="8" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.90"/>

  <!-- Concentric orbit arcs (pgvector semantic search motif) -->
  <ellipse cx="800" cy="450" rx="360" ry="200" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.30" stroke-dasharray="12 8"/>
  <ellipse cx="800" cy="450" rx="440" ry="250" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.18" stroke-dasharray="8 12"/>

  <!-- Small node dots on orbit (semantic neighbours) -->
  <circle cx="440" cy="450" r="7" fill="#6d28d9" opacity="0.55"/>
  <circle cx="1160" cy="450" r="7" fill="#6d28d9" opacity="0.55"/>
  <circle cx="800" cy="255" r="5" fill="#6d28d9" opacity="0.40"/>
  <circle cx="800" cy="648" r="5" fill="#6d28d9" opacity="0.40"/>

  <!-- Edge lines from centre node to orbit nodes -->
  <line x1="800" y1="450" x2="447" y2="450" stroke="#6d28d9" stroke-width="1.5" opacity="0.28"/>
  <line x1="800" y1="450" x2="1153" y2="450" stroke="#6d28d9" stroke-width="1.5" opacity="0.28"/>

  <!-- Decorative corner accent (bottom-left, outside safe zone — pure atmosphere) -->
  <polygon points="0,900 180,900 0,720" fill="#c2410c" opacity="0.08"/>
  <!-- Top-right corner accent -->
  <polygon points="1600,0 1600,180 1420,0" fill="#6d28d9" opacity="0.06"/>
</svg>
