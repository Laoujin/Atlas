<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main background gradient: rust to warm earth -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0eadb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3ec;stop-opacity:1" />
    </linearGradient>

    <!-- Rust node gradient: warm metallic -->
    <radialGradient id="nodeGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#9a3309;stop-opacity:0.85" />
    </radialGradient>

    <!-- Secondary slate accent for lock/security -->
    <radialGradient id="lockGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#0e7490;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.8" />
    </radialGradient>

    <!-- Subtle glow for monitoring aesthetic -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGradient)"/>

  <!-- Subtle decorative background orbits (faint monitoring aesthetic) -->
  <circle cx="400" cy="350" r="180" fill="none" stroke="#d97706" stroke-width="1" opacity="0.08"/>
  <circle cx="400" cy="350" r="120" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.12"/>

  <circle cx="1200" cy="500" r="160" fill="none" stroke="#d97706" stroke-width="1" opacity="0.08"/>
  <circle cx="1200" cy="500" r="100" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.12"/>

  <!-- Connection lines between nodes (representing distributed systems) -->
  <line x1="500" y1="320" x2="750" y2="380" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
  <line x1="750" y1="380" x2="950" y2="350" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
  <line x1="950" y1="350" x2="800" y2="550" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
  <line x1="500" y1="320" x2="800" y2="550" stroke="#9a3309" stroke-width="2" opacity="0.25"/>
  <line x1="950" y1="350" x2="1100" y2="480" stroke="#c2410c" stroke-width="3" opacity="0.3"/>

  <!-- Left node cluster: observability sources -->
  <circle cx="500" cy="320" r="65" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="500" cy="320" r="50" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>

  <!-- Center-left node -->
  <circle cx="750" cy="380" r="60" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="750" cy="380" r="45" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>

  <!-- Center node (primary hub) -->
  <circle cx="950" cy="350" r="75" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="950" cy="350" r="58" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.45"/>

  <!-- Bottom center node: audit trail repository -->
  <circle cx="800" cy="550" r="70" fill="url(#nodeGradient)" filter="url(#glow)"/>
  <circle cx="800" cy="550" r="53" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>

  <!-- Right node: security/compliance (slate accent for secondary hue) -->
  <circle cx="1100" cy="480" r="68" fill="url(#lockGradient)" filter="url(#glow)"/>
  <circle cx="1100" cy="480" r="52" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>

  <!-- Lock symbol on the security node (simple padlock shape) -->
  <!-- Lock body -->
  <rect x="1080" y="500" width="40" height="38" rx="4" fill="none" stroke="#64748b" stroke-width="2" opacity="0.7"/>
  <!-- Lock shackle (curved top) -->
  <path d="M 1090 500 Q 1090 470 1100 470 Q 1110 470 1110 500" fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.7"/>
  <!-- Lock keyhole -->
  <circle cx="1100" cy="510" r="3.5" fill="#64748b" opacity="0.7"/>

  <!-- Subtle checksum/data integrity accent lines on audit node -->
  <line x1="765" y1="525" x2="835" y2="525" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
  <line x1="765" y1="535" x2="835" y2="535" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
  <line x1="765" y1="545" x2="835" y2="545" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
</svg>