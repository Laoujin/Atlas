<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark, nocturnal — security/database theme -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>

    <!-- Database cylinder top ellipse fill -->
    <radialGradient id="cylTopGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Database cylinder body fill -->
    <linearGradient id="cylBodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="40%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3b1209"/>
    </linearGradient>

    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Shield highlight -->
    <linearGradient id="shieldHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow radial for database -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Lock shackle arc fill -->
    <linearGradient id="lockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette rings for depth -->
  <ellipse cx="800" cy="450" rx="820" ry="480" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.08"/>
  <ellipse cx="800" cy="450" rx="700" ry="400" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.06"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="470" rx="380" ry="280" fill="url(#glowGrad)"/>

  <!-- Layer 2: Hero element — Database cylinder + Shield, centered at (800, 450) -->

  <!-- Database cylinder: three stacked tiers -->
  <!-- Tier 3 (bottom) -->
  <rect x="560" y="570" width="480" height="80" rx="4" fill="url(#cylBodyGrad)" opacity="0.82"/>
  <ellipse cx="800" cy="570" rx="240" ry="38" fill="url(#cylTopGrad)" opacity="0.78"/>
  <ellipse cx="800" cy="650" rx="240" ry="38" fill="#3b1209" opacity="0.85"/>

  <!-- Tier 2 (middle) -->
  <rect x="560" y="470" width="480" height="100" rx="4" fill="url(#cylBodyGrad)" opacity="0.88"/>
  <ellipse cx="800" cy="470" rx="240" ry="38" fill="url(#cylTopGrad)" opacity="0.82"/>
  <ellipse cx="800" cy="570" rx="240" ry="38" fill="#4a1a08" opacity="0.70"/>

  <!-- Tier 1 (top) -->
  <rect x="560" y="370" width="480" height="100" rx="4" fill="url(#cylBodyGrad)" opacity="0.92"/>
  <ellipse cx="800" cy="370" rx="240" ry="38" fill="url(#cylTopGrad)" opacity="0.95"/>
  <ellipse cx="800" cy="470" rx="240" ry="38" fill="#5c2208" opacity="0.65"/>

  <!-- Subtle horizontal stripe lines on cylinder body (faint row/table metaphor) -->
  <line x1="564" y1="420" x2="1036" y2="420" stroke="#fbbf24" stroke-width="1.5" opacity="0.18"/>
  <line x1="564" y1="440" x2="1036" y2="440" stroke="#fbbf24" stroke-width="1.5" opacity="0.12"/>
  <line x1="564" y1="520" x2="1036" y2="520" stroke="#fbbf24" stroke-width="1.5" opacity="0.18"/>
  <line x1="564" y1="540" x2="1036" y2="540" stroke="#fbbf24" stroke-width="1.5" opacity="0.12"/>
  <line x1="564" y1="620" x2="1036" y2="620" stroke="#fbbf24" stroke-width="1.5" opacity="0.15"/>

  <!-- Shield overlaid on upper-front of database -->
  <!-- Shield body path: pointed bottom, rounded top shoulders -->
  <path d="M800,210 L940,270 L940,390 Q940,480 800,530 Q660,480 660,390 L660,270 Z"
        fill="url(#shieldGrad)" opacity="0.93"/>
  <!-- Shield inner highlight -->
  <path d="M800,230 L920,282 L920,390 Q920,468 800,512 Q680,468 680,390 L680,282 Z"
        fill="url(#shieldHighlight)" opacity="0.7"/>
  <!-- Shield border -->
  <path d="M800,210 L940,270 L940,390 Q940,480 800,530 Q660,480 660,390 L660,270 Z"
        fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.55"/>

  <!-- Lock icon centered on shield -->
  <!-- Lock body (rounded rectangle) -->
  <rect x="762" y="370" width="76" height="62" rx="10" fill="url(#lockGrad)" opacity="0.95"/>
  <!-- Lock shackle (arc/U-shape) -->
  <path d="M776,370 L776,340 Q776,310 800,310 Q824,310 824,340 L824,370"
        fill="none" stroke="url(#lockGrad)" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <!-- Lock keyhole -->
  <circle cx="800" cy="395" r="9" fill="#78350f" opacity="0.95"/>
  <rect x="796" y="395" width="8" height="18" rx="3" fill="#78350f" opacity="0.95"/>

  <!-- Layer 3: Corner/edge decorations (outside safe zone, atmospheric only) -->
  <!-- Top-left faint arc -->
  <path d="M0,0 Q200,0 200,180" fill="none" stroke="#c2410c" stroke-width="60" opacity="0.07" stroke-linecap="round"/>
  <!-- Bottom-right faint arc -->
  <path d="M1600,900 Q1400,900 1400,720" fill="none" stroke="#9a3309" stroke-width="60" opacity="0.07" stroke-linecap="round"/>
  <!-- Top-right thin accent -->
  <path d="M1600,0 Q1380,0 1380,160" fill="none" stroke="#d97706" stroke-width="2" opacity="0.12"/>
  <!-- Bottom-left thin accent -->
  <path d="M0,900 Q220,900 220,740" fill="none" stroke="#d97706" stroke-width="2" opacity="0.12"/>
</svg>
