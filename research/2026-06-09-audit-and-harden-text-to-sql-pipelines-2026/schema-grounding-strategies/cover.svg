<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- connecting edges: query hub -> schema tables -->
  <g stroke="#fbbf24" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M560 450 L980 300"/>
    <path d="M560 450 L980 450"/>
    <path d="M560 450 L980 600"/>
  </g>
  <g fill="#fef3ec" opacity="0.9">
    <circle cx="760" cy="375" r="9"/>
    <circle cx="800" cy="525" r="9"/>
  </g>

  <!-- query hub (LLM node) -->
  <circle cx="500" cy="450" r="150" fill="#78350f" opacity="0.9"/>
  <circle cx="500" cy="450" r="150" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.5"/>
  <circle cx="500" cy="450" r="92" fill="url(#hub)" opacity="0.95"/>
  <circle cx="500" cy="450" r="40" fill="#1a0e0e" opacity="0.85"/>

  <!-- schema tables (grounded structure) -->
  <g opacity="0.92">
    <rect x="980" y="240" width="300" height="120" rx="10" fill="url(#tbl)"/>
    <rect x="980" y="280" width="300" height="2" fill="#1a0e0e" opacity="0.5"/>
    <rect x="1005" y="262" width="120" height="10" rx="5" fill="#fef3ec" opacity="0.85"/>
    <rect x="1005" y="305" width="250" height="8" rx="4" fill="#1a0e0e" opacity="0.35"/>
    <rect x="1005" y="328" width="200" height="8" rx="4" fill="#1a0e0e" opacity="0.35"/>

    <rect x="1010" y="400" width="300" height="120" rx="10" fill="url(#tbl)"/>
    <rect x="1010" y="440" width="300" height="2" fill="#1a0e0e" opacity="0.5"/>
    <rect x="1035" y="422" width="120" height="10" rx="5" fill="#fef3ec" opacity="0.85"/>
    <rect x="1035" y="465" width="250" height="8" rx="4" fill="#1a0e0e" opacity="0.35"/>
    <rect x="1035" y="488" width="200" height="8" rx="4" fill="#1a0e0e" opacity="0.35"/>

    <rect x="980" y="560" width="300" height="120" rx="10" fill="url(#tbl)"/>
    <rect x="980" y="600" width="300" height="2" fill="#1a0e0e" opacity="0.5"/>
    <rect x="1005" y="582" width="120" height="10" rx="5" fill="#fef3ec" opacity="0.85"/>
    <rect x="1005" y="625" width="250" height="8" rx="4" fill="#1a0e0e" opacity="0.35"/>
    <rect x="1005" y="648" width="200" height="8" rx="4" fill="#1a0e0e" opacity="0.35"/>
  </g>
</svg>
