<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- search-radius rings around the query point -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.35"/>
  <circle cx="800" cy="450" r="210" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
  <circle cx="800" cy="450" r="120" fill="#fbbf24" opacity="0.12"/>

  <!-- edges from query hub to nearest neighbours -->
  <g stroke="#9a3309" stroke-width="3" opacity="0.7">
    <line x1="800" y1="450" x2="630" y2="320"/>
    <line x1="800" y1="450" x2="975" y2="345"/>
    <line x1="800" y1="450" x2="935" y2="585"/>
    <line x1="800" y1="450" x2="650" y2="575"/>
  </g>

  <!-- nearest-neighbour vector nodes (in-radius, opaque) -->
  <circle cx="630" cy="320" r="34" fill="url(#node)" opacity="0.92"/>
  <circle cx="975" cy="345" r="38" fill="url(#node)" opacity="0.92"/>
  <circle cx="935" cy="585" r="30" fill="url(#node)" opacity="0.92"/>
  <circle cx="650" cy="575" r="36" fill="url(#node)" opacity="0.92"/>

  <!-- distant nodes (out-of-radius, faded) -->
  <circle cx="380" cy="240" r="22" fill="#78350f" opacity="0.4"/>
  <circle cx="1230" cy="250" r="26" fill="#78350f" opacity="0.4"/>
  <circle cx="1260" cy="660" r="20" fill="#78350f" opacity="0.4"/>
  <circle cx="340" cy="660" r="24" fill="#78350f" opacity="0.4"/>

  <!-- query hub hero -->
  <circle cx="800" cy="450" r="62" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="62" fill="none" stroke="#faf8f2" stroke-width="4" opacity="0.8"/>
</svg>
