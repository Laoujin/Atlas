<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)" opacity="0.7"/>

  <!-- database cylinder (hero, centered ~640,450) -->
  <g opacity="0.95">
    <ellipse cx="640" cy="300" rx="200" ry="58" fill="#fbbf24"/>
    <path d="M440 300 L440 560 A200 58 0 0 0 840 560 L840 300 A200 58 0 0 1 440 300 Z" fill="url(#cyl)"/>
    <ellipse cx="640" cy="380" rx="200" ry="58" fill="none" stroke="#78350f" stroke-width="3" opacity="0.6"/>
    <ellipse cx="640" cy="470" rx="200" ry="58" fill="none" stroke="#78350f" stroke-width="3" opacity="0.6"/>
    <ellipse cx="640" cy="300" rx="200" ry="58" fill="none" stroke="#9a3309" stroke-width="3"/>
  </g>

  <!-- naive query path: starts clean (violet), fractures toward the DB -->
  <path d="M1180 200 L1010 290 L1090 360 L920 430 L1000 500 L860 560"
        fill="none" stroke="#6d28d9" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <!-- broken / dropped segment indicating failure -->
  <path d="M1000 500 L1060 470" fill="none" stroke="#c2410c" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M920 430 L860 400" fill="none" stroke="#c2410c" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- origin node (the prompt) -->
  <circle cx="1180" cy="200" r="34" fill="#6d28d9" opacity="0.9"/>
  <circle cx="1180" cy="200" r="34" fill="none" stroke="#fbbf24" stroke-width="3"/>

  <!-- error spark where the path hits the data -->
  <path d="M860 560 l28 -14 l-12 26 l30 4 l-26 20 l8 28 l-26 -18 l-22 16 l6 -28 l-22 -14 l28 -6 Z"
        fill="#fbbf24" opacity="0.95"/>
</svg>
