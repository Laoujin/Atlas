<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- hero: champagne flute centered at (800,450) -->
  <!-- bowl -->
  <path d="M735 250 Q735 430 800 470 Q865 430 865 250 Z" fill="url(#wine)" opacity="0.92"/>
  <!-- liquid surface highlight -->
  <ellipse cx="800" cy="252" rx="65" ry="12" fill="#fef3ec" opacity="0.6"/>
  <!-- stem -->
  <rect x="795" y="470" width="10" height="150" fill="#fbbf24" opacity="0.85"/>
  <!-- base -->
  <ellipse cx="800" cy="628" rx="78" ry="16" fill="#d97706" opacity="0.85"/>

  <!-- rising bubbles -->
  <circle cx="788" cy="400" r="7" fill="#fef3ec" opacity="0.8"/>
  <circle cx="812" cy="360" r="5" fill="#fef3ec" opacity="0.75"/>
  <circle cx="795" cy="330" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="808" cy="300" r="4" fill="#fef3ec" opacity="0.7"/>
  <circle cx="797" cy="190" r="6" fill="#fbbf24" opacity="0.7"/>
  <circle cx="814" cy="160" r="4" fill="#fef3ec" opacity="0.65"/>
  <circle cx="804" cy="130" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="792" cy="105" r="3" fill="#fef3ec" opacity="0.55"/>
</svg>
