<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table radial glow -->
    <radialGradient id="tableGlow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient — main -->
    <radialGradient id="plateMain" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>
    <!-- Plate gradient — second (smaller, offset) -->
    <radialGradient id="plateSecond" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="70%" stop-color="#d6c9b4"/>
      <stop offset="100%" stop-color="#b8a898"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="88%" stop-color="#1a0e0e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.42"/>
    </radialGradient>
    <!-- Star fill -->
    <radialGradient id="starFill" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Candle flame gradient -->
    <radialGradient id="flame" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient table glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Subtle edge vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone x:125–1475, y:90–810 -->

  <!-- Main plate — center hero, ~380px radius -->
  <ellipse cx="800" cy="490" rx="370" ry="358" fill="url(#plateMain)" opacity="0.97"/>
  <!-- Plate inner ring (well) -->
  <ellipse cx="800" cy="490" rx="290" ry="280" fill="url(#plateMain)" opacity="0.6"/>
  <!-- Plate rim shading -->
  <ellipse cx="800" cy="490" rx="370" ry="358" fill="url(#plateRim)"/>

  <!-- Second plate — partially behind, offset left -->
  <ellipse cx="476" cy="530" rx="228" ry="220" fill="url(#plateSecond)" opacity="0.62"/>
  <ellipse cx="476" cy="530" rx="228" ry="220" fill="url(#plateRim)" opacity="0.7"/>

  <!-- Wine glass silhouette — right side, accent -->
  <!-- Bowl -->
  <path d="M1100 310 Q1060 380 1058 440 Q1056 500 1100 520 Q1144 500 1142 440 Q1140 380 1100 310 Z"
        fill="url(#glassGrad)" opacity="0.82"/>
  <!-- Stem -->
  <rect x="1094" y="520" width="12" height="110" rx="6" fill="#fef3ec" opacity="0.55"/>
  <!-- Base -->
  <ellipse cx="1100" cy="636" rx="46" ry="10" fill="#fef3ec" opacity="0.45"/>

  <!-- Candle — left accent, behind second plate area -->
  <rect x="390" y="270" width="18" height="80" rx="4" fill="#faf8f2" opacity="0.55"/>
  <ellipse cx="399" cy="265" rx="14" ry="22" fill="url(#flame)" opacity="0.85"/>

  <!-- Michelin stars — three stars in a subtle arc above main plate -->
  <!-- Star helper: 5-point polygon centered. Using path for clean stars. -->
  <!-- Star 1 — leftmost -->
  <polygon points="686,202 693,224 716,224 698,237 705,259 686,246 667,259 674,237 656,224 679,224"
           fill="url(#starFill)" opacity="0.93"/>
  <!-- Star 2 — center, slightly larger/brighter -->
  <polygon points="800,188 809,216 838,216 816,232 824,260 800,244 776,260 784,232 762,216 791,216"
           fill="url(#starFill)" opacity="0.97"/>
  <!-- Star 3 — rightmost -->
  <polygon points="914,202 921,224 944,224 926,237 933,259 914,246 895,259 902,237 884,224 907,224"
           fill="url(#starFill)" opacity="0.93"/>

  <!-- Sauce swipe on plate — decorative arc suggesting plating artistry -->
  <path d="M680 470 Q760 440 840 460 Q900 475 940 455"
        stroke="#be185d" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55"/>
  <!-- Small garnish dot cluster on plate -->
  <circle cx="780" cy="490" r="9" fill="#78350f" opacity="0.7"/>
  <circle cx="810" cy="478" r="6" fill="#9a3309" opacity="0.65"/>
  <circle cx="830" cy="496" r="7" fill="#c2410c" opacity="0.6"/>

</svg>
