<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="1080" cy="300" r="240" fill="url(#sun)" opacity="0.9"/>
  <circle cx="1080" cy="300" r="78" fill="#fbbf24" opacity="0.85"/>

  <!-- far mountain ridge -->
  <path d="M125 470 L360 320 L520 410 L720 250 L920 400 L1180 270 L1475 430 L1475 560 L125 560 Z"
        fill="url(#ridge)" opacity="0.85"/>
  <!-- near ridge -->
  <path d="M125 530 L420 430 L640 510 L900 400 L1180 500 L1475 450 L1475 620 L125 620 Z"
        fill="#c2410c" opacity="0.8"/>

  <!-- lake -->
  <path d="M125 560 L1475 560 L1475 810 L125 810 Z" fill="url(#lake)"/>
  <!-- shoreline shimmer -->
  <path d="M260 640 H760 M520 690 H1140 M380 740 H980" stroke="#fbbf24" stroke-width="6"
        stroke-linecap="round" opacity="0.45"/>

  <!-- paraglider canopy (hero accent, in safe zone) -->
  <path d="M560 215 q140 -70 280 0 q-30 42 -140 42 q-110 0 -140 -42 Z"
        fill="#c2410c" opacity="0.92"/>
  <path d="M560 215 q140 -70 280 0" fill="none" stroke="#78350f" stroke-width="4" opacity="0.7"/>
  <!-- lines + pilot -->
  <path d="M580 232 L692 330 M700 252 L700 330 M820 232 L708 330" stroke="#78350f"
        stroke-width="2.5" opacity="0.75"/>
  <circle cx="700" cy="342" r="11" fill="#9a3309" opacity="0.95"/>
</svg>
