<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="470" r="320" fill="url(#sun)"/>

  <!-- water -->
  <rect x="0" y="690" width="1600" height="210" fill="#9a3309" opacity="0.55"/>

  <!-- bridge deck -->
  <rect x="125" y="560" width="1350" height="22" fill="url(#rust)" opacity="0.95"/>

  <!-- left tower -->
  <rect x="495" y="200" width="46" height="362" fill="url(#rust)" opacity="0.95"/>
  <rect x="492" y="290" width="52" height="16" fill="#78350f" opacity="0.9"/>
  <rect x="492" y="380" width="52" height="16" fill="#78350f" opacity="0.9"/>

  <!-- right tower -->
  <rect x="1059" y="200" width="46" height="362" fill="url(#rust)" opacity="0.95"/>
  <rect x="1056" y="290" width="52" height="16" fill="#78350f" opacity="0.9"/>
  <rect x="1056" y="380" width="52" height="16" fill="#78350f" opacity="0.9"/>

  <!-- main suspension cables -->
  <path d="M125 360 Q330 540 518 240 Q800 540 1082 240 Q1270 540 1475 360"
        fill="none" stroke="#c2410c" stroke-width="7" opacity="0.9"/>

  <!-- vertical suspender cables -->
  <g stroke="#9a3309" stroke-width="3" opacity="0.7">
    <line x1="300" y1="430" x2="300" y2="560"/>
    <line x1="380" y1="380" x2="380" y2="560"/>
    <line x1="640" y1="330" x2="640" y2="560"/>
    <line x1="720" y1="350" x2="720" y2="560"/>
    <line x1="880" y1="350" x2="880" y2="560"/>
    <line x1="960" y1="330" x2="960" y2="560"/>
    <line x1="1220" y1="380" x2="1220" y2="560"/>
    <line x1="1300" y1="430" x2="1300" y2="560"/>
  </g>
</svg>
