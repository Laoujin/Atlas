<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2d1008" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <!-- Warm spotlight beneath plate -->
    <radialGradient id="spotlight" cx="50%" cy="58%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient (main) -->
    <radialGradient id="plateMain" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f0eadb" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d9c9b8" stop-opacity="1"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e8d8c6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c4b09a" stop-opacity="1"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="plateWell" cx="44%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ede3d6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d9c9b8" stop-opacity="1"/>
    </radialGradient>
    <!-- Cloche gradient -->
    <linearGradient id="clocheGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Cloche sheen -->
    <linearGradient id="clocheSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </linearGradient>
    <!-- Star accent gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <!-- Warm table spotlight -->
  <rect width="1600" height="900" fill="url(#spotlight)"/>

  <!-- Layer 2: Hero element — centered at (800, 470), safe zone compliant -->

  <!-- Plate rim (outer ring) -->
  <ellipse cx="800" cy="560" rx="320" ry="52" fill="#2a1208" opacity="0.45"/>
  <!-- Plate shadow -->
  <ellipse cx="800" cy="555" rx="305" ry="40" fill="#1a0e0e" opacity="0.55"/>

  <!-- Plate body -->
  <circle cx="800" cy="490" r="300" fill="url(#plateRim)"/>
  <!-- Plate inner face -->
  <circle cx="800" cy="490" r="278" fill="url(#plateMain)"/>
  <!-- Plate well (the recessed dining surface) -->
  <circle cx="800" cy="490" r="210" fill="url(#plateWell)"/>

  <!-- Cloche dome — sits on the plate, hero element -->
  <!-- Dome body: elliptical arc shape approximated with an ellipse clipped to upper half -->
  <ellipse cx="800" cy="390" rx="230" ry="195" fill="url(#clocheGrad)"/>
  <!-- Cloche sheen overlay -->
  <ellipse cx="800" cy="390" rx="230" ry="195" fill="url(#clocheSheen)"/>
  <!-- Cloche base band (where dome meets plate) -->
  <rect x="570" y="482" width="460" height="18" rx="5" fill="#78350f" opacity="0.9"/>
  <!-- Cloche base band highlight -->
  <rect x="570" y="482" width="460" height="6" rx="3" fill="#d97706" opacity="0.35"/>

  <!-- Cloche handle knob -->
  <ellipse cx="800" cy="196" rx="28" ry="14" fill="#c2410c" opacity="0.95"/>
  <ellipse cx="800" cy="196" rx="28" ry="14" fill="url(#clocheSheen)"/>
  <!-- Handle stem -->
  <rect x="793" y="200" width="14" height="32" rx="5" fill="#9a3309" opacity="0.95"/>

  <!-- Michelin star accent: three small star-like diamonds floating above the cloche -->
  <!-- Star 1 (left) -->
  <g transform="translate(680, 160)">
    <ellipse cx="0" cy="0" rx="22" ry="22" fill="url(#starGlow)" opacity="0.7"/>
    <polygon points="0,-13 3,-3 13,0 3,3 0,13 -3,3 -13,0 -3,-3" fill="#fbbf24" opacity="0.88"/>
  </g>
  <!-- Star 2 (center, larger) -->
  <g transform="translate(800, 130)">
    <ellipse cx="0" cy="0" rx="30" ry="30" fill="url(#starGlow)" opacity="0.75"/>
    <polygon points="0,-17 4,-4 17,0 4,4 0,17 -4,4 -17,0 -4,-4" fill="#fbbf24" opacity="0.92"/>
  </g>
  <!-- Star 3 (right) -->
  <g transform="translate(920, 160)">
    <ellipse cx="0" cy="0" rx="22" ry="22" fill="url(#starGlow)" opacity="0.7"/>
    <polygon points="0,-13 3,-3 13,0 3,3 0,13 -3,3 -13,0 -3,-3" fill="#fbbf24" opacity="0.88"/>
  </g>

  <!-- Layer 3: Edge atmosphere (outside safe zone, decorative only) -->
  <!-- Left edge warm vignette bar -->
  <rect x="0" y="0" width="80" height="900" fill="#c2410c" opacity="0.06"/>
  <!-- Right edge warm vignette bar -->
  <rect x="1520" y="0" width="80" height="900" fill="#c2410c" opacity="0.06"/>
  <!-- Bottom edge deep shadow -->
  <rect x="0" y="780" width="1600" height="120" fill="#1a0e0e" opacity="0.45"/>
  <!-- Top edge deep shadow -->
  <rect x="0" y="0" width="1600" height="90" fill="#1a0e0e" opacity="0.30"/>
</svg>
