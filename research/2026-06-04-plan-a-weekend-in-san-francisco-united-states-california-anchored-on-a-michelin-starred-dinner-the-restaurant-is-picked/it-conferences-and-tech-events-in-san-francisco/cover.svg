<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="badgeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="badgeB" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="badgeC" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle radial glow behind hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Faint grid lines (decorative, outside hero meaning) -->
  <g stroke="#d97706" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="540" x2="1600" y2="540"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="900"/>
    <line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1280" y1="0" x2="1280" y2="900"/>
  </g>

  <!-- Layer 2: Hero — stacked conference badge shapes centered at (800, 450) -->

  <!-- Back badge (tilted left, offset) -->
  <g transform="rotate(-8, 800, 450)">
    <rect x="530" y="210" width="380" height="480" rx="18" ry="18" fill="url(#badgeB)" opacity="0.70"/>
    <!-- lanyard hole -->
    <circle cx="720" cy="232" r="14" fill="#1a0e0e" opacity="0.55"/>
    <!-- faint content lines -->
    <rect x="562" y="290" width="220" height="14" rx="4" fill="#fbbf24" opacity="0.25"/>
    <rect x="562" y="322" width="160" height="10" rx="3" fill="#fbbf24" opacity="0.18"/>
    <rect x="562" y="350" width="190" height="10" rx="3" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- Back-right badge (tilted right) -->
  <g transform="rotate(9, 800, 450)">
    <rect x="690" y="220" width="380" height="480" rx="18" ry="18" fill="url(#badgeA)" opacity="0.65"/>
    <circle cx="880" cy="242" r="14" fill="#1a0e0e" opacity="0.55"/>
    <rect x="722" y="300" width="220" height="14" rx="4" fill="#78350f" opacity="0.30"/>
    <rect x="722" y="332" width="150" height="10" rx="3" fill="#78350f" opacity="0.22"/>
    <rect x="722" y="360" width="180" height="10" rx="3" fill="#78350f" opacity="0.18"/>
  </g>

  <!-- Front badge (hero, upright, centered) -->
  <rect x="610" y="195" width="380" height="490" rx="18" ry="18" fill="url(#badgeC)" opacity="0.95"/>
  <!-- lanyard notch + hole -->
  <rect x="776" y="193" width="48" height="28" rx="6" ry="6" fill="#1a0e0e" opacity="0.45"/>
  <circle cx="800" cy="207" r="11" fill="#1a0e0e" opacity="0.60"/>
  <!-- Top accent band (like a badge header) -->
  <rect x="610" y="195" width="380" height="80" rx="18" ry="18" fill="#9a3309" opacity="0.80"/>
  <rect x="610" y="255" width="380" height="20" fill="#9a3309" opacity="0.80"/>
  <!-- Content lines on front badge -->
  <rect x="648" y="320" width="240" height="16" rx="5" fill="#1a0e0e" opacity="0.35"/>
  <rect x="648" y="356" width="180" height="12" rx="4" fill="#1a0e0e" opacity="0.25"/>
  <rect x="648" y="382" width="210" height="12" rx="4" fill="#1a0e0e" opacity="0.22"/>
  <rect x="648" y="418" width="160" height="12" rx="4" fill="#1a0e0e" opacity="0.20"/>
  <!-- Accent dot row (like schedule items) -->
  <circle cx="648" cy="460" r="7" fill="#c2410c" opacity="0.70"/>
  <rect x="664" y="455" width="160" height="10" rx="3" fill="#1a0e0e" opacity="0.20"/>
  <circle cx="648" cy="490" r="7" fill="#d97706" opacity="0.60"/>
  <rect x="664" y="485" width="130" height="10" rx="3" fill="#1a0e0e" opacity="0.18"/>
  <circle cx="648" cy="520" r="7" fill="#fbbf24" opacity="0.55"/>
  <rect x="664" y="515" width="145" height="10" rx="3" fill="#1a0e0e" opacity="0.16"/>
  <!-- Bottom strip -->
  <rect x="610" y="645" width="380" height="40" rx="0" ry="0" fill="#78350f" opacity="0.55"/>
  <rect x="610" y="665" width="380" height="20" rx="0" ry="18" fill="#78350f" opacity="0.55"/>

</svg>
