<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Hero hex radial glow -->
    <radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Central node fill -->
    <radialGradient id="hexFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Input beam gradient -->
    <linearGradient id="beamIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Pass-through beam (right, dimmed) -->
    <linearGradient id="beamPass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>

    <!-- Deflect beam (downward, violet) -->
    <linearGradient id="beamDeflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>

    <!-- Orbit ring gradient -->
    <radialGradient id="orbitFade" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="90%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield/barrier gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="420" ry="340" fill="url(#hexGlow)"/>

  <!-- Layer 2: Orbit rings (decorative, centred on hero) -->
  <circle cx="800" cy="450" r="210" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.18"/>
  <circle cx="800" cy="450" r="310" fill="none" stroke="#c2410c" stroke-width="0.8" stroke-opacity="0.12"/>
  <circle cx="800" cy="450" r="400" fill="none" stroke="#9a3309" stroke-width="0.6" stroke-opacity="0.08"/>

  <!-- Input beam (left to hex) -->
  <rect x="220" y="438" width="470" height="24" rx="12" fill="url(#beamIn)" opacity="0.9"/>

  <!-- Input node dot (source) -->
  <circle cx="250" cy="450" r="14" fill="#d97706" opacity="0.75"/>
  <circle cx="250" cy="450" r="7" fill="#fbbf24" opacity="0.95"/>

  <!-- Mid-beam node -->
  <circle cx="530" cy="450" r="9" fill="#c2410c" opacity="0.7"/>
  <circle cx="530" cy="450" r="4" fill="#fbbf24" opacity="0.8"/>

  <!-- Pass-through beam (right of hex, dimmed — blocked path) -->
  <rect x="910" y="438" width="340" height="16" rx="8" fill="url(#beamPass)" opacity="0.5"/>

  <!-- Blocked output node (right, faded) -->
  <circle cx="1220" cy="446" r="10" fill="#78350f" opacity="0.45"/>

  <!-- Deflect beam (downward from hex) -->
  <rect x="784" y="530" width="32" height="240" rx="16" fill="url(#beamDeflect)" opacity="0.88"/>

  <!-- Deflect terminal node -->
  <circle cx="800" cy="760" r="18" fill="#4c1d95" opacity="0.75"/>
  <circle cx="800" cy="760" r="9" fill="#6d28d9" opacity="0.9"/>
  <circle cx="800" cy="760" r="4" fill="#a78bfa" opacity="0.95"/>

  <!-- Shield bar (the guardrail) — vertical barrier crossing input beam path -->
  <rect x="862" y="340" width="14" height="220" rx="7" fill="url(#shieldGrad)" opacity="0.92"/>
  <!-- Shield glow -->
  <rect x="855" y="340" width="28" height="220" rx="14" fill="#6d28d9" opacity="0.12"/>

  <!-- Layer 2 Hero: Central hexagon decision node -->
  <!-- Hexagon centered at (800, 450), circumradius 120 -->
  <!-- Points: top-right (800+104,450-60), right (800+120,450), bottom-right (800+104,450+60),
               bottom-left (800-104,450+60), left (800-120,450), top-left (800-104,450-60) -->
  <polygon
    points="904,390 920,450 904,510 696,510 680,450 696,390"
    fill="url(#hexFill)"
    opacity="0.95"
    stroke="#fbbf24"
    stroke-width="2.5"
    stroke-opacity="0.6"
  />

  <!-- Inner hex ring -->
  <polygon
    points="880,410 892,450 880,490 720,490 708,450 720,410"
    fill="none"
    stroke="#fbbf24"
    stroke-width="1"
    stroke-opacity="0.25"
  />

  <!-- Centre dot on hero -->
  <circle cx="800" cy="450" r="22" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="450" r="10" fill="#78350f" opacity="0.95"/>

  <!-- Layer 3: Corner decorations (outside safe zone, atmospheric) -->
  <!-- Top-left faint arc -->
  <path d="M 0,0 Q 160,0 160,160" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M 0,0 Q 80,0 80,80" fill="none" stroke="#d97706" stroke-width="0.8" stroke-opacity="0.08"/>

  <!-- Bottom-right faint arc -->
  <path d="M 1600,900 Q 1440,900 1440,740" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M 1600,900 Q 1520,900 1520,820" fill="none" stroke="#d97706" stroke-width="0.8" stroke-opacity="0.08"/>
</svg>
