<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- concentric evaluation orbits -->
  <g fill="none" stroke="#c2410c" stroke-opacity="0.28">
    <circle cx="800" cy="450" r="330" stroke-width="2"/>
    <circle cx="800" cy="450" r="245" stroke-width="2.5"/>
    <circle cx="800" cy="450" r="150" stroke-width="3"/>
  </g>

  <!-- edges: metrics feeding the hub -->
  <g stroke="#9a3309" stroke-opacity="0.45" stroke-width="3">
    <line x1="800" y1="450" x2="1037" y2="280"/>
    <line x1="800" y1="450" x2="1130" y2="450"/>
    <line x1="800" y1="450" x2="985" y2="690"/>
    <line x1="800" y1="450" x2="563" y2="620"/>
    <line x1="800" y1="450" x2="470" y2="450"/>
    <line x1="800" y1="450" x2="615" y2="210"/>
  </g>

  <!-- metric nodes on the outer orbits -->
  <g fill="url(#node)">
    <circle cx="1037" cy="280" r="34"/>
    <circle cx="1130" cy="450" r="28"/>
    <circle cx="985" cy="690" r="30"/>
    <circle cx="563" cy="620" r="26"/>
    <circle cx="470" cy="450" r="32"/>
    <circle cx="615" cy="210" r="27"/>
  </g>
  <g fill="#fbbf24" fill-opacity="0.9">
    <circle cx="1037" cy="280" r="11"/>
    <circle cx="1130" cy="450" r="9"/>
    <circle cx="985" cy="690" r="10"/>
    <circle cx="563" cy="620" r="8"/>
    <circle cx="470" cy="450" r="10"/>
    <circle cx="615" cy="210" r="9"/>
  </g>

  <!-- rust hub: the evaluation core -->
  <circle cx="800" cy="450" r="92" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="92" fill="none" stroke="#fef3ec" stroke-opacity="0.5" stroke-width="4"/>
  <circle cx="800" cy="450" r="40" fill="#1a0e0e" fill-opacity="0.25"/>
</svg>
