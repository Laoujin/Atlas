<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0eadb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#9a3309;stop-opacity:0.85" />
    </linearGradient>
    <radialGradient id="crackGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Hero: Three-stage pipeline blocks with fracture accent -->
  <!-- Stage 1: Retrieval (left block) -->
  <rect x="450" y="350" width="180" height="140" rx="8" fill="url(#heroGrad)" opacity="0.9" />
  <line x1="460" y1="380" x2="620" y2="380" stroke="#fbbf24" stroke-width="3" opacity="0.5" />
  <line x1="460" y1="410" x2="610" y2="410" stroke="#fbbf24" stroke-width="2" opacity="0.4" />
  <line x1="460" y1="440" x2="600" y2="440" stroke="#fbbf24" stroke-width="2" opacity="0.35" />

  <!-- Stage 2: Embedding (center block - CRACKED) -->
  <rect x="710" y="320" width="180" height="200" rx="8" fill="url(#accentGrad)" opacity="0.85" />
  <!-- Fracture lines through the center block -->
  <line x1="750" y1="320" x2="780" y2="450" stroke="#f97316" stroke-width="4" opacity="0.7" />
  <line x1="810" y1="320" x2="790" y2="460" stroke="#f97316" stroke-width="3" opacity="0.6" />
  <line x1="850" y1="340" x2="830" y2="510" stroke="#f97316" stroke-width="3" opacity="0.55" />
  <!-- Crack glow effect -->
  <circle cx="800" cy="400" r="80" fill="url(#crackGlow)" />
  <!-- Faint interior lines (undisturbed stage) -->
  <line x1="720" y1="360" x2="880" y2="360" stroke="#fbbf24" stroke-width="2" opacity="0.3" />

  <!-- Stage 3: Generation (right block) -->
  <rect x="970" y="370" width="180" height="120" rx="8" fill="url(#heroGrad)" opacity="0.8" />
  <line x1="980" y1="400" x2="1140" y2="400" stroke="#fbbf24" stroke-width="3" opacity="0.4" />
  <line x1="980" y1="430" x2="1130" y2="430" stroke="#fbbf24" stroke-width="2" opacity="0.35" />

  <!-- Connecting lines (showing pipeline flow, some broken) -->
  <!-- Retrieval to Embedding: solid -->
  <line x1="630" y1="420" x2="710" y2="420" stroke="#9a3309" stroke-width="2" opacity="0.6" />
  <!-- Embedding to Generation: BROKEN / offset (failure mode) -->
  <line x1="890" y1="380" x2="970" y2="450" stroke="#f97316" stroke-width="2" opacity="0.5" stroke-dasharray="8,6" />

  <!-- Optional subtle corner accent (right edge, won't interfere with crops) -->
  <circle cx="1480" cy="120" r="120" fill="#6d28d9" opacity="0.15" />

  <!-- Left edge accent -->
  <circle cx="140" cy="750" r="100" fill="#d97706" opacity="0.12" />
</svg>