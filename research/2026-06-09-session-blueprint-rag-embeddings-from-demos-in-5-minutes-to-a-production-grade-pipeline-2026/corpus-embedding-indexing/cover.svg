<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Chunk gradient -->
    <linearGradient id="chunkA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="chunkB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.65"/>
    </linearGradient>
    <!-- Connector gradient -->
    <linearGradient id="connLeft" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="connRight" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="connTop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="connBot" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="url(#hubGlow)" opacity="0.4"/>

  <!-- Layer 2: Hero element — centered at (800, 450) -->

  <!-- Glow halo behind hub -->
  <circle cx="800" cy="450" r="220" fill="url(#hubGlow)" opacity="0.9"/>

  <!-- Chunk block: upper-left -->
  <rect x="210" y="175" width="260" height="140" rx="10"
        fill="url(#chunkA)" opacity="0.88"
        transform="rotate(-8 340 245)"/>
  <!-- inner line bars suggesting text -->
  <rect x="230" y="212" width="180" height="10" rx="4" fill="#fbbf24" opacity="0.25" transform="rotate(-8 340 245)"/>
  <rect x="230" y="232" width="140" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(-8 340 245)"/>
  <rect x="230" y="252" width="160" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(-8 340 245)"/>

  <!-- Chunk block: lower-left -->
  <rect x="190" y="575" width="260" height="140" rx="10"
        fill="url(#chunkB)" opacity="0.85"
        transform="rotate(7 320 645)"/>
  <rect x="210" y="610" width="180" height="10" rx="4" fill="#fbbf24" opacity="0.25" transform="rotate(7 320 645)"/>
  <rect x="210" y="630" width="130" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(7 320 645)"/>
  <rect x="210" y="650" width="155" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(7 320 645)"/>

  <!-- Chunk block: upper-right -->
  <rect x="1130" y="175" width="260" height="140" rx="10"
        fill="url(#chunkA)" opacity="0.88"
        transform="rotate(8 1260 245)"/>
  <rect x="1150" y="212" width="180" height="10" rx="4" fill="#fbbf24" opacity="0.25" transform="rotate(8 1260 245)"/>
  <rect x="1150" y="232" width="140" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(8 1260 245)"/>
  <rect x="1150" y="252" width="160" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(8 1260 245)"/>

  <!-- Chunk block: lower-right -->
  <rect x="1150" y="575" width="260" height="140" rx="10"
        fill="url(#chunkB)" opacity="0.85"
        transform="rotate(-7 1280 645)"/>
  <rect x="1170" y="610" width="180" height="10" rx="4" fill="#fbbf24" opacity="0.25" transform="rotate(-7 1280 645)"/>
  <rect x="1170" y="630" width="130" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(-7 1280 645)"/>
  <rect x="1170" y="650" width="155" height="10" rx="4" fill="#fbbf24" opacity="0.18" transform="rotate(-7 1280 645)"/>

  <!-- Connector paths: chunks to hub -->
  <!-- upper-left to hub -->
  <path d="M 380 265 Q 560 350 680 410" stroke="url(#connLeft)"
        stroke-width="3" fill="none" opacity="0.8"/>
  <!-- lower-left to hub -->
  <path d="M 370 635 Q 550 560 680 490" stroke="url(#connLeft)"
        stroke-width="3" fill="none" opacity="0.8"/>
  <!-- upper-right to hub -->
  <path d="M 1220 265 Q 1040 350 920 410" stroke="url(#connRight)"
        stroke-width="3" fill="none" opacity="0.8"/>
  <!-- lower-right to hub -->
  <path d="M 1230 635 Q 1050 560 920 490" stroke="url(#connRight)"
        stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Hub outer ring -->
  <circle cx="800" cy="450" r="130" fill="none"
          stroke="#c2410c" stroke-width="4" opacity="0.5"/>
  <!-- Hub ring pulse -->
  <circle cx="800" cy="450" r="148" fill="none"
          stroke="#d97706" stroke-width="1.5" opacity="0.3"/>

  <!-- Hub core -->
  <circle cx="800" cy="450" r="112" fill="url(#hubFill)" opacity="0.95"/>

  <!-- Hub inner grid dots (index nodes) -->
  <circle cx="800" cy="450" r="6" fill="#1a0e0e" opacity="0.7"/>
  <circle cx="760" cy="420" r="4" fill="#1a0e0e" opacity="0.5"/>
  <circle cx="840" cy="420" r="4" fill="#1a0e0e" opacity="0.5"/>
  <circle cx="760" cy="480" r="4" fill="#1a0e0e" opacity="0.5"/>
  <circle cx="840" cy="480" r="4" fill="#1a0e0e" opacity="0.5"/>
  <circle cx="800" cy="405" r="4" fill="#1a0e0e" opacity="0.5"/>
  <circle cx="800" cy="495" r="4" fill="#1a0e0e" opacity="0.5"/>

  <!-- Layer 3: Decorative edge accents (outside safe zone, atmospheric) -->
  <rect x="0" y="0" width="1600" height="4" fill="#c2410c" opacity="0.4"/>
  <rect x="0" y="896" width="1600" height="4" fill="#c2410c" opacity="0.4"/>
</svg>
