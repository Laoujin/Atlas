<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1010"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Hub core gradient -->
    <radialGradient id="hubCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Orbit node gradient -->
    <radialGradient id="nodeA" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <!-- Retrieval node gradient -->
    <radialGradient id="nodeB" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Background ambient glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient violet glow centred on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="380" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero element — orbit system centred at (800, 450) -->

  <!-- Outer orbit ellipse -->
  <ellipse cx="800" cy="450" rx="340" ry="200"
           fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.55"
           stroke-dasharray="8 5"/>

  <!-- Inner orbit ellipse -->
  <ellipse cx="800" cy="450" rx="200" ry="118"
           fill="none" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.60"
           stroke-dasharray="5 4"/>

  <!-- Edge lines: outer nodes to hub -->
  <line x1="460" y1="450" x2="770" y2="450" stroke="#6d28d9" stroke-width="1.8" stroke-opacity="0.50"/>
  <line x1="978" y1="280" x2="822" y2="408" stroke="#6d28d9" stroke-width="1.8" stroke-opacity="0.50"/>
  <line x1="622" y1="280" x2="778" y2="408" stroke="#6d28d9" stroke-width="1.8" stroke-opacity="0.50"/>
  <line x1="978" y1="620" x2="822" y2="492" stroke="#6d28d9" stroke-width="1.8" stroke-opacity="0.50"/>
  <line x1="622" y1="620" x2="778" y2="492" stroke="#6d28d9" stroke-width="1.8" stroke-opacity="0.50"/>

  <!-- Edge lines: inner nodes to hub -->
  <line x1="600" y1="450" x2="770" y2="450" stroke="#d97706" stroke-width="1.4" stroke-opacity="0.55"/>
  <line x1="890" y1="340" x2="812" y2="422" stroke="#d97706" stroke-width="1.4" stroke-opacity="0.55"/>
  <line x1="890" y1="560" x2="812" y2="478" stroke="#d97706" stroke-width="1.4" stroke-opacity="0.55"/>

  <!-- Hub soft glow halo -->
  <circle cx="800" cy="450" r="120" fill="url(#hubGlow)" opacity="0.6"/>

  <!-- Outer orbit nodes (violet — retrieval / vector store) -->
  <circle cx="460" cy="450" r="28" fill="url(#nodeA)" opacity="0.90"/>
  <circle cx="978" cy="280" r="22" fill="url(#nodeA)" opacity="0.85"/>
  <circle cx="622" cy="280" r="18" fill="url(#nodeA)" opacity="0.80"/>
  <circle cx="978" cy="620" r="22" fill="url(#nodeA)" opacity="0.85"/>
  <circle cx="622" cy="620" r="18" fill="url(#nodeA)" opacity="0.80"/>

  <!-- Inner orbit nodes (amber — chunking / embedding stages) -->
  <circle cx="600" cy="450" r="16" fill="url(#nodeB)" opacity="0.88"/>
  <circle cx="890" cy="340" r="14" fill="url(#nodeB)" opacity="0.85"/>
  <circle cx="890" cy="560" r="14" fill="url(#nodeB)" opacity="0.85"/>

  <!-- Hub core -->
  <circle cx="800" cy="450" r="54" fill="url(#hubCore)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="54" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Hub centre dot -->
  <circle cx="800" cy="450" r="14" fill="#fbbf24" opacity="0.95"/>

  <!-- Layer 3: Decorative edge treatments (outside safe zone, purely atmospheric) -->
  <!-- Top-left corner accent arc -->
  <path d="M 0 0 Q 160 0 160 160" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.18"/>
  <!-- Bottom-right corner accent arc -->
  <path d="M 1600 900 Q 1440 900 1440 740" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.18"/>
  <!-- Subtle full-bleed edge vignette -->
  <rect width="1600" height="900" fill="none"
        stroke="#000" stroke-width="120" stroke-opacity="0.28"/>
</svg>
