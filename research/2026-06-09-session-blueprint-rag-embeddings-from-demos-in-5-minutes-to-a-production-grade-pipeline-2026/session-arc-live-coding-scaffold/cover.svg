<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1a0e"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Violet glow behind hero -->
  <ellipse cx="800" cy="520" rx="520" ry="300" fill="url(#violetGlow)"/>

  <!-- Layer 2: stacked angled session-stage cards (hero, safe zone x:125-1475 y:90-810) -->
  <!-- Bottom card (stage 3 / deepest) -->
  <rect x="280" y="580" width="920" height="160" rx="10"
        fill="url(#card3)" transform="rotate(-2, 800, 660)"/>

  <!-- Middle card (stage 2) -->
  <rect x="230" y="470" width="960" height="165" rx="10"
        fill="url(#card2)" transform="rotate(-1, 800, 552)"/>

  <!-- Top / hero card (stage 1 — the live-coding moment) -->
  <rect x="190" y="270" width="1000" height="220" rx="12"
        fill="url(#card1)" opacity="0.95"/>

  <!-- Faint horizontal "code lines" inside hero card -->
  <rect x="240" y="310" width="480" height="10" rx="4" fill="#fbbf24" opacity="0.18"/>
  <rect x="240" y="334" width="360" height="10" rx="4" fill="#fbbf24" opacity="0.13"/>
  <rect x="240" y="358" width="560" height="10" rx="4" fill="#fbbf24" opacity="0.16"/>
  <rect x="240" y="382" width="300" height="10" rx="4" fill="#fbbf24" opacity="0.11"/>
  <rect x="240" y="406" width="440" height="10" rx="4" fill="#fbbf24" opacity="0.14"/>
  <rect x="240" y="430" width="260" height="10" rx="4" fill="#fbbf24" opacity="0.10"/>

  <!-- Violet accent bar on left edge of hero card -->
  <rect x="190" y="270" width="18" height="220" rx="6" fill="#6d28d9" opacity="0.85"/>

  <!-- Layer 3: RAG node-edge connector (bottom area, still in safe zone) -->
  <!-- Left node -->
  <circle cx="560" cy="720" r="26" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="560" cy="720" r="18" fill="#fbbf24" opacity="0.7"/>

  <!-- Right node -->
  <circle cx="1040" cy="720" r="26" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="1040" cy="720" r="18" fill="#fbbf24" opacity="0.7"/>

  <!-- Arc connecting nodes -->
  <path d="M 586 720 Q 800 660 1014 720"
        stroke="#6d28d9" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Small hub dot at arc midpoint -->
  <circle cx="800" cy="676" r="10" fill="#6d28d9" opacity="0.85"/>
  <circle cx="800" cy="676" r="5" fill="#fbbf24" opacity="0.9"/>

  <!-- Corner decorations (outside safe zone, atmospheric only) -->
  <rect x="-40" y="-40" width="200" height="200" rx="20"
        fill="none" stroke="#c2410c" stroke-width="2" opacity="0.15"
        transform="rotate(15, 60, 60)"/>
  <rect x="1440" y="720" width="200" height="200" rx="20"
        fill="none" stroke="#6d28d9" stroke-width="2" opacity="0.12"
        transform="rotate(-10, 1540, 820)"/>
</svg>
