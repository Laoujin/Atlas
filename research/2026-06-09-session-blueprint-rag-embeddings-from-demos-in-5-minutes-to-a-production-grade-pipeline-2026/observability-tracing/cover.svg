<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#3a160d"/>
      <stop offset="60%" stop-color="#23100c"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="620" ry="430" fill="url(#glow)"/>

  <!-- Faint mesh edges (the service graph) -->
  <g stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.55">
    <line x1="360" y1="300" x2="620" y2="230"/>
    <line x1="360" y1="300" x2="500" y2="520"/>
    <line x1="620" y1="230" x2="900" y2="300"/>
    <line x1="500" y1="520" x2="780" y2="600"/>
    <line x1="900" y1="300" x2="1180" y2="250"/>
    <line x1="900" y1="300" x2="1100" y2="560"/>
    <line x1="780" y1="600" x2="1100" y2="560"/>
    <line x1="1180" y1="250" x2="1260" y2="470"/>
    <line x1="1100" y1="560" x2="1260" y2="470"/>
    <line x1="620" y1="230" x2="780" y2="600"/>
  </g>

  <!-- Highlighted trace path: one request crossing the system -->
  <polyline points="360,300 620,230 900,300 1100,560 1260,470"
            fill="none" stroke="url(#trace)" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Quiet service nodes off the hot path -->
  <g fill="#5c2a1a" stroke="#78350f" stroke-width="3">
    <circle cx="500" cy="520" r="26"/>
    <circle cx="780" cy="600" r="30"/>
    <circle cx="1180" cy="250" r="24"/>
  </g>

  <!-- Hot-path span nodes -->
  <g fill="url(#hub)">
    <circle cx="360" cy="300" r="30"/>
    <circle cx="620" cy="230" r="34"/>
    <circle cx="1100" cy="560" r="34"/>
    <circle cx="1260" cy="470" r="28"/>
  </g>

  <!-- Hero: the root span / collector hub at graph centre -->
  <circle cx="900" cy="300" r="78" fill="none" stroke="#9a3309" stroke-width="3" opacity="0.7"/>
  <circle cx="900" cy="300" r="58" fill="url(#hub)"/>
  <circle cx="900" cy="300" r="22" fill="#fef3ec" opacity="0.9"/>
</svg>
