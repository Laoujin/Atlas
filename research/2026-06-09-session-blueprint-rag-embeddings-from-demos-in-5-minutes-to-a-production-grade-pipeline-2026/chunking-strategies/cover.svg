<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1a0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero chunk gradient (rust) -->
    <linearGradient id="chunkHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.88"/>
    </linearGradient>
    <!-- Mid chunk gradient -->
    <linearGradient id="chunkMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Back chunk gradient -->
    <linearGradient id="chunkBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b1a0e" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#2a1008" stop-opacity="0.65"/>
    </linearGradient>
    <!-- Overlap highlight glow -->
    <radialGradient id="overlapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient centre glow -->
    <radialGradient id="centreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient centre glow -->
  <ellipse cx="800" cy="450" rx="700" ry="420" fill="url(#centreGlow)"/>

  <!-- Layer 2: Hero element — stacked offset document chunks -->

  <!-- Chunk 3 (back, bottom-right) -->
  <rect x="570" y="330" width="680" height="260" rx="10"
        fill="url(#chunkBack)" opacity="0.72"
        transform="translate(70,70)"/>
  <!-- Text-line bars inside back chunk -->
  <rect x="610" y="427" width="380" height="10" rx="3" fill="#fbbf24" opacity="0.12" transform="translate(70,70)"/>
  <rect x="610" y="447" width="320" height="10" rx="3" fill="#fbbf24" opacity="0.10" transform="translate(70,70)"/>
  <rect x="610" y="467" width="350" height="10" rx="3" fill="#fbbf24" opacity="0.08" transform="translate(70,70)"/>
  <rect x="610" y="487" width="260" height="10" rx="3" fill="#fbbf24" opacity="0.08" transform="translate(70,70)"/>

  <!-- Chunk 2 (mid, slightly offset) -->
  <rect x="570" y="330" width="680" height="260" rx="10"
        fill="url(#chunkMid)" opacity="0.82"
        transform="translate(34,34)"/>
  <!-- Text-line bars inside mid chunk -->
  <rect x="610" y="390" width="400" height="11" rx="3" fill="#fbbf24" opacity="0.18" transform="translate(34,34)"/>
  <rect x="610" y="412" width="350" height="11" rx="3" fill="#fbbf24" opacity="0.15" transform="translate(34,34)"/>
  <rect x="610" y="434" width="420" height="11" rx="3" fill="#fbbf24" opacity="0.13" transform="translate(34,34)"/>
  <rect x="610" y="456" width="300" height="11" rx="3" fill="#fbbf24" opacity="0.12" transform="translate(34,34)"/>
  <rect x="610" y="478" width="370" height="11" rx="3" fill="#fbbf24" opacity="0.10" transform="translate(34,34)"/>

  <!-- Overlap zone glow between chunk 2 and hero -->
  <rect x="570" y="330" width="680" height="68" rx="8"
        fill="url(#overlapGlow)" opacity="0.80"
        transform="translate(34,34)"/>

  <!-- Chunk 1: Hero (front, top-left, full rust) -->
  <rect x="570" y="330" width="680" height="260" rx="10"
        fill="url(#chunkHero)" opacity="0.93"/>
  <!-- Text-line bars inside hero chunk -->
  <rect x="610" y="378" width="420" height="12" rx="3" fill="#fef3ec" opacity="0.32"/>
  <rect x="610" y="402" width="370" height="12" rx="3" fill="#fef3ec" opacity="0.28"/>
  <rect x="610" y="426" width="440" height="12" rx="3" fill="#fef3ec" opacity="0.25"/>
  <rect x="610" y="450" width="310" height="12" rx="3" fill="#fef3ec" opacity="0.22"/>
  <rect x="610" y="474" width="390" height="12" rx="3" fill="#fef3ec" opacity="0.20"/>
  <rect x="610" y="498" width="350" height="12" rx="3" fill="#fef3ec" opacity="0.18"/>

  <!-- Overlap bracket accent on hero top edge (amber, suggests shared overlap with next chunk) -->
  <rect x="570" y="330" width="680" height="6" rx="3" fill="#fbbf24" opacity="0.70"/>

  <!-- Overlap bracket accent on hero bottom edge (amber) -->
  <rect x="570" y="584" width="680" height="6" rx="3" fill="#d97706" opacity="0.55"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone — purely atmospheric) -->
  <!-- Top-left corner fade bar -->
  <rect x="0" y="0" width="400" height="4" fill="#c2410c" opacity="0.30"/>
  <!-- Bottom-right corner fade bar -->
  <rect x="1200" y="896" width="400" height="4" fill="#9a3309" opacity="0.25"/>
</svg>
