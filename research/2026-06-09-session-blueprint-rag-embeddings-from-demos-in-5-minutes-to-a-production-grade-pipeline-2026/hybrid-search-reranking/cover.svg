<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1a0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Left node (BM25 / sparse) -->
    <radialGradient id="leftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Right node (vector / dense) -->
    <radialGradient id="rightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Orbit ring fade -->
    <radialGradient id="orbitFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="85%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge line gradient left-to-center -->
    <linearGradient id="edgeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Edge line gradient right-to-center -->
    <linearGradient id="edgeRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Output beam gradient downward -->
    <linearGradient id="beamDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Corner vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0d0604" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle vignette over background -->
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Layer 2: Hero element — centered at (800, 450) -->

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="380" ry="220" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.22" stroke-dasharray="18 10"/>

  <!-- Mid orbit ring -->
  <ellipse cx="800" cy="450" rx="260" ry="150" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.18" stroke-dasharray="10 8"/>

  <!-- Connection edges: left node to hub -->
  <line x1="380" y1="450" x2="680" y2="450" stroke="url(#edgeLeft)" stroke-width="3" stroke-opacity="0.75" stroke-linecap="round"/>

  <!-- Connection edges: right node to hub -->
  <line x1="1220" y1="450" x2="920" y2="450" stroke="url(#edgeRight)" stroke-width="3" stroke-opacity="0.75" stroke-linecap="round"/>

  <!-- Secondary diagonal connections (upper-left sparse node) -->
  <line x1="380" y1="450" x2="680" y2="360" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Secondary diagonal connections (upper-right dense node) -->
  <line x1="1220" y1="450" x2="920" y2="360" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Output beam downward from hub (reranked results) -->
  <rect x="782" y="540" width="36" height="170" rx="18" fill="url(#beamDown)" opacity="0.7"/>

  <!-- Output beam tip dot -->
  <circle cx="800" cy="715" r="10" fill="#fbbf24" fill-opacity="0.55"/>

  <!-- Left source node — sparse/BM25 (violet) -->
  <!-- Outer halo -->
  <circle cx="380" cy="450" r="72" fill="#6d28d9" fill-opacity="0.12"/>
  <!-- Main node -->
  <circle cx="380" cy="450" r="50" fill="url(#leftGlow)" opacity="0.88"/>
  <!-- Inner accent -->
  <circle cx="380" cy="450" r="24" fill="#a78bfa" fill-opacity="0.35"/>

  <!-- Sparse signal bars inside left node (3 stacked rects — BM25 metaphor) -->
  <rect x="358" y="434" width="44" height="7" rx="3.5" fill="#ede9fe" fill-opacity="0.7"/>
  <rect x="362" y="446" width="36" height="7" rx="3.5" fill="#ede9fe" fill-opacity="0.5"/>
  <rect x="366" y="458" width="28" height="7" rx="3.5" fill="#ede9fe" fill-opacity="0.35"/>

  <!-- Right source node — dense/vector (amber) -->
  <!-- Outer halo -->
  <circle cx="1220" cy="450" r="72" fill="#d97706" fill-opacity="0.1"/>
  <!-- Main node -->
  <circle cx="1220" cy="450" r="50" fill="url(#rightGlow)" opacity="0.88"/>
  <!-- Inner accent -->
  <circle cx="1220" cy="450" r="24" fill="#fbbf24" fill-opacity="0.3"/>

  <!-- Dense signal — small orbit dots inside right node (vector metaphor) -->
  <circle cx="1204" cy="438" r="5" fill="#fef3ec" fill-opacity="0.75"/>
  <circle cx="1236" cy="438" r="5" fill="#fef3ec" fill-opacity="0.75"/>
  <circle cx="1220" cy="466" r="5" fill="#fef3ec" fill-opacity="0.75"/>
  <circle cx="1200" cy="457" r="4" fill="#fef3ec" fill-opacity="0.5"/>
  <circle cx="1240" cy="457" r="4" fill="#fef3ec" fill-opacity="0.5"/>

  <!-- Central reranker hub -->
  <!-- Outer glow ring -->
  <circle cx="800" cy="450" r="100" fill="#c2410c" fill-opacity="0.15"/>
  <!-- Main hub circle -->
  <circle cx="800" cy="450" r="78" fill="url(#hubGlow)" opacity="0.92"/>
  <!-- Inner ring accent -->
  <circle cx="800" cy="450" r="55" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.5"/>
  <!-- Core dot -->
  <circle cx="800" cy="450" r="22" fill="#fbbf24" fill-opacity="0.85"/>

  <!-- Layer 3: Corner decorations (may be cropped — no meaning) -->
  <!-- Top-left faint arc -->
  <path d="M 0 200 Q 100 100 220 0" fill="none" stroke="#6d28d9" stroke-width="60" stroke-opacity="0.06" stroke-linecap="round"/>
  <!-- Bottom-right faint arc -->
  <path d="M 1600 700 Q 1500 800 1380 900" fill="none" stroke="#c2410c" stroke-width="60" stroke-opacity="0.07" stroke-linecap="round"/>
</svg>
