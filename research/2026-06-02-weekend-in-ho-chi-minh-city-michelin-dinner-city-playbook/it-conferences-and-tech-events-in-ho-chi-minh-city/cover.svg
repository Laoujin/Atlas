<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1206"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer ambient glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Node gradient: rust -->
    <radialGradient id="nodeRust" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Node gradient: violet -->
    <radialGradient id="nodeViolet" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <!-- Hub core gradient -->
    <radialGradient id="hubCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient violet wash centered on hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero — network/orbit composition centered at (800, 450) -->

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="480" ry="290"
    fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.35"
    stroke-dasharray="18 10"/>

  <!-- Middle orbit ring -->
  <ellipse cx="800" cy="450" rx="310" ry="188"
    fill="none" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.45"
    stroke-dasharray="14 8"/>

  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="162" ry="98"
    fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Central hub glow halo -->
  <ellipse cx="800" cy="450" rx="130" ry="130" fill="url(#hubGlow)" opacity="0.75"/>

  <!-- Edges: outer nodes to hub -->
  <!-- NE outer node -->
  <line x1="800" y1="450" x2="1160" y2="230" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- E outer node -->
  <line x1="800" y1="450" x2="1270" y2="455" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- SE outer node -->
  <line x1="800" y1="450" x2="1080" y2="700" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- SW outer node -->
  <line x1="800" y1="450" x2="490"  y2="680" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- W outer node -->
  <line x1="800" y1="450" x2="330"  y2="450" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- NW outer node -->
  <line x1="800" y1="450" x2="500"  y2="210" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Edges: mid nodes to hub -->
  <line x1="800" y1="450" x2="960" y2="278" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="1048" y2="490" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="640"  y2="620" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="552"  y2="410" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="720"  y2="260" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Outer satellite nodes (violet) — all within safe zone -->
  <circle cx="1160" cy="230" r="22" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="1270" cy="455" r="26" fill="url(#nodeViolet)" opacity="0.82"/>
  <circle cx="1080" cy="700" r="19" fill="url(#nodeViolet)" opacity="0.80"/>
  <circle cx="490"  cy="680" r="21" fill="url(#nodeRust)"   opacity="0.85"/>
  <circle cx="330"  cy="450" r="24" fill="url(#nodeRust)"   opacity="0.82"/>
  <circle cx="500"  cy="210" r="20" fill="url(#nodeRust)"   opacity="0.84"/>

  <!-- Mid ring nodes (amber/rust) -->
  <circle cx="960"  cy="278" r="16" fill="url(#nodeRust)"   opacity="0.90"/>
  <circle cx="1048" cy="490" r="14" fill="url(#nodeViolet)" opacity="0.85"/>
  <circle cx="640"  cy="620" r="15" fill="url(#nodeRust)"   opacity="0.88"/>
  <circle cx="552"  cy="410" r="14" fill="url(#nodeViolet)" opacity="0.85"/>
  <circle cx="720"  cy="260" r="16" fill="url(#nodeRust)"   opacity="0.90"/>

  <!-- Inner ring nodes -->
  <circle cx="880" cy="358" r="10" fill="#fbbf24" opacity="0.90"/>
  <circle cx="898" cy="540" r="9"  fill="#d97706" opacity="0.88"/>
  <circle cx="700" cy="480" r="10" fill="#fbbf24" opacity="0.88"/>
  <circle cx="718" cy="365" r="9"  fill="#d97706" opacity="0.85"/>

  <!-- Central hub core -->
  <circle cx="800" cy="450" r="52" fill="url(#hubCore)" opacity="0.97"/>
  <!-- Hub ring accent -->
  <circle cx="800" cy="450" r="52" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.70"/>
  <!-- Hub inner dot -->
  <circle cx="800" cy="450" r="20" fill="#fef3ec" opacity="0.95"/>

  <!-- Layer 3: Corner decorations (outside safe zone, atmospheric only) -->
  <!-- Top-left corner arc wash -->
  <ellipse cx="0" cy="0" rx="280" ry="200" fill="#c2410c" opacity="0.07"/>
  <!-- Bottom-right corner arc wash -->
  <ellipse cx="1600" cy="900" rx="300" ry="210" fill="#6d28d9" opacity="0.08"/>

</svg>
