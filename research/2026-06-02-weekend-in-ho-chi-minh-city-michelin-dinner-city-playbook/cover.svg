<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1010"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient: warm rim -->
    <radialGradient id="plate1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="72%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Second plate: slightly cooler -->
    <radialGradient id="plate2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Cloche dome gradient -->
    <linearGradient id="cloche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.72"/>
    </linearGradient>
    <!-- Rose accent glow behind cloche -->
    <radialGradient id="roseGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric warm glow at centre -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)"/>

  <!-- Rose halo behind cloche -->
  <ellipse cx="800" cy="490" rx="320" ry="220" fill="url(#roseGlow)"/>

  <!-- Layer 2: Hero element — two plates + cloche, centred ~800,450 -->

  <!-- Back plate (slightly offset right, lower z) -->
  <ellipse cx="870" cy="570" rx="220" ry="48" fill="url(#plate2)" opacity="0.72"/>
  <!-- Back plate inner rim ring -->
  <ellipse cx="870" cy="568" rx="164" ry="35" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.5"/>

  <!-- Front plate (hero, left-centre) -->
  <ellipse cx="730" cy="590" rx="235" ry="52" fill="url(#plate1)" opacity="0.90"/>
  <!-- Front plate inner rim ring -->
  <ellipse cx="730" cy="588" rx="174" ry="38" fill="none" stroke="#d97706" stroke-width="2" opacity="0.6"/>

  <!-- Cloche dome over front plate -->
  <!-- Dome body: half-ellipse approximated with a path -->
  <path d="M 510 590
             C 510 430, 950 430, 950 590
             Z"
        fill="url(#cloche)" opacity="0.88"/>
  <!-- Cloche rim band -->
  <ellipse cx="730" cy="590" rx="220" ry="22" fill="#78350f" opacity="0.90"/>
  <ellipse cx="730" cy="590" rx="220" ry="22" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.70"/>
  <!-- Cloche knob -->
  <ellipse cx="730" cy="432" rx="26" ry="13" fill="#fbbf24" opacity="0.92"/>
  <ellipse cx="730" cy="432" rx="26" ry="13" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.80"/>
  <!-- Knob stem -->
  <rect x="724" y="432" width="12" height="22" rx="4" fill="#d97706" opacity="0.88"/>

  <!-- Subtle star-dot accent (Michelin star motif) — 6-pointed, small, above cloche -->
  <!-- Star built from two triangles -->
  <polygon points="730,390 738,408 756,408 742,420 748,438 730,428 712,438 718,420 704,408 722,408"
           fill="#fbbf24" opacity="0.82"/>
  <!-- Star inner highlight -->
  <polygon points="730,398 735,410 748,410 738,417 742,429 730,422 718,429 722,417 712,410 725,410"
           fill="#d97706" opacity="0.55"/>

  <!-- Layer 3: Edge decoration (outside safe zone, full-bleed atmosphere) -->
  <!-- Bottom-left rust arc -->
  <path d="M 0 900 Q 160 700, 320 900" fill="#c2410c" opacity="0.18"/>
  <!-- Top-right rose arc -->
  <path d="M 1600 0 Q 1440 200, 1280 0" fill="#be185d" opacity="0.14"/>
  <!-- Subtle horizontal rule lines (table atmosphere) -->
  <line x1="0" y1="730" x2="1600" y2="730" stroke="#d97706" stroke-width="1" opacity="0.10"/>
  <line x1="0" y1="170" x2="1600" y2="170" stroke="#c2410c" stroke-width="1" opacity="0.08"/>
</svg>
