<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Warm table-light glow -->
    <radialGradient id="glowCenter" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero plate shading -->
    <radialGradient id="plateFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="55%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="plateWell" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.35"/>
    </radialGradient>
    <!-- Second plate -->
    <radialGradient id="plate2Fill" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#b8a080"/>
    </radialGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#fef3ec" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Ambient rim light on hero plate -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="88%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Atmospheric candlelight glow on table surface -->
  <rect width="1600" height="900" fill="url(#glowCenter)"/>

  <!-- Subtle warm floor sweep from bottom -->
  <ellipse cx="800" cy="900" rx="900" ry="320" fill="#9a3309" opacity="0.12"/>

  <!-- Layer 2: Hero element — centered plate composition, safe zone x:125–1475, y:90–810 -->

  <!-- Second plate (background, offset left) -->
  <ellipse cx="620" cy="490" rx="195" ry="48" fill="#5c2a1a" opacity="0.7"/>
  <circle cx="620" cy="456" r="195" fill="url(#plate2Fill)" opacity="0.82"/>
  <circle cx="620" cy="456" r="152" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="620" cy="456" r="148" fill="#2d1208" opacity="0.6"/>

  <!-- Hero plate shadow (cast on table) -->
  <ellipse cx="810" cy="524" rx="275" ry="58" fill="#0e0505" opacity="0.72"/>

  <!-- Hero plate rim -->
  <circle cx="800" cy="452" r="268" fill="url(#plateFill)" opacity="0.95"/>
  <!-- Plate rim highlight ring -->
  <circle cx="800" cy="452" r="268" fill="url(#plateRim)"/>
  <!-- Plate inner well (recessed centre) -->
  <circle cx="800" cy="452" r="215" fill="#1a0e0e" opacity="0.45"/>
  <circle cx="800" cy="452" r="210" fill="url(#plateWell)" opacity="0.88"/>

  <!-- Food accent — abstract composed element on plate: three rust tear-drop forms -->
  <ellipse cx="790" cy="438" rx="38" ry="22" fill="#c2410c" opacity="0.9" transform="rotate(-18 790 438)"/>
  <ellipse cx="830" cy="462" rx="24" ry="14" fill="#d97706" opacity="0.85" transform="rotate(12 830 462)"/>
  <ellipse cx="768" cy="468" rx="18" ry="10" fill="#9a3309" opacity="0.88" transform="rotate(30 768 468)"/>
  <!-- Sauce arc suggestion -->
  <path d="M755 435 Q810 415 858 440" stroke="#fbbf24" stroke-width="3.5" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Wine glass silhouette (right of hero plate, inside safe zone) -->
  <!-- Bowl -->
  <path d="M1080 310 Q1120 390 1100 440 Q1090 465 1060 468 Q1030 465 1020 440 Q1000 390 1040 310 Z"
        fill="url(#glassGrad)" opacity="0.72"/>
  <!-- Stem -->
  <rect x="1056" y="468" width="8" height="110" fill="#fef3ec" opacity="0.38" rx="4"/>
  <!-- Base -->
  <ellipse cx="1060" cy="582" rx="42" ry="10" fill="#fef3ec" opacity="0.3"/>
  <!-- Glass inner highlight -->
  <path d="M1050 330 Q1058 370 1054 410" stroke="#fef3ec" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Layer 3: Decorative edge elements (may be cropped — carry no meaning) -->
  <!-- Top-left corner warm flare -->
  <ellipse cx="0" cy="0" rx="380" ry="280" fill="#c2410c" opacity="0.07"/>
  <!-- Bottom-right corner shadow depth -->
  <ellipse cx="1600" cy="900" rx="420" ry="300" fill="#78350f" opacity="0.1"/>

</svg>
