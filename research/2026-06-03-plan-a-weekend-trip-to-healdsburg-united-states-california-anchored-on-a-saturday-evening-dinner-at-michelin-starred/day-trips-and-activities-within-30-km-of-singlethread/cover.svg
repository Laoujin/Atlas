<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbe3cf"/>
      <stop offset="1" stop-color="#f0d3b4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#d97706"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun -->
  <circle cx="1090" cy="360" r="200" fill="url(#sun)"/>
  <circle cx="1090" cy="360" r="74" fill="#fbbf24" opacity="0.95"/>

  <!-- back hill -->
  <path d="M0 470 Q 360 360 720 440 T 1600 410 L1600 900 L0 900 Z" fill="url(#hillBack)" opacity="0.85"/>

  <!-- redwood accent -->
  <g opacity="0.9">
    <rect x="386" y="300" width="20" height="320" rx="6" fill="#5c2a1a"/>
    <path d="M396 250 L344 470 L448 470 Z" fill="#78350f"/>
    <path d="M396 300 L356 500 L436 500 Z" fill="#9a3309"/>
    <path d="M396 360 L364 540 L428 540 Z" fill="#78350f"/>
  </g>

  <!-- mid hill -->
  <path d="M0 560 Q 420 470 820 540 T 1600 530 L1600 900 L0 900 Z" fill="url(#hillMid)" opacity="0.92"/>

  <!-- river ribbon -->
  <path d="M-40 640 Q 420 600 720 670 T 1640 700 L1640 760 Q 1180 720 720 730 T -40 700 Z" fill="url(#river)"/>

  <!-- front hill with vineyard rows -->
  <path d="M0 700 Q 480 630 960 700 T 1640 720 L1640 900 L0 900 Z" fill="url(#hillFront)"/>
  <g stroke="#fbbf24" stroke-width="3" opacity="0.32" fill="none">
    <path d="M120 790 Q 600 730 1080 790"/>
    <path d="M180 830 Q 640 775 1120 830"/>
    <path d="M260 870 Q 700 820 1180 870"/>
  </g>
</svg>
