<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind castle hill -->
  <circle cx="980" cy="360" r="240" fill="url(#sun)"/>

  <!-- Distant hill range (Chilterns) -->
  <path d="M 0 540 Q 250 470 480 510 T 980 490 T 1600 520 L 1600 600 L 0 600 Z" fill="#9a3309" opacity="0.35"/>

  <!-- Castle hill -->
  <path d="M 720 560 Q 880 380 1040 410 Q 1180 440 1240 560 Z" fill="url(#hill)" opacity="0.92"/>

  <!-- Castle silhouette atop hill -->
  <g fill="#5c2a1a" opacity="0.95">
    <rect x="870" y="380" width="180" height="80"/>
    <rect x="860" y="365" width="20" height="20"/>
    <rect x="895" y="365" width="20" height="20"/>
    <rect x="930" y="365" width="20" height="20"/>
    <rect x="965" y="365" width="20" height="20"/>
    <rect x="1000" y="365" width="20" height="20"/>
    <rect x="1035" y="365" width="20" height="20"/>
    <rect x="940" y="320" width="50" height="70"/>
    <rect x="935" y="310" width="10" height="14"/>
    <rect x="955" y="310" width="10" height="14"/>
    <rect x="975" y="310" width="10" height="14"/>
    <polygon points="940,320 990,320 965,295"/>
  </g>

  <!-- River foreground -->
  <rect x="0" y="580" width="1600" height="320" fill="url(#river)"/>

  <!-- River shimmer lines -->
  <path d="M 100 700 Q 400 690 700 705 T 1500 700" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M 200 760 Q 500 750 800 765 T 1500 758" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M 50 820 Q 400 810 800 822 T 1550 815" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Stone bridge: three arches spanning the river -->
  <g>
    <!-- Bridge deck -->
    <rect x="430" y="560" width="740" height="40" fill="url(#bridge)"/>
    <rect x="430" y="556" width="740" height="8" fill="#fbbf24" opacity="0.6"/>
    <!-- Arch piers -->
    <rect x="560" y="600" width="40" height="90" fill="#78350f"/>
    <rect x="780" y="600" width="40" height="90" fill="#78350f"/>
    <rect x="1000" y="600" width="40" height="90" fill="#78350f"/>
    <!-- Arches (cut-outs as filled shapes over river) -->
    <path d="M 460 690 L 460 640 Q 520 580 580 640 L 580 690 Z" fill="url(#bridge)"/>
    <path d="M 600 690 L 600 640 Q 690 570 780 640 L 780 690 Z" fill="url(#bridge)"/>
    <path d="M 820 690 L 820 640 Q 910 570 1000 640 L 1000 690 Z" fill="url(#bridge)"/>
    <path d="M 1040 690 L 1040 640 Q 1100 580 1160 640 L 1160 690 Z" fill="url(#bridge)"/>
    <!-- Arch openings (showing river through) -->
    <path d="M 475 690 Q 525 625 575 690 Z" fill="url(#river)"/>
    <path d="M 615 690 Q 690 605 775 690 Z" fill="url(#river)"/>
    <path d="M 835 690 Q 910 605 995 690 Z" fill="url(#river)"/>
    <path d="M 1055 690 Q 1100 625 1155 690 Z" fill="url(#river)"/>
    <!-- Bridge reflection -->
    <rect x="430" y="690" width="740" height="6" fill="#fef3ec" opacity="0.35"/>
  </g>

  <!-- Rowing scull on river, foreground -->
  <g opacity="0.9">
    <ellipse cx="380" cy="790" rx="110" ry="8" fill="#1a0e0e"/>
    <rect x="370" y="780" width="20" height="6" fill="#5c2a1a"/>
    <!-- Oars -->
    <line x1="320" y1="785" x2="250" y2="770" stroke="#5c2a1a" stroke-width="3"/>
    <line x1="440" y1="785" x2="510" y2="770" stroke="#5c2a1a" stroke-width="3"/>
    <ellipse cx="245" cy="769" rx="8" ry="3" fill="#5c2a1a"/>
    <ellipse cx="515" cy="769" rx="8" ry="3" fill="#5c2a1a"/>
    <!-- Wake -->
    <path d="M 270 800 Q 380 815 490 800" stroke="#fef3ec" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- A second distant scull, smaller -->
  <g opacity="0.55">
    <ellipse cx="1280" cy="740" rx="70" ry="5" fill="#1a0e0e"/>
    <line x1="1240" y1="738" x2="1195" y2="728" stroke="#5c2a1a" stroke-width="2"/>
    <line x1="1320" y1="738" x2="1365" y2="728" stroke="#5c2a1a" stroke-width="2"/>
  </g>

  <!-- Riverbank trees foreground silhouette (decoration, partly cropped) -->
  <g fill="#5c2a1a" opacity="0.7">
    <ellipse cx="60" cy="600" rx="80" ry="60"/>
    <rect x="55" y="590" width="10" height="40"/>
    <ellipse cx="1560" cy="610" rx="90" ry="65"/>
    <rect x="1555" y="600" width="10" height="40"/>
  </g>
</svg>
