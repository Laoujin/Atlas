<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Thames meander, sweeping decorative band -->
  <path d="M -40 620 C 220 540, 380 720, 620 600 S 1050 460, 1280 560 S 1560 520, 1680 470"
        fill="none" stroke="#c2410c" stroke-opacity="0.18" stroke-width="38" stroke-linecap="round"/>
  <path d="M -40 620 C 220 540, 380 720, 620 600 S 1050 460, 1280 560 S 1560 520, 1680 470"
        fill="none" stroke="#9a3309" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round"/>

  <!-- 30km radius glow -->
  <circle cx="800" cy="450" r="340" fill="url(#glow)"/>

  <!-- Outer radius ring -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#9a3309" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2 10"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#c2410c" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="1 8"/>
  <circle cx="800" cy="450" r="140" fill="none" stroke="#c2410c" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="1 8"/>

  <!-- Connection lines from hub to satellite nodes -->
  <g stroke="#9a3309" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="800" y1="450" x2="560" y2="320"/>
    <line x1="800" y1="450" x2="1040" y2="290"/>
    <line x1="800" y1="450" x2="1080" y2="580"/>
    <line x1="800" y1="450" x2="600" y2="600"/>
    <line x1="800" y1="450" x2="490" y2="470"/>
    <line x1="800" y1="450" x2="1130" y2="430"/>
  </g>

  <!-- Satellite nodes (meetup locations) -->
  <g>
    <circle cx="560" cy="320" r="9" fill="#78350f"/>
    <circle cx="560" cy="320" r="4" fill="#fbbf24"/>

    <circle cx="1040" cy="290" r="9" fill="#78350f"/>
    <circle cx="1040" cy="290" r="4" fill="#fbbf24"/>

    <circle cx="1080" cy="580" r="9" fill="#78350f"/>
    <circle cx="1080" cy="580" r="4" fill="#fbbf24"/>

    <circle cx="600" cy="600" r="9" fill="#78350f"/>
    <circle cx="600" cy="600" r="4" fill="#fbbf24"/>

    <circle cx="490" cy="470" r="7" fill="#9a3309"/>
    <circle cx="1130" cy="430" r="7" fill="#9a3309"/>
  </g>

  <!-- Central hub: Reading / Bray anchor -->
  <circle cx="800" cy="450" r="42" fill="#78350f" opacity="0.25"/>
  <circle cx="800" cy="450" r="32" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="10" fill="#fef3ec" opacity="0.9"/>

  <!-- Compass / crosshair tick marks on outer ring -->
  <g stroke="#9a3309" stroke-opacity="0.6" stroke-width="2">
    <line x1="800" y1="100" x2="800" y2="120"/>
    <line x1="800" y1="780" x2="800" y2="800"/>
    <line x1="450" y1="450" x2="470" y2="450"/>
    <line x1="1130" y1="450" x2="1150" y2="450"/>
  </g>
</svg>
