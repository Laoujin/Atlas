<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f0eadb" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- full-bleed night sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon glow behind village -->
  <circle cx="1180" cy="260" r="220" fill="url(#moon)"/>
  <circle cx="1180" cy="260" r="46" fill="#fbbf24" opacity="0.9"/>

  <!-- michelin stars scattered (decorative, four-point) -->
  <g fill="#fbbf24" opacity="0.85">
    <path d="M 360 200 L 372 224 L 396 236 L 372 248 L 360 272 L 348 248 L 324 236 L 348 224 Z"/>
    <path d="M 620 150 L 628 166 L 644 174 L 628 182 L 620 198 L 612 182 L 596 174 L 612 166 Z"/>
    <path d="M 900 220 L 908 236 L 924 244 L 908 252 L 900 268 L 892 252 L 876 244 L 892 236 Z"/>
  </g>
  <g fill="#fef3ec" opacity="0.55">
    <circle cx="220" cy="320" r="2"/>
    <circle cx="480" cy="280" r="1.5"/>
    <circle cx="780" cy="170" r="2"/>
    <circle cx="1040" cy="180" r="1.5"/>
    <circle cx="1360" cy="320" r="2"/>
  </g>

  <!-- river bend across foreground -->
  <path d="M 0 720 Q 400 660 800 700 T 1600 680 L 1600 900 L 0 900 Z" fill="url(#river)"/>
  <!-- river highlights -->
  <path d="M 120 740 Q 400 700 700 730" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.35"/>
  <path d="M 820 760 Q 1100 740 1480 750" stroke="#d97706" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- village row: three cottages clustered (hero, centered ~800,500) -->
  <g>
    <!-- left cottage -->
    <rect x="380" y="540" width="220" height="180" fill="url(#wall)"/>
    <polygon points="380,540 490,420 600,540" fill="url(#roof)"/>
    <rect x="430" y="600" width="40" height="60" fill="#1a0e0e" opacity="0.7"/>
    <rect x="510" y="590" width="35" height="35" fill="#fbbf24" opacity="0.85"/>
    <!-- chimney -->
    <rect x="540" y="450" width="22" height="50" fill="#78350f"/>

    <!-- center cottage (tallest, hero focus) -->
    <rect x="640" y="490" width="320" height="230" fill="url(#wall)"/>
    <polygon points="640,490 800,340 960,490" fill="url(#roof)"/>
    <rect x="760" y="580" width="80" height="140" fill="#1a0e0e" opacity="0.75"/>
    <rect x="680" y="540" width="50" height="50" fill="#fbbf24" opacity="0.9"/>
    <rect x="870" y="540" width="50" height="50" fill="#fbbf24" opacity="0.9"/>
    <rect x="870" y="620" width="50" height="50" fill="#d97706" opacity="0.7"/>
    <rect x="680" y="620" width="50" height="50" fill="#d97706" opacity="0.7"/>
    <!-- chimney -->
    <rect x="870" y="380" width="26" height="60" fill="#78350f"/>

    <!-- right cottage -->
    <rect x="1000" y="560" width="200" height="160" fill="url(#wall)"/>
    <polygon points="1000,560 1100,450 1200,560" fill="url(#roof)"/>
    <rect x="1080" y="610" width="38" height="60" fill="#1a0e0e" opacity="0.7"/>
    <rect x="1020" y="600" width="32" height="32" fill="#fbbf24" opacity="0.8"/>
    <rect x="1150" y="600" width="32" height="32" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- footbridge hint over river, right side (private-island motif) -->
  <g opacity="0.7">
    <path d="M 1240 720 Q 1320 690 1400 720" stroke="#c2410c" stroke-width="3" fill="none"/>
    <line x1="1260" y1="712" x2="1260" y2="730" stroke="#c2410c" stroke-width="2"/>
    <line x1="1300" y1="703" x2="1300" y2="725" stroke="#c2410c" stroke-width="2"/>
    <line x1="1340" y1="703" x2="1340" y2="725" stroke="#c2410c" stroke-width="2"/>
    <line x1="1380" y1="712" x2="1380" y2="730" stroke="#c2410c" stroke-width="2"/>
  </g>

  <!-- island silhouette beyond bridge -->
  <ellipse cx="1470" cy="740" rx="100" ry="22" fill="#5c2a1a" opacity="0.85"/>
  <polygon points="1440,740 1470,690 1500,740" fill="#78350f" opacity="0.9"/>

  <!-- soft warm vignette from lit windows on lane -->
  <ellipse cx="800" cy="660" rx="380" ry="40" fill="#fbbf24" opacity="0.12"/>
</svg>
