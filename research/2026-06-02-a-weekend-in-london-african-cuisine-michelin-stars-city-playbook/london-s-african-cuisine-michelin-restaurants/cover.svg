<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1408"/>
    </linearGradient>
    <!-- Warm radial glow behind plates -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Left plate rim gradient -->
    <radialGradient id="plateL" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="72%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Right plate rim gradient -->
    <radialGradient id="plateR" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="72%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="well" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3b1408"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <!-- Rose accent for garnish dot -->
    <radialGradient id="garnish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: ambient glow centred on hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two overlapping dinner plates -->

  <!-- Left plate outer rim -->
  <circle cx="680" cy="450" r="215" fill="url(#plateL)" opacity="0.92"/>
  <!-- Left plate inner rim ring -->
  <circle cx="680" cy="450" r="190" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.45"/>
  <!-- Left plate well -->
  <circle cx="680" cy="450" r="158" fill="url(#well)" opacity="0.97"/>
  <!-- Left plate: garnish dot centre -->
  <circle cx="680" cy="450" r="22" fill="url(#garnish)" opacity="0.88"/>
  <!-- Left plate: small rose-accent petal arc (garnish swipe) -->
  <path d="M 658 432 Q 680 418 702 432 Q 690 448 680 452 Q 670 448 658 432 Z"
        fill="#be185d" opacity="0.72"/>

  <!-- Right plate outer rim (slightly overlapping, offset right and slightly down) -->
  <circle cx="940" cy="462" r="215" fill="url(#plateR)" opacity="0.90"/>
  <!-- Right plate inner rim ring -->
  <circle cx="940" cy="462" r="190" fill="none" stroke="#9a3309" stroke-width="6" opacity="0.45"/>
  <!-- Right plate well -->
  <circle cx="940" cy="462" r="158" fill="url(#well)" opacity="0.97"/>
  <!-- Right plate: garnish dot centre -->
  <circle cx="940" cy="462" r="22" fill="url(#garnish)" opacity="0.82"/>
  <!-- Right plate: small amber-accent petal arc -->
  <path d="M 918 444 Q 940 430 962 444 Q 950 460 940 464 Q 930 460 918 444 Z"
        fill="#d97706" opacity="0.78"/>

  <!-- Layer 3: Decorative edge — faint rust arc top-left (outside safe zone) -->
  <circle cx="200" cy="130" r="280" fill="none"
          stroke="#78350f" stroke-width="2" opacity="0.25"/>

  <!-- Layer 3: Faint rose arc bottom-right (outside safe zone) -->
  <circle cx="1420" cy="790" r="260" fill="none"
          stroke="#be185d" stroke-width="1.5" opacity="0.18"/>
</svg>
