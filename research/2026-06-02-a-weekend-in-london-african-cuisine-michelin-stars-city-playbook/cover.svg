<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Main plate gradient -->
    <radialGradient id="plate1" cx="46%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Second plate gradient -->
    <radialGradient id="plate2" cx="54%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="45%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Plate rim accent -->
    <radialGradient id="rim1" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Food dot accent -->
    <radialGradient id="fooddot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Rose accent glow for second plate -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Central radial glow -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)"/>

  <!-- Rose ambient behind second plate -->
  <ellipse cx="940" cy="430" rx="340" ry="320" fill="url(#roseGlow)"/>

  <!-- Layer 2: Hero — two overlapping dinner plates centered ~(800, 450) -->

  <!-- Back plate (right, slightly lower) -->
  <circle cx="880" cy="468" r="210" fill="url(#plate2)" opacity="0.88"/>
  <!-- Rim ring back plate -->
  <circle cx="880" cy="468" r="210" fill="url(#rim1)" opacity="0.75"/>
  <!-- Inner well back plate -->
  <circle cx="880" cy="468" r="145" fill="#faf8f2" opacity="0.55"/>

  <!-- Front plate (left, slightly higher — hero dominant) -->
  <circle cx="730" cy="440" r="225" fill="url(#plate1)" opacity="0.93"/>
  <!-- Rim ring front plate -->
  <circle cx="730" cy="440" r="225" fill="url(#rim1)" opacity="0.82"/>
  <!-- Inner well front plate -->
  <circle cx="730" cy="440" r="155" fill="#fef3ec" opacity="0.62"/>

  <!-- Food presentation dots on front plate — abstract plating -->
  <circle cx="730" cy="415" r="22" fill="url(#fooddot)" opacity="0.92"/>
  <circle cx="695" cy="462" r="14" fill="#c2410c" opacity="0.80"/>
  <circle cx="762" cy="458" r="11" fill="#d97706" opacity="0.85"/>
  <!-- Micro sauce swipe — a subtle arc shape -->
  <path d="M 698 432 Q 730 408 762 430" stroke="#9a3309" stroke-width="4" fill="none" opacity="0.65" stroke-linecap="round"/>

  <!-- Food dot on back plate -->
  <circle cx="878" cy="445" r="18" fill="url(#fooddot)" opacity="0.78"/>
  <circle cx="852" cy="478" r="11" fill="#be185d" opacity="0.62"/>

  <!-- Layer 2b: Wine glass silhouette — right side accent -->
  <!-- Glass bowl -->
  <ellipse cx="1095" cy="390" rx="48" ry="62" fill="#fbbf24" opacity="0.18"/>
  <ellipse cx="1095" cy="390" rx="38" ry="50" fill="#d97706" opacity="0.14"/>
  <!-- Wine level inside glass -->
  <ellipse cx="1095" cy="415" rx="34" ry="22" fill="#be185d" opacity="0.28"/>
  <!-- Stem -->
  <rect x="1092" y="452" width="6" height="90" rx="3" fill="#fbbf24" opacity="0.22"/>
  <!-- Base -->
  <ellipse cx="1095" cy="548" rx="30" ry="7" fill="#fbbf24" opacity="0.20"/>

  <!-- Layer 3: Edge decorations (outside safe zone — atmospheric only) -->
  <!-- Bottom-left corner warm arc -->
  <path d="M 0 900 Q 120 720 280 820" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.18"/>
  <!-- Top-right corner faint arc -->
  <path d="M 1600 0 Q 1480 140 1350 80" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.14"/>
  <!-- Subtle horizontal band at very bottom -->
  <rect x="0" y="840" width="1600" height="60" fill="#c2410c" opacity="0.08"/>
</svg>
