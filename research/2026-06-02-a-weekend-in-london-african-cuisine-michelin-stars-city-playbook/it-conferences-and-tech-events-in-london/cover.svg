<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1a0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero radial glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Badge back gradient -->
    <linearGradient id="badgeBack" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1a0e"/>
    </linearGradient>
    <!-- Badge mid gradient -->
    <linearGradient id="badgeMid" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <!-- Badge front gradient -->
    <linearGradient id="badgeFront" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <!-- Lanyard gradient -->
    <linearGradient id="lanyard" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: Radial glow behind hero -->
  <ellipse cx="800" cy="450" rx="620" ry="380" fill="url(#glow)"/>

  <!-- Layer 3: Hero — stacked conference badge cards, centered ~(800,450) -->

  <!-- Badge shadow / depth hint -->
  <rect x="618" y="248" width="384" height="430" rx="18" ry="18"
        fill="#0a0504" opacity="0.45" transform="rotate(-8 800 450)"/>

  <!-- Back badge (deepest, most rotated) -->
  <rect x="580" y="220" width="380" height="430" rx="16" ry="16"
        fill="url(#badgeBack)" opacity="0.75" transform="rotate(-10 800 450)"/>
  <!-- Accent bar on back badge -->
  <rect x="580" y="220" width="380" height="52" rx="16" ry="16"
        fill="#78350f" opacity="0.9" transform="rotate(-10 800 450)"/>
  <!-- Content lines on back badge (decoration, not text) -->
  <rect x="608" y="296" width="220" height="10" rx="5" fill="#fbbf24" opacity="0.18" transform="rotate(-10 800 450)"/>
  <rect x="608" y="318" width="160" height="10" rx="5" fill="#fbbf24" opacity="0.12" transform="rotate(-10 800 450)"/>
  <rect x="608" y="340" width="190" height="10" rx="5" fill="#fbbf24" opacity="0.10" transform="rotate(-10 800 450)"/>

  <!-- Mid badge -->
  <rect x="610" y="205" width="380" height="430" rx="16" ry="16"
        fill="url(#badgeMid)" opacity="0.85" transform="rotate(-3 800 450)"/>
  <!-- Accent bar on mid badge -->
  <rect x="610" y="205" width="380" height="52" rx="16" ry="16"
        fill="#7c2d12" opacity="0.9" transform="rotate(-3 800 450)"/>
  <!-- Content lines on mid badge -->
  <rect x="638" y="281" width="220" height="10" rx="5" fill="#fbbf24" opacity="0.22" transform="rotate(-3 800 450)"/>
  <rect x="638" y="303" width="160" height="10" rx="5" fill="#fbbf24" opacity="0.16" transform="rotate(-3 800 450)"/>
  <rect x="638" y="325" width="195" height="10" rx="5" fill="#fbbf24" opacity="0.13" transform="rotate(-3 800 450)"/>
  <!-- Small dot accent (speaker icon placeholder) -->
  <circle cx="660" cy="390" r="22" fill="#d97706" opacity="0.30" transform="rotate(-3 800 450)"/>
  <circle cx="660" cy="390" r="12" fill="#fbbf24" opacity="0.20" transform="rotate(-3 800 450)"/>

  <!-- Front badge (on top, upright) -->
  <rect x="640" y="190" width="380" height="430" rx="16" ry="16"
        fill="url(#badgeFront)" opacity="0.95"/>
  <!-- Accent bar on front badge -->
  <rect x="640" y="190" width="380" height="58" rx="16" ry="16"
        fill="#9a3309" opacity="0.95"/>
  <!-- Clip the bar bottom to be straight -->
  <rect x="640" y="230" width="380" height="18" fill="#9a3309" opacity="0.95"/>
  <!-- Lanyard clip hole -->
  <rect x="810" y="178" width="32" height="26" rx="6" fill="#fbbf24" opacity="0.80"/>
  <!-- Content lines on front badge -->
  <rect x="670" y="278" width="230" height="11" rx="5" fill="#fef3ec" opacity="0.50"/>
  <rect x="670" y="302" width="170" height="11" rx="5" fill="#fef3ec" opacity="0.35"/>
  <rect x="670" y="326" width="200" height="11" rx="5" fill="#fef3ec" opacity="0.28"/>
  <!-- Divider line -->
  <rect x="655" y="360" width="350" height="2" rx="1" fill="#fbbf24" opacity="0.40"/>
  <!-- Lower content lines -->
  <rect x="670" y="378" width="140" height="9" rx="4" fill="#fef3ec" opacity="0.22"/>
  <rect x="670" y="398" width="110" height="9" rx="4" fill="#fef3ec" opacity="0.18"/>
  <!-- Circular avatar placeholder -->
  <circle cx="836" cy="470" r="52" fill="#78350f" opacity="0.55"/>
  <circle cx="836" cy="470" r="38" fill="#9a3309" opacity="0.40"/>
  <!-- Bottom accent bar -->
  <rect x="640" y="572" width="380" height="48" rx="16" ry="16"
        fill="#7c2d12" opacity="0.80"/>
  <rect x="640" y="572" width="380" height="18" fill="#7c2d12" opacity="0.80"/>

  <!-- Lanyard ribbon (two angled strips going up from badge) -->
  <polygon points="800,178 822,178 760,100 748,110" fill="url(#lanyard)" opacity="0.65"/>
  <polygon points="822,178 844,178 896,100 882,110" fill="url(#lanyard)" opacity="0.55"/>

  <!-- Layer 4: Edge decorations (outside safe zone, atmospheric) -->
  <!-- Bottom-left corner arc sweep -->
  <path d="M 0 900 Q 180 700 350 820" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.18"/>
  <path d="M 0 900 Q 220 660 420 780" stroke="#d97706" stroke-width="2" fill="none" opacity="0.12"/>
  <!-- Top-right corner arc -->
  <path d="M 1600 0 Q 1420 200 1250 80" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.15"/>
  <!-- Subtle dot cluster bottom-right -->
  <circle cx="1480" cy="800" r="6" fill="#d97706" opacity="0.25"/>
  <circle cx="1510" cy="770" r="4" fill="#fbbf24" opacity="0.18"/>
  <circle cx="1455" cy="840" r="4" fill="#c2410c" opacity="0.20"/>
  <!-- Subtle dot cluster top-left -->
  <circle cx="120" cy="110" r="6" fill="#d97706" opacity="0.22"/>
  <circle cx="95" cy="140" r="4" fill="#fbbf24" opacity="0.15"/>
</svg>
