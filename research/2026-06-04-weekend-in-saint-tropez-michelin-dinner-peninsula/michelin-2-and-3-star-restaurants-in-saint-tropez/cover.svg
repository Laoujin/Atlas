<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient: nocturnal deep red -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1510"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm candlelight radial glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c8b8"/>
    </radialGradient>

    <!-- Plate inner well gradient -->
    <radialGradient id="plateInner" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="75%" stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#c8bba8"/>
    </radialGradient>

    <!-- Rose accent gradient for second plate -->
    <radialGradient id="plateRim2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="65%" stop-color="#f0d8d0"/>
      <stop offset="100%" stop-color="#c2789a"/>
    </radialGradient>

    <!-- Wine glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm ambient glow centred on dining area -->
  <ellipse cx="800" cy="460" rx="680" ry="480" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — two fine-dining plates -->

  <!-- Plate 1 (left, slightly back) -->
  <!-- Rim -->
  <ellipse cx="690" cy="465" rx="195" ry="195" fill="url(#plateRim)" opacity="0.88"/>
  <!-- Rim shadow ring -->
  <ellipse cx="690" cy="465" rx="195" ry="195" fill="none" stroke="#9a3309" stroke-width="3" opacity="0.35"/>
  <!-- Inner well -->
  <ellipse cx="690" cy="465" rx="145" ry="145" fill="url(#plateInner)" opacity="0.92"/>
  <!-- Food accent — abstract sauce dot, rust -->
  <circle cx="690" cy="455" r="28" fill="#c2410c" opacity="0.75"/>
  <circle cx="718" cy="472" r="10" fill="#d97706" opacity="0.85"/>
  <circle cx="664" cy="480" r="7" fill="#fbbf24" opacity="0.7"/>

  <!-- Plate 2 (right, foreground — slightly larger) -->
  <!-- Rim -->
  <ellipse cx="920" cy="455" rx="210" ry="210" fill="url(#plateRim2)" opacity="0.92"/>
  <!-- Rim line -->
  <ellipse cx="920" cy="455" rx="210" ry="210" fill="none" stroke="#be185d" stroke-width="3.5" opacity="0.3"/>
  <!-- Inner well -->
  <ellipse cx="920" cy="455" rx="158" ry="158" fill="url(#plateInner)" opacity="0.94"/>
  <!-- Food accent — abstract presentation, rose accent -->
  <ellipse cx="920" cy="442" rx="32" ry="22" fill="#9a3309" opacity="0.8"/>
  <circle cx="950" cy="458" r="12" fill="#be185d" opacity="0.72"/>
  <circle cx="893" cy="463" r="8" fill="#d97706" opacity="0.8"/>
  <circle cx="930" cy="476" r="6" fill="#fbbf24" opacity="0.65"/>

  <!-- Layer 2b: Wine glass silhouette (right of plates, within safe zone) -->
  <!-- Bowl of glass -->
  <ellipse cx="1155" cy="390" rx="48" ry="62" fill="url(#glassGrad)" opacity="0.7"/>
  <!-- Stem -->
  <rect x="1149" y="450" width="12" height="120" rx="5" fill="#78350f" opacity="0.6"/>
  <!-- Base -->
  <ellipse cx="1155" cy="572" rx="42" ry="10" fill="#78350f" opacity="0.55"/>
  <!-- Wine colour inside bowl -->
  <ellipse cx="1155" cy="400" rx="34" ry="40" fill="#be185d" opacity="0.38"/>
  <!-- Glass highlight -->
  <ellipse cx="1138" cy="370" rx="8" ry="18" fill="#fef3ec" opacity="0.28"/>

  <!-- Layer 3: Decorative stars (Michelin-star abstract) — three-point star motifs, low opacity -->
  <!-- Star 1 — upper left corner area -->
  <polygon points="210,145 218,168 242,168 223,182 230,205 210,191 190,205 197,182 178,168 202,168"
           fill="#fbbf24" opacity="0.55"/>
  <!-- Star 2 — upper right -->
  <polygon points="1370,130 1378,153 1402,153 1383,167 1390,190 1370,176 1350,190 1357,167 1338,153 1362,153"
           fill="#fbbf24" opacity="0.45"/>
  <!-- Star 3 — lower right edge -->
  <polygon points="1460,750 1466,768 1485,768 1470,779 1476,797 1460,786 1444,797 1450,779 1435,768 1454,768"
           fill="#d97706" opacity="0.38"/>

  <!-- Subtle horizontal table-line suggestion below plates -->
  <rect x="0" y="640" width="1600" height="260" fill="#78350f" opacity="0.12"/>
  <line x1="0" y1="642" x2="1600" y2="642" stroke="#9a3309" stroke-width="1.5" opacity="0.3"/>

</svg>
