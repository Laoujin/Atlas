<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal warm dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2e1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Left plate gradient -->
    <radialGradient id="plateL" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c8b2"/>
    </radialGradient>

    <!-- Right plate gradient -->
    <radialGradient id="plateR" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c8b2"/>
    </radialGradient>

    <!-- Plate rim shadow -->
    <radialGradient id="rimL" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="rimR" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Garnish accent gradient -->
    <radialGradient id="garnish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Glass fill gradient -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Table surface gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient table surface ellipse at bottom -->
  <ellipse cx="800" cy="820" rx="820" ry="160" fill="url(#table)" opacity="0.7"/>

  <!-- Central warm radial glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two dinner plates + wine glass -->

  <!-- Left plate shadow -->
  <ellipse cx="570" cy="468" rx="188" ry="24" fill="#1a0e0e" opacity="0.5"/>
  <!-- Left plate body -->
  <circle cx="570" cy="440" r="190" fill="url(#plateL)" opacity="0.95"/>
  <!-- Left plate rim shadow ring -->
  <circle cx="570" cy="440" r="190" fill="url(#rimL)"/>
  <!-- Left plate inner well -->
  <circle cx="570" cy="435" r="128" fill="#faf8f2" opacity="0.6"/>
  <!-- Left plate garnish dot — rust accent -->
  <circle cx="570" cy="430" r="28" fill="url(#garnish)" opacity="0.88"/>
  <!-- Left plate garnish ring -->
  <circle cx="570" cy="430" r="42" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.45"/>

  <!-- Right plate shadow -->
  <ellipse cx="1030" cy="468" rx="188" ry="24" fill="#1a0e0e" opacity="0.5"/>
  <!-- Right plate body -->
  <circle cx="1030" cy="440" r="190" fill="url(#plateR)" opacity="0.95"/>
  <!-- Right plate rim shadow ring -->
  <circle cx="1030" cy="440" r="190" fill="url(#rimR)"/>
  <!-- Right plate inner well -->
  <circle cx="1030" cy="435" r="128" fill="#faf8f2" opacity="0.6"/>
  <!-- Right plate garnish dot — rose secondary accent -->
  <circle cx="1030" cy="430" r="28" fill="#be185d" opacity="0.72"/>
  <!-- Right plate garnish ring -->
  <circle cx="1030" cy="430" r="42" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.45"/>

  <!-- Wine glass silhouette centered between plates -->
  <!-- Bowl: tapered trapezoid path -->
  <path d="M770,260 Q800,340 830,260 L818,260 Q800,325 782,260 Z" fill="url(#glassFill)" opacity="0.0"/>
  <!-- Glass bowl (wider) -->
  <path d="M755,238 C740,290 745,360 800,385 C855,360 860,290 845,238 Z" fill="url(#glassFill)" opacity="0.82"/>
  <!-- Glass stem -->
  <rect x="795" y="385" width="10" height="100" fill="#be185d" opacity="0.45" rx="3"/>
  <!-- Glass base -->
  <ellipse cx="800" cy="488" rx="48" ry="10" fill="#be185d" opacity="0.38"/>
  <!-- Glass highlight -->
  <path d="M768,255 C762,280 763,320 772,348" fill="none" stroke="#fef3ec" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <!-- Wine surface inside bowl -->
  <ellipse cx="800" cy="360" rx="46" ry="10" fill="#be185d" opacity="0.55"/>

  <!-- Subtle candlelight between glass and right plate -->
  <ellipse cx="920" cy="390" rx="8" ry="18" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="920" cy="410" rx="5" ry="8" fill="#d97706" opacity="0.5"/>

  <!-- Layer 3: Edge decoration (full-bleed, may crop on card) -->
  <!-- Top-left corner warm wash -->
  <radialGradient id="cornerTL" cx="0%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#c2410c" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#cornerTL)"/>

  <!-- Bottom edge vignette -->
  <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
    <stop offset="70%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.6"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
