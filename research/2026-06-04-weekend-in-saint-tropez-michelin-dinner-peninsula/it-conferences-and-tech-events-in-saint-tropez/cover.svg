<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle warm horizon band -->
  <rect x="0" y="620" width="1600" height="280" fill="#fbbf24" opacity="0.10"/>

  <!-- Layer 2: Radial glow behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#glow)"/>

  <!-- Hero: three stacked angled conference-page rectangles, centered at (800, 450) -->
  <!-- Back card (bottom-most, offset up-left) -->
  <rect x="420" y="175" width="640" height="420"
        rx="14"
        fill="url(#card2)"
        opacity="0.72"
        transform="rotate(-7 800 450)"/>

  <!-- Middle card -->
  <rect x="440" y="185" width="640" height="420"
        rx="14"
        fill="url(#card1)"
        opacity="0.82"
        transform="rotate(-2 800 450)"/>

  <!-- Front card (hero face) -->
  <rect x="460" y="195" width="640" height="420"
        rx="14"
        fill="url(#card3)"
        opacity="0.93"
        transform="rotate(4 800 450)"/>

  <!-- Decorative line-bars inside front card (faint, suggesting agenda/schedule rows) -->
  <rect x="520" y="290" width="380" height="14" rx="7" fill="#fef3ec" opacity="0.30" transform="rotate(4 800 450)"/>
  <rect x="520" y="326" width="300" height="14" rx="7" fill="#fef3ec" opacity="0.22" transform="rotate(4 800 450)"/>
  <rect x="520" y="362" width="340" height="14" rx="7" fill="#fef3ec" opacity="0.22" transform="rotate(4 800 450)"/>
  <rect x="520" y="398" width="260" height="14" rx="7" fill="#fef3ec" opacity="0.18" transform="rotate(4 800 450)"/>

  <!-- Small accent dot (venue pin / LED dot) on front card upper area -->
  <circle cx="800" cy="248" r="22" fill="#fbbf24" opacity="0.88" transform="rotate(4 800 450)"/>
  <circle cx="800" cy="248" r="11" fill="#78350f" opacity="0.90" transform="rotate(4 800 450)"/>

  <!-- Layer 3: Coastal arc decoration (outside safe zone bottom, purely atmospheric) -->
  <path d="M 0 820 Q 400 760 800 800 Q 1200 840 1600 790 L 1600 900 L 0 900 Z"
        fill="#d97706" opacity="0.13"/>
  <path d="M 0 860 Q 500 820 800 845 Q 1100 870 1600 840 L 1600 900 L 0 900 Z"
        fill="#c2410c" opacity="0.10"/>
</svg>
