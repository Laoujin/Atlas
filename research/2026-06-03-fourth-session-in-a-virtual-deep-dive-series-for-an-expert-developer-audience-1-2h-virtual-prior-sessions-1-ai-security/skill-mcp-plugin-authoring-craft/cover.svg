<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Rust hero glow -->
    <radialGradient id="rustGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Left block fill -->
    <linearGradient id="blockLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Right block fill -->
    <linearGradient id="blockRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0a4f63"/>
    </linearGradient>
    <!-- Connector pin fill -->
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Spark trail gradient -->
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Background ambient glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Ambient center glow -->
  <rect width="1600" height="900" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), fits well within safe zone -->

  <!-- Glow halo behind the connector join -->
  <ellipse cx="800" cy="450" rx="340" ry="220" fill="url(#rustGlow)" opacity="0.85"/>

  <!-- LEFT BLOCK (plug body) — rust, right edge has connector tabs -->
  <!-- Main body rectangle -->
  <rect x="280" y="310" width="360" height="280" rx="18" fill="url(#blockLeft)" opacity="0.92"/>
  <!-- Block face highlight edge -->
  <rect x="280" y="310" width="360" height="280" rx="18" fill="none"
        stroke="#c2410c" stroke-width="2.5" opacity="0.6"/>
  <!-- Connector tabs protruding right from left block -->
  <rect x="635" y="362" width="72" height="52" rx="6" fill="#c2410c" opacity="0.95"/>
  <rect x="635" y="487" width="72" height="52" rx="6" fill="#c2410c" opacity="0.95"/>
  <!-- Tab highlights -->
  <rect x="635" y="362" width="72" height="52" rx="6" fill="none"
        stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  <rect x="635" y="487" width="72" height="52" rx="6" fill="none"
        stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>

  <!-- RIGHT BLOCK (socket body) — teal, left edge has matching recessed slots -->
  <!-- Recessed slot cutouts (drawn as dark rects behind block) -->
  <rect x="893" y="355" width="74" height="66" rx="6" fill="#0a2a35" opacity="0.95"/>
  <rect x="893" y="480" width="74" height="66" rx="6" fill="#0a2a35" opacity="0.95"/>
  <!-- Main body rectangle -->
  <rect x="960" y="310" width="360" height="280" rx="18" fill="url(#blockRight)" opacity="0.92"/>
  <!-- Block face highlight edge -->
  <rect x="960" y="310" width="360" height="280" rx="18" fill="none"
        stroke="#0e7490" stroke-width="2.5" opacity="0.6"/>
  <!-- Socket slot visible on left face -->
  <rect x="893" y="362" width="72" height="52" rx="5" fill="#071c24" opacity="1"/>
  <rect x="893" y="487" width="72" height="52" rx="5" fill="#071c24" opacity="1"/>
  <!-- Slot rim highlight -->
  <rect x="893" y="362" width="72" height="52" rx="5" fill="none"
        stroke="#0e7490" stroke-width="1.5" opacity="0.7"/>
  <rect x="893" y="487" width="72" height="52" rx="5" fill="none"
        stroke="#0e7490" stroke-width="1.5" opacity="0.7"/>

  <!-- SPARK TRAIL between the two blocks — the connection moment -->
  <!-- Main spark bar -->
  <rect x="700" y="444" width="200" height="12" rx="6" fill="url(#spark)" opacity="0.95"/>
  <!-- Upper spark filament -->
  <rect x="710" y="437" width="180" height="4" rx="2" fill="url(#spark)" opacity="0.55"/>
  <!-- Lower spark filament -->
  <rect x="715" y="459" width="170" height="4" rx="2" fill="url(#spark)" opacity="0.45"/>
  <!-- Central spark node -->
  <circle cx="800" cy="450" r="14" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="450" r="8" fill="#ffffff" opacity="0.75"/>

  <!-- PIN tips entering slots (golden, adds depth) -->
  <rect x="707" y="370" width="58" height="36" rx="4" fill="url(#pinGrad)" opacity="0.9"/>
  <rect x="707" y="495" width="58" height="36" rx="4" fill="url(#pinGrad)" opacity="0.9"/>

  <!-- Layer 3: Edge decoration (outside safe zone, purely atmospheric) -->
  <!-- Top-left corner arc — atmospheric only -->
  <path d="M 0,0 Q 160,0 160,120" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.18"/>
  <!-- Bottom-right corner arc -->
  <path d="M 1600,900 Q 1440,900 1440,780" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.18"/>
  <!-- Subtle top edge line -->
  <line x1="0" y1="2" x2="1600" y2="2" stroke="#c2410c" stroke-width="2" opacity="0.12"/>
  <!-- Subtle bottom edge line -->
  <line x1="0" y1="898" x2="1600" y2="898" stroke="#0e7490" stroke-width="2" opacity="0.12"/>
</svg>
