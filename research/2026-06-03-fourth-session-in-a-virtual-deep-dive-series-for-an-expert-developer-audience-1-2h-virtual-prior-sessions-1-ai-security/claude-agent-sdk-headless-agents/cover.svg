<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1a0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Orbit ring gradient -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Node fill: violet satellite -->
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>

    <!-- Node fill: rust satellite -->
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>

    <!-- Edge glow filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hub glow filter -->
    <filter id="hubFilter" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle wide ambient glow behind the hero -->
  <ellipse cx="800" cy="450" rx="680" ry="400" fill="#c2410c" opacity="0.06"/>

  <!-- Layer 3 decorative: faint outer orbit ring (bleeds to edges, decorative) -->
  <circle cx="800" cy="450" r="380" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.18"/>
  <circle cx="800" cy="450" r="280" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.22"/>

  <!-- ====== Layer 2: Hero — node-and-edge graph, centered at (800, 450) ====== -->

  <!-- Orbit rings (inner, visible within safe zone) -->
  <circle cx="800" cy="450" r="180" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.35"/>

  <!-- Edge lines: hub to each satellite node (drawn first, behind nodes) -->
  <!-- Node positions (6 satellites on inner orbit r=180, offset angles for variety) -->
  <!-- Angles: 0°, 55°, 120°, 185°, 250°, 310° -->
  <!-- cos/sin pre-computed: -->
  <!-- 0°:   (980, 450)  -->
  <!-- 55°:  (903, 597)  -->
  <!-- 120°: (710, 606)  -->
  <!-- 185°: (621, 434)  -->
  <!-- 250°: (738, 281)  -->
  <!-- 310°: (916, 312)  -->

  <line x1="800" y1="450" x2="980" y2="450"  stroke="#fbbf24" stroke-width="1.8" opacity="0.55"/>
  <line x1="800" y1="450" x2="903" y2="597"  stroke="#6d28d9" stroke-width="1.8" opacity="0.5"/>
  <line x1="800" y1="450" x2="710" y2="606"  stroke="#6d28d9" stroke-width="1.8" opacity="0.5"/>
  <line x1="800" y1="450" x2="621" y2="434"  stroke="#fbbf24" stroke-width="1.8" opacity="0.55"/>
  <line x1="800" y1="450" x2="738" y2="281"  stroke="#6d28d9" stroke-width="1.8" opacity="0.5"/>
  <line x1="800" y1="450" x2="916" y2="312"  stroke="#fbbf24" stroke-width="1.8" opacity="0.55"/>

  <!-- Secondary edges between adjacent satellites (pipeline / mesh) -->
  <line x1="980" y1="450" x2="916" y2="312"  stroke="#c2410c" stroke-width="1.2" opacity="0.32"/>
  <line x1="916" y1="312" x2="738" y2="281"  stroke="#6d28d9" stroke-width="1.2" opacity="0.28"/>
  <line x1="738" y1="281" x2="621" y2="434"  stroke="#6d28d9" stroke-width="1.2" opacity="0.28"/>
  <line x1="621" y1="434" x2="710" y2="606"  stroke="#c2410c" stroke-width="1.2" opacity="0.32"/>
  <line x1="710" y1="606" x2="903" y2="597"  stroke="#6d28d9" stroke-width="1.2" opacity="0.28"/>
  <line x1="903" y1="597" x2="980" y2="450"  stroke="#c2410c" stroke-width="1.2" opacity="0.32"/>

  <!-- Glow pulses on two edges (headless execution feel) -->
  <line x1="800" y1="450" x2="980" y2="450"  stroke="#fbbf24" stroke-width="4" opacity="0.18" filter="url(#softGlow)"/>
  <line x1="800" y1="450" x2="621" y2="434"  stroke="#fbbf24" stroke-width="4" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Satellite nodes: alternating violet / rust -->
  <!-- Node at 0° (980, 450) — rust -->
  <circle cx="980" cy="450" r="22" fill="url(#nodeRust)" opacity="0.92"/>
  <circle cx="980" cy="450" r="28" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>

  <!-- Node at 55° (903, 597) — violet -->
  <circle cx="903" cy="597" r="19" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="903" cy="597" r="24" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity="0.35"/>

  <!-- Node at 120° (710, 606) — rust -->
  <circle cx="710" cy="606" r="19" fill="url(#nodeRust)" opacity="0.88"/>
  <circle cx="710" cy="606" r="24" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.35"/>

  <!-- Node at 185° (621, 434) — violet -->
  <circle cx="621" cy="434" r="22" fill="url(#nodeViolet)" opacity="0.92"/>
  <circle cx="621" cy="434" r="28" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>

  <!-- Node at 250° (738, 281) — rust -->
  <circle cx="738" cy="281" r="19" fill="url(#nodeRust)" opacity="0.88"/>
  <circle cx="738" cy="281" r="24" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.35"/>

  <!-- Node at 310° (916, 312) — violet -->
  <circle cx="916" cy="312" r="19" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="916" cy="312" r="24" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity="0.35"/>

  <!-- Central hub: rust glow -->
  <circle cx="800" cy="450" r="62" fill="url(#hubGlow)" filter="url(#hubFilter)" opacity="0.75"/>
  <circle cx="800" cy="450" r="52" fill="#c2410c" opacity="0.90"/>
  <circle cx="800" cy="450" r="52" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
  <!-- Inner hub ring — pipeline core -->
  <circle cx="800" cy="450" r="36" fill="#9a3309" opacity="0.95"/>
  <circle cx="800" cy="450" r="22" fill="#fbbf24" opacity="0.85"/>

  <!-- Layer 3 decoration: far-corner faint arcs (purely atmospheric) -->
  <circle cx="150" cy="150" r="90" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.1"/>
  <circle cx="1450" cy="750" r="90" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.1"/>
</svg>
