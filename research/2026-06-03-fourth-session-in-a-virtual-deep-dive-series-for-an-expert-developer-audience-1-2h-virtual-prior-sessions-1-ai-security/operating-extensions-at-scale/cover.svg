<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#0f1a1a"/>
    </linearGradient>
    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Extension block gradient -->
    <linearGradient id="extGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#164e63" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Central halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Connector line gradient: rust to teal -->
    <linearGradient id="conn1" x1="800" y1="450" x2="440" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="conn2" x1="800" y1="450" x2="1160" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="conn3" x1="800" y1="450" x2="800" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed ring decorations (outside safe zone edges — atmospheric) -->
  <circle cx="800" cy="450" r="520" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="800" cy="450" r="390" fill="none" stroke="#0e7490" stroke-width="1" stroke-opacity="0.10"/>
  <circle cx="800" cy="450" r="260" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Central halo bloom -->
  <circle cx="800" cy="450" r="300" fill="url(#halo)"/>

  <!-- Layer 2: Hero — connector lines from hub to extensions -->
  <line x1="800" y1="450" x2="440" y2="240" stroke="url(#conn1)" stroke-width="3" stroke-linecap="round"/>
  <line x1="800" y1="450" x2="1160" y2="240" stroke="url(#conn2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="800" y1="450" x2="800" y2="730" stroke="url(#conn3)" stroke-width="3" stroke-linecap="round"/>

  <!-- Extension block: top-left -->
  <rect x="340" y="175" width="200" height="130" rx="14" ry="14" fill="url(#extGrad)" stroke="#0e7490" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Inner port slot on extension block -->
  <rect x="370" y="207" width="140" height="18" rx="4" fill="#0e7490" fill-opacity="0.4"/>
  <rect x="370" y="237" width="100" height="18" rx="4" fill="#0e7490" fill-opacity="0.25"/>
  <rect x="370" y="267" width="120" height="18" rx="4" fill="#0e7490" fill-opacity="0.25"/>
  <!-- Connection dot at block edge -->
  <circle cx="440" cy="240" r="10" fill="#0e7490" fill-opacity="0.9"/>
  <circle cx="440" cy="240" r="5" fill="#67e8f9"/>

  <!-- Extension block: top-right -->
  <rect x="1060" y="175" width="200" height="130" rx="14" ry="14" fill="url(#extGrad)" stroke="#0e7490" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="1090" y="207" width="140" height="18" rx="4" fill="#0e7490" fill-opacity="0.4"/>
  <rect x="1090" y="237" width="100" height="18" rx="4" fill="#0e7490" fill-opacity="0.25"/>
  <rect x="1090" y="267" width="120" height="18" rx="4" fill="#0e7490" fill-opacity="0.25"/>
  <circle cx="1160" cy="240" r="10" fill="#0e7490" fill-opacity="0.9"/>
  <circle cx="1160" cy="240" r="5" fill="#67e8f9"/>

  <!-- Extension block: bottom-center -->
  <rect x="700" y="663" width="200" height="130" rx="14" ry="14" fill="url(#extGrad)" stroke="#0e7490" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="730" y="695" width="140" height="18" rx="4" fill="#0e7490" fill-opacity="0.4"/>
  <rect x="730" y="725" width="100" height="18" rx="4" fill="#0e7490" fill-opacity="0.25"/>
  <rect x="730" y="755" width="120" height="18" rx="4" fill="#0e7490" fill-opacity="0.25"/>
  <circle cx="800" cy="730" r="10" fill="#0e7490" fill-opacity="0.9"/>
  <circle cx="800" cy="730" r="5" fill="#67e8f9"/>

  <!-- Hub hexagon: centered at (800, 450), flat-top, radius ~110 -->
  <polygon
    points="800,340 895,395 895,505 800,560 705,505 705,395"
    fill="url(#hubGlow)"
    stroke="#fbbf24"
    stroke-width="3"
    stroke-opacity="0.85"
  />
  <!-- Inner hexagon for depth -->
  <polygon
    points="800,375 862,410 862,490 800,525 738,490 738,410"
    fill="none"
    stroke="#fbbf24"
    stroke-width="1.5"
    stroke-opacity="0.45"
  />
  <!-- Hub center dot -->
  <circle cx="800" cy="450" r="22" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="800" cy="450" r="11" fill="#78350f"/>

  <!-- Layer 3: Corner atmosphere (outside safe zone — decorative only) -->
  <circle cx="0" cy="0" r="180" fill="none" stroke="#c2410c" stroke-width="60" stroke-opacity="0.04"/>
  <circle cx="1600" cy="900" r="180" fill="none" stroke="#0e7490" stroke-width="60" stroke-opacity="0.04"/>
</svg>
