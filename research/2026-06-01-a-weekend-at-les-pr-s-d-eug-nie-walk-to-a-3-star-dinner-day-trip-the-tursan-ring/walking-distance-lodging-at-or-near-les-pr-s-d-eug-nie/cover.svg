<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="65%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#5c2a1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#f0eadb" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant tree line silhouette -->
  <path d="M0,640 Q120,600 220,620 T440,610 T680,625 T920,605 T1180,620 T1400,608 T1600,625 L1600,900 L0,900 Z"
        fill="#1a0e0e" opacity="0.55"/>

  <!-- promenade / footpath leading back -->
  <path d="M740,820 L860,820 L900,560 L700,560 Z" fill="url(#path)" opacity="0.7"/>

  <!-- left house (further) -->
  <g opacity="0.92">
    <polygon points="380,510 520,440 660,510 660,640 380,640" fill="url(#house)"/>
    <polygon points="370,515 520,430 670,515 520,430" fill="url(#roof)"/>
    <rect x="470" y="555" width="40" height="60" fill="#78350f" opacity="0.85"/>
    <rect x="555" y="545" width="35" height="35" fill="#fbbf24" opacity="0.75"/>
    <rect x="410" y="545" width="35" height="35" fill="#fbbf24" opacity="0.65"/>
  </g>

  <!-- central hero house -->
  <g>
    <polygon points="640,560 800,460 960,560 960,720 640,720" fill="url(#house)"/>
    <polygon points="625,565 800,448 975,565" fill="url(#roof)"/>
    <polygon points="800,448 800,720 640,720 640,560" fill="#000" opacity="0.08"/>
    <rect x="775" y="640" width="50" height="80" fill="#78350f"/>
    <rect x="783" y="652" width="34" height="55" fill="#fbbf24" opacity="0.85"/>
    <rect x="680" y="600" width="42" height="50" fill="#fbbf24" opacity="0.7"/>
    <rect x="878" y="600" width="42" height="50" fill="#fbbf24" opacity="0.75"/>
    <!-- chimney -->
    <rect x="880" y="475" width="22" height="55" fill="#78350f"/>
  </g>

  <!-- right house (further) -->
  <g opacity="0.9">
    <polygon points="960,520 1090,450 1220,520 1220,650 960,650" fill="url(#house)"/>
    <polygon points="950,525 1090,442 1230,525" fill="url(#roof)"/>
    <rect x="1040" y="565" width="38" height="55" fill="#78350f" opacity="0.85"/>
    <rect x="985" y="555" width="32" height="32" fill="#fbbf24" opacity="0.7"/>
    <rect x="1130" y="555" width="32" height="32" fill="#fbbf24" opacity="0.65"/>
  </g>

  <!-- lantern halos along the promenade -->
  <circle cx="720" cy="600" r="55" fill="url(#lantern)"/>
  <circle cx="880" cy="600" r="55" fill="url(#lantern)"/>
  <circle cx="760" cy="730" r="45" fill="url(#lantern)" opacity="0.8"/>
  <circle cx="840" cy="730" r="45" fill="url(#lantern)" opacity="0.8"/>

  <!-- foreground ground shadow -->
  <ellipse cx="800" cy="830" rx="520" ry="55" fill="#1a0e0e" opacity="0.55"/>
</svg>
