<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="abbey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed warm sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun glow behind hero -->
  <circle cx="800" cy="430" r="380" fill="url(#sun)"/>

  <!-- far rolling hills (vineyard country) -->
  <path d="M 0 620 Q 200 560 420 590 T 820 580 T 1240 600 T 1600 590 L 1600 900 L 0 900 Z"
        fill="url(#hillFar)" opacity="0.7"/>

  <!-- faint vineyard rows on the mid slope (decoration, low opacity) -->
  <g stroke="#fbbf24" stroke-width="1.4" opacity="0.25">
    <path d="M 180 680 Q 500 640 880 660" fill="none"/>
    <path d="M 160 705 Q 500 665 900 685" fill="none"/>
    <path d="M 140 730 Q 500 690 920 710" fill="none"/>
    <path d="M 120 755 Q 500 715 940 735" fill="none"/>
  </g>

  <!-- mid hill, foreground -->
  <path d="M 0 740 Q 300 680 640 720 T 1180 720 T 1600 700 L 1600 900 L 0 900 Z"
        fill="url(#hillMid)"/>

  <!-- hero: Romanesque abbey silhouette, centered ~ (800, 540), inside safe zone -->
  <g fill="url(#abbey)">
    <!-- nave: long rectangular body -->
    <rect x="700" y="540" width="220" height="140"/>
    <!-- apse (rounded eastern end) -->
    <path d="M 920 540 Q 980 540 980 610 Q 980 680 920 680 Z"/>
    <!-- transept block -->
    <rect x="780" y="500" width="80" height="180"/>
    <!-- square Romanesque bell tower -->
    <rect x="640" y="430" width="80" height="250"/>
    <!-- tower crenellation cap -->
    <rect x="632" y="418" width="96" height="16"/>
    <!-- short pyramid roof on tower -->
    <path d="M 632 418 L 680 380 L 728 418 Z"/>
    <!-- nave roofline (slight pitch) -->
    <path d="M 700 540 L 810 522 L 920 540 Z"/>
    <!-- tiny cross at apex (geometric, no letters) -->
    <rect x="677" y="362" width="6" height="20"/>
    <rect x="671" y="368" width="18" height="6"/>
  </g>

  <!-- arched window cutouts on nave (Romanesque rounded arches) -->
  <g fill="#fbbf24" opacity="0.55">
    <path d="M 730 600 Q 740 580 750 600 L 750 630 L 730 630 Z"/>
    <path d="M 770 600 Q 780 580 790 600 L 790 630 L 770 630 Z"/>
    <path d="M 810 600 Q 820 580 830 600 L 830 630 L 810 630 Z"/>
    <path d="M 850 600 Q 860 580 870 600 L 870 630 L 850 630 Z"/>
    <path d="M 890 600 Q 900 580 910 600 L 910 630 L 890 630 Z"/>
  </g>

  <!-- single arched tower window -->
  <path d="M 668 470 Q 680 450 692 470 L 692 510 L 668 510 Z" fill="#fbbf24" opacity="0.65"/>

  <!-- foreground cypress accents flanking the abbey -->
  <path d="M 560 680 Q 568 600 576 680 Z" fill="#1a0e0e" opacity="0.7"/>
  <path d="M 1020 690 Q 1028 610 1036 690 Z" fill="#1a0e0e" opacity="0.7"/>
  <path d="M 1080 700 Q 1086 640 1092 700 Z" fill="#1a0e0e" opacity="0.6"/>
</svg>
