<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm sun glow behind hero -->
  <circle cx="800" cy="470" r="430" fill="url(#glow)"/>

  <!-- distant vineyard horizon (decoration, partly croppable) -->
  <path d="M0 640 Q 400 615 800 635 T 1600 645 L 1600 720 L 0 720 Z" fill="#9a3309" opacity="0.35"/>
  <g stroke="#78350f" stroke-width="2" opacity="0.45">
    <line x1="120" y1="660" x2="180" y2="710"/>
    <line x1="240" y1="655" x2="310" y2="710"/>
    <line x1="370" y1="652" x2="450" y2="710"/>
    <line x1="510" y1="650" x2="600" y2="710"/>
    <line x1="660" y1="648" x2="760" y2="710"/>
    <line x1="830" y1="648" x2="940" y2="710"/>
    <line x1="1010" y1="650" x2="1130" y2="710"/>
    <line x1="1200" y1="653" x2="1320" y2="710"/>
    <line x1="1390" y1="657" x2="1500" y2="710"/>
  </g>

  <!-- ground -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#ground)"/>

  <!-- HERO: plate + cloche (dome), centered ~(800, 480) -->
  <!-- plate ellipse (table) -->
  <ellipse cx="800" cy="690" rx="420" ry="42" fill="#1a0e0e" opacity="0.35"/>
  <!-- plate -->
  <ellipse cx="800" cy="660" rx="380" ry="48" fill="url(#plate)" stroke="#9a3309" stroke-width="3" opacity="0.95"/>
  <ellipse cx="800" cy="655" rx="320" ry="34" fill="#fef3ec" stroke="#c2410c" stroke-width="1.5" opacity="0.85"/>

  <!-- cloche dome -->
  <path d="M 540 660
           Q 540 360 800 340
           Q 1060 360 1060 660 Z"
        fill="url(#dome)" opacity="0.95"/>
  <!-- dome highlight -->
  <path d="M 620 620 Q 600 440 760 380" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55"/>
  <!-- dome finial -->
  <circle cx="800" cy="330" r="22" fill="#78350f"/>
  <circle cx="800" cy="330" r="14" fill="#d97706"/>

  <!-- single Michelin-style star above the dome (geometric, not text) -->
  <path d="M 800 220
           L 814 258
           L 854 258
           L 822 282
           L 834 320
           L 800 296
           L 766 320
           L 778 282
           L 746 258
           L 786 258 Z"
        fill="#fbbf24" opacity="0.9" stroke="#c2410c" stroke-width="2"/>

  <!-- two herb sprigs flanking the plate (Couvent des Herbes nod) -->
  <g stroke="#5c2a1a" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M 430 660 Q 420 620 440 590"/>
    <path d="M 435 635 Q 420 625 410 615"/>
    <path d="M 438 615 Q 422 605 412 597"/>
    <path d="M 440 595 Q 428 585 420 580"/>
  </g>
  <g stroke="#5c2a1a" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M 1170 660 Q 1180 620 1160 590"/>
    <path d="M 1165 635 Q 1180 625 1190 615"/>
    <path d="M 1162 615 Q 1178 605 1188 597"/>
    <path d="M 1160 595 Q 1172 585 1180 580"/>
  </g>
</svg>
