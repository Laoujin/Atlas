<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="petalOuter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="petalMid" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="petalCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="470" rx="700" ry="380" fill="url(#glow)"/>

  <!-- distant horizon hills -->
  <path d="M0,610 Q260,560 520,590 T1080,580 T1600,600 L1600,720 L0,720 Z" fill="#c2410c" opacity="0.18"/>
  <path d="M0,650 Q320,620 640,640 T1280,635 T1600,650 L1600,760 L0,760 Z" fill="#9a3309" opacity="0.22"/>

  <!-- reflecting pond -->
  <ellipse cx="800" cy="760" rx="520" ry="58" fill="url(#pond)"/>
  <ellipse cx="800" cy="760" rx="520" ry="58" fill="none" stroke="#78350f" stroke-opacity="0.25" stroke-width="1.2"/>
  <ellipse cx="800" cy="755" rx="380" ry="6" fill="#fef3ec" opacity="0.35"/>
  <ellipse cx="800" cy="772" rx="280" ry="3" fill="#fef3ec" opacity="0.25"/>

  <!-- stem -->
  <path d="M800,720 Q792,640 800,560 Q808,500 800,470" fill="none" stroke="#5c2a1a" stroke-width="4" opacity="0.7"/>
  <path d="M800,640 Q760,628 740,600 Q768,614 800,624" fill="#9a3309" opacity="0.55"/>
  <path d="M800,610 Q840,598 862,572 Q834,588 800,594" fill="#9a3309" opacity="0.55"/>

  <!-- rose: outer petals -->
  <g transform="translate(800 440)">
    <ellipse cx="-150" cy="-30" rx="120" ry="90" fill="url(#petalOuter)" opacity="0.85" transform="rotate(-25 -150 -30)"/>
    <ellipse cx="150" cy="-30" rx="120" ry="90" fill="url(#petalOuter)" opacity="0.85" transform="rotate(25 150 -30)"/>
    <ellipse cx="-90" cy="90" rx="115" ry="80" fill="url(#petalOuter)" opacity="0.88" transform="rotate(-60 -90 90)"/>
    <ellipse cx="90" cy="90" rx="115" ry="80" fill="url(#petalOuter)" opacity="0.88" transform="rotate(60 90 90)"/>
    <ellipse cx="0" cy="-110" rx="140" ry="95" fill="url(#petalOuter)" opacity="0.9"/>

    <!-- mid petals -->
    <ellipse cx="-70" cy="-20" rx="80" ry="60" fill="url(#petalMid)" opacity="0.92" transform="rotate(-20 -70 -20)"/>
    <ellipse cx="70" cy="-20" rx="80" ry="60" fill="url(#petalMid)" opacity="0.92" transform="rotate(20 70 -20)"/>
    <ellipse cx="0" cy="50" rx="90" ry="65" fill="url(#petalMid)" opacity="0.92"/>
    <ellipse cx="0" cy="-60" rx="85" ry="62" fill="url(#petalMid)" opacity="0.95"/>

    <!-- core -->
    <ellipse cx="0" cy="0" rx="55" ry="48" fill="url(#petalCore)" opacity="0.95"/>
    <path d="M-20,-10 Q0,-30 20,-10 Q20,15 0,20 Q-20,15 -20,-10 Z" fill="#9a3309" opacity="0.75"/>
    <path d="M-8,-4 Q0,-14 8,-4 Q8,8 0,10 Q-8,8 -8,-4 Z" fill="#5c2a1a" opacity="0.6"/>
  </g>

  <!-- drifting petals as subtle decoration -->
  <ellipse cx="280" cy="280" rx="22" ry="10" fill="#d97706" opacity="0.55" transform="rotate(-30 280 280)"/>
  <ellipse cx="1340" cy="320" rx="26" ry="11" fill="#c2410c" opacity="0.55" transform="rotate(35 1340 320)"/>
  <ellipse cx="1240" cy="700" rx="18" ry="8" fill="#9a3309" opacity="0.5" transform="rotate(-15 1240 700)"/>
  <ellipse cx="360" cy="690" rx="20" ry="9" fill="#d97706" opacity="0.5" transform="rotate(20 360 690)"/>
</svg>
