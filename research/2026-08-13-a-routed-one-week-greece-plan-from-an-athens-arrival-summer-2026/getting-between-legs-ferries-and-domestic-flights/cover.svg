<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.62" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fbe6cf"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="352" r="215" fill="url(#sun)"/>

  <path d="M0 620 L1600 620 L1600 900 L0 900 Z" fill="url(#sea)"/>

  <!-- distant island headlands, cropped-safe at the edges -->
  <path d="M60 620 L250 548 L430 620 Z" fill="#78350f" opacity="0.28"/>
  <path d="M1180 620 L1360 560 L1470 596 L1560 620 Z" fill="#78350f" opacity="0.22"/>

  <!-- hero: ferry -->
  <path d="M540 545 L1162 545 L1086 622 L604 622 Z" fill="#78350f" opacity="0.92"/>
  <rect x="618" y="452" width="424" height="94" rx="16" fill="url(#deck)"/>
  <rect x="700" y="404" width="252" height="50" rx="12" fill="#9a3309" opacity="0.9"/>
  <path d="M866 404 L934 404 L924 358 L880 358 Z" fill="#c2410c" opacity="0.9"/>
  <g fill="#fbbf24" opacity="0.72">
    <rect x="650" y="486" width="150" height="14" rx="7"/>
    <rect x="826" y="486" width="182" height="14" rx="7"/>
    <rect x="726" y="420" width="196" height="12" rx="6"/>
  </g>

  <!-- wake -->
  <g stroke="#fef3ec" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M300 648 Q470 632 596 640" stroke-width="12"/>
    <path d="M356 692 Q560 674 700 684" stroke-width="9" opacity="0.75"/>
    <path d="M470 738 Q700 722 880 730" stroke-width="7" opacity="0.5"/>
  </g>
  <g stroke="#78350f" fill="none" opacity="0.28" stroke-linecap="round">
    <path d="M980 700 Q1180 686 1400 698" stroke-width="8"/>
    <path d="M1060 782 Q1280 766 1520 780" stroke-width="8"/>
  </g>
</svg>
