<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fellBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fellMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f15"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- soft sun glow behind fells -->
  <ellipse cx="800" cy="560" rx="720" ry="280" fill="url(#glow)"/>

  <!-- distant fell layer -->
  <path d="M 0 620 L 180 540 L 360 580 L 540 500 L 760 560 L 980 480 L 1200 540 L 1400 500 L 1600 560 L 1600 900 L 0 900 Z"
        fill="url(#fellBack)" opacity="0.85"/>

  <!-- mid fell layer -->
  <path d="M 0 700 L 220 620 L 420 660 L 620 600 L 820 640 L 1020 580 L 1240 640 L 1440 610 L 1600 660 L 1600 900 L 0 900 Z"
        fill="url(#fellMid)" opacity="0.95"/>

  <!-- winding lane -->
  <path d="M 720 900 Q 780 820 760 760 Q 740 720 800 690 Q 860 670 840 640"
        stroke="#f0eadb" stroke-width="6" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- HERO: cottage cluster around (800, 450) -->
  <!-- left smaller cottage -->
  <g>
    <polygon points="600,560 600,490 680,430 760,490 760,560" fill="url(#wall)"/>
    <polygon points="590,495 680,425 770,495 760,500 680,438 600,500" fill="url(#slate)"/>
    <rect x="640" y="495" width="20" height="35" fill="#1a0e0e" opacity="0.7"/>
    <rect x="700" y="510" width="22" height="22" fill="url(#window)" opacity="0.95"/>
    <rect x="720" y="420" width="14" height="40" fill="#1a0e0e"/>
  </g>

  <!-- central main cottage (hero) -->
  <g>
    <polygon points="740,640 740,500 880,380 1020,500 1020,640" fill="url(#wall)"/>
    <polygon points="725,510 880,372 1035,510 1020,520 880,392 740,520" fill="url(#slate)"/>
    <!-- glowing main window -->
    <rect x="830" y="510" width="60" height="70" fill="url(#window)"/>
    <line x1="860" y1="510" x2="860" y2="580" stroke="#3a1a10" stroke-width="3"/>
    <line x1="830" y1="545" x2="890" y2="545" stroke="#3a1a10" stroke-width="3"/>
    <!-- second smaller window -->
    <rect x="920" y="520" width="35" height="45" fill="url(#window)" opacity="0.9"/>
    <line x1="937" y1="520" x2="937" y2="565" stroke="#3a1a10" stroke-width="2"/>
    <!-- door -->
    <rect x="770" y="555" width="32" height="85" fill="#1a0e0e" opacity="0.85"/>
    <rect x="775" y="558" width="22" height="40" fill="url(#window)" opacity="0.7"/>
    <!-- chimneys -->
    <rect x="810" y="380" width="22" height="55" fill="#3a1a10"/>
    <rect x="950" y="430" width="20" height="50" fill="#3a1a10"/>
    <!-- chimney smoke wisp -->
    <path d="M 821 380 Q 815 350 825 325 Q 835 305 822 280" stroke="#f0eadb" stroke-width="3" fill="none" opacity="0.25" stroke-linecap="round"/>
  </g>

  <!-- right outbuilding -->
  <g>
    <polygon points="1020,640 1020,520 1110,460 1200,520 1200,640" fill="url(#wall)" opacity="0.95"/>
    <polygon points="1010,525 1110,455 1210,525 1200,532 1110,468 1020,532" fill="url(#slate)"/>
    <rect x="1100" y="540" width="28" height="40" fill="url(#window)" opacity="0.85"/>
    <rect x="1140" y="455" width="14" height="35" fill="#1a0e0e"/>
  </g>

  <!-- lantern accent: small post-lamp to the left -->
  <g opacity="0.95">
    <rect x="552" y="540" width="4" height="80" fill="#1a0e0e"/>
    <polygon points="540,540 568,540 562,520 546,520" fill="#3a1a10"/>
    <rect x="546" y="522" width="16" height="18" fill="url(#window)"/>
    <circle cx="554" cy="531" r="22" fill="#fbbf24" opacity="0.18"/>
  </g>

  <!-- foreground ground shadow -->
  <path d="M 0 760 Q 400 730 800 745 Q 1200 760 1600 730 L 1600 900 L 0 900 Z"
        fill="#1a0e0e" opacity="0.55"/>
</svg>
