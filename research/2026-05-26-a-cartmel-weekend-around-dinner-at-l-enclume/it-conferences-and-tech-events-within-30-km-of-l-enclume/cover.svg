<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="fellFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fellMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fellNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="0.95" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind fells -->
  <circle cx="800" cy="470" r="360" fill="url(#sun)"/>

  <!-- Far fells -->
  <path d="M 0 560 L 120 500 L 260 540 L 410 470 L 560 510 L 720 460 L 880 495 L 1040 455 L 1200 500 L 1360 470 L 1500 505 L 1600 490 L 1600 900 L 0 900 Z"
        fill="url(#fellFar)" opacity="0.75"/>

  <!-- Mid fells -->
  <path d="M 0 640 L 140 590 L 300 620 L 460 555 L 620 600 L 780 540 L 940 585 L 1100 550 L 1260 605 L 1420 575 L 1600 620 L 1600 900 L 0 900 Z"
        fill="url(#fellMid)" opacity="0.9"/>

  <!-- Compass / radius rings centred on Cartmel (hero) -->
  <g transform="translate(800 600)" opacity="0.85">
    <circle r="230" fill="url(#ringFade)"/>
    <circle r="160" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.5"/>
    <circle r="100" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.65"/>

    <!-- Network edges from Cartmel hub to conference nodes within 30km -->
    <line x1="0" y1="0" x2="-180" y2="-70" stroke="#0e7490" stroke-width="1.6" opacity="0.7"/>
    <line x1="0" y1="0" x2="140" y2="-110" stroke="#0e7490" stroke-width="1.6" opacity="0.7"/>
    <line x1="0" y1="0" x2="-120" y2="60" stroke="#0e7490" stroke-width="1.6" opacity="0.7"/>
    <line x1="0" y1="0" x2="200" y2="40" stroke="#0e7490" stroke-width="1.6" opacity="0.7"/>
    <line x1="0" y1="0" x2="-80" y2="-150" stroke="#0e7490" stroke-width="1.6" opacity="0.7"/>
    <line x1="0" y1="0" x2="90" y2="120" stroke="#0e7490" stroke-width="1.6" opacity="0.55"/>

    <!-- Conference nodes -->
    <circle cx="-180" cy="-70" r="7" fill="#0e7490" opacity="0.9"/>
    <circle cx="140" cy="-110" r="7" fill="#0e7490" opacity="0.9"/>
    <circle cx="-120" cy="60" r="6" fill="#0e7490" opacity="0.9"/>
    <circle cx="200" cy="40" r="7" fill="#0e7490" opacity="0.9"/>
    <circle cx="-80" cy="-150" r="6" fill="#0e7490" opacity="0.9"/>
    <circle cx="90" cy="120" r="5" fill="#0e7490" opacity="0.8"/>

    <!-- Cartmel hub -->
    <circle r="18" fill="#fbbf24" opacity="0.95"/>
    <circle r="11" fill="#c2410c"/>
    <circle r="4" fill="#fef3ec"/>
  </g>

  <!-- Near fell silhouette (foreground), framing the hub from below -->
  <path d="M 0 760 L 180 720 L 360 745 L 540 705 L 720 735 L 900 700 L 1080 740 L 1260 715 L 1440 750 L 1600 725 L 1600 900 L 0 900 Z"
        fill="url(#fellNear)"/>
</svg>
