<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Main plate gradient — warm ivory -->
    <radialGradient id="plateFill" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c4aa"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Second plate gradient — slightly cooler -->
    <radialGradient id="plate2Fill" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>
    <!-- Sauce accent gradient -->
    <radialGradient id="sauceFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Rose accent gradient -->
    <radialGradient id="roseAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Cloche dome gradient -->
    <linearGradient id="clocheDome" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm ambient glow centered on composition -->
  <ellipse cx="800" cy="450" rx="680" ry="480" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two plates with fine-dining arrangement, centered in safe zone -->

  <!-- Back plate (slightly offset left-back) -->
  <ellipse cx="720" cy="470" rx="195" ry="195" fill="url(#plate2Fill)" opacity="0.82"/>
  <!-- Back plate rim ring -->
  <ellipse cx="720" cy="470" rx="195" ry="195" fill="none" stroke="url(#plateRim)" stroke-width="10" opacity="0.6"/>
  <!-- Inner rim detail on back plate -->
  <ellipse cx="720" cy="470" rx="170" ry="170" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.25"/>

  <!-- Small sauce dot on back plate -->
  <circle cx="700" cy="455" r="28" fill="url(#sauceFill)" opacity="0.75"/>
  <!-- Microgreens hint — three thin arcs as abstract garnish -->
  <line x1="700" y1="455" x2="685" y2="424" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="700" y1="455" x2="703" y2="419" stroke="#9a3309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="700" y1="455" x2="718" y2="428" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- Front plate (slightly offset right-front, hero) -->
  <ellipse cx="890" cy="460" rx="210" ry="210" fill="url(#plateFill)" opacity="0.92"/>
  <!-- Front plate rim ring — gold accent -->
  <ellipse cx="890" cy="460" rx="210" ry="210" fill="none" stroke="#fbbf24" stroke-width="11" opacity="0.45"/>
  <!-- Inner decorative rim -->
  <ellipse cx="890" cy="460" rx="188" ry="188" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.3"/>

  <!-- Sauce smear on front plate — rose accent color (Michelin red/rose motif) -->
  <ellipse cx="875" cy="448" rx="52" ry="22" fill="url(#roseAccent)" opacity="0.8" transform="rotate(-18, 875, 448)"/>
  <!-- Central food element — small dome shape (main course) -->
  <ellipse cx="895" cy="445" rx="38" ry="22" fill="#9a3309" opacity="0.85"/>
  <ellipse cx="895" cy="442" rx="28" ry="14" fill="#c2410c" opacity="0.7"/>
  <!-- Garnish stem accents on front plate -->
  <line x1="895" y1="428" x2="880" y2="395" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <line x1="895" y1="428" x2="898" y2="391" stroke="#9a3309" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="895" y1="428" x2="912" y2="400" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Sauce dot accent -->
  <circle cx="930" cy="472" r="10" fill="#be185d" opacity="0.7"/>
  <circle cx="848" cy="477" r="7" fill="#d97706" opacity="0.65"/>

  <!-- Chopsticks — two elegant diagonal rods bridging both plates, a Hong Kong cultural marker -->
  <rect x="640" y="620" width="8" height="280" rx="4"
        fill="#fbbf24" opacity="0.55"
        transform="rotate(-68, 800, 630)"/>
  <rect x="660" y="620" width="6" height="280" rx="3"
        fill="#d97706" opacity="0.4"
        transform="rotate(-65, 820, 625)"/>

  <!-- Layer 3: Atmospheric decoration outside/near safe-zone edges -->

  <!-- Subtle star cluster top-right — Michelin stars motif, abstract -->
  <!-- Star 1 -->
  <polygon points="1420,110 1427,132 1450,132 1432,145 1439,168 1420,154 1401,168 1408,145 1390,132 1413,132"
           fill="#fbbf24" opacity="0.28"/>
  <!-- Star 2 (smaller) -->
  <polygon points="1470,75 1475,90 1491,90 1478,99 1483,114 1470,105 1457,114 1462,99 1449,90 1465,90"
           fill="#d97706" opacity="0.22"/>
  <!-- Star 3 (smallest) -->
  <polygon points="1380,85 1384,96 1396,96 1387,103 1391,115 1380,108 1369,115 1373,103 1364,96 1376,96"
           fill="#c2410c" opacity="0.2"/>

  <!-- Bottom edge vignette -->
  <rect x="0" y="750" width="1600" height="150" fill="#1a0e0e" opacity="0.55"/>
  <!-- Top edge vignette -->
  <rect x="0" y="0" width="1600" height="100" fill="#1a0e0e" opacity="0.4"/>

  <!-- Subtle rose accent arc — bottom left decoration -->
  <path d="M 0 900 Q 200 700 420 820" stroke="#be185d" stroke-width="2" fill="none" opacity="0.18"/>
</svg>
