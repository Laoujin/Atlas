<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.42" r="0.18">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Distant hills -->
  <path d="M0,560 C180,500 320,540 480,520 C640,500 760,540 920,510 C1080,480 1240,520 1400,500 C1500,490 1600,510 1600,510 L1600,900 L0,900 Z" fill="url(#hillFar)"/>

  <!-- Mid hill range, lower so it sits behind the castle hill -->
  <path d="M0,650 C160,610 300,640 460,620 C600,605 720,640 860,615 C1000,590 1180,625 1340,605 C1460,592 1600,615 1600,615 L1600,900 L0,900 Z" fill="url(#hillMid)" opacity="0.85"/>

  <!-- Central castle hill, hero zone -->
  <path d="M420,780 C540,720 660,640 800,560 C940,640 1060,720 1180,780 L1180,900 L420,900 Z" fill="url(#hillNear)"/>

  <!-- Vineyard rows on castle hill (subtle hatching following the slope) -->
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.18" fill="none">
    <path d="M460,775 C580,720 690,660 800,605"/>
    <path d="M500,790 C610,735 710,680 810,630"/>
    <path d="M540,805 C640,755 730,705 820,655"/>
    <path d="M580,820 C670,775 750,730 830,680"/>
    <path d="M1140,775 C1020,720 910,660 800,605"/>
    <path d="M1100,790 C990,735 890,680 790,630"/>
    <path d="M1060,805 C960,755 870,705 780,655"/>
    <path d="M1020,820 C930,775 850,730 770,680"/>
  </g>

  <!-- Castello di Serralunga: tall square keep on the hilltop -->
  <!-- Base walls (lower, wider) -->
  <rect x="735" y="500" width="130" height="70" fill="#1a0e0e" opacity="0.95"/>
  <!-- Main tower-keep (tall, square) -->
  <rect x="760" y="340" width="80" height="170" fill="url(#keep)"/>
  <!-- Battlements (merlons) on top of the keep -->
  <g fill="#1a0e0e">
    <rect x="760" y="328" width="14" height="14"/>
    <rect x="782" y="328" width="14" height="14"/>
    <rect x="804" y="328" width="14" height="14"/>
    <rect x="826" y="328" width="14" height="14"/>
  </g>
  <!-- Battlements on base wall -->
  <g fill="#1a0e0e">
    <rect x="735" y="492" width="12" height="10"/>
    <rect x="755" y="492" width="12" height="10"/>
    <rect x="843" y="492" width="12" height="10"/>
    <rect x="855" y="492" width="12" height="10" opacity="0"/>
    <rect x="853" y="492" width="12" height="10"/>
  </g>
  <!-- Narrow arrow-slit windows (very small, dark) -->
  <rect x="795" y="395" width="4" height="14" fill="#fbbf24" opacity="0.55"/>
  <rect x="795" y="440" width="4" height="14" fill="#fbbf24" opacity="0.4"/>

  <!-- Tiny Big Bench silhouette in foreground left (a small landmark accent) -->
  <g fill="#1a0e0e" opacity="0.85">
    <rect x="260" y="735" width="90" height="10"/>
    <rect x="260" y="745" width="6" height="40"/>
    <rect x="344" y="745" width="6" height="40"/>
  </g>

  <!-- Winding road suggestion through the near hill -->
  <path d="M1180,895 C1100,840 1040,800 980,770 C920,740 880,720 850,700" stroke="#faf8f2" stroke-width="3" fill="none" opacity="0.18" stroke-linecap="round"/>
</svg>
