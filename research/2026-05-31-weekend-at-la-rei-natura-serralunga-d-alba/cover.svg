<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.7" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow centered behind hero (dinner ambiance) -->
  <ellipse cx="800" cy="500" rx="780" ry="430" fill="url(#glow)"/>

  <!-- low moon glow, decoration -->
  <circle cx="1180" cy="220" r="110" fill="url(#moon)" opacity="0.75"/>

  <!-- rolling Langhe hills (background to foreground) -->
  <path d="M 0 640 Q 220 540 460 590 T 920 580 T 1360 560 T 1600 590 L 1600 900 L 0 900 Z"
        fill="url(#hill1)" opacity="0.85"/>
  <path d="M 0 720 Q 280 640 540 690 T 1040 680 T 1600 700 L 1600 900 L 0 900 Z"
        fill="url(#hill2)" opacity="0.9"/>
  <path d="M 0 800 Q 340 750 680 780 T 1280 790 T 1600 800 L 1600 900 L 0 900 Z"
        fill="url(#hill3)" opacity="0.95"/>

  <!-- hero: wine glass silhouette, centered near (800, 450), inside safe zone -->
  <g transform="translate(800 450)">
    <!-- bowl -->
    <path d="M -110 -180 Q -110 -40 0 30 Q 110 -40 110 -180 Z"
          fill="url(#wine)" stroke="#fbbf24" stroke-width="2.5" opacity="0.92"/>
    <!-- meniscus highlight (wine surface) -->
    <ellipse cx="0" cy="-150" rx="100" ry="14" fill="#fbbf24" opacity="0.35"/>
    <!-- stem -->
    <rect x="-4" y="30" width="8" height="160" fill="#fbbf24" opacity="0.85"/>
    <!-- base -->
    <ellipse cx="0" cy="195" rx="85" ry="10" fill="#fbbf24" opacity="0.8"/>
    <!-- inner glass shine -->
    <path d="M -85 -160 Q -90 -60 -30 0" fill="none" stroke="#fef3ec" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- a few sparse vineyard-row marks on nearest hill (decoration, atmosphere) -->
  <g stroke="#fbbf24" stroke-width="1" opacity="0.25" fill="none">
    <path d="M 120 830 L 240 815"/>
    <path d="M 180 850 L 320 832"/>
    <path d="M 1320 825 L 1460 815"/>
    <path d="M 1280 850 L 1440 838"/>
  </g>
</svg>
