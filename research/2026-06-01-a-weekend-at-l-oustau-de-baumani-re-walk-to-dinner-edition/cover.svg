<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#c2410c"/>
      <stop offset="0.8" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rockShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow behind the massif -->
  <circle cx="1080" cy="540" r="420" fill="url(#sun)"/>

  <!-- distant Alpilles ridge (decorative, partly outside safe zone) -->
  <path d="M0,560 L180,500 L320,540 L480,470 L640,520 L820,490 L980,530 L1180,475 L1360,520 L1600,490 L1600,620 L0,620 Z"
        fill="#5c2a1a" opacity="0.7"/>

  <!-- HERO: Les Baux limestone massif, centered ~(800, 450) -->
  <g opacity="0.95">
    <!-- main rock silhouette -->
    <path d="M380,720
             L420,640 L460,610 L500,560 L540,540 L580,510
             L630,500 L680,470 L730,455 L780,420 L820,400
             L860,415 L900,400 L950,410 L990,395 L1030,410
             L1080,430 L1130,455 L1170,475 L1210,510 L1240,545
             L1260,590 L1240,720 Z"
          fill="url(#rock)"/>
    <!-- shaded right face -->
    <path d="M820,400 L860,415 L900,400 L950,410 L990,395 L1030,410
             L1080,430 L1130,455 L1170,475 L1210,510 L1240,545
             L1260,590 L1240,720 L1100,720 L1080,520 L1000,460 L900,440 L820,400 Z"
          fill="url(#rockShade)"/>
    <!-- medieval village rooftops on the crest -->
    <g fill="#78350f" opacity="0.85">
      <polygon points="700,475 720,455 740,475 740,495 700,495"/>
      <polygon points="745,468 770,448 795,468 795,492 745,492"/>
      <polygon points="800,448 820,428 840,448 840,475 800,475"/>
      <polygon points="848,440 868,420 888,440 888,468 848,468"/>
      <polygon points="895,432 920,412 945,432 945,460 895,460"/>
      <polygon points="950,438 970,418 990,438 990,465 950,465"/>
      <polygon points="998,432 1020,412 1042,432 1042,460 998,460"/>
    </g>
    <!-- ruined keep silhouette (tallest point) -->
    <rect x="912" y="380" width="24" height="48" fill="#5c2a1a" opacity="0.9"/>
    <rect x="906" y="372" width="36" height="10" fill="#5c2a1a" opacity="0.9"/>
    <!-- crevice shadows in the rock -->
    <path d="M540,540 L560,620 L580,700" stroke="#78350f" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M780,420 L760,540 L740,680" stroke="#9a3309" stroke-width="3" fill="none" opacity="0.45"/>
    <path d="M1080,430 L1100,560 L1110,700" stroke="#9a3309" stroke-width="3" fill="none" opacity="0.4"/>
  </g>

  <!-- foreground ground / olive grove plane -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#ground)"/>

  <!-- olive sprig — foreground accent, lower left of hero -->
  <g transform="translate(360,770) rotate(-18)" opacity="0.9">
    <path d="M0,0 Q140,-20 260,-60" stroke="#5c2a1a" stroke-width="4" fill="none"/>
    <ellipse cx="40" cy="-12" rx="22" ry="9" fill="#be185d" opacity="0.75" transform="rotate(-15 40 -12)"/>
    <ellipse cx="90" cy="-22" rx="24" ry="9" fill="#9a3309" opacity="0.8" transform="rotate(-20 90 -22)"/>
    <ellipse cx="140" cy="-34" rx="22" ry="9" fill="#be185d" opacity="0.7" transform="rotate(-25 140 -34)"/>
    <ellipse cx="190" cy="-46" rx="24" ry="9" fill="#9a3309" opacity="0.8" transform="rotate(-30 190 -46)"/>
    <ellipse cx="60" cy="6" rx="22" ry="9" fill="#78350f" opacity="0.75" transform="rotate(15 60 6)"/>
    <ellipse cx="115" cy="-4" rx="24" ry="9" fill="#78350f" opacity="0.8" transform="rotate(8 115 -4)"/>
    <ellipse cx="170" cy="-16" rx="22" ry="9" fill="#9a3309" opacity="0.75" transform="rotate(0 170 -16)"/>
    <!-- olives -->
    <circle cx="155" cy="-2" r="8" fill="#1a0e0e" opacity="0.85"/>
    <circle cx="205" cy="-18" r="7" fill="#1a0e0e" opacity="0.85"/>
  </g>
</svg>
