<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm sun glow behind hero -->
  <circle cx="800" cy="450" r="430" fill="url(#glow)"/>

  <!-- distant faint nodes outside the radius (sparse scene) -->
  <g opacity="0.55" fill="#9a3309">
    <circle cx="240" cy="200" r="5"/>
    <circle cx="1380" cy="240" r="4"/>
    <circle cx="1440" cy="700" r="5"/>
    <circle cx="200" cy="720" r="4"/>
    <circle cx="1500" cy="450" r="3"/>
  </g>
  <!-- faint connection threads from outer nodes toward hub (sparse graph) -->
  <g stroke="#9a3309" stroke-width="1" fill="none" opacity="0.28" stroke-dasharray="2 6">
    <line x1="240" y1="200" x2="800" y2="450"/>
    <line x1="1380" y1="240" x2="800" y2="450"/>
    <line x1="1440" y1="700" x2="800" y2="450"/>
    <line x1="200" y1="720" x2="800" y2="450"/>
  </g>

  <!-- back ridge of Alpilles -->
  <path d="M 180 600 L 320 520 L 430 560 L 560 480 L 700 540 L 820 470 L 960 530 L 1120 480 L 1260 540 L 1420 500 L 1500 540 L 1500 720 L 180 720 Z"
        fill="url(#ridgeBack)"/>

  <!-- foreground rocky outcrop silhouette (Les Baux hill) -->
  <path d="M 280 720
           L 380 670
           L 470 640
           L 560 605
           L 640 580
           L 720 540
           L 780 500
           L 830 475
           L 880 470
           L 940 495
           L 1010 525
           L 1090 555
           L 1180 590
           L 1280 625
           L 1380 670
           L 1480 720
           Z"
        fill="url(#ridge)"/>

  <!-- 30 km radius circle, centered on hub -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.85"/>
  <circle cx="800" cy="450" r="340" fill="#c2410c" opacity="0.04"/>

  <!-- inner faint radius tick -->
  <circle cx="800" cy="450" r="180" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.35" stroke-dasharray="3 7"/>

  <!-- hub pin glow -->
  <circle cx="800" cy="450" r="56" fill="url(#pinGlow)"/>

  <!-- map pin marker (the restaurant anchor) -->
  <path d="M 800 388
           C 770 388 748 410 748 438
           C 748 472 800 512 800 512
           C 800 512 852 472 852 438
           C 852 410 830 388 800 388 Z"
        fill="#c2410c" stroke="#78350f" stroke-width="2"/>
  <circle cx="800" cy="436" r="13" fill="#faf8f2"/>
  <circle cx="800" cy="436" r="6" fill="#9a3309"/>

  <!-- two close-in nodes inside the radius, sparsely connected to hub -->
  <g>
    <line x1="800" y1="450" x2="610" y2="350" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>
    <line x1="800" y1="450" x2="1010" y2="560" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>
    <circle cx="610" cy="350" r="7" fill="#6d28d9" opacity="0.75"/>
    <circle cx="1010" cy="560" r="7" fill="#6d28d9" opacity="0.75"/>
  </g>
</svg>
