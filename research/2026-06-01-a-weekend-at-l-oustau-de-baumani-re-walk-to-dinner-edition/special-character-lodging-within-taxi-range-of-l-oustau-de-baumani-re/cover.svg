<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rockBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="mas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- low sun glow -->
  <circle cx="1080" cy="520" r="280" fill="url(#sun)"/>

  <!-- distant ridge (back) -->
  <path d="M0 640 L 180 560 L 320 600 L 480 520 L 640 580 L 820 500 L 1000 560 L 1200 510 L 1400 570 L 1600 540 L 1600 900 L 0 900 Z" fill="url(#rockBack)"/>

  <!-- hero: Alpilles outcrop silhouette with hilltop château -->
  <path d="M260 720
           L 360 600
           L 440 560
           L 520 480
           L 600 440
           L 660 400
           L 720 380
           L 760 360
           L 800 340
           L 820 330
           L 850 335
           L 880 360
           L 920 380
           L 980 410
           L 1040 450
           L 1120 500
           L 1200 560
           L 1280 620
           L 1340 680
           L 1340 780
           L 260 780 Z" fill="url(#rock)" opacity="0.95"/>

  <!-- château ruin notches on the ridge crest -->
  <rect x="790" y="318" width="14" height="26" fill="#5c2a1a"/>
  <rect x="812" y="312" width="10" height="22" fill="#5c2a1a"/>
  <rect x="830" y="320" width="12" height="20" fill="#5c2a1a"/>

  <!-- Provençal mas (hero foreground building) -->
  <g>
    <!-- main body -->
    <rect x="620" y="600" width="240" height="140" fill="url(#mas)"/>
    <!-- roof -->
    <polygon points="600,600 880,600 840,560 640,560" fill="url(#roof)"/>
    <!-- annex -->
    <rect x="840" y="640" width="120" height="100" fill="url(#mas)" opacity="0.95"/>
    <polygon points="830,640 970,640 950,615 850,615" fill="url(#roof)" opacity="0.9"/>
    <!-- windows / door (small dark rects, no letters) -->
    <rect x="660" y="650" width="22" height="34" fill="#5c2a1a"/>
    <rect x="710" y="650" width="22" height="34" fill="#5c2a1a"/>
    <rect x="760" y="650" width="22" height="34" fill="#5c2a1a"/>
    <rect x="810" y="650" width="22" height="34" fill="#5c2a1a"/>
    <rect x="725" y="700" width="32" height="40" fill="#78350f"/>
    <rect x="870" y="675" width="18" height="28" fill="#5c2a1a"/>
    <rect x="905" y="675" width="18" height="28" fill="#5c2a1a"/>
  </g>

  <!-- cypresses flanking the mas -->
  <ellipse cx="570" cy="640" rx="22" ry="90" fill="#5c2a1a" opacity="0.85"/>
  <ellipse cx="540" cy="660" rx="16" ry="70" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="990" cy="650" rx="20" ry="80" fill="#5c2a1a" opacity="0.85"/>
  <ellipse cx="1020" cy="670" rx="14" ry="60" fill="#5c2a1a" opacity="0.7"/>

  <!-- olive grove ground (foreground sweep) -->
  <path d="M0 780 L 1600 780 L 1600 900 L 0 900 Z" fill="url(#ground)"/>

  <!-- a few olive tree dots in foreground -->
  <circle cx="200" cy="820" r="22" fill="#78350f" opacity="0.55"/>
  <circle cx="340" cy="840" r="18" fill="#78350f" opacity="0.5"/>
  <circle cx="1280" cy="830" r="20" fill="#78350f" opacity="0.55"/>
  <circle cx="1440" cy="845" r="24" fill="#78350f" opacity="0.5"/>
</svg>
