<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cliffFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="cliffNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="mas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.28" r="0.35">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant cliff ridge with clifftop village silhouette (hero, top) -->
  <path d="M 0 520
           L 180 470
           L 340 430
           L 470 380
           L 520 360 L 540 320 L 565 320 L 575 340 L 600 340 L 610 310 L 640 310 L 650 335 L 680 335 L 690 305 L 720 305 L 735 330 L 770 330 L 780 300 L 815 300 L 825 335 L 860 335 L 870 315 L 895 315 L 905 345 L 940 345 L 950 320 L 980 320 L 990 350
           L 1050 380
           L 1240 430
           L 1420 450
           L 1600 470
           L 1600 900 L 0 900 Z"
        fill="url(#cliffFar)"/>

  <!-- near cliff wall with eroded notches (the Val d'Enfer rock face) -->
  <path d="M 0 640
           L 90 600 L 140 615 L 200 580 L 260 600 L 310 565 L 380 590 L 440 555 L 520 585 L 600 560
           L 680 600 L 760 575 L 840 605 L 920 580 L 1010 615 L 1100 590 L 1180 620 L 1270 600 L 1360 625 L 1450 605 L 1540 630 L 1600 615
           L 1600 900 L 0 900 Z"
        fill="url(#cliffNear)" opacity="0.92"/>

  <!-- mas (farmhouse cluster) at the foot of the cliffs -->
  <g opacity="0.95">
    <!-- main long building -->
    <rect x="640" y="700" width="320" height="120" fill="url(#mas)"/>
    <!-- pitched roof -->
    <path d="M 630 700 L 800 645 L 970 700 Z" fill="#78350f"/>
    <!-- left wing, lower -->
    <rect x="540" y="740" width="110" height="80" fill="#d97706" opacity="0.9"/>
    <path d="M 532 740 L 595 712 L 658 740 Z" fill="#5c2a1a"/>
    <!-- right wing, lower -->
    <rect x="950" y="735" width="130" height="85" fill="#d97706" opacity="0.9"/>
    <path d="M 942 735 L 1015 705 L 1088 735 Z" fill="#5c2a1a"/>
    <!-- chimney -->
    <rect x="760" y="660" width="20" height="40" fill="#5c2a1a"/>
    <!-- windows as warm slits -->
    <rect x="680" y="740" width="14" height="28" fill="#fbbf24" opacity="0.85"/>
    <rect x="730" y="740" width="14" height="28" fill="#fbbf24" opacity="0.85"/>
    <rect x="790" y="740" width="14" height="28" fill="#fbbf24" opacity="0.85"/>
    <rect x="850" y="740" width="14" height="28" fill="#fbbf24" opacity="0.85"/>
    <rect x="900" y="740" width="14" height="28" fill="#fbbf24" opacity="0.85"/>
    <rect x="575" y="765" width="12" height="22" fill="#fbbf24" opacity="0.8"/>
    <rect x="610" y="765" width="12" height="22" fill="#fbbf24" opacity="0.8"/>
    <rect x="985" y="760" width="12" height="22" fill="#fbbf24" opacity="0.8"/>
    <rect x="1025" y="760" width="12" height="22" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- cypress accents flanking the mas -->
  <ellipse cx="510" cy="755" rx="14" ry="55" fill="#5c2a1a" opacity="0.7"/>
  <ellipse cx="1110" cy="745" rx="13" ry="60" fill="#5c2a1a" opacity="0.7"/>
</svg>
