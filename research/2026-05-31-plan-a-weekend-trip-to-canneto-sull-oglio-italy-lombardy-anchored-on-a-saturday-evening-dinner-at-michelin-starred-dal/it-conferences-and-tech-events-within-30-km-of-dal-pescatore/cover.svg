<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="pinGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pinBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant horizon band -->
  <rect x="0" y="540" width="1600" height="60" fill="#9a3309" opacity="0.18"/>

  <!-- rolling field -->
  <path d="M0,600 Q400,560 800,600 T1600,600 L1600,900 L0,900 Z" fill="url(#field)"/>

  <!-- faint furrow lines on field (rural texture) -->
  <path d="M0,680 Q400,650 800,680 T1600,680" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.35"/>
  <path d="M0,740 Q400,715 800,740 T1600,740" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M0,810 Q400,790 800,810 T1600,810" stroke="#78350f" stroke-width="1.5" fill="none" opacity="0.25"/>

  <!-- sparse satellite/event dots far in periphery -->
  <circle cx="220" cy="280" r="5" fill="#c2410c" opacity="0.55"/>
  <circle cx="1380" cy="220" r="4" fill="#c2410c" opacity="0.5"/>
  <circle cx="1450" cy="430" r="3" fill="#9a3309" opacity="0.55"/>
  <circle cx="180" cy="470" r="3" fill="#9a3309" opacity="0.5"/>

  <!-- HERO: solitary map pin centered around (800, 430), well inside safe zone -->
  <!-- glow halo -->
  <circle cx="800" cy="430" r="240" fill="url(#pinGlow)"/>

  <!-- concentric "search radius" rings -->
  <circle cx="800" cy="430" r="200" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35" stroke-dasharray="6 10"/>
  <circle cx="800" cy="430" r="140" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45" stroke-dasharray="4 8"/>

  <!-- pin body: teardrop -->
  <path d="M800,260 C870,260 920,310 920,380 C920,455 800,610 800,610 C800,610 680,455 680,380 C680,310 730,260 800,260 Z"
        fill="url(#pinBody)" opacity="0.95"/>

  <!-- pin inner hole -->
  <circle cx="800" cy="380" r="42" fill="#faf8f2" opacity="0.95"/>
  <circle cx="800" cy="380" r="24" fill="#d97706" opacity="0.85"/>

  <!-- pin shadow on field -->
  <ellipse cx="800" cy="630" rx="60" ry="10" fill="#1a0e0e" opacity="0.25"/>
</svg>
