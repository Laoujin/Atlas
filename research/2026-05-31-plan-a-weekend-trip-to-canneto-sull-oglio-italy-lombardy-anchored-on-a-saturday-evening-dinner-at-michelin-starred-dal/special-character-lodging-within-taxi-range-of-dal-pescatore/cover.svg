<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm moon/sun glow behind hero -->
  <circle cx="800" cy="430" r="520" fill="url(#moonglow)"/>

  <!-- Distant low hills (decoration, partly outside safe zone) -->
  <path d="M0,640 Q300,580 600,615 T1200,600 T1600,625 L1600,900 L0,900 Z" fill="url(#hill)" opacity="0.7"/>
  <path d="M0,700 Q400,660 800,685 T1600,690 L1600,900 L0,900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- HERO: Po-valley farmhouse silhouette, centered ~ (800, 450) -->
  <!-- Main house body -->
  <rect x="560" y="470" width="420" height="280" fill="url(#house)" opacity="0.95"/>
  <!-- Pitched roof -->
  <polygon points="540,475 770,330 1000,475" fill="url(#roof)" opacity="0.95"/>
  <!-- Roof underline (terracotta tile shadow) -->
  <rect x="540" y="468" width="460" height="14" fill="#9a3309" opacity="0.9"/>

  <!-- Annex / smaller wing on the right -->
  <rect x="980" y="560" width="200" height="190" fill="#5c2a1a" opacity="0.92"/>
  <polygon points="970,565 1080,475 1190,565" fill="#9a3309" opacity="0.9"/>

  <!-- Chimney -->
  <rect x="700" y="360" width="34" height="70" fill="#3a1a08"/>

  <!-- Glowing windows -->
  <circle cx="660" cy="610" r="55" fill="url(#windowglow)"/>
  <rect x="640" y="590" width="40" height="48" fill="#fbbf24" opacity="0.9"/>
  <circle cx="880" cy="610" r="55" fill="url(#windowglow)"/>
  <rect x="860" y="590" width="40" height="48" fill="#fbbf24" opacity="0.85"/>
  <circle cx="1080" cy="660" r="40" fill="url(#windowglow)"/>
  <rect x="1066" y="648" width="28" height="34" fill="#fbbf24" opacity="0.8"/>

  <!-- Door -->
  <rect x="760" y="660" width="50" height="90" fill="#1a0e0e" opacity="0.95"/>
  <rect x="762" y="662" width="46" height="86" fill="#d97706" opacity="0.25"/>

  <!-- Cypress tree to the left (Italian countryside signature) -->
  <ellipse cx="450" cy="560" rx="32" ry="180" fill="#1a0e0e" opacity="0.9"/>
  <ellipse cx="450" cy="540" rx="26" ry="170" fill="#3a1a08" opacity="0.85"/>

  <!-- Second smaller cypress -->
  <ellipse cx="1280" cy="640" rx="22" ry="120" fill="#1a0e0e" opacity="0.85"/>

  <!-- Foreground ground line -->
  <rect x="0" y="745" width="1600" height="155" fill="#1a0e0e" opacity="0.85"/>

  <!-- A few faint stars near top corners (decoration, gets cropped variably) -->
  <circle cx="180" cy="120" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="280" cy="80" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1380" cy="110" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1480" cy="160" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1240" cy="60" r="1.5" fill="#fbbf24" opacity="0.6"/>
</svg>
