<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centered on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: stacked conference badge / slide cards -->

  <!-- Card shadow 3 (bottom of stack) -->
  <rect x="455" y="310" width="700" height="420" rx="18"
        fill="#78350f" opacity="0.55"
        transform="rotate(-9 800 520)"/>

  <!-- Card 2 -->
  <rect x="440" y="295" width="700" height="420" rx="18"
        fill="url(#card1)" opacity="0.72"
        transform="rotate(-4 800 505)"/>

  <!-- Hero card (top of stack) — bounding box fits well within safe zone -->
  <rect x="430" y="285" width="740" height="430" rx="20"
        fill="url(#hero)" opacity="0.92"/>

  <!-- Badge lanyard hole at top of hero card -->
  <rect x="776" y="268" width="48" height="28" rx="8"
        fill="#fbbf24" opacity="0.85"/>
  <rect x="790" y="256" width="20" height="20" rx="10"
        fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.8"/>

  <!-- Decorative content bars inside hero card (evoke a schedule/agenda) -->
  <rect x="490" y="370" width="380" height="18" rx="5"
        fill="#fef3ec" opacity="0.30"/>
  <rect x="490" y="408" width="280" height="18" rx="5"
        fill="#fef3ec" opacity="0.22"/>
  <rect x="490" y="446" width="320" height="18" rx="5"
        fill="#fef3ec" opacity="0.22"/>
  <rect x="490" y="484" width="200" height="18" rx="5"
        fill="#fef3ec" opacity="0.18"/>

  <!-- Accent dot cluster — event "badge" pin aesthetic -->
  <circle cx="910" cy="390" r="28" fill="#fbbf24" opacity="0.80"/>
  <circle cx="910" cy="390" r="16" fill="#78350f" opacity="0.90"/>

  <!-- Layer 3: decorative edges (outside safe zone, atmospheric) -->
  <rect x="0" y="0" width="120" height="900"
        fill="#9a3309" opacity="0.08"/>
  <rect x="1480" y="0" width="120" height="900"
        fill="#9a3309" opacity="0.08"/>
  <circle cx="80" cy="820" r="180" fill="#c2410c" opacity="0.06"/>
  <circle cx="1520" cy="80" r="160" fill="#d97706" opacity="0.07"/>
</svg>
