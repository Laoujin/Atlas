<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient: warm ivory -->
    <radialGradient id="plate1g" cx="44%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#d4a882"/>
    </radialGradient>
    <!-- Inner plate / food well -->
    <radialGradient id="wellg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Sauce dot accent -->
    <radialGradient id="sauceg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Wine glass fill -->
    <linearGradient id="glassg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
    <!-- River arc gradient -->
    <linearGradient id="riverg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e4a6e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1a6a9a" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#1a6a9a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0e4a6e" stop-opacity="0"/>
    </linearGradient>
    <!-- Stars glow -->
    <radialGradient id="starg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Warm central glow -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Hero — plate + wine glass composition, centred at (800, 450) -->

  <!-- Main dinner plate (large circle) -->
  <circle cx="800" cy="460" r="238" fill="url(#plate1g)" opacity="0.93"/>
  <!-- Plate rim shadow ring -->
  <circle cx="800" cy="460" r="238" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.28"/>
  <!-- Inner food well -->
  <circle cx="800" cy="460" r="188" fill="url(#wellg)" opacity="0.85"/>

  <!-- Sauce arc on plate (decorative brushstroke) -->
  <path d="M 670 430 Q 790 360 920 430" fill="none" stroke="#c2410c" stroke-width="9" stroke-linecap="round" opacity="0.60"/>
  <!-- Sauce dots -->
  <circle cx="668" cy="432" r="10" fill="url(#sauceg)" opacity="0.82"/>
  <circle cx="920" cy="432" r="8"  fill="url(#sauceg)" opacity="0.72"/>
  <circle cx="795" cy="368" r="6"  fill="url(#sauceg)" opacity="0.65"/>

  <!-- Herb garnish (two leaf strokes) -->
  <ellipse cx="800" cy="415" rx="18" ry="7" fill="#78350f" opacity="0.50" transform="rotate(-35 800 415)"/>
  <ellipse cx="816" cy="408" rx="16" ry="6" fill="#9a3309" opacity="0.42" transform="rotate(-20 816 408)"/>

  <!-- Wine glass — centred at x=800, stem base at y≈650, bowl top at y≈270 -->
  <!-- Bowl (rounded trapezoid via path) -->
  <path d="M 740 290 Q 730 400 764 430 Q 800 445 836 430 Q 870 400 860 290 Q 830 260 800 258 Q 770 260 740 290 Z"
        fill="url(#glassg)" opacity="0.78"/>
  <!-- Wine level inside glass -->
  <path d="M 748 370 Q 770 390 800 392 Q 830 390 852 370 Q 848 345 800 342 Q 752 345 748 370 Z"
        fill="#be185d" opacity="0.55"/>
  <!-- Glass stem -->
  <rect x="795" y="430" width="10" height="155" rx="4" fill="#fef3ec" opacity="0.30"/>
  <!-- Glass base -->
  <ellipse cx="800" cy="588" rx="54" ry="11" fill="#fef3ec" opacity="0.25"/>
  <!-- Glass highlight -->
  <path d="M 752 310 Q 748 360 760 390" fill="none" stroke="#fef3ec" stroke-width="5" stroke-linecap="round" opacity="0.28"/>

  <!-- Michelin star accents (3 small stars above the plate) -->
  <!-- Star 1 -->
  <circle cx="740" cy="218" r="18" fill="url(#starg)" opacity="0.82"/>
  <!-- Star 2 -->
  <circle cx="800" cy="205" r="22" fill="url(#starg)" opacity="0.90"/>
  <!-- Star 3 -->
  <circle cx="860" cy="218" r="18" fill="url(#starg)" opacity="0.82"/>
  <!-- Subtle ring around each star -->
  <circle cx="740" cy="218" r="26" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.30"/>
  <circle cx="800" cy="205" r="32" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.30"/>
  <circle cx="860" cy="218" r="26" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.30"/>

  <!-- Layer 3: Decorative — Rhône river arc at base (clips on card, fine) -->
  <path d="M 0 820 Q 400 760 800 800 Q 1200 840 1600 780" fill="none" stroke="url(#riverg)" stroke-width="28" opacity="0.55"/>
  <path d="M 0 848 Q 400 788 800 828 Q 1200 868 1600 808" fill="none" stroke="url(#riverg)" stroke-width="14" opacity="0.30"/>

  <!-- Corner vignette -->
  <rect width="1600" height="900" fill="#1a0e0e" opacity="0.22"
        style="mask:url(none)"
        rx="0"/>
  <!-- Simulate vignette via 4 edge gradients would need filter; instead use a simple overlay ellipse -->
  <ellipse cx="800" cy="450" rx="1100" ry="640" fill="none" stroke="#1a0e0e" stroke-width="180" opacity="0.45"/>
</svg>
