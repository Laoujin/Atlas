<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed nocturnal background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm table-glow radial -->
    <radialGradient id="tableGlow" cx="50%" cy="52%" r="42%">
      <stop offset="0%"  stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate fill gradient — off-white/cream with warm shadow rim -->
    <radialGradient id="plateFill" cx="42%" cy="38%" r="58%">
      <stop offset="0%"  stop-color="#fef3ec" stop-opacity="0.96"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.60"/>
    </radialGradient>

    <!-- Plate rim gradient for the second plate -->
    <radialGradient id="plateFill2" cx="55%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#faf8f2" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#f0eadb" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.50"/>
    </radialGradient>

    <!-- Wine in glass -->
    <linearGradient id="wineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#9a3309" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.70"/>
    </linearGradient>

    <!-- Sauce/garnish dot radial -->
    <radialGradient id="sauceDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Ambient table warm glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Subtle vignette edge darkening -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%"  stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Layer 2: Hero element — two overlapping fine-dining plates, centered ~(800,450) -->

  <!-- Back plate (slightly left and down, partially behind) -->
  <ellipse cx="720" cy="470" rx="210" ry="26" fill="#78350f" opacity="0.45"/>
  <circle  cx="720" cy="455" r="215" fill="url(#plateFill2)" opacity="0.82"/>
  <!-- Rim ring of back plate -->
  <circle  cx="720" cy="455" r="215" fill="none" stroke="#d97706" stroke-width="6" opacity="0.40"/>
  <circle  cx="720" cy="455" r="192" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.30"/>

  <!-- Front plate (slightly right and up, in front) -->
  <ellipse cx="875" cy="455" rx="218" ry="27" fill="#78350f" opacity="0.40"/>
  <circle  cx="875" cy="438" r="222" fill="url(#plateFill)" opacity="0.90"/>
  <!-- Rim ring of front plate -->
  <circle  cx="875" cy="438" r="222" fill="none" stroke="#fbbf24" stroke-width="7" opacity="0.50"/>
  <circle  cx="875" cy="438" r="198" fill="none" stroke="#d97706" stroke-width="2" opacity="0.35"/>

  <!-- Sauce dots on front plate — fine-dining plating arc -->
  <circle cx="830" cy="400" r="10" fill="url(#sauceDot)" opacity="0.85"/>
  <circle cx="870" cy="388" r="7"  fill="url(#sauceDot)" opacity="0.75"/>
  <circle cx="912" cy="395" r="9"  fill="url(#sauceDot)" opacity="0.80"/>
  <circle cx="940" cy="418" r="6"  fill="#c2410c" opacity="0.60"/>

  <!-- Wine glass silhouette — accent shape, centered right of plates -->
  <!-- Bowl (ellipse top) -->
  <ellipse cx="1110" cy="390" rx="52" ry="68" fill="url(#wineGrad)" opacity="0.72"/>
  <!-- Wine level inside bowl -->
  <ellipse cx="1110" cy="430" rx="46" ry="28" fill="#9a3309" opacity="0.55"/>
  <!-- Stem -->
  <rect    x="1106" y="456" width="8" height="110" rx="4" fill="#78350f" opacity="0.80"/>
  <!-- Base -->
  <ellipse cx="1110" cy="570" rx="40" ry="8"  fill="#5c2a1a" opacity="0.75"/>
  <!-- Glass bowl outline — thin highlight -->
  <ellipse cx="1110" cy="390" rx="52" ry="68" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.35"/>

  <!-- Layer 3: Decorative edge details (outside safe zone, atmospheric only) -->

  <!-- Bottom-left corner faint warm arc -->
  <path d="M 0 900 Q 220 700 400 820" fill="none" stroke="#c2410c" stroke-width="60" stroke-linecap="round" opacity="0.08"/>

  <!-- Top-right faint arc -->
  <path d="M 1600 0 Q 1380 180 1220 80" fill="none" stroke="#9a3309" stroke-width="50" stroke-linecap="round" opacity="0.10"/>

  <!-- Subtle horizontal linen-table suggestion line under plates -->
  <line x1="0" y1="690" x2="1600" y2="690" stroke="#d97706" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="695" x2="1600" y2="695" stroke="#d97706" stroke-width="1" opacity="0.07"/>
</svg>
