<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night-sky background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0806"/>
      <stop offset="55%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm glow behind arch -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Arch fill gradient -->
    <linearGradient id="archFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Badge card gradient -->
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: Warm radial glow centred on hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle horizon band at bottom (atmospheric depth) -->
  <rect x="0" y="760" width="1600" height="140" fill="#d97706" opacity="0.06"/>

  <!-- Layer 2: Hero — Gothic pointed arch, centred at (800, 450), safe zone x:125–1475 y:90–810 -->
  <!-- Arch outline: outer pointed arch shape via path -->
  <!-- Outer arch: two quarter-circles meeting at a point, spans x:540–1060, y:165–790 -->
  <path d="
    M 540 790
    L 540 490
    Q 540 165 800 165
    Q 1060 165 1060 490
    L 1060 790
    Z
  " fill="url(#archFill)" opacity="0.85"/>

  <!-- Inner arch cutout (the void inside the arch, slightly inset) -->
  <path d="
    M 590 790
    L 590 500
    Q 590 225 800 225
    Q 1010 225 1010 500
    L 1010 790
    Z
  " fill="#0f0806" opacity="0.78"/>

  <!-- Second smaller pointed arch nested inside — inner glow -->
  <path d="
    M 630 790
    L 630 512
    Q 630 272 800 272
    Q 970 272 970 512
    L 970 790
    Z
  " fill="#d97706" opacity="0.09"/>

  <!-- Keystone accent at arch apex -->
  <polygon points="800,155 830,205 800,195 770,205" fill="#fbbf24" opacity="0.80"/>

  <!-- Layer 2: Conference badge cards — stacked, angled, overlapping the arch base -->
  <!-- Card 3 (back, leftmost) -->
  <rect x="555" y="590" width="320" height="195" rx="10"
        fill="url(#card3)" opacity="0.72"
        transform="rotate(-7 715 687)"/>

  <!-- Card 2 (middle) -->
  <rect x="605" y="575" width="320" height="195" rx="10"
        fill="url(#card1)" opacity="0.82"
        transform="rotate(-2 765 672)"/>

  <!-- Card 1 (front, rightmost) -->
  <rect x="660" y="560" width="320" height="195" rx="10"
        fill="url(#card2)" opacity="0.90"
        transform="rotate(4 820 657)"/>

  <!-- Lanyard clip suggestion on front card (two small rectangles) -->
  <rect x="802" y="548" width="18" height="28" rx="4"
        fill="#fbbf24" opacity="0.85"
        transform="rotate(4 811 562)"/>
  <rect x="806" y="534" width="10" height="18" rx="3"
        fill="#78350f" opacity="0.90"
        transform="rotate(4 811 543)"/>

  <!-- Accent: three horizontal "agenda line" bars on front card (abstract, not text) -->
  <rect x="676" y="600" width="200" height="8" rx="4" fill="#fbbf24" opacity="0.35"
        transform="rotate(4 776 604)"/>
  <rect x="676" y="622" width="160" height="8" rx="4" fill="#fbbf24" opacity="0.22"
        transform="rotate(4 756 626)"/>
  <rect x="676" y="644" width="120" height="8" rx="4" fill="#fbbf24" opacity="0.15"
        transform="rotate(4 736 648)"/>

  <!-- Layer 3: Decorative edges (outside safe zone — purely atmospheric) -->
  <!-- Top edge warm shimmer line -->
  <rect x="0" y="0" width="1600" height="3" fill="#d97706" opacity="0.40"/>
  <!-- Bottom edge warm shimmer line -->
  <rect x="0" y="897" width="1600" height="3" fill="#c2410c" opacity="0.35"/>
  <!-- Left/right corner fades -->
  <rect x="0" y="0" width="120" height="900" fill="#0f0806" opacity="0.35"/>
  <rect x="1480" y="0" width="120" height="900" fill="#0f0806" opacity="0.35"/>
</svg>
