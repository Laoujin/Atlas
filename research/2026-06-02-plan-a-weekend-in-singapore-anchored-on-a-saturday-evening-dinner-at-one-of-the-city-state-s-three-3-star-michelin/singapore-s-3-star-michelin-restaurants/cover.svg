<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1008"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table glow -->
    <radialGradient id="tableGlow" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Left plate glow -->
    <radialGradient id="plateGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#f0eadb" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.15"/>
    </radialGradient>
    <!-- Right plate glow -->
    <radialGradient id="plateGlowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#f0eadb" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.10"/>
    </radialGradient>
    <!-- Cloche dome gradient -->
    <linearGradient id="clocheGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.90"/>
    </linearGradient>
    <!-- Rim ring gradient -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.30"/>
    </radialGradient>
    <!-- Rose accent glow (secondary hue) -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Three stars glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric table glow wash -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Rose ambient halo (secondary hue, restrained) -->
  <ellipse cx="800" cy="580" rx="520" ry="300" fill="url(#roseGlow)" opacity="0.7"/>

  <!-- Layer 2: Hero element — two plates with cloche, centred ~(800,450) -->

  <!-- Table surface ellipse suggestion -->
  <ellipse cx="800" cy="660" rx="560" ry="90" fill="#2d1008" opacity="0.70"/>
  <ellipse cx="800" cy="655" rx="550" ry="78" fill="#9a3309" opacity="0.18"/>

  <!-- Left plate -->
  <ellipse cx="590" cy="530" rx="195" ry="195" fill="url(#rimGrad)"/>
  <ellipse cx="590" cy="530" rx="170" ry="170" fill="url(#plateGlowL)" opacity="0.95"/>
  <!-- Left plate inner ring detail -->
  <ellipse cx="590" cy="530" rx="148" ry="148" fill="none" stroke="#d97706" stroke-width="2" opacity="0.40"/>
  <!-- Left plate food accent — small warm oval -->
  <ellipse cx="590" cy="518" rx="52" ry="38" fill="#c2410c" opacity="0.55"/>
  <ellipse cx="578" cy="512" rx="22" ry="16" fill="#fbbf24" opacity="0.50"/>
  <!-- Left plate sauce swoosh -->
  <path d="M 530 545 Q 575 525 630 548" stroke="#be185d" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- Right plate -->
  <ellipse cx="1010" cy="530" rx="195" ry="195" fill="url(#rimGrad)"/>
  <ellipse cx="1010" cy="530" rx="170" ry="170" fill="url(#plateGlowR)" opacity="0.92"/>
  <!-- Right plate inner ring detail -->
  <ellipse cx="1010" cy="530" rx="148" ry="148" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.38"/>
  <!-- Right plate food accent -->
  <ellipse cx="1010" cy="516" rx="48" ry="35" fill="#9a3309" opacity="0.60"/>
  <ellipse cx="1022" cy="510" rx="20" ry="14" fill="#d97706" opacity="0.55"/>
  <!-- Right plate sauce swoosh -->
  <path d="M 958 542 Q 1002 520 1058 544" stroke="#be185d" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.50"/>

  <!-- Centre cloche (hero focal point) -->
  <!-- Cloche base shadow -->
  <ellipse cx="800" cy="598" rx="148" ry="28" fill="#1a0e0e" opacity="0.60"/>
  <!-- Cloche dome -->
  <path d="M 648 598 Q 648 360 800 342 Q 952 360 952 598 Z" fill="url(#clocheGrad)" opacity="0.88"/>
  <!-- Cloche dome highlight -->
  <path d="M 710 480 Q 730 392 800 370 Q 760 395 745 480 Z" fill="#fbbf24" opacity="0.18"/>
  <!-- Cloche base rim -->
  <rect x="640" y="590" width="320" height="18" rx="9" fill="#78350f" opacity="0.90"/>
  <rect x="640" y="590" width="320" height="6" rx="3" fill="#fbbf24" opacity="0.35"/>
  <!-- Cloche handle knob -->
  <ellipse cx="800" cy="346" rx="22" ry="14" fill="#d97706" opacity="0.90"/>
  <ellipse cx="800" cy="342" rx="14" ry="9" fill="#fbbf24" opacity="0.70"/>

  <!-- Three Michelin stars — abstract diamond shapes above cloche -->
  <!-- Star 1 (left) -->
  <g transform="translate(725, 268)">
    <circle cx="0" cy="0" r="18" fill="url(#starGlow)" opacity="0.80"/>
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fbbf24" opacity="0.95"/>
  </g>
  <!-- Star 2 (centre) -->
  <g transform="translate(800, 252)">
    <circle cx="0" cy="0" r="22" fill="url(#starGlow)" opacity="0.90"/>
    <polygon points="0,-14 3.5,-3.5 14,0 3.5,3.5 0,14 -3.5,3.5 -14,0 -3.5,-3.5" fill="#fbbf24" opacity="1.0"/>
  </g>
  <!-- Star 3 (right) -->
  <g transform="translate(875, 268)">
    <circle cx="0" cy="0" r="18" fill="url(#starGlow)" opacity="0.80"/>
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fbbf24" opacity="0.95"/>
  </g>

  <!-- Layer 3: Edge decoration (outside safe zone, atmospheric) -->
  <!-- Top-left vignette accent -->
  <ellipse cx="0" cy="0" rx="320" ry="220" fill="#be185d" opacity="0.06"/>
  <!-- Bottom-right vignette accent -->
  <ellipse cx="1600" cy="900" rx="380" ry="260" fill="#c2410c" opacity="0.09"/>
  <!-- Full vignette overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
