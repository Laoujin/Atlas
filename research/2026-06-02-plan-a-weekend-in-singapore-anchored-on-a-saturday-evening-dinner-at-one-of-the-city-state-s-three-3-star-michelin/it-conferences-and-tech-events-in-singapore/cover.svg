<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d1a0a"/>
      <stop offset="60%" stop-color="#1e0e08"/>
      <stop offset="100%" stop-color="#0d0606"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow around hub -->
  <ellipse cx="800" cy="450" rx="420" ry="320" fill="url(#hubGlow)" opacity="0.7"/>

  <!-- Layer 2: Hero element — orbital network centred at (800, 450) -->

  <!-- Outer orbital ring — tilted ellipse -->
  <ellipse cx="800" cy="450" rx="520" ry="200" fill="none"
           stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.35"
           transform="rotate(-18 800 450)"/>

  <!-- Mid orbital ring -->
  <ellipse cx="800" cy="450" rx="350" ry="140" fill="none"
           stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.4"
           transform="rotate(12 800 450)"/>

  <!-- Inner orbital ring -->
  <ellipse cx="800" cy="450" rx="200" ry="80" fill="none"
           stroke="#d97706" stroke-width="1" stroke-opacity="0.35"
           transform="rotate(-6 800 450)"/>

  <!-- Connector spokes: hub to outer nodes -->
  <line x1="800" y1="450" x2="390" y2="295" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="1210" y2="295" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="340" y2="580" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="1260" y2="580" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="690" y2="245" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="800" y1="450" x2="910" y2="655" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Cross-node connectors (conference networking) -->
  <line x1="390" y1="295" x2="690" y2="245" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1210" y1="295" x2="910" y2="655" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="340" y1="580" x2="910" y2="655" stroke="#c2410c" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1260" y1="580" x2="1210" y2="295" stroke="#c2410c" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Outer nodes (violet) -->
  <circle cx="390" cy="295" r="26" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="390" cy="295" r="38" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.4"/>

  <circle cx="1210" cy="295" r="26" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="1210" cy="295" r="38" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.4"/>

  <circle cx="340" cy="580" r="22" fill="url(#nodeViolet)" opacity="0.75"/>
  <circle cx="340" cy="580" r="32" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>

  <circle cx="1260" cy="580" r="22" fill="url(#nodeViolet)" opacity="0.75"/>
  <circle cx="1260" cy="580" r="32" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Mid nodes (rust) -->
  <circle cx="690" cy="245" r="18" fill="url(#nodeRust)" opacity="0.9"/>
  <circle cx="690" cy="245" r="28" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.45"/>

  <circle cx="910" cy="655" r="18" fill="url(#nodeRust)" opacity="0.9"/>
  <circle cx="910" cy="655" r="28" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="72" fill="url(#hubFill)" opacity="0.95"/>
  <circle cx="800" cy="450" r="90" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="800" cy="450" r="108" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <circle cx="0" cy="0" r="180" fill="none" stroke="#6d28d9" stroke-width="60" stroke-opacity="0.06"/>
  <circle cx="1600" cy="900" r="180" fill="none" stroke="#6d28d9" stroke-width="60" stroke-opacity="0.06"/>
</svg>
