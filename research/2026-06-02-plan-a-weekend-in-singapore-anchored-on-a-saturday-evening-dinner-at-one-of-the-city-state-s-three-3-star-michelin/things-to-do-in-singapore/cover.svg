<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="1050" cy="540" r="320" fill="url(#sun)"/>
  <circle cx="1050" cy="540" r="70" fill="#fbbf24" opacity="0.9"/>

  <!-- Distant skyline (left, faint) -->
  <g fill="#1a0e0e" opacity="0.55">
    <rect x="180" y="540" width="40" height="160"/>
    <rect x="230" y="500" width="30" height="200"/>
    <rect x="270" y="560" width="50" height="140"/>
    <rect x="330" y="520" width="35" height="180"/>
    <rect x="375" y="555" width="45" height="145"/>
  </g>

  <!-- Supertree silhouette (left of hero) -->
  <g fill="#1a0e0e" opacity="0.88">
    <rect x="430" y="430" width="14" height="270"/>
    <path d="M 437 430 Q 380 410 360 360 Q 395 380 425 395 Q 405 350 410 310 Q 430 345 440 380 Q 455 340 480 315 Q 478 360 460 395 Q 490 380 520 365 Q 500 410 437 430 Z"/>
  </g>

  <!-- HERO: Marina Bay Sands — three towers + boat-deck (centered ~800,450) -->
  <g>
    <!-- Tower 1 -->
    <path d="M 600 700 L 615 380 L 650 380 L 665 700 Z" fill="url(#tower)"/>
    <!-- Tower 2 -->
    <path d="M 760 700 L 775 360 L 810 360 L 825 700 Z" fill="url(#tower)"/>
    <!-- Tower 3 -->
    <path d="M 920 700 L 935 380 L 970 380 L 985 700 Z" fill="url(#tower)"/>
    <!-- Sky boat-deck spanning all three -->
    <path d="M 580 360 L 1010 320 L 1015 345 L 585 385 Z" fill="#9a3309"/>
    <path d="M 1010 320 L 1050 305 L 1055 330 L 1015 345 Z" fill="#c2410c"/>
    <!-- Deck top edge highlight -->
    <path d="M 580 360 L 1050 305 L 1055 312 L 583 367 Z" fill="#d97706" opacity="0.75"/>
    <!-- Window slits on towers -->
    <g fill="#fbbf24" opacity="0.55">
      <rect x="622" y="430" width="2" height="240"/>
      <rect x="640" y="430" width="2" height="240"/>
      <rect x="782" y="410" width="2" height="260"/>
      <rect x="800" y="410" width="2" height="260"/>
      <rect x="942" y="430" width="2" height="240"/>
      <rect x="960" y="430" width="2" height="240"/>
    </g>
  </g>

  <!-- Ferris wheel (right of hero, partly cropped on card — decoration) -->
  <g stroke="#1a0e0e" stroke-width="2.5" fill="none" opacity="0.8">
    <circle cx="1340" cy="500" r="110"/>
    <circle cx="1340" cy="500" r="6" fill="#1a0e0e"/>
    <line x1="1340" y1="390" x2="1340" y2="610"/>
    <line x1="1230" y1="500" x2="1450" y2="500"/>
    <line x1="1262" y1="422" x2="1418" y2="578"/>
    <line x1="1262" y1="578" x2="1418" y2="422"/>
    <line x1="1340" y1="610" x2="1310" y2="780"/>
    <line x1="1340" y1="610" x2="1370" y2="780"/>
  </g>

  <!-- Water reflection -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#water)"/>
  <g fill="#d97706" opacity="0.35">
    <rect x="615" y="710" width="50" height="120"/>
    <rect x="775" y="710" width="50" height="140"/>
    <rect x="935" y="710" width="50" height="120"/>
  </g>
  <g stroke="#fbbf24" stroke-width="1" opacity="0.4">
    <line x1="500" y1="730" x2="1100" y2="730"/>
    <line x1="450" y1="760" x2="1150" y2="760"/>
    <line x1="520" y1="790" x2="1080" y2="790"/>
    <line x1="480" y1="820" x2="1120" y2="820"/>
  </g>
</svg>
