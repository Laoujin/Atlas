<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- full-bleed gradient background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- sun glow -->
  <circle cx="800" cy="300" r="150" fill="url(#sun)" opacity="0.8"/>

  <!-- hero: kayak hull + paddle -->
  <g opacity="0.92">
    <!-- paddle -->
    <g fill="#78350f" opacity="0.85">
      <rect x="792" y="240" width="16" height="420" rx="8" transform="rotate(28 800 450)"/>
      <ellipse cx="690" cy="320" rx="38" ry="74" transform="rotate(28 690 320)"/>
      <ellipse cx="910" cy="580" rx="38" ry="74" transform="rotate(28 910 580)"/>
    </g>
    <!-- kayak hull -->
    <path d="M360 470 Q800 380 1240 470 Q800 560 360 470 Z" fill="url(#hull)"/>
    <path d="M360 470 Q800 380 1240 470" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- layered water ripples -->
  <g fill="none" stroke="#9a3309" stroke-width="9" opacity="0.6">
    <path d="M120 620 Q400 580 700 620 T1480 620"/>
    <path d="M120 700 Q420 660 720 700 T1480 700" stroke="#78350f"/>
    <path d="M120 780 Q400 740 700 780 T1480 780" stroke="#c2410c"/>
  </g>
</svg>
