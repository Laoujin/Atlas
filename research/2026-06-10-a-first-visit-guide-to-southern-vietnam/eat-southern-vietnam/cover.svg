<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="55%" stop-color="#451a05"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bowl" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="broth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm radial glow behind hero -->
  <circle cx="800" cy="450" r="430" fill="url(#glow)"/>

  <!-- layer 2: hero — two round bowl forms -->
  <!-- back bowl -->
  <circle cx="630" cy="470" r="200" fill="url(#bowl)" opacity="0.85"/>
  <circle cx="630" cy="470" r="150" fill="#451a05" opacity="0.7"/>
  <ellipse cx="630" cy="455" rx="140" ry="120" fill="url(#broth)" opacity="0.9"/>

  <!-- front bowl (hero) -->
  <circle cx="940" cy="430" r="245" fill="url(#bowl)" opacity="0.92"/>
  <circle cx="940" cy="430" r="186" fill="#3a1505" opacity="0.75"/>
  <ellipse cx="940" cy="412" rx="174" ry="150" fill="url(#broth)" opacity="0.92"/>
  <ellipse cx="895" cy="375" rx="48" ry="30" fill="#fde68a" opacity="0.55"/>

  <!-- rose accent ring, restrained -->
  <circle cx="940" cy="430" r="245" fill="none" stroke="#be185d" stroke-width="6" opacity="0.6"/>

  <!-- layer 3: silhouette accents — chopsticks + steam -->
  <g opacity="0.85">
    <rect x="930" y="120" width="14" height="320" rx="6" fill="#1c0a02" transform="rotate(11 937 280)"/>
    <rect x="978" y="120" width="14" height="320" rx="6" fill="#1c0a02" transform="rotate(18 985 280)"/>
  </g>
  <g fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round" opacity="0.6">
    <path d="M900 360 C880 320 920 295 900 255 C885 222 915 198 900 165"/>
    <path d="M978 360 C998 322 962 296 982 258 C997 226 968 200 984 168"/>
  </g>
</svg>
