<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- bg -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- water -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#water)" opacity="0.9"/>

  <!-- hero: stilted river-pavilion silhouette with glowing window -->
  <g opacity="0.92">
    <!-- roof -->
    <path d="M620 360 L800 250 L980 360 L940 360 L800 300 L660 360 Z" fill="#9a3309"/>
    <path d="M660 360 L800 295 L940 360 L900 380 L800 330 L700 380 Z" fill="#78350f" opacity="0.9"/>
    <!-- pavilion body -->
    <rect x="690" y="360" width="220" height="220" fill="#5c2a1a"/>
    <!-- stilts -->
    <rect x="715" y="580" width="22" height="100" fill="#78350f"/>
    <rect x="863" y="580" width="22" height="100" fill="#78350f"/>
    <!-- glowing window hero form -->
    <rect x="755" y="410" width="90" height="120" rx="6" fill="url(#glow)"/>
    <circle cx="800" cy="470" r="120" fill="url(#glow)" opacity="0.28"/>
  </g>

  <!-- water reflection of glow -->
  <ellipse cx="800" cy="690" rx="110" ry="34" fill="#d97706" opacity="0.35"/>
  <ellipse cx="800" cy="730" rx="70" ry="18" fill="#fbbf24" opacity="0.22"/>

  <!-- edge decoration: hanging lanterns -->
  <g opacity="0.8">
    <line x1="180" y1="90" x2="180" y2="200" stroke="#78350f" stroke-width="4"/>
    <circle cx="180" cy="220" r="26" fill="url(#glow)"/>
    <line x1="1420" y1="90" x2="1420" y2="170" stroke="#78350f" stroke-width="4"/>
    <circle cx="1420" cy="190" r="22" fill="url(#glow)"/>
  </g>
</svg>
