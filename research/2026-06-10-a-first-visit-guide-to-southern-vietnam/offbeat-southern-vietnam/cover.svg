<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="52%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="42%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="ped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- bg -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- spotlight glow -->
  <ellipse cx="800" cy="400" rx="520" ry="460" fill="url(#spot)"/>

  <!-- hero: off-kilter pedestal + lone orb under spotlight -->
  <g opacity="0.94">
    <!-- pedestal, slightly tilted -->
    <polygon points="690,760 910,760 870,560 730,560" fill="url(#ped)" opacity="0.9" transform="rotate(-3 800 660)"/>
    <ellipse cx="800" cy="560" rx="78" ry="20" fill="#c2410c" opacity="0.85" transform="rotate(-3 800 560)"/>
    <!-- the orb / coconut, a touch off-center and tilted -->
    <circle cx="788" cy="430" r="150" fill="url(#orb)"/>
    <ellipse cx="745" cy="385" rx="48" ry="34" fill="#fbbf24" opacity="0.6" transform="rotate(-18 745 385)"/>
  </g>

  <!-- edge decoration: small odd orbiting orbs -->
  <circle cx="210" cy="180" r="26" fill="#d97706" opacity="0.6"/>
  <circle cx="1410" cy="730" r="34" fill="#9a3309" opacity="0.7"/>
  <circle cx="1330" cy="180" r="16" fill="#fbbf24" opacity="0.6"/>
</svg>
