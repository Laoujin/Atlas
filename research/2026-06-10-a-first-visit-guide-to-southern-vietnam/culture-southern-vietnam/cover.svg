<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="45%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- edge decoration: soft ambient halos -->
  <circle cx="250" cy="200" r="190" fill="url(#halo)" opacity="0.7"/>
  <circle cx="1360" cy="240" r="210" fill="url(#halo)" opacity="0.7"/>
  <circle cx="1300" cy="720" r="170" fill="url(#halo)" opacity="0.6"/>

  <!-- hero: glowing paper-lantern orbs -->
  <g opacity="0.92">
    <!-- big central lantern -->
    <circle cx="800" cy="450" r="240" fill="url(#halo)" opacity="0.8"/>
    <path d="M800 250 C700 250 660 340 660 450 C660 560 700 650 800 650 C900 650 940 560 940 450 C940 340 900 250 800 250 Z" fill="url(#glow)" opacity="0.95"/>
    <ellipse cx="800" cy="245" rx="42" ry="16" fill="#78350f" opacity="0.85"/>
    <ellipse cx="800" cy="655" rx="42" ry="16" fill="#78350f" opacity="0.85"/>

    <!-- left lantern -->
    <circle cx="470" cy="500" r="150" fill="url(#halo)" opacity="0.7"/>
    <path d="M470 380 C410 380 388 435 388 500 C388 565 410 620 470 620 C530 620 552 565 552 500 C552 435 530 380 470 380 Z" fill="url(#glow)" opacity="0.9"/>
    <ellipse cx="470" cy="377" rx="26" ry="10" fill="#78350f" opacity="0.8"/>

    <!-- right lantern -->
    <circle cx="1130" cy="500" r="150" fill="url(#halo)" opacity="0.7"/>
    <path d="M1130 380 C1070 380 1048 435 1048 500 C1048 565 1070 620 1130 620 C1190 620 1212 565 1212 500 C1212 435 1190 380 1130 380 Z" fill="url(#glow)" opacity="0.9"/>
    <ellipse cx="1130" cy="377" rx="26" ry="10" fill="#78350f" opacity="0.8"/>
  </g>
</svg>
