<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bg -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="330" r="240" fill="url(#sun)" opacity="0.85"/>

  <!-- hero: tiered pagoda tower -->
  <g fill="url(#tower)" opacity="0.92">
    <!-- spire -->
    <polygon points="800,120 786,210 814,210"/>
    <!-- tier 1 (top) -->
    <polygon points="760,205 840,205 858,250 742,250"/>
    <rect x="772" y="250" width="56" height="70"/>
    <!-- tier 2 -->
    <polygon points="720,315 880,315 905,370 695,370"/>
    <rect x="735" y="370" width="130" height="95"/>
    <!-- tier 3 -->
    <polygon points="675,460 925,460 955,525 645,525"/>
    <rect x="685" y="525" width="230" height="130"/>
    <!-- base -->
    <polygon points="620,650 980,650 1010,720 590,720"/>
    <rect x="640" y="720" width="320" height="100"/>
  </g>

  <!-- side pylon silhouettes -->
  <g fill="#9a3309" opacity="0.65">
    <polygon points="190,820 250,560 270,560 320,820"/>
    <polygon points="1290,820 1340,580 1360,580 1410,820"/>
  </g>
</svg>
