<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="800" cy="360" r="150" fill="#fbbf24" opacity="0.6"/>

  <!-- sea -->
  <path d="M0 600 Q400 565 800 590 T1600 600 V900 H0 Z" fill="url(#sea)" opacity="0.92"/>
  <path d="M0 640 Q500 615 1000 645 T1600 650 V900 H0 Z" fill="#78350f" opacity="0.6"/>

  <!-- catenary line sweeping across -->
  <path d="M125 230 Q800 470 1475 250" fill="none" stroke="#78350f" stroke-width="5" opacity="0.85"/>

  <!-- towers -->
  <path d="M210 250 L200 600 M210 250 L260 600" fill="none" stroke="#9a3309" stroke-width="7" opacity="0.8"/>
  <path d="M1390 270 L1340 600 M1390 270 L1400 600" fill="none" stroke="#9a3309" stroke-width="7" opacity="0.8"/>

  <!-- hero gondola near center -->
  <line x1="800" y1="408" x2="800" y2="460" stroke="#78350f" stroke-width="6" opacity="0.9"/>
  <rect x="730" y="460" width="140" height="92" rx="20" fill="url(#cab)" opacity="0.95"/>
  <rect x="752" y="484" width="96" height="44" rx="10" fill="#78350f" opacity="0.75"/>
  <path d="M724 466 L876 466" stroke="#9a3309" stroke-width="8" opacity="0.9" stroke-linecap="round"/>

  <!-- distant gondolas -->
  <rect x="500" y="395" width="58" height="40" rx="9" fill="#c2410c" opacity="0.8"/>
  <rect x="1070" y="392" width="58" height="40" rx="9" fill="#c2410c" opacity="0.8"/>
</svg>
