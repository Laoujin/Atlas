<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- hero sun centered above horizon -->
  <circle cx="800" cy="400" r="185" fill="url(#sun)" opacity="0.92"/>

  <!-- layered river-delta / coastline curves -->
  <path d="M0,560 C420,500 720,600 1040,548 C1320,505 1480,560 1600,540 L1600,900 L0,900 Z" fill="url(#w1)" opacity="0.85"/>
  <path d="M0,650 C360,600 700,700 1020,640 C1300,590 1470,660 1600,635 L1600,900 L0,900 Z" fill="url(#w2)" opacity="0.88"/>
  <path d="M0,760 C400,710 760,800 1080,748 C1340,705 1480,770 1600,748 L1600,900 L0,900 Z" fill="url(#w3)" opacity="0.92"/>

  <!-- sampan boat silhouette resting on the water -->
  <path d="M610,620 C700,672 900,672 990,620 C940,648 860,660 800,660 C740,660 660,648 610,620 Z" fill="#5c2a1a" opacity="0.9"/>
  <path d="M800,548 L808,620 L792,620 Z" fill="#78350f" opacity="0.85"/>

  <!-- edge decoration: drifting clouds outside safe zone -->
  <ellipse cx="120" cy="60" rx="170" ry="34" fill="#fef3ec" opacity="0.6"/>
  <ellipse cx="1470" cy="80" rx="200" ry="38" fill="#fef3ec" opacity="0.6"/>
</svg>
