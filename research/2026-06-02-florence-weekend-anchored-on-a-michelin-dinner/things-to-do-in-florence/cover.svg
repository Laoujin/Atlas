<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="380" r="300" fill="url(#sun)" opacity="0.7"/>

  <!-- skyline silhouette, hero centered ~ (800,450) -->
  <g fill="url(#dome)" opacity="0.95">
    <!-- campanile (Giotto's bell tower) -->
    <rect x="470" y="250" width="78" height="350"/>
    <rect x="462" y="234" width="94" height="22"/>

    <!-- cathedral nave base -->
    <rect x="560" y="430" width="520" height="170"/>

    <!-- drum of the dome -->
    <rect x="720" y="350" width="200" height="90"/>

    <!-- Brunelleschi's dome (octagonal cupola) -->
    <path d="M712 352 Q820 175 928 352 Z"/>
    <!-- lantern on top -->
    <rect x="808" y="158" width="24" height="40"/>
    <path d="M804 158 L820 138 L836 158 Z"/>

    <!-- secondary towers on the right (Palazzo Vecchio) -->
    <rect x="1000" y="320" width="60" height="280"/>
    <rect x="1012" y="296" width="36" height="26"/>
  </g>

  <!-- dome ribs accent -->
  <g stroke="#fbbf24" stroke-width="3" opacity="0.6" fill="none">
    <path d="M820 178 L820 350"/>
    <path d="M760 230 L770 350"/>
    <path d="M880 230 L870 350"/>
  </g>

  <!-- Arno river full-bleed band -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#water)"/>
  <!-- reflection of skyline -->
  <g fill="#78350f" opacity="0.35">
    <rect x="470" y="600" width="78" height="120"/>
    <rect x="560" y="600" width="520" height="70"/>
    <path d="M712 600 Q820 700 928 600 Z"/>
  </g>
  <!-- water shimmer lines -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.4">
    <line x1="200" y1="700" x2="600" y2="700"/>
    <line x1="900" y1="760" x2="1380" y2="760"/>
    <line x1="500" y1="820" x2="1100" y2="820"/>
  </g>
</svg>
