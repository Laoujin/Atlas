<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table-glow radial -->
    <radialGradient id="glow" cx="50%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#faf8f2" stop-opacity="0.92"/>
      <stop offset="88%" stop-color="#e0d8cc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Inner plate -->
    <radialGradient id="plateInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#f0eadb" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Food element on plate -->
    <radialGradient id="food" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Wine glass fill -->
    <linearGradient id="wineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.65"/>
    </linearGradient>
    <!-- Second plate gradient (smaller, background) -->
    <radialGradient id="plate2rim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#e8e0d4" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm glow pool (table surface) -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle edge vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.65"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Layer 2: Hero — centered at (800, 450), well within safe zone -->

  <!-- Background plate (slightly behind, offset left) -->
  <ellipse cx="680" cy="490" rx="185" ry="185" fill="url(#plate2rim)" opacity="0.80"/>
  <ellipse cx="680" cy="490" rx="145" ry="145" fill="#faf8f2" opacity="0.38"/>

  <!-- Main plate rim -->
  <ellipse cx="820" cy="445" rx="235" ry="235" fill="url(#plateRim)"/>
  <!-- Main plate inner well -->
  <ellipse cx="820" cy="445" rx="188" ry="188" fill="url(#plateInner)"/>

  <!-- Food — abstract composed element on main plate -->
  <ellipse cx="820" cy="438" rx="68" ry="52" fill="url(#food)" opacity="0.90"/>
  <!-- Sauce drizzle arc suggestion (two small arcs as filled shapes) -->
  <ellipse cx="858" cy="415" rx="22" ry="10" fill="#fbbf24" opacity="0.72" transform="rotate(-25 858 415)"/>
  <ellipse cx="786" cy="465" rx="14" ry="7" fill="#d97706" opacity="0.60" transform="rotate(15 786 465)"/>

  <!-- Wine glass — right of plates, inside safe zone -->
  <!-- Bowl -->
  <path d="M1055 290 Q1100 380 1090 460 Q1080 510 1030 520 Q980 510 970 460 Q960 380 1005 290 Z"
        fill="url(#wineGrad)" opacity="0.88"/>
  <!-- Wine level inside glass (darker fill) -->
  <path d="M975 445 Q980 510 1030 520 Q1080 510 1085 445 Z"
        fill="#be185d" opacity="0.55"/>
  <!-- Glass stem -->
  <rect x="1025" y="520" width="10" height="90" rx="4" fill="#faf8f2" opacity="0.55"/>
  <!-- Glass base -->
  <ellipse cx="1030" cy="614" rx="42" ry="9" fill="#faf8f2" opacity="0.48"/>
  <!-- Glass highlight -->
  <path d="M1015 310 Q1008 360 1012 410" stroke="#fef3ec" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- Layer 3: Decorative — low-opacity corner accents, outside hero area -->
  <!-- Top-left rust arc accent -->
  <path d="M0 0 Q 200 80 120 300" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.18"/>
  <!-- Bottom-right warm arc -->
  <path d="M1600 900 Q 1380 820 1460 600" stroke="#d97706" stroke-width="2" fill="none" opacity="0.15"/>

</svg>
