<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust-dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3b1408"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Orbit ring radial backdrop -->
    <radialGradient id="orbitBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Node gradient -->
    <radialGradient id="nodeA" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="nodeB" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Orbit backdrop wash -->
  <ellipse cx="800" cy="450" rx="580" ry="390" fill="url(#orbitBg)"/>

  <!-- Layer 3: Edge decoration — low-opacity circuit traces (outside safe zone corners) -->
  <!-- Top-left corner trace -->
  <polyline points="0,120 80,120 80,60 200,60" stroke="#c2410c" stroke-width="1.5" fill="none" opacity="0.18"/>
  <polyline points="0,180 50,180 50,30 160,30" stroke="#d97706" stroke-width="1" fill="none" opacity="0.12"/>
  <circle cx="200" cy="60" r="5" fill="#c2410c" opacity="0.22"/>
  <!-- Bottom-right corner trace -->
  <polyline points="1600,780 1520,780 1520,840 1400,840" stroke="#c2410c" stroke-width="1.5" fill="none" opacity="0.18"/>
  <polyline points="1600,720 1550,720 1550,870 1440,870" stroke="#d97706" stroke-width="1" fill="none" opacity="0.12"/>
  <circle cx="1400" cy="840" r="5" fill="#c2410c" opacity="0.22"/>
  <!-- Top-right trace -->
  <polyline points="1600,140 1490,140 1490,55 1370,55" stroke="#9a3309" stroke-width="1" fill="none" opacity="0.14"/>
  <!-- Bottom-left trace -->
  <polyline points="0,760 110,760 110,855 230,855" stroke="#9a3309" stroke-width="1" fill="none" opacity="0.14"/>

  <!-- Layer 2: Hero — centered at (800, 450), safe zone compliant -->

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="330" ry="230" fill="none" stroke="#9a3309" stroke-width="1.8" opacity="0.55"/>
  <!-- Mid orbit ring -->
  <ellipse cx="800" cy="450" rx="210" ry="148" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.60"/>
  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="108" ry="76" fill="none" stroke="#d97706" stroke-width="2.2" opacity="0.70"/>

  <!-- Edge lines: hub to outer nodes -->
  <!-- Node positions (on outer ellipse, approximate): top(800,220), right(1130,450), bottom(800,680), left(470,450), upper-right(1055,290) -->
  <line x1="800" y1="450" x2="800" y2="222" stroke="#d97706" stroke-width="1.4" opacity="0.45"/>
  <line x1="800" y1="450" x2="1128" y2="450" stroke="#6d28d9" stroke-width="1.4" opacity="0.40"/>
  <line x1="800" y1="450" x2="800" y2="678" stroke="#d97706" stroke-width="1.4" opacity="0.45"/>
  <line x1="800" y1="450" x2="472" y2="450" stroke="#6d28d9" stroke-width="1.4" opacity="0.40"/>
  <line x1="800" y1="450" x2="1048" y2="296" stroke="#c2410c" stroke-width="1.2" opacity="0.38"/>
  <line x1="800" y1="450" x2="552" y2="604" stroke="#c2410c" stroke-width="1.2" opacity="0.38"/>

  <!-- Mid-ring node connections (secondary) -->
  <line x1="800" y1="302" x2="1010" y2="450" stroke="#78350f" stroke-width="1" opacity="0.30"/>
  <line x1="1010" y1="450" x2="800" y2="598" stroke="#78350f" stroke-width="1" opacity="0.30"/>
  <line x1="800" y1="598" x2="590" y2="450" stroke="#78350f" stroke-width="1" opacity="0.30"/>
  <line x1="590" y1="450" x2="800" y2="302" stroke="#78350f" stroke-width="1" opacity="0.30"/>

  <!-- Outer nodes (on outer ellipse) -->
  <!-- Top -->
  <circle cx="800" cy="222" r="18" fill="url(#nodeA)" opacity="0.92"/>
  <circle cx="800" cy="222" r="26" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.35"/>
  <!-- Right -->
  <circle cx="1128" cy="450" r="16" fill="url(#nodeB)" opacity="0.88"/>
  <circle cx="1128" cy="450" r="24" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.32"/>
  <!-- Bottom -->
  <circle cx="800" cy="678" r="18" fill="url(#nodeA)" opacity="0.90"/>
  <circle cx="800" cy="678" r="26" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.35"/>
  <!-- Left -->
  <circle cx="472" cy="450" r="16" fill="url(#nodeB)" opacity="0.88"/>
  <circle cx="472" cy="450" r="24" fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.32"/>
  <!-- Upper-right diagonal -->
  <circle cx="1048" cy="296" r="13" fill="#c2410c" opacity="0.82"/>
  <!-- Lower-left diagonal -->
  <circle cx="552" cy="604" r="13" fill="#c2410c" opacity="0.82"/>

  <!-- Mid-ring nodes -->
  <circle cx="800" cy="302" r="10" fill="#d97706" opacity="0.78"/>
  <circle cx="1010" cy="450" r="10" fill="#a78bfa" opacity="0.72"/>
  <circle cx="800" cy="598" r="10" fill="#d97706" opacity="0.78"/>
  <circle cx="590" cy="450" r="10" fill="#a78bfa" opacity="0.72"/>

  <!-- Central hub glow wash -->
  <circle cx="800" cy="450" r="90" fill="url(#hubGlow)" opacity="0.75"/>
  <!-- Hub core -->
  <circle cx="800" cy="450" r="38" fill="#78350f" opacity="0.95"/>
  <circle cx="800" cy="450" r="28" fill="#c2410c" opacity="0.95"/>
  <circle cx="800" cy="450" r="16" fill="#fbbf24" opacity="0.92"/>
  <!-- Hub inner highlight -->
  <circle cx="793" cy="443" r="6" fill="#fef3ec" opacity="0.55"/>
</svg>
