<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Hero stage glow -->
    <radialGradient id="stageGlow" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Top panel gradient -->
    <linearGradient id="panel1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Mid panel gradient -->
    <linearGradient id="panel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Screen face gradient -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Arch fill -->
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Floor reflection -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Radial glow centered on stage -->
  <rect width="1600" height="900" fill="url(#stageGlow)"/>

  <!-- Layer 2: Hero element — conference stage with stacked angled panels + arch -->

  <!-- Arch: a Moorish/Madrid-style horseshoe arch silhouette — two pillars + curved top path -->
  <!-- Pillar left -->
  <rect x="570" y="290" width="52" height="340" rx="6" fill="url(#archGrad)" opacity="0.72"/>
  <!-- Pillar right -->
  <rect x="978" y="290" width="52" height="340" rx="6" fill="url(#archGrad)" opacity="0.72"/>
  <!-- Arch crown: horseshoe arc (path approximated with a wide arc + keystone fill) -->
  <path d="M570 330 Q570 170 800 155 Q1030 170 1030 330 L978 330 Q978 210 800 198 Q622 210 622 330 Z"
        fill="url(#archGrad)" opacity="0.65"/>

  <!-- Stage floor / platform base -->
  <ellipse cx="800" cy="700" rx="420" ry="38" fill="#d97706" opacity="0.22"/>

  <!-- Back panel (largest, angled slightly) — conference screen backdrop -->
  <polygon points="540,640 1060,640 1100,380 500,380"
           fill="url(#panel2)" opacity="0.80"/>

  <!-- Screen face on back panel -->
  <polygon points="570,622 1030,622 1068,400 532,400"
           fill="url(#screen)" opacity="0.90"/>

  <!-- Mid panel — slightly raised, shifted, angled: slide deck feel -->
  <polygon points="610,628 990,628 1020,460 580,460"
           fill="url(#panel1)" opacity="0.70"/>

  <!-- Front hero panel — top card, brightest -->
  <polygon points="650,615 950,615 972,510 628,510"
           fill="#c2410c" opacity="0.88"/>
  <!-- Highlight bar on front panel top edge -->
  <polygon points="628,510 972,510 968,520 632,520"
           fill="#fbbf24" opacity="0.45"/>

  <!-- Subtle "text line" bars on the back screen (decoration only, not letters) -->
  <rect x="590" y="430" width="340" height="9" rx="4" fill="#fbbf24" opacity="0.18"/>
  <rect x="590" y="450" width="260" height="7" rx="3" fill="#fbbf24" opacity="0.12"/>
  <rect x="590" y="466" width="300" height="7" rx="3" fill="#fbbf24" opacity="0.10"/>

  <!-- LED accent dot cluster (top-right of front panel) — infra/tech flavour -->
  <circle cx="942" cy="524" r="5" fill="#fbbf24" opacity="0.90"/>
  <circle cx="924" cy="524" r="4" fill="#d97706" opacity="0.70"/>
  <circle cx="908" cy="524" r="3" fill="#c2410c" opacity="0.60"/>

  <!-- Floor reflection strip beneath stage -->
  <ellipse cx="800" cy="710" rx="380" ry="22" fill="url(#floor)" opacity="0.55"/>

  <!-- Layer 3: Edge / corner decoration (gets variably cropped — no meaning lost) -->
  <!-- Bottom-left warm glow smear -->
  <ellipse cx="120" cy="820" rx="220" ry="110" fill="#c2410c" opacity="0.18"/>
  <!-- Top-right cool rust smear -->
  <ellipse cx="1490" cy="80" rx="200" ry="90" fill="#78350f" opacity="0.22"/>
  <!-- Subtle full-width base line -->
  <rect x="0" y="870" width="1600" height="30" fill="#9a3309" opacity="0.30"/>
</svg>
