<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2e1008"/>
    </linearGradient>

    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose accent glow (secondary hue) -->
    <radialGradient id="roseGlow" cx="50%" cy="52%" r="30%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="70%" stop-color="#3a1508"/>
      <stop offset="100%" stop-color="#2a0e04"/>
    </radialGradient>

    <!-- Inner plate gradient -->
    <radialGradient id="plateInner" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a1508" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Star shimmer gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#roseGlow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450) within safe zone -->

  <!-- Outer plate rim (large) -->
  <circle cx="800" cy="455" r="280" fill="url(#plateRim)" opacity="0.92"/>
  <!-- Plate inner well -->
  <circle cx="800" cy="455" r="220" fill="#1e0a04" opacity="0.85"/>
  <!-- Plate inner highlight ring -->
  <circle cx="800" cy="455" r="220" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.45"/>
  <!-- Plate inner well gradient -->
  <circle cx="800" cy="455" r="200" fill="url(#plateInner)"/>

  <!-- Second plate — offset left, partially behind main plate -->
  <circle cx="628" cy="468" r="200" fill="url(#plateRim)" opacity="0.60"/>
  <circle cx="628" cy="468" r="155" fill="#1a0804" opacity="0.70"/>
  <circle cx="628" cy="468" r="155" fill="none" stroke="#9a3309" stroke-width="2" opacity="0.35"/>

  <!-- Wine glass silhouette — right side of hero, built from paths -->
  <!-- Glass bowl (ellipse at top) -->
  <ellipse cx="990" cy="370" rx="48" ry="72" fill="#5c2a1a" opacity="0.75"/>
  <!-- Liquid fill inside bowl -->
  <ellipse cx="990" cy="390" rx="36" ry="45" fill="#9a3309" opacity="0.55"/>
  <!-- Stem -->
  <rect x="986" y="440" width="8" height="90" rx="4" fill="#5c2a1a" opacity="0.70"/>
  <!-- Base -->
  <ellipse cx="990" cy="534" rx="38" ry="8" fill="#5c2a1a" opacity="0.65"/>
  <!-- Glass rim highlight -->
  <ellipse cx="990" cy="299" rx="48" ry="6" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.40"/>

  <!-- Michelin star motifs — three small stars above plate centre -->
  <!-- Star 1 -->
  <circle cx="762" cy="260" r="7" fill="url(#starGlow)" opacity="0.88"/>
  <!-- Star 2 -->
  <circle cx="800" cy="250" r="8" fill="url(#starGlow)" opacity="0.92"/>
  <!-- Star 3 -->
  <circle cx="838" cy="260" r="7" fill="url(#starGlow)" opacity="0.88"/>

  <!-- Subtle ring around plate for depth -->
  <circle cx="800" cy="455" r="300" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.18"/>
  <circle cx="800" cy="455" r="320" fill="none" stroke="#9a3309" stroke-width="0.8" opacity="0.10"/>

  <!-- Layer 3: Edge decoration outside safe zone -->
  <!-- Top-left corner accent -->
  <rect x="-20" y="-20" width="180" height="4" rx="2" fill="#c2410c" opacity="0.22" transform="rotate(0)"/>
  <rect x="-20" y="-20" width="4" height="180" rx="2" fill="#c2410c" opacity="0.22"/>
  <!-- Bottom-right corner accent -->
  <rect x="1440" y="896" width="180" height="4" rx="2" fill="#c2410c" opacity="0.22"/>
  <rect x="1596" y="720" width="4" height="180" rx="2" fill="#c2410c" opacity="0.22"/>
</svg>
