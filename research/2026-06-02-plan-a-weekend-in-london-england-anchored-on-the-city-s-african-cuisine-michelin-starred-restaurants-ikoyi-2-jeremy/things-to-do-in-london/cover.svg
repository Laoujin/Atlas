<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rustLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1080" cy="430" r="240" fill="url(#sun)" opacity="0.85"/>

  <!-- River band (faint) -->
  <rect x="0" y="720" width="1600" height="80" fill="#9a3309" opacity="0.15"/>

  <!-- London Eye (left of center) -->
  <g opacity="0.9">
    <circle cx="500" cy="500" r="170" fill="none" stroke="url(#rust)" stroke-width="10"/>
    <circle cx="500" cy="500" r="170" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6"/>
    <line x1="500" y1="330" x2="500" y2="670" stroke="#78350f" stroke-width="3" opacity="0.7"/>
    <line x1="330" y1="500" x2="670" y2="500" stroke="#78350f" stroke-width="3" opacity="0.7"/>
    <line x1="380" y1="380" x2="620" y2="620" stroke="#78350f" stroke-width="3" opacity="0.7"/>
    <line x1="620" y1="380" x2="380" y2="620" stroke="#78350f" stroke-width="3" opacity="0.7"/>
    <circle cx="500" cy="500" r="22" fill="#c2410c"/>
    <rect x="490" y="500" width="20" height="220" fill="#78350f" opacity="0.7"/>
  </g>

  <!-- Big Ben clock tower (hero, centered) -->
  <g opacity="0.95">
    <!-- base shaft -->
    <rect x="780" y="320" width="80" height="400" fill="url(#rust)"/>
    <!-- shaft windows (vertical accent) -->
    <rect x="810" y="360" width="20" height="320" fill="#78350f" opacity="0.55"/>
    <!-- clock section -->
    <rect x="770" y="280" width="100" height="60" fill="url(#rustLight)"/>
    <circle cx="820" cy="310" r="20" fill="#fef3ec" opacity="0.9"/>
    <circle cx="820" cy="310" r="20" fill="none" stroke="#78350f" stroke-width="2"/>
    <line x1="820" y1="310" x2="820" y2="296" stroke="#78350f" stroke-width="2.5"/>
    <line x1="820" y1="310" x2="830" y2="314" stroke="#78350f" stroke-width="2.5"/>
    <!-- belfry -->
    <rect x="775" y="240" width="90" height="40" fill="url(#rust)"/>
    <!-- spire -->
    <polygon points="775,240 865,240 855,200 785,200" fill="url(#rustLight)"/>
    <polygon points="785,200 855,200 820,140" fill="#c2410c"/>
    <line x1="820" y1="140" x2="820" y2="115" stroke="#78350f" stroke-width="3"/>
    <circle cx="820" cy="115" r="5" fill="#fbbf24"/>
  </g>

  <!-- The Shard (right) -->
  <g opacity="0.88">
    <polygon points="1100,720 1180,720 1160,340 1140,300 1120,340" fill="url(#rustLight)"/>
    <polygon points="1140,300 1160,340 1140,720" fill="#78350f" opacity="0.4"/>
  </g>

  <!-- Gherkin (far right) -->
  <g opacity="0.85">
    <ellipse cx="1320" cy="560" rx="55" ry="170" fill="url(#rust)"/>
    <line x1="1280" y1="450" x2="1360" y2="450" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
    <line x1="1275" y1="520" x2="1365" y2="520" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
    <line x1="1275" y1="590" x2="1365" y2="590" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
    <line x1="1280" y1="660" x2="1360" y2="660" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
    <polygon points="1320,380 1330,400 1310,400" fill="#c2410c"/>
  </g>

  <!-- Distant low buildings (atmospheric) -->
  <g opacity="0.45" fill="#9a3309">
    <rect x="200" y="680" width="60" height="40"/>
    <rect x="270" y="660" width="40" height="60"/>
    <rect x="320" y="670" width="50" height="50"/>
    <rect x="720" y="690" width="50" height="30"/>
    <rect x="900" y="680" width="70" height="40"/>
    <rect x="990" y="670" width="40" height="50"/>
    <rect x="1230" y="680" width="50" height="40"/>
    <rect x="1410" y="660" width="60" height="60"/>
  </g>

  <!-- ground line -->
  <rect x="0" y="720" width="1600" height="4" fill="#78350f" opacity="0.5"/>
</svg>
