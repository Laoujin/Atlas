<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="hub" cx="40%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- spokes: curved routes from hub to destinations -->
  <g fill="none" stroke="url(#spoke)" stroke-width="10" stroke-linecap="round" opacity="0.78">
    <path d="M800 450 Q560 280 360 250"/>
    <path d="M800 450 Q1080 250 1280 300"/>
    <path d="M800 450 Q1120 560 1290 660"/>
    <path d="M800 450 Q540 600 380 690"/>
    <path d="M800 450 Q800 700 800 760"/>
  </g>

  <!-- destination islands -->
  <g fill="#78350f" opacity="0.85">
    <circle cx="360" cy="250" r="34"/>
    <circle cx="1280" cy="300" r="40"/>
    <circle cx="1290" cy="660" r="32"/>
    <circle cx="380" cy="690" r="38"/>
    <circle cx="800" cy="760" r="30"/>
  </g>
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="360" cy="250" r="14"/>
    <circle cx="1280" cy="300" r="16"/>
    <circle cx="1290" cy="660" r="13"/>
    <circle cx="380" cy="690" r="15"/>
    <circle cx="800" cy="760" r="12"/>
  </g>

  <!-- central hub node -->
  <circle cx="800" cy="450" r="150" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="92" fill="none" stroke="#fef3ec" stroke-width="14" opacity="0.85"/>
  <circle cx="800" cy="450" r="40" fill="#fbbf24" opacity="0.92"/>
</svg>
