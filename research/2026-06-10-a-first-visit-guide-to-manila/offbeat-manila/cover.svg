<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="spill" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm light spilling from the aperture -->
  <ellipse cx="800" cy="470" rx="560" ry="420" fill="url(#spill)" opacity="0.9"/>

  <!-- dark doorway frame -->
  <path d="M560 760 L560 360 Q560 150 800 150 Q1040 150 1040 360 L1040 760 Z"
        fill="#78350f" opacity="0.85"/>

  <!-- glowing half-open aperture -->
  <path d="M610 740 L610 372 Q610 200 800 200 Q930 200 930 372 L930 740 Z"
        fill="url(#glow)" opacity="0.92"/>

  <!-- the dark door swung ajar, cutting into the glow -->
  <path d="M800 200 Q930 200 930 372 L930 740 L800 700 Z"
        fill="#1a0e0e" opacity="0.82"/>
</svg>
