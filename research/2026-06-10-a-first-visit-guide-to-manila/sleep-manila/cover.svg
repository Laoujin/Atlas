<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- decoration: low sun outside safe zone -->
  <circle cx="800" cy="60" r="120" fill="#fbbf24" opacity="0.7"/>

  <!-- hero: grand heritage facade silhouette -->
  <g opacity="0.95">
    <rect x="520" y="200" width="560" height="610" fill="url(#wall)"/>
    <!-- cornice / roofline -->
    <rect x="495" y="180" width="610" height="34" fill="#78350f"/>
    <!-- arched window row, upper floor -->
    <g fill="url(#glow)" opacity="0.92">
      <path d="M560 300 a44 44 0 0 1 88 0 v120 h-88 z"/>
      <path d="M708 300 a44 44 0 0 1 88 0 v120 h-88 z"/>
      <path d="M856 300 a44 44 0 0 1 88 0 v120 h-88 z"/>
      <path d="M1004 300 a36 36 0 0 1 72 0 v120 h-72 z"/>
    </g>
    <!-- shuttered art-deco openings, ground floor -->
    <g fill="url(#glow)" opacity="0.85">
      <rect x="556" y="520" width="84" height="200"/>
      <rect x="704" y="520" width="84" height="200"/>
      <rect x="852" y="520" width="84" height="200"/>
      <rect x="1000" y="520" width="76" height="200"/>
    </g>
  </g>
</svg>
