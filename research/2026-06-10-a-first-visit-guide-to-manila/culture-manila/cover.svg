<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint stage glow halo behind portico, outside hero -->
  <ellipse cx="800" cy="470" rx="540" ry="300" fill="url(#glow)" opacity="0.18"/>

  <!-- HERO: neoclassical museum portico silhouette -->
  <g fill="url(#stone)" opacity="0.92">
    <!-- pediment triangle -->
    <polygon points="800,150 1130,330 470,330"/>
    <!-- entablature -->
    <rect x="470" y="330" width="660" height="46"/>
    <!-- columns -->
    <rect x="500" y="376" width="56" height="320"/>
    <rect x="620" y="376" width="56" height="320"/>
    <rect x="772" y="376" width="56" height="320"/>
    <rect x="924" y="376" width="56" height="320"/>
    <rect x="1044" y="376" width="56" height="320"/>
    <!-- stylobate base steps -->
    <rect x="452" y="696" width="696" height="34"/>
    <rect x="420" y="730" width="760" height="34"/>
  </g>

  <!-- warm doorway glow within portico -->
  <rect x="700" y="430" width="200" height="266" fill="url(#glow)" opacity="0.8"/>
</svg>
