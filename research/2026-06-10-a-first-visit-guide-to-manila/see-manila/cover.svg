<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="stoneDk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- decorative sun glow, outside safe zone behind hero -->
  <circle cx="800" cy="250" r="220" fill="#fbbf24" opacity="0.6"/>

  <!-- HERO: stylised Baroque church facade / bell tower silhouette -->
  <g fill="url(#stone)" opacity="0.92">
    <!-- main facade body -->
    <rect x="560" y="430" width="480" height="320"/>
    <!-- pedimented top of facade -->
    <path d="M560 430 L800 320 L1040 430 Z"/>
    <!-- bell tower rising above facade -->
    <rect x="1010" y="250" width="120" height="500"/>
    <!-- tower cap dome -->
    <path d="M1000 250 q70 -120 140 0 Z"/>
    <!-- central portal arch (subtracted via darker shade) -->
  </g>

  <!-- portal + windows in deeper stone for depth -->
  <g fill="url(#stoneDk)" opacity="0.9">
    <path d="M730 750 L730 600 q70 -90 140 0 L870 750 Z"/>
    <rect x="630" y="500" width="70" height="120" rx="35"/>
    <rect x="900" y="500" width="70" height="120" rx="35"/>
    <rect x="1045" y="360" width="50" height="90" rx="25"/>
  </g>

  <!-- ground line -->
  <rect x="0" y="748" width="1600" height="152" fill="#78350f" opacity="0.85"/>
</svg>
