<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Central candlelight glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%"  stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plate1" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#faf8f2" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.70"/>
    </radialGradient>
    <radialGradient id="plate2" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#faf8f2" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.60"/>
    </radialGradient>
    <!-- Table surface gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1a0a" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Candle flame glow -->
    <radialGradient id="flame" cx="50%" cy="70%" r="50%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Warm ambient glow over entire canvas -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Table surface suggestion — low trapezoid anchoring the scene -->
  <polygon points="300,760 1300,760 1180,560 420,560" fill="url(#table)" opacity="0.85"/>

  <!-- Hero: two round dinner plates centered in safe zone -->
  <!-- Left plate -->
  <ellipse cx="680" cy="650" rx="155" ry="145" fill="url(#plate1)" opacity="0.90"/>
  <!-- Left plate inner well -->
  <ellipse cx="680" cy="650" rx="100" ry="94" fill="#faf8f2" opacity="0.04"/>
  <!-- Left plate food accent — small rust oval -->
  <ellipse cx="680" cy="648" rx="42" ry="36" fill="#c2410c" opacity="0.70"/>
  <ellipse cx="680" cy="648" rx="20" ry="17" fill="#d97706" opacity="0.50"/>

  <!-- Right plate -->
  <ellipse cx="920" cy="650" rx="155" ry="145" fill="url(#plate2)" opacity="0.85"/>
  <!-- Right plate inner well -->
  <ellipse cx="920" cy="650" rx="100" ry="94" fill="#faf8f2" opacity="0.03"/>
  <!-- Right plate food accent -->
  <ellipse cx="920" cy="648" rx="42" ry="36" fill="#9a3309" opacity="0.65"/>
  <ellipse cx="920" cy="648" rx="18" ry="15" fill="#fbbf24" opacity="0.40"/>

  <!-- Hero: wine glass silhouette centered between plates -->
  <!-- Glass bowl -->
  <ellipse cx="800" cy="530" rx="38" ry="52" fill="#faf8f2" opacity="0.08"/>
  <!-- Wine fill inside bowl -->
  <ellipse cx="800" cy="545" rx="30" ry="32" fill="#c2410c" opacity="0.55"/>
  <!-- Glass stem -->
  <rect x="796" y="580" width="8" height="80" rx="3" fill="#faf8f2" opacity="0.12"/>
  <!-- Glass base -->
  <ellipse cx="800" cy="662" rx="32" ry="8" fill="#faf8f2" opacity="0.10"/>

  <!-- Hero: candle between plates -->
  <!-- Candle body -->
  <rect x="793" y="460" width="14" height="64" rx="3" fill="#fef3ec" opacity="0.55"/>
  <!-- Flame -->
  <ellipse cx="800" cy="452" rx="7" ry="14" fill="url(#flame)" opacity="0.95"/>
  <!-- Candle glow halo -->
  <ellipse cx="800" cy="455" rx="28" ry="22" fill="#fbbf24" opacity="0.12"/>

  <!-- Layer 3: Decorative edge vignette (outside safe zone) -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.75"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
