<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Left plate gradient -->
    <radialGradient id="plateL" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2a882"/>
    </radialGradient>

    <!-- Right plate gradient -->
    <radialGradient id="plateR" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2a882"/>
    </radialGradient>

    <!-- Plate rim shadow -->
    <radialGradient id="rimL" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="rimR" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Food accent on plate -->
    <radialGradient id="food" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Rose accent gradient for wine glass -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#9a3309" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Table surface gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm central ambient glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle table surface in lower half -->
  <ellipse cx="800" cy="820" rx="820" ry="240" fill="url(#table)" opacity="0.6"/>

  <!-- Layer 2: Hero element — two plates centered in safe zone -->

  <!-- Left plate shadow -->
  <ellipse cx="610" cy="462" rx="202" ry="202" fill="#0d0604" opacity="0.45"/>
  <!-- Left plate base -->
  <ellipse cx="604" cy="455" rx="198" ry="198" fill="url(#plateL)"/>
  <!-- Left plate rim -->
  <ellipse cx="604" cy="455" rx="198" ry="198" fill="url(#rimL)"/>
  <!-- Left plate inner well -->
  <ellipse cx="604" cy="455" rx="148" ry="148" fill="#faf8f2" opacity="0.92"/>
  <!-- Left plate food accent — abstract composed element -->
  <ellipse cx="598" cy="448" rx="62" ry="42" fill="url(#food)" opacity="0.88"/>
  <ellipse cx="622" cy="432" rx="24" ry="18" fill="#fbbf24" opacity="0.75"/>
  <ellipse cx="578" cy="464" rx="18" ry="14" fill="#c2410c" opacity="0.7"/>
  <!-- Left plate sauce arc -->
  <path d="M560,440 Q590,410 630,445" stroke="#d97706" stroke-width="4" fill="none" opacity="0.65" stroke-linecap="round"/>

  <!-- Right plate shadow -->
  <ellipse cx="992" cy="462" rx="202" ry="202" fill="#0d0604" opacity="0.45"/>
  <!-- Right plate base -->
  <ellipse cx="986" cy="455" rx="198" ry="198" fill="url(#plateR)"/>
  <!-- Right plate rim -->
  <ellipse cx="986" cy="455" rx="198" ry="198" fill="url(#rimR)"/>
  <!-- Right plate inner well -->
  <ellipse cx="986" cy="455" rx="148" ry="148" fill="#faf8f2" opacity="0.92"/>
  <!-- Right plate food accent -->
  <ellipse cx="980" cy="445" rx="58" ry="44" fill="url(#food)" opacity="0.85"/>
  <ellipse cx="1006" cy="430" rx="20" ry="16" fill="#fbbf24" opacity="0.72"/>
  <ellipse cx="962" cy="460" rx="22" ry="16" fill="#9a3309" opacity="0.65"/>
  <!-- Right plate sauce arc -->
  <path d="M948,436 Q972,406 1018,438" stroke="#d97706" stroke-width="4" fill="none" opacity="0.65" stroke-linecap="round"/>

  <!-- Wine glass silhouette — centered between plates -->
  <!-- Bowl -->
  <path d="M778,290 Q758,370 762,420 Q778,445 800,448 Q822,445 838,420 Q842,370 822,290 Z" fill="url(#glass)" opacity="0.72"/>
  <!-- Stem -->
  <rect x="796" y="448" width="8" height="95" fill="#be185d" opacity="0.45"/>
  <!-- Base -->
  <ellipse cx="800" cy="548" rx="34" ry="7" fill="#be185d" opacity="0.38"/>
  <!-- Glass highlight -->
  <path d="M786,310 Q782,355 784,395" stroke="#fef3ec" stroke-width="2.5" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Layer 3: Edge decorations (outside safe zone or near edges) -->
  <!-- Top-left ambient warm corner wash -->
  <radialGradient id="cornerTL" cx="0%" cy="0%" r="50%">
    <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="600" height="400" fill="url(#cornerTL)"/>

  <!-- Bottom-right rose accent wash -->
  <radialGradient id="cornerBR" cx="100%" cy="100%" r="45%">
    <stop offset="0%" stop-color="#be185d" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect x="800" y="500" width="800" height="400" fill="url(#cornerBR)"/>

  <!-- Subtle horizontal rule suggesting table edge -->
  <line x1="0" y1="588" x2="1600" y2="588" stroke="#d97706" stroke-width="1" opacity="0.18"/>
</svg>
