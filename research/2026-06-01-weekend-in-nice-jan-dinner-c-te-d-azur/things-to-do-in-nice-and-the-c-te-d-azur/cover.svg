<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="headland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow halo -->
  <circle cx="800" cy="430" r="320" fill="url(#sunGlow)"/>

  <!-- hero sun -->
  <circle cx="800" cy="430" r="170" fill="url(#sun)" opacity="0.95"/>

  <!-- sea -->
  <path d="M 0 560 Q 400 540 800 560 T 1600 560 L 1600 900 L 0 900 Z" fill="url(#sea)"/>

  <!-- sun reflection on water -->
  <ellipse cx="800" cy="575" rx="140" ry="10" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="610" rx="100" ry="6" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="800" cy="640" rx="70" ry="4" fill="#fbbf24" opacity="0.22"/>

  <!-- left headland (Cap d'Antibes silhouette) -->
  <path d="M 0 560 Q 120 530 240 545 Q 360 555 440 580 L 440 600 L 0 600 Z" fill="url(#headland)" opacity="0.85"/>

  <!-- right headland (Cap Ferrat silhouette) -->
  <path d="M 1160 580 Q 1280 555 1400 540 Q 1520 530 1600 545 L 1600 600 L 1160 600 Z" fill="url(#headland)" opacity="0.85"/>

  <!-- foreground palm frond suggestion, decorative corner -->
  <g opacity="0.7" stroke="#5c2a1a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 90 880 Q 120 760 180 700"/>
    <path d="M 180 700 Q 150 670 110 665"/>
    <path d="M 180 700 Q 215 680 245 685"/>
    <path d="M 180 700 Q 160 730 130 745"/>
    <path d="M 180 700 Q 210 720 235 735"/>
    <path d="M 180 700 Q 175 670 165 645"/>
    <path d="M 180 700 Q 200 675 215 660"/>
  </g>

  <!-- distant sail -->
  <path d="M 1080 540 L 1080 510 L 1100 540 Z" fill="#faf8f2" opacity="0.8"/>
  <path d="M 1078 540 L 1102 540 L 1098 548 L 1082 548 Z" fill="#5c2a1a" opacity="0.75"/>
</svg>
