<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="0.45" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="700" ry="430" fill="url(#glow)"/>

  <g transform="rotate(-6 800 450)">
    <rect x="320" y="231" width="960" height="70" rx="10" fill="url(#slab)" opacity="0.6"/>
    <rect x="320" y="323" width="960" height="70" rx="10" fill="url(#slab)" opacity="0.75"/>

    <rect x="280" y="405" width="1040" height="92" rx="12" fill="url(#hero)" opacity="0.95"/>
    <rect x="280" y="405" width="1040" height="92" rx="12" fill="none" stroke="#5c2a1a" stroke-opacity="0.25" stroke-width="2"/>

    <rect x="320" y="519" width="960" height="70" rx="10" fill="url(#slab)" opacity="0.75"/>
    <rect x="320" y="611" width="960" height="70" rx="10" fill="url(#teal)" opacity="0.9"/>
  </g>

  <circle cx="1520" cy="120" r="150" fill="#c2410c" opacity="0.07"/>
  <circle cx="90" cy="820" r="180" fill="#0e7490" opacity="0.06"/>
</svg>
