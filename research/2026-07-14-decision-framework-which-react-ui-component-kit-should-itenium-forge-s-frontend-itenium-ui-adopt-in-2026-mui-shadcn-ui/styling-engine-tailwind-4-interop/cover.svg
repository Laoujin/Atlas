<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="slabDeep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <circle cx="120" cy="800" r="150" fill="#0e7490" opacity="0.07"/>
  <circle cx="1520" cy="120" r="190" fill="#c2410c" opacity="0.07"/>

  <g transform="rotate(-6 800 450)">
    <g opacity="0.9">
      <rect x="350" y="600" width="900" height="58" rx="10" fill="url(#slabDeep)"/>
      <rect x="350" y="600" width="900" height="6" rx="3" fill="#78350f" opacity="0.35"/>

      <rect x="350" y="522" width="900" height="58" rx="10" fill="url(#slab)"/>
      <rect x="350" y="522" width="900" height="6" rx="3" fill="#0e7490" opacity="0.45"/>

      <rect x="350" y="444" width="900" height="58" rx="10" fill="url(#slab)" opacity="0.85"/>
      <rect x="350" y="444" width="900" height="6" rx="3" fill="#0e7490" opacity="0.40"/>

      <rect x="350" y="366" width="900" height="58" rx="10" fill="url(#slabDeep)" opacity="0.75"/>
      <rect x="350" y="366" width="900" height="6" rx="3" fill="#78350f" opacity="0.28"/>
    </g>

    <rect x="392" y="286" width="900" height="30" rx="15" fill="#9a3309" opacity="0.16"/>
    <rect x="392" y="240" width="900" height="76" rx="12" fill="url(#hero)" opacity="0.95"/>
    <rect x="392" y="240" width="900" height="8" rx="4" fill="url(#edge)"/>
