<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filled" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="partial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="muted" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g opacity="0.5">
    <circle cx="120" cy="820" r="150" fill="#0e7490" opacity="0.10"/>
    <circle cx="1520" cy="90" r="180" fill="#c2410c" opacity="0.10"/>
  </g>

  <g>
    <rect x="390" y="190" width="260" height="160" rx="16" fill="url(#filled)" opacity="0.92"/>
    <rect x="670" y="190" width="260" height="160" rx="16" fill="url(#muted)" opacity="0.9"/>
    <rect x="950" y="190" width="260" height="160" rx="16" fill="url(#partial)" opacity="0.85"/>

    <rect x="390" y="370" width="260" height="160" rx="16" fill="url(#muted)" opacity="0.9"/>
    <rect x="670" y="370" width="260" height="160" rx="16" fill="url(#teal)" opacity="0.8"/>
    <rect x="950" y="370" width="260" height="160" rx="16" fill="none" stroke="#9a3309" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="22 18"/>

    <rect x="390" y="550" width="260" height="160" rx="16" fill="none" stroke="#9a3309" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="22 18"/>
    <rect x="670" y="550" width="260" height="160" rx="16" fill="url(#filled)" opacity="0.75"/>
    <rect x="950" y="550" width="260" height="160" rx="16" fill="url(#muted)" opacity="0.9"/>
  </g>

  <g opacity="0.7" stroke="#78350f" stroke-opacity="0.25" stroke-width="2">
    <line x1="330" y1="450" x2="120" y2="450"/>
    <line x1="1270" y1="450" x2="1480" y2="450"/>
  </g>
</svg>
