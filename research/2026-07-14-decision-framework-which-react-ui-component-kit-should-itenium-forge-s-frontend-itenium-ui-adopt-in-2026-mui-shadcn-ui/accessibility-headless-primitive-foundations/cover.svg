<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foundation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.55" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="blockA" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0.1" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <circle cx="88" cy="118" r="150" fill="#c2410c" opacity="0.07"/>
  <circle cx="1526" cy="806" r="190" fill="#78350f" opacity="0.07"/>

  <!-- superstructure: two lighter blocks socketing down into the layer beneath -->
  <path d="M498 306 h268 a14 14 0 0 1 14 14 v170 h-56 v-34 h-64 v34 H512 a14 14 0 0 1 -14 -14 z"
        fill="url(#blockA)" opacity="0.9"/>
  <path d="M834 342 h252 a14 14 0 0 1 14 14 v134 h-60 v-34 h-70 v34 h-136 a14 14 0 0 1 -14 -14 z"
        fill="url(#blockB)" opacity="0.85"/>

  <!-- the primitive layer: the interface everything above depends on -->
  <rect x="452" y="500" width="700" height="16" rx="8" fill="url(#seam)"/>

  <!-- load-bearing foundation -->
  <path d="M424 530 h752 a20 20 0 0 1 20 20 v122 a20 20 0 0 1 -20 20 H424 a20 20 0 0 1 -20 -20 V550 a20 20 0 0 1 20 -20 z"
        fill="url(#foundation)" opacity="0.94"/>
  <rect x="404" y="530" width="792" height="26" rx="13" fill="#c2410c" opacity="0.65"/>
  <rect x="452" y="700" width="700" height="10" rx="5" fill="#78350f" opacity="0.28"/>
</svg>
