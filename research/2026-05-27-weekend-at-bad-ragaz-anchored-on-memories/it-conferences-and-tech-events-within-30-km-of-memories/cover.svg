<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="nearRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.28" r="0.18">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="marker" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Far snow-capped range -->
  <path d="M 0 540 L 140 420 L 240 470 L 360 360 L 470 430 L 600 330 L 740 410 L 870 350 L 1010 420 L 1140 360 L 1290 440 L 1430 380 L 1600 450 L 1600 600 L 0 600 Z"
        fill="url(#farRange)"/>
  <!-- snow tips on far range -->
  <path d="M 340 380 L 360 360 L 380 380 L 370 395 L 360 388 L 350 395 Z M 580 350 L 600 330 L 622 352 L 610 365 L 600 358 L 590 365 Z M 850 370 L 870 350 L 892 372 L 880 384 L 870 378 L 860 384 Z M 1120 380 L 1140 360 L 1160 380 L 1150 392 L 1140 386 L 1130 392 Z"
        fill="#faf8f2" opacity="0.85"/>

  <!-- Mid range -->
  <path d="M 0 640 L 100 540 L 220 600 L 340 500 L 480 580 L 620 480 L 780 560 L 920 470 L 1080 550 L 1240 490 L 1400 570 L 1600 520 L 1600 720 L 0 720 Z"
        fill="url(#midRange)"/>

  <!-- Calendar dot-grid overlay across valley floor -->
  <g fill="#5c2a1a" opacity="0.18">
    <circle cx="200" cy="760" r="4"/><circle cx="280" cy="760" r="4"/><circle cx="360" cy="760" r="4"/><circle cx="440" cy="760" r="4"/><circle cx="520" cy="760" r="4"/><circle cx="600" cy="760" r="4"/><circle cx="680" cy="760" r="4"/><circle cx="760" cy="760" r="4"/><circle cx="840" cy="760" r="4"/><circle cx="920" cy="760" r="4"/><circle cx="1000" cy="760" r="4"/><circle cx="1080" cy="760" r="4"/><circle cx="1160" cy="760" r="4"/><circle cx="1240" cy="760" r="4"/><circle cx="1320" cy="760" r="4"/><circle cx="1400" cy="760" r="4"/>
    <circle cx="200" cy="810" r="4"/><circle cx="280" cy="810" r="4"/><circle cx="360" cy="810" r="4"/><circle cx="440" cy="810" r="4"/><circle cx="520" cy="810" r="4"/><circle cx="600" cy="810" r="4"/><circle cx="680" cy="810" r="4"/><circle cx="760" cy="810" r="4"/><circle cx="840" cy="810" r="4"/><circle cx="920" cy="810" r="4"/><circle cx="1000" cy="810" r="4"/><circle cx="1080" cy="810" r="4"/><circle cx="1160" cy="810" r="4"/><circle cx="1240" cy="810" r="4"/><circle cx="1320" cy="810" r="4"/><circle cx="1400" cy="810" r="4"/>
    <circle cx="200" cy="860" r="4"/><circle cx="280" cy="860" r="4"/><circle cx="360" cy="860" r="4"/><circle cx="440" cy="860" r="4"/><circle cx="520" cy="860" r="4"/><circle cx="600" cy="860" r="4"/><circle cx="680" cy="860" r="4"/><circle cx="760" cy="860" r="4"/><circle cx="840" cy="860" r="4"/><circle cx="920" cy="860" r="4"/><circle cx="1000" cy="860" r="4"/><circle cx="1080" cy="860" r="4"/><circle cx="1160" cy="860" r="4"/><circle cx="1240" cy="860" r="4"/><circle cx="1320" cy="860" r="4"/><circle cx="1400" cy="860" r="4"/>
  </g>

  <!-- Near range / valley walls -->
  <path d="M 0 760 L 180 660 L 360 700 L 540 640 L 720 690 L 900 630 L 1080 680 L 1260 620 L 1440 670 L 1600 640 L 1600 900 L 0 900 Z"
        fill="url(#nearRange)"/>

  <!-- River line through valley -->
  <path d="M 0 830 Q 400 815 800 825 T 1600 820"
        stroke="#0e7490" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Event markers (pins) plotted across the valley -->
  <g>
    <!-- pin 1 -->
    <path d="M 420 580 C 420 555, 460 555, 460 580 C 460 605, 440 640, 440 640 C 440 640, 420 605, 420 580 Z"
          fill="url(#marker)" opacity="0.92"/>
    <circle cx="440" cy="582" r="7" fill="#1a0e0e" opacity="0.6"/>

    <!-- pin 2 (hero, larger, near center) -->
    <path d="M 770 430 C 770 395, 830 395, 830 430 C 830 470, 800 530, 800 530 C 800 530, 770 470, 770 430 Z"
          fill="url(#marker)" opacity="0.95"/>
    <circle cx="800" cy="433" r="11" fill="#1a0e0e" opacity="0.65"/>

    <!-- pin 3 -->
    <path d="M 1080 510 C 1080 482, 1124 482, 1124 510 C 1124 540, 1102 585, 1102 585 C 1102 585, 1080 540, 1080 510 Z"
          fill="url(#marker)" opacity="0.92"/>
    <circle cx="1102" cy="512" r="8" fill="#1a0e0e" opacity="0.6"/>

    <!-- pin 4 small -->
    <path d="M 260 620 C 260 600, 290 600, 290 620 C 290 640, 275 670, 275 670 C 275 670, 260 640, 260 620 Z"
          fill="url(#marker)" opacity="0.85"/>
    <circle cx="275" cy="622" r="5" fill="#1a0e0e" opacity="0.55"/>
  </g>

  <!-- Dotted connection arc between hero pin and side pins -->
  <path d="M 440 640 Q 620 680 800 530" stroke="#6d28d9" stroke-width="2" stroke-dasharray="2 8" fill="none" opacity="0.45"/>
  <path d="M 800 530 Q 950 600 1102 585" stroke="#6d28d9" stroke-width="2" stroke-dasharray="2 8" fill="none" opacity="0.45"/>
</svg>
