<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="spring" cx="0.5" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="nearRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="780" rx="900" ry="220" fill="url(#spring)"/>

  <!-- Far range: Falknis-like distant peaks -->
  <path d="M-20 600 L120 470 L240 540 L360 410 L480 500 L600 380 L760 470 L900 360 L1060 460 L1200 380 L1340 480 L1480 400 L1620 510 L1620 900 L-20 900 Z" fill="url(#farRange)" opacity="0.72"/>

  <!-- Mid range -->
  <path d="M-20 680 L160 560 L320 620 L480 500 L640 580 L820 480 L980 570 L1140 470 L1300 560 L1460 490 L1620 580 L1620 900 L-20 900 Z" fill="url(#midRange)" opacity="0.88"/>

  <!-- Hero: wine glass silhouette, centered ~(800,450), inside safe zone -->
  <g opacity="0.95">
    <!-- bowl outline -->
    <path d="M700 280 Q700 470 800 510 Q900 470 900 280 Z" fill="url(#glass)" stroke="#fef3ec" stroke-width="2.5" stroke-opacity="0.55"/>
    <!-- wine fill -->
    <path d="M722 360 Q730 460 800 495 Q870 460 878 360 Q800 380 722 360 Z" fill="url(#wine)" opacity="0.92"/>
    <!-- wine surface highlight -->
    <ellipse cx="800" cy="362" rx="78" ry="6" fill="#fbbf24" opacity="0.45"/>
    <!-- stem -->
    <path d="M797 510 L797 640 L803 640 L803 510 Z" fill="#fef3ec" opacity="0.5"/>
    <!-- base -->
    <ellipse cx="800" cy="645" rx="62" ry="8" fill="#fef3ec" opacity="0.55"/>
    <!-- subtle bowl highlight -->
    <path d="M720 295 Q716 380 740 450" stroke="#fef3ec" stroke-width="3" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Near range: foreground ridge wrapping below the glass base -->
  <path d="M-20 760 L180 700 L360 740 L540 680 L720 720 L800 705 L880 720 L1060 680 L1240 730 L1420 690 L1620 740 L1620 900 L-20 900 Z" fill="url(#nearRange)"/>

  <!-- Terraced vineyard suggestion: a few thin warm lines on near ridge -->
  <path d="M120 790 L520 770" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M140 820 L540 800" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <path d="M1080 790 L1480 770" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M1100 820 L1500 800" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
</svg>
