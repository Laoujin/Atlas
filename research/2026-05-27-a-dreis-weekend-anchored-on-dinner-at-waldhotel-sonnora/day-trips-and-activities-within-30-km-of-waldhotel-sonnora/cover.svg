<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="maar" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow low on horizon -->
  <circle cx="1180" cy="430" r="140" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1180" cy="430" r="80" fill="#fbbf24" opacity="0.55"/>

  <!-- far ridge (Eifel silhouette) -->
  <path d="M 0 520 L 180 460 L 340 490 L 520 430 L 720 470 L 920 420 L 1120 450 L 1320 410 L 1500 450 L 1600 430 L 1600 620 L 0 620 Z" fill="url(#farHill)" opacity="0.7"/>

  <!-- mid ridge with vineyard terraces -->
  <path d="M 0 600 L 220 540 L 460 580 L 700 520 L 980 560 L 1240 510 L 1480 550 L 1600 530 L 1600 750 L 0 750 Z" fill="url(#midHill)" opacity="0.88"/>

  <!-- vineyard terrace lines on mid ridge -->
  <path d="M 100 615 L 1500 575" stroke="#fef3ec" stroke-width="1.5" opacity="0.35" fill="none"/>
  <path d="M 80 640 L 1520 605" stroke="#fef3ec" stroke-width="1.5" opacity="0.3" fill="none"/>
  <path d="M 60 670 L 1540 635" stroke="#fef3ec" stroke-width="1.5" opacity="0.25" fill="none"/>

  <!-- Mosel river bend in foreground -->
  <path d="M 0 800 Q 300 730 600 770 Q 900 815 1200 760 Q 1400 725 1600 760 L 1600 820 Q 1400 790 1200 815 Q 900 855 600 815 Q 300 780 0 855 Z" fill="url(#river)" opacity="0.85"/>

  <!-- near hill cradling the river -->
  <path d="M 0 855 Q 400 800 800 830 Q 1200 860 1600 815 L 1600 900 L 0 900 Z" fill="url(#nearHill)"/>

  <!-- HERO: Maar crater lake, centered in safe zone -->
  <ellipse cx="800" cy="450" rx="260" ry="180" fill="#78350f" opacity="0.95"/>
  <ellipse cx="800" cy="450" rx="240" ry="162" fill="url(#maar)"/>
  <!-- subtle rim highlight -->
  <ellipse cx="800" cy="395" rx="180" ry="22" fill="#fef3ec" opacity="0.25"/>

  <!-- castle silhouette on a ridge to the left (Manderscheid) -->
  <g opacity="0.85">
    <rect x="340" y="475" width="22" height="55" fill="#1a0e0e"/>
    <rect x="368" y="460" width="32" height="70" fill="#1a0e0e"/>
    <polygon points="340,475 351,455 362,475" fill="#1a0e0e"/>
    <polygon points="368,460 384,438 400,460" fill="#1a0e0e"/>
    <rect x="406" y="490" width="18" height="40" fill="#1a0e0e"/>
    <polygon points="406,490 415,472 424,490" fill="#1a0e0e"/>
  </g>

  <!-- half-timbered village cluster to the right (Bernkastel-Kues) -->
  <g opacity="0.85">
    <rect x="1180" y="510" width="38" height="44" fill="#fef3ec"/>
    <polygon points="1180,510 1199,488 1218,510" fill="#9a3309"/>
    <line x1="1180" y1="528" x2="1218" y2="528" stroke="#78350f" stroke-width="1.2"/>
    <line x1="1199" y1="510" x2="1199" y2="554" stroke="#78350f" stroke-width="1.2"/>

    <rect x="1224" y="500" width="32" height="54" fill="#fef3ec"/>
    <polygon points="1224,500 1240,478 1256,500" fill="#9a3309"/>
    <line x1="1224" y1="522" x2="1256" y2="522" stroke="#78350f" stroke-width="1.2"/>

    <rect x="1262" y="515" width="30" height="39" fill="#fef3ec"/>
    <polygon points="1262,515 1277,495 1292,515" fill="#9a3309"/>
    <line x1="1262" y1="534" x2="1292" y2="534" stroke="#78350f" stroke-width="1.2"/>
  </g>
</svg>
