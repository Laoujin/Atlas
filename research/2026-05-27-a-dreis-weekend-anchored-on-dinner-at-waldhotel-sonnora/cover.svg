<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.42">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#2a1208"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#9a3309" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#fef3ec" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Culinary warm glow behind hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Far Eifel hills, soft layered ridgelines -->
  <path d="M0,620 L180,560 L360,600 L540,540 L740,590 L940,545 L1140,595 L1340,555 L1600,605 L1600,900 L0,900 Z" fill="url(#hill2)" opacity="0.85"/>

  <!-- Near vineyard slope -->
  <path d="M0,720 L220,680 L420,705 L640,665 L860,700 L1080,672 L1300,705 L1600,680 L1600,900 L0,900 Z" fill="url(#hill1)" opacity="0.78"/>

  <!-- Mosel river ribbon, low full-bleed -->
  <path d="M0,790 Q400,775 800,795 T1600,790 L1600,830 Q1200,815 800,830 T0,830 Z" fill="#fbbf24" opacity="0.18"/>

  <!-- Hero: wine glass, centered (800, 450), within safe zone -->
  <!-- Bowl -->
  <path d="M680,330 Q680,520 800,560 Q920,520 920,330 Z" fill="url(#wine)" opacity="0.9"/>
  <!-- Glass rim highlight -->
  <ellipse cx="800" cy="330" rx="120" ry="14" fill="#fef3ec" opacity="0.35"/>
  <!-- Wine surface meniscus -->
  <ellipse cx="800" cy="358" rx="116" ry="10" fill="#fbbf24" opacity="0.55"/>
  <!-- Glass body sheen -->
  <path d="M695,335 Q700,490 800,540 L800,560 Q680,520 680,335 Z" fill="url(#glass)" opacity="0.55"/>
  <!-- Stem -->
  <rect x="794" y="558" width="12" height="100" fill="#9a3309" opacity="0.85"/>
  <!-- Base -->
  <ellipse cx="800" cy="668" rx="78" ry="10" fill="#78350f" opacity="0.9"/>
  <ellipse cx="800" cy="664" rx="78" ry="6" fill="#c2410c" opacity="0.6"/>

  <!-- Single bright culinary "star" point, the Michelin anchor — small, behind glass top -->
  <circle cx="800" cy="240" r="4" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="240" r="14" fill="#fbbf24" opacity="0.25"/>
</svg>
