<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm radial glow behind lodge -->
    <radialGradient id="warmGlow" cx="50%" cy="55%" r="32%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Lodge body gradient -->
    <linearGradient id="lodgeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#4a1e08"/>
    </linearGradient>
    <!-- Roof gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c1a06"/>
    </linearGradient>
    <!-- Window glow -->
    <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Tree fill -->
    <linearGradient id="treeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1206"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Stars (sparse, decorative, outside hero safe zone top) -->
  <circle cx="260" cy="100" r="2" fill="#fef3ec" opacity="0.5"/>
  <circle cx="420" cy="155" r="1.5" fill="#fef3ec" opacity="0.4"/>
  <circle cx="610" cy="120" r="2" fill="#fef3ec" opacity="0.35"/>
  <circle cx="780" cy="95" r="1.5" fill="#fef3ec" opacity="0.5"/>
  <circle cx="980" cy="108" r="2" fill="#fef3ec" opacity="0.4"/>
  <circle cx="1150" cy="130" r="1.5" fill="#fef3ec" opacity="0.45"/>
  <circle cx="1340" cy="100" r="2" fill="#fef3ec" opacity="0.35"/>
  <circle cx="1490" cy="145" r="1.5" fill="#fef3ec" opacity="0.4"/>
  <circle cx="340" cy="78" r="1" fill="#fef3ec" opacity="0.3"/>
  <circle cx="1080" cy="72" r="1" fill="#fef3ec" opacity="0.3"/>

  <!-- Moon orb (upper right, decorative) -->
  <circle cx="1280" cy="185" r="72" fill="url(#moonGlow)" opacity="0.85"/>
  <circle cx="1280" cy="185" r="36" fill="#fef3ec" opacity="0.55"/>

  <!-- Warm glow behind lodge -->
  <rect width="1600" height="900" fill="url(#warmGlow)"/>

  <!-- Layer 2: Hero — Lodge building, centered ~800,450, safe zone compliant -->

  <!-- Annex / wing (left side, lower, gives depth) -->
  <rect x="540" y="540" width="180" height="160" rx="3" fill="url(#lodgeBody)" opacity="0.75"/>
  <!-- Annex roof -->
  <polygon points="520,540 740,540 630,460" fill="url(#roofGrad)" opacity="0.75"/>

  <!-- Main lodge body -->
  <rect x="630" y="480" width="370" height="220" rx="4" fill="url(#lodgeBody)" opacity="0.92"/>

  <!-- Main roof (peaked) -->
  <polygon points="590,480 1060,480 815,310" fill="url(#roofGrad)" opacity="0.92"/>

  <!-- Chimney -->
  <rect x="880" y="315" width="38" height="80" rx="3" fill="#5c1a06" opacity="0.85"/>
  <rect x="874" y="308" width="50" height="14" rx="2" fill="#78350f" opacity="0.8"/>

  <!-- Ground floor windows (three) -->
  <rect x="660" y="550" width="70" height="80" rx="4" fill="url(#winGlow)" opacity="0.88"/>
  <rect x="775" y="550" width="70" height="80" rx="4" fill="url(#winGlow)" opacity="0.82"/>
  <rect x="890" y="550" width="70" height="80" rx="4" fill="url(#winGlow)" opacity="0.88"/>

  <!-- Upper floor windows (two) -->
  <rect x="700" y="490" width="55" height="55" rx="3" fill="url(#winGlow)" opacity="0.72"/>
  <rect x="875" y="490" width="55" height="55" rx="3" fill="url(#winGlow)" opacity="0.72"/>

  <!-- Door -->
  <rect x="785" y="620" width="60" height="80" rx="3" fill="#2d1206" opacity="0.9"/>
  <rect x="789" y="624" width="52" height="72" rx="2" fill="#d97706" opacity="0.22"/>

  <!-- Door step -->
  <rect x="770" y="698" width="90" height="10" rx="2" fill="#4a1e08" opacity="0.8"/>

  <!-- Ground shadow under lodge -->
  <ellipse cx="810" cy="708" rx="280" ry="22" fill="#0d0604" opacity="0.45"/>

  <!-- Layer 3: Treeline silhouette (decorative, spans full width, lower portion) -->
  <!-- Left tree cluster -->
  <polygon points="130,900 210,680 290,900" fill="url(#treeFill)" opacity="0.88"/>
  <polygon points="200,900 295,650 390,900" fill="url(#treeFill)" opacity="0.82"/>
  <polygon points="280,900 375,695 470,900" fill="url(#treeFill)" opacity="0.78"/>
  <polygon points="350,900 440,720 530,900" fill="url(#treeFill)" opacity="0.72"/>

  <!-- Right tree cluster -->
  <polygon points="1080,900 1165,700 1250,900" fill="url(#treeFill)" opacity="0.72"/>
  <polygon points="1160,900 1255,655 1350,900" fill="url(#treeFill)" opacity="0.78"/>
  <polygon points="1250,900 1345,670 1440,900" fill="url(#treeFill)" opacity="0.82"/>
  <polygon points="1340,900 1430,690 1520,900" fill="url(#treeFill)" opacity="0.88"/>

  <!-- Ground band -->
  <rect x="0" y="820" width="1600" height="80" fill="#1a0a04" opacity="0.7"/>
</svg>
