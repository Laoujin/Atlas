<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal evening -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table glow -->
    <radialGradient id="tableGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Large plate gradient -->
    <radialGradient id="plateLarge" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c8b0"/>
    </radialGradient>
    <!-- Large plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Small accent plate gradient (rose-tinted) -->
    <radialGradient id="plateSmall" cx="45%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="65%" stop-color="#fde8d8"/>
      <stop offset="100%" stop-color="#e5c4b0"/>
    </radialGradient>
    <!-- Wine glass fill gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9a1555" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Food element on large plate -->
    <radialGradient id="foodGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Sauce swirl accent -->
    <radialGradient id="sauceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9a1555" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm ambient table glow -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Layer 3 (decorative, outside safe zone): subtle top vignette -->
  <rect width="1600" height="120" fill="#1a0e0e" opacity="0.45"/>
  <!-- Bottom vignette -->
  <rect y="780" width="1600" height="120" fill="#1a0e0e" opacity="0.45"/>

  <!-- Layer 2: Hero element — two overlapping plates + wine glass, centered ~(800, 450) -->

  <!-- Wine glass silhouette — positioned left of plates, within safe zone -->
  <!-- Glass bowl (ellipse) -->
  <ellipse cx="560" cy="390" rx="62" ry="72" fill="url(#glassGrad)" opacity="0.75"/>
  <!-- Glass bowl inner highlight -->
  <ellipse cx="548" cy="375" rx="22" ry="30" fill="#fef3ec" opacity="0.12"/>
  <!-- Glass stem -->
  <rect x="556" y="460" width="9" height="130" rx="4" fill="#be185d" opacity="0.55"/>
  <!-- Glass base -->
  <ellipse cx="560" cy="592" rx="40" ry="10" fill="#be185d" opacity="0.45"/>
  <!-- Wine surface inside glass -->
  <ellipse cx="560" cy="385" rx="55" ry="18" fill="#9a1555" opacity="0.5"/>

  <!-- Large plate (hero, centered ~820, 460) -->
  <ellipse cx="820" cy="460" rx="265" ry="265" fill="url(#plateLarge)" opacity="0.95"/>
  <!-- Plate rim shadow ring -->
  <ellipse cx="820" cy="460" rx="265" ry="265" fill="url(#plateRim)" opacity="1"/>
  <!-- Inner plate well -->
  <ellipse cx="820" cy="452" rx="205" ry="205" fill="#faf8f2" opacity="0.6"/>

  <!-- Food composition on large plate: abstract fine-dining arrangement -->
  <!-- Central protein form -->
  <ellipse cx="820" cy="445" rx="68" ry="52" fill="url(#foodGrad)" opacity="0.92"/>
  <!-- Sauce arc swirl — left side -->
  <path d="M 720 490 Q 760 430 810 420 Q 840 415 855 440" stroke="#be185d" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- Microgreens dot cluster (3 dots, abstract garnish) -->
  <circle cx="790" cy="398" r="6" fill="#d97706" opacity="0.85"/>
  <circle cx="808" cy="390" r="5" fill="#c2410c" opacity="0.8"/>
  <circle cx="826" cy="394" r="4" fill="#fbbf24" opacity="0.75"/>
  <!-- Sauce dot accent right -->
  <circle cx="880" cy="468" r="10" fill="#be185d" opacity="0.65"/>
  <circle cx="895" cy="452" r="6" fill="#be185d" opacity="0.45"/>

  <!-- Small accent plate (overlapping, offset right and slightly up) -->
  <ellipse cx="1060" cy="400" rx="148" ry="148" fill="url(#plateSmall)" opacity="0.88"/>
  <!-- Small plate rim -->
  <ellipse cx="1060" cy="400" rx="148" ry="148" fill="url(#plateRim)" opacity="0.7"/>
  <!-- Small plate inner well -->
  <ellipse cx="1060" cy="394" rx="112" ry="112" fill="#fef3ec" opacity="0.55"/>
  <!-- Food on small plate: amuse-bouche style — one central form -->
  <ellipse cx="1060" cy="390" rx="36" ry="28" fill="#c2410c" opacity="0.88"/>
  <ellipse cx="1055" cy="383" rx="14" ry="10" fill="#fbbf24" opacity="0.75"/>
  <!-- Single sauce dot -->
  <circle cx="1090" cy="415" r="7" fill="#9a3309" opacity="0.7"/>

</svg>
