<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2a0e08" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <!-- Table surface gradient -->
    <radialGradient id="tableGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient: warm rim light -->
    <radialGradient id="plateFill" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="plateWell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.05"/>
    </radialGradient>
    <!-- Star gradient: amber-rose -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Star halo -->
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Cloche accent -->
    <linearGradient id="clocheGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.06"/>
    </linearGradient>
    <!-- Rose accent gradient -->
    <radialGradient id="roseAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <!-- Rose accent halo — adds secondary hue depth -->
  <ellipse cx="800" cy="450" rx="620" ry="380" fill="url(#roseAccent)"/>
  <!-- Warm table surface scatter -->
  <ellipse cx="800" cy="580" rx="500" ry="160" fill="url(#tableGlow)"/>

  <!-- Layer 2: Hero element — centered within safe zone (x:125–1475, y:90–810) -->

  <!-- Plate outer rim -->
  <circle cx="800" cy="490" r="220" fill="url(#plateFill)" opacity="0.95"/>
  <!-- Plate rim accent ring -->
  <circle cx="800" cy="490" r="220" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.55"/>
  <!-- Plate inner well -->
  <circle cx="800" cy="490" r="168" fill="url(#plateWell)" opacity="1"/>
  <!-- Plate inner ring detail -->
  <circle cx="800" cy="490" r="168" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.35"/>

  <!-- Three Michelin stars arranged in a tight triangle above the plate -->
  <!-- Star helper: 5-pointed star polygon, each ~38px outer radius -->

  <!-- Star 1 — top center (800, 270) -->
  <ellipse cx="800" cy="270" rx="58" ry="58" fill="url(#starHalo)" opacity="0.8"/>
  <polygon
    points="800,232 810,258 838,258 816,274 824,300 800,285 776,300 784,274 762,258 790,258"
    fill="url(#starGlow)" opacity="0.97"/>

  <!-- Star 2 — lower left (700, 340) -->
  <ellipse cx="700" cy="340" rx="52" ry="52" fill="url(#starHalo)" opacity="0.7"/>
  <polygon
    points="700,305 709,329 734,329 714,344 722,368 700,354 678,368 686,344 666,329 691,329"
    fill="url(#starGlow)" opacity="0.92"/>

  <!-- Star 3 — lower right (900, 340) -->
  <ellipse cx="900" cy="340" rx="52" ry="52" fill="url(#starHalo)" opacity="0.7"/>
  <polygon
    points="900,305 909,329 934,329 914,344 922,368 900,354 878,368 886,344 866,329 891,329"
    fill="url(#starGlow)" opacity="0.92"/>

  <!-- Cloche dome silhouette above plate — decorative architectural accent -->
  <ellipse cx="800" cy="420" rx="180" ry="90" fill="url(#clocheGrad)" opacity="1"/>
  <path d="M 620,490 Q 800,330 980,490" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.10"/>

  <!-- Layer 3: Edge decorations (may be cropped — carry no meaning) -->
  <!-- Subtle corner warm glow patches -->
  <ellipse cx="0" cy="0" rx="260" ry="180" fill="#78350f" opacity="0.22"/>
  <ellipse cx="1600" cy="900" rx="260" ry="180" fill="#78350f" opacity="0.22"/>
  <!-- Full-bleed horizontal table line -->
  <rect x="0" y="608" width="1600" height="1" fill="#d97706" opacity="0.18"/>
  <!-- Candle-glow left and right (outside safe zone, atmospheric) -->
  <ellipse cx="220" cy="450" rx="90" ry="220" fill="#d97706" opacity="0.06"/>
  <ellipse cx="1380" cy="450" rx="90" ry="220" fill="#d97706" opacity="0.06"/>
</svg>
