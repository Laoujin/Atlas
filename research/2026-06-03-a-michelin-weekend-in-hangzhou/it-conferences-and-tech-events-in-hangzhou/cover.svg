<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric glow centred on hero -->
  <ellipse cx="800" cy="450" rx="520" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: hero element — network graph centred at (800, 450) -->

  <!-- Concentric orbit arcs -->
  <circle cx="800" cy="450" r="220" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.30"/>
  <circle cx="800" cy="450" r="340" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.22"/>
  <circle cx="800" cy="450" r="440" fill="none" stroke="#78350f" stroke-width="0.8" stroke-opacity="0.16"/>

  <!-- Connector lines: hub to satellites -->
  <line x1="800" y1="450" x2="590" y2="270" stroke="#d97706" stroke-width="1.8" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="1040" y2="240" stroke="#d97706" stroke-width="1.8" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="1130" y2="490" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.50"/>
  <line x1="800" y1="450" x2="980" y2="680" stroke="#d97706" stroke-width="1.8" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="560" y2="650" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.50"/>
  <line x1="800" y1="450" x2="460" y2="450" stroke="#d97706" stroke-width="1.4" stroke-opacity="0.40"/>

  <!-- Satellite-to-satellite cross links (secondary edges) -->
  <line x1="590" y1="270" x2="1040" y2="240" stroke="#9a3309" stroke-width="1" stroke-opacity="0.28"/>
  <line x1="1040" y1="240" x2="1130" y2="490" stroke="#9a3309" stroke-width="1" stroke-opacity="0.28"/>
  <line x1="1130" y1="490" x2="980" y2="680" stroke="#78350f" stroke-width="1" stroke-opacity="0.24"/>
  <line x1="980" y1="680" x2="560" y2="650" stroke="#78350f" stroke-width="1" stroke-opacity="0.24"/>
  <line x1="560" y1="650" x2="460" y2="450" stroke="#78350f" stroke-width="1" stroke-opacity="0.24"/>

  <!-- Satellite nodes -->
  <circle cx="590" cy="270" r="22" fill="url(#node)" opacity="0.82"/>
  <circle cx="590" cy="270" r="10" fill="#fbbf24" opacity="0.60"/>

  <circle cx="1040" cy="240" r="22" fill="url(#node)" opacity="0.82"/>
  <circle cx="1040" cy="240" r="10" fill="#fbbf24" opacity="0.60"/>

  <circle cx="1130" cy="490" r="26" fill="url(#node)" opacity="0.82"/>
  <circle cx="1130" cy="490" r="12" fill="#fbbf24" opacity="0.60"/>

  <circle cx="980" cy="680" r="22" fill="url(#node)" opacity="0.82"/>
  <circle cx="980" cy="680" r="10" fill="#fbbf24" opacity="0.60"/>

  <circle cx="560" cy="650" r="22" fill="url(#node)" opacity="0.82"/>
  <circle cx="560" cy="650" r="10" fill="#fbbf24" opacity="0.60"/>

  <circle cx="460" cy="450" r="18" fill="url(#node)" opacity="0.75"/>
  <circle cx="460" cy="450" r="8" fill="#fbbf24" opacity="0.55"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="68" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="44" fill="#fbbf24" opacity="0.18"/>
  <circle cx="800" cy="450" r="28" fill="#fbbf24" opacity="0.50"/>

  <!-- Layer 3: edge decoration (intentionally clipped on card/detail) -->
  <circle cx="0" cy="0" r="180" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.12"/>
  <circle cx="1600" cy="900" r="180" fill="none" stroke="#78350f" stroke-width="1" stroke-opacity="0.12"/>
</svg>
