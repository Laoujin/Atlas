<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Water reflection gradient -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </linearGradient>
    <!-- Moon glow radial -->
    <radialGradient id="moonGlow" cx="72%" cy="22%" r="22%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Lake glow radial -->
    <radialGradient id="lakeGlow" cx="50%" cy="62%" r="35%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Pagoda body gradient -->
    <linearGradient id="pagodaBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Roof gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#moonGlow)"/>

  <!-- Moon disc -->
  <circle cx="1152" cy="198" r="52" fill="#fbbf24" opacity="0.72"/>
  <circle cx="1152" cy="198" r="52" fill="url(#moonGlow)" opacity="0.3"/>

  <!-- Distant mountain silhouettes (left) -->
  <polygon points="0,560 160,340 320,520 480,310 640,540 640,600 0,600" fill="#3d1a0a" opacity="0.85"/>
  <!-- Distant mountain silhouettes (right) -->
  <polygon points="960,560 1100,320 1260,480 1420,350 1600,520 1600,600 960,600" fill="#3d1a0a" opacity="0.75"/>

  <!-- Mist band over mountains -->
  <rect x="0" y="530" width="1600" height="60" fill="#5c2a1a" opacity="0.30"/>

  <!-- Lake surface -->
  <rect x="0" y="590" width="1600" height="310" fill="url(#water)"/>
  <rect x="0" y="590" width="1600" height="310" fill="url(#lakeGlow)"/>

  <!-- Water shimmer lines -->
  <rect x="200" y="640" width="320" height="3" rx="2" fill="#d97706" opacity="0.18"/>
  <rect x="600" y="670" width="480" height="3" rx="2" fill="#d97706" opacity="0.14"/>
  <rect x="1100" y="650" width="280" height="3" rx="2" fill="#fbbf24" opacity="0.12"/>
  <rect x="300" y="710" width="200" height="2" rx="1" fill="#c2410c" opacity="0.15"/>
  <rect x="900" y="730" width="360" height="2" rx="1" fill="#d97706" opacity="0.12"/>

  <!-- Moon reflection in water -->
  <ellipse cx="1152" cy="720" rx="28" ry="60" fill="#fbbf24" opacity="0.18"/>

  <!-- ===== HERO: Pagoda centered at (800, 430) ===== -->
  <!-- Tier 5 (top) -->
  <polygon points="786,175 814,175 820,188 780,188" fill="url(#roofGrad)" opacity="0.92"/>
  <rect x="790" y="188" width="20" height="20" fill="url(#pagodaBody)" opacity="0.92"/>

  <!-- Tier 4 -->
  <polygon points="770,208 830,208 840,224 760,224" fill="url(#roofGrad)" opacity="0.92"/>
  <rect x="775" y="224" width="50" height="28" fill="url(#pagodaBody)" opacity="0.92"/>

  <!-- Tier 3 -->
  <polygon points="752,252 848,252 862,272 738,272" fill="url(#roofGrad)" opacity="0.92"/>
  <rect x="758" y="272" width="84" height="36" fill="url(#pagodaBody)" opacity="0.92"/>

  <!-- Tier 2 -->
  <polygon points="730,308 870,308 888,332 712,332" fill="url(#roofGrad)" opacity="0.92"/>
  <rect x="738" y="332" width="124" height="44" fill="url(#pagodaBody)" opacity="0.92"/>

  <!-- Tier 1 (base) -->
  <polygon points="704,376 896,376 918,406 682,406" fill="url(#roofGrad)" opacity="0.92"/>
  <rect x="714" y="406" width="172" height="56" fill="url(#pagodaBody)" opacity="0.92"/>

  <!-- Plinth -->
  <rect x="680" y="462" width="240" height="22" rx="3" fill="#78350f" opacity="0.95"/>

  <!-- Pagoda spire tip -->
  <line x1="800" y1="160" x2="800" y2="175" stroke="#fbbf24" stroke-width="3" opacity="0.85"/>
  <circle cx="800" cy="158" r="5" fill="#fbbf24" opacity="0.90"/>

  <!-- Eave accent dots (lantern-like) on roofs -->
  <circle cx="762" cy="222" r="4" fill="#fbbf24" opacity="0.65"/>
  <circle cx="838" cy="222" r="4" fill="#fbbf24" opacity="0.65"/>
  <circle cx="740" cy="270" r="4" fill="#d97706" opacity="0.55"/>
  <circle cx="860" cy="270" r="4" fill="#d97706" opacity="0.55"/>
  <circle cx="714" cy="330" r="4" fill="#d97706" opacity="0.50"/>
  <circle cx="886" cy="330" r="4" fill="#d97706" opacity="0.50"/>
  <circle cx="684" cy="404" r="4" fill="#c2410c" opacity="0.50"/>
  <circle cx="916" cy="404" r="4" fill="#c2410c" opacity="0.50"/>

  <!-- Pagoda reflection in lake (mirror, lower opacity) -->
  <polygon points="704,590 896,590 882,564 718,564" fill="#c2410c" opacity="0.14"/>
  <rect x="714" y="544" width="172" height="20" fill="#9a3309" opacity="0.14"/>
  <polygon points="730,544 870,544 856,524 744,524" fill="#c2410c" opacity="0.11"/>
  <rect x="738" y="508" width="124" height="16" fill="#9a3309" opacity="0.11"/>
  <polygon points="752,508 848,508 838,492 762,492" fill="#c2410c" opacity="0.09"/>

  <!-- Causeway / bridge hint extending from pagoda base -->
  <rect x="500" y="479" width="600" height="10" rx="5" fill="#78350f" opacity="0.50"/>
  <rect x="500" y="479" width="600" height="10" rx="5" fill="#d97706" opacity="0.12"/>

  <!-- Willow fronds left -->
  <path d="M300,430 Q260,500 240,590" stroke="#78350f" stroke-width="3" fill="none" opacity="0.55"/>
  <path d="M310,410 Q280,490 265,580" stroke="#9a3309" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M325,420 Q310,510 295,600" stroke="#78350f" stroke-width="2" fill="none" opacity="0.40"/>

  <!-- Willow fronds right -->
  <path d="M1300,430 Q1340,500 1360,590" stroke="#78350f" stroke-width="3" fill="none" opacity="0.55"/>
  <path d="M1290,410 Q1320,490 1335,580" stroke="#9a3309" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M1275,420 Q1290,510 1305,600" stroke="#78350f" stroke-width="2" fill="none" opacity="0.40"/>
</svg>
