<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="45%" stop-color="#5c2a1a"/>
      <stop offset="80%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3a1a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed twilight sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="540" rx="900" ry="380" fill="url(#glow)"/>

  <!-- Far ridge -->
  <path d="M0 560 L120 530 L240 545 L360 510 L500 540 L640 515 L780 535 L920 505 L1060 530 L1200 510 L1340 540 L1480 520 L1600 535 L1600 900 L0 900 Z"
        fill="#5c2a1a" opacity="0.75"/>

  <!-- Mid layer: fir silhouettes -->
  <g fill="#3a1a0c" opacity="0.85">
    <polygon points="180,640 210,560 240,640"/>
    <polygon points="260,650 295,555 330,650"/>
    <polygon points="350,645 380,575 410,645"/>
    <polygon points="430,655 470,545 510,655"/>
    <polygon points="540,650 575,560 610,650"/>
    <polygon points="640,660 680,540 720,660"/>
    <polygon points="760,655 795,565 830,655"/>
    <polygon points="870,660 910,550 950,660"/>
    <polygon points="990,650 1025,560 1060,650"/>
    <polygon points="1090,660 1130,545 1170,660"/>
    <polygon points="1200,655 1235,565 1270,655"/>
    <polygon points="1310,660 1350,550 1390,660"/>
    <polygon points="1420,650 1455,560 1490,650"/>
  </g>

  <!-- Near layer: taller foreground firs -->
  <g fill="#1a0e0e" opacity="0.95">
    <polygon points="80,820 130,650 180,820"/>
    <polygon points="200,830 260,620 320,830"/>
    <polygon points="340,815 395,665 450,815"/>
    <polygon points="470,830 535,610 600,830"/>
    <polygon points="620,820 680,645 740,820"/>
    <polygon points="760,835 830,600 900,835"/>
    <polygon points="920,820 980,640 1040,820"/>
    <polygon points="1060,830 1125,615 1190,830"/>
    <polygon points="1210,820 1270,650 1330,820"/>
    <polygon points="1350,830 1415,620 1480,830"/>
    <polygon points="1500,820 1555,660 1610,820"/>
  </g>

  <!-- Two understated stars hovering above the ridges -->
  <g>
    <circle cx="640" cy="240" r="70" fill="url(#star)" opacity="0.55"/>
    <polygon points="640,210 647,233 670,233 651,247 658,270 640,256 622,270 629,247 610,233 633,233"
             fill="#fef3ec" opacity="0.9"/>

    <circle cx="980" cy="200" r="70" fill="url(#star)" opacity="0.55"/>
    <polygon points="980,170 987,193 1010,193 991,207 998,230 980,216 962,230 969,207 950,193 973,193"
             fill="#fef3ec" opacity="0.9"/>
  </g>
</svg>
