<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chimney" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind chimneys -->
  <circle cx="800" cy="560" r="420" fill="url(#sun)"/>

  <!-- tech/conference layer: faint orbital arcs + nodes above the skyline -->
  <g stroke="#fbbf24" fill="none" opacity="0.35">
    <path d="M 360 360 Q 800 200 1240 360" stroke-width="1.4"/>
    <path d="M 440 300 Q 800 160 1160 300" stroke-width="1"/>
  </g>
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="360" cy="360" r="5"/>
    <circle cx="560" cy="248" r="4"/>
    <circle cx="800" cy="200" r="6"/>
    <circle cx="1040" cy="248" r="4"/>
    <circle cx="1240" cy="360" r="5"/>
  </g>
  <g stroke="#fbbf24" stroke-width="0.8" opacity="0.45">
    <line x1="360" y1="360" x2="800" y2="200"/>
    <line x1="800" y1="200" x2="1240" y2="360"/>
    <line x1="560" y1="248" x2="1040" y2="248"/>
  </g>

  <!-- smoke wisps trailing right (atmospheric) -->
  <path d="M 660 470 Q 700 380 690 280 Q 685 220 700 170" stroke="url(#smoke)" stroke-width="38" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 780 470 Q 815 390 808 290" stroke="url(#smoke)" stroke-width="34" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- VW plant skyline: four chimneys, the city's signature silhouette -->
  <g fill="url(#chimney)">
    <rect x="640" y="470" width="44" height="280"/>
    <rect x="760" y="470" width="44" height="280"/>
    <rect x="880" y="470" width="44" height="280"/>
    <rect x="1000" y="470" width="44" height="280"/>
  </g>
  <!-- chimney caps -->
  <g fill="#0e1a26">
    <rect x="634" y="464" width="56" height="14"/>
    <rect x="754" y="464" width="56" height="14"/>
    <rect x="874" y="464" width="56" height="14"/>
    <rect x="994" y="464" width="56" height="14"/>
  </g>

  <!-- low industrial hall base running across -->
  <rect x="380" y="700" width="900" height="80" fill="#1a0e0e" opacity="0.95"/>
  <rect x="380" y="700" width="900" height="6" fill="#334155" opacity="0.7"/>

  <!-- a single warm LED dot on the hall (tech accent) -->
  <circle cx="1180" cy="735" r="4" fill="#fbbf24" opacity="0.9"/>

  <!-- foreground ground band, full-bleed -->
  <rect x="0" y="780" width="1600" height="120" fill="#0d0707"/>
  <rect x="0" y="780" width="1600" height="3" fill="#c2410c" opacity="0.5"/>
</svg>
