<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.75" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun disc, sits on the horizon -->
  <circle cx="800" cy="540" r="220" fill="url(#sun)" opacity="0.95"/>
  <circle cx="800" cy="540" r="110" fill="#fbbf24" opacity="0.85"/>

  <!-- distant softer ridge -->
  <path d="M0 560 L180 560 L210 540 L320 540 L340 555 L520 555 L540 525 L720 525 L740 545 L900 545 L920 530 L1080 530 L1100 550 L1280 550 L1300 535 L1460 535 L1480 555 L1600 555 L1600 600 L0 600 Z"
        fill="#3a1a10" opacity="0.55"/>

  <!-- main industrial silhouette: Autostadt towers, factory stacks, Phaeno mass -->
  <path d="M0 600
           L0 540 L60 540 L60 600
           L140 600 L140 480 L180 480 L180 600
           L240 600 L240 510 L260 510 L260 600
           L360 600 L360 450 L400 450 L400 460 L440 460 L440 450 L480 450 L480 600
           L560 600 L560 430 L580 430 L580 380 L600 380 L600 430 L620 430 L620 600
           L700 600 L700 470 L740 470 L740 600
           L760 600 L760 420 L780 420 L780 410 L820 410 L820 420 L840 420 L840 600
           L920 600 L920 460 L1000 460 L1000 600
           L1080 600 L1080 440 L1100 440 L1100 390 L1120 390 L1120 440 L1140 440 L1140 600
           L1220 600 L1220 480 L1280 480 L1280 600
           L1340 600 L1340 500 L1360 500 L1360 470 L1400 470 L1400 500 L1420 500 L1420 600
           L1500 600 L1500 530 L1540 530 L1540 600
           L1600 600 L1600 620 L0 620 Z"
        fill="url(#silhouette)"/>

  <!-- a few warm window dots on the silhouette -->
  <circle cx="170" cy="520" r="3" fill="#fbbf24" opacity="0.85"/>
  <circle cx="395" cy="490" r="3" fill="#fbbf24" opacity="0.85"/>
  <circle cx="465" cy="500" r="3" fill="#d97706" opacity="0.8"/>
  <circle cx="590" cy="410" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="775" cy="450" r="3" fill="#d97706" opacity="0.85"/>
  <circle cx="950" cy="500" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="1110" cy="420" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="1250" cy="510" r="3" fill="#d97706" opacity="0.8"/>
  <circle cx="1380" cy="490" r="3" fill="#fbbf24" opacity="0.85"/>

  <!-- water -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#water)"/>

  <!-- sun reflection column -->
  <rect x="700" y="620" width="200" height="280" fill="url(#reflect)"/>

  <!-- horizontal water ripples -->
  <rect x="200" y="660" width="1200" height="2" fill="#d97706" opacity="0.35"/>
  <rect x="350" y="700" width="900" height="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="150" y="740" width="1300" height="2" fill="#c2410c" opacity="0.4"/>
  <rect x="400" y="780" width="800" height="2" fill="#d97706" opacity="0.25"/>
  <rect x="250" y="820" width="1100" height="2" fill="#9a3309" opacity="0.35"/>
  <rect x="500" y="860" width="600" height="2" fill="#fbbf24" opacity="0.2"/>

  <!-- inverted faint reflection of central silhouette -->
  <path d="M560 620 L560 720 L620 720 L620 620 Z
           M760 620 L760 740 L840 740 L840 620 Z
           M1080 620 L1080 730 L1140 730 L1140 620 Z"
        fill="#1a0e0e" opacity="0.5"/>
</svg>
