<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2a1410"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="plate2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#f0eadb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Back plate (smaller, offset) -->
  <ellipse cx="1050" cy="510" rx="280" ry="70" fill="url(#plate2)" opacity="0.75"/>
  <ellipse cx="1050" cy="500" rx="280" ry="70" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6"/>
  <ellipse cx="1050" cy="500" rx="210" ry="52" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.5"/>

  <!-- Front plate (hero) -->
  <ellipse cx="700" cy="560" rx="360" ry="90" fill="#78350f" opacity="0.5"/>
  <ellipse cx="700" cy="550" rx="360" ry="90" fill="url(#plate)"/>
  <ellipse cx="700" cy="550" rx="360" ry="90" fill="none" stroke="#9a3309" stroke-width="2.5" opacity="0.75"/>
  <ellipse cx="700" cy="550" rx="280" ry="68" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.55"/>

  <!-- Tiny garnish dots on front plate -->
  <circle cx="650" cy="540" r="8" fill="#9a3309" opacity="0.85"/>
  <circle cx="720" cy="555" r="6" fill="#c2410c" opacity="0.9"/>
  <circle cx="690" cy="530" r="4" fill="#fbbf24" opacity="0.85"/>
  <circle cx="740" cy="540" r="3" fill="#d97706" opacity="0.9"/>

  <!-- Wine glass silhouette accent -->
  <path d="M 1180 250
           C 1180 360, 1260 380, 1260 430
           L 1260 560
           L 1230 580
           L 1290 580
           L 1260 560
           L 1260 430
           C 1260 380, 1340 360, 1340 250
           C 1340 250, 1260 270, 1180 250 Z"
        fill="url(#glass)" opacity="0.85"/>
  <path d="M 1195 265
           C 1200 320, 1250 345, 1255 385"
        fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- Steam / aroma wisps from front plate -->
  <path d="M 640 480 C 630 430, 660 400, 645 350" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  <path d="M 700 470 C 715 420, 685 390, 705 340" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <path d="M 760 480 C 770 430, 745 405, 755 360" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <!-- Corner candle-glow flecks (decoration, croppable) -->
  <circle cx="120" cy="180" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1500" cy="780" r="4" fill="#d97706" opacity="0.55"/>
  <circle cx="220" cy="800" r="2.5" fill="#fbbf24" opacity="0.5"/>
</svg>
