<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- outer taxi radius -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#c2410c" stroke-opacity="0.35" stroke-width="2"/>
  <!-- inner taxi radius -->
  <circle cx="800" cy="450" r="200" fill="none" stroke="#9a3309" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- connector lines from hub to satellites -->
  <g stroke="#78350f" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <line x1="800" y1="450" x2="510" y2="295"/>
    <line x1="800" y1="450" x2="1110" y2="305"/>
    <line x1="800" y1="450" x2="450" y2="610"/>
    <line x1="800" y1="450" x2="1135" y2="620"/>
  </g>

  <!-- satellite lodgings -->
  <circle cx="510" cy="295" r="24" fill="url(#node)" opacity="0.92"/>
  <circle cx="1110" cy="305" r="20" fill="url(#node)" opacity="0.88"/>
  <circle cx="450" cy="610" r="22" fill="url(#node)" opacity="0.9"/>
  <circle cx="1135" cy="620" r="26" fill="url(#node)" opacity="0.92"/>

  <!-- hero: Castor hub -->
  <circle cx="800" cy="450" r="78" fill="url(#hub)" opacity="0.95"/>
  <!-- star accent (two-Michelin) — abstract burst, no letters -->
  <g transform="translate(800 450)" fill="#fef3ec" opacity="0.85">
    <polygon points="0,-46 11,-14 44,-14 17,5 27,37 0,18 -27,37 -17,5 -44,-14 -11,-14"/>
  </g>
  <circle cx="800" cy="450" r="78" fill="none" stroke="#78350f" stroke-opacity="0.6" stroke-width="2"/>
</svg>
