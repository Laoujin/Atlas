<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="pinHole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm radial glow behind pin -->
  <circle cx="800" cy="460" r="520" fill="url(#glow)"/>

  <!-- Concentric radius rings (30 km, 20 km, 10 km) -->
  <ellipse cx="800" cy="640" rx="560" ry="150" fill="none" stroke="#c2410c" stroke-opacity="0.28" stroke-width="2"/>
  <ellipse cx="800" cy="640" rx="380" ry="102" fill="none" stroke="#c2410c" stroke-opacity="0.38" stroke-width="2"/>
  <ellipse cx="800" cy="640" rx="210" ry="56" fill="none" stroke="#9a3309" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- Event markers on the outer rings (small rust dots, varied) -->
  <circle cx="445" cy="610" r="10" fill="#9a3309" opacity="0.85"/>
  <circle cx="1180" cy="585" r="12" fill="#c2410c" opacity="0.9"/>
  <circle cx="1330" cy="660" r="8"  fill="#78350f" opacity="0.8"/>
  <circle cx="295" cy="675" r="9"  fill="#c2410c" opacity="0.85"/>
  <circle cx="620" cy="588" r="7"  fill="#9a3309" opacity="0.75"/>
  <circle cx="985" cy="588" r="8"  fill="#9a3309" opacity="0.8"/>

  <!-- Faint connecting paths from pin to two markers (event ties) -->
  <path d="M800 555 Q 970 540 1180 585" fill="none" stroke="#c2410c" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 6"/>
  <path d="M800 555 Q 620 540 445 610" fill="none" stroke="#c2410c" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- HERO: map pin centered at (800, 450), inside safe zone -->
  <!-- Pin shadow on ground -->
  <ellipse cx="800" cy="648" rx="60" ry="10" fill="#78350f" opacity="0.35"/>

  <!-- Pin body: teardrop -->
  <path d="M800 270
           C 700 270 640 350 640 430
           C 640 510 720 565 795 638
           C 798 642 802 642 805 638
           C 880 565 960 510 960 430
           C 960 350 900 270 800 270 Z"
        fill="url(#pin)" opacity="0.95"/>

  <!-- Pin inner hole -->
  <circle cx="800" cy="420" r="58" fill="url(#pinHole)" opacity="0.92"/>
  <circle cx="800" cy="420" r="58" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Tiny tech node inside the hole (small bright dot = Castor) -->
  <circle cx="800" cy="420" r="9" fill="#fbbf24"/>
</svg>
