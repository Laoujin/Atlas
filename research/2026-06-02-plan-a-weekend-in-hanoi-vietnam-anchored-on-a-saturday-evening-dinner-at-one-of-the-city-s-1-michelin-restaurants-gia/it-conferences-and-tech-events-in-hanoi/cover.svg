<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1608"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3b1608"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3: Corner decoration (outside safe zone, atmospheric) -->
  <rect x="-40" y="-40" width="220" height="4" fill="#c2410c" opacity="0.18" transform="rotate(30 0 0)"/>
  <rect x="1420" y="860" width="260" height="4" fill="#d97706" opacity="0.15" transform="rotate(-15 1600 900)"/>

  <!-- Layer 2: Hero element — stacked angled event-card rectangles centered ~(800,450) -->

  <!-- Back card (bottom layer) -->
  <rect x="480" y="310" width="560" height="320" rx="10"
        fill="url(#card2)" opacity="0.62"
        transform="rotate(-6 760 470)"/>

  <!-- Middle card -->
  <rect x="510" y="295" width="560" height="320" rx="10"
        fill="url(#card1)" opacity="0.78"
        transform="rotate(2 790 455)"/>

  <!-- Front card (hero) -->
  <rect x="540" y="280" width="540" height="310" rx="10"
        fill="url(#card3)" opacity="0.92"
        transform="rotate(-1 810 435)"/>

  <!-- Content bars on front card — decorative line-items suggesting a schedule/agenda -->
  <rect x="575" y="320" width="300" height="14" rx="4" fill="#fbbf24" opacity="0.70"/>
  <rect x="575" y="350" width="220" height="10" rx="3" fill="#fef3ec" opacity="0.35"/>
  <rect x="575" y="370" width="260" height="10" rx="3" fill="#fef3ec" opacity="0.28"/>
  <rect x="575" y="400" width="180" height="10" rx="3" fill="#fef3ec" opacity="0.28"/>

  <!-- Divider line on front card -->
  <rect x="575" y="425" width="460" height="2" rx="1" fill="#fbbf24" opacity="0.30"/>

  <!-- Lower content bars -->
  <rect x="575" y="443" width="240" height="10" rx="3" fill="#fef3ec" opacity="0.25"/>
  <rect x="575" y="461" width="200" height="10" rx="3" fill="#fef3ec" opacity="0.22"/>
  <rect x="575" y="479" width="280" height="10" rx="3" fill="#fef3ec" opacity="0.22"/>

  <!-- Network nodes suggesting connected tech community -->
  <!-- Central node -->
  <circle cx="1100" cy="440" r="32" fill="#c2410c" opacity="0.88"/>
  <circle cx="1100" cy="440" r="20" fill="#fbbf24" opacity="0.70"/>

  <!-- Satellite nodes -->
  <circle cx="1190" cy="340" r="16" fill="#9a3309" opacity="0.80"/>
  <circle cx="1215" cy="480" r="12" fill="#d97706" opacity="0.75"/>
  <circle cx="1100" cy="560" r="18" fill="#78350f" opacity="0.78"/>

  <!-- Connecting edges -->
  <line x1="1100" y1="440" x2="1190" y2="340" stroke="#d97706" stroke-width="2" opacity="0.45"/>
  <line x1="1100" y1="440" x2="1215" y2="480" stroke="#d97706" stroke-width="2" opacity="0.40"/>
  <line x1="1100" y1="440" x2="1100" y2="560" stroke="#d97706" stroke-width="2" opacity="0.40"/>
  <line x1="1190" y1="340" x2="1215" y2="480" stroke="#c2410c" stroke-width="1.5" opacity="0.28"/>

</svg>
