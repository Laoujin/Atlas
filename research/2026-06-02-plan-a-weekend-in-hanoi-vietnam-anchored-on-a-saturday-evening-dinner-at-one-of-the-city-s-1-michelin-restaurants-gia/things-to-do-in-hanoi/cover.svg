<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="bowlInner" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </radialGradient>
    <linearGradient id="bowlOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fef3ec" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fef3ec" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Decorative pagoda silhouette (outside safe zone, lower-left edge) -->
  <g opacity="0.22" fill="#1a0e0e">
    <rect x="60" y="780" width="180" height="120"/>
    <polygon points="40,780 260,780 230,740 70,740"/>
    <rect x="120" y="700" width="60" height="40"/>
    <polygon points="100,700 200,700 180,670 120,670"/>
  </g>

  <!-- Decorative lantern dots along top edge (cropped variably) -->
  <g opacity="0.45">
    <circle cx="180" cy="60" r="18" fill="#be185d"/>
    <circle cx="320" cy="40" r="12" fill="#d97706"/>
    <circle cx="1420" cy="70" r="16" fill="#be185d"/>
    <circle cx="1520" cy="40" r="10" fill="#fbbf24"/>
  </g>

  <!-- Steam rising from bowl (within safe zone, above bowl) -->
  <g opacity="0.7">
    <path d="M 720 250 Q 700 200 730 160 Q 760 120 730 90" stroke="url(#steam)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 800 240 Q 830 190 800 150 Q 770 110 810 80" stroke="url(#steam)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 880 250 Q 860 200 890 160 Q 920 130 880 100" stroke="url(#steam)" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Chopsticks crossing behind the bowl (hero accent) -->
  <g transform="rotate(-18 800 450)">
    <rect x="500" y="430" width="600" height="14" rx="3" fill="url(#chop)" opacity="0.9"/>
    <rect x="500" y="460" width="600" height="14" rx="3" fill="url(#chop)" opacity="0.85"/>
  </g>

  <!-- Pho bowl: hero centered at (800, 500) -->
  <!-- Outer rim shadow / base -->
  <ellipse cx="800" cy="640" rx="360" ry="60" fill="#1a0e0e" opacity="0.7"/>
  <!-- Bowl body -->
  <path d="M 460 460 Q 460 680 800 700 Q 1140 680 1140 460 Z" fill="url(#bowlOuter)"/>
  <!-- Rust accent ring around rim -->
  <ellipse cx="800" cy="460" rx="340" ry="60" fill="#c2410c" opacity="0.95"/>
  <!-- Bowl interior (broth) -->
  <ellipse cx="800" cy="460" rx="310" ry="48" fill="url(#bowlInner)"/>
  <!-- Broth highlights -->
  <ellipse cx="720" cy="448" rx="80" ry="10" fill="#fbbf24" opacity="0.45"/>
  <ellipse cx="880" cy="468" rx="60" ry="6" fill="#fef3ec" opacity="0.3"/>

  <!-- Star anise / garnish dot on broth -->
  <circle cx="850" cy="455" r="14" fill="#78350f" opacity="0.9"/>
  <circle cx="850" cy="455" r="6" fill="#fbbf24" opacity="0.6"/>

  <!-- Rose accent: a small Michelin-evoking flourish (single ribbon arc) inside safe zone -->
  <path d="M 1180 360 Q 1260 320 1300 380 Q 1280 420 1220 410" stroke="#be185d" stroke-width="8" fill="none" opacity="0.75" stroke-linecap="round"/>
</svg>
