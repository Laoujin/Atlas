<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1206"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Radial glow behind gauge hub -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#9a3309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub fill -->
    <radialGradient id="hub" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Arc outer violet glow -->
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Faint grid decoration — low opacity, spans full bleed (atmospheric) -->
  <g opacity="0.055" stroke="#c2410c" stroke-width="1" fill="none">
    <line x1="0"    y1="150" x2="1600" y2="150"/>
    <line x1="0"    y1="300" x2="1600" y2="300"/>
    <line x1="0"    y1="450" x2="1600" y2="450"/>
    <line x1="0"    y1="600" x2="1600" y2="600"/>
    <line x1="0"    y1="750" x2="1600" y2="750"/>
    <line x1="200"  y1="0"   x2="200"  y2="900"/>
    <line x1="400"  y1="0"   x2="400"  y2="900"/>
    <line x1="600"  y1="0"   x2="600"  y2="900"/>
    <line x1="800"  y1="0"   x2="800"  y2="900"/>
    <line x1="1000" y1="0"   x2="1000" y2="900"/>
    <line x1="1200" y1="0"   x2="1200" y2="900"/>
    <line x1="1400" y1="0"   x2="1400" y2="900"/>
  </g>

  <!-- Layer 2: Hero element — gauge/benchmarking dial centered at (800,450) -->

  <!-- Radial glow behind the whole gauge -->
  <ellipse cx="800" cy="450" rx="480" ry="380" fill="url(#glow)" opacity="0.9"/>
  <!-- Violet outer atmospheric glow -->
  <ellipse cx="800" cy="450" rx="520" ry="420" fill="url(#violetGlow)" opacity="0.8"/>

  <!-- Outer arc ring — violet, 210° gauge sweep (–210° to 30° = left to right) -->
  <!-- Arc from 210° to 330°: start=(800+340·cos(210°), 450+340·sin(210°)) end=(800+340·cos(330°), 450+340·sin(330°)) -->
  <!-- cos(210°)=−0.866, sin(210°)=−0.5 → (505.6, 280)  cos(330°)=0.866, sin(330°)=−0.5 → (1094.4, 280) -->
  <!-- Use large-arc=1 for the 300° sweep going clockwise through the bottom: actually we want top-open gauge -->
  <!-- Gauge open at top: sweep from 210° to 330° clockwise = 120° — that's the open notch -->
  <!-- The filled arc goes from 330° clockwise 240° to 210° — large-arc=1, sweep=1 -->
  <!-- Start at 330°: (800+340·0.866, 450+340·(−0.5)) = (1094.4, 280) -->
  <!-- End at 210°:   (800+340·(−0.866), 450+340·(−0.5)) = (505.6, 280) -->
  <path d="M 1094.4 280 A 340 340 0 1 1 505.6 280"
        fill="none" stroke="#6d28d9" stroke-width="18" stroke-linecap="round" opacity="0.75"/>

  <!-- Mid arc ring — rust amber, smaller radius 250, same angular span -->
  <!-- Start at 330°: (800+250·0.866, 450+250·(−0.5)) = (1016.5, 325) -->
  <!-- End at 210°:   (800+250·(−0.866), 450+250·(−0.5)) = (583.5, 325) -->
  <path d="M 1016.5 325 A 250 250 0 1 1 583.5 325"
        fill="none" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

  <!-- Inner arc ring — amber, radius 165 -->
  <!-- Start at 330°: (800+165·0.866, 450+165·(−0.5)) = (942.9, 367.5) -->
  <!-- End at 210°:   (800+165·(−0.866), 450+165·(−0.5)) = (657.1, 367.5) -->
  <path d="M 942.9 367.5 A 165 165 0 1 1 657.1 367.5"
        fill="none" stroke="#d97706" stroke-width="10" stroke-linecap="round" opacity="0.80"/>

  <!-- Gauge fill: progress indicator on outer arc — ~75% complete (violet bright) -->
  <!-- 75% of 240° = 180°. Start at 330°, go 180° clockwise → end at 150° -->
  <!-- 330°+180°=510°=150°. cos(150°)=−0.866, sin(150°)=0.5 → (800−294.4, 450+170) = (505.6, 620) -->
  <path d="M 1094.4 280 A 340 340 0 1 1 505.6 620"
        fill="none" stroke="#7c3aed" stroke-width="18" stroke-linecap="round" opacity="0.55"/>

  <!-- Gauge fill: progress on mid arc — ~55% complete (rust bright) -->
  <!-- 55% of 240° = 132°. Start at 330°+132°=462°=102°. cos(102°)=−0.208, sin(102°)=0.978 -->
  <!-- (800+250·(−0.208), 450+250·0.978) = (748, 694.5) -->
  <path d="M 1016.5 325 A 250 250 0 0 1 748 694.5"
        fill="none" stroke="#ea580c" stroke-width="14" stroke-linecap="round" opacity="0.65"/>

  <!-- Needle: points to ~75% mark on outer arc — 330°+0.75×240°=330°+180°=510°=150° clockwise from start -->
  <!-- Needle tip at 150° on r=310: (800+310·cos(150°), 450+310·sin(150°))=(800−268.5,450+155)=(531.5,605) -->
  <!-- But gauge math: 330° is start, sweep clockwise. 75% along = angle 330°+180°=510° mod 360°=150° -->
  <!-- That's lower-left. Let's place needle pointing to ~65° past 9-o-clock going up: -->
  <!-- Needle points at angle: the gauge goes from 330° clockwise 240° to 210°. -->
  <!-- 60% position: 330° + 0.60×240° = 330°+144°=474°=114°. cos(114°)=−0.407, sin(114°)=0.914 -->
  <!-- tip at r=290: (800+290·(−0.407), 450+290·0.914) = (682.0, 715.1) — too low -->
  <!-- Gauge orientation: "start" at 330° (right side, below center) sweep clockwise: down, left, up, back -->
  <!-- Actually a standard gauge has open top. Let's reconsider angle mapping. -->
  <!-- Open notch: 210° to 330° (top arc, 120°). Gauge runs from 330° (lower-right) CCW to 210° (lower-left). -->
  <!-- For CCW sweep: path with sweep-flag=0 from 330° to 210°. Let me recompute with CCW. -->
  <!-- 0% = 330° (lower-right), 100% = 210° (lower-left), going counter-clockwise through bottom/left/top/right. -->
  <!-- 60%: 330° − 0.60×240° = 330°−144° = 186°. cos(186°)=−0.995, sin(186°)=−0.105 -->
  <!-- Needle tip at r=290: (800+290·(−0.995), 450+290·(−0.105)) = (511.5, 419.6) -->
  <!-- Hub center to tip -->
  <line x1="800" y1="450" x2="512" y2="420"
        stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  <!-- Needle counterweight (short, opposite direction) -->
  <!-- Opposite of 186° is 6°: cos(6°)=0.995, sin(6°)=0.105. Counterweight at r=60 -->
  <line x1="800" y1="450" x2="860" y2="456"
        stroke="#fbbf24" stroke-width="9" stroke-linecap="round" opacity="0.70"/>

  <!-- Hub circle (center of gauge) -->
  <circle cx="800" cy="450" r="32" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="18" fill="#1a0e0e" opacity="0.80"/>
  <circle cx="800" cy="450" r="7"  fill="#fbbf24" opacity="1.0"/>

  <!-- Node dots at arc endpoints and at key benchmark positions -->
  <!-- Outer arc start (330°, r=340): (1094.4, 280) -->
  <circle cx="1094.4" cy="280"   r="10" fill="#6d28d9" opacity="0.85"/>
  <!-- Outer arc end (210°, r=340): (505.6, 280) -->
  <circle cx="505.6"  cy="280"   r="10" fill="#6d28d9" opacity="0.85"/>
  <!-- Mid arc start (330°, r=250): (1016.5, 325) -->
  <circle cx="1016.5" cy="325"   r="8"  fill="#c2410c" opacity="0.80"/>
  <!-- Mid arc end (210°, r=250): (583.5, 325) -->
  <circle cx="583.5"  cy="325"   r="8"  fill="#c2410c" opacity="0.80"/>
  <!-- Inner arc endpoints -->
  <circle cx="942.9"  cy="367.5" r="6"  fill="#d97706" opacity="0.75"/>
  <circle cx="657.1"  cy="367.5" r="6"  fill="#d97706" opacity="0.75"/>

  <!-- Tick marks on outer arc: 5 evenly spaced at 0%,25%,50%,75%,100% of 240° CCW from 330° -->
  <!-- 0%=330°: (1094.4,280) already a node -->
  <!-- 25%=330°−60°=270°: cos(270°)=0, sin(270°)=−1 → inner(r=320):(800,450−320)=(800,130) outer(r=355):(800,95) -->
  <line x1="800" y1="113" x2="800" y2="95"
        stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.60"/>
  <!-- 50%=330°−120°=210°: same as end node, but halfway = 330°−120°=210° — that's the end, so 50% = 270° already done. Wait: -->
  <!-- 240° total. 25% of 240°=60°. 0%=330°, 25%=330°−60°=270°(top), 50%=330°−120°=210°(lower-left end). -->
  <!-- That's only 3 ticks if 0,25,50 = 330,270,210. Let me do 4 marks at 20% intervals = 48° each -->
  <!-- 20%=330°−48°=282°: cos=0.208,sin=−0.978 → (800+340·0.208,450+340·(−0.978))=(870.7,117.5) outer r=358 -->
  <line x1="870.7" y1="119" x2="878" y2="103"
        stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- 40%=330°−96°=234°: cos(234°)=−0.588,sin=−0.809 → (600.1,174.9) -->
  <line x1="600.1" y1="177" x2="589" y2="163"
        stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- 60%=330°−144°=186°: (511.5,414.4) — needle tip region, skip (would clutter) -->
  <!-- 80%=330°−192°=138°: cos(138°)=−0.743,sin=0.669 → (547.4,677.5) -->
  <line x1="547.4" y1="675" x2="536" y2="688"
        stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
</svg>
