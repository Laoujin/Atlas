<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero hub radial -->
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Orbit glow radial for central area -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Node gradient violet -->
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Node gradient rust -->
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Edge line gradient -->
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: Hero — concentric orbit rings centered at (800,450) -->

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="360" ry="260"
    fill="none" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.45"
    stroke-dasharray="18 10"/>

  <!-- Middle orbit ring -->
  <ellipse cx="800" cy="450" rx="240" ry="174"
    fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="140" ry="100"
    fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Edge lines: hub to outer nodes -->
  <!-- Node positions on outer orbit (6 nodes at angles) -->
  <!-- 0°: (1160, 450), 60°: (980, 675), 120°: (620, 675), 180°: (440, 450), 240°: (620, 225), 300°: (980, 225) -->
  <!-- Using approximate ellipse points -->
  <!-- angle 0: (800+360, 450) = (1160, 450) -->
  <!-- angle 60: x=800+360*cos60=800+180=980, y=450+260*sin60=450+225=675 -->
  <!-- angle 120: x=800+360*cos120=800-180=620, y=450+260*sin120=675 -->
  <!-- angle 180: (440, 450) -->
  <!-- angle 240: (620, 225) -->
  <!-- angle 300: (980, 225) -->

  <line x1="800" y1="450" x2="1160" y2="450" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="980" y2="675" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="620" y2="675" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="440" y2="450" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="620" y2="225" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="980" y2="225" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Mid-ring nodes (inner layer, 3 nodes) -->
  <!-- angle 30: x=800+240*cos30=800+208=1008, y=450+174*sin30=450+87=537 -->
  <!-- angle 150: x=800-208=592, y=537 -->
  <!-- angle 270: x=800, y=450-174=276 -->
  <circle cx="1008" cy="537" r="13" fill="#c2410c" fill-opacity="0.75"/>
  <circle cx="592" cy="537" r="13" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="800" cy="276" r="13" fill="#c2410c" fill-opacity="0.75"/>

  <!-- Outer orbit nodes (6 nodes) -->
  <circle cx="1160" cy="450" r="20" fill="url(#nodeRust)" fill-opacity="0.9"/>
  <circle cx="980" cy="675" r="17" fill="url(#nodeViolet)" fill-opacity="0.85"/>
  <circle cx="620" cy="675" r="17" fill="url(#nodeViolet)" fill-opacity="0.85"/>
  <circle cx="440" cy="450" r="20" fill="url(#nodeRust)" fill-opacity="0.9"/>
  <circle cx="620" cy="225" r="17" fill="url(#nodeViolet)" fill-opacity="0.85"/>
  <circle cx="980" cy="225" r="17" fill="url(#nodeRust)" fill-opacity="0.85"/>

  <!-- Hero hub: central circle -->
  <circle cx="800" cy="450" r="62" fill="url(#hub)" fill-opacity="0.95"/>
  <!-- Hub inner accent ring -->
  <circle cx="800" cy="450" r="62" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Hub core dot -->
  <circle cx="800" cy="450" r="20" fill="#fbbf24" fill-opacity="0.95"/>

  <!-- Layer 3: Corner decoration (outside safe zone, atmospheric) -->
  <!-- Bottom-left corner arc wash -->
  <ellipse cx="0" cy="900" rx="280" ry="200" fill="#6d28d9" fill-opacity="0.08"/>
  <!-- Top-right corner arc wash -->
  <ellipse cx="1600" cy="0" rx="280" ry="200" fill="#c2410c" fill-opacity="0.08"/>
</svg>
