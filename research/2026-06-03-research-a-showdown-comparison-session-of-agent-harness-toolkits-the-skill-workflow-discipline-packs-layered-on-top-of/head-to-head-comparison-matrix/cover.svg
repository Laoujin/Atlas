<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2d1010"/>
      <stop offset="100%" stop-color="#1e0d2a"/>
    </linearGradient>
    <!-- Central hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub core -->
    <radialGradient id="hubCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Satellite node gradient -->
    <radialGradient id="nodeA" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
    <!-- Orbit ring gradient (reused via transform) -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="85%" stop-color="#6d28d9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge line gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Outer ambient glow behind hero -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient hero glow (full bleed, decorative) -->
  <ellipse cx="800" cy="450" rx="700" ry="420" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone x:125-1475, y:90-810 -->

  <!-- Orbit ring 1 (inner) -->
  <ellipse cx="800" cy="450" rx="175" ry="175" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.35"/>
  <!-- Orbit ring 2 (middle) -->
  <ellipse cx="800" cy="450" rx="295" ry="295" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Orbit ring 3 (outer) -->
  <ellipse cx="800" cy="450" rx="390" ry="390" fill="none" stroke="#6d28d9" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Subtle orbit fill glow on middle ring -->
  <ellipse cx="800" cy="450" rx="295" ry="295" fill="url(#orbitGlow)" opacity="0.5"/>

  <!-- Edge connectors: hub to each satellite node -->
  <!-- Node 1: top-center ~(800, 255) — inner orbit -->
  <line x1="800" y1="430" x2="800" y2="270" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Node 2: right ~(1085, 450) — middle orbit -->
  <line x1="820" y1="450" x2="1070" y2="450" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Node 3: bottom-right ~(1008, 658) — outer orbit -->
  <line x1="812" y1="464" x2="992" y2="648" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- Node 4: bottom-left ~(592, 658) — outer orbit -->
  <line x1="788" y1="464" x2="608" y2="648" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- Node 5: left ~(515, 450) — middle orbit -->
  <line x1="780" y1="450" x2="530" y2="450" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Node 6: top-right ~(924, 326) — inner orbit -->
  <line x1="808" y1="434" x2="916" y2="338" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Hub glow halo -->
  <circle cx="800" cy="450" r="90" fill="url(#hubGlow)"/>

  <!-- Satellite nodes -->
  <!-- Node 1: top, inner orbit -->
  <circle cx="800" cy="255" r="22" fill="#6d28d9" opacity="0.85"/>
  <circle cx="800" cy="255" r="14" fill="#a78bfa" opacity="0.7"/>
  <!-- Node 2: right, middle orbit -->
  <circle cx="1085" cy="450" r="26" fill="#5b21b6" opacity="0.8"/>
  <circle cx="1085" cy="450" r="16" fill="#7c3aed" opacity="0.75"/>
  <!-- Node 3: bottom-right, outer orbit -->
  <circle cx="1008" cy="658" r="20" fill="#6d28d9" opacity="0.75"/>
  <circle cx="1008" cy="658" r="12" fill="#a78bfa" opacity="0.65"/>
  <!-- Node 4: bottom-left, outer orbit -->
  <circle cx="592" cy="658" r="20" fill="#6d28d9" opacity="0.75"/>
  <circle cx="592" cy="658" r="12" fill="#a78bfa" opacity="0.65"/>
  <!-- Node 5: left, middle orbit -->
  <circle cx="515" cy="450" r="26" fill="#5b21b6" opacity="0.8"/>
  <circle cx="515" cy="450" r="16" fill="#7c3aed" opacity="0.75"/>
  <!-- Node 6: top-right, inner orbit -->
  <circle cx="924" cy="326" r="22" fill="#6d28d9" opacity="0.85"/>
  <circle cx="924" cy="326" r="14" fill="#a78bfa" opacity="0.7"/>

  <!-- Central hub: rust hero -->
  <circle cx="800" cy="450" r="58" fill="url(#hubCore)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="58" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Hub core dot -->
  <circle cx="800" cy="450" r="22" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="450" r="10" fill="#fffbeb" opacity="0.75"/>

  <!-- Layer 3: Corner decorations (outside safe zone, purely atmospheric) -->
  <!-- Top-left corner arc -->
  <path d="M0,0 Q80,0 80,80" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.2"/>
  <!-- Bottom-right corner arc -->
  <path d="M1600,900 Q1520,900 1520,820" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.2"/>
  <!-- Subtle top-edge horizontal band -->
  <rect x="0" y="0" width="1600" height="2" fill="#c2410c" opacity="0.25"/>
  <!-- Subtle bottom-edge horizontal band -->
  <rect x="0" y="898" width="1600" height="2" fill="#6d28d9" opacity="0.2"/>
</svg>
