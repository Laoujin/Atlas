<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.62" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="640" ry="430" fill="url(#glow)"/>

  <g transform="rotate(-6 800 450)">
    <g stroke="#78350f" stroke-opacity="0.14" stroke-width="3">
      <line x1="500" y1="200" x2="500" y2="700"/>
      <line x1="800" y1="200" x2="800" y2="700"/>
      <line x1="1100" y1="200" x2="1100" y2="700"/>
    </g>

    <rect x="350" y="235" width="620" height="62" rx="31" fill="url(#band)"/>
    <rect x="350" y="327" width="470" height="62" rx="31" fill="url(#band)" opacity="0.82"/>
    <rect x="350" y="419" width="900" height="62" rx="31" fill="url(#hero)"/>
    <rect x="350" y="511" width="700" height="62" rx="31" fill="url(#band)" opacity="0.9"/>
    <rect x="350" y="603" width="380" height="62" rx="31" fill="url(#band)" opacity="0.7"/>

    <circle cx="1250" cy="450" r="27" fill="#9a3309"/>
    <circle cx="1250" cy="450" r="52" fill="none" stroke="#c2410c" stroke-opacity="0.45" stroke-width="6"/>
  </g>
</svg>
