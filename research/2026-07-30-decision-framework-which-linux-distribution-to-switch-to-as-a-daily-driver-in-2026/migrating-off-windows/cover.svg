<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <path d="M0 0 L250 0 L0 210 Z" fill="#c2410c" opacity="0.07"/>
  <path d="M1600 900 L1600 660 L1330 900 Z" fill="#78350f" opacity="0.08"/>

  <!-- source volume: partitions draining away, one kept -->
  <g transform="rotate(-5 480 450)">
    <rect x="255" y="245" width="440" height="410" rx="22" fill="url(#ghost)" stroke="#9a3309" stroke-width="3" stroke-opacity="0.4"/>
    <rect x="305" y="300" width="340" height="52" rx="12" fill="#9a3309" opacity="0.16"/>
    <rect x="305" y="378" width="290" height="52" rx="12" fill="#9a3309" opacity="0.13"/>
    <rect x="305" y="456" width="230" height="52" rx="12" fill="#9a3309" opacity="0.10"/>
    <rect x="305" y="540" width="340" height="62" rx="14" fill="#78350f" opacity="0.85"/>
    <circle cx="655" cy="571" r="11" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- migration arc -->
  <path d="M715 470 C 800 350, 830 350, 905 420" fill="none" stroke="#c2410c" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <circle cx="762" cy="404" r="9" fill="#d97706" opacity="0.8"/>
  <circle cx="810" cy="382" r="13" fill="#c2410c" opacity="0.85"/>
  <circle cx="862" cy="392" r="9" fill="#d97706" opacity="0.8"/>

  <!-- destination volume: hero -->
  <g transform="rotate(4 1120 450)">
    <rect x="900" y="195" width="470" height="510" rx="26" fill="url(#hero)" opacity="0.94"/>
    <rect x="955" y="262" width="350" height="56" rx="13" fill="#fef3ec" opacity="0.72"/>
    <rect x="955" y="352" width="290" height="56" rx="13" fill="#fef3ec" opacity="0.5"/>
    <rect x="955" y="442" width="330" height="56" rx="13" fill="#fef3ec" opacity="0.36"/>
    <rect x="955" y="532" width="240" height="56" rx="13" fill="#fbbf24" opacity="0.6"/>
    <circle cx="1305" cy="620" r="14" fill="#fbbf24" opacity="0.95"/>
  </g>
</svg>
