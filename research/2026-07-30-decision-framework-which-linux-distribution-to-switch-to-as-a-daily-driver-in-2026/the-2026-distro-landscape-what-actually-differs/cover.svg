<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bandFaint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="720" ry="400" fill="url(#glow)"/>

  <g transform="rotate(-7 800 450)">
    <rect x="300" y="234" width="880" height="62" rx="10" fill="url(#bandFaint)"/>
    <rect x="252" y="322" width="1000" height="62" rx="10" fill="url(#band)"/>

    <rect x="226" y="404" width="1150" height="90" rx="12" fill="url(#hero)"/>
    <rect x="226" y="404" width="1150" height="90" rx="12" fill="none" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="3"/>
    <rect x="262" y="437" width="470" height="24" rx="12" fill="#fbbf24" fill-opacity="0.9"/>

    <rect x="286" y="516" width="962" height="62" rx="10" fill="url(#band)"/>
    <rect x="342" y="604" width="820" height="62" rx="10" fill="url(#bandFaint)"/>
  </g>

  <rect x="0" y="0" width="1600" height="10" fill="#c2410c" fill-opacity="0.65"/>
  <rect x="0" y="890" width="1600" height="10" fill="#78350f" fill-opacity="0.5"/>
</svg>
