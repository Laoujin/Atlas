<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <polygon points="0,0 340,0 0,300" fill="#334155" opacity="0.07"/>
  <polygon points="1600,900 1600,620 1280,900" fill="#c2410c" opacity="0.08"/>
  <ellipse cx="800" cy="380" rx="620" ry="330" fill="url(#glow)"/>

  <!-- deepest layer: aging kernel / stock driver base -->
  <polygon points="450,610 1150,610 1150,630 800,760 450,630" fill="#1f2937" opacity="0.55"/>
  <polygon points="450,590 800,440 1150,590 800,740" fill="url(#slate)" opacity="0.62"/>

  <!-- middle layer -->
  <polygon points="450,490 1150,490 1150,510 800,640 450,510" fill="#1f2937" opacity="0.7"/>
  <polygon points="450,470 800,320 1150,470 800,620" fill="url(#slate)" opacity="0.82"/>

  <!-- hero layer: current silicon + recent kernel -->
  <polygon points="450,370 1150,370 1150,392 800,522 450,392" fill="#78350f" opacity="0.92"/>
  <polygon points="450,350 800,200 1150,350 800,500" fill="url(#hero)" opacity="0.95"/>

  <!-- die on the hero board -->
  <polygon points="710,350 800,311 890,350 800,389" fill="#78350f" opacity="0.85"/>
  <polygon points="710,350 800,311 890,350 800,389" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.75"/>

  <!-- power/attach LED -->
  <circle cx="985" cy="382" r="26" fill="#fbbf24" opacity="0.28"/>
  <circle cx="985" cy="382" r="10" fill="#fbbf24" opacity="0.95"/>

  <!-- riser connectors binding the three layers -->
  <line x1="450" y1="392" x2="450" y2="630" stroke="#334155" stroke-width="6" opacity="0.5"/>
  <line x1="1150" y1="392" x2="1150" y2="630" stroke="#334155" stroke-width="6" opacity="0.5"/>
</svg>
