<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="calm" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="atom" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="760" ry="470" fill="url(#glow)"/>

  <g transform="rotate(-6 800 450)">
    <rect x="350" y="260" width="900" height="92" rx="10" fill="url(#calm)"/>

    <rect x="310" y="378" width="980" height="132" rx="12" fill="url(#hero)"/>
    <rect x="352" y="404" width="740" height="7" rx="3.5" fill="#fef3ec" opacity="0.42"/>
    <rect x="352" y="437" width="560" height="7" rx="3.5" fill="#fef3ec" opacity="0.3"/>
    <rect x="352" y="470" width="860" height="7" rx="3.5" fill="#fef3ec" opacity="0.22"/>

    <rect x="350" y="536" width="430" height="104" rx="10" fill="url(#atom)"/>
    <rect x="820" y="536" width="430" height="104" rx="10" fill="url(#atom)" opacity="0.6"/>
  </g>

  <path d="M1470 640 q90 -190 -20 -300" fill="none" stroke="#78350f" stroke-width="10" stroke-linecap="round" opacity="0.28"/>
  <circle cx="1452" cy="352" r="15" fill="#c2410c" opacity="0.5"/>

  <rect x="0" y="0" width="1600" height="14" fill="#c2410c" opacity="0.7"/>
  <circle cx="118" cy="812" r="150" fill="#78350f" opacity="0.07"/>
