<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nearPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind peaks -->
  <circle cx="1050" cy="440" r="340" fill="url(#sun)"/>

  <!-- far peak range (decoration, can clip) -->
  <path d="M0 620 L150 480 L260 540 L380 430 L520 520 L640 460 L780 540 L920 450 L1080 520 L1220 440 L1360 510 L1500 460 L1600 500 L1600 900 L0 900 Z" fill="url(#farPeak)" opacity="0.7"/>

  <!-- mid peak range — hero band -->
  <path d="M0 720 L120 600 L240 680 L360 540 L460 620 L560 480 L680 580 L800 420 L920 560 L1040 500 L1180 610 L1320 540 L1440 640 L1600 580 L1600 900 L0 900 Z" fill="url(#midPeak)" opacity="0.92"/>

  <!-- snow caps on hero peak (800,420) -->
  <path d="M770 460 L800 420 L830 460 L815 470 L800 455 L785 470 Z" fill="#faf8f2" opacity="0.85"/>
  <path d="M540 510 L560 480 L580 510 L570 518 L560 505 L550 518 Z" fill="#faf8f2" opacity="0.7"/>
  <path d="M1030 525 L1040 500 L1055 525 Z" fill="#faf8f2" opacity="0.65"/>

  <!-- near peak silhouette (foreground anchor) -->
  <path d="M0 800 L180 720 L320 770 L500 660 L660 740 L820 700 L1000 760 L1180 680 L1340 740 L1500 700 L1600 730 L1600 900 L0 900 Z" fill="url(#nearPeak)" opacity="0.95"/>

  <!-- network / conference motif: nodes orbiting hero peak, edges traced across the ridgeline -->
  <g stroke="#6d28d9" stroke-width="1.6" opacity="0.55" fill="none">
    <line x1="560" y1="480" x2="800" y2="360"/>
    <line x1="800" y1="360" x2="1040" y2="440"/>
    <line x1="800" y1="360" x2="680" y2="280"/>
    <line x1="800" y1="360" x2="940" y2="260"/>
    <line x1="680" y1="280" x2="940" y2="260"/>
    <line x1="560" y1="480" x2="680" y2="280"/>
    <line x1="1040" y1="440" x2="940" y2="260"/>
    <line x1="800" y1="360" x2="800" y2="420"/>
  </g>

  <!-- hero node atop the central peak -->
  <circle cx="800" cy="360" r="18" fill="#c2410c" stroke="#faf8f2" stroke-width="3"/>
  <circle cx="800" cy="360" r="32" fill="none" stroke="#c2410c" stroke-width="1.2" opacity="0.45"/>
  <circle cx="800" cy="360" r="48" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.35"/>

  <!-- satellite nodes -->
  <circle cx="680" cy="280" r="9" fill="#6d28d9" opacity="0.9"/>
  <circle cx="940" cy="260" r="11" fill="#d97706" opacity="0.95"/>
  <circle cx="560" cy="480" r="8" fill="#6d28d9" opacity="0.85"/>
  <circle cx="1040" cy="440" r="9" fill="#9a3309" opacity="0.9"/>

  <!-- faint signal arc from hero -->
  <path d="M740 360 A 60 60 0 0 1 860 360" stroke="#fbbf24" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M720 360 A 80 80 0 0 1 880 360" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
