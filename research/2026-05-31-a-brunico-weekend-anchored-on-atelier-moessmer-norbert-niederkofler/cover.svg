<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.5" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3528"/>
      <stop offset="1" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="nearRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1410"/>
      <stop offset="1" stop-color="#0e0808"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#dusk)"/>

  <!-- distant Plan de Corones / Dolomite ridge -->
  <path d="M 0 520 L 140 430 L 240 470 L 360 360 L 470 410 L 580 330 L 720 380 L 820 280 L 940 340 L 1060 300 L 1180 360 L 1320 310 L 1440 380 L 1600 340 L 1600 600 L 0 600 Z"
        fill="url(#farRange)" opacity="0.85"/>

  <!-- mid ridge -->
  <path d="M 0 620 L 110 540 L 230 580 L 340 500 L 460 560 L 600 480 L 740 540 L 880 470 L 1010 530 L 1150 490 L 1280 550 L 1410 500 L 1530 560 L 1600 530 L 1600 720 L 0 720 Z"
        fill="url(#midRange)" opacity="0.92"/>

  <!-- near foothills / dark valley -->
  <path d="M 0 760 L 180 700 L 340 730 L 520 690 L 700 720 L 880 700 L 1060 730 L 1260 700 L 1440 730 L 1600 710 L 1600 900 L 0 900 Z"
        fill="url(#nearRange)"/>

  <!-- HERO: a single warm lamplit window at the foot of the mountains, inside safe zone -->
  <!-- glow halo -->
  <circle cx="800" cy="600" r="220" fill="url(#lamp)" opacity="0.85"/>

  <!-- window frame (chalet/restaurant window suggestion) -->
  <g transform="translate(740 555)">
    <!-- outer warm frame shadow -->
    <rect x="-6" y="-6" width="132" height="102" rx="4" fill="#2a1810" opacity="0.9"/>
    <!-- lit window -->
    <rect x="0" y="0" width="120" height="90" rx="2" fill="#fbbf24" opacity="0.95"/>
    <!-- inner warmth gradient -->
    <rect x="0" y="0" width="120" height="90" rx="2" fill="url(#lamp)" opacity="0.6"/>
    <!-- mullions -->
    <rect x="58" y="0" width="4" height="90" fill="#78350f" opacity="0.85"/>
    <rect x="0" y="43" width="120" height="4" fill="#78350f" opacity="0.85"/>
  </g>

  <!-- a few faint distant village windows along the valley, low opacity -->
  <rect x="520" y="685" width="5" height="5" fill="#fbbf24" opacity="0.7"/>
  <rect x="610" y="700" width="4" height="4" fill="#fbbf24" opacity="0.6"/>
  <rect x="980" y="695" width="5" height="5" fill="#fbbf24" opacity="0.7"/>
  <rect x="1080" y="710" width="4" height="4" fill="#fbbf24" opacity="0.55"/>
  <rect x="1180" y="700" width="5" height="5" fill="#fbbf24" opacity="0.65"/>

  <!-- single early evening star, decoration only -->
  <circle cx="380" cy="180" r="2" fill="#fef3ec" opacity="0.6"/>
  <circle cx="1240" cy="140" r="1.8" fill="#fef3ec" opacity="0.5"/>
</svg>
