<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun glow behind peaks -->
  <circle cx="1050" cy="380" r="280" fill="url(#glow)"/>

  <!-- Far Dolomite range -->
  <path d="M 0 520 L 140 380 L 240 440 L 360 300 L 470 400 L 580 320 L 700 410 L 820 280 L 940 380 L 1080 310 L 1200 400 L 1340 330 L 1460 410 L 1600 360 L 1600 600 L 0 600 Z"
        fill="url(#mtnFar)" opacity="0.75"/>

  <!-- Near mountain range -->
  <path d="M 0 640 L 180 500 L 320 580 L 460 460 L 620 560 L 780 470 L 920 550 L 1080 480 L 1240 570 L 1400 500 L 1600 580 L 1600 720 L 0 720 Z"
        fill="url(#mtnNear)" opacity="0.92"/>

  <!-- Village cluster (left) - Tyrolean houses with steep gabled roofs -->
  <g opacity="0.95">
    <!-- House 1 -->
    <rect x="340" y="620" width="80" height="90" fill="#faf8f2"/>
    <polygon points="335,620 380,560 425,620" fill="url(#roof)"/>
    <rect x="362" y="650" width="14" height="20" fill="#78350f" opacity="0.6"/>
    <rect x="385" y="650" width="14" height="20" fill="#78350f" opacity="0.6"/>

    <!-- House 2 (taller, behind) -->
    <rect x="410" y="600" width="70" height="110" fill="#f0eadb"/>
    <polygon points="405,600 445,540 485,600" fill="url(#roof)"/>
    <rect x="425" y="625" width="12" height="16" fill="#78350f" opacity="0.6"/>
    <rect x="453" y="625" width="12" height="16" fill="#78350f" opacity="0.6"/>
    <rect x="425" y="660" width="12" height="16" fill="#78350f" opacity="0.6"/>
    <rect x="453" y="660" width="12" height="16" fill="#78350f" opacity="0.6"/>

    <!-- Church with spire -->
    <rect x="495" y="590" width="55" height="120" fill="#faf8f2"/>
    <polygon points="490,590 522,540 555,590" fill="url(#roof)"/>
    <rect x="514" y="490" width="18" height="100" fill="#f0eadb"/>
    <polygon points="510,490 523,440 536,490" fill="#9a3309"/>
    <circle cx="523" cy="455" r="3" fill="#fbbf24"/>

    <!-- House 3 -->
    <rect x="560" y="625" width="70" height="85" fill="#faf8f2"/>
    <polygon points="555,625 595,575 635,625" fill="url(#roof)"/>
    <rect x="575" y="650" width="12" height="16" fill="#78350f" opacity="0.6"/>
    <rect x="605" y="650" width="12" height="16" fill="#78350f" opacity="0.6"/>

    <!-- House 4 (small, foreground) -->
    <rect x="630" y="645" width="60" height="65" fill="#f0eadb"/>
    <polygon points="625,645 660,605 695,645" fill="url(#roof)"/>
    <rect x="650" y="665" width="12" height="16" fill="#78350f" opacity="0.6"/>
  </g>

  <!-- Footpath connecting village to villa -->
  <path d="M 690 710 Q 850 690 1000 700 T 1180 705"
        stroke="#d97706" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M 690 710 Q 850 690 1000 700 T 1180 705"
        stroke="#78350f" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Villa (right) - stately 19th-century building in park -->
  <g>
    <!-- Park trees flanking villa -->
    <ellipse cx="1130" cy="660" rx="32" ry="55" fill="#5c2a1a" opacity="0.5"/>
    <ellipse cx="1130" cy="640" rx="28" ry="48" fill="#78350f" opacity="0.55"/>
    <ellipse cx="1330" cy="665" rx="34" ry="58" fill="#5c2a1a" opacity="0.5"/>
    <ellipse cx="1330" cy="645" rx="30" ry="50" fill="#78350f" opacity="0.55"/>

    <!-- Villa main body -->
    <rect x="1170" y="560" width="160" height="150" fill="#faf8f2"/>
    <!-- Villa roof (mansard-style) -->
    <polygon points="1160,560 1250,490 1340,560" fill="url(#roof)"/>
    <!-- Central tower -->
    <rect x="1232" y="520" width="36" height="40" fill="#f0eadb"/>
    <polygon points="1228,520 1250,485 1272,520" fill="#9a3309"/>

    <!-- Windows (rows, ordered) -->
    <rect x="1185" y="585" width="16" height="24" fill="#be185d" opacity="0.55"/>
    <rect x="1212" y="585" width="16" height="24" fill="#be185d" opacity="0.55"/>
    <rect x="1272" y="585" width="16" height="24" fill="#be185d" opacity="0.55"/>
    <rect x="1299" y="585" width="16" height="24" fill="#be185d" opacity="0.55"/>

    <rect x="1185" y="625" width="16" height="24" fill="#fbbf24" opacity="0.7"/>
    <rect x="1212" y="625" width="16" height="24" fill="#fbbf24" opacity="0.7"/>
    <rect x="1272" y="625" width="16" height="24" fill="#fbbf24" opacity="0.7"/>
    <rect x="1299" y="625" width="16" height="24" fill="#fbbf24" opacity="0.7"/>

    <!-- Central door -->
    <rect x="1240" y="660" width="20" height="50" fill="#78350f"/>
    <rect x="1242" y="665" width="16" height="40" fill="#9a3309"/>

    <!-- Tower window -->
    <rect x="1242" y="530" width="16" height="20" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Foreground ground tone -->
  <rect x="0" y="710" width="1600" height="190" fill="#5c2a1a" opacity="0.35"/>
  <rect x="0" y="720" width="1600" height="180" fill="#1a0e0e" opacity="0.25"/>
</svg>
