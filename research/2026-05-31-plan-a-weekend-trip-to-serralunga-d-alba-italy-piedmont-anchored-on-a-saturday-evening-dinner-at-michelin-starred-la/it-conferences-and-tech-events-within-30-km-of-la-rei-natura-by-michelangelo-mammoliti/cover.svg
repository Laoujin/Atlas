<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="radius" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.08"/>
      <stop offset="0.85" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- vine-row striations on far hills (faint) -->
  <g opacity="0.35" stroke="#fbbf24" stroke-width="1" fill="none">
    <path d="M 0 470 Q 400 430 800 450 T 1600 440"/>
    <path d="M 0 490 Q 400 450 800 470 T 1600 460"/>
    <path d="M 0 510 Q 400 470 800 490 T 1600 480"/>
  </g>

  <!-- far hills -->
  <path d="M 0 520 Q 250 430 500 470 T 1000 460 T 1600 450 L 1600 900 L 0 900 Z" fill="url(#hillFar)"/>

  <!-- 30km radius zone (hero, centered) -->
  <circle cx="800" cy="450" r="260" fill="url(#radius)"/>
  <circle cx="800" cy="450" r="260" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.55"/>

  <!-- mid hills -->
  <path d="M 0 620 Q 200 540 450 580 Q 700 615 950 575 Q 1200 540 1600 590 L 1600 900 L 0 900 Z" fill="url(#hillMid)"/>

  <!-- vine rows on mid hills -->
  <g opacity="0.4" stroke="#fbbf24" stroke-width="1.2" fill="none">
    <path d="M 0 640 Q 300 575 600 605 T 1200 600 T 1600 615"/>
    <path d="M 0 670 Q 300 605 600 635 T 1200 630 T 1600 645"/>
    <path d="M 0 700 Q 300 635 600 665 T 1200 660 T 1600 675"/>
    <path d="M 0 730 Q 300 665 600 695 T 1200 690 T 1600 705"/>
  </g>

  <!-- near hills -->
  <path d="M 0 760 Q 300 700 700 730 Q 1100 760 1600 720 L 1600 900 L 0 900 Z" fill="url(#hillNear)"/>

  <!-- network nodes within the radius (sparse tech cluster) -->
  <g>
    <!-- connecting lines, faint -->
    <line x1="800" y1="450" x2="680" y2="380" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>
    <line x1="800" y1="450" x2="920" y2="410" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>
    <line x1="800" y1="450" x2="870" y2="540" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>

    <!-- small node dots -->
    <circle cx="680" cy="380" r="6" fill="#6d28d9" opacity="0.85"/>
    <circle cx="920" cy="410" r="6" fill="#6d28d9" opacity="0.85"/>
    <circle cx="870" cy="540" r="6" fill="#6d28d9" opacity="0.85"/>
  </g>

  <!-- hero map pin at center -->
  <g transform="translate(800 450)">
    <!-- pin shadow -->
    <ellipse cx="0" cy="58" rx="28" ry="6" fill="#78350f" opacity="0.35"/>
    <!-- pin body: teardrop -->
    <path d="M 0 -90 C -40 -90 -62 -58 -62 -28 C -62 6 -28 38 0 56 C 28 38 62 6 62 -28 C 62 -58 40 -90 0 -90 Z" fill="url(#pin)" stroke="#78350f" stroke-width="2"/>
    <!-- inner hole -->
    <circle cx="0" cy="-30" r="20" fill="#faf8f2"/>
    <circle cx="0" cy="-30" r="20" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
    <!-- small violet center dot (the tech accent) -->
    <circle cx="0" cy="-30" r="7" fill="#6d28d9" opacity="0.9"/>
  </g>
</svg>
