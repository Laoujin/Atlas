<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.85" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1208"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="rows" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow, low on horizon, behind the ridge -->
  <circle cx="1080" cy="540" r="360" fill="url(#sun)"/>

  <!-- Back ridge: distant rolling hill -->
  <path d="M0,620 C220,560 380,600 560,575 C760,548 920,590 1120,555 C1300,525 1450,560 1600,540 L1600,900 L0,900 Z"
        fill="url(#ridgeBack)" opacity="0.85"/>

  <!-- Mid ridge with Serralunga castle tower silhouette on the crest (hero, centered ~800,450) -->
  <path d="M0,690 C180,640 320,665 460,640 C560,622 640,610 720,605
           L740,605 L740,470 L772,470 L772,440 L800,440 L800,360 L832,360 L832,440 L860,440 L860,470 L892,470 L892,605
           L920,605 C1060,608 1200,640 1360,665 C1480,682 1540,690 1600,685
           L1600,900 L0,900 Z"
        fill="url(#ridgeMid)"/>

  <!-- Tower crenellation notches (small dark accents to suggest battlements) -->
  <rect x="748" y="470" width="12" height="14" fill="#1a0e0e" opacity="0.9"/>
  <rect x="780" y="470" width="12" height="14" fill="#1a0e0e" opacity="0.9"/>
  <rect x="812" y="470" width="12" height="14" fill="#1a0e0e" opacity="0.9"/>
  <rect x="844" y="470" width="12" height="14" fill="#1a0e0e" opacity="0.9"/>
  <rect x="876" y="470" width="12" height="14" fill="#1a0e0e" opacity="0.9"/>

  <!-- Front ridge: closer hill with vineyard rows climbing it -->
  <path d="M0,790 C200,720 400,760 620,735 C840,710 1060,750 1280,725 C1420,710 1520,720 1600,710 L1600,900 L0,900 Z"
        fill="url(#ridgeFront)"/>

  <!-- Vineyard rows: angled lines suggesting planted hillside, following front ridge contour -->
  <g stroke="#c2410c" stroke-width="2" opacity="0.45" fill="none">
    <path d="M120,900 L240,740"/>
    <path d="M200,900 L310,748"/>
    <path d="M280,900 L380,755"/>
    <path d="M360,900 L450,762"/>
    <path d="M440,900 L520,758"/>
    <path d="M520,900 L590,748"/>
    <path d="M600,900 L660,738"/>
    <path d="M680,900 L730,732"/>
    <path d="M760,900 L800,728"/>
    <path d="M860,900 L880,732"/>
    <path d="M940,900 L960,738"/>
    <path d="M1020,900 L1040,742"/>
    <path d="M1100,900 L1130,738"/>
    <path d="M1180,900 L1220,732"/>
    <path d="M1260,900 L1310,725"/>
    <path d="M1340,900 L1390,720"/>
    <path d="M1420,900 L1470,716"/>
    <path d="M1500,900 L1550,714"/>
  </g>

  <!-- Subtle warm wash over the vineyard foreground -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#rows)"/>
</svg>
