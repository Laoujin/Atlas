<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow behind castle -->
  <circle cx="820" cy="380" r="240" fill="url(#sun)"/>

  <!-- distant hill ridge -->
  <path d="M0,560 C220,500 380,540 560,500 C760,460 920,520 1120,480 C1320,450 1460,490 1600,470 L1600,900 L0,900 Z" fill="url(#hillFar)"/>

  <!-- mid hill with castle hilltop (hero) -->
  <path d="M0,640 C180,600 320,620 480,580 C620,545 720,500 820,460 C920,500 1020,560 1180,580 C1340,600 1480,620 1600,610 L1600,900 L0,900 Z" fill="url(#hillMid)"/>

  <!-- castle silhouette on the central rise (hero focal point at ~800,430) -->
  <g fill="#3a1a08">
    <!-- main keep tower -->
    <rect x="784" y="370" width="44" height="92"/>
    <rect x="780" y="362" width="6" height="14"/>
    <rect x="794" y="362" width="6" height="14"/>
    <rect x="808" y="362" width="6" height="14"/>
    <rect x="822" y="362" width="6" height="14"/>
    <!-- adjoining lower wing left -->
    <rect x="742" y="408" width="42" height="54"/>
    <rect x="744" y="402" width="5" height="8"/>
    <rect x="754" y="402" width="5" height="8"/>
    <rect x="764" y="402" width="5" height="8"/>
    <rect x="774" y="402" width="5" height="8"/>
    <!-- adjoining lower wing right -->
    <rect x="828" y="420" width="36" height="42"/>
    <rect x="830" y="414" width="5" height="8"/>
    <rect x="840" y="414" width="5" height="8"/>
    <rect x="850" y="414" width="5" height="8"/>
    <!-- slim narrow tower -->
    <rect x="868" y="394" width="18" height="68"/>
  </g>

  <!-- vineyard rows on the mid hill, faint diagonal lines -->
  <g stroke="#3a1a08" stroke-width="1.2" opacity="0.32" fill="none">
    <path d="M120,660 L240,610"/>
    <path d="M180,680 L300,628"/>
    <path d="M240,700 L360,648"/>
    <path d="M300,720 L420,668"/>
    <path d="M1180,610 L1320,660"/>
    <path d="M1240,628 L1380,680"/>
    <path d="M1300,648 L1440,700"/>
    <path d="M1360,668 L1500,720"/>
  </g>

  <!-- near hill (foreground) with cluster of resort/lodge buildings -->
  <path d="M0,740 C220,700 420,720 640,700 C860,680 1040,710 1260,700 C1420,694 1520,710 1600,720 L1600,900 L0,900 Z" fill="url(#hillNear)"/>

  <!-- resort cluster nestled below the castle, within safe zone -->
  <g fill="#5c2a1a">
    <!-- main lodge building -->
    <rect x="720" y="690" width="120" height="48"/>
    <polygon points="720,690 780,668 840,690"/>
    <!-- annex left -->
    <rect x="660" y="708" width="62" height="32"/>
    <polygon points="660,708 691,692 722,708"/>
    <!-- annex right -->
    <rect x="842" y="704" width="76" height="36"/>
    <polygon points="842,704 880,684 918,704"/>
    <!-- small outbuilding further right -->
    <rect x="940" y="716" width="44" height="26"/>
    <polygon points="940,716 962,704 984,716"/>
  </g>

  <!-- warm window dots on the lodge -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="736" y="708" width="6" height="8"/>
    <rect x="754" y="708" width="6" height="8"/>
    <rect x="772" y="708" width="6" height="8"/>
    <rect x="790" y="708" width="6" height="8"/>
    <rect x="808" y="708" width="6" height="8"/>
    <rect x="858" y="718" width="5" height="7"/>
    <rect x="874" y="718" width="5" height="7"/>
    <rect x="890" y="718" width="5" height="7"/>
    <rect x="678" y="720" width="5" height="7"/>
    <rect x="694" y="720" width="5" height="7"/>
    <rect x="710" y="720" width="5" height="7"/>
  </g>

  <!-- foreground vine rows, sweeping -->
  <g stroke="#1a0e0e" stroke-width="1.4" opacity="0.42" fill="none">
    <path d="M0,810 C300,780 700,790 1000,800 C1300,808 1500,810 1600,808"/>
    <path d="M0,840 C300,812 700,820 1000,830 C1300,838 1500,840 1600,838"/>
    <path d="M0,870 C300,844 700,852 1000,860 C1300,868 1500,870 1600,868"/>
  </g>
</svg>
