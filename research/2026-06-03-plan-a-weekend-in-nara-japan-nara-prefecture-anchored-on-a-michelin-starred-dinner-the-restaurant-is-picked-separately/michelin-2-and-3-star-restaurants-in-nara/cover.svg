<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3a1608"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm central glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate gradient — deep lacquer -->
    <radialGradient id="plateLacquer" cx="42%" cy="38%" r="56%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="45%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0608"/>
    </radialGradient>

    <!-- Inner plate well (the hollow of the bowl) -->
    <radialGradient id="plateWell" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#1a0608" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#3a1608" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim highlight -->
    <radialGradient id="rimHighlight" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Small accent plate gradient -->
    <radialGradient id="plateSmall" cx="40%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#1a0608"/>
    </radialGradient>

    <!-- Rose accent glow (Michelin star motif) -->
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle top vignette -->
    <linearGradient id="vignetteTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#1a0e0e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignetteBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="70%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Central warm atmosphere glow -->
  <ellipse cx="800" cy="450" rx="700" ry="480" fill="url(#glowCenter)"/>

  <!-- Layer 2: Hero element — centred within safe zone x:125–1475, y:90–810 -->

  <!-- Rose accent halo behind hero plate (Michelin nod) -->
  <ellipse cx="800" cy="448" rx="310" ry="310" fill="url(#roseGlow)" opacity="0.7"/>

  <!-- Secondary smaller plate — offset upper-left of hero, still in safe zone -->
  <circle cx="595" cy="350" r="118" fill="url(#plateSmall)" opacity="0.82"/>
  <!-- Small plate inner well -->
  <circle cx="595" cy="350" r="74" fill="url(#plateWell)" opacity="0.9"/>
  <!-- Small plate rim thread -->
  <circle cx="595" cy="350" r="118" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.5"/>
  <circle cx="595" cy="350" r="110" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.25"/>

  <!-- Hero main plate — large lacquer disc -->
  <circle cx="820" cy="462" r="242" fill="url(#plateLacquer)" opacity="0.95"/>
  <!-- Plate inner well -->
  <circle cx="820" cy="462" r="178" fill="url(#plateWell)" opacity="0.92"/>
  <!-- Plate outer rim highlight arc (top-left catch-light) -->
  <circle cx="820" cy="462" r="242" fill="none" stroke="url(#rimHighlight)" stroke-width="0"/>
  <!-- Rim as a partial arc suggestion — ellipse for catch light -->
  <ellipse cx="785" cy="418" rx="190" ry="55" fill="url(#rimHighlight)" opacity="0.18"/>
  <!-- Hero plate outer border lines (lacquer rim detail) -->
  <circle cx="820" cy="462" r="242" fill="none" stroke="#c2410c" stroke-width="4" opacity="0.6"/>
  <circle cx="820" cy="462" r="234" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>

  <!-- Abstract petal forms — cherry blossom suggestion, decorative, low opacity -->
  <!-- Petals orbit loosely around hero centre; kept inside safe zone -->
  <ellipse cx="820" cy="235" rx="28" ry="52" fill="#be185d" opacity="0.22" transform="rotate(-12 820 235)"/>
  <ellipse cx="980" cy="298" rx="24" ry="48" fill="#c2410c" opacity="0.20" transform="rotate(48 980 298)"/>
  <ellipse cx="1018" cy="490" rx="22" ry="44" fill="#be185d" opacity="0.18" transform="rotate(95 1018 490)"/>
  <ellipse cx="820" cy="685" rx="26" ry="50" fill="#c2410c" opacity="0.18" transform="rotate(175 820 685)"/>
  <ellipse cx="620" cy="640" rx="22" ry="46" fill="#be185d" opacity="0.16" transform="rotate(230 620 640)"/>
  <ellipse cx="582" cy="440" rx="20" ry="42" fill="#c2410c" opacity="0.18" transform="rotate(275 582 440)"/>

  <!-- Thin chopstick-like accent lines across hero — kaiseki table reference -->
  <line x1="680" y1="700" x2="880" y2="228" stroke="#fbbf24" stroke-width="2" opacity="0.22" stroke-linecap="round"/>
  <line x1="700" y1="710" x2="900" y2="238" stroke="#d97706" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>

  <!-- Layer 3: Edge decoration (outside safe zone, purely atmospheric) -->
  <!-- Corner embers — faint rust circles at extremes -->
  <circle cx="80" cy="80" r="120" fill="#9a3309" opacity="0.12"/>
  <circle cx="1520" cy="820" r="140" fill="#78350f" opacity="0.14"/>
  <circle cx="1540" cy="60" r="90" fill="#be185d" opacity="0.07"/>
  <circle cx="60" cy="840" r="100" fill="#c2410c" opacity="0.09"/>

  <!-- Vignette overlays -->
  <rect width="1600" height="900" fill="url(#vignetteTop)"/>
  <rect width="1600" height="900" fill="url(#vignetteBot)"/>
</svg>
