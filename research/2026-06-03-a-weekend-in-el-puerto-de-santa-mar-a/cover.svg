<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal warm -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2e1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm radial glow centred on the plate -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate base gradient -->
    <radialGradient id="plateGrad" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b0"/>
    </radialGradient>

    <!-- Plate rim shadow -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#c8b89a" stop-opacity="0"/>
      <stop offset="88%" stop-color="#9a7a55" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Cloche / dome gradient -->
    <linearGradient id="clocheGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3b1506"/>
    </linearGradient>

    <!-- Star radial (Michelin dot) -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Candlelight glow -->
    <radialGradient id="candleGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Warm ambient glow behind the hero -->
  <ellipse cx="800" cy="460" rx="620" ry="420" fill="url(#glowGrad)"/>

  <!-- Layer 2: Hero element — fine-dining plate scene, centred ~(800, 450) -->

  <!-- Table surface suggestion: subtle ellipse at the bottom -->
  <ellipse cx="800" cy="700" rx="520" ry="60" fill="#3b1506" opacity="0.55"/>

  <!-- Plate base (large circle) -->
  <circle cx="800" cy="480" r="230" fill="url(#plateGrad)" opacity="0.97"/>
  <!-- Plate rim shading ring -->
  <circle cx="800" cy="480" r="230" fill="url(#rimGrad)" opacity="0.9"/>

  <!-- Inner presentation ring (raised well) -->
  <circle cx="800" cy="472" r="148" fill="none" stroke="#c8b89a" stroke-width="2.5" opacity="0.45"/>

  <!-- Food element: abstract composed trio on the plate -->
  <!-- Central element: small radial bloom (protein/garnish suggestion) -->
  <ellipse cx="800" cy="460" rx="52" ry="28" fill="#9a3309" opacity="0.88"/>
  <ellipse cx="800" cy="452" rx="34" ry="18" fill="#c2410c" opacity="0.82"/>
  <ellipse cx="800" cy="447" rx="18" ry="10" fill="#d97706" opacity="0.75"/>

  <!-- Sauce arc sweep (left) -->
  <path d="M 690 500 Q 720 430 760 445" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M 692 502 Q 722 432 762 447" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Sauce arc sweep (right) -->
  <path d="M 910 500 Q 880 430 840 445" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M 908 502 Q 878 432 838 447" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Micro-herb dots scattered on plate -->
  <circle cx="756" cy="488" r="5" fill="#9a3309" opacity="0.65"/>
  <circle cx="848" cy="484" r="4" fill="#9a3309" opacity="0.6"/>
  <circle cx="774" cy="500" r="3.5" fill="#78350f" opacity="0.55"/>
  <circle cx="827" cy="497" r="4" fill="#78350f" opacity="0.55"/>

  <!-- Wine glass silhouette (right of plate) -->
  <!-- Bowl -->
  <path d="M 1060 310 Q 1100 400 1082 440 L 1078 445 Q 1062 470 1062 470 Q 1062 470 1138 470 Q 1138 470 1138 470 L 1134 445 Q 1118 420 1118 410 Q 1100 370 1140 310 Z" fill="#78350f" opacity="0.72"/>
  <!-- Stem -->
  <rect x="1096" y="470" width="8" height="90" rx="4" fill="#78350f" opacity="0.68"/>
  <!-- Base -->
  <ellipse cx="1100" cy="562" rx="34" ry="8" fill="#78350f" opacity="0.65"/>
  <!-- Wine level inside glass -->
  <path d="M 1068 430 Q 1100 445 1132 430 Q 1126 460 1074 460 Z" fill="#9a3309" opacity="0.65"/>
  <!-- Glass highlight -->
  <path d="M 1070 330 Q 1082 370 1078 405" fill="none" stroke="#faf8f2" stroke-width="2.5" stroke-linecap="round" opacity="0.22"/>

  <!-- Sherry bottle silhouette (left of plate, slightly behind) -->
  <!-- Body -->
  <rect x="625" y="330" width="42" height="160" rx="10" fill="#3b1506" opacity="0.80"/>
  <!-- Shoulder taper -->
  <path d="M 625 330 Q 625 300 636 290 L 656 290 Q 667 300 667 330 Z" fill="#3b1506" opacity="0.80"/>
  <!-- Neck -->
  <rect x="637" y="255" width="18" height="38" rx="5" fill="#3b1506" opacity="0.80"/>
  <!-- Cork / foil -->
  <rect x="638" y="248" width="16" height="10" rx="3" fill="#c2410c" opacity="0.85"/>
  <!-- Label block suggestion -->
  <rect x="630" y="358" width="32" height="44" rx="3" fill="#d97706" opacity="0.30"/>
  <!-- Bottle highlight -->
  <path d="M 633 310 L 633 460" fill="none" stroke="#faf8f2" stroke-width="2" stroke-linecap="round" opacity="0.10"/>

  <!-- Candle (far right accent, partially decorative) -->
  <rect x="1220" y="370" width="18" height="110" rx="4" fill="#faf8f2" opacity="0.18"/>
  <!-- Flame -->
  <ellipse cx="1229" cy="362" rx="7" ry="13" fill="url(#candleGrad)" opacity="0.85"/>
  <!-- Candle glow halo -->
  <ellipse cx="1229" cy="362" rx="28" ry="28" fill="#fbbf24" opacity="0.07"/>

  <!-- Michelin star accent above the plate -->
  <!-- Six-pointed star shape drawn as two overlapping triangles -->
  <polygon points="800,168 812,194 840,194 818,210 826,236 800,220 774,236 782,210 760,194 788,194"
           fill="url(#starGrad)" opacity="0.92"/>

  <!-- Layer 3: Edge decorations (outside safe zone, atmospheric) -->
  <!-- Subtle corner radial warmth -->
  <radialGradient id="cornerL" cx="0%" cy="100%" r="40%">
    <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#cornerL)"/>

  <!-- Thin horizon line across the full width (atmospheric, very faint) -->
  <line x1="0" y1="720" x2="1600" y2="720" stroke="#d97706" stroke-width="1" opacity="0.10"/>
</svg>
