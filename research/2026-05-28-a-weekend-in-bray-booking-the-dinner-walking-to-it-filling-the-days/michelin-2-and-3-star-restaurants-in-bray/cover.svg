<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cottage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cottage2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#be185d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- warm radial glow centered on the hero -->
  <ellipse cx="800" cy="500" rx="780" ry="420" fill="url(#glow)"/>

  <!-- distant hills, full-bleed decoration -->
  <path d="M -50 640 Q 280 560 560 610 T 1100 600 T 1700 590 L 1700 700 L -50 700 Z" fill="#3a1810" opacity="0.7"/>

  <!-- river: gentle Thames bend -->
  <path d="M -50 720 Q 400 660 800 700 T 1700 695 L 1700 920 L -50 920 Z" fill="url(#river)"/>
  <!-- river highlights -->
  <path d="M 180 745 Q 480 720 820 740 T 1420 745" stroke="#d97706" stroke-width="2" fill="none" opacity="0.55"/>
  <path d="M 240 775 Q 540 760 880 770 T 1380 775" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- LEFT cottage (The Fat Duck) -->
  <g opacity="0.95">
    <!-- body -->
    <rect x="430" y="555" width="240" height="140" fill="url(#cottage)"/>
    <!-- pitched roof -->
    <polygon points="410,560 550,455 690,560" fill="#3a1810"/>
    <!-- chimney -->
    <rect x="600" y="475" width="28" height="60" fill="#3a1810"/>
    <!-- glowing window -->
    <rect x="475" y="600" width="48" height="48" fill="#fbbf24" opacity="0.85"/>
    <rect x="575" y="600" width="48" height="48" fill="#fbbf24" opacity="0.7"/>
    <!-- door -->
    <rect x="528" y="618" width="40" height="77" fill="#1a0e0e"/>
  </g>

  <!-- RIGHT cottage (The Waterside Inn) -->
  <g opacity="0.95">
    <rect x="930" y="575" width="260" height="125" fill="url(#cottage2)"/>
    <polygon points="910,580 1060,470 1210,580" fill="#3a1810"/>
    <rect x="970" y="495" width="26" height="55" fill="#3a1810"/>
    <rect x="970" y="610" width="44" height="44" fill="#fbbf24" opacity="0.8"/>
    <rect x="1050" y="610" width="44" height="44" fill="#fbbf24" opacity="0.85"/>
    <rect x="1130" y="610" width="44" height="44" fill="#fbbf24" opacity="0.7"/>
    <rect x="1095" y="628" width="38" height="72" fill="#1a0e0e"/>
  </g>

  <!-- THREE stars: the hero accent, floating above the village -->
  <g>
    <!-- star path centered at 0,0; 5-point -->
    <g transform="translate(660,260)">
      <polygon points="0,-52 14,-16 52,-16 21,8 33,46 0,22 -33,46 -21,8 -52,-16 -14,-16" fill="#fbbf24"/>
      <polygon points="0,-52 14,-16 52,-16 21,8 33,46 0,22 -33,46 -21,8 -52,-16 -14,-16" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.6"/>
    </g>
    <g transform="translate(800,210)">
      <polygon points="0,-66 18,-20 66,-20 27,10 42,58 0,28 -42,58 -27,10 -66,-20 -18,-20" fill="#fbbf24"/>
      <polygon points="0,-66 18,-20 66,-20 27,10 42,58 0,28 -42,58 -27,10 -66,-20 -18,-20" fill="none" stroke="#fef3ec" stroke-width="1.8" opacity="0.7"/>
    </g>
    <g transform="translate(940,260)">
      <polygon points="0,-52 14,-16 52,-16 21,8 33,46 0,22 -33,46 -21,8 -52,-16 -14,-16" fill="#fbbf24"/>
      <polygon points="0,-52 14,-16 52,-16 21,8 33,46 0,22 -33,46 -21,8 -52,-16 -14,-16" fill="none" stroke="#fef3ec" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>

  <!-- subtle reflections of stars on river -->
  <ellipse cx="800" cy="770" rx="42" ry="4" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="660" cy="780" rx="28" ry="3" fill="#fbbf24" opacity="0.25"/>
  <ellipse cx="940" cy="780" rx="28" ry="3" fill="#fbbf24" opacity="0.25"/>
</svg>
