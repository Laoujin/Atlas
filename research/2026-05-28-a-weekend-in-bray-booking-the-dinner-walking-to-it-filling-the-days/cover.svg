<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun glow behind hero -->
  <circle cx="800" cy="430" r="360" fill="url(#sun)" opacity="0.75"/>

  <!-- Distant hill ridge (far bank) -->
  <path d="M0,560 C220,520 380,545 560,535 C760,524 940,560 1140,545 C1320,532 1480,555 1600,548 L1600,640 L0,640 Z"
        fill="#78350f" opacity="0.55"/>

  <!-- Nearer hill / village silhouette with little roofs -->
  <path d="M0,615 L120,615 L150,585 L180,615 L300,615 L330,580 L360,615 L480,615 L510,590 L540,615 L720,615
           L760,575 L800,540 L840,575 L880,615 L1060,615 L1090,585 L1120,615 L1280,615 L1310,580 L1340,615
           L1480,615 L1510,590 L1540,615 L1600,615 L1600,720 L0,720 Z"
        fill="url(#hill)"/>

  <!-- Tiny church spire accent in the village -->
  <path d="M795,540 L800,500 L805,540 Z" fill="#5c2a1a" opacity="0.95"/>

  <!-- Thames -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#river)"/>

  <!-- River reflection bands -->
  <rect x="0" y="745" width="1600" height="3" fill="#fbbf24" opacity="0.35"/>
  <rect x="0" y="780" width="1600" height="2" fill="#fbbf24" opacity="0.22"/>
  <rect x="0" y="820" width="1600" height="2" fill="#fbbf24" opacity="0.15"/>

  <!-- Hero: Michelin star, centered in safe zone -->
  <g transform="translate(800 410)">
    <!-- subtle outer halo -->
    <circle r="180" fill="#fbbf24" opacity="0.18"/>
    <circle r="120" fill="#fbbf24" opacity="0.22"/>
    <!-- five-point star -->
    <path d="M0,-150 L35,-46 L145,-46 L57,18 L90,122 L0,60 L-90,122 L-57,18 L-145,-46 L-35,-46 Z"
          fill="url(#starG)" stroke="#78350f" stroke-width="3" stroke-linejoin="round" opacity="0.95"/>
    <!-- inner highlight -->
    <path d="M0,-110 L22,-32 L100,-32 L40,12 L62,88 L0,42 L-62,88 L-40,12 L-100,-32 L-22,-32 Z"
          fill="#fef3ec" opacity="0.18"/>
  </g>

  <!-- Star reflection on water -->
  <ellipse cx="800" cy="785" rx="90" ry="6" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="800" rx="60" ry="4" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="800" cy="815" rx="36" ry="3" fill="#fbbf24" opacity="0.22"/>
</svg>
