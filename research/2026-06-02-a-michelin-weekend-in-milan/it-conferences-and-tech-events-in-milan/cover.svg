<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1408"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero screen glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero screen face gradient -->
    <linearGradient id="screenFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1408"/>
    </linearGradient>
    <!-- Screen inner highlight -->
    <linearGradient id="screenInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Left badge gradient -->
    <linearGradient id="badgeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Right badge gradient -->
    <linearGradient id="badgeRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Stage platform gradient -->
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b1408" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#screenGlow)"/>

  <!-- Layer 2: Hero element — keynote stage screen centered at (800, 430) -->

  <!-- Stage platform / podium base -->
  <polygon points="560,670 1040,670 1080,710 520,710" fill="url(#stage)" opacity="0.75"/>
  <!-- Podium stand -->
  <rect x="770" y="620" width="60" height="55" fill="#78350f" opacity="0.8"/>

  <!-- Main screen frame (hero, safe zone: x 125-1475, y 90-810) -->
  <!-- Screen outer border/bezel -->
  <rect x="490" y="175" width="620" height="420" rx="12" ry="12"
        fill="#78350f" opacity="0.95"/>
  <!-- Screen face -->
  <rect x="506" y="191" width="588" height="392" rx="8" ry="8"
        fill="url(#screenFace)" opacity="1"/>
  <!-- Screen inner glow overlay -->
  <rect x="506" y="191" width="588" height="392" rx="8" ry="8"
        fill="url(#screenInner)" opacity="1"/>

  <!-- Presentation content bars on screen (abstract slide lines, no letters) -->
  <rect x="540" y="230" width="320" height="18" rx="4" fill="#fbbf24" opacity="0.55"/>
  <rect x="540" y="262" width="220" height="10" rx="3" fill="#d97706" opacity="0.35"/>
  <rect x="540" y="282" width="260" height="10" rx="3" fill="#d97706" opacity="0.28"/>
  <rect x="540" y="316" width="460" height="60" rx="6" fill="#c2410c" opacity="0.25"/>
  <rect x="540" y="395" width="180" height="10" rx="3" fill="#fbbf24" opacity="0.22"/>
  <rect x="540" y="415" width="240" height="10" rx="3" fill="#d97706" opacity="0.18"/>
  <rect x="540" y="435" width="140" height="10" rx="3" fill="#d97706" opacity="0.15"/>
  <!-- Screen bottom accent bar -->
  <rect x="506" y="551" width="588" height="32" rx="0" fill="#9a3309" opacity="0.5"/>

  <!-- Layer 3: Flanking decorative badge cards (outside hero, add depth) -->

  <!-- Left badge card -->
  <rect x="145" y="280" width="290" height="200" rx="10" ry="10"
        fill="url(#badgeLeft)" opacity="0.70"
        transform="rotate(-6, 290, 380)"/>
  <!-- Left badge inner stripe -->
  <rect x="160" y="295" width="260" height="20" rx="4"
        fill="#fbbf24" opacity="0.25"
        transform="rotate(-6, 290, 380)"/>

  <!-- Right badge card -->
  <rect x="1165" y="280" width="290" height="200" rx="10" ry="10"
        fill="url(#badgeRight)" opacity="0.70"
        transform="rotate(6, 1310, 380)"/>
  <!-- Right badge inner stripe -->
  <rect x="1180" y="295" width="260" height="20" rx="4"
        fill="#fbbf24" opacity="0.25"
        transform="rotate(6, 1310, 380)"/>

  <!-- Subtle wide arc suggesting a venue / auditorium sweep at the top -->
  <path d="M 200,820 Q 800,60 1400,820"
        fill="none" stroke="#c2410c" stroke-width="2" opacity="0.18"/>

  <!-- Corner accent marks (fully outside safe zone, decorative only) -->
  <rect x="0" y="0" width="80" height="6" fill="#c2410c" opacity="0.4"/>
  <rect x="0" y="0" width="6" height="80" fill="#c2410c" opacity="0.4"/>
  <rect x="1520" y="0" width="80" height="6" fill="#c2410c" opacity="0.4"/>
  <rect x="1594" y="0" width="6" height="80" fill="#c2410c" opacity="0.4"/>
</svg>
