<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1206"/>
    </linearGradient>

    <!-- Warm radial bloom behind hero -->
    <radialGradient id="bloom" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate fill: warm rust rim with dark centre -->
    <radialGradient id="plate1" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3a1a0a"/>
      <stop offset="68%" stop-color="#5c2a1a"/>
      <stop offset="88%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <radialGradient id="plate2" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2d1206"/>
      <stop offset="65%" stop-color="#4a1f0e"/>
      <stop offset="87%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>

    <!-- Inner plate well -->
    <radialGradient id="well" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Wine glass gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Warm bloom centred on hero -->
  <rect width="1600" height="900" fill="url(#bloom)"/>

  <!-- Layer 2: Hero — two overlapping plates -->

  <!-- Back plate (slightly left, lower opacity) -->
  <ellipse cx="730" cy="465" rx="230" ry="230" fill="url(#plate2)" opacity="0.82"/>
  <!-- Back plate inner well -->
  <ellipse cx="730" cy="458" rx="155" ry="155" fill="url(#well)" opacity="0.7"/>
  <!-- Back plate rim highlight arc -->
  <ellipse cx="730" cy="465" rx="230" ry="230" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.3"/>

  <!-- Front plate (slightly right, full opacity, hero) -->
  <ellipse cx="870" cy="450" rx="230" ry="230" fill="url(#plate1)" opacity="0.95"/>
  <!-- Front plate inner well -->
  <ellipse cx="870" cy="443" rx="155" ry="155" fill="url(#well)" opacity="0.8"/>
  <!-- Front plate rim highlight -->
  <ellipse cx="870" cy="450" rx="230" ry="230" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.45"/>

  <!-- Food accent on front plate: a small organic teardrop / garnish shape -->
  <ellipse cx="870" cy="435" rx="28" ry="18" fill="#d97706" opacity="0.7" transform="rotate(-18 870 435)"/>
  <ellipse cx="845" cy="452" rx="16" ry="10" fill="#c2410c" opacity="0.6" transform="rotate(12 845 452)"/>
  <ellipse cx="895" cy="455" rx="12" ry="8" fill="#fbbf24" opacity="0.5" transform="rotate(-8 895 455)"/>

  <!-- Layer 2b: Wine glass silhouette (right side, inside safe zone) -->
  <!-- Bowl of glass -->
  <path d="M1090,310 Q1145,380 1140,450 Q1135,510 1090,530 Q1045,510 1040,450 Q1035,380 1090,310 Z"
        fill="url(#glass)" opacity="0.62"/>
  <!-- Stem -->
  <rect x="1083" y="530" width="14" height="100" rx="6" fill="#d97706" opacity="0.45"/>
  <!-- Base -->
  <ellipse cx="1090" cy="638" rx="44" ry="11" fill="#9a3309" opacity="0.5"/>
  <!-- Glass bowl rim -->
  <ellipse cx="1090" cy="315" rx="48" ry="10" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.35"/>

  <!-- Layer 3: Edge decoration (can be cropped) — soft vignette corners -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
