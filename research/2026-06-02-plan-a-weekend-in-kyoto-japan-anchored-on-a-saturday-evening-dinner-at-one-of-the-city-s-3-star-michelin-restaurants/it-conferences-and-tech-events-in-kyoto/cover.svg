<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="nodeSmall" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 2: Atmospheric glow centered on hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)" opacity="0.9"/>

  <!-- Layer 3: Edge lines from hub to outer nodes -->
  <!-- Node positions (6 outer nodes arranged around center 800,450):
       N1: 800, 210   (top)
       N2: 1060, 290  (top-right)
       N3: 1080, 590  (bottom-right)
       N4: 800, 690   (bottom)
       N5: 520, 590   (bottom-left)
       N6: 540, 290   (top-left)
  -->
  <line x1="800" y1="450" x2="800"  y2="210"  stroke="#c2410c" stroke-width="3" opacity="0.55"/>
  <line x1="800" y1="450" x2="1060" y2="290"  stroke="#c2410c" stroke-width="3" opacity="0.55"/>
  <line x1="800" y1="450" x2="1080" y2="590"  stroke="#c2410c" stroke-width="3" opacity="0.55"/>
  <line x1="800" y1="450" x2="800"  y2="690"  stroke="#c2410c" stroke-width="3" opacity="0.55"/>
  <line x1="800" y1="450" x2="520"  y2="590"  stroke="#c2410c" stroke-width="3" opacity="0.55"/>
  <line x1="800" y1="450" x2="540"  y2="290"  stroke="#c2410c" stroke-width="3" opacity="0.55"/>

  <!-- Secondary edges between outer nodes (ring connections, partial) -->
  <line x1="800"  y1="210" x2="1060" y2="290"  stroke="#d97706" stroke-width="1.8" opacity="0.32"/>
  <line x1="1060" y1="290" x2="1080" y2="590"  stroke="#d97706" stroke-width="1.8" opacity="0.32"/>
  <line x1="1080" y1="590" x2="800"  y2="690"  stroke="#d97706" stroke-width="1.8" opacity="0.32"/>
  <line x1="800"  y1="690" x2="520"  y2="590"  stroke="#d97706" stroke-width="1.8" opacity="0.32"/>
  <line x1="520"  y1="590" x2="540"  y2="290"  stroke="#d97706" stroke-width="1.8" opacity="0.32"/>
  <line x1="540"  y1="290" x2="800"  y2="210"  stroke="#d97706" stroke-width="1.8" opacity="0.32"/>

  <!-- Cross-chord edges for conference "cross-pollination" feel -->
  <line x1="800"  y1="210" x2="1080" y2="590"  stroke="#9a3309" stroke-width="1.4" opacity="0.22"/>
  <line x1="1060" y1="290" x2="520"  y2="590"  stroke="#9a3309" stroke-width="1.4" opacity="0.22"/>
  <line x1="540"  y1="290" x2="1080" y2="590"  stroke="#9a3309" stroke-width="1.4" opacity="0.22"/>

  <!-- Outer nodes (6) -->
  <circle cx="800"  cy="210" r="30" fill="url(#node)" opacity="0.88"/>
  <circle cx="1060" cy="290" r="26" fill="url(#node)" opacity="0.82"/>
  <circle cx="1080" cy="590" r="28" fill="url(#node)" opacity="0.85"/>
  <circle cx="800"  cy="690" r="24" fill="url(#nodeSmall)" opacity="0.80"/>
  <circle cx="520"  cy="590" r="27" fill="url(#node)" opacity="0.83"/>
  <circle cx="540"  cy="290" r="25" fill="url(#nodeSmall)" opacity="0.80"/>

  <!-- Outer node accent rings -->
  <circle cx="800"  cy="210" r="38" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.30"/>
  <circle cx="1060" cy="290" r="34" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>
  <circle cx="1080" cy="590" r="36" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.28"/>

  <!-- Hero hub node (center) -->
  <circle cx="800" cy="450" r="70" fill="url(#hub)" opacity="0.95"/>
  <!-- Hub outer ring glow -->
  <circle cx="800" cy="450" r="88" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.40"/>
  <circle cx="800" cy="450" r="108" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.20"/>

  <!-- Decorative corner accents (outside safe zone, purely atmospheric) -->
  <circle cx="0"    cy="0"   r="180" fill="#c2410c" opacity="0.06"/>
  <circle cx="1600" cy="900" r="200" fill="#9a3309" opacity="0.07"/>
</svg>
