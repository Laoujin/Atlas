<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3a1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 3: Corner atmosphere (outside safe zone, decorative) -->
  <circle cx="0" cy="0" r="220" fill="#9a3309" fill-opacity="0.08"/>
  <circle cx="1600" cy="900" r="260" fill="#78350f" fill-opacity="0.10"/>
  <circle cx="1600" cy="0" r="140" fill="#c2410c" fill-opacity="0.06"/>
  <circle cx="0" cy="900" r="160" fill="#9a3309" fill-opacity="0.07"/>

  <!-- Layer 2: Hero element — orbit network centered at (800, 450) -->

  <!-- Outer orbit ellipse -->
  <ellipse cx="800" cy="450" rx="420" ry="260" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Middle orbit ellipse -->
  <ellipse cx="800" cy="450" rx="280" ry="172" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- Inner orbit ellipse -->
  <ellipse cx="800" cy="450" rx="148" ry="92" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Hub glow -->
  <circle cx="800" cy="450" r="90" fill="url(#hub)" opacity="0.9"/>
  <!-- Hub core -->
  <circle cx="800" cy="450" r="28" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="450" r="16" fill="#fff" opacity="0.18"/>

  <!-- Nodes on inner orbit (4 nodes) -->
  <circle cx="948" cy="450" r="12" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="948" cy="450" r="6" fill="#d97706"/>

  <circle cx="800" cy="358" r="12" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="800" cy="358" r="6" fill="#d97706"/>

  <circle cx="652" cy="450" r="12" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="652" cy="450" r="6" fill="#d97706"/>

  <circle cx="800" cy="542" r="12" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="800" cy="542" r="6" fill="#d97706"/>

  <!-- Nodes on middle orbit (4 nodes) -->
  <circle cx="1080" cy="450" r="14" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="1080" cy="450" r="7" fill="#c2410c"/>

  <circle cx="800" cy="278" r="14" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="800" cy="278" r="7" fill="#c2410c"/>

  <circle cx="520" cy="450" r="14" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="520" cy="450" r="7" fill="#c2410c"/>

  <circle cx="800" cy="622" r="14" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="800" cy="622" r="7" fill="#c2410c"/>

  <!-- Edge lines from hub to inner nodes -->
  <line x1="800" y1="450" x2="948" y2="450" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="800" y1="450" x2="800" y2="358" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="800" y1="450" x2="652" y2="450" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="800" y1="450" x2="800" y2="542" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Edge lines from inner to middle nodes -->
  <line x1="948" y1="450" x2="1080" y2="450" stroke="#d97706" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="800" y1="358" x2="800" y2="278" stroke="#d97706" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="652" y1="450" x2="520" y2="450" stroke="#d97706" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="800" y1="542" x2="800" y2="622" stroke="#d97706" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Outer orbit nodes (3, offset for visual interest) -->
  <circle cx="1210" cy="390" r="10" fill="url(#nodeGlow)" opacity="0.65"/>
  <circle cx="1210" cy="390" r="5" fill="#9a3309"/>

  <circle cx="440" cy="340" r="10" fill="url(#nodeGlow)" opacity="0.65"/>
  <circle cx="440" cy="340" r="5" fill="#9a3309"/>

  <circle cx="680" cy="700" r="10" fill="url(#nodeGlow)" opacity="0.65"/>
  <circle cx="680" cy="700" r="5" fill="#9a3309"/>

  <!-- Faint cross-edges on outer ring -->
  <line x1="1080" y1="450" x2="1210" y2="390" stroke="#c2410c" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="520" y1="450" x2="440" y2="340" stroke="#c2410c" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="800" y1="622" x2="680" y2="700" stroke="#c2410c" stroke-width="1" stroke-opacity="0.25"/>
</svg>
