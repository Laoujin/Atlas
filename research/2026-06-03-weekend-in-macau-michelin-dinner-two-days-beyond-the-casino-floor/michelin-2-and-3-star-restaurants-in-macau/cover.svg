<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep evening -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Left plate fill -->
    <radialGradient id="plate-left" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>

    <!-- Right plate fill -->
    <radialGradient id="plate-right" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>

    <!-- Cloche gradient -->
    <linearGradient id="cloche-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Rose accent glow -->
    <radialGradient id="rose-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow — full bleed, centers on hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)"/>

  <!-- Rose accent halo behind right plate -->
  <ellipse cx="920" cy="480" rx="220" ry="220" fill="url(#rose-glow)" opacity="0.6"/>

  <!-- Layer 2: Hero element — two fine-dining plates + cloche -->

  <!-- Left plate shadow -->
  <ellipse cx="672" cy="568" rx="185" ry="30" fill="#000" opacity="0.35"/>
  <!-- Left plate body -->
  <ellipse cx="668" cy="548" rx="188" ry="188" fill="url(#plate-left)" opacity="0.92"/>
  <!-- Left plate rim ring -->
  <ellipse cx="668" cy="548" rx="188" ry="188" fill="none" stroke="#c2410c" stroke-width="8" opacity="0.70"/>
  <!-- Left plate inner ring (charger line) -->
  <ellipse cx="668" cy="548" rx="155" ry="155" fill="none" stroke="#d97706" stroke-width="3" opacity="0.55"/>
  <!-- Left plate food element — small rust circle, centered on plate -->
  <circle cx="668" cy="530" r="42" fill="#c2410c" opacity="0.80"/>
  <circle cx="668" cy="530" r="28" fill="#9a3309" opacity="0.90"/>

  <!-- Right plate shadow -->
  <ellipse cx="934" cy="568" rx="185" ry="30" fill="#000" opacity="0.35"/>
  <!-- Right plate body -->
  <ellipse cx="930" cy="548" rx="188" ry="188" fill="url(#plate-right)" opacity="0.92"/>
  <!-- Right plate rim ring -->
  <ellipse cx="930" cy="548" rx="188" ry="188" fill="none" stroke="#be185d" stroke-width="8" opacity="0.65"/>
  <!-- Right plate inner ring -->
  <ellipse cx="930" cy="548" rx="155" ry="155" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.50"/>
  <!-- Right plate food element -->
  <circle cx="930" cy="530" r="42" fill="#d97706" opacity="0.80"/>
  <circle cx="930" cy="530" r="28" fill="#c2410c" opacity="0.90"/>

  <!-- Cloche over left plate — dome silhouette -->
  <ellipse cx="668" cy="362" rx="148" ry="110" fill="url(#cloche-grad)" opacity="0.88"/>
  <!-- Cloche base band -->
  <rect x="520" y="458" width="296" height="18" rx="4" fill="#78350f" opacity="0.90"/>
  <!-- Cloche handle knob -->
  <ellipse cx="668" cy="255" rx="22" ry="16" fill="#d97706" opacity="0.85"/>
  <rect x="658" y="255" width="20" height="52" rx="6" fill="#d97706" opacity="0.80"/>

  <!-- Three abstract Michelin-star diamonds floating above plates (decorative, low opacity) -->
  <!-- Star 1 — center top -->
  <polygon points="800,180 816,210 800,240 784,210" fill="#fbbf24" opacity="0.55"/>
  <!-- Star 2 — left of center -->
  <polygon points="720,200 733,225 720,250 707,225" fill="#fbbf24" opacity="0.42"/>
  <!-- Star 3 — right of center -->
  <polygon points="880,200 893,225 880,250 867,225" fill="#fbbf24" opacity="0.42"/>

  <!-- Layer 3: Edge decorations (outside safe zone, purely atmospheric) -->
  <!-- Bottom-left corner warm sweep -->
  <ellipse cx="0" cy="900" rx="340" ry="280" fill="#c2410c" opacity="0.09"/>
  <!-- Top-right corner rose sweep -->
  <ellipse cx="1600" cy="0" rx="360" ry="280" fill="#be185d" opacity="0.07"/>
</svg>
