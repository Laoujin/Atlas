<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="410" rx="620" ry="430" fill="url(#glow)"/>

  <!-- faint skyline base (decoration, low in frame) -->
  <g fill="#1a0e0e" opacity="0.65">
    <rect x="180" y="690" width="120" height="160"/>
    <rect x="320" y="640" width="90" height="210"/>
    <rect x="430" y="710" width="110" height="140"/>
    <rect x="1060" y="700" width="100" height="150"/>
    <rect x="1180" y="650" width="95" height="200"/>
    <rect x="1290" y="715" width="120" height="135"/>
  </g>

  <!-- HERO: Macau Tower silhouette, centered -->
  <g opacity="0.95">
    <!-- shaft -->
    <polygon points="788,300 812,300 826,720 774,720" fill="url(#tower)"/>
    <!-- observation pod -->
    <ellipse cx="800" cy="300" rx="86" ry="30" fill="#c2410c"/>
    <ellipse cx="800" cy="290" rx="62" ry="22" fill="#d97706"/>
    <!-- spire -->
    <polygon points="797,300 803,300 800,150" fill="#fbbf24"/>
    <circle cx="800" cy="150" r="7" fill="#fbbf24"/>
    <!-- base spread -->
    <polygon points="774,720 826,720 870,790 730,790" fill="#78350f"/>
  </g>
</svg>
