<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1008"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm radial glow centered on hero -->
    <radialGradient id="glow" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate fill gradient — warm ivory -->
    <radialGradient id="plate1fill" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>
    <radialGradient id="plate2fill" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>

    <!-- Inner plate well -->
    <radialGradient id="well1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Wine glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Rose accent glow for glass bowl -->
    <radialGradient id="wineGlow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric mid-glow behind hero -->
  <ellipse cx="800" cy="470" rx="620" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — wine glass + two plates, centered ~(800,450) -->

  <!-- Wine glass silhouette: bowl top ~y=175, stem base ~y=420, safe zone top=90 -->
  <!-- Bowl: roughly ellipse centered (800, 250), rx=90 ry=110 -->
  <!-- Using a path: wide bowl, narrow stem, flat foot -->

  <!-- Wine fill inside bowl (rose) -->
  <ellipse cx="800" cy="290" rx="82" ry="62" fill="url(#wineGlow)" opacity="0.85"/>

  <!-- Glass bowl outline (clip by path shape) -->
  <!-- Bowl left curve down to stem, right curve down to stem -->
  <path d="
    M 718 195
    Q 706 260 716 310
    Q 730 350 800 358
    Q 870 350 884 310
    Q 894 260 882 195
    Z
  " fill="url(#glassGrad)" opacity="0.75"/>

  <!-- Highlight on glass bowl -->
  <path d="
    M 730 210
    Q 722 255 728 300
    Q 731 320 740 335
    Q 726 310 720 270
    Q 716 235 726 205
    Z
  " fill="#fbbf24" opacity="0.25"/>

  <!-- Glass stem -->
  <rect x="793" y="355" width="14" height="95" rx="4" fill="#fbbf24" opacity="0.55"/>

  <!-- Glass foot -->
  <ellipse cx="800" cy="454" rx="52" ry="11" fill="#fbbf24" opacity="0.45"/>
  <!-- Foot inner shadow -->
  <ellipse cx="800" cy="454" rx="38" ry="7" fill="#9a3309" opacity="0.30"/>

  <!-- Plate 1 (left, slightly lower) — center (660, 600), r=155 -->
  <circle cx="660" cy="600" r="155" fill="#9a3309" opacity="0.40"/>
  <circle cx="660" cy="600" r="148" fill="url(#plate1fill)" opacity="0.92"/>
  <!-- Plate rim ring -->
  <circle cx="660" cy="600" r="148" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.50"/>
  <!-- Inner well -->
  <circle cx="660" cy="600" r="105" fill="url(#well1)" opacity="0.80"/>
  <!-- Food accent dot — small composition element on plate 1 -->
  <circle cx="648" cy="592" r="18" fill="#c2410c" opacity="0.70"/>
  <circle cx="672" cy="608" r="12" fill="#d97706" opacity="0.65"/>
  <circle cx="655" cy="618" r="8"  fill="#9a3309" opacity="0.60"/>

  <!-- Plate 2 (right, slightly higher) — center (940, 575), r=148 -->
  <circle cx="940" cy="575" r="148" fill="#9a3309" opacity="0.38"/>
  <circle cx="940" cy="575" r="141" fill="url(#plate2fill)" opacity="0.90"/>
  <circle cx="940" cy="575" r="141" fill="none" stroke="#c2410c" stroke-width="5" opacity="0.45"/>
  <circle cx="940" cy="575" r="100" fill="url(#well1)" opacity="0.75"/>
  <!-- Food accent dots on plate 2 -->
  <circle cx="930" cy="567" r="15" fill="#be185d" opacity="0.60"/>
  <circle cx="952" cy="580" r="10" fill="#c2410c" opacity="0.65"/>
  <circle cx="936" cy="588" r="7"  fill="#d97706" opacity="0.55"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone — atmospheric only) -->

  <!-- Subtle corner arc top-left — decorative, will be cropped -->
  <path d="M 0 0 Q 180 0 180 180" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.18"/>
  <path d="M 0 0 Q 240 0 240 240" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.12"/>

  <!-- Subtle corner arc bottom-right -->
  <path d="M 1600 900 Q 1420 900 1420 720" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.18"/>
  <path d="M 1600 900 Q 1360 900 1360 660" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.12"/>

  <!-- Faint horizontal table-line below plates — full bleed atmospheric -->
  <rect x="0" y="768" width="1600" height="2" fill="#78350f" opacity="0.35"/>
  <rect x="0" y="775" width="1600" height="80" fill="#78350f" opacity="0.20"/>

</svg>
