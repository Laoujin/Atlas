<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background deep glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3d0e0e"/>
      <stop offset="55%" stop-color="#1f0808"/>
      <stop offset="100%" stop-color="#0d0404"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plateMain" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.22"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.75"/>
    </radialGradient>
    <!-- Star fill gradient -->
    <radialGradient id="starFill" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Rose accent ring -->
    <radialGradient id="roseRing" cx="50%" cy="50%" r="50%">
      <stop offset="74%" stop-color="#be185d" stop-opacity="0"/>
      <stop offset="88%" stop-color="#be185d" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9a1050" stop-opacity="0.28"/>
    </radialGradient>
    <!-- Warm halo behind hero -->
    <radialGradient id="heroHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Atmospheric warm edge bleed -->
  <rect width="1600" height="900" fill="none" stroke="#c2410c" stroke-width="0" opacity="0"/>
  <!-- Subtle corner warmth bottom -->
  <ellipse cx="800" cy="900" rx="900" ry="320" fill="#78350f" opacity="0.18"/>

  <!-- Layer 2: Hero element — centered at (800, 450), within safe zone -->

  <!-- Hero halo wash -->
  <ellipse cx="800" cy="450" rx="480" ry="340" fill="url(#heroHalo)"/>

  <!-- Outer rose accent ring (decorative halo behind plates) -->
  <ellipse cx="800" cy="450" rx="370" ry="370" fill="url(#roseRing)"/>

  <!-- Plate shadow base -->
  <ellipse cx="808" cy="468" rx="268" ry="268" fill="#0d0404" opacity="0.55"/>

  <!-- Main plate circle -->
  <circle cx="800" cy="450" r="268" fill="url(#plateMain)" opacity="0.95"/>
  <!-- Plate rim ring -->
  <circle cx="800" cy="450" r="268" fill="url(#plateRim)" opacity="0.90"/>
  <!-- Inner plate well -->
  <circle cx="800" cy="450" r="198" fill="#1a0a06" opacity="0.62"/>
  <!-- Inner plate sheen -->
  <ellipse cx="780" cy="418" rx="120" ry="64" fill="#fef3ec" opacity="0.04"/>

  <!-- Star glow bloom -->
  <circle cx="800" cy="450" r="160" fill="url(#starGlow)"/>

  <!-- 5-pointed Michelin star — polygon points calculated for r_outer=96, r_inner=42 -->
  <!-- Points: tip at top, rotating clockwise -->
  <!-- outer: 96, inner: 42 -->
  <!-- 0deg tip: (800, 354) -->
  <!-- Each outer tip: angle = -90 + n*72; each inner: angle = -90 + 36 + n*72 -->
  <polygon
    points="
      800,354
      822.4,416.2
      886.8,416.2
      834.8,454.2
      855.2,518.2
      800,482.0
      744.8,518.2
      765.2,454.2
      713.2,416.2
      777.6,416.2
    "
    fill="url(#starFill)"
    opacity="0.95"
  />

  <!-- Star inner highlight -->
  <polygon
    points="
      800,354
      822.4,416.2
      886.8,416.2
      834.8,454.2
      855.2,518.2
      800,482.0
      744.8,518.2
      765.2,454.2
      713.2,416.2
      777.6,416.2
    "
    fill="none"
    stroke="#fbbf24"
    stroke-width="2.5"
    opacity="0.55"
  />

  <!-- Second star — smaller, offset upper right, suggesting "2–3 stars" motif -->
  <!-- Scaled to 58% of primary, centered at (940, 340) — still within safe zone -->
  <polygon
    points="
      940,284.3
      953.1,321.8
      992.1,321.8
      960.8,344.5
      973.0,381.7
      940,360.0
      907.0,381.7
      919.2,344.5
      887.9,321.8
      926.9,321.8
    "
    fill="url(#starFill)"
    opacity="0.68"
  />

  <!-- Third star — smaller still, offset lower left, completing the constellation -->
  <!-- Scaled to 46%, centered at (662, 340) -->
  <polygon
    points="
      662,295.8
      673.0,327.2
      706.0,327.2
      679.2,346.2
      689.4,377.4
      662,360.0
      634.6,377.4
      644.8,346.2
      618.0,327.2
      651.0,327.2
    "
    fill="url(#starFill)"
    opacity="0.55"
  />

  <!-- Layer 3: Peripheral decoration — outside safe zone or low-meaning -->
  <!-- Top edge thin rule line -->
  <line x1="0" y1="48" x2="1600" y2="48" stroke="#c2410c" stroke-width="1.5" opacity="0.20"/>
  <!-- Bottom edge thin rule line -->
  <line x1="0" y1="852" x2="1600" y2="852" stroke="#c2410c" stroke-width="1.5" opacity="0.20"/>

  <!-- Corner rose accents — decorative, will partially crop -->
  <circle cx="0" cy="0" r="120" fill="#be185d" opacity="0.07"/>
  <circle cx="1600" cy="900" r="120" fill="#be185d" opacity="0.07"/>

</svg>
