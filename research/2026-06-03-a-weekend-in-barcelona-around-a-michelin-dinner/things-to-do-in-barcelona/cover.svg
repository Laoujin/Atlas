<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="560" rx="640" ry="420" fill="url(#glow)"/>

  <!-- Sagrada Família spire cluster: tall tapering needles -->
  <g fill="url(#spire)" opacity="0.92">
    <path d="M620 760 L645 320 Q650 300 655 320 L680 760 Z"/>
    <path d="M712 770 L745 230 Q752 205 759 230 L792 770 Z"/>
    <path d="M812 775 L800 165 Q806 138 812 165 L824 775 Z" fill="#c2410c"/>
    <path d="M838 770 L855 230 Q862 205 869 230 L902 770 Z"/>
    <path d="M928 760 L945 320 Q950 300 955 320 L980 760 Z"/>
  </g>

  <!-- spire crown finials -->
  <g fill="#fbbf24" opacity="0.95">
    <circle cx="650" cy="312" r="11"/>
    <circle cx="752" cy="222" r="13"/>
    <circle cx="806" cy="156" r="16"/>
    <circle cx="862" cy="222" r="13"/>
    <circle cx="950" cy="312" r="11"/>
  </g>

  <!-- Gaudí trencadís mosaic curve sweeping the base -->
  <path d="M125 720 Q500 640 800 700 T1475 690 L1475 810 L125 810 Z" fill="#78350f" opacity="0.85"/>
  <path d="M125 760 Q540 690 800 740 T1475 735" fill="none" stroke="#d97706" stroke-width="14" opacity="0.7"/>
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="360" cy="728" r="9"/>
    <circle cx="560" cy="712" r="7"/>
    <circle cx="1040" cy="715" r="8"/>
    <circle cx="1260" cy="722" r="9"/>
  </g>
</svg>
