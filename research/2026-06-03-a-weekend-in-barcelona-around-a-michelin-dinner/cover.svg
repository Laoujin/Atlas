<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm candlelight radial glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient: warm ceramic -->
    <radialGradient id="plateGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b5"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="88%" stop-color="#78350f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3a1a0a" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Food element on plate -->
    <radialGradient id="foodGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Glass body gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#fef3ec" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.10"/>
    </linearGradient>
    <!-- Rose accent gradient -->
    <radialGradient id="roseAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Table surface -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a0a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Ambient candlelight glow across centre -->
  <rect width="1600" height="900" fill="url(#glowCenter)"/>

  <!-- Rose accent: subtle left bloom (atmospheric, outside safe zone vertically) -->
  <ellipse cx="350" cy="820" rx="320" ry="220" fill="url(#roseAccent)" opacity="0.35"/>

  <!-- Rose accent: subtle right bloom -->
  <ellipse cx="1250" cy="820" rx="280" ry="200" fill="url(#roseAccent)" opacity="0.28"/>

  <!-- Table surface suggestion at the bottom -->
  <ellipse cx="800" cy="780" rx="780" ry="130" fill="url(#tableGrad)" opacity="0.85"/>

  <!-- Layer 2: Hero element — wine glass centered at ~(800, 430) -->

  <!-- Wine glass bowl (ellipse goblet shape via path) -->
  <!-- Bowl -->
  <ellipse cx="800" cy="430" rx="88" ry="105" fill="url(#glassGrad)" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.35" opacity="0.82"/>
  <!-- Wine inside bowl: deep rose/red -->
  <ellipse cx="800" cy="462" rx="72" ry="58" fill="#be185d" opacity="0.62"/>
  <ellipse cx="800" cy="452" rx="72" ry="18" fill="#9a3309" opacity="0.45"/>
  <!-- Glass highlight -->
  <ellipse cx="778" cy="400" rx="16" ry="38" fill="#fef3ec" opacity="0.18" transform="rotate(-12,778,400)"/>

  <!-- Stem -->
  <rect x="793" y="533" width="14" height="105" rx="6" fill="#fef3ec" opacity="0.22"/>
  <!-- Base -->
  <ellipse cx="800" cy="640" rx="62" ry="12" fill="#fef3ec" opacity="0.20"/>
  <ellipse cx="800" cy="640" rx="62" ry="12" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Plate 1: left of glass, slightly forward -->
  <!-- Outer plate rim -->
  <ellipse cx="570" cy="660" rx="148" ry="58" fill="url(#plateGrad)" opacity="0.92"/>
  <ellipse cx="570" cy="660" rx="148" ry="58" fill="url(#plateRim)" opacity="1"/>
  <!-- Inner plate well -->
  <ellipse cx="570" cy="657" rx="108" ry="42" fill="url(#plateGrad)" opacity="0.98"/>
  <!-- Food element: small composed morsel -->
  <ellipse cx="570" cy="653" rx="32" ry="18" fill="url(#foodGrad)" opacity="0.88"/>
  <ellipse cx="560" cy="647" rx="12" ry="8" fill="#fbbf24" opacity="0.70"/>
  <!-- Sauce swipe -->
  <path d="M 538 661 Q 572 648 608 658" stroke="#c2410c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Plate 2: right of glass, slightly back -->
  <ellipse cx="1030" cy="648" rx="138" ry="54" fill="url(#plateGrad)" opacity="0.88"/>
  <ellipse cx="1030" cy="648" rx="138" ry="54" fill="url(#plateRim)" opacity="1"/>
  <ellipse cx="1030" cy="645" rx="100" ry="40" fill="url(#plateGrad)" opacity="0.95"/>
  <!-- Food element -->
  <ellipse cx="1030" cy="641" rx="28" ry="16" fill="url(#foodGrad)" opacity="0.85"/>
  <ellipse cx="1022" cy="636" rx="10" ry="7" fill="#fbbf24" opacity="0.68"/>
  <path d="M 1002 649 Q 1032 637 1062 646" stroke="#c2410c" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.50"/>

  <!-- Michelin star shape: small, above the glass, decorative not labeling -->
  <!-- Star at (800, 285) — a single warm star as atmosphere -->
  <circle cx="800" cy="285" r="22" fill="url(#starGlow)" opacity="0.75"/>
  <polygon points="800,268 804,280 817,280 807,288 811,300 800,292 789,300 793,288 783,280 796,280"
           fill="#fbbf24" opacity="0.90"/>

  <!-- Two smaller ambient stars flanking (decorative, low opacity) -->
  <circle cx="680" cy="310" r="12" fill="url(#starGlow)" opacity="0.45"/>
  <polygon points="680,302 682,308 688,308 683,312 685,318 680,314 675,318 677,312 672,308 678,308"
           fill="#fbbf24" opacity="0.55"/>

  <circle cx="920" cy="298" r="12" fill="url(#starGlow)" opacity="0.42"/>
  <polygon points="920,290 922,296 928,296 923,300 925,306 920,302 915,306 917,300 912,296 918,296"
           fill="#fbbf24" opacity="0.52"/>

  <!-- Subtle candle flame suggestion above glass (very faint) -->
  <ellipse cx="800" cy="330" rx="6" ry="14" fill="#fbbf24" opacity="0.30"/>
  <ellipse cx="800" cy="325" rx="3" ry="8" fill="#fef3ec" opacity="0.22"/>

  <!-- Layer 3: Edge atmosphere — full-bleed dark vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="#1a0e0e" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
