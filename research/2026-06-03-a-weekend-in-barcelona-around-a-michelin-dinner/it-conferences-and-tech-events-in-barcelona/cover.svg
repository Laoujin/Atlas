<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle city-grid lines (atmospheric, low opacity) -->
  <g stroke="#c2410c" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="533" y1="0" x2="533" y2="900"/>
    <line x1="1067" y1="0" x2="1067" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Layer 2: radial glow behind hero -->
  <ellipse cx="800" cy="450" rx="600" ry="340" fill="url(#glow)"/>

  <!-- Layer 2: Hero — three stacked angled conference screens/slides -->

  <!-- Back card (bottom-most, tilted left) -->
  <g opacity="0.72">
    <rect x="310" y="255" width="780" height="440"
          rx="18" ry="18"
          transform="rotate(-6 700 475)"
          fill="url(#card2)" opacity="0.85"/>
    <!-- inner bar lines suggesting slide content -->
    <rect x="360" y="340" width="420" height="18" rx="4"
          transform="rotate(-6 700 475)"
          fill="#fbbf24" opacity="0.22"/>
    <rect x="360" y="378" width="310" height="14" rx="4"
          transform="rotate(-6 700 475)"
          fill="#fbbf24" opacity="0.14"/>
    <rect x="360" y="408" width="260" height="14" rx="4"
          transform="rotate(-6 700 475)"
          fill="#fbbf24" opacity="0.11"/>
  </g>

  <!-- Mid card (tilted right) -->
  <g opacity="0.82">
    <rect x="470" y="230" width="780" height="440"
          rx="18" ry="18"
          transform="rotate(5 860 450)"
          fill="url(#card1)" opacity="0.90"/>
    <rect x="530" y="320" width="440" height="18" rx="4"
          transform="rotate(5 860 450)"
          fill="#fbbf24" opacity="0.25"/>
    <rect x="530" y="358" width="320" height="14" rx="4"
          transform="rotate(5 860 450)"
          fill="#fbbf24" opacity="0.16"/>
    <rect x="530" y="388" width="270" height="14" rx="4"
          transform="rotate(5 860 450)"
          fill="#fbbf24" opacity="0.12"/>
    <!-- small accent circle (LED dot / badge) -->
    <circle cx="870" cy="280" r="22"
            transform="rotate(5 860 450)"
            fill="#fbbf24" opacity="0.55"/>
  </g>

  <!-- Front card (hero, flat) -->
  <g opacity="0.95">
    <rect x="320" y="250" width="960" height="400"
          rx="22" ry="22"
          fill="#78350f"/>
    <rect x="320" y="250" width="960" height="400"
          rx="22" ry="22"
          fill="url(#card3)" opacity="0.70"/>
    <!-- wide header band -->
    <rect x="320" y="250" width="960" height="72"
          rx="22" ry="22"
          fill="#c2410c" opacity="0.60"/>
    <rect x="320" y="298" width="960" height="24"
          fill="#c2410c" opacity="0.60"/>
    <!-- content bars -->
    <rect x="390" y="365" width="500" height="22" rx="5"
          fill="#fbbf24" opacity="0.45"/>
    <rect x="390" y="408" width="380" height="16" rx="4"
          fill="#fbbf24" opacity="0.28"/>
    <rect x="390" y="440" width="320" height="16" rx="4"
          fill="#fbbf24" opacity="0.22"/>
    <rect x="390" y="472" width="430" height="16" rx="4"
          fill="#fbbf24" opacity="0.18"/>
    <!-- accent node cluster (lower-right of card) -->
    <circle cx="1140" cy="520" r="38" fill="#d97706" opacity="0.30"/>
    <circle cx="1140" cy="520" r="22" fill="#fbbf24" opacity="0.45"/>
    <circle cx="1140" cy="520" r="10" fill="#fef3ec" opacity="0.70"/>
    <!-- connecting lines from node -->
    <line x1="1118" y1="520" x2="1050" y2="490" stroke="#fbbf24" stroke-width="2" opacity="0.30"/>
    <line x1="1118" y1="520" x2="1070" y2="540" stroke="#fbbf24" stroke-width="2" opacity="0.22"/>
  </g>

  <!-- Layer 3: edge decorations (outside safe zone, full-bleed atmosphere) -->
  <rect x="0" y="0" width="220" height="900" fill="url(#edgeL)"/>
  <rect x="1380" y="0" width="220" height="900" fill="url(#edgeR)"/>

  <!-- Corner accent arcs (Barcelona Gaudi-esque curve motif) -->
  <path d="M 0 0 Q 80 0 80 80" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 0 0 Q 140 0 140 140" stroke="#d97706" stroke-width="2" fill="none" opacity="0.15"/>
  <path d="M 1600 900 Q 1520 900 1520 820" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 1600 900 Q 1460 900 1460 760" stroke="#d97706" stroke-width="2" fill="none" opacity="0.15"/>
</svg>
