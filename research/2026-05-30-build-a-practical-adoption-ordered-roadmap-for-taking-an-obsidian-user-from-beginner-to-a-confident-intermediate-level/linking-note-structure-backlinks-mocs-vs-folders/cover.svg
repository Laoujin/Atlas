<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Left side: rigid folder tree (cropped a bit on card) -->
  <g opacity="0.82">
    <!-- Trunk line -->
    <path d="M 360 230 L 360 660" stroke="#78350f" stroke-width="3" fill="none"/>
    <!-- Branch lines (rigid right-angles) -->
    <path d="M 360 310 L 470 310 M 360 410 L 470 410 M 360 510 L 470 510 M 360 610 L 470 610" stroke="#78350f" stroke-width="3" fill="none"/>

    <!-- Root folder -->
    <path d="M 290 200 L 360 200 L 380 220 L 470 220 L 470 290 L 290 290 Z" fill="url(#folder)"/>
    <!-- Child folders -->
    <path d="M 470 290 L 520 290 L 535 305 L 600 305 L 600 345 L 470 345 Z" fill="#9a3309" opacity="0.9"/>
    <path d="M 470 390 L 520 390 L 535 405 L 600 405 L 600 445 L 470 445 Z" fill="#9a3309" opacity="0.9"/>
    <path d="M 470 490 L 520 490 L 535 505 L 600 505 L 600 545 L 470 545 Z" fill="#9a3309" opacity="0.9"/>
    <path d="M 470 590 L 520 590 L 535 605 L 600 605 L 600 645 L 470 645 Z" fill="#9a3309" opacity="0.9"/>
  </g>

  <!-- Morph zone: dashed arrows from folder side bridging to graph -->
  <g stroke="#c2410c" stroke-width="2.5" fill="none" opacity="0.55" stroke-dasharray="6 8">
    <path d="M 610 325 Q 720 380 820 430"/>
    <path d="M 610 425 Q 720 440 820 450"/>
    <path d="M 610 525 Q 720 490 820 470"/>
    <path d="M 610 625 Q 720 550 820 490"/>
  </g>

  <!-- Right side: MOC hub-and-spoke graph (the hero, centered ~ (1050, 450)) -->
  <g>
    <!-- Spokes (drawn under nodes) -->
    <g stroke="#9a3309" stroke-width="2.5" fill="none" opacity="0.7">
      <line x1="1050" y1="450" x2="880" y2="300"/>
      <line x1="1050" y1="450" x2="1230" y2="280"/>
      <line x1="1050" y1="450" x2="1380" y2="420"/>
      <line x1="1050" y1="450" x2="1330" y2="650"/>
      <line x1="1050" y1="450" x2="1080" y2="720"/>
      <line x1="1050" y1="450" x2="850" y2="640"/>
      <line x1="1050" y1="450" x2="820" y2="460"/>
      <!-- Backlinks: a few node-to-node cross edges -->
      <path d="M 880 300 Q 1000 240 1230 280" opacity="0.45"/>
      <path d="M 1380 420 Q 1400 540 1330 650" opacity="0.45"/>
      <path d="M 850 640 Q 950 720 1080 720" opacity="0.45"/>
    </g>

    <!-- Orbit ring (subtle) -->
    <circle cx="1050" cy="450" r="220" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.35" stroke-dasharray="2 6"/>

    <!-- Peripheral nodes -->
    <circle cx="880" cy="300" r="22" fill="url(#node)" opacity="0.92"/>
    <circle cx="1230" cy="280" r="26" fill="url(#node)" opacity="0.92"/>
    <circle cx="1380" cy="420" r="20" fill="url(#node)" opacity="0.9"/>
    <circle cx="1330" cy="650" r="24" fill="url(#node)" opacity="0.92"/>
    <circle cx="1080" cy="720" r="22" fill="url(#node)" opacity="0.9"/>
    <circle cx="850" cy="640" r="26" fill="url(#node)" opacity="0.92"/>
    <circle cx="820" cy="460" r="18" fill="url(#node)" opacity="0.88"/>

    <!-- Small teal accent node (the "linked-from-elsewhere" backlink) -->
    <circle cx="1450" cy="530" r="12" fill="#0e7490" opacity="0.75"/>
    <line x1="1380" y1="420" x2="1450" y2="530" stroke="#0e7490" stroke-width="1.8" opacity="0.55"/>

    <!-- MOC hub (hero) -->
    <circle cx="1050" cy="450" r="78" fill="url(#hub)"/>
    <circle cx="1050" cy="450" r="78" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <!-- Inner concentric mark suggesting an "index" / hub of hubs -->
    <circle cx="1050" cy="450" r="40" fill="none" stroke="#fef3ec" stroke-width="2" opacity="0.7"/>
    <circle cx="1050" cy="450" r="10" fill="#fef3ec" opacity="0.85"/>
  </g>
</svg>
