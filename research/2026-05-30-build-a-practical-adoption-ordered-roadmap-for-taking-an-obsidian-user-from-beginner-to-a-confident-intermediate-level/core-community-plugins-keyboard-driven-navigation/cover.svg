<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="panelBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="panelMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="panelFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="780" ry="420" fill="url(#glow)"/>

  <!-- Decorative plugin-tile grid (background, low opacity, may crop) -->
  <g opacity="0.18" fill="none" stroke="#78350f" stroke-width="2">
    <rect x="80"   y="80"  width="90" height="90" rx="10"/>
    <rect x="190"  y="80"  width="90" height="90" rx="10"/>
    <rect x="80"   y="190" width="90" height="90" rx="10"/>
    <rect x="1430" y="630" width="90" height="90" rx="10"/>
    <rect x="1320" y="740" width="90" height="90" rx="10"/>
    <rect x="1430" y="740" width="90" height="90" rx="10"/>
  </g>

  <!-- Decorative shortcut path lines (background) -->
  <g opacity="0.22" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 8">
    <path d="M 130 230 Q 400 380 700 420"/>
    <path d="M 1470 670 Q 1200 540 900 480"/>
  </g>

  <!-- Hero: stacked command-palette panels, centered around (800, 450) -->
  <!-- Back panel -->
  <g>
    <rect x="430" y="200" width="820" height="440" rx="22" fill="url(#panelBack)" stroke="#9a3309" stroke-width="2" opacity="0.85"/>
    <!-- result rows as faint bars -->
    <rect x="470" y="270" width="620" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
    <rect x="470" y="310" width="540" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
    <rect x="470" y="350" width="680" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
    <rect x="470" y="390" width="500" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
    <rect x="470" y="430" width="600" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
    <rect x="470" y="470" width="460" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
    <rect x="470" y="510" width="640" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
    <rect x="470" y="550" width="520" height="14" rx="7" fill="#9a3309" opacity="0.18"/>
  </g>

  <!-- Middle panel (amber band — the selected result) -->
  <g>
    <rect x="380" y="280" width="820" height="80" rx="14" fill="url(#panelMid)" opacity="0.92" stroke="#78350f" stroke-width="2"/>
    <!-- inline icon dot -->
    <circle cx="425" cy="320" r="14" fill="#faf8f2" opacity="0.85"/>
    <!-- faux text bar -->
    <rect x="455" y="312" width="520" height="16" rx="8" fill="#faf8f2" opacity="0.75"/>
    <rect x="455" y="334" width="340" height="10" rx="5" fill="#faf8f2" opacity="0.55"/>
  </g>

  <!-- Front panel (the hero — input bar of the palette) -->
  <g>
    <rect x="340" y="370" width="820" height="170" rx="18" fill="url(#panelFront)" stroke="#1a0e0e" stroke-width="2"/>
    <!-- caret block on the left -->
    <rect x="380" y="430" width="22" height="50" rx="4" fill="#fbbf24" opacity="0.95"/>
    <!-- query bar -->
    <rect x="420" y="442" width="560" height="26" rx="13" fill="#faf8f2" opacity="0.22"/>
    <!-- right-side hint chip (keycap shape) -->
    <rect x="1030" y="420" width="100" height="70" rx="12" fill="url(#keycap)" stroke="#fef3ec" stroke-width="2" opacity="0.9"/>
    <rect x="1046" y="442" width="68" height="26" rx="6" fill="#78350f" opacity="0.45"/>
  </g>

  <!-- Hero accent: a single keycap floating above-right of the palette stack, connecting kbd <-> plugin -->
  <g>
    <rect x="1180" y="220" width="140" height="140" rx="18" fill="url(#keycap)" stroke="#9a3309" stroke-width="3" opacity="0.95"/>
    <rect x="1180" y="320" width="140" height="40" rx="0 0 18 18" fill="#9a3309" opacity="0.35"/>
    <!-- arrow glyph (geometric, not a letter) pointing into the palette -->
    <path d="M 1280 290 L 1230 290 L 1230 270 L 1200 295 L 1230 320 L 1230 300 L 1280 300 Z"
          fill="#78350f" opacity="0.8"/>
  </g>

  <!-- Connecting spark from keycap into the selected (middle) panel -->
  <path d="M 1190 360 Q 1140 360 1100 340" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.85"/>
  <circle cx="1100" cy="340" r="5" fill="#fbbf24" opacity="0.95"/>
</svg>
