<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep warm dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1408"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <!-- Central radial glow behind hand -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hand fill gradient -->
    <linearGradient id="handGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Broken shard fill -->
    <linearGradient id="shardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Highlight on fingers -->
    <linearGradient id="fingerHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Ambient radial glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: HERO — stylised open hand, centered ~800,460, safe zone clear -->

  <!-- Palm body: broad rounded trapezoid -->
  <path d="M 640,640 C 620,660 615,700 640,720 L 960,720 C 985,700 980,660 960,640 L 920,530 L 680,530 Z"
        fill="url(#handGrad)" opacity="0.93"/>

  <!-- Thumb: angled out to the left -->
  <path d="M 660,580 C 630,560 590,540 560,510 C 540,490 545,460 565,455 C 588,450 610,465 625,490 L 660,545 Z"
        fill="url(#handGrad)" opacity="0.88"/>

  <!-- Index finger -->
  <path d="M 695,532 L 688,340 C 687,318 700,305 716,305 C 732,305 744,318 743,340 L 736,532 Z"
        fill="url(#handGrad)" opacity="0.90"/>

  <!-- Middle finger — tallest -->
  <path d="M 760,530 L 755,300 C 754,275 768,260 785,260 C 802,260 816,275 815,300 L 808,530 Z"
        fill="url(#handGrad)" opacity="0.92"/>

  <!-- Ring finger -->
  <path d="M 828,530 L 825,320 C 824,298 837,285 853,285 C 869,285 881,298 880,320 L 875,530 Z"
        fill="url(#handGrad)" opacity="0.90"/>

  <!-- Pinky finger — shortest -->
  <path d="M 892,530 L 891,370 C 890,350 901,338 915,338 C 929,338 939,350 938,370 L 934,530 Z"
        fill="url(#handGrad)" opacity="0.87"/>

  <!-- Finger highlight strip (top of fingers, suggesting light catching edges) -->
  <path d="M 695,390 L 688,340 C 687,318 700,305 716,305 C 732,305 744,318 743,340 L 736,390 Z"
        fill="url(#fingerHL)" opacity="0.60"/>
  <path d="M 760,370 L 755,300 C 754,275 768,260 785,260 C 802,260 816,275 815,300 L 808,370 Z"
        fill="url(#fingerHL)" opacity="0.65"/>
  <path d="M 828,370 L 825,320 C 824,298 837,285 853,285 C 869,285 881,298 880,320 L 875,370 Z"
        fill="url(#fingerHL)" opacity="0.60"/>
  <path d="M 892,400 L 891,370 C 890,350 901,338 915,338 C 929,338 939,350 938,370 L 934,400 Z"
        fill="url(#fingerHL)" opacity="0.55"/>

  <!-- Layer 3: "Broken" fragment echoes — left side, scattered angular shards -->
  <!-- These sit partly outside the safe zone edges — decorative only -->

  <!-- Large displaced shard, upper-left -->
  <polygon points="310,210 420,180 460,310 340,330" fill="url(#shardGrad)" opacity="0.55"/>

  <!-- Mid shard, left -->
  <polygon points="245,420 340,400 355,490 250,500" fill="url(#shardGrad)" opacity="0.40"/>

  <!-- Small shard fragment, left-low -->
  <polygon points="300,600 375,575 390,635 305,650" fill="url(#shardGrad)" opacity="0.32"/>

  <!-- Ghost / echo hand outline on the right — "fixed" glow -->
  <!-- Soft larger hand echo, shifted slightly right and up, low opacity -->
  <path d="M 710,640 C 690,660 685,700 710,720 L 1010,720 C 1035,700 1030,660 1010,640 L 970,530 L 750,530 Z"
        fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.18"/>
  <path d="M 765,532 L 758,340 C 757,318 770,305 786,305 C 802,305 814,318 813,340 L 806,532 Z"
        fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.18"/>
  <path d="M 832,530 L 827,300 C 826,275 840,260 857,260 C 874,260 888,275 887,300 L 880,530 Z"
        fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.18"/>
  <path d="M 900,530 L 897,320 C 896,298 909,285 925,285 C 941,285 953,298 952,320 L 947,530 Z"
        fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.18"/>
  <path d="M 964,530 L 963,370 C 962,350 973,338 987,338 C 1001,338 1011,350 1010,370 L 1006,530 Z"
        fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.18"/>

  <!-- Subtle warm edge vignette -->
  <rect width="1600" height="900" fill="url(#bg)" opacity="0.18"/>
</svg>
