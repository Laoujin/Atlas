<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fde2cf"/>
      <stop offset="1" stop-color="#f6c79f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="560" cy="300" r="320" fill="url(#sun)"/>

  <!-- far layered karst peaks -->
  <path d="M125 560 L360 360 Q420 320 480 365 L640 500 L760 380 Q820 335 880 385 L1080 540 L1300 410 Q1360 372 1420 420 L1475 470 L1475 640 L125 640 Z" fill="url(#peakFar)" opacity="0.85"/>

  <!-- sky-bridge arc spanning the peaks -->
  <path d="M300 470 Q800 250 1240 440" fill="none" stroke="#fbbf24" stroke-width="9" opacity="0.9"/>
  <path d="M300 470 Q800 250 1240 440" fill="none" stroke="#78350f" stroke-width="3" opacity="0.55"/>
  <line x1="470" y1="392" x2="470" y2="455" stroke="#78350f" stroke-width="4" opacity="0.6"/>
  <line x1="640" y1="333" x2="640" y2="405" stroke="#78350f" stroke-width="4" opacity="0.6"/>
  <line x1="800" y1="318" x2="800" y2="392" stroke="#78350f" stroke-width="4" opacity="0.6"/>
  <line x1="960" y1="333" x2="960" y2="405" stroke="#78350f" stroke-width="4" opacity="0.6"/>
  <line x1="1110" y1="375" x2="1110" y2="440" stroke="#78350f" stroke-width="4" opacity="0.6"/>

  <!-- near hero island silhouette -->
  <path d="M520 700 L700 470 Q760 410 815 480 L900 600 L980 500 Q1030 445 1075 510 L1210 700 Z" fill="url(#peakNear)"/>
  <path d="M700 470 Q760 410 815 480 L780 520 Q745 480 720 510 Z" fill="#fbbf24" opacity="0.25"/>

  <!-- water -->
  <rect y="700" width="1600" height="200" fill="url(#water)"/>
  <path d="M0 720 Q400 705 800 722 T1600 720 L1600 760 Q1200 745 800 762 T0 760 Z" fill="#fef3ec" opacity="0.18"/>
</svg>
