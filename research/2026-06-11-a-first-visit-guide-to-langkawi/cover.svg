<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.7" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="560" rx="760" ry="420" fill="url(#glow)"/>
  <circle cx="800" cy="545" r="135" fill="url(#sun)"/>

  <!-- back ridge -->
  <polygon points="0,650 120,520 240,600 360,470 520,585 700,445 880,565 1060,460 1240,585 1400,505 1600,605 1600,650"
           fill="#d97706" opacity="0.55"/>

  <!-- mid karst towers -->
  <polygon points="290,650 360,360 420,470 470,400 545,650" fill="#9a3309" opacity="0.82"/>
  <polygon points="1055,650 1135,400 1185,470 1245,355 1325,650" fill="#9a3309" opacity="0.82"/>

  <!-- front karst -->
  <polygon points="0,650 95,430 175,540 255,455 345,650" fill="#78350f" opacity="0.94"/>
  <polygon points="1265,650 1375,455 1465,545 1560,425 1600,650" fill="#78350f" opacity="0.94"/>

  <!-- water -->
  <rect x="0" y="648" width="1600" height="252" fill="url(#water)"/>
  <ellipse cx="800" cy="660" rx="430" ry="26" fill="#fbbf24" opacity="0.35"/>

  <!-- sky bridge: curved deck + mast + suspension cables -->
  <path d="M470 520 Q800 430 1120 520" fill="none" stroke="#1a0e0e" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <line x1="800" y1="432" x2="800" y2="328" stroke="#1a0e0e" stroke-width="7" opacity="0.9"/>
  <line x1="800" y1="330" x2="600" y2="486" stroke="#1a0e0e" stroke-width="3" opacity="0.85"/>
  <line x1="800" y1="330" x2="705" y2="455" stroke="#1a0e0e" stroke-width="3" opacity="0.85"/>
  <line x1="800" y1="330" x2="895" y2="455" stroke="#1a0e0e" stroke-width="3" opacity="0.85"/>
  <line x1="800" y1="330" x2="1000" y2="486" stroke="#1a0e0e" stroke-width="3" opacity="0.85"/>

  <!-- soaring eagle hero -->
  <path d="M800 212 C 760 180 698 178 648 198 C 706 202 754 216 793 248 C 797 252 803 252 807 248 C 846 216 894 202 952 198 C 902 178 840 180 800 212 Z"
        fill="#1a0e0e" opacity="0.92"/>
  <polygon points="791,208 809,208 800,182" fill="#1a0e0e" opacity="0.92"/>
</svg>
