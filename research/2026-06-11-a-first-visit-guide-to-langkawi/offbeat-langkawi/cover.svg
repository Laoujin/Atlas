<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#2e150f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed nocturnal sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon halo -->
  <circle cx="1090" cy="250" r="320" fill="url(#moonglow)"/>

  <!-- Crescent: bright disc masked by a darker disc -->
  <circle cx="1090" cy="250" r="120" fill="#fbbf24" opacity="0.92"/>
  <circle cx="1140" cy="222" r="120" fill="#2e150f"/>

  <!-- Still water surface -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#water)" opacity="0.95"/>
  <!-- Moon reflection ripples on the water -->
  <ellipse cx="1090" cy="690" rx="120" ry="9" fill="#fbbf24" opacity="0.30"/>
  <ellipse cx="1090" cy="730" rx="150" ry="7" fill="#d97706" opacity="0.20"/>
  <ellipse cx="1090" cy="770" rx="110" ry="6" fill="#fbbf24" opacity="0.12"/>

  <!-- Hero: lone standing-stone / urn silhouette rising from the water -->
  <path d="M740 620
           C 720 540 716 470 730 410
           C 740 370 752 348 760 318
           C 720 300 700 270 705 238
           C 712 196 752 168 800 168
           C 848 168 888 196 895 238
           C 900 270 880 300 840 318
           C 848 348 860 370 870 410
           C 884 470 880 540 860 620
           Z" fill="url(#stone)" stroke="#9a3309" stroke-width="3" opacity="0.95"/>
  <!-- Faded glyph-band carved into the stone -->
  <path d="M748 470 C 790 458 810 458 852 470" fill="none" stroke="#78350f" stroke-width="6" opacity="0.6"/>
  <path d="M752 410 C 792 400 808 400 848 410" fill="none" stroke="#78350f" stroke-width="6" opacity="0.5"/>

  <!-- Soft reflection of the stone in the water -->
  <path d="M740 622 C 752 700 750 740 740 770 L860 770 C 850 740 848 700 860 622 Z"
        fill="#1a0e0e" opacity="0.5"/>
</svg>
