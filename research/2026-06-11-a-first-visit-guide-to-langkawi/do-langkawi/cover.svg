<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="peakBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="peakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.28" r="0.4">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- jungle peaks -->
  <path d="M0 900 L0 560 L240 660 L520 470 L760 600 L1040 430 L1340 590 L1600 500 L1600 900 Z" fill="url(#peakBack)"/>
  <path d="M0 900 L0 720 L300 770 L640 640 L980 740 L1320 660 L1600 730 L1600 900 Z" fill="url(#peakFront)"/>

  <!-- cable line -->
  <line x1="180" y1="690" x2="1420" y2="250" stroke="#5c2a1a" stroke-width="5" stroke-opacity="0.85"/>

  <!-- hero gondola, centered ~ (800,450) -->
  <g transform="translate(800 455) rotate(-19.5)">
    <line x1="-2" y1="-92" x2="-2" y2="-58" stroke="#5c2a1a" stroke-width="6"/>
    <path d="M-50 -68 L50 -68 L40 -56 L-40 -56 Z" fill="#78350f"/>
    <rect x="-72" y="-56" width="144" height="116" rx="20" fill="url(#cab)"/>
    <rect x="-72" y="-56" width="144" height="116" rx="20" fill="none" stroke="#78350f" stroke-width="5" stroke-opacity="0.6"/>
    <rect x="-52" y="-32" width="104" height="60" rx="10" fill="#fef3ec" fill-opacity="0.9"/>
    <line x1="0" y1="-32" x2="0" y2="28" stroke="#c2410c" stroke-width="4" stroke-opacity="0.7"/>
    <rect x="-60" y="50" width="120" height="14" rx="6" fill="#9a3309"/>
  </g>

  <!-- far gondola, decorative, outside safe-zone-ish on the line -->
  <g transform="translate(1300 305) rotate(-19.5)" opacity="0.8">
    <line x1="0" y1="-40" x2="0" y2="-22" stroke="#5c2a1a" stroke-width="3"/>
    <rect x="-26" y="-22" width="52" height="42" rx="8" fill="#c2410c"/>
  </g>
</svg>
