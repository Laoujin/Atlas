<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="medal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- batik cloth panel (hero) -->
  <rect x="470" y="215" width="660" height="470" rx="26" fill="url(#cloth)"/>
  <rect x="498" y="243" width="604" height="414" rx="16" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.7"/>

  <!-- diagonal songket weave threads -->
  <g stroke="#fbbf24" stroke-width="2.5" opacity="0.28">
    <line x1="498" y1="430" x2="760" y2="243"/>
    <line x1="498" y1="540" x2="900" y2="243"/>
    <line x1="498" y1="650" x2="1040" y2="243"/>
    <line x1="560" y1="657" x2="1102" y2="270"/>
    <line x1="700" y1="657" x2="1102" y2="380"/>
    <line x1="840" y1="657" x2="1102" y2="490"/>
  </g>

  <!-- canting-wax medallion -->
  <circle cx="800" cy="450" r="118" fill="none" stroke="#fef3ec" stroke-width="3" opacity="0.85"/>
  <circle cx="800" cy="450" r="88" fill="url(#medal)" opacity="0.95"/>
  <circle cx="800" cy="450" r="52" fill="none" stroke="#78350f" stroke-width="4" opacity="0.8"/>
  <circle cx="800" cy="450" r="20" fill="#78350f"/>

  <!-- petal dots ringing the medallion -->
  <g fill="#fef3ec" opacity="0.92">
    <circle cx="800" cy="312" r="13"/>
    <circle cx="897" cy="353" r="13"/>
    <circle cx="938" cy="450" r="13"/>
    <circle cx="897" cy="547" r="13"/>
    <circle cx="800" cy="588" r="13"/>
    <circle cx="703" cy="547" r="13"/>
    <circle cx="662" cy="450" r="13"/>
    <circle cx="703" cy="353" r="13"/>
  </g>

  <!-- scalloped tjap border rows -->
  <path d="M 510 295 q 22 -26 44 0 q 22 -26 44 0 q 22 -26 44 0 q 22 -26 44 0 q 22 -26 44 0 q 22 -26 44 0 q 22 -26 44 0 q 22 -26 44 0 q 22 -26 44 0"
        fill="none" stroke="#d97706" stroke-width="3" opacity="0.65"/>
  <path d="M 510 605 q 22 26 44 0 q 22 26 44 0 q 22 26 44 0 q 22 26 44 0 q 22 26 44 0 q 22 26 44 0 q 22 26 44 0 q 22 26 44 0 q 22 26 44 0"
        fill="none" stroke="#d97706" stroke-width="3" opacity="0.65"/>

  <!-- corner decoration (croppable) -->
  <circle cx="120" cy="120" r="150" fill="#d97706" opacity="0.12"/>
  <circle cx="1480" cy="780" r="170" fill="#9a3309" opacity="0.12"/>
</svg>
