<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="300" cy="200" r="240" fill="url(#sun)"/>

  <!-- sea -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#water)"/>

  <!-- route arc connecting the island dots -->
  <path d="M260,470 C620,250 980,250 1340,470" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.85"/>

  <!-- island cluster (departure) -->
  <path d="M180,490 Q260,420 340,490 Z" fill="#78350f" opacity="0.9"/>
  <path d="M250,500 Q300,460 360,500 Z" fill="#9a3309" opacity="0.85"/>
  <circle cx="260" cy="470" r="14" fill="#c2410c"/>

  <!-- island cluster (destination) -->
  <path d="M1250,500 Q1330,425 1420,500 Z" fill="#78350f" opacity="0.9"/>
  <path d="M1210,505 Q1265,470 1320,505 Z" fill="#9a3309" opacity="0.85"/>
  <circle cx="1340" cy="470" r="14" fill="#c2410c"/>

  <!-- hero: ferry -->
  <g>
    <!-- wake -->
    <path d="M560,565 Q700,545 850,560" fill="none" stroke="#0e7490" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <path d="M600,585 Q740,568 880,582" fill="none" stroke="#0e7490" stroke-width="7" stroke-linecap="round" opacity="0.3"/>

    <!-- hull -->
    <path d="M620,500 L1030,500 L985,575 Q800,600 665,575 Z" fill="url(#hull)"/>
    <rect x="620" y="498" width="410" height="10" rx="5" fill="#fbbf24" opacity="0.9"/>

    <!-- superstructure -->
    <rect x="690" y="430" width="250" height="72" rx="8" fill="#d97706"/>
    <rect x="730" y="385" width="160" height="50" rx="6" fill="#c2410c"/>
    <rect x="855" y="350" width="40" height="42" rx="6" fill="#9a3309"/>

    <!-- windows -->
    <circle cx="730" cy="466" r="9" fill="#fef3ec" opacity="0.85"/>
    <circle cx="770" cy="466" r="9" fill="#fef3ec" opacity="0.85"/>
    <circle cx="810" cy="466" r="9" fill="#fef3ec" opacity="0.85"/>
    <circle cx="850" cy="466" r="9" fill="#fef3ec" opacity="0.85"/>
    <circle cx="890" cy="466" r="9" fill="#fef3ec" opacity="0.85"/>
    <rect x="745" y="400" width="130" height="22" rx="4" fill="#fef3ec" opacity="0.8"/>
  </g>
</svg>
