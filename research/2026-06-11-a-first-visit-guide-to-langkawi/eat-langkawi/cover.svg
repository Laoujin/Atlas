<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.6" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.32" stop-color="#be185d" stop-opacity="0.6"/>
      <stop offset="0.66" stop-color="#9a3309" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#f0eadb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="prawn" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="720" ry="520" fill="url(#glow)"/>

  <!-- back plate -->
  <circle cx="1058" cy="408" r="152" fill="url(#plate)" stroke="#9a3309" stroke-width="6" opacity="0.8"/>
  <!-- hero plate -->
  <circle cx="800" cy="470" r="212" fill="url(#plate)" stroke="#c2410c" stroke-width="10"/>
  <circle cx="800" cy="470" r="186" fill="none" stroke="#d97706" stroke-width="2" opacity="0.55"/>

  <!-- prawn silhouette -->
  <g opacity="0.95">
    <!-- antennae -->
    <path d="M 936 519 q 64 8 96 52" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 936 519 q 78 -6 118 22" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- legs -->
    <path d="M 760 530 l -10 36 M 800 540 l -4 40 M 842 535 l 6 38" fill="none" stroke="#9a3309" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <!-- body crescent -->
    <path d="M 663.7 519.6 A 145 145 0 1 1 936.3 519.6 L 879.9 499.1 A 85 85 0 1 0 720.1 499.1 Z" fill="url(#prawn)"/>
    <!-- segment lines -->
    <path d="M 712 392 a 122 122 0 0 1 26 -18 M 770 350 a 122 122 0 0 1 30 -6 M 832 352 a 120 120 0 0 1 30 12" fill="none" stroke="#9a3309" stroke-width="4" opacity="0.55"/>
    <!-- tail fan -->
    <path d="M 666 520 L 626 556 L 650 562 L 664 542 L 682 572 L 694 550 Z" fill="#c2410c"/>
    <!-- eye -->
    <circle cx="908" cy="506" r="9" fill="#1a0e0e"/>
  </g>
</svg>
