<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="warmth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- full-bleed evening background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="470" rx="640" ry="470" fill="url(#warmth)"/>

  <!-- jungle canopy framing (decoration, outside hero) -->
  <path d="M0 0 H520 Q430 95 330 80 Q230 150 150 120 Q60 175 0 150 Z" fill="#3f6212" opacity="0.8"/>
  <path d="M0 0 H360 Q280 70 200 70 Q110 120 0 100 Z" fill="#4d7c0f" opacity="0.7"/>
  <path d="M1600 0 H1080 Q1175 95 1275 80 Q1375 150 1450 120 Q1545 175 1600 150 Z" fill="#3f6212" opacity="0.8"/>
  <path d="M1600 0 H1240 Q1320 70 1400 70 Q1490 120 1600 100 Z" fill="#4d7c0f" opacity="0.7"/>

  <!-- stilts -->
  <rect x="652" y="540" width="20" height="150" fill="#3a1810"/>
  <rect x="792" y="540" width="20" height="150" fill="#3a1810"/>
  <rect x="932" y="540" width="20" height="150" fill="#3a1810"/>
  <rect x="630" y="630" width="344" height="14" fill="#78350f" opacity="0.7"/>

  <!-- villa body on stilts -->
  <rect x="624" y="430" width="356" height="120" fill="url(#wall)"/>
  <!-- glowing window -->
  <rect x="730" y="462" width="146" height="64" rx="6" fill="url(#lamp)"/>
  <ellipse cx="803" cy="494" rx="150" ry="80" fill="url(#lamp)" opacity="0.25"/>

  <!-- pitched roof with overhang -->
  <polygon points="800,300 1040,452 564,452" fill="url(#roof)"/>
  <rect x="568" y="452" width="468" height="20" fill="#9a3309"/>
  <polygon points="800,300 800,330 985,448 1040,452" fill="#fbbf24" opacity="0.2"/>

  <!-- water reflection hint below -->
  <ellipse cx="803" cy="720" rx="280" ry="26" fill="#d97706" opacity="0.2"/>
</svg>
