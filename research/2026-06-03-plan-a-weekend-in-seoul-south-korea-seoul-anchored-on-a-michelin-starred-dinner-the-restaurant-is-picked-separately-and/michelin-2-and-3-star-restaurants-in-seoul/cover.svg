<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1008"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Warm radial glow at centre -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate fill -->
    <radialGradient id="plateFill" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c4ae"/>
    </radialGradient>

    <!-- Hero plate rim -->
    <radialGradient id="plateRim" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Small plate fill -->
    <radialGradient id="plateFill2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#e8d9c4"/>
    </radialGradient>

    <!-- Cloche dome gradient -->
    <linearGradient id="clochGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#e8d5bc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Rose accent glow for Michelin star motif -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Edge vignette -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle corner accent — top-left, decorative only, outside safe zone -->
  <circle cx="0" cy="0" r="320" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.18"/>
  <circle cx="0" cy="0" r="480" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.10"/>

  <!-- Subtle corner accent — bottom-right -->
  <circle cx="1600" cy="900" r="320" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.18"/>
  <circle cx="1600" cy="900" r="480" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.10"/>

  <!-- Layer 2: Hero element — centred at (800, 450), safe zone x:125–1475, y:90–810 -->

  <!-- Michelin star glow halo behind plate -->
  <circle cx="800" cy="455" r="310" fill="url(#starGlow)"/>

  <!-- Hero plate — large dinner plate form -->
  <!-- Outer rim ring -->
  <circle cx="800" cy="455" r="270" fill="url(#plateRim)" opacity="0.92"/>
  <!-- Plate surface -->
  <circle cx="800" cy="455" r="238" fill="url(#plateFill)" opacity="0.95"/>
  <!-- Inner well of plate (slightly recessed look) -->
  <circle cx="800" cy="455" r="190" fill="#faf8f2" fill-opacity="0.55"/>
  <!-- Plate shadow underside -->
  <ellipse cx="800" cy="720" rx="200" ry="18" fill="#1a0e0e" fill-opacity="0.55"/>

  <!-- Cloche / dome over the plate — fine dining serving cover -->
  <!-- Dome shape: upper half ellipse -->
  <ellipse cx="800" cy="390" rx="210" ry="145" fill="url(#clochGrad)" opacity="0.82"/>
  <!-- Cloche base bar -->
  <rect x="590" y="518" width="420" height="18" rx="9" fill="#d4c4ae" fill-opacity="0.70"/>
  <!-- Cloche knob on top -->
  <ellipse cx="800" cy="252" rx="28" ry="18" fill="#d97706" fill-opacity="0.90"/>
  <rect x="793" y="252" width="14" height="34" rx="7" fill="#d97706" fill-opacity="0.85"/>

  <!-- Michelin-star accent: three small rose diamonds flanking the plate -->
  <!-- Left star -->
  <polygon points="570,455 585,440 600,455 585,470" fill="#be185d" fill-opacity="0.80"/>
  <!-- Centre-top star (small, above plate) -->
  <polygon points="800,192 817,209 800,226 783,209" fill="#be185d" fill-opacity="0.72"/>
  <!-- Right star -->
  <polygon points="1000,455 1015,440 1030,455 1015,470" fill="#be185d" fill-opacity="0.80"/>

  <!-- Secondary small plate — offset lower-right, partially in safe zone -->
  <circle cx="1120" cy="620" r="120" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.50"/>
  <circle cx="1120" cy="620" r="104" fill="url(#plateFill2)" fill-opacity="0.30"/>

  <!-- Ambient rust ring around hero for depth -->
  <circle cx="800" cy="455" r="340" fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.28"/>
  <circle cx="800" cy="455" r="390" fill="none" stroke="#78350f" stroke-width="1" stroke-opacity="0.18"/>
</svg>
