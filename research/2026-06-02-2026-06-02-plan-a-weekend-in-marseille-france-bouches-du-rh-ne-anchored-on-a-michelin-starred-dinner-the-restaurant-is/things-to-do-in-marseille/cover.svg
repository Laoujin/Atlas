<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fef3ec"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow, high in safe zone -->
  <circle cx="800" cy="300" r="230" fill="url(#sun)"/>
  <circle cx="800" cy="300" r="95" fill="#fbbf24" opacity="0.9"/>

  <!-- sea band -->
  <rect x="0" y="540" width="1600" height="360" fill="url(#sea)"/>

  <!-- left limestone cliff (hero) -->
  <path d="M125 540 L300 300 L470 410 L560 320 L660 540 Z" fill="url(#cliff)" opacity="0.95"/>
  <!-- shadow facet -->
  <path d="M300 300 L470 410 L420 540 L330 540 Z" fill="#78350f" opacity="0.35"/>

  <!-- right limestone cliff (hero) -->
  <path d="M940 540 L1080 360 L1200 440 L1340 290 L1475 540 Z" fill="url(#cliff)" opacity="0.95"/>
  <path d="M1340 290 L1475 540 L1380 540 Z" fill="#78350f" opacity="0.35"/>

  <!-- inlet water between cliffs, lighter -->
  <path d="M660 540 L780 540 L820 600 L700 600 Z" fill="#fbbf24" opacity="0.5"/>

  <!-- sailboat on the water -->
  <path d="M800 600 L800 690 L760 690 Z" fill="#faf8f2" opacity="0.95"/>
  <path d="M800 600 L840 690 L800 690 Z" fill="#c2410c" opacity="0.85"/>
  <path d="M745 692 Q800 715 855 692 L840 705 Q800 720 760 705 Z" fill="#78350f" opacity="0.8"/>

  <!-- horizon shimmer lines -->
  <rect x="200" y="760" width="1200" height="6" fill="#fbbf24" opacity="0.4"/>
</svg>
