<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1206"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>
    <!-- Hero hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Orbit ring gradient -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="85%" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Satellite node gradient -->
    <radialGradient id="satNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.8"/>
    </radialGradient>
    <!-- Outer ambient glow behind hero -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centred on hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero element — centred at (800,450), safe zone x:125–1475 y:90–810 -->

  <!-- Outer orbit ring 1 (violet) -->
  <circle cx="800" cy="450" r="300" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.45"/>
  <!-- Outer orbit ring 2 (rust, inner) -->
  <circle cx="800" cy="450" r="200" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Innermost orbit ring -->
  <circle cx="800" cy="450" r="110" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Connection lines to satellite nodes (drawn before nodes so nodes sit on top) -->
  <!-- Node A: upper-right -->
  <line x1="800" y1="450" x2="1040" y2="210" stroke="#c2410c" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Node B: right -->
  <line x1="800" y1="450" x2="1095" y2="465" stroke="#c2410c" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Node C: lower-right -->
  <line x1="800" y1="450" x2="990" y2="700" stroke="#c2410c" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Node D: lower-left -->
  <line x1="800" y1="450" x2="575" y2="695" stroke="#6d28d9" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Node E: left -->
  <line x1="800" y1="450" x2="508" y2="440" stroke="#6d28d9" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Node F: upper-left -->
  <line x1="800" y1="450" x2="590" y2="215" stroke="#6d28d9" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Satellite nodes on orbit ring (r≈300 from centre) -->
  <!-- Node A: upper-right (~800+240, 450-240) -->
  <circle cx="1040" cy="210" r="26" fill="url(#satNode)" opacity="0.88"/>
  <circle cx="1040" cy="210" r="36" fill="none" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Node B: right (~800+295, 450+15) -->
  <circle cx="1095" cy="465" r="20" fill="url(#satNode)" opacity="0.82"/>
  <circle cx="1095" cy="465" r="30" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Node C: lower-right (~800+190, 450+250) -->
  <circle cx="990" cy="700" r="24" fill="url(#satNode)" opacity="0.85"/>
  <circle cx="990" cy="700" r="34" fill="none" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.38"/>

  <!-- Node D: lower-left (~800-225, 450+245) -->
  <circle cx="575" cy="695" r="22" fill="#6d28d9" opacity="0.75"/>
  <circle cx="575" cy="695" r="32" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Node E: left (~800-292, 450-10) -->
  <circle cx="508" cy="440" r="28" fill="#6d28d9" opacity="0.78"/>
  <circle cx="508" cy="440" r="40" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.32"/>

  <!-- Node F: upper-left (~800-210, 450-235) -->
  <circle cx="590" cy="215" r="20" fill="#6d28d9" opacity="0.72"/>
  <circle cx="590" cy="215" r="30" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Central hub: the conference focal point -->
  <circle cx="800" cy="450" r="72" fill="url(#hubGlow)" opacity="0.95"/>
  <!-- Hub inner highlight -->
  <circle cx="800" cy="450" r="42" fill="#fbbf24" opacity="0.25"/>
  <!-- Hub pulse ring -->
  <circle cx="800" cy="450" r="88" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Bottom-left corner arc wash -->
  <ellipse cx="0" cy="900" rx="320" ry="240" fill="#6d28d9" opacity="0.06"/>
  <!-- Top-right corner arc wash -->
  <ellipse cx="1600" cy="0" rx="340" ry="260" fill="#c2410c" opacity="0.07"/>
</svg>
