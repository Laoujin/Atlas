<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.7" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow centered behind the hero -->
  <ellipse cx="800" cy="520" rx="780" ry="380" fill="url(#glow)"/>

  <!-- distant neighbour rooftops (decoration, partially clipped is fine) -->
  <polygon points="80,720 240,560 400,720" fill="#2a1410" opacity="0.85"/>
  <polygon points="1200,720 1380,540 1560,720" fill="#2a1410" opacity="0.85"/>
  <rect x="60" y="720" width="380" height="180" fill="#2a1410" opacity="0.85"/>
  <rect x="1180" y="720" width="420" height="180" fill="#2a1410" opacity="0.85"/>

  <!-- footpath curving up toward the lodging -->
  <path d="M 200 870 Q 600 800 800 720 Q 1000 800 1400 870 L 1400 900 L 200 900 Z" fill="#3a1810" opacity="0.7"/>
  <path d="M 240 860 Q 620 790 800 715 Q 980 790 1360 860" stroke="#d97706" stroke-width="2" fill="none" opacity="0.35" stroke-dasharray="6 12"/>

  <!-- hero: stepped Flemish-style facade, centered ~ (800, 450) -->
  <!-- main body -->
  <rect x="560" y="320" width="480" height="400" fill="url(#facade)"/>
  <!-- stepped gable -->
  <polygon points="560,320 560,260 620,260 620,220 720,220 720,180 880,180 880,220 980,220 980,260 1040,260 1040,320" fill="url(#roof)"/>
  <!-- chimney accent -->
  <rect x="780" y="150" width="40" height="50" fill="#5c2a1a"/>

  <!-- warm-lit windows: three columns, three rows -->
  <rect x="610" y="380" width="70" height="90" fill="url(#window)" opacity="0.92"/>
  <rect x="765" y="380" width="70" height="90" fill="url(#window)" opacity="0.92"/>
  <rect x="920" y="380" width="70" height="90" fill="url(#window)" opacity="0.92"/>

  <rect x="610" y="510" width="70" height="90" fill="url(#window)" opacity="0.88"/>
  <rect x="765" y="510" width="70" height="90" fill="url(#window)" opacity="0.78"/>
  <rect x="920" y="510" width="70" height="90" fill="url(#window)" opacity="0.92"/>

  <!-- entrance door, slightly glowing -->
  <rect x="755" y="620" width="90" height="100" fill="#fbbf24" opacity="0.85"/>
  <rect x="755" y="620" width="90" height="100" fill="none" stroke="#78350f" stroke-width="3"/>

  <!-- window mullions -->
  <g stroke="#5c2a1a" stroke-width="2" opacity="0.55">
    <line x1="645" y1="380" x2="645" y2="470"/>
    <line x1="610" y1="425" x2="680" y2="425"/>
    <line x1="800" y1="380" x2="800" y2="470"/>
    <line x1="765" y1="425" x2="835" y2="425"/>
    <line x1="955" y1="380" x2="955" y2="470"/>
    <line x1="920" y1="425" x2="990" y2="425"/>
    <line x1="645" y1="510" x2="645" y2="600"/>
    <line x1="610" y1="555" x2="680" y2="555"/>
    <line x1="800" y1="510" x2="800" y2="600"/>
    <line x1="765" y1="555" x2="835" y2="555"/>
    <line x1="955" y1="510" x2="955" y2="600"/>
    <line x1="920" y1="555" x2="990" y2="555"/>
  </g>

  <!-- subtle moon / lantern in upper corner of safe zone -->
  <circle cx="1280" cy="220" r="38" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1280" cy="220" r="22" fill="#fef3ec" opacity="0.7"/>

  <!-- spoon accent (Cuchara = spoon) hovering as a quiet motif near the hero -->
  <g transform="translate(340 440) rotate(-25)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="38" ry="52" fill="none" stroke="#d97706" stroke-width="4"/>
    <rect x="-4" y="45" width="8" height="140" rx="4" fill="#d97706"/>
  </g>
</svg>
