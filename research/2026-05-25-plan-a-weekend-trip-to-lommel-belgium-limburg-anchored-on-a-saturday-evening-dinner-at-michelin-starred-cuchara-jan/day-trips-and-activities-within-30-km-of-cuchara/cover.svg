<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow -->
  <circle cx="800" cy="500" r="320" fill="url(#sun)"/>

  <!-- distant dune ridge -->
  <path d="M 0 620 Q 280 540 540 580 T 1100 560 T 1600 600 L 1600 900 L 0 900 Z" fill="url(#dune)" opacity="0.55"/>

  <!-- nearer dune crest -->
  <path d="M 0 700 Q 360 620 720 670 T 1320 660 T 1600 690 L 1600 900 L 0 900 Z" fill="#9a3309" opacity="0.75"/>

  <!-- elevated circular bridge — hero, centered ~ (800,450) -->
  <g transform="translate(800 470)">
    <!-- bridge deck ellipse (perspective ring) -->
    <ellipse cx="0" cy="0" rx="380" ry="90" fill="none" stroke="url(#bridge)" stroke-width="14" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="380" ry="90" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
    <!-- support pillars descending into dunes -->
    <line x1="-340" y1="35" x2="-340" y2="220" stroke="#78350f" stroke-width="6" opacity="0.85"/>
    <line x1="-170" y1="75" x2="-170" y2="240" stroke="#78350f" stroke-width="6" opacity="0.85"/>
    <line x1="170" y1="75" x2="170" y2="240" stroke="#78350f" stroke-width="6" opacity="0.85"/>
    <line x1="340" y1="35" x2="340" y2="220" stroke="#78350f" stroke-width="6" opacity="0.85"/>
    <line x1="0" y1="90" x2="0" y2="250" stroke="#78350f" stroke-width="6" opacity="0.85"/>
    <!-- railing dots -->
    <g fill="#fbbf24" opacity="0.85">
      <circle cx="-280" cy="-58" r="3"/>
      <circle cx="-180" cy="-78" r="3"/>
      <circle cx="-60" cy="-89" r="3"/>
      <circle cx="60" cy="-89" r="3"/>
      <circle cx="180" cy="-78" r="3"/>
      <circle cx="280" cy="-58" r="3"/>
    </g>
  </g>

  <!-- foreground pine silhouettes (decoration, edges) -->
  <g fill="#1a0e0e" opacity="0.88">
    <polygon points="80,820 110,560 140,820"/>
    <polygon points="160,830 200,520 240,830"/>
    <polygon points="40,840 75,640 110,840"/>
    <polygon points="1380,820 1420,540 1460,820"/>
    <polygon points="1470,830 1510,580 1550,830"/>
    <polygon points="1300,840 1335,650 1370,840"/>
  </g>

  <!-- pine trunks -->
  <g stroke="#1a0e0e" stroke-width="4" opacity="0.85">
    <line x1="110" y1="820" x2="110" y2="860"/>
    <line x1="200" y1="830" x2="200" y2="865"/>
    <line x1="1420" y1="820" x2="1420" y2="860"/>
    <line x1="1510" y1="830" x2="1510" y2="865"/>
  </g>
</svg>
