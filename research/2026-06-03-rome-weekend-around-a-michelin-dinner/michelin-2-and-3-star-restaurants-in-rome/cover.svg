<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2e1008"/>
      <stop offset="100%" stop-color="#0f0808"/>
    </linearGradient>

    <!-- Warm table-light glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate fill -->
    <radialGradient id="plateFill" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="70%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>

    <!-- Inner plate rim gradient -->
    <radialGradient id="plateInner" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="80%" stop-color="#ede4d4"/>
      <stop offset="100%" stop-color="#d4c4a8"/>
    </radialGradient>

    <!-- Cloche dome gradient -->
    <radialGradient id="clocheFill" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#5c2a1a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3d1a0e" stop-opacity="1"/>
    </radialGradient>

    <!-- Star accent gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Table surface gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a0e"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>

    <!-- Rose accent for fine-dining secondary -->
    <radialGradient id="roseAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Table surface at bottom -->
  <ellipse cx="800" cy="820" rx="820" ry="140" fill="url(#table)" opacity="0.85"/>

  <!-- Atmospheric warm glow centred on hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle rose bloom behind plate -->
  <ellipse cx="800" cy="500" rx="520" ry="340" fill="url(#roseAccent)"/>

  <!-- Layer 2: HERO — plate + cloche composition, centred ~800,460 -->

  <!-- Plate outer rim -->
  <ellipse cx="800" cy="610" rx="310" ry="60" fill="url(#plateFill)" opacity="0.95"/>

  <!-- Plate body (slightly raised ellipse gives 3D feel) -->
  <ellipse cx="800" cy="600" rx="300" ry="52" fill="url(#plateFill)" opacity="1"/>

  <!-- Plate inner well -->
  <ellipse cx="800" cy="596" rx="230" ry="39" fill="url(#plateInner)" opacity="0.92"/>

  <!-- Table cloth shadow under plate -->
  <ellipse cx="800" cy="628" rx="290" ry="28" fill="#0f0808" opacity="0.55"/>

  <!-- Cloche dome silhouette -->
  <!-- Main dome arc: a wide semi-ellipse lifted above the plate -->
  <path d="M 490,598 Q 500,310 800,298 Q 1100,310 1110,598 Z" fill="url(#clocheFill)" opacity="0.95"/>

  <!-- Cloche highlight sheen -->
  <path d="M 560,520 Q 580,340 720,310 Q 660,360 640,490 Z" fill="#c2410c" opacity="0.18"/>

  <!-- Cloche base band (rim sitting on plate) -->
  <rect x="490" y="590" width="620" height="18" rx="9" fill="#9a3309" opacity="0.88"/>

  <!-- Cloche handle knob -->
  <ellipse cx="800" cy="294" rx="32" ry="14" fill="#d97706" opacity="0.92"/>
  <ellipse cx="800" cy="286" rx="20" ry="10" fill="#fbbf24" opacity="0.75"/>

  <!-- Michelin star motif — three stars floating above the cloche -->
  <!-- Star 1 (centre, larger) -->
  <polygon points="800,192 810,220 840,220 817,237 826,265 800,248 774,265 783,237 760,220 790,220"
           fill="url(#starGlow)" opacity="0.92"/>

  <!-- Star 2 (left) -->
  <polygon points="700,228 707,248 728,248 712,259 719,279 700,268 681,279 688,259 672,248 693,248"
           fill="#fbbf24" opacity="0.72"/>

  <!-- Star 3 (right) -->
  <polygon points="900,228 907,248 928,248 912,259 919,279 900,268 881,279 888,259 872,248 893,248"
           fill="#fbbf24" opacity="0.72"/>

  <!-- Layer 3: Atmospheric edge decoration (safe to crop) -->

  <!-- Top-left corner candle flicker -->
  <ellipse cx="180" cy="120" rx="18" ry="45" fill="#d97706" opacity="0.22"/>
  <ellipse cx="180" cy="92" rx="8" ry="18" fill="#fbbf24" opacity="0.35"/>

  <!-- Top-right corner candle flicker -->
  <ellipse cx="1420" cy="120" rx="18" ry="45" fill="#d97706" opacity="0.22"/>
  <ellipse cx="1420" cy="92" rx="8" ry="18" fill="#fbbf24" opacity="0.35"/>

  <!-- Bottom edge vignette deepener -->
  <rect x="0" y="740" width="1600" height="160" fill="#0f0808" opacity="0.55"/>

  <!-- Top vignette -->
  <rect x="0" y="0" width="1600" height="100" fill="#0f0808" opacity="0.45"/>
</svg>
