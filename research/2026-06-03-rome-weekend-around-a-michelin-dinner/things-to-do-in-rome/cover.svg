<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- low sun glow behind the arcade -->
  <circle cx="800" cy="470" r="320" fill="url(#sun)" opacity="0.9"/>

  <!-- hero: two-tier Roman arcade, centered ~ (800,450) -->
  <g fill="url(#stone)" opacity="0.92">
    <!-- ground band -->
    <rect x="360" y="660" width="880" height="40"/>
    <!-- lower tier: solid wall with 4 arch openings cut by sky -->
    <rect x="360" y="430" width="880" height="230"/>
  </g>

  <!-- lower arch openings (sky-colored) -->
  <g fill="url(#sky)" opacity="0.95">
    <path d="M400 660 v-130 a55 55 0 0 1 110 0 v130 z"/>
    <path d="M560 660 v-130 a55 55 0 0 1 110 0 v130 z"/>
    <path d="M720 660 v-130 a55 55 0 0 1 110 0 v130 z"/>
    <path d="M880 660 v-130 a55 55 0 0 1 110 0 v130 z"/>
    <path d="M1040 660 v-130 a55 55 0 0 1 110 0 v130 z"/>
  </g>

  <!-- upper tier wall -->
  <rect x="360" y="280" width="880" height="150" fill="url(#stone)" opacity="0.88"/>
  <!-- upper arch openings -->
  <g fill="url(#sky)" opacity="0.95">
    <path d="M400 430 v-90 a55 55 0 0 1 110 0 v90 z"/>
    <path d="M560 430 v-90 a55 55 0 0 1 110 0 v90 z"/>
    <path d="M720 430 v-90 a55 55 0 0 1 110 0 v90 z"/>
    <path d="M880 430 v-90 a55 55 0 0 1 110 0 v90 z"/>
    <path d="M1040 430 v-90 a55 55 0 0 1 110 0 v90 z"/>
  </g>

  <!-- subtle weathered shadow on the right face -->
  <rect x="1140" y="280" width="100" height="380" fill="#5c2a1a" opacity="0.45"/>
</svg>
