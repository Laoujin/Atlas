<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Pin body gradient -->
    <radialGradient id="pinGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Pin inner circle gradient -->
    <radialGradient id="innerGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Glow behind pin -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Circuit line color -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle warm vignette overlay -->
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.8"/>
  <ellipse cx="800" cy="450" rx="650" ry="400" fill="url(#glow)" opacity="0.6"/>

  <!-- Layer 3 decorative: faint horizontal circuit lines (full-bleed, outside hero, low opacity) -->
  <line x1="0" y1="310" x2="580" y2="310" stroke="#d97706" stroke-width="1.2" opacity="0.12"/>
  <line x1="1020" y1="310" x2="1600" y2="310" stroke="#d97706" stroke-width="1.2" opacity="0.12"/>
  <line x1="0" y1="590" x2="580" y2="590" stroke="#d97706" stroke-width="1.2" opacity="0.12"/>
  <line x1="1020" y1="590" x2="1600" y2="590" stroke="#d97706" stroke-width="1.2" opacity="0.12"/>

  <!-- Layer 2: Hero — location pin centered at (800, 440) -->
  <!-- Pin teardrop: circle top + pointed bottom -->
  <!-- Rendered as a path: circle center at (800,400), radius 130, tail pointing down to (800,620) -->

  <!-- Glow circle behind pin -->
  <ellipse cx="800" cy="430" rx="220" ry="220" fill="#c2410c" opacity="0.18"/>

  <!-- Pin shadow/depth base -->
  <ellipse cx="808" cy="614" rx="60" ry="18" fill="#78350f" opacity="0.45"/>

  <!-- Pin body path: teardrop -->
  <path d="
    M 800 170
    C 680 170, 590 260, 590 380
    C 590 470, 640 540, 720 590
    L 800 650
    L 880 590
    C 960 540, 1010 470, 1010 380
    C 1010 260, 920 170, 800 170
    Z
  " fill="url(#pinGrad)" opacity="0.95"/>

  <!-- Pin inner hole (circle cutout illusion via a darker circle) -->
  <circle cx="800" cy="375" r="85" fill="url(#innerGrad)" opacity="0.85"/>

  <!-- Inner circle ring accent -->
  <circle cx="800" cy="375" r="85" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.55"/>

  <!-- Small node dot at pin center -->
  <circle cx="800" cy="375" r="22" fill="#fbbf24" opacity="0.90"/>
  <circle cx="800" cy="375" r="10" fill="#1a0e0e" opacity="0.80"/>

  <!-- Circuit lines radiating from pin center outward (hero-zone, earned decoration) -->
  <!-- Left arm -->
  <polyline points="715,375 620,375 580,335" fill="none" stroke="#d97706" stroke-width="2" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left arm node -->
  <circle cx="580" cy="335" r="7" fill="#d97706" opacity="0.70"/>

  <!-- Right arm -->
  <polyline points="885,375 980,375 1020,335" fill="none" stroke="#d97706" stroke-width="2" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm node -->
  <circle cx="1020" cy="335" r="7" fill="#d97706" opacity="0.70"/>

  <!-- Upper-left diagonal arm -->
  <polyline points="740,310 680,250 640,250" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="640" cy="250" r="5" fill="#c2410c" opacity="0.60"/>

  <!-- Upper-right diagonal arm -->
  <polyline points="860,310 920,250 960,250" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="960" cy="250" r="5" fill="#c2410c" opacity="0.60"/>

  <!-- Bottom arm extending from pin tip -->
  <polyline points="800,650 800,720 760,760" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="760" cy="760" r="5" fill="#d97706" opacity="0.40"/>

</svg>
