<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Warm dining glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill gradient -->
    <radialGradient id="plate1" cx="48%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Second plate (shadow/depth) -->
    <radialGradient id="plate2" cx="52%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </radialGradient>
    <!-- Cloche gradient -->
    <linearGradient id="cloche" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1106"/>
    </linearGradient>
    <!-- Cloche highlight -->
    <radialGradient id="clocheSheen" cx="38%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Wine glass rose tint -->
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0606" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Warm ambient dining glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone x:125-1475 y:90-810 -->

  <!-- Shadow plate (slightly offset, behind) -->
  <ellipse cx="830" cy="590" rx="310" ry="52" fill="url(#plate2)" opacity="0.75"/>

  <!-- Main plate rim -->
  <ellipse cx="800" cy="575" rx="295" ry="50" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.6"/>

  <!-- Main plate surface -->
  <ellipse cx="800" cy="568" rx="285" ry="48" fill="url(#plate1)" opacity="0.93"/>

  <!-- Inner plate ring (well) -->
  <ellipse cx="800" cy="563" rx="185" ry="31" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.45"/>

  <!-- Cloche dome — hero centrepiece -->
  <!-- Dome shape: an arc/ellipse path centred at 800, sitting on the plate at y≈545 -->
  <path d="M520,548 Q522,310 800,300 Q1078,310 1080,548 Z" fill="url(#cloche)" opacity="0.92"/>
  <!-- Cloche sheen overlay -->
  <path d="M520,548 Q522,310 800,300 Q1078,310 1080,548 Z" fill="url(#clocheSheen)"/>
  <!-- Cloche base band -->
  <rect x="510" y="540" width="580" height="22" rx="8" fill="#9a3309" opacity="0.88"/>
  <!-- Cloche handle knob -->
  <ellipse cx="800" cy="296" rx="38" ry="18" fill="#d97706" opacity="0.9"/>
  <ellipse cx="800" cy="290" rx="22" ry="11" fill="#fbbf24" opacity="0.7"/>

  <!-- Wine glass silhouette — left of plate, inside safe zone -->
  <!-- Bowl -->
  <path d="M258,340 Q220,420 235,490 Q248,530 298,535 Q348,530 361,490 Q376,420 338,340 Z" fill="url(#wine)" opacity="0.72"/>
  <!-- Stem -->
  <rect x="291" y="535" width="14" height="90" rx="5" fill="#be185d" opacity="0.55"/>
  <!-- Base -->
  <ellipse cx="298" cy="627" rx="46" ry="9" fill="#78350f" opacity="0.5"/>
  <!-- Wine fill level line -->
  <path d="M248,430 Q298,445 348,430" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.35"/>

  <!-- Second wine glass (right, mirror, slightly behind) -->
  <path d="M1262,355 Q1224,432 1239,500 Q1252,540 1302,545 Q1352,540 1365,500 Q1380,432 1342,355 Z" fill="url(#wine)" opacity="0.55"/>
  <rect x="1295" y="545" width="14" height="85" rx="5" fill="#be185d" opacity="0.4"/>
  <ellipse cx="1302" cy="632" rx="44" ry="8" fill="#78350f" opacity="0.38"/>

  <!-- Subtle ambient candle-flame accent above cloche handle -->
  <ellipse cx="800" cy="268" rx="8" ry="14" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="800" cy="262" rx="4" ry="8" fill="#fef3ec" opacity="0.7"/>

  <!-- Layer 3: Edge decorations (may be cropped — carry no meaning) -->
  <!-- Full-bleed vignette to deepen corners -->
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Faint tabletop line at bottom edge -->
  <rect x="0" y="830" width="1600" height="70" fill="#0d0606" opacity="0.55"/>
  <!-- Subtle ambient rim light at very top -->
  <rect x="0" y="0" width="1600" height="6" fill="#d97706" opacity="0.18"/>

</svg>
