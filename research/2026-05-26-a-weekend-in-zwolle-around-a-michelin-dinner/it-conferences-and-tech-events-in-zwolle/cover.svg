<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="node1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0c5566"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- decorative orbits, partially cropped on detail view -->
  <ellipse cx="800" cy="450" rx="620" ry="320" fill="none" stroke="#c2410c" stroke-opacity="0.18" stroke-width="2"/>
  <ellipse cx="800" cy="450" rx="460" ry="230" fill="none" stroke="#9a3309" stroke-opacity="0.22" stroke-width="2"/>
  <ellipse cx="800" cy="450" rx="300" ry="150" fill="none" stroke="#78350f" stroke-opacity="0.28" stroke-width="2"/>

  <!-- connecting edges (hub-and-spoke meetup network) -->
  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="800" y1="450" x2="380" y2="240" stroke="#9a3309" stroke-opacity="0.55"/>
    <line x1="800" y1="450" x2="1220" y2="240" stroke="#9a3309" stroke-opacity="0.55"/>
    <line x1="800" y1="450" x2="320" y2="640" stroke="#9a3309" stroke-opacity="0.55"/>
    <line x1="800" y1="450" x2="1280" y2="640" stroke="#9a3309" stroke-opacity="0.55"/>
    <line x1="800" y1="450" x2="800" y2="180" stroke="#0e7490" stroke-opacity="0.55"/>
    <line x1="800" y1="450" x2="800" y2="740" stroke="#0e7490" stroke-opacity="0.55"/>
  </g>

  <!-- secondary network edges between satellites -->
  <g stroke-width="1.5" fill="none" stroke-dasharray="4 6" stroke-opacity="0.4">
    <line x1="380" y1="240" x2="800" y2="180" stroke="#78350f"/>
    <line x1="800" y1="180" x2="1220" y2="240" stroke="#78350f"/>
    <line x1="1220" y1="240" x2="1280" y2="640" stroke="#78350f"/>
    <line x1="1280" y1="640" x2="800" y2="740" stroke="#78350f"/>
    <line x1="800" y1="740" x2="320" y2="640" stroke="#78350f"/>
    <line x1="320" y1="640" x2="380" y2="240" stroke="#78350f"/>
  </g>

  <!-- satellite nodes (meetups / hubs) -->
  <circle cx="380" cy="240" r="36" fill="url(#node1)" opacity="0.92"/>
  <circle cx="1220" cy="240" r="42" fill="url(#node1)" opacity="0.92"/>
  <circle cx="320" cy="640" r="40" fill="url(#node1)" opacity="0.92"/>
  <circle cx="1280" cy="640" r="34" fill="url(#node1)" opacity="0.92"/>
  <circle cx="800" cy="180" r="46" fill="url(#node2)" opacity="0.9"/>
  <circle cx="800" cy="740" r="38" fill="url(#node2)" opacity="0.9"/>

  <!-- small inner ring on each node -->
  <g fill="#fef3ec" opacity="0.85">
    <circle cx="380" cy="240" r="10"/>
    <circle cx="1220" cy="240" r="12"/>
    <circle cx="320" cy="640" r="11"/>
    <circle cx="1280" cy="640" r="9"/>
    <circle cx="800" cy="180" r="14"/>
    <circle cx="800" cy="740" r="11"/>
  </g>

  <!-- hero: central hub (Zwolle as innovation node) -->
  <circle cx="800" cy="450" r="120" fill="#9a3309" opacity="0.25"/>
  <circle cx="800" cy="450" r="92" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="58" fill="#fef3ec" opacity="0.92"/>
  <circle cx="800" cy="450" r="32" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="10" fill="#fbbf24"/>
</svg>
