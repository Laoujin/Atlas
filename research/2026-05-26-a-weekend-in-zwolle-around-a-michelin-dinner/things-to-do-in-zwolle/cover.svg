<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Star-shaped moat (outer): 10-pointed star centred at 800,450 -->
  <polygon points="800,90 853,278 1043,278 894,395 952,580 800,470 648,580 706,395 557,278 747,278"
           fill="url(#moat)" opacity="0.92"/>

  <!-- Inner old-town ring (cream fill, leaves the moat as a band) -->
  <polygon points="800,180 840,310 980,310 870,392 912,530 800,448 688,530 730,392 620,310 760,310"
           fill="url(#inner)" opacity="0.95"/>

  <!-- Peperbus tower silhouette inside the star -->
  <g opacity="0.95">
    <!-- shaft -->
    <rect x="775" y="320" width="50" height="170" fill="url(#tower)"/>
    <!-- mid cornice -->
    <rect x="765" y="312" width="70" height="12" fill="#78350f"/>
    <!-- pepper-pot cap (bulb) -->
    <path d="M 770 320 Q 800 250 830 320 Z" fill="#c2410c"/>
    <path d="M 778 305 Q 800 268 822 305 Z" fill="#9a3309" opacity="0.85"/>
    <!-- spire -->
    <polygon points="800,210 795,260 805,260" fill="#78350f"/>
    <!-- finial ball -->
    <circle cx="800" cy="208" r="4" fill="#fbbf24"/>
    <!-- tower base shadow on town -->
    <ellipse cx="800" cy="495" rx="38" ry="6" fill="#78350f" opacity="0.35"/>
  </g>

  <!-- Subtle bastion accents at star points (small rust dots) -->
  <g fill="#9a3309" opacity="0.55">
    <circle cx="800" cy="90"  r="6"/>
    <circle cx="1043" cy="278" r="6"/>
    <circle cx="952" cy="580" r="6"/>
    <circle cx="648" cy="580" r="6"/>
    <circle cx="557" cy="278" r="6"/>
  </g>

  <!-- Decorative corner canal arcs (outside safe zone, crop-tolerant) -->
  <path d="M 0 780 Q 200 720 380 800 T 760 820" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.25"/>
  <path d="M 1600 110 Q 1400 170 1220 95 T 860 80" stroke="#c2410c" stroke-width="3" fill="none" opacity="0.25"/>
</svg>
