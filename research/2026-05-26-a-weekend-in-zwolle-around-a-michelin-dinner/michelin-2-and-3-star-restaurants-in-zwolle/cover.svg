<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c9b89a"/>
    </radialGradient>
    <radialGradient id="plateInner" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e8dec7"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- rose floor accent (decoration, croppable) -->
  <rect x="0" y="650" width="1600" height="250" fill="url(#accent)"/>

  <!-- three-star constellation (De Librije = 3★) -->
  <g opacity="0.92">
    <circle cx="560" cy="215" r="10" fill="url(#star)"/>
    <circle cx="800" cy="178" r="14" fill="url(#star)"/>
    <circle cx="1040" cy="225" r="10" fill="url(#star)"/>
    <line x1="560" y1="215" x2="800" y2="178" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="800" y1="178" x2="1040" y2="225" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- hero: two overlapping plates centered (~800, 470) -->
  <!-- back plate (smaller, offset right) -->
  <g opacity="0.88">
    <ellipse cx="1010" cy="500" rx="245" ry="235" fill="url(#plate)"/>
    <ellipse cx="1010" cy="500" rx="180" ry="172" fill="url(#plateInner)"/>
    <!-- minimalist garnish dots -->
    <circle cx="985" cy="480" r="9" fill="#c2410c" opacity="0.85"/>
    <circle cx="1035" cy="510" r="6" fill="#9a3309" opacity="0.8"/>
    <circle cx="1005" cy="525" r="4" fill="#78350f" opacity="0.85"/>
    <path d="M 970 465 Q 990 455 1010 462" stroke="#78350f" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- front plate (larger hero) -->
  <g>
    <ellipse cx="640" cy="500" rx="305" ry="290" fill="url(#plate)"/>
    <ellipse cx="640" cy="500" rx="225" ry="214" fill="url(#plateInner)"/>
    <!-- hero garnish: rust dome + drizzle -->
    <ellipse cx="640" cy="495" rx="48" ry="34" fill="#c2410c" opacity="0.92"/>
    <ellipse cx="630" cy="485" rx="22" ry="14" fill="#fbbf24" opacity="0.7"/>
    <circle cx="700" cy="520" r="7" fill="#9a3309" opacity="0.9"/>
    <circle cx="585" cy="515" r="6" fill="#9a3309" opacity="0.85"/>
    <circle cx="715" cy="475" r="4" fill="#78350f"/>
    <circle cx="575" cy="478" r="4" fill="#78350f"/>
    <path d="M 555 540 Q 640 565 725 540" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.55"/>
    <path d="M 590 460 Q 640 448 690 460" stroke="#be185d" stroke-width="1.8" fill="none" opacity="0.55"/>
  </g>

  <!-- wine glass silhouette accent, right side, inside safe zone -->
  <g opacity="0.78">
    <path d="M 1330 320 Q 1330 430 1380 455 Q 1430 430 1430 320 Z" fill="#5c2a1a" opacity="0.85"/>
    <ellipse cx="1380" cy="380" rx="38" ry="28" fill="#9a3309" opacity="0.9"/>
    <rect x="1376" y="455" width="8" height="120" fill="#5c2a1a"/>
    <ellipse cx="1380" cy="582" rx="46" ry="8" fill="#5c2a1a"/>
  </g>
</svg>
