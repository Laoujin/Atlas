<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#e6d9bf"/>
    </radialGradient>
    <linearGradient id="moat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm glow behind the star -->
  <circle cx="800" cy="470" r="420" fill="url(#glow)"/>

  <!-- Star-shaped bastion moat: 10-pointed star around the old town -->
  <g transform="translate(800 470)" opacity="0.92">
    <polygon points="0,-340 70,-180 250,-200 130,-70 320,30 130,60 200,240 30,140 -60,330 -100,140 -290,210 -180,50 -340,-60 -150,-90 -230,-260 -50,-180" fill="url(#moat)" stroke="#78350f" stroke-width="3"/>
    <!-- Inner ring: old town footprint -->
    <polygon points="0,-230 50,-130 175,-140 95,-50 220,20 95,45 140,165 25,100 -40,230 -70,100 -200,150 -125,35 -235,-40 -105,-65 -160,-180 -35,-130" fill="#faf8f2" opacity="0.55"/>
  </g>

  <!-- Peperbus tower silhouette: centered hero, rising from the inner town -->
  <g transform="translate(800 470)">
    <!-- Tower shaft -->
    <rect x="-26" y="-200" width="52" height="200" fill="url(#tower)"/>
    <!-- Octagonal lantern stage -->
    <polygon points="-34,-240 34,-240 26,-200 -26,-200" fill="#9a3309"/>
    <rect x="-32" y="-260" width="64" height="22" fill="#78350f"/>
    <!-- Bulb/cupola (Peperbus = pepper pot) -->
    <path d="M -32 -260 Q -40 -300 -20 -320 Q 0 -334 20 -320 Q 40 -300 32 -260 Z" fill="url(#tower)"/>
    <!-- Spire -->
    <polygon points="-4,-320 4,-320 0,-360" fill="#78350f"/>
    <circle cx="0" cy="-362" r="4" fill="#fbbf24"/>
  </g>

  <!-- Hanseatic gable silhouettes flanking, inside safe zone -->
  <g opacity="0.78" fill="#9a3309">
    <!-- Left cluster of stepped gables -->
    <path d="M 470 600 L 470 510 L 490 510 L 490 490 L 510 490 L 510 470 L 530 470 L 530 490 L 550 490 L 550 510 L 570 510 L 570 600 Z"/>
    <path d="M 580 600 L 580 530 L 600 530 L 600 510 L 620 510 L 620 530 L 640 530 L 640 600 Z"/>
    <!-- Right cluster -->
    <path d="M 1030 600 L 1030 530 L 1050 530 L 1050 510 L 1070 510 L 1070 530 L 1090 530 L 1090 600 Z"/>
    <path d="M 1100 600 L 1100 510 L 1120 510 L 1120 490 L 1140 490 L 1140 470 L 1160 470 L 1160 490 L 1180 490 L 1180 510 L 1200 510 L 1200 600 Z"/>
  </g>

  <!-- Ground line, subtle -->
  <rect x="0" y="600" width="1600" height="2" fill="#78350f" opacity="0.35"/>

  <!-- Edge vignette, full-bleed (decoration outside safe zone) -->
  <rect x="0" y="0" width="1600" height="90" fill="#9a3309" opacity="0.08"/>
  <rect x="0" y="810" width="1600" height="90" fill="#78350f" opacity="0.12"/>
</svg>
