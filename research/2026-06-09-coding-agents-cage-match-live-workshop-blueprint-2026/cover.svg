<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1408"/>
      <stop offset="100%" stop-color="#0f0a1a"/>
    </linearGradient>
    <!-- Central hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.3"/>
    </radialGradient>
    <!-- Hub core -->
    <radialGradient id="hubCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Node gradient violet -->
    <radialGradient id="nodeViolet" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <!-- Node gradient rust -->
    <radialGradient id="nodeRust" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Arena ring gradient -->
    <radialGradient id="arenaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#c2410c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.12"/>
    </radialGradient>
    <!-- Edge glow filter approximation via gradient -->
    <linearGradient id="edgeNW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="edgeNE" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="edgeSW" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="edgeSE" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle arena atmosphere full-bleed -->
  <rect width="1600" height="900" fill="url(#arenaGlow)"/>

  <!-- Corner edge decoration (outside safe zone, purely atmospheric) -->
  <polygon points="0,0 180,0 0,140" fill="#6d28d9" opacity="0.07"/>
  <polygon points="1600,0 1420,0 1600,140" fill="#c2410c" opacity="0.07"/>
  <polygon points="0,900 180,900 0,760" fill="#c2410c" opacity="0.07"/>
  <polygon points="1600,900 1420,900 1600,760" fill="#6d28d9" opacity="0.07"/>

  <!-- Layer 2: Hero element — arena graph centred at (800, 450) -->

  <!-- Arena outer ring -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.18"/>
  <circle cx="800" cy="450" r="322" fill="none" stroke="#6d28d9" stroke-width="0.8" opacity="0.12"/>

  <!-- Orbit ring (dashed effect via short arcs — not arbitrary, marks the competition orbit) -->
  <circle cx="800" cy="450" r="260" fill="none" stroke="#6d28d9" stroke-width="1" stroke-dasharray="18 12" opacity="0.30"/>

  <!-- Edges from hub to each of the four nodes -->
  <!-- NW node at (540, 245) -->
  <line x1="800" y1="450" x2="540" y2="245" stroke="url(#edgeNW)" stroke-width="3" opacity="0.75"/>
  <!-- NE node at (1060, 245) -->
  <line x1="800" y1="450" x2="1060" y2="245" stroke="url(#edgeNE)" stroke-width="3" opacity="0.75"/>
  <!-- SW node at (540, 655) -->
  <line x1="800" y1="450" x2="540" y2="655" stroke="url(#edgeSW)" stroke-width="3" opacity="0.75"/>
  <!-- SE node at (1060, 655) -->
  <line x1="800" y1="450" x2="1060" y2="655" stroke="url(#edgeSE)" stroke-width="3" opacity="0.75"/>

  <!-- Cross-arena edges (competitors aware of each other) -->
  <line x1="540" y1="245" x2="1060" y2="245" stroke="#6d28d9" stroke-width="1.2" opacity="0.22"/>
  <line x1="540" y1="655" x2="1060" y2="655" stroke="#6d28d9" stroke-width="1.2" opacity="0.22"/>
  <line x1="540" y1="245" x2="540" y2="655" stroke="#6d28d9" stroke-width="1.2" opacity="0.22"/>
  <line x1="1060" y1="245" x2="1060" y2="655" stroke="#6d28d9" stroke-width="1.2" opacity="0.22"/>

  <!-- Hub glow halo -->
  <circle cx="800" cy="450" r="110" fill="url(#hubGlow)" opacity="0.55"/>

  <!-- Hub core circle -->
  <circle cx="800" cy="450" r="72" fill="url(#hubCore)" opacity="0.95"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="76" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.6"/>

  <!-- Four competitor nodes — alternating violet/rust, all within safe zone -->
  <!-- NW: violet -->
  <circle cx="540" cy="245" r="46" fill="url(#nodeViolet)" opacity="0.92"/>
  <circle cx="540" cy="245" r="50" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>

  <!-- NE: rust -->
  <circle cx="1060" cy="245" r="46" fill="url(#nodeRust)" opacity="0.92"/>
  <circle cx="1060" cy="245" r="50" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.5"/>

  <!-- SW: rust -->
  <circle cx="540" cy="655" r="46" fill="url(#nodeRust)" opacity="0.92"/>
  <circle cx="540" cy="655" r="50" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.5"/>

  <!-- SE: violet -->
  <circle cx="1060" cy="655" r="46" fill="url(#nodeViolet)" opacity="0.92"/>
  <circle cx="1060" cy="655" r="50" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>

  <!-- Small inner dots on each node (LED accent) -->
  <circle cx="540" cy="245" r="12" fill="#e9d5ff" opacity="0.85"/>
  <circle cx="1060" cy="245" r="12" fill="#fef3ec" opacity="0.85"/>
  <circle cx="540" cy="655" r="12" fill="#fef3ec" opacity="0.85"/>
  <circle cx="1060" cy="655" r="12" fill="#e9d5ff" opacity="0.85"/>

  <!-- Hub centre pip -->
  <circle cx="800" cy="450" r="18" fill="#fbbf24" opacity="0.95"/>

</svg>
