<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#3b1a0a"/>
    </linearGradient>

    <!-- Central hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner target fill -->
    <radialGradient id="targetCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>

    <!-- Orbit ring gradient -->
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Outer ambient glow behind hero -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#78350f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centered on hero -->
  <ellipse cx="800" cy="450" rx="700" ry="420" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero element — target/bullseye with orbiting nodes -->

  <!-- Outermost orbit ring -->
  <circle cx="800" cy="450" r="310" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="18 10"/>

  <!-- Mid orbit ring -->
  <circle cx="800" cy="450" r="210" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="12 8"/>

  <!-- Inner orbit ring -->
  <circle cx="800" cy="450" r="130" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <!-- Spoke lines connecting nodes to centre -->
  <!-- Node 1: top-right ~45deg outer -->
  <line x1="800" y1="450" x2="1019" y2="231" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.3"/>
  <!-- Node 2: bottom-right ~135deg outer -->
  <line x1="800" y1="450" x2="1019" y2="669" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.3"/>
  <!-- Node 3: left ~200deg mid -->
  <line x1="800" y1="450" x2="603" y2="278" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.25"/>
  <!-- Node 4: bottom-left ~250deg mid -->
  <line x1="800" y1="450" x2="591" y2="631" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.25"/>
  <!-- Node 5: top ~330deg mid -->
  <line x1="800" y1="450" x2="905" y2="263" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Cross-node edge (top-right outer to bottom-right outer) -->
  <line x1="1019" y1="231" x2="1019" y2="669" stroke="#6d28d9" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Cross-node edge (node3 to node4) -->
  <line x1="603" y1="278" x2="591" y2="631" stroke="#6d28d9" stroke-width="0.8" stroke-opacity="0.18"/>

  <!-- Bullseye rings — target motif -->
  <!-- Ring 4 (outermost target) -->
  <circle cx="800" cy="450" r="88" fill="none" stroke="#9a3309" stroke-width="14" stroke-opacity="0.7"/>
  <!-- Ring 3 -->
  <circle cx="800" cy="450" r="66" fill="none" stroke="#c2410c" stroke-width="13" stroke-opacity="0.8"/>
  <!-- Ring 2 -->
  <circle cx="800" cy="450" r="45" fill="none" stroke="#d97706" stroke-width="12" stroke-opacity="0.85"/>
  <!-- Ring 1 (innermost) -->
  <circle cx="800" cy="450" r="26" fill="#fbbf24" fill-opacity="0.95"/>

  <!-- Hub glow overlay -->
  <circle cx="800" cy="450" r="110" fill="url(#hubGlow)" opacity="0.4"/>

  <!-- Outer orbit nodes (violet) -->
  <!-- Node 1: top-right -->
  <circle cx="1019" cy="231" r="16" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="1019" cy="231" r="8" fill="#a78bfa" opacity="0.95"/>
  <!-- Node 2: bottom-right -->
  <circle cx="1019" cy="669" r="16" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="1019" cy="669" r="8" fill="#a78bfa" opacity="0.95"/>

  <!-- Mid orbit nodes (violet, smaller) -->
  <!-- Node 3: upper-left mid -->
  <circle cx="603" cy="278" r="12" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="603" cy="278" r="6" fill="#c4b5fd" opacity="0.9"/>
  <!-- Node 4: lower-left mid -->
  <circle cx="591" cy="631" r="12" fill="url(#nodeGlow)" opacity="0.8"/>
  <circle cx="591" cy="631" r="6" fill="#c4b5fd" opacity="0.9"/>
  <!-- Node 5: upper-right mid (rust accent) -->
  <circle cx="905" cy="263" r="12" fill="url(#hubGlow)" opacity="0.85"/>
  <circle cx="905" cy="263" r="6" fill="#fbbf24" opacity="0.95"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Top-left corner arc -->
  <path d="M0,0 Q120,80 80,200" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Bottom-right corner arc -->
  <path d="M1600,900 Q1480,820 1520,700" fill="none" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="none" stroke="#1a0e0e" stroke-width="0"/>
</svg>
