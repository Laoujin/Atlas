<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1010"/>
      <stop offset="100%" stop-color="#3a1a2a"/>
    </linearGradient>
    <!-- Hub radial glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Orbit ambient glow -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Violet node gradient -->
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.8"/>
    </radialGradient>
    <!-- Rust node gradient -->
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.8"/>
    </radialGradient>
    <!-- Edge glow filter substitute: just use opacity -->
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient radial glow centered on hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#orbitGlow)"/>

  <!-- Layer 2: Hero element — orbit system centered at (800, 450) -->

  <!-- Outer orbit ring -->
  <ellipse cx="800" cy="450" rx="460" ry="280"
           fill="none" stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Middle orbit ring -->
  <ellipse cx="800" cy="450" rx="300" ry="182"
           fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Inner orbit ring -->
  <ellipse cx="800" cy="450" rx="160" ry="97"
           fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-opacity="0.4"/>

  <!-- Edge lines: hub to outer nodes -->
  <!-- Hub to node A (top-right outer) -->
  <line x1="800" y1="450" x2="1160" y2="275"
        stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- Hub to node B (bottom-left outer) -->
  <line x1="800" y1="450" x2="430" y2="615"
        stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- Hub to node C (top-left outer) -->
  <line x1="800" y1="450" x2="460" y2="245"
        stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Hub to node D (bottom-right outer) -->
  <line x1="800" y1="450" x2="1145" y2="650"
        stroke="#c2410c" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Mid-ring nodes connected to outer nodes -->
  <line x1="960" y1="380" x2="1160" y2="275"
        stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.3"/>
  <line x1="640" y1="520" x2="430" y2="615"
        stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.3"/>

  <!-- Hub central circle -->
  <circle cx="800" cy="450" r="56" fill="url(#hubGlow)"/>
  <!-- Hub inner core highlight -->
  <circle cx="800" cy="450" r="30" fill="#fbbf24" fill-opacity="0.7"/>
  <!-- Hub centre dot -->
  <circle cx="800" cy="450" r="10" fill="#fff" fill-opacity="0.85"/>

  <!-- Inner ring nodes (2 nodes) -->
  <circle cx="954" cy="422" r="18" fill="url(#nodeRust)"/>
  <circle cx="646" cy="478" r="18" fill="url(#nodeRust)"/>

  <!-- Middle ring nodes (2 nodes) -->
  <circle cx="960" cy="380" r="24" fill="url(#nodeViolet)"/>
  <circle cx="640" cy="520" r="24" fill="url(#nodeViolet)"/>

  <!-- Outer ring nodes (4 nodes) — sitting on or near outer ellipse -->
  <!-- Node A: top-right -->
  <circle cx="1160" cy="275" r="30" fill="url(#nodeViolet)"/>
  <!-- Node B: bottom-left -->
  <circle cx="430" cy="615" r="30" fill="url(#nodeViolet)"/>
  <!-- Node C: top-left -->
  <circle cx="460" cy="245" r="28" fill="url(#nodeRust)"/>
  <!-- Node D: bottom-right -->
  <circle cx="1145" cy="650" r="28" fill="url(#nodeRust)"/>

  <!-- Node inner highlights -->
  <circle cx="1160" cy="275" r="12" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="430"  cy="615" r="12" fill="#a78bfa" fill-opacity="0.6"/>
  <circle cx="460"  cy="245" r="11" fill="#fbbf24" fill-opacity="0.55"/>
  <circle cx="1145" cy="650" r="11" fill="#fbbf24" fill-opacity="0.55"/>

  <!-- Layer 3: Decorative corner accents (outside safe zone — atmospheric only) -->
  <!-- Top-left corner arc sweep -->
  <path d="M 0 0 Q 180 60 120 200" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Bottom-right corner arc sweep -->
  <path d="M 1600 900 Q 1420 840 1480 700" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Subtle full-bleed top edge bar -->
  <rect x="0" y="0" width="1600" height="3" fill="#c2410c" fill-opacity="0.5"/>
  <!-- Subtle full-bleed bottom edge bar -->
  <rect x="0" y="897" width="1600" height="3" fill="#c2410c" fill-opacity="0.5"/>
</svg>
