<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="640" ry="400" fill="url(#glow)"/>

  <!-- Strata: input score-bands at a slight angle, narrowing toward synthesis -->
  <g transform="rotate(-7 800 450)">
    <rect x="300" y="210" width="1000" height="56" rx="10" fill="#78350f" opacity="0.55"/>
    <rect x="350" y="296" width="900"  height="56" rx="10" fill="#9a3309" opacity="0.7"/>
    <rect x="400" y="382" width="800"  height="56" rx="10" fill="url(#band)" opacity="0.85"/>
    <!-- hero synthesis band -->
    <rect x="320" y="470" width="960"  height="78" rx="14" fill="url(#hero)"/>
    <rect x="450" y="588" width="700"  height="50" rx="10" fill="#d97706" opacity="0.65"/>
  </g>

  <!-- scoring nodes converging on the hero band -->
  <circle cx="560" cy="438" r="16" fill="#78350f" opacity="0.8"/>
  <circle cx="800" cy="452" r="22" fill="#fbbf24"/>
  <circle cx="1040" cy="466" r="16" fill="#9a3309" opacity="0.85"/>
</svg>
