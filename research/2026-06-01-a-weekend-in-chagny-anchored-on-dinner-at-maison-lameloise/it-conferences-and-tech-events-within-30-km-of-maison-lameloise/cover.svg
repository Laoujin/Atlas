<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="pinGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pinBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant ridge (full-bleed, decorative) -->
  <path d="M0,620 L180,560 L340,590 L520,540 L720,570 L900,530 L1080,560 L1280,520 L1440,550 L1600,530 L1600,900 L0,900 Z"
        fill="url(#ridge2)" opacity="0.55"/>

  <!-- Near ridge (full-bleed, decorative) -->
  <path d="M0,720 L160,680 L320,710 L500,660 L680,700 L860,670 L1040,710 L1240,675 L1420,705 L1600,685 L1600,900 L0,900 Z"
        fill="url(#ridge1)" opacity="0.85"/>

  <!-- Vineyard row hints on near ridge -->
  <g stroke="#fef3ec" stroke-width="1.5" opacity="0.18">
    <path d="M0,760 Q400,735 800,755 T1600,745" fill="none"/>
    <path d="M0,795 Q400,775 800,790 T1600,782" fill="none"/>
    <path d="M0,830 Q400,815 800,825 T1600,820" fill="none"/>
  </g>

  <!-- Hero: concentric radius rings centered at (800, 450) -->
  <g transform="translate(800,450)">
    <circle r="380" fill="url(#pinGlow)" opacity="0.55"/>
    <circle r="340" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.35"/>
    <circle r="270" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.55"/>
    <circle r="195" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.75"/>
    <circle r="120" fill="none" stroke="#d97706" stroke-width="3" opacity="0.9"/>

    <!-- Satellite venue dots on the rings -->
    <circle cx="-195" cy="0" r="7" fill="#78350f" opacity="0.9"/>
    <circle cx="170" cy="-95" r="7" fill="#78350f" opacity="0.9"/>
    <circle cx="95" cy="170" r="7" fill="#78350f" opacity="0.9"/>
    <circle cx="-240" cy="125" r="6" fill="#9a3309" opacity="0.85"/>
    <circle cx="260" cy="80" r="6" fill="#9a3309" opacity="0.85"/>

    <!-- Center pin: teardrop + inner circle -->
    <path d="M0,-90 C40,-90 60,-60 60,-30 C60,10 30,40 0,90 C-30,40 -60,10 -60,-30 C-60,-60 -40,-90 0,-90 Z"
          fill="url(#pinBody)" opacity="0.95"/>
    <circle r="22" cy="-30" fill="#fef3ec" opacity="0.9"/>
    <circle r="10" cy="-30" fill="#c2410c"/>
  </g>
</svg>
