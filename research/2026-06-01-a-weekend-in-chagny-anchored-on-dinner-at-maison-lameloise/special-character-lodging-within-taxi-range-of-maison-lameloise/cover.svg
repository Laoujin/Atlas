<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="chateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="vines" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Sky background, full-bleed -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow, sits behind the château -->
  <circle cx="820" cy="500" r="360" fill="url(#sun)"/>

  <!-- Distant hill silhouette -->
  <path d="M0,620 C260,560 520,600 800,540 C1080,480 1340,540 1600,560 L1600,900 L0,900 Z" fill="#9a3309" opacity="0.55"/>

  <!-- Main hill carrying the château -->
  <path d="M0,720 C220,640 480,660 800,600 C1120,540 1380,640 1600,660 L1600,900 L0,900 Z" fill="url(#hill)"/>

  <!-- Vineyard rows: curved furrows leading the eye toward the château -->
  <g stroke="#5c2a1a" stroke-width="3" fill="none" opacity="0.75">
    <path d="M-40,900 C300,820 600,740 820,650"/>
    <path d="M120,900 C420,830 660,760 830,680"/>
    <path d="M280,900 C520,840 700,780 840,700"/>
    <path d="M440,900 C620,860 740,800 850,720"/>
    <path d="M1640,900 C1320,820 1020,740 800,650"/>
    <path d="M1500,900 C1240,830 980,760 790,680"/>
    <path d="M1360,900 C1160,840 940,780 780,700"/>
    <path d="M1220,900 C1080,860 920,800 770,720"/>
  </g>

  <!-- Château silhouette: central keep with two flanking turrets and pitched roofs -->
  <g fill="url(#chateau)">
    <!-- Left turret -->
    <rect x="660" y="480" width="70" height="170"/>
    <polygon points="650,480 740,480 695,410"/>
    <!-- Right turret -->
    <rect x="870" y="480" width="70" height="170"/>
    <polygon points="860,480 950,480 905,410"/>
    <!-- Central main block -->
    <rect x="730" y="510" width="140" height="140"/>
    <polygon points="720,510 880,510 800,430"/>
    <!-- Central spire -->
    <polygon points="792,430 808,430 800,380"/>
  </g>

  <!-- Warm window glints on the château -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="685" y="540" width="8" height="14"/>
    <rect x="697" y="540" width="8" height="14"/>
    <rect x="895" y="540" width="8" height="14"/>
    <rect x="907" y="540" width="8" height="14"/>
    <rect x="755" y="560" width="9" height="16"/>
    <rect x="775" y="560" width="9" height="16"/>
    <rect x="816" y="560" width="9" height="16"/>
    <rect x="836" y="560" width="9" height="16"/>
    <rect x="780" y="605" width="14" height="30" opacity="0.95"/>
    <rect x="806" y="605" width="14" height="30" opacity="0.95"/>
  </g>

  <!-- Foreground vineyard band, full-bleed -->
  <path d="M0,820 C300,790 700,810 1600,790 L1600,900 L0,900 Z" fill="url(#vines)"/>
</svg>
