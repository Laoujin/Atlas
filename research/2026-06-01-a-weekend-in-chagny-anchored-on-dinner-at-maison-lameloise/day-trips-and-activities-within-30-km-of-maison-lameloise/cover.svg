<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#e8d9b8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="roofShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="vine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tiles" x="0" y="0" width="120" height="80" patternUnits="userSpaceOnUse">
      <rect width="120" height="80" fill="#d97706"/>
      <polygon points="60,0 120,40 60,80 0,40" fill="#78350f"/>
      <polygon points="60,12 108,40 60,68 12,40" fill="#fbbf24" opacity="0.75"/>
      <polygon points="60,24 96,40 60,56 24,40" fill="#9a3309"/>
    </pattern>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm sun glow behind hero -->
  <ellipse cx="800" cy="430" rx="620" ry="380" fill="url(#sun)"/>

  <!-- vineyard rows (foreground decoration, mostly outside safe zone bottom) -->
  <g opacity="0.85">
    <path d="M 0 820 Q 800 760 1600 820 L 1600 900 L 0 900 Z" fill="#5c2a1a"/>
    <g stroke="#78350f" stroke-width="3" fill="none" opacity="0.6">
      <path d="M 0 830 Q 800 770 1600 830"/>
      <path d="M 0 850 Q 800 795 1600 850"/>
      <path d="M 0 875 Q 800 825 1600 875"/>
    </g>
    <g fill="#c2410c" opacity="0.7">
      <circle cx="120" cy="828" r="4"/>
      <circle cx="280" cy="815" r="4"/>
      <circle cx="440" cy="800" r="4"/>
      <circle cx="640" cy="788" r="4"/>
      <circle cx="820" cy="785" r="4"/>
      <circle cx="980" cy="790" r="4"/>
      <circle cx="1180" cy="802" r="4"/>
      <circle cx="1360" cy="820" r="4"/>
      <circle cx="1480" cy="832" r="4"/>
    </g>
  </g>

  <!-- HERO: Burgundian polychrome roof, centered in safe zone -->
  <g transform="translate(800 470)">
    <!-- back roof slope (shadow side) -->
    <polygon points="-340,140 -340,-60 0,-220 340,-60 340,140" fill="url(#roofShadow)" opacity="0.95"/>
    <!-- front face with polychrome tile pattern -->
    <polygon points="-300,160 -300,-40 0,-200 300,-40 300,160" fill="url(#tiles)"/>
    <!-- crisp ridge highlight -->
    <polygon points="-300,-40 0,-200 300,-40 0,-30" fill="url(#roof)" opacity="0.4"/>
    <!-- dormer window suggestion (small chimney/turret) -->
    <rect x="-30" y="-110" width="60" height="60" fill="#1a0e0e" opacity="0.55"/>
    <polygon points="-40,-110 0,-150 40,-110" fill="url(#roofShadow)"/>
    <!-- roof edge -->
    <polygon points="-300,160 300,160 320,180 -320,180" fill="#5c2a1a"/>
  </g>

  <!-- hot-air balloon, small accent inside safe zone, upper right -->
  <g transform="translate(1280 220)" opacity="0.9">
    <path d="M 0 0 Q -55 -10 -55 -65 Q -55 -130 0 -130 Q 55 -130 55 -65 Q 55 -10 0 0 Z" fill="url(#roof)"/>
    <path d="M -30 -130 Q 0 -100 30 -130" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5"/>
    <line x1="-18" y1="-2" x2="-12" y2="22" stroke="#5c2a1a" stroke-width="1.5"/>
    <line x1="18" y1="-2" x2="12" y2="22" stroke="#5c2a1a" stroke-width="1.5"/>
    <rect x="-14" y="22" width="28" height="18" fill="#5c2a1a"/>
  </g>

  <!-- distant rolling hills (Côte) -->
  <path d="M 0 620 Q 300 560 600 595 Q 900 625 1200 580 Q 1400 555 1600 590 L 1600 700 L 0 700 Z" fill="#c2410c" opacity="0.25"/>
  <path d="M 0 680 Q 400 640 800 665 Q 1200 685 1600 650 L 1600 760 L 0 760 Z" fill="#9a3309" opacity="0.3"/>
</svg>
