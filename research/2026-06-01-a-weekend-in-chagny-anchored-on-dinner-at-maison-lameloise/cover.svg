<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="rows" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Atmospheric sun halo, off-center for editorial feel -->
  <circle cx="980" cy="520" r="420" fill="url(#sun)"/>

  <!-- Distant ridge -->
  <path d="M0,580 C220,540 380,560 560,540 C760,518 920,548 1120,532 C1300,520 1460,540 1600,528 L1600,640 L0,640 Z"
        fill="#78350f" opacity="0.78"/>

  <!-- Mid ridge with stone village silhouette (rooftops + church spire) -->
  <path d="M0,620 L180,612 L260,600 L340,612 L420,600 L460,588 L500,600 L560,592
           L600,600 L640,572 L660,572 L680,600 L740,600 L820,612 L900,604
           L980,612 L1080,604 L1200,616 L1340,608 L1460,620 L1600,612 L1600,720 L0,720 Z"
        fill="url(#hills)" opacity="0.92"/>

  <!-- Foreground vineyard rows (perspective) -->
  <g opacity="0.92">
    <path d="M0,720 L1600,700 L1600,900 L0,900 Z" fill="#1a0e0e"/>
    <path d="M-40,740 L1640,720" stroke="#9a3309" stroke-width="3" opacity="0.55"/>
    <path d="M-60,770 L1660,748" stroke="#c2410c" stroke-width="4" opacity="0.6"/>
    <path d="M-80,805 L1680,780" stroke="#d97706" stroke-width="5" opacity="0.55"/>
    <path d="M-100,845 L1700,818" stroke="#c2410c" stroke-width="6" opacity="0.5"/>
    <path d="M-120,890 L1720,860" stroke="#9a3309" stroke-width="7" opacity="0.5"/>
  </g>

  <!-- HERO: hot-air balloon over the Côte, centered in safe zone -->
  <g transform="translate(770,360)">
    <!-- envelope -->
    <path d="M0,0
             C -130,0 -150,-90 -120,-180
             C -90,-260 -50,-300 0,-300
             C 50,-300 90,-260 120,-180
             C 150,-90 130,0 0,0 Z"
          fill="url(#balloon)" stroke="#1a0e0e" stroke-width="2.5"/>
    <!-- vertical seams -->
    <path d="M-60,-12 C -70,-110 -50,-220 -20,-296" stroke="#1a0e0e" stroke-width="1.5" fill="none" opacity="0.55"/>
    <path d="M60,-12 C 70,-110 50,-220 20,-296" stroke="#1a0e0e" stroke-width="1.5" fill="none" opacity="0.55"/>
    <path d="M0,0 L0,-300" stroke="#1a0e0e" stroke-width="1.5" opacity="0.5"/>
    <!-- horizontal band -->
    <path d="M-128,-130 C -90,-118 90,-118 128,-130" stroke="#1a0e0e" stroke-width="2" fill="none" opacity="0.45"/>
    <!-- ropes -->
    <line x1="-70" y1="-6" x2="-40" y2="60" stroke="#1a0e0e" stroke-width="1.8"/>
    <line x1="-30" y1="-2" x2="-22" y2="60" stroke="#1a0e0e" stroke-width="1.8"/>
    <line x1="30" y1="-2" x2="22" y2="60" stroke="#1a0e0e" stroke-width="1.8"/>
    <line x1="70" y1="-6" x2="40" y2="60" stroke="#1a0e0e" stroke-width="1.8"/>
    <!-- basket -->
    <rect x="-42" y="58" width="84" height="44" rx="4" fill="#78350f" stroke="#1a0e0e" stroke-width="2"/>
    <line x1="-42" y1="74" x2="42" y2="74" stroke="#1a0e0e" stroke-width="1" opacity="0.6"/>
    <line x1="-28" y1="58" x2="-28" y2="102" stroke="#1a0e0e" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="58" x2="0" y2="102" stroke="#1a0e0e" stroke-width="1" opacity="0.6"/>
    <line x1="28" y1="58" x2="28" y2="102" stroke="#1a0e0e" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Foreground wine glass silhouette, anchoring lower-left of safe zone -->
  <g transform="translate(310,470)" opacity="0.92">
    <!-- bowl -->
    <path d="M-70,0 C -70,90 -40,150 0,160 C 40,150 70,90 70,0 C 50,-10 -50,-10 -70,0 Z"
          fill="#1a0e0e" stroke="#c2410c" stroke-width="2.5"/>
    <!-- wine fill -->
    <path d="M-62,18 C -58,90 -32,140 0,150 C 32,140 58,90 62,18 C 40,12 -40,12 -62,18 Z"
          fill="#9a3309" opacity="0.85"/>
    <!-- highlight on wine surface -->
    <ellipse cx="-18" cy="22" rx="22" ry="4" fill="#fbbf24" opacity="0.35"/>
    <!-- stem -->
    <rect x="-3" y="160" width="6" height="130" fill="#1a0e0e"/>
    <!-- base -->
    <ellipse cx="0" cy="294" rx="56" ry="8" fill="#1a0e0e"/>
    <ellipse cx="0" cy="292" rx="56" ry="5" fill="#78350f"/>
  </g>

  <!-- A single warm candle-flame spark near the glass rim -->
  <g transform="translate(430,420)" opacity="0.85">
    <path d="M0,0 C -6,-14 -2,-26 0,-34 C 4,-26 6,-14 0,0 Z" fill="#fbbf24"/>
    <path d="M0,-4 C -3,-12 -1,-20 0,-26 C 2,-20 3,-12 0,-4 Z" fill="#fef3ec"/>
  </g>
</svg>
