<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#faf8f2" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow behind hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- river band (decoration, partial crop OK) -->
  <rect x="0" y="640" width="1600" height="120" fill="url(#river)" opacity="0.7"/>
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- distant London skyline silhouette (across the bleed; meaning survives crop) -->
  <g fill="url(#skyline)" opacity="0.92">
    <!-- left bank: rooftops -->
    <path d="M 0 640 L 0 575 L 80 575 L 80 555 L 140 555 L 140 590 L 210 590 L 210 540 L 230 540 L 230 530 L 240 530 L 240 540 L 260 540 L 260 590 L 340 590 L 340 560 L 410 560 L 410 600 L 470 600 L 470 640 Z"/>
    <!-- Big Ben tower -->
    <path d="M 470 640 L 470 480 L 490 480 L 490 430 L 495 430 L 495 410 L 500 410 L 500 395 L 505 395 L 505 410 L 510 410 L 510 430 L 515 430 L 515 480 L 535 480 L 535 640 Z"/>
    <!-- mid rooftops -->
    <path d="M 535 640 L 535 595 L 600 595 L 600 575 L 660 575 L 660 605 L 720 605 L 720 590 L 760 590 L 760 615 L 820 615 L 820 640 Z"/>
    <!-- St Paul's dome cluster -->
    <path d="M 820 640 L 820 580 L 870 580 Q 895 520 920 580 L 970 580 L 970 640 Z"/>
    <circle cx="920" cy="555" r="6" fill="#78350f"/>
    <!-- Gherkin curve -->
    <path d="M 970 640 L 970 600 Q 1010 470 1050 600 L 1050 640 Z"/>
    <!-- Shard triangle -->
    <path d="M 1100 640 L 1130 420 L 1135 420 L 1170 640 Z"/>
    <!-- right bank rooftops -->
    <path d="M 1170 640 L 1170 590 L 1240 590 L 1240 565 L 1310 565 L 1310 600 L 1380 600 L 1380 580 L 1450 580 L 1450 610 L 1530 610 L 1530 595 L 1600 595 L 1600 640 Z"/>
  </g>

  <!-- scattered window lights -->
  <g fill="#fbbf24" opacity="0.7">
    <rect x="100" y="600" width="3" height="3"/>
    <rect x="160" y="610" width="3" height="3"/>
    <rect x="280" y="605" width="3" height="3"/>
    <rect x="360" y="580" width="3" height="3"/>
    <rect x="610" y="610" width="3" height="3"/>
    <rect x="680" y="620" width="3" height="3"/>
    <rect x="760" y="625" width="3" height="3"/>
    <rect x="1260" y="585" width="3" height="3"/>
    <rect x="1340" y="615" width="3" height="3"/>
    <rect x="1470" y="600" width="3" height="3"/>
  </g>

  <!-- HERO: cloche (silver dome) lifting off a plate, centered ~(800, 450) -->
  <g transform="translate(800 470)">
    <!-- plate ellipse (table surface) -->
    <ellipse cx="0" cy="120" rx="320" ry="42" fill="#1a0e0e" opacity="0.5"/>
    <ellipse cx="0" cy="115" rx="300" ry="34" fill="url(#plate)" opacity="0.92"/>
    <ellipse cx="0" cy="113" rx="240" ry="22" fill="#faf8f2" opacity="0.6"/>

    <!-- steam wisps rising (between plate and dome) -->
    <path d="M -60 50 Q -50 20 -65 -10 Q -75 -40 -55 -70" stroke="#fef3ec" stroke-width="2.5" stroke-opacity="0.45" fill="none" stroke-linecap="round"/>
    <path d="M 0 45 Q 12 15 -3 -20 Q -15 -55 5 -85" stroke="#fef3ec" stroke-width="2.5" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
    <path d="M 60 50 Q 50 20 65 -10 Q 75 -40 55 -70" stroke="#fef3ec" stroke-width="2.5" stroke-opacity="0.45" fill="none" stroke-linecap="round"/>

    <!-- cloche dome -->
    <path d="M -180 100 Q -180 -120 0 -150 Q 180 -120 180 100 Z" fill="url(#dome)" opacity="0.95"/>
    <!-- dome highlight -->
    <path d="M -130 60 Q -140 -80 -40 -130" stroke="#fbbf24" stroke-width="6" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
    <!-- dome base rim -->
    <ellipse cx="0" cy="100" rx="180" ry="14" fill="#78350f" opacity="0.85"/>
    <!-- finial -->
    <circle cx="0" cy="-155" r="14" fill="url(#dome)"/>
    <circle cx="0" cy="-155" r="6" fill="#fef3ec" opacity="0.75"/>
    <line x1="0" y1="-141" x2="0" y2="-152" stroke="#78350f" stroke-width="3"/>

    <!-- single Michelin-esque star above finial -->
    <g transform="translate(0 -200)" fill="#fbbf24" opacity="0.95">
      <path d="M 0 -22 L 6 -7 L 22 -7 L 9 3 L 14 18 L 0 9 L -14 18 L -9 3 L -22 -7 L -6 -7 Z"/>
    </g>
  </g>
</svg>
