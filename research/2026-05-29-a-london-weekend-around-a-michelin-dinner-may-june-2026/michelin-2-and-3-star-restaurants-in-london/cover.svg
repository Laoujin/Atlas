<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <linearGradient id="cloche" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="clocheBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3a1a0c"/>
    </radialGradient>
    <symbol id="mstar" viewBox="-50 -50 100 100">
      <path d="M0,-46 L11,-15 L44,-14 L18,5 L28,37 L0,18 L-28,37 L-18,5 L-44,-14 L-11,-15 Z" fill="url(#star)"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- subtle warm floor glow -->
  <ellipse cx="800" cy="780" rx="700" ry="80" fill="#c2410c" opacity="0.18"/>

  <!-- back cloche (smaller, left) -->
  <g opacity="0.78">
    <ellipse cx="540" cy="640" rx="190" ry="22" fill="#1a0e0e" opacity="0.7"/>
    <path d="M 360,635 Q 360,455 540,455 Q 720,455 720,635 Z" fill="url(#clocheBack)"/>
    <circle cx="540" cy="455" r="14" fill="#fbbf24" opacity="0.85"/>
    <path d="M 360,635 L 720,635 L 720,650 L 360,650 Z" fill="#3a1a0c"/>
  </g>

  <!-- hero cloche (centered, larger) -->
  <g>
    <ellipse cx="900" cy="700" rx="280" ry="30" fill="#1a0e0e" opacity="0.85"/>
    <path d="M 640,695 Q 640,440 900,440 Q 1160,440 1160,695 Z" fill="url(#cloche)"/>
    <!-- highlight sheen -->
    <path d="M 700,660 Q 700,490 870,470" stroke="#fbbf24" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>
    <!-- finial -->
    <circle cx="900" cy="440" r="22" fill="#fbbf24"/>
    <circle cx="900" cy="440" r="10" fill="#fef3ec" opacity="0.9"/>
    <!-- base ring -->
    <ellipse cx="900" cy="695" rx="260" ry="18" fill="#3a1a0c"/>
    <ellipse cx="900" cy="695" rx="260" ry="10" fill="#78350f"/>
  </g>

  <!-- three rising stars above hero (3-star tier) -->
  <g>
    <use href="#mstar" x="780" y="180" width="120" height="120" opacity="0.95"/>
    <use href="#mstar" x="900" y="120" width="140" height="140" opacity="0.95"/>
    <use href="#mstar" x="1030" y="195" width="110" height="110" opacity="0.9"/>
  </g>

  <!-- two smaller stars above back cloche (2-star tier) -->
  <g opacity="0.78">
    <use href="#mstar" x="450" y="290" width="80" height="80"/>
    <use href="#mstar" x="535" y="270" width="75" height="75"/>
  </g>

  <!-- faint sparkle dots tying stars to cloche -->
  <circle cx="850" cy="340" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="960" cy="320" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="900" cy="380" r="2" fill="#fef3ec" opacity="0.6"/>
  <circle cx="500" cy="400" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>
