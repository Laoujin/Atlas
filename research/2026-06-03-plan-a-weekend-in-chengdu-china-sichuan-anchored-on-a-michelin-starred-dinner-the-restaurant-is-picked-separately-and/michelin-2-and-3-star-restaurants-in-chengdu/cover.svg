<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust-dark -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>

    <!-- Plate surface gradient -->
    <radialGradient id="plateGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f0eadb" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.30"/>
    </radialGradient>

    <!-- Cloche dome gradient -->
    <radialGradient id="clocheGrad" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.80"/>
    </radialGradient>

    <!-- Warm ambient glow behind plate -->
    <radialGradient id="glowAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Ambient warm glow behind hero -->
  <ellipse cx="800" cy="480" rx="620" ry="400" fill="url(#glowAmbient)"/>

  <!-- Layer 2: Hero — centered plate and cloche, safe zone x:125–1475, y:90–810 -->

  <!-- Outer decorative ring (subtle) -->
  <ellipse cx="800" cy="540" rx="390" ry="48"
    fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Plate base — large ellipse representing the plate surface -->
  <ellipse cx="800" cy="540" rx="340" ry="42" fill="#78350f" fill-opacity="0.60"/>
  <ellipse cx="800" cy="535" rx="320" ry="36" fill="url(#plateGrad)"/>

  <!-- Plate rim highlight -->
  <ellipse cx="800" cy="533" rx="320" ry="36"
    fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- Cloche dome — the hero element -->
  <ellipse cx="800" cy="390" rx="230" ry="165" fill="url(#clocheGrad)" opacity="0.92"/>

  <!-- Cloche base band (where dome meets plate) -->
  <rect x="570" y="488" width="460" height="24" rx="8"
    fill="#9a3309" fill-opacity="0.88"/>
  <rect x="570" y="488" width="460" height="5" rx="3"
    fill="#fbbf24" fill-opacity="0.55"/>

  <!-- Cloche knob / handle at top -->
  <ellipse cx="800" cy="228" rx="28" ry="14" fill="#d97706" opacity="0.90"/>
  <rect x="794" y="228" width="12" height="32" rx="6"
    fill="#c2410c" opacity="0.88"/>
  <ellipse cx="800" cy="258" rx="18" ry="9" fill="#9a3309" opacity="0.85"/>

  <!-- Cloche highlight sheen -->
  <ellipse cx="740" cy="320" rx="60" ry="40"
    fill="#fbbf24" fill-opacity="0.18" transform="rotate(-20 740 320)"/>

  <!-- Layer 3: Edge decorations (may crop variably — carry no meaning) -->

  <!-- Bottom-left corner accent arc -->
  <path d="M 0 900 Q 200 700 400 800"
    fill="none" stroke="#c2410c" stroke-width="2" stroke-opacity="0.22"/>

  <!-- Top-right corner accent arc -->
  <path d="M 1600 0 Q 1380 180 1200 100"
    fill="none" stroke="#9a3309" stroke-width="2" stroke-opacity="0.22"/>

  <!-- Full-bleed edge vignette -->
  <rect width="1600" height="900"
    fill="url(#bgGlow)" fill-opacity="0.18"/>
</svg>
