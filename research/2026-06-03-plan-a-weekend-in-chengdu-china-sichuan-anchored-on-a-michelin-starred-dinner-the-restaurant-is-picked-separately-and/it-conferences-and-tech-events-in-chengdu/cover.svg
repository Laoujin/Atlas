<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slide1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1: radial spotlight glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: hero — stacked angled slides/presentation stages -->
  <!-- Bottom slide (deepest) -->
  <polygon points="400,640 1200,640 1160,530 440,530" fill="url(#slide1)" opacity="0.70"/>
  <!-- Text-line bars on bottom slide -->
  <rect x="480" y="555" width="220" height="12" rx="4" fill="#fbbf24" opacity="0.25"/>
  <rect x="480" y="576" width="160" height="10" rx="4" fill="#fbbf24" opacity="0.18"/>

  <!-- Middle slide -->
  <polygon points="440,530 1160,530 1120,390 480,390" fill="url(#slide2)" opacity="0.80"/>
  <!-- Text-line bars on middle slide -->
  <rect x="520" y="415" width="260" height="13" rx="4" fill="#fbbf24" opacity="0.28"/>
  <rect x="520" y="438" width="180" height="11" rx="4" fill="#fbbf24" opacity="0.20"/>
  <rect x="520" y="459" width="140" height="10" rx="4" fill="#fbbf24" opacity="0.15"/>

  <!-- Top slide (hero surface) -->
  <polygon points="480,390 1120,390 1080,240 520,240" fill="url(#slide3)" opacity="0.90"/>
  <!-- Accent bar on top slide — simulates a header band -->
  <polygon points="480,390 1120,390 1120,365 480,365" fill="#78350f" opacity="0.50"/>
  <!-- Text-line bars on top slide -->
  <rect x="560" y="275" width="300" height="16" rx="5" fill="#1a0e0e" opacity="0.40"/>
  <rect x="560" y="302" width="220" height="12" rx="4" fill="#1a0e0e" opacity="0.28"/>
  <rect x="560" y="324" width="180" height="11" rx="4" fill="#1a0e0e" opacity="0.22"/>

  <!-- Podium / stage base -->
  <polygon points="580,640 1020,640 1060,720 540,720" fill="#78350f" opacity="0.60"/>
  <polygon points="580,640 1020,640 1060,720 540,720" fill="#9a3309" opacity="0.25"/>

  <!-- Layer 3: decorative corner accents (outside safe zone) -->
  <!-- Top-left corner streak -->
  <line x1="0" y1="0" x2="180" y2="120" stroke="#c2410c" stroke-width="2" opacity="0.30"/>
  <line x1="0" y1="40" x2="140" y2="120" stroke="#d97706" stroke-width="1.5" opacity="0.20"/>
  <!-- Bottom-right corner streak -->
  <line x1="1600" y1="900" x2="1420" y2="780" stroke="#c2410c" stroke-width="2" opacity="0.30"/>
  <line x1="1600" y1="860" x2="1460" y2="780" stroke="#d97706" stroke-width="1.5" opacity="0.20"/>

  <!-- Subtle audience-row dots at the bottom edge (decorative) -->
  <circle cx="350" cy="820" r="6" fill="#d97706" opacity="0.22"/>
  <circle cx="420" cy="840" r="5" fill="#c2410c" opacity="0.18"/>
  <circle cx="500" cy="830" r="7" fill="#d97706" opacity="0.15"/>
  <circle cx="620" cy="845" r="5" fill="#c2410c" opacity="0.18"/>
  <circle cx="750" cy="855" r="6" fill="#d97706" opacity="0.15"/>
  <circle cx="900" cy="850" r="5" fill="#c2410c" opacity="0.18"/>
  <circle cx="1050" cy="845" r="7" fill="#d97706" opacity="0.15"/>
  <circle cx="1180" cy="835" r="5" fill="#c2410c" opacity="0.18"/>
  <circle cx="1260" cy="825" r="6" fill="#d97706" opacity="0.20"/>
</svg>
