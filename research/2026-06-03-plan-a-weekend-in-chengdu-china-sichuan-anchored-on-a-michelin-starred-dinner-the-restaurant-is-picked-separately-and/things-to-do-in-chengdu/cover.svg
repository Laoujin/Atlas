<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.6" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lant" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- hero: three hanging lanterns, centered ~ (800,450) -->
  <g opacity="0.95">
    <!-- cords -->
    <rect x="797" y="180" width="6" height="120" fill="#fbbf24" opacity="0.5"/>
    <rect x="557" y="180" width="6" height="200" fill="#fbbf24" opacity="0.4"/>
    <rect x="1037" y="180" width="6" height="200" fill="#fbbf24" opacity="0.4"/>

    <!-- left lantern -->
    <ellipse cx="560" cy="470" rx="120" ry="150" fill="url(#lant)" opacity="0.85"/>
    <rect x="540" y="312" width="40" height="22" rx="4" fill="#c2410c"/>
    <rect x="540" y="612" width="40" height="22" rx="4" fill="#c2410c"/>
    <path d="M560 632 v60" stroke="#d97706" stroke-width="5" opacity="0.7"/>

    <!-- right lantern -->
    <ellipse cx="1040" cy="470" rx="120" ry="150" fill="url(#lant)" opacity="0.85"/>
    <rect x="1020" y="312" width="40" height="22" rx="4" fill="#c2410c"/>
    <rect x="1020" y="612" width="40" height="22" rx="4" fill="#c2410c"/>
    <path d="M1040 632 v60" stroke="#d97706" stroke-width="5" opacity="0.7"/>

    <!-- center hero lantern (largest, brightest) -->
    <ellipse cx="800" cy="450" rx="160" ry="200" fill="url(#lant)"/>
    <ellipse cx="800" cy="450" rx="160" ry="200" fill="url(#glow)"/>
    <rect x="772" y="240" width="56" height="28" rx="6" fill="#c2410c"/>
    <rect x="772" y="640" width="56" height="28" rx="6" fill="#c2410c"/>
    <path d="M800 668 v80" stroke="#d97706" stroke-width="7"/>
    <!-- vertical ribs -->
    <path d="M740 270 q-30 180 0 360 M800 250 v400 M860 270 q30 180 0 360" stroke="#9a3309" stroke-width="4" fill="none" opacity="0.6"/>
  </g>

  <!-- decoration: floating embers along edges (cropped variably) -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="300" cy="200" r="6"/>
    <circle cx="200" cy="650" r="5"/>
    <circle cx="1320" cy="240" r="6"/>
    <circle cx="1400" cy="620" r="5"/>
    <circle cx="1250" cy="720" r="4"/>
    <circle cx="380" cy="760" r="4"/>
  </g>
</svg>
