<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="45%" stop-color="#5c2a1a"/>
      <stop offset="80%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="doorglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="lodgefacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#dusk)"/>

  <!-- Distant horizon haze -->
  <ellipse cx="800" cy="620" rx="1100" ry="120" fill="#d97706" opacity="0.18"/>

  <!-- Road receding -->
  <polygon points="0,900 1600,900 1050,620 550,620" fill="url(#road)" opacity="0.85"/>
  <polygon points="780,620 820,620 880,900 720,900" fill="#1a0e0e" opacity="0.5"/>

  <!-- Distant lodging silhouette (left, the place you walk back to) -->
  <g opacity="0.9">
    <rect x="240" y="470" width="260" height="200" fill="url(#lodgefacade)"/>
    <polygon points="240,470 370,410 500,470" fill="#1a0e0e" opacity="0.9"/>
    <!-- warm window dots -->
    <rect x="285" y="520" width="28" height="36" fill="#fbbf24" opacity="0.75"/>
    <rect x="345" y="520" width="28" height="36" fill="#d97706" opacity="0.55"/>
    <rect x="405" y="520" width="28" height="36" fill="#fbbf24" opacity="0.7"/>
    <rect x="315" y="600" width="28" height="36" fill="#d97706" opacity="0.5"/>
    <rect x="375" y="600" width="28" height="36" fill="#fbbf24" opacity="0.65"/>
  </g>

  <!-- Street lamp between buildings -->
  <g opacity="0.9">
    <circle cx="610" cy="430" r="70" fill="url(#lampglow)"/>
    <rect x="607" y="430" width="6" height="220" fill="#1a0e0e"/>
    <circle cx="610" cy="428" r="9" fill="#fbbf24" opacity="0.95"/>
  </g>

  <!-- Hero: restaurant doorway (centered around 800,450) -->
  <g>
    <!-- facade -->
    <rect x="720" y="320" width="540" height="380" fill="url(#facade)" opacity="0.95"/>
    <!-- roof line -->
    <rect x="700" y="310" width="580" height="22" fill="#1a0e0e" opacity="0.85"/>
    <!-- awning -->
    <polygon points="760,420 1220,420 1180,460 800,460" fill="#c2410c" opacity="0.9"/>
    <polygon points="760,420 1220,420 1180,460 800,460" fill="none" stroke="#78350f" stroke-width="2" opacity="0.6"/>
    <!-- doorway glow halo -->
    <ellipse cx="990" cy="600" rx="320" ry="200" fill="url(#doorglow)"/>
    <!-- doorway opening -->
    <rect x="930" y="490" width="120" height="210" rx="6" fill="#fbbf24" opacity="0.9"/>
    <rect x="940" y="500" width="100" height="190" rx="4" fill="#d97706" opacity="0.7"/>
    <!-- door frame -->
    <rect x="925" y="486" width="130" height="8" fill="#1a0e0e" opacity="0.7"/>
    <!-- side windows -->
    <rect x="780" y="500" width="90" height="120" fill="#fbbf24" opacity="0.55"/>
    <rect x="780" y="500" width="90" height="120" fill="none" stroke="#1a0e0e" stroke-width="3" opacity="0.6"/>
    <line x1="825" y1="500" x2="825" y2="620" stroke="#1a0e0e" stroke-width="2" opacity="0.5"/>
    <line x1="780" y1="560" x2="870" y2="560" stroke="#1a0e0e" stroke-width="2" opacity="0.5"/>

    <rect x="1110" y="500" width="90" height="120" fill="#fbbf24" opacity="0.55"/>
    <rect x="1110" y="500" width="90" height="120" fill="none" stroke="#1a0e0e" stroke-width="3" opacity="0.6"/>
    <line x1="1155" y1="500" x2="1155" y2="620" stroke="#1a0e0e" stroke-width="2" opacity="0.5"/>
    <line x1="1110" y1="560" x2="1200" y2="560" stroke="#1a0e0e" stroke-width="2" opacity="0.5"/>

    <!-- small lantern beside door -->
    <circle cx="900" cy="540" r="14" fill="#fbbf24" opacity="0.9"/>
    <circle cx="900" cy="540" r="22" fill="#fbbf24" opacity="0.25"/>
    <circle cx="1080" cy="540" r="14" fill="#fbbf24" opacity="0.9"/>
    <circle cx="1080" cy="540" r="22" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- Foreground cobble suggestion / shadow -->
  <ellipse cx="990" cy="780" rx="380" ry="40" fill="#1a0e0e" opacity="0.55"/>

  <!-- A faint moon up top-right (decoration, may crop) -->
  <circle cx="1380" cy="180" r="55" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1380" cy="180" r="38" fill="#fef3ec" opacity="0.6"/>
</svg>
