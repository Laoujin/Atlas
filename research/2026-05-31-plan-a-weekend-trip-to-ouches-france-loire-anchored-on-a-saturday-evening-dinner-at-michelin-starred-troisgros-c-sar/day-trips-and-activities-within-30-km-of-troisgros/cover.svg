<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed warm sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Low sun behind the ridge -->
  <circle cx="980" cy="430" r="220" fill="url(#sun)"/>

  <!-- Far ridgeline (distant Loire gorges / Madeleine massif) -->
  <path d="M0,520 L120,495 L240,510 L360,470 L480,490 L600,455 L760,475 L900,445 L1050,470 L1200,450 L1360,475 L1480,455 L1600,470 L1600,560 L0,560 Z"
        fill="url(#hillFar)"/>

  <!-- Mid ridge with medieval village silhouette (centered hero around 800,450 area) -->
  <path d="M0,600 L100,580 L220,595 L340,560 L460,575 L560,545
           L600,540 L605,520 L612,520 L612,535 L625,535 L630,520 L640,520 L640,540
           L660,540 L665,510 L678,510 L682,500 L688,500 L692,510 L705,510 L710,540
           L735,540 L740,525 L755,525 L760,540 L780,540 L785,515 L800,515 L805,540
           L830,540 L835,528 L850,528 L855,545
           L980,560 L1120,545 L1260,565 L1400,548 L1600,575 L1600,720 L0,720 Z"
        fill="url(#hillMid)"/>

  <!-- Vineyard stripe rows on the mid hill (suggesting Côte Roannaise terraces) -->
  <g stroke="#fbbf24" stroke-opacity="0.18" stroke-width="2" fill="none">
    <path d="M0,640 Q400,625 800,635 T1600,640"/>
    <path d="M0,665 Q400,652 800,660 T1600,665"/>
    <path d="M0,690 Q400,678 800,685 T1600,690"/>
    <path d="M0,710 Q400,700 800,706 T1600,710"/>
  </g>

  <!-- Thin Loire ribbon catching the sun, threading between mid and near hills -->
  <path d="M0,740 Q280,730 520,745 T1080,742 T1600,750 L1600,762 Q1080,755 520,758 T0,752 Z"
        fill="url(#river)" opacity="0.85"/>

  <!-- Near vineyard slope, foreground -->
  <path d="M0,790 L160,770 L340,795 L520,775 L720,800 L920,778 L1140,802 L1340,782 L1600,800 L1600,900 L0,900 Z"
        fill="url(#hillNear)"/>

  <!-- Foreground vine rows, diagonal furrows -->
  <g stroke="#c2410c" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M0,820 L1600,805"/>
    <path d="M0,845 L1600,832"/>
    <path d="M0,872 L1600,860"/>
  </g>

  <!-- Subtle haze across the valley -->
  <rect x="0" y="555" width="1600" height="55" fill="#fef3ec" opacity="0.18"/>
</svg>
