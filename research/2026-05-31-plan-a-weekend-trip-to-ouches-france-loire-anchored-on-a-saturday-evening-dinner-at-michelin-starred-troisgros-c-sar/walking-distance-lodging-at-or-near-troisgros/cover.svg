<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#e8dcc3"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6c89f"/>
      <stop offset="1" stop-color="#a98855"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- warm radial glow centered on the hero -->
  <ellipse cx="800" cy="500" rx="780" ry="460" fill="url(#glow)"/>

  <!-- distant tree line (decorative, may crop) -->
  <path d="M0,540 Q120,470 240,510 T480,490 T720,500 T960,485 T1200,505 T1440,495 T1600,510 L1600,560 L0,560 Z" fill="#9a3309" opacity="0.18"/>

  <!-- ground -->
  <rect x="0" y="555" width="1600" height="345" fill="url(#ground)" opacity="0.85"/>

  <!-- winding path from foreground toward the house -->
  <path d="M780,895 Q740,820 770,740 Q810,665 820,605 Q828,572 822,555" fill="none" stroke="url(#path)" stroke-width="58" stroke-linecap="round" opacity="0.7"/>
  <path d="M780,895 Q740,820 770,740 Q810,665 820,605 Q828,572 822,555" fill="none" stroke="#fbbf24" stroke-width="22" stroke-linecap="round" opacity="0.35"/>

  <!-- left tree cluster -->
  <ellipse cx="430" cy="500" rx="180" ry="120" fill="#5c2a1a" opacity="0.55"/>
  <ellipse cx="360" cy="470" rx="130" ry="100" fill="#78350f" opacity="0.7"/>
  <rect x="420" y="540" width="14" height="60" fill="#5c2a1a" opacity="0.7"/>
  <rect x="358" y="530" width="12" height="60" fill="#5c2a1a" opacity="0.7"/>

  <!-- right tree cluster -->
  <ellipse cx="1180" cy="495" rx="200" ry="125" fill="#5c2a1a" opacity="0.55"/>
  <ellipse cx="1270" cy="465" rx="140" ry="105" fill="#78350f" opacity="0.7"/>
  <rect x="1175" y="540" width="14" height="65" fill="#5c2a1a" opacity="0.7"/>
  <rect x="1268" y="525" width="12" height="60" fill="#5c2a1a" opacity="0.7"/>

  <!-- HERO: pitched-roof maison -->
  <!-- chimney -->
  <rect x="855" y="330" width="32" height="70" fill="#78350f"/>
  <rect x="850" y="325" width="42" height="14" fill="#5c2a1a"/>
  <!-- main body -->
  <rect x="700" y="445" width="240" height="160" fill="url(#wall)"/>
  <!-- roof -->
  <polygon points="680,450 820,310 960,450" fill="url(#roof)"/>
  <!-- roof shadow line -->
  <polygon points="820,310 960,450 940,455 820,335" fill="#5c2a1a" opacity="0.5"/>
  <!-- door -->
  <rect x="800" y="520" width="44" height="85" fill="#9a3309"/>
  <rect x="800" y="520" width="44" height="85" fill="none" stroke="#5c2a1a" stroke-width="2"/>
  <!-- windows -->
  <rect x="725" y="490" width="50" height="50" fill="#fbbf24" opacity="0.75"/>
  <rect x="725" y="490" width="50" height="50" fill="none" stroke="#5c2a1a" stroke-width="2"/>
  <line x1="750" y1="490" x2="750" y2="540" stroke="#5c2a1a" stroke-width="2"/>
  <line x1="725" y1="515" x2="775" y2="515" stroke="#5c2a1a" stroke-width="2"/>

  <rect x="870" y="490" width="50" height="50" fill="#fbbf24" opacity="0.75"/>
  <rect x="870" y="490" width="50" height="50" fill="none" stroke="#5c2a1a" stroke-width="2"/>
  <line x1="895" y1="490" x2="895" y2="540" stroke="#5c2a1a" stroke-width="2"/>
  <line x1="870" y1="515" x2="920" y2="515" stroke="#5c2a1a" stroke-width="2"/>

  <!-- small foreground foliage along path edges -->
  <ellipse cx="680" cy="690" rx="55" ry="22" fill="#5c2a1a" opacity="0.45"/>
  <ellipse cx="900" cy="720" rx="65" ry="24" fill="#5c2a1a" opacity="0.45"/>
  <ellipse cx="600" cy="800" rx="80" ry="28" fill="#78350f" opacity="0.35"/>
  <ellipse cx="1020" cy="810" rx="90" ry="30" fill="#78350f" opacity="0.35"/>
</svg>
