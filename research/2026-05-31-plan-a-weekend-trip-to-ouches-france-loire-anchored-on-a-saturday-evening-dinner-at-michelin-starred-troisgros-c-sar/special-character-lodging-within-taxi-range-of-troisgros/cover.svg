<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="chateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm sun glow, off-axis so it survives cropping -->
  <circle cx="1150" cy="320" r="280" fill="url(#sun)"/>

  <!-- far rolling hills -->
  <path d="M0,560 Q300,470 580,520 T1100,500 T1600,540 L1600,900 L0,900 Z" fill="url(#hillFar)" opacity="0.7"/>

  <!-- vineyard row hints on far hill -->
  <g stroke="#78350f" stroke-width="2" opacity="0.25">
    <path d="M180,560 Q420,495 700,535" fill="none"/>
    <path d="M200,585 Q440,520 720,560" fill="none"/>
    <path d="M220,610 Q460,545 740,585" fill="none"/>
  </g>

  <!-- near hill, hosts the cluster -->
  <path d="M0,720 Q380,660 780,690 T1600,700 L1600,900 L0,900 Z" fill="url(#hillNear)"/>

  <!-- HERO CLUSTER, centered ~ (800, 530), inside safe zone -->

  <!-- Treehouse on left: trunk, canopy, cabin perched -->
  <g>
    <!-- oak trunk -->
    <rect x="555" y="560" width="22" height="160" fill="#5c2a1a"/>
    <!-- canopy cloud -->
    <circle cx="500" cy="520" r="70" fill="#9a3309" opacity="0.85"/>
    <circle cx="580" cy="495" r="80" fill="#78350f" opacity="0.9"/>
    <circle cx="640" cy="525" r="65" fill="#9a3309" opacity="0.85"/>
    <!-- cabin perched -->
    <rect x="540" y="535" width="80" height="55" fill="#c2410c"/>
    <polygon points="530,535 630,535 580,495" fill="#78350f"/>
    <rect x="568" y="555" width="14" height="20" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- Château silhouette in center: main block, two corner towers with conical roofs -->
  <g>
    <!-- main body -->
    <rect x="730" y="500" width="200" height="220" fill="url(#chateau)"/>
    <!-- main hip roof -->
    <polygon points="720,500 940,500 830,420" fill="#5c2a1a"/>
    <!-- left tower -->
    <rect x="700" y="470" width="60" height="250" fill="#9a3309"/>
    <polygon points="694,470 766,470 730,390" fill="#78350f"/>
    <circle cx="730" cy="382" r="6" fill="#fbbf24" opacity="0.8"/>
    <!-- right tower -->
    <rect x="900" y="470" width="60" height="250" fill="#9a3309"/>
    <polygon points="894,470 966,470 930,390" fill="#78350f"/>
    <circle cx="930" cy="382" r="6" fill="#fbbf24" opacity="0.8"/>
    <!-- windows: small glowing slits -->
    <rect x="755" y="555" width="14" height="28" fill="#fbbf24" opacity="0.75"/>
    <rect x="793" y="555" width="14" height="28" fill="#fbbf24" opacity="0.75"/>
    <rect x="831" y="555" width="14" height="28" fill="#fbbf24" opacity="0.75"/>
    <rect x="869" y="555" width="14" height="28" fill="#fbbf24" opacity="0.75"/>
    <rect x="822" y="630" width="30" height="90" fill="#5c2a1a"/>
  </g>

  <!-- Finnish kota on right: cone tent with smoke wisp -->
  <g>
    <polygon points="1040,720 1200,720 1120,500" fill="#78350f"/>
    <polygon points="1060,720 1180,720 1120,540" fill="#9a3309" opacity="0.7"/>
    <!-- doorway -->
    <polygon points="1108,720 1132,720 1120,660" fill="#1a0e0e" opacity="0.7"/>
    <!-- smoke -->
    <path d="M1120,500 Q1110,460 1130,430 Q1145,400 1125,370" stroke="#faf8f2" stroke-width="5" fill="none" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- foreground vineyard rows, sketched -->
  <g stroke="#5c2a1a" stroke-width="2.5" opacity="0.55">
    <path d="M0,790 Q400,770 800,785 T1600,790" fill="none"/>
    <path d="M0,820 Q400,800 800,815 T1600,820" fill="none"/>
    <path d="M0,855 Q400,835 800,850 T1600,855" fill="none"/>
  </g>
</svg>
