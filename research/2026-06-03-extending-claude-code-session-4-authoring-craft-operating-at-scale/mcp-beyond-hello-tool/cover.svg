<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1515"/>
      <stop offset="100%" stop-color="#0f1a1a"/>
    </linearGradient>
    <!-- Left block gradient (rust) -->
    <linearGradient id="blockLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Right block gradient (teal) -->
    <linearGradient id="blockRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <!-- Spark/connection glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Orbit ring gradient -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset="80%" stop-color="#0e7490" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <!-- Left block face highlight -->
    <linearGradient id="faceHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="url(#orbitGlow)" opacity="0.4"/>

  <!-- Layer 3: Decorative orbit rings (outside hero, atmospheric) -->
  <circle cx="800" cy="450" r="380" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.12"/>
  <circle cx="800" cy="450" r="290" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.10"/>
  <circle cx="800" cy="450" r="200" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.15"/>

  <!-- Layer 2: Hero element — two interlocking connector blocks centered at (800, 450) -->

  <!-- Left connector block (rust) -->
  <!-- Main body -->
  <rect x="270" y="340" width="310" height="220" rx="18" fill="url(#blockLeft)" opacity="0.92"/>
  <!-- Face highlight -->
  <rect x="270" y="340" width="310" height="220" rx="18" fill="url(#faceHighlight)"/>
  <!-- Top face (isometric top) -->
  <polygon points="270,340 580,340 610,310 300,310" fill="#9a3309" opacity="0.85"/>
  <!-- Right face (isometric right side) -->
  <polygon points="580,340 610,310 610,530 580,560" fill="#78350f" opacity="0.80"/>
  <!-- Port protrusion right side -->
  <rect x="568" y="400" width="72" height="100" rx="8" fill="#9a3309" opacity="0.95"/>
  <rect x="568" y="400" width="72" height="100" rx="8" fill="#fbbf24" opacity="0.08"/>
  <!-- Port socket face -->
  <rect x="630" y="415" width="14" height="70" rx="4" fill="#1a0e0e" opacity="0.7"/>
  <!-- LED indicator on left block -->
  <circle cx="340" cy="400" r="10" fill="#fbbf24" opacity="0.85"/>
  <circle cx="340" cy="400" r="16" fill="#fbbf24" opacity="0.18"/>
  <!-- Pin lines inside left block (decorative) -->
  <line x1="310" y1="430" x2="530" y2="430" stroke="#fbbf24" stroke-width="2" opacity="0.18"/>
  <line x1="310" y1="460" x2="530" y2="460" stroke="#fbbf24" stroke-width="2" opacity="0.12"/>
  <line x1="310" y1="490" x2="530" y2="490" stroke="#fbbf24" stroke-width="2" opacity="0.10"/>

  <!-- Right connector block (teal) -->
  <!-- Main body -->
  <rect x="1020" y="340" width="310" height="220" rx="18" fill="url(#blockRight)" opacity="0.92"/>
  <!-- Top face -->
  <polygon points="1020,340 1330,340 1300,310 990,310" fill="#0c6070" opacity="0.85"/>
  <!-- Left face -->
  <polygon points="1020,340 990,310 990,530 1020,560" fill="#164e63" opacity="0.80"/>
  <!-- Port protrusion left side -->
  <rect x="960" y="400" width="72" height="100" rx="8" fill="#0c6070" opacity="0.95"/>
  <!-- Port socket face -->
  <rect x="956" y="415" width="14" height="70" rx="4" fill="#0f1a1a" opacity="0.7"/>
  <!-- LED indicator on right block -->
  <circle cx="1260" cy="400" r="10" fill="#0e7490" opacity="0.85"/>
  <circle cx="1260" cy="400" r="16" fill="#0e7490" opacity="0.22"/>
  <!-- Pin lines inside right block (decorative) -->
  <line x1="1070" y1="430" x2="1290" y2="430" stroke="#0e7490" stroke-width="2" opacity="0.20"/>
  <line x1="1070" y1="460" x2="1290" y2="460" stroke="#0e7490" stroke-width="2" opacity="0.14"/>
  <line x1="1070" y1="490" x2="1290" y2="490" stroke="#0e7490" stroke-width="2" opacity="0.10"/>

  <!-- Spark / connection trail between the two ports (centered at 800, 450) -->
  <!-- Glow blob at center -->
  <ellipse cx="800" cy="450" rx="80" ry="40" fill="url(#sparkGlow)" opacity="0.85"/>
  <!-- Connection wire/trace -->
  <path d="M 644 450 C 700 430, 760 440, 800 450 C 840 460, 900 470, 956 450"
        fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.70"/>
  <!-- Spark dots along trace -->
  <circle cx="700" cy="436" r="4" fill="#fbbf24" opacity="0.60"/>
  <circle cx="800" cy="450" r="6" fill="#fbbf24" opacity="0.90"/>
  <circle cx="900" cy="463" r="4" fill="#fbbf24" opacity="0.60"/>
  <!-- Bright center spark -->
  <circle cx="800" cy="450" r="12" fill="#fbbf24" opacity="0.25"/>
</svg>
