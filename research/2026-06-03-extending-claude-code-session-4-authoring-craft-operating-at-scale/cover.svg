<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1a0e"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="hubglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="tealnode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="ambientglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="connector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient center glow -->
  <ellipse cx="800" cy="450" rx="620" ry="400" fill="url(#ambientglow)"/>

  <!-- Layer 2: Hero element — stacked angled extension layers, centered ~(800,450) -->

  <!-- Bottom slab (SDK base layer) -->
  <polygon points="430,600 1170,600 1220,660 380,660" fill="url(#layer1)" opacity="0.82"/>

  <!-- Middle slab (MCP server layer) -->
  <polygon points="460,510 1140,510 1170,600 430,600" fill="url(#layer2)" opacity="0.88"/>

  <!-- Top slab (Skills / extension layer) -->
  <polygon points="500,420 1100,420 1140,510 460,510" fill="url(#layer3)" opacity="0.92"/>

  <!-- Connector lines between layers (teal protocol lines) -->
  <line x1="800" y1="420" x2="800" y2="660" stroke="url(#connector)" stroke-width="3" opacity="0.6"/>
  <line x1="590" y1="420" x2="590" y2="660" stroke="#0e7490" stroke-width="1.5" opacity="0.35"/>
  <line x1="1010" y1="420" x2="1010" y2="660" stroke="#0e7490" stroke-width="1.5" opacity="0.35"/>

  <!-- Teal node dots on slab edges (port/connector metaphor) -->
  <circle cx="590" cy="465" r="9" fill="url(#tealnode)" opacity="0.85"/>
  <circle cx="800" cy="465" r="9" fill="url(#tealnode)" opacity="0.85"/>
  <circle cx="1010" cy="465" r="9" fill="url(#tealnode)" opacity="0.85"/>

  <circle cx="590" cy="555" r="7" fill="#0e7490" opacity="0.6"/>
  <circle cx="800" cy="555" r="7" fill="#0e7490" opacity="0.6"/>
  <circle cx="1010" cy="555" r="7" fill="#0e7490" opacity="0.6"/>

  <!-- Hub: rust circle centered on stack, representing the Claude Code agent core -->
  <circle cx="800" cy="420" r="58" fill="url(#hubglow)" opacity="0.95"/>
  <circle cx="800" cy="420" r="38" fill="#c2410c" opacity="0.9"/>
  <circle cx="800" cy="420" r="22" fill="#fbbf24" opacity="0.85"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Bottom-left dark vignette arc -->
  <ellipse cx="0" cy="900" rx="340" ry="240" fill="#78350f" opacity="0.12"/>
  <!-- Top-right teal echo -->
  <ellipse cx="1600" cy="0" rx="340" ry="240" fill="#0e7490" opacity="0.08"/>
</svg>
