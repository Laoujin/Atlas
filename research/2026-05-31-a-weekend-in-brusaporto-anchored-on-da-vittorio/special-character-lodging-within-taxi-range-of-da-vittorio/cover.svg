<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hilltown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="foothill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="villa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- soft setting sun behind the town -->
  <circle cx="780" cy="380" r="280" fill="url(#sun)"/>

  <!-- distant fortress wall ridge -->
  <path d="M 0 540 L 180 510 L 260 525 L 380 495 L 500 510 L 620 480 L 760 470 L 900 485 L 1040 470 L 1180 490 L 1320 475 L 1460 495 L 1600 485 L 1600 560 L 0 560 Z"
        fill="#78350f" opacity="0.45"/>

  <!-- hilltop town silhouette (Citta Alta) - hero element, centered ~ (760, 430) -->
  <g fill="url(#hilltown)" opacity="0.95">
    <!-- hill base -->
    <path d="M 380 560 Q 540 470 760 460 Q 980 470 1140 560 Z"/>
    <!-- main town wall block -->
    <rect x="500" y="430" width="540" height="135"/>
    <!-- Campanone (square tower, left) -->
    <rect x="560" y="310" width="58" height="240"/>
    <rect x="552" y="300" width="74" height="14"/>
    <rect x="568" y="282" width="42" height="22"/>
    <!-- second tower -->
    <rect x="660" y="360" width="38" height="190"/>
    <rect x="654" y="354" width="50" height="10"/>
    <!-- Santa Maria Maggiore dome cluster (center) -->
    <rect x="740" y="380" width="120" height="170"/>
    <path d="M 740 380 Q 800 320 860 380 Z"/>
    <circle cx="800" cy="345" r="42"/>
    <rect x="794" y="288" width="12" height="22"/>
    <circle cx="800" cy="286" r="6"/>
    <!-- Cappella Colleoni small dome -->
    <rect x="880" y="410" width="70" height="140"/>
    <path d="M 880 410 Q 915 372 950 410 Z"/>
    <!-- right tower -->
    <rect x="970" y="350" width="44" height="200"/>
    <rect x="964" y="344" width="56" height="10"/>
    <path d="M 970 344 L 992 318 L 1014 344 Z"/>
    <!-- crenellations on wall -->
    <rect x="500" y="420" width="14" height="14"/>
    <rect x="528" y="420" width="14" height="14"/>
    <rect x="1024" y="420" width="14" height="14"/>
    <rect x="1052" y="420" width="14" height="14"/>
  </g>

  <!-- winding taxi road down from town to countryside -->
  <path d="M 760 560 Q 820 620 920 640 Q 1040 660 1100 700 Q 1160 740 1280 760"
        fill="none" stroke="#fef3ec" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 760 560 Q 820 620 920 640 Q 1040 660 1100 700 Q 1160 740 1280 760"
        fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="14 16" opacity="0.9"/>

  <!-- foothill mound under villa -->
  <path d="M 1140 780 Q 1280 720 1420 780 L 1420 820 L 1140 820 Z" fill="url(#foothill)" opacity="0.7"/>

  <!-- countryside villa (agriturismo) in foothills -->
  <g>
    <!-- main body -->
    <rect x="1220" y="720" width="130" height="60" fill="url(#villa)"/>
    <!-- roof -->
    <path d="M 1210 720 L 1285 685 L 1360 720 Z" fill="#9a3309"/>
    <!-- small wing -->
    <rect x="1340" y="740" width="46" height="40" fill="url(#villa)"/>
    <path d="M 1334 740 L 1363 722 L 1392 740 Z" fill="#9a3309"/>
    <!-- door/window cuts -->
    <rect x="1245" y="745" width="14" height="22" fill="#78350f" opacity="0.85"/>
    <rect x="1275" y="745" width="14" height="14" fill="#78350f" opacity="0.7"/>
    <rect x="1305" y="745" width="14" height="14" fill="#78350f" opacity="0.7"/>
    <!-- cypress trees -->
    <ellipse cx="1190" cy="745" rx="10" ry="38" fill="#5c2a1a" opacity="0.8"/>
    <ellipse cx="1410" cy="755" rx="9" ry="32" fill="#5c2a1a" opacity="0.8"/>
  </g>

  <!-- foreground ground sweep -->
  <path d="M 0 820 Q 400 800 800 815 Q 1200 830 1600 810 L 1600 900 L 0 900 Z"
        fill="#5c2a1a" opacity="0.55"/>
</svg>
