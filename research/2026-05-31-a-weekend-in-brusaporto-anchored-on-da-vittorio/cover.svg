<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1408"/>
    </linearGradient>
    <radialGradient id="plateGloss" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="domeShine" cx="0.4" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- setting sun glow behind the hills -->
  <ellipse cx="800" cy="640" rx="720" ry="360" fill="url(#sun)"/>

  <!-- distant Bergamasco foothills -->
  <path d="M 0 660 Q 220 560 420 600 T 820 580 Q 1020 540 1240 590 T 1600 600 L 1600 900 L 0 900 Z"
        fill="url(#hillBack)" opacity="0.85"/>

  <!-- nearer hill ridge (Brusaporto sits on a hill) -->
  <path d="M 0 740 Q 260 660 520 700 Q 760 740 980 690 Q 1240 640 1600 710 L 1600 900 L 0 900 Z"
        fill="url(#hillFront)" opacity="0.95"/>

  <!-- hero: silver dome / cloche centered, lifted off the plate -->
  <!-- plate (oval) -->
  <ellipse cx="800" cy="560" rx="280" ry="42" fill="#1a0e0e" opacity="0.55"/>
  <ellipse cx="800" cy="552" rx="260" ry="34" fill="url(#plateGloss)" opacity="0.9"/>
  <ellipse cx="800" cy="548" rx="200" ry="22" fill="#78350f" opacity="0.5"/>

  <!-- cloche dome -->
  <path d="M 620 548 Q 620 360 800 360 Q 980 360 980 548 Z"
        fill="url(#domeShine)" opacity="0.95"/>
  <!-- dome finial -->
  <circle cx="800" cy="352" r="14" fill="#fbbf24" opacity="0.9"/>
  <circle cx="800" cy="352" r="6" fill="#fef3ec" opacity="0.85"/>

  <!-- subtle rim highlight on the dome -->
  <path d="M 660 520 Q 680 400 800 380" stroke="#fef3ec" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round"/>
</svg>
