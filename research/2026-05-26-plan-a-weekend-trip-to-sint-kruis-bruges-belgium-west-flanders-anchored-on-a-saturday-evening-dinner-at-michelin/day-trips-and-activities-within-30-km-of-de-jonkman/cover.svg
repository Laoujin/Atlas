<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind hero -->
  <circle cx="950" cy="430" r="220" fill="url(#sun)" opacity="0.9"/>
  <circle cx="950" cy="430" r="70" fill="#fbbf24" opacity="0.85"/>

  <!-- Distant polder treeline -->
  <path d="M 0 540 Q 200 520 380 535 T 760 530 T 1180 538 T 1600 528 L 1600 560 L 0 560 Z" fill="#9a3309" opacity="0.35"/>

  <!-- Windmill (Damme Schellemolen) — hero left -->
  <g opacity="0.95">
    <!-- mound -->
    <path d="M 360 560 Q 460 540 560 560 L 540 580 L 380 580 Z" fill="#78350f" opacity="0.7"/>
    <!-- tower (tapered) -->
    <path d="M 440 560 L 420 380 L 500 380 L 480 560 Z" fill="url(#bldg)"/>
    <!-- cap -->
    <path d="M 415 385 Q 460 350 505 385 L 500 395 L 420 395 Z" fill="#5c2a1a"/>
    <!-- hub -->
    <circle cx="460" cy="380" r="10" fill="#c2410c"/>
    <!-- sails (X) -->
    <g stroke="#5c2a1a" stroke-width="6" stroke-linecap="round">
      <line x1="460" y1="380" x2="340" y2="260"/>
      <line x1="460" y1="380" x2="580" y2="500"/>
      <line x1="460" y1="380" x2="340" y2="500"/>
      <line x1="460" y1="380" x2="580" y2="260"/>
    </g>
    <!-- sail slats -->
    <g stroke="#c2410c" stroke-width="2" opacity="0.7">
      <line x1="360" y1="270" x2="380" y2="250"/>
      <line x1="380" y1="290" x2="400" y2="270"/>
      <line x1="560" y1="490" x2="540" y2="510"/>
      <line x1="540" y1="470" x2="520" y2="490"/>
      <line x1="360" y1="490" x2="380" y2="510"/>
      <line x1="380" y1="470" x2="400" y2="490"/>
      <line x1="540" y1="290" x2="560" y2="270"/>
      <line x1="520" y1="270" x2="540" y2="250"/>
    </g>
  </g>

  <!-- Bruges stepped-gable skyline (hero right) -->
  <g fill="url(#bldg)" opacity="0.92">
    <!-- stepped gable house -->
    <path d="M 880 560 L 880 470 L 900 470 L 900 450 L 920 450 L 920 430 L 940 430 L 940 410 L 960 410 L 960 430 L 980 430 L 980 450 L 1000 450 L 1000 470 L 1020 470 L 1020 560 Z"/>
    <!-- neighbour gable -->
    <path d="M 1020 560 L 1020 490 L 1040 490 L 1040 470 L 1060 470 L 1060 450 L 1080 450 L 1080 470 L 1100 470 L 1100 490 L 1120 490 L 1120 560 Z"/>
    <!-- belfry-style tower -->
    <path d="M 1140 560 L 1140 340 L 1160 320 L 1180 320 L 1200 340 L 1200 560 Z"/>
    <path d="M 1150 340 L 1150 300 L 1190 300 L 1190 340 Z"/>
    <path d="M 1155 300 Q 1170 270 1185 300 Z" fill="#c2410c"/>
    <!-- third house -->
    <path d="M 1220 560 L 1220 480 L 1240 480 L 1240 460 L 1260 440 L 1280 460 L 1280 480 L 1300 480 L 1300 560 Z"/>
  </g>

  <!-- Window dots (warm) -->
  <g fill="#fbbf24" opacity="0.75">
    <rect x="935" y="500" width="8" height="14"/>
    <rect x="965" y="500" width="8" height="14"/>
    <rect x="1055" y="510" width="8" height="12"/>
    <rect x="1085" y="510" width="8" height="12"/>
    <rect x="1162" y="420" width="8" height="14"/>
    <rect x="1162" y="470" width="8" height="14"/>
    <rect x="1245" y="510" width="8" height="12"/>
    <rect x="1275" y="510" width="8" height="12"/>
  </g>

  <!-- Canal water -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#water)"/>

  <!-- Water reflections (soft horizontal bands) -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.35">
    <line x1="200" y1="610" x2="500" y2="610"/>
    <line x1="600" y1="640" x2="1100" y2="640"/>
    <line x1="300" y1="680" x2="900" y2="680"/>
    <line x1="800" y1="720" x2="1400" y2="720"/>
    <line x1="100" y1="760" x2="700" y2="760"/>
    <line x1="900" y1="800" x2="1500" y2="800"/>
  </g>

  <!-- Reflection of windmill (soft) -->
  <path d="M 440 560 L 420 700 L 500 700 L 480 560 Z" fill="#5c2a1a" opacity="0.25"/>
  <!-- Reflection of buildings -->
  <path d="M 880 560 L 880 720 L 1300 720 L 1300 560 Z" fill="#5c2a1a" opacity="0.2"/>

  <!-- Foreground reed silhouettes (right edge, decorative) -->
  <g stroke="#5c2a1a" stroke-width="3" opacity="0.7" stroke-linecap="round" fill="none">
    <path d="M 1480 880 Q 1485 820 1490 780"/>
    <path d="M 1510 880 Q 1515 830 1520 800"/>
    <path d="M 1540 880 Q 1545 815 1550 770"/>
    <path d="M 1570 880 Q 1575 825 1580 790"/>
  </g>
</svg>
