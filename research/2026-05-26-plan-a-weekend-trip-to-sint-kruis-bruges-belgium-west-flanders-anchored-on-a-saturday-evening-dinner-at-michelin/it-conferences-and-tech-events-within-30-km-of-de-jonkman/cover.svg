<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#e8dcc4"/>
    </radialGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="92%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="tower2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- 30 km radius rings, centered around hero -->
  <circle cx="800" cy="470" r="380" fill="none" stroke="#c2410c" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="800" cy="470" r="280" fill="none" stroke="#c2410c" stroke-opacity="0.28" stroke-width="1.2"/>
  <circle cx="800" cy="470" r="180" fill="none" stroke="#9a3309" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="800" cy="470" r="380" fill="url(#ring)"/>

  <!-- compass cross hairs, faint -->
  <line x1="800" y1="90" x2="800" y2="850" stroke="#9a3309" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="420" y1="470" x2="1180" y2="470" stroke="#9a3309" stroke-opacity="0.08" stroke-width="1"/>

  <!-- network edges connecting nodes to hero -->
  <g stroke="#c2410c" stroke-opacity="0.45" stroke-width="1.4" fill="none">
    <line x1="800" y1="470" x2="620" y2="360"/>
    <line x1="800" y1="470" x2="950" y2="335"/>
    <line x1="800" y1="470" x2="640" y2="560"/>
    <line x1="800" y1="470" x2="970" y2="600"/>
    <line x1="800" y1="470" x2="540" y2="440"/>
    <line x1="800" y1="470" x2="1050" y2="450"/>
    <line x1="620" y1="360" x2="540" y2="440"/>
    <line x1="950" y1="335" x2="1050" y2="450"/>
    <line x1="640" y1="560" x2="970" y2="600"/>
  </g>

  <!-- network nodes (tech event clusters) -->
  <g fill="#d97706">
    <circle cx="620" cy="360" r="7"/>
    <circle cx="950" cy="335" r="7"/>
    <circle cx="640" cy="560" r="7"/>
    <circle cx="970" cy="600" r="7"/>
    <circle cx="540" cy="440" r="6"/>
    <circle cx="1050" cy="450" r="6"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="620" cy="360" r="3"/>
    <circle cx="950" cy="335" r="3"/>
    <circle cx="640" cy="560" r="3"/>
    <circle cx="970" cy="600" r="3"/>
    <circle cx="540" cy="440" r="2.5"/>
    <circle cx="1050" cy="450" r="2.5"/>
  </g>

  <!-- Bruges belfry-style tower silhouette (hero) -->
  <g>
    <!-- main tower body -->
    <rect x="760" y="280" width="80" height="270" fill="url(#tower)"/>
    <!-- stepped crown -->
    <rect x="750" y="265" width="100" height="20" fill="#9a3309"/>
    <rect x="755" y="248" width="90" height="18" fill="#78350f"/>
    <!-- octagonal upper section -->
    <polygon points="770,248 830,248 840,210 760,210" fill="url(#tower2)"/>
    <rect x="770" y="195" width="60" height="18" fill="#9a3309"/>
    <!-- spire -->
    <polygon points="775,195 825,195 820,160 780,160" fill="#78350f"/>
    <polygon points="785,160 815,160 800,115 800,115" fill="#5c2a1a"/>

    <!-- arched windows (negative space) -->
    <rect x="780" y="320" width="14" height="34" rx="7" fill="#f0eadb" opacity="0.85"/>
    <rect x="806" y="320" width="14" height="34" rx="7" fill="#f0eadb" opacity="0.85"/>
    <rect x="780" y="400" width="14" height="34" rx="7" fill="#f0eadb" opacity="0.85"/>
    <rect x="806" y="400" width="14" height="34" rx="7" fill="#f0eadb" opacity="0.85"/>
    <rect x="780" y="480" width="14" height="34" rx="7" fill="#f0eadb" opacity="0.85"/>
    <rect x="806" y="480" width="14" height="34" rx="7" fill="#f0eadb" opacity="0.85"/>

    <!-- secondary smaller tower (concertgebouw hint) -->
    <rect x="700" y="380" width="44" height="170" fill="#78350f" opacity="0.85"/>
    <polygon points="700,380 744,380 740,355 704,355" fill="#5c2a1a"/>

    <!-- right side building bulk -->
    <rect x="856" y="420" width="60" height="130" fill="#9a3309" opacity="0.75"/>
    <polygon points="856,420 916,420 906,395 866,395" fill="#78350f" opacity="0.85"/>
  </g>

  <!-- baseline (ground) -->
  <rect x="540" y="548" width="520" height="4" fill="#5c2a1a" opacity="0.55"/>

  <!-- circuit trace decoration at corners (cropped variably) -->
  <g stroke="#9a3309" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <path d="M 60 90 L 180 90 L 180 160 L 240 160"/>
    <path d="M 60 200 L 140 200 L 140 260"/>
    <path d="M 1540 90 L 1420 90 L 1420 160 L 1360 160"/>
    <path d="M 1540 200 L 1460 200 L 1460 260"/>
    <path d="M 60 810 L 200 810 L 200 740"/>
    <path d="M 1540 810 L 1400 810 L 1400 740"/>
  </g>
  <g fill="#c2410c" fill-opacity="0.4">
    <circle cx="240" cy="160" r="3"/>
    <circle cx="140" cy="260" r="3"/>
    <circle cx="1360" cy="160" r="3"/>
    <circle cx="1460" cy="260" r="3"/>
    <circle cx="200" cy="740" r="3"/>
    <circle cx="1400" cy="740" r="3"/>
  </g>
</svg>
