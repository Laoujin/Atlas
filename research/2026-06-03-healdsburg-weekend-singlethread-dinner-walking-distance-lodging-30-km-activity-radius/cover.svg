<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table-glow radial -->
    <radialGradient id="tableGlow" cx="50%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plateGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b4"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="rimGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#c4b49a"/>
    </radialGradient>
    <!-- Inner well gradient -->
    <radialGradient id="wellGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </radialGradient>
    <!-- Wine glass fill -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a1958" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Ambient rose halo behind glass -->
    <radialGradient id="roseHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Star accent -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Table warm glow — atmospheric, full bleed bottom -->
  <rect width="1600" height="900" fill="url(#tableGlow)"/>

  <!-- Layer 3 decoration: subtle vine-row lines at top edge (very faint, outside safe zone top) -->
  <line x1="0" y1="60" x2="1600" y2="60" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="0" y1="75" x2="1600" y2="75" stroke="#78350f" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Rose halo behind glass (decoration, right side) -->
  <ellipse cx="1100" cy="430" rx="160" ry="200" fill="url(#roseHalo)"/>

  <!-- Layer 2: Hero — plate centered at (800, 450) -->
  <!-- Plate outer rim -->
  <circle cx="800" cy="455" r="230" fill="url(#rimGrad)" opacity="0.92"/>
  <!-- Plate face -->
  <circle cx="800" cy="455" r="205" fill="url(#plateGrad)" opacity="0.97"/>
  <!-- Plate inner well (fine-dining presentation well) -->
  <circle cx="800" cy="455" r="155" fill="url(#wellGrad)" opacity="0.88"/>
  <!-- Subtle rim shadow line -->
  <circle cx="800" cy="455" r="205" fill="none" stroke="#c4b49a" stroke-width="2.5" stroke-opacity="0.6"/>
  <circle cx="800" cy="455" r="228" fill="none" stroke="#a89070" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Michelin star — small, centered on plate as garnish motif -->
  <g transform="translate(800,432)">
    <!-- 6-point star via two triangles -->
    <polygon points="0,-28 8,-10 28,-10 14,4 20,24 0,13 -20,24 -14,4 -28,-10 -8,-10"
             fill="#d97706" opacity="0.82"/>
    <circle cx="0" cy="0" r="18" fill="url(#starGlow)" opacity="0.6"/>
    <polygon points="0,-20 6,-7 20,-7 10,3 14,17 0,9 -14,17 -10,3 -20,-7 -6,-7"
             fill="#fbbf24" opacity="0.75"/>
  </g>

  <!-- Wine glass silhouette — right of plate, fully inside safe zone -->
  <!-- Bowl of glass -->
  <path d="M1070,260 Q1130,310 1130,400 Q1130,470 1080,500 L1060,505 Q1010,470 1010,400 Q1010,310 1070,260 Z"
        fill="url(#glassGrad)" opacity="0.72"/>
  <!-- Glass stem -->
  <rect x="1061" y="505" width="18" height="110" rx="5" fill="#be185d" opacity="0.5"/>
  <!-- Glass base -->
  <ellipse cx="1070" cy="618" rx="42" ry="9" fill="#9a1958" opacity="0.45"/>
  <!-- Glass highlight -->
  <path d="M1045,290 Q1035,340 1040,390" stroke="#faf8f2" stroke-width="3" fill="none"
        stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Second smaller glass — left, partial, adds depth -->
  <path d="M540,295 Q592,340 592,415 Q592,478 548,505 L532,509 Q488,478 488,415 Q488,340 540,295 Z"
        fill="#c2410c" opacity="0.45"/>
  <rect x="531" y="509" width="16" height="90" rx="4" fill="#9a3309" opacity="0.38"/>
  <ellipse cx="539" cy="601" rx="36" ry="8" fill="#78350f" opacity="0.32"/>

  <!-- Layer 3 decoration: corner vignette -->
  <radialGradient id="vigTopLeft" cx="0%" cy="0%" r="55%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="600" height="450" fill="url(#vigTopLeft)"/>

  <radialGradient id="vigBotRight" cx="100%" cy="100%" r="55%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect x="1000" y="450" width="600" height="450" fill="url(#vigBotRight)"/>
</svg>
