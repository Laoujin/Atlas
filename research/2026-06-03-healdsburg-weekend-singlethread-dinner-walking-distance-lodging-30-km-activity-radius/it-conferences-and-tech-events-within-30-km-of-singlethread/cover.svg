<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient: deep rust to warm amber-cream -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Radial glow behind hero -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Slide face gradient: rust to dark rust -->
    <linearGradient id="slide1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Subtle inner highlight gradient on top slide -->
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Atmospheric glow centered at hero -->
  <ellipse cx="800" cy="450" rx="600" ry="380" fill="url(#glowGrad)"/>

  <!-- Layer 2: Hero — three stacked conference-slide rectangles -->
  <!-- Slide 3 (back, most rotated) -->
  <g transform="rotate(-10, 800, 450)">
    <rect x="450" y="230" width="700" height="440" rx="18" ry="18"
          fill="url(#slide1Grad)" opacity="0.72"/>
    <!-- Faint rule lines suggesting content rows -->
    <rect x="490" y="340" width="420" height="18" rx="4" fill="#fbbf24" opacity="0.12"/>
    <rect x="490" y="378" width="310" height="14" rx="4" fill="#fbbf24" opacity="0.10"/>
    <rect x="490" y="410" width="370" height="14" rx="4" fill="#fbbf24" opacity="0.09"/>
  </g>

  <!-- Slide 2 (middle, mildly rotated) -->
  <g transform="rotate(-4, 800, 450)">
    <rect x="450" y="230" width="700" height="440" rx="18" ry="18"
          fill="url(#slide2Grad)" opacity="0.82"/>
    <rect x="490" y="340" width="400" height="18" rx="4" fill="#fbbf24" opacity="0.13"/>
    <rect x="490" y="378" width="290" height="14" rx="4" fill="#fbbf24" opacity="0.10"/>
    <rect x="490" y="410" width="350" height="14" rx="4" fill="#fbbf24" opacity="0.09"/>
  </g>

  <!-- Slide 1 (top, upright) -->
  <rect x="450" y="230" width="700" height="440" rx="18" ry="18"
        fill="url(#slide3Grad)" opacity="0.95"/>
  <!-- Highlight sheen on top slide -->
  <rect x="450" y="230" width="700" height="220" rx="18" ry="18"
        fill="url(#highlightGrad)"/>
  <!-- Header band on top slide -->
  <rect x="450" y="230" width="700" height="72" rx="18" ry="0"
        fill="#78350f" opacity="0.55"/>
  <rect x="450" y="280" width="700" height="22" rx="0" ry="0"
        fill="#78350f" opacity="0.55"/>
  <!-- Content rule lines on top slide -->
  <rect x="492" y="360" width="390" height="20" rx="5" fill="#fef3ec" opacity="0.18"/>
  <rect x="492" y="396" width="280" height="15" rx="4" fill="#fef3ec" opacity="0.13"/>
  <rect x="492" y="426" width="330" height="15" rx="4" fill="#fef3ec" opacity="0.11"/>
  <rect x="492" y="456" width="240" height="15" rx="4" fill="#fef3ec" opacity="0.10"/>
  <!-- Small accent circle (pin / location dot) upper-right of top slide -->
  <circle cx="1090" cy="270" r="26" fill="#fbbf24" opacity="0.85"/>
  <circle cx="1090" cy="270" r="14" fill="#78350f" opacity="0.90"/>

  <!-- Layer 3: Decorative corners (outside safe zone, atmospheric only) -->
  <!-- Top-left corner accent -->
  <circle cx="60" cy="60" r="90" fill="#c2410c" opacity="0.10"/>
  <!-- Bottom-right corner accent -->
  <circle cx="1540" cy="840" r="110" fill="#d97706" opacity="0.09"/>
  <!-- Top-right faint arc -->
  <circle cx="1580" cy="50" r="70" fill="#9a3309" opacity="0.08"/>
  <!-- Bottom-left faint arc -->
  <circle cx="40" cy="870" r="75" fill="#fbbf24" opacity="0.07"/>
</svg>
