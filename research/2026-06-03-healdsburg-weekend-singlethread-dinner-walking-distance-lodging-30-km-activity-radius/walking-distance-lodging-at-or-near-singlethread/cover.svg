<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Ground glow -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Warm window glow radial -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <!-- Building face gradient -->
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
    <!-- Roof gradient -->
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Ground plane -->
  <rect x="0" y="690" width="1600" height="210" fill="url(#ground)" opacity="0.85"/>

  <!-- Moon halo (decorative, upper-right corner — outside safe zone vertically but adds atmosphere) -->
  <circle cx="1340" cy="130" r="120" fill="url(#moon-glow)"/>
  <!-- Moon disc -->
  <circle cx="1340" cy="130" r="38" fill="#fbbf24" opacity="0.22"/>

  <!-- Vineyard row arcs — low decorative ground layer, left side -->
  <ellipse cx="320" cy="760" rx="160" ry="30" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.30"/>
  <ellipse cx="320" cy="730" rx="130" ry="22" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.20"/>
  <!-- Vineyard row arcs — right side -->
  <ellipse cx="1280" cy="760" rx="160" ry="30" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.30"/>
  <ellipse cx="1280" cy="730" rx="130" ry="22" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.20"/>

  <!-- Layer 2: Hero — lodging building centered at (800, 450) -->

  <!-- Warm ambient glow behind building -->
  <ellipse cx="800" cy="560" rx="420" ry="200" fill="url(#glow)"/>

  <!-- Main building body -->
  <rect x="540" y="310" width="520" height="380" rx="6" fill="url(#facade)" opacity="0.95"/>

  <!-- Roof / pediment -->
  <polygon points="510,315 800,175 1090,315" fill="url(#roof)" opacity="0.92"/>

  <!-- Roof ridge accent line -->
  <line x1="800" y1="185" x2="800" y2="315" stroke="#d97706" stroke-width="3" opacity="0.55"/>

  <!-- Central entrance arch -->
  <rect x="738" y="560" width="124" height="130" rx="4" fill="#1a0e0e" opacity="0.85"/>
  <ellipse cx="800" cy="560" rx="62" ry="28" fill="#1a0e0e" opacity="0.85"/>

  <!-- Door warm glow from inside -->
  <rect x="742" y="564" width="116" height="126" rx="3" fill="#d97706" opacity="0.18"/>

  <!-- Upper windows — row 1 -->
  <rect x="590" y="360" width="76" height="68" rx="4" fill="#fbbf24" opacity="0.28"/>
  <rect x="762" y="360" width="76" height="68" rx="4" fill="#fbbf24" opacity="0.32"/>
  <rect x="934" y="360" width="76" height="68" rx="4" fill="#fbbf24" opacity="0.25"/>

  <!-- Window arch tops -->
  <ellipse cx="628" cy="360" rx="38" ry="14" fill="#fbbf24" opacity="0.28"/>
  <ellipse cx="800" cy="360" rx="38" ry="14" fill="#fbbf24" opacity="0.32"/>
  <ellipse cx="972" cy="360" rx="38" ry="14" fill="#fbbf24" opacity="0.25"/>

  <!-- Lower windows — row 2 -->
  <rect x="590" y="480" width="76" height="58" rx="4" fill="#fbbf24" opacity="0.22"/>
  <rect x="934" y="480" width="76" height="58" rx="4" fill="#fbbf24" opacity="0.20"/>

  <!-- Window divider bars (cross panes) — subtle -->
  <line x1="628" y1="360" x2="628" y2="428" stroke="#78350f" stroke-width="2" opacity="0.50"/>
  <line x1="590" y1="394" x2="666" y2="394" stroke="#78350f" stroke-width="2" opacity="0.50"/>
  <line x1="800" y1="360" x2="800" y2="428" stroke="#78350f" stroke-width="2" opacity="0.50"/>
  <line x1="762" y1="394" x2="838" y2="394" stroke="#78350f" stroke-width="2" opacity="0.50"/>
  <line x1="972" y1="360" x2="972" y2="428" stroke="#78350f" stroke-width="2" opacity="0.50"/>
  <line x1="934" y1="394" x2="1010" y2="394" stroke="#78350f" stroke-width="2" opacity="0.50"/>

  <!-- Entry path / steps -->
  <rect x="768" y="688" width="64" height="12" rx="2" fill="#9a3309" opacity="0.70"/>
  <rect x="756" y="698" width="88" height="10" rx="2" fill="#78350f" opacity="0.60"/>

  <!-- Layer 3: Decorative — distant tree silhouettes (edge decoration) -->
  <!-- Left trees -->
  <rect x="150" y="560" width="18" height="130" rx="4" fill="#3a1a0a" opacity="0.70"/>
  <ellipse cx="159" cy="545" rx="42" ry="55" fill="#3a1a0a" opacity="0.65"/>
  <rect x="250" y="590" width="14" height="100" rx="3" fill="#3a1a0a" opacity="0.60"/>
  <ellipse cx="257" cy="578" rx="34" ry="44" fill="#3a1a0a" opacity="0.55"/>
  <!-- Right trees -->
  <rect x="1432" y="560" width="18" height="130" rx="4" fill="#3a1a0a" opacity="0.70"/>
  <ellipse cx="1441" cy="545" rx="42" ry="55" fill="#3a1a0a" opacity="0.65"/>
  <rect x="1336" y="590" width="14" height="100" rx="3" fill="#3a1a0a" opacity="0.60"/>
  <ellipse cx="1343" cy="578" rx="34" ry="44" fill="#3a1a0a" opacity="0.55"/>
</svg>
