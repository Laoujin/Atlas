<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky background gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm glow behind lodge -->
    <radialGradient id="glow" cx="50%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Moon glow -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Hill gradient - far -->
    <linearGradient id="hill-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Hill gradient - near -->
    <linearGradient id="hill-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3d1a0a" stop-opacity="1"/>
    </linearGradient>
    <!-- Lodge wall gradient -->
    <linearGradient id="lodge-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Roof gradient -->
    <linearGradient id="roof-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Window warm light -->
    <radialGradient id="win-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon — upper portion, inside safe zone -->
  <circle cx="1150" cy="200" r="68" fill="url(#moon-glow)" opacity="0.85"/>
  <circle cx="1150" cy="200" r="46" fill="#fbbf24" opacity="0.7"/>

  <!-- Warm radial glow behind lodge -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2 bg: Far vineyard hill -->
  <ellipse cx="400" cy="780" rx="700" ry="260" fill="url(#hill-far)" opacity="0.75"/>
  <ellipse cx="1280" cy="800" rx="600" ry="220" fill="url(#hill-far)" opacity="0.65"/>

  <!-- Near rolling hill — foreground sweep -->
  <path d="M0 680 Q200 560 500 620 Q700 660 800 640 Q950 610 1150 650 Q1350 680 1600 620 L1600 900 L0 900 Z"
        fill="url(#hill-near)" opacity="0.9"/>

  <!-- ─── Hero: Lodge silhouette centered ~(800, 430) ─── -->

  <!-- Main building body -->
  <rect x="610" y="490" width="380" height="200" fill="url(#lodge-wall)" rx="4" opacity="0.95"/>

  <!-- Central peaked gable roof -->
  <polygon points="590,490 800,310 1010,490" fill="url(#roof-grad)" opacity="0.95"/>

  <!-- Left wing body -->
  <rect x="430" y="540" width="200" height="150" fill="#9a3309" opacity="0.88" rx="3"/>
  <!-- Left wing roof -->
  <polygon points="415,540 530,420 645,540" fill="#78350f" opacity="0.9"/>

  <!-- Right wing body -->
  <rect x="970" y="540" width="200" height="150" fill="#9a3309" opacity="0.88" rx="3"/>
  <!-- Right wing roof -->
  <polygon points="955,540 1070,420 1185,540" fill="#78350f" opacity="0.9"/>

  <!-- Chimney left -->
  <rect x="680" y="340" width="28" height="70" fill="#5c2a1a" opacity="0.9"/>
  <!-- Chimney right -->
  <rect x="880" y="355" width="28" height="60" fill="#5c2a1a" opacity="0.9"/>

  <!-- Central door -->
  <rect x="764" y="580" width="72" height="110" fill="#1a0e0e" rx="36 36 0 0" opacity="0.85"/>
  <!-- Door arch highlight -->
  <path d="M764,630 Q800,570 836,630" fill="none" stroke="#d97706" stroke-width="2" opacity="0.5"/>

  <!-- Windows — main facade -->
  <rect x="640" y="530" width="58" height="48" fill="url(#win-light)" rx="4" opacity="0.9"/>
  <rect x="900" y="530" width="58" height="48" fill="url(#win-light)" rx="4" opacity="0.9"/>

  <!-- Windows — left wing -->
  <rect x="462" y="570" width="48" height="40" fill="url(#win-light)" rx="3" opacity="0.85"/>
  <!-- Windows — right wing -->
  <rect x="1090" y="570" width="48" height="40" fill="url(#win-light)" rx="3" opacity="0.85"/>

  <!-- Gable window (circular) -->
  <circle cx="800" cy="400" r="28" fill="url(#win-light)" opacity="0.8"/>
  <circle cx="800" cy="400" r="20" fill="#fbbf24" opacity="0.55"/>

  <!-- Porch steps -->
  <rect x="730" y="688" width="140" height="12" fill="#c2410c" opacity="0.7" rx="2"/>
  <rect x="718" y="698" width="164" height="10" fill="#9a3309" opacity="0.65" rx="2"/>

  <!-- Vine row hints on near hill — simple vertical strokes -->
  <line x1="200" y1="690" x2="200" y2="720" stroke="#c2410c" stroke-width="3" opacity="0.35"/>
  <line x1="280" y1="680" x2="280" y2="712" stroke="#c2410c" stroke-width="3" opacity="0.35"/>
  <line x1="360" y1="685" x2="360" y2="716" stroke="#c2410c" stroke-width="3" opacity="0.35"/>
  <line x1="1240" y1="680" x2="1240" y2="712" stroke="#c2410c" stroke-width="3" opacity="0.35"/>
  <line x1="1320" y1="688" x2="1320" y2="720" stroke="#c2410c" stroke-width="3" opacity="0.35"/>
  <line x1="1400" y1="678" x2="1400" y2="710" stroke="#c2410c" stroke-width="3" opacity="0.35"/>
</svg>
