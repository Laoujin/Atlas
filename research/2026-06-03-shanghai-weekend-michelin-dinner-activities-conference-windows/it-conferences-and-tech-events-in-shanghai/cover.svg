<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1200"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer violet glow -->
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub circle gradient -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Node fill -->
    <radialGradient id="nodeFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Violet node fill -->
    <radialGradient id="vnodeFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <!-- Edge line gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Outer atmospheric violet glow (full-bleed) -->
  <ellipse cx="800" cy="450" rx="780" ry="480" fill="url(#violetGlow)" opacity="0.9"/>

  <!-- Inner warm hub glow -->
  <ellipse cx="800" cy="450" rx="480" ry="340" fill="url(#hubGlow)" opacity="0.85"/>

  <!-- Layer 2: Hero element — orbit system centered at (800, 450) -->

  <!-- Outer orbit ellipse -->
  <ellipse cx="800" cy="450" rx="390" ry="200" fill="none"
    stroke="#6d28d9" stroke-width="1.5" stroke-opacity="0.45"
    stroke-dasharray="12 8"/>

  <!-- Inner orbit ellipse -->
  <ellipse cx="800" cy="450" rx="230" ry="118" fill="none"
    stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.55"
    stroke-dasharray="8 6"/>

  <!-- Edge lines from hub to outer nodes -->
  <line x1="800" y1="450" x2="1115" y2="375" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="1130" y2="530" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="480" y2="368" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="800" y1="450" x2="465" y2="535" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="800" y2="250" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="800" y1="450" x2="800" y2="652" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Inner orbit nodes (rust) -->
  <circle cx="970" cy="406" r="18" fill="url(#nodeFill)" opacity="0.88"/>
  <circle cx="630" cy="494" r="18" fill="url(#nodeFill)" opacity="0.88"/>

  <!-- Outer orbit nodes (violet) -->
  <circle cx="1115" cy="375" r="22" fill="url(#vnodeFill)" opacity="0.82"/>
  <circle cx="1130" cy="530" r="16" fill="url(#vnodeFill)" opacity="0.75"/>
  <circle cx="480"  cy="368" r="22" fill="url(#vnodeFill)" opacity="0.82"/>
  <circle cx="465"  cy="535" r="16" fill="url(#vnodeFill)" opacity="0.75"/>

  <!-- Top/bottom axis nodes (rust) -->
  <circle cx="800" cy="250" r="20" fill="url(#nodeFill)" opacity="0.80"/>
  <circle cx="800" cy="652" r="20" fill="url(#nodeFill)" opacity="0.80"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="68" fill="url(#hubFill)" opacity="0.95"/>
  <!-- Hub ring -->
  <circle cx="800" cy="450" r="68" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.7"/>
  <!-- Hub inner accent ring -->
  <circle cx="800" cy="450" r="46" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Layer 3: Decorative skyline silhouette at bottom edge (below safe zone y=810) -->
  <!-- Abstract angular buildings — purely atmospheric, clipped variably -->
  <g fill="#78350f" opacity="0.28">
    <!-- Left cluster -->
    <rect x="130"  y="820" width="28" height="80"/>
    <rect x="168"  y="800" width="20" height="100"/>
    <rect x="196"  y="835" width="36" height="65"/>
    <rect x="240"  y="810" width="18" height="90"/>
    <rect x="264"  y="790" width="24" height="110"/>
    <rect x="294"  y="840" width="40" height="60"/>
    <!-- Mid-left -->
    <rect x="380"  y="815" width="22" height="85"/>
    <rect x="408"  y="795" width="30" height="105"/>
    <rect x="444"  y="825" width="18" height="75"/>
    <!-- Centre-left -->
    <rect x="540"  y="830" width="26" height="70"/>
    <rect x="572"  y="800" width="20" height="100"/>
    <!-- Centre-right -->
    <rect x="980"  y="825" width="26" height="75"/>
    <rect x="1012" y="800" width="22" height="100"/>
    <rect x="1040" y="835" width="32" height="65"/>
    <!-- Right cluster -->
    <rect x="1140" y="810" width="20" height="90"/>
    <rect x="1166" y="790" width="28" height="110"/>
    <rect x="1200" y="840" width="16" height="60"/>
    <rect x="1222" y="800" width="24" height="100"/>
    <rect x="1252" y="820" width="36" height="80"/>
    <rect x="1294" y="815" width="18" height="85"/>
    <rect x="1318" y="795" width="26" height="105"/>
    <!-- Far right -->
    <rect x="1420" y="830" width="22" height="70"/>
    <rect x="1448" y="800" width="30" height="100"/>
  </g>

  <!-- Violet accent flare — top-right corner decoration -->
  <ellipse cx="1520" cy="80" rx="180" ry="120" fill="#6d28d9" opacity="0.12"/>
  <!-- Rust accent flare — bottom-left corner -->
  <ellipse cx="80"   cy="840" rx="140" ry="90" fill="#c2410c" opacity="0.10"/>
</svg>
