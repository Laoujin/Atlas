<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm radial glow centered on table -->
    <radialGradient id="glow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="75%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#e2d5c3"/>
    </radialGradient>
    <!-- Plate inner well gradient -->
    <radialGradient id="plateWell" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <!-- Cloche dome gradient -->
    <linearGradient id="cloche" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Star fill -->
    <radialGradient id="starFill" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Warm glow wash -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — fine-dining plate with cloche, centered at (800, 450) -->

  <!-- Table surface: subtle ellipse suggesting a lit dining table -->
  <ellipse cx="800" cy="620" rx="520" ry="90" fill="#78350f" opacity="0.55"/>
  <ellipse cx="800" cy="620" rx="520" ry="90" fill="#d97706" opacity="0.08"/>

  <!-- Plate rim -->
  <ellipse cx="800" cy="490" rx="290" ry="285" fill="url(#plateRim)" opacity="0.95"/>
  <!-- Plate inner well -->
  <ellipse cx="800" cy="495" rx="220" ry="216" fill="url(#plateWell)" opacity="0.92"/>
  <!-- Subtle plate ring detail -->
  <ellipse cx="800" cy="492" rx="250" ry="246" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.35"/>

  <!-- Cloche dome sitting on the plate -->
  <ellipse cx="800" cy="395" rx="195" ry="175" fill="url(#cloche)" opacity="0.93"/>
  <!-- Cloche highlight streak -->
  <ellipse cx="745" cy="340" rx="55" ry="35" fill="#fbbf24" opacity="0.13" transform="rotate(-20 745 340)"/>
  <!-- Cloche base band -->
  <rect x="605" y="448" width="390" height="22" rx="4" fill="#78350f" opacity="0.88"/>
  <!-- Cloche knob -->
  <ellipse cx="800" cy="228" rx="28" ry="16" fill="#c2410c" opacity="0.95"/>
  <ellipse cx="800" cy="220" rx="18" ry="10" fill="#d97706" opacity="0.8"/>

  <!-- Michelin star — above the cloche, inside safe zone -->
  <!-- 5-pointed star centered at (800, 165), radius ~38 outer / ~17 inner -->
  <polygon
    points="800,127 811,158 844,158 818,177 828,208 800,190 772,208 782,177 756,158 789,158"
    fill="url(#starFill)" opacity="0.95"/>
  <!-- Star inner glow -->
  <polygon
    points="800,138 808,157 829,157 813,169 819,189 800,177 781,189 787,169 771,157 792,157"
    fill="#fbbf24" opacity="0.35"/>

  <!-- Layer 3: Decorative edge accents (can be cropped) -->
  <!-- Bottom-left warm arch -->
  <path d="M 0 900 Q 180 680 0 500" fill="none" stroke="#c2410c" stroke-width="60" opacity="0.12"/>
  <!-- Top-right dark arch -->
  <path d="M 1600 0 Q 1420 220 1600 400" fill="none" stroke="#9a3309" stroke-width="50" opacity="0.15"/>
  <!-- Subtle horizontal rule above table -->
  <line x1="460" y1="558" x2="1140" y2="558" stroke="#d97706" stroke-width="1" opacity="0.25"/>
</svg>
