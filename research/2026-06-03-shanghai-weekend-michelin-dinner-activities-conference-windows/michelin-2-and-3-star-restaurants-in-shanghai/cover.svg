<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1210"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Left plate fill -->
    <radialGradient id="plateL" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#3a1a10"/>
      <stop offset="100%" stop-color="#1f0d09"/>
    </radialGradient>
    <!-- Right plate fill -->
    <radialGradient id="plateR" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#2e1209"/>
      <stop offset="100%" stop-color="#1a0a07"/>
    </radialGradient>
    <!-- Plate rim highlight -->
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#78350f" stop-opacity="0"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.25"/>
    </radialGradient>
    <!-- Cloche dome gradient -->
    <linearGradient id="cloche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Star accent glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Rose accent for rose petals / garnish -->
    <radialGradient id="roseAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow centred on hero -->
  <ellipse cx="800" cy="450" rx="700" ry="420" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two fine-dining plates with cloche on the left -->

  <!-- Left plate — larger, with cloche -->
  <!-- Plate shadow -->
  <ellipse cx="660" cy="580" rx="198" ry="22" fill="#0a0404" opacity="0.55"/>
  <!-- Plate base -->
  <ellipse cx="660" cy="562" rx="195" ry="28" fill="url(#plateL)"/>
  <!-- Plate rim glow -->
  <ellipse cx="660" cy="562" rx="195" ry="28" fill="url(#rimGlow)"/>
  <!-- Plate inner well -->
  <ellipse cx="660" cy="556" rx="148" ry="20" fill="#120608" opacity="0.85"/>
  <!-- Cloche dome body -->
  <ellipse cx="660" cy="430" rx="148" ry="130" fill="url(#cloche)" opacity="0.92"/>
  <!-- Cloche base band -->
  <rect x="512" y="545" width="296" height="18" rx="6" fill="#9a3309" opacity="0.88"/>
  <!-- Cloche handle knob -->
  <ellipse cx="660" cy="302" rx="22" ry="14" fill="#d97706" opacity="0.95"/>
  <ellipse cx="660" cy="296" rx="14" ry="8" fill="#fbbf24" opacity="0.7"/>
  <!-- Cloche highlight sheen -->
  <ellipse cx="620" cy="370" rx="38" ry="70" fill="#fbbf24" opacity="0.06" transform="rotate(-15 620 370)"/>

  <!-- Right plate — uncovered, food composition visible -->
  <!-- Plate shadow -->
  <ellipse cx="970" cy="580" rx="185" ry="20" fill="#0a0404" opacity="0.50"/>
  <!-- Plate base -->
  <ellipse cx="970" cy="562" rx="182" ry="26" fill="url(#plateR)"/>
  <!-- Plate rim glow -->
  <ellipse cx="970" cy="562" rx="182" ry="26" fill="url(#rimGlow)"/>
  <!-- Plate inner well -->
  <ellipse cx="970" cy="557" rx="138" ry="18" fill="#0e0507" opacity="0.88"/>
  <!-- Food accent 1 — warm protein form -->
  <ellipse cx="958" cy="548" rx="52" ry="28" fill="#c2410c" opacity="0.82" transform="rotate(-8 958 548)"/>
  <ellipse cx="958" cy="542" rx="40" ry="19" fill="#d97706" opacity="0.55" transform="rotate(-8 958 542)"/>
  <!-- Food accent 2 — rose garnish dot cluster -->
  <circle cx="1002" cy="535" r="16" fill="url(#roseAccent)" opacity="0.80"/>
  <circle cx="1012" cy="548" r="9" fill="#be185d" opacity="0.55"/>
  <!-- Food accent 3 — herb line -->
  <rect x="920" y="554" width="52" height="5" rx="2" fill="#78350f" opacity="0.70" transform="rotate(10 920 554)"/>

  <!-- Michelin star accents — three small stars above hero, evenly spaced -->
  <!-- Star 1 -->
  <circle cx="740" cy="275" r="28" fill="url(#starGlow)" opacity="0.5"/>
  <polygon points="740,254 745,269 761,269 748,279 753,294 740,284 727,294 732,279 719,269 735,269" fill="#fbbf24" opacity="0.92"/>
  <!-- Star 2 -->
  <circle cx="800" cy="265" r="28" fill="url(#starGlow)" opacity="0.5"/>
  <polygon points="800,244 805,259 821,259 808,269 813,284 800,274 787,284 792,269 779,259 795,259" fill="#fbbf24" opacity="0.95"/>
  <!-- Star 3 -->
  <circle cx="860" cy="275" r="28" fill="url(#starGlow)" opacity="0.5"/>
  <polygon points="860,254 865,269 881,269 868,279 873,294 860,284 847,294 852,279 839,269 855,269" fill="#fbbf24" opacity="0.92"/>

  <!-- Layer 3: Edge decoration (outside safe zone — atmospheric only) -->
  <!-- Top-left corner arc sweep -->
  <path d="M 0,0 Q 200,180 0,380" stroke="#9a3309" stroke-width="1.5" fill="none" opacity="0.22"/>
  <!-- Bottom-right corner arc sweep -->
  <path d="M 1600,900 Q 1400,720 1600,520" stroke="#9a3309" stroke-width="1.5" fill="none" opacity="0.22"/>
  <!-- Subtle rose edge veil bottom -->
  <rect x="0" y="800" width="1600" height="100" fill="#be185d" opacity="0.04"/>
</svg>
