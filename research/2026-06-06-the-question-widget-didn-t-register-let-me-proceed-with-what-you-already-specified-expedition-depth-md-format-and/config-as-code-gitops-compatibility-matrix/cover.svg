<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1410"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Rust block gradient -->
    <linearGradient id="rustBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Teal block gradient -->
    <linearGradient id="tealBlock" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>

    <!-- Radial glow behind hero -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal glow on right block -->
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Flow path gradient -->
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed texture: horizontal scan lines (low opacity) -->
  <rect width="1600" height="900" fill="none" stroke="#c2410c" stroke-opacity="0.03" stroke-width="2"
        style="background: repeating-linear-gradient(0deg, transparent, transparent 18px, rgba(194,65,12,0.03) 18px, rgba(194,65,12,0.03) 20px)"/>

  <!-- Full-bleed edge tone overlay top -->
  <rect width="1600" height="120" fill="url(#bg)" opacity="0.5"/>
  <!-- Full-bleed edge tone overlay bottom -->
  <rect y="780" width="1600" height="120" fill="#1a0e0e" opacity="0.4"/>

  <!-- Layer 2: Hero element — centered at (800, 450), safe zone x:125-1475, y:90-810 -->

  <!-- Background glow halos -->
  <ellipse cx="640" cy="450" rx="320" ry="260" fill="url(#heroGlow)"/>
  <ellipse cx="960" cy="450" rx="320" ry="260" fill="url(#tealGlow)"/>

  <!-- Concentric orbit arcs (decoration behind the blocks) -->
  <circle cx="800" cy="450" r="310" fill="none" stroke="#c2410c" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#0e7490" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="800" cy="450" r="170" fill="none" stroke="#d97706" stroke-opacity="0.07" stroke-width="1"/>

  <!-- LEFT BLOCK: Rust — "source of truth / Git" -->
  <!-- Main body -->
  <rect x="390" y="320" width="260" height="260" rx="18" fill="url(#rustBlock)" opacity="0.92"/>
  <!-- Inner panel lines (code-file suggestion) -->
  <rect x="418" y="360" width="140" height="10" rx="4" fill="#fbbf24" opacity="0.35"/>
  <rect x="418" y="385" width="100" height="10" rx="4" fill="#fbbf24" opacity="0.25"/>
  <rect x="418" y="410" width="120" height="10" rx="4" fill="#fbbf24" opacity="0.20"/>
  <rect x="418" y="435" width="80"  height="10" rx="4" fill="#fbbf24" opacity="0.18"/>
  <!-- Connector tab right side of left block -->
  <rect x="648" y="415" width="44" height="70" rx="8" fill="#9a3309" opacity="0.95"/>
  <!-- Highlight edge -->
  <rect x="390" y="320" width="260" height="6" rx="18" fill="#fbbf24" opacity="0.30"/>

  <!-- RIGHT BLOCK: Teal — "cluster / runtime" -->
  <!-- Main body -->
  <rect x="950" y="320" width="260" height="260" rx="18" fill="url(#tealBlock)" opacity="0.92"/>
  <!-- Inner panel lines -->
  <rect x="978" y="360" width="140" height="10" rx="4" fill="#67e8f9" opacity="0.25"/>
  <rect x="978" y="385" width="100" height="10" rx="4" fill="#67e8f9" opacity="0.18"/>
  <rect x="978" y="410" width="120" height="10" rx="4" fill="#67e8f9" opacity="0.15"/>
  <rect x="978" y="435" width="80"  height="10" rx="4" fill="#67e8f9" opacity="0.13"/>
  <!-- Connector socket left side of right block (notch) -->
  <rect x="908" y="415" width="44" height="70" rx="8" fill="#164e63" opacity="0.95"/>
  <!-- Highlight edge -->
  <rect x="950" y="320" width="260" height="6" rx="18" fill="#67e8f9" opacity="0.20"/>

  <!-- FLOW CHANNEL between the two connector tabs -->
  <!-- Main flow path (curved arrow suggesting bidirectional sync) -->
  <path d="M 692 440 C 760 400, 840 400, 908 440" fill="none" stroke="url(#flowGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 692 460 C 760 500, 840 500, 908 460" fill="none" stroke="url(#flowGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Spark dots along top flow arc -->
  <circle cx="720"  cy="424" r="5" fill="#fbbf24" opacity="0.90"/>
  <circle cx="760"  cy="410" r="4" fill="#d97706" opacity="0.80"/>
  <circle cx="800"  cy="404" r="6" fill="#fbbf24" opacity="0.95"/>
  <circle cx="840"  cy="410" r="4" fill="#0e7490" opacity="0.80"/>
  <circle cx="880"  cy="424" r="5" fill="#67e8f9" opacity="0.85"/>

  <!-- Spark dots along bottom flow arc -->
  <circle cx="720"  cy="476" r="4" fill="#c2410c" opacity="0.80"/>
  <circle cx="760"  cy="490" r="3" fill="#d97706" opacity="0.70"/>
  <circle cx="800"  cy="496" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="840"  cy="490" r="3" fill="#0e7490" opacity="0.70"/>
  <circle cx="880"  cy="476" r="4" fill="#67e8f9" opacity="0.75"/>

  <!-- Layer 3: Edge decorations (outside/near safe-zone edges, non-meaningful) -->
  <!-- Top-left corner accent -->
  <rect x="0" y="0" width="110" height="6" fill="#c2410c" opacity="0.35"/>
  <rect x="0" y="0" width="6" height="110" fill="#c2410c" opacity="0.35"/>

  <!-- Bottom-right corner accent -->
  <rect x="1490" y="894" width="110" height="6" fill="#0e7490" opacity="0.30"/>
  <rect x="1594" y="790" width="6" height="110" fill="#0e7490" opacity="0.30"/>

  <!-- Bottom-left subtle arc -->
  <path d="M 0 900 Q 200 750, 0 600" fill="none" stroke="#9a3309" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Top-right subtle arc -->
  <path d="M 1600 0 Q 1400 150, 1600 300" fill="none" stroke="#0e7490" stroke-opacity="0.10" stroke-width="3"/>
</svg>
