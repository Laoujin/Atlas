<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1510"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero panel gradient -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Node radial glow — rust -->
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Node radial glow — slate -->
    <radialGradient id="nodeSlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Panel inner highlight -->
    <linearGradient id="panelHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Center hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="#1a0e0e" opacity="0.30"
        style="mask: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 60%, black 100%)"/>

  <!-- Layer 2: Hero — dashboard panel centered at (800, 450) -->
  <!-- Panel bounding box: x=450, y=245, w=700, h=410 — safely inside safe zone -->
  <rect x="450" y="245" width="700" height="410" rx="22" ry="22"
        fill="url(#panel)" opacity="0.88"/>
  <!-- Panel highlight strip -->
  <rect x="450" y="245" width="700" height="410" rx="22" ry="22"
        fill="url(#panelHighlight)" opacity="1"/>
  <!-- Panel top accent bar -->
  <rect x="450" y="245" width="700" height="10" rx="5" ry="5"
        fill="#fbbf24" opacity="0.65"/>

  <!-- Inner panel "screen" area — slate tone -->
  <rect x="490" y="285" width="620" height="330" rx="10" ry="10"
        fill="#1e293b" opacity="0.72"/>

  <!-- Row of 3 small bar indicators inside screen (decorative, read as UI chrome) -->
  <rect x="520" y="310" width="180" height="14" rx="4" fill="#334155" opacity="0.75"/>
  <rect x="520" y="334" width="120" height="14" rx="4" fill="#334155" opacity="0.55"/>
  <rect x="520" y="358" width="150" height="14" rx="4" fill="#334155" opacity="0.55"/>

  <rect x="730" y="310" width="180" height="14" rx="4" fill="#334155" opacity="0.75"/>
  <rect x="730" y="334" width="120" height="14" rx="4" fill="#334155" opacity="0.55"/>
  <rect x="730" y="358" width="150" height="14" rx="4" fill="#334155" opacity="0.55"/>

  <!-- Status dot row inside screen -->
  <circle cx="530" cy="420" r="9" fill="#c2410c" opacity="0.9"/>
  <circle cx="558" cy="420" r="9" fill="#d97706" opacity="0.9"/>
  <circle cx="586" cy="420" r="9" fill="#fbbf24" opacity="0.9"/>
  <circle cx="614" cy="420" r="9" fill="#334155" opacity="0.7"/>
  <circle cx="642" cy="420" r="9" fill="#334155" opacity="0.7"/>
  <circle cx="670" cy="420" r="9" fill="#334155" opacity="0.7"/>

  <!-- Center hub glow behind panel -->
  <ellipse cx="800" cy="450" rx="340" ry="220" fill="url(#hubGlow)" opacity="0.7"/>

  <!-- Layer 2b: Service nodes arranged around the panel -->
  <!-- Node positions orbit the panel. Connector lines first (behind nodes). -->

  <!-- Pi-hole node — top-left -->
  <line x1="800" y1="370" x2="300" y2="200" stroke="#c2410c" stroke-width="2.5" opacity="0.45"/>
  <!-- Proxmox node — top-right -->
  <line x1="800" y1="370" x2="1300" y2="200" stroke="#334155" stroke-width="2.5" opacity="0.45"/>
  <!-- Uptime Kuma node — left -->
  <line x1="800" y1="450" x2="200" y2="450" stroke="#c2410c" stroke-width="2.5" opacity="0.45"/>
  <!-- Docker node — right -->
  <line x1="800" y1="450" x2="1400" y2="450" stroke="#334155" stroke-width="2.5" opacity="0.45"/>
  <!-- Jellyfin node — bottom-left -->
  <line x1="800" y1="530" x2="300" y2="700" stroke="#c2410c" stroke-width="2.5" opacity="0.45"/>
  <!-- HTTP/ping node — bottom-right -->
  <line x1="800" y1="530" x2="1300" y2="700" stroke="#334155" stroke-width="2.5" opacity="0.45"/>

  <!-- Rust-toned nodes (Pi-hole, Uptime Kuma, Jellyfin) -->
  <circle cx="300" cy="200" r="36" fill="url(#nodeRust)" opacity="0.88"/>
  <circle cx="200" cy="450" r="36" fill="url(#nodeRust)" opacity="0.88"/>
  <circle cx="300" cy="700" r="36" fill="url(#nodeRust)" opacity="0.88"/>

  <!-- Slate-toned nodes (Proxmox, Docker, HTTP/ping) -->
  <circle cx="1300" cy="200" r="36" fill="url(#nodeSlate)" opacity="0.88"/>
  <circle cx="1400" cy="450" r="36" fill="url(#nodeSlate)" opacity="0.88"/>
  <circle cx="1300" cy="700" r="36" fill="url(#nodeSlate)" opacity="0.88"/>

  <!-- Layer 3: Corner decoration (outside hero safe zone, purely atmospheric) -->
  <circle cx="0" cy="0" r="180" fill="#c2410c" opacity="0.07"/>
  <circle cx="1600" cy="900" r="180" fill="#334155" opacity="0.07"/>
</svg>
