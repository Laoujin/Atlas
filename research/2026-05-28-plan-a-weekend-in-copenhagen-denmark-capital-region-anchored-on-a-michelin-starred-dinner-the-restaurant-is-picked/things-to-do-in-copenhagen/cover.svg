<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="houseA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="houseB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="houseC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="houseD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="houseE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- warm sun glow behind rooftops -->
  <circle cx="1050" cy="430" r="280" fill="url(#sun)"/>

  <!-- canal water lower half -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#water)"/>

  <!-- reflections (mirrored, faded) -->
  <g opacity="0.45">
    <polygon points="280,600 280,720 380,720 380,600" fill="url(#houseA)"/>
    <polygon points="380,600 380,740 500,740 500,600" fill="url(#houseB)"/>
    <polygon points="500,600 500,760 640,760 640,600" fill="url(#houseC)"/>
    <polygon points="640,600 640,735 770,735 770,600" fill="url(#houseD)"/>
    <polygon points="770,600 770,755 910,755 910,600" fill="url(#houseE)"/>
    <polygon points="910,600 910,725 1040,725 1040,600" fill="url(#houseA)"/>
    <polygon points="1040,600 1040,745 1180,745 1180,600" fill="url(#houseC)"/>
    <polygon points="1180,600 1180,720 1320,720 1320,600" fill="url(#houseB)"/>
  </g>

  <!-- water ripple bands -->
  <rect x="0" y="660" width="1600" height="3" fill="#fbbf24" opacity="0.25"/>
  <rect x="0" y="705" width="1600" height="2" fill="#fef3ec" opacity="0.2"/>
  <rect x="0" y="755" width="1600" height="2" fill="#fbbf24" opacity="0.18"/>

  <!-- row of gabled canal houses (hero, centered ~800,450) -->
  <!-- house 1 -->
  <rect x="280" y="380" width="100" height="220" fill="url(#houseA)"/>
  <polygon points="280,380 330,330 380,380" fill="#9a3309"/>
  <rect x="300" y="420" width="20" height="30" fill="#fef3ec" opacity="0.75"/>
  <rect x="340" y="420" width="20" height="30" fill="#fef3ec" opacity="0.75"/>
  <rect x="300" y="480" width="20" height="30" fill="#fef3ec" opacity="0.75"/>
  <rect x="340" y="480" width="20" height="30" fill="#fef3ec" opacity="0.75"/>

  <!-- house 2 (taller) -->
  <rect x="380" y="320" width="120" height="280" fill="url(#houseB)"/>
  <polygon points="380,320 440,260 500,320" fill="#b45309"/>
  <rect x="402" y="360" width="22" height="34" fill="#fef3ec" opacity="0.78"/>
  <rect x="456" y="360" width="22" height="34" fill="#fef3ec" opacity="0.78"/>
  <rect x="402" y="430" width="22" height="34" fill="#fef3ec" opacity="0.78"/>
  <rect x="456" y="430" width="22" height="34" fill="#fef3ec" opacity="0.78"/>
  <rect x="402" y="500" width="22" height="34" fill="#fef3ec" opacity="0.78"/>
  <rect x="456" y="500" width="22" height="34" fill="#fef3ec" opacity="0.78"/>

  <!-- house 3 (tallest, hero center) -->
  <rect x="500" y="240" width="140" height="360" fill="url(#houseC)"/>
  <polygon points="500,240 570,170 640,240" fill="#d97706"/>
  <rect x="525" y="285" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="591" y="285" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="525" y="360" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="591" y="360" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="525" y="435" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="591" y="435" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="525" y="510" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="591" y="510" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>

  <!-- house 4 (dark brown, stepped gable) -->
  <rect x="640" y="300" width="130" height="300" fill="url(#houseD)"/>
  <polygon points="640,300 640,270 670,270 670,250 700,250 700,230 740,230 740,250 770,250 770,270 770,300" fill="#5c2a1a"/>
  <rect x="664" y="345" width="22" height="32" fill="#fbbf24" opacity="0.8"/>
  <rect x="724" y="345" width="22" height="32" fill="#fbbf24" opacity="0.8"/>
  <rect x="664" y="415" width="22" height="32" fill="#fbbf24" opacity="0.8"/>
  <rect x="724" y="415" width="22" height="32" fill="#fbbf24" opacity="0.8"/>
  <rect x="664" y="485" width="22" height="32" fill="#fbbf24" opacity="0.8"/>
  <rect x="724" y="485" width="22" height="32" fill="#fbbf24" opacity="0.8"/>

  <!-- house 5 (rust) -->
  <rect x="770" y="270" width="140" height="330" fill="url(#houseE)"/>
  <polygon points="770,270 840,210 910,270" fill="#78350f"/>
  <rect x="794" y="315" width="24" height="36" fill="#fef3ec" opacity="0.78"/>
  <rect x="862" y="315" width="24" height="36" fill="#fef3ec" opacity="0.78"/>
  <rect x="794" y="390" width="24" height="36" fill="#fef3ec" opacity="0.78"/>
  <rect x="862" y="390" width="24" height="36" fill="#fef3ec" opacity="0.78"/>
  <rect x="794" y="465" width="24" height="36" fill="#fef3ec" opacity="0.78"/>
  <rect x="862" y="465" width="24" height="36" fill="#fef3ec" opacity="0.78"/>

  <!-- house 6 (amber) -->
  <rect x="910" y="340" width="130" height="260" fill="url(#houseA)"/>
  <polygon points="910,340 975,285 1040,340" fill="#9a3309"/>
  <rect x="934" y="380" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="994" y="380" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="934" y="450" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="994" y="450" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="934" y="520" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="994" y="520" width="22" height="32" fill="#fef3ec" opacity="0.78"/>

  <!-- house 7 (yellow) -->
  <rect x="1040" y="290" width="140" height="310" fill="url(#houseC)"/>
  <polygon points="1040,290 1110,225 1180,290" fill="#d97706"/>
  <rect x="1064" y="335" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="1132" y="335" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="1064" y="410" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="1132" y="410" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="1064" y="485" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>
  <rect x="1132" y="485" width="24" height="36" fill="#5c2a1a" opacity="0.8"/>

  <!-- house 8 (orange) -->
  <rect x="1180" y="360" width="140" height="240" fill="url(#houseB)"/>
  <polygon points="1180,360 1250,305 1320,360" fill="#b45309"/>
  <rect x="1204" y="400" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="1274" y="400" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="1204" y="470" width="22" height="32" fill="#fef3ec" opacity="0.78"/>
  <rect x="1274" y="470" width="22" height="32" fill="#fef3ec" opacity="0.78"/>

  <!-- quay strip between houses and water -->
  <rect x="0" y="600" width="1600" height="14" fill="#1a0e0e" opacity="0.55"/>

  <!-- single sailboat mast accent in foreground -->
  <line x1="855" y1="612" x2="855" y2="500" stroke="#1a0e0e" stroke-width="3" opacity="0.85"/>
  <polygon points="855,500 855,575 905,575" fill="#fef3ec" opacity="0.7"/>
  <polygon points="855,500 855,575 815,575" fill="#fbbf24" opacity="0.6"/>
</svg>
