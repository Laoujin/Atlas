<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#fde4cf"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="houseA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="houseB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="houseC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde4cf"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="houseD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.32" r="0.22">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Soft sun glow -->
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Distant hills -->
  <path d="M0,500 L220,470 L420,490 L640,460 L900,485 L1180,465 L1400,485 L1600,475 L1600,520 L0,520 Z" fill="#9a3309" opacity="0.25"/>

  <!-- Waterline -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#water)"/>

  <!-- Townhouse row (hero, centred ~800,450, inside safe zone) -->
  <g>
    <!-- House A -->
    <rect x="330" y="420" width="150" height="180" fill="url(#houseA)" opacity="0.92"/>
    <polygon points="330,420 405,360 480,420" fill="#78350f" opacity="0.9"/>
    <rect x="360" y="460" width="22" height="32" fill="#5c2a1a" opacity="0.55"/>
    <rect x="408" y="460" width="22" height="32" fill="#5c2a1a" opacity="0.55"/>
    <rect x="360" y="510" width="22" height="32" fill="#5c2a1a" opacity="0.55"/>
    <rect x="408" y="510" width="22" height="32" fill="#5c2a1a" opacity="0.55"/>

    <!-- House B -->
    <rect x="480" y="380" width="160" height="220" fill="url(#houseB)" opacity="0.94"/>
    <polygon points="480,380 560,310 640,380" fill="#9a3309" opacity="0.9"/>
    <rect x="510" y="420" width="24" height="34" fill="#5c2a1a" opacity="0.5"/>
    <rect x="560" y="420" width="24" height="34" fill="#5c2a1a" opacity="0.5"/>
    <rect x="510" y="475" width="24" height="34" fill="#5c2a1a" opacity="0.5"/>
    <rect x="560" y="475" width="24" height="34" fill="#5c2a1a" opacity="0.5"/>
    <rect x="510" y="530" width="24" height="34" fill="#5c2a1a" opacity="0.5"/>
    <rect x="560" y="530" width="24" height="34" fill="#5c2a1a" opacity="0.5"/>

    <!-- Church spire (tallest, anchor) -->
    <rect x="700" y="280" width="80" height="320" fill="url(#houseD)" opacity="0.95"/>
    <polygon points="700,280 740,200 780,280" fill="#5c2a1a"/>
    <polygon points="725,200 740,150 755,200" fill="#78350f"/>
    <rect x="737" y="120" width="6" height="35" fill="#5c2a1a"/>
    <circle cx="740" cy="118" r="6" fill="#fbbf24"/>
    <rect x="720" y="330" width="18" height="22" fill="#fbbf24" opacity="0.7"/>
    <rect x="742" y="330" width="18" height="22" fill="#fbbf24" opacity="0.7"/>

    <!-- House C -->
    <rect x="780" y="400" width="140" height="200" fill="url(#houseC)" opacity="0.95"/>
    <polygon points="780,400 850,340 920,400" fill="#c2410c" opacity="0.9"/>
    <rect x="805" y="440" width="22" height="32" fill="#9a3309" opacity="0.55"/>
    <rect x="850" y="440" width="22" height="32" fill="#9a3309" opacity="0.55"/>
    <rect x="895" y="440" width="22" height="32" fill="#9a3309" opacity="0.55"/>
    <rect x="805" y="492" width="22" height="32" fill="#9a3309" opacity="0.55"/>
    <rect x="850" y="492" width="22" height="32" fill="#9a3309" opacity="0.55"/>
    <rect x="895" y="492" width="22" height="32" fill="#9a3309" opacity="0.55"/>

    <!-- House D -->
    <rect x="920" y="430" width="140" height="170" fill="url(#houseA)" opacity="0.88"/>
    <polygon points="920,430 990,375 1060,430" fill="#5c2a1a" opacity="0.9"/>
    <rect x="945" y="465" width="22" height="30" fill="#5c2a1a" opacity="0.5"/>
    <rect x="990" y="465" width="22" height="30" fill="#5c2a1a" opacity="0.5"/>
    <rect x="1035" y="465" width="22" height="30" fill="#5c2a1a" opacity="0.5"/>

    <!-- Second church spire (smaller) -->
    <rect x="1080" y="370" width="60" height="230" fill="url(#houseB)" opacity="0.92"/>
    <polygon points="1080,370 1110,310 1140,370" fill="#78350f"/>
    <polygon points="1100,310 1110,275 1120,310" fill="#5c2a1a"/>
    <rect x="1108" y="255" width="4" height="22" fill="#5c2a1a"/>

    <!-- House E -->
    <rect x="1140" y="450" width="130" height="150" fill="url(#houseC)" opacity="0.9"/>
    <polygon points="1140,450 1205,400 1270,450" fill="#9a3309" opacity="0.85"/>
    <rect x="1165" y="485" width="20" height="28" fill="#78350f" opacity="0.5"/>
    <rect x="1205" y="485" width="20" height="28" fill="#78350f" opacity="0.5"/>
    <rect x="1245" y="485" width="20" height="28" fill="#78350f" opacity="0.5"/>
  </g>

  <!-- Reflection (mirrored, faded) -->
  <g opacity="0.35">
    <rect x="330" y="600" width="150" height="160" fill="#c2410c"/>
    <rect x="480" y="600" width="160" height="190" fill="#d97706"/>
    <rect x="700" y="600" width="80" height="260" fill="#78350f"/>
    <rect x="780" y="600" width="140" height="180" fill="#fde4cf"/>
    <rect x="920" y="600" width="140" height="155" fill="#c2410c"/>
    <rect x="1080" y="600" width="60" height="200" fill="#d97706"/>
    <rect x="1140" y="600" width="130" height="140" fill="#fbbf24"/>
  </g>

  <!-- Water ripples -->
  <g stroke="#fef3ec" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M180,680 Q300,675 420,680 T660,680"/>
    <path d="M820,720 Q940,715 1060,720 T1300,720"/>
    <path d="M260,780 Q400,775 540,780 T820,780"/>
    <path d="M900,820 Q1050,815 1200,820 T1480,820"/>
  </g>

  <!-- Two seabird silhouettes (corner decoration) -->
  <g fill="#5c2a1a" opacity="0.7">
    <path d="M1280,200 q15,-10 30,0 q15,-10 30,0 q-15,5 -30,3 q-15,2 -30,-3 z"/>
    <path d="M1380,260 q10,-7 20,0 q10,-7 20,0 q-10,3 -20,2 q-10,1 -20,-2 z"/>
  </g>
</svg>
