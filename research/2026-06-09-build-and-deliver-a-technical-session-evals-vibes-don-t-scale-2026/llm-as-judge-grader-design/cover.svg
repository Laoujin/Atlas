<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- central column / pivot -->
  <rect x="788" y="300" width="24" height="320" rx="8" fill="url(#rust)"/>
  <circle cx="800" cy="300" r="34" fill="url(#rust)"/>
  <circle cx="800" cy="300" r="14" fill="#6d28d9" opacity="0.85"/>
  <!-- base -->
  <path d="M680 640 H920 L900 660 H700 Z" fill="url(#rust)" opacity="0.9"/>

  <!-- balance beam -->
  <rect x="540" y="296" width="520" height="16" rx="8" fill="url(#rust)" transform="rotate(-7 800 304)"/>

  <!-- left arm + pan (heavier, lower) -->
  <line x1="568" y1="332" x2="540" y2="430" stroke="#9a3309" stroke-width="6" opacity="0.85"/>
  <line x1="568" y1="332" x2="612" y2="430" stroke="#9a3309" stroke-width="6" opacity="0.85"/>
  <path d="M510 430 H642 A66 66 0 0 1 510 430 Z" fill="url(#pan)" opacity="0.92"/>
  <ellipse cx="576" cy="430" rx="66" ry="12" fill="#d97706" opacity="0.9"/>

  <!-- right arm + pan (lighter, higher) -->
  <line x1="1032" y1="282" x2="1004" y2="360" stroke="#9a3309" stroke-width="6" opacity="0.85"/>
  <line x1="1032" y1="282" x2="1076" y2="360" stroke="#9a3309" stroke-width="6" opacity="0.85"/>
  <path d="M974 360 H1106 A66 66 0 0 1 974 360 Z" fill="url(#pan)" opacity="0.92"/>
  <ellipse cx="1040" cy="360" rx="66" ry="12" fill="#d97706" opacity="0.9"/>

  <!-- score marker on the heavier pan: violet node -->
  <circle cx="576" cy="406" r="20" fill="#6d28d9" opacity="0.88"/>
  <circle cx="1040" cy="336" r="14" fill="#6d28d9" opacity="0.55"/>
</svg>
