<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- gauge arc: the scoring meter -->
  <path d="M 560 600 A 240 240 0 0 1 1040 600" fill="none" stroke="#3a1c14" stroke-width="34" stroke-linecap="round"/>
  <path d="M 560 600 A 240 240 0 0 1 940 412" fill="none" stroke="url(#arc)" stroke-width="34" stroke-linecap="round" opacity="0.92"/>

  <!-- gauge needle pointing into pass zone -->
  <line x1="800" y1="600" x2="912" y2="438" stroke="#fef3ec" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- input nodes feeding the judge hub (graph eval) -->
  <line x1="430" y1="320" x2="800" y2="600" stroke="#6d28d9" stroke-width="4" opacity="0.7"/>
  <line x1="470" y1="500" x2="800" y2="600" stroke="#9a3309" stroke-width="4" opacity="0.7"/>
  <line x1="1150" y1="300" x2="800" y2="600" stroke="#6d28d9" stroke-width="4" opacity="0.7"/>
  <line x1="1170" y1="490" x2="800" y2="600" stroke="#9a3309" stroke-width="4" opacity="0.7"/>

  <circle cx="430" cy="320" r="26" fill="#6d28d9" opacity="0.85"/>
  <circle cx="470" cy="500" r="20" fill="#78350f" opacity="0.85"/>
  <circle cx="1150" cy="300" r="26" fill="#6d28d9" opacity="0.85"/>
  <circle cx="1170" cy="490" r="20" fill="#78350f" opacity="0.85"/>

  <!-- judge hub at gauge pivot -->
  <circle cx="800" cy="600" r="60" fill="url(#hub)"/>
  <circle cx="800" cy="600" r="60" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
  <circle cx="800" cy="600" r="22" fill="#1a0e0e" opacity="0.85"/>
</svg>
