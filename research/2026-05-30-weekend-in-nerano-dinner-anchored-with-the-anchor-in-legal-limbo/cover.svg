<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.72" stop-color="#c2410c"/>
      <stop offset="0.88" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5c2a1a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="headland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3a1810"/>
    </linearGradient>
    <linearGradient id="farIsland" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow on horizon, low and warm -->
  <ellipse cx="980" cy="560" rx="520" ry="180" fill="url(#sunglow)"/>
  <circle cx="980" cy="555" r="42" fill="#fbbf24" opacity="0.9"/>

  <!-- Far island silhouette (Capri across the channel) -->
  <path d="M 180 580 L 320 548 L 460 558 L 560 552 L 640 562 L 700 580 Z" fill="url(#farIsland)" opacity="0.78"/>

  <!-- Sea -->
  <rect x="0" y="580" width="1600" height="320" fill="url(#sea)"/>

  <!-- Sun reflection shimmer on sea -->
  <ellipse cx="980" cy="600" rx="180" ry="8" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="980" cy="625" rx="140" ry="5" fill="#d97706" opacity="0.45"/>
  <ellipse cx="980" cy="650" rx="100" ry="4" fill="#c2410c" opacity="0.35"/>
  <ellipse cx="980" cy="675" rx="70" ry="3" fill="#9a3309" opacity="0.3"/>

  <!-- Hero: headland with Saracen watchtower, centered in safe zone -->
  <path d="M 820 900 L 820 620 L 880 600 L 960 585 L 1050 575 L 1130 580 L 1200 595 L 1260 615 L 1310 640 L 1340 670 L 1360 720 L 1370 900 Z" fill="url(#headland)"/>

  <!-- Watchtower silhouette on the headland crest -->
  <rect x="1040" y="498" width="58" height="82" fill="#1a0e0e"/>
  <rect x="1032" y="490" width="74" height="14" fill="#1a0e0e"/>
  <rect x="1038" y="478" width="8" height="14" fill="#1a0e0e"/>
  <rect x="1056" y="478" width="8" height="14" fill="#1a0e0e"/>
  <rect x="1074" y="478" width="8" height="14" fill="#1a0e0e"/>
  <rect x="1092" y="478" width="8" height="14" fill="#1a0e0e"/>

  <!-- Single warm window light in the tower (the dinner anchor, gently) -->
  <rect x="1060" y="538" width="10" height="14" fill="#fbbf24" opacity="0.9"/>

  <!-- Near foreground cove rocks, left -->
  <path d="M 0 900 L 0 700 L 80 680 L 180 690 L 280 710 L 360 730 L 420 760 L 460 800 L 480 900 Z" fill="#1a0e0e" opacity="0.95"/>

  <!-- Moon, high left, faint -->
  <circle cx="280" cy="220" r="28" fill="#fef3ec" opacity="0.55"/>
  <circle cx="290" cy="215" r="24" fill="#5c2a1a" opacity="0.45"/>
</svg>
