<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="cliff2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow centered in hero zone, behind headland -->
  <circle cx="900" cy="470" r="360" fill="url(#sun)" opacity="0.95"/>
  <circle cx="900" cy="470" r="95" fill="#fef3ec" opacity="0.9"/>

  <!-- distant headland (far side of cove) -->
  <path d="M 0 560 L 180 510 L 360 530 L 540 495 L 720 520 L 820 540 L 820 620 L 0 620 Z"
        fill="#78350f" opacity="0.55"/>

  <!-- main hilltop village headland — the hero, inside safe zone -->
  <path d="M 820 600 L 880 540 L 940 500 L 1010 470 L 1100 455 L 1190 470 L 1280 495 L 1360 530 L 1420 565 L 1475 600 L 1475 720 L 820 720 Z"
        fill="url(#cliff)" opacity="0.95"/>

  <!-- closer foreground cliff edge on left -->
  <path d="M 125 720 L 125 600 L 220 575 L 310 590 L 410 615 L 510 640 L 600 660 L 700 685 L 820 720 Z"
        fill="url(#cliff2)" opacity="0.9"/>

  <!-- village blocks clustered on the hero headland (stacked rooftops, abstract) -->
  <g opacity="0.92">
    <rect x="1030" y="480" width="34" height="40" fill="#faf8f2"/>
    <polygon points="1030,480 1064,480 1047,468" fill="#c2410c"/>
    <rect x="1070" y="490" width="28" height="32" fill="#f0eadb"/>
    <polygon points="1070,490 1098,490 1084,480" fill="#9a3309"/>
    <rect x="1105" y="478" width="32" height="44" fill="#fef3ec"/>
    <polygon points="1105,478 1137,478 1121,466" fill="#c2410c"/>
    <rect x="1145" y="492" width="26" height="32" fill="#faf8f2"/>
    <polygon points="1145,492 1171,492 1158,482" fill="#9a3309"/>
    <rect x="1178" y="500" width="30" height="30" fill="#f0eadb"/>
    <polygon points="1178,500 1208,500 1193,490" fill="#c2410c"/>
    <rect x="1215" y="510" width="24" height="26" fill="#fef3ec"/>
    <polygon points="1215,510 1239,510 1227,501" fill="#78350f"/>
  </g>

  <!-- sea below, full-width so detail crop still reads water -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#sea)"/>

  <!-- sun reflection shimmer on water -->
  <ellipse cx="900" cy="740" rx="220" ry="8" fill="#fbbf24" opacity="0.75"/>
  <ellipse cx="900" cy="760" rx="160" ry="5" fill="#fbbf24" opacity="0.5"/>
  <ellipse cx="900" cy="780" rx="110" ry="4" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="900" cy="800" rx="70" ry="3" fill="#fbbf24" opacity="0.22"/>

  <!-- a single small boat silhouette in the cove (decoration, in hero zone) -->
  <path d="M 720 735 Q 740 745 760 735 L 755 740 Q 740 748 725 740 Z" fill="#1a0e0e" opacity="0.85"/>
  <line x1="740" y1="735" x2="740" y2="722" stroke="#1a0e0e" stroke-width="1.2" opacity="0.85"/>
</svg>
