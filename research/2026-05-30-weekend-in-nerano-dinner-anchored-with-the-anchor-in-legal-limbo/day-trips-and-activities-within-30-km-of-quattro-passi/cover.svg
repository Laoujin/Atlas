<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.78" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun disc, sits in hero safe zone -->
  <circle cx="980" cy="430" r="170" fill="url(#sun)" opacity="0.95"/>
  <circle cx="980" cy="430" r="95" fill="#fef3ec" opacity="0.9"/>

  <!-- distant Capri island, offshore right -->
  <path d="M1180 520 L1230 470 L1290 478 L1340 460 L1390 478 L1430 495 L1460 520 Z" fill="#78350f" opacity="0.75"/>

  <!-- sea -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#sea)"/>

  <!-- sun reflection on water -->
  <ellipse cx="980" cy="585" rx="120" ry="10" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="980" cy="615" rx="80" ry="5" fill="#fbbf24" opacity="0.5"/>
  <ellipse cx="980" cy="640" rx="50" ry="3" fill="#fbbf24" opacity="0.35"/>

  <!-- foreground coastal cliff, Sorrento Peninsula silhouette, left side -->
  <path d="M0 900 L0 470 L80 440 L150 460 L230 410 L310 430 L390 380 L470 420 L540 470 L600 520 L640 560 L0 560 Z" fill="url(#cliff)"/>

  <!-- cliff shadow accent -->
  <path d="M0 560 L640 560 L600 520 L540 470 L470 420 L390 380 L470 420 L540 510 L0 600 Z" fill="#1a0e0e" opacity="0.35"/>

  <!-- small gozzo boat, hero detail near sun reflection -->
  <path d="M820 615 Q860 640 905 615 L895 628 Q860 648 830 628 Z" fill="#1a0e0e" opacity="0.9"/>
  <line x1="862" y1="615" x2="862" y2="585" stroke="#1a0e0e" stroke-width="2" opacity="0.85"/>
  <path d="M862 588 L885 612 L862 612 Z" fill="#c2410c" opacity="0.85"/>
</svg>
