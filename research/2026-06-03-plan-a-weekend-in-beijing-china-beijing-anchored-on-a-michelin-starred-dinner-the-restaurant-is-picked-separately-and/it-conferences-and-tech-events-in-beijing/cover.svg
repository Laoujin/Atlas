<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal city -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2d1a10"/>
      <stop offset="100%" stop-color="#0f0820"/>
    </linearGradient>
    <!-- Hub radial glow: rust -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Hub core -->
    <radialGradient id="hubCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <!-- Orbit ring gradient -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="70%" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Node glow: violet -->
    <radialGradient id="nodeViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <!-- Node glow: rust -->
    <radialGradient id="nodeRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <!-- Edge line gradient -->
    <linearGradient id="edgeA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="edgeB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed edge texture: faint radial wash from center -->
  <ellipse cx="800" cy="450" rx="900" ry="520" fill="url(#orbitGlow)" opacity="0.5"/>

  <!-- Layer 2: Hero — orbital network, centered at (800, 450) -->

  <!-- Outer orbit ring (~r=310) -->
  <circle cx="800" cy="450" r="310" fill="none" stroke="#6d28d9" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Middle orbit ring (~r=200) -->
  <circle cx="800" cy="450" r="200" fill="none" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Inner orbit ring (~r=105) -->
  <circle cx="800" cy="450" r="105" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.5"/>

  <!-- Hub glow halo -->
  <circle cx="800" cy="450" r="90" fill="url(#hubGlow)" opacity="0.8"/>

  <!-- Edge lines: hub to outer nodes -->
  <!-- Node A: top-right outer -->
  <line x1="800" y1="450" x2="1010" y2="195" stroke="url(#edgeA)" stroke-width="1.4" stroke-opacity="0.6"/>
  <!-- Node B: right outer -->
  <line x1="800" y1="450" x2="1105" y2="470" stroke="url(#edgeA)" stroke-width="1.4" stroke-opacity="0.55"/>
  <!-- Node C: bottom-right outer -->
  <line x1="800" y1="450" x2="980" y2="700" stroke="url(#edgeA)" stroke-width="1.4" stroke-opacity="0.55"/>
  <!-- Node D: bottom-left outer -->
  <line x1="800" y1="450" x2="590" y2="710" stroke="url(#edgeB)" stroke-width="1.4" stroke-opacity="0.55"/>
  <!-- Node E: left outer -->
  <line x1="800" y1="450" x2="495" y2="430" stroke="url(#edgeB)" stroke-width="1.4" stroke-opacity="0.55"/>
  <!-- Node F: top-left outer -->
  <line x1="800" y1="450" x2="620" y2="175" stroke="url(#edgeB)" stroke-width="1.4" stroke-opacity="0.6"/>

  <!-- Edge lines: hub to mid nodes -->
  <line x1="800" y1="450" x2="920" y2="270" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="990" y2="530" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="680" y2="630" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="615" y2="360" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Cross-connections between outer nodes (conference links) -->
  <line x1="1010" y1="195" x2="1105" y2="470" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.28"/>
  <line x1="1105" y1="470" x2="980" y2="700" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.25"/>
  <line x1="590" y1="710" x2="495" y2="430" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.25"/>
  <line x1="495" y1="430" x2="620" y2="175" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.28"/>
  <line x1="620" y1="175" x2="1010" y2="195" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.22"/>
  <line x1="980" y1="700" x2="590" y2="710" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.22"/>

  <!-- Mid-ring nodes -->
  <!-- Mid node 1: top-right -->
  <circle cx="920" cy="270" r="13" fill="url(#nodeRust)" opacity="0.85"/>
  <!-- Mid node 2: right -->
  <circle cx="990" cy="530" r="13" fill="url(#nodeRust)" opacity="0.85"/>
  <!-- Mid node 3: bottom -->
  <circle cx="680" cy="630" r="13" fill="url(#nodeRust)" opacity="0.85"/>
  <!-- Mid node 4: left -->
  <circle cx="615" cy="360" r="13" fill="url(#nodeRust)" opacity="0.85"/>

  <!-- Outer-ring nodes (conferences) -->
  <!-- Node A -->
  <circle cx="1010" cy="195" r="18" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="1010" cy="195" r="9" fill="#a78bfa" opacity="0.9"/>
  <!-- Node B -->
  <circle cx="1105" cy="470" r="18" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="1105" cy="470" r="9" fill="#a78bfa" opacity="0.9"/>
  <!-- Node C -->
  <circle cx="980" cy="700" r="18" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="980" cy="700" r="9" fill="#a78bfa" opacity="0.9"/>
  <!-- Node D -->
  <circle cx="590" cy="710" r="18" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="590" cy="710" r="9" fill="#a78bfa" opacity="0.9"/>
  <!-- Node E -->
  <circle cx="495" cy="430" r="18" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="495" cy="430" r="9" fill="#a78bfa" opacity="0.9"/>
  <!-- Node F -->
  <circle cx="620" cy="175" r="18" fill="url(#nodeViolet)" opacity="0.88"/>
  <circle cx="620" cy="175" r="9" fill="#a78bfa" opacity="0.9"/>

  <!-- Hub core: Beijing tech nexus -->
  <circle cx="800" cy="450" r="52" fill="url(#hubCore)" opacity="0.95"/>
  <!-- Hub highlight ring -->
  <circle cx="800" cy="450" r="52" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Hub inner dot -->
  <circle cx="800" cy="450" r="18" fill="#fbbf24" opacity="0.9"/>

  <!-- Layer 3: Corner atmosphere (outside safe zone — decorative only) -->
  <!-- Top-left corner sweep -->
  <path d="M0,0 Q200,80 300,200" stroke="#c2410c" stroke-width="1" fill="none" stroke-opacity="0.15"/>
  <path d="M0,0 Q150,120 250,300" stroke="#6d28d9" stroke-width="0.8" fill="none" stroke-opacity="0.12"/>
  <!-- Bottom-right corner sweep -->
  <path d="M1600,900 Q1400,820 1300,700" stroke="#c2410c" stroke-width="1" fill="none" stroke-opacity="0.15"/>
  <path d="M1600,900 Q1450,780 1350,600" stroke="#6d28d9" stroke-width="0.8" fill="none" stroke-opacity="0.12"/>
</svg>
