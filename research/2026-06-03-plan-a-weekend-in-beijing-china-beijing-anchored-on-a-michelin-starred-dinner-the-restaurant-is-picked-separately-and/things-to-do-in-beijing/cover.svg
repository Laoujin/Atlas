<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- setting sun glow, behind the ridge, inside safe zone -->
  <circle cx="800" cy="500" r="300" fill="url(#sun)" opacity="0.9"/>
  <circle cx="800" cy="500" r="120" fill="#fbbf24" opacity="0.85"/>

  <!-- distant haze ridge -->
  <path d="M0 620 L260 540 L520 600 L820 510 L1120 590 L1380 530 L1600 600 L1600 900 L0 900 Z"
        fill="#9a3309" opacity="0.45"/>

  <!-- hero: Great Wall crenellated ridgeline marching over the mountain crest -->
  <path d="M0 720
           L180 660 L300 700 L470 560 L640 640 L800 470 L960 640 L1130 560 L1300 700 L1420 660 L1600 720
           L1600 900 L0 900 Z" fill="url(#ridge)"/>

  <!-- wall walkway with crenellations following the crest -->
  <path d="M470 560 L640 640 L800 470 L960 640 L1130 560
           L1130 588 L960 668 L800 498 L640 668 L470 588 Z" fill="#c2410c" opacity="0.92"/>
  <!-- crenellation teeth along the upper edge -->
  <path d="M512 543 l26 12 l0 -18 l26 12 l0 -18 l26 12 l0 -18 l26 13 l0 -18 l26 13 l0 -18 l26 13
           l30 -32 l26 -28 l0 18 l26 -28 l0 18 l26 -28 l0 18 l26 -28 l0 18 l26 -28 l0 18 l26 -28
           l30 32 l26 13 l0 -18 l26 13 l0 -18 l26 13 l0 -18 l26 13 l0 -18 l26 12 l0 -18 l26 12
           l-6 22 l-22 -10 l0 16 l-24 -11 l0 16 l-24 -11 l0 16 l-24 -11 l0 16 l-24 -11 l0 16 l-24 -11
           l-28 30 l-26 26 l0 -16 l-24 24 l-24 -24 l0 16 l-26 -26 l-28 -30 l-24 11 l0 -16 l-24 11
           l0 -16 l-24 11 l0 -16 l-24 11 l0 -16 l-22 10 Z"
        fill="#9a3309" opacity="0.7"/>

  <!-- two watchtowers on the hero -->
  <rect x="618" y="600" width="46" height="60" rx="3" fill="#78350f"/>
  <path d="M610 600 h62 l-10 -16 h-42 Z" fill="#c2410c"/>
  <rect x="940" y="600" width="46" height="60" rx="3" fill="#78350f"/>
  <path d="M932 600 h62 l-10 -16 h-42 Z" fill="#c2410c"/>

  <!-- foreground shadow ridge -->
  <path d="M0 800 L380 740 L760 800 L1120 730 L1600 800 L1600 900 L0 900 Z"
        fill="#1a0e0e" opacity="0.85"/>
</svg>
