<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="bowl" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="broth" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- plate -->
  <ellipse cx="800" cy="560" rx="470" ry="150" fill="#78350f" opacity="0.85"/>
  <ellipse cx="800" cy="540" rx="470" ry="150" fill="url(#bowl)"/>

  <!-- bowl body -->
  <ellipse cx="800" cy="500" rx="330" ry="118" fill="#5c2a1a" opacity="0.9"/>
  <ellipse cx="800" cy="488" rx="330" ry="110" fill="url(#bowl)"/>

  <!-- broth surface -->
  <ellipse cx="800" cy="478" rx="300" ry="96" fill="url(#broth)" opacity="0.92"/>
  <ellipse cx="800" cy="478" rx="300" ry="96" fill="none" stroke="#fef3ec" stroke-width="3" opacity="0.35"/>

  <!-- chilli accent floating in broth -->
  <path d="M720 470 q70 -34 132 -8 q-44 30 -132 8 Z" fill="#be185d" opacity="0.9"/>
  <ellipse cx="884" cy="500" rx="34" ry="16" fill="#be185d" opacity="0.8"/>
  <ellipse cx="724" cy="508" rx="26" ry="12" fill="#9a3309" opacity="0.85"/>

  <!-- steam -->
  <path d="M740 410 q-34 -56 6 -104 q40 -48 6 -104" fill="none" stroke="#fef3ec" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  <path d="M830 398 q-30 -50 6 -94 q36 -44 6 -92" fill="none" stroke="#fef3ec" stroke-width="9" stroke-linecap="round" opacity="0.4"/>
  <path d="M905 414 q-28 -46 4 -88 q32 -42 4 -84" fill="none" stroke="#fef3ec" stroke-width="8" stroke-linecap="round" opacity="0.32"/>

  <!-- chopsticks -->
  <rect x="980" y="300" width="360" height="13" rx="6" transform="rotate(24 980 300)" fill="#fbbf24" opacity="0.9"/>
  <rect x="996" y="332" width="360" height="13" rx="6" transform="rotate(24 996 332)" fill="#d97706" opacity="0.9"/>
</svg>
