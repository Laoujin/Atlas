<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.32" stop-color="#fbbf24"/>
      <stop offset="0.62" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <!-- sun glow behind hero -->
  <circle cx="800" cy="420" r="360" fill="url(#sun)"/>
  <!-- water / ground band -->
  <rect x="0" y="700" width="1600" height="200" fill="#78350f" opacity="0.85"/>
  <rect x="0" y="700" width="1600" height="200" fill="#c2410c" opacity="0.25"/>

  <!-- left supertree -->
  <g fill="url(#tree)" opacity="0.92">
    <polygon points="556,700 544,360 576,360 564,700"/>
    <g stroke="#5c2a1a" stroke-width="5" opacity="0.9">
      <line x1="560" y1="362" x2="470" y2="296"/>
      <line x1="560" y1="362" x2="520" y2="270"/>
      <line x1="560" y1="362" x2="560" y2="258"/>
      <line x1="560" y1="362" x2="600" y2="270"/>
      <line x1="560" y1="362" x2="650" y2="296"/>
    </g>
    <ellipse cx="560" cy="316" rx="104" ry="30" fill="#5c2a1a"/>
  </g>

  <!-- right supertree -->
  <g fill="url(#tree)" opacity="0.92">
    <polygon points="1038,700 1026,332 1060,332 1048,700"/>
    <g stroke="#5c2a1a" stroke-width="5" opacity="0.9">
      <line x1="1042" y1="334" x2="940" y2="262"/>
      <line x1="1042" y1="334" x2="996" y2="234"/>
      <line x1="1042" y1="334" x2="1042" y2="222"/>
      <line x1="1042" y1="334" x2="1088" y2="234"/>
      <line x1="1042" y1="334" x2="1144" y2="262"/>
    </g>
    <ellipse cx="1042" cy="284" rx="112" ry="32" fill="#5c2a1a"/>
  </g>

  <!-- central hero supertree -->
  <g fill="url(#tree)">
    <polygon points="788,700 772,232 828,232 812,700"/>
    <g stroke="#5c2a1a" stroke-width="7">
      <line x1="800" y1="236" x2="660" y2="148"/>
      <line x1="800" y1="236" x2="730" y2="112"/>
      <line x1="800" y1="236" x2="800" y2="92"/>
      <line x1="800" y1="236" x2="870" y2="112"/>
      <line x1="800" y1="236" x2="940" y2="148"/>
    </g>
    <ellipse cx="800" cy="176" rx="150" ry="44" fill="#5c2a1a"/>
    <ellipse cx="800" cy="170" rx="150" ry="44" fill="#9a3309" opacity="0.45"/>
  </g>

  <!-- canopy walkway linking the towers -->
  <path d="M560 316 Q680 360 800 232 Q920 360 1042 284" fill="none" stroke="#5c2a1a" stroke-width="6" opacity="0.55"/>

  <!-- shimmer on the water -->
  <g stroke="#fbbf24" stroke-width="4" opacity="0.4">
    <line x1="690" y1="760" x2="910" y2="760"/>
    <line x1="740" y1="800" x2="860" y2="800"/>
  </g>
</svg>
