<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="night" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="42%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="80%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>
  <circle cx="800" cy="450" r="430" fill="url(#glow)"/>

  <!-- distant lantern companions, decoration, may crop -->
  <ellipse cx="300" cy="240" rx="62" ry="80" fill="#c2410c" opacity="0.32"/>
  <ellipse cx="1320" cy="650" rx="54" ry="70" fill="#d97706" opacity="0.30"/>

  <!-- hero lantern, centred ~800,450 -->
  <g>
    <line x1="800" y1="120" x2="800" y2="208" stroke="#78350f" stroke-width="6"/>
    <rect x="752" y="196" width="96" height="30" rx="6" fill="#78350f"/>
    <ellipse cx="800" cy="450" rx="188" ry="232" fill="url(#body)"/>
    <ellipse cx="800" cy="450" rx="92" ry="232" fill="none" stroke="#9a3309" stroke-width="4" opacity="0.55"/>
    <ellipse cx="800" cy="450" rx="158" ry="232" fill="none" stroke="#9a3309" stroke-width="4" opacity="0.45"/>
    <ellipse cx="800" cy="362" rx="188" ry="40" fill="#fbbf24" opacity="0.30"/>
    <rect x="744" y="668" width="112" height="30" rx="6" fill="#78350f"/>
    <rect x="788" y="694" width="24" height="78" rx="6" fill="#c2410c"/>
    <path d="M800 772 l-30 96 M800 772 l0 104 M800 772 l30 96" stroke="#9a3309" stroke-width="6" fill="none" stroke-linecap="round"/>
