<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#3d1a12"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="430" rx="760" ry="430" fill="url(#glow)"/>

  <!-- Marina Bay Sands: three towers + sky deck -->
  <g fill="url(#tower)" opacity="0.92">
    <polygon points="500,690 538,690 560,400 528,400"/>
    <polygon points="612,690 650,690 660,400 628,400"/>
    <polygon points="724,690 762,690 752,400 720,400"/>
    <rect x="496" y="372" width="280" height="30" rx="15" transform="rotate(-1.5 636 387)"/>
  </g>

  <!-- Supertree hero -->
  <g stroke="url(#tree)" stroke-width="7" stroke-linecap="round" opacity="0.95" fill="none">
    <path d="M1040 690 Q1052 540 1058 360" stroke-width="22"/>
    <line x1="1058" y1="372" x2="940" y2="252"/>
    <line x1="1058" y1="372" x2="1004" y2="214"/>
    <line x1="1058" y1="372" x2="1062" y2="196"/>
    <line x1="1058" y1="372" x2="1120" y2="216"/>
    <line x1="1058" y1="372" x2="1176" y2="258"/>
    <line x1="1052" y1="430" x2="978" y2="330"/>
    <line x1="1052" y1="430" x2="1140" y2="334"/>
  </g>
  <ellipse cx="1056" cy="300" rx="150" ry="92" fill="#c2410c" opacity="0.30"/>

  <!-- waterline + reflection -->
  <rect x="0" y="690" width="1600" height="6" fill="#fbbf24" opacity="0.45"/>
  <g opacity="0.16" fill="url(#tower)">
    <rect x="500" y="700" width="262" height="70"/>
    <rect x="1030" y="700" width="40" height="120"/>
  </g>
</svg>
