<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- hidden light at the end of the corridor -->
  <circle cx="800" cy="392" r="430" fill="url(#glow)"/>

  <!-- arch: a leaning passage mouth framing the vanishing point -->
  <path d="M610 760 Q560 360 800 312 Q1040 360 990 760"
        fill="none" stroke="#78350f" stroke-width="26" stroke-opacity="0.8"/>

  <!-- sleepers (ties), receding toward the vanishing point -->
  <g fill="#78350f" fill-opacity="0.9">
    <rect x="612" y="742" width="376" height="22" rx="6"/>
    <rect x="650" y="650" width="300" height="18" rx="5"/>
    <rect x="681" y="566" width="238" height="15" rx="4"/>
    <rect x="706" y="492" width="188" height="12" rx="4"/>
    <rect x="726" y="430" width="148" height="10" rx="3"/>
  </g>

  <!-- two rails converging -->
  <path d="M648 768 L786 392" fill="none" stroke="url(#rail)" stroke-width="20" stroke-linecap="round"/>
  <path d="M952 768 L814 392" fill="none" stroke="url(#rail)" stroke-width="20" stroke-linecap="round"/>

  <!-- bright vanishing node -->
  <circle cx="800" cy="392" r="34" fill="#fbbf24" fill-opacity="0.95"/>
</svg>
