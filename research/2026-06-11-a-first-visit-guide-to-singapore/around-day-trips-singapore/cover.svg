<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- water band for ferries / island day-trips (full-bleed lower edge, decorative) -->
  <path d="M0 770 q200 -34 400 0 t400 0 t400 0 t400 0 V900 H0 Z" fill="#78350f" opacity="0.10"/>

  <!-- transit lines radiating from central interchange -->
  <g fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M250 300 H800 V210" stroke="#c2410c" stroke-width="22"/>
    <path d="M1380 280 L800 450 L600 760" stroke="#d97706" stroke-width="22"/>
    <path d="M300 720 L800 450 H1340 V640" stroke="#9a3309" stroke-width="22"/>
  </g>

  <!-- causeway / ferry crossing: dashed link out to an island node -->
  <path d="M800 450 H1300 V780" fill="none" stroke="#78350f" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="6 34" opacity="0.7"/>

  <!-- station nodes -->
  <g fill="#faf8f2" stroke="#9a3309" stroke-width="9">
    <circle cx="250" cy="300" r="26"/>
    <circle cx="800" cy="210" r="26"/>
    <circle cx="1380" cy="280" r="26"/>
    <circle cx="600" cy="760" r="26"/>
    <circle cx="300" cy="720" r="26"/>
    <circle cx="1340" cy="640" r="26"/>
    <circle cx="1300" cy="780" r="26"/>
  </g>

  <!-- central interchange hero -->
  <circle cx="800" cy="450" r="92" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="92" fill="none" stroke="#faf8f2" stroke-width="14"/>
  <circle cx="800" cy="450" r="34" fill="#faf8f2" opacity="0.92"/>
</svg>
