<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- 1. full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- decoration: receding canopy hills (cropped variably) -->
  <path d="M0 640 Q 380 520 760 600 T 1600 580 V900 H0 Z" fill="url(#hillBack)" opacity="0.55"/>
  <path d="M0 720 Q 440 620 900 700 T 1600 680 V900 H0 Z" fill="#9a3309" opacity="0.7"/>
  <path d="M0 800 Q 500 730 1080 790 T 1600 770 V900 H0 Z" fill="#78350f" opacity="0.85"/>

  <!-- 2. hero: treetop suspension walk, centered ~ (800,450) -->
  <g stroke-linecap="round">
    <!-- towers -->
    <line x1="470" y1="300" x2="470" y2="470" stroke="#5c2a1a" stroke-width="16"/>
    <line x1="1130" y1="300" x2="1130" y2="470" stroke="#5c2a1a" stroke-width="16"/>
    <!-- main cable, sagging catenary -->
    <path d="M470 300 Q 800 480 1130 300" fill="none" stroke="#78350f" stroke-width="9"/>
    <!-- hangers -->
    <g stroke="#9a3309" stroke-width="5" opacity="0.9">
      <line x1="560" y1="358" x2="560" y2="455"/>
      <line x1="650" y1="402" x2="650" y2="455"/>
      <line x1="740" y1="428" x2="740" y2="455"/>
      <line x1="830" y1="432" x2="830" y2="455"/>
      <line x1="920" y1="418" x2="920" y2="455"/>
      <line x1="1010" y1="386" x2="1010" y2="455"/>
      <line x1="1040" y1="368" x2="1040" y2="455"/>
    </g>
    <!-- deck / boardwalk planks -->
    <path d="M455 458 H1145" fill="none" stroke="#c2410c" stroke-width="22"/>
    <path d="M455 470 H1145" fill="none" stroke="#9a3309" stroke-width="6" opacity="0.8"/>
  </g>
</svg>
