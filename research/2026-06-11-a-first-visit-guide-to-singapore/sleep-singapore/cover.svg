<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- HERO: Marina Bay Sands — three leaning towers + SkyPark deck -->
  <g>
    <!-- towers -->
    <polygon points="612,560 668,560 700,318 658,318" fill="url(#tower)" opacity="0.95"/>
    <polygon points="772,560 828,560 818,318 776,318" fill="url(#tower)" opacity="0.95"/>
    <polygon points="932,560 988,560 942,318 900,318" fill="url(#tower)" opacity="0.95"/>
    <!-- SkyPark deck (the surfboard) -->
    <rect x="588" y="288" width="424" height="30" rx="15" fill="#c2410c"/>
    <rect x="980" y="280" width="120" height="22" rx="11" fill="#fbbf24" opacity="0.9"/>
    <!-- warm window glints -->
    <rect x="636" y="380" width="20" height="120" rx="6" fill="#fbbf24" opacity="0.35"/>
    <rect x="790" y="380" width="20" height="120" rx="6" fill="#fbbf24" opacity="0.35"/>
    <rect x="948" y="380" width="20" height="120" rx="6" fill="#fbbf24" opacity="0.35"/>
  </g>

  <!-- foreground: heritage shophouse rooftops -->
  <g fill="#78350f">
    <polygon points="250,640 430,640 430,560 340,520 250,560" opacity="0.92"/>
    <polygon points="430,640 600,640 600,575 515,535 430,575" opacity="0.86"/>
    <polygon points="1000,640 1170,640 1170,575 1085,535 1000,575" opacity="0.86"/>
    <polygon points="1170,640 1350,640 1350,560 1260,520 1170,560" opacity="0.92"/>
    <rect x="250" y="636" width="1100" height="180" fill="#5c2a1a"/>
  </g>

  <!-- bay reflection streaks -->
  <g fill="#d97706" opacity="0.18">
    <rect x="660" y="650" width="14" height="150"/>
    <rect x="800" y="650" width="14" height="150"/>
    <rect x="940" y="650" width="14" height="150"/>
  </g>
</svg>
