<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c9b89a"/>
    </radialGradient>
    <radialGradient id="drop" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3a1505"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm halo behind the plate -->
  <circle cx="800" cy="470" r="520" fill="url(#halo)"/>

  <!-- Ghirlandina tower silhouette rising behind plate, kept within safe zone -->
  <g opacity="0.78">
    <!-- tower shaft -->
    <rect x="770" y="180" width="60" height="320" fill="url(#tower)"/>
    <!-- crenellation band -->
    <rect x="762" y="290" width="76" height="10" fill="#78350f" opacity="0.7"/>
    <!-- octagonal upper stage -->
    <polygon points="772,180 828,180 838,150 762,150" fill="#9a3309"/>
    <!-- spire -->
    <polygon points="765,150 835,150 800,80" fill="#c2410c"/>
    <!-- small finial -->
    <circle cx="800" cy="74" r="6" fill="#fbbf24"/>
  </g>

  <!-- plate (hero), centered at ~(800, 540), within safe zone -->
  <ellipse cx="800" cy="555" rx="360" ry="115" fill="#1a0e0e" opacity="0.45"/>
  <ellipse cx="800" cy="540" rx="355" ry="110" fill="url(#plate)"/>
  <ellipse cx="800" cy="540" rx="290" ry="88" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.35"/>

  <!-- balsamic drop, the focal point -->
  <ellipse cx="800" cy="540" rx="95" ry="32" fill="url(#drop)"/>
  <ellipse cx="775" cy="528" rx="22" ry="6" fill="#fbbf24" opacity="0.45"/>

  <!-- single trailing droplet, motivated as a balsamic streak -->
  <ellipse cx="930" cy="548" rx="14" ry="5" fill="#9a3309" opacity="0.75"/>
  <ellipse cx="965" cy="552" rx="6" ry="2.5" fill="#9a3309" opacity="0.55"/>
</svg>
