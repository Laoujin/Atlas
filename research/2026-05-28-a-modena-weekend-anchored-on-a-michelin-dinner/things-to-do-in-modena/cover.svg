<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.8" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3a1a10"/>
    </linearGradient>
    <linearGradient id="duomo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow behind the skyline -->
  <circle cx="980" cy="640" r="380" fill="url(#sun)"/>
  <circle cx="980" cy="640" r="90" fill="#fef3ec" opacity="0.85"/>

  <!-- Distant hill silhouette (Lambrusco hills) -->
  <path d="M 0 720 Q 300 660 600 700 Q 900 740 1200 690 Q 1400 660 1600 700 L 1600 900 L 0 900 Z"
        fill="#5c2a1a" opacity="0.55"/>

  <!-- Duomo nave (long Romanesque body with pitched roof) -->
  <path d="M 540 560 L 540 470 L 600 430 L 820 430 L 880 470 L 880 560 Z" fill="url(#duomo)"/>
  <!-- Duomo apse (rounded east end) -->
  <path d="M 540 560 L 540 490 Q 480 490 480 560 Z" fill="url(#duomo)"/>
  <!-- Duomo facade rose window suggestion (dark on dark, very subtle) -->
  <circle cx="710" cy="495" r="22" fill="#5c2a1a" opacity="0.6"/>
  <!-- Small arched openings along nave -->
  <rect x="600" y="510" width="14" height="30" rx="7" fill="#5c2a1a" opacity="0.55"/>
  <rect x="640" y="510" width="14" height="30" rx="7" fill="#5c2a1a" opacity="0.55"/>
  <rect x="760" y="510" width="14" height="30" rx="7" fill="#5c2a1a" opacity="0.55"/>
  <rect x="800" y="510" width="14" height="30" rx="7" fill="#5c2a1a" opacity="0.55"/>

  <!-- Torre Ghirlandina — the hero, tall slender bell tower -->
  <rect x="900" y="220" width="76" height="340" fill="url(#tower)"/>
  <!-- Tower belfry openings -->
  <rect x="918" y="280" width="14" height="40" rx="7" fill="#9a3309" opacity="0.55"/>
  <rect x="944" y="280" width="14" height="40" rx="7" fill="#9a3309" opacity="0.55"/>
  <rect x="918" y="350" width="14" height="40" rx="7" fill="#9a3309" opacity="0.5"/>
  <rect x="944" y="350" width="14" height="40" rx="7" fill="#9a3309" opacity="0.5"/>
  <rect x="918" y="420" width="14" height="36" rx="7" fill="#9a3309" opacity="0.45"/>
  <rect x="944" y="420" width="14" height="36" rx="7" fill="#9a3309" opacity="0.45"/>
  <!-- Octagonal upper section (the "ghirlanda" — little garland) -->
  <path d="M 894 220 L 982 220 L 970 180 L 906 180 Z" fill="#1a0e0e"/>
  <!-- Octagonal spire -->
  <path d="M 906 180 L 970 180 L 962 140 L 914 140 Z" fill="#2a1410"/>
  <!-- Pyramidal cap -->
  <path d="M 914 140 L 962 140 L 938 90 Z" fill="#1a0e0e"/>
  <!-- Finial -->
  <circle cx="938" cy="86" r="4" fill="#fbbf24" opacity="0.9"/>

  <!-- Foreground ground/piazza -->
  <rect x="0" y="780" width="1600" height="120" fill="url(#ground)"/>
</svg>
