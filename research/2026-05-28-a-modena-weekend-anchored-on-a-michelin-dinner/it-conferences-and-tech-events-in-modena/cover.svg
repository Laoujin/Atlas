<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="dial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="trace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decorative circuit traces (outside hero safe zone, will get cropped variably) -->
  <g stroke="#c2410c" stroke-opacity="0.18" stroke-width="2" fill="none">
    <path d="M 0 120 L 180 120 L 220 160 L 380 160"/>
    <path d="M 0 780 L 240 780 L 280 740 L 420 740"/>
    <path d="M 1600 140 L 1380 140 L 1340 180 L 1180 180"/>
    <path d="M 1600 760 L 1360 760 L 1320 720 L 1180 720"/>
    <circle cx="180" cy="120" r="4" fill="#c2410c" fill-opacity="0.3"/>
    <circle cx="240" cy="780" r="4" fill="#c2410c" fill-opacity="0.3"/>
    <circle cx="1380" cy="140" r="4" fill="#c2410c" fill-opacity="0.3"/>
    <circle cx="1360" cy="760" r="4" fill="#c2410c" fill-opacity="0.3"/>
  </g>

  <!-- horizontal trace lines fading into hero -->
  <line x1="200" y1="450" x2="600" y2="450" stroke="url(#trace)" stroke-width="2.5"/>
  <line x1="1000" y1="450" x2="1400" y2="450" stroke="url(#trace)" stroke-width="2.5"/>
  <line x1="280" y1="380" x2="560" y2="380" stroke="url(#trace)" stroke-width="1.5" opacity="0.6"/>
  <line x1="1040" y1="520" x2="1320" y2="520" stroke="url(#trace)" stroke-width="1.5" opacity="0.6"/>

  <!-- HERO: speedometer dial centered at (800, 450) -->
  <!-- outer ring -->
  <circle cx="800" cy="450" r="240" fill="none" stroke="#78350f" stroke-width="3" opacity="0.9"/>
  <circle cx="800" cy="450" r="232" fill="url(#dial)" opacity="0.95"/>

  <!-- tick marks around dial (every 22.5 degrees, 240deg arc) -->
  <g stroke="#faf8f2" stroke-width="3" stroke-linecap="round">
    <line x1="800" y1="240" x2="800" y2="262"/>
    <line x1="638" y1="307" x2="654" y2="322" opacity="0.85"/>
    <line x1="566" y1="450" x2="588" y2="450" opacity="0.85"/>
    <line x1="654" y1="578" x2="638" y2="593" opacity="0.85"/>
    <line x1="800" y1="638" x2="800" y2="660" opacity="0.85"/>
    <line x1="946" y1="578" x2="962" y2="593" opacity="0.85"/>
    <line x1="1012" y1="450" x2="1034" y2="450" opacity="0.85"/>
    <line x1="946" y1="307" x2="962" y2="322" opacity="0.85"/>
  </g>

  <!-- minor ticks -->
  <g stroke="#faf8f2" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
    <line x1="720" y1="252" x2="724" y2="270"/>
    <line x1="640" y1="282" x2="650" y2="298"/>
    <line x1="600" y1="376" x2="618" y2="384"/>
    <line x1="600" y1="524" x2="618" y2="516"/>
    <line x1="640" y1="618" x2="650" y2="602"/>
    <line x1="720" y1="648" x2="724" y2="630"/>
    <line x1="880" y1="252" x2="876" y2="270"/>
    <line x1="960" y1="282" x2="950" y2="298"/>
    <line x1="1000" y1="376" x2="982" y2="384"/>
    <line x1="1000" y1="524" x2="982" y2="516"/>
    <line x1="960" y1="618" x2="950" y2="602"/>
    <line x1="880" y1="648" x2="876" y2="630"/>
  </g>

  <!-- inner bezel -->
  <circle cx="800" cy="450" r="180" fill="none" stroke="#faf8f2" stroke-width="1.5" opacity="0.4"/>
  <circle cx="800" cy="450" r="60" fill="#1a0e0e" opacity="0.9"/>
  <circle cx="800" cy="450" r="60" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>

  <!-- needle pointing up-right (acceleration) -->
  <g transform="rotate(55 800 450)">
    <polygon points="800,460 800,440 980,452 980,448" fill="url(#needle)"/>
    <circle cx="800" cy="450" r="14" fill="#78350f"/>
    <circle cx="800" cy="450" r="6" fill="#fbbf24"/>
  </g>

  <!-- secondary motif: stylized Modena duomo tower silhouette (Ghirlandina) — lower right corner of hero -->
  <g fill="#6d28d9" opacity="0.75">
    <rect x="1080" y="340" width="48" height="260"/>
    <polygon points="1080,340 1128,340 1104,310"/>
    <polygon points="1080,310 1128,310 1104,280"/>
    <rect x="1090" y="380" width="8" height="18" fill="#faf8f2" opacity="0.6"/>
    <rect x="1110" y="380" width="8" height="18" fill="#faf8f2" opacity="0.6"/>
    <rect x="1090" y="430" width="8" height="18" fill="#faf8f2" opacity="0.6"/>
    <rect x="1110" y="430" width="8" height="18" fill="#faf8f2" opacity="0.6"/>
    <rect x="1090" y="480" width="8" height="22" fill="#faf8f2" opacity="0.6"/>
    <rect x="1110" y="480" width="8" height="22" fill="#faf8f2" opacity="0.6"/>
  </g>

  <!-- circuit node at base of tower connecting it to the dial trace -->
  <line x1="1040" y1="600" x2="1104" y2="600" stroke="#6d28d9" stroke-width="2" opacity="0.5"/>
  <circle cx="1040" cy="600" r="5" fill="#6d28d9" opacity="0.7"/>

  <!-- accent: small Italian-flag-like color punch dots near hero (subtle) -->
  <circle cx="500" cy="450" r="6" fill="#c2410c" opacity="0.7"/>
  <circle cx="480" cy="450" r="6" fill="#fbbf24" opacity="0.5"/>
</svg>
