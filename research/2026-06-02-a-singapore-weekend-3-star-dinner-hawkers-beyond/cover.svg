<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark evening background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2e1008"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm candlelight radial glow at table centre -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate rim gradient: bone white to warm shadow -->
    <radialGradient id="plateMain" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.97"/>
      <stop offset="72%" stop-color="#f0eadb" stop-opacity="0.93"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.25"/>
    </radialGradient>
    <!-- Inner well of main plate -->
    <radialGradient id="plateWell" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f0eadb" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.18"/>
    </radialGradient>
    <!-- Side plate gradient -->
    <radialGradient id="plateSide" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.88"/>
      <stop offset="75%" stop-color="#f0eadb" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.30"/>
    </radialGradient>
    <!-- Wine glass rose fill -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.70"/>
      <stop offset="60%" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.40"/>
    </linearGradient>
    <!-- Subtle city-lights edge glow (Singapore skyline suggestion) -->
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Horizon atmosphere band (city lights) -->
  <rect x="0" y="560" width="1600" height="120" fill="url(#horizonGlow)" opacity="0.9"/>

  <!-- Layer 2: Warm candlelight glow — broad ambient pool -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle table surface ellipse — anchors the scene -->
  <ellipse cx="800" cy="620" rx="620" ry="90" fill="#78350f" opacity="0.28"/>
  <ellipse cx="800" cy="620" rx="480" ry="60" fill="#9a3309" opacity="0.18"/>

  <!-- Layer 2: Hero element — plates centred in safe zone -->

  <!-- Secondary plate (slightly behind, upper-left of hero) -->
  <circle cx="650" cy="440" r="155" fill="url(#plateSide)" opacity="0.82"/>
  <!-- secondary plate rim ring -->
  <circle cx="650" cy="440" r="155" fill="none" stroke="#f0eadb" stroke-width="5" opacity="0.40"/>
  <!-- secondary plate inner well -->
  <circle cx="650" cy="440" r="108" fill="#fef3ec" opacity="0.28"/>

  <!-- Main plate (hero, centre-right) -->
  <circle cx="870" cy="460" r="195" fill="url(#plateMain)" opacity="0.95"/>
  <!-- main plate rim highlight -->
  <circle cx="870" cy="460" r="195" fill="none" stroke="#faf8f2" stroke-width="7" opacity="0.50"/>
  <!-- main plate inner well -->
  <circle cx="870" cy="460" r="135" fill="url(#plateWell)" opacity="0.75"/>
  <!-- food accent: small rust oval on main plate (plated element) -->
  <ellipse cx="870" cy="452" rx="38" ry="18" fill="#c2410c" opacity="0.70"/>
  <ellipse cx="855" cy="448" rx="14" ry="9" fill="#d97706" opacity="0.75"/>
  <ellipse cx="892" cy="458" rx="10" ry="6" fill="#fbbf24" opacity="0.60"/>

  <!-- Wine glass silhouette (right side, accent) -->
  <!-- bowl -->
  <ellipse cx="1130" cy="390" rx="52" ry="62" fill="url(#glassGrad)" opacity="0.78"/>
  <!-- wine surface highlight -->
  <ellipse cx="1118" cy="368" rx="22" ry="10" fill="#fbbf24" opacity="0.22"/>
  <!-- stem -->
  <rect x="1124" y="450" width="12" height="110" rx="5" fill="#f0eadb" opacity="0.45"/>
  <!-- base -->
  <ellipse cx="1130" cy="562" rx="44" ry="10" fill="#f0eadb" opacity="0.38"/>

  <!-- Layer 3: Decorative edge elements (may be cropped — no meaning lost) -->
  <!-- Top-left faint arc suggesting a second glass or distant plate -->
  <circle cx="120" cy="160" r="90" fill="none" stroke="#9a3309" stroke-width="4" opacity="0.18"/>
  <!-- Bottom-right warm corner scatter -->
  <circle cx="1520" cy="790" r="70" fill="#d97706" opacity="0.10"/>
  <circle cx="1490" cy="830" r="40" fill="#c2410c" opacity="0.12"/>
  <!-- Top-right faint constellation of 3 dots (Michelin stars motif, purely atmospheric) -->
  <circle cx="1380" cy="140" r="7" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1415" cy="115" r="5" fill="#fbbf24" opacity="0.28"/>
  <circle cx="1448" cy="148" r="6" fill="#fbbf24" opacity="0.30"/>
</svg>
