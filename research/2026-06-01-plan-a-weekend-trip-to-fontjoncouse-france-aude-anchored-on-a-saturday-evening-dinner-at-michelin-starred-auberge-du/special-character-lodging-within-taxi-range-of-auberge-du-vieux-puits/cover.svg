<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.32" r="0.35">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#e0c89a"/>
    </linearGradient>
    <linearGradient id="terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- Distant ridge -->
  <path d="M0 540 L180 480 L360 510 L560 460 L780 495 L980 455 L1220 490 L1430 470 L1600 500 L1600 900 L0 900 Z" fill="url(#hill1)" opacity="0.75"/>

  <!-- Mid ridge with garrigue rolling -->
  <path d="M0 640 L160 600 L340 625 L520 580 L720 615 L920 590 L1140 625 L1340 600 L1600 620 L1600 900 L0 900 Z" fill="url(#hill2)" opacity="0.85"/>

  <!-- Vineyard terrace lines (foreground) -->
  <g opacity="0.55" stroke="#78350f" stroke-width="2" fill="none">
    <path d="M0 720 Q400 700 800 715 T1600 710"/>
    <path d="M0 755 Q400 735 800 750 T1600 745"/>
    <path d="M0 790 Q400 770 800 785 T1600 780"/>
    <path d="M0 825 Q400 805 800 820 T1600 815"/>
  </g>
  <!-- Vine stitches -->
  <g fill="#5c2a1a" opacity="0.55">
    <circle cx="120" cy="720" r="3"/><circle cx="260" cy="717" r="3"/><circle cx="400" cy="713" r="3"/><circle cx="540" cy="712" r="3"/><circle cx="680" cy="713" r="3"/><circle cx="820" cy="715" r="3"/><circle cx="960" cy="714" r="3"/><circle cx="1100" cy="713" r="3"/><circle cx="1240" cy="712" r="3"/><circle cx="1380" cy="711" r="3"/><circle cx="1520" cy="710" r="3"/>
    <circle cx="180" cy="755" r="3"/><circle cx="320" cy="752" r="3"/><circle cx="460" cy="748" r="3"/><circle cx="600" cy="747" r="3"/><circle cx="740" cy="748" r="3"/><circle cx="880" cy="750" r="3"/><circle cx="1020" cy="749" r="3"/><circle cx="1160" cy="748" r="3"/><circle cx="1300" cy="747" r="3"/><circle cx="1440" cy="746" r="3"/>
  </g>

  <!-- Hero: stone house cluster, centered around (800, 450) -->
  <g>
    <!-- Smaller back house -->
    <rect x="600" y="440" width="180" height="170" fill="url(#wall)" opacity="0.95"/>
    <polygon points="590,440 700,360 790,440" fill="url(#roof)" opacity="0.95"/>
    <rect x="650" y="500" width="32" height="50" fill="#5c2a1a" opacity="0.7"/>
    <rect x="710" y="500" width="32" height="50" fill="#5c2a1a" opacity="0.55"/>

    <!-- Main hero house -->
    <rect x="760" y="400" width="280" height="240" fill="url(#wall)"/>
    <polygon points="745,400 900,290 1055,400" fill="url(#roof)"/>
    <!-- Roof tile hint -->
    <g stroke="#9a3309" stroke-width="1.5" opacity="0.45" fill="none">
      <line x1="760" y1="345" x2="1040" y2="345"/>
      <line x1="755" y1="370" x2="1045" y2="370"/>
      <line x1="750" y1="395" x2="1050" y2="395"/>
    </g>
    <!-- Windows with shutters -->
    <rect x="800" y="470" width="44" height="62" fill="#5c2a1a" opacity="0.75"/>
    <rect x="796" y="468" width="6" height="66" fill="#c2410c" opacity="0.85"/>
    <rect x="844" y="468" width="6" height="66" fill="#c2410c" opacity="0.85"/>
    <rect x="880" y="470" width="44" height="62" fill="#5c2a1a" opacity="0.75"/>
    <rect x="876" y="468" width="6" height="66" fill="#c2410c" opacity="0.85"/>
    <rect x="924" y="468" width="6" height="66" fill="#c2410c" opacity="0.85"/>
    <!-- Door -->
    <rect x="955" y="540" width="44" height="100" fill="#5c2a1a" opacity="0.85"/>
    <!-- Chimney -->
    <rect x="970" y="310" width="28" height="50" fill="#9a3309"/>

    <!-- Small olive tree silhouette beside -->
    <ellipse cx="1100" cy="580" rx="48" ry="38" fill="#5c2a1a" opacity="0.55"/>
    <ellipse cx="1095" cy="565" rx="38" ry="30" fill="#78350f" opacity="0.6"/>
    <rect x="1095" y="595" width="8" height="45" fill="#5c2a1a" opacity="0.8"/>

    <!-- Cypress accent -->
    <ellipse cx="560" cy="540" rx="14" ry="70" fill="#5c2a1a" opacity="0.6"/>
  </g>

  <!-- Foreground ground -->
  <rect x="0" y="640" width="1600" height="260" fill="#78350f" opacity="0.15"/>
</svg>
