<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun haze behind hero -->
  <circle cx="820" cy="470" r="340" fill="url(#sun)"/>
  <circle cx="820" cy="470" r="120" fill="#fef3ec" opacity="0.85"/>

  <!-- distant rust ridge, low opacity -->
  <path d="M0,620 L180,560 L340,590 L520,540 L720,575 L900,535 L1100,570 L1320,545 L1500,580 L1600,565 L1600,900 L0,900 Z"
        fill="#c2410c" opacity="0.45"/>

  <!-- main ridge with Cathar castle silhouette, centered in safe zone -->
  <path d="M125,720
           L300,660
           L460,640
           L640,615
           L740,605
           L760,560 L760,540 L770,540 L770,555 L785,555 L785,540 L795,540 L795,555 L810,555 L810,520 L820,520 L820,500 L835,500 L835,470 L855,470 L855,500 L870,500 L870,520 L880,520 L880,555 L895,555 L895,540 L905,540 L905,555 L920,555 L920,540 L930,540 L930,560
           L950,600
           L1100,625
           L1280,650
           L1420,680
           L1475,705
           L1475,810
           L125,810 Z"
        fill="url(#ridge)"/>

  <!-- castle slit windows (tiny dark accents on the keep) -->
  <rect x="822" y="525" width="6" height="14" fill="#1a0e0e" opacity="0.8"/>
  <rect x="842" y="510" width="6" height="14" fill="#1a0e0e" opacity="0.8"/>

  <!-- foreground hill darker, garrigue layer -->
  <path d="M0,790 L220,755 L420,775 L640,745 L860,770 L1080,750 L1300,775 L1500,755 L1600,770 L1600,900 L0,900 Z"
        fill="url(#keep)" opacity="0.92"/>

  <!-- vineyard rows in foreground, faint diagonal strokes -->
  <g stroke="#fbbf24" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M120,830 L420,805"/>
    <path d="M260,855 L640,820"/>
    <path d="M420,880 L900,835"/>
    <path d="M700,870 L1180,830"/>
    <path d="M960,855 L1400,820"/>
    <path d="M1180,840 L1500,815"/>
  </g>

  <!-- a few cypress-like dots on the ridge -->
  <circle cx="420" cy="635" r="6" fill="#1a0e0e" opacity="0.6"/>
  <circle cx="520" cy="625" r="5" fill="#1a0e0e" opacity="0.55"/>
  <circle cx="1080" cy="620" r="6" fill="#1a0e0e" opacity="0.6"/>
  <circle cx="1180" cy="635" r="5" fill="#1a0e0e" opacity="0.55"/>
</svg>
