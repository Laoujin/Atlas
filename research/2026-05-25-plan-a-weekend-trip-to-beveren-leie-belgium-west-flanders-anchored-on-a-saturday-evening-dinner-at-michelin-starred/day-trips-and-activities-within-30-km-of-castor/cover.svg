<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Low sun glow behind belfry -->
  <circle cx="800" cy="430" r="240" fill="url(#sun)"/>

  <!-- Distant hill silhouette (cobbled climb suggestion) -->
  <path d="M 0 620 Q 280 540 560 580 T 1100 560 Q 1340 540 1600 600 L 1600 900 L 0 900 Z"
        fill="#78350f" opacity="0.6"/>

  <!-- Mid hill -->
  <path d="M 0 690 Q 400 640 820 670 T 1600 660 L 1600 900 L 0 900 Z"
        fill="url(#hill)" opacity="0.82"/>

  <!-- Belfry / church silhouette (hero, centered ~800,450) -->
  <g opacity="0.92">
    <!-- main tower body -->
    <rect x="760" y="360" width="80" height="320" fill="#1a0e0e"/>
    <!-- tower base widening -->
    <rect x="745" y="640" width="110" height="40" fill="#1a0e0e"/>
    <!-- belfry top section -->
    <rect x="770" y="320" width="60" height="50" fill="#1a0e0e"/>
    <!-- spire -->
    <polygon points="775,320 825,320 800,230" fill="#1a0e0e"/>
    <!-- finial -->
    <circle cx="800" cy="222" r="6" fill="#c2410c"/>
    <!-- arched window cutouts -->
    <rect x="785" y="400" width="30" height="50" rx="14" fill="#fbbf24" opacity="0.55"/>
    <rect x="785" y="490" width="30" height="50" rx="14" fill="#fbbf24" opacity="0.4"/>
    <rect x="785" y="580" width="30" height="40" rx="14" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- Brewery / outbuilding silhouette to the right -->
  <g opacity="0.85">
    <rect x="900" y="600" width="180" height="80" fill="#1a0e0e"/>
    <polygon points="900,600 1080,600 1040,560 940,560" fill="#1a0e0e"/>
    <!-- chimney stack -->
    <rect x="1020" y="500" width="22" height="100" fill="#1a0e0e"/>
    <!-- faint smoke -->
    <ellipse cx="1031" cy="490" rx="18" ry="10" fill="#faf8f2" opacity="0.35"/>
    <ellipse cx="1045" cy="470" rx="22" ry="11" fill="#faf8f2" opacity="0.25"/>
  </g>

  <!-- Small village cluster to the left -->
  <g opacity="0.8" fill="#1a0e0e">
    <rect x="540" y="630" width="60" height="50"/>
    <polygon points="540,630 600,630 570,605"/>
    <rect x="610" y="640" width="50" height="40"/>
    <polygon points="610,640 660,640 635,620"/>
  </g>

  <!-- Meandering Leie river: foreground curve -->
  <path d="M 0 900 L 0 800 Q 240 760 460 790 Q 700 820 900 780 Q 1140 740 1340 770 Q 1480 790 1600 770 L 1600 900 Z"
        fill="url(#river)"/>

  <!-- River highlight ripples -->
  <path d="M 120 820 Q 320 800 520 815" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 700 800 Q 900 780 1100 800" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M 1180 830 Q 1320 820 1480 825" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Towpath line along the river bank -->
  <path d="M 0 778 Q 240 740 460 770 Q 700 800 900 760 Q 1140 720 1340 750 Q 1480 770 1600 750"
        stroke="#6d28d9" stroke-width="0" fill="none"/>
  <path d="M 0 778 Q 240 740 460 770 Q 700 800 900 760 Q 1140 720 1340 750 Q 1480 770 1600 750"
        stroke="#fef3ec" stroke-width="3" stroke-dasharray="2 10" fill="none" opacity="0.7"/>
</svg>
