<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.45" stop-color="#5c2a1a"/>
      <stop offset="0.85" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="restaurant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="lodge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#fef3ec" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon glow above the horizon -->
  <circle cx="800" cy="280" r="260" fill="url(#moon)"/>
  <circle cx="800" cy="280" r="48" fill="#fbbf24" opacity="0.9"/>

  <!-- Distant rolling hills (Leie countryside) -->
  <path d="M 0 560 Q 300 510 600 545 T 1200 540 T 1600 555 L 1600 620 L 0 620 Z" fill="#78350f" opacity="0.7"/>
  <path d="M 0 600 Q 400 565 800 590 T 1600 595 L 1600 660 L 0 660 Z" fill="#5c2a1a" opacity="0.85"/>

  <!-- Leie river ribbon, catching moonlight -->
  <path d="M 0 690 Q 400 670 800 685 T 1600 680 L 1600 710 Q 1200 720 800 705 T 0 715 Z" fill="url(#river)"/>

  <!-- Footpath between the two buildings -->
  <path d="M 540 760 Q 800 700 1060 760 L 1090 790 Q 800 720 510 790 Z" fill="url(#path)" opacity="0.8"/>

  <!-- Restaurant cube (modern, on the left) -->
  <g>
    <rect x="380" y="500" width="220" height="240" fill="url(#restaurant)"/>
    <polygon points="380,500 490,440 710,440 600,500" fill="#d97706" opacity="0.85"/>
    <polygon points="600,500 710,440 710,680 600,740" fill="#78350f" opacity="0.95"/>
    <!-- warm lit windows -->
    <rect x="410" y="560" width="40" height="60" fill="#fbbf24" opacity="0.9"/>
    <rect x="470" y="560" width="40" height="60" fill="#fbbf24" opacity="0.75"/>
    <rect x="530" y="560" width="40" height="60" fill="#fbbf24" opacity="0.9"/>
    <rect x="410" y="650" width="160" height="20" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- Lodging silhouette (traditional pitched roof, on the right) -->
  <g>
    <rect x="1000" y="540" width="240" height="200" fill="url(#lodge)"/>
    <polygon points="1000,540 1120,440 1240,540" fill="#5c2a1a"/>
    <polygon points="1240,540 1120,440 1120,500 1280,560" fill="#1a0e0e" opacity="0.7"/>
    <rect x="1100" y="640" width="50" height="100" fill="#1a0e0e" opacity="0.85"/>
    <rect x="1030" y="580" width="40" height="40" fill="#fbbf24" opacity="0.85"/>
    <rect x="1180" y="580" width="40" height="40" fill="#fbbf24" opacity="0.7"/>
    <rect x="1180" y="660" width="40" height="40" fill="#fbbf24" opacity="0.6"/>
    <!-- chimney -->
    <rect x="1170" y="450" width="22" height="50" fill="#5c2a1a"/>
  </g>

  <!-- A few lamp dots along the path -->
  <circle cx="640" cy="745" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="780" cy="725" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="920" cy="735" r="5" fill="#fbbf24" opacity="0.9"/>

  <!-- Faint stars in the upper sky (decorative, outside hero) -->
  <circle cx="200" cy="120" r="2" fill="#fef3ec" opacity="0.7"/>
  <circle cx="350" cy="200" r="1.5" fill="#fef3ec" opacity="0.6"/>
  <circle cx="1300" cy="150" r="2" fill="#fef3ec" opacity="0.7"/>
  <circle cx="1450" cy="220" r="1.5" fill="#fef3ec" opacity="0.6"/>
  <circle cx="1100" cy="110" r="1.5" fill="#fef3ec" opacity="0.5"/>
</svg>
