<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#faf8f2" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="620" ry="380" fill="url(#glow)"/>

  <!-- shelf rails (decoration) -->
  <rect x="180" y="232" width="1240" height="2" fill="#78350f" opacity="0.18"/>
  <rect x="180" y="452" width="1240" height="2" fill="#78350f" opacity="0.18"/>
  <rect x="180" y="672" width="1240" height="2" fill="#78350f" opacity="0.18"/>

  <!-- row 1: top shelf tiles -->
  <g opacity="0.85">
    <rect x="220" y="140" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <circle cx="245" cy="170" r="10" fill="#c2410c" opacity="0.7"/>
    <rect x="265" y="165" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="265" y="178" width="55" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="395" y="140" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <rect x="415" y="160" width="20" height="20" rx="3" fill="#0e7490" opacity="0.7"/>
    <rect x="445" y="165" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="445" y="178" width="60" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="570" y="140" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <polygon points="595,180 605,160 615,180" fill="#c2410c" opacity="0.7"/>
    <rect x="625" y="165" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="625" y="178" width="50" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="880" y="140" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <circle cx="905" cy="170" r="10" fill="#0e7490" opacity="0.7"/>
    <rect x="925" y="165" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="925" y="178" width="55" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="1055" y="140" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <rect x="1075" y="160" width="20" height="20" rx="3" fill="#c2410c" opacity="0.7"/>
    <rect x="1105" y="165" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="1105" y="178" width="60" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="1230" y="140" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <polygon points="1255,180 1265,160 1275,180" fill="#0e7490" opacity="0.7"/>
    <rect x="1285" y="165" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="1285" y="178" width="50" height="5" rx="2" fill="#78350f" opacity="0.18"/>
  </g>

  <!-- row 3: bottom shelf tiles -->
  <g opacity="0.85">
    <rect x="220" y="710" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <circle cx="245" cy="740" r="10" fill="#0e7490" opacity="0.7"/>
    <rect x="265" y="735" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="265" y="748" width="55" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="395" y="710" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <polygon points="420,750 430,730 440,750" fill="#c2410c" opacity="0.7"/>
    <rect x="450" y="735" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="450" y="748" width="50" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="570" y="710" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <rect x="590" y="730" width="20" height="20" rx="3" fill="#c2410c" opacity="0.7"/>
    <rect x="620" y="735" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="620" y="748" width="60" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="880" y="710" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <polygon points="905,750 915,730 925,750" fill="#0e7490" opacity="0.7"/>
    <rect x="935" y="735" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="935" y="748" width="50" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="1055" y="710" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <circle cx="1080" cy="740" r="10" fill="#c2410c" opacity="0.7"/>
    <rect x="1100" y="735" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="1100" y="748" width="55" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="1230" y="710" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <rect x="1250" y="730" width="20" height="20" rx="3" fill="#0e7490" opacity="0.7"/>
    <rect x="1280" y="735" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="1280" y="748" width="60" height="5" rx="2" fill="#78350f" opacity="0.18"/>
  </g>

  <!-- middle row side tiles (flanking hero) -->
  <g opacity="0.7">
    <rect x="220" y="425" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <circle cx="245" cy="455" r="10" fill="#c2410c" opacity="0.7"/>
    <rect x="265" y="450" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="265" y="463" width="55" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="395" y="425" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <rect x="415" y="445" width="20" height="20" rx="3" fill="#0e7490" opacity="0.7"/>
    <rect x="445" y="450" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="445" y="463" width="60" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="1055" y="425" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <polygon points="1080,465 1090,445 1100,465" fill="#c2410c" opacity="0.7"/>
    <rect x="1110" y="450" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="1110" y="463" width="50" height="5" rx="2" fill="#78350f" opacity="0.18"/>

    <rect x="1230" y="425" width="150" height="90" rx="8" fill="url(#tile)" stroke="#78350f" stroke-opacity="0.25"/>
    <circle cx="1255" cy="455" r="10" fill="#0e7490" opacity="0.7"/>
    <rect x="1275" y="450" width="80" height="5" rx="2" fill="#78350f" opacity="0.25"/>
    <rect x="1275" y="463" width="55" height="5" rx="2" fill="#78350f" opacity="0.18"/>
  </g>

  <!-- hero: terminal-prompt tile at center -->
  <g>
    <rect x="620" y="345" width="360" height="240" rx="18" fill="#1a0e0e" opacity="0.95"/>
    <rect x="620" y="345" width="360" height="36" rx="18" fill="#5c2a1a" opacity="0.9"/>
    <rect x="620" y="370" width="360" height="11" fill="#5c2a1a" opacity="0.9"/>
    <circle cx="642" cy="363" r="6" fill="#c2410c"/>
    <circle cx="662" cy="363" r="6" fill="#d97706"/>
    <circle cx="682" cy="363" r="6" fill="#fbbf24"/>
    <!-- the slash mark -->
    <path d="M 760 540 L 840 410" stroke="url(#hero)" stroke-width="28" stroke-linecap="round"/>
    <!-- cursor block -->
    <rect x="855" y="510" width="22" height="34" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>
