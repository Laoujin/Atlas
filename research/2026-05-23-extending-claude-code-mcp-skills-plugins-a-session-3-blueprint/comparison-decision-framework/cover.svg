<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="rustDeep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="muted" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4c5a8"/>
      <stop offset="1" stop-color="#b8a684"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft glow behind the chosen row -->
  <ellipse cx="800" cy="615" rx="620" ry="120" fill="url(#glow)"/>

  <!-- matrix frame (hero, centered ~800,450, within safe zone) -->
  <g transform="translate(380,210)">
    <!-- outer card -->
    <rect x="0" y="0" width="840" height="480" rx="14" fill="#fef3ec" stroke="#78350f" stroke-opacity="0.18" stroke-width="2"/>

    <!-- left "axis label" column (decorative blocks, no text) -->
    <rect x="30"  y="60"  width="120" height="22" rx="4" fill="#78350f" opacity="0.35"/>
    <rect x="30"  y="160" width="120" height="22" rx="4" fill="#78350f" opacity="0.35"/>
    <rect x="30"  y="260" width="120" height="22" rx="4" fill="#78350f" opacity="0.35"/>
    <rect x="30"  y="360" width="120" height="22" rx="4" fill="#78350f" opacity="0.35"/>

    <!-- weighted score bars per row (muted, three candidate options stacked) -->
    <!-- row 1 -->
    <rect x="180" y="52"  width="360" height="14" rx="3" fill="url(#muted)" opacity="0.7"/>
    <rect x="180" y="70"  width="240" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>
    <rect x="180" y="88"  width="300" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>
    <!-- row 2 -->
    <rect x="180" y="152" width="280" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>
    <rect x="180" y="170" width="420" height="14" rx="3" fill="url(#muted)" opacity="0.7"/>
    <rect x="180" y="188" width="200" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>
    <!-- row 3 -->
    <rect x="180" y="252" width="320" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>
    <rect x="180" y="270" width="260" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>
    <rect x="180" y="288" width="400" height="14" rx="3" fill="url(#muted)" opacity="0.7"/>
    <!-- row 4 -->
    <rect x="180" y="352" width="220" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>
    <rect x="180" y="370" width="340" height="14" rx="3" fill="url(#muted)" opacity="0.7"/>
    <rect x="180" y="388" width="280" height="14" rx="3" fill="url(#muted)" opacity="0.55"/>

    <!-- weight pips on the right (four rows, varying weight) -->
    <g fill="#9a3309" opacity="0.85">
      <circle cx="700" cy="73"  r="7"/>
      <circle cx="724" cy="73"  r="7"/>
      <circle cx="748" cy="73"  r="7"/>

      <circle cx="700" cy="173" r="7"/>
      <circle cx="724" cy="173" r="7"/>

      <circle cx="700" cy="273" r="7"/>
      <circle cx="724" cy="273" r="7"/>
      <circle cx="748" cy="273" r="7"/>
      <circle cx="772" cy="273" r="7"/>

      <circle cx="700" cy="373" r="7"/>
      <circle cx="724" cy="373" r="7"/>
    </g>

    <!-- the chosen total bar — hero accent across the bottom -->
    <rect x="30" y="420" width="780" height="36" rx="8" fill="url(#rustDeep)" opacity="0.18"/>
    <rect x="30" y="420" width="560" height="36" rx="8" fill="url(#rust)"/>
    <!-- decisive marker (chevron/arrow tip pointing to the winning total) -->
    <polygon points="595,420 640,438 595,456" fill="#9a3309"/>
  </g>

  <!-- decorative corner ticks (outside safe zone, ok to crop) -->
  <g stroke="#78350f" stroke-width="2" opacity="0.35" fill="none">
    <path d="M40,40 L40,90 M40,40 L90,40"/>
    <path d="M1560,40 L1560,90 M1560,40 L1510,40"/>
    <path d="M40,860 L40,810 M40,860 L90,860"/>
    <path d="M1560,860 L1560,810 M1560,860 L1510,860"/>
  </g>
</svg>
