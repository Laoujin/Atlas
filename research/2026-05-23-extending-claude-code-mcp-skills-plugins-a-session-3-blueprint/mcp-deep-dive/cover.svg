<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="rustDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0b5566"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Left block: host/client (rust, plug) -->
  <g opacity="0.95">
    <rect x="320" y="320" width="380" height="260" rx="14" fill="url(#rust)"/>
    <rect x="700" y="380" width="80" height="40" fill="url(#rust)"/>
    <rect x="700" y="460" width="80" height="40" fill="url(#rust)"/>
    <!-- inner faint bars (JSON-RPC lines, decorative) -->
    <rect x="350" y="360" width="220" height="6" rx="3" fill="#fef3ec" opacity="0.55"/>
    <rect x="350" y="380" width="160" height="6" rx="3" fill="#fef3ec" opacity="0.4"/>
    <rect x="350" y="510" width="200" height="6" rx="3" fill="#fef3ec" opacity="0.45"/>
    <rect x="350" y="530" width="140" height="6" rx="3" fill="#fef3ec" opacity="0.35"/>
  </g>

  <!-- Right block: server (teal, port/receptacle) -->
  <g opacity="0.92">
    <rect x="900" y="320" width="380" height="260" rx="14" fill="url(#teal)"/>
    <!-- receptacle slots -->
    <rect x="900" y="380" width="80" height="40" fill="#faf8f2" opacity="0.18"/>
    <rect x="900" y="460" width="80" height="40" fill="#faf8f2" opacity="0.18"/>
    <!-- six primitive dots (right side) -->
    <g fill="#fbbf24" opacity="0.85">
      <circle cx="1210" cy="370" r="9"/>
      <circle cx="1240" cy="370" r="9"/>
      <circle cx="1210" cy="400" r="9"/>
      <circle cx="1240" cy="400" r="9"/>
      <circle cx="1210" cy="430" r="9"/>
      <circle cx="1240" cy="430" r="9"/>
    </g>
    <rect x="930" y="510" width="180" height="6" rx="3" fill="#faf8f2" opacity="0.5"/>
    <rect x="930" y="530" width="130" height="6" rx="3" fill="#faf8f2" opacity="0.35"/>
  </g>

  <!-- Spark / connection glow between plug and port -->
  <ellipse cx="840" cy="450" rx="120" ry="80" fill="url(#spark)"/>
  <circle cx="840" cy="450" r="14" fill="#fbbf24" opacity="0.95"/>

  <!-- Connector trace lines -->
  <g stroke="#c2410c" stroke-width="3" opacity="0.7" fill="none">
    <path d="M780 400 Q820 400 840 436"/>
    <path d="M780 480 Q820 480 840 464"/>
  </g>
  <g stroke="#0e7490" stroke-width="3" opacity="0.7" fill="none">
    <path d="M900 400 Q860 400 844 436"/>
    <path d="M900 480 Q860 480 844 464"/>
  </g>

  <!-- Decorative corner ticks (outside safe zone, harmless if cropped) -->
  <g fill="#9a3309" opacity="0.25">
    <rect x="60" y="60" width="40" height="4"/>
    <rect x="60" y="60" width="4" height="40"/>
    <rect x="1500" y="836" width="40" height="4"/>
    <rect x="1536" y="800" width="4" height="40"/>
  </g>
</svg>
