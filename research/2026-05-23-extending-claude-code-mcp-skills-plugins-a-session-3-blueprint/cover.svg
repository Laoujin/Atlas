<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="rustFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0a4f63"/>
    </linearGradient>
    <linearGradient id="tealFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0a4f63"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Faint corner decoration: orbit hints suggesting ecosystem -->
  <circle cx="120" cy="120" r="180" fill="none" stroke="#c2410c" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1480" cy="780" r="220" fill="none" stroke="#0e7490" stroke-opacity="0.08" stroke-width="2"/>

  <!-- LEFT BLOCK (rust) — the agent core, with a port socket on its right -->
  <g opacity="0.95">
    <!-- top face -->
    <polygon points="380,360 720,360 760,400 420,400" fill="#fbbf24" opacity="0.85"/>
    <!-- front face -->
    <polygon points="380,360 380,600 720,600 720,360" fill="url(#rustFace)"/>
    <!-- right side -->
    <polygon points="720,360 760,400 760,640 720,600" fill="#5c2a1a" opacity="0.9"/>
    <!-- bottom shadow edge -->
    <polygon points="380,600 720,600 760,640 420,640" fill="#3a1a0a" opacity="0.7"/>

    <!-- protrusion (plug) on the right face -->
    <rect x="720" y="445" width="60" height="70" fill="url(#rust)"/>
    <polygon points="780,445 800,425 800,495 780,515" fill="#78350f"/>
    <polygon points="720,445 780,445 800,425 740,425" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- Spark / connection glow between the two blocks -->
  <circle cx="800" cy="480" r="120" fill="url(#spark)"/>
  <circle cx="800" cy="480" r="14" fill="#fef3ec" opacity="0.95"/>
  <circle cx="800" cy="480" r="6" fill="#fbbf24"/>

  <!-- RIGHT BLOCK (teal) — the extension (MCP server / Skill / Plugin), with a recessed port -->
  <g opacity="0.92">
    <!-- top face -->
    <polygon points="880,360 1220,360 1260,400 920,400" fill="#3aa3bd" opacity="0.7"/>
    <!-- front face -->
    <polygon points="880,360 880,600 1220,600 1220,360" fill="url(#tealFace)"/>
    <!-- right side -->
    <polygon points="1220,360 1260,400 1260,640 1220,600" fill="#0a3a4a" opacity="0.9"/>
    <!-- bottom shadow edge -->
    <polygon points="880,600 1220,600 1260,640 920,640" fill="#062a36" opacity="0.7"/>

    <!-- recessed socket on left face (where rust plug enters) -->
    <rect x="880" y="445" width="36" height="70" fill="#062a36" opacity="0.95"/>
    <rect x="880" y="455" width="36" height="6" fill="#0e7490" opacity="0.8"/>
    <rect x="880" y="475" width="36" height="6" fill="#0e7490" opacity="0.8"/>
    <rect x="880" y="495" width="36" height="6" fill="#0e7490" opacity="0.8"/>

    <!-- faint interior bars suggesting modules/capabilities -->
    <rect x="920" y="400" width="260" height="8" fill="#fef3ec" opacity="0.18"/>
    <rect x="920" y="430" width="180" height="6" fill="#fef3ec" opacity="0.14"/>
    <rect x="920" y="540" width="220" height="6" fill="#fef3ec" opacity="0.14"/>
    <rect x="920" y="560" width="140" height="6" fill="#fef3ec" opacity="0.14"/>
  </g>

  <!-- Small satellite blocks behind, suggesting the marketplace ecosystem -->
  <g opacity="0.45">
    <rect x="280" y="220" width="90" height="60" fill="#c2410c"/>
    <polygon points="280,220 370,220 390,205 300,205" fill="#fbbf24"/>
    <polygon points="370,220 370,280 390,265 390,205" fill="#78350f"/>
  </g>
  <g opacity="0.4">
    <rect x="1260" y="700" width="100" height="65" fill="#0e7490"/>
    <polygon points="1260,700 1360,700 1380,685 1280,685" fill="#3aa3bd"/>
    <polygon points="1360,700 1360,765 1380,750 1380,685" fill="#0a3a4a"/>
  </g>
  <g opacity="0.35">
    <rect x="180" y="700" width="80" height="55" fill="#9a3309"/>
    <polygon points="180,700 260,700 278,687 198,687" fill="#d97706"/>
    <polygon points="260,700 260,755 278,742 278,687" fill="#5c2a1a"/>
  </g>
</svg>
