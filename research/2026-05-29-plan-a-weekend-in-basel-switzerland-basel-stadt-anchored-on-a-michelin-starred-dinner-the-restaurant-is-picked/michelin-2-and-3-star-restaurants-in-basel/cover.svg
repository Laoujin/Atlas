<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="80%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d9cfb8"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="92%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="96%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="sauce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="60%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="garnish" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Plate (hero, centered ~800,450) -->
  <ellipse cx="800" cy="470" rx="40" ry="10" fill="#000" opacity="0.5"/>
  <circle cx="800" cy="450" r="290" fill="url(#plate)" opacity="0.97"/>
  <circle cx="800" cy="450" r="290" fill="url(#rim)" opacity="0.85"/>
  <circle cx="800" cy="450" r="225" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.35"/>

  <!-- Sauce swoosh - rose accent -->
  <path d="M 640 510 Q 760 430 880 470 Q 960 500 940 540 Q 880 580 780 560 Q 680 545 640 510 Z"
        fill="#be185d" opacity="0.55"/>
  <path d="M 660 505 Q 770 445 870 475 Q 935 500 920 530 Q 870 560 780 548 Q 695 535 660 505 Z"
        fill="#9a3309" opacity="0.65"/>

  <!-- Centerpiece quenelle / composed element -->
  <ellipse cx="790" cy="440" rx="85" ry="42" fill="url(#sauce)" opacity="0.92"/>
  <ellipse cx="785" cy="430" rx="70" ry="28" fill="#d97706" opacity="0.75"/>
  <ellipse cx="785" cy="425" rx="50" ry="16" fill="#fbbf24" opacity="0.6"/>

  <!-- Garnish dots and microgreens -->
  <circle cx="710" cy="420" r="7" fill="url(#garnish)" opacity="0.9"/>
  <circle cx="870" cy="465" r="6" fill="url(#garnish)" opacity="0.9"/>
  <circle cx="730" cy="490" r="5" fill="#be185d" opacity="0.85"/>
  <circle cx="855" cy="410" r="5" fill="#be185d" opacity="0.85"/>
  <circle cx="820" cy="395" r="4" fill="#fbbf24" opacity="0.95"/>
  <circle cx="755" cy="465" r="4" fill="#fbbf24" opacity="0.9"/>

  <!-- Sauce dots scattered -->
  <circle cx="650" cy="445" r="3" fill="#c2410c" opacity="0.7"/>
  <circle cx="935" cy="430" r="3" fill="#c2410c" opacity="0.7"/>
  <circle cx="910" cy="495" r="2.5" fill="#c2410c" opacity="0.6"/>
  <circle cx="675" cy="490" r="2.5" fill="#c2410c" opacity="0.6"/>

  <!-- Single Michelin star - subtle, top-right corner of safe zone -->
  <g transform="translate(1130 230)" opacity="0.85">
    <path d="M 0 -42 L 12 -13 L 43 -13 L 18 6 L 28 36 L 0 18 L -28 36 L -18 6 L -43 -13 L -12 -13 Z"
          fill="url(#garnish)"/>
    <path d="M 0 -42 L 12 -13 L 43 -13 L 18 6 L 28 36 L 0 18 L -28 36 L -18 6 L -43 -13 L -12 -13 Z"
          fill="none" stroke="#c2410c" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Faint orbit ring tying star to plate composition -->
  <circle cx="800" cy="450" r="380" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.12"/>
</svg>
