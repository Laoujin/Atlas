<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plate" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.7" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.86" stop-color="#78350f" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="640" r="380" fill="url(#sun)"/>

  <!-- Distant skyline silhouette along the horizon -->
  <g fill="#1a0e0e" opacity="0.78">
    <rect x="0" y="640" width="1600" height="40"/>
    <polygon points="120,640 160,580 200,640"/>
    <rect x="240" y="600" width="60" height="40"/>
    <rect x="320" y="560" width="40" height="80"/>
    <polygon points="360,560 380,520 400,560"/>
    <rect x="440" y="590" width="80" height="50"/>
    <rect x="540" y="540" width="50" height="100"/>
    <polygon points="540,540 565,500 590,540"/>
    <rect x="1020" y="570" width="70" height="70"/>
    <rect x="1110" y="540" width="40" height="100"/>
    <polygon points="1110,540 1130,505 1150,540"/>
    <rect x="1180" y="595" width="90" height="45"/>
    <rect x="1290" y="555" width="55" height="85"/>
    <polygon points="1360,640 1390,590 1420,640"/>
    <rect x="1440" y="610" width="70" height="30"/>
  </g>

  <!-- Hero: plate centered around (800, 470) -->
  <ellipse cx="820" cy="500" rx="340" ry="60" fill="#1a0e0e" opacity="0.35"/>
  <circle cx="800" cy="470" r="280" fill="url(#plate)"/>
  <circle cx="800" cy="470" r="280" fill="url(#rim)"/>
  <circle cx="800" cy="470" r="225" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.55"/>

  <!-- Small plated morsel: stacked rust dots offset slightly -->
  <circle cx="785" cy="465" r="42" fill="#9a3309" opacity="0.85"/>
  <circle cx="810" cy="455" r="22" fill="#fbbf24" opacity="0.9"/>
  <circle cx="775" cy="485" r="14" fill="#78350f" opacity="0.8"/>

  <!-- Fork resting across the plate at a slight angle -->
  <g transform="translate(800 470) rotate(28)" fill="#faf8f2" opacity="0.92">
    <rect x="-12" y="-260" width="24" height="160" rx="6"/>
    <rect x="-44" y="-260" width="10" height="80" rx="4"/>
    <rect x="-22" y="-260" width="10" height="80" rx="4"/>
    <rect x="0" y="-260" width="10" height="80" rx="4"/>
    <rect x="22" y="-260" width="10" height="80" rx="4"/>
    <rect x="-8" y="-100" width="16" height="280" rx="8"/>
  </g>
</svg>
