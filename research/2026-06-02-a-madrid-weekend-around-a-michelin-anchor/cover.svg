<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1208"/>
    </linearGradient>
    <!-- Warm candlelight radial glow at center -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate rim gradient — left plate -->
    <radialGradient id="plateLeft" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Plate rim gradient — right plate -->
    <radialGradient id="plateRight" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Inner plate surface gradient -->
    <radialGradient id="innerPlate" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </radialGradient>
    <!-- Rose accent glow for wine -->
    <radialGradient id="wineGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Table surface gradient -->
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a0a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Candlelight ambient glow -->
  <rect width="1600" height="900" fill="url(#glowCenter)"/>

  <!-- Table surface — lower portion -->
  <ellipse cx="800" cy="780" rx="900" ry="200" fill="url(#tableGrad)" opacity="0.85"/>

  <!-- Layer 2: Hero element — two fine-dining plates centered in safe zone -->

  <!-- Left plate shadow -->
  <ellipse cx="640" cy="490" rx="195" ry="22" fill="#0a0504" opacity="0.55"/>
  <!-- Left plate rim -->
  <circle cx="640" cy="445" r="190" fill="url(#plateLeft)" opacity="0.92"/>
  <!-- Left plate inner well -->
  <circle cx="640" cy="438" r="148" fill="url(#innerPlate)" opacity="0.95"/>
  <!-- Left plate — tiny food accent dot (amuse-bouche suggestion) -->
  <circle cx="640" cy="435" r="28" fill="#c2410c" opacity="0.75"/>
  <circle cx="640" cy="432" r="14" fill="#d97706" opacity="0.85"/>
  <!-- Sauce stroke on left plate -->
  <path d="M 598 448 Q 630 418 668 452" stroke="#9a3309" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Right plate shadow -->
  <ellipse cx="960" cy="490" rx="195" ry="22" fill="#0a0504" opacity="0.55"/>
  <!-- Right plate rim -->
  <circle cx="960" cy="445" r="190" fill="url(#plateRight)" opacity="0.92"/>
  <!-- Right plate inner well -->
  <circle cx="960" cy="438" r="148" fill="url(#innerPlate)" opacity="0.95"/>
  <!-- Right plate — food accent (main course suggestion) -->
  <ellipse cx="960" cy="438" rx="42" ry="22" fill="#78350f" opacity="0.8"/>
  <ellipse cx="960" cy="432" rx="30" ry="14" fill="#c2410c" opacity="0.75"/>
  <ellipse cx="958" cy="428" rx="16" ry="8" fill="#d97706" opacity="0.8"/>
  <!-- Herb dot accent -->
  <circle cx="992" cy="420" r="6" fill="#9a3309" opacity="0.9"/>
  <circle cx="932" cy="455" r="5" fill="#9a3309" opacity="0.8"/>

  <!-- Layer 2b: Wine glass silhouette — centered between and slightly above plates -->
  <!-- Wine glow halo -->
  <ellipse cx="800" cy="310" rx="80" ry="120" fill="url(#wineGlow)" opacity="0.8"/>
  <!-- Glass stem -->
  <rect x="795" y="390" width="10" height="95" rx="4" fill="#fef3ec" opacity="0.65"/>
  <!-- Glass base foot -->
  <ellipse cx="800" cy="488" rx="38" ry="8" fill="#fef3ec" opacity="0.55"/>
  <!-- Glass bowl outline -->
  <path d="M 755 240 Q 745 310 760 365 Q 775 390 800 392 Q 825 390 840 365 Q 855 310 845 240 Z"
        fill="#be185d" fill-opacity="0.22" stroke="#fef3ec" stroke-width="2.5" stroke-opacity="0.5"/>
  <!-- Wine fill in glass -->
  <path d="M 763 320 Q 760 355 773 372 Q 786 388 800 390 Q 814 388 827 372 Q 840 355 837 320 Z"
        fill="#be185d" opacity="0.55"/>
  <!-- Glass highlight -->
  <path d="M 762 265 Q 758 300 762 340" stroke="#faf8f2" stroke-width="2" fill="none" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Layer 3: Edge decorations (may be cropped — no meaning carried here) -->
  <!-- Soft rust vignette corners -->
  <radialGradient id="vigTL" cx="0%" cy="0%" r="50%">
    <stop offset="0%" stop-color="#9a3309" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vigBR" cx="100%" cy="100%" r="50%">
    <stop offset="0%" stop-color="#78350f" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vigTL)"/>
  <rect width="1600" height="900" fill="url(#vigBR)"/>

  <!-- Subtle star-dot accents — low opacity atmospheric -->
  <circle cx="200" cy="150" r="2" fill="#fbbf24" opacity="0.3"/>
  <circle cx="380" cy="95" r="1.5" fill="#fbbf24" opacity="0.25"/>
  <circle cx="1420" cy="130" r="2" fill="#fbbf24" opacity="0.3"/>
  <circle cx="1250" cy="80" r="1.5" fill="#fbbf24" opacity="0.2"/>
  <circle cx="150" cy="720" r="2" fill="#d97706" opacity="0.2"/>
  <circle cx="1460" cy="740" r="2" fill="#d97706" opacity="0.2"/>
</svg>
