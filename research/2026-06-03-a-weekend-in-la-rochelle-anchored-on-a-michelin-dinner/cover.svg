<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1510"/>
    </linearGradient>
    <!-- Warm candlelight radial glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill gradient -->
    <radialGradient id="plateMain" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d6c9b0"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="plateWell" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#e8d9c4"/>
    </radialGradient>
    <!-- Rose accent for sauce/garnish -->
    <radialGradient id="sauce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Table surface gradient -->
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Atmospheric wide glow centered on hero -->
  <ellipse cx="800" cy="450" rx="680" ry="420" fill="url(#glow)" opacity="0.9"/>

  <!-- Layer 2: Hero — dinner plate composition centered at (800, 450) -->

  <!-- Table surface suggestion at bottom of hero -->
  <rect x="125" y="640" width="1350" height="180" rx="4" fill="url(#table)" opacity="0.85"/>

  <!-- Main plate outer rim — hero circle -->
  <circle cx="800" cy="460" r="240" fill="url(#plateMain)" opacity="0.92"/>
  <!-- Plate rim highlight arc top -->
  <circle cx="800" cy="460" r="240" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Plate inner well -->
  <circle cx="800" cy="460" r="190" fill="url(#plateWell)" opacity="0.88"/>

  <!-- Sauce / garnish arc — rose accent, abstract brush stroke feel -->
  <ellipse cx="800" cy="468" rx="95" ry="60" fill="url(#sauce)" opacity="0.78"/>
  <!-- Small sauce highlight -->
  <ellipse cx="772" cy="452" rx="28" ry="18" fill="#fbbf24" opacity="0.32"/>

  <!-- Two small round accent dots (herbs / micro garnish) -->
  <circle cx="845" cy="430" r="10" fill="#78350f" opacity="0.8"/>
  <circle cx="756" cy="448" r="7" fill="#9a3309" opacity="0.7"/>
  <circle cx="822" cy="500" r="6" fill="#c2410c" opacity="0.65"/>

  <!-- Wine glass silhouette — right of plate -->
  <!-- Bowl -->
  <ellipse cx="1095" cy="500" rx="42" ry="58" fill="url(#glass)" opacity="0.72"/>
  <!-- Stem -->
  <rect x="1091" y="555" width="8" height="100" rx="4" fill="#fbbf24" opacity="0.28"/>
  <!-- Base -->
  <ellipse cx="1095" cy="655" rx="36" ry="9" fill="#d97706" opacity="0.35"/>
  <!-- Wine level inside glass -->
  <ellipse cx="1095" cy="526" rx="34" ry="22" fill="#be185d" opacity="0.45"/>

  <!-- Second smaller plate suggestion — left, slightly behind -->
  <circle cx="555" cy="530" r="155" fill="#f0eadb" opacity="0.30"/>
  <circle cx="555" cy="530" r="155" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.22"/>
  <circle cx="555" cy="530" r="120" fill="#fef3ec" opacity="0.22"/>

  <!-- Layer 3: Edge atmosphere — nocturnal harbor light shafts (decorative, outside safe zone) -->
  <rect x="0" y="0" width="1600" height="90" fill="url(#bg)" opacity="0.6"/>
  <rect x="0" y="810" width="1600" height="90" fill="#1a0e0e" opacity="0.5"/>

  <!-- Subtle warm top rim light -->
  <ellipse cx="800" cy="0" rx="600" ry="120" fill="#d97706" opacity="0.07"/>
</svg>
