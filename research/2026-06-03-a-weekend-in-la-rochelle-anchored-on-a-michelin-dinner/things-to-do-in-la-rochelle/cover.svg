<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- warm sun glow behind the harbour mouth -->
  <ellipse cx="800" cy="430" rx="520" ry="360" fill="url(#sun)"/>
  <!-- water -->
  <rect y="600" width="1600" height="300" fill="url(#water)"/>

  <!-- left harbour tower -->
  <g fill="url(#stone)" opacity="0.95">
    <rect x="430" y="280" width="150" height="340"/>
    <rect x="412" y="250" width="186" height="44"/>
    <path d="M414 250 L505 150 L596 250 Z"/>
  </g>
  <rect x="485" y="360" width="40" height="80" rx="20" fill="#1a0e0e" opacity="0.45"/>

  <!-- right harbour tower (taller hero) -->
  <g fill="url(#stone)" opacity="0.95">
    <rect x="1010" y="240" width="170" height="380"/>
    <rect x="990" y="208" width="210" height="46"/>
    <path d="M992 208 L1095 100 L1198 208 Z"/>
  </g>
  <rect x="1072" y="330" width="46" height="92" rx="23" fill="#1a0e0e" opacity="0.45"/>

  <!-- sailboat between the towers -->
  <g opacity="0.92">
    <path d="M760 600 L860 600 L838 656 L782 656 Z" fill="#9a3309"/>
    <path d="M810 230 L810 595 L702 595 Z" fill="#faf8f2" opacity="0.92"/>
    <path d="M820 300 L820 595 L912 595 Z" fill="#fef3ec" opacity="0.85"/>
    <rect x="808" y="220" width="6" height="380" fill="#78350f"/>
  </g>

  <!-- water reflection ripples -->
  <g fill="#fef3ec" opacity="0.4">
    <rect x="700" y="690" width="220" height="8" rx="4"/>
    <rect x="430" y="730" width="160" height="7" rx="3"/>
    <rect x="1010" y="715" width="180" height="7" rx="3"/>
  </g>
</svg>
