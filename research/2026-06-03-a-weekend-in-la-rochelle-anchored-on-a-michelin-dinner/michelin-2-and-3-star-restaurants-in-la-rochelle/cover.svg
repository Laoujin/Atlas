<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm table-light radial glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient — porcelain sheen -->
    <radialGradient id="plate-main" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="70%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d1c4b0"/>
    </radialGradient>
    <!-- Inner plate well -->
    <radialGradient id="plate-well" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.08"/>
    </radialGradient>
    <!-- Second plate (smaller, left) -->
    <radialGradient id="plate2" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c9b89e"/>
    </radialGradient>
    <!-- Glass gradient -->
    <linearGradient id="glass-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#fef3ec" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <!-- Rim highlight -->
    <linearGradient id="rim-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.0"/>
      <stop offset="45%" stop-color="#fef3ec" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: warm table glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — table composition centered ~(800, 450) -->

  <!-- Tablecloth suggestion: soft ellipse base -->
  <ellipse cx="800" cy="620" rx="640" ry="80" fill="#78350f" opacity="0.45"/>
  <ellipse cx="800" cy="620" rx="580" ry="60" fill="#9a3309" opacity="0.25"/>

  <!-- Secondary plate (left, slightly recessed) -->
  <ellipse cx="590" cy="505" rx="138" ry="18" fill="#3d1a0a" opacity="0.55"/>
  <circle cx="590" cy="482" r="145" fill="url(#plate2)" opacity="0.82"/>
  <circle cx="590" cy="482" r="118" fill="none" stroke="#c9b89e" stroke-width="3" opacity="0.5"/>
  <circle cx="590" cy="482" r="95" fill="url(#plate-well)" opacity="0.6"/>
  <!-- Small food accent on second plate: three dots -->
  <circle cx="577" cy="472" r="9" fill="#c2410c" opacity="0.75"/>
  <circle cx="595" cy="465" r="6" fill="#9a3309" opacity="0.65"/>
  <circle cx="608" cy="478" r="7" fill="#d97706" opacity="0.6"/>

  <!-- Main hero plate shadow -->
  <ellipse cx="803" cy="548" rx="192" ry="24" fill="#1a0e0e" opacity="0.65"/>

  <!-- Main hero plate -->
  <circle cx="803" cy="490" r="200" fill="url(#plate-main)" opacity="0.93"/>
  <!-- Plate rim ring -->
  <circle cx="803" cy="490" r="200" fill="none" stroke="url(#rim-shine)" stroke-width="5" opacity="0.8"/>
  <circle cx="803" cy="490" r="194" fill="none" stroke="#d1c4b0" stroke-width="1.5" opacity="0.5"/>
  <!-- Inner plate well -->
  <circle cx="803" cy="490" r="158" fill="url(#plate-well)" opacity="0.9"/>
  <!-- Subtle inner rim -->
  <circle cx="803" cy="490" r="158" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.2"/>

  <!-- Food on main plate: elegant composition — seared element center, sauce arc, herb dot -->
  <!-- Central seared piece (fish / scallop silhouette) -->
  <ellipse cx="803" cy="482" rx="52" ry="34" fill="#9a3309" opacity="0.88"/>
  <ellipse cx="803" cy="478" rx="44" ry="26" fill="#c2410c" opacity="0.75"/>
  <ellipse cx="803" cy="476" rx="32" ry="16" fill="#d97706" opacity="0.55"/>
  <!-- Sauce arc on plate -->
  <path d="M 730 510 Q 803 540 876 510" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 742 514 Q 803 538 864 514" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Herb / garnish dot cluster -->
  <circle cx="840" cy="455" r="5" fill="#9a3309" opacity="0.7"/>
  <circle cx="850" cy="462" r="3.5" fill="#78350f" opacity="0.6"/>
  <circle cx="760" cy="460" r="4" fill="#9a3309" opacity="0.65"/>

  <!-- Wine glass (right of main plate, inside safe zone) -->
  <!-- Glass bowl -->
  <path d="M 1055 310 Q 1110 390 1100 460 Q 1090 510 1040 520 Q 990 510 980 460 Q 970 390 1025 310 Z"
        fill="url(#glass-body)" opacity="0.68"/>
  <!-- Glass bowl highlight -->
  <path d="M 1062 325 Q 1085 395 1080 450"
        fill="none" stroke="#fef3ec" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- Glass stem -->
  <rect x="1036" y="518" width="8" height="110" rx="4" fill="#fbbf24" opacity="0.5"/>
  <!-- Glass base -->
  <ellipse cx="1040" cy="632" rx="38" ry="8" fill="#fbbf24" opacity="0.4"/>
  <!-- Glass rim ellipse -->
  <ellipse cx="1040" cy="312" rx="38" ry="7" fill="none" stroke="#fef3ec" stroke-width="2.5" opacity="0.5"/>
  <!-- Wine fill suggestion inside bowl -->
  <path d="M 985 455 Q 990 510 1040 520 Q 1090 510 1095 455 Z"
        fill="#9a3309" opacity="0.45"/>

  <!-- Layer 3: edge decoration (outside safe zone, atmospheric) -->
  <!-- Corner vignette top-left -->
  <radialGradient id="vign-tl" cx="0%" cy="0%" r="55%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vign-tl)"/>

  <!-- Corner vignette bottom-right -->
  <radialGradient id="vign-br" cx="100%" cy="100%" r="55%">
    <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vign-br)"/>
</svg>
