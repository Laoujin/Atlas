<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration outside safe zone -->
  <circle cx="80" cy="60" r="120" fill="#fbbf24" opacity="0.12"/>
  <circle cx="1540" cy="850" r="150" fill="#c2410c" opacity="0.10"/>

  <!-- root block -->
  <path d="M700 760 L900 760 L920 690 L680 690 Z" fill="url(#root)" opacity="0.92"/>

  <!-- spark/arc between the two diverging towers -->
  <circle cx="800" cy="470" r="120" fill="url(#spark)" opacity="0.85"/>
  <path d="M620 540 Q800 360 980 540" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- left tower (.com fork) — stacked blocks leaning left -->
  <g opacity="0.92">
    <path d="M560 680 L740 660 L740 600 L560 620 Z" fill="url(#left)"/>
    <path d="M470 620 L660 600 L660 540 L470 560 Z" fill="url(#left)"/>
    <path d="M390 560 L590 540 L590 480 L390 500 Z" fill="url(#left)"/>
    <path d="M320 500 L530 480 L530 420 L320 440 Z" fill="url(#left)"/>
  </g>

  <!-- right tower (.be fork) — stacked blocks leaning right -->
  <g opacity="0.92">
    <path d="M860 660 L1040 680 L1040 620 L860 600 Z" fill="url(#right)"/>
    <path d="M940 600 L1130 620 L1130 560 L940 540 Z" fill="url(#right)"/>
    <path d="M1010 540 L1210 560 L1210 500 L1010 480 Z" fill="url(#right)"/>
    <path d="M1070 480 L1280 500 L1280 440 L1070 420 Z" fill="url(#right)"/>
  </g>
</svg>
