<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.45" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1208"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="windowSpill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon glow + moon (upper-left of hero zone) -->
  <circle cx="430" cy="260" r="220" fill="url(#moonGlow)"/>
  <circle cx="430" cy="260" r="68" fill="url(#moon)" opacity="0.95"/>

  <!-- Distant rolling hills -->
  <path d="M 0 620 Q 280 540 560 580 T 1120 560 T 1600 600 L 1600 900 L 0 900 Z" fill="url(#hill1)" opacity="0.75"/>

  <!-- Distant church spire on far hill -->
  <g opacity="0.7">
    <rect x="1175" y="525" width="22" height="80" fill="#2a1208"/>
    <polygon points="1186,485 1170,530 1202,530" fill="#2a1208"/>
    <circle cx="1186" cy="478" r="3" fill="#fbbf24"/>
  </g>

  <!-- Closer hill ridge -->
  <path d="M 0 720 Q 360 660 760 700 T 1600 690 L 1600 900 L 0 900 Z" fill="url(#hill2)" opacity="0.9"/>

  <!-- Hop-field hint: faint vertical strokes on near hill -->
  <g stroke="#78350f" stroke-width="2" opacity="0.35">
    <line x1="180" y1="760" x2="180" y2="790"/>
    <line x1="230" y1="755" x2="230" y2="785"/>
    <line x1="280" y1="760" x2="280" y2="790"/>
    <line x1="1340" y1="760" x2="1340" y2="788"/>
    <line x1="1385" y1="755" x2="1385" y2="785"/>
    <line x1="1430" y1="762" x2="1430" y2="790"/>
  </g>

  <!-- Warm window light spill on ground around farmhouse -->
  <ellipse cx="880" cy="780" rx="360" ry="60" fill="url(#windowSpill)"/>

  <!-- HERO: Brabant three-sided farmhouse silhouette, centered ~(800, 600) -->
  <g>
    <!-- Left wing -->
    <rect x="610" y="560" width="180" height="180" fill="url(#wall)"/>
    <polygon points="610,560 700,490 790,560" fill="url(#roof)"/>

    <!-- Main central body (taller) -->
    <rect x="780" y="500" width="260" height="240" fill="url(#wall)"/>
    <polygon points="780,500 910,420 1040,500" fill="url(#roof)"/>

    <!-- Right wing -->
    <rect x="1030" y="570" width="170" height="170" fill="url(#wall)"/>
    <polygon points="1030,570 1115,505 1200,570" fill="url(#roof)"/>

    <!-- Warm-lit windows -->
    <rect x="660" y="620" width="34" height="46" fill="url(#window)"/>
    <rect x="712" y="620" width="34" height="46" fill="url(#window)"/>
    <rect x="830" y="570" width="40" height="56" fill="url(#window)"/>
    <rect x="890" y="570" width="40" height="56" fill="url(#window)"/>
    <rect x="950" y="570" width="40" height="56" fill="url(#window)"/>
    <rect x="1060" y="630" width="34" height="46" fill="url(#window)"/>
    <rect x="1118" y="630" width="34" height="46" fill="url(#window)"/>

    <!-- Door (dark, slightly lit edge) -->
    <rect x="895" y="660" width="30" height="80" fill="#1a0e0e"/>
    <rect x="895" y="660" width="30" height="6" fill="#fbbf24" opacity="0.6"/>

    <!-- Chimney -->
    <rect x="940" y="445" width="22" height="40" fill="#2a1208"/>
  </g>

  <!-- Moonlit road curving toward farmhouse -->
  <path d="M 740 900 Q 820 820 900 760 L 940 760 Q 860 830 820 900 Z" fill="#9a3309" opacity="0.35"/>
</svg>
