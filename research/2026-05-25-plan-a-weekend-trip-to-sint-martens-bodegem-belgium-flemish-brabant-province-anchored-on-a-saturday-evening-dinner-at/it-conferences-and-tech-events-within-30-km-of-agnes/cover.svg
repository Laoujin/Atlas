<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="rustDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="sphereViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="60%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b1175"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint compass rings (decoration, centered) -->
  <g fill="none" stroke="#c2410c" stroke-opacity="0.18">
    <circle cx="800" cy="470" r="340" stroke-width="1.5"/>
    <circle cx="800" cy="470" r="250" stroke-width="1.2"/>
    <circle cx="800" cy="470" r="160" stroke-width="1"/>
  </g>

  <!-- compass rose: four cardinal arrows -->
  <g opacity="0.85">
    <!-- N -->
    <polygon points="800,160 820,470 800,440 780,470" fill="url(#rustDeep)"/>
    <!-- S -->
    <polygon points="800,780 820,470 800,500 780,470" fill="#c2410c" opacity="0.55"/>
    <!-- E -->
    <polygon points="1140,470 830,490 800,470 830,450" fill="#c2410c" opacity="0.55"/>
    <!-- W -->
    <polygon points="460,470 770,490 800,470 770,450" fill="#c2410c" opacity="0.55"/>
  </g>

  <!-- Atomium-inspired hero cluster: central node with four satellites -->
  <g>
    <!-- connecting struts -->
    <g stroke="#78350f" stroke-width="6" stroke-linecap="round" opacity="0.75">
      <line x1="800" y1="470" x2="620" y2="320"/>
      <line x1="800" y1="470" x2="980" y2="320"/>
      <line x1="800" y1="470" x2="620" y2="620"/>
      <line x1="800" y1="470" x2="980" y2="620"/>
    </g>
    <!-- satellite spheres -->
    <circle cx="620" cy="320" r="58" fill="url(#sphere)"/>
    <circle cx="980" cy="320" r="58" fill="url(#sphere)"/>
    <circle cx="620" cy="620" r="58" fill="url(#sphere)"/>
    <circle cx="980" cy="620" r="58" fill="url(#sphereViolet)"/>
    <!-- central hub sphere -->
    <circle cx="800" cy="470" r="92" fill="url(#sphere)"/>
    <!-- inner highlight on hub -->
    <ellipse cx="775" cy="445" rx="28" ry="18" fill="#fef3ec" opacity="0.4"/>
  </g>

  <!-- stage/podium platform under hero (talk-stage motif) -->
  <g opacity="0.7">
    <polygon points="540,720 1060,720 1000,760 600,760" fill="url(#rustDeep)"/>
    <rect x="600" y="760" width="400" height="14" fill="#78350f"/>
  </g>

  <!-- map pin marker (decoration, lower-left of safe zone) -->
  <g opacity="0.55" transform="translate(360,640)">
    <path d="M0,0 C-24,-40 -24,-70 0,-90 C24,-70 24,-40 0,0 Z" fill="url(#rust)"/>
    <circle cx="0" cy="-62" r="10" fill="#faf8f2"/>
  </g>

  <!-- corner decorative tick marks (cardinal degrees, outside safe zone bias) -->
  <g stroke="#9a3309" stroke-width="2" opacity="0.3">
    <line x1="800" y1="120" x2="800" y2="145"/>
    <line x1="800" y1="795" x2="800" y2="820"/>
    <line x1="430" y1="470" x2="455" y2="470"/>
    <line x1="1145" y1="470" x2="1170" y2="470"/>
  </g>
</svg>
