<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow, sits low behind the church silhouette -->
  <circle cx="900" cy="470" r="320" fill="url(#sun)" opacity="0.95"/>
  <circle cx="900" cy="470" r="95" fill="#fbbf24" opacity="0.9"/>

  <!-- Far rolling hills (Pajottenland horizon) -->
  <path d="M0,560 C220,500 380,540 560,520 C760,498 920,560 1120,530 C1320,500 1480,540 1600,520 L1600,640 L0,640 Z"
        fill="url(#hillFar)"/>

  <!-- Mid hills with the hero church silhouette on top -->
  <path d="M0,640 C180,600 340,630 520,610 C700,590 820,615 900,610 L900,560
           L885,560 L885,520 L880,520 L880,500 L875,500 L875,485
           L870,485 L870,500 L865,500 L865,520 L860,520 L860,560
           L840,560 L840,545 L820,545 L820,560
           L800,560 L800,580 L780,580 L780,600
           L900,600 L900,610
           C1080,615 1240,590 1420,615 C1500,625 1560,615 1600,605 L1600,760 L0,760 Z"
        fill="url(#hillMid)"/>

  <!-- Small flag on spire tip -->
  <rect x="870" y="465" width="14" height="8" fill="#c2410c" opacity="0.85"/>

  <!-- Tiny village rooftops on mid hill -->
  <polygon points="640,615 660,600 680,615" fill="#3a1a08" opacity="0.85"/>
  <rect x="640" y="615" width="40" height="18" fill="#3a1a08" opacity="0.85"/>
  <polygon points="710,620 728,608 746,620" fill="#3a1a08" opacity="0.8"/>
  <rect x="710" y="620" width="36" height="16" fill="#3a1a08" opacity="0.8"/>
  <polygon points="1080,618 1100,604 1120,618" fill="#3a1a08" opacity="0.8"/>
  <rect x="1080" y="618" width="40" height="18" fill="#3a1a08" opacity="0.8"/>

  <!-- Near foreground hill / hop fields edge -->
  <path d="M0,760 C200,720 420,755 660,735 C900,715 1140,755 1380,735 C1480,727 1560,740 1600,735 L1600,900 L0,900 Z"
        fill="url(#hillNear)"/>

  <!-- Two slender trees on near hill (Bruegel-ish poplars) -->
  <ellipse cx="360" cy="735" rx="14" ry="58" fill="#1f0d05" opacity="0.85"/>
  <rect x="358" y="780" width="4" height="40" fill="#1f0d05" opacity="0.85"/>
  <ellipse cx="1260" cy="745" rx="12" ry="50" fill="#1f0d05" opacity="0.8"/>
  <rect x="1258" y="785" width="4" height="36" fill="#1f0d05" opacity="0.8"/>

  <!-- A few birds (decorative, soft) -->
  <path d="M380,300 q10,-8 20,0 q10,-8 20,0" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M450,340 q8,-6 16,0 q8,-6 16,0" stroke="#78350f" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M1180,280 q10,-8 20,0 q10,-8 20,0" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.55"/>
</svg>
