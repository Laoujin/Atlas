<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roofWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- distant horizon hills -->
  <path d="M0 640 Q 300 580 600 620 T 1200 600 T 1600 630 L 1600 720 L 0 720 Z" fill="#9a3309" opacity="0.12"/>

  <!-- destination glow (restaurant) -->
  <circle cx="1240" cy="500" r="180" fill="url(#glow)"/>

  <!-- B&B house 1 (left, smaller, farther) -->
  <g opacity="0.92">
    <rect x="320" y="500" width="160" height="140" fill="#faf8f2" stroke="#78350f" stroke-width="3"/>
    <polygon points="310,500 400,410 490,500" fill="url(#roof)"/>
    <rect x="385" y="555" width="30" height="85" fill="#78350f"/>
    <rect x="345" y="530" width="28" height="28" fill="#fbbf24" opacity="0.85"/>
    <rect x="427" y="530" width="28" height="28" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- B&B house 2 (middle, manor — wider) -->
  <g opacity="0.94">
    <rect x="640" y="480" width="220" height="160" fill="#faf8f2" stroke="#78350f" stroke-width="3"/>
    <polygon points="630,480 750,380 870,480" fill="url(#roofWarm)"/>
    <rect x="735" y="555" width="34" height="85" fill="#78350f"/>
    <rect x="670" y="510" width="32" height="32" fill="#fbbf24" opacity="0.85"/>
    <rect x="720" y="510" width="32" height="32" fill="#fbbf24" opacity="0.85"/>
    <rect x="800" y="510" width="32" height="32" fill="#fbbf24" opacity="0.85"/>
    <rect x="670" y="565" width="32" height="32" fill="#fbbf24" opacity="0.7"/>
    <rect x="800" y="565" width="32" height="32" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- restaurant building (hero, right — taller, with chimney smoke implied by warm glow) -->
  <g>
    <rect x="1150" y="450" width="200" height="190" fill="#faf8f2" stroke="#5c2a1a" stroke-width="3"/>
    <polygon points="1140,450 1250,340 1360,450" fill="url(#roof)"/>
    <!-- chimney -->
    <rect x="1300" y="370" width="26" height="60" fill="#78350f"/>
    <!-- door, glowing -->
    <rect x="1235" y="555" width="36" height="85" fill="#c2410c"/>
    <!-- big windows, warm-lit -->
    <rect x="1175" y="485" width="44" height="44" fill="#fbbf24"/>
    <rect x="1285" y="485" width="44" height="44" fill="#fbbf24"/>
    <rect x="1175" y="555" width="44" height="44" fill="#fbbf24" opacity="0.85"/>
    <rect x="1285" y="555" width="44" height="44" fill="#fbbf24" opacity="0.85"/>
    <!-- star above (Michelin nod, abstract — no letters) -->
    <polygon points="1250,275 1260,305 1292,305 1266,324 1276,355 1250,336 1224,355 1234,324 1208,305 1240,305"
             fill="#d97706" opacity="0.9"/>
  </g>

  <!-- ground line -->
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#78350f" stroke-width="2" opacity="0.4"/>

  <!-- walking path: dotted line from houses to restaurant -->
  <path d="M 400 660 Q 600 700 750 670 Q 900 640 1050 660 Q 1150 670 1240 660"
        fill="none" stroke="#9a3309" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="2 18" opacity="0.85"/>

  <!-- footprint markers along path -->
  <circle cx="500" cy="680" r="6" fill="#c2410c" opacity="0.7"/>
  <circle cx="950" cy="660" r="6" fill="#c2410c" opacity="0.7"/>
  <circle cx="1130" cy="665" r="6" fill="#c2410c" opacity="0.7"/>

  <!-- foreground earth shadow -->
  <path d="M0 720 L 1600 720 L 1600 900 L 0 900 Z" fill="#78350f" opacity="0.08"/>
</svg>
