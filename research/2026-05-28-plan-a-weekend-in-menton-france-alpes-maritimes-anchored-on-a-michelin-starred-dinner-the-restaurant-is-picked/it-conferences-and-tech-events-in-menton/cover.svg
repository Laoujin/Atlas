<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow over coastline -->
  <circle cx="800" cy="520" r="520" fill="url(#sun)" opacity="0.55"/>

  <!-- Sea band (lower) -->
  <path d="M0,560 Q400,540 800,565 T1600,575 L1600,900 L0,900 Z" fill="url(#sea)" opacity="0.7"/>

  <!-- Distant mountain silhouettes (back) -->
  <path d="M0,500 L180,400 L320,460 L480,380 L640,440 L800,360 L960,430 L1120,370 L1280,420 L1440,350 L1600,400 L1600,560 L0,560 Z"
        fill="#78350f" opacity="0.35"/>

  <!-- Closer hills (mid) -->
  <path d="M0,560 L160,490 L300,540 L460,470 L620,520 L780,460 L940,510 L1100,470 L1260,520 L1420,475 L1600,510 L1600,620 L0,620 Z"
        fill="#9a3309" opacity="0.55"/>

  <!-- Foreground coastal ridge -->
  <path d="M0,640 L140,590 L280,625 L440,580 L600,615 L760,575 L920,605 L1080,570 L1240,600 L1400,565 L1600,595 L1600,720 L0,720 Z"
        fill="#c2410c" opacity="0.75"/>

  <!-- Coastline arc / rail line - the hero -->
  <path d="M180,560 Q400,490 620,505 T1060,470 T1420,440"
        fill="none" stroke="#6d28d9" stroke-width="6" opacity="0.0"/>
  <path d="M180,560 Q400,490 620,505 T1060,470 T1420,440"
        fill="none" stroke="url(#rail)" stroke-width="9" stroke-linecap="round" opacity="0.95"/>

  <!-- Rail ties (cross marks along the arc) -->
  <g stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="240" y1="538" x2="252" y2="550"/>
    <line x1="320" y1="518" x2="332" y2="530"/>
    <line x1="400" y1="505" x2="412" y2="517"/>
    <line x1="480" y1="498" x2="492" y2="510"/>
    <line x1="560" y1="500" x2="572" y2="512"/>
    <line x1="700" y1="498" x2="712" y2="510"/>
    <line x1="780" y1="492" x2="792" y2="504"/>
    <line x1="860" y1="486" x2="872" y2="498"/>
    <line x1="940" y1="478" x2="952" y2="490"/>
    <line x1="1100" y1="465" x2="1112" y2="477"/>
    <line x1="1180" y1="458" x2="1192" y2="470"/>
    <line x1="1260" y1="450" x2="1272" y2="462"/>
    <line x1="1340" y1="445" x2="1352" y2="457"/>
  </g>

  <!-- City nodes along the rail: Cannes, Sophia-Antipolis, Nice, Monaco, Menton -->
  <g>
    <!-- Cannes (west) -->
    <circle cx="260" cy="545" r="22" fill="#1a0e0e" opacity="0.35"/>
    <circle cx="260" cy="545" r="18" fill="url(#node)"/>
    <circle cx="260" cy="545" r="7" fill="#fef3ec" opacity="0.9"/>

    <!-- Sophia-Antipolis (inland accent, slightly above the line) -->
    <circle cx="450" cy="430" r="14" fill="#6d28d9" opacity="0.85"/>
    <circle cx="450" cy="430" r="5" fill="#fef3ec" opacity="0.95"/>
    <line x1="450" y1="444" x2="475" y2="500" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.7"/>
    <circle cx="475" cy="500" r="6" fill="#6d28d9" opacity="0.9"/>

    <!-- Nice (mid) -->
    <circle cx="720" cy="500" r="26" fill="#1a0e0e" opacity="0.35"/>
    <circle cx="720" cy="500" r="22" fill="url(#node)"/>
    <circle cx="720" cy="500" r="9" fill="#fef3ec" opacity="0.95"/>

    <!-- Monaco -->
    <circle cx="1060" cy="470" r="20" fill="#1a0e0e" opacity="0.35"/>
    <circle cx="1060" cy="470" r="16" fill="url(#node)"/>
    <circle cx="1060" cy="470" r="6" fill="#fef3ec" opacity="0.9"/>

    <!-- Menton (east, the hero anchor) -->
    <circle cx="1380" cy="445" r="42" fill="#1a0e0e" opacity="0.25"/>
    <circle cx="1380" cy="445" r="34" fill="url(#node)"/>
    <circle cx="1380" cy="445" r="22" fill="#c2410c"/>
    <circle cx="1380" cy="445" r="11" fill="#fbbf24"/>
    <circle cx="1380" cy="445" r="4" fill="#fef3ec"/>
  </g>

  <!-- Subtle horizon haze -->
  <rect x="0" y="540" width="1600" height="40" fill="#fef3ec" opacity="0.15"/>

  <!-- Foreground palm/cypress hints (silhouettes) -->
  <g fill="#5c2a1a" opacity="0.7">
    <ellipse cx="120" cy="720" rx="14" ry="60"/>
    <ellipse cx="1500" cy="720" rx="14" ry="55"/>
  </g>
</svg>
