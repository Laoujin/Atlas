<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="terrace1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="terrace2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="terrace3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky/sunset -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow on horizon -->
  <circle cx="980" cy="430" r="320" fill="url(#sun)" opacity="0.85"/>

  <!-- distant horizon / sea -->
  <rect x="0" y="455" width="1600" height="120" fill="url(#sea)" opacity="0.55"/>

  <!-- terraced slope: three descending bands toward the sea -->
  <!-- upper terrace -->
  <path d="M 0 560 Q 400 540 800 555 T 1600 545 L 1600 660 L 0 670 Z" fill="url(#terrace1)" opacity="0.88"/>

  <!-- middle terrace -->
  <path d="M 0 660 Q 500 640 900 655 T 1600 650 L 1600 760 L 0 770 Z" fill="url(#terrace2)" opacity="0.9"/>

  <!-- lower terrace meeting the sea -->
  <path d="M 0 760 Q 600 745 1000 760 T 1600 755 L 1600 900 L 0 900 Z" fill="url(#terrace3)" opacity="0.95"/>

  <!-- lemon tree canopies dotted along terraces (hero element cluster) -->
  <g opacity="0.92">
    <!-- upper row -->
    <ellipse cx="320" cy="545" rx="42" ry="34" fill="url(#leaf)"/>
    <ellipse cx="540" cy="552" rx="38" ry="30" fill="url(#leaf)"/>
    <ellipse cx="780" cy="548" rx="46" ry="36" fill="url(#leaf)"/>
    <ellipse cx="1040" cy="554" rx="40" ry="32" fill="url(#leaf)"/>
    <ellipse cx="1280" cy="546" rx="44" ry="34" fill="url(#leaf)"/>

    <!-- middle row -->
    <ellipse cx="220" cy="648" rx="46" ry="36" fill="url(#leaf)" opacity="0.95"/>
    <ellipse cx="460" cy="655" rx="42" ry="34" fill="url(#leaf)" opacity="0.95"/>
    <ellipse cx="720" cy="652" rx="50" ry="38" fill="url(#leaf)" opacity="0.95"/>
    <ellipse cx="980" cy="658" rx="44" ry="34" fill="url(#leaf)" opacity="0.95"/>
    <ellipse cx="1240" cy="650" rx="48" ry="36" fill="url(#leaf)" opacity="0.95"/>
    <ellipse cx="1440" cy="654" rx="40" ry="32" fill="url(#leaf)" opacity="0.95"/>
  </g>

  <!-- lemon dots (warm highlights) -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="310" cy="540" r="4"/>
    <circle cx="335" cy="552" r="3.5"/>
    <circle cx="545" cy="548" r="4"/>
    <circle cx="775" cy="544" r="4"/>
    <circle cx="795" cy="555" r="3.5"/>
    <circle cx="1045" cy="552" r="4"/>
    <circle cx="1285" cy="542" r="4"/>
    <circle cx="225" cy="645" r="4.5"/>
    <circle cx="465" cy="652" r="4"/>
    <circle cx="725" cy="650" r="4.5"/>
    <circle cx="710" cy="660" r="3.5"/>
    <circle cx="985" cy="656" r="4"/>
    <circle cx="1245" cy="648" r="4.5"/>
    <circle cx="1440" cy="652" r="4"/>
  </g>

  <!-- soft atmospheric haze across horizon -->
  <rect x="0" y="440" width="1600" height="40" fill="#fef3ec" opacity="0.35"/>
</svg>
