<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="houseA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="houseB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="houseC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="lemon" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.4" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Soft sun glow behind tower -->
  <circle cx="950" cy="340" r="320" fill="url(#sun)"/>

  <!-- Distant hills -->
  <path d="M0 560 L260 470 L520 510 L780 440 L1040 490 L1320 430 L1600 480 L1600 620 L0 620 Z"
        fill="#78350f" opacity="0.35"/>

  <!-- Old-town stacked houses (left cluster) -->
  <rect x="220" y="500" width="150" height="240" fill="url(#houseB)" opacity="0.9"/>
  <rect x="350" y="460" width="170" height="280" fill="url(#houseA)" opacity="0.9"/>
  <rect x="500" y="490" width="140" height="250" fill="url(#houseC)" opacity="0.9"/>
  <!-- Roofs left cluster -->
  <path d="M210 510 L295 470 L380 510 Z" fill="#9a3309" opacity="0.85"/>
  <path d="M340 470 L435 420 L530 470 Z" fill="#78350f" opacity="0.9"/>
  <path d="M490 500 L570 460 L650 500 Z" fill="#9a3309" opacity="0.85"/>

  <!-- Central basilica body -->
  <rect x="700" y="430" width="200" height="320" fill="url(#houseB)" opacity="0.95"/>
  <path d="M690 440 L800 380 L910 440 Z" fill="#9a3309"/>

  <!-- Bell tower (hero) -->
  <rect x="760" y="200" width="80" height="260" fill="url(#tower)"/>
  <rect x="755" y="280" width="90" height="10" fill="#9a3309" opacity="0.6"/>
  <rect x="755" y="380" width="90" height="10" fill="#9a3309" opacity="0.6"/>
  <!-- Tower belfry openings -->
  <rect x="775" y="300" width="20" height="55" fill="#5c2a1a" opacity="0.7" rx="8"/>
  <rect x="805" y="300" width="20" height="55" fill="#5c2a1a" opacity="0.7" rx="8"/>
  <!-- Tower cap -->
  <path d="M755 200 L800 150 L845 200 Z" fill="#9a3309"/>
  <rect x="796" y="120" width="8" height="40" fill="#78350f"/>
  <circle cx="800" cy="118" r="6" fill="#fbbf24"/>

  <!-- Right cluster houses -->
  <rect x="920" y="480" width="150" height="260" fill="url(#houseC)" opacity="0.9"/>
  <rect x="1050" y="510" width="130" height="230" fill="url(#houseA)" opacity="0.9"/>
  <rect x="1160" y="490" width="160" height="250" fill="url(#houseB)" opacity="0.9"/>
  <path d="M910 490 L995 450 L1080 490 Z" fill="#78350f" opacity="0.9"/>
  <path d="M1040 520 L1115 480 L1190 520 Z" fill="#9a3309" opacity="0.85"/>
  <path d="M1150 500 L1240 460 L1330 500 Z" fill="#78350f" opacity="0.9"/>

  <!-- Tiny window hints (a few, restrained) -->
  <g fill="#5c2a1a" opacity="0.55">
    <rect x="270" y="560" width="14" height="22"/>
    <rect x="310" y="560" width="14" height="22"/>
    <rect x="395" y="520" width="14" height="22"/>
    <rect x="445" y="520" width="14" height="22"/>
    <rect x="540" y="560" width="14" height="22"/>
    <rect x="740" y="500" width="16" height="26"/>
    <rect x="790" y="500" width="16" height="26"/>
    <rect x="840" y="500" width="16" height="26"/>
    <rect x="960" y="540" width="14" height="22"/>
    <rect x="1010" y="540" width="14" height="22"/>
    <rect x="1090" y="560" width="14" height="22"/>
    <rect x="1140" y="560" width="14" height="22"/>
    <rect x="1200" y="540" width="14" height="22"/>
    <rect x="1260" y="540" width="14" height="22"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="740" width="1600" height="160" fill="url(#sea)"/>
  <!-- Sea highlights -->
  <path d="M0 760 Q400 750 800 765 T1600 760 L1600 770 Q1200 760 800 775 T0 770 Z" fill="#fbbf24" opacity="0.18"/>
  <path d="M0 800 Q500 790 1000 805 T1600 800 L1600 808 Q1100 798 600 813 T0 808 Z" fill="#fef3ec" opacity="0.12"/>

  <!-- Lemon emblem (foreground, right) -->
  <ellipse cx="1330" cy="700" rx="105" ry="78" fill="url(#lemon)"/>
  <ellipse cx="1300" cy="680" rx="35" ry="22" fill="#fef3ec" opacity="0.55"/>
  <!-- Lemon stem and leaf -->
  <path d="M1330 625 Q1360 600 1395 595 Q1380 625 1355 635 Z" fill="#78350f" opacity="0.85"/>
  <path d="M1330 625 L1355 635" stroke="#5c2a1a" stroke-width="3" fill="none"/>
  <!-- Lemon nubs -->
  <circle cx="1228" cy="700" r="8" fill="#9a3309" opacity="0.7"/>
  <circle cx="1432" cy="700" r="8" fill="#9a3309" opacity="0.7"/>
</svg>
