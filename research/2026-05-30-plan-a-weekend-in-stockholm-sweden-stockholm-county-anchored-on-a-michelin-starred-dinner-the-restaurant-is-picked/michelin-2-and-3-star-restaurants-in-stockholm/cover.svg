<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="plateBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="plateFront" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="dotGarnish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="glassBowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="#1a0e0e"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant skyline silhouette (Nordic city, low at horizon) -->
  <g opacity="0.35" fill="#1a0e0e">
    <rect x="0" y="720" width="160" height="40"/>
    <rect x="170" y="700" width="80" height="60"/>
    <polygon points="250,700 280,665 310,700"/>
    <rect x="320" y="710" width="120" height="50"/>
    <rect x="445" y="690" width="60" height="70"/>
    <polygon points="505,690 525,660 545,690"/>
    <rect x="545" y="715" width="180" height="45"/>
    <rect x="1000" y="710" width="140" height="50"/>
    <polygon points="1140,710 1170,675 1200,710"/>
    <rect x="1200" y="700" width="90" height="60"/>
    <rect x="1295" y="715" width="170" height="45"/>
    <rect x="1465" y="705" width="135" height="55"/>
  </g>

  <!-- back plate (secondary, behind hero) -->
  <g transform="translate(1080,470)">
    <ellipse cx="0" cy="0" rx="260" ry="245" fill="url(#plateBack)" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="210" ry="195" fill="#1a0e0e" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="195" ry="180" fill="url(#plateFront)" opacity="0.75"/>
    <!-- minimal garnish dots -->
    <circle cx="-40" cy="-20" r="12" fill="url(#dotGarnish)" opacity="0.9"/>
    <circle cx="30" cy="15" r="8" fill="#be185d" opacity="0.8"/>
    <circle cx="50" cy="-35" r="6" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- hero plate (front, centered in safe zone) -->
  <g transform="translate(620,470)">
    <!-- plate rim -->
    <ellipse cx="0" cy="0" rx="340" ry="320" fill="url(#plateBack)" opacity="0.95"/>
    <!-- inner well -->
    <ellipse cx="0" cy="0" rx="280" ry="262" fill="#1a0e0e" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="265" ry="248" fill="url(#plateFront)"/>
    <!-- subtle highlight -->
    <ellipse cx="-90" cy="-110" rx="120" ry="40" fill="#fef3ec" opacity="0.35"/>

    <!-- centerpiece: a single composed bite -->
    <ellipse cx="0" cy="10" rx="85" ry="55" fill="#9a3309" opacity="0.85"/>
    <ellipse cx="-15" cy="-5" rx="55" ry="35" fill="#c2410c" opacity="0.9"/>
    <circle cx="20" cy="15" r="22" fill="url(#dotGarnish)"/>
    <circle cx="-35" cy="25" r="14" fill="#be185d" opacity="0.85"/>
    <circle cx="40" cy="-20" r="10" fill="#fbbf24" opacity="0.95"/>

    <!-- micro garnish flecks around the well -->
    <circle cx="-150" cy="-60" r="5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="160" cy="80" r="6" fill="#be185d" opacity="0.7"/>
    <circle cx="-120" cy="150" r="4" fill="#d97706" opacity="0.8"/>
    <circle cx="180" cy="-100" r="5" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- wine glass silhouette accent (right edge of safe zone) -->
  <g transform="translate(1395,420)" opacity="0.85">
    <!-- bowl -->
    <path d="M -55,0 Q -55,90 0,110 Q 55,90 55,0 Q 30,-15 0,-15 Q -30,-15 -55,0 Z" fill="url(#glassBowl)"/>
    <!-- wine surface highlight -->
    <ellipse cx="0" cy="-5" rx="48" ry="8" fill="#fbbf24" opacity="0.4"/>
    <!-- stem -->
    <rect x="-3" y="110" width="6" height="130" fill="#78350f" opacity="0.85"/>
    <!-- base -->
    <ellipse cx="0" cy="245" rx="45" ry="6" fill="#5c2a1a" opacity="0.9"/>
  </g>

  <!-- soft vignette edges (decoration outside hero zone) -->
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.15"/>
</svg>
