<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ee"/>
      <stop offset="0.55" stop-color="#fde4c4"/>
      <stop offset="1" stop-color="#f6c486"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- dusk sun glow behind the hero -->
  <circle cx="810" cy="430" r="380" fill="url(#sun)"/>

  <!-- hero: hornbill in flight, centered in the safe zone -->
  <path fill="url(#bird)" opacity="0.94" d="
    M1090,452
    C 1040,438 990,428 952,420
    C 944,404 930,392 918,398
    C 905,402 892,408 876,420
    C 858,428 840,430 822,430
    C 800,360 778,300 762,258
    C 752,290 742,360 712,438
    C 690,446 668,448 646,450
    C 600,470 556,498 520,512
    C 560,492 612,484 664,480
    C 720,494 770,498 812,486
    C 836,480 852,476 866,470
    C 904,476 942,470 962,468
    C 1000,462 1046,456 1090,452 Z"/>

  <!-- jungle ridgelines (decoration, crops freely below) -->
  <path fill="#d97706" opacity="0.5" d="M0,760 C300,700 600,742 900,712 C1200,682 1400,722 1600,702 L1600,900 L0,900 Z"/>
  <path fill="#9a3309" opacity="0.72" d="M0,822 C250,782 500,812 800,792 C1100,772 1350,802 1600,782 L1600,900 L0,900 Z"/>
  <path fill="#78350f" opacity="0.9" d="M0,882 C400,852 800,872 1100,856 C1300,846 1500,862 1600,856 L1600,900 L0,900 Z"/>
</svg>
