<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="430" r="360" fill="url(#sun)"/>

  <!-- Water band (full bleed bottom) -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#water)"/>

  <!-- Hero skyline silhouette, centred ~ (800,450) -->
  <g fill="#78350f" fill-opacity="0.92">
    <!-- Margherita Fort tower (left) -->
    <rect x="430" y="430" width="120" height="210"/>
    <rect x="418" y="408" width="144" height="34"/>
    <rect x="424" y="392" width="20" height="22"/>
    <rect x="480" y="392" width="20" height="22"/>
    <rect x="536" y="392" width="20" height="22"/>

    <!-- Temple with tiered roof (right) -->
    <rect x="1010" y="470" width="160" height="170"/>
    <path d="M990 470 L1090 408 L1190 470 Z"/>
    <path d="M1012 432 L1090 386 L1168 432 Z"/>
    <rect x="1082" y="356" width="16" height="34"/>
  </g>

  <!-- Astana golden-domed centrepiece (hero) -->
  <g>
    <rect x="690" y="470" width="220" height="170" fill="#9a3309" fill-opacity="0.95"/>
    <rect x="690" y="458" width="220" height="20" fill="#c2410c"/>
    <path d="M690 470 Q800 320 910 470 Z" fill="url(#dome)"/>
    <rect x="794" y="296" width="12" height="40" fill="#c2410c"/>
    <circle cx="800" cy="292" r="14" fill="#fbbf24"/>
    <rect x="724" y="510" width="40" height="130" fill="#5c2a1a" fill-opacity="0.8"/>
    <rect x="836" y="510" width="40" height="130" fill="#5c2a1a" fill-opacity="0.8"/>
  </g>

  <!-- Reflections in the water -->
  <g fill="#1a0e0e" fill-opacity="0.28">
    <rect x="430" y="640" width="120" height="120"/>
    <rect x="1010" y="640" width="160" height="100"/>
    <path d="M690 640 Q800 760 910 640 Z"/>
    <rect x="690" y="640" width="220" height="90"/>
  </g>
  <g fill="#fbbf24" fill-opacity="0.22">
    <rect x="120" y="690" width="1360" height="6"/>
    <rect x="260" y="730" width="1080" height="5"/>
  </g>
</svg>
