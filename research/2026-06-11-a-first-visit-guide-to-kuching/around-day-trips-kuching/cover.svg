<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- river band (decoration, flows full-bleed) -->
  <path d="M0,640 C420,520 620,760 900,640 C1180,520 1380,720 1600,600 L1600,900 L0,900 Z" fill="url(#river)"/>

  <!-- orbit rings around the hub -->
  <ellipse cx="800" cy="450" rx="430" ry="300" fill="none" stroke="#9a3309" stroke-opacity="0.30" stroke-width="3"/>
  <ellipse cx="800" cy="450" rx="280" ry="195" fill="none" stroke="#c2410c" stroke-opacity="0.45" stroke-width="3"/>

  <!-- flight arc into the orbit -->
  <path d="M250,250 C520,150 760,260 800,450" fill="none" stroke="#78350f" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <polygon points="800,450 778,432 802,420" fill="#78350f" fill-opacity="0.8"/>

  <!-- hero hub: Kuching -->
  <circle cx="800" cy="450" r="92" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="92" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="4"/>
  <circle cx="800" cy="450" r="40" fill="#fef3ec" fill-opacity="0.85"/>

  <!-- orbiting day-trip nodes -->
  <circle cx="800" cy="150" r="34" fill="#c2410c" fill-opacity="0.9"/>
  <circle cx="800" cy="150" r="34" fill="none" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="3"/>

  <circle cx="1080" cy="450" r="40" fill="#d97706" fill-opacity="0.92"/>
  <circle cx="1080" cy="450" r="40" fill="none" stroke="#9a3309" stroke-opacity="0.5" stroke-width="3"/>

  <circle cx="520" cy="450" r="38" fill="#9a3309" fill-opacity="0.9"/>
  <circle cx="520" cy="450" r="38" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="3"/>

  <circle cx="800" cy="645" r="30" fill="#78350f" fill-opacity="0.88"/>
</svg>
