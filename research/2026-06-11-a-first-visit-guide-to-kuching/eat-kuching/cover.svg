<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="62%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="broth" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="48%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#e7d4c4"/>
    </linearGradient>
    <linearGradient id="bowlShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c9b29e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="720" ry="500" fill="url(#glow)"/>

  <!-- small side plate (secondary) behind, left -->
  <ellipse cx="470" cy="560" rx="190" ry="74" fill="url(#bowlShade)" opacity="0.9"/>
  <ellipse cx="470" cy="552" rx="150" ry="56" fill="#be185d" opacity="0.85"/>
  <ellipse cx="470" cy="548" rx="150" ry="56" fill="none" stroke="#fef3ec" stroke-width="3" opacity="0.5"/>

  <!-- hero bowl -->
  <ellipse cx="820" cy="630" rx="330" ry="120" fill="#3a1d14" opacity="0.55"/>
  <path d="M520 470 A300 300 0 0 0 1120 470 L1090 520 A270 150 0 0 1 550 520 Z" fill="url(#bowlShade)"/>
  <ellipse cx="820" cy="470" rx="300" ry="150" fill="url(#bowl)"/>
  <ellipse cx="820" cy="470" rx="262" ry="128" fill="url(#broth)"/>
  <ellipse cx="820" cy="470" rx="262" ry="128" fill="none" stroke="#78350f" stroke-width="4" opacity="0.6"/>

  <!-- noodle / garnish strokes inside broth -->
  <path d="M650 452 q70 -34 150 -10 q80 24 170 -6" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <path d="M660 492 q90 26 180 4 q70 -16 130 8" fill="none" stroke="#fef3ec" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <circle cx="700" cy="478" r="15" fill="#be185d"/>
  <circle cx="930" cy="452" r="13" fill="#be185d" opacity="0.9"/>
  <ellipse cx="850" cy="500" rx="34" ry="14" fill="#fbbf24" opacity="0.8"/>

  <!-- steam wisps -->
  <path d="M720 330 q-26 -42 8 -82 q30 -36 4 -78" fill="none" stroke="#fef3ec" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  <path d="M870 318 q28 -46 -6 -88 q-28 -34 2 -74" fill="none" stroke="#fef3ec" stroke-width="7" stroke-linecap="round" opacity="0.3"/>

  <!-- chopsticks resting across the rim -->
  <line x1="980" y1="360" x2="1230" y2="250" stroke="#78350f" stroke-width="11" stroke-linecap="round"/>
  <line x1="1000" y1="400" x2="1250" y2="290" stroke="#9a3309" stroke-width="11" stroke-linecap="round"/>
</svg>
