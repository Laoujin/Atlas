<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun hero, centred high in the safe zone -->
  <circle cx="800" cy="360" r="150" fill="url(#sun)" opacity="0.95"/>

  <!-- Far jungle ridge -->
  <path d="M0 520 Q300 440 600 500 T1200 480 T1600 510 V900 H0 Z" fill="#9a3309" opacity="0.65"/>

  <!-- Mid jungle ridge -->
  <path d="M0 600 Q360 520 720 580 T1600 560 V900 H0 Z" fill="#78350f" opacity="0.8"/>

  <!-- Winding river through the valley -->
  <path d="M760 900 C740 760 900 700 880 600 C865 525 700 500 720 430 L900 430 C880 510 1020 540 1010 620 C1000 720 880 770 900 900 Z" fill="url(#river)" opacity="0.92"/>

  <!-- Near foreground bank -->
  <path d="M0 720 Q400 650 760 740 Q420 800 0 800 Z" fill="#5c2a1a" opacity="0.9"/>
  <path d="M1600 700 Q1200 640 900 740 Q1260 810 1600 790 Z" fill="#5c2a1a" opacity="0.9"/>

  <!-- Canopy accents on the near bank -->
  <circle cx="240" cy="700" r="70" fill="#78350f" opacity="0.85"/>
  <circle cx="360" cy="720" r="55" fill="#5c2a1a" opacity="0.9"/>
  <circle cx="1320" cy="690" r="75" fill="#78350f" opacity="0.85"/>
  <circle cx="1210" cy="720" r="52" fill="#5c2a1a" opacity="0.9"/>
</svg>
