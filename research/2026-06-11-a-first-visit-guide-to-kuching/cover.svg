<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow + disc, hero centre -->
  <circle cx="800" cy="400" r="320" fill="url(#sun)"/>
  <circle cx="800" cy="400" r="150" fill="#fef3ec" opacity="0.95"/>

  <!-- far rainforest ridge -->
  <path d="M0 540 L220 470 L470 520 L760 440 L1080 510 L1360 455 L1600 505 L1600 900 L0 900 Z"
        fill="#c2410c" opacity="0.65"/>

  <!-- mid ridge -->
  <path d="M0 620 L260 560 L560 615 L880 540 L1200 605 L1600 555 L1600 900 L0 900 Z"
        fill="#9a3309" opacity="0.85"/>

  <!-- near forested bank -->
  <path d="M0 700 L320 650 L640 695 L980 630 L1320 690 L1600 645 L1600 900 L0 900 Z"
        fill="#78350f"/>

  <!-- river -->
  <path d="M0 730 L1600 700 L1600 900 L0 900 Z" fill="url(#river)" opacity="0.9"/>

  <!-- sun reflection on river -->
  <ellipse cx="800" cy="800" rx="120" ry="40" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="800" cy="845" rx="80" ry="20" fill="#fef3ec" opacity="0.55"/>
</svg>
