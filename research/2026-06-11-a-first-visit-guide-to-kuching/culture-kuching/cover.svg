<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- hanging rods / loom edge -->
  <rect x="470" y="172" width="660" height="14" rx="7" fill="#5c2a1a"/>
  <rect x="470" y="714" width="660" height="14" rx="7" fill="#5c2a1a"/>

  <!-- woven cloth panel (pua kumbu) -->
  <rect x="490" y="186" width="620" height="528" fill="url(#cloth)"/>

  <!-- horizontal warp bands -->
  <rect x="490" y="206" width="620" height="40" fill="url(#band)" opacity="0.85"/>
  <rect x="490" y="654" width="620" height="40" fill="url(#band)" opacity="0.85"/>
  <rect x="490" y="438" width="620" height="24" fill="#d97706" opacity="0.7"/>

  <!-- central stacked diamonds (Iban hook-and-diamond motif) -->
  <g fill="#fbbf24" opacity="0.92">
    <polygon points="800,266 858,330 800,394 742,330"/>
    <polygon points="800,406 858,470 800,534 742,470"/>
    <polygon points="800,546 858,610 800,674 742,610"/>
  </g>
  <g fill="#9a3309" opacity="0.9">
    <polygon points="800,290 832,330 800,370 768,330"/>
    <polygon points="800,430 832,470 800,510 768,470"/>
    <polygon points="800,570 832,610 800,650 768,610"/>
  </g>

  <!-- flanking hook motifs -->
  <g fill="#d97706" opacity="0.85">
    <polygon points="600,330 648,330 648,378 624,378 624,354 600,354"/>
    <polygon points="1000,330 952,330 952,378 976,378 976,354 1000,354"/>
    <polygon points="600,610 648,610 648,562 624,562 624,586 600,586"/>
    <polygon points="1000,610 952,610 952,562 976,562 976,586 1000,586"/>
  </g>

  <!-- side warp stripes -->
  <rect x="498" y="186" width="10" height="528" fill="#c2410c" opacity="0.6"/>
  <rect x="1092" y="186" width="10" height="528" fill="#c2410c" opacity="0.6"/>

  <!-- fringe -->
  <g stroke="#78350f" stroke-width="4" opacity="0.7">
    <line x1="520" y1="728" x2="520" y2="758"/>
    <line x1="580" y1="728" x2="580" y2="762"/>
    <line x1="640" y1="728" x2="640" y2="756"/>
    <line x1="700" y1="728" x2="700" y2="762"/>
    <line x1="760" y1="728" x2="760" y2="758"/>
    <line x1="820" y1="728" x2="820" y2="762"/>
    <line x1="880" y1="728" x2="880" y2="756"/>
    <line x1="940" y1="728" x2="940" y2="762"/>
    <line x1="1000" y1="728" x2="1000" y2="758"/>
    <line x1="1060" y1="728" x2="1060" y2="760"/>
  </g>
</svg>
