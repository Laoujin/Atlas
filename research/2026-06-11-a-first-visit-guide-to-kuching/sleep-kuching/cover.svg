<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <!-- warm lantern moon glow (decoration, may crop) -->
  <circle cx="1120" cy="240" r="420" fill="url(#moon)"/>
  <circle cx="1120" cy="240" r="60" fill="#fbbf24" opacity="0.85"/>

  <!-- rainforest canopy, treehouse side -->
  <g opacity="0.9">
    <ellipse cx="430" cy="380" rx="150" ry="120" fill="#78350f"/>
    <ellipse cx="330" cy="450" rx="120" ry="100" fill="#5c2a1a"/>
    <ellipse cx="520" cy="450" rx="110" ry="95" fill="#9a3309"/>
    <rect x="415" y="470" width="34" height="230" fill="#3a1810"/>
    <!-- little treehouse, lit window -->
    <rect x="360" y="430" width="150" height="95" rx="8" fill="url(#wall)"/>
    <polygon points="345,432 525,432 435,372" fill="#c2410c"/>
    <rect x="400" y="460" width="34" height="44" rx="4" fill="url(#glow)"/>
  </g>

  <!-- hero: heritage shophouse -->
  <g>
    <rect x="650" y="400" width="360" height="300" rx="6" fill="url(#wall)"/>
    <polygon points="630,402 1030,402 830,300" fill="#c2410c"/>
    <polygon points="830,300 1030,402 830,402" fill="#9a3309"/>
    <!-- arcade arches at street level -->
    <path d="M666 700 V620 a40 40 0 0 1 80 0 V700 Z" fill="#3a1810"/>
    <path d="M790 700 V620 a40 40 0 0 1 80 0 V700 Z" fill="url(#glow)" opacity="0.92"/>
    <path d="M914 700 V620 a40 40 0 0 1 80 0 V700 Z" fill="#3a1810"/>
    <!-- shuttered upper windows, two lit -->
    <rect x="688" y="470" width="60" height="90" rx="5" fill="url(#glow)"/>
    <rect x="800" y="470" width="60" height="90" rx="5" fill="#3a1810"/>
    <rect x="912" y="470" width="60" height="90" rx="5" fill="url(#glow)"/>
    <line x1="630" y1="402" x2="1030" y2="402" stroke="#fbbf24" stroke-width="4" opacity="0.5"/>
  </g>
</svg>
