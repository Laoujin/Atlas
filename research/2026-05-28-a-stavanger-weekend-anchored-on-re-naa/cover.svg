<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cliffL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="cliffR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="reflect" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm radial glow / sun / plate hero, centered in safe zone -->
  <circle cx="800" cy="430" r="380" fill="url(#sun)"/>
  <circle cx="800" cy="430" r="155" fill="#fbbf24" opacity="0.92"/>
  <circle cx="800" cy="430" r="155" fill="none" stroke="#fef3ec" stroke-width="2" opacity="0.5"/>

  <!-- Water band -->
  <rect x="0" y="610" width="1600" height="290" fill="url(#water)"/>
  <ellipse cx="800" cy="615" rx="260" ry="32" fill="url(#reflect)"/>

  <!-- Left fjord cliff -->
  <polygon points="0,610 0,300 180,360 340,280 470,420 560,380 660,610" fill="url(#cliffL)" opacity="0.95"/>

  <!-- Right fjord cliff -->
  <polygon points="1600,610 1600,260 1430,330 1280,250 1140,380 1020,340 940,610" fill="url(#cliffR)" opacity="0.95"/>

  <!-- Subtle ripples on water -->
  <path d="M 620 700 Q 800 690 980 700" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 560 760 Q 800 748 1040 760" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 480 820 Q 800 808 1120 820" stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.22"/>
</svg>
