<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="farCliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="midCliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pulpit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.6" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.32" r="0.18">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- soft late-May sun glow -->
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- far ridge across the fjord -->
  <path d="M 0 560 L 180 500 L 320 525 L 520 470 L 740 495 L 980 455 L 1240 485 L 1440 460 L 1600 480 L 1600 620 L 0 620 Z"
        fill="url(#farCliff)"/>

  <!-- mid ridge -->
  <path d="M 0 640 L 220 590 L 460 615 L 700 575 L 940 605 L 1180 580 L 1420 600 L 1600 585 L 1600 720 L 0 720 Z"
        fill="url(#midCliff)" opacity="0.9"/>

  <!-- fjord water -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#water)"/>
  <!-- water reflection streaks -->
  <rect x="180" y="755" width="420" height="2" fill="#fbbf24" opacity="0.25"/>
  <rect x="640" y="780" width="280" height="2" fill="#fbbf24" opacity="0.2"/>
  <rect x="1020" y="765" width="360" height="2" fill="#fbbf24" opacity="0.2"/>

  <!-- HERO: Preikestolen plateau, cliff face dropping to water, inside safe zone -->
  <!-- cliff body: tall vertical slab with flat top -->
  <path d="M 560 360
           L 560 340
           L 980 340
           L 980 360
           L 1020 380
           L 1040 700
           L 980 720
           L 700 720
           L 600 700
           L 540 380
           Z"
        fill="url(#pulpit)"/>

  <!-- top plateau highlight (flat pulpit surface) -->
  <path d="M 560 340 L 980 340 L 1020 380 L 540 380 Z"
        fill="#c2410c" opacity="0.95"/>
  <path d="M 580 348 L 960 348 L 990 372 L 560 372 Z"
        fill="#d97706" opacity="0.55"/>

  <!-- vertical cliff striations -->
  <path d="M 620 400 L 628 700" stroke="#78350f" stroke-width="3" opacity="0.55" fill="none"/>
  <path d="M 700 395 L 705 715" stroke="#78350f" stroke-width="2" opacity="0.45" fill="none"/>
  <path d="M 800 392 L 802 718" stroke="#78350f" stroke-width="2" opacity="0.4" fill="none"/>
  <path d="M 880 395 L 885 715" stroke="#78350f" stroke-width="3" opacity="0.5" fill="none"/>
  <path d="M 960 400 L 970 705" stroke="#78350f" stroke-width="2" opacity="0.45" fill="none"/>

  <!-- shadowed right edge of cliff -->
  <path d="M 980 340 L 1020 380 L 1040 700 L 980 720 Z"
        fill="#5c2a1a" opacity="0.5"/>

  <!-- a single tiny figure-suggesting dot on the plateau edge (no faces, just a scale cue) -->
  <circle cx="900" cy="333" r="6" fill="#1a0e0e" opacity="0.75"/>

  <!-- subtle horizon haze across the cliff base -->
  <rect x="0" y="700" width="1600" height="20" fill="#fef3ec" opacity="0.18"/>
</svg>
