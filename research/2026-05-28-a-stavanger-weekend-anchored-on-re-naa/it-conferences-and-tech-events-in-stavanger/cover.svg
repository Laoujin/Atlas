<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fjord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind fjord -->
  <circle cx="800" cy="520" r="360" fill="url(#sun)"/>

  <!-- distant fjord cliff (far) -->
  <path d="M0,540 L120,500 L200,520 L320,470 L460,500 L600,460 L760,490 L920,455 L1080,485 L1240,460 L1400,490 L1600,470 L1600,620 L0,620 Z"
        fill="#5c2a1a" opacity="0.75"/>

  <!-- mid fjord ridge -->
  <path d="M0,600 L180,560 L300,590 L460,540 L620,580 L800,545 L980,585 L1160,555 L1340,590 L1500,560 L1600,580 L1600,720 L0,720 Z"
        fill="url(#fjord)" opacity="0.92"/>

  <!-- water -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#water)"/>

  <!-- water highlights -->
  <rect x="200" y="745" width="280" height="2" fill="#fbbf24" opacity="0.35"/>
  <rect x="540" y="770" width="180" height="2" fill="#d97706" opacity="0.4"/>
  <rect x="820" y="755" width="320" height="2" fill="#fbbf24" opacity="0.3"/>
  <rect x="1200" y="785" width="220" height="2" fill="#d97706" opacity="0.35"/>

  <!-- HERO: city skyline silhouette with circuit/node overlay, centered ~ (800,450) -->
  <!-- skyline base (rooftops along x: 350-1250, y baseline ~640) -->
  <g opacity="0.95">
    <!-- back row buildings -->
    <rect x="380" y="500" width="70" height="140" fill="#78350f"/>
    <rect x="460" y="470" width="55" height="170" fill="#9a3309"/>
    <rect x="525" y="520" width="80" height="120" fill="#78350f"/>
    <!-- Stavanger cathedral-style twin towers (centerpiece) -->
    <rect x="640" y="430" width="40" height="210" fill="#c2410c"/>
    <polygon points="640,430 660,395 680,430" fill="#c2410c"/>
    <rect x="700" y="460" width="120" height="180" fill="#9a3309"/>
    <polygon points="700,460 760,420 820,460" fill="#9a3309"/>
    <rect x="840" y="430" width="40" height="210" fill="#c2410c"/>
    <polygon points="840,430 860,395 880,430" fill="#c2410c"/>
    <!-- modern tower (conference venue feel) -->
    <rect x="910" y="380" width="60" height="260" fill="#d97706"/>
    <rect x="980" y="460" width="55" height="180" fill="#78350f"/>
    <rect x="1045" y="430" width="70" height="210" fill="#9a3309"/>
    <rect x="1125" y="500" width="60" height="140" fill="#78350f"/>

    <!-- window glints -->
    <rect x="920" y="410" width="6" height="6" fill="#fbbf24" opacity="0.85"/>
    <rect x="940" y="450" width="6" height="6" fill="#fbbf24" opacity="0.7"/>
    <rect x="955" y="520" width="6" height="6" fill="#fbbf24" opacity="0.8"/>
    <rect x="720" y="500" width="5" height="5" fill="#fbbf24" opacity="0.7"/>
    <rect x="780" y="560" width="5" height="5" fill="#fbbf24" opacity="0.6"/>
    <rect x="1060" y="470" width="5" height="5" fill="#fbbf24" opacity="0.75"/>
    <rect x="1080" y="540" width="5" height="5" fill="#fbbf24" opacity="0.6"/>
    <rect x="490" y="510" width="5" height="5" fill="#fbbf24" opacity="0.55"/>
    <rect x="405" y="540" width="5" height="5" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- circuit/node graph above skyline (conferences network) -->
  <g stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.85">
    <line x1="500" y1="280" x2="660" y2="240"/>
    <line x1="660" y1="240" x2="820" y2="200"/>
    <line x1="820" y1="200" x2="980" y2="250"/>
    <line x1="980" y1="250" x2="1120" y2="220"/>
    <line x1="660" y1="240" x2="740" y2="340"/>
    <line x1="820" y1="200" x2="860" y2="320"/>
    <line x1="980" y1="250" x2="900" y2="350"/>
    <line x1="500" y1="280" x2="580" y2="370"/>
    <line x1="1120" y1="220" x2="1050" y2="330"/>
    <line x1="740" y1="340" x2="860" y2="320"/>
    <line x1="860" y1="320" x2="900" y2="350"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="500" cy="280" r="6"/>
    <circle cx="660" cy="240" r="7"/>
    <circle cx="820" cy="200" r="9" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="980" cy="250" r="7"/>
    <circle cx="1120" cy="220" r="6"/>
    <circle cx="580" cy="370" r="5"/>
    <circle cx="740" cy="340" r="5"/>
    <circle cx="860" cy="320" r="6"/>
    <circle cx="900" cy="350" r="5"/>
    <circle cx="1050" cy="330" r="5"/>
  </g>

  <!-- subtle data trace beam from hub node down to skyline -->
  <line x1="820" y1="200" x2="820" y2="430" stroke="#fbbf24" stroke-width="1" opacity="0.35" stroke-dasharray="3 6"/>

  <!-- reflections of skyline in water -->
  <g opacity="0.25">
    <rect x="640" y="700" width="40" height="60" fill="#c2410c"/>
    <rect x="700" y="700" width="120" height="50" fill="#9a3309"/>
    <rect x="840" y="700" width="40" height="60" fill="#c2410c"/>
    <rect x="910" y="700" width="60" height="80" fill="#d97706"/>
    <rect x="1045" y="700" width="70" height="55" fill="#9a3309"/>
  </g>
</svg>
