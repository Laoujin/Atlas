<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep rust nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1408"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero card gradient: warm rust face -->
    <linearGradient id="card1" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Second card gradient -->
    <linearGradient id="card2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Top card gradient (hero) -->
    <linearGradient id="card3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.88"/>
    </linearGradient>
    <!-- Node glow -->
    <radialGradient id="nodeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge glow for connection lines -->
    <linearGradient id="edgeglow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle grid lines suggesting city structure / floor plan -->
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#c2410c" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="0" y1="300" x2="1600" y2="300" stroke="#c2410c" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#c2410c" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="400" y1="0" x2="400" y2="900" stroke="#c2410c" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#c2410c" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="1200" y1="0" x2="1200" y2="900" stroke="#c2410c" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Layer 2: Hero element — stacked angled conference badge/slide cards centered at (800,450) -->

  <!-- Back card (bottom of stack) — shifted left, rotated slightly -->
  <rect x="450" y="230" width="500" height="340" rx="14"
        fill="url(#card2)" stroke="#9a3309" stroke-width="2" stroke-opacity="0.5"
        transform="rotate(-10 700 400)" opacity="0.72"/>

  <!-- Middle card — shifted right, rotated opposite -->
  <rect x="620" y="205" width="500" height="340" rx="14"
        fill="url(#card1)" stroke="#c2410c" stroke-width="2" stroke-opacity="0.6"
        transform="rotate(6 870 375)" opacity="0.82"/>

  <!-- Top hero card — centered, slight tilt -->
  <rect x="540" y="245" width="520" height="350" rx="16"
        fill="url(#card3)" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.75"
        transform="rotate(-2 800 420)" opacity="0.93"/>

  <!-- Badge lanyard slot bar on top card -->
  <rect x="765" y="258" width="70" height="14" rx="7"
        fill="#78350f" opacity="0.85"
        transform="rotate(-2 800 265)"/>

  <!-- Horizontal rule lines inside top card (simulating conference schedule rows) -->
  <line x1="580" y1="330" x2="1020" y2="326" stroke="#78350f" stroke-width="3" stroke-opacity="0.45" transform="rotate(-2 800 328)"/>
  <line x1="580" y1="368" x2="1020" y2="364" stroke="#78350f" stroke-width="2" stroke-opacity="0.3" transform="rotate(-2 800 366)"/>
  <line x1="580" y1="406" x2="1020" y2="402" stroke="#78350f" stroke-width="2" stroke-opacity="0.3" transform="rotate(-2 800 404)"/>
  <line x1="580" y1="444" x2="900" y2="440" stroke="#78350f" stroke-width="2" stroke-opacity="0.25" transform="rotate(-2 800 442)"/>

  <!-- Node accent: three connected dots suggesting a conference network -->
  <!-- Central node -->
  <circle cx="800" cy="530" r="18" fill="url(#nodeglow)" opacity="0.95"/>
  <circle cx="800" cy="530" r="10" fill="#fbbf24" opacity="0.9"/>

  <!-- Left satellite node -->
  <circle cx="670" cy="570" r="11" fill="#d97706" opacity="0.8"/>
  <circle cx="670" cy="570" r="6" fill="#fbbf24" opacity="0.75"/>

  <!-- Right satellite node -->
  <circle cx="930" cy="560" r="11" fill="#d97706" opacity="0.8"/>
  <circle cx="930" cy="560" r="6" fill="#fbbf24" opacity="0.75"/>

  <!-- Connection lines between nodes -->
  <line x1="680" y1="566" x2="790" y2="534" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="810" y1="534" x2="920" y2="558" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone, atmospheric) -->
  <!-- Bottom-left corner warm glow -->
  <ellipse cx="0" cy="900" rx="320" ry="220" fill="#c2410c" opacity="0.08"/>
  <!-- Top-right corner glow -->
  <ellipse cx="1600" cy="0" rx="280" ry="200" fill="#d97706" opacity="0.06"/>
</svg>
