<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background nocturnal gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d1a0a" />
      <stop offset="55%" stop-color="#1f0d07" />
      <stop offset="100%" stop-color="#0d0604" />
    </radialGradient>

    <!-- Warm rust glow behind plate -->
    <radialGradient id="plateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0" />
    </radialGradient>

    <!-- Plate surface gradient -->
    <radialGradient id="plateFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#faf8f2" />
      <stop offset="60%" stop-color="#e8e0d0" />
      <stop offset="100%" stop-color="#c8bfad" />
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="rimFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d4cbbe" />
      <stop offset="100%" stop-color="#a89e8e" />
    </radialGradient>

    <!-- Cloche dome gradient -->
    <linearGradient id="clocheFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5c1d08" stop-opacity="0.95" />
    </linearGradient>

    <!-- Cloche highlight -->
    <linearGradient id="clocheSheen" x1="20%" y1="5%" x2="60%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </linearGradient>

    <!-- Star accent glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)" />

  <!-- Ambient warm glow pool — full bleed, atmospheric -->
  <ellipse cx="800" cy="480" rx="680" ry="420" fill="url(#plateGlow)" />

  <!-- Layer 2: Hero — plate + cloche centered at (800, 450) -->

  <!-- Plate rim (outer ring) -->
  <ellipse cx="800" cy="560" rx="360" ry="38" fill="#3a1a0a" opacity="0.6" />
  <!-- Plate shadow -->
  <ellipse cx="800" cy="555" rx="340" ry="28" fill="#1a0804" opacity="0.8" />

  <!-- Plate surface -->
  <ellipse cx="800" cy="540" rx="330" ry="34" fill="url(#rimFill)" />
  <ellipse cx="800" cy="535" rx="298" ry="30" fill="url(#plateFill)" />

  <!-- Inner plate well (food landing zone suggestion) -->
  <ellipse cx="800" cy="532" rx="210" ry="22" fill="#f0ebe0" opacity="0.6" />

  <!-- Cloche dome body — elliptical arch sitting on the plate -->
  <path d="M 500,540 Q 500,220 800,210 Q 1100,220 1100,540 Z"
        fill="url(#clocheFill)" opacity="0.92" />

  <!-- Cloche sheen overlay -->
  <path d="M 500,540 Q 500,220 800,210 Q 1100,220 1100,540 Z"
        fill="url(#clocheSheen)" />

  <!-- Cloche base band -->
  <ellipse cx="800" cy="540" rx="300" ry="18" fill="#78350f" opacity="0.85" />
  <ellipse cx="800" cy="538" rx="296" ry="14" fill="#9a3309" opacity="0.7" />

  <!-- Cloche knob -->
  <ellipse cx="800" cy="212" rx="28" ry="14" fill="#d97706" opacity="0.95" />
  <ellipse cx="800" cy="208" rx="22" ry="10" fill="#fbbf24" opacity="0.85" />

  <!-- Michelin star accent — three small star shapes above the cloche knob -->
  <!-- Star 1 (left) -->
  <circle cx="724" cy="188" r="10" fill="url(#starGlow)" opacity="0.9" />
  <circle cx="724" cy="188" r="5" fill="#fbbf24" opacity="0.95" />

  <!-- Star 2 (center, slightly higher) -->
  <circle cx="800" cy="178" r="12" fill="url(#starGlow)" opacity="0.95" />
  <circle cx="800" cy="178" r="6" fill="#fbbf24" />

  <!-- Star 3 (right) -->
  <circle cx="876" cy="188" r="10" fill="url(#starGlow)" opacity="0.9" />
  <circle cx="876" cy="188" r="5" fill="#fbbf24" opacity="0.95" />

  <!-- Layer 3: Edge atmosphere (full-bleed decorative, may crop) -->
  <!-- Subtle vignette corners — darkening the extremes -->
  <radialGradient id="vignetteL" cx="0%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#0d0604" stop-opacity="0.7" />
    <stop offset="100%" stop-color="#0d0604" stop-opacity="0" />
  </radialGradient>
  <radialGradient id="vignetteR" cx="100%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#0d0604" stop-opacity="0.7" />
    <stop offset="100%" stop-color="#0d0604" stop-opacity="0" />
  </radialGradient>

  <rect width="600" height="900" fill="url(#vignetteL)" />
  <rect x="1000" width="600" height="900" fill="url(#vignetteR)" />
</svg>
