<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#2d1209"/>
      <stop offset="100%" stop-color="#0e0808"/>
    </linearGradient>

    <!-- Warm central radial glow (hearth / lamp above the counter) -->
    <radialGradient id="glow" cx="50%" cy="48%" r="38%">
      <stop offset="0%"  stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero plate — outer lacquer ring gradient -->
    <radialGradient id="plateOuter" cx="50%" cy="44%" r="50%">
      <stop offset="0%"  stop-color="#78350f"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#3b1309"/>
    </radialGradient>

    <!-- Hero plate — inner well gradient -->
    <radialGradient id="plateInner" cx="50%" cy="42%" r="50%">
      <stop offset="0%"  stop-color="#9a3309" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#78350f" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#3b1309" stop-opacity="0.50"/>
    </radialGradient>

    <!-- Small accent bowl gradient -->
    <radialGradient id="bowl" cx="50%" cy="40%" r="50%">
      <stop offset="0%"  stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b1309" stop-opacity="0.20"/>
    </radialGradient>

    <!-- Tray surface gradient -->
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#2d1209"/>
    </linearGradient>

    <!-- Rim highlight -->
    <radialGradient id="rimShine" cx="35%" cy="30%" r="55%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centered on hero -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- Subtle horizontal surface line — the counter edge -->
  <rect x="200" y="596" width="1200" height="2" fill="#5c2a1a" opacity="0.45"/>
  <rect x="200" y="598" width="1200" height="1" fill="#d97706" opacity="0.12"/>

  <!-- Layer 2: Hero element — lacquerware tray + plates, centered ~(800,450) -->

  <!-- Tray: dark lacquer rectangle, slightly rounded -->
  <rect x="480" y="470" width="640" height="140" rx="8" ry="8"
        fill="url(#tray)" opacity="0.88"/>
  <!-- Tray top-edge highlight line -->
  <rect x="488" y="471" width="624" height="1" fill="#d97706" opacity="0.22"/>

  <!-- Main plate: large lacquer ellipse -->
  <ellipse cx="760" cy="480" rx="220" ry="148" fill="url(#plateOuter)" opacity="0.95"/>
  <!-- Plate inner well -->
  <ellipse cx="760" cy="476" rx="172" ry="116" fill="url(#plateInner)" opacity="0.90"/>
  <!-- Plate rim highlight -->
  <ellipse cx="760" cy="476" rx="172" ry="116" fill="url(#rimShine)" opacity="1"/>
  <!-- Tiny central accent — a single garnish dot, rose -->
  <ellipse cx="760" cy="472" rx="22" ry="14" fill="#be185d" opacity="0.62"/>
  <ellipse cx="757" cy="470" rx="8" ry="5"  fill="#fbbf24" opacity="0.35"/>

  <!-- Small accent bowl: upper-right on the tray -->
  <ellipse cx="960" cy="488" rx="90" ry="60"  fill="url(#bowl)"      opacity="0.88"/>
  <ellipse cx="960" cy="484" rx="66" ry="44"  fill="#3b1309"          opacity="0.70"/>
  <ellipse cx="960" cy="484" rx="66" ry="44"  fill="url(#rimShine)"   opacity="0.80"/>
  <!-- Bowl inner — dark lacquer well -->
  <ellipse cx="960" cy="482" rx="42" ry="28"  fill="#1a0e0e"          opacity="0.75"/>

  <!-- Chopstick pair — two slim angled lines, resting beside the plate -->
  <!-- Left chopstick -->
  <line x1="618" y1="430" x2="598" y2="598"
        stroke="#c2410c" stroke-width="4" stroke-linecap="round" opacity="0.70"/>
  <!-- Right chopstick, offset by taper gap -->
  <line x1="630" y1="430" x2="612" y2="598"
        stroke="#9a3309" stroke-width="3" stroke-linecap="round" opacity="0.60"/>
  <!-- Chopstick tip accents (gold tips — lacquered ends) -->
  <ellipse cx="599" cy="597" rx="4" ry="2.5" fill="#fbbf24" opacity="0.55" transform="rotate(-9,599,597)"/>
  <ellipse cx="613" cy="596" rx="3" ry="2"   fill="#d97706" opacity="0.45" transform="rotate(-9,613,596)"/>

  <!-- Layer 3: Full-bleed edge decoration (outside safe zone — atmospheric) -->

  <!-- Top-left corner: faint karesansui arc suggesting a moon or bowl rim -->
  <ellipse cx="80" cy="80" rx="200" ry="200"
           fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.18"/>
  <ellipse cx="80" cy="80" rx="240" ry="240"
           fill="none" stroke="#5c2a1a" stroke-width="1"   opacity="0.12"/>

  <!-- Bottom-right corner: mirrored arcs -->
  <ellipse cx="1520" cy="820" rx="200" ry="200"
           fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.18"/>
  <ellipse cx="1520" cy="820" rx="240" ry="240"
           fill="none" stroke="#5c2a1a" stroke-width="1"   opacity="0.12"/>

  <!-- Full-bleed bottom vignette to ground the composition -->
  <rect x="0" y="700" width="1600" height="200"
        fill="url(#bg)" opacity="0.55"/>
</svg>
