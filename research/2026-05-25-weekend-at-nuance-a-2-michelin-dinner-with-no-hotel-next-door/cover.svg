<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#f0eadb" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm radial glow behind the hero (candlelight) -->
  <circle cx="800" cy="500" r="520" fill="url(#glow)"/>

  <!-- Distant Flemish town silhouette (decoration, edges may crop) -->
  <g opacity="0.55" fill="#1a0e0e">
    <!-- gabled rooftops left -->
    <path d="M 0 720 L 90 720 L 90 660 L 130 620 L 170 660 L 170 720 L 250 720 L 250 680 L 280 650 L 310 680 L 310 720 L 380 720 L 380 700 L 0 700 Z"/>
    <!-- St Rumbold-style church tower, distant, off-hero -->
    <path d="M 1320 720 L 1320 520 L 1330 510 L 1330 480 L 1345 470 L 1345 450 L 1360 440 L 1375 450 L 1375 470 L 1390 480 L 1390 510 L 1400 520 L 1400 720 Z"/>
    <!-- gabled rooftops right -->
    <path d="M 1420 720 L 1420 670 L 1455 640 L 1490 670 L 1490 720 L 1560 720 L 1560 690 L 1600 690 L 1600 720 Z"/>
    <!-- ground line -->
    <rect x="0" y="715" width="1600" height="10"/>
  </g>

  <!-- HERO: wine glass + plate, centered around (800, 450), inside safe zone -->
  <g transform="translate(800 450)">
    <!-- Plate (ellipse, beneath glass) -->
    <ellipse cx="0" cy="180" rx="340" ry="46" fill="url(#plate)" opacity="0.9"/>
    <ellipse cx="0" cy="180" rx="250" ry="30" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
    <!-- Small accent on plate -->
    <circle cx="0" cy="180" r="8" fill="#c2410c" opacity="0.75"/>
    <circle cx="-22" cy="178" r="3" fill="#fbbf24" opacity="0.85"/>
    <circle cx="24" cy="182" r="3" fill="#fbbf24" opacity="0.85"/>

    <!-- Wine glass bowl -->
    <path d="M -110 -240 Q -110 -60 0 -40 Q 110 -60 110 -240 Z"
          fill="url(#wine)" opacity="0.92"/>
    <!-- Glass highlight rim -->
    <path d="M -110 -240 Q -110 -60 0 -40 Q 110 -60 110 -240"
          fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <!-- Wine meniscus -->
    <ellipse cx="0" cy="-200" rx="108" ry="14" fill="#9a3309" opacity="0.9"/>
    <ellipse cx="0" cy="-202" rx="108" ry="6" fill="#fbbf24" opacity="0.35"/>
    <!-- Glass body highlight -->
    <path d="M -90 -230 Q -95 -120 -30 -55" fill="none" stroke="url(#glass)" stroke-width="6" opacity="0.7"/>

    <!-- Stem -->
    <rect x="-4" y="-40" width="8" height="180" fill="#78350f" opacity="0.9"/>
    <!-- Base -->
    <ellipse cx="0" cy="142" rx="70" ry="10" fill="#78350f" opacity="0.9"/>
    <ellipse cx="0" cy="140" rx="70" ry="6" fill="#c2410c" opacity="0.6"/>
  </g>

  <!-- Single star accent (Michelin nod, abstract not branded), upper safe zone -->
  <g transform="translate(1180 220)" opacity="0.85">
    <path d="M 0 -32 L 9 -10 L 32 -10 L 13 5 L 20 28 L 0 14 L -20 28 L -13 5 L -32 -10 L -9 -10 Z"
          fill="#fbbf24"/>
  </g>
</svg>
