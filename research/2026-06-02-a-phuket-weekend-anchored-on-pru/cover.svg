<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Nocturnal background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate rim gradient -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="78%" stop-color="#9a3309" stop-opacity="0.0"/>
      <stop offset="88%" stop-color="#d97706" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Inner plate gradient -->
    <radialGradient id="plateInner" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.05"/>
    </radialGradient>
    <!-- Frond stroke gradient -->
    <linearGradient id="frondL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="frondR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient warm glow spread across center -->
  <ellipse cx="800" cy="450" rx="780" ry="500" fill="url(#glow)"/>

  <!-- Layer 2: Hero — fine-dining plate at center (800, 450) -->

  <!-- Outer plate rim ring -->
  <circle cx="800" cy="450" r="290" fill="url(#plateRim)" stroke="#c2410c" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Plate surface -->
  <circle cx="800" cy="450" r="288" fill="url(#plateInner)"/>

  <!-- Inner presentation ring (the "well" of a fine-dining plate) -->
  <circle cx="800" cy="450" r="195" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Subtle second inner ring — cloche reference -->
  <circle cx="800" cy="450" r="110" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Focal dot — the composed dish center -->
  <circle cx="800" cy="450" r="28" fill="#d97706" fill-opacity="0.82"/>
  <circle cx="800" cy="450" r="14" fill="#fbbf24" fill-opacity="0.70"/>

  <!-- Layer 3: decorative fronds — outside safe zone / at edges -->
  <!-- Left palm frond arcs -->
  <path d="M 200 820 Q 480 560 650 370" fill="none" stroke="url(#frondL)" stroke-width="28" stroke-linecap="round" stroke-opacity="0.38"/>
  <path d="M 130 740 Q 420 530 620 390" fill="none" stroke="url(#frondL)" stroke-width="16" stroke-linecap="round" stroke-opacity="0.25"/>
  <path d="M 60 680 Q 360 520 590 400" fill="none" stroke="url(#frondL)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.18"/>

  <!-- Right palm frond arcs -->
  <path d="M 1400 820 Q 1120 560 950 370" fill="none" stroke="url(#frondR)" stroke-width="28" stroke-linecap="round" stroke-opacity="0.38"/>
  <path d="M 1470 740 Q 1180 530 980 390" fill="none" stroke="url(#frondR)" stroke-width="16" stroke-linecap="round" stroke-opacity="0.25"/>
  <path d="M 1540 680 Q 1240 520 1010 400" fill="none" stroke="url(#frondR)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.18"/>

  <!-- Horizon line — the Andaman Sea at dusk, below hero -->
  <rect x="0" y="780" width="1600" height="3" fill="#d97706" fill-opacity="0.22"/>
  <rect x="0" y="783" width="1600" height="117" fill="#78350f" fill-opacity="0.30"/>
</svg>
