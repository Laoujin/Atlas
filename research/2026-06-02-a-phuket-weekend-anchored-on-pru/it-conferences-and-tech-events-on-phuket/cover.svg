<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1409"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="node2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centred on hero -->
  <ellipse cx="800" cy="450" rx="560" ry="380" fill="url(#glow)"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <ellipse cx="0" cy="0" rx="260" ry="180" fill="none"
    stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.18"/>
  <ellipse cx="1600" cy="900" rx="260" ry="180" fill="none"
    stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Layer 2: Hero — orbit network centred at (800, 450) -->

  <!-- Outer orbit ellipse -->
  <ellipse cx="800" cy="450" rx="390" ry="220"
    fill="none" stroke="#c2410c" stroke-width="1.8" stroke-opacity="0.55"
    stroke-dasharray="8 6"/>

  <!-- Inner orbit ellipse -->
  <ellipse cx="800" cy="450" rx="220" ry="125"
    fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.5"
    stroke-dasharray="5 5"/>

  <!-- Connection lines: hub to outer nodes -->
  <line x1="800" y1="450" x2="1120" y2="390" stroke="#d97706" stroke-width="1.4" stroke-opacity="0.45"/>
  <line x1="800" y1="450" x2="980" y2="645" stroke="#c2410c" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="800" y1="450" x2="490" y2="640" stroke="#d97706" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="800" y1="450" x2="430" y2="310" stroke="#c2410c" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="800" y1="450" x2="750" y2="240" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Connection lines: hub to inner nodes -->
  <line x1="800" y1="450" x2="1000" y2="410" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="800" y1="450" x2="620" y2="345" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="800" y1="450" x2="610" y2="545" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Outer orbit nodes -->
  <circle cx="1120" cy="390" r="20" fill="url(#node2)" opacity="0.88"/>
  <circle cx="980" cy="645" r="16" fill="url(#node2)" opacity="0.8"/>
  <circle cx="490" cy="640" r="18" fill="url(#node1)" opacity="0.82"/>
  <circle cx="430" cy="310" r="22" fill="url(#node2)" opacity="0.85"/>
  <circle cx="750" cy="240" r="14" fill="url(#node1)" opacity="0.75"/>

  <!-- Inner orbit nodes -->
  <circle cx="1000" cy="410" r="12" fill="url(#node1)" opacity="0.8"/>
  <circle cx="620" cy="345" r="13" fill="url(#node2)" opacity="0.78"/>
  <circle cx="610" cy="545" r="11" fill="url(#node1)" opacity="0.75"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="62" fill="url(#hub)" opacity="0.92"/>
  <!-- Hub inner ring accent -->
  <circle cx="800" cy="450" r="75" fill="none"
    stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4"/>
</svg>
