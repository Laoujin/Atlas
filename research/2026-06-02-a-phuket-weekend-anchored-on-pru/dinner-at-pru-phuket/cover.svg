<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Candlelight radial glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer plate gradient -->
    <radialGradient id="plateOuter" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#3a1a0a"/>
      <stop offset="70%" stop-color="#221008"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </radialGradient>
    <!-- Inner plate gradient -->
    <radialGradient id="plateInner" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#4a2010"/>
      <stop offset="100%" stop-color="#2a0e06"/>
    </radialGradient>
    <!-- Rose accent ring gradient -->
    <radialGradient id="roseRing" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#be185d" stop-opacity="0"/>
      <stop offset="92%" stop-color="#be185d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <!-- Rust warm rim glow -->
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#c2410c" stop-opacity="0"/>
      <stop offset="93%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Botanical leaf fill -->
    <linearGradient id="leafFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Corner vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0505" stop-opacity="0.82"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Candlelight atmosphere glow, centered -->
  <ellipse cx="800" cy="450" rx="680" ry="430" fill="url(#glow)"/>

  <!-- Layer 2: Hero — plate composition centered at (800, 450) -->

  <!-- Outer plate rim (decorative ring, rose accent) -->
  <circle cx="800" cy="450" r="290" fill="url(#roseRing)" opacity="0.9"/>

  <!-- Outer plate body -->
  <circle cx="800" cy="450" r="272" fill="url(#plateOuter)" opacity="0.97"/>

  <!-- Rust warm inner rim glow -->
  <circle cx="800" cy="450" r="272" fill="url(#rimGlow)" opacity="0.85"/>

  <!-- Inner plate well -->
  <circle cx="800" cy="450" r="210" fill="url(#plateInner)" opacity="0.95"/>

  <!-- Subtle inner ring line -->
  <circle cx="800" cy="450" r="210" fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.3"/>
  <circle cx="800" cy="450" r="272" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.18"/>

  <!-- Botanical hero: abstract herb sprig on plate, no faces, no text -->
  <!-- Central stem -->
  <path d="M800 530 C800 490 800 440 800 370" stroke="url(#leafFill)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.88"/>

  <!-- Left leaf pair, lower -->
  <path d="M800 500 C775 490 755 472 762 452 C770 445 786 458 800 470" fill="url(#leafFill)" opacity="0.82"/>
  <!-- Right leaf pair, lower -->
  <path d="M800 500 C825 490 845 472 838 452 C830 445 814 458 800 470" fill="url(#leafFill)" opacity="0.82"/>

  <!-- Left leaf, mid -->
  <path d="M800 465 C770 455 748 433 757 410 C765 401 784 416 800 432" fill="url(#leafFill)" opacity="0.75"/>
  <!-- Right leaf, mid -->
  <path d="M800 465 C830 455 852 433 843 410 C835 401 816 416 800 432" fill="url(#leafFill)" opacity="0.75"/>

  <!-- Top small leaf bud -->
  <path d="M800 400 C788 388 784 372 800 370 C816 372 812 388 800 400" fill="#fbbf24" opacity="0.72"/>

  <!-- Tiny dew dot accents on the plate well -->
  <circle cx="742" cy="418" r="4" fill="#d97706" opacity="0.45"/>
  <circle cx="858" cy="426" r="3" fill="#fbbf24" opacity="0.38"/>
  <circle cx="768" cy="502" r="3" fill="#c2410c" opacity="0.4"/>

  <!-- Layer 3: Decorative outside safe zone -->
  <!-- Corner vignette for depth -->
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Subtle full-bleed edge warmth lines — atmospheric only -->
  <line x1="0" y1="0" x2="1600" y2="900" stroke="#9a3309" stroke-width="0.5" opacity="0.07"/>
  <line x1="1600" y1="0" x2="0" y2="900" stroke="#9a3309" stroke-width="0.5" opacity="0.07"/>
</svg>
