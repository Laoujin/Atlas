<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind lighthouse -->
  <circle cx="800" cy="500" r="380" fill="url(#sun)"/>

  <!-- Distant horizon / sea band -->
  <rect x="0" y="610" width="1600" height="290" fill="url(#water)"/>

  <!-- Salt-marsh geometric panels (decoration, partially in safe zone, partially bleeding) -->
  <g opacity="0.45" fill="none" stroke="#78350f" stroke-width="2">
    <rect x="120" y="690" width="180" height="60"/>
    <rect x="300" y="690" width="180" height="60"/>
    <rect x="120" y="750" width="240" height="50"/>
    <rect x="360" y="750" width="180" height="50"/>
    <line x1="120" y1="720" x2="480" y2="720"/>
    <rect x="1100" y="700" width="180" height="55"/>
    <rect x="1280" y="700" width="180" height="55"/>
    <rect x="1180" y="755" width="200" height="45"/>
    <line x1="1100" y1="730" x2="1460" y2="730"/>
  </g>

  <!-- Oyster racks silhouettes (small posts at horizon) -->
  <g opacity="0.55" stroke="#5c2a1a" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="630" x2="200" y2="660"/>
    <line x1="240" y1="630" x2="240" y2="660"/>
    <line x1="280" y1="635" x2="280" y2="660"/>
    <line x1="320" y1="635" x2="320" y2="660"/>
    <line x1="200" y1="640" x2="320" y2="640"/>
    <line x1="1280" y1="635" x2="1280" y2="660"/>
    <line x1="1320" y1="635" x2="1320" y2="660"/>
    <line x1="1360" y1="635" x2="1360" y2="660"/>
    <line x1="1400" y1="635" x2="1400" y2="660"/>
    <line x1="1280" y1="643" x2="1400" y2="643"/>
  </g>

  <!-- Lighthouse base/rock -->
  <ellipse cx="800" cy="660" rx="160" ry="22" fill="#5c2a1a" opacity="0.7"/>

  <!-- Lighthouse tower (hero, centered ~800,450) -->
  <polygon points="755,640 845,640 825,260 775,260" fill="url(#tower)"/>

  <!-- Tower horizontal bands -->
  <rect x="763" y="430" width="74" height="14" fill="#faf8f2" opacity="0.85"/>
  <rect x="770" y="540" width="60" height="10" fill="#faf8f2" opacity="0.7"/>

  <!-- Gallery deck -->
  <rect x="765" y="240" width="70" height="22" fill="#5c2a1a"/>
  <rect x="760" y="234" width="80" height="8" fill="#78350f"/>

  <!-- Lantern room -->
  <rect x="775" y="195" width="50" height="45" fill="#fbbf24" opacity="0.9"/>
  <rect x="775" y="195" width="50" height="45" fill="none" stroke="#78350f" stroke-width="2"/>

  <!-- Dome cap -->
  <path d="M 770 195 Q 800 165 830 195 Z" fill="#9a3309"/>
  <line x1="800" y1="165" x2="800" y2="138" stroke="#5c2a1a" stroke-width="3"/>
  <circle cx="800" cy="135" r="5" fill="#5c2a1a"/>

  <!-- Light beam, soft -->
  <polygon points="800,217 540,330 540,360 800,225" fill="#fbbf24" opacity="0.18"/>
  <polygon points="800,217 1060,330 1060,360 800,225" fill="#fbbf24" opacity="0.18"/>

  <!-- Tidal causeway suggestion: thin path disappearing into water -->
  <path d="M 380 720 Q 700 690 800 660" stroke="#78350f" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M 380 720 Q 700 690 800 660" stroke="#fef3ec" stroke-width="2" stroke-dasharray="14 18" fill="none" opacity="0.7"/>
</svg>
