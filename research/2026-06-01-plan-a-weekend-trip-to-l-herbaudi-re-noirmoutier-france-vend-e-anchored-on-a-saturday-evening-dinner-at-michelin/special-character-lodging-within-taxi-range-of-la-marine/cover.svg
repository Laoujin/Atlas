<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5a78"/>
      <stop offset="1" stop-color="#2a4259"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Setting sun glow -->
  <circle cx="1180" cy="520" r="280" fill="url(#sun)"/>

  <!-- Distant dune silhouette -->
  <path d="M0,610 Q260,575 480,600 T940,590 T1380,605 T1600,595 L1600,640 L0,640 Z" fill="#78350f" opacity="0.45"/>

  <!-- Harbour water -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#water)"/>

  <!-- Water highlight ripples -->
  <path d="M120,720 Q360,712 600,722 T1080,720 T1500,725" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M200,780 Q460,772 700,782 T1180,780 T1520,785" stroke="#fef3ec" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- Lighthouse (decoration, right side, inside safe zone) -->
  <g opacity="0.9">
    <rect x="1320" y="360" width="36" height="260" fill="url(#wall)"/>
    <rect x="1320" y="395" width="36" height="18" fill="#c2410c"/>
    <rect x="1320" y="455" width="36" height="18" fill="#c2410c"/>
    <rect x="1320" y="515" width="36" height="18" fill="#c2410c"/>
    <rect x="1312" y="340" width="52" height="22" fill="#78350f"/>
    <polygon points="1312,340 1338,310 1364,340" fill="#9a3309"/>
    <circle cx="1338" cy="325" r="6" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- HERO: Vendée fisherman's cottage, centered ~(800, 450) -->
  <g>
    <!-- Roof -->
    <polygon points="430,360 800,200 1170,360" fill="url(#roof)"/>
    <!-- Roof ridge shadow -->
    <polygon points="430,360 800,200 800,220 440,372" fill="#5c2a1a" opacity="0.35"/>
    <!-- Wall -->
    <rect x="440" y="360" width="720" height="280" fill="url(#wall)"/>
    <!-- Wall base shadow -->
    <rect x="440" y="620" width="720" height="20" fill="#78350f" opacity="0.25"/>
    <!-- Chimney -->
    <rect x="920" y="240" width="40" height="60" fill="#faf8f2"/>
    <rect x="916" y="232" width="48" height="12" fill="#78350f"/>

    <!-- Door (centered) -->
    <rect x="772" y="470" width="56" height="170" fill="url(#shutter)"/>
    <rect x="778" y="478" width="44" height="78" fill="#2a4259" opacity="0.6"/>
    <rect x="778" y="562" width="44" height="70" fill="#2a4259" opacity="0.6"/>
    <circle cx="818" cy="558" r="2.5" fill="#fbbf24"/>

    <!-- Left windows with blue shutters -->
    <g>
      <rect x="500" y="410" width="84" height="96" fill="#fef3ec"/>
      <rect x="500" y="410" width="20" height="96" fill="url(#shutter)"/>
      <rect x="564" y="410" width="20" height="96" fill="url(#shutter)"/>
      <line x1="542" y1="410" x2="542" y2="506" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
      <line x1="520" y1="458" x2="564" y2="458" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
    </g>
    <g>
      <rect x="630" y="410" width="84" height="96" fill="#fef3ec"/>
      <rect x="630" y="410" width="20" height="96" fill="url(#shutter)"/>
      <rect x="694" y="410" width="20" height="96" fill="url(#shutter)"/>
      <line x1="672" y1="410" x2="672" y2="506" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
      <line x1="650" y1="458" x2="694" y2="458" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Right windows with blue shutters -->
    <g>
      <rect x="886" y="410" width="84" height="96" fill="#fef3ec"/>
      <rect x="886" y="410" width="20" height="96" fill="url(#shutter)"/>
      <rect x="950" y="410" width="20" height="96" fill="url(#shutter)"/>
      <line x1="928" y1="410" x2="928" y2="506" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
      <line x1="906" y1="458" x2="950" y2="458" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
    </g>
    <g>
      <rect x="1016" y="410" width="84" height="96" fill="#fef3ec"/>
      <rect x="1016" y="410" width="20" height="96" fill="url(#shutter)"/>
      <rect x="1080" y="410" width="20" height="96" fill="url(#shutter)"/>
      <line x1="1058" y1="410" x2="1058" y2="506" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
      <line x1="1036" y1="458" x2="1080" y2="458" stroke="#9a3309" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Warm interior glow from window centers -->
    <rect x="520" y="410" width="44" height="96" fill="#fbbf24" opacity="0.25"/>
    <rect x="650" y="410" width="44" height="96" fill="#fbbf24" opacity="0.25"/>
    <rect x="906" y="410" width="44" height="96" fill="#fbbf24" opacity="0.25"/>
    <rect x="1036" y="410" width="44" height="96" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- Marram grass tufts in foreground (decoration, partially outside safe zone) -->
  <g opacity="0.55" stroke="#78350f" stroke-width="1.5" fill="none">
    <path d="M80,860 L70,810 M88,860 L92,815 M96,860 L102,820"/>
    <path d="M1480,855 L1472,810 M1492,855 L1496,815 M1504,855 L1510,818"/>
  </g>
</svg>
