<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: pale sea -->
  <rect width="1600" height="900" fill="url(#sea)"/>

  <!-- Faint horizontal water bands across full bleed -->
  <g stroke="#c2410c" stroke-opacity="0.06" stroke-width="1" fill="none">
    <path d="M0 200 Q 400 195 800 200 T 1600 200"/>
    <path d="M0 720 Q 400 716 800 720 T 1600 720"/>
    <path d="M0 800 Q 400 795 800 800 T 1600 800"/>
  </g>

  <!-- Sparse signal dots (decoration, mostly outside hero) -->
  <g fill="#9a3309" fill-opacity="0.35">
    <circle cx="180" cy="180" r="3"/>
    <circle cx="1420" cy="260" r="2.5"/>
    <circle cx="1500" cy="640" r="3"/>
    <circle cx="220" cy="780" r="2.5"/>
    <circle cx="1340" cy="820" r="2"/>
    <circle cx="120" cy="500" r="2"/>
  </g>

  <!-- Hero centered at ~(800, 450) -->
  <!-- 30km search radius glow -->
  <circle cx="800" cy="450" r="340" fill="url(#glow)"/>

  <!-- Dashed radius ring -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 10"/>
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Island silhouette (Noirmoutier-ish elongated shape) -->
  <path d="M 640 380
           Q 600 360 620 340
           Q 660 318 720 322
           Q 780 320 830 330
           Q 880 340 910 360
           Q 945 380 935 410
           Q 925 440 880 458
           Q 830 478 780 482
           Q 720 488 680 478
           Q 640 468 625 440
           Q 615 410 640 380 Z"
        fill="url(#land)" opacity="0.92"/>

  <!-- Coastline highlight -->
  <path d="M 640 380
           Q 600 360 620 340
           Q 660 318 720 322
           Q 780 320 830 330
           Q 880 340 910 360"
        fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Single hero locator dot on the island (La Marine / L'Herbaudière, NW tip) -->
  <circle cx="675" cy="350" r="9" fill="#fbbf24"/>
  <circle cx="675" cy="350" r="9" fill="none" stroke="#c2410c" stroke-width="2"/>
  <circle cx="675" cy="350" r="22" fill="none" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Two faint distant signals at edge of radius (the rare events inland) -->
  <circle cx="1080" cy="560" r="4" fill="#9a3309" fill-opacity="0.55"/>
  <circle cx="560" cy="600" r="3.5" fill="#9a3309" fill-opacity="0.5"/>
</svg>
