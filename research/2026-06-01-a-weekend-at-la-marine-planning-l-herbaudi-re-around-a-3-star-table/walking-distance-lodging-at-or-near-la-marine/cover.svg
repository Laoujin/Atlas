<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.42" r="0.18">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="houseA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="houseB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- sun glow -->
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant headland -->
  <path d="M0 555 L240 535 L460 548 L700 525 L960 540 L1240 520 L1600 545 L1600 590 L0 590 Z" fill="#78350f" opacity="0.35"/>

  <!-- harbour water -->
  <rect x="0" y="585" width="1600" height="315" fill="url(#water)"/>

  <!-- quay -->
  <rect x="0" y="575" width="1600" height="22" fill="#5c2a1a" opacity="0.85"/>

  <!-- left house (hero cluster) -->
  <g>
    <rect x="560" y="360" width="220" height="220" fill="url(#houseA)" opacity="0.95"/>
    <polygon points="545,365 790,365 720,275 615,275" fill="url(#roof)" opacity="0.9"/>
    <!-- shuttered windows -->
    <rect x="595" y="410" width="38" height="58" fill="#9a3309" opacity="0.75"/>
    <rect x="640" y="410" width="38" height="58" fill="#9a3309" opacity="0.75"/>
    <rect x="700" y="410" width="38" height="58" fill="#9a3309" opacity="0.75"/>
    <rect x="745" y="410" width="38" height="58" fill="#9a3309" opacity="0.75"/>
    <!-- door -->
    <rect x="650" y="495" width="42" height="85" fill="#5c2a1a" opacity="0.85"/>
    <!-- chimney -->
    <rect x="690" y="255" width="22" height="40" fill="#78350f"/>
  </g>

  <!-- right house (slightly taller, terracotta) -->
  <g>
    <rect x="780" y="320" width="260" height="260" fill="url(#houseB)" opacity="0.95"/>
    <polygon points="765,325 1055,325 985,225 855,225" fill="url(#roof)" opacity="0.95"/>
    <!-- shuttered windows -->
    <rect x="815" y="375" width="44" height="64" fill="#78350f" opacity="0.8"/>
    <rect x="870" y="375" width="44" height="64" fill="#78350f" opacity="0.8"/>
    <rect x="930" y="375" width="44" height="64" fill="#78350f" opacity="0.8"/>
    <rect x="985" y="375" width="44" height="64" fill="#78350f" opacity="0.8"/>
    <rect x="815" y="465" width="44" height="64" fill="#78350f" opacity="0.8"/>
    <rect x="930" y="465" width="44" height="64" fill="#78350f" opacity="0.8"/>
    <!-- door -->
    <rect x="875" y="465" width="48" height="115" fill="#5c2a1a" opacity="0.9"/>
    <!-- chimney -->
    <rect x="950" y="200" width="24" height="42" fill="#78350f"/>
  </g>

  <!-- small annex right -->
  <g>
    <rect x="1040" y="430" width="140" height="150" fill="url(#houseA)" opacity="0.9"/>
    <polygon points="1028,435 1192,435 1155,385 1065,385" fill="url(#roof)" opacity="0.9"/>
    <rect x="1065" y="465" width="32" height="46" fill="#9a3309" opacity="0.75"/>
    <rect x="1115" y="465" width="32" height="46" fill="#9a3309" opacity="0.75"/>
    <rect x="1085" y="525" width="34" height="55" fill="#5c2a1a" opacity="0.85"/>
  </g>

  <!-- foreground fishing boat (centre) -->
  <g>
    <!-- hull -->
    <path d="M620 690 Q800 660 980 690 L955 760 Q800 780 645 760 Z" fill="url(#hull)"/>
    <!-- cabin -->
    <rect x="755" y="625" width="110" height="55" fill="#fbbf24" opacity="0.85"/>
    <rect x="770" y="640" width="22" height="28" fill="#5c2a1a" opacity="0.8"/>
    <rect x="800" y="640" width="22" height="28" fill="#5c2a1a" opacity="0.8"/>
    <rect x="830" y="640" width="22" height="28" fill="#5c2a1a" opacity="0.8"/>
    <!-- mast -->
    <rect x="808" y="500" width="4" height="130" fill="#5c2a1a"/>
    <line x1="810" y1="510" x2="710" y2="625" stroke="#5c2a1a" stroke-width="1.5" opacity="0.7"/>
    <line x1="810" y1="510" x2="910" y2="625" stroke="#5c2a1a" stroke-width="1.5" opacity="0.7"/>
    <!-- waterline reflection -->
    <ellipse cx="800" cy="775" rx="180" ry="6" fill="#1a0e0e" opacity="0.35"/>
  </g>

  <!-- second smaller boat right -->
  <g>
    <path d="M1100 705 Q1220 685 1340 705 L1320 755 Q1220 770 1115 755 Z" fill="#78350f" opacity="0.9"/>
    <rect x="1190" y="665" width="65" height="40" fill="#d97706" opacity="0.85"/>
    <rect x="1219" y="595" width="3" height="70" fill="#5c2a1a"/>
    <ellipse cx="1220" cy="770" rx="115" ry="4" fill="#1a0e0e" opacity="0.3"/>
  </g>

  <!-- third small boat left -->
  <g>
    <path d="M280 715 Q400 700 520 715 L505 758 Q400 770 295 758 Z" fill="#5c2a1a" opacity="0.85"/>
    <rect x="396" y="670" width="3" height="45" fill="#5c2a1a"/>
    <ellipse cx="400" cy="772" rx="115" ry="4" fill="#1a0e0e" opacity="0.3"/>
  </g>

  <!-- water highlights -->
  <path d="M120 640 Q200 635 280 640" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M1280 650 Q1380 645 1480 650" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M540 820 Q700 815 860 820" stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.35"/>
</svg>
