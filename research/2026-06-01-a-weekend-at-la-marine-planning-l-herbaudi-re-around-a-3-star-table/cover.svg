<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waterDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="levee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow, sitting on the horizon -->
  <ellipse cx="800" cy="430" rx="520" ry="240" fill="url(#sun)"/>

  <!-- distant horizon strip -->
  <rect x="0" y="455" width="1600" height="6" fill="#78350f" opacity="0.55"/>

  <!-- salt-marsh œillets: receding trapezoidal pans, mirrored sky -->
  <!-- row 1 (farthest) -->
  <g opacity="0.92">
    <polygon points="560,468 800,468 815,498 545,498" fill="url(#water)"/>
    <polygon points="800,468 1040,468 1055,498 785,498" fill="url(#waterDim)"/>
  </g>
  <!-- levee 1 -->
  <polygon points="545,498 1055,498 1062,506 538,506" fill="url(#levee)" opacity="0.85"/>

  <!-- row 2 -->
  <g opacity="0.93">
    <polygon points="500,508 790,508 810,548 478,548" fill="url(#waterDim)"/>
    <polygon points="790,508 1100,508 1122,548 810,548" fill="url(#water)"/>
  </g>
  <polygon points="478,548 1122,548 1132,558 468,558" fill="url(#levee)" opacity="0.88"/>

  <!-- row 3 -->
  <g opacity="0.94">
    <polygon points="420,560 780,560 808,612 388,612" fill="url(#water)"/>
    <polygon points="780,560 1180,560 1212,612 808,612" fill="url(#waterDim)"/>
  </g>
  <polygon points="388,612 1212,612 1226,624 374,624" fill="url(#levee)" opacity="0.9"/>

  <!-- row 4 (nearest) -->
  <g opacity="0.95">
    <polygon points="310,628 770,628 805,710 270,710" fill="url(#waterDim)"/>
    <polygon points="770,628 1290,628 1330,710 805,710" fill="url(#water)"/>
  </g>
  <polygon points="270,710 1330,710 1348,726 252,726" fill="url(#levee)" opacity="0.92"/>

  <!-- foreground earth wedge -->
  <polygon points="0,726 1600,726 1600,900 0,900" fill="#1a0e0e"/>
  <polygon points="0,726 1600,726 1600,780 0,800" fill="#5c2a1a" opacity="0.7"/>

  <!-- saunier silhouette: hero accent, inside safe zone -->
  <g fill="#1a0e0e">
    <!-- rake handle, leaning -->
    <polygon points="918,470 924,470 884,706 878,706"/>
    <!-- rake head -->
    <rect x="868" y="702" width="62" height="6"/>
    <!-- figure: torso + head silhouette (no facial features) -->
    <ellipse cx="956" cy="552" rx="14" ry="16"/>
    <path d="M 938 568 Q 956 562 974 568 L 982 642 Q 956 650 930 642 Z"/>
    <!-- legs -->
    <polygon points="940,640 952,640 948,712 936,712"/>
    <polygon points="960,640 972,640 974,712 962,712"/>
    <!-- arm to rake -->
    <path d="M 940 580 Q 920 600 906 612 L 912 620 Q 930 608 948 590 Z"/>
  </g>

  <!-- a faint heap of salt beside the saunier -->
  <polygon points="996,712 1052,712 1024,690" fill="#faf8f2" opacity="0.85"/>
  <polygon points="1000,712 1048,712 1024,696" fill="#fef3ec" opacity="0.9"/>
</svg>
