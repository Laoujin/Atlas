<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="cubeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="cubeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.82"/>
    </linearGradient>
    <radialGradient id="bayGlow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#c2410c" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed night sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Bay glow behind the cubes -->
  <ellipse cx="800" cy="700" rx="780" ry="260" fill="url(#bayGlow)"/>

  <!-- Distant Monte Igueldo headland silhouette (decoration, can clip) -->
  <path d="M 0 720 Q 180 660 360 690 Q 520 715 640 700 L 640 900 L 0 900 Z" fill="#1a0e0e" opacity="0.85"/>
  <path d="M 1600 720 Q 1430 670 1280 695 Q 1120 720 980 705 L 980 900 L 1600 900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- Water plane -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#water)" opacity="0.9"/>

  <!-- Kursaal: two cubic glass "rocks" — hero, centered ~(800,500) -->
  <!-- Left cube, larger, slightly tilted -->
  <g transform="translate(560 340) rotate(-4)">
    <rect x="0" y="0" width="360" height="320" fill="url(#cubeA)" stroke="#fef3ec" stroke-width="2" opacity="0.92"/>
    <!-- inner grid panes -->
    <line x1="0" y1="80" x2="360" y2="80" stroke="#fef3ec" stroke-width="1" opacity="0.45"/>
    <line x1="0" y1="160" x2="360" y2="160" stroke="#fef3ec" stroke-width="1" opacity="0.45"/>
    <line x1="0" y1="240" x2="360" y2="240" stroke="#fef3ec" stroke-width="1" opacity="0.45"/>
    <line x1="90" y1="0" x2="90" y2="320" stroke="#fef3ec" stroke-width="1" opacity="0.35"/>
    <line x1="180" y1="0" x2="180" y2="320" stroke="#fef3ec" stroke-width="1" opacity="0.35"/>
    <line x1="270" y1="0" x2="270" y2="320" stroke="#fef3ec" stroke-width="1" opacity="0.35"/>
    <!-- interior warm glow -->
    <rect x="20" y="180" width="320" height="120" fill="#fbbf24" opacity="0.18"/>
  </g>

  <!-- Right cube, smaller, opposite tilt -->
  <g transform="translate(960 400) rotate(5)">
    <rect x="0" y="0" width="260" height="230" fill="url(#cubeB)" stroke="#fef3ec" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="58" x2="260" y2="58" stroke="#fef3ec" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="115" x2="260" y2="115" stroke="#fef3ec" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="172" x2="260" y2="172" stroke="#fef3ec" stroke-width="1" opacity="0.4"/>
    <line x1="65" y1="0" x2="65" y2="230" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>
    <line x1="130" y1="0" x2="130" y2="230" stroke="#fef3ec" stroke-width="1" opacity="0.3"/>
    <line x1="195" y1="0" x2="195" y2="230" stroke="#fef3ec" stroke-with="1" opacity="0.3"/>
    <rect x="15" y="130" width="230" height="90" fill="#fbbf24" opacity="0.15"/>
  </g>

  <!-- Node-graph overlay tying the cubes together (conference network) -->
  <g opacity="0.85">
    <line x1="720" y1="380" x2="1020" y2="450" stroke="#6d28d9" stroke-width="1.5" opacity="0.7"/>
    <line x1="680" y1="460" x2="1080" y2="520" stroke="#6d28d9" stroke-width="1.5" opacity="0.6"/>
    <line x1="760" y1="560" x2="980" y2="600" stroke="#6d28d9" stroke-width="1.5" opacity="0.55"/>
    <line x1="600" y1="300" x2="720" y2="380" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>
    <line x1="1140" y1="370" x2="1020" y2="450" stroke="#6d28d9" stroke-width="1.2" opacity="0.5"/>

    <circle cx="600" cy="300" r="6" fill="#6d28d9"/>
    <circle cx="720" cy="380" r="8" fill="#fbbf24"/>
    <circle cx="1020" cy="450" r="9" fill="#fbbf24"/>
    <circle cx="1140" cy="370" r="6" fill="#6d28d9"/>
    <circle cx="680" cy="460" r="5" fill="#6d28d9"/>
    <circle cx="1080" cy="520" r="6" fill="#fbbf24"/>
    <circle cx="760" cy="560" r="5" fill="#6d28d9"/>
    <circle cx="980" cy="600" r="7" fill="#fbbf24"/>
  </g>

  <!-- Water reflections of the cubes -->
  <g opacity="0.35">
    <rect x="558" y="720" width="358" height="80" fill="#c2410c"/>
    <rect x="965" y="720" width="258" height="60" fill="#d97706"/>
  </g>
  <line x1="0" y1="740" x2="1600" y2="740" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="770" x2="1600" y2="770" stroke="#fbbf24" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#fbbf24" stroke-width="0.5" opacity="0.15"/>
</svg>
