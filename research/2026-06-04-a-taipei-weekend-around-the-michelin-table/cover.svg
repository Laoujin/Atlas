<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3b1208"/>
    </linearGradient>
    <!-- Central candlelight glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate highlight gradient -->
    <radialGradient id="plateLeft" cx="38%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plateRight" cx="38%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <!-- Rim accent gradient for plates -->
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="90%" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow wash centered on scene -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero element — fine-dining table scene (centered ~800,450) -->

  <!-- Table surface ellipse, low on the composition -->
  <ellipse cx="800" cy="620" rx="480" ry="80" fill="#5c2a1a" opacity="0.45"/>
  <ellipse cx="800" cy="620" rx="480" ry="80" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.3"/>

  <!-- Left plate — large dinner plate -->
  <ellipse cx="620" cy="520" rx="145" ry="145" fill="#2a1108" opacity="0.92"/>
  <ellipse cx="620" cy="520" rx="145" ry="145" fill="url(#plateLeft)"/>
  <ellipse cx="620" cy="520" rx="145" ry="145" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.8"/>
  <!-- Inner rim ring -->
  <ellipse cx="620" cy="520" rx="120" ry="120" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.35"/>
  <!-- Food accent dot — small amuse-bouche form -->
  <ellipse cx="620" cy="510" rx="28" ry="18" fill="#c2410c" opacity="0.85"/>
  <ellipse cx="620" cy="510" rx="28" ry="18" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>

  <!-- Right plate — slightly smaller dessert plate -->
  <ellipse cx="980" cy="520" rx="130" ry="130" fill="#2a1108" opacity="0.92"/>
  <ellipse cx="980" cy="520" rx="130" ry="130" fill="url(#plateRight)"/>
  <ellipse cx="980" cy="520" rx="130" ry="130" fill="none" stroke="#c2410c" stroke-width="3" opacity="0.8"/>
  <!-- Inner rim ring -->
  <ellipse cx="980" cy="520" rx="108" ry="108" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.35"/>
  <!-- Food accent dot -->
  <ellipse cx="980" cy="512" rx="22" ry="14" fill="#9a3309" opacity="0.9"/>
  <ellipse cx="980" cy="512" rx="22" ry="14" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.45"/>

  <!-- Chopsticks — angled pair, resting across right plate -->
  <line x1="900" y1="430" x2="1060" y2="595" stroke="#d97706" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
  <line x1="916" y1="422" x2="1076" y2="587" stroke="#fbbf24" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>

  <!-- Wine glass silhouette between the plates, set back slightly -->
  <!-- Stem -->
  <line x1="800" y1="600" x2="800" y2="430" stroke="#78350f" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
  <!-- Base -->
  <ellipse cx="800" cy="602" rx="32" ry="8" fill="#78350f" opacity="0.75"/>
  <!-- Bowl of glass -->
  <path d="M766,430 Q766,520 800,525 Q834,520 834,430 Z" fill="#c2410c" opacity="0.18"/>
  <path d="M766,430 Q766,520 800,525 Q834,520 834,430 Z" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.65"/>
  <!-- Glass rim -->
  <ellipse cx="800" cy="430" rx="34" ry="8" fill="none" stroke="#d97706" stroke-width="2" opacity="0.55"/>
  <!-- Wine level inside glass -->
  <path d="M772,490 Q772,525 800,525 Q828,525 828,490 Z" fill="#9a3309" opacity="0.45"/>

  <!-- Layer 3: Atmospheric edge decoration (may be cropped on card) -->
  <!-- Subtle top edge glow bar -->
  <rect x="0" y="0" width="1600" height="4" fill="#c2410c" opacity="0.25"/>
  <!-- Bottom edge glow bar -->
  <rect x="0" y="896" width="1600" height="4" fill="#c2410c" opacity="0.25"/>

  <!-- Corner ambient arcs — structural, suggest the restaurant space -->
  <path d="M0,0 Q320,0 320,180" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.2"/>
  <path d="M1600,0 Q1280,0 1280,180" fill="none" stroke="#9a3309" stroke-width="1" opacity="0.2"/>
</svg>
