<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1210"/>
    </linearGradient>
    <!-- Warm ambient glow at center -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#9a3309" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Main plate gradient -->
    <radialGradient id="plateMain" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Inner plate rim gradient -->
    <radialGradient id="plateInner" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#faf8f2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3"/>
    </radialGradient>
    <!-- Second plate (back/shadow) gradient -->
    <radialGradient id="plateBg" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Wine glass fill -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Star gradient -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Plate shadow at bottom -->
    <radialGradient id="plateShadow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <!-- Ambient warm glow -->
  <rect width="1600" height="900" fill="url(#glowCenter)"/>

  <!-- Layer 2: Hero element — fine dining plate composition, centered at (800, 450) -->

  <!-- Shadow beneath plate -->
  <ellipse cx="800" cy="680" rx="310" ry="38" fill="url(#plateShadow)"/>

  <!-- Back plate (slightly offset, darker) -->
  <circle cx="800" cy="445" r="295" fill="url(#plateBg)" opacity="0.65"/>

  <!-- Main plate outer rim -->
  <circle cx="800" cy="445" r="268" fill="url(#plateMain)" opacity="0.92"/>
  <!-- Plate rim accent ring -->
  <circle cx="800" cy="445" r="268" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.55"/>
  <!-- Plate inner well -->
  <circle cx="800" cy="445" r="198" fill="url(#plateInner)" opacity="0.90"/>
  <!-- Inner rim fine line -->
  <circle cx="800" cy="445" r="198" fill="none" stroke="#d97706" stroke-width="3" opacity="0.50"/>

  <!-- Food presentation silhouette: abstract elegant mound on plate center -->
  <ellipse cx="800" cy="440" rx="88" ry="52" fill="#c2410c" opacity="0.82"/>
  <ellipse cx="800" cy="426" rx="52" ry="36" fill="#9a3309" opacity="0.90"/>
  <ellipse cx="800" cy="416" rx="28" ry="20" fill="#78350f" opacity="0.95"/>
  <!-- Sauce drizzle accent -->
  <path d="M752 458 Q770 448 790 462 Q808 472 828 455" fill="none" stroke="#be185d" stroke-width="4" stroke-linecap="round" opacity="0.70"/>

  <!-- Michelin star decorations (three stars, geometric diamond shapes) -->
  <!-- Star 1 -->
  <polygon points="800,148 812,166 832,166 817,178 823,198 800,186 777,198 783,178 768,166 788,166"
           fill="url(#starGrad)" opacity="0.88"/>
  <!-- Star 2 -->
  <polygon points="730,162 740,177 756,177 743,187 748,202 730,193 712,202 717,187 704,177 720,177"
           fill="url(#starGrad)" opacity="0.72"/>
  <!-- Star 3 -->
  <polygon points="870,162 880,177 896,177 883,187 888,202 870,193 852,202 857,187 844,177 860,177"
           fill="url(#starGrad)" opacity="0.72"/>

  <!-- Wine glass silhouette (right of plate, elegant) -->
  <!-- Bowl of glass -->
  <path d="M1118 270 Q1148 330 1148 385 Q1148 435 1103 450 Q1058 465 1058 435 Q1013 435 1013 385 Q1013 330 1043 270 Z"
        fill="url(#glassGrad)" opacity="0.78"/>
  <!-- Stem -->
  <rect x="1075" y="450" width="11" height="105" rx="5" fill="#be185d" opacity="0.60"/>
  <!-- Base -->
  <ellipse cx="1080" cy="562" rx="40" ry="8" fill="#9a3309" opacity="0.55"/>
  <!-- Glass highlight -->
  <path d="M1048 295 Q1043 340 1048 375" fill="none" stroke="#fef3ec" stroke-width="4" stroke-linecap="round" opacity="0.30"/>

  <!-- Layer 3: Decorative edge elements (may be cropped on card) -->
  <!-- Bottom-left warm corner accent -->
  <radialGradient id="cornerBL" cx="0%" cy="100%" r="40%">
    <stop offset="0%" stop-color="#c2410c" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#cornerBL)"/>

  <!-- Subtle top vignette -->
  <linearGradient id="topVig" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
    <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#topVig)"/>

  <!-- Bottom vignette -->
  <linearGradient id="botVig" x1="0" y1="0" x2="0" y2="1">
    <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.40"/>
  </linearGradient>
  <rect width="1600" height="900" fill="url(#botVig)"/>
</svg>
