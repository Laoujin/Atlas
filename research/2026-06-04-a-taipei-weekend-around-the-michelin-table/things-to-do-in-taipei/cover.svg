<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="560" rx="760" ry="420" fill="url(#glow)"/>

  <!-- hero: Taipei 101 tower, centered ~800,450 -->
  <g opacity="0.95">
    <!-- spire -->
    <rect x="794" y="150" width="12" height="70" fill="#fbbf24"/>
    <!-- base shaft -->
    <rect x="772" y="220" width="56" height="40" fill="url(#tower)"/>
    <!-- eight stacked trapezoid tiers -->
    <polygon points="755,260 845,260 858,328 742,328" fill="url(#tower)"/>
    <polygon points="746,338 854,338 867,406 733,406" fill="url(#tower)"/>
    <polygon points="737,416 863,416 876,484 724,484" fill="url(#tower)"/>
    <polygon points="728,494 872,494 885,562 715,562" fill="url(#tower)"/>
    <polygon points="719,572 881,572 894,640 706,640" fill="url(#tower)"/>
    <!-- pedestal base -->
    <rect x="700" y="650" width="200" height="60" fill="#9a3309"/>
  </g>

  <!-- flanking skyline silhouettes (within safe zone) -->
  <g fill="#1a0e0e" opacity="0.85">
    <rect x="300" y="540" width="70" height="170"/>
    <rect x="385" y="600" width="55" height="110"/>
    <rect x="1180" y="580" width="60" height="130"/>
    <rect x="1255" y="520" width="75" height="190"/>
  </g>

  <!-- two lantern accents -->
  <g opacity="0.9">
    <ellipse cx="470" cy="300" rx="34" ry="42" fill="#c2410c"/>
    <rect x="462" y="258" width="16" height="8" fill="#78350f"/>
    <rect x="462" y="338" width="16" height="10" fill="#78350f"/>
    <ellipse cx="1130" cy="360" rx="30" ry="38" fill="#c2410c"/>
    <rect x="1123" y="322" width="14" height="7" fill="#78350f"/>
    <rect x="1123" y="394" width="14" height="9" fill="#78350f"/>
  </g>

  <!-- ground line -->
  <rect x="0" y="708" width="1600" height="192" fill="#1a0e0e" opacity="0.6"/>
</svg>
