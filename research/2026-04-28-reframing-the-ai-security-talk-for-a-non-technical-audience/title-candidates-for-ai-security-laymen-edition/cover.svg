<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#e8dfc8"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f6efe1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="470" rx="650" ry="390" fill="url(#glow)"/>

  <!-- Decorative corner dots (cropped variably, decorative only) -->
  <circle cx="150" cy="150" r="7" fill="#9a3309" opacity="0.35"/>
  <circle cx="1470" cy="130" r="8" fill="#6d28d9" opacity="0.4"/>
  <circle cx="1500" cy="790" r="5" fill="#9a3309" opacity="0.3"/>
  <circle cx="150" cy="780" r="6" fill="#6d28d9" opacity="0.35"/>

  <!-- Hero: a presentation slide of candidate title options, one selected -->
  <g>
    <!-- Slide panel -->
    <rect x="540" y="250" width="520" height="400" rx="26" fill="url(#panel)" stroke="#9a3309" stroke-width="3" opacity="0.97"/>

    <!-- Slide header band with a small security shield emblem -->
    <rect x="540" y="250" width="520" height="76" rx="26" fill="#78350f" opacity="0.12"/>
    <path d="M 982 270 L 1018 270 L 1018 296 Q 1018 314 1000 322 Q 982 314 982 296 Z" fill="url(#shield)"/>

    <!-- Candidate option bars; the third is the selected (rust) title -->
    <rect x="586" y="372" width="300" height="34" rx="17" fill="#e3d6bd" opacity="0.9"/>
    <rect x="586" y="430" width="372" height="34" rx="17" fill="#e3d6bd" opacity="0.8"/>

    <!-- Selected candidate: rust hero bar with a glow + violet selection bracket -->
    <ellipse cx="760" cy="505" rx="250" ry="46" fill="url(#glow)"/>
    <rect x="586" y="486" width="404" height="40" rx="20" fill="url(#hero)"/>
    <circle cx="616" cy="506" r="9" fill="#fbbf24"/>
    <path d="M 566 480 L 558 480 L 558 532 L 566 532" fill="none" stroke="#6d28d9" stroke-width="5" opacity="0.85" stroke-linecap="round"/>
    <path d="M 1010 480 L 1018 480 L 1018 532 L 1010 532" fill="none" stroke="#6d28d9" stroke-width="5" opacity="0.85" stroke-linecap="round"/>

    <rect x="586" y="556" width="240" height="34" rx="17" fill="#e3d6bd" opacity="0.7"/>
  </g>

  <!-- Violet AI accent: a small node-and-edge spark off the slide -->
  <g opacity="0.7" stroke="#6d28d9" stroke-width="3" fill="#6d28d9">
    <line x1="1110" y1="430" x2="1180" y2="380"/>
    <line x1="1110" y1="430" x2="1170" y2="500"/>
    <circle cx="1110" cy="430" r="11" stroke="none"/>
    <circle cx="1182" cy="376" r="7" stroke="none"/>
    <circle cx="1170" cy="502" r="6" stroke="none" opacity="0.8"/>
  </g>
</svg>
