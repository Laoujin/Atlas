<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft radial glow centered on hub -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- Concentric range rings (30 km, 20 km, 10 km) -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#c2410c" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="800" cy="450" r="230" fill="none" stroke="#c2410c" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="800" cy="450" r="125" fill="none" stroke="#9a3309" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- Eight cardinal spokes -->
  <g stroke="#9a3309" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="800" y1="110" x2="800" y2="790"/>
    <line x1="460" y1="450" x2="1140" y2="450"/>
    <line x1="560" y1="210" x2="1040" y2="690"/>
    <line x1="1040" y1="210" x2="560" y2="690"/>
  </g>

  <!-- NW: Luxembourg City hilltop silhouette (ramparts on a cliff) -->
  <g opacity="0.88">
    <path d="M 360 410 L 360 470 L 380 470 L 380 455 L 395 455 L 395 470 L 415 470 L 415 440 L 435 440 L 435 470 L 455 470 L 455 460 L 475 460 L 475 470 L 495 470 L 495 445 L 515 445 L 515 470 L 540 470 L 540 425 L 560 425 L 560 470 L 580 470 L 580 455 L 600 455 L 600 470 L 620 470 L 620 480 L 360 480 Z" fill="url(#hill)"/>
    <!-- Cliff face below -->
    <path d="M 360 480 L 620 480 L 600 540 L 555 555 L 500 545 L 440 560 L 385 545 Z" fill="#5c2a1a" opacity="0.85"/>
    <!-- Crenellations notches -->
    <rect x="540" y="415" width="6" height="12" fill="#faf8f2" opacity="0.5"/>
    <rect x="552" y="415" width="6" height="12" fill="#faf8f2" opacity="0.5"/>
  </g>

  <!-- NE: Minett industrial smokestack + chimney cluster -->
  <g opacity="0.88">
    <rect x="1140" y="340" width="38" height="160" fill="url(#stack)"/>
    <rect x="1135" y="335" width="48" height="14" fill="#5c2a1a"/>
    <rect x="1100" y="395" width="28" height="105" fill="#9a3309" opacity="0.85"/>
    <rect x="1190" y="410" width="22" height="90" fill="#78350f" opacity="0.85"/>
    <!-- Smoke wisp -->
    <path d="M 1159 335 Q 1175 305 1155 280 Q 1140 260 1170 240" fill="none" stroke="#c2410c" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- SE: Moselle vineyard rows on slope -->
  <g opacity="0.85" stroke="#9a3309" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 1050 620 L 1230 600" stroke-opacity="0.75"/>
    <path d="M 1060 645 L 1245 620" stroke-opacity="0.7"/>
    <path d="M 1070 670 L 1260 640" stroke-opacity="0.65"/>
    <path d="M 1080 695 L 1275 660" stroke-opacity="0.6"/>
    <path d="M 1090 720 L 1290 680" stroke-opacity="0.55"/>
  </g>
  <!-- River curve below vineyards -->
  <path d="M 1030 745 Q 1160 760 1310 735 L 1310 760 Q 1160 785 1030 770 Z" fill="#c2410c" opacity="0.35"/>

  <!-- SW: Mondorf thermal spa — concentric water rings -->
  <g opacity="0.8" fill="none" stroke="#c2410c">
    <ellipse cx="430" cy="680" rx="80" ry="22" stroke-opacity="0.65" stroke-width="2"/>
    <ellipse cx="430" cy="680" rx="55" ry="15" stroke-opacity="0.55" stroke-width="2"/>
    <ellipse cx="430" cy="680" rx="30" ry="8" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Steam wisp -->
    <path d="M 430 665 Q 420 640 435 620 Q 450 600 430 580" stroke="#d97706" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Central hub: Frisange anchor -->
  <circle cx="800" cy="450" r="44" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="44" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Inner pin dot -->
  <circle cx="800" cy="450" r="10" fill="#faf8f2" opacity="0.85"/>
  <circle cx="800" cy="450" r="5" fill="#78350f"/>
</svg>
