<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- soft warm glow around hub -->
  <circle cx="800" cy="450" r="420" fill="url(#glow)"/>

  <!-- concentric radius rings (30km zones) -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.45"/>
  <circle cx="800" cy="450" r="140" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- connecting lines from hub to event pins -->
  <g stroke="#9a3309" stroke-width="1.2" stroke-opacity="0.5" fill="none">
    <line x1="800" y1="450" x2="510" y2="245"/>
    <line x1="800" y1="450" x2="1110" y2="270"/>
    <line x1="800" y1="450" x2="1180" y2="540"/>
    <line x1="800" y1="450" x2="555" y2="640"/>
    <line x1="800" y1="450" x2="970" y2="690"/>
  </g>

  <!-- event location pins (around the hub, inside safe zone) -->
  <g>
    <!-- pin: Kirchberg NW -->
    <path d="M 510 245 C 478 245 478 200 510 195 C 542 200 542 245 510 245 Z M 510 218 L 510 270" fill="url(#pin)" opacity="0.92"/>
    <circle cx="510" cy="217" r="6" fill="#fef3ec"/>

    <!-- pin: ICT Spring NE -->
    <path d="M 1110 270 C 1078 270 1078 225 1110 220 C 1142 225 1142 270 1110 270 Z M 1110 243 L 1110 295" fill="url(#pin)" opacity="0.92"/>
    <circle cx="1110" cy="242" r="6" fill="#fef3ec"/>

    <!-- pin: Dommeldange E -->
    <path d="M 1180 540 C 1148 540 1148 495 1180 490 C 1212 495 1212 540 1180 540 Z M 1180 513 L 1180 565" fill="url(#pin)" opacity="0.92"/>
    <circle cx="1180" cy="512" r="6" fill="#fef3ec"/>

    <!-- pin: Belval SW -->
    <path d="M 555 640 C 523 640 523 595 555 590 C 587 595 587 640 555 640 Z M 555 613 L 555 665" fill="url(#pin)" opacity="0.92"/>
    <circle cx="555" cy="612" r="6" fill="#fef3ec"/>

    <!-- pin: Esch SE -->
    <path d="M 970 690 C 938 690 938 645 970 640 C 1002 645 1002 690 970 690 Z M 970 663 L 970 715" fill="url(#pin)" opacity="0.92"/>
    <circle cx="970" cy="662" r="6" fill="#fef3ec"/>
  </g>

  <!-- HERO: central anchor (the restaurant) — golden star/compass at hub -->
  <g transform="translate(800 450)">
    <circle r="70" fill="url(#hub)" opacity="0.95"/>
    <circle r="70" fill="none" stroke="#78350f" stroke-width="2" opacity="0.8"/>
    <!-- 4-point compass star inside the hub -->
    <path d="M 0 -50 L 12 -12 L 50 0 L 12 12 L 0 50 L -12 12 L -50 0 L -12 -12 Z"
          fill="#fef3ec" opacity="0.85"/>
    <circle r="8" fill="#78350f"/>
  </g>

  <!-- subtle cardinal tick marks on outermost ring (decoration, croppable) -->
  <g stroke="#9a3309" stroke-width="2" stroke-opacity="0.4">
    <line x1="800" y1="100" x2="800" y2="120"/>
    <line x1="800" y1="780" x2="800" y2="800"/>
    <line x1="450" y1="450" x2="470" y2="450"/>
    <line x1="1130" y1="450" x2="1150" y2="450"/>
  </g>
</svg>
