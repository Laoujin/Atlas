<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant moon/last light -->
  <circle cx="1280" cy="200" r="55" fill="#fbbf24" opacity="0.18"/>
  <circle cx="1280" cy="200" r="32" fill="#fef3ec" opacity="0.35"/>

  <!-- Ground/road -->
  <rect x="0" y="720" width="1600" height="180" fill="#1a0e0e" opacity="0.85"/>
  <path d="M 0 760 Q 800 740 1600 760 L 1600 900 L 0 900 Z" fill="#0d0707"/>

  <!-- Warm glow halo behind hero window -->
  <ellipse cx="780" cy="500" rx="380" ry="280" fill="url(#glow)"/>

  <!-- Hero: small country inn silhouette, centered ~(800, 450) -->
  <!-- Main body -->
  <rect x="560" y="430" width="440" height="290" fill="url(#house)"/>
  <!-- Pitched roof -->
  <polygon points="540,430 780,290 1020,430" fill="url(#roof)"/>
  <!-- Chimney -->
  <rect x="900" y="320" width="38" height="80" fill="#5c2a1a"/>

  <!-- Glowing window (the heart of the piece) -->
  <rect x="700" y="480" width="160" height="130" fill="url(#window)" opacity="0.95"/>
  <!-- Window cross frame -->
  <rect x="775" y="480" width="10" height="130" fill="#78350f" opacity="0.7"/>
  <rect x="700" y="540" width="160" height="8" fill="#78350f" opacity="0.7"/>

  <!-- Smaller dark windows -->
  <rect x="600" y="500" width="60" height="70" fill="#3a1a10" opacity="0.9"/>
  <rect x="900" y="500" width="60" height="70" fill="#3a1a10" opacity="0.9"/>
  <!-- Door -->
  <rect x="755" y="640" width="50" height="80" fill="#3a1a10"/>
  <circle cx="797" cy="682" r="3" fill="#fbbf24" opacity="0.8"/>

  <!-- Neighbouring smaller house (village hint) -->
  <rect x="1080" y="540" width="220" height="180" fill="#2a1410" opacity="0.85"/>
  <polygon points="1070,540 1190,460 1310,540" fill="#78350f" opacity="0.8"/>
  <rect x="1140" y="590" width="40" height="55" fill="#d97706" opacity="0.65"/>
  <rect x="1210" y="590" width="40" height="55" fill="#3a1a10"/>

  <rect x="280" y="580" width="200" height="140" fill="#2a1410" opacity="0.8"/>
  <polygon points="270,580 380,510 490,580" fill="#78350f" opacity="0.75"/>
  <rect x="340" y="620" width="34" height="48" fill="#d97706" opacity="0.55"/>

  <!-- Foreground dining accent: round table silhouette with a single candle flame -->
  <ellipse cx="800" cy="800" rx="180" ry="22" fill="#0d0707" opacity="0.6"/>
  <ellipse cx="800" cy="790" rx="155" ry="18" fill="#9a3309" opacity="0.55"/>
  <!-- Candle -->
  <rect x="795" y="755" width="10" height="32" fill="#fef3ec" opacity="0.7"/>
  <path d="M 800 740 Q 794 750 800 758 Q 806 750 800 740 Z" fill="#fbbf24"/>
  <circle cx="800" cy="748" r="14" fill="#fbbf24" opacity="0.35"/>

  <!-- Subtle stars (decoration, outside hero safe zone edges) -->
  <circle cx="180" cy="140" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="340" cy="90" r="1.5" fill="#fef3ec" opacity="0.6"/>
  <circle cx="1450" cy="120" r="2" fill="#fbbf24" opacity="0.65"/>
  <circle cx="1520" cy="260" r="1.5" fill="#fef3ec" opacity="0.55"/>
  <circle cx="80" cy="320" r="1.5" fill="#fbbf24" opacity="0.5"/>
</svg>
