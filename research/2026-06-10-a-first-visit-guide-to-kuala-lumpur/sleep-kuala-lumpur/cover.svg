<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <circle cx="1230" cy="240" r="150" fill="url(#moon)" opacity="0.7"/>

  <!-- hero: tall view-hotel tower -->
  <path d="M735 810 L735 320 Q735 250 800 200 Q865 250 865 320 L865 810 Z" fill="url(#tower)" opacity="0.92"/>
  <path d="M797 200 L797 110 L803 110 L803 200 Z" fill="#c2410c" opacity="0.9"/>

  <!-- warm glowing window-band -->
  <rect x="752" y="400" width="96" height="170" rx="6" fill="url(#glow)" opacity="0.9"/>

  <!-- flanking shorter towers (decoration, edges) -->
  <rect x="70" y="560" width="120" height="340" fill="#78350f" opacity="0.7"/>
  <rect x="1410" y="500" width="130" height="400" fill="#9a3309" opacity="0.7"/>
</svg>
