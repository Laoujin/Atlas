<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="80%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: spill of warm light on the ground, outside safe zone -->
  <ellipse cx="800" cy="840" rx="430" ry="70" fill="url(#glow)" opacity="0.45"/>

  <!-- hero: a glowing hidden arched doorway in a dark wall -->
  <path d="M560 760 L560 360 Q560 170 800 170 Q1040 170 1040 360 L1040 760 Z" fill="url(#wall)" opacity="0.92"/>
  <path d="M620 740 L620 380 Q620 240 800 240 Q980 240 980 380 L980 740 Z" fill="url(#glow)" opacity="0.9"/>
  <path d="M690 720 L690 400 Q690 320 800 320 Q910 320 910 400 L910 720 Z" fill="#fbbf24" opacity="0.7"/>
  <rect x="794" y="320" width="12" height="400" fill="#78350f" opacity="0.85"/>
</svg>
