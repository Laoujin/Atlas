<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="68%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#faf8f2"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: corner medallions outside safe zone -->
  <g fill="#d97706" opacity="0.18">
    <path d="M0 0 L150 0 A150 150 0 0 1 0 150 Z"/>
    <path d="M1600 900 L1450 900 A150 150 0 0 1 1600 750 Z"/>
  </g>

  <!-- hero: Islamic 16-point geometric star medallion ~(800,450) -->
  <g transform="translate(800 450)" opacity="0.92">
    <!-- outer 8-point star -->
    <path transform="rotate(22.5)" fill="#9a3309" opacity="0.85"
      d="M0 -300 L66 -150 L212 -212 L150 -66 L300 0 L150 66 L212 212 L66 150 L0 300 L-66 150 L-212 212 L-150 66 L-300 0 L-150 -66 L-212 -212 L-66 -150 Z"/>
    <!-- main 8-point star -->
    <path fill="url(#star)"
      d="M0 -270 L60 -135 L191 -191 L135 -60 L270 0 L135 60 L191 191 L60 135 L0 270 L-60 135 L-191 191 L-135 60 L-270 0 L-135 -60 L-191 -191 L-60 -135 Z"/>
    <!-- inner ring -->
    <circle r="150" fill="#fef3ec" opacity="0.9"/>
    <!-- petal rosette -->
    <path fill="#c2410c" opacity="0.85"
      d="M0 -150 L42 -42 L150 0 L42 42 L0 150 L-42 42 L-150 0 L-42 -42 Z"/>
    <circle r="58" fill="url(#core)"/>
    <circle r="22" fill="#fef3ec" opacity="0.85"/>
  </g>
</svg>
