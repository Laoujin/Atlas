<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- decorative low sun, outside safe zone -->
  <circle cx="1320" cy="150" r="80" fill="#fbbf24" opacity="0.7"/>

  <!-- layered forested hills hero -->
  <path d="M0 560 Q330 410 660 510 Q1000 615 1340 470 Q1480 415 1600 460 L1600 900 L0 900 Z" fill="url(#far)" opacity="0.7"/>
  <path d="M0 660 Q300 540 620 610 Q980 690 1320 575 Q1470 525 1600 575 L1600 900 L0 900 Z" fill="url(#mid)" opacity="0.85"/>

  <!-- canopy-walk suspension bridge arc -->
  <path d="M120 470 Q800 700 1480 470" fill="none" stroke="#78350f" stroke-width="9" opacity="0.9"/>
  <path d="M120 530 Q800 760 1480 530" fill="none" stroke="#78350f" stroke-width="14" opacity="0.95"/>
  <g stroke="#9a3309" stroke-width="5" opacity="0.85">
    <line x1="300" y1="505" x2="300" y2="568"/>
    <line x1="500" y1="556" x2="500" y2="618"/>
    <line x1="700" y1="592" x2="700" y2="654"/>
    <line x1="900" y1="592" x2="900" y2="654"/>
    <line x1="1100" y1="556" x2="1100" y2="618"/>
    <line x1="1300" y1="505" x2="1300" y2="568"/>
  </g>

  <!-- near foreground ridge -->
  <path d="M0 770 Q360 700 720 745 Q1080 790 1600 720 L1600 900 L0 900 Z" fill="url(#near)" opacity="0.9"/>
</svg>
