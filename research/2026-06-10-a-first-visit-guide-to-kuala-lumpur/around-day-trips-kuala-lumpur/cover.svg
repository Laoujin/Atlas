<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint corner arcs outside safe zone -->
  <path d="M0 60 A 900 900 0 0 0 1600 60" fill="none" stroke="#d97706" stroke-width="6" opacity="0.18"/>
  <path d="M0 860 A 760 760 0 0 1 1600 860" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.16"/>

  <!-- hero: radiating day-trip spokes + node hubs around central transit hub -->
  <g opacity="0.9">
    <g stroke="url(#arc)" stroke-width="16" stroke-linecap="round" opacity="0.85">
      <line x1="800" y1="450" x2="560" y2="250"/>
      <line x1="800" y1="450" x2="1080" y2="250"/>
      <line x1="800" y1="450" x2="500" y2="500"/>
      <line x1="800" y1="450" x2="1110" y2="520"/>
      <line x1="800" y1="450" x2="640" y2="690"/>
      <line x1="800" y1="450" x2="1000" y2="700"/>
    </g>

    <!-- route arc threading the orbit -->
    <path d="M520 360 Q 800 120 1090 380" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" opacity="0.8"/>

    <!-- satellite day-trip nodes -->
    <g fill="#c2410c" opacity="0.9">
      <circle cx="560" cy="250" r="34"/>
      <circle cx="1080" cy="250" r="34"/>
      <circle cx="500" cy="500" r="30"/>
      <circle cx="1110" cy="520" r="30"/>
      <circle cx="640" cy="690" r="30"/>
      <circle cx="1000" cy="700" r="34"/>
    </g>
    <g fill="#fbbf24" opacity="0.85">
      <circle cx="560" cy="250" r="14"/>
      <circle cx="1080" cy="250" r="14"/>
      <circle cx="500" cy="500" r="12"/>
      <circle cx="1110" cy="520" r="12"/>
      <circle cx="640" cy="690" r="12"/>
      <circle cx="1000" cy="700" r="14"/>
    </g>

    <!-- central hub -->
    <circle cx="800" cy="450" r="120" fill="url(#hub)" opacity="0.95"/>
    <circle cx="800" cy="450" r="62" fill="none" stroke="#fbbf24" stroke-width="14" opacity="0.85"/>
    <circle cx="800" cy="450" r="22" fill="#fef3ec" opacity="0.9"/>
  </g>
</svg>
