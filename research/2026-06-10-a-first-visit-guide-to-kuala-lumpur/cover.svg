<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.8" stop-color="#d97706"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="430" r="360" fill="url(#sun)" opacity="0.9"/>

  <!-- lattice spire tower (left) -->
  <g fill="url(#spire)" opacity="0.92">
    <polygon points="560,720 600,720 588,470 572,470"/>
    <polygon points="572,470 588,470 582,360 578,360"/>
    <rect x="578" y="270" width="4" height="92"/>
    <polygon points="566,470 594,470 588,420 572,420" opacity="0.7"/>
  </g>

  <!-- twin towers (hero, center) -->
  <g opacity="0.95">
    <!-- skybridge -->
    <rect x="724" y="470" width="152" height="20" fill="url(#tower)"/>
    <rect x="746" y="490" width="8" height="40" fill="#78350f"/>
    <rect x="846" y="490" width="8" height="40" fill="#78350f"/>
    <!-- left tower body -->
    <path d="M690 730 L690 360 Q690 340 710 332 L710 332 L710 360 L740 360 L740 332 Q760 340 760 360 L760 730 Z" fill="url(#tower)"/>
    <!-- right tower body -->
    <path d="M840 730 L840 360 Q840 340 860 332 L860 332 L860 360 L890 360 L890 332 Q910 340 910 360 L910 730 Z" fill="url(#tower)"/>
    <!-- pinnacles -->
    <polygon points="722,360 728,250 734,360" fill="url(#spire)"/>
    <polygon points="872,360 878,250 884,360" fill="url(#spire)"/>
    <!-- tier banding -->
    <g fill="#78350f" opacity="0.45">
      <rect x="690" y="430" width="70" height="6"/>
      <rect x="690" y="540" width="70" height="6"/>
      <rect x="690" y="630" width="70" height="6"/>
      <rect x="840" y="430" width="70" height="6"/>
      <rect x="840" y="540" width="70" height="6"/>
      <rect x="840" y="630" width="70" height="6"/>
    </g>
  </g>

  <!-- supporting skyline blocks -->
  <g fill="#78350f" opacity="0.7">
    <rect x="980" y="560" width="60" height="170"/>
    <rect x="1050" y="600" width="44" height="130"/>
    <rect x="470" y="600" width="50" height="130"/>
  </g>

  <!-- foreground horizon glow -->
  <rect x="0" y="724" width="1600" height="176" fill="#faf8f2" opacity="0.85"/>
</svg>
