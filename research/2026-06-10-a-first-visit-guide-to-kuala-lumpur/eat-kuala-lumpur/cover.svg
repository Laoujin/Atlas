<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="48%" stop-color="#2e1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="broth" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fef3ec" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- decoration: small side bowl outside safe zone -->
  <ellipse cx="1500" cy="120" rx="150" ry="70" fill="url(#bowl)" opacity="0.6"/>

  <!-- hero: steam curls -->
  <path d="M740 360 C700 300 800 290 760 230 C730 185 800 150 770 100" fill="none" stroke="url(#steam)" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <path d="M860 360 C900 300 800 290 840 230 C870 185 800 150 830 100" fill="none" stroke="url(#steam)" stroke-width="16" stroke-linecap="round" opacity="0.7"/>

  <!-- hero: big bowl -->
  <ellipse cx="800" cy="470" rx="340" ry="130" fill="url(#broth)" opacity="0.92"/>
  <path d="M460 470 a340 132 0 0 0 680 0 q-40 230 -340 230 q-300 0 -340 -230 Z" fill="url(#bowl)" opacity="0.95"/>
  <ellipse cx="800" cy="470" rx="280" ry="100" fill="url(#broth)" opacity="0.6"/>

  <!-- rose accent: chili / garnish -->
  <ellipse cx="700" cy="455" rx="38" ry="16" fill="#be185d" opacity="0.8" transform="rotate(-18 700 455)"/>
  <ellipse cx="890" cy="480" rx="32" ry="14" fill="#be185d" opacity="0.7" transform="rotate(22 890 480)"/>

  <!-- chopsticks -->
  <rect x="540" y="250" width="13" height="300" rx="6" fill="#fbbf24" opacity="0.9" transform="rotate(20 546 400)"/>
  <rect x="575" y="250" width="13" height="300" rx="6" fill="#fef3ec" opacity="0.8" transform="rotate(20 581 400)"/>
</svg>
