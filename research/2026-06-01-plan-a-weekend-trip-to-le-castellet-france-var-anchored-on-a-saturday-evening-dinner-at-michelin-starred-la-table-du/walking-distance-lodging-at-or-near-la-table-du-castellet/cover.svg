<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#f0eadb" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="dome" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Provençal sunset sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Distant plateau ridge (full-bleed, decorative) -->
  <path d="M 0,640 L 180,605 L 340,615 L 520,590 L 720,600 L 900,585 L 1100,595 L 1280,580 L 1460,590 L 1600,585 L 1600,900 L 0,900 Z" fill="url(#ridge)" opacity="0.55"/>

  <!-- Near plateau base -->
  <path d="M 0,720 L 240,705 L 460,715 L 700,700 L 940,710 L 1180,700 L 1400,712 L 1600,705 L 1600,900 L 0,900 Z" fill="#1a0e0e" opacity="0.7"/>

  <!-- Pine silhouettes along the ridge (sparse, decorative) -->
  <g fill="#1a0e0e" opacity="0.85">
    <path d="M 220,705 L 230,670 L 240,705 Z"/>
    <path d="M 340,715 L 352,672 L 364,715 Z"/>
    <path d="M 480,710 L 494,665 L 508,710 Z"/>
    <path d="M 1110,702 L 1122,660 L 1134,702 Z"/>
    <path d="M 1240,710 L 1254,668 L 1268,710 Z"/>
    <path d="M 1380,706 L 1392,665 L 1404,706 Z"/>
  </g>

  <!-- Hero: two plate rims flanking a central dome (the restaurant / hotel hub) -->
  <!-- Left plate (hotel one) -->
  <ellipse cx="500" cy="500" rx="180" ry="44" fill="url(#plate)" opacity="0.75"/>
  <ellipse cx="500" cy="495" rx="180" ry="44" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.85"/>
  <ellipse cx="500" cy="495" rx="130" ry="30" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>

  <!-- Right plate (hotel two) -->
  <ellipse cx="1100" cy="500" rx="180" ry="44" fill="url(#plate)" opacity="0.75"/>
  <ellipse cx="1100" cy="495" rx="180" ry="44" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.85"/>
  <ellipse cx="1100" cy="495" rx="130" ry="30" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>

  <!-- Central hero: hilltop dome (restaurant on the plateau) -->
  <path d="M 660,495 Q 800,200 940,495 Z" fill="url(#dome)" opacity="0.95"/>
  <!-- Dome highlight ridge -->
  <path d="M 720,470 Q 800,310 880,470" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.55"/>

  <!-- Walking-path connectors: plate to dome -->
  <path d="M 600,495 Q 650,470 695,485" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7" stroke-dasharray="4 6"/>
  <path d="M 1000,495 Q 950,470 905,485" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7" stroke-dasharray="4 6"/>

  <!-- Star above the dome (Michelin nod, abstract) -->
  <circle cx="800" cy="245" r="6" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="245" r="14" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.45"/>
</svg>
