<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="village" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3a1a0a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sunset sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Low sun glow, sitting on the horizon, inside safe zone -->
  <circle cx="800" cy="540" r="320" fill="url(#sun)" opacity="0.9"/>

  <!-- Distant hill ridge -->
  <path d="M 0 600 Q 250 540 480 580 T 950 560 T 1380 580 T 1600 590 L 1600 900 L 0 900 Z"
        fill="url(#hill2)" opacity="0.75"/>

  <!-- Provençal hill village silhouette on the central rise (hero) -->
  <g opacity="0.95">
    <!-- hill mound the village sits on -->
    <path d="M 540 640 Q 800 540 1060 640 L 1060 720 L 540 720 Z" fill="url(#hill1)"/>
    <!-- village block: stacked rooftops and a chapel tower -->
    <g fill="url(#village)">
      <rect x="680" y="558" width="60" height="62"/>
      <rect x="740" y="548" width="48" height="72"/>
      <rect x="788" y="568" width="54" height="52"/>
      <rect x="842" y="554" width="44" height="66"/>
      <!-- bell tower -->
      <rect x="790" y="500" width="22" height="68"/>
      <polygon points="790,500 812,500 801,478"/>
      <!-- pitched roofs -->
      <polygon points="676,558 744,558 710,538" fill="#5c2a1a"/>
      <polygon points="736,548 792,548 764,528" fill="#5c2a1a"/>
      <polygon points="784,568 846,568 815,548" fill="#5c2a1a"/>
      <polygon points="838,554 890,554 864,534" fill="#5c2a1a"/>
    </g>
  </g>

  <!-- Foreground ridge with umbrella pines flanking the village -->
  <path d="M 0 720 Q 300 680 600 700 T 1100 700 T 1600 700 L 1600 900 L 0 900 Z"
        fill="#3a1a0a" opacity="0.95"/>

  <!-- Umbrella pine left -->
  <g fill="#1a0e0e" opacity="0.92">
    <rect x="378" y="600" width="6" height="110"/>
    <ellipse cx="381" cy="596" rx="68" ry="32"/>
    <ellipse cx="350" cy="586" rx="34" ry="18"/>
    <ellipse cx="412" cy="588" rx="32" ry="16"/>
  </g>

  <!-- Umbrella pine right -->
  <g fill="#1a0e0e" opacity="0.92">
    <rect x="1196" y="592" width="6" height="118"/>
    <ellipse cx="1199" cy="588" rx="74" ry="34"/>
    <ellipse cx="1166" cy="576" rx="36" ry="18"/>
    <ellipse cx="1234" cy="580" rx="34" ry="17"/>
  </g>
</svg>
