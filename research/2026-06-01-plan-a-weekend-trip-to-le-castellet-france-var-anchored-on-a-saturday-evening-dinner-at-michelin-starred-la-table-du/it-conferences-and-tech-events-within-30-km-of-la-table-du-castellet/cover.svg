<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant coastline silhouette (decoration, partly outside safe zone) -->
  <path d="M0,560 L180,540 L320,555 L460,535 L600,548 L740,525 L900,545 L1060,520 L1220,540 L1380,518 L1600,535 L1600,640 L0,640 Z"
        fill="#9a3309" opacity="0.18"/>

  <!-- sea band -->
  <rect x="0" y="610" width="1600" height="290" fill="url(#sea)"/>

  <!-- 30 km radius ring centered on the hilltop -->
  <circle cx="800" cy="470" r="320" fill="none" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
  <circle cx="800" cy="470" r="320" fill="#fbbf24" opacity="0.06"/>
  <circle cx="800" cy="470" r="210" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 8"/>

  <!-- hilltop village mass (hero) -->
  <path d="M560,640 Q650,560 720,540 Q780,470 820,452 Q870,438 920,470 Q990,520 1060,560 Q1140,605 1220,640 Z"
        fill="url(#hill)" opacity="0.95"/>

  <!-- village rooftops on the crest -->
  <polygon points="760,490 780,470 800,490" fill="#78350f" opacity="0.9"/>
  <rect x="770" y="490" width="22" height="22" fill="#5c2a1a" opacity="0.85"/>
  <polygon points="800,478 826,452 852,478" fill="#5c2a1a" opacity="0.95"/>
  <rect x="806" y="478" width="40" height="32" fill="#78350f" opacity="0.9"/>
  <polygon points="852,488 874,468 896,488" fill="#78350f" opacity="0.9"/>
  <rect x="858" y="488" width="32" height="26" fill="#5c2a1a" opacity="0.85"/>
  <polygon points="900,500 918,484 936,500" fill="#5c2a1a" opacity="0.9"/>
  <rect x="906" y="500" width="26" height="22" fill="#78350f" opacity="0.85"/>

  <!-- sun behind the hill -->
  <circle cx="1080" cy="380" r="58" fill="url(#sun)" opacity="0.9"/>

  <!-- network nodes scattered within the radius — the "tech events" -->
  <g opacity="0.85">
    <line x1="800" y1="452" x2="600" y2="380" stroke="#6d28d9" stroke-width="1.5" opacity="0.55"/>
    <line x1="800" y1="452" x2="980" y2="360" stroke="#6d28d9" stroke-width="1.5" opacity="0.55"/>
    <line x1="800" y1="452" x2="560" y2="540" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
    <line x1="800" y1="452" x2="1040" y2="560" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
    <line x1="600" y1="380" x2="980" y2="360" stroke="#6d28d9" stroke-width="1" opacity="0.35"/>
    <line x1="560" y1="540" x2="1040" y2="560" stroke="#6d28d9" stroke-width="1" opacity="0.3"/>

    <circle cx="600" cy="380" r="9" fill="#6d28d9"/>
    <circle cx="600" cy="380" r="16" fill="#6d28d9" opacity="0.2"/>
    <circle cx="980" cy="360" r="9" fill="#6d28d9"/>
    <circle cx="980" cy="360" r="16" fill="#6d28d9" opacity="0.2"/>
    <circle cx="560" cy="540" r="7" fill="#6d28d9"/>
    <circle cx="1040" cy="560" r="7" fill="#6d28d9"/>
    <circle cx="720" cy="300" r="5" fill="#6d28d9" opacity="0.7"/>
    <circle cx="900" cy="290" r="5" fill="#6d28d9" opacity="0.7"/>
  </g>

  <!-- hub marker on the village crest -->
  <circle cx="800" cy="452" r="11" fill="#fbbf24"/>
  <circle cx="800" cy="452" r="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <circle cx="800" cy="452" r="30" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
</svg>
