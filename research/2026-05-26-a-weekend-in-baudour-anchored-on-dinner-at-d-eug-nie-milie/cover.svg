<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a130d"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plateOuter" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0eadb"/>
      <stop offset="80%" stop-color="#d8cdb4"/>
      <stop offset="100%" stop-color="#9a8a6c"/>
    </radialGradient>
    <radialGradient id="plateInner" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#e6dcc4"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="quenelle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="drop" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f9a8c4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Candle glow -->
  <ellipse cx="800" cy="450" rx="780" ry="430" fill="url(#glow)"/>

  <!-- Hero: large dinner plate centered at (800, 450) -->
  <!-- Outer rim -->
  <ellipse cx="800" cy="470" rx="470" ry="115" fill="#000" opacity="0.35"/>
  <ellipse cx="800" cy="450" rx="460" ry="150" fill="url(#plateOuter)" opacity="0.95"/>
  <!-- Inner well -->
  <ellipse cx="800" cy="450" rx="340" ry="108" fill="url(#plateInner)"/>
  <!-- Subtle rim ring -->
  <ellipse cx="800" cy="450" rx="395" ry="128" fill="none" stroke="#c2410c" stroke-width="1.2" opacity="0.45"/>
  <ellipse cx="800" cy="450" rx="345" ry="110" fill="none" stroke="#9a3309" stroke-width="0.8" opacity="0.35"/>

  <!-- Plated composition: rust quenelle (hero accent) -->
  <ellipse cx="770" cy="445" rx="92" ry="34" fill="url(#quenelle)"/>
  <ellipse cx="755" cy="435" rx="60" ry="14" fill="#fbbf24" opacity="0.55"/>

  <!-- Rose sauce dots (secondary hue, used with restraint) -->
  <circle cx="900" cy="438" r="14" fill="url(#drop)"/>
  <circle cx="935" cy="455" r="8" fill="url(#drop)" opacity="0.85"/>
  <circle cx="870" cy="465" r="6" fill="url(#drop)" opacity="0.8"/>

  <!-- Garnish strokes (oil/jus arc) -->
  <path d="M 660 460 Q 800 405 940 470" fill="none" stroke="#78350f" stroke-width="2" opacity="0.55" stroke-linecap="round"/>

  <!-- Decorative: faint candle light specks outside safe zone, edges -->
  <circle cx="120" cy="180" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1490" cy="220" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="80" cy="720" r="1.8" fill="#fbbf24" opacity="0.45"/>
  <circle cx="1520" cy="780" r="2.2" fill="#fbbf24" opacity="0.55"/>
</svg>
