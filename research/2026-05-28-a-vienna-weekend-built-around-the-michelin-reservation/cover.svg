<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#5c2a1a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="plateRim" cx="50%" cy="45%" r="55%">
      <stop offset="80%" stop-color="#9a3309" stop-opacity="0"/>
      <stop offset="92%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2a1410"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Warm radial glow (sunset / candlelight) -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Distant skyline silhouettes (decoration, partly outside safe zone) -->
  <g fill="url(#spire)" opacity="0.88">
    <!-- Left dome cluster -->
    <rect x="180" y="560" width="120" height="160"/>
    <path d="M180 560 Q240 480 300 560 Z"/>
    <rect x="232" y="500" width="16" height="80"/>
    <!-- Mid-left low building -->
    <rect x="340" y="600" width="180" height="120"/>
    <rect x="395" y="555" width="70" height="55"/>
    <path d="M395 555 L430 510 L465 555 Z"/>
    <!-- Right dome -->
    <rect x="1180" y="555" width="160" height="165"/>
    <path d="M1180 555 Q1260 470 1340 555 Z"/>
    <rect x="1252" y="495" width="16" height="75"/>
    <!-- Far right buildings -->
    <rect x="1380" y="610" width="140" height="110"/>
    <rect x="1420" y="565" width="60" height="55"/>
  </g>

  <!-- Hero: Stephansdom-inspired gothic spire silhouette, centered horizontally, fits safe zone -->
  <g fill="url(#spire)" opacity="0.95">
    <!-- Cathedral base -->
    <rect x="680" y="540" width="240" height="180"/>
    <!-- Nave roof line -->
    <path d="M680 540 L720 500 L880 500 L920 540 Z"/>
    <!-- South tower (the hero spire) -->
    <rect x="770" y="380" width="60" height="180"/>
    <path d="M770 380 L800 200 L830 380 Z"/>
    <!-- Spire tip -->
    <path d="M795 220 L800 150 L805 220 Z"/>
    <!-- Small finial -->
    <circle cx="800" cy="148" r="5"/>
  </g>

  <!-- Hero foreground: golden plate / charger as fine-dining anchor -->
  <g transform="translate(800 720)">
    <ellipse cx="0" cy="0" rx="430" ry="80" fill="#1a0e0e" opacity="0.55"/>
    <ellipse cx="0" cy="-6" rx="390" ry="62" fill="url(#plate)" opacity="0.92"/>
    <ellipse cx="0" cy="-6" rx="390" ry="62" fill="url(#plateRim)"/>
    <ellipse cx="0" cy="-10" rx="300" ry="44" fill="#78350f" opacity="0.65"/>
    <ellipse cx="0" cy="-12" rx="260" ry="36" fill="#9a3309" opacity="0.55"/>
    <!-- Single Michelin-evoking dot at plate center -->
    <circle cx="0" cy="-14" r="9" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- Subtle rose accent: distant lantern dots (kept restrained) -->
  <g fill="#be185d" opacity="0.55">
    <circle cx="430" cy="540" r="4"/>
    <circle cx="1130" cy="535" r="4"/>
    <circle cx="560" cy="600" r="3"/>
    <circle cx="1050" cy="595" r="3"/>
  </g>
</svg>
