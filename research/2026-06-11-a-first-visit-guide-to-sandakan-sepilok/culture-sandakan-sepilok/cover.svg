<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- warm halo behind the temple -->
  <circle cx="800" cy="370" r="300" fill="url(#sun)"/>

  <!-- flanking festival lanterns (decoration, low emphasis) -->
  <g opacity="0.7" fill="#c2410c">
    <line x1="360" y1="150" x2="360" y2="232" stroke="#78350f" stroke-width="4"/>
    <rect x="338" y="226" width="44" height="14" rx="4" fill="#9a3309"/>
    <ellipse cx="360" cy="288" rx="40" ry="54"/>
    <ellipse cx="360" cy="288" rx="14" ry="50" fill="#fbbf24" opacity="0.6"/>
    <line x1="360" y1="342" x2="360" y2="372" stroke="#fbbf24" stroke-width="5"/>
  </g>
  <g opacity="0.7" fill="#c2410c">
    <line x1="1240" y1="150" x2="1240" y2="232" stroke="#78350f" stroke-width="4"/>
    <rect x="1218" y="226" width="44" height="14" rx="4" fill="#9a3309"/>
    <ellipse cx="1240" cy="288" rx="40" ry="54"/>
    <ellipse cx="1240" cy="288" rx="14" ry="50" fill="#fbbf24" opacity="0.6"/>
    <line x1="1240" y1="342" x2="1240" y2="372" stroke="#fbbf24" stroke-width="5"/>
  </g>

  <!-- hero: tiered temple (pagoda) centered ~ (800,450) -->
  <!-- finial -->
  <rect x="792" y="200" width="16" height="44" fill="#9a3309"/>
  <circle cx="800" cy="196" r="13" fill="#d97706"/>

  <!-- upper body -->
  <rect x="745" y="300" width="110" height="40" fill="#78350f"/>
  <!-- mid body -->
  <rect x="700" y="400" width="200" height="40" fill="#78350f"/>

  <!-- roof tiers (top to bottom) -->
  <path d="M620 300 Q800 240 980 300 Q800 330 620 300 Z" fill="url(#roof)"/>
  <path d="M560 400 Q800 330 1040 400 Q800 434 560 400 Z" fill="url(#roof)"/>
  <path d="M500 512 Q800 428 1100 512 Q800 548 500 512 Z" fill="url(#roof)"/>

  <!-- temple base / hall -->
  <rect x="640" y="512" width="320" height="150" fill="#78350f"/>
  <!-- arched doorway -->
  <path d="M745 662 L745 590 Q800 548 855 590 L855 662 Z" fill="#5c2a1a"/>
  <!-- step platform -->
  <rect x="600" y="662" width="400" height="26" fill="#9a3309"/>
  <rect x="560" y="688" width="480" height="22" fill="#c2410c" opacity="0.85"/>
</svg>
