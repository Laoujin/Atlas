<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#7a3a1c"/>
      <stop offset="55%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plate" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="plate2" cx="40%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="tart" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f9a8c8"/>
      <stop offset="55%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#7a1240"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Hero: two overlapping plate forms (seafood feast) -->
  <circle cx="660" cy="470" r="300" fill="url(#plate)" opacity="0.95"/>
  <circle cx="660" cy="470" r="300" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.45"/>
  <circle cx="660" cy="470" r="222" fill="none" stroke="#fef3ec" stroke-width="4" opacity="0.30"/>

  <circle cx="1000" cy="430" r="232" fill="url(#plate2)" opacity="0.92"/>
  <circle cx="1000" cy="430" r="232" fill="none" stroke="#fef3ec" stroke-width="5" opacity="0.40"/>

  <!-- Rose accent: UFO tart disc -->
  <ellipse cx="1010" cy="425" rx="120" ry="112" fill="url(#tart)" opacity="0.95"/>
  <ellipse cx="1010" cy="425" rx="120" ry="112" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.55"/>
  <ellipse cx="985" cy="400" rx="42" ry="34" fill="#fde7f0" opacity="0.35"/>

  <!-- Cup/kopitiam silhouette accent on the lead plate -->
  <path d="M560 430 h200 v30 a100 100 0 0 1 -200 0 z" fill="#1a0e0e" opacity="0.78"/>
  <path d="M760 445 a40 40 0 0 1 0 60" fill="none" stroke="#1a0e0e" stroke-width="14" opacity="0.78"/>
  <ellipse cx="660" cy="430" rx="100" ry="22" fill="#3a1810" opacity="0.8"/>
  <ellipse cx="660" cy="430" rx="100" ry="22" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.4"/>

  <!-- Corner decoration (croppable) -->
  <circle cx="120" cy="800" r="70" fill="#9a3309" opacity="0.5"/>
  <circle cx="1500" cy="120" r="90" fill="#be185d" opacity="0.30"/>
</svg>
