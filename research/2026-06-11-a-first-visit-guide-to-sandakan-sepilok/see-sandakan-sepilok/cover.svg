<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fde3c0"/>
      <stop offset="1" stop-color="#f3c277"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind the temple -->
  <circle cx="800" cy="380" r="380" fill="url(#sun)"/>

  <!-- Rainforest ridgelines (background) -->
  <path d="M0 640 Q260 540 520 600 Q780 660 1040 580 Q1320 500 1600 600 L1600 900 L0 900 Z" fill="url(#hillBack)" opacity="0.85"/>

  <!-- Hilltop the temple sits on (foreground) -->
  <path d="M0 760 Q400 600 800 580 Q1200 600 1600 760 L1600 900 L0 900 Z" fill="#9a3309"/>

  <!-- Flanking rainforest canopy silhouettes -->
  <g fill="#78350f" opacity="0.8">
    <path d="M470 620 q-55 -10 -55 -65 q-45 -8 -30 -55 q-30 -28 8 -50 q5 -42 55 -38 q22 -30 60 -10 q40 -18 58 24 q40 6 22 48 q22 34 -18 50 q2 44 -52 44 q-20 30 -58 12 q-25 14 -42 -10 Z"/>
    <path d="M1130 630 q-50 -8 -50 -58 q-40 -6 -28 -50 q-26 -26 8 -46 q4 -38 50 -34 q20 -28 56 -10 q36 -16 52 22 q36 6 20 44 q20 30 -16 46 q2 40 -48 40 q-18 28 -52 10 q-22 12 -40 -8 Z"/>
  </g>

  <!-- Hero: tiered hilltop temple silhouette -->
  <g>
    <!-- finial -->
    <circle cx="800" cy="266" r="8" fill="#5c2a1a"/>
    <rect x="796" y="272" width="8" height="34" fill="#5c2a1a"/>
    <!-- top roof -->
    <path d="M708 332 Q716 314 724 322 Q800 286 876 322 Q884 314 892 332 Q800 358 708 332 Z" fill="#78350f"/>
    <rect x="772" y="332" width="56" height="42" fill="#5c2a1a"/>
    <!-- middle roof -->
    <path d="M668 410 Q678 390 688 400 Q800 356 912 400 Q922 390 932 410 Q800 442 668 410 Z" fill="#78350f"/>
    <rect x="746" y="410" width="108" height="48" fill="#5c2a1a"/>
    <!-- lower roof -->
    <path d="M618 496 Q630 472 642 484 Q800 432 958 484 Q970 472 982 496 Q800 534 618 496 Z" fill="#78350f"/>
    <!-- base / platform -->
    <rect x="716" y="496" width="168" height="78" fill="#5c2a1a"/>
    <rect x="688" y="568" width="224" height="20" fill="#78350f"/>
  </g>
</svg>
