<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed evening background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- Moon -->
  <circle cx="560" cy="250" r="58" fill="#fbbf24" opacity="0.85"/>

  <!-- Water surface line -->
  <rect x="0" y="520" width="1600" height="380" fill="#1a0e0e" opacity="0.55"/>

  <!-- Stilt water village (hero, centered ~800,450) -->
  <g fill="#78350f" stroke="#78350f">
    <!-- House A : hero centre -->
    <polygon points="725,360 800,300 875,360" fill="#9a3309" stroke="none"/>
    <rect x="742" y="360" width="116" height="92" fill="#78350f" stroke="none"/>
    <line x1="762" y1="452" x2="762" y2="520" stroke-width="7"/>
    <line x1="838" y1="452" x2="838" y2="520" stroke-width="7"/>

    <!-- House B : left -->
    <polygon points="540,400 600,352 660,400" fill="#9a3309" stroke="none"/>
    <rect x="554" y="400" width="92" height="74" fill="#78350f" stroke="none"/>
    <line x1="572" y1="474" x2="572" y2="520" stroke-width="6"/>
    <line x1="628" y1="474" x2="628" y2="520" stroke-width="6"/>

    <!-- House C : right -->
    <polygon points="950,395 1018,344 1086,395" fill="#9a3309" stroke="none"/>
    <rect x="966" y="395" width="104" height="82" fill="#78350f" stroke="none"/>
    <line x1="986" y1="477" x2="986" y2="520" stroke-width="6"/>
    <line x1="1050" y1="477" x2="1050" y2="520" stroke-width="6"/>
  </g>

  <!-- Lit windows -->
  <g fill="#fbbf24">
    <rect x="784" y="392" width="22" height="26" opacity="0.95"/>
    <rect x="592" y="424" width="18" height="20" opacity="0.9"/>
    <rect x="1002" y="420" width="20" height="22" opacity="0.9"/>
  </g>

  <!-- Reflections in the water -->
  <g fill="url(#refl)">
    <polygon points="742,540 858,540 800,600"/>
    <polygon points="554,532 646,532 600,584"/>
    <polygon points="966,535 1070,535 1018,592"/>
  </g>

  <!-- Fireflies -->
  <g fill="#fbbf24">
    <circle cx="690" cy="338" r="5" opacity="0.95"/>
    <circle cx="912" cy="372" r="4" opacity="0.8"/>
    <circle cx="1108" cy="320" r="5" opacity="0.85"/>
    <circle cx="478" cy="360" r="4" opacity="0.75"/>
    <circle cx="840" cy="250" r="3" opacity="0.7"/>
    <circle cx="1040" cy="468" r="4" opacity="0.8"/>
    <circle cx="640" cy="486" r="3" opacity="0.7"/>
  </g>
</svg>
