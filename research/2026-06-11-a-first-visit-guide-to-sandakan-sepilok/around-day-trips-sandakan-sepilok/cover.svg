<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.6" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- atmospheric corner glows (decoration, croppable) -->
  <circle cx="150" cy="120" r="260" fill="url(#halo)"/>
  <circle cx="1460" cy="800" r="300" fill="url(#halo)"/>

  <!-- orbit ring: the day-trip loop around the hub -->
  <ellipse cx="800" cy="450" rx="380" ry="240" fill="none" stroke="#78350f" stroke-opacity="0.28" stroke-width="3"/>
  <ellipse cx="800" cy="450" rx="300" ry="188" fill="none" stroke="#c2410c" stroke-opacity="0.18" stroke-width="2"/>

  <!-- transport spokes: hub to each day-trip stop -->
  <g stroke="#9a3309" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <line x1="800" y1="450" x2="1180" y2="450"/>
    <line x1="800" y1="450" x2="990" y2="242"/>
    <line x1="800" y1="450" x2="610" y2="242"/>
    <line x1="800" y1="450" x2="420" y2="450"/>
    <line x1="800" y1="450" x2="610" y2="658"/>
    <line x1="800" y1="450" x2="990" y2="658"/>
  </g>

  <!-- day-trip stop nodes -->
  <g>
    <circle cx="1180" cy="450" r="30" fill="#d97706" stroke="#faf8f2" stroke-width="5"/>
    <circle cx="990" cy="242" r="26" fill="#c2410c" stroke="#faf8f2" stroke-width="5"/>
    <circle cx="610" cy="242" r="34" fill="#9a3309" stroke="#faf8f2" stroke-width="5"/>
    <circle cx="420" cy="450" r="28" fill="#d97706" stroke="#faf8f2" stroke-width="5"/>
    <circle cx="610" cy="658" r="26" fill="#c2410c" stroke="#faf8f2" stroke-width="5"/>
    <circle cx="990" cy="658" r="32" fill="#78350f" stroke="#faf8f2" stroke-width="5"/>
  </g>

  <!-- central hub: Sandakan / Sepilok base -->
  <circle cx="800" cy="450" r="96" fill="#fbbf24" fill-opacity="0.25"/>
  <circle cx="800" cy="450" r="66" fill="url(#hub)" stroke="#faf8f2" stroke-width="6"/>
  <circle cx="800" cy="450" r="22" fill="#fef3ec" fill-opacity="0.85"/>
</svg>
