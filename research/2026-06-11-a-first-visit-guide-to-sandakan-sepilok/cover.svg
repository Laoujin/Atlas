<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Hero: low sun glow over the river valley -->
  <circle cx="800" cy="400" r="330" fill="url(#sun)"/>
  <circle cx="800" cy="400" r="150" fill="#fbbf24" opacity="0.85"/>

  <!-- Winding river receding to the horizon -->
  <path d="M800 405 C 770 520, 880 600, 840 690 C 815 760, 700 800, 640 870 L 960 870 C 900 790, 845 740, 855 680 C 868 600, 815 520, 800 405 Z"
        fill="url(#river)"/>

  <!-- Rainforest canopy ridges, layered front to back -->
  <path d="M0 560 C 180 510, 320 560, 470 530 C 600 505, 700 545, 800 525 C 920 502, 1030 548, 1160 525 C 1320 498, 1460 545, 1600 520 L1600 900 L0 900 Z"
        fill="#9a3309" opacity="0.7"/>
  <path d="M0 640 C 170 595, 340 640, 500 612 C 640 588, 760 628, 880 606 C 1020 580, 1140 626, 1290 604 C 1430 584, 1520 628, 1600 610 L1600 900 L0 900 Z"
        fill="#78350f" opacity="0.82"/>
  <path d="M0 730 C 200 690, 380 728, 560 706 C 720 686, 900 724, 1080 702 C 1260 680, 1420 720, 1600 700 L1600 900 L0 900 Z"
        fill="#5c2a1a" opacity="0.92"/>

  <!-- Emergent canopy tree, the hero silhouette -->
  <path d="M560 720 C 575 600, 590 540, 600 460 C 605 540, 620 600, 640 720 Z" fill="#5c2a1a" opacity="0.9"/>
  <ellipse cx="600" cy="445" rx="120" ry="70" fill="#78350f" opacity="0.85"/>
  <ellipse cx="540" cy="470" rx="80" ry="48" fill="#9a3309" opacity="0.8"/>
  <ellipse cx="665" cy="468" rx="78" ry="46" fill="#9a3309" opacity="0.8"/>
</svg>
