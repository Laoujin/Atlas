<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.6" stop-color="#3d1a10"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- moon glow -->
  <circle cx="1150" cy="250" r="190" fill="url(#moon)" opacity="0.85"/>
  <circle cx="1150" cy="250" r="80" fill="#fef3ec" opacity="0.9"/>

  <!-- river water -->
  <rect x="0" y="660" width="1600" height="240" fill="url(#water)"/>
  <path d="M0 660 Q 400 690 800 668 T 1600 662 V 700 H 0 Z" fill="#5c2a1a" opacity="0.7"/>

  <!-- moon reflection on water -->
  <rect x="1110" y="668" width="80" height="180" rx="40" fill="#d97706" opacity="0.35"/>

  <!-- jungle frond, left -->
  <path d="M120 900 Q 280 560 200 360 Q 320 540 360 760 Q 300 600 460 480 Q 380 660 420 900 Z" fill="#3d1a10" opacity="0.85"/>
  <!-- jungle frond, right -->
  <path d="M1500 900 Q 1340 580 1430 380 Q 1300 560 1270 780 Q 1330 600 1180 500 Q 1260 680 1210 900 Z" fill="#3d1a10" opacity="0.8"/>

  <!-- HERO: stilted river eco-lodge, centered ~ (800,470) -->
  <!-- stilts -->
  <rect x="690" y="560" width="14" height="130" fill="#78350f"/>
  <rect x="896" y="560" width="14" height="130" fill="#78350f"/>
  <rect x="770" y="560" width="14" height="130" fill="#9a3309"/>
  <rect x="816" y="560" width="14" height="130" fill="#9a3309"/>

  <!-- lodge body -->
  <rect x="668" y="470" width="264" height="100" fill="#5c2a1a"/>
  <!-- warm window -->
  <circle cx="800" cy="520" r="34" fill="url(#window)"/>
  <rect x="710" y="500" width="38" height="48" rx="4" fill="url(#window)" opacity="0.85"/>
  <rect x="852" y="500" width="38" height="48" rx="4" fill="url(#window)" opacity="0.85"/>

  <!-- pitched roof -->
  <path d="M800 330 L 950 472 L 650 472 Z" fill="url(#roof)"/>
  <path d="M800 330 L 950 472 L 920 472 L 800 358 Z" fill="#c2410c" opacity="0.6"/>
  <!-- ridge finial -->
  <rect x="794" y="312" width="12" height="26" rx="4" fill="#d97706"/>
</svg>
