<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f0eadb" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="500" rx="700" ry="400" fill="url(#glow)"/>

  <!-- distant rooflines (Paris skyline hints) -->
  <g fill="#9a3309" opacity="0.35">
    <rect x="180" y="620" width="120" height="120"/>
    <polygon points="180,620 240,580 300,620"/>
    <rect x="320" y="640" width="90" height="100"/>
    <polygon points="320,640 365,605 410,640"/>
    <rect x="1180" y="635" width="110" height="105"/>
    <polygon points="1180,635 1235,595 1290,635"/>
    <rect x="1310" y="650" width="80" height="90"/>
    <rect x="1400" y="625" width="100" height="115"/>
    <polygon points="1400,625 1450,590 1500,625"/>
  </g>

  <!-- mid rooflines -->
  <g fill="#78350f" opacity="0.55">
    <rect x="240" y="680" width="160" height="60"/>
    <rect x="420" y="690" width="200" height="50"/>
    <polygon points="420,690 520,660 620,690"/>
    <rect x="1000" y="685" width="180" height="55"/>
    <polygon points="1000,685 1090,655 1180,685"/>
    <rect x="1200" y="695" width="160" height="45"/>
    <rect x="1380" y="690" width="140" height="50"/>
  </g>

  <!-- Eiffel Tower silhouette (hero, centered ~800,450) -->
  <g fill="url(#tower)" opacity="0.92">
    <!-- base legs -->
    <polygon points="660,740 720,740 745,560 700,560"/>
    <polygon points="940,740 880,740 855,560 900,560"/>
    <!-- arch -->
    <path d="M 700,560 Q 800,600 900,560 L 900,580 Q 800,615 700,580 Z"/>
    <!-- first platform -->
    <rect x="700" y="555" width="200" height="14"/>
    <!-- mid section -->
    <polygon points="730,555 870,555 855,380 745,380"/>
    <!-- second platform -->
    <rect x="740" y="375" width="120" height="10"/>
    <!-- upper section -->
    <polygon points="755,375 845,375 830,240 770,240"/>
    <!-- third platform -->
    <rect x="765" y="235" width="70" height="8"/>
    <!-- spire -->
    <polygon points="775,235 825,235 815,180 785,180"/>
    <rect x="795" y="155" width="10" height="30"/>
    <polygon points="797,140 803,140 800,155"/>
  </g>

  <!-- lattice cross-hatching on tower -->
  <g stroke="#5c2a1a" stroke-width="1" opacity="0.45" fill="none">
    <line x1="710" y1="600" x2="890" y2="600"/>
    <line x1="715" y1="650" x2="885" y2="650"/>
    <line x1="705" y1="700" x2="895" y2="700"/>
    <line x1="750" y1="420" x2="850" y2="420"/>
    <line x1="755" y1="470" x2="845" y2="470"/>
    <line x1="745" y1="520" x2="855" y2="520"/>
    <line x1="770" y1="290" x2="830" y2="290"/>
    <line x1="775" y1="330" x2="825" y2="330"/>
  </g>

  <!-- calendar grid card (secondary motif, behind/beside tower) -->
  <g transform="translate(1050, 260) rotate(8)">
    <rect x="0" y="0" width="320" height="340" rx="10" fill="url(#cal)" stroke="#78350f" stroke-width="2" opacity="0.95"/>
    <rect x="0" y="0" width="320" height="56" rx="10" fill="#c2410c" opacity="0.9"/>
    <rect x="0" y="46" width="320" height="10" fill="#c2410c" opacity="0.9"/>
    <circle cx="60" cy="32" r="8" fill="#6d28d9"/>
    <circle cx="260" cy="32" r="8" fill="#6d28d9"/>
    <!-- grid -->
    <g stroke="#78350f" stroke-width="1" opacity="0.35">
      <line x1="0" y1="110" x2="320" y2="110"/>
      <line x1="0" y1="160" x2="320" y2="160"/>
      <line x1="0" y1="210" x2="320" y2="210"/>
      <line x1="0" y1="260" x2="320" y2="260"/>
      <line x1="0" y1="310" x2="320" y2="310"/>
      <line x1="46" y1="56" x2="46" y2="340"/>
      <line x1="92" y1="56" x2="92" y2="340"/>
      <line x1="138" y1="56" x2="138" y2="340"/>
      <line x1="184" y1="56" x2="184" y2="340"/>
      <line x1="230" y1="56" x2="230" y2="340"/>
      <line x1="276" y1="56" x2="276" y2="340"/>
    </g>
    <!-- highlighted event days -->
    <rect x="94" y="162" width="44" height="46" fill="#6d28d9" opacity="0.75"/>
    <rect x="186" y="212" width="44" height="46" fill="#c2410c" opacity="0.8"/>
    <rect x="48" y="262" width="44" height="46" fill="#d97706" opacity="0.7"/>
  </g>

  <!-- conference badge lanyard (left-mid) -->
  <g transform="translate(330, 300) rotate(-6)">
    <line x1="60" y1="-80" x2="60" y2="20" stroke="#6d28d9" stroke-width="6" opacity="0.85"/>
    <circle cx="60" cy="22" r="10" fill="none" stroke="#78350f" stroke-width="3"/>
    <rect x="0" y="30" width="220" height="150" rx="8" fill="url(#cal)" stroke="#78350f" stroke-width="2" opacity="0.95"/>
    <rect x="0" y="30" width="220" height="32" rx="8" fill="#6d28d9" opacity="0.85"/>
    <rect x="0" y="54" width="220" height="8" fill="#6d28d9" opacity="0.85"/>
    <circle cx="50" cy="105" r="22" fill="#fbbf24" opacity="0.7"/>
    <rect x="85" y="92" width="110" height="8" fill="#9a3309" opacity="0.55"/>
    <rect x="85" y="108" width="80" height="6" fill="#9a3309" opacity="0.4"/>
    <rect x="20" y="148" width="180" height="6" fill="#c2410c" opacity="0.6"/>
    <rect x="20" y="160" width="120" height="6" fill="#c2410c" opacity="0.5"/>
  </g>

  <!-- ground line -->
  <rect x="0" y="738" width="1600" height="4" fill="#5c2a1a" opacity="0.5"/>
</svg>
