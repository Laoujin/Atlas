<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="55%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="78%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="88%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="96%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="plateInner" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#3a1c12" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#2a1410" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.35"/>
    </linearGradient>
    <symbol id="star" viewBox="-50 -50 100 100">
      <polygon points="0,-46 13,-14 46,-14 19,7 29,40 0,20 -29,40 -19,7 -46,-14 -13,-14"
               fill="#fbbf24" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- Full-bleed nocturnal background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft warm room glow -->
  <ellipse cx="800" cy="500" rx="780" ry="420" fill="url(#glow)" opacity="0.55"/>

  <!-- Three stars above the plate (within safe zone, y ~150-230) -->
  <use href="#star" x="620" y="150" width="120" height="120" opacity="0.92"/>
  <use href="#star" x="740" y="120" width="140" height="140" opacity="0.95"/>
  <use href="#star" x="880" y="150" width="120" height="120" opacity="0.92"/>

  <!-- Subtle steam wisps rising from plate -->
  <path d="M 720 460 Q 700 380 730 320 Q 760 270 740 220"
        fill="none" stroke="url(#steam)" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M 800 460 Q 820 380 790 320 Q 770 270 800 220"
        fill="none" stroke="url(#steam)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M 880 460 Q 860 380 890 320 Q 920 270 880 220"
        fill="none" stroke="url(#steam)" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <!-- Plate: hero element centered at (800, 600) -->
  <!-- Outer rim -->
  <circle cx="800" cy="600" r="240" fill="url(#plateRim)" opacity="0.95"/>
  <!-- Plate well -->
  <circle cx="800" cy="600" r="186" fill="url(#plateInner)"/>
  <!-- Fine inner ring detail -->
  <circle cx="800" cy="600" r="186" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.45"/>
  <circle cx="800" cy="600" r="160" fill="none" stroke="#d97706" stroke-width="0.8" opacity="0.35"/>

  <!-- Tiny food accent at plate centre: rust quenelle dot -->
  <ellipse cx="800" cy="600" rx="42" ry="22" fill="#c2410c" opacity="0.85"/>
  <ellipse cx="800" cy="595" rx="42" ry="22" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
  <circle cx="788" cy="592" r="4" fill="#fbbf24" opacity="0.8"/>

  <!-- Decorative corner glints (outside hero safe zone, croppable) -->
  <circle cx="80" cy="80" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1520" cy="100" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="60" cy="840" r="2.5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1540" cy="860" r="3" fill="#fbbf24" opacity="0.7"/>
</svg>
