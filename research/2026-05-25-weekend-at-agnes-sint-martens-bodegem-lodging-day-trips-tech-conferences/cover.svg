<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#3a1a14"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="80%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="plate2" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="80%" stop-color="#e8dfc8"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="candle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed evening background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- distant Pajottenland hills (low, will partly crop on detail hero) -->
  <path d="M 0 720 Q 200 660 420 690 T 820 680 T 1240 700 T 1600 670 L 1600 900 L 0 900 Z" fill="url(#hills)" opacity="0.85"/>
  <path d="M 0 780 Q 260 740 540 760 T 1080 755 T 1600 745 L 1600 900 L 0 900 Z" fill="#1a0e0e" opacity="0.75"/>

  <!-- warm candlelit radial glow centered on the table -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- HERO: two overlapping fine-dining plates centered ~ (800, 470) -->
  <!-- back plate (larger, off-center left) -->
  <ellipse cx="660" cy="510" rx="260" ry="78" fill="#1a0e0e" opacity="0.55"/>
  <ellipse cx="660" cy="490" rx="260" ry="78" fill="url(#plate2)" opacity="0.95"/>
  <ellipse cx="660" cy="490" rx="190" ry="56" fill="none" stroke="#9a3309" stroke-width="1.5" opacity="0.45"/>
  <!-- small composed morsel on back plate -->
  <circle cx="660" cy="488" r="14" fill="#c2410c" opacity="0.85"/>
  <circle cx="678" cy="495" r="6" fill="#be185d" opacity="0.75"/>
  <circle cx="644" cy="495" r="5" fill="#fbbf24" opacity="0.8"/>

  <!-- front plate (hero, slightly right and lower) -->
  <ellipse cx="900" cy="555" rx="305" ry="92" fill="#0a0606" opacity="0.6"/>
  <ellipse cx="900" cy="535" rx="305" ry="92" fill="url(#plate)" opacity="0.97"/>
  <ellipse cx="900" cy="535" rx="225" ry="66" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.5"/>
  <!-- composed plating: a small sauce swoop + garnish -->
  <path d="M 830 540 Q 900 510 970 540" stroke="#9a3309" stroke-width="3" fill="none" opacity="0.65"/>
  <circle cx="900" cy="530" r="18" fill="#c2410c" opacity="0.9"/>
  <circle cx="922" cy="538" r="9" fill="#be185d" opacity="0.8"/>
  <circle cx="880" cy="540" r="7" fill="#fbbf24" opacity="0.85"/>
  <circle cx="908" cy="522" r="4" fill="#faf8f2" opacity="0.9"/>

  <!-- wine glass silhouette, right side -->
  <path d="M 1230 280 Q 1230 410 1280 420 Q 1330 410 1330 280 Z" fill="url(#wine)" opacity="0.85"/>
  <path d="M 1230 280 Q 1230 410 1280 420 Q 1330 410 1330 280 Z" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.35"/>
  <rect x="1277" y="420" width="6" height="120" fill="#78350f" opacity="0.7"/>
  <ellipse cx="1280" cy="545" rx="55" ry="8" fill="#78350f" opacity="0.7"/>
  <!-- wine surface highlight -->
  <ellipse cx="1280" cy="290" rx="48" ry="6" fill="#fbbf24" opacity="0.25"/>

  <!-- single candle flame glow, left side, balancing the wine -->
  <circle cx="360" cy="380" r="90" fill="url(#candle)"/>
  <ellipse cx="360" cy="380" rx="9" ry="22" fill="#fbbf24" opacity="0.95"/>
  <rect x="354" y="400" width="12" height="90" fill="#f0eadb" opacity="0.55"/>

  <!-- a few faint star/ember accents (decoration, near top — may crop) -->
  <circle cx="180" cy="120" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1420" cy="90" r="2.5" fill="#fbbf24" opacity="0.55"/>
  <circle cx="1500" cy="180" r="1.8" fill="#fef3ec" opacity="0.5"/>
  <circle cx="240" cy="200" r="1.5" fill="#fef3ec" opacity="0.45"/>
</svg>
