<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- rolling hills silhouettes (decoration, partially cropped on detail view) -->
  <path d="M0 720 Q 240 640 480 680 T 960 670 T 1600 690 L 1600 900 L 0 900 Z" fill="url(#hill1)" opacity="0.85"/>
  <path d="M0 790 Q 320 730 640 770 T 1280 760 T 1600 780 L 1600 900 L 0 900 Z" fill="url(#hill2)" opacity="0.9"/>

  <!-- Meuse river ribbon, sweeping diagonally -->
  <path d="M 120 880 Q 500 620 760 540 T 1500 220" fill="none" stroke="#c2410c" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 880 Q 500 620 760 540 T 1500 220" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- warm radial glow behind hero -->
  <circle cx="800" cy="450" r="380" fill="url(#glow)"/>

  <!-- concentric radius rings (30 km map feel) -->
  <circle cx="800" cy="450" r="340" fill="none" stroke="#9a3309" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="800" cy="450" r="240" fill="none" stroke="#9a3309" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="800" cy="450" r="140" fill="none" stroke="#9a3309" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- satellite location dots around the pin -->
  <circle cx="620" cy="320" r="9" fill="#c2410c" opacity="0.85"/>
  <circle cx="970" cy="290" r="9" fill="#c2410c" opacity="0.85"/>
  <circle cx="1050" cy="520" r="9" fill="#c2410c" opacity="0.85"/>
  <circle cx="560" cy="540" r="9" fill="#c2410c" opacity="0.85"/>
  <circle cx="720" cy="640" r="9" fill="#c2410c" opacity="0.85"/>
  <circle cx="930" cy="660" r="9" fill="#c2410c" opacity="0.85"/>

  <!-- faint connector lines from pin to a few satellites -->
  <g stroke="#78350f" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="800" y1="450" x2="620" y2="320"/>
    <line x1="800" y1="450" x2="1050" y2="520"/>
    <line x1="800" y1="450" x2="720" y2="640"/>
    <line x1="800" y1="450" x2="970" y2="290"/>
  </g>

  <!-- hero: map pin centered at (800, 450) -->
  <g>
    <ellipse cx="800" cy="560" rx="42" ry="9" fill="#78350f" opacity="0.35"/>
    <path d="M 800 270 C 880 270 940 330 940 410 C 940 490 870 540 800 600 C 730 540 660 490 660 410 C 660 330 720 270 800 270 Z" fill="url(#pin)" opacity="0.95"/>
    <circle cx="800" cy="405" r="42" fill="#faf8f2" opacity="0.95"/>
    <circle cx="800" cy="405" r="22" fill="#c2410c" opacity="0.9"/>
  </g>
</svg>
