<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="moat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="rose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#be185d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow behind castle -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- moon -->
  <circle cx="1230" cy="220" r="48" fill="#faf8f2" opacity="0.85"/>
  <circle cx="1215" cy="210" r="42" fill="#5c2a1a" opacity="0.55"/>

  <!-- distant rolling hill (Limburg) -->
  <path d="M0,640 Q400,560 800,610 T1600,580 L1600,900 L0,900 Z" fill="#3a1810" opacity="0.7"/>

  <!-- nearer hill / forest line -->
  <path d="M0,720 Q300,680 600,710 Q900,740 1200,700 Q1400,680 1600,710 L1600,900 L0,900 Z" fill="#1a0e0e" opacity="0.85"/>

  <!-- cypress accents -->
  <ellipse cx="220" cy="690" rx="14" ry="55" fill="#1a0e0e" opacity="0.9"/>
  <ellipse cx="260" cy="700" rx="11" ry="42" fill="#1a0e0e" opacity="0.9"/>
  <ellipse cx="1380" cy="685" rx="13" ry="48" fill="#1a0e0e" opacity="0.9"/>

  <!-- castle hero, centered ~ (800, 480) -->
  <!-- left tower -->
  <rect x="560" y="320" width="120" height="380" fill="url(#castle)"/>
  <polygon points="555,320 685,320 620,250" fill="#78350f"/>
  <!-- right tower -->
  <rect x="920" y="300" width="120" height="400" fill="url(#castle)"/>
  <polygon points="915,300 1045,300 980,225" fill="#78350f"/>
  <!-- main keep -->
  <rect x="680" y="380" width="240" height="320" fill="url(#castle)"/>
  <!-- crenellations on keep -->
  <rect x="680" y="370" width="30" height="20" fill="#3a1810"/>
  <rect x="730" y="370" width="30" height="20" fill="#3a1810"/>
  <rect x="780" y="370" width="30" height="20" fill="#3a1810"/>
  <rect x="830" y="370" width="30" height="20" fill="#3a1810"/>
  <rect x="880" y="370" width="30" height="20" fill="#3a1810"/>

  <!-- arched gate (stained-glass nod) -->
  <path d="M760,700 L760,560 Q800,510 840,560 L840,700 Z" fill="url(#rose)" opacity="0.95"/>
  <path d="M775,700 L775,570 Q800,540 825,570 L825,700 Z" fill="#1a0e0e" opacity="0.6"/>

  <!-- lit windows -->
  <rect x="595" y="430" width="22" height="34" rx="3" fill="url(#window)"/>
  <rect x="625" y="430" width="22" height="34" rx="3" fill="url(#window)" opacity="0.55"/>
  <rect x="595" y="510" width="22" height="34" rx="3" fill="url(#window)" opacity="0.7"/>
  <rect x="955" y="400" width="22" height="34" rx="3" fill="url(#window)"/>
  <rect x="985" y="400" width="22" height="34" rx="3" fill="url(#window)" opacity="0.5"/>
  <rect x="955" y="480" width="22" height="34" rx="3" fill="url(#window)" opacity="0.85"/>
  <rect x="985" y="480" width="22" height="34" rx="3" fill="url(#window)" opacity="0.6"/>
  <rect x="710" y="430" width="28" height="40" rx="3" fill="url(#window)" opacity="0.9"/>
  <rect x="860" y="430" width="28" height="40" rx="3" fill="url(#window)" opacity="0.75"/>

  <!-- moat reflection band -->
  <rect x="0" y="700" width="1600" height="60" fill="url(#moat)"/>
  <!-- reflected window glow shimmer -->
  <ellipse cx="800" cy="720" rx="220" ry="8" fill="#d97706" opacity="0.35"/>
  <ellipse cx="800" cy="735" rx="160" ry="5" fill="#fbbf24" opacity="0.25"/>

  <!-- faint road / taxi suggestion: warm headlight trail along the foreground -->
  <path d="M0,830 Q400,810 800,820 T1600,815" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="120" cy="828" r="6" fill="#fbbf24" opacity="0.85"/>
  <circle cx="120" cy="828" r="14" fill="#fbbf24" opacity="0.25"/>
</svg>
