<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient: deep warm dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Hero slide back gradient -->
    <linearGradient id="slide-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3d1a08"/>
    </linearGradient>
    <!-- Hero slide mid gradient -->
    <linearGradient id="slide-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#5c1c06"/>
    </linearGradient>
    <!-- Hero slide top gradient -->
    <linearGradient id="slide-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Amber accent glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Stage floor gradient -->
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle full-bleed warm vignette from centre -->
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.7"/>

  <!-- Layer 2: Hero element — stacked angled conference slide panels centered ~(800,450) -->

  <!-- Back panel (bottommost, largest, slightly rotated clockwise) -->
  <g transform="rotate(6, 800, 450)">
    <rect x="250" y="185" width="800" height="530" rx="18"
          fill="url(#slide-back)" opacity="0.72"/>
    <!-- Thin top bar suggesting a projector header -->
    <rect x="250" y="185" width="800" height="52" rx="18"
          fill="#78350f" opacity="0.85"/>
    <!-- Simulated content bar rows inside back panel -->
    <rect x="310" y="280" width="520" height="18" rx="6" fill="#fbbf24" opacity="0.22"/>
    <rect x="310" y="318" width="420" height="14" rx="5" fill="#fbbf24" opacity="0.14"/>
    <rect x="310" y="350" width="460" height="14" rx="5" fill="#fbbf24" opacity="0.14"/>
  </g>

  <!-- Mid panel (medium, slightly rotated counter-clockwise) -->
  <g transform="rotate(-4, 800, 450)">
    <rect x="290" y="210" width="760" height="500" rx="16"
          fill="url(#slide-mid)" opacity="0.82"/>
    <rect x="290" y="210" width="760" height="48" rx="16"
          fill="#9a3309" opacity="0.9"/>
    <!-- Content bars mid panel -->
    <rect x="350" y="298" width="480" height="16" rx="5" fill="#fbbf24" opacity="0.20"/>
    <rect x="350" y="332" width="380" height="12" rx="4" fill="#fbbf24" opacity="0.13"/>
    <rect x="350" y="360" width="420" height="12" rx="4" fill="#fbbf24" opacity="0.13"/>
  </g>

  <!-- Top (hero) panel — upright, foreground, most saturated -->
  <rect x="330" y="235" width="720" height="465" rx="14"
        fill="url(#slide-top)" opacity="0.95"/>
  <!-- Top bar accent -->
  <rect x="330" y="235" width="720" height="44" rx="14"
        fill="#c2410c" opacity="1"/>
  <!-- Amber dot row in top bar — conference "LED" status indicators -->
  <circle cx="368" cy="257" r="9" fill="#fbbf24" opacity="0.95"/>
  <circle cx="398" cy="257" r="9" fill="#d97706" opacity="0.7"/>
  <circle cx="428" cy="257" r="9" fill="#9a3309" opacity="0.6"/>

  <!-- Hero panel content: abstract network node diagram (no text) -->
  <!-- Central hub node -->
  <circle cx="690" cy="462" r="42" fill="#fbbf24" opacity="0.88"/>
  <circle cx="690" cy="462" r="30" fill="#d97706" opacity="0.95"/>

  <!-- Spokes from hub to satellite nodes -->
  <line x1="690" y1="462" x2="570" y2="360" stroke="#fbbf24" stroke-width="4" opacity="0.55"/>
  <line x1="690" y1="462" x2="810" y2="360" stroke="#fbbf24" stroke-width="4" opacity="0.55"/>
  <line x1="690" y1="462" x2="560" y2="548" stroke="#fbbf24" stroke-width="4" opacity="0.45"/>
  <line x1="690" y1="462" x2="820" y2="555" stroke="#fbbf24" stroke-width="4" opacity="0.45"/>
  <line x1="690" y1="462" x2="690" y2="590" stroke="#fbbf24" stroke-width="4" opacity="0.40"/>

  <!-- Satellite nodes -->
  <circle cx="570" cy="360" r="22" fill="#c2410c" opacity="0.90"/>
  <circle cx="810" cy="360" r="22" fill="#c2410c" opacity="0.90"/>
  <circle cx="560" cy="548" r="18" fill="#9a3309" opacity="0.85"/>
  <circle cx="820" cy="555" r="18" fill="#9a3309" opacity="0.85"/>
  <circle cx="690" cy="590" r="16" fill="#78350f" opacity="0.80"/>

  <!-- Secondary edges (cross-connections for network look) -->
  <line x1="570" y1="360" x2="810" y2="360" stroke="#d97706" stroke-width="2.5" opacity="0.28"/>
  <line x1="570" y1="360" x2="560" y2="548" stroke="#d97706" stroke-width="2" opacity="0.22"/>
  <line x1="810" y1="360" x2="820" y2="555" stroke="#d97706" stroke-width="2" opacity="0.22"/>

  <!-- Stage floor glow — below hero, bleeds to edges -->
  <ellipse cx="800" cy="820" rx="680" ry="95" fill="url(#stage)" opacity="0.55"/>

  <!-- Layer 3: Edge decorations (outside hero safe zone, purely atmospheric) -->
  <!-- Top-left corner warm accent -->
  <rect x="0" y="0" width="120" height="900" fill="#9a3309" opacity="0.08"/>
  <!-- Top-right corner warm accent -->
  <rect x="1480" y="0" width="120" height="900" fill="#9a3309" opacity="0.08"/>
  <!-- Bottom edge warm strip -->
  <rect x="0" y="830" width="1600" height="70" fill="#78350f" opacity="0.15"/>
</svg>
