<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sea band -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#sea)" opacity="0.92"/>

  <!-- hero: sun -->
  <circle cx="800" cy="470" r="180" fill="url(#sun)" opacity="0.95"/>
  <circle cx="800" cy="470" r="180" fill="none" stroke="#c2410c" stroke-width="6" opacity="0.5"/>

  <!-- sun reflection on water -->
  <path d="M720 560 L880 560 L840 760 L760 760 Z" fill="#fbbf24" opacity="0.4"/>
  <rect x="650" y="600" width="300" height="10" rx="5" fill="#fbbf24" opacity="0.45"/>
  <rect x="675" y="660" width="250" height="10" rx="5" fill="#fbbf24" opacity="0.4"/>
  <rect x="700" y="720" width="200" height="10" rx="5" fill="#fbbf24" opacity="0.35"/>

  <!-- palm silhouette, left of hero, inside safe zone -->
  <g fill="#5c2a1a" opacity="0.9">
    <path d="M392 560 C384 460 380 360 372 280 L388 278 C396 360 404 460 410 560 Z"/>
    <path d="M380 282 C320 250 250 248 200 280 C260 268 330 276 384 300 Z"/>
    <path d="M380 282 C320 220 240 200 175 205 C250 210 320 240 384 296 Z"/>
    <path d="M382 282 C420 222 500 198 560 208 C490 212 425 240 388 298 Z"/>
    <path d="M382 282 C440 248 510 248 560 282 C500 268 430 276 386 302 Z"/>
    <path d="M381 280 C375 230 372 195 380 165 C388 195 387 232 389 280 Z"/>
  </g>

  <!-- distant headland -->
  <path d="M0 560 C150 528 360 532 520 560 Z" fill="#78350f" opacity="0.55"/>
  <path d="M1100 560 C1280 530 1460 536 1600 560 Z" fill="#78350f" opacity="0.55"/>
</svg>
