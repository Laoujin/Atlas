<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="midRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Soft sun glow behind castle -->
  <circle cx="820" cy="380" r="320" fill="url(#sun)"/>

  <!-- Far mountain range -->
  <path d="M0,560 L160,440 L280,490 L420,360 L560,430 L720,330 L880,400 L1040,300 L1200,390 L1360,340 L1500,420 L1600,380 L1600,900 L0,900 Z" fill="url(#farRange)"/>

  <!-- Mid mountain range -->
  <path d="M0,650 L140,560 L300,610 L460,500 L620,580 L780,470 L940,560 L1100,500 L1260,580 L1420,520 L1600,600 L1600,900 L0,900 Z" fill="url(#midRange)" opacity="0.85"/>

  <!-- Central hill carrying the castle -->
  <path d="M540,720 Q800,500 1060,720 Z" fill="url(#hill)"/>

  <!-- Castle hero (silhouette, centered ~800,520) -->
  <g fill="#1a0e0e">
    <!-- main keep -->
    <rect x="720" y="500" width="160" height="170"/>
    <!-- left tower -->
    <rect x="670" y="470" width="60" height="200"/>
    <!-- right tower (taller) -->
    <rect x="870" y="440" width="70" height="230"/>
    <!-- crenellations left tower -->
    <rect x="670" y="460" width="14" height="14"/>
    <rect x="693" y="460" width="14" height="14"/>
    <rect x="716" y="460" width="14" height="14"/>
    <!-- crenellations keep -->
    <rect x="720" y="490" width="18" height="14"/>
    <rect x="748" y="490" width="18" height="14"/>
    <rect x="776" y="490" width="18" height="14"/>
    <rect x="804" y="490" width="18" height="14"/>
    <rect x="832" y="490" width="18" height="14"/>
    <rect x="860" y="490" width="18" height="14"/>
    <!-- crenellations right tower -->
    <rect x="870" y="430" width="16" height="14"/>
    <rect x="895" y="430" width="16" height="14"/>
    <rect x="920" y="430" width="16" height="14"/>
    <!-- conical roof on right tower -->
    <polygon points="870,440 905,380 940,440"/>
    <!-- flag pole + flag -->
    <rect x="903" y="340" width="3" height="42"/>
    <polygon points="906,344 940,352 906,362" fill="#c2410c"/>
  </g>

  <!-- Event-pin markers radiating across the valley (geometric drop-pins) -->
  <g>
    <!-- pin 1 (near, left) -->
    <g transform="translate(420,640)">
      <path d="M0,-28 C14,-28 22,-18 22,-8 C22,4 0,30 0,30 C0,30 -22,4 -22,-8 C-22,-18 -14,-28 0,-28 Z" fill="url(#pin)"/>
      <circle cx="0" cy="-10" r="6" fill="#fef3ec"/>
    </g>
    <!-- pin 2 (mid-left, smaller, farther) -->
    <g transform="translate(300,600) scale(0.72)">
      <path d="M0,-28 C14,-28 22,-18 22,-8 C22,4 0,30 0,30 C0,30 -22,4 -22,-8 C-22,-18 -14,-28 0,-28 Z" fill="url(#pin)" opacity="0.85"/>
      <circle cx="0" cy="-10" r="6" fill="#fef3ec"/>
    </g>
    <!-- pin 3 (right, near) -->
    <g transform="translate(1180,660)">
      <path d="M0,-28 C14,-28 22,-18 22,-8 C22,4 0,30 0,30 C0,30 -22,4 -22,-8 C-22,-18 -14,-28 0,-28 Z" fill="url(#pin)"/>
      <circle cx="0" cy="-10" r="6" fill="#fef3ec"/>
    </g>
    <!-- pin 4 (far right, smaller) -->
    <g transform="translate(1340,610) scale(0.7)">
      <path d="M0,-28 C14,-28 22,-18 22,-8 C22,4 0,30 0,30 C0,30 -22,4 -22,-8 C-22,-18 -14,-28 0,-28 Z" fill="url(#pin)" opacity="0.85"/>
      <circle cx="0" cy="-10" r="6" fill="#fef3ec"/>
    </g>
    <!-- pin 5 (far left, small, faint) -->
    <g transform="translate(200,660) scale(0.6)">
      <path d="M0,-28 C14,-28 22,-18 22,-8 C22,4 0,30 0,30 C0,30 -22,4 -22,-8 C-22,-18 -14,-28 0,-28 Z" fill="url(#pin)" opacity="0.7"/>
      <circle cx="0" cy="-10" r="5" fill="#fef3ec"/>
    </g>
  </g>

  <!-- Subtle valley floor band -->
  <rect x="0" y="760" width="1600" height="140" fill="#5c2a1a" opacity="0.35"/>
</svg>
