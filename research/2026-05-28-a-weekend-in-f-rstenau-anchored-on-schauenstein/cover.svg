<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peaksFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="peaksNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3a1810"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm radial glow behind the castle (dinner warmth) -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant peaks (far range, soft) -->
  <path d="M 0 560 L 180 430 L 320 510 L 480 360 L 640 470 L 820 330 L 980 460 L 1160 380 L 1320 490 L 1480 400 L 1600 480 L 1600 900 L 0 900 Z" fill="url(#peaksFar)" opacity="0.7"/>

  <!-- nearer peaks (mid range, sharper) -->
  <path d="M 0 680 L 140 580 L 280 640 L 440 520 L 600 620 L 760 540 L 900 630 L 1080 540 L 1240 620 L 1400 560 L 1600 640 L 1600 900 L 0 900 Z" fill="url(#peaksNear)" opacity="0.85"/>

  <!-- castle hill (wooded mound) -->
  <path d="M 520 740 Q 800 560 1080 740 L 1080 820 L 520 820 Z" fill="#1a0e0e" opacity="0.95"/>

  <!-- castle silhouette (hero, centered ~800,450 area, well inside safe zone) -->
  <g fill="url(#castle)">
    <!-- main keep block -->
    <rect x="720" y="500" width="160" height="180"/>
    <!-- left wing -->
    <rect x="640" y="560" width="80" height="120"/>
    <!-- right wing -->
    <rect x="880" y="540" width="100" height="140"/>
    <!-- tall tower -->
    <rect x="770" y="400" width="60" height="280"/>
    <!-- tower crenellations -->
    <rect x="770" y="395" width="12" height="14"/>
    <rect x="794" y="395" width="12" height="14"/>
    <rect x="818" y="395" width="12" height="14"/>
    <!-- tower roof (conical) -->
    <polygon points="765,400 800,350 835,400"/>
    <!-- main keep roof -->
    <polygon points="715,500 800,455 885,500"/>
    <!-- right wing roof -->
    <polygon points="875,540 930,505 985,540"/>
    <!-- left wing roof -->
    <polygon points="635,560 680,530 725,560"/>
  </g>

  <!-- warm lit windows (dinner is on) -->
  <g fill="#fbbf24" opacity="0.9">
    <rect x="745" y="540" width="14" height="20"/>
    <rect x="775" y="540" width="14" height="20"/>
    <rect x="805" y="540" width="14" height="20"/>
    <rect x="835" y="540" width="14" height="20"/>
    <rect x="745" y="590" width="14" height="20"/>
    <rect x="805" y="590" width="14" height="20"/>
    <rect x="835" y="590" width="14" height="20"/>
    <rect x="660" y="600" width="12" height="18"/>
    <rect x="685" y="600" width="12" height="18"/>
    <rect x="900" y="580" width="12" height="18"/>
    <rect x="925" y="580" width="12" height="18"/>
    <rect x="950" y="580" width="12" height="18"/>
    <rect x="788" y="450" width="10" height="16"/>
    <rect x="788" y="480" width="10" height="16"/>
  </g>

  <!-- three Michelin stars arcing above the tower -->
  <g fill="#fbbf24" opacity="0.95">
    <circle cx="720" cy="200" r="8"/>
    <circle cx="800" cy="170" r="10"/>
    <circle cx="880" cy="200" r="8"/>
  </g>
  <g fill="#fbbf24" opacity="0.35">
    <circle cx="720" cy="200" r="18"/>
    <circle cx="800" cy="170" r="22"/>
    <circle cx="880" cy="200" r="18"/>
  </g>
</svg>
