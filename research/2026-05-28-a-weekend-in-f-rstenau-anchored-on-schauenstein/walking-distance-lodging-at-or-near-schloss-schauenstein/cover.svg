<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castleFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="castleSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="chaletFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#3a1810"/>
    </linearGradient>
  </defs>

  <!-- full bleed dusk sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars (decorative, outside hero) -->
  <circle cx="180" cy="140" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="340" cy="90" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="520" cy="160" r="2.5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="760" cy="110" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="980" cy="80" r="2" fill="#fbbf24" opacity="0.75"/>
  <circle cx="1180" cy="150" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1380" cy="100" r="2.5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="1500" cy="180" r="1.5" fill="#fbbf24" opacity="0.6"/>

  <!-- moon with glow -->
  <circle cx="1200" cy="220" r="180" fill="url(#moonGlow)"/>
  <circle cx="1200" cy="220" r="42" fill="#fbbf24" opacity="0.9"/>

  <!-- far mountain ridge -->
  <path d="M 0 520 L 140 430 L 260 470 L 410 360 L 560 420 L 700 340 L 860 410 L 1010 350 L 1180 420 L 1340 380 L 1480 440 L 1600 410 L 1600 620 L 0 620 Z" fill="url(#ridgeFar)" opacity="0.85"/>

  <!-- near mountain ridge -->
  <path d="M 0 640 L 180 560 L 360 600 L 540 540 L 720 590 L 900 550 L 1080 600 L 1280 560 L 1460 610 L 1600 580 L 1600 760 L 0 760 Z" fill="url(#ridgeNear)"/>

  <!-- footpath connecting chalet to castle -->
  <path d="M 540 760 Q 720 720 880 700 T 1100 660" stroke="#d97706" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- chalet (Casa Caminada) on the left of hero -->
  <g>
    <!-- chalet body -->
    <rect x="470" y="610" width="180" height="150" fill="url(#chaletFace)"/>
    <!-- gabled roof -->
    <polygon points="450,610 560,520 670,610" fill="url(#roof)"/>
    <!-- roof overhang -->
    <rect x="450" y="608" width="220" height="8" fill="#1a0e0e" opacity="0.85"/>
    <!-- warm window glow -->
    <rect x="500" y="660" width="32" height="42" fill="#fbbf24" opacity="0.9"/>
    <rect x="588" y="660" width="32" height="42" fill="#fbbf24" opacity="0.9"/>
    <rect x="544" y="710" width="32" height="50" fill="#fbbf24" opacity="0.75"/>
    <!-- chimney -->
    <rect x="600" y="540" width="22" height="40" fill="#1a0e0e"/>
  </g>

  <!-- castle (Schloss Schauenstein) — hero, right of center -->
  <g>
    <!-- main keep -->
    <rect x="900" y="430" width="260" height="280" fill="url(#castleFace)"/>
    <!-- side wing (lower) -->
    <rect x="1140" y="510" width="160" height="200" fill="url(#castleSide)"/>
    <!-- main keep crenellated top -->
    <rect x="895" y="420" width="270" height="14" fill="#1a0e0e"/>
    <rect x="900" y="408" width="18" height="14" fill="#1a0e0e"/>
    <rect x="938" y="408" width="18" height="14" fill="#1a0e0e"/>
    <rect x="976" y="408" width="18" height="14" fill="#1a0e0e"/>
    <rect x="1014" y="408" width="18" height="14" fill="#1a0e0e"/>
    <rect x="1052" y="408" width="18" height="14" fill="#1a0e0e"/>
    <rect x="1090" y="408" width="18" height="14" fill="#1a0e0e"/>
    <rect x="1128" y="408" width="18" height="14" fill="#1a0e0e"/>
    <!-- corner turret -->
    <rect x="1150" y="340" width="60" height="180" fill="url(#castleFace)"/>
    <polygon points="1140,340 1180,270 1220,340" fill="url(#roof)"/>
    <!-- turret window -->
    <rect x="1170" y="400" width="20" height="32" fill="#fbbf24" opacity="0.85"/>
    <!-- main keep windows -->
    <rect x="940" y="490" width="26" height="42" fill="#fbbf24" opacity="0.9"/>
    <rect x="1000" y="490" width="26" height="42" fill="#fbbf24" opacity="0.9"/>
    <rect x="1060" y="490" width="26" height="42" fill="#fbbf24" opacity="0.9"/>
    <rect x="940" y="570" width="26" height="42" fill="#fbbf24" opacity="0.75"/>
    <rect x="1000" y="570" width="26" height="42" fill="#fbbf24" opacity="0.9"/>
    <rect x="1060" y="570" width="26" height="42" fill="#fbbf24" opacity="0.75"/>
    <!-- arched door -->
    <path d="M 1010 710 L 1010 660 Q 1010 640 1030 640 Q 1050 640 1050 660 L 1050 710 Z" fill="#1a0e0e" opacity="0.9"/>
    <rect x="1027" y="673" width="6" height="6" fill="#fbbf24" opacity="0.8"/>
    <!-- side wing windows -->
    <rect x="1170" y="560" width="22" height="34" fill="#fbbf24" opacity="0.8"/>
    <rect x="1220" y="560" width="22" height="34" fill="#fbbf24" opacity="0.8"/>
    <rect x="1260" y="560" width="22" height="34" fill="#fbbf24" opacity="0.8"/>
    <!-- side wing roof line -->
    <rect x="1135" y="502" width="170" height="10" fill="#1a0e0e"/>
  </g>

  <!-- foreground ground shadow -->
  <rect x="0" y="760" width="1600" height="140" fill="#1a0e0e" opacity="0.7"/>
</svg>
