<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="midPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="nearRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="gorge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun glow behind peaks -->
  <circle cx="1100" cy="380" r="320" fill="url(#glow)"/>

  <!-- Far range silhouette -->
  <path d="M 0 520 L 180 400 L 320 460 L 480 340 L 640 430 L 820 320 L 980 410 L 1180 300 L 1340 400 L 1500 350 L 1600 420 L 1600 900 L 0 900 Z" fill="url(#farPeak)" opacity="0.7"/>

  <!-- Hero: central alpine massif with castle on knoll, gorge cleft to the right -->
  <!-- Mid massif left -->
  <path d="M 200 700 L 360 500 L 480 580 L 620 380 L 760 520 L 820 470 L 880 540 L 880 760 L 200 760 Z" fill="url(#midPeak)" opacity="0.92"/>

  <!-- Snow caps on hero peak -->
  <path d="M 620 380 L 650 420 L 680 405 L 700 430 L 720 415 L 740 450 L 760 520 L 720 505 L 690 470 L 660 480 L 630 445 Z" fill="#faf8f2" opacity="0.85"/>
  <path d="M 360 500 L 380 525 L 405 515 L 425 545 L 445 535 L 470 575 L 440 565 L 415 575 L 390 555 Z" fill="#faf8f2" opacity="0.7"/>

  <!-- Gorge cleft (right side of massif) -->
  <path d="M 880 540 L 920 600 L 905 680 L 945 760 L 880 760 Z" fill="url(#gorge)" opacity="0.95"/>

  <!-- Right massif beyond gorge -->
  <path d="M 945 760 L 945 620 L 1020 480 L 1140 580 L 1240 460 L 1340 540 L 1400 500 L 1400 760 Z" fill="url(#midPeak)" opacity="0.85"/>
  <path d="M 1020 480 L 1050 520 L 1075 510 L 1100 545 L 1140 580 L 1110 565 L 1080 535 Z" fill="#faf8f2" opacity="0.75"/>
  <path d="M 1240 460 L 1265 495 L 1290 485 L 1310 515 L 1340 540 L 1300 530 L 1275 510 Z" fill="#faf8f2" opacity="0.7"/>

  <!-- Castle on knoll — the hero focal point, centered on hero peak shoulder -->
  <!-- Knoll base -->
  <path d="M 720 505 L 820 470 L 870 510 L 820 540 L 740 535 Z" fill="#5c2a1a" opacity="0.9"/>

  <!-- Castle keep + walls (silhouette) -->
  <g transform="translate(760 430)">
    <!-- main hall -->
    <rect x="0" y="35" width="80" height="55" fill="#1a0e0e"/>
    <!-- tall tower -->
    <rect x="55" y="0" width="32" height="90" fill="#1a0e0e"/>
    <!-- battlements on tower -->
    <rect x="55" y="-8" width="6" height="8" fill="#1a0e0e"/>
    <rect x="67" y="-8" width="6" height="8" fill="#1a0e0e"/>
    <rect x="79" y="-8" width="6" height="8" fill="#1a0e0e"/>
    <!-- battlements on hall -->
    <rect x="0" y="29" width="6" height="6" fill="#1a0e0e"/>
    <rect x="12" y="29" width="6" height="6" fill="#1a0e0e"/>
    <rect x="24" y="29" width="6" height="6" fill="#1a0e0e"/>
    <rect x="36" y="29" width="6" height="6" fill="#1a0e0e"/>
    <rect x="48" y="29" width="6" height="6" fill="#1a0e0e"/>
    <!-- small flanking turret -->
    <rect x="-12" y="20" width="18" height="70" fill="#1a0e0e"/>
    <polygon points="-12,20 -3,5 6,20" fill="#1a0e0e"/>
    <!-- conical roof on main tower -->
    <polygon points="55,0 71,-28 87,0" fill="#9a3309"/>
    <!-- window glint -->
    <rect x="66" y="35" width="4" height="8" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- Near ridge sweeping across foreground -->
  <path d="M 0 780 L 120 720 L 260 760 L 420 700 L 580 740 L 760 690 L 920 730 L 1100 680 L 1280 720 L 1440 685 L 1600 715 L 1600 900 L 0 900 Z" fill="url(#nearRidge)"/>

  <!-- Subtle valley mist along the gorge floor -->
  <ellipse cx="920" cy="770" rx="180" ry="14" fill="#faf8f2" opacity="0.35"/>
  <ellipse cx="500" cy="755" rx="220" ry="10" fill="#faf8f2" opacity="0.25"/>
</svg>
