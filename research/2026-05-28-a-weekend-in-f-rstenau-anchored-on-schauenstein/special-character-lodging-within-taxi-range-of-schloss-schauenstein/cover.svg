<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d97706" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="nearRange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- full bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- warm valley glow (sun behind mountains) -->
  <circle cx="800" cy="560" r="520" fill="url(#sun)"/>

  <!-- distant mountain range -->
  <path d="M 0 600 L 180 460 L 320 520 L 480 380 L 640 470 L 820 360 L 980 450 L 1160 390 L 1320 480 L 1480 410 L 1600 470 L 1600 900 L 0 900 Z"
        fill="url(#farRange)" opacity="0.85"/>

  <!-- mid mountain range -->
  <path d="M 0 720 L 140 620 L 300 680 L 460 560 L 620 660 L 780 580 L 940 650 L 1100 590 L 1280 680 L 1440 610 L 1600 670 L 1600 900 L 0 900 Z"
        fill="#3a1a10" opacity="0.9"/>

  <!-- hero: castle silhouette on a rocky outcrop, centered ~ (800, 540) -->
  <g transform="translate(660 440)">
    <!-- rocky base -->
    <path d="M -120 240 L -80 180 L -40 200 L 0 170 L 60 190 L 120 175 L 180 195 L 240 185 L 280 240 Z"
          fill="#1a0e0e"/>
    <!-- main keep body -->
    <rect x="40" y="80" width="120" height="120" fill="url(#castle)"/>
    <!-- left wing -->
    <rect x="-20" y="120" width="70" height="80" fill="#9a3309"/>
    <!-- right wing -->
    <rect x="150" y="110" width="80" height="90" fill="#9a3309"/>
    <!-- main tower -->
    <rect x="80" y="20" width="50" height="80" fill="#c2410c"/>
    <!-- tower crenellations -->
    <rect x="80" y="14" width="10" height="10" fill="#c2410c"/>
    <rect x="100" y="14" width="10" height="10" fill="#c2410c"/>
    <rect x="120" y="14" width="10" height="10" fill="#c2410c"/>
    <!-- pointed roof -->
    <polygon points="80,20 105,-20 130,20" fill="#78350f"/>
    <!-- small side tower -->
    <rect x="200" y="60" width="30" height="50" fill="#c2410c"/>
    <polygon points="200,60 215,30 230,60" fill="#78350f"/>
    <!-- lit windows (warm amber dots) -->
    <rect x="92" y="50" width="8" height="14" fill="#fbbf24" opacity="0.9"/>
    <rect x="110" y="50" width="8" height="14" fill="#fbbf24" opacity="0.9"/>
    <rect x="60" y="120" width="10" height="16" fill="#fbbf24" opacity="0.85"/>
    <rect x="90" y="120" width="10" height="16" fill="#fbbf24" opacity="0.85"/>
    <rect x="120" y="120" width="10" height="16" fill="#fbbf24" opacity="0.85"/>
    <rect x="60" y="160" width="10" height="16" fill="#fbbf24" opacity="0.75"/>
    <rect x="90" y="160" width="10" height="16" fill="#fbbf24" opacity="0.75"/>
    <rect x="120" y="160" width="10" height="16" fill="#fbbf24" opacity="0.75"/>
    <rect x="170" y="140" width="10" height="16" fill="#fbbf24" opacity="0.8"/>
    <rect x="195" y="140" width="10" height="16" fill="#fbbf24" opacity="0.8"/>
    <rect x="0" y="150" width="8" height="14" fill="#fbbf24" opacity="0.7"/>
    <rect x="20" y="150" width="8" height="14" fill="#fbbf24" opacity="0.7"/>
    <rect x="208" y="80" width="6" height="12" fill="#fbbf24" opacity="0.85"/>
  </g>

  <!-- foreground near range -->
  <path d="M 0 820 L 200 760 L 420 790 L 640 750 L 880 800 L 1120 760 L 1340 800 L 1600 770 L 1600 900 L 0 900 Z"
        fill="url(#nearRange)"/>
</svg>
