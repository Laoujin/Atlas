<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration outside safe zone -->
  <circle cx="1500" cy="70" r="210" fill="#fbbf24" opacity="0.12"/>
  <circle cx="90" cy="840" r="180" fill="#c2410c" opacity="0.10"/>

  <!-- strata: stacked bands at a slight angle, hero rust band centered -->
  <g transform="rotate(-7 800 450)">
    <rect x="360" y="230" width="880" height="86" rx="14" fill="url(#bandA)" opacity="0.72"/>
    <rect x="360" y="332" width="880" height="86" rx="14" fill="url(#bandB)" opacity="0.80"/>
    <rect x="330" y="434" width="940" height="104" rx="16" fill="url(#hero)" opacity="0.95"/>
    <rect x="360" y="556" width="880" height="86" rx="14" fill="url(#bandB)" opacity="0.72"/>
    <rect x="360" y="658" width="880" height="86" rx="14" fill="url(#bandA)" opacity="0.62"/>
  </g>
</svg>
