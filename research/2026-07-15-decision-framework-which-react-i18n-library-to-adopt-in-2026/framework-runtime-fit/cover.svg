<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="chunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint orbit rings outside safe zone -->
  <circle cx="180" cy="120" r="150" fill="none" stroke="#d97706" stroke-width="14" opacity="0.12"/>
  <circle cx="1440" cy="800" r="200" fill="none" stroke="#c2410c" stroke-width="18" opacity="0.10"/>

  <!-- hero: core runtime block with locale chunks splitting off -->
  <g opacity="0.92">
    <!-- main core block -->
    <rect x="560" y="300" width="330" height="300" rx="26" fill="url(#core)" opacity="0.9"/>

    <!-- arc / spark flowing from core to chunks -->
    <path d="M880 400 Q1010 350 1080 430" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
    <path d="M880 470 Q1000 470 1080 540" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
    <path d="M880 540 Q1000 600 1080 650" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round" opacity="0.65"/>

    <!-- lazy-loaded locale chunks peeling off, staggered -->
    <rect x="1060" y="352" width="200" height="150" rx="20" fill="url(#chunk)" opacity="0.9"/>
    <rect x="1090" y="470" width="200" height="150" rx="20" fill="url(#chunk)" opacity="0.78"/>
    <rect x="1120" y="588" width="200" height="150" rx="20" fill="url(#chunk)" opacity="0.66"/>

    <!-- spark node at split origin -->
    <circle cx="880" cy="450" r="30" fill="#fbbf24" opacity="0.95"/>
    <circle cx="880" cy="450" r="14" fill="#78350f" opacity="0.9"/>
  </g>
</svg>
