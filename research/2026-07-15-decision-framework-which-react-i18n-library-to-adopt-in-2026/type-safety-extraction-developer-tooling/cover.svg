<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint corner modules outside safe zone -->
  <rect x="40" y="40" width="130" height="130" rx="18" fill="#9a3309" opacity="0.10"/>
  <rect x="1430" y="730" width="130" height="130" rx="18" fill="#c2410c" opacity="0.12"/>

  <!-- hero: sparse 3x3 module lattice, centered ~ (800,450) -->
  <g opacity="0.9">
    <!-- grid modules (type-checked keys) -->
    <rect x="530" y="180" width="180" height="180" rx="22" fill="url(#cell)" opacity="0.68"/>
    <rect x="890" y="180" width="180" height="180" rx="22" fill="url(#cell)" opacity="0.6"/>

    <rect x="530" y="540" width="180" height="180" rx="22" fill="url(#cell)" opacity="0.6"/>
    <rect x="890" y="540" width="180" height="180" rx="22" fill="url(#cell)" opacity="0.72"/>

    <!-- highlighted cell: the type-checked key -->
    <rect x="710" y="360" width="180" height="180" rx="22" fill="url(#hi)" opacity="0.95"/>
    <rect x="710" y="360" width="180" height="180" rx="22" fill="none" stroke="#fef3ec" stroke-width="6" opacity="0.9"/>

    <!-- checkmark inside highlighted cell -->
    <path d="M747 452 l26 30 l58 -66" fill="none" stroke="#78350f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- connective lattice lines linking modules to the key -->
    <path d="M620 360 L800 450 M980 360 L800 450 M620 540 L800 450 M980 540 L800 450" stroke="#9a3309" stroke-width="4" opacity="0.35"/>
  </g>
</svg>
