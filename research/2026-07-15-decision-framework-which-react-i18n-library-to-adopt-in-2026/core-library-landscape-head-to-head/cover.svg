<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="cardHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1360" cy="130" r="180" fill="#fbbf24" opacity="0.12"/>
  <circle cx="220" cy="800" r="150" fill="#c2410c" opacity="0.10"/>

  <g transform="translate(800 450)">
    <rect x="-330" y="-250" width="440" height="560" rx="26" transform="rotate(-13)" fill="url(#cardBack)" opacity="0.72"/>
    <rect x="-260" y="-270" width="450" height="570" rx="26" transform="rotate(-3)" fill="url(#cardMid)" opacity="0.85"/>
    <rect x="-190" y="-285" width="460" height="580" rx="28" transform="rotate(7)" fill="url(#cardHero)" opacity="0.95"/>
    <rect x="-150" y="-235" width="380" height="60" rx="30" transform="rotate(7)" fill="#fbbf24" opacity="0.85"/>
  </g>
</svg>
