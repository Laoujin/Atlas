<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#faf8f2"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration outside safe zone -->
  <circle cx="120" cy="120" r="180" fill="#d97706" opacity="0.06"/>
  <circle cx="1500" cy="820" r="220" fill="#c2410c" opacity="0.06"/>

  <!-- connecting flow branches: hub to three variant nodes -->
  <path d="M 640 450 C 780 450, 820 220, 1080 210" fill="none" stroke="url(#flow)" stroke-width="26" stroke-linecap="round" opacity="0.7"/>
  <path d="M 640 450 C 800 450, 880 450, 1080 450" fill="none" stroke="url(#flow)" stroke-width="26" stroke-linecap="round" opacity="0.8"/>
  <path d="M 640 450 C 780 450, 820 690, 1080 700" fill="none" stroke="url(#flow)" stroke-width="26" stroke-linecap="round" opacity="0.7"/>

  <!-- hero: message hub block -->
  <rect x="360" y="330" width="290" height="240" rx="40" fill="url(#hub)" opacity="0.95"/>
  <rect x="410" y="392" width="190" height="26" rx="13" fill="#fbbf24" opacity="0.85"/>
  <rect x="410" y="437" width="140" height="26" rx="13" fill="#fef3ec" opacity="0.7"/>
  <rect x="410" y="482" width="170" height="26" rx="13" fill="#d97706" opacity="0.8"/>

  <!-- variant branch nodes -->
  <circle cx="1140" cy="210" r="78" fill="url(#branch)" opacity="0.9"/>
  <circle cx="1180" cy="450" r="94" fill="url(#hub)" opacity="0.9"/>
  <circle cx="1140" cy="700" r="78" fill="url(#branch)" opacity="0.9"/>

  <!-- inner accents on nodes -->
  <circle cx="1140" cy="210" r="34" fill="#78350f" opacity="0.6"/>
  <circle cx="1180" cy="450" r="42" fill="#fbbf24" opacity="0.75"/>
  <circle cx="1140" cy="700" r="34" fill="#9a3309" opacity="0.6"/>
</svg>
