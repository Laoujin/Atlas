<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration outside safe zone -->
  <circle cx="90" cy="70" r="150" fill="#fbbf24" opacity="0.12"/>
  <circle cx="1520" cy="850" r="190" fill="#c2410c" opacity="0.1"/>

  <!-- connecting arcs: source -> hub -> outputs -->
  <path d="M 360 450 C 500 380, 600 380, 720 450" fill="none" stroke="#d97706" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
  <path d="M 880 450 C 1000 360, 1120 300, 1240 300" fill="none" stroke="#9a3309" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M 880 460 C 1010 460, 1120 460, 1240 460" fill="none" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M 880 470 C 1000 560, 1120 620, 1240 620" fill="none" stroke="#78350f" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- source block -->
  <rect x="215" y="360" width="180" height="180" rx="30" fill="url(#src)" opacity="0.9"/>

  <!-- output blocks -->
  <rect x="1235" y="235" width="130" height="130" rx="26" fill="url(#out)" opacity="0.82"/>
  <rect x="1235" y="395" width="130" height="130" rx="26" fill="url(#out)" opacity="0.9"/>
  <rect x="1235" y="555" width="130" height="130" rx="26" fill="url(#out)" opacity="0.82"/>

  <!-- hero hub -->
  <circle cx="800" cy="450" r="150" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="88" fill="#fef3ec" opacity="0.9"/>
  <circle cx="800" cy="450" r="44" fill="url(#hub)" opacity="0.95"/>
</svg>
