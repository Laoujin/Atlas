<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1410"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: tropical glow above roofline, outside safe zone -->
  <ellipse cx="800" cy="60" rx="620" ry="120" fill="#d97706" opacity="0.18"/>

  <!-- hero: Peranakan shophouse facade -->
  <g opacity="0.92">
    <!-- gabled roof -->
    <path d="M620 250 L800 150 L980 250 L980 300 L620 300 Z" fill="#78350f"/>
    <!-- eave band -->
    <rect x="600" y="300" width="400" height="34" fill="#c2410c"/>
    <!-- main body -->
    <rect x="620" y="334" width="360" height="416" fill="url(#facade)"/>

    <!-- upper shuttered windows -->
    <rect x="668" y="384" width="86" height="150" rx="6" fill="#3a1c0e" opacity="0.85"/>
    <rect x="846" y="384" width="86" height="150" rx="6" fill="#3a1c0e" opacity="0.85"/>
    <rect x="681" y="392" width="60" height="134" fill="#0e7490" opacity="0.7"/>
    <rect x="859" y="392" width="60" height="134" fill="#0e7490" opacity="0.7"/>

    <!-- warm-lit doorway -->
    <path d="M740 750 L740 600 Q800 552 860 600 L860 750 Z" fill="url(#glow)" opacity="0.95"/>
    <path d="M762 750 L762 614 Q800 584 838 614 L838 750 Z" fill="#fef3ec" opacity="0.85"/>
  </g>

  <!-- ground shadow -->
  <rect x="125" y="750" width="1350" height="60" fill="#1a0e0e" opacity="0.6"/>
</svg>
