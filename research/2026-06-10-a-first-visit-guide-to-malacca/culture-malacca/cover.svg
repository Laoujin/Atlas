<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint embers outside safe zone -->
  <circle cx="70" cy="760" r="9" fill="#d97706" opacity="0.6"/>
  <circle cx="1530" cy="120" r="7" fill="#fbbf24" opacity="0.6"/>
  <circle cx="1540" cy="820" r="11" fill="#c2410c" opacity="0.6"/>

  <!-- back lanterns (smaller, dimmer) -->
  <circle cx="560" cy="380" r="240" fill="url(#halo)" opacity="0.7"/>
  <circle cx="1040" cy="380" r="240" fill="url(#halo)" opacity="0.7"/>
  <ellipse cx="560" cy="380" rx="120" ry="150" fill="url(#glow)" opacity="0.78"/>
  <ellipse cx="1040" cy="380" rx="120" ry="150" fill="url(#glow)" opacity="0.78"/>

  <!-- hero lantern (central, largest) -->
  <circle cx="800" cy="450" r="340" fill="url(#halo)" opacity="0.85"/>
  <ellipse cx="800" cy="450" rx="180" ry="225" fill="url(#glow)" opacity="0.95"/>
  <rect x="752" y="200" width="96" height="34" rx="14" fill="#78350f" opacity="0.9"/>
  <rect x="760" y="678" width="80" height="30" rx="12" fill="#78350f" opacity="0.9"/>
  <ellipse cx="800" cy="450" rx="64" ry="225" fill="#fbbf24" opacity="0.35"/>
</svg>
