<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: faint neon arcs outside safe zone -->
  <circle cx="800" cy="450" r="470" fill="none" stroke="#be185d" stroke-width="6" opacity="0.35"/>
  <circle cx="800" cy="450" r="510" fill="none" stroke="#0e7490" stroke-width="3" opacity="0.25"/>

  <!-- hero: glowing fan of trishaw light-loops / spokes -->
  <g opacity="0.92">
    <!-- radiant spokes -->
    <g stroke="url(#loop)" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <line x1="800" y1="450" x2="800" y2="130"/>
      <line x1="800" y1="450" x2="1026" y2="224"/>
      <line x1="800" y1="450" x2="1120" y2="450"/>
      <line x1="800" y1="450" x2="1026" y2="676"/>
      <line x1="800" y1="450" x2="800" y2="770"/>
      <line x1="800" y1="450" x2="574" y2="676"/>
      <line x1="800" y1="450" x2="480" y2="450"/>
      <line x1="800" y1="450" x2="574" y2="224"/>
    </g>
    <!-- concentric LED light-loops -->
    <circle cx="800" cy="450" r="320" fill="none" stroke="#fbbf24" stroke-width="10" opacity="0.85"/>
    <circle cx="800" cy="450" r="320" fill="none" stroke="#be185d" stroke-width="10" stroke-dasharray="30 36" opacity="0.7"/>
    <circle cx="800" cy="450" r="225" fill="none" stroke="#d97706" stroke-width="14" opacity="0.9"/>
    <circle cx="800" cy="450" r="225" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="18 40" opacity="0.85"/>
    <circle cx="800" cy="450" r="130" fill="none" stroke="#c2410c" stroke-width="18" opacity="0.9"/>
  </g>

  <!-- glowing hub -->
  <circle cx="800" cy="450" r="78" fill="url(#glow)" opacity="0.95"/>
  <circle cx="800" cy="450" r="30" fill="#fbbf24" opacity="0.9"/>
</svg>
