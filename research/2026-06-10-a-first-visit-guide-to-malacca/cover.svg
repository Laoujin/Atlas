<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fde2cf"/>
      <stop offset="1" stop-color="#f7c79a"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="800" cy="300" r="170" fill="#fbbf24" opacity="0.45"/>

  <!-- hero: red gabled clock-tower + church massing -->
  <g opacity="0.95">
    <!-- clock tower -->
    <path d="M620 640 L620 300 Q620 270 650 268 Q680 270 680 300 L680 640 Z" fill="url(#tower)"/>
    <path d="M612 300 L650 246 L688 300 Z" fill="#9a3309"/>
    <!-- church body with stepped gable -->
    <path d="M700 640 L700 430 L760 430 L760 360 L820 360 L820 300 L900 300 L900 360 L960 360 L960 430 L1020 430 L1020 640 Z" fill="url(#brick)"/>
    <!-- arched doorway void -->
    <path d="M838 640 L838 500 Q860 472 882 500 L882 640 Z" fill="#78350f" opacity="0.7"/>
  </g>

  <!-- river band -->
  <rect x="0" y="640" width="1600" height="120" fill="url(#river)"/>

  <!-- cruise boat -->
  <g opacity="0.9">
    <path d="M380 690 L560 690 L530 728 L410 728 Z" fill="#9a3309"/>
    <rect x="430" y="660" width="90" height="32" rx="4" fill="#d97706"/>
  </g>

  <!-- reflection hint -->
  <rect x="700" y="640" width="320" height="70" fill="#c2410c" opacity="0.18"/>

  <!-- decoration outside safe zone -->
  <circle cx="120" cy="120" r="60" fill="#fbbf24" opacity="0.3"/>
  <circle cx="1500" cy="820" r="80" fill="#c2410c" opacity="0.2"/>
</svg>
