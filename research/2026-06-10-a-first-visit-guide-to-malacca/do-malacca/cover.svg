<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="boat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun arc, decoration outside safe zone -->
  <circle cx="800" cy="40" r="220" fill="#fbbf24" opacity="0.6"/>

  <!-- meandering river hero -->
  <path d="M0,560 C360,470 540,640 800,600 C1080,558 1240,690 1600,610 L1600,900 L0,900 Z"
        fill="url(#river)" opacity="0.92"/>
  <path d="M0,560 C360,470 540,640 800,600 C1080,558 1240,690 1600,610"
        fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.5"/>

  <!-- boat silhouette, hero centered in safe zone -->
  <g opacity="0.95">
    <path d="M640,560 L960,560 L905,628 Q800,648 695,628 Z" fill="url(#boat)"/>
    <path d="M800,560 L800,400 L905,470 L800,500 Z" fill="#c2410c" opacity="0.9"/>
    <rect x="796" y="392" width="9" height="172" rx="4" fill="#78350f"/>
  </g>

  <!-- reflection -->
  <path d="M695,640 Q800,662 905,640 L885,672 Q800,690 715,672 Z" fill="#9a3309" opacity="0.4"/>
</svg>
