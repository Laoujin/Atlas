<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- decoration: soft map-field band, outside hero center -->
  <path d="M 0 720 C 360 660 620 780 920 700 C 1180 632 1380 720 1600 668 L 1600 900 L 0 900 Z"
        fill="#0e7490" opacity="0.12"/>

  <!-- hero: sweeping route ribbon connecting two nodes -->
  <path d="M 250 660 C 520 560 540 300 800 320 C 1060 340 1090 600 1360 500"
        fill="none" stroke="url(#route)" stroke-width="34" stroke-linecap="round" opacity="0.92"/>
  <path d="M 250 660 C 520 560 540 300 800 320 C 1060 340 1090 600 1360 500"
        fill="none" stroke="#faf8f2" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="2 46" opacity="0.85"/>

  <!-- origin node -->
  <circle cx="250" cy="660" r="46" fill="url(#node)" opacity="0.95"/>
  <circle cx="250" cy="660" r="20" fill="#faf8f2" opacity="0.9"/>
  <!-- destination node -->
  <circle cx="1360" cy="500" r="46" fill="url(#node)" opacity="0.95"/>
  <circle cx="1360" cy="500" r="20" fill="#faf8f2" opacity="0.9"/>
</svg>
