<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#9a3309" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="broth" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#3a1607"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- rising steam, outside safe zone top -->
  <path d="M740 120 q-30 -55 0 -110 q30 -45 6 -95" stroke="#fef3ec" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.18"/>
  <path d="M860 120 q34 -60 2 -115 q-26 -42 4 -92" stroke="#fef3ec" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.18"/>

  <!-- skewers dipped into the pot -->
  <g stroke="#78350f" stroke-width="11" stroke-linecap="round" opacity="0.92">
    <line x1="690" y1="210" x2="772" y2="470"/>
    <line x1="800" y1="180" x2="800" y2="470"/>
    <line x1="910" y1="210" x2="828" y2="470"/>
  </g>
  <g fill="#c2410c" opacity="0.9">
    <ellipse cx="690" cy="205" rx="20" ry="26"/>
    <ellipse cx="688" cy="172" rx="18" ry="23"/>
    <ellipse cx="800" cy="176" rx="20" ry="26"/>
    <ellipse cx="800" cy="143" rx="18" ry="23"/>
    <ellipse cx="910" cy="205" rx="20" ry="26"/>
    <ellipse cx="912" cy="172" rx="18" ry="23"/>
  </g>

  <!-- hero: communal satay-celup pot -->
  <ellipse cx="800" cy="690" rx="290" ry="70" fill="#000000" opacity="0.35"/>
  <path d="M520 470 a280 90 0 0 0 560 0 l-26 150 a258 80 0 0 1 -508 0 Z" fill="url(#pot)" opacity="0.95"/>
  <ellipse cx="800" cy="470" rx="280" ry="90" fill="url(#broth)" opacity="0.95"/>
  <ellipse cx="800" cy="468" rx="280" ry="88" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.7"/>

  <!-- rose accent: chilli garnish, restraint -->
  <ellipse cx="700" cy="455" rx="34" ry="14" fill="#be185d" opacity="0.75" transform="rotate(-18 700 455)"/>
  <ellipse cx="892" cy="478" rx="30" ry="12" fill="#be185d" opacity="0.7" transform="rotate(22 892 478)"/>
</svg>
