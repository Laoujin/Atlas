<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.5" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="brickDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun disc decoration, outside safe zone -->
  <circle cx="1340" cy="180" r="120" fill="#fbbf24" opacity="0.65"/>

  <!-- hero: Christ Church facade + clock tower silhouette -->
  <g opacity="0.92">
    <!-- clock tower body -->
    <rect x="560" y="300" width="150" height="420" fill="url(#brickDark)"/>
    <!-- tower tiered cap -->
    <polygon points="560,300 635,210 710,300" fill="url(#brick)" opacity="0.9"/>
    <rect x="600" y="270" width="70" height="40" fill="#78350f" opacity="0.85"/>

    <!-- church main mass with stepped Dutch gable -->
    <polygon points="730,720 730,420 820,330 940,330 1030,420 1030,720" fill="url(#brick)"/>
    <!-- gable step ridge -->
    <polygon points="820,330 820,300 880,300 880,265 940,330" fill="url(#brickDark)" opacity="0.9"/>
    <!-- arched doorway cut -->
    <path d="M850 720 L850 560 Q880 520 910 560 L910 720 Z" fill="#fef3ec" opacity="0.8"/>
  </g>

  <!-- ground band decoration -->
  <rect x="0" y="720" width="1600" height="180" fill="#78350f" opacity="0.7"/>
</svg>
