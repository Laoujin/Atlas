<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <!-- Central warm glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate gradient -->
    <radialGradient id="plateMain" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c4a8"/>
    </radialGradient>
    <!-- Plate rim shadow -->
    <radialGradient id="plateRim" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Sauce swirl gradient -->
    <radialGradient id="sauce" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Mountain gradient -->
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Star shimmer -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3 decoration: Alpine mountain silhouette at bottom edge -->
  <polygon points="0,900 0,680 160,520 280,600 420,470 580,590 700,500 800,560 900,480 1050,570 1200,440 1360,560 1480,490 1600,540 1600,900" fill="url(#mountain)" opacity="0.75"/>
  <!-- Snow caps on peaks -->
  <polygon points="160,520 200,545 180,538 210,555 145,555" fill="#faf8f2" opacity="0.12"/>
  <polygon points="420,470 460,495 440,488 470,507 405,507" fill="#faf8f2" opacity="0.10"/>
  <polygon points="1200,440 1240,465 1220,458 1250,478 1185,478" fill="#faf8f2" opacity="0.11"/>

  <!-- Layer 2: Hero — dinner plate composition centered at (800, 450) -->

  <!-- Back plate (slightly offset, larger) -->
  <ellipse cx="870" cy="465" rx="210" ry="210" fill="url(#plateMain)" opacity="0.55"/>
  <ellipse cx="870" cy="465" rx="210" ry="210" fill="url(#plateRim)" opacity="0.6"/>

  <!-- Main hero plate -->
  <ellipse cx="760" cy="440" rx="230" ry="230" fill="url(#plateMain)" opacity="0.97"/>
  <ellipse cx="760" cy="440" rx="230" ry="230" fill="url(#plateRim)" opacity="0.85"/>

  <!-- Inner plate well (slightly inset circle) -->
  <ellipse cx="760" cy="440" rx="178" ry="178" fill="#faf8f2" opacity="0.45"/>

  <!-- Sauce arc swirl on main plate -->
  <path d="M 700,390 Q 780,355 820,420 Q 840,460 800,490 Q 760,515 720,495 Q 690,478 695,445" fill="none" stroke="url(#sauce)" stroke-width="18" stroke-linecap="round" opacity="0.88"/>

  <!-- Central protein element (small rounded rect representing a cut of meat) -->
  <rect x="728" y="415" width="68" height="44" rx="14" ry="14" fill="#9a3309" opacity="0.92"/>
  <rect x="734" y="420" width="56" height="34" rx="10" ry="10" fill="#c2410c" opacity="0.75"/>

  <!-- Microgreens accent dots on plate -->
  <circle cx="698" cy="428" r="5" fill="#78350f" opacity="0.7"/>
  <circle cx="710" cy="416" r="4" fill="#9a3309" opacity="0.6"/>
  <circle cx="721" cy="422" r="3.5" fill="#78350f" opacity="0.65"/>
  <circle cx="812" cy="432" r="4" fill="#9a3309" opacity="0.6"/>
  <circle cx="822" cy="444" r="3" fill="#78350f" opacity="0.55"/>

  <!-- Wine glass silhouette (right of plates) -->
  <!-- Bowl -->
  <path d="M 1055,270 Q 1100,310 1108,365 Q 1115,415 1075,440 Q 1058,448 1040,448 Q 1022,448 1005,440 Q 965,415 972,365 Q 980,310 1025,270 Z" fill="url(#glass)" opacity="0.72"/>
  <!-- Stem -->
  <rect x="1033" y="448" width="14" height="110" rx="7" fill="#fbbf24" opacity="0.35"/>
  <!-- Base -->
  <ellipse cx="1040" cy="562" rx="42" ry="9" fill="#d97706" opacity="0.38"/>
  <!-- Wine level inside glass -->
  <ellipse cx="1040" cy="410" rx="55" ry="16" fill="#9a3309" opacity="0.45"/>

  <!-- Michelin star motifs (3 small 6-point stars, upper area) -->
  <!-- Star 1 -->
  <polygon points="800,180 808,200 830,200 814,213 820,235 800,222 780,235 786,213 770,200 792,200" fill="url(#star)" opacity="0.82"/>
  <!-- Star 2 -->
  <polygon points="845,155 852,173 872,173 857,184 863,204 845,192 827,204 833,184 818,173 838,173" fill="url(#star)" opacity="0.68"/>
  <!-- Star 3 -->
  <polygon points="755,155 762,173 782,173 767,184 773,204 755,192 737,204 743,184 728,173 748,173" fill="url(#star)" opacity="0.68"/>

  <!-- Subtle warm rim-light arc behind plates (depth) -->
  <path d="M 560,440 Q 760,200 960,440" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.12"/>

</svg>
