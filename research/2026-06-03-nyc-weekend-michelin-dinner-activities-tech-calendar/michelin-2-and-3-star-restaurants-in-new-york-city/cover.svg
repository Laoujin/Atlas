<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#2a0f0f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <!-- Warm ambient glow behind plates -->
    <radialGradient id="ambientGlow" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Left plate gradient -->
    <radialGradient id="plateLeft" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="1"/>
      <stop offset="70%" stop-color="#e8dfd0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c8b99a" stop-opacity="1"/>
    </radialGradient>
    <!-- Right plate gradient -->
    <radialGradient id="plateRight" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0eadb" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ddd0bd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b8a48a" stop-opacity="1"/>
    </radialGradient>
    <!-- Food accent on plate -->
    <radialGradient id="foodAccent" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Rose accent gradient -->
    <radialGradient id="roseAccent" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7c1040" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#faf8f2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#faf8f2" stop-opacity="0.28"/>
    </linearGradient>
    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <rect width="1600" height="900" fill="url(#ambientGlow)"/>

  <!-- Layer 3 decoration: subtle table edge line at bottom -->
  <ellipse cx="800" cy="870" rx="680" ry="55" fill="#2e1210" opacity="0.6"/>

  <!-- Layer 2: Hero element — two plates + wine glass, centered ~(800,450) -->

  <!-- Left plate shadow -->
  <ellipse cx="638" cy="492" rx="198" ry="28" fill="#0d0606" opacity="0.55"/>
  <!-- Right plate shadow -->
  <ellipse cx="970" cy="492" rx="198" ry="28" fill="#0d0606" opacity="0.45"/>

  <!-- Left plate (larger, hero) -->
  <ellipse cx="635" cy="462" rx="195" ry="195" fill="url(#plateLeft)" opacity="0.96"/>
  <!-- Left plate inner rim -->
  <ellipse cx="635" cy="462" rx="170" ry="170" fill="none" stroke="#c8b99a" stroke-width="2.5" opacity="0.5"/>
  <!-- Left plate food element: elegant small composition -->
  <ellipse cx="635" cy="455" rx="72" ry="58" fill="url(#foodAccent)" opacity="0.88"/>
  <ellipse cx="635" cy="448" rx="38" ry="28" fill="#9a3309" opacity="0.7"/>
  <!-- Rose sauce accent on left plate -->
  <ellipse cx="652" cy="468" rx="22" ry="14" fill="url(#roseAccent)" opacity="0.8"/>

  <!-- Right plate -->
  <ellipse cx="968" cy="462" rx="185" ry="185" fill="url(#plateRight)" opacity="0.93"/>
  <!-- Right plate inner rim -->
  <ellipse cx="968" cy="462" rx="160" ry="160" fill="none" stroke="#b8a48a" stroke-width="2" opacity="0.45"/>
  <!-- Right plate food element -->
  <ellipse cx="968" cy="454" rx="65" ry="52" fill="url(#foodAccent)" opacity="0.82"/>
  <ellipse cx="964" cy="447" rx="32" ry="24" fill="#78350f" opacity="0.72"/>
  <!-- Rose drizzle accent on right plate -->
  <ellipse cx="980" cy="466" rx="18" ry="11" fill="url(#roseAccent)" opacity="0.75"/>

  <!-- Wine glass silhouette between/right of plates -->
  <!-- Glass bowl -->
  <path d="M820,280 Q770,330 762,390 Q755,440 800,460 Q810,465 800,460 Q845,440 838,390 Q830,330 820,280 Z"
        fill="url(#glassGrad)" stroke="#faf8f2" stroke-width="1.2" stroke-opacity="0.25" opacity="0.82"/>
  <!-- Glass stem -->
  <rect x="817" y="460" width="6" height="110" fill="#faf8f2" opacity="0.22"/>
  <!-- Glass base -->
  <ellipse cx="820" cy="572" rx="34" ry="7" fill="#faf8f2" opacity="0.18"/>
  <!-- Wine level inside glass -->
  <path d="M773,395 Q764,438 800,456 Q836,438 827,395 Z"
        fill="#be185d" opacity="0.28"/>

  <!-- Michelin star cluster: three small stars above hero -->
  <!-- Star 1 glow -->
  <circle cx="770" cy="218" r="18" fill="url(#starGlow)" opacity="0.7"/>
  <!-- Star 1 -->
  <polygon points="770,206 773,215 783,215 775,221 778,230 770,224 762,230 765,221 757,215 767,215"
           fill="#fbbf24" opacity="0.92"/>
  <!-- Star 2 glow -->
  <circle cx="820" cy="208" r="18" fill="url(#starGlow)" opacity="0.7"/>
  <!-- Star 2 -->
  <polygon points="820,196 823,205 833,205 825,211 828,220 820,214 812,220 815,211 807,205 817,205"
           fill="#fbbf24" opacity="0.92"/>
  <!-- Star 3 glow -->
  <circle cx="870" cy="218" r="18" fill="url(#starGlow)" opacity="0.7"/>
  <!-- Star 3 -->
  <polygon points="870,206 873,215 883,215 875,221 878,230 870,224 862,230 865,221 857,215 867,215"
           fill="#fbbf24" opacity="0.92"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="none" rx="0"
        style="paint-order:stroke fill"
        stroke="#1a0e0e" stroke-width="120" stroke-opacity="0.45"/>
</svg>
