<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#2a0f0f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plateGrad" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="clocheGrad" cx="42%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Layer 3 decoration: soft ambient table surface glow at bottom edge -->
  <ellipse cx="800" cy="860" rx="680" ry="120" fill="url(#tableGlow)"/>

  <!-- Layer 2: hero element — centered at (800, 450), safe zone x:125-1475, y:90-810 -->

  <!-- Table surface suggestion: dark warm ellipse -->
  <ellipse cx="800" cy="660" rx="460" ry="60" fill="#3b1410" opacity="0.85"/>

  <!-- Plate body -->
  <ellipse cx="800" cy="640" rx="290" ry="58" fill="url(#plateGrad)"/>

  <!-- Plate rim highlight -->
  <ellipse cx="800" cy="640" rx="290" ry="58" fill="none" stroke="url(#rimGrad)" stroke-width="7" opacity="0.9"/>
  <ellipse cx="800" cy="635" rx="260" ry="46" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.35"/>

  <!-- Cloche dome -->
  <path d="M 510,642 Q 512,340 800,318 Q 1088,340 1090,642 Z" fill="url(#clocheGrad)" opacity="0.88"/>

  <!-- Cloche inner shadow for depth -->
  <path d="M 560,642 Q 562,378 800,358 Q 1038,378 1040,642 Z" fill="#78350f" opacity="0.28"/>

  <!-- Cloche base band -->
  <rect x="505" y="634" width="590" height="22" rx="6" fill="#9a3309" opacity="0.9"/>
  <rect x="505" y="634" width="590" height="6" rx="3" fill="#fbbf24" opacity="0.55"/>

  <!-- Cloche handle knob -->
  <ellipse cx="800" cy="318" rx="34" ry="20" fill="#d97706" opacity="0.95"/>
  <ellipse cx="800" cy="313" rx="22" ry="12" fill="#fbbf24" opacity="0.7"/>

  <!-- Michelin star motif: three small diamond stars flanking the handle -->
  <!-- Star left -->
  <polygon points="720,355 727,373 746,373 731,384 737,402 720,391 703,402 709,384 694,373 713,373" fill="#fbbf24" opacity="0.72" transform="scale(0.52) translate(664,320)"/>
  <!-- Star right -->
  <polygon points="880,355 887,373 906,373 891,384 897,402 880,391 863,402 869,384 854,373 873,373" fill="#fbbf24" opacity="0.72" transform="scale(0.52) translate(-646,320)"/>
  <!-- Star centre top -->
  <polygon points="800,288 806,304 823,304 810,314 815,330 800,320 785,330 790,314 777,304 794,304" fill="#fbbf24" opacity="0.65" transform="scale(0.55) translate(0,258)"/>

  <!-- Subtle corner accent: top-left city silhouette bar (decoration, outside safe zone) -->
  <rect x="0" y="0" width="1600" height="3" fill="#c2410c" opacity="0.6"/>
  <rect x="0" y="897" width="1600" height="3" fill="#c2410c" opacity="0.4"/>
</svg>
