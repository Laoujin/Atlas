<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="pinHi" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- warm radial lamp-glow centered on hero -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- walking-radius concentric rings -->
  <g fill="none" stroke="#fbbf24" stroke-opacity="0.18">
    <circle cx="800" cy="500" r="360" stroke-width="1.5"/>
    <circle cx="800" cy="500" r="260" stroke-width="1.5"/>
    <circle cx="800" cy="500" r="170" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- distant rooftops / facade silhouettes (decoration along lower bleed) -->
  <g fill="#1a0e0e" fill-opacity="0.7">
    <polygon points="0,820 90,760 180,820 180,900 0,900"/>
    <polygon points="180,820 260,770 340,820 340,900 180,900"/>
    <polygon points="1260,820 1340,765 1420,820 1420,900 1260,900"/>
    <polygon points="1420,820 1510,770 1600,820 1600,900 1420,900"/>
  </g>

  <!-- tiny window lights on rooftops -->
  <g fill="#fbbf24" fill-opacity="0.75">
    <rect x="95"   y="795" width="6" height="8"/>
    <rect x="265"  y="800" width="6" height="8"/>
    <rect x="1345" y="795" width="6" height="8"/>
    <rect x="1505" y="800" width="6" height="8"/>
  </g>

  <!-- secondary accent: faint rose evening-sky band along very top edge -->
  <rect x="0" y="0" width="1600" height="120" fill="#be185d" opacity="0.08"/>

  <!-- HERO: map pin centered ~(800,450) -->
  <g>
    <!-- pin shadow on ground -->
    <ellipse cx="800" cy="640" rx="90" ry="14" fill="#000" fill-opacity="0.35"/>

    <!-- pin teardrop body -->
    <path d="M800 230
             C690 230 610 310 610 420
             C610 510 680 580 770 625
             L800 660
             L830 625
             C920 580 990 510 990 420
             C990 310 910 230 800 230 Z"
          fill="url(#pin)" stroke="#78350f" stroke-width="3" opacity="0.95"/>

    <!-- pin highlight -->
    <path d="M800 230
             C690 230 610 310 610 420
             C610 460 625 495 650 525
             C645 470 665 380 730 320
             C770 282 790 260 800 230 Z"
          fill="url(#pinHi)"/>

    <!-- inner cutout (the "hole" of the pin) -->
    <circle cx="800" cy="410" r="75" fill="#1a0e0e" opacity="0.92"/>

    <!-- grape-leaf / star anchor inside the cutout -->
    <g transform="translate(800 410)" fill="#fbbf24" opacity="0.92">
      <path d="M0 -42
               L11 -13
               L42 -13
               L17  6
               L26  36
               L0   18
               L-26 36
               L-17  6
               L-42 -13
               L-11 -13 Z"/>
    </g>
  </g>
</svg>
