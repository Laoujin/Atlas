<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
    <!-- Front face gradient (rust) -->
    <linearGradient id="frontFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Top face gradient -->
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Side face gradient (slate) -->
    <linearGradient id="sideFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- LED glow -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient glow behind hero -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Dashboard panel gradient -->
    <linearGradient id="dashPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle grid lines on background (atmospheric, low opacity) -->
  <g stroke="#c2410c" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="266" y1="0" x2="266" y2="900"/>
    <line x1="533" y1="0" x2="533" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1066" y1="0" x2="1066" y2="900"/>
    <line x1="1333" y1="0" x2="1333" y2="900"/>
  </g>

  <!-- Layer 2: Hero element — isometric server chassis stack -->
  <!-- Ambient glow behind the stack -->
  <ellipse cx="800" cy="480" rx="420" ry="260" fill="url(#ambientGlow)"/>

  <!-- Isometric layout:
       Each chassis: front face (parallelogram), top face (parallelogram), right side face
       Stack of 3 units. Bottom chassis at y~580, middle ~480, top ~380
       Isometric angle: x-step = cos(30°)*scale, y-step = sin(30°)*scale
       Front face width=380, height=72 (1U-style ratio but 2U visual)
       Top face skew: 190 right = 95px right, 55px up per unit
  -->

  <!-- === CHASSIS 3 (bottom) === -->
  <!-- Side face (right) -->
  <polygon points="990,588 1130,518 1130,596 990,666" fill="url(#sideFace)" opacity="0.85"/>
  <!-- Front face -->
  <polygon points="610,588 990,588 990,666 610,666" fill="url(#frontFace)" opacity="0.88"/>
  <!-- Top face -->
  <polygon points="610,588 990,588 1130,518 750,518" fill="url(#topFace)" opacity="0.75"/>
  <!-- Drive bay slots on front (decorative bars) -->
  <rect x="630" y="600" width="120" height="10" rx="2" fill="#fbbf24" opacity="0.25"/>
  <rect x="630" y="616" width="120" height="10" rx="2" fill="#fbbf24" opacity="0.18"/>
  <rect x="630" y="632" width="120" height="10" rx="2" fill="#fbbf24" opacity="0.12"/>
  <!-- Status LEDs bottom chassis -->
  <circle cx="942" cy="618" r="5" fill="#334155" opacity="0.9"/>
  <circle cx="958" cy="618" r="5" fill="#334155" opacity="0.9"/>

  <!-- === CHASSIS 2 (middle) === -->
  <!-- Side face (right) -->
  <polygon points="990,492 1130,422 1130,518 990,588" fill="url(#sideFace)" opacity="0.9"/>
  <!-- Front face -->
  <polygon points="610,492 990,492 990,588 610,588" fill="url(#frontFace)" opacity="0.92"/>
  <!-- Top face -->
  <polygon points="610,492 990,492 1130,422 750,422" fill="url(#topFace)" opacity="0.78"/>
  <!-- Drive bay slots on front -->
  <rect x="630" y="504" width="140" height="10" rx="2" fill="#fbbf24" opacity="0.28"/>
  <rect x="630" y="520" width="140" height="10" rx="2" fill="#fbbf24" opacity="0.2"/>
  <rect x="630" y="536" width="100" height="10" rx="2" fill="#fbbf24" opacity="0.14"/>
  <!-- Dashboard mini panel on middle chassis front -->
  <rect x="760" y="502" width="210" height="72" rx="3" fill="url(#dashPanel)" opacity="0.88"/>
  <rect x="772" y="512" width="80" height="8" rx="1" fill="#c2410c" opacity="0.7"/>
  <rect x="772" y="525" width="60" height="8" rx="1" fill="#d97706" opacity="0.5"/>
  <rect x="772" y="538" width="90" height="8" rx="1" fill="#c2410c" opacity="0.4"/>
  <rect x="772" y="551" width="50" height="8" rx="1" fill="#334155" opacity="0.6"/>
  <!-- Status LED middle chassis — glowing amber -->
  <circle cx="942" cy="522" r="8" fill="url(#ledGlow)" opacity="0.95"/>
  <circle cx="942" cy="522" r="4" fill="#fbbf24" opacity="1"/>
  <circle cx="958" cy="522" r="5" fill="#334155" opacity="0.9"/>

  <!-- === CHASSIS 1 (top) === -->
  <!-- Side face (right) -->
  <polygon points="990,396 1130,326 1130,422 990,492" fill="url(#sideFace)" opacity="0.92"/>
  <!-- Front face -->
  <polygon points="610,396 990,396 990,492 610,492" fill="url(#frontFace)" opacity="0.95"/>
  <!-- Top face -->
  <polygon points="610,396 990,396 1130,326 750,326" fill="url(#topFace)" opacity="0.82"/>
  <!-- Vent slots on front -->
  <rect x="630" y="408" width="300" height="6" rx="1" fill="#1a0e0e" opacity="0.3"/>
  <rect x="630" y="420" width="300" height="6" rx="1" fill="#1a0e0e" opacity="0.3"/>
  <rect x="630" y="432" width="300" height="6" rx="1" fill="#1a0e0e" opacity="0.3"/>
  <rect x="630" y="444" width="200" height="6" rx="1" fill="#1a0e0e" opacity="0.3"/>
  <!-- Port cluster on front face -->
  <rect x="850" y="410" width="28" height="18" rx="3" fill="#1e293b" opacity="0.85"/>
  <rect x="884" y="410" width="28" height="18" rx="3" fill="#1e293b" opacity="0.85"/>
  <rect x="850" y="434" width="28" height="18" rx="3" fill="#1e293b" opacity="0.7"/>
  <!-- Status LEDs top chassis -->
  <circle cx="942" cy="426" r="5" fill="#c2410c" opacity="0.8"/>
  <circle cx="958" cy="426" r="5" fill="#334155" opacity="0.9"/>

  <!-- Rack ear / mounting bracket accent left side -->
  <rect x="596" y="396" width="14" height="270" rx="2" fill="#334155" opacity="0.6"/>
  <circle cx="603" cy="420" r="4" fill="#1a0e0e" opacity="0.7"/>
  <circle cx="603" cy="530" r="4" fill="#1a0e0e" opacity="0.7"/>
  <circle cx="603" cy="640" r="4" fill="#1a0e0e" opacity="0.7"/>

  <!-- Layer 3: Decorative edge elements (outside safe zone, atmospheric) -->
  <!-- Corner accent top-left -->
  <rect x="0" y="0" width="110" height="4" fill="#c2410c" opacity="0.35"/>
  <rect x="0" y="0" width="4" height="110" fill="#c2410c" opacity="0.35"/>
  <!-- Corner accent bottom-right -->
  <rect x="1490" y="896" width="110" height="4" fill="#c2410c" opacity="0.35"/>
  <rect x="1596" y="790" width="4" height="110" fill="#c2410c" opacity="0.35"/>
  <!-- Subtle bottom edge glow -->
  <rect x="0" y="880" width="1600" height="20" fill="#c2410c" opacity="0.06"/>
</svg>
