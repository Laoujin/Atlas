<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Left block face gradient -->
    <linearGradient id="blockLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Right block face gradient -->
    <linearGradient id="blockRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0a5568"/>
    </linearGradient>
    <!-- Connection glow -->
    <radialGradient id="connGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Top highlight on blocks -->
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="topFaceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="#1a0e0e" opacity="0.35"
        style="mask: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, black 100%)"/>

  <!-- Layer 2: Hero — two interlocking chassis blocks with connector -->

  <!-- LEFT BLOCK (rust) — isometric chassis, centered left of 800 -->
  <!-- Top face (parallelogram) -->
  <polygon points="460,310 700,270 700,320 460,360" fill="url(#topFace)" opacity="0.85"/>
  <!-- Front face -->
  <rect x="460" y="360" width="240" height="190" fill="url(#blockLeft)" opacity="0.92"/>
  <!-- Right side face (depth) -->
  <polygon points="700,320 760,290 760,480 700,550" fill="#78350f" opacity="0.80"/>
  <!-- Front face ledge lines (rack rails) -->
  <line x1="460" y1="400" x2="700" y2="400" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="430" x2="700" y2="430" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="460" x2="700" y2="460" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  <line x1="460" y1="490" x2="700" y2="490" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
  <!-- LED dot on left block -->
  <circle cx="680" cy="378" r="6" fill="#fbbf24" opacity="0.95"/>
  <circle cx="680" cy="378" r="12" fill="#fbbf24" opacity="0.20"/>

  <!-- RIGHT BLOCK (teal) — proxy chassis -->
  <!-- Top face -->
  <polygon points="900,270 1140,310 1140,360 900,320" fill="url(#topFaceRight)" opacity="0.80"/>
  <!-- Front face -->
  <rect x="900" y="320" width="240" height="190" fill="url(#blockRight)" opacity="0.92"/>
  <!-- Left side face (depth) -->
  <polygon points="840,290 900,320 900,510 840,480" fill="#0a3d4d" opacity="0.75"/>
  <!-- Front face ledge lines -->
  <line x1="900" y1="360" x2="1140" y2="360" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <line x1="900" y1="390" x2="1140" y2="390" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <line x1="900" y1="420" x2="1140" y2="420" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <line x1="900" y1="450" x2="1140" y2="450" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <!-- LED dot on right block -->
  <circle cx="920" cy="340" r="6" fill="#22d3ee" opacity="0.95"/>
  <circle cx="920" cy="340" r="12" fill="#22d3ee" opacity="0.20"/>

  <!-- Connection arc between blocks -->
  <ellipse cx="800" cy="580" rx="60" ry="18" fill="url(#connGlow)" opacity="0.6"/>
  <!-- Connector cable path -->
  <path d="M 700 510 C 730 560 870 560 900 510"
        stroke="#fbbf24" stroke-width="4" fill="none" opacity="0.85"
        stroke-linecap="round"/>
  <!-- Spark at midpoint -->
  <circle cx="800" cy="562" r="8" fill="#fbbf24" opacity="0.90"/>
  <circle cx="800" cy="562" r="16" fill="#fbbf24" opacity="0.25"/>
  <!-- Port nubs on left block bottom -->
  <rect x="640" y="548" width="16" height="10" rx="3" fill="#d97706" opacity="0.85"/>
  <rect x="663" y="548" width="16" height="10" rx="3" fill="#d97706" opacity="0.65"/>
  <!-- Port nubs on right block bottom -->
  <rect x="930" y="508" width="16" height="10" rx="3" fill="#0e7490" opacity="0.85"/>
  <rect x="953" y="508" width="16" height="10" rx="3" fill="#0e7490" opacity="0.65"/>

  <!-- Layer 3: Edge decoration (outside safe zone, atmospheric) -->
  <!-- Corner accent lines top-left -->
  <line x1="0" y1="0" x2="120" y2="0" stroke="#c2410c" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#c2410c" stroke-width="3" opacity="0.5"/>
  <!-- Corner accent lines bottom-right -->
  <line x1="1480" y1="900" x2="1600" y2="900" stroke="#0e7490" stroke-width="3" opacity="0.5"/>
  <line x1="1600" y1="820" x2="1600" y2="900" stroke="#0e7490" stroke-width="3" opacity="0.5"/>
</svg>
