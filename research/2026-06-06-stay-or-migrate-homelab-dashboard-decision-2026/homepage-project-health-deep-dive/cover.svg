<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- hero: dashboard panel centered ~ (800,450) -->
  <g>
    <rect x="430" y="200" width="740" height="500" rx="26" fill="url(#panel)" opacity="0.96"/>

    <!-- left sidebar -->
    <rect x="430" y="200" width="120" height="500" rx="26" fill="#78350f" opacity="0.9"/>
    <circle cx="490" cy="262" r="18" fill="#fbbf24"/>
    <rect x="466" y="330" width="48" height="14" rx="7" fill="#fef3ec" opacity="0.6"/>
    <rect x="466" y="380" width="48" height="14" rx="7" fill="#fef3ec" opacity="0.6"/>
    <rect x="466" y="430" width="48" height="14" rx="7" fill="#fef3ec" opacity="0.6"/>

    <!-- hero widget tile -->
    <rect x="588" y="252" width="250" height="180" rx="16" fill="url(#hero)"/>
    <rect x="616" y="288" width="120" height="16" rx="8" fill="#fef3ec" opacity="0.85"/>
    <rect x="616" y="324" width="190" height="10" rx="5" fill="#fef3ec" opacity="0.5"/>
    <rect x="616" y="350" width="160" height="10" rx="5" fill="#fef3ec" opacity="0.5"/>
    <circle cx="800" cy="400" r="10" fill="#fbbf24"/>

    <!-- secondary teal tile (health metric) -->
    <rect x="868" y="252" width="250" height="180" rx="16" fill="#0e7490" opacity="0.92"/>
    <polyline points="896,400 940,360 984,378 1028,322 1072,344 1096,300"
              fill="none" stroke="#fef3ec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <rect x="896" y="288" width="100" height="12" rx="6" fill="#fef3ec" opacity="0.7"/>

    <!-- bottom row tiles -->
    <rect x="588" y="468" width="160" height="180" rx="16" fill="#c2410c" opacity="0.9"/>
    <circle cx="668" cy="558" r="46" fill="none" stroke="#fef3ec" stroke-width="10" opacity="0.7"/>
    <path d="M668 558 L668 512 A46 46 0 0 1 707 580 Z" fill="#fbbf24" opacity="0.85"/>

    <rect x="772" y="468" width="160" height="180" rx="16" fill="#f0eadb"/>
    <rect x="798" y="500" width="108" height="12" rx="6" fill="#9a3309" opacity="0.7"/>
    <rect x="798" y="540" width="80" height="10" rx="5" fill="#c2410c" opacity="0.5"/>
    <rect x="798" y="572" width="96" height="10" rx="5" fill="#c2410c" opacity="0.5"/>
    <rect x="798" y="604" width="64" height="10" rx="5" fill="#c2410c" opacity="0.5"/>

    <rect x="956" y="468" width="162" height="180" rx="16" fill="#0e7490" opacity="0.85"/>
    <rect x="982" y="600" width="26" height="24" rx="4" fill="#fef3ec" opacity="0.85"/>
    <rect x="1020" y="568" width="26" height="56" rx="4" fill="#fef3ec" opacity="0.85"/>
    <rect x="1058" y="524" width="26" height="100" rx="4" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>
