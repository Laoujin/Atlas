<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.72" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#warm)"/>

  <g transform="rotate(-4 800 500)">
    <rect x="360" y="260" width="800" height="150" rx="14" fill="url(#hero)" opacity="0.95"/>
    <rect x="420" y="440" width="800" height="150" rx="14" fill="url(#mid)" opacity="0.78"/>
    <rect x="480" y="620" width="800" height="150" rx="14" fill="none" stroke="#78350f" stroke-width="4" stroke-dasharray="26 20" opacity="0.5"/>
  </g>
</svg>
