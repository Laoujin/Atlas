  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="450" rx="620" ry="420" fill="url(#glow)"/>

  <g fill="#78350f">
    <rect x="300" y="292" width="300" height="330" rx="16" opacity="0.26" transform="rotate(-7 450 457)"/>
    <rect x="1000" y="292" width="300" height="330" rx="16" opacity="0.2" transform="rotate(7 1150 457)"/>
  </g>

  <g>
    <rect x="560" y="228" width="480" height="444" rx="18" fill="url(#panel)" stroke="#9a3309" stroke-width="3" opacity="0.95"/>
    <rect x="586" y="254" width="428" height="168" rx="8" fill="url(#ramp)" opacity="0.9"/>
    <rect x="586" y="440" width="204" height="206" rx="8" fill="#78350f" opacity="0.22"/>
    <rect x="810" y="440" width="204" height="206" rx="8" fill="#c2410c" opacity="0.88"/>
  </g>

  <rect x="740" y="672" width="120" height="46" rx="10" fill="#9a3309" opacity="0.35"/>
