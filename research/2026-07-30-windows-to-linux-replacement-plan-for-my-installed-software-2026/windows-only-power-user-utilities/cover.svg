<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="430" rx="760" ry="470" fill="url(#glow)"/>

  <g transform="rotate(-4 800 450)">
    <g fill="#fef3ec" fill-opacity="0.75" stroke="#78350f" stroke-opacity="0.32" stroke-width="6">
      <rect x="370" y="230" width="260" height="200" rx="30"/>
      <rect x="970" y="230" width="260" height="200" rx="30"/>
      <rect x="370" y="470" width="260" height="200" rx="30"/>
      <rect x="670" y="470" width="260" height="200" rx="30"/>
    </g>

    <rect x="670" y="230" width="260" height="200" rx="30" fill="url(#hero)" fill-opacity="0.95"/>
    <circle cx="880" cy="270" r="16" fill="#fbbf24" fill-opacity="0.9"/>

    <rect x="970" y="470" width="260" height="200" rx="30" fill="none" stroke="#9a3309" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="26 20"/>
    <line x1="1010" y1="630" x2="1190" y2="510" stroke="#9a3309" stroke-opacity="0.6" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
