<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Full-bleed dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1008"/>
    </linearGradient>

    <!-- Warm table-glow radial -->
    <radialGradient id="glow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>

    <!-- Plate radial fill -->
    <radialGradient id="plateMain" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="60%" stop-color="#f0eadb"/>
      <stop offset="100%" stop-color="#d4c4aa"/>
    </radialGradient>

    <radialGradient id="plateSmall" cx="55%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="65%" stop-color="#ede0cc"/>
      <stop offset="100%" stop-color="#c8b89a"/>
    </radialGradient>

    <!-- Plate rim gradient -->
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Rose accent glow for star motif -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloche dome gradient -->
    <linearGradient id="clocheGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b1208" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient table glow — full bleed so no crop shows page color -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Decorative: faint palace-eave geometry — corner accents, outside safe zone -->
  <!-- Left palace bracket -->
  <polygon points="0,260 90,320 90,350 0,350" fill="#c2410c" opacity="0.10"/>
  <polygon points="0,200 110,280 110,320 0,260" fill="#d97706" opacity="0.07"/>
  <!-- Right palace bracket -->
  <polygon points="1600,260 1510,320 1510,350 1600,350" fill="#c2410c" opacity="0.10"/>
  <polygon points="1600,200 1490,280 1490,320 1600,260" fill="#d97706" opacity="0.07"/>

  <!-- Decorative: faint horizon line suggesting a roofline silhouette -->
  <rect x="0" y="820" width="1600" height="3" fill="#c2410c" opacity="0.12"/>
  <rect x="0" y="825" width="1600" height="1" fill="#fbbf24" opacity="0.08"/>

  <!-- Layer 2: Hero — two overlapping plate forms centered in safe zone -->

  <!-- Shadow under large plate -->
  <ellipse cx="790" cy="510" rx="260" ry="35" fill="#0a0404" opacity="0.55"/>

  <!-- Large plate rim glow ring -->
  <circle cx="770" cy="440" r="245" fill="url(#rimGlow)" opacity="0.85"/>

  <!-- Large plate body -->
  <circle cx="770" cy="440" r="230" fill="url(#plateMain)" opacity="0.93"/>

  <!-- Large plate inner well -->
  <circle cx="770" cy="440" r="175" fill="#faf8f2" opacity="0.55"/>

  <!-- Shadow under small plate -->
  <ellipse cx="870" cy="508" rx="185" ry="26" fill="#0a0404" opacity="0.45"/>

  <!-- Small plate rim glow ring -->
  <circle cx="850" cy="448" r="175" fill="url(#rimGlow)" opacity="0.80"/>

  <!-- Small plate body (overlapping, slightly forward) -->
  <circle cx="850" cy="448" r="162" fill="url(#plateSmall)" opacity="0.95"/>

  <!-- Small plate inner well -->
  <circle cx="850" cy="448" r="118" fill="#faf8f2" opacity="0.52"/>

  <!-- Michelin star motif on small plate — rose accent, purely geometric -->
  <!-- Six-pointed star via two overlapping triangles -->
  <polygon points="850,370 871,408 913,408 882,432 893,474 850,450 807,474 818,432 787,408 829,408"
           fill="url(#starGlow)" opacity="0.82"/>

  <!-- Centre dot of star -->
  <circle cx="850" cy="424" r="14" fill="#be185d" opacity="0.90"/>
  <circle cx="850" cy="424" r="7" fill="#fbbf24" opacity="0.85"/>

  <!-- Chopstick accent — two thin rectangles, angled, resting beside large plate -->
  <rect x="590" y="370" width="8" height="220" rx="4"
        fill="#c2410c" opacity="0.65"
        transform="rotate(-12, 594, 480)"/>
  <rect x="608" y="365" width="8" height="220" rx="4"
        fill="#9a3309" opacity="0.60"
        transform="rotate(-10, 612, 475)"/>

  <!-- Subtle decorative ring around hero area — very faint -->
  <circle cx="800" cy="445" r="310" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.12"/>
</svg>
