<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="0.55" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="540" rx="620" ry="420" fill="url(#glow)"/>

  <!-- distant ridge -->
  <path d="M125 560 Q450 470 800 520 Q1150 470 1475 560 L1475 720 L125 720 Z"
        fill="#78350f" opacity="0.6"/>

  <!-- hero: Namsan hill + N Seoul Tower, centered ~ (800,450) -->
  <path d="M250 720 Q550 560 800 540 Q1050 560 1350 720 Z" fill="#3a1810" opacity="0.92"/>

  <!-- tower lattice base legs -->
  <path d="M770 540 L758 400 L842 400 L830 540 Z" fill="#9a3309" opacity="0.85"/>
  <line x1="772" y1="500" x2="828" y2="500" stroke="#c2410c" stroke-width="3" opacity="0.7"/>
  <line x1="767" y1="455" x2="833" y2="455" stroke="#c2410c" stroke-width="3" opacity="0.7"/>

  <!-- tower observation deck -->
  <path d="M752 400 L848 400 L834 360 L766 360 Z" fill="url(#tower)"/>
  <rect x="780" y="320" width="40" height="40" fill="#9a3309"/>

  <!-- tower mast -->
  <rect x="792" y="180" width="16" height="140" fill="url(#tower)"/>
  <circle cx="800" cy="180" r="11" fill="#fbbf24"/>
  <circle cx="800" cy="180" r="22" fill="#fbbf24" opacity="0.25"/>

  <!-- city silhouette ledge -->
  <g fill="#1a0e0e" opacity="0.9">
    <rect x="180" y="660" width="70" height="60"/>
    <rect x="270" y="630" width="55" height="90"/>
    <rect x="1280" y="640" width="60" height="80"/>
    <rect x="1360" y="668" width="80" height="52"/>
  </g>
</svg>
