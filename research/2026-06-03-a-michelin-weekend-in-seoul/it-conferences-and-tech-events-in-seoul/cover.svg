<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep dark rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1206"/>
    </linearGradient>
    <!-- Stage glow: warm radial from centre -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Hero slide gradients -->
    <linearGradient id="slide1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="slide2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="slide3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <!-- Skyline gradient -->
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Stage glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 3 (bottom atmosphere): city skyline silhouette -->
  <!-- Simple building blocks along bottom edge — purely atmospheric -->
  <rect x="0"    y="780" width="80"  height="120" fill="url(#skyline)" opacity="0.5"/>
  <rect x="70"   y="740" width="60"  height="160" fill="url(#skyline)" opacity="0.45"/>
  <rect x="120"  y="800" width="50"  height="100" fill="url(#skyline)" opacity="0.4"/>
  <rect x="160"  y="755" width="70"  height="145" fill="url(#skyline)" opacity="0.5"/>
  <rect x="220"  y="820" width="45"  height="80"  fill="url(#skyline)" opacity="0.35"/>
  <rect x="255"  y="760" width="55"  height="140" fill="url(#skyline)" opacity="0.45"/>
  <rect x="300"  y="800" width="40"  height="100" fill="url(#skyline)" opacity="0.4"/>
  <!-- right side -->
  <rect x="1270" y="800" width="45"  height="100" fill="url(#skyline)" opacity="0.4"/>
  <rect x="1305" y="755" width="60"  height="145" fill="url(#skyline)" opacity="0.45"/>
  <rect x="1355" y="820" width="50"  height="80"  fill="url(#skyline)" opacity="0.35"/>
  <rect x="1395" y="760" width="65"  height="140" fill="url(#skyline)" opacity="0.5"/>
  <rect x="1450" y="800" width="55"  height="100" fill="url(#skyline)" opacity="0.4"/>
  <rect x="1495" y="740" width="55"  height="160" fill="url(#skyline)" opacity="0.45"/>
  <rect x="1540" y="780" width="60"  height="120" fill="url(#skyline)" opacity="0.5"/>

  <!-- Layer 2: Hero — three stacked angled parallelograms (conference slides / tiered stage) -->
  <!-- Back slide (darkest, lowest) -->
  <polygon
    points="490,580 1110,580 1190,380 570,380"
    fill="url(#slide1)"
    opacity="0.72"/>
  <!-- Middle slide -->
  <polygon
    points="530,565 1070,565 1140,390 600,390"
    fill="url(#slide2)"
    opacity="0.82"/>
  <!-- Front slide (brightest, top hero) -->
  <polygon
    points="570,548 1030,548 1090,405 630,405"
    fill="url(#slide3)"
    opacity="0.92"/>

  <!-- Podium / lectern: simple trapezoid below the slides -->
  <polygon
    points="740,548 860,548 890,640 710,640"
    fill="#78350f"
    opacity="0.85"/>
  <rect x="700" y="638" width="200" height="18" rx="4"
    fill="#9a3309" opacity="0.9"/>

  <!-- Accent: two small glowing dots (spotlight / LED accents on stage) -->
  <circle cx="690" cy="476" r="10" fill="#fbbf24" opacity="0.75"/>
  <circle cx="910" cy="476" r="10" fill="#fbbf24" opacity="0.75"/>

  <!-- Subtle horizon line -->
  <rect x="0" y="728" width="1600" height="2" fill="#c2410c" opacity="0.18"/>
</svg>
