<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="0.85" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="cityFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sunset sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow, sits behind skyline -->
  <circle cx="820" cy="540" r="320" fill="url(#sun)"/>
  <circle cx="820" cy="540" r="110" fill="#fef3ec" opacity="0.85"/>

  <!-- distant skyline band (lighter, behind) -->
  <path d="M 0 640
           L 90 640 L 90 600 L 160 600 L 160 620 L 230 620 L 230 580 L 300 580 L 300 610 L 380 610 L 380 560 L 440 560 L 440 600 L 520 600 L 520 590 L 600 590 L 600 540 L 660 540 L 660 580 L 740 580
           L 740 560 L 820 560 L 820 590 L 900 590 L 900 550 L 980 550 L 980 580 L 1060 580 L 1060 540 L 1140 540 L 1140 590 L 1220 590 L 1220 570 L 1300 570 L 1300 600 L 1380 600 L 1380 560 L 1460 560 L 1460 610 L 1600 610
           L 1600 900 L 0 900 Z"
        fill="url(#city)" opacity="0.7"/>

  <!-- foreground skyline with Bitexco hero, centered near (800, 450) -->
  <!-- left cluster -->
  <path d="M 180 720 L 180 680 L 240 680 L 240 660 L 300 660 L 300 700 L 360 700 L 360 640 L 420 640 L 420 690 L 480 690 L 480 670 L 540 670 L 540 720 Z"
        fill="url(#cityFront)"/>
  <!-- mid-left towers -->
  <path d="M 560 720 L 560 600 L 620 600 L 620 580 L 680 580 L 680 640 L 720 640 L 720 720 Z"
        fill="url(#cityFront)"/>
  <!-- Bitexco-inspired hero tower with helipad disc -->
  <g>
    <!-- main tapered shaft -->
    <path d="M 760 720 L 780 360 L 820 360 L 840 720 Z" fill="#1a0e0e"/>
    <!-- spire -->
    <path d="M 798 360 L 800 290 L 802 360 Z" fill="#1a0e0e"/>
    <!-- helipad disc -->
    <ellipse cx="800" cy="410" rx="80" ry="14" fill="#5c2a1a"/>
    <ellipse cx="800" cy="406" rx="80" ry="14" fill="#78350f"/>
    <ellipse cx="800" cy="406" rx="62" ry="9" fill="#1a0e0e"/>
    <!-- subtle window strip -->
    <rect x="794" y="430" width="12" height="280" fill="#c2410c" opacity="0.35"/>
  </g>
  <!-- second tall tower (Landmark-style slender) -->
  <path d="M 870 720 L 880 420 L 895 400 L 910 420 L 920 720 Z" fill="#1a0e0e"/>
  <path d="M 893 400 L 895 330 L 897 400 Z" fill="#1a0e0e"/>
  <rect x="889" y="450" width="12" height="260" fill="#d97706" opacity="0.3"/>

  <!-- right cluster -->
  <path d="M 940 720 L 940 560 L 1000 560 L 1000 540 L 1060 540 L 1060 610 L 1120 610 L 1120 580 L 1180 580 L 1180 640 L 1240 640 L 1240 600 L 1300 600 L 1300 660 L 1360 660 L 1360 630 L 1420 630 L 1420 690 L 1480 690 L 1480 720 Z"
        fill="url(#cityFront)"/>

  <!-- river / Saigon waterfront -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#river)"/>

  <!-- tower reflections, soft -->
  <path d="M 760 720 L 780 760 L 820 760 L 840 720 Z" fill="#1a0e0e" opacity="0.45"/>
  <path d="M 870 720 L 880 770 L 910 770 L 920 720 Z" fill="#1a0e0e" opacity="0.4"/>
  <rect x="180" y="720" width="360" height="30" fill="#1a0e0e" opacity="0.35"/>
  <rect x="940" y="720" width="540" height="34" fill="#1a0e0e" opacity="0.35"/>

  <!-- horizontal river shimmer lines -->
  <rect x="0" y="780" width="1600" height="2" fill="#fbbf24" opacity="0.25"/>
  <rect x="0" y="820" width="1600" height="2" fill="#fbbf24" opacity="0.18"/>
</svg>
