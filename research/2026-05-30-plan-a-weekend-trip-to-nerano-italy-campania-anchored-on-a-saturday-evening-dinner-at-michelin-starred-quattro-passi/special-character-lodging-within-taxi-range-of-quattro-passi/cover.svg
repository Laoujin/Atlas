<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.45" stop-color="#9a3309"/>
      <stop offset="0.8" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.4" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="cliffFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="cliffNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="villaGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun on horizon -->
  <circle cx="900" cy="540" r="240" fill="url(#sun)" opacity="0.9"/>

  <!-- Distant headland (far peninsula across the bay) -->
  <path d="M 0 560 Q 220 510 420 530 T 820 545 Q 1000 555 1180 540 T 1600 555 L 1600 600 L 0 600 Z"
        fill="url(#cliffFar)" opacity="0.75"/>

  <!-- Sea -->
  <rect x="0" y="560" width="1600" height="160" fill="url(#sea)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="900" cy="585" rx="180" ry="10" fill="#fbbf24" opacity="0.55"/>
  <ellipse cx="900" cy="610" rx="120" ry="6" fill="#fbbf24" opacity="0.35"/>
  <ellipse cx="900" cy="635" rx="80"  ry="4" fill="#fbbf24" opacity="0.22"/>

  <!-- Near cliff mass with terraced ledges, rising on the left -->
  <path d="M 0 900 L 0 380
           Q 120 360 240 400
           L 360 420
           Q 460 430 540 460
           L 640 500
           Q 720 530 780 560
           L 820 580
           L 820 900 Z"
        fill="url(#cliffNear)"/>

  <!-- Terrace ledges (lemon-grove suggestion) -->
  <path d="M 60 470 L 360 470 L 360 478 L 60 478 Z" fill="#1a0e0e" opacity="0.55"/>
  <path d="M 100 540 L 460 540 L 460 548 L 100 548 Z" fill="#1a0e0e" opacity="0.5"/>
  <path d="M 140 620 L 560 620 L 560 628 L 140 628 Z" fill="#1a0e0e" opacity="0.45"/>
  <path d="M 180 710 L 660 710 L 660 718 L 180 718 Z" fill="#1a0e0e" opacity="0.4"/>

  <!-- Lemon-tree silhouettes dotted along terraces -->
  <g fill="#1a0e0e" opacity="0.7">
    <circle cx="140" cy="462" r="10"/>
    <circle cx="200" cy="462" r="9"/>
    <circle cx="260" cy="462" r="11"/>
    <circle cx="320" cy="462" r="9"/>
    <circle cx="180" cy="532" r="10"/>
    <circle cx="250" cy="532" r="11"/>
    <circle cx="330" cy="532" r="9"/>
    <circle cx="410" cy="532" r="10"/>
    <circle cx="220" cy="612" r="11"/>
    <circle cx="300" cy="612" r="10"/>
    <circle cx="390" cy="612" r="12"/>
    <circle cx="480" cy="612" r="10"/>
  </g>
  <!-- Hint of lemon fruit warmth -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="262" cy="460" r="2.2"/>
    <circle cx="252" cy="530" r="2"/>
    <circle cx="392" cy="610" r="2.4"/>
    <circle cx="201" cy="462" r="1.8"/>
  </g>

  <!-- HERO: hilltop villa silhouette inside safe zone, perched centre-right of near cliff -->
  <g>
    <!-- main villa block -->
    <rect x="690" y="330" width="220" height="130" fill="#1a0e0e"/>
    <!-- left wing, lower -->
    <rect x="620" y="370" width="80"  height="90"  fill="#1a0e0e"/>
    <!-- right tower, taller -->
    <rect x="900" y="290" width="70"  height="170" fill="#1a0e0e"/>
    <!-- tower cap -->
    <rect x="894" y="282" width="82"  height="12"  fill="#1a0e0e"/>
    <!-- low pitched roof on main block -->
    <polygon points="690,330 800,300 910,330" fill="#1a0e0e"/>
    <!-- arched loggia on terrace (cut into block) -->
    <path d="M 710 410 h 24 a 12 12 0 0 1 0 24 h -24 z" fill="url(#villaGlow)" opacity="0.9"/>
    <path d="M 754 410 h 24 a 12 12 0 0 1 0 24 h -24 z" fill="url(#villaGlow)" opacity="0.9"/>
    <path d="M 798 410 h 24 a 12 12 0 0 1 0 24 h -24 z" fill="url(#villaGlow)" opacity="0.9"/>
    <path d="M 842 410 h 24 a 12 12 0 0 1 0 24 h -24 z" fill="url(#villaGlow)" opacity="0.9"/>
    <!-- a lit tower window -->
    <rect x="922" y="360" width="26" height="34" fill="url(#villaGlow)" opacity="0.95"/>
    <!-- chimney accent on main block -->
    <rect x="760" y="270" width="14" height="34" fill="#1a0e0e"/>
    <!-- cypress beside villa (vertical accent) -->
    <ellipse cx="600" cy="380" rx="10" ry="40" fill="#1a0e0e"/>
    <ellipse cx="985" cy="370" rx="9"  ry="34" fill="#1a0e0e"/>
  </g>

  <!-- Soft haze over horizon to bind sun into scene -->
  <rect x="0" y="540" width="1600" height="40" fill="#d97706" opacity="0.18"/>
</svg>
