<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.7" stop-color="#d97706"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun / glow as luminous backdrop for the hero -->
  <circle cx="800" cy="470" r="320" fill="url(#sun)" opacity="0.9"/>

  <!-- distant peninsula ridge (decorative, edge-tolerant) -->
  <path d="M -20 600 L 180 560 L 360 580 L 520 540 L 640 560 L 760 545 L 900 560 L 1060 530 L 1240 555 L 1420 535 L 1620 560 L 1620 620 L -20 620 Z"
        fill="#9a3309" opacity="0.45"/>

  <!-- Vesuvius silhouette: twin-peak volcano, hero left of center -->
  <path d="M 480 640 L 620 470 L 680 510 L 740 430 L 820 500 L 900 460 L 980 520 L 1060 470 L 1180 640 Z"
        fill="url(#mtn)" opacity="0.92"/>

  <!-- bay water -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#bay)"/>

  <!-- water shimmer lines -->
  <path d="M 120 700 L 360 700 M 460 700 L 720 700 M 860 700 L 1140 700 M 1240 700 L 1480 700"
        stroke="#fbbf24" stroke-width="2" opacity="0.35"/>
  <path d="M 80 760 L 280 760 M 380 760 L 600 760 M 740 760 L 980 760 M 1080 760 L 1340 760 M 1420 760 L 1560 760"
        stroke="#fbbf24" stroke-width="2" opacity="0.28"/>
  <path d="M 200 820 L 420 820 M 540 820 L 800 820 M 920 820 L 1180 820 M 1300 820 L 1500 820"
        stroke="#fbbf24" stroke-width="2" opacity="0.22"/>

  <!-- conference network: orbit ring + nodes, framing Vesuvius as the hub -->
  <ellipse cx="800" cy="450" rx="430" ry="210" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.55"/>
  <ellipse cx="800" cy="450" rx="320" ry="155" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.45"/>

  <!-- node-and-edge graph on the orbit -->
  <g opacity="0.85">
    <line x1="370" y1="450" x2="560" y2="305" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
    <line x1="560" y1="305" x2="800" y2="240" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
    <line x1="800" y1="240" x2="1040" y2="305" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
    <line x1="1040" y1="305" x2="1230" y2="450" stroke="#9a3309" stroke-width="1.5" opacity="0.6"/>
    <line x1="560" y1="305" x2="800" y2="450" stroke="#c2410c" stroke-width="1" opacity="0.4"/>
    <line x1="1040" y1="305" x2="800" y2="450" stroke="#c2410c" stroke-width="1" opacity="0.4"/>

    <circle cx="370" cy="450" r="8" fill="#c2410c"/>
    <circle cx="560" cy="305" r="10" fill="#d97706"/>
    <circle cx="800" cy="240" r="12" fill="#fbbf24"/>
    <circle cx="1040" cy="305" r="10" fill="#d97706"/>
    <circle cx="1230" cy="450" r="8" fill="#c2410c"/>
  </g>

  <!-- crater ember at Vesuvius peak (small focal accent) -->
  <circle cx="740" cy="430" r="6" fill="#fbbf24" opacity="0.95"/>
  <circle cx="740" cy="430" r="14" fill="#fbbf24" opacity="0.25"/>
</svg>
