<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#3d1a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="node" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1: Radial glow centered on hero -->
  <ellipse cx="800" cy="450" rx="520" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: Concentric rings (decorative depth) -->
  <circle cx="800" cy="450" r="310" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.18"/>
  <circle cx="800" cy="450" r="220" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Layer 2: Edge lines from hub to satellite nodes -->
  <!-- Node positions at radius ~230, angles: 0, 60, 120, 180, 240, 300 degrees -->
  <!-- 0°  → (1030, 450)  -->
  <!-- 60° → (915, 649)   -->
  <!-- 120°→ (685, 649)   -->
  <!-- 180°→ (570, 450)   -->
  <!-- 240°→ (685, 251)   -->
  <!-- 300°→ (915, 251)   -->
  <line x1="800" y1="450" x2="1030" y2="450"  stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="800" y1="450" x2="915"  y2="649"  stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="800" y1="450" x2="685"  y2="649"  stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="800" y1="450" x2="570"  y2="450"  stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="800" y1="450" x2="685"  y2="251"  stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="800" y1="450" x2="915"  y2="251"  stroke="#c2410c" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Secondary cross-edges between satellites (community mesh) -->
  <line x1="1030" y1="450" x2="915" y2="251"  stroke="#d97706" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="1030" y1="450" x2="915" y2="649"  stroke="#d97706" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="570"  y1="450" x2="685" y2="251"  stroke="#d97706" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="570"  y1="450" x2="685" y2="649"  stroke="#d97706" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Layer 2: Satellite nodes -->
  <circle cx="1030" cy="450" r="28" fill="url(#node)" opacity="0.88"/>
  <circle cx="915"  cy="649" r="28" fill="url(#node)" opacity="0.88"/>
  <circle cx="685"  cy="649" r="28" fill="url(#node)" opacity="0.88"/>
  <circle cx="570"  cy="450" r="28" fill="url(#node)" opacity="0.88"/>
  <circle cx="685"  cy="251" r="28" fill="url(#node)" opacity="0.88"/>
  <circle cx="915"  cy="251" r="28" fill="url(#node)" opacity="0.88"/>

  <!-- Satellite node inner accent dots -->
  <circle cx="1030" cy="450" r="10" fill="#fbbf24" opacity="0.75"/>
  <circle cx="915"  cy="649" r="10" fill="#fbbf24" opacity="0.75"/>
  <circle cx="685"  cy="649" r="10" fill="#fbbf24" opacity="0.75"/>
  <circle cx="570"  cy="450" r="10" fill="#fbbf24" opacity="0.75"/>
  <circle cx="685"  cy="251" r="10" fill="#fbbf24" opacity="0.75"/>
  <circle cx="915"  cy="251" r="10" fill="#fbbf24" opacity="0.75"/>

  <!-- Layer 2: Central hub (hero anchor) -->
  <circle cx="800" cy="450" r="72" fill="#78350f" opacity="0.95"/>
  <circle cx="800" cy="450" r="60" fill="url(#hub)" opacity="0.95"/>
  <circle cx="800" cy="450" r="28" fill="#fbbf24" opacity="0.85"/>

  <!-- Layer 3: Corner decorations (outside safe zone, purely atmospheric) -->
  <circle cx="0"    cy="0"   r="180" fill="none" stroke="#9a3309" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="1600" cy="900" r="180" fill="none" stroke="#9a3309" stroke-width="2" stroke-opacity="0.2"/>
</svg>
