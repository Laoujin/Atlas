<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep evening background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Warm central glow -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Plate fill gradient -->
    <radialGradient id="plate1fill" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#e8d8c8" stop-opacity="0.88"/>
    </radialGradient>
    <radialGradient id="plate2fill" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#faf8f2" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#e0cfc0" stop-opacity="0.70"/>
    </radialGradient>
    <!-- Rim sheen -->
    <radialGradient id="rim1" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="95%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.90"/>
    </radialGradient>
    <radialGradient id="rim2" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="transparent"/>
      <stop offset="88%" stop-color="#be185d" stop-opacity="0.40"/>
      <stop offset="95%" stop-color="#9a1045" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#6e0f32" stop-opacity="0.75"/>
    </radialGradient>
    <!-- Mountain silhouette gradient -->
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1a0a" stop-opacity="0.80"/>
    </linearGradient>
    <!-- Wine glass gradient -->
    <linearGradient id="glassfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.72"/>
      <stop offset="60%" stop-color="#9a1045" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6e0f32" stop-opacity="0.40"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle mountain silhouette at horizon — decorative, can be cropped -->
  <polygon points="0,600 180,390 340,470 520,320 700,430 800,360 900,410 1060,300 1240,400 1400,350 1600,430 1600,700 0,700" fill="url(#mtn)"/>

  <!-- Central warm glow -->
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — two plates + wine glass, centered in safe zone -->

  <!-- Back plate (secondary, rose-rimmed, slightly offset left) -->
  <ellipse cx="730" cy="455" rx="210" ry="210" fill="url(#plate2fill)"/>
  <ellipse cx="730" cy="455" rx="210" ry="210" fill="url(#rim2)"/>
  <!-- Inner well of back plate -->
  <ellipse cx="730" cy="455" rx="158" ry="158" fill="#faf8f2" fill-opacity="0.60"/>

  <!-- Front plate (primary, rust-rimmed, hero) -->
  <ellipse cx="870" cy="455" rx="230" ry="230" fill="url(#plate1fill)"/>
  <ellipse cx="870" cy="455" rx="230" ry="230" fill="url(#rim1)"/>
  <!-- Inner well of front plate -->
  <ellipse cx="870" cy="455" rx="172" ry="172" fill="#faf8f2" fill-opacity="0.78"/>

  <!-- Wine glass silhouette (right of plates) -->
  <!-- Bowl -->
  <path d="M1120,270 Q1160,360 1152,420 Q1148,450 1136,462 L1106,462 Q1094,450 1090,420 Q1082,360 1122,270 Z" fill="url(#glassfill)"/>
  <!-- Stem -->
  <rect x="1117" y="462" width="8" height="110" fill="#be185d" fill-opacity="0.55" rx="3"/>
  <!-- Base -->
  <ellipse cx="1121" cy="575" rx="34" ry="8" fill="#be185d" fill-opacity="0.50"/>
  <!-- Wine level line (decorative interior) -->
  <path d="M1093,415 Q1121,425 1149,415" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-opacity="0.50"/>

  <!-- Ambient cloche highlight on front plate (subtle arc) -->
  <path d="M740,335 Q870,295 1000,335" stroke="#fbbf24" stroke-width="2" fill="none" stroke-opacity="0.35"/>

  <!-- Layer 3: Edge decoration — faint rust arcs in corners, will be cropped variably -->
  <circle cx="0" cy="0" r="260" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.18"/>
  <circle cx="1600" cy="900" r="300" fill="none" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>
