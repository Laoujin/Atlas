<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2d1010"/>
      <stop offset="60%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#0d0808"/>
    </radialGradient>

    <!-- Hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Hub fill -->
    <radialGradient id="hubFill" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Orbit node fill -->
    <radialGradient id="nodeA" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>

    <!-- Secondary node fill -->
    <radialGradient id="nodeB" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle edge vignette -->
  <rect width="1600" height="900" fill="url(#hubGlow)" opacity="0.5"/>

  <!-- Layer 2: Hero — orbit system centered at (800, 450) -->

  <!-- Outer orbit ring -->
  <circle cx="800" cy="450" r="310" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Inner orbit ring -->
  <circle cx="800" cy="450" r="185" fill="none" stroke="#6d28d9" stroke-width="1" stroke-dasharray="8 14" opacity="0.45"/>

  <!-- Spoke lines from hub to orbit nodes -->
  <!-- Node at top (800, 140) -->
  <line x1="800" y1="420" x2="800" y2="165" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
  <!-- Node at upper-right (1075, 270) -->
  <line x1="820" y1="430" x2="1052" y2="288" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
  <!-- Node at lower-right (1075, 630) -->
  <line x1="820" y1="470" x2="1052" y2="612" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
  <!-- Node at bottom (800, 760) -->
  <line x1="800" y1="480" x2="800" y2="735" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>
  <!-- Node at lower-left (525, 630) -->
  <line x1="780" y1="470" x2="548" y2="612" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>
  <!-- Node at upper-left (525, 270) -->
  <line x1="780" y1="430" x2="548" y2="288" stroke="#c2410c" stroke-width="1.5" opacity="0.45"/>

  <!-- Orbit nodes — 6 outer nodes on 310px orbit -->
  <!-- Top node -->
  <circle cx="800" cy="140" r="32" fill="url(#nodeA)" opacity="0.88"/>
  <circle cx="800" cy="140" r="32" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>

  <!-- Upper-right node -->
  <circle cx="1068" cy="285" r="28" fill="url(#nodeB)" opacity="0.88"/>
  <circle cx="1068" cy="285" r="28" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>

  <!-- Lower-right node -->
  <circle cx="1068" cy="615" r="32" fill="url(#nodeA)" opacity="0.85"/>
  <circle cx="1068" cy="615" r="32" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>

  <!-- Bottom node -->
  <circle cx="800" cy="760" r="28" fill="url(#nodeB)" opacity="0.88"/>
  <circle cx="800" cy="760" r="28" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>

  <!-- Lower-left node -->
  <circle cx="532" cy="615" r="32" fill="url(#nodeA)" opacity="0.85"/>
  <circle cx="532" cy="615" r="32" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>

  <!-- Upper-left node -->
  <circle cx="532" cy="285" r="28" fill="url(#nodeB)" opacity="0.88"/>
  <circle cx="532" cy="285" r="28" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>

  <!-- Inner nodes on 185px orbit — 3 mid-tier -->
  <line x1="800" y1="430" x2="800" y2="278" stroke="#78350f" stroke-width="1" opacity="0.5"/>
  <circle cx="800" cy="265" r="20" fill="#9a3309" opacity="0.75"/>

  <line x1="810" y1="455" x2="960" y2="548" stroke="#78350f" stroke-width="1" opacity="0.5"/>
  <circle cx="970" cy="555" r="20" fill="#6d28d9" opacity="0.6"/>

  <line x1="790" y1="455" x2="640" y2="548" stroke="#78350f" stroke-width="1" opacity="0.5"/>
  <circle cx="630" cy="555" r="20" fill="#9a3309" opacity="0.75"/>

  <!-- Hub glow halo -->
  <circle cx="800" cy="450" r="120" fill="url(#hubGlow)" opacity="0.8"/>

  <!-- Central hub -->
  <circle cx="800" cy="450" r="72" fill="url(#hubFill)" opacity="0.95"/>
  <circle cx="800" cy="450" r="72" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
  <!-- Inner hub ring accent -->
  <circle cx="800" cy="450" r="52" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>

  <!-- Layer 3: Corner decorations (may be cropped — carry no meaning) -->
  <!-- Top-left arc accent -->
  <path d="M 0 0 Q 180 0 180 180" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.2"/>
  <!-- Bottom-right arc accent -->
  <path d="M 1600 900 Q 1420 900 1420 720" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.2"/>
  <!-- Bottom-left faint dot -->
  <circle cx="80" cy="820" r="18" fill="#6d28d9" opacity="0.15"/>
  <!-- Top-right faint dot -->
  <circle cx="1520" cy="80" r="18" fill="#c2410c" opacity="0.15"/>
</svg>
