<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1010"/>
      <stop offset="60%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#0e0808"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle violet corner accents — decorative, outside hero safe zone -->
  <circle cx="0" cy="0" r="280" fill="#6d28d9" fill-opacity="0.06"/>
  <circle cx="1600" cy="900" r="280" fill="#6d28d9" fill-opacity="0.06"/>

  <!-- Layer 2: Hero — orbit system centered at (800, 450) -->

  <!-- Hub glow -->
  <circle cx="800" cy="450" r="180" fill="url(#hubGlow)"/>

  <!-- Orbit ring 1 (innermost) -->
  <ellipse cx="800" cy="450" rx="200" ry="130"
    fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Orbit ring 2 (middle) -->
  <ellipse cx="800" cy="450" rx="320" ry="210"
    fill="none" stroke="#9a3309" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Orbit ring 3 (outer) -->
  <ellipse cx="800" cy="450" rx="440" ry="290"
    fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Edge lines from nodes to hub — drawn before nodes so hub sits on top -->
  <line x1="800" y1="320" x2="800" y2="450" stroke="url(#edgeGrad)" stroke-width="1.2"/>
  <line x1="618" y1="410" x2="800" y2="450" stroke="url(#edgeGrad)" stroke-width="1.2"/>
  <line x1="982" y1="410" x2="800" y2="450" stroke="url(#edgeGrad)" stroke-width="1.2"/>
  <line x1="510" y1="310" x2="800" y2="450" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="1090" y1="590" x2="800" y2="450" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="630" y1="680" x2="800" y2="450" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="970" y1="200" x2="800" y2="450" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Orbit ring 1 nodes -->
  <circle cx="800" cy="320" r="14" fill="url(#nodeGrad)" opacity="0.9"/>
  <circle cx="618" cy="410" r="14" fill="url(#nodeGrad)" opacity="0.9"/>
  <circle cx="982" cy="410" r="14" fill="url(#nodeGrad)" opacity="0.85"/>

  <!-- Orbit ring 2 nodes -->
  <circle cx="510" cy="310" r="11" fill="#6d28d9" opacity="0.75"/>
  <circle cx="1090" cy="590" r="11" fill="#6d28d9" opacity="0.75"/>

  <!-- Orbit ring 3 nodes -->
  <circle cx="630" cy="680" r="9" fill="#9a3309" opacity="0.7"/>
  <circle cx="970" cy="200" r="9" fill="#9a3309" opacity="0.7"/>
  <circle cx="1180" cy="390" r="9" fill="#6d28d9" opacity="0.6"/>
  <circle cx="420" cy="520" r="9" fill="#6d28d9" opacity="0.6"/>

  <!-- Hub core -->
  <circle cx="800" cy="450" r="52" fill="url(#hubCore)" opacity="0.95"/>
  <circle cx="800" cy="450" r="36" fill="#fbbf24" opacity="0.25"/>

</svg>
