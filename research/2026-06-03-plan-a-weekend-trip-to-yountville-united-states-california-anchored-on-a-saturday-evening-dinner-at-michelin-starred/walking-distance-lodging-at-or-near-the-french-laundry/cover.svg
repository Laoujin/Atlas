<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night-sky background gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <!-- Warm lantern glow behind building -->
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#c2410c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Window warm light -->
    <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.3"/>
    </radialGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3ec" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Subtle ground plane -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#ground)" opacity="0.85"/>

  <!-- Moon (top-right, decorative, will be partially cropped on card — intentional) -->
  <circle cx="1420" cy="140" r="90" fill="url(#moonGlow)" opacity="0.7"/>
  <circle cx="1420" cy="140" r="48" fill="#fef3ec" opacity="0.55"/>

  <!-- Warm glow emanating from the building area -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- Layer 2: Hero — inn/lodging building silhouette, centered ~800,450 -->

  <!-- Main building body -->
  <rect x="480" y="410" width="640" height="290" rx="6" fill="#9a3309" opacity="0.92"/>

  <!-- Roof (pitched gable) -->
  <polygon points="455,415 800,230 1145,415" fill="#78350f" opacity="0.97"/>

  <!-- Chimney left -->
  <rect x="570" y="240" width="48" height="110" rx="4" fill="#5c2a1a" opacity="0.95"/>
  <rect x="562" y="232" width="64" height="18" rx="3" fill="#3a1a0a" opacity="0.9"/>

  <!-- Chimney right -->
  <rect x="950" y="255" width="44" height="95" rx="4" fill="#5c2a1a" opacity="0.95"/>
  <rect x="943" y="247" width="58" height="16" rx="3" fill="#3a1a0a" opacity="0.9"/>

  <!-- Ground floor: central doorway -->
  <rect x="760" y="560" width="82" height="140" rx="5" fill="#3a1a0a" opacity="0.95"/>
  <!-- Door arch -->
  <ellipse cx="801" cy="562" rx="41" ry="22" fill="#3a1a0a" opacity="0.95"/>
  <!-- Door warm interior glow -->
  <rect x="764" y="564" width="74" height="134" rx="4" fill="url(#winGlow)" opacity="0.35"/>

  <!-- Windows ground floor left -->
  <rect x="528" y="530" width="88" height="72" rx="4" fill="#3a1a0a" opacity="0.9"/>
  <rect x="532" y="534" width="80" height="64" rx="3" fill="url(#winGlow)" opacity="0.72"/>

  <!-- Windows ground floor right -->
  <rect x="984" y="530" width="88" height="72" rx="4" fill="#3a1a0a" opacity="0.9"/>
  <rect x="988" y="534" width="80" height="64" rx="3" fill="url(#winGlow)" opacity="0.72"/>

  <!-- Windows upper floor left -->
  <rect x="562" y="440" width="72" height="58" rx="4" fill="#3a1a0a" opacity="0.88"/>
  <rect x="566" y="444" width="64" height="50" rx="3" fill="url(#winGlow)" opacity="0.65"/>

  <!-- Windows upper floor right -->
  <rect x="966" y="440" width="72" height="58" rx="4" fill="#3a1a0a" opacity="0.88"/>
  <rect x="970" y="444" width="64" height="50" rx="3" fill="url(#winGlow)" opacity="0.65"/>

  <!-- Dormer window in roof -->
  <polygon points="762,310 800,270 838,310" fill="#5c2a1a" opacity="0.9"/>
  <rect x="772" y="310" width="56" height="48" rx="3" fill="#3a1a0a" opacity="0.88"/>
  <rect x="776" y="314" width="48" height="40" rx="2" fill="url(#winGlow)" opacity="0.6"/>

  <!-- Front steps -->
  <rect x="730" y="695" width="142" height="14" rx="3" fill="#9a3309" opacity="0.7"/>
  <rect x="744" y="706" width="114" height="10" rx="2" fill="#78350f" opacity="0.6"/>

  <!-- Layer 3: Decorative — vine/landscape strip along the base (full-bleed, low opacity) -->
  <!-- Rolling vineyard hill left -->
  <ellipse cx="220" cy="700" rx="280" ry="80" fill="#78350f" opacity="0.28"/>
  <!-- Rolling vineyard hill right -->
  <ellipse cx="1380" cy="710" rx="260" ry="72" fill="#78350f" opacity="0.28"/>

  <!-- Pathway leading to door (perspective lines) -->
  <polygon points="756,900 844,900 821,700 779,700" fill="#c2410c" opacity="0.12"/>

</svg>
