<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="100%" stop-color="#f0eadb"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- topographic contour lines (organic, plateau-like) -->
  <g fill="none" stroke="#9a3309" stroke-opacity="0.18" stroke-width="1.5">
    <path d="M 200 480 Q 500 380 800 420 T 1400 460 Q 1500 500 1480 560"/>
    <path d="M 180 540 Q 480 440 800 470 T 1420 500 Q 1520 540 1500 600"/>
    <path d="M 220 420 Q 520 340 800 370 T 1380 410 Q 1480 450 1460 510"/>
    <path d="M 260 360 Q 560 300 800 320 T 1340 360"/>
    <path d="M 300 300 Q 600 260 800 270 T 1300 310"/>
    <path d="M 240 600 Q 540 520 800 540 T 1380 580"/>
    <path d="M 280 660 Q 580 580 800 600 T 1340 640"/>
    <path d="M 320 720 Q 620 660 800 670 T 1300 700"/>
  </g>

  <!-- faint fir-tree silhouettes scattered (rural plateau hint) -->
  <g fill="#78350f" fill-opacity="0.22">
    <polygon points="320,640 308,665 332,665"/>
    <polygon points="320,628 310,648 330,648"/>
    <polygon points="1280,300 1268,325 1292,325"/>
    <polygon points="1280,288 1270,308 1290,308"/>
    <polygon points="450,720 438,745 462,745"/>
    <polygon points="1150,680 1138,705 1162,705"/>
    <polygon points="1380,520 1368,545 1392,545"/>
  </g>

  <!-- soft radial glow under hub -->
  <circle cx="800" cy="450" r="360" fill="url(#glow)"/>

  <!-- 30km radius ring (the hero structure) -->
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="800" cy="450" r="320" fill="none" stroke="#c2410c" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 10"/>

  <!-- inner reference rings -->
  <circle cx="800" cy="450" r="220" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="800" cy="450" r="120" fill="none" stroke="#9a3309" stroke-width="1" stroke-opacity="0.45"/>

  <!-- crosshair tick marks at cardinal points of 30km ring -->
  <g stroke="#78350f" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="800" y1="120" x2="800" y2="140"/>
    <line x1="800" y1="760" x2="800" y2="780"/>
    <line x1="470" y1="450" x2="490" y2="450"/>
    <line x1="1110" y1="450" x2="1130" y2="450"/>
  </g>

  <!-- single faint distant signal dot (the rare/lone tech event hint) -->
  <circle cx="980" cy="270" r="5" fill="#d97706" fill-opacity="0.55"/>
  <circle cx="980" cy="270" r="14" fill="none" stroke="#d97706" stroke-width="1" stroke-opacity="0.35"/>

  <!-- central hub: Marcon location -->
  <circle cx="800" cy="450" r="22" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="9" fill="#fef3ec" fill-opacity="0.95"/>
  <circle cx="800" cy="450" r="4" fill="#c2410c"/>
</svg>
