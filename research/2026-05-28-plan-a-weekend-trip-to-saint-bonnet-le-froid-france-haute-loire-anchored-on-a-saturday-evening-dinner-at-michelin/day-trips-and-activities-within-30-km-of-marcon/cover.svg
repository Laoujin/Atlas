<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3ec"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun / source-of-the-Loire glow, sits behind the hero peak -->
  <circle cx="980" cy="430" r="180" fill="url(#sun)"/>

  <!-- distant ridges (Vivarais skyline) -->
  <path d="M 0 560 L 180 470 L 320 510 L 480 430 L 660 490 L 820 410 L 980 470 L 1160 420 L 1320 480 L 1480 440 L 1600 470 L 1600 900 L 0 900 Z"
        fill="url(#far)" opacity="0.75"/>

  <!-- mid ridge with the hero summit (Mont Mezenc) centered near 800,450 -->
  <path d="M 0 700 L 140 640 L 280 670 L 440 590 L 600 620 L 720 540 L 800 380 L 880 540 L 1020 600 L 1180 560 L 1340 620 L 1480 580 L 1600 610 L 1600 900 L 0 900 Z"
        fill="url(#mid)" opacity="0.92"/>

  <!-- snow / volcanic cap accent on hero -->
  <path d="M 760 470 L 800 380 L 840 470 L 820 460 L 800 450 L 780 460 Z"
        fill="#faf8f2" opacity="0.78"/>

  <!-- foreground ridge with conical Gerbier-de-Jonc shape right of center -->
  <path d="M 0 820 L 200 760 L 380 790 L 560 740 L 720 770 L 900 730 L 1020 640 L 1140 730 L 1300 700 L 1460 750 L 1600 720 L 1600 900 L 0 900 Z"
        fill="url(#near)"/>

  <!-- thin pine silhouettes (forested Lignon gorges) - decoration, low and outside hero focus -->
  <g fill="#1a0e0e" opacity="0.55">
    <path d="M 120 820 L 130 780 L 140 820 Z"/>
    <path d="M 160 825 L 172 775 L 184 825 Z"/>
    <path d="M 240 830 L 252 785 L 264 830 Z"/>
    <path d="M 1340 815 L 1352 770 L 1364 815 Z"/>
    <path d="M 1390 820 L 1402 778 L 1414 820 Z"/>
    <path d="M 1450 825 L 1462 782 L 1474 825 Z"/>
  </g>
</svg>
