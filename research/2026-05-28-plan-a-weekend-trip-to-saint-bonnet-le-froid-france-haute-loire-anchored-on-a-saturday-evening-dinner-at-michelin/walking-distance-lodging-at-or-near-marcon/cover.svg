<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2a1a"/>
      <stop offset="0.55" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#d97706" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a3309"/>
      <stop offset="1" stop-color="#3a1a0a"/>
    </linearGradient>
  </defs>

  <!-- full-bleed evening sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- low sun glow behind hamlet -->
  <circle cx="800" cy="600" r="520" fill="url(#sun)"/>

  <!-- far ridge -->
  <path d="M0,640 L180,580 L340,610 L520,560 L720,590 L900,550 L1100,585 L1300,555 L1600,600 L1600,900 L0,900 Z"
        fill="#5c2a1a" opacity="0.7"/>

  <!-- mid ridge -->
  <path d="M0,720 L160,680 L320,705 L480,665 L660,695 L820,660 L1000,690 L1180,665 L1360,695 L1600,675 L1600,900 L0,900 Z"
        fill="url(#ridge)" opacity="0.85"/>

  <!-- pine trees left cluster -->
  <g fill="#1a0e0e" opacity="0.92">
    <path d="M380,690 L360,740 L400,740 Z M380,710 L355,760 L405,760 Z M380,735 L350,785 L410,785 Z"/>
    <rect x="377" y="780" width="6" height="14"/>
    <path d="M440,700 L424,742 L456,742 Z M440,720 L420,762 L460,762 Z M440,740 L416,785 L464,785 Z"/>
    <rect x="437" y="780" width="6" height="14"/>
  </g>

  <!-- hero hamlet: cluster of stone houses centered ~(800,560) -->
  <g>
    <!-- back houses -->
    <rect x="660" y="600" width="120" height="130" fill="#3a1a0a"/>
    <polygon points="660,600 720,545 780,600" fill="#78350f"/>

    <rect x="900" y="595" width="130" height="135" fill="#3a1a0a"/>
    <polygon points="900,595 965,535 1030,595" fill="#78350f"/>

    <!-- main hero house, center -->
    <rect x="750" y="565" width="180" height="190" fill="url(#house)"/>
    <polygon points="750,565 840,485 930,565" fill="#c2410c"/>
    <!-- chimney -->
    <rect x="880" y="500" width="22" height="50" fill="#5c2a1a"/>
    <!-- warm window -->
    <rect x="800" y="640" width="32" height="44" fill="#fbbf24" opacity="0.9"/>
    <rect x="855" y="640" width="32" height="44" fill="#fbbf24" opacity="0.75"/>

    <!-- small annex front-left -->
    <rect x="600" y="660" width="90" height="80" fill="#3a1a0a"/>
    <polygon points="600,660 645,620 690,660" fill="#9a3309"/>
    <rect x="625" y="690" width="20" height="28" fill="#fbbf24" opacity="0.85"/>

    <!-- small annex front-right -->
    <rect x="1000" y="650" width="100" height="90" fill="#3a1a0a"/>
    <polygon points="1000,650 1050,605 1100,650" fill="#9a3309"/>
    <rect x="1030" y="685" width="22" height="30" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- pine trees right cluster -->
  <g fill="#1a0e0e" opacity="0.92">
    <path d="M1180,680 L1158,730 L1202,730 Z M1180,700 L1153,752 L1207,752 Z M1180,725 L1148,778 L1212,778 Z"/>
    <rect x="1177" y="773" width="6" height="16"/>
    <path d="M1240,695 L1222,738 L1258,738 Z M1240,715 L1218,760 L1262,760 Z M1240,738 L1214,785 L1266,785 Z"/>
    <rect x="1237" y="780" width="6" height="14"/>
  </g>

  <!-- foreground snow/path slope -->
  <path d="M0,820 L400,790 L820,810 L1200,785 L1600,810 L1600,900 L0,900 Z"
        fill="#1a0e0e" opacity="0.85"/>
</svg>
