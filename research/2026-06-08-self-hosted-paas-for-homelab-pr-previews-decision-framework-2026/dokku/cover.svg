<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: deep nocturnal rust -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Container block face gradient -->
    <linearGradient id="blockFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Container block top face gradient -->
    <linearGradient id="blockTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.75"/>
    </linearGradient>
    <!-- Container block side gradient -->
    <linearGradient id="blockSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Node radial glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Spark trail gradient -->
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0505" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Edge vignette overlay -->
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- Layer 3: Subtle corner decoration (outside safe zone, no meaning) -->
  <circle cx="0" cy="0" r="320" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.08"/>
  <circle cx="1600" cy="900" r="320" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- ===== Layer 2: HERO ELEMENT (safe zone x:125-1475, y:90-810) ===== -->
  <!-- Hero spans roughly x:200-1400, y:200-700 — well inside safe zone -->

  <!-- GIT SIDE: branch fork on left -->
  <!-- Main branch trunk line: bottom node up to fork point -->
  <line x1="330" y1="620" x2="330" y2="380" stroke="#c2410c" stroke-width="6" stroke-opacity="0.85" stroke-linecap="round"/>
  <!-- Upper branch (straight up) -->
  <line x1="330" y1="380" x2="330" y2="260" stroke="#d97706" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>
  <!-- Feature branch (diagonal) -->
  <line x1="330" y1="380" x2="480" y2="260" stroke="#d97706" stroke-width="6" stroke-opacity="0.8" stroke-linecap="round"/>

  <!-- Commit nodes on trunk -->
  <circle cx="330" cy="620" r="18" fill="#78350f" stroke="#c2410c" stroke-width="3" stroke-opacity="0.9"/>
  <circle cx="330" cy="500" r="14" fill="#9a3309" stroke="#d97706" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- Fork point node — glowing -->
  <circle cx="330" cy="380" r="22" fill="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="330" cy="380" r="10" fill="#fbbf24" opacity="0.95"/>

  <!-- Branch tip nodes -->
  <circle cx="330" cy="260" r="14" fill="#78350f" stroke="#d97706" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="480" cy="260" r="16" fill="#9a3309" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Merge node: feature branch meets main at center -->
  <line x1="480" y1="260" x2="570" y2="450" stroke="#d97706" stroke-width="5" stroke-opacity="0.7" stroke-linecap="round"/>
  <line x1="330" y1="260" x2="570" y2="450" stroke="#c2410c" stroke-width="5" stroke-opacity="0.7" stroke-linecap="round"/>
  <circle cx="570" cy="450" r="26" fill="url(#nodeGlow)" opacity="0.85"/>
  <circle cx="570" cy="450" r="12" fill="#fbbf24" opacity="0.95"/>

  <!-- SPARK TRAIL: merge node → container stack -->
  <path d="M 596 450 Q 700 430 760 450 Q 820 470 880 450" fill="none" stroke="url(#trail)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Spark dots along trail -->
  <circle cx="650" cy="438" r="5" fill="#fbbf24" opacity="0.75"/>
  <circle cx="720" cy="452" r="4" fill="#d97706" opacity="0.7"/>
  <circle cx="800" cy="447" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="855" cy="451" r="4" fill="#d97706" opacity="0.65"/>

  <!-- CONTAINER STACK: isometric container blocks on the right -->
  <!-- Block 2 (back/top) — slightly offset up-right -->
  <!-- Face -->
  <polygon points="980,220 1280,220 1280,420 980,420" fill="url(#blockFace)" opacity="0.6"/>
  <!-- Top face (isometric) -->
  <polygon points="980,220 1060,170 1360,170 1280,220" fill="url(#blockTop)" opacity="0.55"/>
  <!-- Right side face -->
  <polygon points="1280,220 1360,170 1360,370 1280,420" fill="url(#blockSide)" opacity="0.5"/>
  <!-- LED accent on back block -->
  <circle cx="1020" cy="260" r="7" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1040" cy="260" r="5" fill="#d97706" opacity="0.4"/>

  <!-- Block 1 (front/hero) — main container -->
  <!-- Face -->
  <polygon points="920,310 1220,310 1220,560 920,560" fill="url(#blockFace)" opacity="0.92"/>
  <!-- Top face (isometric) -->
  <polygon points="920,310 1000,255 1300,255 1220,310" fill="url(#blockTop)" opacity="0.88"/>
  <!-- Right side face -->
  <polygon points="1220,310 1300,255 1300,505 1220,560" fill="url(#blockSide)" opacity="0.85"/>

  <!-- Container face detail: port/stripe lines suggesting app slots -->
  <line x1="945" y1="355" x2="1195" y2="355" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.25"/>
  <line x1="945" y1="390" x2="1195" y2="390" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.18"/>
  <line x1="945" y1="425" x2="1195" y2="425" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.18"/>
  <line x1="945" y1="460" x2="1195" y2="460" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.15"/>
  <line x1="945" y1="495" x2="1195" y2="495" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.12"/>

  <!-- LED accent dots on front block face (status lights) -->
  <circle cx="958" cy="332" r="8" fill="#fbbf24" opacity="0.85"/>
  <circle cx="980" cy="332" r="7" fill="#d97706" opacity="0.7"/>
  <circle cx="1000" cy="332" r="6" fill="#c2410c" opacity="0.6"/>

  <!-- Block 3 (bottom accent block, partial) -->
  <polygon points="960,500 1180,500 1180,640 960,640" fill="url(#blockFace)" opacity="0.45"/>
  <polygon points="960,500 1020,460 1240,460 1180,500" fill="url(#blockTop)" opacity="0.4"/>
  <polygon points="1180,500 1240,460 1240,600 1180,640" fill="url(#blockSide)" opacity="0.38"/>

  <!-- Arrow head at trail terminus pointing into container -->
  <polygon points="880,435 910,450 880,465" fill="#fbbf24" opacity="0.85"/>

</svg>
