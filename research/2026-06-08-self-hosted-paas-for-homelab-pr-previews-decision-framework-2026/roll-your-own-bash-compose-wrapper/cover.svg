<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark nocturnal for homelab/infra -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#0f1a22"/>
    </linearGradient>
    <!-- Left block gradient (rust) -->
    <linearGradient id="blockL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Right block gradient (slate) -->
    <linearGradient id="blockR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <!-- Connection line glow -->
    <linearGradient id="connGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Ambient glow behind hero -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow centered on hero -->
  <ellipse cx="800" cy="450" rx="620" ry="340" fill="url(#ambientGlow)"/>

  <!-- Layer 2: Hero element — two interlocking container blocks connected by a circuit path -->

  <!-- LEFT BLOCK: rust-colored "compose stack" / container group -->
  <!-- Main body -->
  <rect x="230" y="310" width="370" height="240" rx="10" fill="url(#blockL)" opacity="0.92"/>
  <!-- Top cap (lid detail) -->
  <rect x="230" y="298" width="370" height="20" rx="6" fill="#c2410c" opacity="0.85"/>
  <!-- Inner stripe lines (representing compose layers / services) -->
  <rect x="258" y="348" width="314" height="10" rx="3" fill="#d97706" opacity="0.35"/>
  <rect x="258" y="376" width="255" height="10" rx="3" fill="#d97706" opacity="0.28"/>
  <rect x="258" y="404" width="290" height="10" rx="3" fill="#d97706" opacity="0.22"/>
  <!-- LED accent dot -->
  <circle cx="565" cy="310" r="7" fill="#fbbf24" opacity="0.95"/>
  <!-- Port nub right side -->
  <rect x="598" y="424" width="32" height="52" rx="5" fill="#c2410c" opacity="0.88"/>

  <!-- RIGHT BLOCK: slate-colored "webhook / nginx / traefik" receiver -->
  <!-- Main body -->
  <rect x="1000" y="310" width="370" height="240" rx="10" fill="url(#blockR)" opacity="0.92"/>
  <!-- Top cap -->
  <rect x="1000" y="298" width="370" height="20" rx="6" fill="#475569" opacity="0.85"/>
  <!-- Inner stripe lines -->
  <rect x="1028" y="348" width="314" height="10" rx="3" fill="#334155" opacity="0.55"/>
  <rect x="1028" y="376" width="240" height="10" rx="3" fill="#64748b" opacity="0.4"/>
  <rect x="1028" y="404" width="275" height="10" rx="3" fill="#334155" opacity="0.35"/>
  <!-- LED accent dot (slate-teal) -->
  <circle cx="1035" cy="310" r="7" fill="#7dd3fc" opacity="0.8"/>
  <!-- Port nub left side -->
  <rect x="970" y="424" width="32" height="52" rx="5" fill="#475569" opacity="0.88"/>

  <!-- CONNECTION PATH between the two port nubs -->
  <!-- Horizontal connection bar -->
  <rect x="630" y="438" width="340" height="24" rx="6" fill="url(#connGrad)" opacity="0.85"/>

  <!-- HUB node at center of connection -->
  <!-- Glow halo -->
  <circle cx="800" cy="450" r="60" fill="url(#hubGlow)" opacity="0.8"/>
  <!-- Outer ring -->
  <circle cx="800" cy="450" r="28" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.7"/>
  <!-- Hub core -->
  <circle cx="800" cy="450" r="18" fill="#c2410c" opacity="0.95"/>
  <!-- Hub inner highlight -->
  <circle cx="800" cy="450" r="8" fill="#fbbf24" opacity="0.9"/>

  <!-- Layer 3: Edge decorations (outside safe zone or at corners) -->
  <!-- Top-left corner accent bar -->
  <rect x="0" y="0" width="120" height="6" fill="#c2410c" opacity="0.4"/>
  <rect x="0" y="0" width="6" height="120" fill="#c2410c" opacity="0.4"/>
  <!-- Bottom-right corner accent bar -->
  <rect x="1480" y="894" width="120" height="6" fill="#334155" opacity="0.4"/>
  <rect x="1594" y="780" width="6" height="120" fill="#334155" opacity="0.4"/>
  <!-- Subtle full-bleed bottom gradient strip for depth -->
  <rect x="0" y="820" width="1600" height="80" fill="#0f1a22" opacity="0.5"/>
</svg>
