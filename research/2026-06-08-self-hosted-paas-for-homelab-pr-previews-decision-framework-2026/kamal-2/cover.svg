<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3ec" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef3ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="380" y="120" width="840" height="660" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="800" cy="765" rx="220" ry="48" fill="#78350f" opacity="0.18"/>

  <!-- bottom container -->
  <polygon points="800,480 950,555 800,630 650,555" fill="#9a3309" opacity="0.92"/>
  <polygon points="650,555 800,630 800,760 650,685" fill="#78350f" opacity="0.9"/>
  <polygon points="800,630 950,555 950,685 800,760" fill="#5c2a1a" opacity="0.9"/>

  <!-- middle container -->
  <polygon points="800,350 950,425 800,500 650,425" fill="#c2410c" opacity="0.93"/>
  <polygon points="650,425 800,500 800,630 650,555" fill="#9a3309" opacity="0.92"/>
  <polygon points="800,500 950,425 950,555 800,630" fill="#78350f" opacity="0.92"/>

  <!-- hero container (top) -->
  <polygon points="800,220 950,295 800,370 650,295" fill="#d97706" opacity="0.97"/>
  <polygon points="650,295 800,370 800,500 650,425" fill="#c2410c" opacity="0.96"/>
  <polygon points="800,370 950,295 950,425 800,500" fill="#9a3309" opacity="0.95"/>

  <!-- running indicator on hero -->
  <circle cx="800" cy="295" r="15" fill="#fbbf24" opacity="0.95"/>
</svg>
