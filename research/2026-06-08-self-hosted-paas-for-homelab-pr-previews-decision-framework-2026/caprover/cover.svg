<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1206"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Radial glow behind wheel -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Wheel rim gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <!-- Container face gradient -->
    <linearGradient id="boxFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b1206" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Container top gradient -->
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Container side gradient -->
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c2a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b1206" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Edge vignette strips for depth -->
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.7" transform="translate(800,450) scale(1) translate(-800,-450)"/>
  <ellipse cx="800" cy="450" rx="680" ry="400" fill="url(#glow)" opacity="0.9"/>

  <!-- Layer 2: Hero — isometric container stack + captain's wheel -->

  <!-- Isometric container block 3 (back-left, lowest) -->
  <!-- Front face -->
  <polygon points="580,580 700,580 700,650 580,650" fill="url(#boxFace)" opacity="0.6"/>
  <!-- Top face -->
  <polygon points="520,545 640,545 700,580 580,580" fill="url(#boxTop)" opacity="0.6"/>
  <!-- Right side face -->
  <polygon points="700,580 760,545 760,615 700,650" fill="url(#boxSide)" opacity="0.6"/>

  <!-- Isometric container block 2 (mid) -->
  <!-- Front face -->
  <polygon points="640,520 780,520 780,600 640,600" fill="url(#boxFace)" opacity="0.72"/>
  <!-- Top face -->
  <polygon points="570,480 710,480 780,520 640,520" fill="url(#boxTop)" opacity="0.72"/>
  <!-- Right side face -->
  <polygon points="780,520 850,480 850,560 780,600" fill="url(#boxSide)" opacity="0.72"/>

  <!-- Isometric container block 1 (front, hero base) -->
  <!-- Front face -->
  <polygon points="680,455 840,455 840,545 680,545" fill="url(#boxFace)" opacity="0.85"/>
  <!-- Top face -->
  <polygon points="600,412 760,412 840,455 680,455" fill="url(#boxTop)" opacity="0.85"/>
  <!-- Right side face -->
  <polygon points="840,455 920,412 920,502 840,545" fill="url(#boxSide)" opacity="0.85"/>

  <!-- Corner accents on front container (ribbing lines) -->
  <line x1="720" y1="455" x2="720" y2="545" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="760" y1="455" x2="760" y2="545" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="800" y1="455" x2="800" y2="545" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Captain's Wheel centered at (800, 280) — hero element -->
  <!-- Outer ring -->
  <circle cx="800" cy="280" r="195" fill="none" stroke="url(#rimGrad)" stroke-width="22" opacity="0.95"/>
  <!-- Inner ring -->
  <circle cx="800" cy="280" r="140" fill="none" stroke="#9a3309" stroke-width="10" opacity="0.7"/>
  <!-- Hub -->
  <circle cx="800" cy="280" r="42" fill="#c2410c" opacity="0.95"/>
  <circle cx="800" cy="280" r="26" fill="#d97706" opacity="0.9"/>
  <circle cx="800" cy="280" r="12" fill="#fbbf24" opacity="0.85"/>

  <!-- 8 spokes: angles 0, 45, 90, 135, 180, 225, 270, 315 degrees -->
  <!-- Each spoke: from hub edge (r=42) to inner ring (r=140) -->
  <!-- Spoke 0deg (right) -->
  <line x1="842" y1="280" x2="940" y2="280" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <!-- Spoke 45deg -->
  <line x1="830" y1="250" x2="899" y2="181" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <!-- Spoke 90deg (up) -->
  <line x1="800" y1="238" x2="800" y2="140" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <!-- Spoke 135deg -->
  <line x1="770" y1="250" x2="701" y2="181" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <!-- Spoke 180deg (left) -->
  <line x1="758" y1="280" x2="660" y2="280" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <!-- Spoke 225deg -->
  <line x1="770" y1="310" x2="701" y2="379" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <!-- Spoke 270deg (down) -->
  <line x1="800" y1="322" x2="800" y2="420" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <!-- Spoke 315deg -->
  <line x1="830" y1="310" x2="899" y2="379" stroke="#c2410c" stroke-width="14" stroke-linecap="round" opacity="0.92"/>

  <!-- Spoke handle knobs at outer ring (r=195): small circles at each spoke end -->
  <circle cx="995" cy="280" r="14" fill="#d97706" opacity="0.88"/>
  <circle cx="938" cy="143" r="14" fill="#d97706" opacity="0.88"/>
  <circle cx="800" cy="85" r="14" fill="#d97706" opacity="0.88"/>
  <circle cx="662" cy="143" r="14" fill="#d97706" opacity="0.88"/>
  <circle cx="605" cy="280" r="14" fill="#d97706" opacity="0.88"/>
  <circle cx="662" cy="417" r="14" fill="#d97706" opacity="0.88"/>
  <circle cx="800" cy="475" r="14" fill="#d97706" opacity="0.88"/>
  <circle cx="938" cy="417" r="14" fill="#d97706" opacity="0.88"/>

  <!-- Layer 3: Corner decoration (outside safe zone, atmospheric) -->
  <!-- Bottom-left corner arc sweep -->
  <path d="M 0 900 Q 200 700 400 820" stroke="#78350f" stroke-width="3" fill="none" stroke-opacity="0.3"/>
  <!-- Top-right faint arc -->
  <path d="M 1600 0 Q 1400 200 1550 400" stroke="#78350f" stroke-width="3" fill="none" stroke-opacity="0.3"/>
  <!-- Bottom edge warm wash -->
  <rect x="0" y="820" width="1600" height="80" fill="#78350f" opacity="0.15"/>
</svg>
