<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient: dark server-room nocturnal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="100%" stop-color="#2d1a0e"/>
    </linearGradient>
    <!-- Radial glow behind hero -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Server chassis face gradient -->
    <linearGradient id="chassisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Server chassis top gradient (isometric top face) -->
    <linearGradient id="chassisTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3309"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <!-- Server chassis side gradient (isometric right face) -->
    <linearGradient id="chassisSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Container block gradient -->
    <linearGradient id="containerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <!-- Container top face -->
    <linearGradient id="containerTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.7"/>
    </linearGradient>
    <!-- LED accent glow -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Teal branch line gradient -->
    <linearGradient id="branchLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle grid lines for server-room feel (decoration, low opacity) -->
  <g opacity="0.07" stroke="#c2410c" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Layer 2: Hero element — centered within safe zone (x:125–1475, y:90–810) -->

  <!-- Radial glow centered at hero -->
  <ellipse cx="800" cy="450" rx="520" ry="320" fill="url(#glow)" opacity="0.9"/>

  <!-- === ISOMETRIC SERVER STACK (hero, centered ~620–920 x, 220–700 y) === -->
  <!-- Three stacked chassis units, isometric style, offset slightly -->

  <!-- Chassis 3 (bottom, furthest back) -->
  <!-- Front face -->
  <rect x="570" y="560" width="320" height="80" rx="4" fill="url(#chassisGrad)" opacity="0.7"/>
  <!-- Top face (parallelogram approximated as polygon) -->
  <polygon points="570,560 890,560 930,530 610,530" fill="url(#chassisTop)" opacity="0.7"/>
  <!-- Right side face -->
  <polygon points="890,560 930,530 930,610 890,640" fill="url(#chassisSide)" opacity="0.7"/>
  <!-- LED strip -->
  <rect x="860" y="580" width="8" height="8" rx="2" fill="url(#ledGlow)" opacity="0.6"/>

  <!-- Chassis 2 (middle) -->
  <rect x="570" y="460" width="320" height="80" rx="4" fill="url(#chassisGrad)" opacity="0.82"/>
  <polygon points="570,460 890,460 930,430 610,430" fill="url(#chassisTop)" opacity="0.82"/>
  <polygon points="890,460 930,430 930,510 890,540" fill="url(#chassisSide)" opacity="0.82"/>
  <!-- Drive bays suggestion (faint rects inside face) -->
  <rect x="590" y="476" width="40" height="10" rx="2" fill="#9a3309" opacity="0.5"/>
  <rect x="638" y="476" width="40" height="10" rx="2" fill="#9a3309" opacity="0.5"/>
  <rect x="686" y="476" width="40" height="10" rx="2" fill="#9a3309" opacity="0.5"/>
  <!-- LED -->
  <rect x="860" y="478" width="8" height="8" rx="2" fill="url(#ledGlow)" opacity="0.85"/>

  <!-- Chassis 1 (top, hero unit — brightest) -->
  <rect x="570" y="360" width="320" height="80" rx="4" fill="url(#chassisGrad)" opacity="0.95"/>
  <polygon points="570,360 890,360 930,330 610,330" fill="url(#chassisTop)" opacity="0.95"/>
  <polygon points="890,360 930,330 930,410 890,440" fill="url(#chassisSide)" opacity="0.95"/>
  <!-- Drive bays -->
  <rect x="590" y="376" width="40" height="10" rx="2" fill="#9a3309" opacity="0.6"/>
  <rect x="638" y="376" width="40" height="10" rx="2" fill="#9a3309" opacity="0.6"/>
  <rect x="686" y="376" width="40" height="10" rx="2" fill="#9a3309" opacity="0.6"/>
  <!-- LED bright -->
  <rect x="858" y="376" width="10" height="10" rx="2" fill="#fbbf24" opacity="0.95"/>
  <!-- Small glow halo on LED -->
  <ellipse cx="863" cy="381" rx="12" ry="10" fill="#fbbf24" opacity="0.25"/>

  <!-- === BRANCH / FORK LINES from server to PR-preview containers === -->
  <!-- Main trunk line from right side of server stack -->
  <line x1="930" y1="420" x2="1020" y2="420" stroke="url(#branchLine)" stroke-width="4" opacity="0.8"/>
  <!-- Fork node -->
  <circle cx="1020" cy="420" r="8" fill="#c2410c" opacity="0.9"/>
  <!-- Branch up to container A -->
  <line x1="1020" y1="420" x2="1020" y2="300" stroke="url(#branchLine)" stroke-width="3" opacity="0.7"/>
  <line x1="1020" y1="300" x2="1080" y2="300" stroke="url(#branchLine)" stroke-width="3" opacity="0.7"/>
  <!-- Branch down to container B -->
  <line x1="1020" y1="420" x2="1020" y2="560" stroke="url(#branchLine)" stroke-width="3" opacity="0.7"/>
  <line x1="1020" y1="560" x2="1080" y2="560" stroke="url(#branchLine)" stroke-width="3" opacity="0.7"/>

  <!-- === PR PREVIEW CONTAINER A (upper, ~1080–1360 x, 240–360 y) === -->
  <!-- Front face -->
  <rect x="1080" y="250" width="240" height="100" rx="6" fill="url(#containerGrad)" opacity="0.9"/>
  <!-- Top face -->
  <polygon points="1080,250 1320,250 1355,220 1115,220" fill="url(#containerTop)" opacity="0.85"/>
  <!-- Right face -->
  <polygon points="1320,250 1355,220 1355,320 1320,350" fill="#0c4a5f" opacity="0.85"/>
  <!-- Docker whale silhouette suggestion: simple rounded rect accent -->
  <rect x="1100" y="270" width="70" height="40" rx="8" fill="#22d3ee" opacity="0.18"/>
  <rect x="1180" y="278" width="50" height="10" rx="3" fill="#0e7490" opacity="0.4"/>
  <rect x="1180" y="294" width="35" height="10" rx="3" fill="#0e7490" opacity="0.4"/>
  <!-- PR indicator dot -->
  <circle cx="1330" cy="265" r="9" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="1330" cy="265" rx="14" ry="12" fill="#fbbf24" opacity="0.2"/>

  <!-- === PR PREVIEW CONTAINER B (lower, ~1080–1360 x, 490–610 y) === -->
  <rect x="1080" y="510" width="240" height="100" rx="6" fill="url(#containerGrad)" opacity="0.75"/>
  <polygon points="1080,510 1320,510 1355,480 1115,480" fill="url(#containerTop)" opacity="0.7"/>
  <polygon points="1320,510 1355,480 1355,580 1320,610" fill="#0c4a5f" opacity="0.7"/>
  <rect x="1100" y="530" width="70" height="40" rx="8" fill="#22d3ee" opacity="0.13"/>
  <rect x="1180" y="538" width="50" height="10" rx="3" fill="#0e7490" opacity="0.35"/>
  <rect x="1180" y="554" width="35" height="10" rx="3" fill="#0e7490" opacity="0.35"/>
  <!-- PR indicator dot -->
  <circle cx="1330" cy="525" r="9" fill="#d97706" opacity="0.85"/>
  <ellipse cx="1330" cy="525" rx="14" ry="12" fill="#d97706" opacity="0.18"/>

  <!-- Layer 3: Edge decoration (outside safe zone, full-bleed atmospheric) -->
  <!-- Left vignette -->
  <rect x="0" y="0" width="160" height="900" fill="#1a0e0e" opacity="0.5"/>
  <!-- Right vignette -->
  <rect x="1440" y="0" width="160" height="900" fill="#1a0e0e" opacity="0.5"/>
  <!-- Top vignette -->
  <rect x="0" y="0" width="1600" height="100" fill="#1a0e0e" opacity="0.4"/>
  <!-- Bottom vignette -->
  <rect x="0" y="800" width="1600" height="100" fill="#1a0e0e" opacity="0.4"/>

  <!-- Faint rust accent line at bottom edge (decoration) -->
  <line x1="0" y1="890" x2="1600" y2="890" stroke="#c2410c" stroke-width="3" opacity="0.3"/>
  <!-- Faint teal accent line at top edge -->
  <line x1="0" y1="10" x2="1600" y2="10" stroke="#0e7490" stroke-width="3" opacity="0.3"/>
</svg>
