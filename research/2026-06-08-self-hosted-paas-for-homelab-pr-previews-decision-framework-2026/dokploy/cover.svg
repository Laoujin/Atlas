<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>
    <!-- Radial glow at join point -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e0e" stop-opacity="0"/>
    </radialGradient>
    <!-- Rust block gradient -->
    <linearGradient id="rustBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Teal block gradient -->
    <linearGradient id="tealBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <!-- Spark/join gradient -->
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <!-- Inner panel (rust side) -->
    <linearGradient id="innerRust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.06"/>
    </linearGradient>
    <!-- Inner panel (teal side) -->
    <linearGradient id="innerTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Layer 1b: Subtle full-bleed edge vignette -->
  <rect width="1600" height="900" fill="#000" opacity="0.22"/>

  <!-- Layer 2: Radial glow centered at hero join (800, 450) -->
  <ellipse cx="800" cy="450" rx="520" ry="340" fill="url(#glow)" opacity="0.85"/>

  <!-- === HERO ELEMENT: Plug/port connector blocks === -->
  <!-- Safe zone: x 125–1475, y 90–810. Hero bounding box: x 250–1350, y 200–700 -->

  <!-- LEFT BLOCK (rust) — body -->
  <rect x="248" y="220" width="430" height="460" rx="28" fill="url(#rustBlock)" opacity="0.93"/>
  <!-- Left block inner panel (faint lines suggesting circuit/port rows) -->
  <rect x="288" y="268" width="350" height="364" rx="12" fill="url(#innerRust)" opacity="0.9"/>
  <!-- Left block port rows (3 horizontal bars suggesting port slots) -->
  <rect x="316" y="310" width="294" height="34" rx="8" fill="#fbbf24" opacity="0.22"/>
  <rect x="316" y="378" width="294" height="34" rx="8" fill="#fbbf24" opacity="0.16"/>
  <rect x="316" y="446" width="294" height="34" rx="8" fill="#fbbf24" opacity="0.12"/>
  <rect x="316" y="514" width="294" height="34" rx="8" fill="#fbbf24" opacity="0.09"/>
  <!-- Left connector prong -->
  <rect x="678" y="388" width="76" height="56" rx="10" fill="#c2410c" opacity="0.95"/>
  <rect x="678" y="456" width="76" height="56" rx="10" fill="#9a3309" opacity="0.95"/>

  <!-- RIGHT BLOCK (teal) — body -->
  <rect x="922" y="220" width="430" height="460" rx="28" fill="url(#tealBlock)" opacity="0.93"/>
  <!-- Right block inner panel -->
  <rect x="962" y="268" width="350" height="364" rx="12" fill="url(#innerTeal)" opacity="0.9"/>
  <!-- Right block port rows -->
  <rect x="990" y="310" width="294" height="34" rx="8" fill="#67e8f9" opacity="0.18"/>
  <rect x="990" y="378" width="294" height="34" rx="8" fill="#67e8f9" opacity="0.13"/>
  <rect x="990" y="446" width="294" height="34" rx="8" fill="#67e8f9" opacity="0.10"/>
  <rect x="990" y="514" width="294" height="34" rx="8" fill="#67e8f9" opacity="0.07"/>
  <!-- Right connector socket (recessed rectangles) -->
  <rect x="846" y="388" width="76" height="56" rx="10" fill="#0e7490" opacity="0.95"/>
  <rect x="846" y="456" width="76" height="56" rx="10" fill="#164e63" opacity="0.95"/>

  <!-- CENTER SPARK / JOIN BRIDGE -->
  <!-- Bridge bar (upper prong plugged in) -->
  <rect x="752" y="396" width="96" height="40" rx="8" fill="url(#spark)" opacity="0.95"/>
  <!-- Bridge bar (lower prong plugged in) -->
  <rect x="752" y="464" width="96" height="40" rx="8" fill="url(#spark)" opacity="0.85"/>
  <!-- Bright center node -->
  <circle cx="800" cy="450" r="22" fill="#fbbf24" opacity="0.92"/>
  <circle cx="800" cy="450" r="12" fill="#fff" opacity="0.72"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Top-left arc -->
  <circle cx="0" cy="0" r="180" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.12"/>
  <!-- Bottom-right arc -->
  <circle cx="1600" cy="900" r="220" fill="none" stroke="#0e7490" stroke-width="2" opacity="0.10"/>
</svg>
