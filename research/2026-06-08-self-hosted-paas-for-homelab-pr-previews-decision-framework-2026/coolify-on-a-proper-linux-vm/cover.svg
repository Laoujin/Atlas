<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e0e"/>
      <stop offset="1" stop-color="#5c2a1a"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)" opacity="0.7"/>

  <!-- left block: rust, with port prongs reaching right -->
  <g opacity="0.92">
    <rect x="430" y="300" width="320" height="300" rx="22" fill="url(#rust)"/>
    <rect x="750" y="350" width="60" height="40" rx="6" fill="#d97706"/>
    <rect x="750" y="510" width="60" height="40" rx="6" fill="#d97706"/>
  </g>

  <!-- right block: teal, with matching sockets -->
  <g opacity="0.9">
    <rect x="850" y="300" width="320" height="300" rx="22" fill="url(#teal)"/>
    <rect x="810" y="350" width="44" height="40" rx="6" fill="#1a0e0e" opacity="0.6"/>
    <rect x="810" y="510" width="44" height="40" rx="6" fill="#1a0e0e" opacity="0.6"/>
  </g>

  <!-- spark trail at the join -->
  <circle cx="800" cy="450" r="46" fill="url(#glow)"/>
  <circle cx="800" cy="450" r="16" fill="#fbbf24" opacity="0.95"/>

  <!-- LED status dots on hero -->
  <circle cx="475" cy="345" r="11" fill="#fbbf24" opacity="0.85"/>
  <circle cx="1125" cy="345" r="11" fill="#0e7490" opacity="0.9"/>
</svg>
