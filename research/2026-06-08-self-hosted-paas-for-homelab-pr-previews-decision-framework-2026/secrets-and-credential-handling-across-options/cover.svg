<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3ec"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78350f"/>
      <stop offset="1" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- credential tokens behind the lock -->
  <rect x="560" y="470" width="300" height="190" rx="22" fill="#78350f" opacity="0.18" transform="rotate(-9 710 565)"/>
  <rect x="740" y="475" width="300" height="190" rx="22" fill="#78350f" opacity="0.22" transform="rotate(8 890 570)"/>

  <!-- shackle -->
  <path d="M695 470 v-70 a105 105 0 0 1 210 0 v70" fill="none" stroke="url(#shackle)" stroke-width="46" stroke-linecap="round"/>

  <!-- lock body -->
  <rect x="615" y="455" width="370" height="300" rx="46" fill="url(#body)"/>
  <rect x="615" y="455" width="370" height="300" rx="46" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.55"/>

  <!-- keyhole -->
  <circle cx="800" cy="575" r="42" fill="#1a0e0e" opacity="0.85"/>
  <path d="M783 600 h34 l14 78 h-62 z" fill="#1a0e0e" opacity="0.85"/>
  <circle cx="800" cy="575" r="42" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.4"/>
</svg>
