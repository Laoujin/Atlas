<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#2d1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Hub radial gradient -->
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#c2410c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Outer ring glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrowhead markers -->
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#b91c1c" opacity="0.92"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#15803d" opacity="0.92"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#d97706" opacity="0.92"/>
    </marker>
  </defs>

  <!-- Layer 1: Full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glow behind hero -->
  <ellipse cx="800" cy="450" rx="420" ry="380" fill="url(#glow)"/>

  <!-- Layer 2: Hero — red-green-refactor arc ring centered at (800,450) -->
  <!-- Ring radius ~220, stroke-width 28. Three arcs, each ~115deg with ~5deg gap -->

  <!-- RED arc: ~10deg to ~125deg (fail / write failing test) -->
  <path
    d="M 931,244 A 220,220 0 0,1 603,611"
    fill="none"
    stroke="#b91c1c"
    stroke-width="28"
    stroke-linecap="round"
    opacity="0.92"
    marker-end="url(#arr-red)"
  />

  <!-- GREEN arc: ~135deg to ~250deg (pass / make it green) -->
  <path
    d="M 578,636 A 220,220 0 0,1 620,241"
    fill="none"
    stroke="#15803d"
    stroke-width="28"
    stroke-linecap="round"
    opacity="0.92"
    marker-end="url(#arr-green)"
  />

  <!-- AMBER/RUST arc: ~260deg to ~370deg / ~10deg (refactor) -->
  <path
    d="M 656,228 A 220,220 0 0,1 956,238"
    fill="none"
    stroke="#d97706"
    stroke-width="28"
    stroke-linecap="round"
    opacity="0.88"
    marker-end="url(#arr-amber)"
  />

  <!-- Hub circle -->
  <circle cx="800" cy="450" r="108" fill="url(#hub)" opacity="0.95"/>

  <!-- Inner node-graph (3 nodes + 3 edges) representing AI agent -->
  <!-- Edges first so nodes sit on top -->
  <line x1="800" y1="390" x2="748" y2="492" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
  <line x1="800" y1="390" x2="852" y2="492" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
  <line x1="748" y1="492" x2="852" y2="492" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>

  <!-- Top node (agent hub) -->
  <circle cx="800" cy="390" r="18" fill="#fbbf24" opacity="0.95"/>
  <circle cx="800" cy="390" r="10" fill="#78350f" opacity="0.9"/>

  <!-- Bottom-left node -->
  <circle cx="748" cy="492" r="13" fill="#fbbf24" opacity="0.85"/>
  <circle cx="748" cy="492" r="7" fill="#9a3309" opacity="0.9"/>

  <!-- Bottom-right node -->
  <circle cx="852" cy="492" r="13" fill="#fbbf24" opacity="0.85"/>
  <circle cx="852" cy="492" r="7" fill="#9a3309" opacity="0.9"/>

  <!-- Layer 3: Corner decoration (outside safe zone, purely atmospheric) -->
  <!-- Faint radial corner accents -->
  <circle cx="0" cy="0" r="180" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.12"/>
  <circle cx="1600" cy="900" r="180" fill="none" stroke="#c2410c" stroke-width="1" opacity="0.12"/>
</svg>
