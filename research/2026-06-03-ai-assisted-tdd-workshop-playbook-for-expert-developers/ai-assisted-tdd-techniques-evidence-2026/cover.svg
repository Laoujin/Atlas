<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="60%" stop-color="#3b1208"/>
      <stop offset="100%" stop-color="#5c2a1a"/>
    </linearGradient>

    <!-- Hub radial gradient -->
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Hub outer glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <!-- Node gradient -->
    <radialGradient id="nodeA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="nodeB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="nodeC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Layer 1: full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle wide radial wash behind the hero -->
  <ellipse cx="800" cy="450" rx="620" ry="440" fill="url(#hubGlow)" opacity="0.55"/>

  <!-- Layer 2: TDD ring — three arcs, each 110° of a 260-radius circle
       SVG circle stroke starts at east (0°) and goes clockwise.
       Circumference = 2π×260 ≈ 1634.
       Each arc length: 110/360 × 1634 ≈ 500
       Dash pattern per circle: "500 1134"
       To start the first arc at north (-90°): dashoffset = (90/360)×1634 ≈ 408
       Arc 2 offset: 408 - 545 = -137  (545 = arc+gap = 500+45)
       Arc 3 offset: 408 - 1090 = -682
  -->

  <!-- Faint full ring underlay -->
  <circle cx="800" cy="450" r="260"
          fill="none" stroke="#9a3309" stroke-width="3" opacity="0.25"/>

  <!-- Arc 1: top (write test / red phase) — bright rust -->
  <circle cx="800" cy="450" r="260"
          fill="none"
          stroke="#c2410c"
          stroke-width="18"
          stroke-linecap="round"
          stroke-dasharray="500 1134"
          stroke-dashoffset="408"
          opacity="0.92"/>

  <!-- Arc 2: bottom-right (make it pass / amber phase) -->
  <circle cx="800" cy="450" r="260"
          fill="none"
          stroke="#d97706"
          stroke-width="18"
          stroke-linecap="round"
          stroke-dasharray="500 1134"
          stroke-dashoffset="-137"
          opacity="0.88"/>

  <!-- Arc 3: bottom-left (refactor / dark rust phase) -->
  <circle cx="800" cy="450" r="260"
          fill="none"
          stroke="#78350f"
          stroke-width="18"
          stroke-linecap="round"
          stroke-dasharray="500 1134"
          stroke-dashoffset="-682"
          opacity="0.80"/>

  <!-- Outer decorative ring — very faint, slightly larger radius -->
  <circle cx="800" cy="450" r="320"
          fill="none" stroke="#c2410c" stroke-width="1.5" opacity="0.12"/>

  <!-- Connector lines from hub to nodes
       Node positions (r=260 from 800,450):
         Node 1: midpoint arc1 = -35°  → (800+260·cos(-35°), 450+260·sin(-35°))
                 cos(-35°)≈0.819, sin(-35°)≈-0.574  → (1013, 301)
         Node 2: midpoint arc2 =  85°  → cos(85°)≈0.087, sin(85°)≈0.996 → (823, 709)
         Node 3: midpoint arc3 = 205°  → cos(205°)≈-0.906, sin(205°)≈-0.423 → (564, 340)
  -->
  <line x1="800" y1="450" x2="1013" y2="301"
        stroke="#d97706" stroke-width="2" opacity="0.45"/>
  <line x1="800" y1="450" x2="823"  y2="709"
        stroke="#d97706" stroke-width="2" opacity="0.45"/>
  <line x1="800" y1="450" x2="564"  y2="340"
        stroke="#d97706" stroke-width="2" opacity="0.45"/>

  <!-- Node 1 (top-right) -->
  <circle cx="1013" cy="301" r="22" fill="url(#nodeA)" opacity="0.90"/>
  <circle cx="1013" cy="301" r="32" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.40"/>

  <!-- Node 2 (bottom) -->
  <circle cx="823"  cy="709" r="22" fill="url(#nodeB)" opacity="0.85"/>
  <circle cx="823"  cy="709" r="32" fill="none" stroke="#d97706" stroke-width="2" opacity="0.38"/>

  <!-- Node 3 (left) -->
  <circle cx="564"  cy="340" r="22" fill="url(#nodeC)" opacity="0.88"/>
  <circle cx="564"  cy="340" r="32" fill="none" stroke="#78350f" stroke-width="2" opacity="0.35"/>

  <!-- Hub glow halo -->
  <circle cx="800" cy="450" r="110" fill="url(#hubGlow)" opacity="0.7"/>

  <!-- Hub core -->
  <circle cx="800" cy="450" r="72" fill="url(#hub)" opacity="0.95"/>

  <!-- Hub inner ring detail -->
  <circle cx="800" cy="450" r="52" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.50"/>
  <circle cx="800" cy="450" r="30" fill="#fbbf24" opacity="0.18"/>
</svg>
