<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="farMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5c2a1a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="midMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
    <linearGradient id="nearMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a0a"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant cold moon disc, low opacity -->
  <circle cx="1180" cy="220" r="55" fill="#faf8f2" opacity="0.18"/>

  <!-- far ridge -->
  <path d="M0 460 L160 380 L290 420 L430 330 L580 400 L740 310 L900 380 L1080 300 L1240 370 L1400 320 L1600 380 L1600 600 L0 600 Z" fill="url(#farMtn)" opacity="0.85"/>

  <!-- mid ridge -->
  <path d="M0 560 L180 470 L340 520 L500 430 L680 510 L860 440 L1040 500 L1220 420 L1400 490 L1600 450 L1600 720 L0 720 Z" fill="url(#midMtn)" opacity="0.92"/>

  <!-- river ribbon through the valley -->
  <path d="M0 760 L300 720 L620 700 L880 695 L1180 705 L1400 720 L1600 745 L1600 820 L1280 800 L960 790 L640 795 L320 810 L0 820 Z" fill="url(#river)"/>

  <!-- near ridge / valley floor -->
  <path d="M0 700 L220 640 L420 690 L600 620 L820 680 L1020 640 L1240 700 L1440 660 L1600 690 L1600 900 L0 900 Z" fill="url(#nearMtn)"/>

  <!-- the single glowing coworking window: hero, centred in safe zone -->
  <circle cx="800" cy="450" r="140" fill="url(#windowGlow)"/>
  <!-- tiny lit cabin silhouette -->
  <rect x="788" y="640" width="24" height="22" fill="#1a0e0e"/>
  <rect x="792" y="646" width="7" height="10" fill="#fbbf24" opacity="0.95"/>
  <rect x="802" y="646" width="6" height="10" fill="#fbbf24" opacity="0.7"/>
  <polygon points="785,640 800,628 815,640" fill="#1a0e0e"/>

  <!-- faint reflection on river beneath cabin -->
  <ellipse cx="800" cy="760" rx="60" ry="6" fill="#fbbf24" opacity="0.25"/>
</svg>
