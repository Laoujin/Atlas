<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e0e"/>
      <stop offset="55%" stop-color="#5c2a1a"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="estate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="1180" cy="240" r="180" fill="url(#moon)"/>
  <circle cx="1180" cy="240" r="55" fill="#fbbf24" opacity="0.9"/>

  <!-- Distant foothills -->
  <path d="M 0 620 Q 250 540 500 580 T 1000 560 T 1600 590 L 1600 900 L 0 900 Z" fill="#3a1a08" opacity="0.7"/>

  <!-- Main hill -->
  <path d="M 0 750 Q 400 480 850 430 Q 1200 410 1600 540 L 1600 900 L 0 900 Z" fill="url(#hill)"/>

  <!-- Vineyard rows (curving along hill) -->
  <g stroke="#c2410c" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 120 770 Q 500 600 950 570"/>
    <path d="M 140 810 Q 520 650 980 620"/>
    <path d="M 160 850 Q 540 700 1010 670"/>
  </g>
  <g fill="#c2410c" opacity="0.7">
    <circle cx="280" cy="725" r="3"/>
    <circle cx="380" cy="685" r="3"/>
    <circle cx="480" cy="655" r="3"/>
    <circle cx="580" cy="630" r="3"/>
    <circle cx="680" cy="610" r="3"/>
    <circle cx="780" cy="595" r="3"/>
    <circle cx="320" cy="770" r="3"/>
    <circle cx="440" cy="735" r="3"/>
    <circle cx="560" cy="705" r="3"/>
    <circle cx="680" cy="685" r="3"/>
    <circle cx="800" cy="670" r="3"/>
  </g>

  <!-- Winding path from village to estate -->
  <path d="M 360 870 Q 500 820 620 770 Q 740 720 820 640 Q 880 560 920 490" stroke="#fef3ec" stroke-width="6" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M 360 870 Q 500 820 620 770 Q 740 720 820 640 Q 880 560 920 490" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.7" stroke-dasharray="8 10" stroke-linecap="round"/>

  <!-- Village cluster (lower left) -->
  <g opacity="0.85">
    <rect x="290" y="820" width="50" height="55" fill="#78350f"/>
    <polygon points="285,820 315,795 345,820" fill="#5c2a1a"/>
    <rect x="345" y="835" width="40" height="40" fill="#9a3309"/>
    <polygon points="340,835 365,815 390,835" fill="#5c2a1a"/>
    <rect x="240" y="840" width="45" height="35" fill="#9a3309"/>
    <polygon points="235,840 262,820 290,840" fill="#5c2a1a"/>
    <rect x="305" y="845" width="2" height="6" fill="#fbbf24"/>
    <rect x="360" y="855" width="2" height="6" fill="#fbbf24"/>
  </g>

  <!-- Hilltop estate (hero, illuminated) -->
  <g>
    <!-- Glow behind estate -->
    <ellipse cx="900" cy="470" rx="220" ry="100" fill="url(#glow)"/>
    <!-- Main building -->
    <rect x="800" y="420" width="220" height="90" fill="url(#estate)"/>
    <polygon points="795,420 910,370 1025,420" fill="#9a3309"/>
    <!-- Side wing -->
    <rect x="1020" y="445" width="90" height="65" fill="#9a3309"/>
    <polygon points="1015,445 1065,415 1115,445" fill="#78350f"/>
    <!-- Left wing -->
    <rect x="730" y="450" width="75" height="60" fill="#9a3309"/>
    <polygon points="725,450 767,422 810,450" fill="#78350f"/>
    <!-- Lit windows -->
    <g fill="#fbbf24" opacity="0.95">
      <rect x="820" y="445" width="10" height="14"/>
      <rect x="845" y="445" width="10" height="14"/>
      <rect x="870" y="445" width="10" height="14"/>
      <rect x="895" y="445" width="10" height="14"/>
      <rect x="920" y="445" width="10" height="14"/>
      <rect x="945" y="445" width="10" height="14"/>
      <rect x="970" y="445" width="10" height="14"/>
      <rect x="995" y="445" width="10" height="14"/>
      <rect x="825" y="475" width="8" height="12"/>
      <rect x="850" y="475" width="8" height="12"/>
      <rect x="875" y="475" width="8" height="12"/>
      <rect x="925" y="475" width="8" height="12"/>
      <rect x="950" y="475" width="8" height="12"/>
      <rect x="975" y="475" width="8" height="12"/>
      <rect x="1035" y="465" width="8" height="11"/>
      <rect x="1055" y="465" width="8" height="11"/>
      <rect x="1080" y="465" width="8" height="11"/>
      <rect x="750" y="470" width="8" height="11"/>
      <rect x="770" y="470" width="8" height="11"/>
      <rect x="790" y="470" width="8" height="11"/>
    </g>
  </g>

  <!-- Cypress trees flanking estate -->
  <g fill="#1a0e0e" opacity="0.85">
    <ellipse cx="700" cy="475" rx="9" ry="40"/>
    <ellipse cx="1140" cy="480" rx="9" ry="38"/>
    <ellipse cx="680" cy="490" rx="7" ry="30"/>
  </g>

  <!-- Two small lakes (estate detail) -->
  <ellipse cx="540" cy="780" rx="55" ry="12" fill="#1a0e0e" opacity="0.7"/>
  <ellipse cx="540" cy="778" rx="40" ry="6" fill="#5c2a1a" opacity="0.6"/>
  <ellipse cx="1180" cy="740" rx="45" ry="10" fill="#1a0e0e" opacity="0.7"/>
  <ellipse cx="1180" cy="738" rx="32" ry="5" fill="#5c2a1a" opacity="0.6"/>
</svg>
