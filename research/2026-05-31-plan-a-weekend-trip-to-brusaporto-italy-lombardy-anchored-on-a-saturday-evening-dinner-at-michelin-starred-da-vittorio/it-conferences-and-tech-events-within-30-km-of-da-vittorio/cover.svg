<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5c2a1a"/>
      <stop offset="60%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#1a0e0e"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b1d7a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blockTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="blockSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="520" fill="url(#glow)"/>

  <!-- Concentric orbits -->
  <ellipse cx="800" cy="450" rx="420" ry="200" fill="none" stroke="#c2410c" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="800" cy="450" rx="320" ry="150" fill="none" stroke="#d97706" stroke-opacity="0.45" stroke-width="1.5"/>
  <ellipse cx="800" cy="450" rx="220" ry="105" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Connecting edges from hub to nodes -->
  <line x1="800" y1="450" x2="380" y2="450" stroke="#d97706" stroke-opacity="0.45" stroke-width="1.2"/>
  <line x1="800" y1="450" x2="1220" y2="450" stroke="#d97706" stroke-opacity="0.45" stroke-width="1.2"/>
  <line x1="800" y1="450" x2="540" y2="285" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="800" y1="450" x2="1060" y2="615" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="800" y1="450" x2="1080" y2="290" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.2"/>
  <line x1="800" y1="450" x2="520" y2="600" stroke="#6d28d9" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Isometric mechatronics block, lower-left of hub -->
  <g transform="translate(470,560)">
    <polygon points="0,40 90,0 180,40 90,80" fill="url(#blockTop)"/>
    <polygon points="0,40 0,120 90,160 90,80" fill="url(#blockSide)"/>
    <polygon points="90,80 90,160 180,120 180,40" fill="url(#block)"/>
  </g>

  <!-- Orbit nodes -->
  <circle cx="380" cy="450" r="14" fill="#fbbf24" opacity="0.9"/>
  <circle cx="1220" cy="450" r="14" fill="#fbbf24" opacity="0.9"/>
  <circle cx="540" cy="285" r="10" fill="#d97706" opacity="0.85"/>
  <circle cx="1060" cy="615" r="10" fill="#d97706" opacity="0.85"/>
  <circle cx="1080" cy="290" r="12" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="520" cy="600" r="12" fill="#8b5cf6" opacity="0.9"/>

  <!-- Central hub (Kilometro Rosso) -->
  <circle cx="800" cy="450" r="92" fill="#9a3309" opacity="0.45"/>
  <circle cx="800" cy="450" r="64" fill="url(#hub)"/>
  <circle cx="800" cy="450" r="22" fill="#fef3ec" opacity="0.85"/>
</svg>
