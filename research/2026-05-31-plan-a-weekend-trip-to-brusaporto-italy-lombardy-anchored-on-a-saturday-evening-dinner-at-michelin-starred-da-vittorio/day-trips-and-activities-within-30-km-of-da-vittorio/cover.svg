<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f0eadb"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#9a3309"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9a3309" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint compass orbits centered on hub (800,450) -->
  <g fill="none" stroke="#9a3309" stroke-opacity="0.18">
    <circle cx="800" cy="450" r="320" stroke-width="1.5"/>
    <circle cx="800" cy="450" r="220" stroke-width="1.5"/>
    <circle cx="800" cy="450" r="120" stroke-width="1.5"/>
  </g>

  <!-- four cardinal radial spokes -->
  <g stroke="#9a3309" stroke-opacity="0.22" stroke-width="1.2">
    <line x1="800" y1="130" x2="800" y2="770"/>
    <line x1="480" y1="450" x2="1120" y2="450"/>
  </g>

  <!-- NW: Bergamo Città Alta — walled ridge silhouette -->
  <g transform="translate(420,260)" opacity="0.92">
    <path d="M -130,40 L -110,10 L -70,15 L -40,-10 L 0,-5 L 30,-25 L 70,-15 L 110,5 L 140,0 L 140,55 L -130,55 Z" fill="url(#hill)"/>
    <!-- walls / battlements line on top -->
    <path d="M -110,10 L -100,10 L -100,2 L -90,2 L -90,10 L -75,10 L -70,15 M 0,-5 L 10,-5 L 10,-13 L 25,-13 L 25,-5 L 30,-25 M 70,-15 L 80,-15 L 80,-23 L 95,-23 L 95,-15 L 110,5" fill="none" stroke="#fef3ec" stroke-width="2" stroke-opacity="0.7"/>
    <!-- small tower -->
    <rect x="-12" y="-50" width="20" height="45" fill="#78350f"/>
    <polygon points="-14,-50 22,-50 4,-66" fill="#c2410c"/>
  </g>

  <!-- NE: Franciacorta — vineyard rows on a slope -->
  <g transform="translate(1180,265)" opacity="0.88">
    <path d="M -120,55 Q -40,-20 120,40 L 120,60 L -120,60 Z" fill="#9a3309" opacity="0.85"/>
    <g stroke="#fbbf24" stroke-width="2" stroke-opacity="0.55" fill="none">
      <path d="M -110,52 Q -35,-5 115,45"/>
      <path d="M -100,46 Q -30,-12 110,36"/>
      <path d="M -90,40  Q -25,-19 105,28"/>
      <path d="M -80,33  Q -20,-25 100,20"/>
      <path d="M -70,26  Q -15,-31  95,12"/>
    </g>
    <!-- a couple of grape-cluster dots -->
    <g fill="#c2410c">
      <circle cx="-60" cy="20" r="4"/>
      <circle cx="40" cy="5" r="4"/>
      <circle cx="80" cy="15" r="4"/>
    </g>
  </g>

  <!-- SW: Adda river — winding ribbon -->
  <g transform="translate(420,640)" opacity="0.88">
    <path d="M -140,-30 C -90,-50 -50,-10 -10,-25 C 30,-40 60,0 100,-15 C 130,-25 145,0 150,15" fill="none" stroke="url(#lake)" stroke-width="22" stroke-linecap="round"/>
    <path d="M -140,-30 C -90,-50 -50,-10 -10,-25 C 30,-40 60,0 100,-15 C 130,-25 145,0 150,15" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- SE: Lake Iseo with Monte Isola -->
  <g transform="translate(1180,640)" opacity="0.92">
    <ellipse cx="0" cy="0" rx="135" ry="62" fill="url(#lake)"/>
    <!-- island -->
    <ellipse cx="-10" cy="-4" rx="34" ry="16" fill="#78350f"/>
    <path d="M -32,-4 L -18,-22 L -2,-10 L 12,-26 L 26,-6 Z" fill="#c2410c"/>
    <!-- shoreline highlights -->
    <path d="M -120,-10 Q 0,-55 120,-12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M -110,18 Q 0,42 110,18" fill="none" stroke="#fef3ec" stroke-width="1.2" stroke-opacity="0.45"/>
  </g>

  <!-- central hub: Brusaporto / Da Vittorio anchor -->
  <g transform="translate(800,450)">
    <circle r="78" fill="url(#hub)"/>
    <circle r="78" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.7"/>
    <!-- compass star inside hub -->
    <polygon points="0,-46 8,-8 46,0 8,8 0,46 -8,8 -46,0 -8,-8" fill="#fef3ec" opacity="0.92"/>
    <circle r="9" fill="#9a3309"/>
  </g>
</svg>
