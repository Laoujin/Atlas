<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gBg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#ece4d4"/>
    </radialGradient>
    <linearGradient id="gSlateTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gRustTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gRustRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3309"/>
    </linearGradient>
    <radialGradient id="gLed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#gBg)"/>

  <!-- grounding shadow -->
  <ellipse cx="800" cy="712" rx="290" ry="44" fill="#334155" opacity="0.18"/>

  <!-- BOTTOM chassis (slate) -->
  <g stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round" opacity="0.88">
    <polygon points="550,510 800,380 1050,510 800,640" fill="url(#gSlateTop)"/>
    <polygon points="550,510 800,640 800,690 550,560" fill="#1e293b"/>
    <polygon points="1050,510 800,640 800,690 1050,560" fill="#334155"/>
  </g>

  <!-- MIDDLE chassis (slate) -->
  <g stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round" opacity="0.93">
    <polygon points="550,450 800,320 1050,450 800,580" fill="url(#gSlateTop)"/>
    <polygon points="550,450 800,580 800,630 550,500" fill="#1e293b"/>
    <polygon points="1050,450 800,580 800,630 1050,500" fill="#334155"/>
  </g>

  <!-- TOP chassis (rust hero) -->
  <g stroke="#5c2a1a" stroke-width="2.5" stroke-linejoin="round" opacity="0.95">
    <polygon points="550,390 800,260 1050,390 800,520" fill="url(#gRustTop)"/>
    <polygon points="550,390 800,520 800,570 550,440" fill="#78350f"/>
    <polygon points="1050,390 800,520 800,570 1050,440" fill="url(#gRustRight)"/>
  </g>

  <!-- rust LED accent on hero right face -->
  <circle cx="912" cy="486" r="26" fill="url(#gLed)"/>
  <circle cx="912" cy="486" r="8" fill="#fde68a"/>
</svg>
